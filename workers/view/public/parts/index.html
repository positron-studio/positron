<title>parts</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pa-say { margin: 0; color: var(--dim); font-size: 13.5px; max-width: 62ch; }
  .pa-text { display: flex; flex-direction: column; gap: 10px; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';

  // A shopping list, unlisted, that opens nothing. Prices and stock were read once, not live, and the
  // page says when. The Pico router's build sheet is at /archive/parts/ (plans/plan-pi-hdmi.md for these).
  const WHAT = 'Parts to buy for the Pi and the Pico, read from Oomipood.';
  const d = mount({ name: 'parts', what: WHAT, readout: null, showLog: false, controls: [] });
  guard(d);

  const say = (...texts) => {
    const box = el('div', 'pa-text');
    for (const t of texts) box.append(el('p', 'pa-say', t));
    return box;
  };
  const OOMI = 'https://www.oomipood.ee';
  // Read at Oomipood on 2026-10-16. A breadboard and jumper wires are already on the desk.
  const SOUND = [
    { part: 'Micro-HDMI plug to HDMI socket adapter, 20 cm', qty: '1', price: '€6.00', url: `${OOMI}/product/cvgp34790bk02_micro_hdmi_pistik_hdmi_pesa_uleminek_20cm_must_juhe` },
    { part: 'HDMI to VGA converter with a 3.5 mm audio out', qty: '1', price: '€9.50', url: `${OOMI}/product/hdmi_vga_adapter_muundur_audio_19201080_must` },
  ];
  const PICTURE = [
    { part: 'Micro-HDMI to HDMI 2.0 cable, 1 m', qty: '1', price: '€8.00', url: `${OOMI}/product/hs_518d08_1m_hdmi_micro_hdmi_2_0_kaabel_1m_premium_must_4k_60hz_18gbps` },
  ];
  const ENCODERS = [
    { part: 'Rotary encoder with push button', qty: '4', price: '€3.00', url: `${OOMI}/product/oky3431_enkooder_rotary_encoder` },
  ];
  const THEREMIN = [
    { part: 'VL53L1X laser distance sensor, the pitch hand', qty: '1', price: '€25.00', url: `${OOMI}/product/tof_laser_moodul_vl53l1x_35vdc_0044m_cjmcu531_i2c` },
    { part: 'VL53L0X laser distance sensor, the volume hand', qty: '1', price: '€12.00', url: `${OOMI}/product/tof_laser_moodul_vl53l0x_35vdc_00512m_vl53l0x_i2c` },
  ];
  // Pi header pins (physical, then GPIO); the screen and its keys use 1, 3, 5, 29, 31, 33 and 37.
  const ENC_PINS = [
    { enc: '1', a: '11 (GPIO17)', b: '13 (GPIO27)', push: '15 (GPIO22)' },
    { enc: '2', a: '16 (GPIO23)', b: '18 (GPIO24)', push: '22 (GPIO25)' },
    { enc: '3', a: '32 (GPIO12)', b: '36 (GPIO16)', push: '38 (GPIO20)' },
    { enc: '4', a: '12 (GPIO18)', b: '35 (GPIO19)', push: '40 (GPIO21)' },
  ];
  const cols = [
    { key: 'part', label: 'part', grow: true, link: 'url' },
    { key: 'qty', label: 'qty', width: 48 },
    { key: 'price', label: 'price', width: 72 },
  ];
  const sum = (ps) => ps.reduce((n, p) => n + parseFloat(p.price.slice(1)) * Number(p.qty), 0);
  const list = (rows) => { const t = createTable({ columns: cols }); t.set(rows); return t.el; };

  d.stack.titled('SOUND FROM THE PI\'S HDMI', list(SOUND),
    say(`€${sum(SOUND).toFixed(2)}. Pi micro-HDMI, then the adapter, then the converter; its 3.5 mm jack goes to a mixer, speakers or the Fast Track Pro, no screen needed.`,
      'Digital up to the converter, so cleaner than the Pi\'s own PWM socket. Whether this converter tells the Pi it takes sound with no screen behind it is not measured.'));
  d.stack.titled('PICTURE, OPTIONAL', list(PICTURE),
    say(`€${sum(PICTURE).toFixed(2)}. The Pi's other micro-HDMI straight to a screen. Plug screens in before the Pi powers on.`));
  const pins = createTable({ columns: [
    { key: 'enc', label: 'encoder', width: 72 }, { key: 'a', label: 'turn A', grow: true }, { key: 'b', label: 'turn B', width: 120 }, { key: 'push', label: 'push', width: 120 },
  ] });
  pins.set(ENC_PINS);
  d.stack.titled('ENCODERS ON THE PI', list(ENCODERS), pins.el,
    say(`€${sum(ENCODERS).toFixed(2)}. Each encoder's three signals straight to the Pi pins above; every + to 3.3 V and GND to ground through the breadboard's rails, fed from Pi pin 17 (3.3 V) and pin 20 (ground). Never 5 V.`,
      'Linux counts the turns itself (the rotary-encoder overlay), so a fast turn loses no step. Not tried on this Pi yet.'));
  d.stack.titled('THEREMIN, OPTIONAL', list(THEREMIN),
    say(`€${sum(THEREMIN).toFixed(2)}. Two hands, pitch and volume, on the screen's two I2C wires (pins 3 and 5); their address does not clash with the screen's.`,
      'Over the relay it answers in about 220 ms, so it sweeps and swells rather than plays in tune.'));

  const ALL = [...SOUND, ...PICTURE, ...ENCODERS, ...THEREMIN];
  d.assert('every part has a shop link', ALL.every((p) => p.url.startsWith(OOMI)));
  d.assert('every price was read', ALL.every((p) => /^€\d+\.\d\d$/.test(p.price)));
  d.assert('the description is one sentence', !/[;:]/.test(WHAT), WHAT);
  d.ready();
</script>
</html>

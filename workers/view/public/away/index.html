<script type="module">
  // demo/away/index.html: listen to the Circuit in another building. It joins the input
  // room `studio-1-circuit`; Listen holds a lease that runs the board's capture, and the
  // page joins the bay as a node only on a press, never on load.
  // See lessons/page-away.md#away-1
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { createWaveView } from '/shell/wave-view.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createMidi, offerLoopFor, checkEvolutionLoop } from '/shell/midi.mjs';
  import { createPresenceButton } from '/shell/presence.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createBayNode, roomFor, randomSite, STUDIO_ROOM } from '/shell/bay-node.mjs';
  import { createLease } from '/shell/openers.mjs';
  import { createLinkBadge, linkStateOf } from '/shell/link-badge.mjs';
  import { graphProblem, boardPort } from '/shell/graph-registry.mjs';
  import { RELAY_BASE } from '/shell/wire.mjs';

  const q = new URLSearchParams(location.search);
  const INPUT = q.get('input') || 'circuit';
  const ROOM = q.get('room') || `studio-1-${INPUT}`;
  const RATE = 48000;
  // How much sound the picture holds, left edge to right edge.
  const SECONDS = 4;
  // A sample at or past this is on the rail. 32767 / 32768.
  const CLIP = 32767 / 32768;
  // Well inside the board's 60 s lease; `createLease` defaults to `RENEW_MS`.
  // 10 ms frames on the direct path unless `?frame=20`, kept to compare the two.
  // See lessons/page-away.md#away-2
  const DIRECT_FRAME_MS = q.get('frame') === '20' ? 20 : 10;

  const d = mount({
    name: 'away',
    what: 'Play and listen to a Novation Circuit in another building, through a Raspberry Pi that captures its sound and draws it as it arrives.',
    readout: { level: 'dBFS', clipped: '', buffer: 'ms', lag: 'ms', via: '', 'round trip': 'ms' },
    // Listen and online are one button: the kit's presence button with the badge
    // `createBoard` drives. Built below once the board exists, in the control row.
    // See lessons/page-away.md#away-3
    controls: [],
  });
  guard(d);

  const board = createBoard({
    room: ROOM,
    // No `relay:` from the query here: `wire.mjs` reads `?relay=` itself and honours only
    // a ws:// address on this machine.
    // See lessons/page-away.md#away-4
    of: 'Raspberry Pi',
    showName: false,
    // 80 ms start cushion: at a 10 ms arecord period frame gaps read p50 19.9, p90 23.2 ms.
    // The playout raises its own floor up to `maxCushionMs` when it runs dry.
    // See lessons/page-away.md#away-5
    cushionMs: 80,
    maxCushionMs: 250,
    direct: true,
    directCushionMs: Number(q.get('cushion')) || 40,
    log: (line, kind) => d.log(line, kind),
    onOpen: () => { d.log(`joined ${ROOM}`, 'hi'); askStatus(); },
    onPcm: (f32) => take(f32),
    onMessage: (m) => {
      if (m.type === 'board.alive' && 'audio' in m) showSource(m.audio);
    },
  });

  const listenBtn = createPresenceButton({
    badge: board.presence,
    aria: 'start or stop listening to the Circuit',
    press: () => pressListen(),
  });
  // `data-busy` by hand, because this is not a declared control: verify.mjs
  // waits on that mark before it reads the page, the same as on /cam/.
  async function pressListen() {
    const b = listenBtn.el;
    b.dataset.busy = '1';
    try { await d.run('listen'); } finally { delete b.dataset.busy; }
  }
  listenBtn.el.title = 'press to listen';

  // ── the picture ───────────────────────────────────────────────────────────
  const host = el('div', 'away-pic');
  const wave = createWaveView(host, { height: 160, label: `the last ${SECONDS} seconds from the board` });
  /* The link's word on the picture: starting, receiving or stalled, from frames that
     reached this page. The presence badge says whether the board is there; this says
     whether its sound arrives. Hidden while Listen is off.
     See lessons/page-away.md#away-6 */
  const tag = el('div', 'pos-vp-tag away-tag');
  tag.hidden = true;
  const linkBadge = createLinkBadge({ count: () => frames,
    onChange: (st) => { tag.hidden = st === 'unknown'; } });
  tag.append(linkBadge.el);
  host.append(tag);

  // A part is a channel: Synth 1 on 1, Synth 2 on 2, drums on 10 (plan-circuit-model12.md
  // §3.1), so on a drum part every key plays that drum and only chooses velocity. The
  // board's `midiVerdict` decides what reaches the instrument, not this page.
  // See lessons/page-away.md#away-7
  const PARTS = {
    s1: { ch: 1 }, s2: { ch: 2 },
    d1: { ch: 10, note: 60 }, d2: { ch: 10, note: 62 },
  };
  let part = PARTS.s1;
  const VEL = 100;
  // What each key actually sent, so a key released after the part changed
  // ends the note it started rather than one on the new part.
  const sounding = new Map();
  let notesSent = 0;
  function noteOn(key, vel) {
    const out = { ch: part.ch, note: part.note ?? key };
    noteOff(key);
    sounding.set(key, out);
    if (board.send({ type: 'midi.send', bytes: [0x90 | (out.ch - 1), out.note, Math.max(1, Math.min(127, vel))] })) {
      notesSent++;
      if (!pending) pending = { t0: performance.now(), base: recentRms(200) };
    }
  }
  function noteOff(key) {
    const out = sounding.get(key);
    if (!out) return;
    sounding.delete(key);
    board.send({ type: 'midi.send', bytes: [0x80 | (out.ch - 1), out.note, 0] });
  }
  function panic() {
    for (const k of [...sounding.keys()]) noteOff(k);
    board.send({ type: 'midi.panic' });
  }

  const partPick = createChoice({
    label: 'part',
    options: [['Synth 1', 's1'], ['Synth 2', 's2'], ['Drums 1', 'd1'], ['Drums 2', 'd2']],
    at: 0,
    onPick: (v, name) => { part = PARTS[v]; d.log(`playing ${name}`); showPatch(); },
  });

  // Program change on channel 1 or 2 only selects a synth patch into RAM; on 16 it would
  // select a session, which `midiVerdict` refuses. Drum parts have no patch here. It opens
  // empty: the board reports no instrument state, so it shows what this page last sent.
  // See lessons/page-away.md#away-8
  const PATCHES = Array.from({ length: 64 }, (_, i) => `Patch ${i + 1}`);
  const chosen = { 1: null, 2: null };
  let lastPatchBytes = null;
  const synthCh = () => (part.note == null ? part.ch : null);
  function sendPatch(i) {
    const ch = synthCh();
    if (ch == null) return;
    chosen[ch] = i;
    lastPatchBytes = [0xC0 | (ch - 1), i];
    showPatch();
    if (board.send({ type: 'midi.send', bytes: lastPatchBytes })) d.log(`Synth ${ch} on ${PATCHES[i]}`);
  }
  function stepPatch(by) {
    const ch = synthCh();
    if (ch == null) return;
    const at = chosen[ch];
    sendPatch(at == null ? (by > 0 ? 0 : PATCHES.length - 1) : (at + by + PATCHES.length) % PATCHES.length);
  }
  const patchPick = createPicker({
    what: 'patch',
    prev: () => stepPatch(-1),
    next: () => stepPatch(+1),
    onPick: (i) => sendPatch(i),
  });
  patchPick.options(PATCHES, 0);
  function showPatch() {
    const ch = synthCh();
    patchPick.disabled(ch == null);
    const at = ch == null ? null : chosen[ch];
    patchPick.show(at == null ? '' : PATCHES[at], at ?? undefined);
  }
  showPatch();
  const midiBtn = el('button', '', 'enable midi', { type: 'button' });

  const kb = createKeyboard(el('div'), {
    ...keyRange(),
    base: 48,
    full: true,
    /* `Loop` while the Evolution is plugged in: a looped note comes back through `onDown`
       marked `loop` and reaches the Circuit by the same route as a finger.
       See lessons/page-away.md#away-9 */
    loop: 'evolution',
    log: (line, kind) => d.log(line, kind),
    onDown: (note, how, vel) => { kb.lightNote(note, true); joinBay(); noteOn(note, vel ?? VEL); },
    onUp: (note) => { kb.lightNote(note, false); noteOff(note); },
    onPanic: () => panic(),
  });

  // The kit's panel owns order, seams and insets: picture, part row, keys, and a plate
  // with ONLINE beside the name and the patch at the far end.
  // See lessons/page-away.md#away-10
  const panel = createInstrumentPanel({
    viz: host,
    rows: [[[partPick.el, midiBtn], { align: 'between' }]],
    keys: kb.el,
    plate: { name: 'Circuit', status: listenBtn.el, patch: patchPick },
  });
  d.stack.add(panel.el);

  // MIDI in from a keyboard on this machine: asked for on a press, or opened by itself only
  // when the browser already said yes, since `requestMIDIAccess` prompts. Every note goes
  // to the chosen part, whatever channel the keyboard sends on.
  // See lessons/page-away.md#away-11
  let midi = null;
  function openMidi() {
    if (midi) return midi;
    midi = createMidi({
      onDown: (note, vel) => { kb.lightNote(note, true); joinBay(); noteOn(note, vel); },
      onUp: (note) => { kb.lightNote(note, false); noteOff(note); },
      log: (line, kind) => d.log(line, kind),
      onPorts: (n) => d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} playing the Circuit`
                               : 'no MIDI keyboard is plugged in yet, so nothing will arrive'),
      loop: kb,
    });
    midiBtn.remove();
    return midi;
  }
  midiBtn.addEventListener('click', () => openMidi());
  (async () => {
    try {
      const st = await navigator.permissions?.query({ name: 'midi' });
      if (st?.state === 'granted') openMidi();
    } catch { /* no Web MIDI here, so the button stays and says so when pressed */ }
  })();
  addEventListener('pagehide', () => panic());

  // Lag is measured on the sound: the first frame at least twice as loud as the last 200 ms
  // marks the note's arrival, plus the playout cushion. Over a loud loop it can miss; no
  // onset in `ONSET_WAIT_MS` leaves the cell alone and says why in the log.
  // See lessons/page-away.md#away-12
  const ONSET_WAIT_MS = 1500;
  const ONSET_FLOOR = 0.01;
  const isOnset = (frameRms, baseRms) => frameRms > Math.max(ONSET_FLOOR, baseRms * 2);
  let pending = null, lags = [];
  function recentRms(ms) {
    const n = Math.min(ring.length, Math.round(RATE * ms / 1000));
    let ss = 0;
    for (let i = 1; i <= n; i++) { const v = ring[(head - i + ring.length) % ring.length]; ss += v * v; }
    return Math.sqrt(ss / n);
  }
  function watchOnset(f32) {
    if (!pending) return;
    const now = performance.now();
    if (now - pending.t0 > ONSET_WAIT_MS) {
      pending = null;
      d.log(`no onset heard within ${ONSET_WAIT_MS} ms of that note, so no lag was measured. Is ONLINE pressed, and is the part audible over the pattern?`, 'dim');
      return;
    }
    let ss = 0;
    for (let i = 0; i < f32.length; i++) ss += f32[i] * f32[i];
    if (!isOnset(Math.sqrt(ss / f32.length), pending.base)) return;
    const lag = Math.round(now - pending.t0 + (board.ctx() ? board.stats().bufferedMs : 0));
    pending = null;
    lags.push(lag);
    d.set('lag', lag);
  }

  // ── the ring the picture reads ────────────────────────────────────────────
  const ring = new Float32Array(SECONDS * RATE);
  const ordered = new Float32Array(ring.length);
  let head = 0, dirty = false;
  let clipped = 0, frames = 0, sumSq = 0, sumN = 0, sets = 0, lastSet = null;

  function take(f32) {
    frames++;
    watchOnset(f32);
    for (let i = 0; i < f32.length; i++) {
      const v = f32[i];
      ring[head] = v;
      head = (head + 1) % ring.length;
      if (v >= CLIP || v <= -1) clipped++;
      sumSq += v * v;
    }
    sumN += f32.length;
    dirty = true;
    // Five times a second: a readout cell is a fixed box, and nobody reads a
    // number that changes fifty times a second.
    if (frames % 10 === 0) {
      const rms = Math.sqrt(sumSq / Math.max(1, sumN));
      sumSq = 0; sumN = 0;
      d.set('level', rms > 0 ? (20 * Math.log10(rms)).toFixed(1) : '', rms > 0.001 ? 'ok' : 'warn');
      d.set('clipped', clipped, clipped ? 'warn' : 'ok');
      d.set('buffer', board.ctx() ? Math.round(board.stats().bufferedMs) : '');
      showPath();
    }
  }

  // The whole ring, oldest first, so new sound always enters at the right and
  // the axis is the same four seconds from the first frame on.
  function redraw() {
    requestAnimationFrame(redraw);
    if (!dirty) return;
    dirty = false;
    ordered.set(ring.subarray(head), 0);
    ordered.set(ring.subarray(0, head), ring.length - head);
    lastSet = wave.set(ordered, RATE, { name: INPUT });
    sets++;
  }
  requestAnimationFrame(redraw);

  // What the board is capturing goes in the log when it changes, not in a cell.
  // See lessons/page-away.md#away-13
  function showPath() {
    const st = board.stats();
    d.set('via', listening ? st.via : '', st.via === 'relay' ? 'warn' : 'ok');
    d.set('round trip', listening && st.rttMs != null ? Math.round(st.rttMs) : '');
  }

  let saidSource;
  function showSource(s) {
    if (s === saidSource) return;
    saidSource = s;
    d.log(s ? `the board is capturing ${s}` : 'the board is capturing nothing. Press ONLINE to listen', s ? 'hi' : 'dim');
  }

  async function askStatus() {
    const r = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (!r) {
      d.log(`no board answered in ${ROOM} within six seconds. Its ${INPUT} input may not be configured`, 'warn');
      return null;
    }
    showSource(r.ok ? r.source : null);
    return r;
  }

  // Mute disconnects the speakers rather than suspending the context (board.mjs reads that
  // as a blocked browser), and stops renewing rather than sending `input.stop`, since
  // others may listen. The lease is `createLease` from `openers.mjs`.
  // See lessons/page-away.md#away-14
  let listening = false, lease = null;
  const wantAsk = async (m, type, ms) => {
    const r = await board.ask(m, type, ms);
    if (r) showSource(r.ok ? r.source : null);
    return r;
  };
  d.on('listen', async () => {
    joinBay();
    const ctx = await board.startAudio();
    const out = board.playout();
    if (!listening) {
      listening = true;
      if (out) { try { out.connect(ctx.destination); } catch { /* already connected */ } }
      listenBtn.el.dataset.on = '1';
      listenBtn.el.title = 'listening. Press to mute';
      linkBadge.start();
      // The relay starts the sound at once; the direct path, if it opens, takes
      // over the frames and the sends without a gap in either.
      board.goDirect({ frameMs: DIRECT_FRAME_MS }).then(showPath);
      board.watchRtt(2000);
      lease = createLease({ ask: wantAsk, what: `the ${INPUT} capture`, log: (line, kind) => d.log(line, kind) });
    } else {
      listening = false;
      lease?.stop(); lease = null;
      linkBadge.stop();
      board.watchRtt(0);
      showPath();
      if (out) { try { out.disconnect(ctx.destination); } catch { /* already off */ } }
      delete listenBtn.el.dataset.on;
      listenBtn.el.title = 'press to listen';
      d.log('muted. The board stops capturing a minute after the last listener');
    }
  });

  // The discovery room is the board's main room: `?room=` minus its `-<input>`, where the
  // Pi and `/patchbay/` meet. Under a harness with no `?room=` it is `roomFor`'s room.
  // See lessons/page-away.md#away-15
  const askedRoom = q.get('room');
  const BAY_ROOM = askedRoom
    ? roomFor({ slug: 'away', search: `?room=${askedRoom.endsWith(`-${INPUT}`) ? askedRoom.slice(0, -INPUT.length - 1) : askedRoom}` })
    : roomFor({ slug: 'away' });
  /**
   * The port the Pi announces for the Circuit's MIDI in (`boardGraph`), site `pi-1`,
   * room `studio-1`.
   * See lessons/page-away.md#away-16
   */
  const INSTRUMENT_IN = boardPort(INPUT, 'midi-in');
  const SITE = randomSite('away');
  const KEYS_OUT = `${SITE}:keys:out`;
  const GRAPH = {
    v: 1, site: SITE, place: 'browser',
    nodes: [
      { id: `${SITE}:keys`, kind: 'person', label: 'away keys', place: 'browser' },
      { id: `${SITE}:screen`, kind: 'screen', label: 'away picture', place: 'browser' },
    ],
    ports: [
      { id: KEYS_OUT, label: 'away keys', dir: 'out', medium: 'midi', emits: ['note', 'program'] },
      { id: `${SITE}:screen:audio`, label: 'away picture', dir: 'in', medium: 'audio' },
    ],
  };
  /* The answer when `/patchbay/` asks for a link: the keys to the Circuit is the one link,
     already open. Any other destination, and a close, is refused in words.
     See lessons/page-away.md#away-17 */
  function answerLink({ source, target, open }) {
    if (source !== KEYS_OUT) return { ok: false, why: `${source} is not one of this page’s ports` };
    if (!open) return { ok: false, why: `this page’s keys always play the ${INPUT}, so close the page to stop them` };
    if (target !== INSTRUMENT_IN) return { ok: false, why: `this page’s keys play the ${INPUT} at ${INSTRUMENT_IN} and nothing else, not ${target}` };
    return { ok: true, why: `already open: every key here goes to the ${INPUT} through the board’s gate` };
  }
  const bay = createBayNode({
    room: BAY_ROOM, graphs: [GRAPH],
    log: (line, kind) => d.log(line, kind),
    onJoin: () => d.log(`on the patchbay in ${BAY_ROOM}, as ${SITE}`, 'hi'),
    onLinkRequest: answerLink,
  });
  /** Join on a press. Calling it twice joins once. */
  function joinBay() { return bay.join(); }

  d.ready();

  // ── checks, for a harness only ───────────────────────────────────────────
  /* What the bay node had done by the end of the module, which is the whole of
     a visit. Read here and asserted in the checks, so a join on load is a red
     row rather than a claim about a file. */
  const bayOnLoad = { joined: bay.joined(), joining: bay.joining(), ticking: bay.stats().ticking };

  ifSelfcheck(async () => {
    // A harness may not start the capture: the board is shared hardware in
    // another building, and board.mjs refuses every send under selfcheck.
    d.assert('a harness run cannot start the capture', board.driving() === false);
    const path = await board.goDirect();
    d.assert('a harness run opens no direct path to the board, because an offer is a send',
      path === 'refused' && board.stats().via === 'relay', `${path}, via ${board.stats().via}`);
    d.assert('the page listens in the input room, not the instrument room', ROOM.endsWith(`-${INPUT}`), ROOM);
    // A drum part turns every key into its one drum, and the key that started
    // a note is the key that ends it even after the part changes. Driven
    // through the real functions with the board refusing, so nothing is sent.
    const was = part;
    part = PARTS.d2; noteOn(70, 90);
    const drum = sounding.get(70);
    part = PARTS.s1; noteOff(70);
    part = was;
    d.assert('Drums 2 plays note 62 on channel 10 from any key', drum?.ch === 10 && drum?.note === 62, JSON.stringify(drum));
    d.assert('a key released after the part changed ends its own note', !sounding.has(70));
    // The onset rule, on made-up levels: a note out of quiet counts, the same
    // level as before does not, and a whisper under the floor does not.
    d.assert('lag starts at a sound twice as loud as the moment before it',
      isOnset(0.2, 0.05) && !isOnset(0.2, 0.2) && !isOnset(0.008, 0.001));
    // The patch is a program change on the synth's own channel, and a drum
    // part has none. Driven through the real functions; the board refuses.
    const wasPart = part, refusedBefore = board.refusedToBoard();
    part = PARTS.s2; showPatch(); sendPatch(4);
    d.assert('Patch 5 on Synth 2 is program change 4 on channel 2', JSON.stringify(lastPatchBytes) === '[193,4]', JSON.stringify(lastPatchBytes));
    d.assert('and it went to the board, which refused it under a harness', board.refusedToBoard() === refusedBefore + 1, `${board.refusedToBoard() - refusedBefore} refused`);
    part = PARTS.s1; showPatch();
    d.assert('each synth keeps its own patch, and Synth 1 was never sent one', chosen[1] == null && chosen[2] === 4 && patchPick.select.disabled === false);
    part = PARTS.d1; showPatch();
    d.assert('a drum part has no patch picker, because drums change by CC', patchPick.buttons.every((b) => b.disabled) && patchPick.select.disabled);
    part = wasPart; chosen[2] = null; showPatch();
    d.assert('the patch picker sits on the plate with no label', !!patchPick.el.closest('.pos-ipanel-plate') && !patchPick.el.querySelector('.pos-pick-l'));
    d.assert('the four parts are Synth 1, Synth 2, Drums 1 and Drums 2',
      JSON.stringify(Object.values(PARTS).map((p) => [p.ch, p.note ?? null])) === '[[1,null],[2,null],[10,60],[10,62]]');
    /* A loop reaches `board.send`, counted by the board module; a harness run is refused
       there, so this counts notes on their way to the Circuit with nothing heard.
       See lessons/page-away.md#away-18 */
    await checkEvolutionLoop(d, {
      keys: kb, heard: () => board.refusedToBoard(),
      ports: (names) => offerLoopFor(kb, names, d.log), real: () => midi?.names() ?? [],
    });
    const t0 = performance.now();
    while (!frames && performance.now() - t0 < 6000) await new Promise((r) => setTimeout(r, 200));
    if (!frames) {
      // Nobody is holding the lease, which is the normal state. Said, not failed.
      d.log(`no frames in ${ROOM}: nobody is listening, so the board is not capturing`, 'dim');
      return;
    }
    await new Promise((r) => setTimeout(r, 600));
    d.assert('frames from the board reach the standard waveform', sets > 0 && lastSet?.ok === true, `${frames} frames, ${sets} draws`);
    d.assert('each frame is the 20 ms the board publishes',
      board.stats().shapeWrong === 0, board.stats().shapeSaid || '');
    d.assert('the picture has sound in it, not a flat line', (lastSet?.lit ?? 0) > 0, `${lastSet?.lit} lit columns`);
    await badgeChecks();
    await bayChecks();
  }, { log: d.log });

  /* The badge reads the far side: with frames arriving it must say receiving, and a
     negative control on a count that never grows must not. Nothing is sent, no lease.
     See lessons/page-away.md#away-19 */
  async function badgeChecks() {
    d.assert('the link badge sits on the picture and is hidden while Listen is off',
      host.contains(tag) && tag.hidden && linkBadge.state() === 'unknown', `${linkBadge.state()}, hidden ${tag.hidden}`);
    linkBadge.start();
    const frozen = createLinkBadge({ count: () => 7 }).start();
    await new Promise((r) => setTimeout(r, 700));
    const said = linkBadge.poll(), frozenSaid = frozen.poll();
    frozen.stop();
    d.assert('frames arriving make the picture say receiving, and it shows', said === 'online' && !tag.hidden,
      `${linkBadge.says()} after ${frames} frames, tag ${tag.hidden ? 'hidden' : 'shown'}`);
    d.assert('NEGATIVE CONTROL: a count that never grows does not say receiving', frozenSaid !== 'online', frozenSaid);
    d.assert('two seconds with nothing new is stalled, by the stage’s own rule',
      linkStateOf({ now: 5000, lastCountAt: 2500, startedAt: 0 }) === 'offline'
      && linkStateOf({ now: 5000, lastCountAt: 4000, startedAt: 0 }) === 'online');
    linkBadge.stop();
    d.assert('and it hides again when the link closes', tag.hidden, linkBadge.state());
  }

  /* The page as a node in the run's own room: a stand-in patchbay asks for its link, another
     destination and a close, and gets a yes and two refusals; a foreign port gets no answer.
     Only against a relay on this machine, never the production relay.
     See lessons/page-away.md#away-20 */
  async function bayChecks() {
    d.assert('a visit joins nothing on the patchbay: no socket, no join and no announce clock',
      !bayOnLoad.joined && !bayOnLoad.joining && !bayOnLoad.ticking, JSON.stringify(bayOnLoad));
    d.assert('the harness room is the run’s own, never the studio’s', BAY_ROOM !== STUDIO_ROOM && !BAY_ROOM.startsWith(`${STUDIO_ROOM}-`), BAY_ROOM);
    d.assert('the page announces a graph the registry accepts, on a site of this tab’s own',
      graphProblem(GRAPH) === '' && SITE.startsWith('away-') && SITE !== 'web', graphProblem(GRAPH) || SITE);
    if (!/^wss?:\/\/(127\.0\.0\.1|localhost|\[::1\])/.test(RELAY_BASE)) {
      d.log(`the patchbay round trip runs only against a relay on this machine, and this run is on ${RELAY_BASE}`, 'dim');
      return;
    }
    await joinBay();
    const other = createBayNode({ room: BAY_ROOM, graphs: [] });
    await other.join();
    await other.ask();
    const t0 = performance.now();
    while (!other.registry.merged().sites.some((x) => x.site === SITE) && performance.now() - t0 < 3000) await new Promise((r) => setTimeout(r, 50));
    const heard = other.registry.merged().ports.map((p) => p.id);
    d.assert('a page in the same room hears this page’s keys and picture', heard.includes(KEYS_OUT) && heard.includes(`${SITE}:screen:audio`), heard.join(', '));
    const yes = await other.request(KEYS_OUT, INSTRUMENT_IN, true, { timeoutMs: 3000 });
    d.assert('asked for its keys to the Circuit, it answers open', yes?.open === true, yes ? `open ${yes.open}: ${yes.why}` : 'no answer');
    const elsewhere = await other.request(KEYS_OUT, boardPort('sampler', 'midi-in'), true, { timeoutMs: 3000 });
    d.assert('asked for its keys anywhere else, it refuses and names where they go', elsewhere?.open === false && elsewhere.why.includes(INSTRUMENT_IN),
      elsewhere ? elsewhere.why : 'no answer');
    const close = await other.request(KEYS_OUT, INSTRUMENT_IN, false, { timeoutMs: 3000 });
    d.assert('asked to close it, it refuses in words', close?.open === false && /always play/.test(close.why), close ? close.why : 'no answer');
    const notMine = await other.request(boardPort(INPUT, 'audio-out'), `${SITE}:screen:audio`, true, { timeoutMs: 800 });
    d.assert('NEGATIVE CONTROL: a request about a port that is not this page’s gets no answer from it', notMine === null, JSON.stringify(notMine));
    other.leave();
  }
</script>

<!doctype html>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { font, whenFaces } from '/shell/canvas-font.mjs';
  import { createDeck } from '/timeline/transport.mjs';

  /**
   * The score of Held in Human, read by demo/resources/build-held-in-human.mjs. Every
   * duration says whether it is stated, measured or absent; this page decides nothing
   * the file leaves open. It is local, so reading it on a visit costs nobody anything.
   * See lessons/page-held.md#held-1
   */
  const SRC = '/resources/held-in-human.json';

  /** Every reach this page makes, counted, so the claim that it opens nothing
   *  outside this site is a number rather than a reading of the source. */
  let offSite = 0;
  const fetched = [];
  async function read(url) {
    const u = new URL(url, location.href);
    fetched.push(u.pathname);
    if (u.origin !== location.origin) offSite += 1;
    const r = await fetch(u);
    if (!r.ok) throw new Error(`${u.pathname} answered ${r.status}`);
    return r.json();
  }

  const d = mount({
    name: 'held',
    /* One sentence, the index card's own line.
       See lessons/page-held.md#held-2 */
    // See lessons/page-held.md#held-3
    what: 'Held in Human, played back from its own score.',
    /**
     * `null` rather than omitted, so the harness reads the opt out as deliberate. What
     * a readout would say (scene, room, table, voice) is already drawn at the playhead.
     * See lessons/page-held.md#held-4
     */
    readout: null,
    /* No controls: the line seeks on press and drag, and the transport bar carries play.
       See lessons/page-held.md#held-5 */
    controls: [],
  });
  guard(d);

  /* The maze has no length in the score, so every item carries `at: { fromIntroMs,
     fromMazeEndMs }` with one filled in. The axis is the running order without the
     maze (12:55.2); the maze is a break whose width is in pixels, never milliseconds.
     See lessons/page-held.md#held-6 */
  let MAZE_AT = 0;          // where the intro ends and the break stands
  let KNOWN = 0;            // the whole axis: the running order, maze excluded

  /** A seam is furniture, not a duration. This is the only number that decides
   *  how wide it is drawn, and it is read in pixels by the renderer at every
   *  zoom, which is what the check at the foot of this file grades. */
  const SEAM_PX = 12;

  /* Three cuts, one drawing: the maze break and the transition at both ends share
     hatching, width and hairlines. `full` is passed in because only the caller knows
     the picture's height.
     See lessons/page-held.md#held-7 */
  function drawBreak(g, C, cx, full) {
    const w = SEAM_PX, x0 = cx - w / 2;
    g.save();
    g.beginPath(); g.rect(x0, 0, w, full); g.clip();
    g.fillStyle = C.theme.bg; g.globalAlpha = 0.95;
    g.fillRect(x0, 0, w, full);
    g.globalAlpha = 0.55; g.strokeStyle = DIM; g.lineWidth = 1;
    for (let y = -w * 2; y < full + w * 2; y += 5) {
      g.beginPath(); g.moveTo(x0 - 2, y); g.lineTo(x0 + w + 2, y + w + 4); g.stroke();
    }
    g.globalAlpha = 0.5;
    g.beginPath(); g.moveTo(x0 + 0.5, 0); g.lineTo(x0 + 0.5, full);
    g.moveTo(x0 + w - 0.5, 0); g.lineTo(x0 + w - 0.5, full); g.stroke();
    g.restore();
    return w;
  }

  /** m:ss.s, which is how the plan and the data both write these. */
  const clock = (ms) => {
    const s = Math.max(0, ms) / 1000;
    const m = Math.floor(s / 60);
    const r = s - m * 60;
    return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`;
  };
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;

  /* One ink for every lane except tint: a score is a document and nothing landed, so
     hue reports nothing. Tint is the exception because the colour is the fact; the
     break is furniture, not a mark.
     See lessons/page-held.md#held-8 */
  const INK = '#b6bcc7';
  const DIM = '#6a7280';
  const HI = '#ffd400';
  /** The four tables the score names. These are OUR readings of four words, not
   *  the piece's own lookup tables, which are not in the file. Muted on
   *  purpose: the band sits under a picture of a room, not on a chart. */
  /**
   * The tint lane keeps its colour, the score's named tables, pulled towards the
   * page ink so it is not the loudest row in a quiet picture.
   * See lessons/page-held.md#held-9
   */
  const TINT = { neutral: '#8b93a1', green: '#7f9e8a', blue: '#7d94ad', red: '#ab8079' };

  /* A colour table is three independent gains: out = clamp(room * gain) * opacity.
     A web page in a passthrough headset cannot do this (one scalar alpha for all three
     channels); Held in Human is Unity. The four tables are our reading of four words.
     See lessons/page-held.md#held-10 */
  const TABLES = {
    neutral: [1.00, 1.00, 1.00],
    green:   [0.55, 1.05, 0.62],
    blue:    [0.58, 0.82, 1.15],
    red:     [1.15, 0.64, 0.58],
  };

  /* A band of grey steps, not a drawn gallery: the room design is not ours to invent,
     and a range of tones shows the table and dimming across all of it. Nine is a choice.
     See lessons/page-held.md#held-11 */
  const STEPS = 9;
  /** The flat part of the room, which is where the type stands. White on a step
   *  band is unreadable at the bright end. */
  const WALL = 0.42;

  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  /** What a pixel of the room comes out as. */
  const through = (v, opacity, gain) => [0, 1, 2].map((i) => clamp01(v[i] * gain[i]) * opacity);
  const css = (rgb) => `rgb(${rgb.map((c) => Math.round(clamp01(c) * 255)).join(',')})`;
  /** Rec. 709, which is what a display weights its three channels by. */
  const lum = (rgb) => 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];

  // ── the picture, built once the score is in hand ──────────────────────────
  let strip = null, view = null, deck = null;
  let data = null;
  /** The panel over the line, its canvas, and what the last draw laid out, so a
   *  check can grade the picture a visitor is looking at rather than one of its
   *  own making. */
  let panel = null, canvas = null, g2 = null, drawn = null;
  /** The picture's own box, in CSS pixels, and the key that says whether
   *  anything it depends on has moved since the last frame. */
  let W = 0, H = 0, dpr = 1, lastKey = '';
  /** Which scene the line is standing in, read by the scenes lane so the bar it
   *  is inside keeps its full strength while the rest step back. */
  let currentScene = null;
  /** What the pointer was last on, and which refusal the log last said in full.
   *  The strip hands a press a POSITION and not a row, so the hit the footer
   *  was built from is the only thing that knows what was pressed. */
  let lastHit = null, saidOpen = null;
  /** What the break last drew, in pixels, written by its own renderer. The one
   *  check that can tell furniture from a duration reads this. */
  let seamDrawn = null;
  /** The same, for the two columns at the ends of the axis. */
  let offDrawn = null;

  /**
   * A label is drawn only when the whole of it fits in its bar: these are somebody
   * else's words and a truncated quotation is a misquote. The full line is in the log.
   * See lessons/page-held.md#held-12
   */
  const fits = (text, bw) => (bw - 16 >= String(text).length * 6.7 ? String(text) : '');

  (async () => {
    data = await read(SRC);

    const sceneById = new Map(data.scenes.map((s) => [s.id, s]));
    MAZE_AT = sceneById.get('intro').durationMs;
    KNOWN = data.piece.knownMs;

    /**
     * Where a thing sits on this axis, or null when the axis cannot hold it.
     * `fromIntroMs` past the intro's length means inside the maze; it is refused here
     * and said in the log.
     * See lessons/page-held.md#held-13
     */
    const placedAt = (at) => {
      if (!at) return null;
      if (at.fromMazeEndMs != null) return MAZE_AT + at.fromMazeEndMs;
      if (at.fromIntroMs != null) return at.fromIntroMs > MAZE_AT ? null : at.fromIntroMs;
      return null;
    };

    // ── the seven scenes this clock can hold ────────────────────────────────
    const placedScenes = data.scenes
      .map((s) => ({ s, at: placedAt(s.at) }))
      .filter((r) => r.at != null && r.s.durationMs != null)
      .map(({ s, at }) => ({ ...s, at, to: at + s.durationMs }));

    const sceneAtTime = (t) => placedScenes.find((s) => t >= s.at && t < s.to) || null;

    // How much of the real room is left: opens at 1.00 (the intro's `from`) and falls
    // over four seconds. The transition is drawn as a break at each end.
    // See lessons/page-held.md#held-14
    const roomSteps = data.channels.opacity.points
      .map((p) => ({ p, at: placedAt(sceneById.get(p.sceneId)?.at) }))
      .filter((r) => r.at != null && sceneById.get(r.p.sceneId).durationMs != null)
      .map(({ p, at }) => ({ at, from: p.from, value: p.value, fadeMs: p.fadeMs,
                             rate: p.ratePerSecond, sceneId: p.sceneId, sceneName: p.sceneName }))
      .sort((a, b) => a.at - b.at);

    /** The curve the renderer draws, as a function, so the check at the foot of
     *  this file grades the drawn thing rather than the table it came from. */
    const roomAt = (t) => {
      if (!roomSteps.length) return null;
      if (t <= roomSteps[0].at) return roomSteps[0].from;
      let i = 0;
      while (i + 1 < roomSteps.length && roomSteps[i + 1].at <= t) i++;
      const st = roomSteps[i], gone = t - st.at;
      if (st.fadeMs > 0 && gone < st.fadeMs) return st.from + (st.value - st.from) * (gone / st.fadeMs);
      return st.value;
    };

    // ── the colour on the camera image ──────────────────────────────────────
    const tintSteps = data.channels.lut.points
      .map((p) => ({ p, at: placedAt(sceneById.get(p.sceneId)?.at) }))
      .filter((r) => r.at != null && sceneById.get(r.p.sceneId).durationMs != null)
      .map(({ p, at }) => ({ at, from: p.from, value: p.value, fadeMs: p.fadeMs,
                             follows: p.followsRecommendation, sceneName: p.sceneName }))
      .sort((a, b) => a.at - b.at);
    /**
     * The table on the room at `t`, as gains, plus `name`, the dominant table. A fade is
     * a straight crossfade (a reading). `name` is never the fade target and is not
     * printed; it is the check's second source against the pixels.
     * See lessons/page-held.md#held-15
     */
    const tintAt = (t) => {
      let i = 0;
      while (i + 1 < tintSteps.length && tintSteps[i + 1].at <= t) i++;
      const st = tintSteps[i], gone = Math.max(0, t - st.at);
      const to = TABLES[st.value], from = TABLES[st.from] || to;
      if (!(st.fadeMs > 0) || gone >= st.fadeMs) return { name: st.value, gain: to };
      const k = gone / st.fadeMs;
      return { name: k < 0.5 ? st.from : st.value,
               gain: [0, 1, 2].map((j) => from[j] + (to[j] - from[j]) * k) };
    };

    // ── the voice ───────────────────────────────────────────────────────────
    const voiceLines = data.qanda.lines
      .map((l) => ({ l, at: placedAt(l.at) }))
      .filter((r) => r.at != null && r.l.durationMs != null)
      .map(({ l, at }) => ({ ...l, at }));
    const unplacedLines = data.qanda.lines.filter((l) => placedAt(l.at) == null);
    const overrunning = voiceLines.filter((l) => l.landsIn);
    const voiceAtTime = (t) => voiceLines.find((l) => t >= l.at && t < l.at + l.durationMs) || null;

    // QandA blocks are left out: the voice lane already draws every line they hold.
    // See lessons/page-held.md#held-16
    const isQanda = (e) => /QandA/i.test(e.what);
    const otherEvents = data.events.filter((e) => e.sceneId && !isQanda(e));
    const placedEvents = otherEvents
      .map((e) => ({ e, at: placedAt(e.at) }))
      .filter((r) => r.at != null)
      .map(({ e, at }) => ({ ...e, at }));
    const mazeEvents = otherEvents.filter((e) => e.sceneId === 'maze');

    /* The intro is recorded keys, not changes, so the correction (six backspaces over
       `houses`, then `buildings`) survives to be replayed.
       See lessons/page-held.md#held-17 */
    const keys = data.keystrokes.events;
    const correction = data.keystrokes.correction;
    const introSpan = data.keystrokes.stats.spanMs;
    /** The text as it stood at `t`. Rebuilt only when the number of events that
     *  have landed changes, so a frame that types nothing costs nothing. */
    let textCacheN = -1, textCache = '';
    const introAt = (t) => {
      let n = 0;
      while (n < keys.length && keys[n].at <= t) n++;
      if (n === textCacheN) return textCache;
      let s = '';
      for (let i = 0; i < n; i++) {
        const k = keys[i];
        if (k.kind === 'backspace') s = s.slice(0, -1);
        else if (k.kind === 'return') s += '\n';
        else s += k.char;
      }
      textCacheN = n; textCache = s;
      return s;
    };
    const introText = introAt(introSpan);

    // ── the outro, which is one paragraph with the author's own line breaks ──
    const outroText = String(data.texts.outro.text).replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/?size=?\d*>/gi, '');
    const outroTextAt = placedAt(data.events.find((e) => e.id === 'outro:outro-text').at);

    /**
     * What is set on the room at `t`: the two text surfaces the score names, the typed
     * intro and the outro paragraph. Voice is not captioned, and the river is drawn as
     * nothing because its pacing is not in the score (`river-pacing`).
     * See lessons/page-held.md#held-18
     */
    const textAt = (t) => {
      if (t <= introSpan) return { text: introAt(t), caret: true };
      if (t >= outroTextAt) return { text: outroText, caret: false };
      return { text: '', caret: false };
    };

    // The range is `piece.knownMs`, never a sum this page invents; the check below
    // reads that the maze added no width.
    // See lessons/page-held.md#held-19
    deck = createDeck({ items: [], adapters: {}, range: [0, KNOWN] });

    // ── lanes ───────────────────────────────────────────────────────────────
    const rowsOf = (list, kind) => () => list.map((x, i) => ({
      at: x.at, id: `${kind}-${x.id ?? x.n ?? i}`, kind, payload: x,
    }));

    const scenesLane = {
      id: 'scenes', kind: 'scene', label: 'scenes', height: 44,
      as: 'spans', stack: false, terse: true, spanLine: false, barPad: 6, barGap: 1,
      color: INK, alpha: 0.9,
      // Six of the eight scenes are bars: the maze is the break, the transition is named
      // under the picture.
      // See lessons/page-held.md#held-20
      subLabel: '6 bars of 8 scenes',
      rows: rowsOf(placedScenes.map((s) => ({ ...s, durMs: s.durationMs })), 'scene'),
      colorOf: () => INK,
      currentOf: (sp) => sp.row.payload.id === currentScene,
      labelOf: (sp, { bw }) => fits(sp.row.payload.name, bw),
    };

    /* The one lane where colour is the fact. See the note over `TINT`.
       See lessons/page-held.md#held-21 */
    const tintLane = {
      id: 'tint', kind: 'tint', label: 'tint', height: 26,
      as: 'spans', color: INK, subLabel: '4 named tables',
      rows: rowsOf(tintSteps.map((t, i) => ({
        id: `tint-${i}`, at: t.at, durMs: (tintSteps[i + 1]?.at ?? KNOWN) - t.at, t,
      })), 'tint'),
      render: (g, L, C) => {
        const top = L.y + 4, h = L.height - 8;
        for (let i = 0; i < tintSteps.length; i++) {
          const t = tintSteps[i];
          const end = tintSteps[i + 1]?.at ?? KNOWN;
          const xa = C.x(t.at), xb = C.x(end);
          if (xb < 0 || xa > C.width) continue;
          const fadeX = C.x(t.at + t.fadeMs);
          if (t.fadeMs > 0 && fadeX > xa) {
            // The band opens as a gradient for the scene's stated transition time from the
            // previous table, then holds.
            // See lessons/page-held.md#held-22
            const grad = g.createLinearGradient(xa, 0, fadeX, 0);
            grad.addColorStop(0, TINT[t.from] || DIM);
            grad.addColorStop(1, TINT[t.value] || DIM);
            g.fillStyle = grad;
            g.fillRect(xa, top, Math.max(1, fadeX - xa), h);
          }
          g.fillStyle = TINT[t.value] || DIM;
          const holdX = Math.max(xa, fadeX);
          g.fillRect(holdX, top, Math.max(1, xb - holdX), h);
          /* The table's name on its own band, in the page background ink as a knockout label,
             only where the held part is wide enough for the whole word.
             See lessons/page-held.md#held-23 */
          /* Ten pixels in: two bands start at a break, which is a 12 px column drawn over
             everything, and a name at four pixels lost its first letter to it.
             See lessons/page-held.md#held-24 */
          const holdW = xb - holdX;
          g.font = font(400, 9);
          if (holdW > g.measureText(t.value).width + 16) {
            g.fillStyle = C.theme.bg; g.globalAlpha = 0.82;
            g.fillText(t.value, holdX + 10, top + h - 5);
            g.globalAlpha = 1;
          }
          /* A fade that breaks the score's recommendation gets a hairline caret in the accent,
             eight pixels in from the scene start so the break drawn over the dialogue's start
             does not hide it.
             See lessons/page-held.md#held-25 */
          if (t.follows === false) {
            g.fillStyle = HI;
            g.fillRect(Math.round(xa) + 8, L.y + 1, 5, 2);
          }
        }
      },
    };

    const roomLane = {
      id: 'room', kind: 'room', label: 'room', height: 58,
      as: 'spans', color: INK, subLabel: '1.00 down to 0.15',
      rows: rowsOf(roomSteps.map((s, i) => ({
        id: `room-${i}`, at: s.at, durMs: (roomSteps[i + 1]?.at ?? KNOWN) - s.at, s,
      })), 'room'),
      render: (g, L, C) => {
        const top = L.y + 6, bot = L.y + L.height - 8, h = bot - top;
        const yOf = (v) => bot - v * h;
        const pts = [];
        for (const st of roomSteps) {
          pts.push([st.at, st.from]);
          pts.push([st.at + st.fadeMs, st.value]);
        }
        pts.push([KNOWN, roomSteps[roomSteps.length - 1].value]);
        g.save();
        g.beginPath();
        g.moveTo(C.x(pts[0][0]), bot);
        for (const [t, v] of pts) g.lineTo(C.x(t), yOf(v));
        g.lineTo(C.x(KNOWN), bot);
        g.closePath();
        g.globalAlpha = 0.14; g.fillStyle = INK; g.fill();
        g.globalAlpha = 0.92; g.strokeStyle = INK; g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(C.x(pts[0][0]), yOf(pts[0][1]));
        for (const [t, v] of pts) g.lineTo(C.x(t), yOf(v));
        g.lineTo(C.x(KNOWN), yOf(pts[pts.length - 1][1]));
        g.stroke();
        // The value where it holds, which is a constant per scene and so may be
        // written on the picture: it never changes while anybody is looking.
        g.globalAlpha = 1; g.fillStyle = DIM;
        g.font = font(400, 9);
        for (let i = 0; i < roomSteps.length; i++) {
          const st = roomSteps[i];
          const end = roomSteps[i + 1]?.at ?? KNOWN;
          const xa = C.x(st.at + st.fadeMs), xb = C.x(end);
          if (xb - xa < 26 || xb < 0 || xa > C.width) continue;
          g.fillText(`${Math.round(st.value * 100)}%`, xa + 3, yOf(st.value) - 3);
        }
        g.restore();
      },
    };

    const keysLane = {
      id: 'keys', kind: 'key', label: 'keys', height: 30,
      as: 'ticks', color: INK, alpha: 0.85,
      subLabel: `318 keys, ${clock(data.keystrokes.stats.spanMs)}`,
      rows: rowsOf(keys.map((k, i) => ({ ...k, id: `k${i}` })), 'key'),
      // One ink: typed key, Return and Backspace are told apart by width and by the letter
      // drawn where the zoom leaves room.
      // See lessons/page-held.md#held-26
      widthOfRow: (r) => (r.payload.kind === 'type' ? 1.2 : 2.6),
      glyphOf: (r) => {
        const c = r.payload.char;
        return c && /[\p{L}\p{N}]/u.test(c) ? c : '';
      },
      describeRow: (r) => {
        const k = r.payload;
        if (k.kind === 'backspace') return [`backspace, ${JSON.stringify(k.removed)} removed`];
        if (k.kind === 'return') return ['return, a line ends here'];
        return [k.char === ' ' ? 'a space' : `the letter ${JSON.stringify(k.char)}`];
      },
    };

    const voiceLane = {
      id: 'voice', kind: 'voice', label: 'voice', height: 34,
      as: 'spans', stack: false, terse: true, spanLine: false, barPad: 6, barGap: 1,
      color: INK, subLabel: '24 lines, 8 silent',
      rows: rowsOf(voiceLines.map((l) => ({ ...l, id: `q${l.n}`, durMs: l.durationMs })), 'voice'),
      // Speech and silence are told apart by strength, not hue: a silence is the same
      // voice with a stated length.
      // See lessons/page-held.md#held-27
      colorOf: (sp) => (sp.row.payload.silence ? 'rgba(182,188,199,0.34)' : INK),
      labelOf: (sp, { bw }) => (sp.row.payload.silence ? '' : fits(sp.row.payload.text, bw)),
    };

    const eventsLane = {
      id: 'events', kind: 'event', label: 'events', height: 26,
      as: 'ticks', color: INK, alpha: 0.9,
      subLabel: `${placedEvents.length} of ${otherEvents.length} placed`,
      rows: rowsOf(placedEvents.map((e) => ({ ...e })), 'event'),
      widthOfRow: (r) => (r.payload.durationMs ? 2.4 : 1.4),
    };

    /* The nine the score does not settle: four bite at a moment and are marks here,
       three are inside the maze (the break), two are outside the running order (the
       breaks at each end). The log carries what each one says in full.
       See lessons/page-held.md#held-28 */
    const sceneAt = (id) => placedAt(sceneById.get(id).at);
    const river = sceneById.get('river');
    const OPEN = {
      'trailing-keypress': {
        // The mark is on the full stop: the space lands exactly on the break and would be
        // hidden under it. The gap begins here.
        // See lessons/page-held.md#held-29
        at: data.keystrokes.stats.lastVisibleAtMs,
        say: `a space typed ${secs(data.keystrokes.stats.longestGapMs)} after this full stop, a cue or a stray` },
      'qanda-assignment': {
        // Where the two readings come apart: this slot is line 1 under one of
        // them and line 2 under the other.
        at: voiceLines[0].at,
        say: `${data.counts.qandaLines} lines for the ${data.counts.qandaAsked} the score asks for, so this is line 1 or line 2` },
      'lut-off-by-one': {
        // The second of the two adjacent fades. The first is the dialogue's,
        // which begins where the break stands and already carries its caret.
        at: sceneAt('cylinder'),
        say: `a ${secs(data.channels.lut.points.find((p) => p.sceneId === 'cylinder').fadeMs)} fade into the colour already showing, after a hard cut into the last one` },
      'river-pacing': {
        at: sceneAt('river'),
        say: `${data.counts.riverFragments} fragments in ${clock(river.durationMs)} and the block carries no timing at all` },
      'maze-length': { where: 'maze' },
      'maze-suffixes': { where: 'maze' },
      'radish': { where: 'maze' },
      'transition-clock': { where: 'transition' },
      'the-loop': { where: 'transition' },
    };
    const openMarks = data.ambiguities
      .filter((a) => OPEN[a.id]?.at != null)
      .map((a) => ({ ...a, at: OPEN[a.id].at, say: OPEN[a.id].say }))
      .sort((a, b) => a.at - b.at);
    const openInMaze = data.ambiguities.filter((a) => OPEN[a.id]?.where === 'maze');
    const openOffClock = data.ambiguities.filter((a) => OPEN[a.id]?.where === 'transition');
    /** The three places, so a check can ask whether they still add up. */
    const openPlaces = [openMarks, openInMaze, openOffClock];

    const openLane = {
      id: 'open', kind: 'open', label: 'open', height: 26,
      // The accent: annotations on the score (these marks, the tint carets) are in the
      // page colour, the score itself in one ink.
      // See lessons/page-held.md#held-30
      as: 'ticks', color: HI, alpha: 0.95,
      subLabel: `${openMarks.length} of the ${data.ambiguities.length}`,
      rows: rowsOf(openMarks, 'open'),
      widthOfRow: () => 2.4,
    };

    /* The break spans the whole picture: the maze is a property of the axis, not a row.
       It sits near the end of the lane list so it paints over everything, and its width
       is `SEAM_PX` at every zoom.
       See lessons/page-held.md#held-31 */
    const seamLane = {
      id: 'maze', kind: 'maze', label: 'maze', height: 36,
      // The break is ink, not the accent; the accent is for annotations on the score.
      // See lessons/page-held.md#held-32
      as: 'ticks', color: DIM,
      subLabel: ['no length stated', `${openInMaze.length} of the ${data.ambiguities.length}`],
      rows: () => [{ at: MAZE_AT, id: 'maze', kind: 'maze', payload: { seam: true } }],
      /* One width on every lane: a single `SEAM_PX` column through the whole picture.
         See lessons/page-held.md#held-33 */
      render: (g, L, C) => {
        const full = strip?.state?.contentH || (L.y + L.height);
        seamDrawn = { px: drawBreak(g, C, C.x(MAZE_AT), full), x: C.x(MAZE_AT) };
      },
    };

    /* The transition is drawn at both ends: it is the reset between visitors with no
       position in the running order, and the outro returns to it, so the two ends are
       one place. Each end is a mark that says its own half.
       See lessons/page-held.md#held-34 */
    const offLane = {
      id: 'transition', kind: 'transition', label: 'transition', height: 36,
      as: 'ticks', color: DIM,
      subLabel: [`${secs(sceneById.get('transition').durationMs)}, no place`,
                 `${openOffClock.length} of the ${data.ambiguities.length}`],
      rows: () => [
        { at: 0, id: 'entry', kind: 'transition', payload: { end: 'entry' } },
        { at: KNOWN, id: 'loop', kind: 'transition', payload: { end: 'loop' } },
      ],
      render: (g, L, C) => {
        const full = strip?.state?.contentH || (L.y + L.height);
        offDrawn = { px: drawBreak(g, C, C.x(0), full), left: C.x(0), right: C.x(KNOWN) };
        drawBreak(g, C, C.x(KNOWN), full);
      },
    };

    // The two lanes that cut the clock go last, in this order, so their three columns
    // paint over everything.
    // See lessons/page-held.md#held-35
    const lanes = [scenesLane, tintLane, roomLane, keysLane, voiceLane, eventsLane,
                   openLane, seamLane, offLane];

    /* `paint()` takes a context so checks can draw any instant offscreen without moving
       the visitor's picture. Type is not graded or dimmed: the table acts on the room
       and the score's one white stays on top.
       See lessons/page-held.md#held-36 */
    function paint(g, w, h, opacity, gain, text, caret) {
      g.textBaseline = 'alphabetic';
      const wallH = Math.round(h * 0.66);
      const bandH = h - wallH;

      g.fillStyle = css(through([WALL, WALL, WALL], opacity, gain));
      g.fillRect(0, 0, w, wallH);
      for (let i = 0; i < STEPS; i++) {
        const v = i / (STEPS - 1);
        const sx = Math.round((w * i) / STEPS);
        const sw = Math.round((w * (i + 1)) / STEPS) - sx;
        g.fillStyle = css(through([v, v, v], opacity, gain));
        g.fillRect(sx, wallH, sw, bandH);
      }

      if (!text) return { wallH, bandH, lines: 0, size: 0 };

      // The type shrinks until the whole of it fits, down to a floor: cutting the outro's
      // ten authored lines would be a misquote.
      // See lessons/page-held.md#held-37
      const pad = Math.max(8, Math.round(w * 0.035));
      const availW = w - pad * 2, availH = wallH - pad * 2;
      let size = Math.max(9, Math.min(20, Math.round(w / 40)));
      let lines = [];
      for (; size >= 8; size--) {
        g.font = font(400, size);
        lines = [];
        for (const para of text.split('\n')) {
          if (!para) { lines.push(''); continue; }
          let line = '';
          for (const word of para.split(' ')) {
            const next = line ? `${line} ${word}` : word;
            if (line && g.measureText(next).width > availW) { lines.push(line); line = word; }
            else line = next;
          }
          lines.push(line);
        }
        if (lines.length * Math.round(size * 1.5) <= availH) break;
      }
      const lh = Math.round(size * 1.5);
      const shown = lines.slice(Math.max(0, lines.length - Math.floor(availH / lh)));
      g.fillStyle = '#ffffff';
      let ty = pad + size;
      for (const line of shown) { g.fillText(line, pad, ty); ty += lh; }
      if (caret && shown.length) {
        const tail = shown[shown.length - 1];
        g.fillRect(pad + g.measureText(tail).width + 2, ty - lh - size + 2, 2, size);
      }
      return { wallH, bandH, lines: shown.length, size };
    }

    /* One 16:9 kit panel, so fullscreen (and the iPhone fallback) works as elsewhere.
       No presence dot (it feeds from a local file) and no values row (see `readout`).
       See lessons/page-held.md#held-38 */
    canvas = document.createElement('canvas');
    g2 = canvas.getContext('2d');
    panel = createVideoPanel({ media: canvas, left: false });

    /** The canvas is sized from the STAGE's own box rather than from the page,
     *  because the stage is what carries the 16:9 and the stage is what gives
     *  that up when the panel fills a screen. */
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      const r = panel.stage.getBoundingClientRect();
      W = Math.max(240, Math.round(r.width));
      H = Math.max(140, Math.round(r.height));
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      lastKey = '';
    }

    function draw() {
      const t = deck.position();
      const opacity = roomAt(t);
      const tint = tintAt(t);
      const { text, caret } = textAt(t);
      g2.setTransform(dpr, 0, 0, dpr, 0, 0);
      g2.clearRect(0, 0, W, H);
      const geom = paint(g2, W, H, opacity, tint.gain, text, caret);
      drawn = { t, opacity, tint, text, w: W, h: H, geom };
      return drawn;
    }

    // `scrub: false` because the line below is the position surface; `loop: false`
    // because nothing sounds. The piece's own loop is the break at both ends.
    // See lessons/page-held.md#held-39
    const bar = createTransportBar(d.el, deck, { scrub: false, loop: false });

    view = createStripView(d.el, deck, {
      size: 'auto', follow: false, gutter: 110, lanes,
      /* One line, empty when nothing is under the pointer. Empty means no text, never no
         box: it keeps a fixed height (35 px either way) so the page does not jump.
         See lessons/page-held.md#held-40 */
      footer: { lines: 1, empty: '' },
      /**
       * One voice under the line for every lane, via `describeHit`: what the pointer is
       * on, where, and the fact not on the picture. The lane name is replaced because it
       * is already in the gutter.
       * See lessons/page-held.md#held-41
       */
      describeHit: (hit) => { lastHit = hit; return footerFor(hit); },
      /* Pressing a refusal seeks to where it bites and says the whole of it again at the
         bottom of the log. `onSeek` replaces the strip's own seek, so the deck is moved here.
         See lessons/page-held.md#held-42 */
      onSeek: (p) => {
        deck.seek(p);
        const row = lastHit?.lane?.id === 'open' ? lastHit.row?.payload : null;
        // Deduped against the last one said: a press becomes a drag and `onSeek` fires along it.
        // See lessons/page-held.md#held-43
        if (!row || row.id === saidOpen) return;
        saidOpen = row.id;
        d.log(`${row.where}: ${row.what} Read as ${row.readings.map((r) => r.how).join(', or as ')}.`);
      },
    });

    strip = view.strip;

    /* The picture is its own block; the bar and line are glued (glue is for a strip on
       the bar that drives it). The footer carries the fullscreen button, 55 px, and must
       not collapse. Read the anchor before `createGlue`, which re-parents its blocks.
       See lessons/page-held.md#held-44 */
    const afterStrip = view.surface.nextSibling;
    const surface = createGlue(bar.el, view.surface);
    d.el.insertBefore(surface, afterStrip);
    d.el.insertBefore(panel.el, surface);
    size();
    draw();
    /* Observe the stage, not the panel: the panel adds only a fixed-height footer.
       See lessons/page-held.md#held-45 */
    new ResizeObserver(() => { size(); draw(); }).observe(panel.stage);

    /** What the footer says, for any hit. */
    /**
     * One line that says the thing, not the clock: the mark's position on the line is
     * its time. What each lane gives up (scenes: stated against measured; voice: which
     * scene speaks is a reading) is carried by the log.
     * See lessons/page-held.md#held-46
     */
    function footerFor(hit) {
      if (!hit) return null;
      const L = hit.lane, p = hit.row?.payload;
      if (!p) return [L.label ?? L.id];
      switch (L.id) {
        case 'scenes':
          return [`${p.name}, ${secs(p.durationMs)} long`];
        case 'tint':
          return [p.t.fadeMs
            ? `${p.t.value} on the camera image, ${secs(p.t.fadeMs)} fade from ${p.t.from}`
            : `${p.t.value} on the camera image, a hard cut from ${p.t.from}`];
        case 'room':
          return [`${Math.round(p.s.value * 100)}% of the real room, from ${Math.round(p.s.from * 100)}%`];
        case 'keys': {
          const say = keysLane.describeRow({ payload: p })[0];
          return [p.delayMs >= 1000 ? `${say}, ${secs(p.delayMs)} of nothing before it` : say];
        }
        case 'voice':
          return [p.silence
            ? `silence, ${secs(p.durationMs)}`
            : (p.landsIn ? `${p.text} (${secs(p.landsIn.atMs)} into the ${p.landsIn.sceneName})` : p.text)];
        case 'events':
          return [p.durationMs ? `${p.what}, over ${secs(p.durationMs)}` : p.what];
        case 'open': {
          const n = p.readings.length;
          return [`${p.say}, ${n} reading${n === 1 ? '' : 's'}`];
        }
        case 'maze':
          return [`the maze, no length in the score, it waits for a visitor, `
            + `${openInMaze.length} of the ${data.ambiguities.length} open questions inside it`];
        case 'transition':
          return [p.end === 'entry'
            ? `the transition, ${secs(sceneById.get('transition').durationMs)} stated, and nothing on this clock places it`
            : 'the outro returns to the transition and the next visitor begins, which is a reading'];
        default:
          return [L.label ?? L.id];
      }
    }

    // Which scene the line stands in, so the scenes lane keeps that bar at full strength.
    // Writes nothing unless the scene changed, so a standing playhead costs no redraws.
    // See lessons/page-held.md#held-47
    const atLine = (t) => {
      const sc = sceneAtTime(t);
      const id = sc ? sc.id : null;
      if (id === currentScene) return;
      currentScene = id;
      strip?.invalidate?.();
    };
    atLine(deck.position());
    /* One loop for both surfaces, reading the same `deck.position()` per frame. Each
       redraws only when something moved: `atLine` on a scene change, the picture on a
       new instant or width.
       See lessons/page-held.md#held-48 */
    (function follow() {
      const t = deck.position();
      atLine(t);
      const key = `${Math.round(t)}|${W}|${H}`;
      if (key !== lastKey) { lastKey = key; draw(); }
      requestAnimationFrame(follow);
    })();
    /* See lessons/page-held.md#held-49 */
    whenFaces(() => { lastKey = ''; strip?.invalidate?.(); strip?.draw?.(); });

    const creditsEv = data.events.find((e) => e.id === 'transition:credits');
    const waitCredits = data.events.find((e) => e.id === 'wait:credits-until-intro');
    const waitHeadset = data.events.find((e) => e.id === 'wait:headset-mounted-before-intro');
    const outerMaze = mazeEvents[0];
    const waitLine = unplacedLines[0];

    // ── whose work this is ──────────────────────────────────────────────────
    //
    /* No credits block: the full credits are in demo/resources/held-in-human.json under
       `texts.credits`. The text's author and the dialogue's origin are in the log,
       because this page renders those words.
       See lessons/page-held.md#held-50 */
    const cr = data.texts.credits.groups;
    const roleOf = (h) => (cr.find((g) => g.heading === h)?.entries || [])
      .map((e) => e.replace(/,\s*$/, '')).join(', ');

    /* The page's log. The nine refusals are sentences and need a surface that wraps (a
       table row has a 560 px floor). The first line is the count and the three kinds of
       place.
       See lessons/page-held.md#held-51 */
    /* Whose words these are, first: the `keys` lane types Ene Mihkelson's text and the
       dialogue lines are audience interaction. That is a caption, not a credit.
       See lessons/page-held.md#held-52 */
    d.log(`the text the picture types and the keys lane draws is ${roleOf('Intro and Outro texts')}, `
      + `translated from Estonian by ${roleOf('Translation from Estonian')}`);
    d.log(`the dialogue, the whispers and the chat are ${roleOf('Whispers, chat, dialogue')}`);

    /* The last line is one sentence on purpose; the reasoning is over `TABLES` and in
       part 2 of plans/plan-held-in-human-score.md.
       See lessons/page-held.md#held-53 */
    d.log('the picture over the line is one visit: the room dimmed and coloured on the score\'s own '
      + 'clock, with the intro typing itself over it. The room is a band of grey steps rather than '
      + 'the gallery, which is Mari Möldre\'s and is not in the score.');
    d.log(`the score names ${data.channels.lut.values.length} colour tables and defines none of them, `
      + 'so the three numbers each one is given here are ours and not the piece\'s. Neutral is taken '
      + 'to be the table that changes nothing, which is a reading as well.');
    d.log('a colour table is three separate gains, which this flat picture applies the way the '
      + 'piece\'s own Unity application does, and which a web page in a headset could not, because '
      + 'a passthrough session lets the real room through by one number shared by red, green and blue');

    d.log(`the axis is the running order with the maze taken out, ${data.piece.knownClock} `
      + `from the first keystroke of the intro to the end of the outro. `
      + `${data.counts.scenesStated} of the scene lengths are stated in the score and `
      + `${data.counts.scenesMeasured} are measured by summing what the scene holds`);
    d.log(`${data.counts.qandaLines} lines of one voice, and which scene speaks each of them is a `
      + 'reading of the score rather than something it states');
    d.log(`the maze has no length in the score, so it is drawn as a break in the clock rather `
      + `than as a bar. Inside it the outer maze starts ${secs(outerMaze.atMs)} in, and `
      + `${JSON.stringify(waitLine.text)} is the only line in the score with a negative time, so it `
      + 'holds until she walks.');
    d.log(`the transition is cut out of this clock at both ends: ${secs(sceneById.get('transition').durationMs)} `
      + `stated, the credits rolling ${secs(creditsEv.atMs)} in for ${secs(creditsEv.durationMs)} and ending `
      + `${secs(creditsEv.overrunsSceneMs)} past the scene itself, then ${secs(waitCredits.durationMs)} until the `
      + `intro. A visitor who has just put the headset on waits ${secs(waitHeadset.durationMs)} instead and gets `
      + 'no transition at all.');
    d.log(`${data.ambiguities.length} things the score does not settle, and every one of them has a place on `
      + `the line: ${openMarks.length} at the moment they bite, ${openInMaze.length} inside the maze, `
      + `${openOffClock.length} off this clock at the ends.`);
    for (const a of data.ambiguities) {
      d.log(`${a.where}: ${a.what} Read as ${a.readings.map((r) => r.how).join(', or as ')}.`);
    }

    // ── the picture of the machinery ────────────────────────────────────────
    //
    /* See lessons/page-held.md#held-54 */
    // No diagram. `what` is one sentence because a description is one sentence.
    // See lessons/page-held.md#held-55

    // Checks. Everything below grades data in hand and geometry already drawn, so it
    // runs for everybody; the ones that move something are behind the gate.
    // See lessons/page-held.md#held-56
    const A = (label, pass, detail) => d.assert(label, pass, detail);

    // Lay the picture out now: the strip draws on a raf, and the checks read lane geometry.
    // See lessons/page-held.md#held-57
    strip.draw();
    /* Open on the whole piece, both ends included, so the transition's two halves are
       visible at load. Needs the canvas laid out (the draw above) and a second draw.
       See lessons/page-held.md#held-58 */
    strip.fit();
    strip.draw();

    // 1. the maze, which is the whole reason this clock has a break in it
    const absent = data.scenes.filter((s) => s.durationHow === 'absent');
    A('the maze is the one scene the score gives no length',
      absent.length === 1 && absent[0].id === 'maze' && absent[0].durationMs === null,
      absent.map((s) => `${s.id} ${s.durationHow}`).join(', ') || 'none');
    A('so it is not a bar: six scenes are, and the maze and the transition are not among them',
      data.scenes.length === 8 && placedScenes.length === 6
      && !placedScenes.some((s) => s.id === 'maze' || s.id === 'transition'),
      `${placedScenes.length} bars of 8 scenes: ${placedScenes.map((s) => s.id).join(' ')}`);
    A('and the axis is exactly the running order with it taken out',
      deck.range[1] - deck.range[0] === KNOWN
      && KNOWN === placedScenes.reduce((a, s) => a + s.durationMs, 0),
      `${KNOWN} ms on the axis, ${placedScenes.reduce((a, s) => a + s.durationMs, 0)} ms of scenes`);
    /* Both ways of inventing the maze's length are refused by one check: pushing what
       follows along moves the axis end, a gap at the seam breaks the run of scenes.
       See lessons/page-held.md#held-59 */
    const lastScene = placedScenes[placedScenes.length - 1];
    A('and nothing was inserted at the break, in either direction',
      placedScenes.every((s, i) => (i === 0 ? s.at === 0 : s.at === placedScenes[i - 1].to))
      && lastScene.to === KNOWN,
      `the scenes run without a gap and end at ${clock(lastScene.to)}, which is the axis`);
    A('it is drawn all the same, as a break with a width in pixels',
      !!seamDrawn && seamDrawn.px === SEAM_PX && Number.isFinite(seamDrawn.x),
      seamDrawn ? `${seamDrawn.px} px at x ${seamDrawn.x.toFixed(1)}` : 'the break was never drawn');
    A('two things happen inside it and neither has a place on this clock',
      mazeEvents.length === 1 && mazeEvents[0].atMs === 60000 && unplacedLines.length === 1
      && unplacedLines[0].waitsForVisitor === true,
      `${mazeEvents[0]?.what} at ${secs(mazeEvents[0]?.atMs)}, and line ${unplacedLines[0]?.n}`);
    // Both channels hold their value across the maze, which is what lets the
    // line and the band cross the break unbroken. If either moved there, this
    // page would be drawing a change at a position it does not have.
    const mazeRoom = data.channels.opacity.points.find((p) => p.sceneId === 'maze');
    const mazeTint = data.channels.lut.points.find((p) => p.sceneId === 'maze');
    A('the room and the colour both hold across it, so nothing is lost at the break',
      mazeRoom.changed === 0 && mazeTint.same === true,
      `room ${mazeRoom.from} to ${mazeRoom.value}, tint ${mazeTint.from} to ${mazeTint.value}`);

    // 2. the voice that outlives its own scene
    const holdMe = sceneById.get('holdme');
    const last = voiceLines[voiceLines.length - 1];
    const outroStart = placedAt(sceneById.get('outro').at);
    const block = data.qanda.blocks.find((b) => b.id === 'holdme:second-qanda');
    A('seven lines of the last block sound after their own scene has ended',
      overrunning.length === 7 && overrunning.every((l) => l.landsIn.sceneId === 'outro'),
      `${overrunning.length} lines land in the ${overrunning[0]?.landsIn.sceneName}`);
    A('and the block runs 85.5 s past the end of hold me, drawn where the data says',
      last.at + last.durationMs - (placedAt(holdMe.at) + holdMe.durationMs) === block.overrunsSceneMs
      && block.overrunsSceneMs === 85500,
      `${clock(last.at + last.durationMs)} on the axis, ${secs(block.overrunsSceneMs)} past hold me`);
    const recognise = voiceLines.find((l) => l.n === 20);
    // `outroEvent`, not `outroText`: that name is the paragraph string the picture sets.
    // See lessons/page-held.md#held-60
    const outroEvent = placedEvents.find((e) => e.id === 'outro:outro-text');
    A('the outro text appears half a second after the voice asks whether you recognise it',
      outroEvent.at - (recognise.at + recognise.durationMs) === 500,
      `${outroEvent.at - (recognise.at + recognise.durationMs)} ms apart, at outro `
      + `${secs(outroEvent.at - outroStart)}`);
    A('every line\'s scene is a reading, and the page says so on every one of them',
      data.qanda.lines.every((l) => l.how === 'inferred')
      && data.counts.qandaLinesAssignedByInference === 24,
      `${data.counts.qandaLinesAssignedByInference} of ${data.counts.qandaLines} inferred`);
    A('eight of the twenty-four lines are silence, and they are drawn as lines with a length',
      voiceLines.filter((l) => l.silence).length + unplacedLines.filter((l) => l.silence).length === 8
      && voiceLines.filter((l) => l.silence).reduce((a, l) => a + l.durationMs, 0) === 77500,
      `${voiceLines.filter((l) => l.silence).length} placed silences, `
      + `${secs(voiceLines.filter((l) => l.silence).reduce((a, l) => a + l.durationMs, 0))} of them, `
      + `longest ${secs(Math.max(...voiceLines.filter((l) => l.silence).map((l) => l.durationMs)))}`);

    // 3. the two channels, graded against the curve this page actually draws
    let worstRate = 0, worstAt = '';
    for (const st of roomSteps) {
      const drawn = (roomAt(st.at + st.fadeMs) - roomAt(st.at)) / (st.fadeMs / 1000);
      const off = Math.abs(Number(drawn.toFixed(4)) - st.rate);
      if (off > worstRate) { worstRate = off; worstAt = st.sceneName; }
    }
    A('every ramp is drawn at the rate the score works out to',
      roomSteps.length === 6 && worstRate < 1e-4,
      worstRate ? `worst ${worstRate.toFixed(5)} a second, on the ${worstAt}` : 'all six exact');
    const rates = roomSteps.map((s) => Math.abs(s.rate));
    const fastest = Math.max(...rates);
    const next = Math.max(...rates.filter((r) => r < fastest));
    A('the cylinder collapses 2.75 times faster than the next move a visitor is inside',
      fastest === 0.275 && roomSteps.find((s) => Math.abs(s.rate) === fastest).sceneId === 'cylinder'
      && Math.abs(fastest / next - 2.75) < 1e-9,
      `${fastest} a second against ${next}, a ratio of ${(fastest / next).toFixed(2)}`);
    const breaks = data.channels.lut.points.filter((p) => p.followsRecommendation === false);
    A('two colour fades break the score\'s own recommendation, and they are adjacent',
      breaks.length === 2 && breaks[0].sceneId === 'dialogue' && breaks[1].sceneId === 'cylinder'
      && breaks[1].index - breaks[0].index === 1,
      breaks.map((p) => `${p.sceneName} ${p.fadeMs} ms`).join(', '));

    /* 4. the picture, graded on the pixels it paints. `paint()` draws offscreen, so these
       run for everybody; the one check that reads the page's canvas moves the playhead
       and is behind the gate.
       See lessons/page-held.md#held-61 */
    const shot = (t, text = '') => {
      const c = document.createElement('canvas');
      c.width = 240; c.height = 160;
      const g = c.getContext('2d', { willReadFrequently: true });
      const geom = paint(g, 240, 160, roomAt(t), tintAt(t).gain, text, false);
      const px = (x, y) => {
        const p = g.getImageData(x, y, 1, 1).data;
        return [p[0] / 255, p[1] / 255, p[2] / 255];
      };
      const stepY = geom.wallH + Math.floor(geom.bandH / 2);
      return {
        step: (i) => px(Math.round((240 * (i + 0.5)) / STEPS), stepY),
        /** the whole flat wall in one read, for a check that has to find the
         *  brightest thing in it rather than sample a known point */
        band: () => g.getImageData(0, 2, 240, Math.max(1, geom.wallH - 4)).data,
        px, geom,
      };
    };
    const introMid = 60000;          // the intro, holding neutral at 0.60
    const cylinder = placedScenes.find((s) => s.id === 'cylinder');
    const cylAt = cylinder.at + 95000;   // the room at 15% under the green table

    const lutPoints = data.channels.lut.points;
    A('the score names four colour tables and carries no definition of any of them',
      data.channels.lut.values.length === 4
      && lutPoints.every((p) => typeof p.value === 'string' && TABLES[p.value])
      && !('table' in data.channels.lut) && !('luts' in data.channels.lut)
      && lutPoints.every((p) => !('rgb' in p) && !('curve' in p)),
      `${data.channels.lut.values.join(', ')}, and nothing but names`);
    A('neutral is read as the table that changes nothing, so a neutral scene is the room dimmed',
      TABLES.neutral.every((x) => x === 1),
      `gain ${TABLES.neutral.join(', ')}`);
    {
      /* The first is the negative control: under neutral all three channels stay equal.
         The second requires black to stay black, which separates a gain from a colour
         laid over the room.
         See lessons/page-held.md#held-62 */
      const s = shot(introMid);
      const grey = [0, 3, 6, STEPS - 1].map((i) => s.step(i));
      const off = Math.max(...grey.map((c) => Math.max(Math.abs(c[0] - c[1]),
                                                       Math.abs(c[1] - c[2]))));
      const top = s.step(STEPS - 1);
      A('under neutral the room keeps its own greys, dimmed to what the score asks for',
        off < 0.02 && Math.abs(lum(top) - roomAt(introMid)) < 0.03,
        `channels within ${off.toFixed(3)} of each other, brightest step at `
        + `${lum(top).toFixed(2)} against ${roomAt(introMid).toFixed(2)}`);

      const c = shot(cylAt);
      const bright = c.step(STEPS - 1), dark = c.step(0);
      const tint = tintAt(cylAt), op = roomAt(cylAt);
      A('and a colour table is three gains, so under green the channels come apart and black stays black',
        tint.name === 'green' && Math.round(op * 100) === 15
        && bright[1] - bright[0] > 0.03 && bright[1] - bright[2] > 0.02
        && dark.every((x) => x < 0.05),
        `the brightest step reads ${bright.map((x) => x.toFixed(2)).join(', ')} and the darkest `
        + `${dark.map((x) => x.toFixed(2)).join(', ')}, at ${Math.round(op * 100)}% of the room`);
    }
    {
      // One read of the whole wall: three thousand `getImageData` calls would outlast the page.
      // See lessons/page-held.md#held-63
      const band = shot(cylAt, 'When the piles for the').band();
      let best = [0, 0, 0];
      for (let i = 0; i < band.length; i += 4) {
        const p = [band[i] / 255, band[i + 1] / 255, band[i + 2] / 255];
        if (lum(p) > lum(best)) best = p;
      }
      A('the type is the page\'s own white, because a colour table is on the room and not on what the page draws',
        best.every((x) => x > 0.92),
        `the brightest thing on the wall reads ${best.map((x) => x.toFixed(2)).join(', ')} while the `
        + 'room under it is green');
    }
    {
      /* Two sources that can disagree: the name from the score's steps, the colour from
         the pixels. A picture a scene ahead of itself shows here and nowhere else.
         See lessons/page-held.md#held-64 */
      const river = placedScenes.find((s) => s.id === 'river');
      const riverFade = lutPoints.find((p) => p.sceneId === 'river').fadeMs;
      const first = shot(river.at).step(STEPS - 1);
      A('a table still fading is the one on the room and not the one it is going to',
        riverFade === 10000 && tintAt(river.at).name === 'green'
        && tintAt(river.at + riverFade).name === 'blue' && first[1] > first[2],
        `at the river's first frame the picture is ${tintAt(river.at).name} and its brightest step `
        + `reads ${first.map((x) => x.toFixed(2)).join(', ')}, which is ${secs(riverFade)} from blue`);
    }
    A('the outro paragraph is set 30 s into the outro and not before, with the author\'s own breaks',
      textAt(outroTextAt - 1).text === '' && textAt(outroTextAt).text === outroText
      && outroText.split('\n').length === data.texts.outro.breaks + 1,
      `at ${clock(outroTextAt)}, ${data.texts.outro.breaks + 1} lines`);
    A('the river is set as the room alone, because the score gives its fragments no timing',
      data.texts.river.fragments.every((f) => f.durationMs === null)
      && textAt(placedScenes.find((s) => s.id === 'river').at + 60000).text === '',
      `${data.counts.riverFragments} fragments, none of them timed`);
    {
      // A voice is a voice. Captioning it would invent a text surface the score
      // does not have, so the picture sets nothing while one is speaking.
      const speaking = voiceLines.find((l) => l.at > introSpan
        && l.at + l.durationMs < outroTextAt && !l.silence);
      A('and the voice is never set, because the score carries its lines as durations and no recording',
        !!speaking && textAt(speaking.at + speaking.durationMs / 2).text === ''
        && !data.qanda.lines.some((l) => 'audio' in l || 'file' in l),
        `${data.counts.qandaLines} lines, ${data.counts.qandaSilences} of them silence, and no `
        + 'recording anywhere in the file');
    }
    A('the picture was laid out at sixteen to nine and it is not empty',
      !!drawn && drawn.w > 200 && drawn.h > 100 && drawn.geom.bandH > 10
      && Math.abs(drawn.w / drawn.h - 16 / 9) < 0.08,
      drawn ? `${drawn.w}x${drawn.h}, a band of ${STEPS} steps ${drawn.geom.bandH} px deep`
        : 'nothing was drawn');

    // 5. the intro, which is a recording rather than a string
    A('the keystroke track is exactly as long as the intro, and every mark is inside it',
      data.keystrokes.stats.spanMs === sceneById.get('intro').durationMs
      && keys.every((k) => k.at >= 0 && k.at <= MAZE_AT),
      `${keys.length} keys over ${clock(data.keystrokes.stats.spanMs)}`);
    A('the change of mind is a hesitation longer than the deletion it leads to',
      correction.hesitationMs > correction.lastBackspaceAtMs - correction.firstBackspaceAtMs
      && correction.backspaces === 6,
      `${correction.hesitationMs} ms of nothing, then ${correction.backspaces} backspaces in `
      + `${correction.lastBackspaceAtMs - correction.firstBackspaceAtMs} ms`);
    A('and it is in the picture: houses at 39.8 s, buildings at 46.4 s',
      introAt(correction.lastWrongLetterAtMs).endsWith('houses')
      && introAt(correction.lastRightLetterAtMs).endsWith('buildings'),
      `${JSON.stringify(introAt(correction.lastWrongLetterAtMs).slice(-28))} then `
      + `${JSON.stringify(introAt(correction.lastRightLetterAtMs).slice(-28))}`);
    A('and the whole track leaves the characters on screen that the score says it does',
      introText.length === data.keystrokes.stats.charactersOnScreen
      && introText === data.keystrokes.text,
      `${introText.length} characters, ${data.keystrokes.stats.returns} line breaks`);

    // 6. what the score refuses to decide. The three places must add up to nine with
    // nothing counted twice, so a refusal that lost its place drops out of the sum.
    // See lessons/page-held.md#held-65
    const placedOpen = openPlaces.flat();
    A('nine things the score does not settle, and every one of them has a place on the line',
      data.ambiguities.length === 9 && data.ambiguities.every((a) => a.settled === false)
      && placedOpen.length === data.ambiguities.length
      && new Set(placedOpen.map((a) => a.id)).size === data.ambiguities.length,
      `${openMarks.length} at a moment, ${openInMaze.length} inside the maze, `
      + `${openOffClock.length} off this clock, ${data.ambiguities.filter((a) => a.settled).length} settled`);
    /* A place is not an account: this reads the log a visitor gets, so a refusal's
       sentence lost on the way cannot pass.
       See lessons/page-held.md#held-66 */
    const logText = d.logEl.textContent;
    A('and each one is in the log in full, with every reading it carries, settling nothing',
      data.ambiguities.every((a) => logText.includes(a.what)
        && a.readings.every((r) => logText.includes(r.how)))
      && logText.includes(waitLine.text) && logText.includes(secs(waitHeadset.durationMs)),
      `${data.ambiguities.length} refusals and `
      + `${data.ambiguities.reduce((n, a) => n + a.readings.length, 0)} readings in ${logText.length} `
      + 'characters of log');
    A('the loop is one of them, so it is carried as a reading rather than drawn',
      data.order.loops === true && data.order.loopsHow === 'inferred',
      `loops: ${data.order.loops}, how: ${data.order.loopsHow}`);
    /* The transition is drawn as the maze's break, in pixels, at both ends of the axis.
       See lessons/page-held.md#held-67 */
    A('the transition is off this clock, so it is a break at both ends rather than a bar',
      !!offDrawn && offDrawn.px === SEAM_PX && offDrawn.right > offDrawn.left
      && sceneById.get('transition').runningIndex === null,
      offDrawn ? `${offDrawn.px} px at x ${offDrawn.left.toFixed(1)} and x ${offDrawn.right.toFixed(1)}`
        : 'neither end was drawn');

    // 7. whose work this is: the text's provenance is in the log. `__demo.logs`, not
    // `d.logs`: the mount return and the published api are different objects.
    // See lessons/page-held.md#held-68
    /**
     * No attribution check: the piece is the owner's team's, and a page does not cite
     * its own team. The translated text's provenance stays in the log.
     * See lessons/page-held.md#held-69
     */

    // 9. the strip's own gutters, which drop a line in silence when a lane is short
    const fit = strip.gutterFit();
    A('every lane says its own name and its own number, with nothing dropped',
      fit.every((f) => f.dropped === 0),
      fit.filter((f) => f.dropped).map((f) => `${f.id} dropped ${f.dropped}`).join(', ')
      || `${fit.length} lanes, nothing dropped`);

    // 10. nothing here reaches outside this site
    A('a visit reads one file, and it is ours',
      offSite === 0 && fetched.length === 1 && fetched[0] === SRC,
      `${fetched.join(', ')}, ${offSite} off this site`);

    /**
     * Behind the gate: each of these moves something a person would see (zoom, pointer,
     * press, playhead). A visitor's picture stands still; the log says what was not run.
     * See lessons/page-held.md#held-70
     */
    ifSelfcheck(() => {
      /* The break keeps its width when the axis stretches and a scene does not; only this
         check tells furniture from a duration.
         See lessons/page-held.md#held-71 */
      strip.draw();
      const before = { seam: seamDrawn.px, intro: strip.timeToX(MAZE_AT) - strip.timeToX(0) };
      strip.zoomIn(3);
      strip.draw();
      const after = { seam: seamDrawn.px, intro: strip.timeToX(MAZE_AT) - strip.timeToX(0) };
      strip.fit();
      strip.draw();
      A('the break keeps its width when the axis is stretched, and the intro does not',
        before.seam === after.seam && after.intro > before.intro * 2.5,
        `break ${before.seam} px then ${after.seam} px, intro ${before.intro.toFixed(0)} px `
        + `then ${after.intro.toFixed(0)} px`);

      /* Points at the 46.5 s silence through the strip's own pointer path. At the opening
         zoom (about 1.4 px/s) the 6 px tolerance spans over four seconds; this silence is
         the one row wider than that on both sides.
         See lessons/page-held.md#held-72 */
      const r = strip.canvas.getBoundingClientRect();
      const S = strip.state;
      const lane = strip.lanes().find((l) => l.id === 'voice');
      const target = voiceLines.find((l) => l.n === 21);
      const ready = !!lane && Number.isFinite(lane.y) && r.width > 0 && S.width > 0;
      const cx = ready
        ? r.left + (strip.timeToX(target.at + target.durationMs / 2) + S.gutterPx) * (r.width / S.width)
        : 0;
      const cy = ready ? r.top + (lane.y + lane.height / 2) * (r.height / S.height) : 0;
      strip.canvas.dispatchEvent(new PointerEvent('pointermove',
        { clientX: cx, clientY: cy, bubbles: true }));
      const on = view.footer.says();
      const tall = view.footer.el.offsetHeight;
      // The footer is one line, so this reads `on[0]` only.
      // See lessons/page-held.md#held-73
      A('pointing at the long silence says which scene it lands in, under the line rather than over it',
        ready && on[0] === `silence, ${secs(target.durationMs)}`,
        ready ? on.filter(Boolean).join(' / ') : 'the strip has not been measured yet');
      strip.canvas.dispatchEvent(new PointerEvent('pointerleave',
        { clientX: r.left - 10, clientY: r.top - 10, bubbles: true }));
      const off = view.footer.says();
      // The text must be empty, and the box must keep its height so the page does not jump.
      // See lessons/page-held.md#held-74
      A('and with nothing under it it stays empty, and the box keeps its height',
        off.every((l) => !l) && view.footer.el.offsetHeight === tall,
        `${off.filter(Boolean).length} line(s) of text, ${view.footer.el.offsetHeight} px of ${tall}`);

      /* A press on a refusal has to say the whole of it. The river's mark has 200 s of clear
         axis either side, and is driven through the strip's own pointer path.
         See lessons/page-held.md#held-75 */
      const openGeom = strip.lanes().find((l) => l.id === 'open');
      const mark = openMarks.find((a) => a.id === 'river-pacing');
      const mx = ready && openGeom
        ? r.left + (strip.timeToX(mark.at) + S.gutterPx) * (r.width / S.width) : 0;
      const my = ready && openGeom
        ? r.top + (openGeom.y + openGeom.height / 2) * (r.height / S.height) : 0;
      /* A synthetic pointer cannot be captured (`setPointerCapture` throws), so capture is
         stubbed for one press and the stubs deleted afterwards to restore the real methods.
         See lessons/page-held.md#held-76 */
      strip.canvas.setPointerCapture = () => {};
      strip.canvas.releasePointerCapture = () => {};
      try {
        for (const type of ['pointermove', 'pointerdown', 'pointerup']) {
          strip.canvas.dispatchEvent(new PointerEvent(type,
            { clientX: mx, clientY: my, bubbles: true, isPrimary: true, button: 0 }));
        }
      } finally {
        delete strip.canvas.setPointerCapture;
        delete strip.canvas.releasePointerCapture;
      }
      const saidLast = d.api.logs[d.api.logs.length - 1]?.msg ?? '';
      A('pressing a refusal on the line says the whole of it at the foot of the log',
        !!openGeom && saidLast.includes(mark.what)
        && mark.readings.every((x) => saidLast.includes(x.how)),
        openGeom ? `${saidLast.slice(0, 60)}…` : 'the open lane was never laid out');

      /* The line answers for where it stands: at 95 s into the cylinder the scenes bar,
         room percentage, tint name and spoken line are graded through the renderers' hooks.
         See lessons/page-held.md#held-77 */
      deck.seek(cylinder.at + 95000);
      atLine(deck.position());
      const at = deck.position();
      const spoken = voiceAtTime(at);
      A('the line answers for wherever it is standing',
        currentScene === 'cylinder'
        && scenesLane.currentOf({ row: { payload: { id: 'cylinder' } } }) === true
        && Math.round(roomAt(at) * 100) === 15 && tintAt(at).name === 'green'
        && !!spoken && spoken.silence === false,
        `${currentScene}, ${Math.round(roomAt(at) * 100)}% of the room, ${tintAt(at).name}, `
        + `${spoken ? (spoken.silence ? 'a silence' : 'speaking') : 'nothing spoken'}`);

      /* The canvas on the page must match the offscreen `paint` at the same instant, or
         every check above is green about the wrong thing. The seek is on the line's deck:
         one clock, two surfaces.
         See lessons/page-held.md#held-78 */
      const live = draw();
      const sx = Math.min(canvas.width - 1,
        Math.round((W * (STEPS - 0.5)) / STEPS * dpr));
      const sy = Math.min(canvas.height - 1,
        Math.round((live.geom.wallH + live.geom.bandH / 2) * dpr));
      const onPage = [...g2.getImageData(sx, sy, 1, 1).data].slice(0, 3).map((c) => c / 255);
      const offPage = shot(live.t).step(STEPS - 1);
      A('and the picture on the page is the one those checks were painting',
        live.tint.name === 'green'
        && [0, 1, 2].every((i) => Math.abs(onPage[i] - offPage[i]) < 0.02),
        `on the page ${onPage.map((c) => c.toFixed(2)).join(', ')}, off screen `
        + `${offPage.map((c) => c.toFixed(2)).join(', ')}`);

      deck.seek(0);
      atLine(deck.position());
      lastKey = '';
      draw();
    }, { log: d.log,
         // The count in `say` must match the number of checks in this gate.
         // See lessons/page-held.md#held-79
         say: 'six checks are not run for a visitor, because each of them moves the picture or the '
            + 'line: the zoom, the pointer, a press and the playhead' });

    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>

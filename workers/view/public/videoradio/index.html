<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The picture is the page. The pane is a column holding the screen; the
     transport is a box of its own below it.
     See lessons/page-videoradio.md#videoradio-1 */
  .vr-pane {
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    background: var(--card2); border: 1px solid var(--line2); border-radius: 4px;
  }
  /* `aspect-ratio` rather than a pixel height: the field's two axes are the
     granulator's own, so the box has no natural height and a height typed in
     pixels would be one more number to keep in step with a layout. */
  .vr-screen { position: relative; aspect-ratio: 16 / 9; background: #05060a; }
  .vr-screen canvas { display: block; width: 100%; height: 100%; }
  /* No second picture under the screen; the headset half and its sea are in
     archive/videoradio-xr/.
     See lessons/page-videoradio.md#videoradio-2 */

  /* No control row inside the picture's box: the transport is createTransportBar in
     its own box, which owns the border and the flex row.
     See lessons/page-videoradio.md#videoradio-3 */

  /* Shape and frame only: shell.css's `.pos-faux-host .pos-faux` owns the cover at
     the same specificity, so a duplicate here would win and break the fallback. A
     class, never `:fullscreen`, which unknown browsers drop with the whole list.
     See lessons/page-videoradio.md#videoradio-4 */
  .vr-pane.pos-full { border: 0; border-radius: 0; }
  /* the screen takes the room the shape no longer claims, and the row keeps
     its place under it, so there is always a way back out of full screen */
  .vr-pane.pos-full .vr-screen { flex: 1 1 auto; aspect-ratio: auto; }
  /* Only the picture goes full screen, and the transport is outside the pane, so no
     rule is needed. Escape exits both element fullscreen and fullscreen.mjs's cover.
     See lessons/page-videoradio.md#videoradio-5 */
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';
  import { createModulator } from '/shell/pappus-mod.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { allocBuffers, startPappusSynth, applyAudibleDefaults, setParam,
           PAPPUS_NODE, RING_SECONDS } from '/shell/pappus.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import * as FS from '/shell/fullscreen.mjs';
  // Static imports, never a dynamic import in a press handler: an await before a
  // gesture-gated call spends the user activation it needs.
  // See lessons/page-videoradio.md#videoradio-6
  import {
    BUF_SECONDS, STATIONS, RELAY, srcOf, nameOf, indexOfId, askHealth,
    PATCHES, LANES, MOD_SPECS, MOD_FOLLOWERS, MOD_CMD, MOD_HZ, MOD_DESTS,
    FOLLOWER_NAMES, LAYOUT_VERSION, basesOf, routesOf, morphOf,
    writeDiscrete, writeContinuous, lockRate, createFeatures, voicesOf, winPos,
  } from '/shell/radio-gran.mjs';
  import { createScanField, LOOKS, DEFAULT_LOOK, FIELD_W, FIELD_H, DATA_W, DATA_H, at, u8,
           LIT_FLOOR, LIT_RANGE, WET_FLOOR, WET_RANGE } from '/shell/scan-field.mjs';

  // The radio instrument with every decision given to a clock: a tour between
  // sounds, a breathing blend, a station that changes, loops that come and go. The
  // machine is imported from radio-gran.mjs; /archive/radio/ still has its own copy.
  // See lessons/page-videoradio.md#videoradio-7

  const BASE = new URLSearchParams(location.search).get('base') || RELAY;
  /**
   * Self-checks are off unless `?selfcheck=1`, never for a visitor: the check presses
   * full screen and would take a visitor's away. verify.mjs and verify-gl.mjs append
   * it, and this page opens ERR mounts, so verify-gl on it is not a dev-loop command.
   * See lessons/page-videoradio.md#videoradio-8
   */
  // Either tier: an ordinary run grades the picture and engine; `DEMO_DEEP=1 node
  // demo/verify-gl.mjs videoradio` adds the darkening watch, morph, lanes, loops,
  // station change and full screen.
  // See lessons/page-videoradio.md#videoradio-9
  const CHECK = SELFCHECK;

  // ── the tour's clock ──
  // Every phase is a function of the clock, never an accumulator, so a late tick or
  // a backgrounded tab costs resolution and never position.
  // See lessons/page-videoradio.md#videoradio-10
  const DWELL_MS = 22000;          // how long one sound is held
  const MORPH_MS = 9000;           // how long the slide into the next one takes
  const SLOT_MS = DWELL_MS + MORPH_MS;
  const DWELL_FRAC = DWELL_MS / SLOT_MS;
  // Not a multiple of the slot: 31 s slots against 71 s stations pair differently
  // each time round, so the page does not repeat every six minutes.
  // See lessons/page-videoradio.md#videoradio-11
  const STATION_MS = 71000;
  const HEALTH_MS = 90000;         // one upstream connection per station asked about
  // The blend's ends are neither 0 nor 1: at 0 the granulator is inaudible under a
  // picture of it, at 1 the station is gone and the instrument has no material.
  // See lessons/page-videoradio.md#videoradio-12
  const WET_MIN = 0.25, WET_MAX = 0.92;
  // How long a grain mark takes to fade, in seconds, as a time constant. The
  // shader is handed `exp(-dt / TAU)` per frame rather than a per-frame
  // fraction, so the trail is the same length at 30, 60 and 120 Hz.
  const TRAIL_S = 1.6;
  // Longer while a station is arriving: a decoder swap is about a second without
  // audio, and an ordinary trail would empty and look broken.
  // See lessons/page-videoradio.md#videoradio-13
  const TRAIL_SWITCH_S = 5.0;

  const d = mount({
    name: 'videoradio',
    // Two sentences: what the tour does is watched, not read. Change this when what
    // the page does changes.
    // See lessons/page-videoradio.md#videoradio-14
    what: 'A radio station fed through a granulator, playing itself: twelve '
      + 'sounds, nothing set by hand. It keeps taking a few seconds of whatever '
      + 'is on air and plays them round, up to three of those loops at once, '
      + 'layered over the station still coming in. Across the picture is where '
      + 'in the last eight seconds it is reading, and up is how long each piece '
      + 'lasts.',
    // `readout: null` is the shell's declared opt out: the box is hidden too, and a
    // harness can check it was meant. Sound changes go to the log instead.
    // See lessons/page-videoradio.md#videoradio-15
    readout: null,
    // No log box: lines still go to `__demo.logs`, which the asserts and harness read.
    // See lessons/page-videoradio.md#videoradio-16
    showLog: false,
    // Play is the gesture audio needs; neither resume() nor play() rejects without
    // one, so waiting on either would hang.
    // See lessons/page-videoradio.md#videoradio-17
    controls: [
      // No controls here: they are the transport bar under the picture, in its own box.
      // See lessons/page-videoradio.md#videoradio-18
    ],
  });
  guard(d);

  // No fade-in: the screen draws a true standby picture from the first frame,
  // before any audio exists.
  // See lessons/page-videoradio.md#videoradio-19
  const pane = el('div', 'vr-pane');
  const screen = el('div', 'vr-screen');
  const canvas = el('canvas');
  canvas.width = FIELD_W; canvas.height = FIELD_H;
  screen.append(canvas);
  // The pane holds the picture and nothing else. Every log line carries its own
  // timestamp, so there is no seconds counter.
  // See lessons/page-videoradio.md#videoradio-20
  pane.append(screen);
  d.el.append(pane);

  /**
   * The transport under the picture, in its own box. The deck holds nothing and
   * follows the wall clock, like /archive/radio/'s; `actuate()` is empty but needed,
   * since a deck with no adapter throws before `d.ready()`.
   * See lessons/page-videoradio.md#videoradio-21
   */
  const SPAN_MS = 60000;
  const deckT0 = Date.now();
  const deck = createDeck({
    items: [],
    adapters: { radio: { actuate() {} } },
    range: [deckT0 - SPAN_MS, deckT0],
  });
  deck.seek(deckT0);
  // Both ends move, once a second: the right edge is now and the left trails it.
  setInterval(() => {
    const t = Date.now();
    deck.setRange([t - SPAN_MS, t]);
    if (deck.playing()) deck.seek(t);
  }, 1000);

  /**
   * `live: true` shows the badge instead of a clock, `scrub: false` because there
   * is nowhere to drag, and `loopSlot` puts ⛶ where /archive/radio/ keeps LOOP.
   * See lessons/page-videoradio.md#videoradio-22
   */
  const bar = createTransportBar(d.el, deck, {
    absolute: true, scrub: false, endStop: false, live: true, loop: false,
    loopSlot: [{
      id: 'full', label: '⛶', aria: 'full screen', title: 'full screen',
      // The kit's toggle, never requestFullscreen by hand: an iPhone lacks it and `?.()`
      // skips silently, a control that looks live and is inert.
      // See lessons/page-videoradio.md#videoradio-23
      onPress: async () => {
        const by = await FS.toggle(pane);
        d.log(by === 'exit' ? 'back out of full screen'
          : `full screen by the ${by === 'element' ? 'browser’s own API'
            : 'fallback cover, which needs no API'}`);
      },
    }],
  });
  FS.watch(pane, () => {});

  /**
   * The badge reads `on air` from blocks arriving (`stream.stats().blocks`, in the
   * tick below), not from a build-time flag. `since: null`: `unknown` before play.
   * `tuning in` expires one second before openStream gives up on the mount (9 s).
   * See lessons/page-videoradio.md#videoradio-24
   */
  const onAir = bar.api.live;
  const onAirIdle = () => onAir.follow({ everyMs: 1000, misses: 4, since: null, comingMs: 8000 });
  onAirIdle();
  // blocks decoded off the open stream. -1 means there is no stream. A count is
  // only comparable against itself, so every new stream starts from -1 or the
  // old station's total would have to be passed before the badge said anything.
  let heardMark = -1;



  // No idle fade: the transport is its own box under the picture.
  // See lessons/page-videoradio.md#videoradio-25

  // ═══ the picture ═══
  // Draw the instrument, not the sound (plans/plan-audio-shader.md §0). Across is
  // the read position in the eight seconds, up is grain length (2 ms to 4 s).
  // See lessons/page-videoradio.md#videoradio-26
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false,
                                           preserveDrawingBuffer: false });
  let renderer = null, glErr = 0, frames = 0, fps = 0;

  // The picture is /shell/scan-field.mjs, shared with /shader/landscape/, compiled
  // baked here. The 64 x 4 data texture's layout is in that module's header.
  // See lessons/page-videoradio.md#videoradio-27
  const data = new Uint8Array(DATA_W * DATA_H * 4);
  data[at(63, 3)] = LAYOUT_VERSION;

  const LOOK_NAME = (() => {
    const want = new URLSearchParams(location.search).get('look');
    return Object.hasOwn(LOOKS, want) ? want : DEFAULT_LOOK;
  })();
  const LOOK = LOOKS[LOOK_NAME];

  /**
   * No look picker: `quartz` is the default, `?look=<name>` still selects from
   * LOOKS, and demo/videoradio/looks/compare.html shows them side by side.
   * See lessons/page-videoradio.md#videoradio-28
   */

  /**
   * Why full screen ended, logged at the moment it happens. `beforeunload` fires
   * before `fullscreenchange` on a navigation, so a reload (our bug) is told apart
   * from Escape.
   * See lessons/page-videoradio.md#videoradio-29
   */
  let leaving = null, wasCover = false;
  // It ships as well as logs, by beacon, which survives an unload; nobody sees the
  // log in full screen.
  // See lessons/page-videoradio.md#videoradio-30
  const fsShip = (line) => {
    try {
      navigator.// `/log`, singular: `/logs` is the read path and drops a POST. See lessons/page-videoradio.md#videoradio-31
      // See lessons/page-videoradio.md#videoradio-32
      sendBeacon('https://pub.positron.studio/log',
        new Blob([`videoradio ${line}`], { type: 'text/plain' }));
    } catch { /* a diagnostic may never make the page worse */ }
  };
  addEventListener('beforeunload', () => { leaving = 'the page navigated or reloaded'; });
  addEventListener('pagehide', () => { leaving = leaving || 'the page was hidden'; });
  const fsSay = (line, kind) => { d.log(line, kind); fsShip(line); };
  /**
   * Station changes ship too, so a fullscreen exit can be lined up against a switch
   * by timestamp.
   * See lessons/page-videoradio.md#videoradio-33
   */
  const stationShip = (line) => fsShip(`station · ${line}`);
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) { fsSay(`full screen, by the element API · ${Math.round(performance.now() / 100) / 10}s in`); return; }
    /**
     * `document.hasFocus()` and `visibilityState` tell a key press from the window or
     * tab going to the background.
     * See lessons/page-videoradio.md#videoradio-34
     */
    const why = leaving ? leaving
      : !document.hasFocus() ? `the window was not focused · visibility ${document.visibilityState}`
      : `the window WAS focused, so Escape or the browser itself · visibility ${document.visibilityState}`;
    fsSay(`left full screen · ${why} · ${Math.round(performance.now() / 100) / 10}s in`, 'warn');
  });
  // The fallback cover fires no event when it goes away, so this watches the class.
  // See lessons/page-videoradio.md#videoradio-35
  new MutationObserver(() => {
    // `pos-faux` only: `pos-full` is set by both paths, so watching it would report an
    // element-API entry twice.
    // See lessons/page-videoradio.md#videoradio-36
    const cover = pane.classList.contains('pos-faux');
    if (cover !== wasCover) { wasCover = cover; fsSay(cover ? 'full screen, by the cover' : 'the cover was taken off', cover ? undefined : 'warn'); }
  }).observe(pane, { attributes: true, attributeFilter: ['class'] });


  /**
   * `?bare=1` leaves only the picture, for comparing looks. It hides rather than
   * skips, so everything is still built and published on `__demo`.
   * See lessons/page-videoradio.md#videoradio-37
   */
  // The rhythm is `.pos-stack` and it owns both sides of every gap, so taking the
  // air out has to say both.
  // See lessons/page-videoradio.md#videoradio-38
  const BARE = new URLSearchParams(location.search).get('bare') === '1';
  if (BARE) {
    const css = document.createElement('style');
    css.textContent = `.pos-head, .pos-what, .pos-controls, .pos-readout, .pos-log { display: none !important; }
      body { padding: 0 !important; }
      .pos-stack > * { margin-top: 0 !important; margin-bottom: 0 !important; }
      .vr-pane { border: 0; border-radius: 0; }`;
    document.head.append(css);
  }


  // `createScanField` in `/shell/scan-field.mjs` is the chain that lived here.

  let pic = null;
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    try { pic = createScanField(gl, { look: LOOK }); } catch (e) { d.log(`the picture did not compile: ${e.message}`, 'bad'); }
    // the standby picture starts here, not at play: the screen is shown from
    // the first frame and has to have something true in it
    if (pic) requestAnimationFrame(frame);
  } else {
    d.log('this browser draws no 3-D, so there is no picture to draw', 'bad');
  }
  // verify-gl.mjs reads this and refuses to grade a software rasteriser, and
  // it also checks that the page and the harness name the SAME renderer. A page
  // that cannot say which card it got produces numbers about nothing.
  window.__demo.gl = { renderer, ok: !!gl };

  // ═══ the audio ═════════════════════════════════════════════════════════════
  let ctx = null, srcNode = null, liveIn = null, liveDuck = null, analyser = null;
  let dry = null, speakers = null, gate = null, sink = null, sinkBuf = null;
  let preGate = null, preBuf = null;
  let loopRing = null, loopTap = null, loopOut = null;
  let stream = null, feats = null, modulator = null, eng = null;
  // No favourite station: this page rotates on its own, so the first choice is made
  // from the health answer, below, not hard-coded.
  // See lessons/page-videoradio.md#videoradio-39
  let station = STATIONS[0][1];
  let started = false, wet = WET_MIN, grains = 0, ringFilled = false;
  const avail = new Map();
  // Declared here, above the checks that read it, so nothing reads it in its
  // temporal dead zone. Every field is written out so a typo is not undefined.
  // See lessons/page-videoradio.md#videoradio-40
  const G = { def: null, bufs: null, running: false, grains: 0 };
  /** True only while the page is exercising its own controls. */
  let checking = false;

  /**
   * Nothing reaches a speaker until a trusted press: harness clicks are untrusted,
   * so the machine runs and every check passes in silence. A gain node at 0 or 1,
   * never a disconnect (Web Audio pulls); graded by an analyser either side.
   * See lessons/page-videoradio.md#videoradio-41
   */
  let asked = false;
  const openGate = () => {
    asked = true;
    if (gate && ctx) gate.gain.setTargetAtTime(1, ctx.currentTime, 0.005);
  };
  // Capture phase on pointerdown, which fires before click, so the gate is open
  // before the shell's own handler runs.
  // See lessons/page-videoradio.md#videoradio-42
  setTimeout(() => {
    // the bar's play toggle, which is the only control on this page that starts
    // sound. `d.button('play')` was this page's own button and there is none.
    const b = bar?.el?.querySelector('.tbar-toggle');
    b?.addEventListener('pointerdown', (e) => { if (e.isTrusted) openGate(); }, true);
    b?.addEventListener('keydown', (e) => { if (e.isTrusted) openGate(); }, true);
  }, 0);

  function graph() {
    if (ctx) return;
    // On iOS a WebAudio-only page gets the ambient session that the ring switch mutes.
    // Capability test, never a platform check.
    // See lessons/page-videoradio.md#videoradio-43
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; }
    catch (e) { d.log(`could not claim a playback audio session: ${e.message}`); }
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    // A stable gain is the engine's input: scsynth is wired to it once at boot, and a
    // station change replaces the stream behind it.
    // See lessons/page-videoradio.md#videoradio-44
    srcNode = ctx.createGain();
    liveIn = ctx.createGain();          // the station's way in, and what a loop records
    // The duck is a second node downstream of the ring's tap, so new seconds of the
    // station can be kept while three loops play.
    // See lessons/page-videoradio.md#videoradio-45
    liveDuck = ctx.createGain();
    liveIn.connect(liveDuck);
    liveDuck.connect(srcNode);

    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    // No smoothing: one of the six features is a rate of change, and per-call
    // smoothing would make it depend on the frame rate.
    // See lessons/page-videoradio.md#videoradio-46
    analyser.smoothingTimeConstant = 0;
    dry = ctx.createGain();
    srcNode.connect(analyser);
    analyser.connect(dry);

    // One way out for everything that sounds, so the meter hears the instrument as
    // well as the station.
    // See lessons/page-videoradio.md#videoradio-47
    speakers = ctx.createGain();
    dry.connect(speakers);
    gate = ctx.createGain();
    gate.gain.value = asked ? 1 : 0;
    speakers.connect(gate);
    // One analyser either side of the gate: they see the same samples with one gain
    // between them, so only the gain can separate their readings.
    // See lessons/page-videoradio.md#videoradio-48
    preGate = ctx.createAnalyser();
    preGate.fftSize = 2048;
    preGate.smoothingTimeConstant = 0;
    preBuf = new Float32Array(preGate.fftSize);
    speakers.connect(preGate);
    sink = ctx.createAnalyser();
    sink.fftSize = 2048;
    sink.smoothingTimeConstant = 0;
    sinkBuf = new Float32Array(sink.fftSize);
    gate.connect(sink);
    sink.connect(ctx.destination);

    // ── the loop's own audio ──
    // A ring filled on the audio thread, not analyser frames (which overlap and gap).
    // It taps liveIn, not dry, so a loop records the station rather than the blend.
    // See lessons/page-videoradio.md#videoradio-49
    const len = Math.round(BUF_SECONDS * ctx.sampleRate);
    loopRing = { len, ch: [new Float32Array(len), new Float32Array(len)], w: 0, filled: 0, on: false };
    // A ScriptProcessor on purpose: it only copies two blocks. Wired to a silent sink,
    // because a node with no path to the destination is never pulled.
    // See lessons/page-videoradio.md#videoradio-50
    loopTap = ctx.createScriptProcessor(4096, 2, 2);
    loopTap.onaudioprocess = (e) => {
      const R = loopRing;
      if (!R?.on) return;
      const n = e.inputBuffer.length;
      for (let c = 0; c < 2; c++) {
        const src = e.inputBuffer.getChannelData(Math.min(c, e.inputBuffer.numberOfChannels - 1));
        const dst = R.ch[c];
        let w = R.w;
        for (let i = 0; i < n; i++) { dst[w] = src[i]; w = w + 1 === R.len ? 0 : w + 1; }
        if (c === 1) R.w = w;
      }
      R.filled = Math.min(R.len, R.filled + n);
    };
    const tapSink = ctx.createGain();
    tapSink.gain.value = 0;
    liveIn.connect(loopTap);
    loopTap.connect(tapSink);
    tapSink.connect(ctx.destination);

    // Into srcNode, not the destination, so the granulator, analyser, blend and meter
    // all get the loop.
    // See lessons/page-videoradio.md#videoradio-51
    loopOut = ctx.createGain();
    loopOut.gain.value = 0;
    loopOut.connect(srcNode);

    feats = createFeatures(analyser, ctx.sampleRate);

    // iOS has a fourth AudioContext state, interrupted, and it does not come
    // back on its own.
    ctx.addEventListener?.('statechange', () => {
      if (ctx.state === 'running') return;
      d.log(`the browser ${ctx.state} the audio; asking for it back`);
      ctx.resume?.().catch(() => {});
    });
    addEventListener('pointerdown', () => {
      if (ctx && ctx.state !== 'running') ctx.resume?.().catch(() => {});
    }, { passive: true });
  }

  // ── the stream, and which station it points at ──
  // `stream === null` means nothing is being listened to, possibly for minutes; the
  // picture, tour and engine run on, and the poll below brings a station back.
  // See lessons/page-videoradio.md#videoradio-52
  let switchedAt = -1e9;

  function closeStream() {
    if (!stream) return;
    try { stream.stop(); } catch { /* already stopped */ }
    stream = null;
  }
  function openStream() {
    closeStream();
    // A mount has been asked for and nothing has come back yet, which is the
    // one state between `unknown` and an answer. The mark starts over with it.
    onAir.coming();
    heardMark = -1;
    const mine = createMp3Stream(ctx, {
      url: srcOf(BASE, station),
      onTitle: (t) => { if (/[\p{L}\p{N}]/u.test(t)) d.log(`now playing: ${t}`, 'hi'); },
      log: (m) => d.log(m),
    });
    stream = mine;
    mine.node.connect(liveIn);
    window.__stream = mine;                     // a lab handle; harmless in a page
    mine.started.catch(() => {});
    // An outcome-gated fallback, not a second probe: the stream failing is the
    // evidence. It logs a line, so an emptying picture is not a mystery.
    // See lessons/page-videoradio.md#videoradio-53
    setTimeout(() => {
      if (stream !== mine) return;
      if (mine.stats().blocks > 0) return;
      dropStation(station, 'answered and then sent nothing, so it is being left out');
    }, 9000);
  }

  /**
   * A mount has stopped delivering: leave it out, move to the next one answering,
   * and if there is none stop listening entirely, so `stream === null` means nothing
   * to listen to.
   * See lessons/page-videoradio.md#videoradio-54
   */
  function dropStation(id, why) {
    avail.set(id, false);
    d.log(`${nameOf(id)} ${why}`, 'bad');
    const next = pickStation(id);
    if (next) { switchTo(next, 'it is the next one answering'); return; }
    closeStream();
    d.log('every mount is refusing, so there is nothing to play. The picture runs on '
      + 'what the granulator still holds', 'bad');
  }

  /**
   * The next station not known to be down, after this one. `!== false`: an unknown
   * stays in the rotation. Returns null rather than wrapping round to this one.
   * See lessons/page-videoradio.md#videoradio-55
   */
  function pickStation(from = station) {
    const here = Math.max(0, indexOfId(from));
    for (let i = 1; i <= STATIONS.length; i++) {
      const [, id] = STATIONS[(here + i) % STATIONS.length];
      if (id === from) continue;
      if (avail.get(id) !== false) return id;
    }
    return null;
  }
  function switchTo(id, why) {
    if (!id || id === station) return false;
    station = id;
    switchedAt = performance.now();
    jolt = 1;
    d.log(`${nameOf(id)} · ${why}`, 'hi');
    if (started) openStream();
    return true;
  }
  /**
   * The station clock's move, about once a minute. With nothing playing it starts
   * the first mount that answers, so an outage never needs a reload.
   * See lessons/page-videoradio.md#videoradio-56
   */
  function nextStation(why) {
    const id = pickStation();
    if (!id) {
      if (!stream && avail.get(station) !== false) { openStream(); return true; }
      return false;
    }
    if (!stream) { station = id; switchedAt = performance.now(); openStream(); d.log(`${nameOf(id)} · ${why}`, 'hi'); stationShip(`opened ${nameOf(id)}`); return true; }
    stationShip(`switching to ${nameOf(id)} · ${why}`);
    const out = switchTo(id, why);
    stationShip(`switched, fullscreenElement=${document.fullscreenElement ? 'yes' : 'no'}`);
    return out;
  }

  // ═══ the tour ═══
  // What slides and what steps is an engine fact, in radio-gran.mjs: continuous
  // controls slide in their own lane, the rest and the routes step once at the middle.
  // See lessons/page-videoradio.md#videoradio-57
  let tourFrom = performance.now();
  let loaded = null, lockedRate = null;
  let routedNow = new Set();
  const modNow = {};                  // what the modulator last SENT, per destination
  let morphK = 0, fromIdx = 0, toIdx = 1;
  // Computed at 25 Hz and read at frame rate, not computed twice.
  // See lessons/page-videoradio.md#videoradio-58
  let lastMorph = null;

  const tourPos = () => (performance.now() - tourFrom) / SLOT_MS;
  const slotOf = (p) => Math.floor(p);
  const withinOf = (p) => p - Math.floor(p);
  const kOf = (within) => (within <= DWELL_FRAC ? 0 : (within - DWELL_FRAC) / (1 - DWELL_FRAC));

  /** Which sound this instant is between, and how far. */
  function tourNow(pos = tourPos()) {
    const slot = slotOf(pos), within = withinOf(pos);
    const a = ((slot % PATCHES.length) + PATCHES.length) % PATCHES.length;
    const b = (a + 1) % PATCHES.length;
    return { slot, within, a, b, k: kOf(within) };
  }

  /**
   * The blend follows the tour, not a free LFO: it opens over the first half of a
   * sound and closes over the second, so handovers happen with the station audible.
   * See lessons/page-videoradio.md#videoradio-59
   */
  const wetFor = (within) => WET_MIN + (WET_MAX - WET_MIN) * (0.5 - 0.5 * Math.cos(2 * Math.PI * within));

  function setWet(v) {
    wet = Math.max(0, Math.min(1, v));
    if (eng) eng.out.gain.value = wet;
    if (dry) dry.gain.value = 1 - wet;
  }

  /**
   * Land on a sound: discrete values, the bases, then the routes. setRoutes sends
   * the base of unmodulated destinations, so it runs after the bases are the new ones.
   * See lessons/page-videoradio.md#videoradio-60
   */
  function land(p) {
    if (!eng) return;
    loaded = p;
    writeDiscrete(eng, p, { bufSeconds: BUF_SECONDS });
    const base = basesOf(p);
    for (const [k, v] of Object.entries(base)) modulator?.setBase(k, v);
    const routes = routesOf(p);
    modulator?.setRoutes(routes);
    routedNow = new Set(routes.map((r) => r.dest));
    // A sound change goes in the log once, with the count of moving settings.
    // See lessons/page-videoradio.md#videoradio-61
    jolt = 1;   // a sound change is the other thing the picture tears on
    d.log(`${p.name} · ${p.says} · ${routedNow.size} walking`);
    // A lock made for the previous sound's figure does not divide this one's.
    if (loopState === 'on') relock();
  }

  /**
   * One pass of the tour at the modulator's rate. The morph moves a routed control's
   * base and writes the others itself: two writers at 25 Hz are a square wave, which
   * writeContinuous's skip of the routed set avoids.
   * See lessons/page-videoradio.md#videoradio-62
   */
  function tourTick() {
    if (!eng || !modulator) return;
    const t = tourNow();
    const A = PATCHES[t.a], B = PATCHES[t.b];
    const m = morphOf(A, B, t.k);
    morphK = m.k; fromIdx = t.a; toIdx = t.b; lastMorph = m;
    if (m.at !== loaded) land(m.at);

    // A locked grain clock outranks the morph: while a loop plays the grain rate
    // belongs to the lap. Written here, not fought over afterwards.
    // See lessons/page-videoradio.md#videoradio-63
    const values = { ...m.values };
    if (lockedRate != null) values.rate = lockedRate;

    // The base is the morphed value, not the arriving sound's, or routed controls
    // jump at the crossover while the rest glide.
    // See lessons/page-videoradio.md#videoradio-64
    const bases = basesOf(m.at);
    for (const k of Object.keys(bases)) {
      const moved = values[k];
      modulator.setBase(k, typeof moved === 'number' ? moved : bases[k]);
    }
    writeContinuous(eng, values, { scanmode: m.at.scanmode, bufSeconds: BUF_SECONDS, skip: routedNow });
    modulator.tick();
    setWet(wetFor(t.within));
  }

  // ═══ the loop ═══
  // Four ways, each a different mechanism: round, back (mirrored), half (half speed),
  // chop (a sixteenth repeating). Each new layer gets the next way.
  // See lessons/page-videoradio.md#videoradio-65
  const LOOP_WAYS = ['round', 'back', 'half', 'chop'];
  const CHOP_DIV = 16, CHOP_MIN_S = 0.12;
  // Up to three layers of different lengths into one granulator; lengths are not
  // multiples, so they rarely come back into phase. The ring taps the station
  // upstream of the loops, so a new layer holds only what is on air.
  // See lessons/page-videoradio.md#videoradio-66
  const MAX_LAYERS = 3;
  const LOOP_LENS = [3, 8, 2, 5, 1.5, 4];      // seconds kept, in turn
  const ARM_GAP_MS = 2600;                     // quiet between one layer and taking the next
  const LAYER_LIFE_MS = 32000;                 // how long a layer stays before it is let go
  const DUCK = 0.22;                           // what is left of the live station under a stack
  const layers = [];                           // oldest first
  let loopState = 'off';               // off | filling | on
  let loopCount = 0, loopBuf = null;
  let voiceAt = 0, voiceFrom = 0, voiceTo = 0, voiceRate = 1, voiceBack = false;
  let loopWant = 0;                    // seconds to keep before setting the loop
  let lastArm = -1e9;                  // when the last layer landed, for the gap above

  /**
   * Mirrored samples, not a negative rate: playbackRate cannot go below zero. Built
   * on the first loop that needs one.
   * See lessons/page-videoradio.md#videoradio-67
   */
  function reversedCopy(buf) {
    const out = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const src = buf.getChannelData(c), dst = out.getChannelData(c);
      for (let i = 0, n = buf.length; i < n; i++) dst[i] = src[n - 1 - i];
    }
    return out;
  }

  /** Where the SOUND is in the kept seconds, from the voice's own clock. */
  function loopHeadFrac() {
    if (!ctx || !layers.length || !loopBuf) return null;
    const lap = voiceTo - voiceFrom, whole = loopBuf.duration;
    if (!(lap > 0) || !(whole > 0)) return null;
    const into = Math.max(0, ctx.currentTime - voiceAt) * voiceRate;
    const p = voiceFrom + (into % lap);
    // Sample i of the reversed buffer is sample n-1-i of what the picture draws.
    return Math.min(1, Math.max(0, (voiceBack ? whole - p : p) / whole));
  }

  /**
   * How loud each layer is, recomputed when the stack changes. Newest loudest, each
   * older a third down, so three copies do not arrive at the granulator clipping.
   * See lessons/page-videoradio.md#videoradio-68
   */
  function balance() {
    if (!ctx) return;
    const n = layers.length;
    layers.forEach((l, i) => {
      const age = n - 1 - i;                       // 0 is the newest
      const want = 0.68 ** age / Math.sqrt(Math.max(1, n));
      l.gain.gain.setTargetAtTime(want, ctx.currentTime, 0.05);
    });
  }

  /**
   * Let a layer go: down over ~80 ms, then stopped and unwired. The stop is timed
   * after the fade; stopping as the fade starts is a click.
   * See lessons/page-videoradio.md#videoradio-69
   */
  function retire(l) {
    if (!l || !ctx) return;
    l.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
    setTimeout(() => {
      try { l.src.stop(); } catch { /* already done */ }
      try { l.gain.disconnect(); } catch { /* already done */ }
    }, 500);
  }

  function startLoopVoice(way, from = loopBuf) {
    if (!ctx || !from || !loopOut) return 0;
    const back = way === 'back';
    const buf = back ? reversedCopy(from) : from;
    const whole = buf.duration;
    const lap = way === 'chop'
      ? Math.min(whole, Math.max(CHOP_MIN_S, whole / CHOP_DIV))
      : whole;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = 0;
    src.loopEnd = lap;
    // Varispeed in powers of two, so a k-bar loop stays a whole number of bars and the
    // grain clock lock survives. The speed walks at most one notch per loop.
    // See lessons/page-videoradio.md#videoradio-70
    const STEPS = [0.25, 0.5, 1, 2];
    if (way === 'half') varistep = 1;
    else varistep = Math.max(0, Math.min(STEPS.length - 1,
      varistep + (jolt > 0.5 ? 0 : [-1, 0, 0, 1][Math.floor(driftPhase * 4) & 3])));
    src.playbackRate.value = STEPS[varistep];
    // Its own gain, not loopOut's, which carries the whole stack.
    // See lessons/page-videoradio.md#videoradio-71
    const g = ctx.createGain();
    g.gain.value = 0;
    src.connect(g);
    g.connect(loopOut);
    const when = ctx.currentTime;
    src.start(when, 0);
    layers.push({ src, gain: g, at: when, from: 0, to: lap,
                  rate: src.playbackRate.value, back, way, bornAt: performance.now() });
    // When full, the oldest is faded and stopped: an unreferenced source plays on
    // forever.
    // See lessons/page-videoradio.md#videoradio-72
    while (layers.length > MAX_LAYERS) retire(layers.shift());
    balance();
    // What the picture, the lock and the checks read is the NEWEST layer: one
    // head to draw, one lap to tune to, and the one a listener is hearing
    // arrive. The older ones are audible and are not claimed to be measured.
    loopBuf = from;
    voiceAt = when; voiceFrom = 0; voiceTo = lap;
    voiceRate = src.playbackRate.value; voiceBack = back;
    return lap;
  }

  /** Tune the grain clock to the lap that is actually playing, or say why not. */
  function relock() {
    if (!eng || !loaded) return;
    // The lap at speed 1 (the buffer span), not wall time: at any power of two speed
    // it is still a whole number of bars.
    // See lessons/page-videoradio.md#videoradio-73
    const seconds = voiceTo - voiceFrom;
    // subdivide fits a whole number of laps into the figure when the figure is longer
    // than half the lap; without it most sounds refuse the lock.
    // See lessons/page-videoradio.md#videoradio-74
    const r = lockRate(seconds, { rate: loaded.rate, elen: loaded.elen, name: loaded.name,
      subdivide: true });
    lockedRate = r.rate;
    d.log(r.rate == null ? r.why : `${r.why} (${seconds.toFixed(2)} s, ${r.rate.toFixed(2)} grains a second)`,
      r.rate == null ? undefined : 'hi');
  }

  /**
   * What state the loop is in, derived. `on` means something is looping; the ring's
   * own flag means something is being kept, which can happen while layers play.
   * See lessons/page-videoradio.md#videoradio-75
   */
  function syncLoopState() {
    loopState = layers.length ? 'on' : (loopRing?.on ? 'filling' : 'off');
  }

  function armLoop(seconds = BUF_SECONDS) {
    if (!loopRing || loopRing.on) return;
    loopWant = Math.min(BUF_SECONDS, seconds);
    loopRing.w = 0; loopRing.filled = 0; loopRing.on = true;
    syncLoopState();
    d.log(`keeping the next ${loopWant.toFixed(1)} s to loop over`);
  }

  function setLoop() {
    const n = loopRing.filled;
    if (n < ctx.sampleRate * 0.25) {
      d.log('nothing was playing, so there is nothing to loop', 'warn');
      loopRing.on = false; syncLoopState();
      return false;
    }
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    // Unwrapped back into order: once the ring wraps its oldest sample is at w.
    // See lessons/page-videoradio.md#videoradio-76
    const start = loopRing.filled === loopRing.len ? loopRing.w : 0;
    for (let c = 0; c < 2; c++) {
      const dst = buf.getChannelData(c), src = loopRing.ch[c];
      for (let i = 0; i < n; i++) dst[i] = src[(start + i) % loopRing.len];
    }
    loopRing.on = false;
    const way = LOOP_WAYS[loopCount % LOOP_WAYS.length];
    loopCount++;
    startLoopVoice(way, buf);
    lastArm = performance.now();
    // 12 ms either way rather than a step: a gain cut mid-sample is a click, and
    // a click every time a loop closes is the page making the noise.
    loopOut.gain.setTargetAtTime(1, ctx.currentTime, 0.012);
    // The station's level, not dry, which the blend owns. It ducks to a fifth rather
    // than closing, so the loops sit on what is on air now.
    // See lessons/page-videoradio.md#videoradio-77
    liveDuck.gain.setTargetAtTime(DUCK, ctx.currentTime, 0.012);
    syncLoopState();
    d.log(`${(n / ctx.sampleRate).toFixed(1)} s of the station, playing ${way} `
      + `· ${layers.length} loop${layers.length === 1 ? '' : 's'} going`, 'hi');
    relock();
    return true;
  }

  /** Let the oldest layer go, and give the station back if it was the last. */
  function dropOldest() {
    if (!layers.length) return;
    retire(layers.shift());
    balance();
    if (!layers.length) {
      lockedRate = null;
      if (loopOut) loopOut.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
      if (liveDuck) liveDuck.gain.setTargetAtTime(1, ctx.currentTime, 0.2);
      loopBuf = null;
      d.log('back to the station');
    } else {
      // The newest is still the one the picture draws and the clock follows,
      // and it has not changed, so there is nothing to retune.
      d.log(`a loop was let go · ${layers.length} still going`);
    }
    syncLoopState();
  }

  function endLoop() {
    if (loopState === 'off' && !layers.length) return;
    if (loopRing) loopRing.on = false;
    lockedRate = null;
    if (loopOut) loopOut.gain.setTargetAtTime(0, ctx.currentTime, 0.012);
    if (liveDuck) liveDuck.gain.setTargetAtTime(1, ctx.currentTime, 0.012);
    while (layers.length) retire(layers.pop());
    loopBuf = null;
    syncLoopState();
    d.log('back to the station');
  }

  /**
   * When a layer is kept and let go: one every few seconds, living about half a
   * minute, oldest first, so two or three lengths usually play together.
   * See lessons/page-videoradio.md#videoradio-78
   */
  function loopTick() {
    // Stands down while the page checks itself, which drives armLoop and setLoop by
    // hand.
    // See lessons/page-videoradio.md#videoradio-79
    if (checking || !eng || !ringFilled || !loopRing) return;
    // A layer is kept on its own cadence, not the tour's 31 s slots: as soon as the
    // last one has played a few seconds.
    // See lessons/page-videoradio.md#videoradio-80
    const now = performance.now();
    if (loopRing.on) {
      if (loopRing.filled >= Math.round(loopWant * ctx.sampleRate)) setLoop();
      return;
    }
    // The oldest goes before the newest arrives, so the stack is never four deep.
    // See lessons/page-videoradio.md#videoradio-81
    if (layers.length && now - layers[0].bornAt > LAYER_LIFE_MS) { dropOldest(); return; }
    if (now - lastArm > ARM_GAP_MS) armLoop(LOOP_LENS[loopCount % LOOP_LENS.length]);
  }

  // ═══ the frame ═══
  // One clock, the frame callback: features, modulator sense, data texture and draw
  // all use one analyser read. Pappus's 25 Hz limit (20 ms Lag.kr) does not apply here.
  // See lessons/page-videoradio.md#videoradio-82
  let pulsePhase = 0, driftPhase = 0, jolt = 0;
  let varistep = 2;   // index into the varispeed ladder; 2 is 1x
  let grainRate = 0;
  const idle = new Uint8Array(DATA_W * DATA_H * 4);
  const buckets = Array.from({ length: DATA_W }, () => ({ n: 0, dsum: 0, v: new Array(8).fill(0), drop: 0 }));
  let everDropped = 0, lastFrame = 0, fpsFrom = 0, fpsCount = 0;
  // The bytes the window's chain was last stepped with. The headset's chain is
  // handed THE SAME ARRAY rather than a second computation of it: see the note
  // where it is set, at the bottom of `frame`.
  let lastBytes = null;
  const sizeLane = LANES.size;
  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;

  /**
   * A bucket counts in one 8-bit channel, so past 255 grains a frame something is
   * lost; the counter makes that visible and the check floods one to prove it fires.
   * See lessons/page-videoradio.md#videoradio-83
   */
  function bucket(pos, dur, voice) {
    const x = Math.min(DATA_W - 1, Math.max(0, Math.floor(winPos(pos, RING_SECONDS, BUF_SECONDS) * DATA_W)));
    const b = buckets[x];
    if (b.n >= 255) { b.drop++; everDropped++; return; }
    b.n++;
    b.dsum += sizeLane.unmap(Math.max(0, Number(dur) || 0));
    b.v[(voice | 0) & 7]++;
  }

  /**
   * Where the read head may be, as a density over the eight seconds. Known only in
   * POSITION mode (winstart + scan*winspan); in STRETCH and DELAY it depends on
   * engine state this page does not hold, so it is zero there.
   * See lessons/page-videoradio.md#videoradio-84
   */
  function windowRow(v, scanmode) {
    const lo = scanmode >= 3 ? 0 : Math.max(0, Math.min(1, v.winstart));
    const hi = scanmode >= 3 ? 1 : Math.max(lo + 0.01, Math.min(1, v.winend));
    const span = hi - lo;
    let centre = null;
    if (scanmode === 2) centre = lo + Math.max(0, Math.min(1, v.scan)) * span;
    // off = ... x mspray x 0.25 is a fraction of the WINDOW, not of the ring.
    const half = Math.max(1 / DATA_W, v.spray * 0.25 * span);
    for (let x = 0; x < DATA_W; x++) {
      const f = (x + 0.5) / DATA_W;
      const inWin = f >= lo && f <= hi ? 1 : 0;
      let dens = 0;
      if (centre != null && inWin) {
        const u = Math.abs(f - centre) / half;
        dens = u >= 1 ? 0 : (1 - u * u);            // a bump, not a box
      }
      const i = at(x, 2);
      data[i] = u8(dens);
      data[i + 1] = inWin ? 255 : 0;
      data[i + 2] = 0;
      data[i + 3] = 255;
    }
    data[at(18, 3)] = centre == null ? 0 : 255;
  }

  let env = {};                     // the follower values, for the picture and the checks
  let lit = false;

  /**
   * `tick` is the body, advancing the picture by a timestamp and so testable;
   * `frame` is the rAF driver.
   * See lessons/page-videoradio.md#videoradio-85
   */
  function frame(now) {
    requestAnimationFrame(frame);
    tick(now);
  }
  function tick(now) {
    if (!pic) return;
    // The standby picture: before play the data is zero except the drift, so the
    // screen draws a true picture of an instrument not yet started.
    // See lessons/page-videoradio.md#videoradio-86
    if (!ctx || !analyser || !feats) {
      const dtIdle = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 1 / 60;
      lastFrame = now;
      driftPhase = (driftPhase + dtIdle * 0.06) % 1;
      idle.fill(0);
      idle[at(21, 3)] = u8(driftPhase);
      idle[at(63, 3)] = LAYOUT_VERSION;
      pic.step(idle);
      frames++;
      lastBytes = idle;
      return;
    }
    const dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 1 / 60;
    lastFrame = now;
    if (!fpsFrom) fpsFrom = now;
    if (++fpsCount >= 30) { fps = (fpsCount * 1000) / (now - fpsFrom); fpsFrom = now; fpsCount = 0; }

    const f = feats.read();
    modulator?.sense(f);
    env = modulator ? (modulator.stats().env || {}) : {};

    // ── row 0: the grains that arrived since the last frame ──
    let got = 0, lost = 0;
    for (let x = 0; x < DATA_W; x++) {
      const b = buckets[x], i = at(x, 0);
      data[i] = Math.min(255, b.n);
      data[i + 1] = b.n ? u8(b.dsum / b.n) : 0;
      let best = 0;
      for (let v = 1; v < 8; v++) if (b.v[v] > b.v[best]) best = v;
      data[i + 2] = b.n ? best * 32 : 0;
      data[i + 3] = Math.min(255, b.drop);
      got += b.n; lost += b.drop;
      b.n = 0; b.dsum = 0; b.drop = 0; b.v.fill(0);
    }

    // ── row 1: every parameter, in its own lane ──
    const base = loaded ? basesOf(loaded) : null;
    for (let x = 0; x < MOD_DESTS.length; x++) {
      const name = MOD_DESTS[x];
      const lane = LANES[name];
      const i = at(x, 1);
      if (!base || !lane) { data[i] = data[i + 1] = data[i + 2] = 0; data[i + 3] = 255; continue; }
      const b = base[name];
      const cur = modNow[name] ?? b;
      if (lane.n) {
        // probs is eight numbers; x 15..22 carry them one at a time and this
        // slot holds their mean, so the row reads the same way either side.
        data[i] = u8(lane.unmap(mean(Array.isArray(cur) ? cur : b)));
        data[i + 1] = u8(lane.unmap(mean(b)));
        for (let j = 0; j < 8; j++) {
          const k = at(15 + j, 1);
          data[k] = u8(lane.unmap((Array.isArray(cur) ? cur : b)[j]));
          data[k + 1] = u8(lane.unmap(b[j]));
          data[k + 2] = routedNow.has(name) ? 255 : 0;
          data[k + 3] = 255;
        }
      } else {
        data[i] = u8(lane.unmap(Number(cur)));
        data[i + 1] = u8(lane.unmap(Number(b)));
      }
      data[i + 2] = routedNow.has(name) ? 255 : 0;
      data[i + 3] = 255;
    }

    // ── row 2: where it is reading from ──
    if (lastMorph) windowRow(lastMorph.values, lastMorph.at.scanmode);

    // ── row 3: the scalars ──
    FOLLOWER_NAMES.forEach((n, i) => { data[at(i, 3)] = u8(env[n] ?? 0); });
    data[at(6, 3)] = u8(wet);
    data[at(7, 3)] = Math.min(255, got);
    data[at(8, 3)] = Math.min(255, lost);
    data[at(9, 3)] = u8(morphK);
    data[at(10, 3)] = u8(fromIdx / Math.max(1, PATCHES.length - 1));
    data[at(11, 3)] = u8(toIdx / Math.max(1, PATCHES.length - 1));
    // How many loops, not whether there is one; the shader warms the field by it.
    // See lessons/page-videoradio.md#videoradio-87
    data[at(12, 3)] = layers.length ? Math.min(255, 105 + 50 * layers.length)
      : (loopRing?.on ? 60 : 0);
    data[at(13, 3)] = u8(loopHeadFrac() ?? 0);
    data[at(14, 3)] = u8(Math.max(0, indexOfId(station)) / Math.max(1, STATIONS.length - 1));
    const since = (performance.now() - switchedAt) / 1000;
    data[at(15, 3)] = u8(Math.max(0, 1 - since / 4));
    // A time constant, so the trail is the same length at any frame rate; stretched
    // for a few seconds after a station change, which has about a second of no audio.
    // See lessons/page-videoradio.md#videoradio-88
    const tau = since < 4 ? TRAIL_SWITCH_S : TRAIL_S;
    data[at(16, 3)] = u8(Math.exp(-dt / tau));
    data[at(17, 3)] = loaded ? voicesOf(loaded) * 32 : 0;
    // Nothing in any shader reads a clock; every pass is a function of this texture and
    // the previous frame, which keeps the determinism check exact. `pulse` advances by
    // grains actually reported, so it stops when the instrument stops.
    // See lessons/page-videoradio.md#videoradio-89
    pulsePhase = (pulsePhase + got * 0.045) % 1;
    data[at(19, 3)] = u8(0.5 - 0.5 * Math.cos(pulsePhase * Math.PI * 2));
    // `jolt` is zero normally, set to 1 when the sound or station changes and decays
    // over about a second, so the picture tears only on an event.
    // See lessons/page-videoradio.md#videoradio-90
    jolt = Math.max(0, jolt - dt * 1.1);
    data[at(20, 3)] = u8(jolt);
    // `drift` is the slow floaty one: a sawtooth on wall time, which is the
    // only place a real clock is allowed, and it is turned into data here
    // rather than read inside a body.
    driftPhase = (driftPhase + dt * 0.06) % 1;
    data[at(21, 3)] = u8(driftPhase);
    data[at(63, 3)] = LAYOUT_VERSION;

    pic.step(data);
    frames++;
    // `lastBytes` keeps this frame's data texture.
    // See lessons/page-videoradio.md#videoradio-91
    lastBytes = data;
    if (!glErr) glErr = gl.getError();

    // The picture is worth showing the moment the engine has reported a grain:
    // before that it is an empty box making a claim about an instrument that has
    // not started.
    if (!lit && grains > 0) { lit = true; pane.classList.add('sounding'); }
  }

  // ── the readout, at human pace ─────────────────────────────────────────────
  let grainsSeen = 0, grainsAt = performance.now();
  setInterval(() => {
    // The `on air` badge, fed above the `started` guard so a stream going away is
    // noticed regardless.
    // See lessons/page-videoradio.md#videoradio-92
    {
      const heard = stream ? stream.stats().blocks : -1;
      if (heard > heardMark) onAir.seen();
      heardMark = heard;
    }
    // Nothing is computed before play.
    // See lessons/page-videoradio.md#videoradio-93
    if (!started) return;
    if (eng) {
      const now = performance.now(), secs = (now - grainsAt) / 1000;
      if (secs > 0.9) {
        // the rate is still COUNTED, and still reaches the checks and the log;
        // what went is the cell that displayed it
        grainRate = Math.max(0, grains - grainsSeen) / secs;
        grainsSeen = grains; grainsAt = now;
      }
    }
  }, 250);


  /**
   * It does not return the promise: the shell would sweep and re-enable a button
   * around it.
   * See lessons/page-videoradio.md#videoradio-94
   */
  /**
   * It stops as well as starts, by muting the master with a 12 ms glide (a stepped
   * gain clicks), not by tearing the graph down, so loops, decoder and tour survive.
   * See lessons/page-videoradio.md#videoradio-95
   */
  let quiet = false;

  /**
   * The bar's toggle shows its icon from `data-state` in CSS; nothing here writes a
   * label. Capture phase on `click` reads the state before the bar flips it, and
   * verify.mjs sends `.click()` with no pointer events.
   * See lessons/page-videoradio.md#videoradio-96
   */
  let quietWanted = false;
  bar.el.addEventListener('click', (e) => {
    if (!e.target.closest?.('.tbar-toggle')) return;
    const willPlay = !deck.playing();
    if (willPlay && !started) {
      start().catch((err) => d.fail(err));
      d.log('the station is starting');
      return;
    }
    quietWanted = !willPlay;
    quiet = quietWanted;
    if (speakers && ctx) speakers.gain.setTargetAtTime(quiet ? 0 : 1, ctx.currentTime, 0.012);
    d.log(quiet ? 'stopped' : 'playing');
  }, { capture: true });

  /**
   * Opt-in autostart, `?auto=1`, for a screen nobody sits at (an engaged site, an
   * installed app, or `--autoplay-policy=no-user-gesture-required`). Nothing awaits
   * resume(); if the browser refuses, nothing changes and nothing is said.
   * See lessons/page-videoradio.md#videoradio-97
   */
  if (new URLSearchParams(location.search).get('auto') === '1') {
    d.run('play');
  }

  // ═══ starting ══════════════════════════════════════════════════════════════
  async function start() {
    started = true;
    graph();
    // Never let sound gate the work: neither rejects without a gesture, so fire and
    // move on.
    // See lessons/page-videoradio.md#videoradio-98
    ctx.resume?.();
    requestAnimationFrame(frame);

    const health = await askHealth(BASE, STATIONS.map(([, id]) => id));
    for (const [id, up] of health) avail.set(id, up);
    // The opening choice wants `=== true` (use the answer in hand); every other test
    // wants `!== false`, so an unknown never blocks.
    // See lessons/page-videoradio.md#videoradio-99
    const up = STATIONS.filter(([, id]) => avail.get(id) === true);
    // A mount the relay just called down is not fetched: it answers 502, the browser
    // logs that to the console unsuppressably, and the decoder would wait 9 s for nothing.
    // See lessons/page-videoradio.md#videoradio-100
    if (!health.size) {
      // No answer at all is not an answer of no: every mount is unknown and is tried.
      // See lessons/page-videoradio.md#videoradio-101
      d.log('the relay did not answer about its mounts, so they are tried in order');
      openStream();
      switchedAt = performance.now();
    } else if (!up.length) {
      d.log('the relay says every mount is down, so there is nothing to play yet. '
        + 'The picture starts anyway and a station is picked up as soon as one answers', 'bad');
    } else {
      station = up[0][1];
      d.log(`${up.length} of ${STATIONS.length} mounts answering, starting on ${nameOf(station)}`);
      openStream();
      switchedAt = performance.now();
    }

    // The station clock and the health poll are separate; the poll never moves you
    // off a working station.
    // See lessons/page-videoradio.md#videoradio-102
    setInterval(() => nextStation('it is time for another one'), STATION_MS);
    /**
     * Slow while playing, three times quicker while nothing is: each poll opens one
     * upstream connection per station asked about, on somebody else's server. A chain
     * of timeouts, so the rate lives in one place.
     * See lessons/page-videoradio.md#videoradio-103
     */
    const poll = async () => {
      if (!document.hidden) {
        const h = await askHealth(BASE, STATIONS.map(([, id]) => id));
        for (const [id, upNow] of h) {
          const was = avail.get(id);
          avail.set(id, upNow);
          if (was === upNow) continue;
          d.log(upNow ? `${nameOf(id)} is back in the rotation` : `${nameOf(id)} stopped answering`,
            upNow ? 'hi' : 'bad');
        }
        // Nothing playing and something answering: take it, without waiting for
        // the station clock.
        if (!stream) {
          const back = STATIONS.find(([, id]) => avail.get(id) === true);
          if (back) { station = back[1]; switchedAt = performance.now(); openStream(); d.log(`${back[0]} · it came back`, 'hi'); }
        }
      }
      setTimeout(poll, stream ? HEALTH_MS : HEALTH_MS / 3);
    };
    setTimeout(poll, stream ? HEALTH_MS : HEALTH_MS / 3);

    // ready() is in a finally, so a throw below still publishes the checks that ran
    // instead of leaving the harness to time out.
    // See lessons/page-videoradio.md#videoradio-104
    try {
      await startEngine();
      if (CHECK) await check();
    } catch (e) {
      d.fail(e);
    } finally {
      d.ready();
    }
  }

  async function startEngine() {
    // Real scsynth granulating a real station: bootScsynth connects the page's audio to
    // hardware input busses 2 and 3, the Pi's inbusl 2 inbusr 3.
    // See lessons/page-videoradio.md#videoradio-105
    try {
      eng = await bootScsynth({
        audioContext: ctx,
        input: srcNode,
        log: (m) => d.log(m),
        onReply: (m) => {
          // m is [address, nodeID, replyID, pos, dur, voice, half]: SendReply prepends two
          // arguments, so pos is index 3 (index 2 is replyID, always -1).
          // See lessons/page-videoradio.md#videoradio-106
          if (m[0] !== '/pgrain') return false;
          grains++;
          bucket(m[3], m[4], m[5]);
          return true;
        },
      });
    } catch (e) {
      d.log(`the granulator did not start: ${e.message}. The radio plays on`, 'bad');
      window.__granErr = String((e && e.stack) || e);
      return;
    }
    // Silence the engine before it can be heard: bootScsynth wires its output at 0.9,
    // and this page starts mostly dry.
    // See lessons/page-videoradio.md#videoradio-107
    eng.out.gain.value = wet;
    // Connected before disconnected: the other order leaves the engine with no path to
    // a destination, and an allocation then never answers.
    // See lessons/page-videoradio.md#videoradio-108
    eng.out.connect(speakers);
    eng.out.disconnect(ctx.destination);
    window.__eng = eng;

    const ringFrom = ctx.currentTime;
    G.bufs = await allocBuffers(eng, { log: (m) => d.log(m) });
    G.def = await eng.recvDef('/grains/defs/pappus-tiny.scsyndef');
    d.log(`Pappus TINY: ${G.def.bytes} B, ${G.def.ok ? `taken in ${G.def.ms} ms` : G.def.why}`);
    G.running = await startPappusSynth(eng);
    applyAudibleDefaults(eng, { live: true, bufSeconds: BUF_SECONDS });

    /**
     * The tap is on the modulator's send, the only place the value exists. This row
     * shows the page asked; the grain row shows the engine answered, so stopping the
     * engine must leave parameters moving while marks stop.
     * See lessons/page-videoradio.md#videoradio-109
     */
    modulator = createModulator({
      now: () => ctx.currentTime,
      send: (name, v) => {
        modNow[name] = Array.isArray(v) ? v.slice() : v;
        setParam(eng, MOD_CMD[name] ?? `m${name}`, v);
      },
      specs: MOD_SPECS,
      followers: MOD_FOLLOWERS,
      warn: (m) => d.log(`modulation refused: ${m}`, 'bad'),
    });

    tourFrom = performance.now();
    land(PATCHES[0]);
    setWet(wetFor(0));
    setInterval(() => { tourTick(); loopTick(); }, 1000 / MOD_HZ);

    // Wait for the ring on played seconds, not a level: it holds BUF_SECONDS, so it is
    // filled once that many seconds have gone in.
    // See lessons/page-videoradio.md#videoradio-110
    for (let i = 0; i < 200 && (ctx.currentTime - ringFrom) < BUF_SECONDS; i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    ringFilled = true;
    G.grains = grains;
    d.log(`the granulator's ${BUF_SECONDS} s ring has been filled once`);
  }

  // ═══ what the checks have to say ═══════════════════════════════════════════

  /**
   * One control, asked of the server with /s_get. Every /n_set is fire and forget,
   * so this is the only evidence about the engine.
   * See lessons/page-videoradio.md#videoradio-111
   */
  async function sGet(name) {
    const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === name, 3000,
      '/s_get', PAPPUS_NODE, name);
    return r ? Number(r[3]) : null;
  }

  /** Per-channel colour spread over a whole frame. See the note where it is used. */
  function spreadOf(px) {
    const lo = [255, 255, 255], hi = [0, 0, 0];
    for (let i = 0; i < px.length; i += 4) {
      for (let k = 0; k < 3; k++) {
        const v = px[i + k];
        if (v < lo[k]) lo[k] = v;
        if (v > hi[k]) hi[k] = v;
      }
    }
    return [hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]];
  }
  const meanRed = (s) => {
    let n = 0;
    for (let i = 0; i < s.px.length; i += 4) n += s.px[i];
    return n / (s.px.length / 4);
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  /**
   * Put the tour at a named place by moving the clock's origin, not with a flag, so
   * the page runs on normally from there. k: 0 is the end of the dwell, 1 is the
   * arriving sound.
   * See lessons/page-videoradio.md#videoradio-112
   */
  const holdTour = (slot, k) => {
    const within = DWELL_FRAC + k * (1 - DWELL_FRAC);
    tourFrom = performance.now() - (slot + within) * SLOT_MS;
  };

  async function check() {
    checking = true;

    // ── the picture ────────────────────────────────────────────────────────
    d.assert('a real WebGL2 context, not a fallback', !!gl, renderer ?? 'none');
    /**
     * The picture must not darken on its own: a feedback loop losing a little per lap
     * passes every one-frame check. Three reads five seconds apart catch it.
     * See lessons/page-videoradio.md#videoradio-113
     */
    if (DEEP) {
      const meanOf = (r) => { const px = r?.px; if (!px?.length) return -1; let t = 0; for (let i = 0; i < px.length; i += 4) t += px[i]; return t / (px.length / 4); };
      const fld = () => meanOf(pic?.readField?.());
      const shw = () => meanOf(pic?.readShown?.());
      const f0 = fld(), s0 = shw();
      const a0 = pic?.readFinal?.(); const m0 = a0 ? meanOf(a0) : -1;
      await new Promise((r) => setTimeout(r, 2500));
      const a1 = pic?.readFinal?.(); const m1 = a1 ? meanOf(a1) : -1;
      await new Promise((r) => setTimeout(r, 2500));
      const a2 = pic?.readFinal?.(); const m2 = a2 ? meanOf(a2) : -1;
      const f2 = fld(), s2 = shw();
      d.assert('the picture does not darken on its own',
        m0 > 0 && m2 > m0 * 0.6,
        `final ${m0.toFixed(2)} -> ${m1.toFixed(2)} -> ${m2.toFixed(2)}`
        + ` · field ${f0.toFixed(2)} -> ${f2.toFixed(2)}`
        + ` · shown ${s0.toFixed(2)} -> ${s2.toFixed(2)} over 5 s`);
    }
    d.assert('the picture compiled, drew, and left no GL error behind',
      !!pic && frames > 0 && glErr === 0,
      `${frames} frames drawn · gl.getError ${glErr}`);
    const before = frames;
    await wait(900);
    d.assert('it keeps drawing, at a real frame rate', frames > before + 20 && fps > 5,
      `${frames - before} frames in 900 ms · ${fps.toFixed(1)} fps at ${FIELD_W}x${FIELD_H}`);

    // Not a flat field, per channel, over the whole frame: four points measure
    // structure and a channel sum can be constant by construction.
    // See lessons/page-videoradio.md#videoradio-114
    const live = pic ? pic.readShown() : null;
    const sp = live ? spreadOf(live.px) : [0, 0, 0];
    // Loudness is in the line because it lights the field. Threshold: three quarters
    // of LIT_FLOOR times the blend's floor share at WET_MIN on --hi's red channel, so
    // it fails when marks are missing, not when the programme is quiet.
    // See lessons/page-videoradio.md#videoradio-115
    const floorSpread = 255 * LIT_FLOOR * (WET_FLOOR + WET_RANGE * WET_MIN) * Number(pic?.shaders.HI[0] ?? 1);
    d.assert('there is a picture in it, not a flat field',
      Math.max(...sp) > floorSpread * 0.75,
      `red spans ${sp[0]}, green ${sp[1]}, blue ${sp[2]}, of 255 against `
      + `${Math.round(floorSpread * 0.75)} the body guarantees · `
      + `the station reads ${(env.rms ?? 0).toFixed(3)} of 1`);

    // The bed has structure without grains, so the check above can pass with none.
    // The accumulate target holds deposits only, so no colour threshold is needed.
    // See lessons/page-videoradio.md#videoradio-116
    const fieldPx = pic ? pic.readField() : null;
    let hot = 0, peak = 0;
    if (fieldPx) {
      for (let i = 0; i < fieldPx.px.length; i += 4) {
        const v = fieldPx.px[i];
        if (v > peak) peak = v;
        if (v > 8) hot++;
      }
    }
    d.assert('the grains reach the picture, and not only the window behind them',
      peak > 40 && hot > 200,
      `${hot} lit pixels in the grain layer, brightest ${peak} of 255 · `
      + `${grains} grains reported over OSC so far`);

    // The separating pair: two renders of held data are byte identical, one changed
    // texel makes them differ. Two passes, not live frames: the picture feeds back,
    // and testRender clears its previous frame first.
    // See lessons/page-videoradio.md#videoradio-117
    const held = new Uint8Array(data.length);
    held[at(63, 3)] = LAYOUT_VERSION;
    held[at(0, 3)] = 220;                       // loud, so whatever is drawn is visible
    held[at(6, 3)] = 255;                       // all granulator, so the marks are not faded
    held[at(16, 3)] = 0;                        // no trail: one pass is the whole picture
    held[at(30, 0)] = 200;                      // one bucket of grains
    held[at(30, 0) + 1] = 128;                  // halfway up the grain-length lane
    const same1 = pic ? pic.testRender(held) : null;
    const same2 = pic ? pic.testRender(held) : null;
    const identical = !!same1 && !!same2 && same1.px.every((v, i) => v === same2.px[i]);
    d.assert('the same data twice draws the same bytes, so nothing else is driving it',
      identical, identical ? `${same1.px.length} bytes identical, and no clock in any body`
                           : 'two passes over identical data disagreed');

    const moved = new Uint8Array(held);
    moved[at(30, 0) + 1] = 20;                  // the same grains, much shorter ones
    const other = pic ? pic.testRender(moved) : null;
    const differs = !!same1 && !!other && !same1.px.every((v, i) => v === other.px[i]);
    d.assert('and one changed texel moves the picture, so the data reaches the pixels',
      differs, differs ? 'one grain length changed, one different frame'
                       : 'the frame did not change');

    // Two synthetic grains prove the axis: order and distance, not just a deposit.
    // Whether a live grain decodes the right OSC field is the grain rate's job.
    // See lessons/page-videoradio.md#videoradio-118
    const two = new Uint8Array(data.length);
    two[at(63, 3)] = LAYOUT_VERSION;
    two[at(0, 3)] = 255;
    two[at(6, 3)] = 255;
    two[at(16, 3)] = 0;
    // Two lengths as well as two places: 40 and 200 of 255 are 6 ms and 1.1 s on the
    // 2 ms to 4 s exponential lane.
    // See lessons/page-videoradio.md#videoradio-119
    two[at(12, 0)] = 255; two[at(12, 0) + 1] = 40;
    two[at(48, 0)] = 255; two[at(48, 0) + 1] = 200;
    const shot = pic ? pic.testRender(two) : null;
    let peaks = [];
    if (shot) {
      const colSum = new Float64Array(shot.w);
      for (let y = 0; y < shot.h; y++) {
        for (let x = 0; x < shot.w; x++) colSum[x] += shot.px[(y * shot.w + x) * 4];
      }
      const argmax = (from, to) => {
        let best = from;
        for (let x = from; x < to; x++) if (colSum[x] > colSum[best]) best = x;
        return best;
      };
      peaks = [argmax(0, shot.w >> 1), argmax(shot.w >> 1, shot.w)].map((x) => (x + 0.5) / shot.w);
    }
    const want = [(12 + 0.5) / DATA_W, (48 + 0.5) / DATA_W];
    const near = peaks.length === 2
      && Math.abs(peaks[0] - want[0]) < 0.03 && Math.abs(peaks[1] - want[1]) < 0.03
      && peaks[0] < peaks[1];
    d.assert('two grains land where the held seconds say, in that order',
      near, peaks.length === 2
        ? `wanted ${want.map((v) => v.toFixed(3)).join(' and ')}, drew ${peaks.map((v) => v.toFixed(3)).join(' and ')}`
        : 'no columns found');

    // The other axis: the brightest row in each half grades grain length. readPixels
    // rows count from the bottom like gl_FragCoord.y, so no flip.
    // See lessons/page-videoradio.md#videoradio-120
    let rows = [];
    if (shot) {
      const rowSum = new Float64Array(shot.h);
      const half = shot.w >> 1;
      const band = (from, to) => {
        rowSum.fill(0);
        for (let y = 0; y < shot.h; y++) {
          for (let x = from; x < to; x++) rowSum[y] += shot.px[(y * shot.w + x) * 4];
        }
        let best = 0;
        for (let y = 0; y < shot.h; y++) if (rowSum[y] > rowSum[best]) best = y;
        return (best + 0.5) / shot.h;
      };
      rows = [band(0, half), band(half, shot.w)];
    }
    const wantRows = [40 / 255, 200 / 255];
    const rightHeight = rows.length === 2
      && Math.abs(rows[0] - wantRows[0]) < 0.06 && Math.abs(rows[1] - wantRows[1]) < 0.06
      && rows[0] < rows[1];
    d.assert('a short grain and a long one are drawn at their own heights',
      rightHeight, rows.length === 2
        ? `wanted ${wantRows.map((v) => v.toFixed(3)).join(' and ')}, `
          + `drew ${rows.map((v) => v.toFixed(3)).join(' and ')} up the lane`
        : 'no rows found');

    // The light comes from the audio: sweep loudness with all else held, on one
    // channel. Every bucket is lit, since two narrow columns are 1% of the frame;
    // 0.25 + 0.75 * loud predicts a factor of four.
    // See lessons/page-videoradio.md#videoradio-121
    const wide = new Uint8Array(data.length);
    wide[at(63, 3)] = LAYOUT_VERSION;
    wide[at(6, 3)] = 255;
    wide[at(16, 3)] = 0;
    for (let x = 0; x < DATA_W; x++) { wide[at(x, 0)] = 255; wide[at(x, 0) + 1] = 128; }
    const darkD = new Uint8Array(wide); darkD[at(0, 3)] = 0;
    const brightD = new Uint8Array(wide); brightD[at(0, 3)] = 255;
    // Three levels and a monotone claim, not one ratio: the present pass is a
    // non-linear ramp. Flat (ignored) and inverted (backwards) both go red.
    // See lessons/page-videoradio.md#videoradio-122
    const midD = new Uint8Array(wide); midD[at(0, 3)] = 128;
    const darkShot = pic ? pic.testRender(darkD) : null;
    const midShot = pic ? pic.testRender(midD) : null;
    const brightShot = pic ? pic.testRender(brightD) : null;
    const quiet = darkShot ? meanRed(darkShot) : 0;
    const mid = midShot ? meanRed(midShot) : 0;
    const loudMean = brightShot ? meanRed(brightShot) : 0;
    d.assert('loudness lights the field, and a quiet station leaves it dark',
      quiet > 0 && mid > quiet + 1 && loudMean > mid + 1 && loudMean > quiet * 1.8,
      `mean red ${quiet.toFixed(1)} quiet, ${mid.toFixed(1)} half, `
      + `${loudMean.toFixed(1)} loud, rising at every step, `
      + `a factor of ${quiet > 0 ? (loudMean / quiet).toFixed(2) : 'nothing'} end to end `
      + `(the ramp compresses it below the ${((LIT_FLOOR + LIT_RANGE) / LIT_FLOOR).toFixed(2)} in density)`);

    // The drop counter has to fire in this run: one bucket is flooded past 255, and
    // nothing may overflow in ordinary play.
    // See lessons/page-videoradio.md#videoradio-123
    const droppedInPlay = everDropped;
    const FLOOD = 300, bIdx = 7;
    for (let i = 0; i < FLOOD; i++) {
      bucket(((bIdx + 0.5) / DATA_W) * BUF_SECONDS / RING_SECONDS, 0.1, 0);
    }
    const refused = buckets[bIdx].drop;
    buckets[bIdx].n = 0; buckets[bIdx].drop = 0; buckets[bIdx].dsum = 0; buckets[bIdx].v.fill(0);
    everDropped = droppedInPlay;
    d.assert('a bucket that overflows counts what it refused, and none overflowed in play',
      refused === FLOOD - 255 && droppedInPlay === 0,
      `flooded ${FLOOD} into one bucket and it refused ${refused}; ${droppedInPlay} refused in ordinary play`);

    // The bucket count is read out of the compiled shader source, not this page's own
    // constant, which would be circular.
    // See lessons/page-videoradio.md#videoradio-124
    const shaderBuckets = Number(/floor\(uv\.x \* (\d+)\.0\)/.exec(pic?.shaders.ACC_FS ?? '')?.[1] ?? 0);
    d.assert('the picture was compiled for the layout the module exports',
      shaderBuckets === DATA_W && MOD_DESTS.length + 8 <= DATA_W
      && data[at(63, 3)] === LAYOUT_VERSION,
      `${shaderBuckets} buckets in the body, ${DATA_W} in the texture, `
      + `${MOD_DESTS.length} destinations plus 8 voices, layout ${LAYOUT_VERSION}`);

    // ── the machine ────────────────────────────────────────────────────────
    d.assert('SuperCollider is running in this tab', !!eng && eng.bootMs > 0,
      eng ? `up in ${Math.round(eng.bootMs)} ms` : (window.__granErr || 'it never booted'));
    if (!eng) {
      // It stops here and says so rather than throwing: an engine that refused still
      // leaves what is known reported, with a smaller count.
      // See lessons/page-videoradio.md#videoradio-125
      d.log('the engine never booted, so nothing below it could be graded', 'bad');
      checking = false;
      return;
    }
    d.assert('the board’s own compiled graph loaded, and the engine reports its grains',
      !!G.def?.ok && G.running && grains > 0,
      `${G.def?.bytes ?? 0} B taken in ${G.def?.ms ?? 0} ms · ${grains} grains reported over OSC`);

    // ── silence ──
    // The analyser pair either side of the gain, fed a 440 Hz tone into speakers
    // (downstream of everything) only with the gate shut; open, it asserts sound leaves.
    // See lessons/page-videoradio.md#videoradio-126
    let pre = 0, post = 0, osc = null;
    if (!asked) {
      osc = ctx.createOscillator();
      const og = ctx.createGain();
      osc.frequency.value = 440; og.gain.value = 0.25;
      osc.connect(og); og.connect(speakers);
      osc.start();
    }
    const untilSilence = performance.now() + 400;
    while (performance.now() < untilSilence) {
      await new Promise((r) => requestAnimationFrame(r));
      preGate.getFloatTimeDomainData(preBuf);
      sink.getFloatTimeDomainData(sinkBuf);
      for (let i = 0; i < preBuf.length; i++) pre = Math.max(pre, Math.abs(preBuf[i]));
      for (let i = 0; i < sinkBuf.length; i++) post = Math.max(post, Math.abs(sinkBuf[i]));
    }
    if (osc) { try { osc.stop(); } catch { /* already stopped */ } osc.disconnect(); }
    d.assert('nothing reaches a speaker until a person presses play',
      asked ? post > 0 : (pre > 0.01 && post === 0),
      asked
        ? `a trusted press opened the gate and ${post.toFixed(4)} is leaving`
        : `a 440 Hz tone reads ${pre.toFixed(4)} inside the page and `
          + `${post.toFixed(4)} past the gate`);

    if (!DEEP) {
      d.log('left for the deep run: the darkening watch, the morph, the walking lanes, '
        + 'the loops, the station change and full screen (DEMO_DEEP=1)');
      tourFrom = performance.now();
      checking = false;
      return;
    }

    // ── the morph ──
    // Driven and read back off the server, never waited for. hold(true) puts every
    // destination on its base so the read-back grades delivery, not modulation.
    // See lessons/page-videoradio.md#videoradio-127
    const A = PATCHES[0], B = PATCHES[1];
    holdTour(0, 0.25);
    tourTick();
    modulator.hold(true);
    await wait(250);
    const quarter = await sGet('msize');
    modulator.hold(false);
    const wantQ = morphOf(A, B, 0.25).values.size;
    const lo = Math.min(A.size, B.size), hi = Math.max(A.size, B.size);
    d.assert('a sound on the way to another reaches the engine, between the two it is between',
      quarter != null && Math.abs(quarter - wantQ) < Math.max(0.002, wantQ * 0.08)
      && quarter >= lo - 1e-6 && quarter <= hi + 1e-6,
      `grain length ${quarter?.toFixed(4) ?? '—'} against ${wantQ.toFixed(4)} asked for, `
      + `between ${lo} and ${hi}`);

    // It travels as a ratio (geometric halfway), and says so if the pair is too close
    // to tell from arithmetic halfway.
    // See lessons/page-videoradio.md#videoradio-128
    const geo = Math.sqrt(A.size * B.size);
    const lin = (A.size + B.size) / 2;
    const half = morphOf(A, B, 0.5).values.size;
    d.assert('and it travels as a ratio rather than as a difference',
      Math.abs(half - geo) < Math.abs(half - lin),
      `halfway is ${half.toFixed(4)}: ${geo.toFixed(4)} as a ratio, ${lin.toFixed(4)} as a difference`);

    // What cannot slide steps once at the middle, by the clock: the tour is put just
    // before the crossover and left alone. mscanmode is a Select.kr index.
    // See lessons/page-videoradio.md#videoradio-129
    const C = PATCHES[3], E = PATCHES[4];            // POSITION into STRETCH
    holdTour(3, 0.42);
    tourTick();
    await wait(220);
    const modeBefore = Math.round(await sGet('mscanmode'));
    // k crosses 0.5 in 0.08 x MORPH_MS = 720 ms, and nothing below touches the
    // tour: the 25 Hz tick does it.
    await wait(1600);
    const modeAfter = Math.round(await sGet('mscanmode'));
    d.assert('the read head steps mode on its own at the middle, instead of landing between two modes',
      modeBefore === C.scanmode && modeAfter === E.scanmode,
      `${modeBefore} then ${modeAfter} with nothing touching it, wanted ${C.scanmode} then ${E.scanmode}`);

    // The routes go with it: the walking set must be the arriving sound's, never a
    // union of both.
    // See lessons/page-videoradio.md#videoradio-130
    const wantRoutes = routesOf(E).map((r) => r.dest);
    d.assert('the settings that walk are the arriving sound’s, not both sounds’',
      routedNow.size === new Set(wantRoutes).size
      && [...routedNow].every((n) => wantRoutes.includes(n)),
      `${[...routedNow].join(', ') || 'none'} walking, and ${E.name} asks for ${wantRoutes.join(', ') || 'none'}`);

    // ── it moves on its own, with a stationary control in the same reading ──
    // winstart walks a 0.013 Hz triangle (constant slope, `phase: 0`, excursion 0.216
    // from a 0.417 base, never clamped). Not audio driven, so no station is graded.
    // See lessons/page-videoradio.md#videoradio-131
    const MOVER = 7, LANE_SPAN = 2000;
    holdTour(MOVER, 0);
    tourTick();
    await wait(150);
    const pos0 = tourPos();
    const mv0 = modNow.winstart ?? null;
    const sends0 = modulator.stats().sends;
    await wait(LANE_SPAN);
    const mv1 = modNow.winstart ?? null;
    const sends1 = modulator.stats().sends;
    // 0.013 Hz over 2 s is 0.026 of a cycle; a triangle covers 4x that in its
    // own -1..1, and the amount is cubed to 0.216, so the lane moves 0.0225 and
    // the control moves 0.0135 in engine units. The threshold is a third of it.
    d.assert('a granulator setting walks itself, with nobody touching the page',
      mv0 != null && mv1 != null && Math.abs(mv1 - mv0) > 0.004 && sends1 > sends0,
      `window start ${mv0?.toFixed(4) ?? '—'} to ${mv1?.toFixed(4) ?? '—'} `
      + `(0.0135 predicted) · ${sends1 - sends0} writes in ${(LANE_SPAN / 1000).toFixed(1)} s`);

    modulator.hold(true);
    await wait(500);
    const sendsH0 = modulator.stats().sends;
    const mvH0 = modNow.winstart ?? null;
    await wait(700);
    const sendsH1 = modulator.stats().sends;
    const mvH1 = modNow.winstart ?? null;
    const posH = tourPos();
    modulator.hold(false);
    d.assert('and everything stops when it is told to, while the tour keeps advancing',
      mvH0 != null && mvH0 === mvH1 && sendsH1 === sendsH0 && posH > pos0,
      `held at ${mvH0?.toFixed(4) ?? '—'} for 700 ms with ${sendsH1 - sendsH0} writes, `
      + `while the tour moved ${(posH - pos0).toFixed(3)} of a sound`);

    // The blend, which is the one number a listener feels and which nothing on
    // this page lets anybody set.
    tourFrom = performance.now();                    // the top of a sound
    tourTick();
    const wLow = wet;
    tourFrom = performance.now() - 0.5 * SLOT_MS;    // its middle
    tourTick();
    const wHigh = wet;
    d.assert('the blend walks itself between the station and the grains, and both gains follow it',
      Math.abs(wHigh - wLow) > 0.3
      && Math.abs(dry.gain.value - (1 - wet)) < 1e-6
      && Math.abs(eng.out.gain.value - wet) < 1e-6,
      `${(wLow * 100).toFixed(0)}% at the top of a sound, ${(wHigh * 100).toFixed(0)}% at its middle`);

    // ── the loop, and the grain clock it tunes ──
    // lockRate picks the nearest rate that fits whole bars (elen / rate s) into the lap,
    // read back off the engine. Grain clock measured at 24000.0 +/- 0.2 samples.
    // See lessons/page-videoradio.md#videoradio-132
    endLoop();
    holdTour(5, 0);                                  // `the sixteenth`, which has a figure
    tourTick();
    await wait(150);
    // A short lap on purpose: 2.5 s instead of the tour's 8, to keep the burst short.
    // See lessons/page-videoradio.md#videoradio-133
    const LAP_S = 2.5;
    armLoop(LAP_S);
    for (let i = 0; i < 80 && loopState === 'filling'; i++) {
      // The tour is pinned while the ring fills, so the lock is made and graded against
      // one sound's figure.
      // See lessons/page-videoradio.md#videoradio-134

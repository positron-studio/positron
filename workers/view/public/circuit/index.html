<style>
  /* Three columns, as the panel has: a strip of buttons down each side and
     everything else between them. */
  /* One grid of three columns shared by both rows, the only way two rows agree on a
     `max-content` track. The middle is `max-content`, not `1fr`, so pads stay under macros.
     See lessons/page-circuit.md#circuit-1 */
  /* `justify-content`, not `justify-items`: centre the whole set of tracks, since
     centring each column in its own track would pull the side columns off the pads.
     See lessons/page-circuit.md#circuit-2 */
  /* See lessons/page-circuit.md#circuit-3 */
  /* The panel scrolls sideways on a phone rather than squeezing 46 px pads. The scroller
     sits outside the card, so at 390 px the card runs past the page edge; moving it
     inside is a separate decision. `min-width: 0` keeps the document from scrolling.
     See lessons/page-circuit.md#circuit-4 */
  .circ-scroll { overflow-x: auto; min-width: 0; }
  /* The card is not the grid: a centred grid puts its leftover width before the first
     column, so the names row spans the card at its padding and the controls centre inside.
     See lessons/page-circuit.md#circuit-5 */
  /* `min-width: max-content` keeps the phone case working: below the panel's own width
     the card is wider than its container and `.circ-scroll` takes it.
     See lessons/page-circuit.md#circuit-6 */
  /* The card's edges are the page's edges, like every other block. The names and border
     sit at the card's 20 px inset; the controls centre in what is left.
     See lessons/page-circuit.md#circuit-7 */
  /* `.panel` and `.panel-case` (demo/shell/panel-layout.mjs) bring the flex column,
     card and 20 px inset. `width: 100%` plus `min-width: max-content` override `.panel`'s
     `min-width: 0`, because here the card itself overflows. See `.circ-scroll`.
     See lessons/page-circuit.md#circuit-8 */
  .circ {
    width: 100%; min-width: max-content;
    --panel-gap: 22px; gap: 22px;
    /* See lessons/page-circuit.md#circuit-9 */
    /* See lessons/page-circuit.md#circuit-10 */
    /* See lessons/page-circuit.md#circuit-11 */
    /* See lessons/page-circuit.md#circuit-12 */
    /* The foot only: 34 px under the last pad row, which has no label to hold it off the
       edge. The sides are `.panel-case`'s and the top inset comes from `.panel-plate`.
       See lessons/page-circuit.md#circuit-13 */
    padding-bottom: 34px;
  }
  /* The nameplate row's flex rule is `.panel-plate[data-place="ends"]` in the kit.
     See lessons/page-circuit.md#circuit-14 */
  /* Sentence case on every label and button: the panel prints `Tap` and `Sessions` in
     mixed case. NOVATION and CIRCUIT are artwork, not labels, and stay uppercase.
     See lessons/page-circuit.md#circuit-15 */
  .circ .pos-pad-top, .circ .pos-pad-bot, .circ-pair-lab { text-transform: none; }
  .circ-panel {
    /* `justify-content`, not `justify-items`: the second would centre each column in its
       own track and pull both side columns away from the pads.
       See lessons/page-circuit.md#circuit-16 */
    display: grid; justify-content: center;
    grid-template-columns: var(--ctl-w) max-content var(--ctl-w);
    gap: 22px; align-items: start;
    /* One pitch, declared once and inherited by every row and column in the panel, so
       the Shift row and the pads cannot land on different pitches.
       See lessons/page-circuit.md#circuit-17 */
    --ctl-gap: 14px;
  }
  /* the macro row and the pad area centre in the same track */
  .circ-macros, .circ-mid { justify-self: center; }
  /* The outer knobs (`--ctl-w * 1.1`) centre in their pad-width track rather than
     filling it; they overflow 2.3 px each way into the 22 px gap, so the track stays.
     See lessons/page-circuit.md#circuit-18 */
  .circ-panel > .pos-knob { justify-self: center; }
  /* Every cell is placed explicitly: in an implicit grid any new child reorders the rest.
     See lessons/page-circuit.md#circuit-19 */
  /* The ink is `.panel-plate-l`'s; `align-self: center` is placement in this row.
     See lessons/page-circuit.md#circuit-20 */
  .circ-brand { align-self: center; }
  /* Both names uppercase, the rule for every replica. The transform stays although
     the text is typed uppercase, and the check reads the rendered text.
     See lessons/page-circuit.md#circuit-21 */
  .circ-vol     { grid-area: 1 / 1 / 2 / 2; }
  .circ-macros  { grid-area: 1 / 2 / 2 / 3; }
  .circ-filt    { grid-area: 1 / 3 / 2 / 4; }
  /* Classes, not `:first-of-type`, which counts by tag and breaks when a brand div
     comes first.
     See lessons/page-circuit.md#circuit-22 */
  .circ-left    { grid-area: 2 / 1 / 3 / 2; }
  .circ-mid     { grid-area: 2 / 2 / 3 / 3; }
  .circ-right   { grid-area: 2 / 3 / 3 / 4; }
  /* See lessons/page-circuit.md#circuit-23 */
  /* The top row takes the panel's `--ctl-gap`, so the macro row and the button rows are
     the same width and the volume knob and filter sit over their columns.
     See lessons/page-circuit.md#circuit-24 */
  /* 14 px between the function row button and the block below it, which is the
     same seam the middle column has between its button row and its pad area. */
  .circ-side { display: flex; flex-direction: column; gap: 18px; }
  /* One round button to a pad row: the cell is a pad's height and the circle centres
     in it. The gap is the pad area's, not the side column's.
     See lessons/page-circuit.md#circuit-25 */
  .circ-side-pads { display: flex; flex-direction: column; gap: var(--ctl-gap); }
  /* Round buttons here are pad sized, as on the panel, so there is nothing to centre or
     stretch. The kit's 10 per cent smaller round pad is for circles among squares.
     See lessons/page-circuit.md#circuit-26 */
  .circ-side-pads .pos-pad-round {
    width: var(--ctl-w); height: var(--ctl-w); align-self: center;
  }
  /* No label slots in this column: a reserved 15 px slot per cell adds 75 px of drift
     over five rows.
     See lessons/page-circuit.md#circuit-27 */
  .circ-side-pads .pos-pad-top { display: none; }
  .circ-mid { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  /* The pad grid takes the panel's local `--ctl-gap`, so the track row, columns and rows
     move together and across and down spacing cannot come apart.
     See lessons/page-circuit.md#circuit-28 */
  .circ-grid {
    display: flex; flex-direction: column; gap: var(--ctl-gap);
  }
  /* Track pads carry their names on the face, so their 15 px top slot goes too, or the
     side columns drift 7.5 px. createPadGrid only collapses slots inside a grid.
     See lessons/page-circuit.md#circuit-29 */
  .circ-grid > .circ-row .pos-pad-top { display: none; }
  /* Eight columns, not eight widths: the Shift row and the track row both sit over the
     pad grid. A word that does not fit 46 px is shortened (`Sess`), never ellipsised.
     See lessons/page-circuit.md#circuit-30 */
  .circ-row {
    display: grid; grid-template-columns: repeat(8, var(--ctl-w));
    gap: var(--ctl-gap); align-items: flex-end;
  }
  /* A grid item wider than its column overflows it; `min-width: 0` is what lets
     `width: 100%` beat the content's own minimum.
     See lessons/page-circuit.md#circuit-31 */
  .circ-row > .pos-pad-wrap, .circ-row .pos-pad { width: 100%; min-width: 0; }
  /* The octave pair is one wrapper sharing the `prt/oct` legend, so it spans two of
     the eight columns.
     See lessons/page-circuit.md#circuit-32 */
  .circ-row > .circ-pair { grid-column: span 2; }

  /* The macros zig-zag: odd numbers upper, even lower and offset right by half a column
     plus half a gap, as on the panel. A straight row is a different instrument.
     See lessons/page-circuit.md#circuit-33 */
  /* The macro row sets its own gap, as a knob's box is wider than a pad's. Centred in
     its track, so the gap widens it both ways past the pad area.
     See lessons/page-circuit.md#circuit-34 */
  /* No foot of its own: the panel's 22 px gap is the whole space below.
     See lessons/page-circuit.md#circuit-35 */
  .circ-macros { display: flex; gap: 10px; align-items: flex-start; }
  .circ-macro-even { margin-top: 26px; }

  /* One knob size everywhere. Filter and Master Volume are larger pots on the panel;
     that difference is in plans/plan-panel-layouts.md and is not drawn.
     See lessons/page-circuit.md#circuit-36 */

  /* A legend printed over a PAIR of buttons rather than over one. It takes the
     same face and the same reserved height as a pad's own top slot, so the
     pair lines up with the single buttons beside it. */
  .circ-pair { display: flex; flex-direction: column; }
  .circ-pair-lab {
    font: 500 9px/12px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim2); min-height: 12px; margin-bottom: calc(var(--ctl-head) - 12px);
    text-align: center; white-space: nowrap;
  }
  /* The pads inside give up their top slots because the pair's legend replaces them;
     reserving both makes the pair 15 px taller and drops every plain button in the row.
     See lessons/page-circuit.md#circuit-37 */
  .circ-pair-row {
    display: grid; grid-template-columns: repeat(2, var(--ctl-w));
    gap: var(--ctl-gap);
  }
  .circ-pair-row .pos-pad-top { display: none; }

</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createNameplate } from '/shell/panel-layout.mjs';
  import { createPad, createPadGrid } from '/shell/pad.mjs';
  import { createPresenceButton, WIRED } from '/shell/presence.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { createMidiNode, checkMidiNode } from '/shell/midi-node.mjs';

  /**
   * A Novation Circuit on screen. What it sends is measured, in
   * research/measured-devices-2026-09-20.md; where the controls are is read off the
   * panel artwork at 800 dpi, in plans/plan-panel-layouts.md. See also circuit-38.
   * See lessons/page-circuit.md#circuit-96
   */

  /** Measured. Macros are one block on channel 1. */
  const MACRO_CC0 = 80;
  /**
   * The filter is alone on channel 16 (CC 74, resonance CC 71) and every macro is on
   * channel 1: measured, and documented as Session Control in Novation's Circuit
   * Programmer's Reference Guide v1.1 (not the User Guide).
   * See lessons/page-circuit.md#circuit-39
   */
  const FILTER_CC = 74, FILTER_CH = 16;
  /** Measured: drums arrive on 10, synth 2 on 2. */
  const DRUM_CH = 10;

  const d = mount({
    name: 'circuit',
    what: 'A Novation Circuit on screen, moving when the real one moves.',
    readout: null,
    /* No declared control: the presence button below is spliced into `.pos-controls`,
       where demo/verify.mjs presses. A status control outside that row is never driven.
       See lessons/page-circuit.md#circuit-40 */
    controls: [],
  });
  guard(d);

  /**
   * The knob row spans the whole panel and the side columns start below it, as on the
   * object. A structural fact, not a margin that would track the knob row's height.
   * See lessons/page-circuit.md#circuit-41
   */
  /**
   * One grid, six cells, rows not wrapped: two grids with the same `max-content` column
   * each size it from their own contents and disagree (12 px here).
   * See lessons/page-circuit.md#circuit-42
   */
  /**
   * The instrument's own names where the panel prints them: maker top left, model top
   * right, above the outer knobs. Artwork, not the page title repeated.
   * See lessons/page-circuit.md#circuit-43
   */
  /* This page wears the panel classes but does not call createPanelLayout: the factory
     always builds its own scroller, and here the scroller `.circ-scroll` sits outside
     the card. The factory arrives with that scroll boundary change.
     See lessons/page-circuit.md#circuit-44 */
  const circ = el('div', 'panel panel-case circ');
  const circScroll = el('div', 'circ-scroll');
  const panel = el('div', 'circ-panel');
  /* Typed uppercase so the source says what the screen says. `place: 'ends'` matches
     /twelve/, but this plate sits inside the card; where it goes is the caller's choice.
     See lessons/page-circuit.md#circuit-45 */
  const nameplate = createNameplate({
    lines: ['NOVATION', 'CIRCUIT'], place: 'ends', cls: 'circ-brands',
  });
  const brands = nameplate.el;
  circ.append(brands, panel);
  const left = el('div', 'circ-side circ-left');
  const mid = el('div', 'circ-mid');
  const right = el('div', 'circ-side circ-right');
  circScroll.append(circ);
  d.el.append(circScroll);

  /* On the patchbay on a press of Join, never on load (plans/plan-routing-migration.md
     step 5): announced as a device keyed by its port, never its name. Join asks for
     MIDI first if the presence button has not. /shell/midi-node.mjs has the rest.
     See lessons/page-circuit.md#circuit-46 */
  const bayMidi = createMidiNode({ slug: 'circuit', log: (line, kind) => d.log(line, kind),
    listen: async () => { if (!access) await d.run('listen'); return access; } });

  // ── the knobs ───────────────────────────────────────────────────────────

  /**
   * Master Volume is drawn and bound to nothing: whether it transmits has never been
   * measured, and drawing it live would be a control that looks bound and is not.
   * See lessons/page-circuit.md#circuit-47
   */
  const volume = createKnob({
    label: 'volume', min: 0, max: 127, value: 96,
    title: 'master volume, a pot. Whether it sends anything has not been measured',
    disabled: true,
  });

  volume.el.classList.add('circ-vol');

  const macros = [];
  const macroRow = el('div', 'circ-macros');
  for (let i = 0; i < 8; i++) {
    const k = createKnob({
      /**
       * No controller number under the knob: a panel does not print its protocol. The CC
       * and channel are on the hover.
       * See lessons/page-circuit.md#circuit-48
       */
      label: `${i + 1}`,
      min: 0, max: 127, value: 64,
      title: `macro ${i + 1}, CC ${MACRO_CC0 + i} on channel 1, measured`,
    });
    // odd numbers up, even numbers down and offset: the zig zag.
    if (i % 2 === 1) k.el.classList.add('circ-macro-even');
    macros.push(k);
    macroRow.append(k.el);
  }

  /** The filter is visibly larger on the panel and turns further. */
  const filter = createKnob({
    label: 'filter', min: 0, max: 127, value: 64,
    title: `filter, CC ${FILTER_CC} on channel ${FILTER_CH}, measured`,
  });
  filter.el.classList.add('circ-filt');

  // volume, macros, filter across the top; then the two columns and the middle.
  panel.append(volume.el, macroRow, filter.el, left, mid, right);

  // ── the button row under the macros ─────────────────────────────────────

  /**
   * The grey legend above a button is what Shift plus that button does, in the top slot.
   * Shift plus Save is not stated in the User Guide, so the artwork is copied unexplained.
   * See lessons/page-circuit.md#circuit-49
   */
  /**
   * The octave buttons carry a triangle as the panel does. U+25BC and U+25B2 have no
   * emoji form, unlike the media control glyphs.
   * See lessons/page-circuit.md#circuit-50
   */
  const ROW = [
    ['oct-', 'Oct\u25BC', ''], ['oct+', 'Oct\u25B2', ''],
    ['tempo', 'Tempo', 'Tap'], ['swing', 'Swing', ''],
    ['clear', 'Clear', ''], ['dup', 'Dup', ''],
    ['save', 'Save', 'Clear'], ['session', 'Sess', 'Sessions'],
  ];
  const btnRow = el('div', 'circ-row');
  const rowPads = {};
  for (const [id, label, above] of ROW) {
    /**
     * The name is on the face, as on the panel; the top slot stays for the Shift legend.
     * `.pos-pad-face` ellipsises, and a cut face means the word is too long for a pad.
     * See lessons/page-circuit.md#circuit-51
     */
    rowPads[id] = createPad({
      half: true, label, top: above, tint: '#6a7280', latch: true,
      aria: id,
      title: `${label}, and this page has never seen a byte from it`,
    });
    btnRow.append(rowPads[id].el);
  }

  /**
   * The `prt/oct` legend spans the pair, so it cannot be either pad's top slot. The pads
   * keep empty slots so they line up with the six beside them.
   * See lessons/page-circuit.md#circuit-52
   */
  const octPair = el('div', 'circ-pair');
  /**
   * `prt/oct`, not `Pattern Octave`: at a tenth of panel size the full words fill the
   * row. The hover has them in full.
   * See lessons/page-circuit.md#circuit-53
   */
  const octLab = el('div', 'circ-pair-lab', 'prt/oct');
  octPair.title = 'Pattern Octave, printed in full across the pair on the panel';
  const octPads = el('div', 'circ-pair-row');
  octPads.append(rowPads['oct-'].el, rowPads['oct+'].el);
  octPair.append(octLab, octPads);
  btnRow.prepend(octPair);
  /**
   * Shift is not in this row: it is the top of the right column, which starts level with
   * this row. Drawing it here too puts one control in two places.
   * See lessons/page-circuit.md#circuit-54
   */
  mid.append(btnRow);

  // ── the track buttons and the grid ──────────────────────────────────────

  /**
   * Short names: `Sidechain` is 50 px in this face against a 46 px pad. A cut label means
   * a shorter word, not a wider pad; the full name is on the hover.
   * See lessons/page-circuit.md#circuit-55
   */
  const TRACKS = [['Syn1', 'Synth 1'], ['Sc', 'Sidechain'], ['Syn2', 'Synth 2'],
                  ['Sc', 'Sidechain'], ['Dr1', 'Drum 1'], ['Dr2', 'Drum 2'],
                  ['Dr3', 'Drum 3'], ['Dr4', 'Drum 4']];
  const trackRow = el('div', 'circ-row');
  /**
   * The eight track selectors are full-size squares with the name on the button, the
   * row a hand reaches for most. The face is still 46 px, so names stay short.
   * See lessons/page-circuit.md#circuit-56
   */
  const tracks = TRACKS.map(([short, full]) => {
    const p = createPad({ label: short, tint: '#7fb2ff', latch: true,
      aria: full, title: full });
    trackRow.append(p.el);
    return p;
  });
  /**
   * The track row and the grid are one block with one gap, as on the panel, where the
   * track buttons are the top row of the pad area.
   * See lessons/page-circuit.md#circuit-57
   */
  const gridBlock = el('div', 'circ-grid');
  gridBlock.append(trackRow);
  mid.append(gridBlock);

  /**
   * Thirty two pads and which pad is which note is not known: drums arrive on channel 10
   * as 60, 62, 64 and synth 2 on channel 2. A pad lights only for a note actually seen.
   * Colours are the four tracks, as on the hardware.
   * See lessons/page-circuit.md#circuit-58
   */
  const LANE_TINT = ['#7fb2ff', '#8fd6a8', '#e0b060', '#e0908a'];
  const grid = createPadGrid({
    cols: 8, rows: 4,
    pad: (x, y) => ({ tint: LANE_TINT[y], title: `pad ${x + 1} of row ${y + 1}` }),
  });
  gridBlock.append(grid.el);

  // ── the two side columns ────────────────────────────────────────────────

  /**
   * A round button carries its name inside, about four characters, so `Velocity` and
   * `Patterns` are shortened with the full word on the hover.
   * Each row is: id, face, full name, legend above, round.
   * See lessons/page-circuit.md#circuit-59
   */
  const LEFT = [['scale', 'Scale', 'Scale', '', false],
                ['note', 'Note', 'Note', 'Expand', true],
                ['vel', 'Vel', 'Velocity', 'Fixed', true],
                ['gate', 'Gate', 'Gate', '', true],
                ['nudge', 'Ndg', 'Nudge', '', true],
                ['length', 'Len', 'Length', 'Rate', true]];
  const RIGHT = [['shift2', 'Shift', 'Shift', '', false],
                 ['patterns', 'Patt', 'Patterns', '', true],
                 ['mixer', 'Mix', 'Mixer', '', true],
                 ['fx', 'Fx', 'FX', '', true],
                 ['record', '\u25CF', 'Record', '', true],
                 ['play', '\u25BA', 'Play', '', true]];
  const side = {};
  /**
   * The five round buttons in each column line up with the five pad rows by centring
   * in a pad-sized cell. The first button (`Scale`, `Shift`) belongs to the function
   * row and sits the stack's 14 px above.
   * See lessons/page-circuit.md#circuit-60
   */
  const sidePads = { left: el('div', 'circ-side-pads'), right: el('div', 'circ-side-pads') };
  left.append(sidePads.left);
  right.append(sidePads.right);

  for (const [host, list] of [[left, LEFT], [right, RIGHT]]) {
    for (const [id, face, full, above, round] of list) {
      side[id] = createPad({
        /**
         * The face for both shapes; the panel prints the word inside. No top legend on a
         * circle (no room in the column): the Shift legend is on the hover.
         * See lessons/page-circuit.md#circuit-61
         */
        round, half: !round, tint: '#6a7280', latch: true,
        label: face, top: round ? '' : above, aria: full,
        title: above
          ? `${full}, and Shift plus it is ${above}. Never seen a byte from it`
          : `${full}, and this page has never seen a byte from it`,
      });
      // the rectangular one stays at the top of the column; the circles go in
      // the block that tracks the pad rows
      if (round) (host === left ? sidePads.left : sidePads.right).append(side[id].el);
      else host.prepend(side[id].el);
    }
  }

  /**
   * What arrived, beside the panel. The table is a kit module; clock bytes are counted
   * there and never listed.
   * See lessons/page-circuit.md#circuit-62
   */
  const traffic = createMidiLog({ empty: '', reserve: 6 });
  d.el.append(traffic.el);
  // The patchbay row goes under the log, after everything that belongs to the panel.
  d.el.append(bayMidi.el);

  // ── what arrives ────────────────────────────────────────────────────────

  let access = null, clock = 0, anchored = false;
  /* 24 clocks a quarter note is the MIDI standard and was measured arriving
     from this device; six of them is a sixteenth. */
  const CLOCKS_PER_STEP = 6, STEPS = 16;
  /* Channel 10 drum notes, measured and documented at DOC 3.2: the listener needs them
     to tell one drum track from another.
     See lessons/page-circuit.md#circuit-63 */
  const DRUM_NOTES = [60, 62, 64, 65];
  /* notes heard on the drum channel that this grid cannot place */
  const offGrid = new Set();
  const seenNotes = new Map();

  function take(b) {
    const m = decode(b);
    if (m.status === 0xf8) { clock++; return; }
    /**
     * Everything that is not a flood (clock, active sensing) gets a log row here, before
     * any routing, so messages the panel cannot place are listed. Start still reaches
     * the branch below.
     * See lessons/page-circuit.md#circuit-64
     */
    if (!traffic.add(m)) return;
    /* 0xFA Start and 0xFB Continue. Named here rather than imported, because
       the half of this page that used to SEND them has gone to
       archive/circuit-midi-out/ and a listener still has to recognise one. */
    if (m.status === 0xfa || m.status === 0xfb) { clock = 0; anchored = true; return; }

    if (m.kind === 'control' && m.ch === 1
        && m.cc >= MACRO_CC0 && m.cc < MACRO_CC0 + 8) {
      // Absolute, unlike the Model 12's pan: a macro reports a position over 0 to 127.
      // See lessons/page-circuit.md#circuit-65
      macros[m.cc - MACRO_CC0].set(m.d2, { from: 'hardware' });
      return;
    }
    if (m.kind === 'control' && m.ch === FILTER_CH && m.cc === FILTER_CC) {
      filter.set(m.d2, { from: 'hardware' });
      return;
    }
    if (m.kind === 'note on' && m.ch === DRUM_CH) {
      /**
       * A hit lights when it landed, not which note: the column comes off the clock (24 per
       * quarter, 6 per sixteenth). The Circuit documents no per-pad address and the clock runs
       * free, so the bar origin is the first hit heard until a Start (0xFA) arrives.
       * See lessons/page-circuit.md#circuit-66
       */
      /**
       * A drum track owns two rows, chosen by its note: Drum 1 rows 1 and 2, Drum 2 rows 3
       * and 4. Drums 3 and 4 have nowhere to go (64 steps on 32 pads) and only log.
       * See lessons/page-circuit.md#circuit-67
       */
      if (!anchored) { clock = 0; anchored = true; }
      seenNotes.set(m.note, (seenNotes.get(m.note) ?? 0) + 1);
      const track = DRUM_NOTES.indexOf(m.note);
      if (track < 0 || track > 1) {
        if (!offGrid.has(m.note)) {
          offGrid.add(m.note);
          d.log(`note ${m.note} is a drum this grid has no room for, so it `
              + `is counted and not drawn`, 'warn');
        }
        return;
      }
      const step = Math.floor(clock / CLOCKS_PER_STEP) % STEPS;
      grid.at(step % 8, track * 2 + Math.floor(step / 8))?.flash(140);
      return;
    }

    /* everything the panel has no place for, named once each */
    sayUnplaced(m, b);
  }

  /**
   * Anything this page cannot place is logged once per shape, not per message, because
   * a Circuit sends 24 clocks a quarter note.
   * See lessons/page-circuit.md#circuit-68
   */
  const unplaced = new Set();
  function sayUnplaced(m, bytes) {
    const shape = m.kind === 'control' ? `CC ${m.cc} on channel ${m.ch}`
      : m.kind ? `${m.kind} on channel ${m.ch}`
      : `status 0x${(bytes[0] ?? 0).toString(16)}`;
    if (unplaced.has(shape)) return;
    unplaced.add(shape);
    d.log(`heard ${shape}, which this panel has no place for yet`);
  }

  async function open() {
    if (!navigator.requestMIDIAccess) {
      d.log('this browser has no Web MIDI, so nothing can reach this panel', 'warn');
      return false;
    }
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
      for (const p of access.inputs.values()) {
        try { await p.open(); } catch { /* another client may hold it */ }
        p.onmidimessage = (e) => take(Array.from(e.data));
      }
      bayMidi.attach(access);
      return true;
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return false;
    }
  }

  /**
   * The button is the status, and it stays a press: opening MIDI on its own would open
   * it on a visit.
   * See lessons/page-circuit.md#circuit-69
   */
  /* `says: WIRED`: an instrument on USB is connected or not, not online. One map in
     presence.mjs keeps every hardware page on one vocabulary.
     See lessons/page-circuit.md#circuit-70 */
  const pres = createPresenceButton({
    of: 'Circuit', state: 'unknown', says: WIRED,
    can: ['unknown', 'checking', 'online', 'offline'],
    press: () => d.run('listen'),
  });
  d.controls.hidden = false;
  d.controls.append(pres.el);

  d.on('listen', async () => {
    pres.set('checking');
    if (await open()) {
      /* Online means a port with this name is present, not that MIDI was granted.
         See lessons/page-circuit.md#circuit-71 */
      const seen = [...(access?.inputs?.values() ?? [])]
        .filter((i) => /circuit/i.test(i.name || ""));
      pres.set(seen.length ? 'online' : 'offline',
        seen.length ? null : 'nothing with Circuit in its name is plugged in');
      d.log('this page only listens. Turn a macro or the filter, or play a '
          + 'drum part, and the panel follows it.');
      d.log('turn a macro or the filter. The pads light where a note has been '
          + 'seen, which is three of thirty two so far.');
      d.log('this Circuit sends MIDI clock continuously, measured at about 122 bpm, '
          + 'whether anything is playing or not.');
    } else {
      pres.set('offline', 'this browser would not open MIDI');
    }
    if (SELFCHECK) await d.run('check');
  });

  // ── checks ──────────────────────────────────────────────────────────────

  d.on('check', async () => {
    /**
     * Measured before any message lands, the only moment the box is empty; `reserve`
     * holds the room so the panel does not jump when rows arrive.
     * See lessons/page-circuit.md#circuit-72
     */
    const emptyBox = traffic.el.getBoundingClientRect().height;
    /**
     * The caption element, not `textContent`: an empty table hides its heading rather
     * than removing it, so textContent still contains the hidden text.
     * See lessons/page-circuit.md#circuit-73
     */
    const emptySays = traffic.el.querySelector('.pos-tbl-empty');

    for (let i = 0; i < 8; i++) take([0xb0, MACRO_CC0 + i, 20 + i * 12]);
    take([0xbf, FILTER_CC, 100]);          // channel 16
    take([0x99, 60, 0x60]);                // drums, channel 10
    take([0xf8]); take([0xf8]);

    d.assert('a visit opened nothing', SELFCHECK ? true : access === null,
      access ? 'access taken after a press' : 'no MIDI access taken');

    d.assert('eight macros are drawn and all eight are bound',
      macros.length === 8 && macros.every((k) => k.hardwareMoves() > 0),
      `${macros.filter((k) => k.hardwareMoves() > 0).length} of 8 moved`);

    /**
     * Filter on channel 16, macros on 1: the binding a reasonable layout gets wrong, and
     * a page listening on channel 1 alone would pass everything else.
     * See lessons/page-circuit.md#circuit-74
     */
    d.assert('the filter answers on channel 16, not channel 1',
      filter.hardwareMoves() > 0, `${filter.hardwareMoves()} moves`);
    const before = filter.value();
    take([0xb0, FILTER_CC, 5]);            // the same CC on channel 1
    d.assert('and CC 74 on channel 1 does not move it',
      filter.value() === before, `${filter.value()} after a channel 1 message`);

    // A macro is absolute while the Model 12's pan is relative on the same protocol.
    // See lessons/page-circuit.md#circuit-75
    d.assert('a macro takes its value as a position, not a step',
      Math.round(macros[0].value()) === 20, String(Math.round(macros[0].value())));

    d.assert('clock is counted and never drawn', clock === 2, `${clock} clock bytes`);

    d.assert('the pad grid is four rows of eight', grid.pads.length === 4
      && grid.pads[0].length === 8, `${grid.pads.length} by ${grid.pads[0].length}`);

    /**
     * See lessons/page-circuit.md#circuit-76
     */
    /**
     * See lessons/page-circuit.md#circuit-77
     */
    /**
     * The panel is drawn whole and most of it is bound to nothing, asserted on `presses`
     * rather than the hover text, which grades a sentence and not a binding.
     * See lessons/page-circuit.md#circuit-78
     */
    const unbound = [...Object.values(rowPads), ...Object.values(side), ...tracks];
    d.assert('the buttons nobody has measured are drawn and are lit by nothing',
      unbound.every((p) => p.presses() === 0 && !p.on()),
      `${unbound.length} controls drawn, none lit by a message`);

    /**
     * The button row is one line: the octave pair carries a legend the others do not, so
     * it is the one thing that can silently differ in height.
     * See lessons/page-circuit.md#circuit-79
     */
    const tops = [side.scale.button, rowPads['oct-'].button, rowPads.tempo.button,
                  rowPads.session.button, side.shift2.button]
      .map((b) => b.getBoundingClientRect().top);
    d.assert('every button in the top row sits on one line, legend or no legend',
      Math.max(...tops) - Math.min(...tops) <= 1,
      tops.map((t) => t.toFixed(0)).join(', '));

    // The track row is squares and sits on one line of its own.
    const tTops = tracks.map((p) => p.button.getBoundingClientRect());
    d.assert('the track buttons are full size squares on one line',
      tTops.every((r) => Math.abs(r.width - r.height) <= 1)
      && Math.max(...tTops.map((r) => r.top)) - Math.min(...tTops.map((r) => r.top)) <= 1,
      `${tTops[0].width.toFixed(0)} by ${tTops[0].height.toFixed(0)} px, ${tracks.length} of them`);

    // One gap through the whole pad area: under the track row and between grid rows.
    // See lessons/page-circuit.md#circuit-80
    {
      const t = tracks[0].button.getBoundingClientRect();
      const r0 = grid.at(0, 0).button.getBoundingClientRect();
      const r1 = grid.at(0, 1).button.getBoundingClientRect();
      d.assert('the gap under the track row is the same as the gap between grid rows',
        Math.abs((r0.top - t.bottom) - (r1.top - r0.bottom)) <= 1,
        `${(r0.top - t.bottom).toFixed(1)} px under the tracks, `
        + `${(r1.top - r0.bottom).toFixed(1)} px between rows`);
    }

    // The two outer knobs sit over the two columns: Master Volume left, Filter right.
    // See lessons/page-circuit.md#circuit-81
    {
      const c = (e) => { const r = e.getBoundingClientRect(); return r.left + r.width / 2; };
      d.assert('the filter is centred over the right column and the volume over the left',
        Math.abs(c(filter.el) - c(side.patterns.button)) <= 1.5
        && Math.abs(c(volume.el) - c(side.note.button)) <= 1.5,
        `filter ${c(filter.el).toFixed(1)} against ${c(side.patterns.button).toFixed(1)}, `
        + `volume ${c(volume.el).toFixed(1)} against ${c(side.note.button).toFixed(1)}`);
    }

    // Each round button shares a centre line with its pad row (41 px circle, 46 px pad).
    // See lessons/page-circuit.md#circuit-82
    {
      const mid = (e) => { const r = e.getBoundingClientRect(); return r.top + r.height / 2; };
      const pairs = [[side.note, tracks[0]], [side.vel, grid.at(0, 0)],
                     [side.gate, grid.at(0, 1)], [side.nudge, grid.at(0, 2)],
                     [side.length, grid.at(0, 3)]];
      const worst = Math.max(...pairs.map(([a, b]) => Math.abs(mid(a.button) - mid(b.button))));
      d.assert('every round button shares a centre line with its pad row',
        worst <= 1.5, `worst drift ${worst.toFixed(1)} px over five rows`);
    }

    // The panel scrolls and the page does not: a scroller missing `min-width: 0` looks the
    // same in a screenshot and scrolls the document instead.
    // See lessons/page-circuit.md#circuit-83
    {
      const cs = getComputedStyle(circScroll);
      const doc = document.documentElement;
      d.assert('the panel scrolls sideways inside its own box, not the page',
        cs.overflowX === 'auto' && cs.minWidth === '0px'
        && doc.scrollWidth <= doc.clientWidth + 1,
        `overflow-x ${cs.overflowX}, min-width ${cs.minWidth}, `
        + `page ${doc.scrollWidth} into ${doc.clientWidth}`);
    }

    // Every top button stands over its own pad column.
    // See lessons/page-circuit.md#circuit-84
    {
      const mid = (e) => { const r = e.getBoundingClientRect(); return r.left + r.width / 2; };
      const top = ROW.map(([id]) => mid(rowPads[id].button));
      const below = tracks.map((t) => mid(t.button));
      const worst = Math.max(...top.map((x, i) => Math.abs(x - below[i])));
      d.assert('every top button stands over its own pad column',
        top.length === 8 && below.length === 8 && worst <= 1,
        `worst ${worst.toFixed(1)} px across eight columns`);
    }

    /**
     * The printed names are maker and model in uppercase, read as rendered (the transform
     * counts), and both halves are required.
     * See lessons/page-circuit.md#circuit-85
     */
    {
      /* `nameplate.shown()` applies the transform the way the browser does.
         See lessons/page-circuit.md#circuit-86 */
      const [maker, model] = nameplate.shown();
      d.assert('the panel prints the maker and the model, both in uppercase',
        maker === 'NOVATION' && model === 'CIRCUIT',
        `${maker} ${model}`);
    }

    /**
     * The presence badge's colour read as a computed value: an equal-specificity rule later
     * in shell.css can win on source order while the source looks right. Also asserts online
     * is not the grey. The state is set and restored within one task, so nothing paints.
     * See lessons/page-circuit.md#circuit-87
     */
    {
      const badge = d.el.querySelector('.pos-pres') || document.querySelector('.pos-pres');
      if (badge) {
        const was = badge.dataset.state;
        const inkOf = (st) => {
          badge.dataset.state = st;
          return getComputedStyle(badge).color;
        };
        const root = getComputedStyle(document.documentElement);
        const asRgb = (v) => {
          const h = v.trim().replace('#', '');
          const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
          return `rgb(${r}, ${g}, ${b})`;
        };
        const grey = asRgb(root.getPropertyValue('--dim2'));
        const good = asRgb(root.getPropertyValue('--ok'));
        const checking = inkOf('checking');
        const online = inkOf('online');
        const unknown = inkOf('unknown');
        badge.dataset.state = was;

        d.assert('checking, unknown and offline all read as the dim grey, not as the foreground',
          checking === grey && unknown === grey,
          `checking ${checking}, unknown ${unknown}, wanted ${grey}`);
        d.assert('and online reads as the good colour, which is the half a greyed stylesheet would fail',
          online === good && online !== grey,
          `online ${online}, wanted ${good}`);
      }
    }

    // The printed names sit the same distance from three edges, measured on screen
    // rather than read off the stylesheet.
    // See lessons/page-circuit.md#circuit-88
    {
      const card = circ.getBoundingClientRect();
      const l = brands.firstChild.getBoundingClientRect();
      const r = brands.lastChild.getBoundingClientRect();
      const insets = [l.left - card.left, card.right - r.right, l.top - card.top];
      const spread = Math.max(...insets) - Math.min(...insets);
      d.assert('the printed names sit the same distance from the top and both sides',
        spread <= 1.5,
        `left ${insets[0].toFixed(1)}, right ${insets[1].toFixed(1)}, top ${insets[2].toFixed(1)}`);
    }

    // The foot is measured from the bottom pad, not from the stylesheet: a reserved
    // label slot can sit between the padding and what a reader sees.
    // See lessons/page-circuit.md#circuit-89
    {
      const card = circ.getBoundingClientRect();
      const lastPad = grid.at(0, 3).button.getBoundingClientRect();
      /* Against the card's own inset at the printed name, not the first control, whose
         distance moves with the window in a centred panel.
         See lessons/page-circuit.md#circuit-90 */
      const brand = brands.firstChild.getBoundingClientRect();
      const foot = card.bottom - lastPad.bottom;
      const inset = brand.left - card.left;
      /* Deeper than the side inset, by at most 20 px.
         See lessons/page-circuit.md#circuit-91 */
      d.assert('the panel is deeper under its last pad than it is wide at its printed name',
        foot > inset && foot - inset <= 20,
        `foot ${foot.toFixed(1)}, inset ${inset.toFixed(1)}`);

      /* The card lines up with every other block on the page.
         See lessons/page-circuit.md#circuit-92 */
      const page = d.el.getBoundingClientRect();
      d.assert('the panel box starts and ends where the rest of the page does',
        Math.abs(card.left - page.left) <= 1 && Math.abs(card.right - page.right) <= 1,
        `left ${(card.left - page.left).toFixed(1)}, right ${(card.right - page.right).toFixed(1)}`);
    }

    /**
     * The log is graded: eleven messages went in above and two clock bytes did not.
     * See lessons/page-circuit.md#circuit-93
     */
    d.assert('every message that is not a flood took a row',
      traffic.count() === 11, `${traffic.count()} rows for 11 messages and 2 clocks`);

    // A message this panel has no place for still gets a row.
    // See lessons/page-circuit.md#circuit-94
    const wasRows = traffic.count();
    take([0xb4, 100, 7]);                    // CC 100 on channel 5: nothing here places it
    d.assert('and a message the panel cannot place is listed all the same',
      traffic.count() === wasRows + 1 && traffic.el.textContent.includes('B4 64 07'),
      `${traffic.count()} rows, looked for B4 64 07`);

    d.assert('the clock bytes took no row at all',
      !traffic.el.textContent.includes('F8'), `${traffic.count()} rows`);

    /**
     * The reserved room is measured against a real row, because `--tbl-row-h` in shell.css
     * and `.pos-tbl-row` are two constants meant to agree. The empty box shows no caption.
     * See lessons/page-circuit.md#circuit-95
     */
    {
      const row = traffic.el.querySelector('.pos-tbl-row:not(.pos-tbl-head)');
      const rowH = row ? row.getBoundingClientRect().height : 0;
      d.assert('the empty log held room for six rows and said nothing in it',
        emptySays === null && rowH > 0 && emptyBox >= rowH * 6 - 2 && emptyBox <= rowH * 6 + 4,
        `${emptyBox.toFixed(1)} px of room against ${rowH.toFixed(1)} px a row, `
        + `six of which is ${(rowH * 6).toFixed(1)}, and the caption element is `
        + `${emptySays === null ? 'not there' : JSON.stringify(emptySays.textContent)}`);
    }

    d.assert('no secret in this page', !location.href.includes('token'));

    await checkMidiNode({ assert: d.assert, log: d.log, page: bayMidi, slug: 'circuit' });
  });

  d.ready();
</script>
</html>

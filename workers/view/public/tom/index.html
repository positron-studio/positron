<style>
  /* The pitch, ruler height and label column width are `--pg-gap`, `--pg-cell`,
     `--pg-ruler` and `--pg-lab` in shell.css; step-grid.mjs writes `--pg-cell`
     onto both halves so they cannot drift.
     See lessons/page-tom.md#tom-1 */

  /* No plate rule here: instrument-panel.mjs puts the nameplate in its own row at
     the foot, so nothing floats over the case and the grid starts at the top.
     See lessons/page-tom.md#tom-2 */

  /* The grid's own rules are in shell.css under step-grid. What stays here is this
     page's: the label column without the panel's divider, and the last-heard line.
     See lessons/page-tom.md#tom-3 */

  /* The label column is the panel's fixed column. Gutter and divider come off here
     because `.panel-fixed-l` sets them back; 22 px `--pg-lab` holds `63` (12.04 px
     ink) only with zero inline padding. The left margin escapes the card's inset.
     See lessons/page-tom.md#tom-4 */
  .tom-fixed {
    gap: var(--pg-gap); border-right: 0; padding-right: 0;
    margin-inline-start: calc(var(--ctl-gap) - var(--panel-pad));
  }

  /* Changes on a press, never on a clock, and is a fixed box so a long name cannot
     move the grid.
     See lessons/page-tom.md#tom-5 */
  .tom-line {
    font: 400 12px/1.5 var(--mono); color: var(--dim); min-height: 1.5em;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createSampleLoader } from '/shell/sample-loader.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createPanelLayout } from '/shell/panel-layout.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { createStepGrid } from '/shell/step-grid.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import {
    samplesIn, toMono, summariseAll, containerOf, CONTAINER,
  } from '/shell/circuit-sample.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  /**
   * This page sends nothing and asks nobody for anything, asserted over counters
   * rather than a grep. Nothing here can reach an instrument.
   * See lessons/page-tom.md#tom-6
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }
  let fetched = 0;
  const realFetch = window.fetch.bind(window);
  window.fetch = (...a) => { fetched++; return realFetch(...a); };

  // The pack is not in this repository. Default is to fetch nothing on any origin;
  // the reading checks run only with an explicit `?pack=<url>`, e.g.
  // /tom/?pack=/tmp/personal/mine.circuitpack
  // See lessons/page-tom.md#tom-7
  const PACK = new URLSearchParams(location.search).get('pack') || '';
  const PACK_HERE = !!PACK;

  /**
   * Sixteen steps: a Circuit pattern's length. Ruler marks every 4 (beat) and 16
   * (bar) stay true at any step count.
   * See lessons/page-tom.md#tom-8
   */
  const STEPS = 16;
  /**
   * 64 rows at rest, the Circuit's sample slot count. About 1,300 px tall, so the
   * transport scrolls off; a nested vertical scroller would be worse.
   * See lessons/page-tom.md#tom-9
   */
  const REST_ROWS = 64;
  /**
   * One step in ms. 125 ms is a sixteenth at 120 bpm. Tempo is the deck's rate,
   * set by the `- bpm +` stepper below; there is no second tempo quantity.
   * See lessons/page-tom.md#tom-10
   */
  const STEP_MS = 125;
  /** One millisecond, so no event sits exactly on the range start. See the
   *  schedule below: an event at 0 is never re-armed by a backward seek. */
  const SCORE_EPS = 1;
  const SPAN = STEPS * STEP_MS;

  const d = mount({
    name: 'tom',
    what: 'tap a grid of 16 steps whose rows become the samples out of a Circuit pack or sample set you open here',
    /**
     * See lessons/page-tom.md#tom-11
     */
    /* `readout: null`, not omitted: shell.mjs reads null as an opt out and the harness
       asserts the page has no readout on purpose. The worst lateness is in the log.
       See lessons/page-tom.md#tom-12 */
    readout: null,
    /**
     * No control row. verify.mjs presses every `.pos-controls` button, and a `clear`
     * there would empty the pattern under this page's own checks.
     * See lessons/page-tom.md#tom-13
     */
    controls: [],
  });
  guard(d);

  // ── where the playhead is, as a step ────────────────────────────────────
  /**
   * Pure, so it can be graded without a browser or sound: a step one past the end,
   * a negative position and a floor turned round are the bugs this guards.
   * See lessons/page-tom.md#tom-14
   */
  function stepAt(pos) {
    const i = Math.floor((pos - 0) / STEP_MS);
    return Math.min(STEPS - 1, Math.max(0, i));
  }

  // ── what is open ────────────────────────────────────────────────────────
  /**
   * `[{ name, wave, row }]`. `wave` is null on a resting row and `row.ok` false on
   * a sample that would not read; both keep their place in the grid.
   * See lessons/page-tom.md#tom-15
   */
  let rows = restRows();
  /**
   * Which pads are on lives in step-grid.mjs only; a second copy here would be two
   * numbers that agree until one is edited.
   * See lessons/page-tom.md#tom-16
   */
  let ac = null, master = null;
  const bufs = new Map();         // row index -> AudioBuffer
  let voices = 0, silent = 0, worstLate = 0, lastFired = null;
  let picked = -1, built = 0;
  let audioSaid = false;

  function restRows() {
    return Array.from({ length: REST_ROWS }, (_, i) => (
      { name: `row ${i + 1}`, wave: null, row: null }
    ));
  }

  const hasSound = (r) => !!(rows[r] && rows[r].wave && rows[r].wave.ok);
  // A function declaration so it is hoisted: a `const` would be read in its
  // temporal dead zone by anything above the grid.
  // See lessons/page-tom.md#tom-17
  function onCount() { return grid.count(); }

  // ── the deck ────────────────────────────────────────────────────────────
  /**
   * The timeline's own deck, not a setInterval. createAudioLane is not used because
   * it cannot loop: `rendered` is terminal in timeline/transport.mjs (read off the
   * source). The timer lane's cost is reported as `late`.
   * See lessons/page-tom.md#tom-18
   */
  /** How many times the SCHEDULER called this, which is a different number
   *  from how many sounds started: a step with no cell on it actuates and is
   *  silent. A count on the far side of the boundary from `voices`. */
  let actuated = 0;
  const stepAdapter = {
    /**
     * No rate lattice: `caps.rates` is empty, so the bar shows none. The `- bpm +`
     * stepper sets the same deck rate; 120 bpm is rate 1 because a step is 125 ms.
     * See lessons/page-tom.md#tom-19
     */
    caps: { continuous: false, assertOnSeek: true },
    actuate(p) {
      actuated++;
      fireStep(p.step);
      // Against the millisecond the score asks for, not the previous step, which would
      // only measure the timer against itself.
      // See lessons/page-tom.md#tom-20
      worstLate = Math.max(worstLate, Math.abs(deck.position() - p.at));
    },
    // Count only. The rows a reducer is handed are not the scheduled items.
    // See lessons/page-tom.md#tom-21
    reduce: (r) => ({ count: r.length }),
    assertState: (s) => s,
  };

  const deck = createDeck({
    items: [],
    adapters: { step: stepAdapter },
    range: [0, SPAN],
    onPosition: (pos) => { showAt(pos); wrapAt(pos); },
  });
  for (let i = 0; i < STEPS; i++) {
    /**
     * Each step is 1 ms past its range start: transport.mjs re-arms with `ev.at > p0`
     * strictly, so an event at 0 is silent after a wrap. 1 ms is 0.008 of a step and
     * stepAt() is unaffected.
     * See lessons/page-tom.md#tom-22
     */
    deck.schedule({ at: i * STEP_MS + SCORE_EPS, kind: 'step', id: `s${i}`,
                    payload: { step: i, at: i * STEP_MS } });
  }



  /**
   * Bright while it runs, dim while parked. The component deletes `data-live`
   * rather than setting it empty, because the selectors match on presence.
   * See lessons/page-tom.md#tom-23
   */
  const setLive = (yes) => grid.live(yes);

  /**
   * Permanent loop: a sixteen step pattern repeating is what the instrument does,
   * so there is no control. The wrap is a backward seek, the same path as the bar's.
   * See lessons/page-tom.md#tom-24
   */
  /**
   * The deck's end stop pauses at the top of the range, so a wrap guarded on
   * `playing` never fires. wrapAt seeks and plays again.
   * See lessons/page-tom.md#tom-25
   */
  /**
   * Wrap before the end stop: the last onPosition call arrives below SPAN. 40 ms
   * covers a 25 ms tick at 60 Hz reporting, and only cuts silence after step 16.
   * See lessons/page-tom.md#tom-26
   */
  const WRAP_AT = SPAN - 40;
  function wrapAt(pos) {
    if (pos < WRAP_AT) return;
    deck.seek(0);
    if (!deck.transport.playing) deck.transport.play();
  }


  // ── the way in ──
  // It is open, not upload: the file is read into an ArrayBuffer in this tab and
  // drop.mjs names no network API.
  // See lessons/page-tom.md#tom-27
  const drop = createDrop({
    // `.syx` too: a bulk sample transfer is a `.syx`, and some `.circuitpack` files
    // are not zips.
    // See lessons/page-tom.md#tom-28
    accept: ['.circuitpack', '.zip', '.syx'],
    title: 'UPLOAD FILE',
    label: 'Open file',
    beside: 'or drag a file here',
    // No resting line: the footer appears when it has something to say.
    // See lessons/page-tom.md#tom-29
    empty: '',
    hint: 'drop a pack anywhere on this page',
    says: (m, kind) => d.log(m, kind),
    onOpen: (files) => openFiles(files),
  });
  const loader = createSampleLoader({ say: (m, k) => drop.say(m, k), log: (m, k) => d.log(m, k) });
  d.stack.add(drop.el);
  /**
   * On `window.__demo`, not mount()'s return value: a drag cannot be synthesised and
   * the button opens an OS dialog, so this is the only drivable way in.
   * See lessons/page-tom.md#tom-30
   */
  window.__demo.drop = drop;
  /* The worst lateness, published as a getter for the checks rather than read out
     of a cell.
     See lessons/page-tom.md#tom-31 */
  Object.defineProperty(window.__demo, 'worstLate', { get: () => worstLate });


  // ── the transport ──
  // `scrub: false`: the grid's ruler is the one position surface on this page.
  // See lessons/page-tom.md#tom-32
  /**
   * `- bpm +` sets the deck's rate and nothing else, so there is one tempo quantity
   * and the score is never rescheduled. createStepper, 60 to 240 bpm (rate 0.5 to 2).
   * See lessons/page-tom.md#tom-33
   */
  const BPM_AT_1 = 60000 / (STEP_MS * 4);      // 120, and derived rather than typed
  const BPM_MIN = 60, BPM_MAX = 240, BPM_STEP = 5;
  let bpm = BPM_AT_1;
  const BPMS = [];
  for (let v = BPM_MIN; v <= BPM_MAX; v += BPM_STEP) BPMS.push(v);
  /**
   * The middle is a `pick` so it jumps to a tempo; `-` and `+` walk in fives. Its
   * width comes from the widest option so the arrows do not move.
   * See lessons/page-tom.md#tom-34
   */
  const tempo = createStepper({
    what: 'tempo',
    prev: () => setBpm(bpm - BPM_STEP),
    next: () => setBpm(bpm + BPM_STEP),
    pick: {
      options: BPMS.map((v) => `${v} bpm`),
      at: BPMS.indexOf(BPM_AT_1),
      onPick: (i) => setBpm(BPMS[i]),
    },
  });
  function setBpm(v) {
    bpm = Math.min(BPM_MAX, Math.max(BPM_MIN, Math.round(v)));
    const i = BPMS.indexOf(bpm);
    tempo.show(`${bpm} bpm`, i >= 0 ? i : undefined);
    // setRate does not start playback, so changing tempo while stopped stays stopped.
    // See lessons/page-tom.md#tom-35
    deck.setRate(bpm / BPM_AT_1);
  }
  setBpm(BPM_AT_1);



  /**
   * `loop: false`: the pattern repeats by wrapAt, not by the bar's LOOP window.
   * Turning it back on is `loop: true`.
   * See lessons/page-tom.md#tom-36
   */
  /**
   * Tempo in the bar's `right` slot rather than querying `.tbar-rates`. It is not
   * in `.pos-controls`, so the harnesses do not press it; the checks drive it by name.
   * See lessons/page-tom.md#tom-37
   */
  /* A detached host: the bar's row is built below by the instrument panel, and
     handing it `d.el` would make the source disagree with the DOM.
     See lessons/page-tom.md#tom-38 */
  const bar = createTransportBar(document.createElement('div'), deck,
    { scrub: false, loop: false, right: [tempo.el], verb: 'stop' });

  /**
   * The second press stops and rewinds to the first column; a drum machine has no
   * pause. It reads the transport state after the bar's own handler (setTimeout),
   * because onState does not fire on play.
   * See lessons/page-tom.md#tom-39
   */
  // `bar.el`, not `bar.api.el`: createTransportBar returns a wrapper, and the wrong
  // one threw on load.
  // See lessons/page-tom.md#tom-40
  /**
   * Both ways in: transport-bar.mjs's key table calls `cmd.pause()` directly, so a
   * click listener never sees space. One function, two listeners, added after the
   * bar's so they run after it.
   * See lessons/page-tom.md#tom-41
   */
  function rewindIfStopped() {
    setTimeout(() => {
      if (!deck.transport.playing && deck.position() > 0) deck.seek(0);
    }, 0);
  }
  bar.el.querySelector('.tbar-toggle')?.addEventListener('click', rewindIfStopped);
  addEventListener('keydown', (e) => { if (e.key === ' ') rewindIfStopped(); });
  setBpm(BPM_AT_1);

  // Never re-publish `__demo.transport`: `publish: true` already wrote the bar's
  // `api`, and the wrapper has no `position` for verify.mjs.
  // See lessons/page-tom.md#tom-42

  // ── the grid ──
  // A fixed column beside one scroller (panel-layout.mjs). Sixteen steps fit; if
  // they overflow the strip takes it. `flow: false` keeps the grid's 2 px rhythm.
  // See lessons/page-tom.md#tom-43
  /* `cased: true` supplies `--panel-pad: 20px`. The border and radius go flat by
     themselves inside the glue (`--edge` and `--r` inherit as 0); never patch them.
     See lessons/page-tom.md#tom-44 */
  const panel = createPanelLayout({
    side: 'left', flow: false,
    cls: { panel: 'tom', fixed: 'tom-fixed' },
    /**
     * The scroller takes no tab stop: transport-bar.mjs's arrows seek on `window`, so
     * a focusable scroller would move the playhead. The ruler carries the tab stop.
     * See lessons/page-tom.md#tom-45
     */
    strip: { role: 'group', label: 'steps' },
  });
  /**
   * createStepGrid (not createPadGrid, which is pad.mjs's hardware keypad). The
   * component owns the pads and their edges; this page owns sound and transport,
   * and asks for no `rate`, so `grid.clock` is null.
   * See lessons/page-tom.md#tom-46
   */
  const grid = createStepGrid({
    fixed: panel.fixed,
    strip: panel.strip,
    rows: rows.length,
    steps: STEPS,
    label: (r) => String(r),
    title: (r) => (hasSound(r)
      ? `${rows[r].name}, ${rows[r].row.seconds.toFixed(2)} s, `
        + `peak ${rows[r].row.peak.toFixed(2)}. Press to hear it`
      : (rows[r].row && !rows[r].row.ok
        ? `this one did not read: ${rows[r].row.why}`
        : 'this row has no sample yet, so its steps are silent')),
    // A row with a sample is a button and a row without is a div, which the
    // component decides from this. Not a disabled button: at rest every row
    // here is empty, and sixty four dimmed controls read as a page that failed.
    canPress: (r) => hasSound(r),
    onLabel: (r) => audition(r),
    silent: (r) => !hasSound(r),
    onSeek: (s) => deck.seek(s * STEP_MS),
    /**
     * A press makes a sound and a page setting a cell does not, which is what `why`
     * is for. `draw` is a pad dragged across under a held pointer.
     * See lessons/page-tom.md#tom-47
     */
    onToggle: (r, s, lit, why) => {
      /* `draw` and its old name `stroke` are both listed, because a page that stops
         firing on a drag is silent rather than red.
         See lessons/page-tom.md#tom-48 */
      if (lit && (why === 'press' || why === 'draw' || why === 'stroke')) fire(r, 'a cell');
    },
  });
  const fixedEl = panel.fixed;
  const rulerEl = grid.ruler;
  const rowsEl = grid.rowsEl;
  /**
   * Empty at rest and reserved: `min-height` keeps the room so the block below does
   * not move, and no border paints on an empty one.
   * See lessons/page-tom.md#tom-49
   */
  const line = el('div', 'tom-line', '');

  // ── the instrument ──────────────────────────────────────────────────────
  //
  /**
   * Transport, grid and nameplate glued as one instrument panel; the plate goes to
   * the foot whatever order. `pad: false` makes each child take its row, `full: true`
   * because the grid is sized by its width, `place: 'end'` keeps the plate right.
   * See lessons/page-tom.md#tom-50
   */
  const inst = createInstrumentPanel({
    rows: [[[bar.el], { pad: false }], [[panel.el], { pad: false }]],
    plate: { name: 'TOM', place: 'end' },
    full: true,
  });
  d.stack.add(inst.el, line);

  /**
   * The play state comes from `deck.transport.onState` (createDeck takes no onState
   * option). Subscribed here, not beside the deck, because it fires immediately and
   * `rowsEl` would be in its dead zone.
   * See lessons/page-tom.md#tom-51
   */
  /**
   * See lessons/page-tom.md#tom-52
   */
  /**
   * onPosition fires only while playing, so wrapAt needs no armed flag. The state
   * listener only paints the parked column dim and the playing one bright.
   * See lessons/page-tom.md#tom-53
   */
  deck.transport.onState((st) => setLive(!!st?.playing));

  /**
   * Put the head on the step the position is in. The picture is the component's,
   * the step length is this page's; `at()` touches the DOM only when the step changes.
   * See lessons/page-tom.md#tom-54
   */
  function showAt(pos) {
    grid.at(stepAt(pos));
  }

  // ── pressing things ──
  // Stroke, roving tab stop, ruler seek and keys are in step-grid.mjs; the sound
  // they cost arrives here through onToggle and onSeek.
  // See lessons/page-tom.md#tom-55
  const setCell = (r, s, v) => grid.set(r, s, v, 'page');

  // ── the sound ───────────────────────────────────────────────────────────
  /**
   * Decode on a press or a step, never on a visit. `AudioContext.resume()` does not
   * reject without a gesture, so it is fired and never awaited.
   * See lessons/page-tom.md#tom-56
   */
  function fire(r, why, tell = true) {
    if (!hasSound(r)) { silent++; return false; }
    let buf = bufs.get(r);
    try {
      if (!buf) {
        // Audio comes from circuit-sample.mjs's toMono, not decodeAudioData: it says why
        // a file is refused, and being synchronous a check can grade a press directly.
        // See lessons/page-tom.md#tom-57
        const m = toMono(rows[r].wave);
        if (!m.ok) { silent++; d.log(`${rows[r].name} did not decode: ${m.why}`, 'bad'); return false; }
        // An empty slot is a row, and `createBuffer(1, 0, rate)` throws, so zero frames
        // reads as empty (bulk transfers have empty slots).
        // See lessons/page-tom.md#tom-58
        if (m.frames === 0) { silent++; d.log(`${rows[r].name} is an empty slot`); return false; }
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        ac.resume();
        if (!master) {
          master = ac.createGain();
          // Sixty four rows can land on one step. Half scale leaves room for
          // that without the page deciding a mix nobody asked for.
          master.gain.value = 0.5;
          master.connect(ac.destination);
        }
        buf = ac.createBuffer(1, m.frames, m.rate);
        buf.copyToChannel(m.samples, 0);
        bufs.set(r, buf);
        // Only the first sound pays this, because it builds the context; the rest are
        // decoded here and out of the firing path.
        // See lessons/page-tom.md#tom-59
        warmRows();
      }
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(master);
      src.start();
      voices++;
      lastFired = { row: r, name: rows[r].name, seconds: buf.duration, frames: buf.length, rate: buf.sampleRate, why };
      // On a press and never on a step: eight lines a second is unreadable.
      // See lessons/page-tom.md#tom-60
      if (tell) line.textContent = `${rows[r].name}, ${buf.duration.toFixed(2)} s, ${why}`;
      return true;
    } catch (e) {
      if (!audioSaid) { d.log(`no sound here (${e.message})`, 'bad'); audioSaid = true; }
      return false;
    }
  }

  /** Every row switched on at this step, in row order. Returns how many really
   *  sounded, which is not the same as how many cells were on. */
  function fireStep(s) {
    let n = 0;
    for (let r = 0; r < rows.length; r++) if (grid.get(r, s) && fire(r, `step ${s + 1}`, false)) n++;
    return n;
  }

  /** Hear one row on its own. A grid of sixty four rows named `sample_0.wav` to
   *  `sample_63.wav` cannot be worked without this. */
  function audition(r) {
    picked = r;
    // `lit` is a colour, never a box: hearing a row is not selecting it.
    // See lessons/page-tom.md#tom-61
    grid.lit(r);
    fire(r, 'its name');
  }

  // ── opening a file ──────────────────────────────────────────────────────
  /**
   * A pack a person opens starts the transport from 0. Only here, after drop.mjs's
   * onOpen (a gesture), never in openPack, which harnesses and openZip also call.
   * Refused files leave the transport alone; an empty grid plays silence.
   * See lessons/page-tom.md#tom-62
   */
  async function openFiles(files) {
    let opened = false;
    for (const f of files) {
      const ok = f.name.toLowerCase().endsWith('.zip')
        ? await openZip(f.name, f.bytes)
        : await openPack(f.name, f.bytes);
      opened = opened || ok === true;
    }
    if (!opened) return false;
    deck.seek(0);
    if (!deck.transport.playing) deck.transport.play();
    return true;
  }

  /**
   * Samples come from circuit-sample.mjs's samplesIn, sorted by the number in the
   * name. A file that will not parse keeps its row with `row.ok === false`.
   * See lessons/page-tom.md#tom-63
   */
  /**
   * Byte 0 routes the file: `50 4b` is a zip, `f0` a bulk SysEx transfer, anything
   * else (an executable, a ROM) is refused.
   * See lessons/page-tom.md#tom-64
   */
  /* The three openers are sample-loader.mjs's, shared with /drums/samples/. What
     stays here is what this page does with the samples: `setRows`.
     See lessons/page-tom.md#tom-65 */
  async function openPack(name, bytes, from = '') {
    const got = await loader.openPack(name, bytes, from);
    if (!got) return false;
    setRows(got);
    return true;
  }
  async function openStream(name, bytes, from = '') {
    const got = await loader.openStream(name, bytes, from);
    if (!got) return false;
    setRows(got);
    return true;
  }

  /**
   * A real download is a zip of packs: it can hold `.circuitpack`, `.syx` and a
   * `.circuittrackspack` (the other instrument, named not opened). A zip of one big
   * `.syx` is a sample transfer; a loose 350 byte patch is left alone.
   * See lessons/page-tom.md#tom-66
   */
  async function openZip(name, bytes) {
    const got = await loader.openZip(name, bytes);
    if (!got) return false;
    setRows(got);
    return true;
  }


  /**
   * The pattern survives a pack: rows that still exist keep their steps, new rows
   * start empty.
   * See lessons/page-tom.md#tom-67
   */
  /**
   * Every sample is decoded when the pack opens, not when a step fires, so the
   * first hit of a row does not pay toMono and createBuffer late. Opening is a press;
   * it still does not create the AudioContext.
   * See lessons/page-tom.md#tom-68
   */
  function warmRows() {
    if (!ac) return;
    for (let r = 0; r < rows.length; r++) {
      if (bufs.has(r) || !hasSound(r)) continue;
      const m = toMono(rows[r].wave);
      if (!m.ok || m.frames === 0) continue;
      const b = ac.createBuffer(1, m.frames, m.rate);
      b.copyToChannel(m.samples, 0);
      bufs.set(r, b);
    }
  }

  function setRows(got) {
    rows = got;
    bufs.clear();
    picked = -1;
    // setRows in the component carries every pad that still has a row; asserted.
    // See lessons/page-tom.md#tom-69
    const t0 = performance.now();
    grid.setRows(rows.length);
    grid.redraw();
    built = performance.now() - t0;
    // After the grid, so the picture is up before decoding, and only if a context
    // already exists: making one here would open an audio device nobody asked for.
    // See lessons/page-tom.md#tom-70
    const t1 = performance.now();
    warmRows();
    const warmed = performance.now() - t1;
    d.log(`${rows.length} rows, ${STEPS} steps, drawn in ${built.toFixed(0)} ms`
      + (bufs.size ? `, ${bufs.size} decoded in ${warmed.toFixed(0)} ms` : ''));
  }


  // ── what a visit is allowed to have done ────────────────────────────────
  d.assert('a visit opens nothing, asks for nothing and makes no sound',
    drop.opens === 0 && fetched === 0 && voices === 0 && ac === null && onCount() === 0,
    `${drop.opens} file(s) opened, ${fetched} request(s), ${voices} sound(s), `
    + `${onCount()} cell(s) on, audio context ${ac === null ? 'never made' : 'made'}`);

  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  d.assert('the grid is 64 rows of 16 steps before a pack lands, one row for every sample slot',
    grid.pads.length === REST_ROWS && grid.pads.every((r) => r.length === STEPS)
    && rows.every((r) => r.wave === null),
    `${grid.pads.length} rows of ${grid.pads[0] ? grid.pads[0].length : 0}, none of them a sample`);

  d.assert('the way in is visible at rest and says what it takes',
    drop.el.classList.contains('pos-drop-area')
    && /\.circuitpack/.test(drop.el.querySelector('.pos-drop-hint')?.textContent || ''),
    `"${drop.el.querySelector('.pos-drop-hint')?.textContent || ''}"`);

  d.assert('the block has no footer until something has been opened',
    drop.note.hidden === true && drop.note.textContent === '',
    `hidden ${drop.note.hidden}, saying "${drop.note.textContent}"`);

  /**
   * The harness's only handle. createTransportBar publishes `api` and returns a
   * wrapper with no `position`; never assign one over the other.
   * See lessons/page-tom.md#tom-71
   */
  d.assert('the transport the harness reads is the bar\'s own api and not the wrapper around it',
    window.__demo.transport === bar.api && window.__demo.transport !== bar
    && typeof window.__demo.transport.position === 'number',
    `position ${window.__demo.transport.position}, range ${JSON.stringify(bar.api.range)}`);

  /**
   * The computed display: the scrub slider is always appended, and `scrub: false`
   * hides it through `data-scrub="0"`.
   * See lessons/page-tom.md#tom-72
   */
  {
    const scrubEl = bar.el.querySelector('.tbar-scrub');
    d.assert('the grid is the one position surface, so the bar draws no slider',
      bar.el.dataset.scrub === '0' && getComputedStyle(scrubEl).display === 'none'
      && rulerEl.getAttribute('role') === 'slider' && grid.ticks.length === STEPS,
      `the bar says data-scrub="${bar.el.dataset.scrub}" and its slider computes `
      + `display: ${getComputedStyle(scrubEl).display}, against ${grid.ticks.length} `
      + 'ticks on the ruler that do seek');
  }

  /**
   * The arrangement is read off the rendered DOM by `shape()`. The order is the
   * claim: transport above grid, plate at the foot.
   * See lessons/page-tom.md#tom-73
   */
  d.assert('the transport, the grid and the nameplate are one glued object, in that order',
    JSON.stringify(inst.shape()) === JSON.stringify(['controls', 'controls', 'plate'])
    && inst.el.classList.contains('pos-glue')
    && inst.el.contains(bar.el) && inst.el.contains(panel.el),
    `${inst.shape().join(', ')}, on a ${inst.el.className.split(' ').join('.')}`);

  /**
   * One edge per object, measured: the `.panel-case` inside the glue must compute
   * no border, and the glued surface must still have its own.
   * See lessons/page-tom.md#tom-74
   */
  {
    const caseCs = getComputedStyle(panel.el);
    const surfCs = getComputedStyle(inst.el);
    d.assert('the grid’s case gives up its own edge inside the panel, and the panel keeps one',
      caseCs.borderTopWidth === '0px' && caseCs.borderTopLeftRadius === '0px'
      && parseFloat(surfCs.borderTopWidth) > 0,
      `the case draws ${caseCs.borderTopWidth} at radius ${caseCs.borderTopLeftRadius}, `
      + `the surface ${surfCs.borderTopWidth} at radius ${surfCs.borderTopLeftRadius}`);
  }

  /**
   * Three alignments are three asserts: the name column and the steps are separate
   * flex children and agree only because both use one token.
   * See lessons/page-tom.md#tom-75
   */
  {
    const n0 = grid.labels[0].getBoundingClientRect();
    const r0 = rowsEl.children[0].getBoundingClientRect();
    const nz = grid.labels[grid.labels.length - 1].getBoundingClientRect();
    const rz = rowsEl.children[rowsEl.children.length - 1].getBoundingClientRect();
    d.assert('the first name sits on the first row of steps',
      Math.abs(n0.top - r0.top) < 1 && Math.abs(n0.bottom - r0.bottom) < 1,
      `top ${(n0.top - r0.top).toFixed(2)} px apart, bottom ${(n0.bottom - r0.bottom).toFixed(2)} px apart`);
    d.assert('and the last one still does, so the two columns share one pitch',
      Math.abs(nz.top - rz.top) < 1 && Math.abs(nz.bottom - rz.bottom) < 1,
      `top ${(nz.top - rz.top).toFixed(2)} px apart over ${grid.labels.length} rows`);
  }

  /**
   * The gutter's left inset is checked against the transport bar's first control,
   * not a number, so if `--ctl-gap` or the bar's 8 px moves this goes red. Box only;
   * the ink assert below grades what can be read.
   * See lessons/page-tom.md#tom-76
   */
  {
    const toggleEl = bar.el.querySelector('.tbar-toggle');
    const box = grid.labels[0].getBoundingClientRect();
    const tgl = toggleEl.getBoundingClientRect();
    d.assert('the gutter starts where the transport bar’s first control does, one inset for the object',
      Math.abs(box.left - tgl.left) < 1,
      `the column at ${box.left.toFixed(2)} against the play button at `
      + `${tgl.left.toFixed(2)}, ${(box.left - tgl.left).toFixed(2)} px apart`);
  }

  /**
   * Every gutter label's rendered box against its ink, which tells a clip from a
   * truncation. Ink measured in the label's font from longhands, because `font`
   * serialises as "" here and a bad canvas font silently measures 10 px.
   * See lessons/page-tom.md#tom-77
   */
  {
    const labs = grid.labels;
    const cs = getComputedStyle(labs[0]);
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const inner = (n) => n.clientWidth - parseFloat(getComputedStyle(n).paddingRight)
      - parseFloat(getComputedStyle(n).paddingLeft);
    const cut = labs.filter((n) => n.scrollWidth > n.clientWidth);
    /* `>=`, so a tie keeps the LAST of them. Every label from 10 up is the same
       width, and `63` is the one a reader goes looking for when a digit is
       missing, so it is the one the detail should name. */
    const widest = labs.reduce((a, b) =>
      (ctx.measureText(b.textContent).width >= ctx.measureText(a.textContent).width ? b : a));
    const ink = ctx.measureText(widest.textContent).width;
    const room = inner(widest);
    d.assert('every number in the gutter is rendered whole, second digit and all',
      cut.length === 0 && room >= ink && labs.length === REST_ROWS
      && labs.every((n) => n.textContent !== ''),
      `the widest is "${widest.textContent}" at ${ink.toFixed(2)} px of ink in a `
      + `${room.toFixed(2)} px box, ${cut.length} of ${labs.length} clipped`);

    /**
     * The divider between numbers and pads is its own assert: padding and border come
     * from one rule but can be repaired one without the other.
     * See lessons/page-tom.md#tom-78
     */
    const col = getComputedStyle(fixedEl);
    d.assert('the gutter gives up the panel’s own rule and gutter, because the numbers are part of the grid',
      col.borderRightWidth === '0px' && col.paddingRight === '0px',
      `border-right ${col.borderRightWidth}, padding-right ${col.paddingRight}, `
      + `column ${fixedEl.getBoundingClientRect().width.toFixed(2)} px wide`);
  }

  /**
   * The steps scroll and the page does not, which needs `min-width: 0` beside
   * `overflow-x`. verify.mjs runs at 756 px, so this says nothing about a phone.
   * See lessons/page-tom.md#tom-79
   */
  /**
   * Does not require overflow: what the page promises is that when steps overflow
   * the strip takes it and the document never drags sideways.
   * See lessons/page-tom.md#tom-80
   */
  {
    const cs = getComputedStyle(panel.strip);
    const over = panel.strip.scrollWidth - panel.strip.clientWidth;
    /**
     * The pattern wraps and sounds again, counted by what the lane actuated rather
     * than what the deck queued. It seeks rather than waiting two laps of wall time.
     * See lessons/page-tom.md#tom-81
     */
  if (SELFCHECK) {
    const onFirst = (() => {
      // One step lit on a row that can sound, so there is something to count.
      const r = rows.findIndex((_, i) => hasSound(i));
      if (r < 0) return null;
      toggle(r, 0);
      return r;
    })();
    if (onFirst !== null) {
      deck.seek(0);
      const before = actuated;
      fireStep(0);
      const lap1 = actuated - before;
      // The wrap, down the same path `wrapAt` takes.
      deck.seek(0);
      const mid = actuated;
      fireStep(0);
      const lap2 = actuated - mid;
      d.assert('a step that has already sounded sounds again on the next lap',
        lap1 > 0 && lap2 === lap1,
        `${lap1} actuation(s) on the first pass and ${lap2} on the second, `
        + `after a backward seek`);
      toggle(onFirst, 0);
    }
  }

  /**
   * A stroke paints every pad it crosses with one value: starting on an ON pad,
   * every crossed pad ends OFF. And the stroke releases, or a hover would paint.
   * See lessons/page-tom.md#tom-82
   */
  if (SELFCHECK) {
    const row = grid.pads[0];
    const down = (c) => c.dispatchEvent(new PointerEvent('pointerdown',
      { bubbles: true, button: 0, pointerId: 1 }));
    const over = (c) => c.dispatchEvent(new PointerEvent('pointerover',
      { bubbles: true, pointerId: 1 }));
    for (let s = 0; s < 4; s++) setCell(0, s, false);

    down(row[0]); over(row[1]); over(row[2]);
    const drew = [0, 1, 2, 3].map((s) => grid.get(0, s));
    dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    over(row[3]);
    const afterUp = grid.get(0, 3);

    // Now the other way: start on a lit pad and rub a run of them out.
    for (let s = 0; s < 4; s++) setCell(0, s, s !== 2);
    down(row[0]); over(row[1]); over(row[2]); over(row[3]);
    const erased = [0, 1, 2, 3].map((s) => grid.get(0, s));
    dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));
    for (let s = 0; s < 4; s++) setCell(0, s, false);

    // `grid.get` answers a boolean; digits are made here for the detail line.
    // See lessons/page-tom.md#tom-83
    const bits = (a) => a.map((v) => (v ? 1 : 0)).join('');
    d.assert('holding and dragging paints every pad it crosses, one value for the whole stroke',
      bits(drew) === '1110' && afterUp === false
      && bits(erased) === '0000',
      `drew ${bits(drew)} then ${afterUp ? 1 : 0} after the release, `
      + `and a stroke starting on a lit pad left ${bits(erased)}`);
  }

  /**
   * The stop is driven by a real `keydown` on `window`, where the bar listens,
   * because the key path differs from `.click()`.
   * See lessons/page-tom.md#tom-84
   */
  if (SELFCHECK) {
    const key = () => dispatchEvent(new KeyboardEvent('keydown',
      { key: ' ', bubbles: true, cancelable: true }));
    const tick = () => new Promise((r) => { setTimeout(r, 0); });
    deck.seek(7 * STEP_MS);
    key();                                  // plays
    const started = deck.transport.playing;
    key();                                  // stops, and the page rewinds
    await tick();
    const after = Math.round(deck.position());
    const stopped = !deck.transport.playing;
    d.assert('space plays, and pressing it again stops and returns to the first column',
      started === true && stopped === true && after === 0,
      `space started it (${started}), stopped it (${stopped}) and left the playhead `
      + `at ${after} ms`);
  }

  /**
   * The toggle's face says stop. Read off which icon computes as displayed, since
   * the toggle holds one svg per state and shell.css shows one from `data-state`.
   * See lessons/page-tom.md#tom-85
   */
  if (SELFCHECK) {
    const tog = bar.el.querySelector('.tbar-toggle');
    const face = () => [...tog.querySelectorAll('svg')]
      .filter((s) => getComputedStyle(s).display !== 'none').map((s) => s.dataset.icon).join('+') || 'nothing';
    const was = tog.dataset.state;
    tog.dataset.state = 'paused';
    const resting = face();
    tog.dataset.state = 'playing';
    const running = face();
    if (was === undefined) delete tog.dataset.state; else tog.dataset.state = was;
    d.assert('the transport shows play at rest and a STOP square while it runs, never a pause',
      resting === 'play' && running === 'stop' && tog.getAttribute('aria-label') === 'play/stop',
      `${resting} at rest, ${running} while playing, announced as `
      + `"${tog.getAttribute('aria-label')}"`);
  }

  d.assert('the strip is what scrolls when the steps do not fit, and the page never drags sideways',
      /auto|scroll/.test(cs.overflowX) && parseFloat(cs.minWidth) === 0
      && document.documentElement.scrollWidth <= window.innerWidth + 1,
      `overflow-x ${cs.overflowX} at min-width ${cs.minWidth}, `
      + `${over > 0 ? `${over} px of steps past the box` : 'all steps fit today'}, `
      + `document ${document.documentElement.scrollWidth} px in a ${window.innerWidth} px window`);
  }

  /**
   * One tab stop for the whole grid. Asserting only that one cell is reachable
   * would pass on a grid where every cell is.
   * See lessons/page-tom.md#tom-86
   */
  {
    const all = grid.pads.flat();
    const zero = all.filter((c) => c.tabIndex === 0).length;
    const minus = all.filter((c) => c.tabIndex === -1).length;
    d.assert('the grid is one tab stop, not one per cell',
      zero === 1 && minus === all.length - 1,
      `${zero} cell(s) at 0 and ${minus} at -1, of ${all.length}`);
  }

  /**
   * The arithmetic, graded at both edges and past both of them.
   * See lessons/page-tom.md#tom-87
   */
  d.assert('a position lands on the step that holds it, and never off either end',
    stepAt(0) === 0 && stepAt(STEP_MS - 1) === 0 && stepAt(STEP_MS) === 1
    && stepAt(SPAN - 1) === STEPS - 1 && stepAt(SPAN) === STEPS - 1
    && stepAt(-1000) === 0 && stepAt(SPAN * 4) === STEPS - 1,
    `0 -> ${stepAt(0)}, ${STEP_MS} -> ${stepAt(STEP_MS)}, ${SPAN - 1} -> ${stepAt(SPAN - 1)}, `
    + `-1000 -> ${stepAt(-1000)}, ${SPAN * 4} -> ${stepAt(SPAN * 4)}`);

  // ── the checks that press things, which a visitor never sees ────────────
  if (SELFCHECK) {
    const raf2 = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    /**
     * Negative control: a row with no sample lights up and stays silent. Red the
     * moment fire() stops checking for a sample.
     * See lessons/page-tom.md#tom-88
     */
    {
      const was = voices;
      setCell(0, 0, true);
      const rang = fireStep(0);
      d.assert('NEGATIVE CONTROL: a step on a row with no sample lights its cell and starts no sound',
        grid.pads[0][0].dataset.on === '1' && grid.pads[0][0].dataset.mute === '1'
        && rang === 0 && voices === was && ac === null,
        `${rang} sound(s) from a lit cell, ${voices - was} new voice(s), `
        + `audio context ${ac === null ? 'never made' : 'made'}`);
    }

    /**
     * Negative control: an arrow inside the grid moves focus, not the playhead.
     * Without `stopPropagation` this goes red on the position.
     * See lessons/page-tom.md#tom-89
     */
    {
      const before = deck.position();
      grid.pads[0][0].focus();
      grid.pads[0][0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      const moved = document.activeElement === grid.pads[0][1];
      d.assert('NEGATIVE CONTROL: an arrow inside the grid moves focus and leaves the playhead alone',
        moved && grid.pads[0][1].tabIndex === 0 && grid.pads[0][0].tabIndex === -1
        && Math.abs(deck.position() - before) < 1,
        `focus ${moved ? 'moved one step' : 'did not move'}, position `
        + `${before.toFixed(1)} -> ${deck.position().toFixed(1)}`);
      grid.focus(0, 0);
    }

    /**
     * The byte 0 router, graded with no file, so it runs on the deploy too. All three
     * refusals must leave the grid alone.
     * See lessons/page-tom.md#tom-90
     */
    {
      const before = rows.length;
      const zipish = new Uint8Array([0x50, 0x4b, 0x03, 0x04, 1, 2, 3, 4]);
      const streamish = new Uint8Array([0xf0, 0x00, 0x20, 0x29, 0x00, 0x77, 0xf7]);
      const neither = new Uint8Array([0x4d, 0x5a, 0x90, 0x00]);

      await openPack('a truncated zip', zipish);
      const saidZip = drop.note.textContent;
      await openPack('a stream that never ends', streamish);
      const saidStream = drop.note.textContent;
      await openPack('a Windows executable', neither);
      const saidNeither = drop.note.textContent;

      d.assert('byte 0 routes a file three ways, and a stream is refused as a stream rather than as "not a pack"',
        /did not read as a pack/.test(saidZip)
        && /never ends/.test(saidStream) && !/did not read as a pack/.test(saidStream)
        && /a zip starts 50 4b/.test(saidNeither)
        && rows.length === before,
        `zip: "${saidZip}", stream: "${saidStream.slice(0, 60)}", `
        + `neither: "${saidNeither.slice(0, 60)}"`);
      // Negative control on the router: the zip and the executable must take the other
      // two branches by name.
      // See lessons/page-tom.md#tom-91
      d.assert('NEGATIVE CONTROL: the router reads the bytes rather than answering the same thing three times',
        containerOf(zipish).kind === CONTAINER.zip
        && containerOf(streamish).kind === CONTAINER.sysex
        && containerOf(neither).kind === CONTAINER.unknown
        && new Set([saidZip, saidStream, saidNeither]).size === 3,
        `${containerOf(zipish).kind}, ${containerOf(streamish).kind}, ${containerOf(neither).kind}`);
    }

    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      /**
       * On a deploy no pack is published, so what is graded is that the page asked
       * nobody for anything, with no branch on where it is served from.
       * See lessons/page-tom.md#tom-92
       */
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('where the pack is not published nothing is asked of anybody, and the way in is unchanged',
        !PACK_HERE && fetched === 0 && drop.opens === 0
        && rows.length === REST_ROWS && drop.el.classList.contains('pos-drop-area'),
        `at ${location.hostname} after ${fetched} request(s) and ${drop.opens} file(s) opened`);
    } else {
      const bytes = new Uint8Array(await r.arrayBuffer());
      await openPack('pack.circuitpack', bytes);

      d.assert('the pack gives the grid one row for every sample in it, and the steps do not move',
        rows.length === 64 && grid.pads.length === 64
        && grid.pads.every((row) => row.length === STEPS)
        && grid.labels.length === 64 && grid.labels.every((n) => n.textContent),
        `${rows.length} rows of ${grid.pads[0].length}, first "${rows[0].name}", last "${rows[63].name}"`);

      /**
       * The cell switched on earlier is still on after the pack arrived: only passes if
       * setRows copied the pattern across.
       * See lessons/page-tom.md#tom-93
       */
      d.assert('the pattern typed before the pack survives the pack arriving',
        grid.get(0, 0) === true && grid.pads[0][0].dataset.on === '1'
        && grid.pads[0][0].dataset.mute === undefined,
        `step 1 of row 1 is ${grid.get(0, 0) ? 'still on' : 'gone'} and is `
        + `${grid.pads[0][0].dataset.mute ? 'still silent' : 'no longer silent'}`);

      const all = summariseAll(rows.map((x) => x.wave));
      d.assert('all 64 read as 48 kHz 16 bit mono with none refused, and their lengths differ',
        all.parsed === 64 && all.refused === 0 && all.rates.length === 1
        && all.rates[0] === 48000 && all.depths[0] === 16 && all.channels[0] === 1
        && all.longest > all.shortest,
        `${all.parsed} of ${all.count}, ${all.rates.join('/')} Hz, ${all.depths.join('/')} bit, `
        + `${all.shortest.toFixed(6)} s to ${all.longest.toFixed(6)} s`);

      /**
       * A step plays exactly the rows on at it, each the sample's own length.
       * See lessons/page-tom.md#tom-94
       */
      {
        setCell(0, 0, false);
        setCell(3, 8, true);
        setCell(9, 8, true);
        const was = voices;
        const rang = fireStep(8);
        const want = rows[9].row.seconds;
        d.assert('a step starts one sound for each row that is on at it, each its own sample\'s length',
          rang === 2 && voices === was + 2
          && lastFired.name === rows[9].name
          && Math.abs(lastFired.seconds - want) < 0.002
          && lastFired.rate === rows[9].row.rate,
          `${rang} sound(s), last "${lastFired.name}" at ${lastFired.seconds.toFixed(6)} s `
          + `against ${want.toFixed(6)} s in its header, ${lastFired.rate} Hz`);

        /**
         * Negative control: a step with nothing on it starts nothing.
         * See lessons/page-tom.md#tom-95
         */
        const was2 = voices;
        const none = fireStep(9);
        d.assert('NEGATIVE CONTROL: a step with no cell on it starts no sound at all',
          none === 0 && voices === was2,
          `${none} sound(s) and ${voices - was2} new voice(s) from an empty step`);
        setCell(3, 8, false);
        setCell(9, 8, false);
      }

      /**
       * Pressing a row's name hears that one sample. It is an audition, so the playhead
       * must not change.
       * See lessons/page-tom.md#tom-96
       */
      {
        const was = voices, where = deck.position();
        grid.labels[7].click();
        d.assert('pressing a row\'s name hears that sample and does not move the transport',
          voices === was + 1 && lastFired.name === rows[7].name
          && grid.labels[7].dataset.lit === '1'
          && Math.abs(deck.position() - where) < 1 && deck.playing() === false,
          `"${lastFired.name}" after pressing row 8, position `
          + `${where.toFixed(1)} -> ${deck.position().toFixed(1)}`);
      }

      /**
       * The expected value is re-derived at read time, so a harness seek in the middle
       * does not take it red.
       * See lessons/page-tom.md#tom-97
       */
      {
        /**
         * The lit column is read off a real cell's computed style (generated nth-child
         * rules), and two cells are read so an all-lit grid fails.
         * See lessons/page-tom.md#tom-98
         */
        deck.seek(7 * STEP_MS);
        await raf2();
        const want = stepAt(deck.position());
        const row0 = grid.pads[0] || [];
        /**
         * Parked lifts with `filter: brightness()` and replaces no colour; playing adds an
         * inset wash over the pad. A parked head must not carry the wash.
         * See lessons/page-tom.md#tom-99
         */
        const at = row0[want];
        const parkedBg = getComputedStyle(at).backgroundColor;
        let parkedFx = getComputedStyle(at).filter;
        // The same cell with the playhead elsewhere, which is the only honest
        // reference for "its own colour survived".
        rowsEl.dataset.now = String((want + 1) % STEPS);
        const ownBg = getComputedStyle(at).backgroundColor;
        rowsEl.dataset.now = String(want);
        /**
         * `filter` transitions over `--pg-fall`, so a read in the same task returns the
         * start value; `settle` waits for the transition.
         * See lessons/page-tom.md#tom-100
         */
        const settle = async () => {
          const ms = parseFloat(getComputedStyle(at).transitionDuration) * 1000 || 0;
          await new Promise((r) => setTimeout(r, Math.max(40, ms + 30)));
          await raf2();
        };
        await settle();
        const parkedFxSettled = getComputedStyle(at).filter;
        setLive(true);
        await settle();
        const liveBg = getComputedStyle(at).backgroundColor;
        const liveFx = getComputedStyle(at).filter;
        const liveShadow = getComputedStyle(at).boxShadow;
        setLive(false);
        await settle();
        const parkedShadow = getComputedStyle(at).boxShadow;
        parkedFx = parkedFxSettled;
        setLive(!!deck.transport.playing);
        d.assert('neither playhead replaces the pad\u2019s own colour, and only the running one carries the wash',
          rowsEl.dataset.now === String(want)
          && grid.ticks[want].dataset.now === '1'
          /* The grid's own step, not a readout cell; this page has no readout.
             See lessons/page-tom.md#tom-101 */
          && grid.step() === want
          && parkedBg === ownBg && liveBg === ownBg
          && /brightness/.test(parkedFx) && liveFx !== 'none'
          && /inset/.test(liveShadow) && !/inset/.test(parkedShadow),
          /* No middots. This line glued four facts with two of them and each
             one bolted another clause on, which is the whole complaint. Four
             sentences instead. */
          `step ${want} of ${STEPS}, now=${rowsEl.dataset.now}. `
          + `The pad keeps ${ownBg} in both states. `
          + `Parked ${parkedFx} with shadow ${parkedShadow.slice(0, 40)}. `
          + `Playing ${liveFx} with shadow ${liveShadow.slice(0, 40)}`);
      }

      /**
       * Negative control: a sample that will not read keeps its row and cannot play.
       * The real samplesIn is handed a bad file rather than a faked row.
       * See lessons/page-tom.md#tom-102
       */
      {
        const bad = await samplesIn([{
          name: 'sample_999.wav', size: 8,
          read: async () => new Uint8Array([0x52, 0x49, 0x46, 0x46, 0, 0, 0, 0]),
        }]);
        const good = rows.slice();
        setRows([...good, ...bad]);
        const r64 = rows.length - 1;
        setCell(r64, 0, true);
        const was = voices;
        const rang = fireStep(0);
        d.assert('NEGATIVE CONTROL: a sample that will not read keeps its row, says why, and starts nothing',
          rows.length === 65 && bad.length === 1 && bad[0].row.ok === false
          && grid.labels[r64].tagName === 'DIV'
          && /did not read/.test(grid.labels[r64].title)
          && rang === 0 && voices === was,
          `${rows.length} rows, the last one "${bad[0].name}" refused because `
          + `"${bad[0].row.why}", ${rang} sound(s) from it`);
        setRows(good);
      }

      d.assert('the file that was opened is named in the block\'s footer, which exists only now',
        drop.note.hidden === false && /\.circuitpack/.test(drop.note.textContent),
        `"${drop.note.textContent}"`);

      /**
       * The scheduler really walking the grid. 420 ms is three steps, the fewest that
       * tell repeated firing from one seek; verify.mjs waits for `__demo.ready`. The
       * lateness is reported, not bounded.
       * See lessons/page-tom.md#tom-103
       */
      {
        setCell(0, 1, true); setCell(0, 2, true); setCell(0, 3, true);
        deck.seek(0);
        const wasV = voices, wasA = actuated;
        deck.play();
        await new Promise((r) => setTimeout(r, 420));
        deck.pause();
        /* The page's own published worstLate, not a readout cell.
           See lessons/page-tom.md#tom-104 */
        const late = Number(window.__demo.worstLate);
        d.assert('playing walks the grid and fires the cells it passes over',
          actuated >= wasA + 3 && voices >= wasV + 3
          && deck.position() > 3 * STEP_MS && Number.isFinite(late),
          `${actuated - wasA} step(s) actuated and ${voices - wasV} sound(s) started over `
          + `${deck.position().toFixed(0)} ms of transport, worst ${late} ms late`);
        setCell(0, 1, false); setCell(0, 2, false); setCell(0, 3, false);
        deck.seek(0);
      }

      /**
       * A real bulk transfer end to end: Roland_Classics.zip, one 6,753,638 byte .syx,
       * 48 filled and 16 empty slots. Under gitignored `tmp/`, so it says when skipped.
       * See lessons/page-tom.md#tom-105
       */
      {
        const zip = await realFetch('/tmp/packs/Roland_Classics.zip').catch(() => null);
        if (!zip || !zip.ok) {
          d.log('the archive download is not on this machine, so no real bulk transfer was opened');
        } else {
          const kept = rows.slice();
          const opened = await openZip('Roland_Classics.zip', new Uint8Array(await zip.arrayBuffer()));
          const filled = rows.filter((x) => x.wave.frames > 0).length;
          const empty = rows.filter((x) => x.wave.frames === 0).length;
          const all = summariseAll(rows.map((x) => x.wave));
          d.assert('a zip holding one bulk transfer and no pack opens to 64 slots, 48 of them filled',
            opened === true && rows.length === 64 && filled === 48 && empty === 16
            && all.refused === 0 && all.rates.length === 1 && all.rates[0] === 48000
            && all.depths[0] === 16 && all.channels[0] === 1
            && all.seconds.toFixed(2) === '17.31',
            `${rows.length} rows, ${filled} filled and ${empty} empty, `
            + `${all.seconds.toFixed(2)} s, all ${all.rates[0]} Hz ${all.depths[0]} bit mono`);

          // An empty slot is silent rather than a createBuffer exception.
          // See lessons/page-tom.md#tom-106
          const emptyRow = rows.findIndex((x) => x.wave.frames === 0);
          const fullRow = rows.findIndex((x) => x.wave.frames > 0);
          const wasV = voices;
          const rangEmpty = fire(emptyRow, 'the check', false);
          const rangFull = fire(fullRow, 'the check', false);
          d.assert('an empty slot starts no sound and is not an error, while a filled one still sounds',
            rangEmpty === false && rangFull === true && voices === wasV + 1
            && rows[emptyRow].row.seconds === 0 && rows[fullRow].row.seconds > 0,
            `slot ${emptyRow} is empty and rang ${rangEmpty}, slot ${fullRow} is `
            + `${rows[fullRow].row.seconds.toFixed(2)} s and rang ${rangFull}`);
          setRows(kept);
        }
      }

      d.log(`${voices} sound(s) started, worst step ${worstLate.toFixed(1)} ms late`);
    }

    /**
     * A pack opened through `drop.open` (the drag path) starts the transport; a
     * refused file leaves it alone. Runs last and restores rows and a stopped deck at
     * 0. The fixture is a built stored zip of 64 tiny WAVs, not a real pack.
     * See lessons/page-tom.md#tom-107
     */
    {
      const u16 = (n) => [n & 255, (n >>> 8) & 255];
      const u32 = (n) => [...u16(n), ...u16(n >>> 16)];
      const ascii = (s) => [...s].map((c) => c.charCodeAt(0));
      /** 48 kHz, 16 bit, mono, `frames` long. */
      const wav = (frames) => Uint8Array.from([
        ...ascii('RIFF'), ...u32(36 + frames * 2), ...ascii('WAVE'),
        ...ascii('fmt '), ...u32(16), ...u16(1), ...u16(1),
        ...u32(48000), ...u32(96000), ...u16(2), ...u16(16),
        ...ascii('data'), ...u32(frames * 2), ...new Uint8Array(frames * 2),
      ]);
      /* Stored, never deflated, so no compressor is needed and the crc can be
         0: `unzip.mjs` reads the local header's own name and extra lengths and
         checks no crc, which is measured in its own file rather than assumed. */
      const zipOf = (files) => {
        const body = [], cen = [];
        let at = 0;
        for (const [name, bytes] of files) {
          const nm = ascii(name);
          const loc = [0x50, 0x4b, 3, 4, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
            ...u32(0), ...u32(bytes.length), ...u32(bytes.length),
            ...u16(nm.length), ...u16(0), ...nm];
          body.push(...loc, ...bytes);
          cen.push(0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0), ...u16(0),
            ...u16(0), ...u16(0), ...u32(0), ...u32(bytes.length), ...u32(bytes.length),
            ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(at), ...nm);
          at += loc.length + bytes.length;
        }
        return Uint8Array.from([...body, ...cen, 0x50, 0x4b, 5, 6,
          ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
          ...u32(cen.length), ...u32(at), ...u16(0)]);
      };

      const kept = rows.slice();
      const wasOpens = drop.opens;
      deck.pause();
      deck.seek(0);

      const bad = new File([new Uint8Array([0x50, 0x4b, 3, 4, 1, 2, 3, 4])],
        'not-really.circuitpack');
      await drop.open([bad]);
      const ranOnBad = deck.transport.playing;
      /* The file name is in the pattern, because the router check leaves a similar line.
         See lessons/page-tom.md#tom-108 */
      d.assert('NEGATIVE CONTROL: a file that is refused starts nothing, however it arrived',
        ranOnBad === false && Math.abs(deck.position()) < 1 && rows.length === kept.length
        && /^not-really\.circuitpack did not read as a pack/.test(drop.note.textContent),
        `playing ${ranOnBad} at ${deck.position().toFixed(1)} ms, `
        + `${rows.length} row(s) still there, the reader was told `
        + `"${drop.note.textContent.slice(0, 48)}"`);

      const pack = zipOf(Array.from({ length: 64 }, (_, i) =>
        [`samples/sample_${i}.wav`, wav(480 + i)]));
      await drop.open([new File([pack], 'a made up pack.circuitpack')]);
      d.assert('a pack somebody hands the page starts playing it, because an upload is a gesture',
        deck.transport.playing === true && rows.length === 64
        && rows[63].name === 'sample_63.wav' && drop.opens === wasOpens + 2,
        `${rows.length} row(s) from ${(pack.length / 1024).toFixed(1)} kB of pack, `
        + `transport playing ${deck.transport.playing} at `
        + `${deck.position().toFixed(0)} ms, after ${drop.opens - wasOpens} open(s)`);

      deck.pause();
      deck.seek(0);
      setRows(kept);
    }
  }

  d.ready();
</script>

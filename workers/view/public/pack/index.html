          samples[2].row.ok === true && samples[2].row.peak !== null
          && roomCells[0] === 'Room.wav' && roomCells[1] === '1.00 s'
          && roomCells[2] === '44,100' && roomCells[3] === '44.1 kHz'
          && roomCells[4] !== '' && roomCells[5] !== ''
          && roomPlayed === 1 && roomPic === true && roomSaid === ''
          && onScreen(waveRow) === true && onScreen(whyRow) === false,
          `the row reads ${JSON.stringify(roomCells)}, its hover says `
          + `"${room.title.split('\n').pop()}", it played ${roomPlayed} time(s) and drew `
          + `${roomPic ? 'a picture' : 'no picture'} with the panel saying "${roomSaid}"`);

        /**
         * The six channel refusal gets a subject that will not be decoded away: a refusal is
         * a value a caller can show, and nothing throws.
         * See lessons/page-pack.md#pack-135
         */
        const sur = rowsNow[3];
        const surCells = [...sur.querySelectorAll('.pos-tbl-c')].map((c) => c.textContent);
        /* The press is made and refused: `playSample` returns before `played++` for a file it
           cannot mix down, and the panel's row says so.
           See lessons/page-pack.md#pack-136 */
        const beforeSur = played;
        openSample(3, true);
        const surPlayed = played - beforeSur;
        const surPic = onScreen(waveRow);
        const surSaid = onScreen(whyRow) ? whyEl.textContent : '';
        openSample(0, false);
        d.assert('a wav whose header reads and whose audio this page will not mix down keeps its header cells, empties the measured ones, draws no picture and says so in words',
          samples[3].row.ok === true && samples[3].row.peak === null
          && surCells[0] === 'Surround.wav' && surCells[1] === '1.00 s'
          && surCells[2] === '44,100' && surCells[3] === '44.1 kHz'
          && surCells[4] === '' && surCells[5] === ''
          && /channels are not mixed down here/.test(sur.title)
          && surPlayed === 0 && surPic === false && surSaid === WHY_UNPLAYABLE
          && onScreen(waveRow) === true && onScreen(whyRow) === false,
          `the row reads ${JSON.stringify(surCells)}, its hover says `
          + `"${sur.title.split('\n').pop()}", the press played it ${surPlayed} time(s), `
          + `the panel drew ${surPic ? 'a picture' : 'no picture'} and said "${surSaid}", `
          + 'and Kick.wav puts the picture back');
      }
    }

    const r = PACK_HERE ? await realFetch(PACK).catch(() => null) : null;
    if (!r || !r.ok) {
      /**
       * With no pack: the page asked nobody for anything and the drop area is the way in.
       * See lessons/page-pack.md#pack-137
       */
      d.log('the pack here is not published, so the reading checks did not run', 'bad');
      d.assert('where the pack is not published nothing is asked of anybody, and the way in is unchanged',
        !PACK_HERE && fetched === 0 && drop.opens === 0 && patches.length === 0
        && drop.el.classList.contains('pos-drop-area'),
        `at ${location.hostname} after ${fetched} request(s) and ${drop.opens} file(s) opened`);
    } else {
      await openPack('pack.circuitpack', new Uint8Array(await r.arrayBuffer()));

      /**
       * The footer arrives with the file and spans the block: as wide as its inside, at its
       * bottom, with no gap to the body above. Measured, not looked at.
       * See lessons/page-pack.md#pack-138
       */
      {
        const area = drop.el.getBoundingClientRect();
        const foot = drop.note.getBoundingClientRect();
        const body = drop.el.querySelector('.pos-drop-body').getBoundingClientRect();
        d.assert('opening a file raises a footer that spans the block and is glued to the body above it',
          drop.note.hidden === false && drop.note.textContent.includes('.circuitpack')
          && Math.abs(foot.width - (area.width - 2)) < 2
          && Math.abs(foot.bottom - (area.bottom - 1)) < 2
          && Math.abs(foot.top - body.bottom) < 2,
          `the footer is ${foot.width.toFixed(0)} px of the block's ${area.width.toFixed(0)}, `
          + `${(foot.top - body.bottom).toFixed(1)} px under the body, saying `
          + `"${drop.note.textContent}"`);
      }

      /**
       * Every patch must land in RAM: `00` at byte 6 is `Replace Current Patch`; `01` is
       * `Replace Patch`, which writes flash and overwrites the instrument's patch.
       * See lessons/page-pack.md#pack-139
       */

      await openPack('pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      d.assert('the pack reads as 64 patches, 32 sessions and 64 samples',
        patches.length === 64 && sessions.length === 32 && samples.length === 64,
        `${patches.length} / ${sessions.length} / ${samples.length}`);

      // The count leads the tab title.
      // See lessons/page-pack.md#pack-140
      d.assert('and the counts lead the tab titles',
        tabs.buttons.map((b) => b.textContent).join(' ') === '64 Patches 32 Sessions 64 Samples',
        tabs.buttons.map((b) => b.textContent).join(' '));

      d.assert('every patch in it lands in RAM rather than in flash',
        patches.every((p) => !p.writesFlash),
        `${patches.filter((p) => p.writesFlash).length} of ${patches.length} would write flash`);

      /**
       * Opening one brings it back with real layout: `getComputedTextLength` answers 0
       * under a `display: none` ancestor.
       * See lessons/page-pack.md#pack-141
       */
      d.assert('opening a pack brings the picture back, laid out rather than collapsed',
        dgHost.hidden === false && dg.el.getBoundingClientRect().height > 60
        && dg.cuts.length === 0,
        `${dg.el.getBoundingClientRect().height.toFixed(1)} px tall, ${dg.cuts.length} cut`);

      const distinct = new Set(sessions.map((s) => s.fingerprint)).size;
      d.assert('the sessions are all different from each other, so this is a backup',
        distinct === 32, `${distinct} distinct of ${sessions.length}`);

      /**
       * The panel under the list is already filled (`fill()` opens session 0), so a first
       * press does not push the page down.
       * See lessons/page-pack.md#pack-142
       */
      {
        /* The ten facts that used to be a readout are cells on the marked row.
           Read off the row rather than off `sessions[0]`, because the point is
           that the TABLE carries them. */
        const mark = sessionTable.scroller().querySelector('.pos-tbl-row.on');
        const by = (k) => mark?.children[sessionTable.columns.findIndex((c) => c.key === k)]
          ?.textContent.trim();
        d.assert('opening a pack opens its first session too, and the row carries what the readout did',
          pickedSession === 0 && partsTable.count() === 50 && !!mark
          && by('name') === 'User Session' && by('head') === 'USER' && by('marker') === 'DC BB'
          && by('synth1') === 'Frog Steps' && by('payload') && by('entropy') && by('notErased'),
          `the marked row reads name ${by('name')}, head ${by('head')}, marker ${by('marker')}, `
          + `synth 1 ${by('synth1')}, payload ${by('payload')}, entropy ${by('entropy')}`);

        /* And the stride, which the removed line was the only way to see. */
        /* No slice: `scroller()` is the body, without the heading.
           See lessons/page-pack.md#pack-143 */
        const sizes = [...partsTable.scroller().querySelectorAll('.pos-tbl-row')]
          .map((r) => r.children[1].textContent.trim());
        const runs = [];
        for (const v of sizes) {
          const last = runs[runs.length - 1];
          if (last && last.v === v) last.n++; else runs.push({ v, n: 1 });
        }
        d.assert('the region sizes are a column, so the four strides can be read off the table',
          runs.length === 4
          && runs.map((r) => `${r.n} of ${r.v}`).join(', ')
             === '1 of 76, 16 of 1,508, 32 of 720, 1 of 6,004',
          runs.map((r) => `${r.n} of ${r.v}`).join(', '));
      }

      /**
       * Note data on the page, per region (`notesIn`: 5,095 events here, 0 in all 64 blanks,
       * graded in circuit-session-test.mjs). The other 34 regions show empty, not `0`.
       * See lessons/page-pack.md#pack-144
       */
      {
        const rows = [...partsTable.scroller().querySelectorAll('.pos-tbl-row')];
        /* By column name, not index: a positional read breaks silently when a column is added.
           See lessons/page-pack.md#pack-145 */
        const notesAt = partsTable.columns.findIndex((c) => c.key === 'notes');
        const cell = (r) => r.children[notesAt].textContent.trim();
        const wide = rows.slice(1, 17);
        const rest = [...rows.slice(0, 1), ...rows.slice(17)];
        const shown = wide.reduce((n, r) => n + (+cell(r) || 0), 0);
        d.assert('the sixteen 1,508 byte regions carry a note count and the other 34 carry nothing',
          rows.length === 50 && shown === sessions[0].notes && shown > 0
          && rest.every((r) => cell(r) === ''),
          `${shown} note events across 16 regions, and ${rest.filter((r) => cell(r) === '').length} `
          + 'of the other 34 are blank rather than zero');

        /**
         * The notes are drawn one region at a time: each event on its step and slot, room
         * reserved either way, three distinct answers. The sessions tab must be open, or every
         * rect in it reads zero.
         * See lessons/page-pack.md#pack-146
         */
        const wasTab = tabs.at();
        tabs.go('sessions');
        showSession(0);
        const lit = () => padCells.flat().filter((p) => p.dataset.on).length;
        const corner = () => gridEl.firstChild.textContent;
        const onRow = () => partsTable.scroller().querySelector('.pos-tbl-row.on')
          ?.children[0].textContent.trim();
        /* Parts 1 to 16 are the wide ones and `notesIn` numbers them 0 to 15,
           so a part index is one more than the region number in an event. */
        const withNotes = sessions[0].parts.findIndex((p) => p.notes > 0);
        const emptyWide = sessions[0].parts.findIndex((p) => p.notes === 0);
        const unread = sessions[0].parts.findIndex((p) => p.notes === null);

        /* Pressed, not called: calling `showRegion` would not prove the list is wired to it.
           See lessons/page-pack.md#pack-147 */
        [...partsTable.scroller().querySelectorAll('.pos-tbl-row')][withNotes].click();
        const ev = sessions[0].events.filter((e) => e.region === withNotes - 1);
        const placed = ev.every((e) => padCells[e.slot]?.[e.step]?.dataset.on === '1'
          && padCells[e.slot][e.step].textContent === (noteName(e.note) || String(e.note)));
        d.assert('pressing a region marks its row and draws that region, every note on its own step',
          pickedRegion === withNotes && onRow() === `region ${withNotes + 1}`
          && ev.length > 0 && lit() === ev.length && placed
          && stepsHost.getBoundingClientRect().height > 100,
          `region ${withNotes + 1} holds ${ev.length} events and ${lit()} pads are lit, `
          + `the marked row reads "${onRow()}", every note is on its own step: ${placed}, `
          + `in a picture ${stepsHost.getBoundingClientRect().height.toFixed(0)} px tall`);

        /**
         * The three-way split is also a negative control: the last two answers draw the same
         * picture, so the words must differ, or the page says nothing is there about regions
         * it never read.
         * See lessons/page-pack.md#pack-148
         */
        showRegion(withNotes); const sayA = corner(); const litA = lit();
        showRegion(emptyWide); const sayB = corner(); const litB = lit();
        showRegion(unread); const sayC = corner(); const litC = lit();
        d.assert('a region with notes, one read and empty, and one never read for notes say three different things',
          litA > 0 && litB === 0 && litC === 0
          && sayB === 'no notes' && sayC === 'not read'
          && sayA !== sayB && sayA !== sayC && sayB !== sayC,
          `region ${withNotes + 1} says "${sayA}" over ${litA} pads, region `
          + `${emptyWide + 1} says "${sayB}" over ${litB}, region ${unread + 1} `
          + `says "${sayC}" over ${litC}`);

        /**
         * Present and empty when no region is pressed; six fixed rows keep it the same height
         * as a full one.
         * See lessons/page-pack.md#pack-149
         */
        showRegion(-1);
        const sglue = stepsHost.parentElement;
        /* Three parts in the glue; the sessions list is a sibling, 22 px away by
           `.pos-tabs-p > * + *`, and that gap is graded too.
           See lessons/page-pack.md#pack-150 */
        const gap = sglue.getBoundingClientRect().top
          - sessionTable.el.getBoundingClientRect().bottom;
        d.assert('the regions list, the transport and the picture are one box, empty, with the sessions list a block above it',
          sglue.classList.contains('pos-glue') && sglue.children.length === 3
          && sglue.children[0] === partsTable.el
          && sglue.children[1] === stepHost && sglue.children[2] === stepsHost
          && sessionTable.el.parentElement === sglue.parentElement
          && sessionTable.el.nextElementSibling === sglue && gap > 8
          && pickedRegion === -1 && lit() === 0 && corner() === ''
          && stepsHost.getBoundingClientRect().height > 100
          && stepHost.getBoundingClientRect().height > 40,
          `${sglue.children.length} parts, ${gap.toFixed(1)} px under the sessions list, `
          + `${lit()} lit pads, the picture `
          + `${stepsHost.getBoundingClientRect().height.toFixed(0)} px tall and the `
          + `transport ${stepHost.getBoundingClientRect().height.toFixed(0)} px`);

        /**
         * No play button and no time on that bar: the decoder reads no tempo, beat or
         * millisecond.
         * See lessons/page-pack.md#pack-151
         */
        const clockNow = stepBar.api.el.querySelector('.tbar-now')?.textContent || '';
        d.assert('the sessions transport has no play button and its clock counts steps rather than seconds',
          stepBar.api.toggles === false
          && stepBar.api.el.querySelector('.tbar-toggle') === null
          && /^step \d+ of 16$/.test(clockNow)
          && (stepBar.api.el.querySelector('.tbar-all')?.textContent ?? '') === ''
          && !/\d+[:.]\d\d/.test(stepBar.api.el.textContent),
          `the clock reads "${clockNow}" and the bar says "${stepBar.api.el.textContent.trim()}"`);

        /* ‹ and ›, pressed as a person would press them rather than by calling
           what they call. The head wraps, so the last step's neighbour is the
           first and neither button is ever dead. */
        moveHead(0);
        stepBar.extra('next').click();
        const at1 = headStep;
        stepBar.extra('prev').click();
        stepBar.extra('prev').click();
        const at2 = headStep;
        d.assert('the step head walks one step at a time, wraps round the sixteen, and is in one place at once',
          at1 === 1 && at2 === STEPS - 1
          && stepCells[at2].dataset.now === '1'
          && stepCells.filter((c) => c.dataset.now).length === 1
          && padCells.every((row) => row.filter((p) => p.dataset.now).length === 1),
          `one press of › put the head on step ${at1 + 1} and two of ‹ put it on ${at2 + 1}`);
        moveHead(0);

        /**
         * The raw gate byte reaches 96 (six patterns); the reported length never leaves the
         * sixteen steps. Both encodings are in this file, so the conversion is exercised.
         * See lessons/page-pack.md#pack-152
         */
        {
          const raw = sessions.flatMap((x) => x.events.map((e) => e.gate));
          const steps = sessions.flatMap((x) => x.events.map((e) => gateSteps(x, e)));
          const perStep = sessions.filter((x) => x.velocityPerStep).length;
          d.assert('a gate becomes a length in steps through the encoding its own header names',
            steps.length === 5095 && perStep === 8 && sessions.length - perStep === 24
            && Math.max(...raw) === 96 && Math.max(...steps) === 16
            && Math.min(...steps) > 0,
            `${perStep} sessions count gate in steps and ${sessions.length - perStep} in `
            + `sixths of one, the raw field reaches ${Math.max(...raw)} and the length `
            + `reaches ${Math.max(...steps)} steps`);
        }
        tabs.go(wasTab);

        /* The 105 of 5,095 events with a note number above 127 are said, not drawn as music.
           See lessons/page-pack.md#pack-153 */
        const over = sessions.reduce((k, x) => k + x.events.filter((e) => e.note > 127).length, 0);
        d.assert('the events our decoder cannot read as notes are counted rather than clamped',
          over === 105 && sessions.reduce((k, x) => k + x.notes, 0) === 5095,
          `${over} of 5,095 events carry a note number above 127`);

        /**
         * Negative control: the three stock sessions hold zero notes, and they are the same
         * three the template distance finds.
         * See lessons/page-pack.md#pack-154
         */
        const stock = sessions.filter((x) => x.nearest < 16);
        d.assert('NEGATIVE CONTROL: the three stock sessions hold no notes at all, found a third way',
          stock.length === 3 && stock.every((x) => x.notes === 0)
          && sessions.filter((x) => x.notes === 0).length === 3
          && sessions.reduce((n, x) => n + x.notes, 0) === 5095,
          `${sessions.filter((x) => x.notes === 0).length} of 32 hold none, `
          + `${sessions.reduce((n, x) => n + x.notes, 0)} events in the pack`);
      }

      /**
       * No row claims to be a synth (a Circuit has two synth parts): this checks the absence
       * of the old words, not only the presence of the new.
       * See lessons/page-pack.md#pack-155
       */
      d.assert('no region calls itself a synth or a drum, because nothing measured says it is one',
        !/synth|drum/i.test(partsTable.scroller().textContent)
        && partsTable.scroller().textContent.includes('region 1'),
        `${partsTable.count()} rows, the first reading `
        + `"${partsTable.scroller().querySelector('.pos-tbl-row')?.textContent.slice(0, 20)}"`);

      /**
       * The fifty regions cover 53,248 bytes with no gap or overlap: each starts where the
       * last ended, and written bytes plus erasure equal its size.
       * See lessons/page-pack.md#pack-156
       */
      {
        const parts = sessions[0].parts;
        let at = 0, ok = true;
        for (const x of parts) { if (x.at !== at || x.used + x.pad !== x.size) ok = false; at += x.size; }
        d.assert('the fifty regions are contiguous, cover the whole file and each accounts for its own pad',
          ok && at === 53248 && parts.length === 50,
          `${parts.length} regions ending at ${at.toLocaleString()} of 53,248`);
      }

      /**
       * Pressing a second session opens that one; a panel stuck on the first would pass a
       * row count.
       * See lessons/page-pack.md#pack-157
       */
      const otherSession = sessions.findIndex((x, k) => k > 0 && x.name !== sessions[0].name
        && x.used !== sessions[0].used);
      /* The regions table proves it: two sessions with different patterns cannot fill the
         note column the same way.
         See lessons/page-pack.md#pack-158 */
      const notesCol = () => [...partsTable.scroller().querySelectorAll('.pos-tbl-row')]
        .map((r) => r.children[partsTable.columns.findIndex((c) => c.key === 'notes')].textContent.trim())
        .join(' ');
      showSession(0);
      const c0 = notesCol();
      showSession(otherSession);
      const c1 = notesCol();
      d.assert('NEGATIVE CONTROL: pressing another session opens that one rather than the first',
        pickedSession === otherSession && otherSession > 0
        && c1 !== c0 && c0.trim() !== '' && c1.trim() !== ''
        && sessions[otherSession].notes !== sessions[0].notes
        /* And a press of a session puts the picture back to nothing pressed,
           because the region numbers mean something different in a new file. */
        && pickedRegion === -1,
        `session ${otherSession} is "${sessions[otherSession].name}" with `
        + `${sessions[otherSession].notes} notes against session 0's `
        + `"${sessions[0].name}" with ${sessions[0].notes}`);
      showSession(0);

      const stock = sessions.filter((x) => x.nearest < 16);
      d.assert('the three stock sessions are found by distance, which entropy cannot do',
        stock.length === 3 && stock.every((x) => x.nearest === 1)
        && stock.every((x) => x.name === 'Initial Session')
        && stock.every((x) => x.entropy > 0.8)
        && Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest)) === 262,
        `${stock.length} sit 1 byte apart at entropy ${stock.map((x) => x.entropy.toFixed(2)).join(', ')}, `
        + `against ${Math.min(...sessions.filter((x) => x.nearest >= 16).map((x) => x.nearest))} for the nearest of the rest`);

      /**
       * The page draws no verdict, so this asserts the column: 3 rows at a single digit
       * distance, 29 at 262 or more.
       * See lessons/page-pack.md#pack-159
       */
      d.assert('the numbers a reader sees separate the three stock sessions from the other 29',
        sessions.filter((x) => x.nearest < 16).length === 3
        && sessions.filter((x) => x.nearest >= 16).length === 29,
        `${sessions.filter((x) => x.nearest < 16).length} within 16 bytes, `
        + `${sessions.filter((x) => x.nearest >= 16).length} beyond it`);

      /**
       * The loose `.circuitsession` path, driven end to end, since the drop area advertises it.
       * See lessons/page-pack.md#pack-160
       */
      const oneSession = sessions[0].bytes.slice();
      await drop.open([new File([oneSession], 'User Session.circuitsession')]);
      d.assert('a loose session opens, and its two patches come out as payloads rather than messages',
        sessions.length === 1 && patches.length === 2
        && sessions[0].name === 'User Session'
        && patches[0].name === 'Frog Steps' && patches[1].name === 'Woo-z',
        `${sessions.length} session holding ${patches.map((x) => x.name).join(' and ')}`);

      await openPack('pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const heads = new Set(sessions.map((s) => s.head));
      d.assert('and the first four bytes are not what decided it, because INIT is on both sides',
        heads.has('INIT') && new Set(sessions.map((x) => x.fingerprint)).size === 32,
        `the owner's own sessions say ${[...heads].join(', ')}`);

      showPatch(0);
      const matches = (p) => {
        const s = summarise(p);
        return dgBox.o1.sub === s.osc1 && dgBox.flt.sub === s.filter
          && dgBox.amp.sub === `release ${s.release}`;
      };
      d.assert('pressing a patch repaints the picture with that patch in it',
        matches(patches[0]) && picked === 0,
        `the picture says ${dgBox.o1.sub} into ${dgBox.mix.sub} into ${dgBox.flt.sub}`);

      const other = patches.findIndex((q, k) => k > 0 && summarise(q).filter !== summarise(patches[0]).filter);
      showPatch(other > 0 ? other : 1);
      d.assert('NEGATIVE CONTROL: a different patch draws a different picture',
        matches(patches[picked]) && dgBox.flt.sub !== summarise(patches[0]).filter,
        `patch ${picked} draws ${dgBox.flt.sub} against patch 0's ${summarise(patches[0]).filter}`);

      /**
       * The 64 samples parse with none refused, and every column moves; rate, depth and
       * channels are constant and live in the hover.
       * See lessons/page-pack.md#pack-161
       */
      const all = summariseAll(samples.map((w) => w.wave));
      d.assert('all 64 samples read as 48 kHz 16 bit mono with none refused, and their lengths differ',
        all.parsed === 64 && all.refused === 0 && all.truncated === 0
        && all.rates.join() === '48000' && all.depths.join() === '16' && all.channels.join() === '1'
        && all.shortest < all.longest,
        `${all.parsed} of ${all.count} read, ${all.shortest.toFixed(2)} s to `
        + `${all.longest.toFixed(2)} s, ${all.seconds.toFixed(1)} s in total`);

      /**
       * A press decodes synchronously through `toMono`, so the result is readable on the
       * next line, and it is compared with the file's own header, not a typed number.
       * See lessons/page-pack.md#pack-162
       */
      const playedWas = played;
      playSample(0);
      d.assert('pressing a sample decodes it in this page and makes a buffer of exactly its own length',
        played === playedWas + 1 && lastPlayed?.frames === samples[0].row.frames
        && lastPlayed.rate === samples[0].row.rate
        && Math.abs(lastPlayed.seconds - samples[0].row.seconds) < 0.002,
        `${samples[0].name} played ${lastPlayed?.frames.toLocaleString()} frames at `
        + `${lastPlayed?.rate} Hz against ${samples[0].row.frames.toLocaleString()} in its header`);

      /**
       * The picture is under the table in one box, from real rects: the picture's row starts
       * where the list's ends, the seam is 1 px, every row paints its own ground. Inside
       * parts compute 0 px of border (`--edge: 0`), the surface 1.
       * See lessons/page-pack.md#pack-163
       */
      {
        /**
         * Open the tab first: an inactive panel has no layout, so rects read zero while
         * computed colours stay real. It switches back in the same block with no `await`, so
         * no frame shows the tab move.
         * See lessons/page-pack.md#pack-164
         */
        const was = tabs.at();
        tabs.go('samples');
        // Open a sample first without playing it (`openSample(i, false)`): the picture hides
        // until it has something to draw.
        // See lessons/page-pack.md#pack-165
        openSample(0, false);
        const glue = samplesRows.el;
        const tableRow = sampleTable.el.parentElement;
        const t = tableRow.getBoundingClientRect();
        const ground = (x) => getComputedStyle(x).backgroundColor;
        const wv = waveRow.getBoundingClientRect();
        /* Nothing inside draws a second edge: a component's 1 px beside the glue's 1 px reads
           as one 2 px line.
           See lessons/page-pack.md#pack-166 */
        const inner = (x) => parseFloat(getComputedStyle(x).borderTopWidth);
        d.assert('the list and the picture are two rows of one glued panel, in that order, with a 1 px seam',
          glue.classList.contains('pos-glue') && glue.classList.contains('pos-rows')
          && samplesRows.count() === 3 && glue.children.length === 3
          && glue.children[0] === tableRow && glue.children[1] === waveRow
          && glue.children[2] === whyRow && away(whyRow) === true
          && inner(glue) > 0 && inner(tableRow) === 0 && inner(waveRow) === 0
          && inner(wave.canvas) === 0 && inner(sampleTable.el) === 0
          && Math.abs(wv.top - t.bottom - 1) < 0.6
          && ground(tableRow) !== 'rgba(0, 0, 0, 0)'
          && ground(waveRow) !== 'rgba(0, 0, 0, 0)'
          && ground(sampleTable.el) !== 'rgba(0, 0, 0, 0)'
          && ground(waveRow) !== ground(glue),
          `one seam of ${(wv.top - t.bottom).toFixed(1)} px with the tab open, the rows paint `
          + `${ground(tableRow)} and ${ground(waveRow)} against the glue's ${ground(glue)}, `
          + `the table inside its row paints ${ground(sampleTable.el)}, and the borders read `
          + `${inner(glue)} on the surface, ${inner(waveRow)} on the picture's row and `
          + `${inner(wave.canvas)} on the canvas`);

        /**
         * The picture is asked for ink, not a column count: `facts()` would read the same if
         * nothing were painted.
         * See lessons/page-pack.md#pack-167
         */
        /**
         * Ink share alone is not evidence: `ink()` counts pixels differing from the top left
         * one. The differential between a picture with a sample and without carries the weight.
         * See lessons/page-pack.md#pack-168
         */
        /**
         * The differential is two different samples (5,999 and 95,947 frames): `clear()` hides
         * the wrapper but leaves the bitmap, so clearing proves nothing. Ink share alone is not
         * evidence either.
         * See lessons/page-pack.md#pack-169
         */
        /* The scope holds no frames or seconds; it answers material against stream, and the
           rest is the canvas.
           See lessons/page-pack.md#pack-170 */
        /* Wait a frame: `grain-scope` paints on its own `requestAnimationFrame` loop, so the
           canvas is blank on the next line.
           See lessons/page-pack.md#pack-171 */
        const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        await frame();
        const drawn = waveInk();
        const byLen = samples.map((w, k) => ({ k, n: w.row.frames })).sort((a, b) => a.n - b.n);
        const other = byLen[0].k === 0 ? byLen[byLen.length - 1].k : byLen[0].k;
        openSample(other, false);
        await frame();
        const second = waveInk();
        openSample(0, false);
        await frame();
        d.assert('the picture really follows the open sample, because two different ones draw differently',
          wave.showing() === 'material' && drawn > 0 && second > 0 && second !== drawn
          && samples[other].row.frames !== samples[0].row.frames,
          `${samples[0].name} is ${samples[0].row.frames.toLocaleString()} frames and `
          + `${drawn} lit pixels, ${samples[other].name} is `
          + `${samples[other].row.frames.toLocaleString()} and ${second}`);
        tabs.go(was);
      }

      /**
       * The press that sounds a sample: every later check reads the marked row, and a row
       * press is the page's only way in.
       * See lessons/page-pack.md#pack-172
       */
      openSample(0, true);
      stopSample();

      /**
       * The marked row says which sample is open; the panel shows the picture and puts its
       * refusal row away, read off computed `display`.
       * See lessons/page-pack.md#pack-173
       */
      {
        /* `.on` is what `table.mark()` sets; read the scroller to keep the heading out.
           See lessons/page-pack.md#pack-174 */
        const mark = sampleTable.scroller().querySelector('.pos-tbl-row.on');
        const cells = [...(mark?.querySelectorAll('.pos-tbl-c') || [])].map((c) => c.textContent);
        /* See lessons/page-pack.md#pack-175 */
        d.assert('the marked row carries every fact about the open sample, and the panel says it can be played',
          picked2 === 0 && cells.length === 6
          && cells[0] === samples[0].name
          && cells[1] === `${samples[0].row.seconds.toFixed(2)} s`
          && cells[2] === samples[0].row.frames.toLocaleString()
          && /kHz$/.test(cells[3]) && cells[4] === samples[0].row.peak.toFixed(2)
          && away(waveRow) === false && away(whyRow) === true,
          `the marked row reads ${JSON.stringify(cells)}, with the picture `
          + `${away(waveRow) ? 'away' : 'up'} and the refusal row `
          + `${away(whyRow) ? 'away' : 'up'}`);
      }

      /**
       * Negative control: a page that dropped a bad sample would show 63 rows and a tidy
       * total. The press must not count as played, the panel row says the header would not
       * read, and the refusal count is read from `__demo.logs`.
       * See lessons/page-pack.md#pack-176
       */
      const badWave = readWave(new Uint8Array([0x52, 0x58, 0x46, 0x46, 0, 0, 0, 0, 0x57, 0x41, 0x56, 0x45]));
      fill([], [], [{ name: 'broken.wav', size: 12, wave: badWave, row: summariseWave(badWave, 'broken.wav') }]);
      const beforeBad = played;
      openSample(0, true);
      const said = window.__demo.logs.map((l) => l.msg).join('\n');
      d.assert('NEGATIVE CONTROL: a sample that will not read keeps its row, is counted as refused and does not play',
        sampleTable.count() === 1 && played === beforeBad
        && away(waveRow) === true && whyEl.textContent === WHY_UNREAD
        && away(whyRow) === false
        && /0 of 1 samples read, 1 refused/.test(said)
        && /did not read/.test(sampleTable.scroller().querySelector('.pos-tbl-row')?.title || '')
        && tabs.buttons[2].textContent === '1 Sample'
        && tabs.enabled('samples') === true
        && tabs.enabled('patches') === false && tabs.enabled('sessions') === false,
        `${sampleTable.count()} row saying `
        + `"${sampleTable.scroller().querySelector('.pos-tbl-row')?.title}", `
        + `the panel says "${whyEl.textContent}" with the picture `
        + `${away(waveRow) ? 'away' : 'up'}, `
        + `and the log says "${said.split('\n').filter((l) => /samples read/.test(l)).pop()}"`);
      // `scroller()`, not `el`: the heading is `.pos-tbl-row pos-tbl-head` and comes first.
      // See lessons/page-pack.md#pack-177

      await openPack('pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      /**
       * The flash warning, driven: a stream of the pack's 64 patches with byte 6 set to `01`
       * (`Replace Patch`), the shape that overwrites every slot.
       * See lessons/page-pack.md#pack-178
       */
      // Snapshot first: `fill()` replaces `patches`, so building the safe stream afterwards
      // would build it from the flash one.
      // See lessons/page-pack.md#pack-179
      const orig = patches.map((q) => q.bytes.slice());
      const stream = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) {
        const one = orig[k].slice();
        one[6] = 0x01; one[7] = k;
        stream.set(one, k * PATCH_BYTES);
      }
      await openPack('a bank that writes flash', stream);
      d.assert('a file that would overwrite flash is named as one, with how many slots it reaches',
        lastScan?.flash === 64 && lastScan.slots.size === 64 && lastScan.messages === 64
        && /overwrite 64 slots, 0 to 63/.test(drop.note.textContent)
        && patches.length === 64,
        `"${drop.note.textContent.slice(0, 80)}"`);

      // Negative control: the same 64 messages with byte 6 left at `00` are the portable
      // single patch format and must raise nothing.
      // See lessons/page-pack.md#pack-180
      const safe = new Uint8Array(PATCH_BYTES * 64);
      for (let k = 0; k < 64; k++) safe.set(orig[k], k * PATCH_BYTES);
      await openPack('a bank that lands in RAM', safe);
      d.assert('NEGATIVE CONTROL: the same messages that land in RAM raise nothing',
        lastScan?.flash === 0 && !/overwrite/.test(drop.note.textContent)
        && patches.length === 64,
        `${lastScan?.patches.length} patches, ${lastScan?.flash} of them writing flash`);

      /**
       * A real bulk transfer end to end (`Roland_Classics.zip`, one 6,753,638 byte `.syx`,
       * 48 filled and 16 empty slots). It lives under gitignored `tmp/`, so elsewhere this
       * says it did not run.
       * See lessons/page-pack.md#pack-181
       */
      {
        const zip = await realFetch('/tmp/packs/Roland_Classics.zip').catch(() => null);
        if (!zip || !zip.ok) {
          d.log('the archive download is not on this machine, so no real bulk transfer was opened');
        } else {
          await openZip('Roland_Classics.zip', new Uint8Array(await zip.arrayBuffer()));
          const all = summariseAll(samples.map((w) => w.wave));
          const empty = samples.filter((w) => w.wave.frames === 0).length;
          d.assert('a zip holding one bulk transfer opens to 64 sample slots, 48 filled and 16 empty, and no patches',
            samples.length === 64 && empty === 16 && all.refused === 0
            && patches.length === 0 && sessions.length === 0
            && all.rates.length === 1 && all.rates[0] === 48000
            && all.seconds.toFixed(2) === '17.31'
            && tabs.buttons.map((b) => b.textContent).join(' ').includes('64 Samples'),
            `${samples.length} slots, ${empty} empty, ${all.seconds.toFixed(2)} s, `
            + `tabs "${tabs.buttons.map((b) => b.textContent).join(' ')}"`);

          // The checksum makes the audio exact, not plausible. The session count is withheld:
          // slicing this file blind gives 108 blocks of zero fill and PCM.
          // See lessons/page-pack.md#pack-182
          const set = lastScan?.set;
          d.assert('the stream verified against its own length and its own CRC32, and the blind session count is withheld',
            set && set.streams.length === 1 && set.verified === 1
            && set.streams[0].crcOk === true && set.streams[0].lengthOk === true
            && set.streams[0].carriers === 22512 && set.streams[0].plainBytes === 5763072
            && lastScan.blindSessions === 108 && sessions.length === 0,
            `crc 0x${set?.streams[0].crc.toString(16)} over `
            + `${set?.streams[0].plainBytes.toLocaleString()} bytes from `
            + `${set?.streams[0].carriers.toLocaleString()} carriers, blind slicing would have said `
            + `${lastScan?.blindSessions} sessions`);

          // An empty slot is silent, not an exception: `createBuffer(1, 0, rate)` throws.
          // See lessons/page-pack.md#pack-183
          const emptyAt = samples.findIndex((w) => w.wave.frames === 0);
          const fullAt = samples.findIndex((w) => w.wave.frames > 0);
          const wasPlayed = played;
          openSample(emptyAt, true);
          const afterEmpty = played;
          openSample(fullAt, true);
          d.assert('an empty slot opens, shows 0.00 s and starts nothing, while a filled one plays',
            afterEmpty === wasPlayed && played === wasPlayed + 1
            && samples[emptyAt].row.seconds === 0 && samples[fullAt].row.seconds > 0
            /* Reads the buffer the page really built, a fact about the audio.
               See lessons/page-pack.md#pack-184 */
            && lastPlayed?.name === samples[fullAt].name && lastPlayed.seconds > 0,
            `slot ${emptyAt} is empty and played ${afterEmpty - wasPlayed} time(s), `
            + `slot ${fullAt} is ${samples[fullAt].row.seconds.toFixed(2)} s and played `
            + `${played - afterEmpty} time(s)`);
          stopSample();
        }
      }

      await openPack('pack.circuitpack', new Uint8Array(await (await realFetch(PACK)).arrayBuffer()));

      const before = fetched;
      showPatch(3);
      d.assert('stepping through them asks nobody for anything',
        fetched === before, `${fetched - before} request(s) while moving`);

      d.assert('nothing was sent while all of that happened',
        midiAsked === 0, `requestMIDIAccess called ${midiAsked} time(s)`);
    }
  }

  d.ready();
</script>

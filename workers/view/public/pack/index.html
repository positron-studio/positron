<style>
  /* Half the component's 420 px default, set through its custom property. A whole
     number of rows: a row is 32.39 px, so six is 194.34 and the cut lands on a border.
     See lessons/page-pack.md#pack-1 */
  .pk-tbl { --tbl-h: 194px; }
  /* See lessons/page-pack.md#pack-2 */
  /* Every glued part paints its own ground: `.pos-glue` is `gap: 1px` over `--line`,
     so a transparent child lets the line colour through and the seam disappears.
     See lessons/page-pack.md#pack-3 */
  /* The picture's host (the glue row) paints `--card` too, a deliberate second
     statement of the row's own ground. No padding: an inset inside a glued part reads
     as a box inside a box.
     See lessons/page-pack.md#pack-4 */
  .pk-wave { background: var(--card); }
  /* See lessons/page-pack.md#pack-5 */
  /* The line that says an open file will make no sound (24 bit or surround WAV), in
     the slot the picture would take. Type is `.pos-sub`'s minus its margin; ink is
     `--bad` to match the log line `playSample` writes.
     See lessons/page-pack.md#pack-6 */
  .pk-why { margin: 0; color: var(--bad); }
  /* The sessions tab's transport sits in a wrapper of its own, for the same
     reason and with the same absence of padding. That tab is still `createGlue`
     and was not part of this ask. */
  .pk-bar { background: var(--card); }
  /* The sixteen step picture of the pressed region. The host's padding equals the
     grid's gap, so outer margin and inner gaps are one measurement.
     See lessons/page-pack.md#pack-7 */
  .pk-steps { --pk-gap: 3px; background: var(--card); padding: var(--pk-gap); }
  .pk-grid {
    display: grid; grid-template-columns: 54px repeat(16, minmax(0, 1fr));
    gap: var(--pk-gap);
  }
  /* The row names and the step numbers. `tabular-nums` so a two digit step is
     the same width as a one digit one and the ruler cannot shuffle. */
  .pk-g-lab, .pk-g-step {
    font: 400 10px/1 var(--mono); color: var(--dim2);
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; overflow: hidden; white-space: nowrap;
  }
  .pk-g-step { justify-content: center; }
  /* Six rows are always drawn and a pad's height is flat, so pressing a region never
     moves what is below. `aspect-ratio` would have made it 600 px tall on a wide screen.
     See lessons/page-pack.md#pack-8 */
  .pk-pad {
    height: 22px; border-radius: 2px; background: var(--line);
    display: flex; align-items: center; justify-content: center;
    font: 400 10px/1 var(--mono); color: var(--bg); overflow: hidden;
    white-space: nowrap;
  }
  /* Velocity is the fill's strength (`--pk-v`, out of 127), never a second colour.
     It starts at 45 per cent so the note name in dark ink stays readable at velocity 1.
     See lessons/page-pack.md#pack-9 */
  .pk-pad[data-on] {
    background: color-mix(in oklab, var(--hi) calc(45% + var(--pk-v, 100) * 0.55%), var(--line));
  }
  /* The step the head is on, marked on the pads themselves rather than as a
     bordered column standing over them, which is what `/tom/` was asked for in
     those words. */
  .pk-grid [data-now] { outline: 1px solid var(--fg2); outline-offset: -1px; }
  .pk-g-step[data-now] { color: var(--fg2); }
  /* On a phone (390 px, pads 16 px) note names go and the marks stay; pitch is in the
     hover. This block must stay last: a media query adds no specificity. verify.mjs
     runs at 756 px, so only the assert that it is last covers it.
     See lessons/page-pack.md#pack-10 */
  @media (max-width: 560px) {
    .pk-pad { font-size: 0; }
  }
</style>
<script type="module">
  import { mount, el, createReport } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  /* `noteName` stays shared: it holds the decision that middle C is C3, as on the
     Circuit's own pads.
     See lessons/page-pack.md#pack-11 */
  import { noteName } from '/shell/note-grid.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createGlue, createGlueRows } from '/shell/glue.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { readZip, entry } from '/shell/unzip.mjs';
  import { survey, patchesIn } from '/shell/circuit-syx.mjs';
  import {
    readSession, summarise as summariseSession, patchPayloads,
    notesPerRegion, notesIn, VELOCITY_AT, VELOCITY_PER_STEP,
    STEPS, STEP_SLOTS,
  } from '/shell/circuit-session.mjs';
  import {
    readWave, toMono, summarise as summariseWave, summariseAll,
    containerOf, sampleSetIn, CONTAINER,
  } from '/shell/circuit-sample.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import {
    readPatch, readPatchData, summarise, sessionStats, patchFields, modSlots,
    categoryName, named, ADDRESSES,
    PATCH_BYTES, PATCH_DATA, DATA_AT, SYSEX_HEAD, COMMANDS, MOD_DESTINATIONS,
  } from '/shell/circuit-patch.mjs';

  /**
   * This page sends nothing, asserted by wrapping `requestMIDIAccess` and counting.
   * `Replace Current Patch` (RAM) and `Replace Patch` (FLASH, overwrites a patch)
   * differ at byte 6 of a 350 byte message; a factory reset never restores the owner's.
   * See lessons/page-pack.md#pack-12
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }
  let fetched = 0;
  const realFetch = window.fetch.bind(window);
  window.fetch = (...a) => { fetched++; return realFetch(...a); };

  // The pack is not in this repository. With no `?pack=<url>` this page fetches
  // nothing on any origin and the reading checks say they did not run, rather than
  // going red. Example: /pack/?pack=/tmp/personal/mine.circuitpack
  // See lessons/page-pack.md#pack-13
  const PACK = new URLSearchParams(location.search).get('pack') || '';
  const PACK_HERE = !!PACK;

  const d = mount({
    name: 'pack',
    // The page's sentence and the index's are one string.
    // See lessons/page-pack.md#pack-14
    what: 'open a Circuit pack or any zip of WAVs and look inside its patches, sessions and samples',
    /**
     * No readout, `null` rather than omitted so the harnesses read it as deliberate.
     * Counts lead the tab titles; `different` and `filled` are sessions table columns.
     * See lessons/page-pack.md#pack-15
     */
    readout: null,
    /**
     * No controls: there is one way in, the same for everybody. `PACK` (from `?pack=`)
     * is read only by the reading checks inside `SELFCHECK`.
     * See lessons/page-pack.md#pack-16
     */
  });

  const stack = createStack();
  d.el.append(stack.el);

  // The way in is an area, not only a button: the component's cover exists only during
  // a drag. It takes `.zip`, the shape a real download arrives in (a zip of packs).
  // See lessons/page-pack.md#pack-17
  const drop = createDrop({
    accept: ['.circuitpack', '.circuittrackspack', '.zip', '.syx', '.circuitsession'],
    // The button says `open`, not upload: nothing leaves the machine. The title is the
    // reader's word for the block; the button promises what pressing it does.
    // See lessons/page-pack.md#pack-18
    title: 'UPLOAD FILE',
    label: 'Open file',
    beside: 'or drag a file here',
    // No resting line: the footer exists only when it has something to say.
    // See lessons/page-pack.md#pack-19
    empty: '',
    hint: 'drop a pack or a session anywhere on this page',
    says: (m, kind) => d.log(m, kind),
    onOpen: (files) => openFiles(files),
  });
  stack.add(drop.el);
  /**
   * Published on `window.__demo` (not on `mount()`'s return, a different object):
   * a drag cannot be synthesised and the button opens an OS dialog. Same code as a drop.
   * See lessons/page-pack.md#pack-20
   */
  window.__demo.drop = drop;

  /**
   * The six patch files under /resources/patches/*.syx are still published
   * (allowlisted in workers/view/build.mjs) and nothing points at them.
   * See lessons/page-pack.md#pack-21
   */

  // The three lists are tabs with counts in their titles. Labels are sentence case
  // in the source; asserts compare `textContent`, the source string. A tab is
  // `#links`, never a subpage; `tabs.mjs` owns that.
  // See lessons/page-pack.md#pack-22
  const TABS = [
    { id: 'patches', label: 'Patches', one: 'Patch' },
    { id: 'sessions', label: 'Sessions', one: 'Session' },
    { id: 'samples', label: 'Samples', one: 'Sample' },
  ];
  const tabs = createTabs({ tabs: TABS });
  /**
   * Nothing but the way in until a file lands; one element hides all the tabs.
   * `hidden` works because `.pos-tabs` sets no `display` (checked on computed style).
   * See lessons/page-pack.md#pack-23
   */
  tabs.el.hidden = true;
  stack.add(tabs.el);
  const panel = (id) => tabs.panel(id);

  /**
   * The count leads the label (`64 patches`), and an empty tab keeps its bare word:
   * a `0` reads as a confident measurement of nothing.
   * See lessons/page-pack.md#pack-24
   */
  function countTabs(n) {
    TABS.forEach((t, i) => {
      const c = n[t.id];
      // One of a thing loses the `s`.
      // See lessons/page-pack.md#pack-25
      tabs.buttons[i].textContent = c ? `${c} ${c === 1 ? t.one : t.label}` : t.label;
      /**
       * A tab with nothing behind it is disabled, once something has landed; before that
       * the whole tab strip is away.
       * See lessons/page-pack.md#pack-26
       */
      tabs.enable(t.id, c > 0, `this file carries no ${t.label.toLowerCase()}`);
    });
  }

  /**
   * Five columns: at 390 px six made a 598 px row. `kind` is out because a category is
   * a typed label, not part of the sound; it is on every row's hover. Every heading is
   * one short word and never wraps.
   * See lessons/page-pack.md#pack-27
   */
  const patchTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, hi: true, clip: true },
      { key: 'wave', label: 'wave', width: 96, clip: true },
      { key: 'filter', label: 'filter', width: 108, clip: true },
      { key: 'lfo', label: 'lfo', width: 48 },
      { key: 'voice', label: 'voice', width: 56 },
    ],
    cap: 200, empty: '', note: 'hover',
    onPick: (r) => showPatch(r.i),
  });
  patchTable.el.classList.add('pk-tbl');
  panel('patches').append(patchTable.el);

  /**
   * `nearest` tells a stock `Initial Session` from real work, which entropy cannot.
   * Stock slots sit 1 byte from each other; real ones are 262 bytes and more from
   * anything. Shown as a number, with no threshold to argue with.
   * See lessons/page-pack.md#pack-28
   */
  const sessionTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, clip: true },
      { key: 'head', label: 'head', width: 58 },
      /**
       * The session facts are columns: a column answers which of these is different.
       * `written` has no column because it is `used` under another name.
       * See lessons/page-pack.md#pack-29
       */
      { key: 'marker', label: 'marker', width: 66 },
      { key: 'synth1', label: 'synth 1', width: 124, clip: true },
      { key: 'synth2', label: 'synth 2', width: 124, clip: true },
      { key: 'notes', label: 'notes', width: 62, align: 'right', hi: true },
      { key: 'used', label: 'used', width: 72, align: 'right' },
      { key: 'notErased', label: 'not erasure', width: 84, align: 'right' },
      { key: 'payload', label: 'payload', width: 76, align: 'right' },
      { key: 'filled', label: 'filled', width: 62, align: 'right' },
      { key: 'entropy', label: 'entropy', width: 68, align: 'right' },
      { key: 'nearest', label: 'nearest', width: 76, align: 'right' },
    ],
    cap: 64, empty: '', note: 'hover',
    onPick: (r) => showSession(r.i),
  });
  sessionTable.el.classList.add('pk-tbl');

  /**
   * The sessions list opens a detail panel for the pressed row, as on patches.
   * Meanings are not guessed: `circuit-session.mjs` decodes the head and the 32 byte
   * name (both checked against `index.json`); the rest is counts, offsets, totals.
   * See lessons/page-pack.md#pack-30
   */
  /**
   * A readout, not a field/value table. Ten cells because `createReport` throws on an
   * odd count; `name` is on the line under it. Every cell can change between sessions.
   * See lessons/page-pack.md#pack-31
   */
  /**
   * See lessons/page-pack.md#pack-32
   */
  /**
   * The fifty regions: a header, sixteen synth slots at 1,508 bytes, thirty two drum
   * slots at 720 and a 6,004 byte tail. `used` and `pad` only mean something together:
   * a session is mostly erased flash.
   * See lessons/page-pack.md#pack-33
   */
  const partsTable = createTable({
    columns: [
      { key: 'part', label: 'part', grow: true },
      /* The stride (`1 of 76, 16 of 1,508, 32 of 720, 1 of 6,004`) is the decoder's model
         of the file.
         See lessons/page-pack.md#pack-34 */
      { key: 'size', label: 'size', width: 76, align: 'right' },
      { key: 'at', label: 'at', width: 76, align: 'right' },
      { key: 'used', label: 'used', width: 72, align: 'right' },
      { key: 'notes', label: 'notes', width: 64, align: 'right', hi: true },
    ],
    cap: 64, empty: '', note: 'hover',
    /* The regions list opens on press, the same arrangement as the sessions table.
       See lessons/page-pack.md#pack-35 */
    onPick: (r) => showRegion(r.i),
  });
  partsTable.el.classList.add('pk-tbl');

  /**
   * The sixteen steps of the pressed region as a pad grid, not `createStripView`: a
   * strip draws milliseconds and the session holds no tempo. Columns are steps in order;
   * gate is in the hover, not drawn. Six rows: `STEP_SLOTS`, a storage order, not pitch.
   * See lessons/page-pack.md#pack-36
   */
  /**
   * Which regions row is open (`-1` none) and where the step head sits. Declared here
   * because `moveHead(0)` runs below, and reading a `let` before it is a TDZ throw.
   * See lessons/page-pack.md#pack-37
   */
  let pickedRegion = -1, headStep = 0;
  const stepsHost = el('div', 'pk-steps');
  const gridEl = el('div', 'pk-grid');
  stepsHost.append(gridEl);
  /** The 16 ruler cells and the 16x6 pads, built once and written on a press. */
  const stepCells = [], padCells = [];
  gridEl.append(el('div', 'pk-g-lab', ''));
  for (let s = 0; s < STEPS; s++) {
    const c = el('div', 'pk-g-step', String(s + 1));
    stepCells.push(c); gridEl.append(c);
  }
  for (let k = 0; k < STEP_SLOTS; k++) {
    gridEl.append(el('div', 'pk-g-lab', `slot ${k + 1}`));
    const row = [];
    for (let s = 0; s < STEPS; s++) {
      const p = el('div', 'pk-pad', '');
      row.push(p); gridEl.append(p);
    }
    padCells.push(row);
  }

  /**
   * No play button: play claims a rate and the file names none (`toggle: false`).
   * It steps with `‹` `›`. `publish: false`: no position can advance until a file is
   * open and a row pressed, so verify.mjs's play drill would go red.
   * See lessons/page-pack.md#pack-38
   */
  const stepHost = el('div', 'pk-bar');
  const stepDeck = createDeck({ items: [], adapters: {}, range: [0, STEPS] });
  const stepBar = createTransportBar(stepHost, stepDeck, {
    publish: false, toggle: false, scrub: false, loop: false,
    // The clock never prints a time: `fmt` gets the whole line, in steps.
    // See lessons/page-pack.md#pack-39
    fmt: (pos) => `step ${Math.min(STEPS, Math.floor(pos) + 1)} of ${STEPS}`,
    extras: [
      { id: 'prev', label: '‹', aria: 'the step before this one', onClick: () => walk(-1) },
      { id: 'next', label: '›', aria: 'the step after this one', onClick: () => walk(+1) },
    ],
  });

  /* Two blocks: the sessions list stands alone (it decides what the rest is about);
     regions, transport and step grid are one glue, bar above what it drives. A gap
     needs siblings: `.pos-tabs-p > * + *` only acts between two children.
     See lessons/page-pack.md#pack-40 */
  panel('sessions').append(
    sessionTable.el,
    createGlue(partsTable.el, stepHost, stepsHost));
  /* The head is on step 1 before anything is opened, so the picture and the
     bar's own readout cannot disagree about where it is at rest. */
  moveHead(0);

  /**
   * Samples tab. No constant columns: every sample here is 48 kHz 16 bit mono, so
   * length and size are shown. A sample sounds on a press and never on a visit.
   * See lessons/page-pack.md#pack-41
   */
  const sampleTable = createTable({
    columns: [
      { key: 'name', label: 'name', grow: true, clip: true },
      { key: 'len', label: 'length', width: 76, align: 'right' },
      /**
       * `frames` and `rate` are columns: a column answers which of these is different,
       * and a pack can mix rates.
       * See lessons/page-pack.md#pack-42
       */
      { key: 'frames', label: 'frames', width: 84, align: 'right' },
      { key: 'rate', label: 'rate', width: 76, align: 'right' },
      { key: 'peak', label: 'peak', width: 64, align: 'right' },
      { key: 'sound', label: 'sound', width: 68, align: 'right' },
    ],
    cap: 128, empty: '', note: 'hover',
    onPick: (r) => openSample(r.i, true),
  });
  sampleTable.el.classList.add('pk-tbl');
  /**
   * The totals line is gone; its two facts with no column are logged: `refused`
   * (`summariseAll` counts files that did not parse) and the set's total length.
   * See lessons/page-pack.md#pack-43
   */

  /**
   * No transport under the waveform: a press on a samples row plays it. Nothing on the
   * page can loop a sample. `createDeck` and `createTransportBar` stay imported for the
   * sessions tab's step bar; `wave.playhead()` still runs off `currentTime`.
   * See lessons/page-pack.md#pack-44
   */

  /**
   * The waveform sits under the list. It draws and never plays: this page owns the
   * `AudioContext`. It is not on screen until there is something to draw.
   * See lessons/page-pack.md#pack-45
   */
  /**
   * The waveform is `grain-scope.mjs`, as on /archive/radio/, /tapes/ and /grains/;
   * `buffer(peaks)` draws a held buffer. No `fullScale`: a still sample's relative
   * shape is the subject.
   * See lessons/page-pack.md#pack-46
   */
  /**
   * `createGlueRows`, not `createGlue` (rows added one at a time with their own inset)
   * or `createInstrumentPanel` (no instrument here). `full: true` keeps the table page
   * wide; rows are `pad: false` except the words.
   * See lessons/page-pack.md#pack-47
   */
  const samplesRows = createGlueRows({ full: true, pad: false });
  samplesRows.row(sampleTable.el);
  /**
   * The row is the picture's host, so the scope is a direct child of a direct child of
   * the glue and `shell.css` zeroes its `margin: 22px 0 12px`. The ground is painted by
   * both `.pos-rows-r` and `.pk-wave` on purpose.
   * See lessons/page-pack.md#pack-48
   */
  const waveRow = samplesRows.row(undefined, { cls: 'pk-wave' });
  const wave = createGrainScope(waveRow, { seconds: 1, height: 96 });
  /**
   * The refusal line: for an open sample there is a picture or this sentence, never
   * both. It says the short fact; the full reason is in the hover and the log. The two
   * wordings are constants an assert reads.
   * See lessons/page-pack.md#pack-49
   */
  const WHY_UNREAD = 'this file did not read';
  const WHY_UNPLAYABLE = 'this one cannot be played here';
  const whyEl = el('div', 'pos-sub pk-why');
  const whyRow = samplesRows.row(whyEl, { pad: true });
  /**
   * The page hides the waveform row itself: the scope must not hide without a buffer,
   * because /archive/radio/ feeds it live. `hidden` goes on the row
   * (`.pos-rows-r[hidden]`), or the glue keeps a 1 px seam round nothing.
   * See lessons/page-pack.md#pack-50
   */
  waveRow.hidden = true;
  whyRow.hidden = true;
  panel('samples').append(samplesRows.el);
  /**
   * Is this part drawn, read off `display` not off `hidden`. The rect is a weaker
   * second test: an inactive tab panel has no layout, so `onScreen()` needs the tab open.
   * See lessons/page-pack.md#pack-51
   */
  const away = (x) => getComputedStyle(x).display === 'none';
  const onScreen = (x) => !away(x) && x.getBoundingClientRect().height > 0;
  /** How many lit pixels the scope has drawn. The differential a check needs. */
  function waveInk() {
    const c = wave.canvas;
    const g = c?.getContext?.('2d');
    if (!g || !c.width) return 0;
    const px = g.getImageData(0, 0, c.width, c.height).data;
    /* Against the field, not transparent: the canvas paints its own `--card` background.
       See lessons/page-pack.md#pack-52 */
    let n = 0;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i] > 40 || px[i + 1] > 45 || px[i + 2] > 55) n++;
    }
    return n;
  }


  // ── what is open ─────────────────────────────────────────────────────────
  let patches = [], rows = [], sessions = [], samples = [];
  let picked = -1, pickedSession = -1, picked2 = -1, played = 0;
  let ac = null, lastPlayed = null, voice = null;

  const WIDE_BYTES = 1508;
  /* Module scope: the sessions table formats the same numbers.
     See lessons/page-pack.md#pack-53 */
  const n = (v) => (v === null || v === undefined ? '' : v.toLocaleString());
  /**
   * The scope takes peaks: one amplitude per column, the largest magnitude in it.
   * 480 columns, finer than the widest box, computed once per sample rather than per
   * frame.
   * See lessons/page-pack.md#pack-54
   */
  const PEAK_COLS = 480;
  function peaksOf(samples) {
    const n = samples?.length || 0;
    const out = new Float32Array(PEAK_COLS);
    if (!n) return out;
    for (let i = 0; i < PEAK_COLS; i++) {
      const from = Math.floor((i * n) / PEAK_COLS);
      const to = Math.max(from + 1, Math.floor(((i + 1) * n) / PEAK_COLS));
      let mx = 0;
      for (let j = from; j < to && j < n; j++) {
        const v = samples[j] < 0 ? -samples[j] : samples[j];
        if (v > mx) mx = v;
      }
      out[i] = mx;
    }
    return out;
  }
  const pct = (x) => `${(x * 100).toFixed(1)}`;
  const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} kB` : `${(n / 1048576).toFixed(1)} MB`);

  // ── the picture ──────────────────────────────────────────────────────────
  /**
   * The diagram sits under the table, an exception to the diagram-last rule: it is the
   * detail panel for the pressed row (`atEnd: false`). Drawn before anything opens with
   * the reference defaults, which reserves its exact height.
   * See lessons/page-pack.md#pack-55
   */
  const dgBox = {
    o1: { id: 'o1', label: 'osc 1', sub: '', tech: 'sound',
          /* `FIRST_WAVETABLE` is 14: the count of plain waveforms and the index tables start
             at. 30 total, 14 plain, 16 tables (`OSC_WAVES.slice(14)`).
             See lessons/page-pack.md#pack-56 */
          note: 'One of thirty waveforms, and sixteen of those are wavetables rather than plain '
              + 'shapes. Its level, its tuning and its pulse width are separate bytes, so an '
              + 'oscillator can be fully configured and silent.' },
    o2: { id: 'o2', label: 'osc 2', sub: '', tech: 'sound',
          note: 'The same thirty waveforms again. Twenty six of the sixty four patches in this '
              + 'pack leave its level at zero, which is what the word silent means here.' },
    noi: { id: 'noi', label: 'noise', sub: '', tech: 'sound',
           note: 'A white noise source with one level byte at address 57. The factory bank uses '
               + 'it in five patches of sixty four and a bought bank used it in forty eight.' },
    ring: { id: 'ring', label: 'ring mod', sub: '', tech: 'sound',
            note: 'The two oscillators multiplied together, with its own level. It makes metallic '
                + 'and bell tones out of two ordinary waves and is off in most patches.' },
    mix: { id: 'mix', label: 'mixer', sub: '', tech: 'sound',
           note: 'Four levels and two more for the signal before and after the effects. What comes '
               + 'out of here is the only thing the filter ever sees.' },
    flt: { id: 'flt', label: 'filter', sub: '', tech: 'sound',
           note: 'Six types: low and high pass at 12 and 24 dB, and two band pass shapes. Its '
               + 'frequency is the parameter the mod matrix reaches more often than any other.' },
    amp: { id: 'amp', label: 'amp', sub: '', tech: 'sound',
           note: 'Envelope 1 is the amplitude envelope. Its release is the single byte that best '
               + 'separates one bank from another, at a median of 40 across these sixty four.' },
    fx: { id: 'fx', label: 'FX', sub: '', tech: 'sound',
          note: 'Distortion, chorus and a three band equaliser, each with its own level byte. A '
              + 'level of zero is the effect switched off rather than turned down.' },
    // These are `sound` like the rest: `TECH_HUE` is one colour per technology across
    // every diagram. The LFOs' arrows to the matrix, not the mixer, say they are not
    // in the signal path.
    // See lessons/page-pack.md#pack-57
    lfo1: { id: 'lfo1', label: 'LFO 1', sub: '', tech: 'sound',
            note: 'Thirty eight shapes, from a sine to a random sample and hold to a sixteen step '
                + 'chromatic run. Its rate can be free or locked to the tempo.' },
    lfo2: { id: 'lfo2', label: 'LFO 2', sub: '', tech: 'sound',
            note: 'The same thirty eight shapes. Of the sixty four patches in this pack exactly '
                + 'one runs both LFOs at once, against a hundred and twelve of a bought bank.' },
    mod: { id: 'mod', label: 'mod matrix', sub: '', tech: 'sound',
           note: 'Twenty slots, each taking two sources to one of eighteen destinations with a '
               + 'depth. A depth of 64 is zero, so a slot can be addressed and reach nothing.' },
  };
  const dgSpec = {
    caption: '',
    nodes: [dgBox.o1, dgBox.o2, dgBox.noi, dgBox.ring, dgBox.lfo1, dgBox.lfo2,
            dgBox.mix, dgBox.mod, dgBox.flt, dgBox.amp, dgBox.fx],
    links: [
      { from: 'o1', to: 'mix', note: 'Its level is address 54, and a wave with a level of zero is '
          + 'a part of the patch that is configured and contributes nothing.' },
      { from: 'o2', to: 'mix', note: 'Its level is address 55. Zero there is why the table says '
          + 'silent rather than showing a wave.' },
      { from: 'noi', to: 'mix', note: 'One byte at address 57. Noise is what makes a breath or a '
          + 'snare out of a synth voice.' },
      { from: 'ring', to: 'mix', note: 'Address 56. Ring modulation needs both oscillators running '
          + 'to make anything at all, so it is silent whenever osc 2 is.' },
      { from: 'mix', to: 'flt', note: 'The mixer also carries a level before and after the effects, '
          + 'which is how a patch stays the same loudness with distortion switched on.' },
      { from: 'flt', to: 'amp', note: 'Envelope 2 is the filter envelope and envelope 1 is the '
          + 'amplifier\'s. A patch can aim either at the filter frequency through the matrix.' },
      { from: 'amp', to: 'fx', note: 'The effects sit after the amplifier, so a long release is '
          + 'heard through whatever distortion and chorus the patch has switched on.' },
      { from: 'lfo1', to: 'mod', note: 'An LFO reaches nothing by itself. It becomes audible only '
          + 'when a matrix slot names it as a source with a depth other than 64.' },
      { from: 'lfo2', to: 'mod', note: 'The same again. Forty three of these sixty four patches '
          + 'have neither LFO reaching anything at all.' },
    ],
  };
  /**
   * The picture has a host of its own: `createDiagram` appends a heading and a figure,
   * and one wrapper hides both.
   * See lessons/page-pack.md#pack-58
   */
  const dgHost = el('div', 'pk-dg');
  dgHost.hidden = true;
  panel('patches').append(dgHost);
  const dg = createDiagram(dgHost, dgSpec, { how: true, atEnd: false });

  /**
   * The reference's own default patch, built from the address table rather than
   * typed, so the picture at rest is a real reading of real bytes and there is
   * no second copy of any default anywhere on this page.
   */
  function defaultPatch() {
    const b = new Uint8Array(PATCH_BYTES);
    SYSEX_HEAD.forEach((v, i) => { b[i] = v; });
    for (let a = 0; a < PATCH_DATA; a++) b[DATA_AT + a] = ADDRESSES[a].d;
    b[PATCH_BYTES - 1] = 0xf7;
    return readPatch(b);
  }

  function paint(p, why) {
    const s = summarise(p);
    const used = modSlots(p).filter((m) => m.used);
    const lfoWave = (n) => named(`LFO${n}_Waveform`, p.value(`LFO${n}_Waveform`));
    const reaches = (lo, hi) => used.some((m) => [lo, hi].includes(m.source1) || [lo, hi].includes(m.source2));
    dgBox.o1.sub = s.osc1;
    dgBox.o2.sub = s.osc2Silent ? 'silent' : s.osc2;
    dgBox.noi.sub = p.value('Mixer_NoiseLevel') ? `level ${p.value('Mixer_NoiseLevel')}` : 'off';
    dgBox.ring.sub = p.value('Mixer_RingModLevel12') ? `level ${p.value('Mixer_RingModLevel12')}` : 'off';
    dgBox.mix.sub = `${[p.value('Mixer_Osc1Level'), p.value('Mixer_Osc2Level'),
      p.value('Mixer_NoiseLevel'), p.value('Mixer_RingModLevel12')].filter(Boolean).length} of 4`;
    dgBox.flt.sub = s.filter;
    dgBox.amp.sub = `release ${s.release}`;
    dgBox.fx.sub = s.distortion ? 'distortion' : s.chorus ? 'chorus' : 'dry';
    dgBox.lfo1.sub = reaches(6, 7) ? lfoWave(1) : 'reaches none';
    dgBox.lfo2.sub = reaches(8, 9) ? lfoWave(2) : 'reaches none';
    dgBox.mod.sub = used.length ? `${used.length} of 20` : 'none in use';
    const where = used.length
      ? [...new Set(used.map((m) => MOD_DESTINATIONS[m.destination]))].join(', ')
      : '';
    dgSpec.caption = why
      || `${p.name}, category ${p.category}${categoryName(p.category) ? ` (${categoryName(p.category)})` : ''}. `
        + `${where ? `The matrix reaches ${where}. ` : 'Nothing in the matrix reaches anything. '}`
        + 'Nothing on this page can send it.';
    dg.render();
  }

  /**
   * Nothing is painted at rest. `defaultPatch()` stays for the check: it is the only
   * patch buildable without a file, and proves the picture is absent, not empty.
   * See lessons/page-pack.md#pack-59
   */
  function showPatch(i) {
    const p = patches[i];
    if (!p) return;
    picked = i;
    patchTable.mark((r) => r.i === i);
    paint(p);
    const s = summarise(p);
    d.log(`${p.name}, ${s.poly}, ${s.filter}, ${modSlots(p).filter((m) => m.used).length} mod slot(s) in use`);
  }

  // ── reading ──────────────────────────────────────────────────────────────

  async function openFiles(files) {
    for (const f of files) {
      const n = f.name.toLowerCase();
      if (n.endsWith('.circuitsession')) { await openSession(f.name, f.bytes); continue; }
      if (n.endsWith('.syx')) { await openSyx(f.name, f.bytes); continue; }
      if (n.endsWith('.zip')) { await openZip(f.name, f.bytes); continue; }
      await openPack(f.name, f.bytes);
    }
  }

  /** One loose patch message, which is what all 128 in this archive are. */
  async function openSyx(name, bytes) {
    if (bytes.length !== PATCH_BYTES) {
      // A `.syx` longer than one message is a bank (64 `Replace Patch` messages, which
      // write flash) or a bulk transfer carrying samples. Scanning it says which.
      // See lessons/page-pack.md#pack-60
      const scan = sysexScan(bytes);
      if (scan.patches.length || scan.samples.length || scan.sessions.length) {
        sayStreams(name, scan);
        const st = [];
        for (let k = 0; k < scan.sessions.length; k++) {
          st.push(await readOne(scan.sessions[k], `session ${k}`));
        }
        fill(scan.patches.map((b, i) => ({ name: `${name} #${i}`, bytes: b })), st, scan.samples);
        sayScan(name, scan, name);
        return;
      }
      drop.say(`${name} is ${bytes.length} bytes and a Circuit patch is ${PATCH_BYTES}`
        + `${scan.set.why ? `. ${scan.set.why}` : ''}`, 'bad');
      return;
    }
    fill([{ name, bytes }], [], []);
    sayScan(name, sysexScan(bytes), name);
  }

  /**
   * One loose `.circuitsession`. Its two patches are bare 340 byte payloads with no
   * command byte, read with `readPatchData` so no SysEx frame is ever built round them.
   * A session cannot write flash by itself; that says nothing about what Components does.
   * See lessons/page-pack.md#pack-61
   */
  async function openSession(name, bytes) {
    let one;
    try { one = await readOne(bytes, name.replace(/\.circuitsession$/i, '')); }
    catch (e) { drop.say(`${name} did not read as a session: ${e.message}`, 'bad'); return; }
    let held = [];
    try {
      held = patchPayloads(readSession(bytes))
        .map((x, i) => ({ name: `${one.name} synth ${i + 1}`, data: x.data }));
    } catch { /* a session this module cannot partition still weighs */ }
    lastScan = null;
    fill(held, [one], []);
    drop.say(name, 'good');
  }

  /**
   * The WAVs out of any zip, through `circuit-sample.mjs`. Mac resource forks
   * (`__MACOSX/` and `._` prefixes) are dropped by name, never by size: a short drum hit
   * is small too. Archive order is kept; `samplesIn()`'s numeric sort is for pack slots.
   * See lessons/page-pack.md#pack-62
   */
  async function readWavs(list) {
    const out = [];
    for (const e of list) {
      const name = e.name.split('/').pop();
      if (!/\.wav$/i.test(name)) continue;
      if (/(^|\/)__MACOSX\//.test(e.name) || name.startsWith('._')) continue;
      const bytes = await e.read();
      const wave = readWave(bytes);
      out.push({ name, size: e.size, wave, row: summariseWave(wave, name) });
    }
    return out;
  }

  /**
   * A real download is a zip of packs. `.circuittrackspack` is for the other instrument
   * and is named, not opened. A zip of plain WAVs is a sample set, and a zip holding
   * both loose patches and WAVs shows both.
   * See lessons/page-pack.md#pack-63
   */
  async function openZip(name, bytes) {
    let list;
    try { list = readZip(bytes); }
    catch (e) { drop.say(`${name} did not read as a zip: ${e.message}`, 'bad'); return; }
    const packs = list.filter((e) => e.name.endsWith('.circuitpack'));
    const others = list.filter((e) => e.name.endsWith('.circuittrackspack'));
    const loose = list.filter((e) => e.name.endsWith('.syx'));
    if (others.length) {
      d.log(`${others.length} pack(s) in it are for a Circuit Tracks, not a Circuit, and were left alone`, 'bad');
    }
    if (packs.length) {
      const pick = packs[0];
      if (packs.length > 1) {
        d.log(`${packs.length} packs in ${name}: ${packs.map((e) => e.name.split('/').pop()).join(', ')}. `
            + 'Opening the first', 'hi');
      }
      await openPack(pick.name.split('/').pop(), await pick.read(), `inside ${name}`);
      return;
    }
    if (loose.length) {
      const got = [];
      for (const e of loose) got.push({ name: e.name.split('/').pop(), bytes: await e.read() });
      // One big `.syx` and no patches is a bulk transfer in a zip. Take the biggest `.syx`,
      // not the first: a Mac zip carries a few hundred byte `._` fork beside it.
      // See lessons/page-pack.md#pack-64
      if (!got.some((f) => f.bytes.length === PATCH_BYTES)) {
        const big = got.slice().sort((a, b) => b.bytes.length - a.bytes.length)[0];
        await openSyx(big.name, big.bytes);
        return;
      }
      fill(got, [], await readWavs(list));
      drop.say(name, 'good');
      return;
    }
    // Read last: every branch above returns without them, and decoding a zip's WAVs first
    // could be 5.7 MB of audio thrown away.
    // See lessons/page-pack.md#pack-65
    const wavs = await readWavs(list);
    if (wavs.length) {
      // No extra sentence: `fill()` logs how many read and how many were refused.
      // See lessons/page-pack.md#pack-66
      fill([], [], wavs);
      drop.say(name, 'good');
      return;
    }
    drop.say(`${name} holds no Circuit pack, no patches and no samples`, 'bad');
  }

  /**
   * A file that is not a zip can be a raw SysEx stream: one such `.circuitpack` held 64
   * `Replace Patch` messages (command byte `01`, writes FLASH) for slots 0 to 63.
   * Reading it is free here; the page says out loud what it would do in a tool that sends.
   * See lessons/page-pack.md#pack-67
   */
  // Scanning is `circuit-syx.mjs`, the one place that walks a SysEx stream; it answers
  // `writesFlash` first and reads session payloads too.
  // See lessons/page-pack.md#pack-68
  /**
   * `sampleSetIn` splits streams before unpacking and refuses one whose declared length
   * or CRC32 fails. `survey()`'s session count is wrong when a sample stream is present
   * (a `circuit-syx.mjs` defect), so it is not passed on then.
   * See lessons/page-pack.md#pack-69
   */
  function sysexScan(b) {
    const v = survey(b);
    const set = sampleSetIn(b);
    return {
      messages: v.messages,
      patches: patchesIn(b).map((m) => b.subarray(m.at, m.at + PATCH_BYTES)),
      flash: v.flashMessages,
      slots: new Set(v.flashLocations),
      sessions: set.sampleStreams ? [] : (v.sessions || []),
      blindSessions: set.sampleStreams ? (v.sessions || []).length : 0,
      samples: set.samples,
      set,
    };
  }

  /**
   * What a bulk transfer is, in the log, before anything is shown from it. It always
   * says why a stream was refused: a failed checksum means wrong audio.
   * See lessons/page-pack.md#pack-70
   */
  function sayStreams(name, scan) {
    const set = scan.set;
    if (!set || !set.streams.length) return;
    d.log(`${name} carries ${set.streams.length} bulk stream(s), `
      + `${set.verified} verified against a declared length and a CRC32`
      + (set.other ? `, and ${set.other} message(s) outside any stream` : ''), 'hi');
    for (const s of set.streams) {
      if (!s.ok) { d.log(`the stream at ${s.at} was refused: ${s.why}`, 'bad'); continue; }
      d.log(`the stream at ${s.at} restores ${s.plainBytes.toLocaleString()} bytes from `
        + `${s.carriers.toLocaleString()} carriers and holds ${s.holds}`);
    }
    if (scan.blindSessions) {
      d.log(`the session count is withheld: slicing this file blind gives ${scan.blindSessions}, `
        + 'which crosses a stream boundary and is not what is in it', 'bad');
    }
  }

  let lastScan = null;

  /**
   * It always says something, so a previous file's warning never stays on screen while a
   * harmless file is open.
   * See lessons/page-pack.md#pack-71
   */
  /**
   * The confirmation is the file's name only: the counts lead the tab titles and
   * `sent nowhere` is in the picture's caption. It always overwrites, so a previous
   * file's words never stand as a stale alarm.
   * See lessons/page-pack.md#pack-72
   */
  function sayScan(name, scan, ok) {
    lastScan = scan;
    if (!scan.flash) { if (ok) drop.say(ok, 'good'); return; }
    const slots = [...scan.slots].sort((a, b) => a - b);
    const span = slots.length > 1 ? `${slots.length} slots, ${slots[0]} to ${slots[slots.length - 1]}` : `slot ${slots[0]}`;
    drop.say(`${name} would overwrite ${span} in the flash of a Circuit if it were sent. `
      + 'Nothing here can send it', 'bad');
    d.log(`${name} carries ${scan.flash} Replace Patch message(s), which write flash on an `
        + 'instrument with no factory reset', 'bad');
  }

  /**
   * Byte 0 decides the reader: `50 4b` is a zip, `f0` a bulk SysEx transfer. Anything
   * else is refused as itself.
   * See lessons/page-pack.md#pack-73
   */
  async function openPack(name, bytes, from = '') {
    const kind = containerOf(bytes);
    if (kind.kind !== CONTAINER.zip) {
      // It says both things: that it is not a zip, and what it is.
      // See lessons/page-pack.md#pack-74
      const scan = kind.kind === CONTAINER.sysex ? sysexScan(bytes) : null;
      if (scan && (scan.patches.length || scan.samples.length || scan.sessions.length)) {
        d.log(`${name} is not a zip. It is a stream of ${scan.messages} sysex messages, `
            + `${scan.patches.length} of them Circuit patches`, 'hi');
        sayStreams(name, scan);
        // A stream carries sessions and samples too, seven bits to the byte in 300 byte
        // carriers, graded by the same three numbers as a pack.
        // See lessons/page-pack.md#pack-75
        const st = [];
        for (let k = 0; k < scan.sessions.length; k++) {
          st.push(await readOne(scan.sessions[k], `session ${k}`));
        }
        fill(scan.patches.map((b, i) => ({ name: `${name} #${i}`, bytes: b })), st, scan.samples);
        sayScan(name, scan, name);
        return;
      }
      drop.say(scan
        ? `${name} is a sysex stream, and ${scan.set.why}`
        : `${name} is not a pack: ${kind.why}`, 'bad');
      return;
    }
    let list;
    try { list = readZip(bytes); }
    catch (e) {
      drop.say(`${name} did not read as a pack: ${e.message}`, 'bad');
      return;
    }

    const meta = entry(list, 'index.json');
    let names = [];
    if (meta) {
      try {
        const m = JSON.parse(new TextDecoder().decode(await meta.read()));
        names = (m.sessions || []).map((s) => s.name || '');
        d.log(`${name} calls itself "${m.name || '(no name)'}", ${m.product} ${m.version}`);
      } catch { /* a pack with no readable index is still a pack */ }
    }

    const syx = list
      .filter((e) => /\.syx$/.test(e.name))
      .sort((a, b) => (+(a.name.match(/\d+/) || [0])[0]) - (+(b.name.match(/\d+/) || [0])[0]));
    const sess = list.filter((e) => e.name.endsWith('.circuitsession'));

    const got = [];
    for (const e of syx) got.push({ name: e.name.split('/').pop(), bytes: await e.read() });

    // The session is decoded by `circuit-session.mjs`, not only weighed by `sessionStats`.
    // See lessons/page-pack.md#pack-76
    const st = [];
    for (let i = 0; i < sess.length; i++) {
      const b = await sess[i].read();
      st.push(await readOne(b, names[i] || sess[i].name.split('/').pop()));
    }

    // A sample is read by `circuit-sample.mjs`, which refuses bad files by name and
    // decodes to floats. Raw bytes are not kept: `readWave` copies the data chunk.
    // See lessons/page-pack.md#pack-77
    const sm = await readWavs(list);

    fill(got, st, sm);
    drop.say(`${name}${from ? ` ${from}` : ''}`, 'good');
  }

  /**
   * One session, weighed and decoded. The name in the file wins over `index.json`'s;
   * the fallback is for a stream with no index.
   * See lessons/page-pack.md#pack-78
   */
  async function readOne(bytes, fallbackName) {
    const stats = await sessionStats(bytes);
    let deep = null, parts = [], events = [];
    try {
      const model = readSession(bytes);
      deep = summariseSession(model);
      // The per-region `data` copy is dropped (only `rebuild()` needs it); the counts are
      // kept, including the note count per region.
      // See lessons/page-pack.md#pack-79
      const per = notesPerRegion(bytes);
      let wide = 0;
      parts = model.slots.map((x) => ({
        index: x.index, kind: x.kind, at: x.at, size: x.size, used: x.used, pad: x.pad,
        notes: x.kind === 'wide' ? per[wide++] : null,
      }));
      events = notesIn(bytes);
    } catch { /* a file this module cannot partition is still weighable */ }
    return {
      ...stats,
      bytes,
      name: deep?.name || fallbackName,
      tag: deep?.tag ?? null,
      used: deep?.used ?? null,
      magicOk: deep?.magicOk ?? null,
      patchNames: deep?.patchNames || [],
      parts,
      notes: events.length,
      // The note events themselves, not only how many.
      // See lessons/page-pack.md#pack-80
      events,
      velocityPerStep: bytes[VELOCITY_AT] === VELOCITY_PER_STEP,
      pitches: events.length
        ? [Math.min(...events.map((e) => e.note)), Math.max(...events.map((e) => e.note))]
        : null,
    };
  }

  /**
   * One session opened out of the list. It logs, which is where a state change
   * belongs, and it never touches the network or the audio context.
   */
  function showSession(i) {
    const x = sessions[i];
    if (!x) return;
    pickedSession = i;
    sessionTable.mark((r) => r.i === i);

    /**
     * Regions are numbered, not named: the offset and stride are what is measured, and
     * the `size` column carries the four strides. The two corroborated patches are
     * `synth 1` and `synth 2` out of the tail region.
     * See lessons/page-pack.md#pack-81
     */

    partsTable.set(x.parts.map((r, k) => ({
      /* `i` is what a press and `mark(is)` read: `table.mjs` hands `onPick` the row object,
         never an index.
         See lessons/page-pack.md#pack-82 */
      i: k,
      part: `region ${k + 1}`,
      size: n(r.size),
      at: n(r.at),
      used: n(r.used),
      // Empty, not `0`, on a region that cannot hold notes: the 34 not 1,508 bytes long
      // were never read for notes.
      // See lessons/page-pack.md#pack-83
      notes: r.notes === null ? '' : n(r.notes),
      hover: `${n(r.size)} bytes at ${n(r.at)}, ${n(r.used)} written and ${n(r.pad)} erased`
           + (r.notes === null
             ? '. Nothing is known about what this one holds'
             : `. ${n(r.notes)} note event(s) in its sixteen step records`),
    })));

    /* A new session opens with no region pressed; the block keeps its room either way.
       See lessons/page-pack.md#pack-84 */
    showRegion(-1);

    d.log(`${x.name || '(no name)'}, head ${x.head}, ${n(x.used)} B written across `
        + `${x.parts.length} regions, holding ${x.patchNames.join(' and ') || 'no readable patches'}`);
  }

  /**
   * A note's length in steps, the only unit the file states. Header byte 8 picks the
   * encoding: `0x07` gate runs 0 to 15, `0xFF` 1 to 96, `ff = 6 x (07 + 1)`. A reading,
   * not checked on an instrument, so it is shown on hover, never drawn as a length.
   * See lessons/page-pack.md#pack-85
   */
  function gateSteps(x, e) {
    const raw = e.gate;
    if (!Number.isFinite(raw)) return null;
    return x.velocityPerStep ? raw + 1 : raw / 6;
  }

  /**
   * The step picture, six rows of sixteen always. A region holds notes, is read and
   * holds none, or is not read for notes at all; the row names say which, since an
   * empty picture looks the same for the last two.
   * See lessons/page-pack.md#pack-86
   */
  function showRegion(i) {
    pickedRegion = i;
    partsTable.mark((r) => r.i === i);
    const x = sessions[pickedSession];
    const part = i >= 0 ? x?.parts[i] : null;
    /* The wide regions are parts 1 to 16 and `notesIn` numbers them 0 to 15,
       so the offset is one and it is read off the part rather than assumed. */
    const events = part && part.notes !== null && x
      ? x.events.filter((e) => e.region === i - 1)
      : [];

    const say = !part ? ''
      : part.notes === null ? 'not read'
      : part.notes === 0 ? 'no notes'
      : `${part.notes} note${part.notes === 1 ? '' : 's'}`;
    /* The corner cell, which is the one label with room for the answer and is
       the first thing under the pressed row. */
    gridEl.firstChild.textContent = say;
    gridEl.firstChild.title = !part
      ? 'press a region above to see its sixteen steps'
      : part.notes === null
        ? 'nothing is known about what this region holds, so it was never read for notes'
        : `${part.notes} note event(s) in this region's sixteen step records`;

    for (const row of padCells) {
      for (const p of row) {
        delete p.dataset.on;
        p.style.removeProperty('--pk-v');
        p.textContent = '';
        p.title = '';
      }
    }
    for (const e of events) {
      const p = padCells[e.slot]?.[e.step];
      if (!p) continue;
      p.dataset.on = '1';
      p.style.setProperty('--pk-v', String(Math.max(0, Math.min(127, e.velocity)) / 1.27));
      /* A note number above 127 is not clamped: `noteName` answers '' and the pad shows the
         raw byte (105 of 5,095 events in this pack), so a decoder hole stays visible.
         See lessons/page-pack.md#pack-87 */
      const name = noteName(e.note);
      p.textContent = name || String(e.note);
      const g = gateSteps(x, e);
      p.title = `step ${e.step + 1}, slot ${e.slot + 1}`
        + `, ${name ? `note ${name} (${e.note})` : `byte ${e.note}, which is too high to be a note`}`
        + `, velocity ${e.velocity}`
        + (g === null ? '' : `, ${g % 1 ? g.toFixed(2) : g} step(s) long`);
    }
    if (headStep >= STEPS || headStep < 0) headStep = 0;
    moveHead(headStep);
  }

  /** Where the transport's head is, as a step index. */
  function moveHead(step) {
    headStep = Math.max(0, Math.min(STEPS - 1, step));
    stepDeck.seek(headStep);
    stepCells.forEach((c, s) => {
      if (s === headStep) c.dataset.now = '1'; else delete c.dataset.now;
    });
    padCells.forEach((row) => row.forEach((p, s) => {
      if (s === headStep) p.dataset.now = '1'; else delete p.dataset.now;
    }));
  }

  /* ‹ and ›. They wrap, because sixteen steps are a ring and a head parked at
     the end with a dead button beside it is a control that looks live. */
  function walk(by) { moveHead((headStep + by + STEPS) % STEPS); }

  /**
   * How far each session is from its nearest neighbour in the same file, in bytes.
   * The one measure that separates a stock session from work: a one byte difference
   * already gives a distinct fingerprint and ordinary entropy.
   * See lessons/page-pack.md#pack-88
   */
  function nearestEach(list) {
    const out = new Array(list.length).fill(Infinity);
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i].bytes, b = list[j].bytes;
        let n = 0;
        const len = Math.max(a.length, b.length);
        for (let k = 0; k < len; k++) if (a[k] !== b[k]) n++;
        if (n < out[i]) out[i] = n;
        if (n < out[j]) out[j] = n;
      }
    }
    return out;
  }

  function fill(files, stats, wavs) {
    patches = []; rows = [];
    for (const f of files) {
      let p;
      // A patch that will not read is reported by name, never skipped. A session's patches
      // are 340 byte payloads (`f.data`), a `.syx` is a whole 350 byte message (`f.bytes`);
      // reading the first as the second would mean building a SysEx frame.
      // See lessons/page-pack.md#pack-89
      try { p = f.data ? readPatchData(f.data) : readPatch(f.bytes); }
      catch (e) { d.log(`${f.name}: ${e.message}`, 'bad'); continue; }
      if (p.writesFlash) {
        d.log(`${f.name} is a Replace Patch, which writes ${p.slotName} in flash. `
            + 'Nothing here can send it', 'bad');
      }
      const i = patches.length;
      patches.push(p);
      const s = summarise(p);
      const moved = patchFields(p).filter((x) => x.changed).length;
      rows.push({
        i,
        name: p.name || '(no name)',
        wave: s.osc1,
        filter: s.filter,
        lfo: s.lfo === 'none' ? '' : s.lfo,
        voice: s.poly,
        hover: `${p.commandName}, ${p.slotName}, category ${p.category}`
             + `${s.categoryLabel ? ` (${s.categoryLabel})` : ''}`
             + `, osc 2 ${s.osc2Silent ? 'silent' : s.osc2}`
             + `, attack ${s.attack} release ${s.release}, ${s.mods} mod slot(s)`
             + `, ${moved} of ${PATCH_DATA} parameters off their default`,
      });
    }
    patchTable.set(rows);

    sessions = stats;
    const near = stats.length > 1 ? nearestEach(stats) : stats.map(() => null);
    stats.forEach((x, i) => { x.nearest = near[i]; });
    sessionTable.set(stats.map((s, i) => ({
      i,
      name: s.name || '(no name)',
      head: s.head,
      // Empty, not `absent`: `magicOk === null` means the file could not be partitioned.
      // See lessons/page-pack.md#pack-90
      marker: s.magicOk === null ? '' : s.magicOk ? 'DC BB' : 'absent',
      synth1: s.patchNames[0] || '',
      synth2: s.patchNames[1] || '',
      notes: n(s.notes),
      used: s.used === null ? '' : n(s.used),
      notErased: n(s.notErased),
      payload: n(s.payload),
      filled: `${pct(s.nonZero)}%`,
      entropy: s.entropy.toFixed(2),
      nearest: s.nearest === null || s.nearest === Infinity ? '' : n(s.nearest),
      hover: `${s.notes} note event(s)`
           + `${s.magicOk === false ? ', and it carries no Circuit session marker' : ''}`
           + '. Press to open it',
    })));

    samples = wavs;
    /**
     * A sample that would not parse keeps its row and says why, like a patch.
     * See lessons/page-pack.md#pack-91
     */
    sampleTable.set(wavs.map((w, i) => {
      const r = w.row;
      if (!r.ok) {
        return { i, name: w.name, len: '', frames: '', rate: '', peak: '', sound: '',
                 hover: `this one did not read: ${r.why}` };
      }
      /**
       * A header that read and audio that did not are two facts: `toMono` decodes 16 bit
       * mono only, so a 24 bit stereo file has `peak` and `sound` null. Header cells stay,
       * measured cells go empty, and the reason is on the hover.
       * See lessons/page-pack.md#pack-92
       */
      const heard = r.peak !== null;
      return {
        i,
        name: w.name,
        len: `${r.seconds.toFixed(2)} s`,
        frames: r.frames.toLocaleString(),
        rate: `${(r.rate / 1000).toFixed(r.rate % 1000 ? 1 : 0)} kHz`,
        peak: heard ? r.peak.toFixed(2) : '',
        sound: heard ? `${r.sound.toFixed(0)}%` : '',
        hover: `${r.rate} Hz, ${r.bits} bit, ${r.channels === 1 ? 'mono' : `${r.channels} channels`}`
             + `, ${r.frames.toLocaleString()} frames in ${kb(w.size)}`
             + (heard
               ? `, ${r.lead} frame(s) of silence at the front and ${r.trail} at the back`
                 + `${r.silent ? ', and it is silent all through' : ''}. Press to hear it`
               // A second line rather than a join: a `title` breaks on a newline.
               // See lessons/page-pack.md#pack-93
               : `\n${r.why}`),
      };
    }));

    /* The two facts the removed line carried that no column can. See the note
       over where that line used to be built. */
    const all = summariseAll(wavs.map((w) => w.wave));
    if (all.count) {
      d.log(`${all.parsed} of ${all.count} samples read`
          + (all.refused ? `, ${all.refused} refused` : '')
          + `, ${all.seconds.toFixed(1)} s in total`);
    }

    countTabs({ patches: patches.length, sessions: sessions.length, samples: samples.length });
    sayCounts(stats);
    /**
     * No picture until a file lands. Unhide the host before `showPatch`: inside
     * `display: none`, `getComputedTextLength` answers 0 and labels lay out against zero.
     * See lessons/page-pack.md#pack-94
     */
    dgHost.hidden = !patches.length;
    tabs.el.hidden = !(patches.length || stats.length || wavs.length);
    if (patches.length) showPatch(0);
    // The first session opens too, so a press changes words rather than adding a block.
    // See lessons/page-pack.md#pack-95
    if (sessions.length) showSession(0);
    else {
      // Every cell back to empty, not 0: `setCell` hides the unit with it.
      // See lessons/page-pack.md#pack-96
      partsTable.set([]); pickedSession = -1; showRegion(-1);
    }
  }

  /**
   * No verdict block: the evidence is the `nearest` column. One log line stays as a
   * count with no conclusion (`3 sessions sit within 16 bytes of another`).
   * See lessons/page-pack.md#pack-97
   */
  const TEMPLATE_GAP = 16;
  function sayCounts(stats) {
    if (!stats.length) return;
    const distinct = new Set(stats.map((x) => x.fingerprint)).size;
    const copies = stats.filter((x) => x.nearest !== null && x.nearest !== Infinity
      && x.nearest < TEMPLATE_GAP).length;
    d.log(`${stats.length} sessions, ${distinct} distinct`
      + (copies ? `, ${copies} within ${TEMPLATE_GAP} bytes of another` : ''));
  }

  /**
   * On a press only: nothing is decoded on a visit. `AudioContext.resume()` waits on a
   * gesture and never rejects, so it is fired and not awaited.
   * See lessons/page-pack.md#pack-98
   */
  /**
   * Opening a sample and playing it are separate verbs: the player needs a sample open
   * without one sounding.
   * See lessons/page-pack.md#pack-99
   */
  function openSample(i, andPlay) {
    const w = samples[i];
    if (!w) return;
    picked2 = i;
    sampleTable.mark((r) => r.i === i);
    const r = w.row;
    /**
     * The sample's facts are the marked row's columns; a refusal is its hover and blanks.
     * See lessons/page-pack.md#pack-100
     */
    // The picture is drawn from the same `toMono` floats the sound is made of.
    // See lessons/page-pack.md#pack-101
    const mono = r.ok ? toMono(w.wave) : { ok: false };
    /**
     * No sound follows the audio, not the header: a header can read while `toMono` refuses
     * (24 bit, 8 bit, surround). Two wordings for two facts: header unreadable, or audio
     * not mixable. A picture or a sentence, never both and never neither.
     * See lessons/page-pack.md#pack-102
     */
    if (mono.ok) {
      /* The words are cleared as well as hidden, so no stale refusal is left behind.
         See lessons/page-pack.md#pack-103 */
      whyEl.textContent = '';
      whyRow.hidden = true;
      waveRow.hidden = false;
      wave.buffer(peaksOf(mono.samples));
      /* `wave.source()` is not called: the marked row already names the sample. The
         component is untouched; other pages need the corner name.
         See lessons/page-pack.md#pack-104 */
      wave.playhead(0);
    } else {
      wave.clear();
      waveRow.hidden = true;
      whyEl.textContent = r.ok ? WHY_UNPLAYABLE : WHY_UNREAD;
      whyRow.hidden = false;
    }

    // The press still reaches `playSample`, which logs why a file made no sound.
    // See lessons/page-pack.md#pack-105
    if (andPlay && r.ok) playSample(i);
  }

  /**
   * Audio comes from `circuit-sample.mjs`, not `decodeAudioData`: `toMono` says why it
   * refuses, and being synchronous the check can grade a press. `resume()` waits on a
   * gesture and never rejects, so it is fired and not awaited.
   * See lessons/page-pack.md#pack-106
   */
  /**
   * @param {number} i  which slot
   * See lessons/page-pack.md#pack-107
   */
  function playSample(i) {
    const w = samples[i];
    if (!w) return;
    const mono = toMono(w.wave);
    if (!mono.ok) { d.log(`${w.name} did not decode: ${mono.why}`, 'bad'); return; }
    // An empty slot is a row, and `createBuffer(1, 0, rate)` throws: a bulk transfer can
    // hold empty slots (one held 48 filled and 16 empty).
    // See lessons/page-pack.md#pack-108
    if (mono.frames === 0) { d.log(`${w.name} is an empty slot`); return; }
    try {
      stopSample();
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
      const buf = ac.createBuffer(1, mono.frames, mono.rate);
      buf.copyToChannel(mono.samples, 0);
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(ac.destination);
      /* The handle is kept because a second press has to silence the first; `stopSample`
         and `onended` need the current voice.
         See lessons/page-pack.md#pack-109 */
      src.onended = () => {
        if (voice !== src) return;
        voice = null;
        /* The head goes back to the top when a one-shot ends, as on a stop: a line left in a
           picture with nothing playing reads as paused.
           See lessons/page-pack.md#pack-110 */
        wave.playhead(0);
      };
      src.start();
      voice = src;
      played++;
      /**
       * The head follows `AudioContext.currentTime`, the clock that agrees with what is
       * heard, and stops when the sound does.
       * See lessons/page-pack.md#pack-111
       */
      const began = ac.currentTime;
      /**
       * See lessons/page-pack.md#pack-112
       */
      /* The scope is pushed a fraction, so the page owns the frame loop.
         See lessons/page-pack.md#pack-113 */
      const tick = () => {
        if (voice !== src) return;
        const t = ac.currentTime - began;
        wave.playhead(buf.duration > 0 ? t / buf.duration : 0);
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      lastPlayed = { name: w.name, frames: mono.frames, rate: mono.rate, seconds: buf.duration };
      d.log(`${w.name}, ${buf.duration.toFixed(2)} s, ${mono.frames.toLocaleString()} frames at `
          + `${mono.rate} Hz`);
    } catch (e) {
      d.log(`no sound here (${e.message})`, 'bad');
    }
  }

  function stopSample() {
    if (!voice) return;
    try { voice.stop(); } catch { /* a voice that already ended cannot be stopped twice */ }
    voice = null;
    // The head goes back to the top: a line left mid-picture with nothing playing reads
    // as paused, and nothing here can resume.
    // See lessons/page-pack.md#pack-114
    wave.playhead(0);
  }

  /* Nothing listens here: a press on a row, via the table's `onPick`, is the one way in.
     See lessons/page-pack.md#pack-115 */

  // ── what a visit is allowed to have done ─────────────────────────────────
  d.assert('a visit opens nothing, asks for nothing and makes no sound',
    drop.opens === 0 && patches.length === 0 && fetched === 0 && played === 0 && ac === null,
    `${drop.opens} files opened, ${patches.length} patches read, ${fetched} request(s), ${played} sample(s) played`);

  d.assert('nothing here asks for MIDI, so nothing here can write to an instrument',
    midiAsked === 0 && navigator.requestMIDIAccess !== undefined,
    `requestMIDIAccess called ${midiAsked} time(s), and the counter is still in front of it`);

  // The way in is on screen before any drag.
  // See lessons/page-pack.md#pack-116
  {
    const box = drop.el.getBoundingClientRect();
    d.assert('the way in is visible at rest and says what it takes, including a zip',
      box.width > 200 && box.height > 40 && /\.zip/.test(drop.el.textContent)
      && !drop.el.dataset.over && drop.cover.isConnected === false,
      `${box.width.toFixed(0)} by ${box.height.toFixed(0)} px`);

    /**
     * The order is measured off the screen, not the source: `append` order is not layout.
     * Expected: title, button, then the extensions under it.
     * See lessons/page-pack.md#pack-117
     */
    /**
     * The footer is not there when it has nothing to say: an empty footer is a box
     * painting a line nobody wrote.
     * See lessons/page-pack.md#pack-118
     */
    /* Reads the rows' computed `display`, not rects: with nothing open the tab strip is
       hidden and every rect under it is zero anyway.
       See lessons/page-pack.md#pack-119 */
    d.assert('with nothing open there is neither a waveform nor a word about one, so no empty part paints an edge',
      samplesRows.count() === 3 && away(waveRow) === true && away(whyRow) === true
      && wave.showing() === 'scrolling',
      `the panel holds ${samplesRows.count()} rows with the picture `
      + `${away(waveRow) ? 'away' : 'up'} and the words `
      + `${away(whyRow) ? 'away' : 'up'}, showing ${wave.showing()}, `
      + 'and the whole tab strip is away so no rect here is evidence');

    d.assert('the block has no footer until something has been opened',
      drop.note.hidden === true && drop.note.textContent === ''
      && drop.note.getBoundingClientRect().height === 0,
      `the footer is ${drop.note.hidden ? 'away' : 'up'} at `
      + `${drop.note.getBoundingClientRect().height} px`);

    const t = drop.el.querySelector('.pos-drop-title').getBoundingClientRect();
    const b = drop.button.getBoundingClientRect();
    const h = drop.el.querySelector('.pos-drop-hint').getBoundingClientRect();
    d.assert('the title is over the button and the list of what it takes is under it',
      t.bottom <= b.top + 1 && h.top >= b.bottom - 1
      && drop.el.querySelector('.pos-drop-title').textContent === 'UPLOAD FILE'
      && drop.button.textContent === 'Open file'
      && /or drag a file here/.test(drop.el.textContent),
      `title ends at ${t.bottom.toFixed(0)}, the button runs ${b.top.toFixed(0)} to `
      + `${b.bottom.toFixed(0)}, the list starts at ${h.top.toFixed(0)}`);

    /**
     * One way in, and the removal of the old open button is itself graded: a removed
     * control's asserts stop running rather than fail.
     * See lessons/page-pack.md#pack-120
     */
    const bar = document.querySelector('.pos-controls');
    d.assert('there is one way in and no control row at all, which is what the page promises',
      bar?.hidden === true && bar.querySelectorAll('button').length === 0,
      `${bar ? bar.querySelectorAll('button').length : 'no'} control(s), row ${bar?.hidden ? 'hidden' : 'shown'}`);
  }

  d.assert('the picture cut nothing and refused nothing',
    dg.cuts.length === 0, dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(', ') || 'none');
  d.assert('every line in the picture has an arrowhead on it',
    dg.ties === 0, `${dg.ties} headless tie(s)`);

  /**
   * No picture before a file, and no `How it works` heading either: the heading is not
   * the diagram's own element, so it is the easy one to leave standing.
   * See lessons/page-pack.md#pack-121
   */
  {
    const box = dgHost.getBoundingClientRect();
    d.assert('with no file open there is no picture and no heading over one',
      dgHost.hidden === true && box.height === 0
      && dgHost.querySelector('.pos-how') !== null
      && dgHost.querySelector('.pos-dg') !== null,
      `the host is ${box.height} px tall holding `
      + `${dgHost.querySelectorAll('.pos-how, .pos-dg').length} parts`);
  }

  d.assert('every tab keeps its bare word until it has something to count',
    tabs.buttons.map((b) => b.textContent).join(' ') === 'Patches Sessions Samples',
    tabs.buttons.map((b) => b.textContent).join(' '));

  /**
   * The phone block is invisible to the harness (verify.mjs runs at 756 px), so this
   * asserts only that it is last; a media query adds no specificity. Its behaviour was
   * measured by hand at 390 px.
   * See lessons/page-pack.md#pack-122
   */
  {
    const css = document.querySelector('style')?.textContent || '';
    const at = css.lastIndexOf('@media');
    /* Walk the braces from the query to the one that closes it, then read what
       is left. Anything but whitespace after it is a plain rule that beats the
       whole block at every width. */
    let depth = 0, end = -1;
    for (let i = at; i >= 0 && i < css.length; i++) {
      if (css[i] === '{') depth++;
      else if (css[i] === '}' && --depth === 0) { end = i; break; }
    }
    const after = end >= 0 ? css.slice(end + 1) : 'unclosed';
    d.assert('the phone rules are the last thing in the stylesheet, where a media query can still win',
      at > 0 && end > at && after.trim() === '',
      `${after.trim().length} characters of plain CSS follow the last media query`);
  }

  /**
   * Reads computed style, not `hidden`: `.pos-tbl-row` sets `display: grid`, which beats
   * the UA `[hidden]` rule (`shell.css` now has `.pos-tbl-row[hidden]`). All four tables.
   * See lessons/page-pack.md#pack-123
   */
  {
    const heads = [patchTable, sessionTable, partsTable, sampleTable]
      .map((t) => t.el.querySelector('.pos-tbl-head'))
      .filter(Boolean);
    const drawn = heads.filter((h) => getComputedStyle(h).display !== 'none');
    d.assert('an empty table draws no heading, because a column name over nothing labels air',
      patchTable.count() === 0 && sampleTable.count() === 0 && partsTable.count() === 0
      && heads.length === 4 && drawn.length === 0,
      `${drawn.length} of ${heads.length} headings are still being drawn over `
      + `${patchTable.count()} patch, ${sessionTable.count()} session and ${sampleTable.count()} sample rows`);

    // The whole block is away.
    // See lessons/page-pack.md#pack-124
    d.assert('with no file open there are no tabs and nothing under them',
      tabs.el.hidden === true && getComputedStyle(tabs.el).display === 'none'
      && tabs.el.getBoundingClientRect().height === 0,
      `the tabs are ${getComputedStyle(tabs.el).display} at `
      + `${tabs.el.getBoundingClientRect().height} px`);
  }

  if (SELFCHECK) {
    /**
     * Byte 0 picks the reader, graded with no file so it runs on the deploy: `50 4b` zip,
     * `f0` stream, anything else refused. None of the three may open anything, which keeps
     * the `no file open, no tabs` assert true.
     * See lessons/page-pack.md#pack-125
     */
    {
      const zipish = new Uint8Array([0x50, 0x4b, 0x03, 0x04, 1, 2, 3, 4]);
      const streamish = new Uint8Array([0xf0, 0x00, 0x20, 0x29, 0x00, 0x77, 0xf7]);
      const neither = new Uint8Array([0x4d, 0x5a, 0x90, 0x00]);
      await openPack('a truncated zip', zipish);
      const saidZip = drop.note.textContent;
      await openPack('a stream that never ends', streamish);
      const saidStream = drop.note.textContent;
      await openPack('a Windows executable', neither);
      const saidNeither = drop.note.textContent;
      d.assert('byte 0 routes a file three ways, and a stream is refused as a stream rather than as "not a pack"',
        /did not read as a pack/.test(saidZip)
        && /is a sysex stream/.test(saidStream) && /never ends/.test(saidStream)
        && /a zip starts 50 4b/.test(saidNeither)
        && new Set([saidZip, saidStream, saidNeither]).size === 3
        && patches.length === 0 && sessions.length === 0 && samples.length === 0,
        `zip: "${saidZip}", stream: "${saidStream.slice(0, 50)}", `
        + `neither: "${saidNeither.slice(0, 50)}"`);
      d.assert('NEGATIVE CONTROL: the router reads the bytes rather than answering the same thing three times',
        containerOf(zipish).kind === CONTAINER.zip
        && containerOf(streamish).kind === CONTAINER.sysex
        && containerOf(neither).kind === CONTAINER.unknown,
        `${containerOf(zipish).kind}, ${containerOf(streamish).kind}, ${containerOf(neither).kind}`);

      /**
       * The third branch matters: `patchesIn()` (`circuit-syx.mjs`) finds patches by length
       * alone, so scanning compressed data found 134 350 byte runs with no Circuit head
       * `f0 00 20 29 01 60`. Byte 0 refuses the file before that question is asked.
       * See lessons/page-pack.md#pack-126
       */
      const rar = new Uint8Array([0x52, 0x61, 0x72, 0x21, 0x1a, 0x07, 0x00]);
      const noise = new Uint8Array(PATCH_BYTES);
      noise[0] = 0xf0;
      noise[PATCH_BYTES - 1] = 0xf7;
      for (let k = 1; k < PATCH_BYTES - 1; k++) noise[k] = (k * 37) & 0x7f;
      d.assert('NEGATIVE CONTROL: any 350 byte run counts as a patch, so a rar has to be refused by its first two bytes',
        patchesIn(noise).length === 1
        && noise[4] !== SYSEX_HEAD[4]
        && containerOf(rar).kind === CONTAINER.unknown,
        `the patch reader counts ${patchesIn(noise).length} in 350 bytes of noise whose head is `
        + `${[...noise.subarray(0, 6)].map((x) => x.toString(16).padStart(2, '0')).join(' ')}, `
        + 'and a rar never reaches it');
    }

    /**
     * A zip of plain WAVs, built here (`storedZip`, method 0) rather than fetched, so it
     * runs anywhere with no request. Writing a zip is not writing a message: it reaches no
     * instrument; inside are two sine bursts and a deliberate refusal.
     * See lessons/page-pack.md#pack-127
     */
    {
      /**
       * PCM at whatever shape the caller asks for; the default is 48 kHz 16 bit mono, as
       * every `.circuitpack` sample is. Other shapes too, since a zip is anybody's files.
       * See lessons/page-pack.md#pack-128
       */
      const wavBytes = (frames, { rate = 48000, bits = 16, channels = 1 } = {}) => {
        const per = bits / 8, block = per * channels, len = frames * block;
        const b = new Uint8Array(44 + len);
        const dv = new DataView(b.buffer);
        const put = (at, s) => { for (let k = 0; k < s.length; k++) b[at + k] = s.charCodeAt(k); };
        put(0, 'RIFF'); dv.setUint32(4, 36 + len, true); put(8, 'WAVE');
        put(12, 'fmt '); dv.setUint32(16, 16, true);
        dv.setUint16(20, 1, true); dv.setUint16(22, channels, true);
        dv.setUint32(24, rate, true); dv.setUint32(28, rate * block, true);
        dv.setUint16(32, block, true); dv.setUint16(34, bits, true);
        put(36, 'data'); dv.setUint32(40, len, true);
        // A burst rather than silence, for the reason every stand-in in this
        // repository is a tone: a page that reported a peak of zero about
        // silence would pass a check it never made.
        for (let k = 0; k < frames; k++) {
          const v = Math.sin(k / 9) * 0.6;
          for (let c = 0; c < channels; c++) {
            const at = 44 + k * block + c * per;
            if (bits === 16) dv.setInt16(at, Math.round(v * 32767), true);
            else {
              const q = Math.round(v * 8388607);
              b[at] = q & 0xff; b[at + 1] = (q >> 8) & 0xff; b[at + 2] = (q >> 16) & 0xff;
            }
          }
        }
        return b;
      };
      /** A zip with nothing compressed in it, which is a hundred bytes of header. */
      const storedZip = (files) => {
        const enc = new TextEncoder();
        const locals = [], centrals = [];
        let off = 0;
        for (const f of files) {
          const nm = enc.encode(f.name);
          const loc = new Uint8Array(30 + nm.length + f.bytes.length);
          const lv = new DataView(loc.buffer);
          lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
          lv.setUint32(18, f.bytes.length, true); lv.setUint32(22, f.bytes.length, true);
          lv.setUint16(26, nm.length, true);
          loc.set(nm, 30); loc.set(f.bytes, 30 + nm.length);
          locals.push(loc);
          const cen = new Uint8Array(46 + nm.length);
          const cv = new DataView(cen.buffer);
          cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
          cv.setUint32(20, f.bytes.length, true); cv.setUint32(24, f.bytes.length, true);
          cv.setUint16(28, nm.length, true); cv.setUint32(42, off, true);
          cen.set(nm, 46);
          centrals.push(cen);
          off += loc.length;
        }
        const cdLen = centrals.reduce((n2, c) => n2 + c.length, 0);
        const out = new Uint8Array(off + cdLen + 22);
        let p = 0;
        for (const l of locals) { out.set(l, p); p += l.length; }
        const cdAt = p;
        for (const c of centrals) { out.set(c, p); p += c.length; }
        const ev = new DataView(out.buffer, p);
        ev.setUint32(0, 0x06054b50, true);
        ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
        ev.setUint32(12, cdLen, true); ev.setUint32(16, cdAt, true);
        return out;
      };

      // The fork sits between the two good files so a missed filter also shows as wrong order.
      // See lessons/page-pack.md#pack-129
      const fork = new Uint8Array(300);
      fork.set([0x00, 0x05, 0x16, 0x07], 0);
      const notWave = new Uint8Array([0x52, 0x58, 0x46, 0x46, 0, 0, 0, 0, 0x57, 0x41, 0x56, 0x45]);
      const bag = storedZip([
        { name: 'Kick.wav', bytes: wavBytes(4800) },
        { name: '__MACOSX/._Kick.wav', bytes: fork },
        { name: 'hits/Snare.wav', bytes: wavBytes(24000) },
        // 24 bit stereo with extra chunks is the common shape of a real sample bag (only 84 of
        // 901 measured files are plain `fmt ` then `data`). `Room.wav` is an ordinary row.
        // See lessons/page-pack.md#pack-130
        { name: 'Room.wav', bytes: wavBytes(44100, { rate: 44100, bits: 24, channels: 2 }) },
        // The refusal branch is live code and keeps its own subject: six channels are refused
        // by name, since a plain average is a guess for a surround set.
        // See lessons/page-pack.md#pack-131
        { name: 'Surround.wav', bytes: wavBytes(44100, { rate: 44100, channels: 6 }) },
        { name: 'readme.txt', bytes: new TextEncoder().encode('recorded on a desk') },
        { name: 'Cymbal.wav', bytes: notWave },
      ]);
      const inBag = readZip(bag);
      const beforeBag = fetched;
      await openZip('a bag of drum hits.zip', bag);
      const bagSaid = window.__demo.logs.map((l) => l.msg).join('\n');
      /* `.pos-tbl-c` and the scroller, not `children` or `el`: the heading is a
         `.pos-tbl-row` and comes first.
         See lessons/page-pack.md#pack-132 */
      const cells = [...(sampleTable.scroller()
        .querySelector('.pos-tbl-row')?.querySelectorAll('.pos-tbl-c') || [])]
        .map((c) => c.textContent);

      d.assert('a zip of plain wavs opens as a sample set, in the archive\'s own order, with no patches and no sessions',
        samples.length === 5
        && samples.map((w) => w.name).join(' ') === 'Kick.wav Snare.wav Room.wav Surround.wav Cymbal.wav'
        && samples[0].row.seconds === 0.1 && samples[1].row.seconds === 0.5
        && cells[0] === 'Kick.wav' && cells[1] === '0.10 s' && cells[4] === '0.60'
        && patches.length === 0 && sessions.length === 0
        && tabs.buttons[2].textContent === '5 Samples'
        && tabs.enabled('samples') === true
        && tabs.enabled('patches') === false && tabs.enabled('sessions') === false
        && tabs.at() === 'samples'
        && drop.note.textContent === 'a bag of drum hits.zip'
        && fetched === beforeBag,
        `${samples.length} row(s) reading ${JSON.stringify(samples.map((w) => w.name))}, `
        + `the first one ${JSON.stringify(cells)}, tab "${tabs.buttons[2].textContent}", `
        + `open tab ${tabs.at()}, footer "${drop.note.textContent}", `
        + `${fetched - beforeBag} request(s)`);

      d.assert('NEGATIVE CONTROL: a Mac resource fork is a wav by its name and is never a row',
        inBag.length === 7
        && inBag.some((e) => e.name === '__MACOSX/._Kick.wav')
        && !samples.some((w) => w.name.startsWith('._'))
        && !samples.some((w) => w.name === 'readme.txt'),
        `the zip holds ${inBag.length} entries, `
        + `${inBag.filter((e) => /\.wav$/i.test(e.name)).length} of them named .wav, `
        + `and the table shows ${samples.length}`);

      d.assert('NEGATIVE CONTROL: a wav the decoder refuses keeps its row, says why and is counted as refused',
        samples[4].row.ok === false
        && /rather than "RIFF"/.test(samples[4].row.why || '')
        && /4 of 5 samples read, 1 refused/.test(bagSaid),
        `the last row says "${samples[4]?.row.why}", and the log says `
        + `"${bagSaid.split('\n').filter((l) => /samples read/.test(l)).pop()}"`);

      /**
       * A 24 bit stereo file measures, draws and plays. `peak` is the mixdown's (`MIX` is
       * the mean), so a hard panned file reads below its loudest channel; over 150 real
       * stereo files the ratio runs 0.46642 to 1, median 0.99996.
       * See lessons/page-pack.md#pack-133
       */
      {
        const rowsNow = [...sampleTable.scroller().querySelectorAll('.pos-tbl-row')];
        const room = rowsNow[2];
        const roomCells = [...room.querySelectorAll('.pos-tbl-c')].map((c) => c.textContent);
        /* A press on the row sounds a sample, graded by the counter only `playSample`
           increments and by what the panel shows.
           See lessons/page-pack.md#pack-134 */
        const beforeRoom = played;
        openSample(2, true);
        const roomPlayed = played - beforeRoom;
        const roomPic = onScreen(waveRow);
        const roomSaid = onScreen(whyRow) ? whyEl.textContent : '';
        stopSample();
        openSample(0, false);
        d.assert('a 24 bit stereo wav reads, measures, draws and plays like any other row',

<style>
  /* Unlinked nodes as the patchbay draws a box, four to a row, grouped by where they run. */
  .cn-site + .cn-site { margin-top: 32px; }
  .cn-site h3 { margin: 0 0 12px; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .cn-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; gap: 12px; }
  @media (max-width: 900px) { .cn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cn-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--card2); border: 1px solid var(--line2); border-radius: var(--r, 4px); min-width: 0; }
  .cn-head { display: flex; flex-direction: column; gap: 2px; }
  .cn-id { font: 600 13px/1.3 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
  .cn-label { font: 400 11.5px/1.3 var(--sans); color: var(--dim); }
  /* 11.5px so the widest pair a node has, value-in-2 beside midi-out-2, sits
     on one line in a quarter of the column; past that it wraps, never breaks. */
  .cn-ports { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 6px; font: 400 11.5px/1.5 var(--mono); }
  .cn-ports > div { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .cn-ports > div:last-child { align-items: flex-end; }
  /* The pages that build this node, so nothing in the grid is imaginary. */

  /* A port is a link button in its medium's colour; the picked one is lit. */
  button.pos-linkbtn.cn-port { font-family: var(--mono); color: var(--c); text-decoration: none; white-space: nowrap; }
  button.pos-linkbtn.cn-port[aria-pressed="true"] { background: var(--c); color: var(--bg); text-decoration: none; }
  .lv-pname.cn-pick { cursor: pointer; }
  .lv-pname.cn-pick[aria-pressed="true"] { font-weight: 600; }
  .cn-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }

  /* The wish bar and its pills are wish-bar.mjs's (.pos-wish*, .pos-pills in shell.css); these are this page's pill states. */
  /* The picture's room is held from the first frame, 4/5 as tall as wide, so linking moves
     nothing above or below it; a taller patch grows it. */
  .cn-pic { aspect-ratio: 5 / 4; }
  .cn-pic.cn-pic-empty { display: grid; place-items: center; }
  .cn-pic.cn-pic-empty > :not(.cn-empty) { display: none; }
  .cn-pic:not(.cn-pic-empty) > .cn-empty { display: none; }
  /* A refused request over a standing patch says why under the drawing; the patch stays. */
  .cn-pic[data-why]:not(.cn-pic-empty) > .cn-empty { display: block; margin: 0 auto 12px; color: var(--dim); }
  .cn-empty { margin: 0; max-width: 46ch; padding: 0 16px; text-align: center; text-wrap: balance; overflow-wrap: anywhere; font: 400 13px/1.4 var(--sans); color: var(--dim2); }
  .pos-pills > button.pos-pill[aria-pressed="true"] { border-color: var(--wish); }
  /* An example whose patch does not run yet is dimmed, never disabled: it still
     builds its picture, and its title says what is missing. */
  .pos-pills > button.pos-pill[data-runs="marked"] { opacity: .5; }
  .pos-pills > button.pos-pill[data-runs="marked"]:hover, .pos-pills > button.pos-pill[data-runs="marked"]:focus-visible { opacity: 1; }

  /* The faces of the linked nodes, in a concept page's order: pictures, panels, the
     knob row, the keys. Empty paints nothing. */
  .cn-faces { display: flex; flex-direction: column; gap: 24px; }
  .cn-faces[hidden] { display: none; }
  .cn-face { min-width: 0; }
  /* A node's own panel (Plaits' knobs, the drum grid, the Pi's Join): one column. */
  .cn-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .cn-face-say { margin: 0; font: 400 12px/1.4 var(--sans); color: var(--dim); }
  .cn-pi-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ctl-gap); }
  .cn-pi-row button { text-transform: none; }
  /* Record in red, the one control that starts writing (concept.css's .cc-rec, which this page does not load). */
  .cn-panel .cc-rec { color: var(--rec, #e5484d); }
  /* The OLED as /synth/dots/ draws it: dark ink, the 128x64 canvas whole-number scaled in the middle. */
  .cn-oled { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; background: #05070c; border-radius: var(--r, 4px); }
  .cn-oled canvas { display: block; image-rendering: pixelated; }
  /* The typist's sheet takes the height of its box. */
  .cn-paper { height: 240px; border-radius: var(--r, 4px); overflow: hidden; }

  /* The listen control sits in the raspberry pi group, under its heading. */
  .cn-live { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .cn-live-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--ctl-gap); }
  .cn-live-row > .pos-field { flex: 0 1 220px; }
  /* Listen and Stop in one case, as the proposal buttons above. */
  .cn-live-row button { text-transform: none; }
  .cn-live-st { margin: 0; font: 400 12px/1.4 var(--sans); color: var(--dim); }
  .cn-site h3 .cn-site-st { margin-left: 10px; letter-spacing: normal; text-transform: none; font-weight: 400; color: var(--dim); }
  .cn-site h3 .cn-site-st:empty { display: none; }
  /* The kit's presence dot: green when its site answered inside STALE_MS, an empty ring once quiet. */
  .cn-dot { display: inline-block; vertical-align: middle; color: var(--ok); margin-left: 6px; }
  .cn-dot.cn-ring { color: var(--dim2); }
  .cn-dot.cn-ring::after { display: none; }
  .cn-port.cn-inert { color: var(--c); white-space: nowrap; }
  /* Which parameter a new knob turns: asked under the picture, on the press that needs it. */
  .cn-choose { display: flex; flex-direction: column; gap: 8px; }
  .cn-choose[hidden] { display: none; }
  .cn-choose-q { margin: 0; font: 400 13px/1.4 var(--sans); color: var(--fg); }
  .cn-choose button { text-transform: none; }
  .cn-livemark { fill: var(--ok); }
</style>
<script type="module">
  import { mount, el, createShipper } from '/shell/shell.mjs';
  import { createWishBar } from '/shell/wish-bar.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, checkTransforms, printLink, parseLink, patchOf } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { NODES as CATALOGUE, addNodes } from '/shell/nodes.mjs';
  import { boardGraph, BOARD_SITE } from '/shell/graph-registry.mjs';
  import { CONCEPTS } from '/shell/concept-list.mjs';
  import { PATCH_NAMES, withPatches } from '/shell/patch-names.mjs';
  import { createRuntimes, EXTRA_PORTS, knobChoices, knobFor, loaderOf, FACED } from '/shell/node-runtime.mjs';
  import { sharedAudio, claim, release, contexts } from '/shell/audio.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { knobRaw } from '/shell/synth-params.mjs';
  import { createBayNode, roomFor, ROOM_RE, STUDIO_ROOM } from '/shell/bay-node.mjs';
  import { createRegistry, STALE_MS } from '/shell/graph-registry.mjs';
  import { RELAY_BASE, DEFAULT_RELAY, openWire } from '/shell/wire.mjs';
  import { pageGraph } from '/shell/announce.mjs';
  import { createField } from '/shell/field.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { withParams, checkSettings } from '/shell/settings.mjs';

  // Every socket this page opens, counted from its first line, so "a visit opens
  // nothing" is an assert over a counter rather than a reading of the file.
  const OPENED = [], MIDI_ASKED = [], CAMERA_ASKED = [];
  if (SELFCHECK) {
    const Native = window.WebSocket;
    window.WebSocket = class extends Native { constructor(u, p) { super(u, p); OPENED.push(String(u)); } };
    // The MIDI prompt, counted the same way: only a person's press on the midi box asks.
    const ask = navigator.requestMIDIAccess?.bind(navigator);
    if (ask) navigator.requestMIDIAccess = (o) => { MIDI_ASKED.push(o); return ask(o); };
    const gum = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);
    if (gum) navigator.mediaDevices.getUserMedia = (o) => { CAMERA_ASKED.push(o); return gum(o); };
  }

  // Every node the site's pages build, once per type, read from three sources:
  // nodes.mjs NODES (concept pages), boardGraph() for the Pi nodes a page plays
  // (PI_PAGES says which), and the catalogue's endpoint hops between sites.
  // See lessons/page-connect.md#connect-1
  const PI = boardGraph({ room: 'studio-1', instruments: { synth: true, pappusFx: true, sampler: true, collide: true }, jack: true, gpu: true, patches: PATCH_NAMES,
    camera: true, inputs: [{ name: 'circuit', channels: 2, jack: true, midi: { port: 'Circuit', channels: [1, 2, 10] } }] });
  const PI_PAGES = { circuit: ['remote/circuit'], sampler: ['remote/piano'], collide: ['remote/collide'], drums: ['drums/remote'],
    shader: ['shader/remote'], camera: ['remote/circuit'] };
  const HOPS = Object.keys(CATALOGUE).filter((n) => CATALOGUE[n].kind === 'endpoint');
  // A box is `<site>:<name>`, except where the name is not what the pages draw:
  // the hops, and the two knobs renamed so they cannot read as a knob instance.
  const AS = { shout: 'relay', 'stream-live': 'live', 'stream-hls': 'hls', 'moq-relay': 'relay',
    'volume-knob': 'knob-volume', 'mix-knob': 'knob-mix' };
  // A type whose catalogue label is a pattern (`<drum>, SuperCollider`) is
  // named for what it is; the instances are in the box's hover.
  const LABELS = { synth: 'synth', knob: 'knob', drum: 'drum voice', recording: 'radio recording', station: 'live station', shout: 'radio relay' };
  // A value-in whose names the catalogue leaves to the page, as the pages give
  // them, so the knob box asks which one. The collide runtime's own list is
  // held to this by the self-check.
  const PARAM_NAMES = { collide: ['bright', 'decay'] };
  // A station's site is its broadcaster's, so the one box is on ERR's.
  const siteOf = (name, e) => (name === 'station' ? 'err' : e.site ?? 'web');
  // room/words is built and served and kept off the index (concept-list.mjs).
  const OFF_INDEX = ['room/words'];

  const nodeOf = (portId) => portId.split(':').slice(0, 2).join(':');
  const PAGES = new Map(), INSTANCE = new Map(), TYPE = new Map();
  // A knob made per parameter (`web:knob-cutoff`) is a knob; every other node is the type it was built as.
  const typeOf = (id) => TYPE.get(id) ?? (/^web:knob-/.test(id) ? 'knob' : null);
  const isInstance = (id) => !TYPE.has(id) && typeOf(id) === 'knob';
  // A numbered synth or scope is drawn in the grid only while it is the free one of its type.
  const hiddenSpare = (id) => MULTI.includes(TYPE.get(id)) && !linkedNodes().has(id) && firstFree(TYPE.get(id)) !== id;

  function makeBay() {
    const b = createBay();
    const failed = [];
    const type = (name) => {
      const e = CATALOGUE[name], site = siteOf(name, e), label = LABELS[name] ?? e.label, as = AS[name] ?? name;
      // Every port, the optional ones too: some page builds each of them.
      // A port has no label in the catalogue, and a refusal reads it.
      // An instrument's midi-in carries its patch names, in its label too, so the model reads them.
      const named = (p) => (p === 'midi-in' && PATCH_NAMES[name] ? { patches: PATCH_NAMES[name] } : {});
      // A value-in carries the settings its runtime takes (settings.mjs), so the model reads them too.
      const ports = Object.fromEntries(Object.keys(e.ports).map((p) => [`${as}:${p}`, { label: p === 'value-in' ? withParams(`${label} ${p}`, name) : withPatches(`${label} ${p}`, named(p).patches),
        ...named(p), ...(p === 'value-in' && PARAM_NAMES[name] ? { shape: { of: 'param', names: PARAM_NAMES[name] } } : {}) }]));
      try {
        addNodes(b, site, [{ name, as, site, label }], { ports });
        for (const [p, f] of Object.entries(EXTRA_PORTS[name] || {})) b.addPort({ id: `${site}:${as}:${p}`, ...f, label: `${label} ${p}` });
        TYPE.set(`${site}:${as}`, name);
        PAGES.set(`${site}:${as}`, e.pages);
        if (e.instance) INSTANCE.set(`${site}:${as}`, e.instance);
      } catch (x) { failed.push(`${name}: ${x.message}`); }
    };
    for (const name of Object.keys(CATALOGUE)) if (!HOPS.includes(name)) type(name);
    for (const n of PI.nodes) {
      const pages = PI_PAGES[n.id.split(':')[1]];
      if (!pages) continue;
      try {
        b.addNode(n);
        for (const p of PI.ports.filter((q) => nodeOf(q.id) === n.id)) b.addPort({ ...p, label: withPatches(`${n.label} ${p.id.split(':')[2]}`, p.patches) });
        PAGES.set(n.id, pages);
      } catch (x) { failed.push(`${n.id}: ${x.message}`); }
    }
    for (const name of HOPS) type(name);
    return { bay: b, failed };
  }
  const { bay, failed } = makeBay();

  // ── a second of a kind (decision D6) ─────────────────────────────────────
  // A synth, a scope or a screen may be used twice: once every one of them is linked,
  // the grid offers the next as `synth-2`, `scope-3`, with a runtime and a face of its own.
  const MULTI = ['synth', 'scope', 'screen', 'sampler'];
  const instancesOf = (type) => bay.nodes().filter((n) => TYPE.get(n.id) === type).map((n) => n.id);
  // The bay cannot drop a node, so an instance unlinked again stays in it and the grid shows the first free one.
  const firstFree = (type) => { const s = linkedNodes(); return instancesOf(type).find((id) => !s.has(id)) ?? null; };
  function addInstance(type, on = bay) {
    const e = CATALOGUE[type], label = LABELS[type] ?? e.label;
    let k = 2;
    while (on.node(`web:${type}-${k}`)) k++;
    const as = `${type}-${k}`;
    addNodes(on, 'web', [{ name: type, as, label }], { ports: Object.fromEntries(Object.keys(e.ports).map((p) => [`${as}:${p}`,
      p === 'midi-in' && PATCH_NAMES[type] ? { label: withPatches(`${label} ${k} ${p}`, PATCH_NAMES[type]), patches: PATCH_NAMES[type] }
        : { label: p === 'value-in' ? withParams(`${label} ${k} ${p}`, type) : `${label} ${k} ${p}` }])) });
    if (on !== bay) return `web:${as}`;
    TYPE.set(`web:${as}`, type);
    PAGES.set(`web:${as}`, e.pages);
    INSTANCE.set(`web:${as}`, `instance ${k} of ${type}, with its own runtime and face`);
    return `web:${as}`;
  }
  /** Every numbered instance an answer names (web:sampler-2) is made first, on `on`. */
  function ensureNamed(links, on = bay) {
    for (const id of links.flatMap((l) => [l.from, l.to])) {
      const m = /^web:([a-z]+)-(\d+):/.exec(id);
      if (!m || !MULTI.includes(m[1])) continue;
      let guard = 0;
      while (!on.node(`web:${m[1]}-${m[2]}`) && guard++ < 8) addInstance(m[1], on);
    }
  }
  function spares() { for (const t of MULTI) if (!firstFree(t)) addInstance(t); }
  const PI_KEPT = PI.nodes.filter((n) => PI_PAGES[n.id.split(':')[1]]).length;
  const EXPECTED = Object.keys(CATALOGUE).length + PI_KEPT;

  // A link to somebody else's server or a Stream input rides the one
  // transport its port names, as the pages that make it say (`via`).
  function viaFor(from, to) {
    const a = bay.port(from)?.transports || [], b = bay.port(to)?.transports || [];
    return a.find((t) => b.includes(t)) ?? (a.length === 1 ? a[0] : b.length === 1 ? b[0] : undefined);
  }

  // Example requests: the links a right answer contains and the concept page that
  // already makes them. The self-check proves each can be made in this bay.
  // See lessons/page-connect.md#connect-2
  const W = (n, p) => `web:${n}:${p}`;
  const KEYS = W('keys', 'midi-out'), SPK = W('speaker', 'audio-in'), REC = 'cf-r2:recording:file-out';
  const KNOB = W('knob', 'value-out'), CAM = W('camera', 'video-out'), SCREEN = W('screen', 'video-in');
  const CIRCUIT = `${BOARD_SITE}:circuit`, PIANO = `${BOARD_SITE}:sampler`;
  const DRUMS = `${BOARD_SITE}:drums`, PI_SHADER = `${BOARD_SITE}:shader`;
  // Examples are patches no page makes: parts of two pages meeting, this tab and the Pi
  // in one patch, or one out port into two. plans/plan-connect-use-cases.md section 3.
  const EXAMPLES = [
    ['the drum machine plays plaits', [[W('sequencer', 'midi-out'), W('plaits', 'midi-in')], [W('plaits', 'audio-out'), SPK]]],
    ['granulate plaits as i play', [[KEYS, W('plaits', 'midi-in')], [W('plaits', 'audio-out'), W('grains', 'audio-in')], [W('grains', 'audio-out'), SPK]]],
    ['granulate the piano as i play it', [[KEYS, W('sampler', 'midi-in')], ['cf-r2:piano-samples:file-out', W('sampler', 'file-in')], [W('sampler', 'audio-out'), W('grains', 'audio-in')], [W('grains', 'audio-out'), SPK]]],
    ['bass synth on my left hand, plaits on my right', [[KEYS, W('synth', 'midi-in'), [{ op: 'range', lo: 0, hi: 59 }]], [KEYS, W('plaits', 'midi-in'), [{ op: 'range', lo: 60, hi: 127 }]], [W('synth', 'audio-out'), SPK], [W('plaits', 'audio-out'), SPK]]],
    ['plaits doubles the synth an octave up', [[KEYS, W('synth', 'midi-in')], [KEYS, W('plaits', 'midi-in'), [{ op: 'transpose', by: 12 }]], [W('synth', 'audio-out'), SPK], [W('plaits', 'audio-out'), SPK]]],
    ['the drum machine plays the piano', [[W('sequencer', 'midi-out'), W('sampler', 'midi-in')], ['cf-r2:piano-samples:file-out', W('sampler', 'file-in')], [W('sampler', 'audio-out'), SPK]]],
    ['granulate the drum machine', [[W('sequencer', 'midi-out'), W('drum', 'midi-in')], [W('drum', 'audio-out'), W('grains', 'audio-in')], [W('grains', 'audio-out'), SPK]]],
    ['play the piano and watch its waveform', [[KEYS, W('sampler', 'midi-in')], ['cf-r2:piano-samples:file-out', W('sampler', 'file-in')], [W('sampler', 'audio-out'), SPK], [W('sampler', 'audio-out'), W('scope', 'audio-in')]]],
  ].map(([say, links]) => ({ say, links: links.map(([from, to, x]) => ({ from, to, transforms: Array.isArray(x) ? x : [], ...(typeof x === 'string' ? { param: x } : {}) })) }));
  // The patches the concept pages make, one per page: never shown, built only by the
  // self-check to grade each runtime, and the record an example must not copy.
  const RIGS = [
    ['let the keys play the synth', 'synth/keyboard', [[KEYS, W('synth', 'midi-in')], [W('synth', 'audio-out'), SPK]]],
    ['play plaits from my midi keyboard', 'code/plaits', [[W('midi', 'midi-out'), W('plaits', 'midi-in')], [W('plaits', 'audio-out'), SPK]]],
    ['play the circuit in the studio', 'remote/circuit', [[KEYS, `${CIRCUIT}:midi-in`], [`${CIRCUIT}:audio-out`, SPK]]],
    ['change the circuit\'s patch', 'remote/circuit', [[W('patch', 'midi-out'), `${CIRCUIT}:midi-in`]]],
    ['play the piano on the pi', 'remote/piano', [[KEYS, `${PIANO}:midi-in`], [`${PIANO}:audio-out`, SPK]]],
    ['a knob opens supercollider\'s filter', 'code/collide', [[KNOB, W('collide', 'value-in'), 'bright']]],
    ['a knob bends the mirror shader', 'shader/mirror', [[KNOB, W('shader', 'value-in')], [W('shader', 'video-out'), SCREEN]]],
    ['show me plaits\' waveform', 'code/plaits', [[W('plaits', 'audio-out'), W('scope', 'audio-in')]]],
    ['grain a radio recording', 'granulator/grains', [[REC, W('player', 'file-in')], [W('player', 'audio-out'), W('grains', 'audio-in')], [W('grains', 'audio-out'), SPK]]],
    ['grains in time with the recording', 'granulator/beat', [[REC, W('player', 'file-in')], [W('player', 'audio-out'), W('grains', 'audio-in')],
      [W('player', 'audio-out'), W('tempo', 'audio-in')], [W('tempo', 'value-out'), W('grains', 'tempo-in')], [W('grains', 'audio-out'), SPK]]],
    ['what key is the live radio in?', 'radio/key', [['err:station:audio-out', 'cf-shout:relay:audio-in'], ['cf-shout:relay:audio-out', W('level', 'audio-in')],
      [W('level', 'audio-out'), W('key', 'audio-in')]]],
    ['the dial tunes the radio', 'radio/tuner', [[W('dial', 'value-out'), W('tuner', 'value-in')], [W('tuner', 'audio-out'), SPK]]],
    ['camera through the dither shader', 'video/shader', [[CAM, W('shader-dither', 'video-in')], [W('shader-dither', 'video-out'), SCREEN]]],
    ['send the camera through stream and back', 'video/webrtc', [[CAM, 'cf-stream:live:video-in'], ['cf-stream:live:video-out', SCREEN]]],
    ['the drum machine plays its drums', 'drums/machine', [[W('sequencer', 'midi-out'), W('drum', 'midi-in')], [W('drum', 'audio-out'), SPK]]],
    ['the camera plays the drums', 'drums/camera', [[CAM, W('pixelate', 'video-in')], [W('pixelate', 'value-out'), W('sequencer', 'value-in')],
      [W('sequencer', 'midi-out'), W('drum', 'midi-in')], [W('drum', 'audio-out'), SPK]]],
    ['loop what i play into the piano', 'code/piano', [[KEYS, W('looper', 'midi-in')], [W('looper', 'midi-out'), W('sampler', 'midi-in')],
      ['cf-r2:piano-samples:file-out', W('sampler', 'file-in')], [W('sampler', 'audio-out'), SPK]]],
    ['record what i play and play it back', 'synth/recorder', [[KEYS, W('rec', 'midi-in')], [W('rec', 'midi-out'), W('synth', 'midi-in')], [W('synth', 'audio-out'), SPK]]],
    ['typing plays the typewriter', 'typist/typewriter', [[W('typing', 'value-out'), W('typewriter', 'value-in')],
      ['cf-r2:typewriter-samples:file-out', W('typewriter', 'file-in')], [W('typewriter', 'audio-out'), SPK]]],
    ['the keys light up the pico', 'synth/dots', [[KEYS, W('pico', 'midi-in')], [W('pico', 'video-out'), W('oled', 'video-in')]]],
  // A third field on a link is the parameter a knob into a value-in turns, so
  // an example makes that one knob instance rather than asking.
  ].map(([say, page, links]) => ({ say, page, links: links.map(([from, to, param]) => ({ from, to, transforms: [], ...(param ? { param } : {}) })) }));
  const rigOf = (say) => EXAMPLES.find((e) => e.say === say) || RIGS.find((e) => e.say === say);

  const d = mount({ name: 'connect',
    // A note from Feedback carries the last request, how it came in, what it built, and the patch now.
    feedback: {
      context: () => `last: ${lastLine || 'nothing asked yet'}\npatch now: ${bay.links().map(printLink).join('; ') || 'nothing linked'}`,
      onSent: (note) => logAsk(`[feedback] "${note}"`),
    },
    what: 'Say what should play what, press an example, or press an out port and then an in port. Pressing a wire takes it away.',
    readout: null, index: '/', indexLabel: 'positron' });

  // confirms. Each call spends paid Workers AI: only on a press, never in a self-check.
  // See lessons/page-connect.md#connect-3
  const API = new URLSearchParams(location.search).get('api') || 'https://wish.positron.studio';
  const HERE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const FACTS = 'Ports carry midi, audio, value, clock, video, program or file, and a link joins an out port to an in port '
    + 'of the same medium. Sound is only heard once an audio out reaches web:speaker:audio-in, so a request to '
    + 'play something includes that link. Transforms work on MIDI links only; every other link has none. '
    + 'Ids starting web: are in this browser tab, pi-1: is a Raspberry Pi in the studio, cf- ids are Cloudflare, '
    + 'cf-r2:recording is a radio programme we recorded, and err:station is a live station on its broadcaster\'s server, '
    + 'which reaches this tab through cf-shout:relay. Use web: nodes; use pi-1: only when the sentence names the Pi, '
    + 'the studio, the Circuit or remote. '
    + 'An instrument whose midi in lists patches plays one of them, chosen by a patch transform on the MIDI link into it; '
    + 'two patches at once need two instruments of that kind, the second one\'s id ending in -2.';
  /** A sentence that names somewhere else may reach it; any other stays in this tab. */
  const NAMES_PI = /\b(pi|raspberry|studio|circuit|remote|board|there)\b/i;

  // missing its argument so the checkTransforms path is graded too.
  const CANNED = [
    { from: KEYS, to: 'web:plaits:midi-in', transforms: [] },
    { from: KEYS, to: 'web:plaits:midi-in', transforms: [{ op: 'transpose' }] },

  // examples name, then the other ports of those nodes. The rest stay pressable.
  // See lessons/page-connect.md#connect-4
  const MAX_PORTS = 64;

  // Only the parts a sentence is about reach the model: with 64 ports it answered nothing in 11 s

  const ASK_PORTS = 40;

  // or granulate sentence right (research/stt-and-patch-models-2026-10-15.md).
  const ESSENTIAL = new Set(['web:keys', 'web:midi', 'web:speaker', 'cf-r2:piano-samples', 'cf-r2:rhodes-samples',
    'web:synth', 'web:sampler', 'web:plaits', 'web:sequencer', 'web:grains']);
  const STOP = new Set(['the', 'a', 'an', 'and', 'on', 'of', 'to', 'my', 'with', 'in', 'at', 'play', 'plays', 'playing', 'left', 'right', 'hand', 'it', 'is', 'from', 'into', 'i']);

  const stem = (w) => w.replace(/s$/, '');
  // What people call a type (nodes.mjs `also`): "drum machine" is the sequencer, "plates" is Plaits.
  const alsoOf = (id) => CATALOGUE[typeOf(id) ?? id.split(':')[1]]?.also ?? [];

    const said = new Set(wordsOf(text).map(stem));
    if (!said.size) return new Set();

      const ws = wordsOf(`${id.replace(/[-:]/g, ' ')} ${bay.node(id)?.label || ''} ${bay.ports().filter((p) => nodeOf(p.id) === id).map((p) => (p.patches || []).join(' ')).join(' ')}`);

    if (!PRESS_ONLY[n] && !loaderOf(n, typeOf)) return 9;
    if (p.id.startsWith(`${BOARD_SITE}:`) && !NAMES_PI.test(text) && !hit.has(n)) return 9;

    return [{ id: `web:${m[1]}-2:midi-in`, dir: 'in', label: withPatches(`${LABELS[m[1]] ?? CATALOGUE[m[1]].label} 2 midi-in`, PATCH_NAMES[m[1]]),

  const portsForModel = (text = '', keep = []) => { const hit = new Set([...named(text), ...keep]); return bay.ports()
    .map((p, i) => ({ p, i, r: rankOf(p, text, hit) })).filter((x) => x.r < 9)
    .sort((a, b) => a.r - b.r || a.i - b.i)
    .flatMap(({ p }) => [{ id: p.id, dir: p.dir, label: p.label, ...(alsoOf(nodeOf(p.id)).length ? { also: alsoOf(nodeOf(p.id)) } : {}) }, ...secondOf(p)])

      if (text === 'make it darker') return canned(extra.current || [], { 'web:synth': { cutoff: 400 } });

      if (text === 'more wobble') return canned(extra.current || [], { 'web:synth': { wobble: 2 } });

      if (text === 'keys play a sawtooth') return { links: [{ from: KEYS, to: W('synth', 'midi-in'), transforms: [{ op: 'patch', name: 'sawtooth' }] }], fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
      if (text === 'keys play the sampler, nothing else') return { links: [{ from: KEYS, to: W('sampler', 'midi-in'), transforms: [] }], fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
      if (text === 'keys play the rhodes') return { links: [{ from: KEYS, to: W('sampler', 'midi-in'), transforms: [{ op: 'patch', name: 'Rhodes' }] }], fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
      if (text === 'keys play the harpsichord') return { links: [{ from: KEYS, to: W('sampler', 'midi-in'), transforms: [{ op: 'patch', name: 'Harpsichord' }] }], fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
      if (text === 'keys play the synth, nothing else') return { links: [{ from: KEYS, to: W('synth', 'midi-in'), transforms: [] }], fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
      return { links: ex ? ex.links : CANNED, fixed: [], ms: 0, model: 'canned', usage: { total_tokens: 0 } };
    }
    reached++;
    let r;
    // A model that never answers would hold the ask field busy for ever (measured once, minutes): 60 s, then it says so.
    const quit = new AbortController(), timer = setTimeout(() => quit.abort(), ASK_MS);
    try {
      r = await fetch(`${API}/wish`, { method: 'POST', headers: { 'content-type': 'application/json' }, signal: quit.signal,
        body: JSON.stringify({ text, ports: portsForModel(text, extra.keep), facts: FACTS, ...(extra.current ? { history: extra.history, current: extra.current, currentSettings: extra.currentSettings } : {}) }) });
    } catch {
      throw new Error(quit.signal.aborted ? `nothing answered in ${ASK_MS / 1000} s at ${API}` : `nothing answered at ${API}`);
    } finally { clearTimeout(timer); }

    if (!r.ok) throw new Error(`the agent said: ${out.error || `HTTP ${r.status}`}`);

  }

  // An example press is the request. A node with no runtime marks its pill, and a
  // node that opens a paid service or somebody else's server is a person's press only.
  // See lessons/page-connect.md#connect-5
  const PRESS_ONLY = {
    'cf-stream:live': 'Stream is billed by the minute',
    'err:station': 'a live station is somebody else\'s server',
  };
  function runsOf(ex) {
    const nodes = [...new Set(ex.links.flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]))];
    return { nodes, missing: nodes.filter((n) => !PRESS_ONLY[n] && !loaderOf(n, typeOf)), press: nodes.filter((n) => PRESS_ONLY[n]) };
  }
  // The wish bar (wish-bar.mjs): the field, its microphone and talk keys, the example pills on one
  // scrolling line, and start new, always the last pill, which forgets the conversation and the patch.
  const bar = createWishBar({ placeholder: 'say which part should play which', api: API, selfcheck: SELFCHECK,
    log: (m, lv) => d.log(m, lv), ship: (line) => logAsk(line), vocabulary: () => vocabulary(),
    onAsk: (text, { how, by }) => ask(text, by, how),
    pills: EXAMPLES.map((ex) => ({ say: ex.say, onPress: (b, e) => {
      b.dataset.busy = '1'; startFresh(); build(ex, e.isTrusted);
      logAsk(`[pill] built "${ex.say}": ${bay.links().length} of ${ex.links.length} link(s)`);
      runtime.idle().finally(() => delete b.dataset.busy);
    } })),
    reset: { say: 'start new', title: 'forget the earlier sentences and clear the patch',
      onPress: () => { via = 'typed'; newPatch('pressed start new'); logAsk('[new] pressed start new, history cleared'); } } });
  const exRow = bar.row, startPill = bar.reset;
  /** start new is shown once there is a patch or a conversation to clear. */
  const showStart = () => bar.showReset(bay.links().length || turns.length);
  for (const [i, ex] of EXAMPLES.entries()) {
    const r = runsOf(ex), b = bar.pills[i];
    const lines = [`builds ${r.nodes.join(', ')}`];
    if (r.press.length) lines.push(`runs on a person's press only: ${r.press.map((n) => PRESS_ONLY[n]).join(', ')}`);
    if (r.missing.length) lines.push(`drawn, not running yet: ${r.missing.join(', ')}`);
    b.title = lines.join('\n');
    b.dataset.runs = r.press.length ? 'press' : r.missing.length ? 'marked' : 'runs';
    if (r.missing.length) b.dataset.missing = r.missing.join(' ');
  }

  // A person's own requests go to the device log (pub.positron.studio/logs), never a check's.
  const ship = SELFCHECK ? () => {} : createShipper();
  let lastLine = '';
  const logAsk = (line) => { if (!line.startsWith('[feedback]') && !line.startsWith('[page')) lastLine = line; ship(`connect ${line}`); };
  if (!SELFCHECK) { const say = d.log.bind(d); d.log = (m, lv) => { say(m, lv); if (lv === 'warn' || lv === 'bad') logAsk(`[page ${lv}] ${m}`); }; }
  let asking = Promise.resolve(), inFlight = false;
  /** A sentence asks the model; its answer replaces the patch, or nothing is built and the reason is said. */

  const RESET = /^\s*(start over|start again|start fresh|new patch|clear (?:the )?patch)\b[\s,.:;!]*/i;
  async function ask(text, by = null, how = 'typed') {
    text = String(text || '').trim();
    if (!text) { d.log('say something first, for example one of the sentences under the box'); return; }
    if (inFlight) return;
    const again = RESET.exec(text);
    if (again) {
      via = how;
      newPatch(`said "${again[1]}"`);
      logAsk(`[${via}] said "${text}" -> new patch, history cleared`);
      text = text.slice(again[0].length).trim();
      if (!text) return;
    }
    inFlight = true;
    via = how;
    const busy = by || bar.button.el;
    busy.dataset.busy = '1';

    const prev = bay.links().map((l) => ({ from: l.from, to: l.to, transforms: l.transforms || [] }));
    const n = turns.length;
    const tag = n ? `follow-up ${n}` : prev.length ? 'on a standing patch' : '';
    const extra = prev.length || n ? { history: turns, current: prev, currentSettings: settingsNow, keep: [...linkedNodes()] } : {};
    const run = (async () => {
      d.log(`asking${tag ? ` (${tag})` : ''}: ${text}`);
      try {
        const out = await post(text, extra);
        for (const f of out.fixed || []) d.log(`the model wrote "${f.said}" on ${f.op}, read as ${f.read}`);
        d.log(`the answer came back in ${out.ms ?? '?'} ms with ${out.links?.length ?? 0} link(s), ${out.usage?.total_tokens ?? '?'} tokens`);
        await buildAsked(text, out.links || [], out, { prev, tag });
      } catch (e) {
        d.log(e.message, 'warn');
        refuse(`nothing answered: ${e.message}`);
        logAsk(`[${via}]${tag ? ` ${tag}` : ''} asked "${text}" -> failed: ${e.message}`);
      } finally {
        inFlight = false;
        delete busy.dataset.busy;
      }
    })();
    asking = run;
    return run;
  }

  /** Every link on a fresh bay, in order, so two that clash are caught too. */
  function tryLinks(links) {
    const s2 = makeBay().bay, why = [];
    ensureNamed(links, s2);
    for (const l of links) {
      const bad = checkTransforms(l.transforms || []);
      if (bad) { why.push(`${printLink(l)}: ${bad.why}`); continue; }
      const via = viaFor(l.from, l.to);
      const r = s2.link(l.from, l.to, l.transforms || [], { consent: true, ...(via ? { via } : {}) });
      if (!r.ok) why.push(`${printLink(l)}: ${r.why}`);
    }
    return { bay: s2, why };
  }
  /** A sound that goes nowhere is heard: every audio out the patch leaves dangling goes to the speakers. */
  function withSpeakers(links) {
    const used = new Set(links.map((l) => l.from));
    const nodes = new Set(links.flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]));
    const add = [];
    for (const p of bay.ports()) {
      if (p.dir !== 'out' || p.medium !== 'audio' || !nodes.has(nodeOf(p.id)) || used.has(p.id)) continue;
      add.push({ from: p.id, to: SPK, transforms: [] });

  const USUAL_FILES = { sampler: 'cf-r2:piano-samples:file-out', typewriter: 'cf-r2:typewriter-samples:file-out', player: 'cf-r2:recording:file-out' };
  function withSources(links) {

      const src = USUAL_FILES[typeOf(n)], to = `${n}:file-in`;

  /** An answer's settings checked against the nodes its patch links: `{ set, why }`, set by node. */
  function settingsWhy(settings, links) {

  async function applySettings() {
    await runtime.idle();
    for (const [node, set] of Object.entries(settingsNow)) {
      const port = bay.port(`${node}:value-in`);
      for (const [name, v] of Object.entries(set)) {
        if (port?.deliver) { port.deliver({ of: 'param', name, v }); d.log(`set ${node} ${name} ${v}`); }

    const piBefore = new Set(prev.flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]).filter((n) => n.startsWith(`${BOARD_SITE}:`)));
    const away = full.flatMap((l) => [l.from, l.to]).filter((p) => p.startsWith(`${BOARD_SITE}:`) && !piBefore.has(nodeOf(p)));
    if (away.length && !NAMES_PI.test(text)) {

      refuse(msg);

      d.log(`could not be made: ${why.join('; ')}`, 'warn');
      logAsk(`${who} asked "${text}" -> NOT BUILT in ${out.ms ?? '?'} ms by ${out.model ?? '?'}: ${full.map(printLink).join('; ')}`

    await applySettings();
    logAsk(`${who} asked "${text}" -> BUILT ${full.length} link(s)${added ? `, ${added} to the speakers added` : ''} in ${out.ms ?? '?'} ms by ${out.model ?? '?'}: ${full.map(printLink).join('; ')}`
      + `${prev.length ? `; dropped ${dropped.length} of ${prev.length} earlier link(s) the sentence did not name${dropped.length ? ` (${dropped.map(printLink).join('; ')})` : ''}` : ''}`
      + `${Object.keys(st.set).length ? `; settings ${settingsText(st.set)}` : ''}`);

  /** Forget the conversation and the settings; the patch stays. */
  function startFresh() { turns = []; settingsNow = {}; }
  /** A new patch: no conversation and nothing linked. */
  function newPatch(why) {
    startFresh();
    unbuild(EMPTY);
    d.log(`a new patch (${why}): the next sentence starts from nothing`);
  }

  // ── linking, by press or by confirming a proposal ────────────────────────
  let last = { ok: true, why: '' };
  function connect(from, to, transforms = [], consent = false, param = null) {
    // The knob type into a value-in that names its parameters is ONE knob, for
    // the parameter a person picks; with one name, or an example's own, there is nothing to ask.
    const names = knobChoices(bay, from, to);
    if (names?.length === 1) return connect(...knobFor(bay, to, names[0]), transforms, consent);
    if (names && names.includes(param)) return connect(...knobFor(bay, to, param), transforms, consent);
    if (names) { askParam(to, names, transforms, consent); return false; }
    bay.seen(from); bay.seen(to);
    // A link out of somebody else's server needs a person's own press (bay.mjs, consent).
    const via = viaFor(from, to);
    const r = bay.link(from, to, transforms, { consent, ...(via ? { via } : {}) });
    last = r;
    if (r.ok) d.log(`linked ${printLink({ from, to, transforms })}${r.warn ? `. ${r.warn}` : ''}`);
    else d.log(`refused ${from} -> ${to}: ${r.why}${r.fix ? ` ${r.fix}` : ''}`, 'warn');
    redraw();
    return r.ok;
  }
  // An example press builds its patch straight away: the links are known, so no
  // model is asked. It replaces whatever was linked, because an example is a whole patch.
  function build(ex, person) {
    empty.textContent = EMPTY;
    delete pic.dataset.why;
    for (const l of [...bay.links()]) bay.unlink(l.id);
    let made = 0;
    for (const l of ex.links) made += connect(l.from, l.to, l.transforms || [], person, l.param) ? 1 : 0;
    for (const b of exRow.children) b.setAttribute('aria-pressed', String(b.textContent === ex.say));
    d.log(`built "${ex.say}", ${made} of ${ex.links.length} links`);
    redraw();
  }
  function removeLink(id) {
    const l = bay.links().find((x) => x.id === id);
    if (!l || !bay.unlink(id)) return;
    d.log(`removed ${printLink(l)}`);
    redraw();
  }

  // Which parameter a new knob turns: one button per name, and Cancel.
  const chooser = el('div', 'cn-choose');
  chooser.hidden = true;
  let asked = null;
  function askParam(to, names, transforms, consent) {
    asked = { to, names };
    const q = el('p', 'cn-choose-q', `which parameter of ${nodeOf(to)} should the knob turn?`);
    const group = createButtonGroup({ buttons: [
      ...names.map((n) => ({ id: n, label: n, onPress: () => { closeAsk(); connect(...knobFor(bay, to, n), transforms, consent); } })),
      { id: 'cancel', label: 'cancel', onPress: () => { closeAsk(); d.log('no knob made'); } },
    ] });
    chooser.replaceChildren(q, group.el);
    chooser.hidden = false;
    d.log(`${nodeOf(to)} takes ${names.join(', ')}: pick one for the knob`);
  }
  function closeAsk() { asked = null; chooser.replaceChildren(); chooser.hidden = true; }

  let armed = null;
  function pick(portId, e) {
    const p = bay.port(portId);
    if (!p) return;
    if (p.dir === 'out') {
      armed = armed === portId ? null : portId;
      if (armed) d.log(`${portId} picked, now press an in port`);
    } else if (!armed) {
      d.log(`${portId} is an in port, so press an out port first`);
    } else {
      const from = armed;
      armed = null;
      connect(from, portId, [], e?.isTrusted === true);
    }
    lightArmed();
  }
  function lightArmed() {
    for (const b of document.querySelectorAll('[data-port]')) b.setAttribute('aria-pressed', String(b.dataset.port === armed));
  }

  // ── drawing: linked nodes in the picture, the rest in the grid ───────────
  const linkedNodes = () => new Set(bay.links().flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]));
  const shown = {
    nodes: () => { const s = linkedNodes(); return bay.nodes().filter((n) => s.has(n.id)); },
    ports: () => { const s = linkedNodes(); return bay.ports().filter((p) => s.has(nodeOf(p.id))); },
    links: () => bay.links(),
  };
  // The patchbay draws a relayed link through a `cf-relay:<room>` box. A link
  // to the Pi rides the studio's room, so that is the box's name.
  const pb = createPatchbay(shown, { room: 'studio-1' });
  const pic = el('div', 'cn-pic');
  pic.append(pb.el);
  const EMPTY = 'say what should play what, press an example, or an out port and then an in port';
  const empty = el('p', 'cn-empty', EMPTY);
  pic.append(empty);

  // The picture is the kit's and redraws itself on resize, so its ports and
  // wires are made pressable after every draw rather than once.
  const svgOf = () => pb.view.el.querySelector('svg');
  function decorate() {
    const svg = svgOf();
    if (!svg || svg.querySelector('.cn-mark')) return;
    const mark = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    mark.setAttribute('class', 'cn-mark');
    svg.append(mark);
    const boxes = [...svg.querySelectorAll('g.lv-box')].map((g) => {
      const r = g.querySelector('rect');
      return { id: g.querySelector('.lv-title')?.textContent, x: +r.getAttribute('x'), y: +r.getAttribute('y'), w: +r.getAttribute('width'), h: +r.getAttribute('height') };
    });
    for (const t of svg.querySelectorAll('text.lv-pname')) {
      const x = +t.getAttribute('x'), y = +t.getAttribute('y');
      const box = boxes.find((b) => x >= b.x - 1 && x <= b.x + b.w + 1 && y >= b.y - 1 && y <= b.y + b.h + 1);
      const id = box && `${box.id}:${t.textContent}`;
      if (!id || !bay.port(id)) continue;
      t.dataset.port = id;
      t.classList.add('cn-pick');
      t.setAttribute('role', 'button');
      t.setAttribute('tabindex', '0');
      t.addEventListener('click', (e) => pick(id, e));
      t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(id, e); } });
    }
    for (const [key, path] of pb.view.wires) {
      const real = linkFor(key);
      if (!real) continue;
      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hit.setAttribute('d', path.getAttribute('d'));
      hit.setAttribute('class', 'cn-hit');
      hit.dataset.link = real.id;
      hit.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'), { textContent: `${printLink(real)}\npress to remove` }));
      hit.addEventListener('click', () => removeLink(real.id));
      svg.append(hit);
    }
    lightArmed();
    markPicture();
  }
  // A wire's key is its printed form; a relayed link is two hops through the drawn relay box.
  function linkFor(key) {
    let w;
    try { w = parseLink(key); } catch { return null; }
    const hop = (id) => id.startsWith('cf-relay:studio-1:');
    return bay.links().find((l) => (l.from === w.from || hop(w.from)) && (l.to === w.to || hop(w.to))
      && (l.from === w.from || l.to === w.to));
  }
  new MutationObserver(() => decorate()).observe(pb.view.el, { childList: true, subtree: true });

  // What a node is in this tab, then where else it runs.
  const GROUPS = ['controls', 'engines', 'recorders', 'outputs', 'raspberry pi', 'cloudflare', 'external'];
  function groupOf(n) {
    const site = n.id.split(':')[0];
    if (site === BOARD_SITE) return GROUPS[4];
    if (site.startsWith('cf-')) return GROUPS[5];
    if (site !== 'web') return GROUPS[6];
    return { person: GROUPS[0], device: GROUPS[0], engine: GROUPS[1], store: GROUPS[2] }[n.kind] ?? GROUPS[3];
  }

  // Live layer: the Pi and each page in the room announce their graph. A box shows a
  // green dot when heard inside STALE_MS, an empty ring once quiet, nothing if never.
  // See lessons/page-connect.md#connect-6
  const Q = new URLSearchParams(location.search);
  const STALE = SELFCHECK && Number(Q.get('stale')) > 0 ? Number(Q.get('stale')) : STALE_MS;
  // studio-1 is the owner's desk: only a person's own press listens there, and never a check.
  const mayListen = (room, person) => ROOM_RE.test(room) && (room !== STUDIO_ROOM || (person && !SELFCHECK));
  let listener = null, liveTimer = null, shape = '';
  const said = new Set();
  /** Every site heard, freshest per site, and every node's state by id. */
  function liveNow() {
    const sites = new Map(), state = new Map();
    if (!listener) return { sites, state };
    for (const e of listener.registry.graphs()) {
      if (e.from === 'self') continue;
      const was = sites.get(e.site);
      if (!was || e.at > was.at) sites.set(e.site, e);
    }
    for (const e of sites.values()) {
      if (e.stale) {
        for (const n of e.graph.nodes) if (!state.has(n.id)) state.set(n.id, 'stale');
        continue;
      }
      for (const n of e.graph.nodes) state.set(n.id, 'live');
    }
    return { sites, state };
  }
  let live = liveNow();
  const dot = (on) => el('span', `pos-pres-dot cn-dot${on ? '' : ' cn-ring'}`);
  const ago = (e) => Math.round((Date.now() - e.at) / 1000);
  const siteSays = (e) => (e ? (e.stale ? `quiet for ${ago(e)} s` : `heard ${ago(e)} s ago`) : '');
  const groupName = (e) => (e.graph.kind === 'board' ? `raspberry pi ${e.site}` : e.graph.kind === 'browser' ? `tab ${e.site}` : `${e.graph.kind || 'site'} ${e.site}`);

  const roomField = createField({ label: 'room', value: roomFor({ slug: 'connect' }) });
  let lastPressTrusted = false;
  const listenBtns = createButtonGroup({ buttons: [
    { id: 'listen', label: 'Listen', primary: true, onPress: () => listen(roomField.value().trim()) },
    { id: 'stop', label: 'Stop', onPress: () => stopListening() },
  ] });
  listenBtns.button('listen').addEventListener('click', (e) => { lastPressTrusted = e.isTrusted; }, { capture: true });
  listenBtns.enable('stop', false, 'not listening');
  const liveSt = el('p', 'cn-live-st', 'Listen joins a room and marks what answers in it now');
  const liveCtl = el('div', 'cn-live');
  const liveRow = el('div', 'cn-live-row');
  liveRow.append(roomField.el, listenBtns.el);
  liveCtl.append(liveRow, liveSt);

  function card(n, ports, { pressable = true, note = '' } = {}) {
    const box = el('div', 'cn-box');
    box.dataset.node = n.id;
    const head = el('div', 'cn-head');
    const id = el('span', 'cn-id', n.id);
    if (INSTANCE.has(n.id)) id.title = `one box for the type: ${INSTANCE.get(n.id)}`;
    const st = live.state.get(n.id);
    if (st) {
      box.dataset.live = st;
      const dt = dot(st === 'live');
      dt.title = st === 'live' ? `answering in ${listener?.room}` : `quiet for more than ${STALE / 1000} s`;
      id.append(dt);
    }
    head.append(id, el('span', 'cn-label', [n.label || '', note].filter(Boolean).join(', ')));
    const row = el('div', 'cn-ports'), ins = el('div'), outs = el('div');
    for (const p of ports) {
      const name = p.id.split(':')[2];
      const b = pressable ? el('button', 'pos-linkbtn cn-port', name, { type: 'button', 'aria-pressed': 'false' }) : el('span', 'cn-port cn-inert', name);
      b.style.setProperty('--c', `var(--md-${p.medium})`);
      if (pressable) {
        b.dataset.port = p.id;
        b.title = p.dir === 'out' ? 'press, then press an in port' : 'press an out port first, then this';
        b.addEventListener('click', (e) => pick(p.id, e));
      } else b.title = 'announced, and no page here links to it yet';
      (p.dir === 'out' ? outs : ins).append(b);
    }
    row.append(ins, outs);
    box.append(head, row);
    return box;
  }
  function section(title, e, cards, extra = null) {
    const box = el('section', 'cn-site');
    const h = el('h3', '', title);
    if (e) { const t = el('span', 'cn-site-st', siteSays(e)); t.dataset.site = e.site; h.append(t); box.dataset.site = e.site; }
    box.append(h);
    if (extra) box.append(extra);
    const grid = el('div', 'cn-grid');
    grid.append(...cards);
    if (cards.length) box.append(grid);
    return box;
  }
  const groups = el('div');
  function drawGrid() {
    const inPic = linkedNodes();
    const byGroup = new Map(GROUPS.map((g) => [g, []]));
    for (const n of bay.nodes()) if (!inPic.has(n.id) && !isInstance(n.id) && !hiddenSpare(n.id)) byGroup.get(groupOf(n)).push(card(n, bay.ports().filter((q) => nodeOf(q.id) === n.id)));
    const pi = live.sites.get(BOARD_SITE);
    // What the Pi says it has and no page here draws: a box of its own, quietly marked.
    for (const n of pi?.graph.nodes || []) {
      if (bay.node(n.id)) continue;
      byGroup.get(GROUPS[4]).push(card(n, pi.graph.ports.filter((p) => nodeOf(p.id) === n.id), { pressable: false, note: 'no page yet' }));
    }
    const out = [];
    for (const [where, cards] of byGroup) {
      if (where === GROUPS[4]) {
        out.push(section(where, pi, cards, liveCtl));
        // Every other site heard, a group each, after the Pi.
        for (const e of live.sites.values()) {
          if (e.site === BOARD_SITE) continue;
          out.push(section(groupName(e), e, e.graph.nodes.map((n) => card(n, e.graph.ports.filter((p) => nodeOf(p.id) === n.id), { pressable: false }))));
        }
        continue;
      }
      if (cards.length) out.push(section(where, null, cards));
    }
    groups.replaceChildren(...out);
    lightArmed();
  }

  /** Join `room` and collect what is said there. `person` is a press the browser made. */
  function listen(room, person = lastPressTrusted) {
    lastPressTrusted = false;
    if (!mayListen(room, person)) {
      d.log(!ROOM_RE.test(room) ? `${JSON.stringify(room)} is not a room name` : `${STUDIO_ROOM} is the studio's own room, so only a person's own press listens there`, 'warn');
      return false;
    }
    stopListening();
    listener = createBayNode({ room, graphs: [], registry: createRegistry({ staleMs: STALE }),
      onGraph: () => drawLive(), onJoin: () => drawLive(), log: (m) => d.log(m) });
    listener.join();
    liveTimer = setInterval(drawLive, 1000);
    listenBtns.enable('stop', true);
    liveSt.textContent = `joining ${room}`;
    return true;
  }
  function stopListening() {
    if (!listener) return;
    clearInterval(liveTimer); liveTimer = null;
    listener.leave();
    d.log(`left ${listener.room}`);
    listener = null;
    said.clear();
    listenBtns.enable('stop', false, 'not listening');
    liveSt.textContent = 'not listening';
    drawLive();
  }

  // Redraws the grid only when what is heard changes; the ages tick in place.
  function drawLive() {
    live = liveNow();
    const heard = [...live.sites.values()];
    for (const e of heard) {
      if (!said.has(e.from + e.site)) { said.add(e.from + e.site); d.log(`heard ${e.site}${e.graph.label ? ` (${e.graph.label})` : ''}, ${e.graph.nodes.length} nodes`); }
    }
    if (listener) {
      const n = heard.filter((e) => !e.stale).length;
      liveSt.textContent = !listener.joined() ? `joining ${listener.room}`
        : !heard.length ? `listening in ${listener.room}, nothing heard yet` : `listening in ${listener.room}, ${n} of ${heard.length} sites answering`;
    }
    const next = JSON.stringify([...live.state], null) + heard.map((e) => e.site + JSON.stringify(e.graph)).join();
    if (next !== shape) { shape = next; drawGrid(); markPicture(); }
    for (const t of groups.querySelectorAll('.cn-site-st')) t.textContent = siteSays(live.sites.get(t.dataset.site));
  }
  // A green dot after the title of every box in the picture that is answering now.
  function markPicture() {
    const svg = svgOf();
    if (!svg) return;
    for (const m of svg.querySelectorAll('.cn-livemark')) m.remove();
    for (const t of svg.querySelectorAll('text.lv-title')) {
      if (live.state.get(t.textContent) !== 'live') continue;
      const b = t.getBBox();
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'cn-livemark');
      c.setAttribute('cx', String(b.x + b.width + 8)); c.setAttribute('cy', String(b.y + b.height / 2)); c.setAttribute('r', '3.5');
      c.dataset.live = t.textContent;
      c.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'), { textContent: `answering in ${listener?.room}` }));
      svg.append(c);
    }
  }

  // A keyboard split by note ranges shows its zones on the keys, each named for what it plays.
  function showZones() {
    const kb = runtime.get(nodeOf(KEYS))?.kb;
    if (!kb?.zones) return;
    const z = bay.links().filter((l) => l.from === KEYS).map((l) => ({ l, r: (l.transforms || []).find((t) => t.op === 'range') }))
      .filter((x) => x.r).map((x) => ({ lo: x.r.lo, hi: x.r.hi, label: bay.node(nodeOf(x.l.to))?.label || nodeOf(x.l.to) }))
      .sort((a, b) => (a.lo ?? 0) - (b.lo ?? 0));
    kb.zones(z);
  }
  function redraw() {
    showZones();
    showStart();
    if (armed && !bay.port(armed)) armed = null;
    spares();
    pic.classList.toggle('cn-pic-empty', bay.links().length === 0);
    drawGrid();
    pb.refresh();
    decorate();
    runtime.sync();
  }

  // ── the faces: what the linked nodes look like when they run ─────────────
  // node-runtime.mjs makes a runtime per linked node; this block places their
  // faces. One knob row for every knob, rebuilt only when the set of knobs changes.
  const faces = el('div', 'cn-faces');
  faces.hidden = true;
  // One knob row per node the knobs turn, so two synths' cutoffs are told apart.
  const knobRows = new Map();   // target node -> { key, grid }
  const part = (title, face) => { const p = el('section', 'cn-face'); p.append(el('h3', 'pos-sec-h', title), face); return p; };
  function drawFaces() {
    const all = runtime.list().filter((x) => x.rt.face);
    const knobs = all.filter((x) => x.rt.slot === 'knob');
    const parts = all.filter((x) => x.rt.slot === 'picture').map((x) => part(x.id, x.rt.face));
    parts.push(...all.filter((x) => x.rt.slot === 'panel').map((x) => part(x.id, x.rt.face)));
    const turns = (id) => nodeOf(bay.links().find((l) => nodeOf(l.from) === id)?.to ?? '');
    const byTarget = new Map();
    for (const x of knobs) { const t = turns(x.id); if (!byTarget.has(t)) byTarget.set(t, []); byTarget.get(t).push(x); }
    for (const t of [...knobRows.keys()]) if (!byTarget.has(t)) knobRows.delete(t);
    for (const [t, list] of byTarget) {
      const key = list.map((x) => x.id).join();
      if (knobRows.get(t)?.key !== key) knobRows.set(t, { key, grid: createKnobGrid(list.map((x) => ({ name: x.rt.name, knob: x.rt.knob })), { row: true }) });
      const title = byTarget.size > 1 ? `knobs on ${t}` : list.length === 1 ? list[0].id : 'knobs';
      parts.push(part(title, knobRows.get(t).grid.el));
    }
    parts.push(...all.filter((x) => x.rt.slot === 'keys').map((x) => part(x.id, x.rt.face)));
    faces.replaceChildren(...parts);
    faces.hidden = !parts.length;
    showZones();
  }
  const runtime = createRuntimes({ bay, typeOf, log: (m, lv) => d.log(m, lv), onChange: drawFaces, audio: { sharedAudio, claim, release } });
  window.__demo.runtime = runtime;

  // Names Whisper should hear as written ("Rhodes", not "roads"), sent as turbo's initial prompt: this demo's
  // own words, the ones it misheard first. No node labels: about 80 of them gave "Gradulate" and "drone machine".
  const HEAR_WORDS = ['granulate', 'drum machine', 'bass synth', 'sawtooth', 'Rhodes', 'Plaits', 'piano', 'synth',
    'sampler', 'keyboard', 'grains', 'scope', 'speakers', 'split', 'octave', 'transpose', 'record', 'loop', 'Circuit', 'SuperCollider'];
  const vocabulary = () => [...HEAR_WORDS, ...Object.values(PATCH_NAMES).flat()]
    .filter((w, i, all) => all.findIndex((x) => x.toLowerCase() === w.toLowerCase()) === i);
  d.stack.add(bar.el, faces, pic, chooser, groups);
  redraw();
  for (const f of failed) d.log(f, 'bad');

  if (SELFCHECK) await check();
  d.ready();

  async function check() {
    const A = d.assert;
    const inGrid = (id) => !!groups.querySelector(`.cn-box[data-node="${id}"]`);
    // what a reader sees: an empty picture hides the last drawing rather than redrawing nothing
    const inPicture = (id) => !pic.classList.contains('cn-pic-empty') && [...(svgOf()?.querySelectorAll('.lv-title') || [])].some((t) => t.textContent === id);
    const has = (from, to) => bay.links().some((l) => l.from === from && l.to === to);
    const press = (id) => document.querySelector(`button[data-port="${id}"], text[data-port="${id}"]`)?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    const runtimes = async () => { await runtime.idle(); await frame(); };

    A('NEGATIVE CONTROL: on a visit there is nothing to clear, so "start new" is not drawn and takes no room',
      startPill.hidden && getComputedStyle(startPill).display === 'none' && startPill.getBoundingClientRect().width === 0
        && exRow.querySelector('.pos-pill:not([hidden])')?.textContent === EXAMPLES[0].say, getComputedStyle(startPill).display);
    // Before anything is pressed: no runtime, no face, no sound device.
    A('a visit opens no sound device and shows no face', contexts() === 0 && runtime.list().length === 0
      && faces.hidden && getComputedStyle(faces).display === 'none', `contexts ${contexts()}, runtimes ${runtime.list().length}`);

    A('a visit joins no room and opens no socket', OPENED.length === 0 && listener === null && !groups.querySelector('.cn-box[data-live]'),
      OPENED.join(' ') || 'none opened');
    A('a check never listens in the studio\'s room, even on a trusted press', !mayListen(STUDIO_ROOM, false) && !mayListen(STUDIO_ROOM, true)
      && roomField.value() !== STUDIO_ROOM, `the field reads ${roomField.value()}`);

    A('every node made it into the bay', failed.length === 0 && bay.nodes().length === EXPECTED,
      `${bay.nodes().length} of ${EXPECTED}: ${Object.keys(CATALOGUE).length} catalogue types (${HOPS.length} of them hops), ${PI_KEPT} Pi`
      + `${failed.length ? `, refused: ${failed.join('; ')}` : ''}`);
    // Nothing imaginary: every box names a page that builds it, and every page
    // it names is a concept page that exists.
    const known = new Set([...CONCEPTS.map((c) => c.id), ...OFF_INDEX]);
    const orphan = bay.nodes().filter((n) => !(PAGES.get(n.id) || []).length).map((n) => n.id);
    const unknown = [...new Set([...PAGES.values()].flat())].filter((pg) => !known.has(pg));
    A('every node names the pages that build it, and every one of those pages exists', !orphan.length && !unknown.length,
      `no page: ${orphan.join(', ') || 'none'}; not a page: ${unknown.join(', ') || 'none'}`);
    A('a type made per instance is one box, not one per knob', !bay.nodes().some((n) => /:knob-(?!volume$|mix$)|:midi-\d|:scope-|:screen-/.test(n.id)),

    redraw(); await runtimes();
    A('a link choosing rhodes into the running sampler switches its program to the Rhodes, spelled as the sampler spells it',
      rhodes.ok && smp.chosen() === 'Rhodes' && smp.sampler.stat().inst === 'rhodes' && smp.sampler.stat().programs.at(-1) === 1,
      `${rhodes.why || printLink(bay.links().find((l) => l.id === rhodes.id))}; inst ${smp.sampler.stat().inst}, programs ${smp.sampler.stat().programs.join(',')}`);
    if (rhodes.ok) { bay.unlink(rhodes.id); redraw(); await runtimes(); }

    // ── a patch change for the Circuit, held off before Join ──
    await pressEx('change the circuit\'s patch');
    const patch = RT('web:patch'), circ = RT(`${BOARD_SITE}:circuit`);
    const o0 = OPENED.length;
    patch.pick(5);
    A('a patch picked reaches the Circuit\'s box on the Pi, which sends nothing and joins nothing before Join',
      !!patch && !!circ && shows('web:patch') && shows(`${BOARD_SITE}:circuit`) && patch.heard() === 1 && circ.heldOff() === 1
        && !circ.joined() && !circ.board() && OPENED.length === o0, `held off ${circ?.heldOff()}, sockets ${OPENED.length - o0}`);
  }

  // ── every example: it runs, or its pill says why it does not ──────────────
  async function checkExamples() {
    const A = d.assert;
    const runtimes = async () => { await runtime.idle(); await new Promise((r) => requestAnimationFrame(() => r())); };
    // Every example runs here; a mark that appears is a red assert, not a new one.
    const EXPECT = {};
    let ran = 0;
    const skipped = [];
    for (const [i, ex] of EXAMPLES.entries()) {
      const pill = bar.pills[i];
      const r = runsOf(ex), want = EXPECT[ex.say] ?? 'runs';
      if (want === 'press' || r.press.length) {
        A(`"${ex.say}" is marked as a person's press only`, want === 'press' && pill.dataset.runs === 'press' && /person's press only/.test(pill.title), pill.title);
        skipped.push(`${ex.say} (${r.press.map((n) => PRESS_ONLY[n]).join(', ')})`);
        continue;
      }
      if (Array.isArray(want) || r.missing.length) {
        A(`"${ex.say}" is dimmed and its title names what does not run: ${Array.isArray(want) ? want.join(', ') : 'nothing'}`,
          Array.isArray(want) && want.join() === r.missing.join() && pill.dataset.runs === 'marked' && getComputedStyle(pill).opacity < 1
            && want.every((n) => pill.title.includes(n)), pill.title);
        continue;
      }
      pill.click();
      await runtimes();
      // The nodes the press really linked: a knob into a named value-in is its own instance (web:knob-bright).
      const nodes = [...new Set(bay.links().flatMap((l) => [nodeOf(l.from), nodeOf(l.to)]))];
      const dead = nodes.filter((n) => !runtime.get(n));
      const faceless = nodes.filter((n) => runtime.get(n) && (FACED.includes(typeOf(n)) || n.startsWith(`${BOARD_SITE}:`))
        && !(runtime.get(n).face && faces.contains(runtime.get(n).face)));
      A(`"${ex.say}" runs: all ${ex.links.length} links made, every node of its patch has a runtime, and a face where its type has one`,
        pill.dataset.runs === 'runs' && bay.links().length === ex.links.length && !dead.length && !faceless.length,
        `${bay.links().length} links; no runtime: ${dead.join(' ') || 'none'}; no face: ${faceless.join(' ') || 'none'}`);
      ran++;
    }
    d.log(`${ran} of ${EXAMPLES.length} examples run here; left for a person's press: ${skipped.join('; ') || 'none'}`);
    for (const l of [...bay.links()]) bay.unlink(l.id);
    redraw();
    await runtimes();
  }

  // Only with `?relay=` (demo/fake-relay.mjs) and a private room answered by
  // demo/fake-board.mjs; otherwise left out, so a check never reaches the real relay.
  // See lessons/page-connect.md#connect-8
  async function checkLive() {
    const A = d.assert;
    const room = roomField.value();
    if (RELAY_BASE === DEFAULT_RELAY || room === STUDIO_ROOM) {
      d.log('left out: the live layer is checked only against a stand-in relay (?relay=ws://127.0.0.1:...) in a private room', 'dim');
      return;
    }
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const runtimes = async () => { await runtime.idle(); await new Promise((r) => requestAnimationFrame(() => r())); };
    const until = async (fn, ms) => { const t0 = performance.now(); while (!fn() && performance.now() - t0 < ms) await sleep(100); return fn(); };
    const card = (id) => groups.querySelector(`.cn-box[data-node="${id}"]`);
    const liveCard = (id) => card(id)?.dataset.live === 'live' && !!card(id).querySelector('.cn-dot:not(.cn-ring)');
    const staleCard = (id) => card(id)?.dataset.live === 'stale' && !!card(id).querySelector('.cn-dot.cn-ring');
    const group = (site) => groups.querySelector(`.cn-site[data-site="${site}"]`);
    const markedInPicture = (id) => !!svgOf()?.querySelector(`.cn-livemark[data-live="${id}"]`);

    // NEGATIVE CONTROL first: a room on the same stand-in relay where nobody is.
    const quiet = `${room}-empty`;
    listen(quiet);
    await until(() => listener?.joined(), 4000);
    await sleep(2500);
    A('NEGATIVE CONTROL: listening where no stand-in answers, no box is marked and no group is added', listener?.joined()
      && live.sites.size === 0 && !groups.querySelector('.cn-box[data-live]') && !groups.querySelector('.cn-site[data-site]'),
      `${live.sites.size} sites heard in ${quiet}, joined ${listener?.joined()}`);

    // The stand-in board, in the private room the runner started it in.
    listen(room);
    A('the room listened in is the private one, never the studio\'s', listener?.room === room && room !== STUDIO_ROOM
      && OPENED.every((u) => !u.includes(`/room/${STUDIO_ROOM}/`)), `${listener?.room}`);
    await until(() => live.sites.get(BOARD_SITE) && !live.sites.get(BOARD_SITE).stale, 8000);
    const pi = live.sites.get(BOARD_SITE);
    const piIds = (pi?.graph.nodes || []).map((n) => n.id);
    const ofPi = (id) => !!group(BOARD_SITE)?.querySelector(`.cn-box[data-node="${id}"]`);
    A('after Listen, the stand-in board\'s boxes in the raspberry pi group carry a live dot, and its heading says when it was heard',
      !!pi && piIds.includes(`${BOARD_SITE}:circuit`) && ofPi(`${BOARD_SITE}:circuit`) && liveCard(`${BOARD_SITE}:circuit`)
        && /heard \d+ s ago/.test(group(BOARD_SITE)?.querySelector('h3')?.textContent || ''),
      pi ? `${piIds.join(' ')}; heading "${group(BOARD_SITE)?.querySelector('h3')?.textContent}"` : 'no pi-1 heard');
    A('a box the Pi did not announce carries no dot', !!card(`${BOARD_SITE}:sampler`) && !piIds.includes(`${BOARD_SITE}:sampler`)
      && !card(`${BOARD_SITE}:sampler`).dataset.live, `sampler announced ${piIds.includes(`${BOARD_SITE}:sampler`)}`);
    const extra = piIds.filter((id) => !bay.node(id));
    A('a node the Pi has and no page here draws is a box in its group, quietly "no page yet", never "not in the catalogue"',
      extra.length > 0 && extra.every((id) => ofPi(id) && liveCard(id) && /no page yet/.test(card(id).querySelector('.cn-label').textContent))
        && !/not in the catalogue/.test(groups.textContent),
      extra.join(', ') || 'none extra');
    // A Pi box in the picture is marked too.
    [...exRow.children].find((b) => b.textContent === 'play the circuit in the studio').click();
    await runtimes();
    await until(() => markedInPicture(`${BOARD_SITE}:circuit`), 2000);
    A('a live Pi box drawn in the picture carries the mark there', markedInPicture(`${BOARD_SITE}:circuit`) && !markedInPicture('web:keys'));

    // A second tab: another socket in the room announcing a page's bay, as announce.mjs does.
    const tab = createBay();
    tab.addNode({ id: 'web:keys', kind: 'person', label: 'keyboard' });
    tab.addPort({ id: 'web:keys:midi-out', dir: 'out', medium: 'midi', emits: ['note'] });
    tab.addNode({ id: 'web:theremin', kind: 'person', label: 'theremin' });
    tab.addPort({ id: 'web:theremin:midi-out', dir: 'out', medium: 'midi' });
    const { graph } = pageGraph(tab, { label: 'a second tab' });
    const other = await new Promise((resolve) => { const w = openWire(room, { by: 'tool', reconnect: false, onOpen: () => resolve(w) }); });
    other.send({ type: 'graph.announce', graph });
    other.close();
    await until(() => !!group(graph.site), 4000);
    A('a second tab\'s announce shows up as a group of its own, "tab <site>", with a live box per node',
      !!group(graph.site) && group(graph.site).querySelector('h3').textContent.startsWith(`tab ${graph.site}`)
        && graph.nodes.every((n) => liveCard(n.id)), `site ${graph.site}, ${graph.nodes.map((n) => `${n.id} ${card(n.id)?.dataset.live}`).join(', ')}`);

    // It said it once and its socket is gone, so it ages out; the board beats on.
    await until(() => live.sites.get(graph.site)?.stale, STALE + 3000);
    await sleep(1100);
    A(`a node goes stale after STALE_MS (${STALE} ms here): its dot turns to an empty ring, while the board stays live`,
      graph.nodes.every((n) => staleCard(n.id)) && /quiet for \d+ s/.test(group(graph.site)?.querySelector('h3')?.textContent || '')
        && live.state.get(`${BOARD_SITE}:circuit`) === 'live' && markedInPicture(`${BOARD_SITE}:circuit`),
      `tab ${graph.nodes.map((n) => card(n.id)?.dataset.live).join(' ')}, board in picture ${markedInPicture(`${BOARD_SITE}:circuit`)}`);

    stopListening();
    for (const l of [...bay.links()]) bay.unlink(l.id);
    redraw();
    await runtimes();
    A('Stop leaves the room, the heard groups and boxes go, and nothing is marked', !listener && live.sites.size === 0
      && !groups.querySelector('.cn-box[data-live]') && !groups.querySelector('.cn-site[data-site]') && !svgOf()?.querySelector('.cn-livemark')
      && !card(`${BOARD_SITE}:synth`));

    await checkPi(room);
  }

  // The Pi joined from its own face against demo/fake-board.mjs, which counts what
  // reached the Circuit's port. Never studio-1: the room is the check's own.
  // See lessons/page-connect.md#connect-9
  async function checkPi(room) {
    const A = d.assert;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const runtimes = async () => { await runtime.idle(); await new Promise((r) => requestAnimationFrame(() => r())); };
    const until = async (fn, ms) => { const t0 = performance.now(); while (!fn() && performance.now() - t0 < ms) await sleep(100); return fn(); };
    const loudest = async (ms) => { let m = 0; const t0 = performance.now(); while (performance.now() - t0 < ms) { m = Math.max(m, runtime.level()); await sleep(20); } return m; };
    const pressEx = async (say) => { [...exRow.children].find((b) => b.textContent === say).click(); await runtimes(); };
    const CIRC = `${BOARD_SITE}:circuit`, PIANO_ID = `${BOARD_SITE}:sampler`;

    await pressEx('play the circuit in the studio');
    const circ = runtime.get(CIRC), kb = runtime.get('web:keys')?.kb;
    const o0 = OPENED.length;
    kb.press(kb.keyOf(60)); kb.release(kb.keyOf(60));
    A('a link to the Circuit opens nothing: no board and no socket before Join, and a key is held off',
      !!circ && !circ.board() && !circ.joined() && OPENED.length === o0 && circ.heldOff() === 2 && circ.heard() === 0,
      `sockets ${OPENED.length - o0}, held off ${circ?.heldOff()}`);
    runtime.wake();
    circ.face.querySelector('button[data-id="join"]')?.click();
    await until(() => circ.joined(), 12000);
    A('Join on the Circuit\'s face joins the check\'s own room, never the studio\'s, and holds the lease',
      circ.joined() && circ.room === `${room}-circuit` && !circ.room.startsWith(STUDIO_ROOM)
        && OPENED.every((u) => !u.includes(`/room/${STUDIO_ROOM}`)) && (circ.lease()?.renewals() ?? 0) >= 1,
      `room ${circ.room}, joined ${circ.joined()}, renewals ${circ.lease()?.renewals()}`);
    const outs = async () => (await circ.board().ask({ type: 'audio.status' }, 'audio.started', 4000))?.midi?.out ?? null;
    const before = await outs();
    kb.press(kb.keyOf(60)); await sleep(120); kb.release(kb.keyOf(60));
    await sleep(500);
    const after = await outs();
    A('a key after Join reaches the stand-in board, counted on its side as written to the Circuit\'s port',
      before !== null && after - before === 2 && circ.heard() === 2, `the board counts ${before} then ${after}, the box sent ${circ.heard()}`);
    const piLoud = await loudest(1500);
    A('the board\'s sound comes back into this page\'s one context and reaches the speakers', piLoud > 0.01, `speakers ${piLoud.toFixed(4)}`);
    removeLink(bay.links().find((l) => l.from === `${CIRC}:audio-out`)?.id);
    await runtimes();
    await sleep(300);
    const piQuiet = await loudest(600);
    A('NEGATIVE CONTROL: with the Circuit\'s audio-out unlinked nothing reaches the speakers, and the Circuit stays joined',
      piQuiet < 0.001 && circ.joined(), `speakers ${piQuiet.toFixed(5)}`);
    const lease = circ.lease();
    for (const l of [...bay.links()]) bay.unlink(l.id);
    redraw();
    await runtimes();
    A('unlinked, the Circuit\'s box closes and leaves the room', !runtime.get(CIRC) && !circ.board() && !circ.joined(),
      `renewals so far ${lease?.renewals() ?? 0}`);

    // The sampler on the Pi: the stand-in has none, so Join says so and sends nothing.
    await pressEx('play the piano on the pi');
    const piano = runtime.get(PIANO_ID), kb2 = runtime.get('web:keys')?.kb;
    piano.face.querySelector('button[data-id="join"]')?.click();
    await until(() => /could not start/.test(piano.face.textContent), 12000);
    kb2.press(kb2.keyOf(60)); kb2.release(kb2.keyOf(60));
    A('NEGATIVE CONTROL: a board with no sampler is said on the piano\'s face, and a key sends it nothing',
      /could not start the sampler/.test(piano.face.textContent) && !piano.joined() && piano.heard() === 0 && piano.room === room,
      piano.face.querySelector('.cn-face-say')?.textContent);
    for (const l of [...bay.links()]) bay.unlink(l.id);
    redraw();
    await runtimes();
  }
</script>

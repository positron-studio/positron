<title>Keyboard</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createMidiDevices } from '/shell/midi-devices.mjs';
  import { createVoice } from '/shell/synth-voice.mjs';
  useMediumColours();

  // The on-screen keyboard and a sine synth as bay nodes in this tab, no room. Notes
  // travel keys -> synth only along a link the bay holds; ports are named from the
  // bay's side (what the keys play is an out, what they show is an in).
  // See lessons/page-synth.md#synth-6
  const S = 'web';
  const bay = createBay();

  // ── the synth: the kit voice, one sine per held note, no filter ─────────
  let ctx = null;
  const voice = createVoice({ cutoff: null });
  function noteOn(n, vel) {
    if (!ctx) { ctx = new AudioContext(); voice.start(ctx); voice.out().connect(ctx.destination); }
    voice.noteOn(n, vel);
  }
  const noteOff = (n) => voice.noteOff(n);

  let kb = null;
  // The shapes are /shell/nodes.mjs's; the page says only what each in-port does.
  addNodes(bay, S, ['keys', 'synth', 'speaker'], {
    label: { synth: 'sine' },
    deliver: {
      'keys:midi-in': (e) => kb?.lightNote(e.d1, !!e.d2),
      'synth:midi-in': (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)),
    },
  });

  const d = mount({ name: 'Keyboard', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('synth/keyboard');

  // ── the links ───────────────────────────────────────────────────────────
  const WANT = [
    [`${S}:keys:midi-out`, `${S}:synth:midi-in`],
    [`${S}:synth:audio-out`, `${S}:speaker:audio-in`],
  ];
  const held = new Map();       // "from to" -> link id
  function patch(on) {
    for (const [a, b] of WANT) {
      const k = `${a} ${b}`;
      if (on && !held.has(k)) {
        const r = bay.link(a, b, [], { site: S });
        if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
      } else if (!on && held.has(k)) { bay.unlink(held.get(k)); held.delete(k); }
    }
    voice.panic();
    pb.refresh();
  }

  // The links as a picture: a MIDI wire pulses per delivered event, the audio wire is
  // lit while the sine sounds. The bay cannot forget a node, so an unplugged keyboard's
  // `device` node is hidden here and its links dropped.
  // See lessons/page-synth.md#synth-7
  const { plugged, ask: askMidi } = createMidiDevices({ bay, site: S, to: [`${S}:synth:midi-in`, `${S}:keys:midi-in`],
    onChange: () => pb.refresh(), log: (line, kind) => d.log(line, kind) });
  const shown = (id) => !id.startsWith(`${S}:midi`) || plugged.has(id.split(':').slice(0, 2).join(':'));
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shown(n.id)),
    ports: () => bay.ports().filter((p) => shown(p.id)),
    links: () => bay.links(),
  }, { flowing: () => voice.held() > 0 });

  // A key press is one event leaving keys:midi-out, sent through the bay.
  const host = el('div');
  // C to A, 13 white keys: as many as the content width holds at the kit's 49 px minimum.
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  patch(true);

  // Asking for MIDI shows the browser's prompt once; nothing else opens on a visit.
  askMidi();

  // Blocks in the shell's stack, at the shell's gap.
  d.stack.add(host, pb.el);
  d.ready();
</script>

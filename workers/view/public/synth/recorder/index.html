<title>Recorder</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createVoice } from '/shell/synth-voice.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createNoteRecorder } from '/shell/note-recorder.mjs';
  useMediumColours();

  // /synth/keyboard/ plus a RECORDER, a node of its own: `rec:midi-in` takes the
  // keyboard's notes along a link while armed, `rec:midi-out` plays them back
  // into the synth along another.
  const S = 'web';
  const bay = createBay();

  // ── the synth: one saw per held note, a short fade in and out ───────────
  let ctx = null;
  // The kit voice as this page's saw: no filter, so the bus is the voice's own out.
  const voice = createVoice({ wave: 'sawtooth', level: 0.08, cutoff: null });
  // The audio graph follows the links: the synth's bus reaches the speakers only
  // while synth:audio-out -> speaker:audio-in is held.
  function audio() {
    if (!ctx) return;
    const bus = voice.out();
    bus.disconnect();
    if (bay.links().some((l) => l.from === `${S}:synth:audio-out` && l.to === `${S}:speaker:audio-in`)) bus.connect(ctx.destination);
  }

  function noteOn(n, vel) {
    if (!ctx) { ctx = new AudioContext(); voice.start(ctx); audio(); }
    voice.noteOn(n, vel);
  }
  const noteOff = (n) => voice.noteOff(n);

  let kb = null;
  // The shapes are /shell/nodes.mjs's; the page says only what each in-port does.
  addNodes(bay, S, ['keys', 'synth', 'rec', 'speaker'], {
    label: { synth: 'saw' },
    deliver: {
      'keys:midi-in': (e) => (e.d2 ? kb?.press(e.d1, 'midi') : kb?.release(e.d1, 'midi')),
      'synth:midi-in': (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)),
      'rec:midi-in': (e) => take(e),
    },
  });

  const d = mount({ name: 'Recorder', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('synth/recorder');

  // ── the links, rebuilt whenever an effect changes ─────────────────────
  function patch() {
    for (const l of bay.links()) bay.unlink(l.id);
    const want = [[`${S}:keys:midi-out`, `${S}:synth:midi-in`, []]];
    // The recorder hears the keys; it plays back into the synth on a link of its own.
    want.push([`${S}:keys:midi-out`, `${S}:rec:midi-in`, []], [`${S}:rec:midi-out`, `${S}:synth:midi-in`, []]);
    want.push([`${S}:synth:audio-out`, `${S}:speaker:audio-in`, []]);
    for (const [a, b, tr] of want) {
      const r = bay.link(a, b, tr, { site: S });
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    voice.panic();
    audio();
    pb.refresh();
   
  }

  // ── the recorder ────────────────────────────────────────────────────────
  // The recorder is the kit's (note-recorder.mjs, which /connect/ runs too).
  const recorder = createNoteRecorder({ send: (ev) => bay.send(`${S}:rec:midi-out`, ev), onStop: () => voice.panic() });
  const { take, transport, drawNotes } = recorder, notesT = recorder.table;

  const pb = createPatchbay(bay, { flowing: () => voice.held() > 0 });

  // A key press is one event leaving keys:midi-out, sent through the bay.
  const host = el('div');
  // C to A, 13 white keys: as many as the content width holds at the kit's 49 px minimum.
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  patch();
  drawNotes();
  // Blocks in the shell's stack; the heading and what it names are one block.
  d.stack.add(host);
  d.stack.titled('RECORDING', transport.el, notesT.el);
  d.stack.add(pb.el);
  d.ready();
</script>

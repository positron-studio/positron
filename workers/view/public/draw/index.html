<style>
  /* The pad styles itself (demo/shell/xy-pad.mjs). This is layout only: the row
     that carries the knobs, with the one destructive button at its far end.
     See lessons/page-draw.md#draw-1 */

</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { setIcon } from '/shell/icon-button.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createXyPad, PAD } from '/shell/xy-pad.mjs';
  import { holdSample, lerpSample, catmullSample, makePointerAdapter } from '/shell/pointer-adapter.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck, observePosition } from '/timeline/transport.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createDiagram } from '/shell/diagram.mjs';

  const d = mount({
    name: 'draw',
    // One sentence, the manifest's `one`; the diagram's notes carry the explanation.
    // See lessons/page-draw.md#draw-2
    what: 'Press record, then draw a line with a finger or a mouse.',
    // Six cells, an even number: an odd readout leaves a hole on a phone and mount()
    // throws. Not drawn (showReadout false) but published on `__demo.readout`, which
    // verify.mjs asserts; not `readout: null`, which would mean the page has none.
    // See lessons/page-draw.md#draw-3
    readout: { kept: '', invented: '%', 'off by': 'px', worst: 'px', 'as two': 'px', 'times worse': '\u00d7' },
    showReadout: false,
    // Empty on purpose: the record button lives in the bar, the knobs sit in a
    // `.pos-controls` row that verify.mjs presses wherever it is. Nothing draws for
    // you; verify.mjs drags real pointer events across the pad's `data-gesture`.
    // See lessons/page-draw.md#draw-4
    controls: [],
  });
  guard(d);

  // Two append-only lanes, never one mutable array. `evidence` is every sample,
  // the pad's live capture, never touched by the throttle. The rate is a control:
  // it sets how many samples there are to interpolate between.
  // See lessons/page-draw.md#draw-5
  let storeMs = 100;
  let evidence = [], stored = [];
  // The same gesture written down the OTHER way: two records of one number
  // each, whose knots are chosen per axis and therefore land at different
  // instants. See `oneAxisAlone` below for why this is here at all.
  let splitX = [], splitY = [];

  /**
   * The sparse record, derived from the evidence so the rate can change after the
   * fact. The last sample is always kept, or replays undershoot where the hand
   * ended (rule 2 of the capture discipline in demo/shell/cc-adapter.mjs).
   * See lessons/page-draw.md#draw-6
   */
  function onAClock() {
    const out = [];
    let last = -1e9;
    for (const p of evidence) {
      if (p.at - last >= storeMs) { last = p.at; out.push(p); }
    }
    const end = evidence[evidence.length - 1];
    if (out[out.length - 1] !== end) out.push(end);
    return out;
  }

  /**
   * Negative control: the same sample count, placed where the line bends
   * (Douglas-Peucker, top down). Kept as code so check() has a plausible rival to
   * beat; the count is held equal so the comparison is only about placement.
   * See lessons/page-draw.md#draw-7
   */
  function whereItBends(target) {
    // deviation of point i from the chord a..b, in pixels
    const dev = (a, b, i) => {
      const A = evidence[a], B = evidence[b], P = evidence[i];
      const dx = B.x - A.x, dy = B.y - A.y;
      const L = Math.hypot(dx, dy);
      if (L < 1e-6) return Math.hypot(P.x - A.x, P.y - A.y);
      return Math.abs(dy * (P.x - A.x) - dx * (P.y - A.y)) / L;
    };
    return pickWorstFirst(dev, target).map((i) => evidence[i]);
  }

  /**
   * Engine for both alternatives: keep the ends, add whichever sample `dev(a, b, i)`
   * says the kept line is most wrong about, until `target`; returns indices.
   * `dev` is in one unit only (px on a path or on one axis), never a mixture.
   * See lessons/page-draw.md#draw-8
   */
  function pickWorstFirst(dev, target) {
    const n = evidence.length;
    if (n <= 2 || target >= n) return evidence.map((_, i) => i);
    const keep = new Set([0, n - 1]);
    // the worst point inside each open segment, kept as a small work list
    const worstIn = (a, b) => {
      let best = -1, bestD = -1;
      for (let i = a + 1; i < b; i++) { const dd = dev(a, b, i); if (dd > bestD) { bestD = dd; best = i; } }
      return { i: best, d: bestD };
    };
    const segs = [{ a: 0, b: n - 1, ...worstIn(0, n - 1) }];
    while (keep.size < target) {
      let pick = -1, pickD = -1;
      for (let k = 0; k < segs.length; k++) if (segs[k].i > 0 && segs[k].d > pickD) { pickD = segs[k].d; pick = k; }
      if (pick < 0) break;                       // nothing left that bends
      const { a, b, i } = segs[pick];
      keep.add(i);
      segs.splice(pick, 1, { a, b: i, ...worstIn(a, i) }, { a: i, b, ...worstIn(i, b) });
    }
    return [...keep].sort((x, y) => x - y);
  }

  /**
   * The same gesture as two one-axis series, each gated on its own, as a hardware
   * controller sends it. Count held equal per axis and placed over the finished
   * gesture: its best case. The value rides in `.x` so the same interpolators grade it.
   * See lessons/page-draw.md#draw-9
   */
  function oneAxisAlone(get, target) {
    const dev = (a, b, i) => {
      const A = evidence[a], B = evidence[b], P = evidence[i];
      const h = B.at - A.at;
      const u = h > 0 ? (P.at - A.at) / h : 0;
      return Math.abs(get(P) - (get(A) + (get(B) - get(A)) * u));
    };
    return pickWorstFirst(dev, target)
      .map((i) => ({ at: evidence[i].at, x: get(evidence[i]), y: 0, pressure: evidence[i].pressure }));
  }

  function decimate() {
    stored = evidence.length ? onAClock() : [];
    // The same gesture written down as two; rebuilt with the record, since the rate
    // knob changes how many samples there are.
    // See lessons/page-draw.md#draw-10
    const n = stored.length;
    splitX = n >= 2 ? oneAxisAlone((p) => p.x, n) : [];
    splitY = n >= 2 ? oneAxisAlone((p) => p.y, n) : [];
  }

  // The adapter's interpolators (holdSample, lerpSample, catmullSample), on one
  // smoothing knob: 0 holds (a staircase), 1 is the spline. The ends are exactly
  // the named methods, so check() grades the real algorithms.
  // See lessons/page-draw.md#draw-11
  const HOLD = 0, LINEAR = 0.5, SMOOTH = 1;
  let smooth = SMOOTH;
  const mix = (p, q, k) => ({ ...p, x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k });

  /**
   * The reconstruction at smoothing `s`, also the adapter's `interpolate`, so the
   * picture and the transport cannot disagree; the transport check then catches
   * plumbing, not arithmetic. Ends go in as undefined so catmullSample reflects them.
   * See lessons/page-draw.md#draw-12
   */
  function blend(a, b, u, ctx, s = smooth) {
    const held = holdSample(a);
    if (s <= HOLD) return held;
    const straight = lerpSample(a, b, u);
    if (s <= LINEAR) return mix(held, straight, s / LINEAR);
    // Time-knotted: throttled samples are never evenly spaced, and uniform knots bend
    // the curve toward a late sample.
    // See lessons/page-draw.md#draw-13
    const p0 = (ctx && ctx.prev) || null, p3 = (ctx && ctx.next) || null;
    return mix(straight, catmullSample(p0, a, b, p3, u), (s - LINEAR) / (SMOOTH - LINEAR));
  }

  /** Where the sparse record says the pen was at time `t`, at smoothing `s`. */
  function at(t, s = smooth) {
    const n = stored.length;
    if (!n) return null;
    if (t <= stored[0].at) return stored[0];
    if (t >= stored[n - 1].at) return stored[n - 1];
    let i = 0;
    while (i < n - 2 && stored[i + 1].at <= t) i++;
    const a = stored[i], b = stored[i + 1];
    const u = (t - a.at) / Math.max(1e-6, b.at - a.at);
    return blend(a, b, u, { prev: stored[i - 1], next: stored[i + 2] }, s);
  }

  /** the same reading pinned at one smoothing, in the shape `error()` takes */
  const atSm = (sm) => (t) => at(t, sm);

  /**
   * Where one separately recorded direction says it was at `t`: `at()` on `.x` only,
   * through the same `blend`.
   * See lessons/page-draw.md#draw-14
   */
  function oneAxisAt(rows, t, sm) {
    const n = rows.length;
    if (n < 2) return null;
    if (t <= rows[0].at) return rows[0].x;
    if (t >= rows[n - 1].at) return rows[n - 1].x;
    let i = 0;
    while (i < n - 2 && rows[i + 1].at <= t) i++;
    const a = rows[i], b = rows[i + 1];
    const u = (t - a.at) / Math.max(1e-6, b.at - a.at);
    return blend(a, b, u, { prev: rows[i - 1], next: rows[i + 2] }, sm).x;
  }

  /** Where the TWO separate records say the hand was at `t`. Each direction is
   *  read from its own knots, and they are not at the same instants — which is
   *  the whole of what is being measured. */
  function atApart(t, sm = smooth) {
    if (splitX.length < 2 || splitY.length < 2) return null;
    const x = oneAxisAt(splitX, t, sm), y = oneAxisAt(splitY, t, sm);
    return x === null || y === null ? null : { x, y, at: t };
  }

  /** The full-rate truth at `t` — what the hand ACTUALLY did, straight-lined
   *  between two samples a few milliseconds apart. */
  function truthAt(t) {
    const n = evidence.length;
    if (!n) return null;
    if (t <= evidence[0].at) return evidence[0];
    if (t >= evidence[n - 1].at) return evidence[n - 1];
    let i = 0;
    while (i < n - 2 && evidence[i + 1].at <= t) i++;
    const a = evidence[i], b = evidence[i + 1];
    const u = (t - a.at) / Math.max(1e-6, b.at - a.at);
    return lerpSample(a, b, u);
  }

  // One deck for the page's life: the bar binds its deck at construction. The lane
  // is rebuilt (sched.clear() and re-schedule) whenever the record changes.
  // See lessons/page-draw.md#draw-15
  const KIND = 'pointer';
  // The evidence policy must be chosen: interpolating is restoration, so sampleAt
  // and the fold throw without one, and 'attested' degrades to a 34 px hold.
  // See lessons/page-draw.md#draw-16
  const RESTORED = { restored: { maxTier: 1 } };
  // a deck with nothing in it still needs a window; long enough that pressing
  // play on an empty page does not immediately hit the end
  const IDLE_MS = 8000;

  let ghost = null;          // where the transport says the hand is
  let base = 0;              // the raw stamp that deck position 0 means

  const pointer = makePointerAdapter({
    mode: 'catmull',
    // Both doors: `actuate` fires as the playhead crosses a sample, `assertState`
    // after a seek. A null state is dropped by the adapter, so the mark can go stale.
    // See lessons/page-draw.md#draw-17
    onActuate: (s) => {
      if (s && Number.isFinite(s.x) && Number.isFinite(s.y)) { ghost = s; pad.repaint(); }
    },
  });
  pointer.interpolate = (a, b, u, ctx) => blend(a, b, u, ctx);
  // The speeds come from the adapter and the bar builds the buttons from the
  // intersected caps.rates. Set before createDeck so neither the deck nor the bar
  // misses it. Speed changes nothing measured: every number reads sample stamps.
  // See lessons/page-draw.md#draw-18

  const deck = createDeck({
    items: [], adapters: { [KIND]: pointer },
    range: [0, IDLE_MS], evidence: RESTORED,
  });

  /**
   * Hand the record to the transport when a gesture ends or the rate knob changes.
   * Normalised to zero (timeStamp counts from page load), then re-asserted at the
   * playhead, since the overdub law would leave the mark at the line's end.
   * See lessons/page-draw.md#draw-19
   */
  function publish() {
    deck.sched.clear();
    if (stored.length < 2) {
      base = 0; ghost = null;
      deck.setRange([0, IDLE_MS]);
      return;
    }
    base = stored[0].at;
    for (let i = 0; i < stored.length; i++) {
      const p = stored[i];
      const at0 = p.at - base;
      deck.schedule({ at: at0, kind: KIND, id: `s${i}`,
                      payload: { at: at0, x: p.x, y: p.y, pressure: p.pressure } });
    }
    // `max(1, …)`: two samples can carry the SAME timestamp — a coalesced pair
    // at the same millisecond — and a zero-width range is refused outright.
    deck.setRange([0, Math.max(1, Math.ceil(stored[stored.length - 1].at - base))]);
    deck.assertAt(deck.position(), KIND);
  }

  // The pad draws your line in white, the loudest thing here. The reconstruction is
  // blue, not `--hi` (the playhead's colour). `apart` is kept but not stroked; its
  // colour avoids white, blue, `--hi`, `--bad` and `--ok` so it asserts no verdict.
  // See lessons/page-draw.md#draw-20
  const C = { guess: '#7aa2f7', apart: '#ff7ab6' };

  // The two lines take turns. While a hand is down only the capture is drawn; after,
  // it fades to INK.settled and the reading fades in. 0.26 is the measured trade:
  // lines 3.5:1 apart, capture 2.1:1 on the ground (0.42 gives 2.1:1, 0.20 gives 1.7:1).
  // See lessons/page-draw.md#draw-21
  const FADE_MS = 260;
  const INK = { live: 1, settled: 0.26 };    // the capture, hand down and after
  const READ = { live: 0, settled: 1 };      // the reconstruction, the same two

  // Declared before the pad: the pad paints as it is built and calls this overlay,
  // so a `let` below it would be in its temporal dead zone.
  // See lessons/page-draw.md#draw-22
  let dirty = true;          // the derived record is stale
  let drawnPoints = 0, drawn = [], drawnApart = [];
  // These too. `handDown` is the page's own flag, since `pad.drawing()` would read
  // the pad from inside its first paint and throw.
  // See lessons/page-draw.md#draw-23
  let handDown = false;      // a pointer is on the pad right now
  let settleAt = 0;          // when it came up; 0 means nothing has been drawn

  /** 0 while the hand is down, 1 once the picture has settled, and the whole
   *  crossover in between. One number, so the two lines can never disagree
   *  about which state the page is in. */
  function phase() {
    if (handDown) return 0;
    if (!settleAt) return 1;
    return Math.min(1, (performance.now() - settleAt) / FADE_MS);
  }
  // Not `mix`: that name is already a point between two samples above.
  // See lessons/page-draw.md#draw-24
  const cross = (a, b, u) => a + (b - a) * u;
  // The capture steps back only when there is a reading to make room for: with
  // record off nothing is stored, so the line stays at full weight.
  // See lessons/page-draw.md#draw-25
  const hasReading = () => drawn.length > 1;
  const inkAlpha = () => (hasReading() ? cross(INK.live, INK.settled, phase()) : INK.live);
  const readAlpha = () => cross(READ.live, READ.settled, phase());

  // The surface is demo/shell/xy-pad.mjs, in its own pixels; it owns the capture.
  // Nothing reaches the record until record is on, but the pad still captures and
  // the evidence lane still fills at full rate (rule 2 of the capture discipline).
  // See lessons/page-draw.md#draw-26
  let recording = false, growing = false;
  // Whether the white line is the take being played. Drawing with record off leaves
  // the record alone (see onStart), so the ink must not be wiped to the playhead.
  // See lessons/page-draw.md#draw-27
  let traceIsTake = false;

  const pad = createXyPad(d.el, {
    label: 'draw a line',
    // `x` and `y`: the widely known axis names, and short labels save strip gutter.
    // See lessons/page-draw.md#draw-28
    x: { label: 'x', min: 0, max: PAD.w, unit: 'px' },
    y: { label: 'y', min: 0, max: PAD.h, unit: 'px' },
    // Every coalesced sample. It marks the derived record stale and returns; the
    // redraw is once a frame. While recording the timeline grows and the playhead
    // sits on the newest sample.
    // See lessons/page-draw.md#draw-29
    onInput: () => {
      dirty = true;
      if (recording) growing = true;
    },
    // The record is cleared only when a recording starts, so idle touches keep a take.
    // `handDown` is set for every gesture, armed or not: which line shows depends on
    // the hand, not the record.
    // See lessons/page-draw.md#draw-30
    onStart: () => {
      handDown = true;
      traceIsTake = recording;
      if (recording) { evidence = pad.trace(); ghost = null; dirty = true; }
    },
    onDone: () => {
      handDown = false;
      settleAt = performance.now();
      if (!recording) { pad.repaint(); return; }
      growing = false;
      render(); publish(); reframe(); check();
    },
    value: () => ghost,
    // A replay redraws the line up to the playhead (a time, `base + position`), while
    // playing or scrubbing; at the end the whole line is back. The gate is `growing`,
    // not `!recording`: record stays armed after a gesture ends.
    // See lessons/page-draw.md#draw-31
    upTo: () => inkLimit(),
    // how strongly the capture is drawn: full while your hand is down, a ghost
    // of itself once the reading has faded in over it. See `INK` above.
    ink: () => inkAlpha(),
    overlay: (ctx, v) => paintSecondReading(ctx, v),
    // No mark: the white line ends at the playhead, so a dot would be a second cursor.
    // See lessons/page-draw.md#draw-32
    showMark: false,
  });

  /**
   * How far the ink goes, for both lines, so white and blue always end at the same
   * instant. One function so two copies cannot drift.
   * See lessons/page-draw.md#draw-33
   */
  function inkLimit() {
    return (traceIsTake && !growing && stored.length > 1
      && deck.position() < deck.range[1]) ? base + deck.position() : null;
  }

  /**
   * Rebuild everything derived from the sparse record as it stands, without
   * re-deriving it, so check() can grade a record built another way. No canvas.
   * See lessons/page-draw.md#draw-34
   */
  function rebuild() {
    drawnPoints = 0;
    drawn = [];
    drawnApart = [];
    if (stored.length > 1) {
      const t0 = stored[0].at, t1 = stored[stored.length - 1].at;
      const step = Math.max(2, (t1 - t0) / 900);
      for (let t = t0; t <= t1; t += step) {
        const s = at(t); if (!s) continue;
        // The instant travels with the point: the rebuild walks even time steps, the
        // capture does not, so the blue line is cut by time, not by count.
        // See lessons/page-draw.md#draw-35
        drawnPoints++; drawn.push({ ...s, t });
        // the same instants, read from the two separate records
        const q = atApart(t); if (q) drawnApart.push(q);
      }
    }
    // no `0` before there is anything to count — an untouched pad has not
    // measured zero samples, it has not measured
    const err = error();
    const errApart = error(atApart);
    d.set('kept', stored.length || '');
    // `invented` is measured against `evidence` (what was captured), not `drawnPoints`,
    // which is the ~900 point rebuild resolution and would never let it reach 0.
    // See lessons/page-draw.md#draw-36
    d.set('invented', evidence.length
      ? (100 * (1 - Math.min(1, stored.length / evidence.length))).toFixed(1) : '');
    d.set('off by', err ? err.mean.toFixed(3) : '', err && err.mean < 1 ? 'ok' : err ? 'warn' : '');
    d.set('worst', err ? err.worst.toFixed(2) : '');
    d.set('as two', errApart ? errApart.mean.toFixed(3) : '');
    d.set('times worse', err && errApart && err.mean > 0 ? (errApart.mean / err.mean).toFixed(1) : '');
    dirty = false;
  }

  /** the record, then everything derived from it */
  function recompute() { decimate(); rebuild(); }

  /** The SECOND reading of the same gesture, drawn over the pad's capture.
   *  Runs inside the pad's own paint, once a frame. */
  function paintSecondReading(ctx, v) {
    if (dirty) recompute();
    if (drawn.length < 2) return;
    // The two-record reading is measured but not drawn (`drawnApart` is graded by
    // check()). The reading is drawn at weight READ: 0 while a hand is down, 1 after;
    // blue over white at half weight was 1.4:1 and unreadable.
    // See lessons/page-draw.md#draw-37
    const alpha = readAlpha();
    if (alpha <= 0) return;                  // a hand is down: your line alone
    const cut = inkLimit();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = C.guess; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let first = true;
    for (const s of drawn) {
      if (cut !== null && s.t > cut) break;
      const [px, py] = v.px(s.x, s.y);
      if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
    // The attested samples as dots, in the record's colour, so `kept` can be counted
    // on screen. They stop where the blue line stops.
    // See lessons/page-draw.md#draw-38
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.guess;
    for (const p of stored) {
      if (cut !== null && p.at > cut) break;
      const [px, py] = v.px(p.x, p.y);
      ctx.beginPath(); ctx.arc(px, py, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  /** recompute and repaint NOW — for a knob, or for a check that is about to
   *  measure the picture it just asked for. */
  function render() {
    evidence = pad.trace();
    recompute();
    pad.paint();
  }

  /**
   * The timeline is drawn as the hand moves, once a frame and not once a sample
   * (getCoalescedEvents gives a dozen per frame at 120 Hz). The playhead is parked
   * on the newest sample so the cursor follows the drawing.
   * See lessons/page-draw.md#draw-39
   */
  let growTick = 0;
  function growFrame() {
    requestAnimationFrame(growFrame);
    // The crossover needs frames that nothing else would request: no sample, playhead
    // move or page call happens while the lines trade places.
    // See lessons/page-draw.md#draw-40
    if (phase() < 1) pad.repaint();
    if (!growing) return;
    const now = performance.now();
    if (now - growTick < 40) return;       // 25 a second is smooth and cheap
    growTick = now;
    render();
    publish();
    const end = deck.range[1];
    if (Number.isFinite(end) && end > 0) deck.seek(end);
    // AFTER the seek, never before: the view is framed on where the playhead
    // is, and one tick earlier it is still on the sample before this one.
    reframe();
    view?.strip?.invalidate();
  }
  requestAnimationFrame(growFrame);

  /** How far the reconstruction sits from what actually happened. Measured
   *  against EVERY evidence sample, not against a subsample of itself. */
  // Takes a reading, not a smoothing number: `reading(t)` is anything that answers
  // where a record says the hand was at t, including the two-record one.
  // See lessons/page-draw.md#draw-41
  function error(reading = (t) => at(t, smooth)) {
    if (evidence.length < 2 || stored.length < 2) return null;
    let sum = 0, worst = 0, n = 0;
    for (const e of evidence) {
      const s = reading(e.at); if (!s) continue;
      const dx = s.x - e.x, dy = s.y - e.y;
      const dist = Math.hypot(dx, dy);
      sum += dist; if (dist > worst) worst = dist; n++;
    }
    return n ? { mean: sum / n, worst, n } : null;
  }

  /**
   * Distance as a shape: nearest point on the drawn line to each sample, time
   * ignored. `error()` asks where at time t, for playback; this asks whether the
   * ink goes through the same places. A record can be good at one and poor at the other.
   * See lessons/page-draw.md#draw-42
   */
  function shapeError(line = drawn) {
    if (evidence.length < 2 || line.length < 2) return null;
    let sum = 0, worst = 0, n = 0;
    for (const e of evidence) {
      let best = Infinity;
      for (const s of line) { const dd = (s.x - e.x) ** 2 + (s.y - e.y) ** 2; if (dd < best) best = dd; }
      const dist = Math.sqrt(best);
      sum += dist; if (dist > worst) worst = dist; n++;
    }
    return n ? { mean: sum / n, worst, n } : null;
  }


  // While playing the mark moves between samples (they fire ten times a second at
  // the default, so it would step). Paused, only the fold after a seek moves it.
  // See lessons/page-draw.md#draw-43
  observePosition(deck.transport, ({ pos }) => {
    if (!deck.playing() || stored.length < 2) return;
    const s = deck.sampleAt(KIND, pos);
    if (s && Number.isFinite(s.x)) { ghost = s; pad.repaint(); }
  });

  // The gesture as a signal: x and y against time, where a fast corner is a steep
  // edge. Drawn by the strip's `continuous` renderer through deck.sampleAt, the
  // same interpolator as the blue line and the mark.
  // See lessons/page-draw.md#draw-44
  const view = createStripView(d.el, deck, {
    size: 'auto',
    lanes: [
      { id: 'x', kind: KIND, as: 'continuous', label: 'x', min: 0, max: PAD.w,
        value: (p) => p && p.x, color: C.guess },
      { id: 'y', kind: KIND, as: 'continuous', label: 'y', min: 0, max: PAD.h,
        value: (p) => p && p.y, color: C.guess },
    ],
  });

  /**
   * The timeline opens at twice the fit, so corners are big enough to read. It is
   * the strip's own zoom, set only when the recording changes. Every caller is below
   * the strip, since `view` is a const the pad's first paint must not read.
   * See lessons/page-draw.md#draw-45
   */
  const OPEN_ZOOM = 2;
  const FIT_PAD = 0.04;              // what `fit()` leaves over: 2% either side
  function reframe() {
    const end = deck.range[1];
    if (!(end > 0)) return null;
    const span = (end * (1 + FIT_PAD)) / OPEN_ZOOM;
    const pos = deck.position();
    // Where the playhead sits in the window: the strip's 0.38, kept inside the
    // recording, and capped at 0.78 so it never fights the strip's 0.82 follow edge.
    // See lessons/page-draw.md#draw-46
    const lo = -end * (FIT_PAD / 2), hi = end * (1 + FIT_PAD / 2) - span;
    const origin = Math.min(Math.max(pos - span * 0.38, lo), Math.max(lo, hi));
    const at = Math.min(0.78, (pos - origin) / span);
    return view.strip.frame(pos, span, at);
  }

  // One position surface per page: the strip seeks on press and drag, the bar does
  // not. Record sits next to play as a transport verb, in `--rec`, not `--hi`, so it
  // does not look like the main path.
  // See lessons/page-draw.md#draw-47
  const bar = createTransportBar(d.el, deck, {
    scrub: false,
    /**
     * Reverse and both ways are allowed here: what plays is a record of a hand, so a
     * lap backwards is the same record read the other way.
     * See lessons/page-draw.md#draw-48
     */
    loopWays: true,
    extras: [{ id: 'rec', title: 'Record', label: '', aria: 'Record',
               onClick: () => setRecording(!recording) }],
  });
  // The record face is the kit's icon, not a font glyph.
  // See lessons/page-draw.md#draw-49
  setIcon(bar.extra('rec'), 'record', 'Record');

  function setRecording(on) {
    recording = on;
    growing = false;
    const b = bar.extra('rec');
    if (b) {
      b.dataset.on = on ? '1' : '';
      setIcon(b, on ? 'stop' : 'record', on ? 'Stop recording' : 'Record');
    }
    // Arming clears what was there, so the take you are about to make is the
    // whole of what the numbers describe.
    if (on) {
      pad.clear(); evidence = []; stored = []; splitX = []; splitY = [];
      ghost = null; dirty = true; traceIsTake = true;
      render(); publish(); deck.seek(0); reframe(); view.strip.invalidate();
    }
    d.log(on ? 'recording · draw on the pad' : 'stopped', on ? 'hi' : undefined);
  }

  // A group, not two sliders in a div: createSliderGroup shares one set of columns,
  // so the longer label cannot push its own lane sideways.
  // See lessons/page-draw.md#draw-50
  const knobs = createSliderGroup([
    createSlider({
      // 10 to 300 ms. Measured: above 300 ms interpolation stops rescuing a fast corner
      // (500 ms is 24.63 px against a 34 px hold); below 50 ms the error is under
      // 0.03 px and invisible. The page logs this ladder for whatever you draw.
      // See lessons/page-draw.md#draw-51
      label: 'sample every', min: 10, max: 300, step: 10, value: 100, unit: 'ms',
      onInput: (v) => { storeMs = v; render(); publish(); },
    }),
    createSlider({
      label: 'smoothing', min: 0, max: 100, step: 1, value: 100, unit: '%',
      onInput: (v) => { smooth = v / 100; render(); deck.assertAt(deck.position(), KIND); },
    }),
  ], { pair: true });
  /**
   * No clear button: arming record already empties the pad, both records, the
   * strip and the playhead together.
   * See lessons/page-draw.md#draw-52
   */
  const row = el('div', 'pos-controls foot');
  row.append(knobs.el);
  d.el.append(row);

  // The reading order, set in one place: knobs, pad, transport, timeline, then the
  // log. `append` moves nodes. The row moves whole, so verify.mjs's DOM-order
  // presses still find the same control first.
  // See lessons/page-draw.md#draw-53
  d.el.append(row, pad.el, bar.el, view.el);

  // One machine: nothing leaves the tab. Five boxes in the order a sample travels,
  // held to that list by check(). `atEnd` keeps the pad still for the harness drag.
  // The record's sub is read off the knob's opening value.
  // See lessons/page-draw.md#draw-54
  const DG_BOXES = ['Browser', 'xy pad', 'record', 'Catmull-Rom', 'transport', 'timeline'];
  const dg = createDiagram(d.el, {
    caption: 'Every sample the browser hands over is kept, a sparse record is taken from it on a '
      + 'clock, and the blue line is rebuilt from that record alone.',
    nodes: [
      { id: 'br', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        children: [
          { id: 'pad', label: 'xy pad', sub: 'pointer events', tech: 'browser',
            note: 'Reads **getCoalescedEvents** on every pointermove, so a fast stroke keeps the '
                + 'samples the screen delivered between frames, each stamped with its own '
                + 'event.timeStamp. All of them are kept, and they are the white line.' },
          { id: 'rec', label: 'record', sub: `1 per ${storeMs}ms`, tech: 'browser',
            note: 'The same stroke thinned on a clock, one sample per interval on the knob, and '
                + 'always the last one. Most of the line you see was never recorded.' },
          { id: 'spline', label: 'Catmull-Rom', sub: 'time-knotted', tech: 'graphics',
            note: 'A spline knotted on each sample\'s time, which eases to straight lines and then '
                + 'to holding the last sample as smoothing falls. The blue line and the playhead '
                + 'are both read through this one function.' },
          { id: 'deck', label: 'transport', sub: 'play, loop, seek', tech: 'browser',
            note: 'Plays the record at a quarter speed to double, loops it either way and seeks '
                + 'anywhere, asking **Catmull-Rom** where the hand was at that instant.' },
          { id: 'strip', label: 'timeline', sub: 'x and y lanes', tech: 'graphics',
            note: 'The record\'s x and y as two lanes against time, opened at twice the zoom that '
                + 'fits it. Pressing or dragging it seeks the **transport**.' },
        ] },
    ],
    links: [
      { from: 'pad', to: 'rec',
        note: 'Every coalesced sample, thinned again whenever the hand comes up or a knob moves.' },
      { from: 'rec', to: 'spline',
        note: 'The kept samples, each with the time it was taken.' },
      { from: 'spline', to: 'deck',
        note: 'A position for any instant between two kept samples.' },
      { from: 'deck', to: 'strip',
        note: 'The playhead, and the record drawn as two lanes under it.' },
      { from: 'deck', to: 'pad', back: true,
        note: 'Where the playhead is, so both lines on the pad are drawn only up to it.' },
    ],
  }, { how: true, atEnd: true });

  // Checks run once, on the first finished line, since d.assert appends and the
  // assert count is the regression test. They grade relationships between the two
  // records, which hold for any line, never line quality.
  // See lessons/page-draw.md#draw-55
  /**
   * Never for a visitor: gated on SELFCHECK from shell/selfcheck.mjs. Two claims
   * fail for a real scribble (two records can be closer at 100 ms; holding costs
   * 3.9x, not 5x); that is a question for BACKLOG.md, not a loosened threshold.
   * See lessons/page-draw.md#draw-56
   */
  let checked = false;
  function check() {
    if (!SELFCHECK) return;
    if (checked || evidence.length < 40 || stored.length < 4) return;
    checked = true;

    // RELATIVE, because the gesture is now a real one and its length is
    // whoever drew it. What has to hold for ANY line is that the sparse record
    // is genuinely sparser than what happened.
    d.assert('a gesture was recorded twice, in full and sparsely',
      stored.length >= 4 && stored.length < evidence.length / 2,
      `${evidence.length} samples in, ${stored.length} kept · ${(evidence.length / stored.length).toFixed(1)}:1`);

    // The one this page exists for: how much of the line was never recorded. Same
    // denominator as the cell (`evidence`), so the assert and readout agree.
    // See lessons/page-draw.md#draw-57
    const invented = 100 * (1 - Math.min(1, stored.length / evidence.length));
    d.assert('most of the drawn line was never recorded, at the rate the page opens on',
      invented > 80,
      `${evidence.length} samples captured, ${stored.length} kept · ${invented.toFixed(1)}% of the `
      + `line you see is joined up rather than recorded`);

    // Assert the order, not a threshold: hold worse than lerp, lerp worse than
    // spline, on the same recording.
    // See lessons/page-draw.md#draw-58
    const errs = { hold: error(atSm(HOLD)).mean, linear: error(atSm(LINEAR)).mean, catmull: error(atSm(SMOOTH)).mean };
    d.assert('smoothing beats straight lines, and straight lines beat holding',
      errs.catmull < errs.linear && errs.linear < errs.hold,
      `hold ${errs.hold.toFixed(2)} px · linear ${errs.linear.toFixed(3)} px · smoothed ${errs.catmull.toFixed(3)} px`);

    // A ratio, not a distance: a real fast corner is several pixels wrong however well
    // it is interpolated, but smoothing always beats holding by a wide margin.
    // See lessons/page-draw.md#draw-59
    d.assert('smoothing is many times closer than holding the last sample',
      errs.hold / errs.catmull > 5,
      `${(errs.hold / errs.catmull).toFixed(0)}x closer · ${errs.catmull.toFixed(3)} px against ${errs.hold.toFixed(2)} px`);

    // Three levers: keep more, interpolate better, or place samples cleverer. This
    // grades the third with the count held equal.
    // See lessons/page-draw.md#draw-60
    const measure = (pick) => { stored = pick(); rebuild(); return { n: stored.length, t: error(atSm(SMOOTH)).mean, s: shapeError().mean }; };
    const evenly = measure(onAClock);
    const bends = measure(() => whereItBends(evenly.n));
    render();

    // Measured, 30 samples: evenly in time 0.347 px (shape 0.674), where it bends
    // 3.009 px (shape 0.958). Even spacing wins because the spline is knotted on time
    // and shape-based picks space its knots unevenly.
    // See lessons/page-draw.md#draw-61
    d.assert('a line replayed on a clock wants samples spaced on that clock, not samples where it bends',
      evenly.t < bends.t && bends.n <= evenly.n,
      `${evenly.n} samples either way · in time ${evenly.t.toFixed(3)} px evenly against ${bends.t.toFixed(3)} px `
      + `where it bends (${(bends.t / evenly.t).toFixed(1)}x worse); as a shape ${evenly.s.toFixed(3)} against ${bends.s.toFixed(3)}`);

    // What the rate buys: the same gesture thinned at each interval, as one record
    // and as two. 500 ms is past the knob on purpose: both readings break there, so
    // check() does not grade it.
    // See lessons/page-draw.md#draw-62
    const keep = storeMs;
    const RATES = [20, 50, 100, 200, 300, 500];
    const OFFERED = 300;                       // the top of the knob, in ms
    const ladder = RATES.map((ms) => {
      storeMs = ms; recompute();
      return { ms, n: stored.length, one: error(atSm(SMOOTH)).mean, two: error(atApart).mean };
    });
    storeMs = keep;
    render();
    publish();
    d.log(`what the rate buys: ${ladder.map((r) =>
      `${r.ms}ms ${r.n}n ${r.one.toFixed(2)}px (${(r.two / r.one).toFixed(1)}x as two)`).join(' · ')}`);

    // One 2-D record against two 1-D records. The order (one is closer in time) holds
    // at every knob rate; the ratio moves (0.5x to 9x), so check() grades the order at
    // both ends of the ladder. Shape figures are printed, not asserted.
    // See lessons/page-draw.md#draw-63
    const rungs = ladder.filter((r) => r.ms <= OFFERED);
    const gaps = rungs.map((r) => r.two / r.one);
    const together = { t: error().mean, s: shapeError().mean };
    const apart = { t: error(atApart).mean, s: shapeError(drawnApart).mean };
    const shared = splitX.filter((a) => splitY.some((b) => b.at === a.at)).length;
    d.assert('one record of a moving point beats two records of a moving number, at every rate this page offers',
      gaps.every((g) => g > 1) && Math.max(...gaps) > 2
        && splitX.length === stored.length && splitY.length === stored.length
        && shared * 2 < stored.length,
      `${Math.min(...gaps).toFixed(1)}x to ${Math.max(...gaps).toFixed(1)}x closer across ${rungs.length} rates; `
      + `at this one ${stored.length} samples per direction either way · in time ${together.t.toFixed(3)} px as one `
      + `record against ${apart.t.toFixed(3)} px as two, as a shape ${together.s.toFixed(3)} against `
      + `${apart.s.toFixed(3)}; the two directions chose ${shared} of ${stored.length} instants in common`);

    // Transport at twenty positions. Both answers use one interpolator, so this
    // catches plumbing (lane, seek, fold, bracket, policy), not arithmetic. 0.042 px is
    // proto/paths' measured seek accuracy for this adapter, used as the width of agree.
    // See lessons/page-draw.md#draw-64
    const SEEK_TOL = 0.042;
    const t0 = stored[0].at, t1 = stored[stored.length - 1].at;
    const probes = [];
    let fresh = 0;
    for (let k = 0; k < 20; k++) {
      const raw = t0 + ((t1 - t0) * k) / 19;
      ghost = null;                        // a stale mark must not pass for a fresh one
      deck.seek(raw - base);
      const hand = truthAt(raw), rec = at(raw);
      // the same position with interpolation REFUSED: the firewall hands back
      // the last attested sample, which is this page's 34 px baseline again
      const held = deck.sampleAt(KIND, raw - base, { evidence: 'attested' });
      if (ghost) fresh++;
      probes.push({
        mark: ghost ? Math.hypot(ghost.x - hand.x, ghost.y - hand.y) : Infinity,
        rec: Math.hypot(rec.x - hand.x, rec.y - hand.y),
        held: held ? Math.hypot(held.x - hand.x, held.y - hand.y) : 0,
      });
    }
    const mean = (key) => probes.reduce((a, p) => a + p[key], 0) / probes.length;
    const mk = mean('mark'), rc = mean('rec'), hl = mean('held');
    d.assert('the playhead puts the hand where the record says it was',
      fresh === 20 && Math.abs(mk - rc) <= SEEK_TOL && hl > rc * 5,
      `${fresh}/20 seeks answered · the mark lands ${mk.toFixed(3)} px from the hand against the record's own `
      + `${rc.toFixed(3)} px (${Math.abs(mk - rc).toExponential(1)} apart); refusing to interpolate: ${hl.toFixed(2)} px`);

    // Park the playhead in the middle, so the mark below is somewhere with a
    // line under it rather than at an endpoint.
    deck.seek(deck.range[1] / 2);
    // Paint first: the pad repaints on the next frame, so reading now sees the old one.
    // See lessons/page-draw.md#draw-65
    pad.paint();

    // Graded against the strip's own fit(), measured by moving and restoring the view.
    // The 2 is typed literally, not OPEN_ZOOM: a check derived from the constant
    // stayed green with the constant set to 1.
    // See lessons/page-draw.md#draw-66
    const zoomed = reframe().pxPerSecond;
    const fitted = view.strip.fit().pxPerSecond;
    reframe();
    d.assert('the timeline opens at twice the whole recording, not fitted to it',
      fitted > 0 && Math.abs(zoomed / fitted - 2) < 0.02,
      `${zoomed.toFixed(1)} px a second against ${fitted.toFixed(1)} fitted · `
      + `${(zoomed / fitted).toFixed(2)}x · ${Math.round(deck.range[1])} ms of gesture`);

    // The suite never looks at ink, so this does. Lines are told apart by colour (the
    // capture grey, the reading blue; the grid is 29 on every channel), and each takes
    // the commonest value per bucket: the brightest is a self-crossing, not the line.
    // See lessons/page-draw.md#draw-67
    const count = () => {
      const px = pad.ctx.getImageData(0, 0, pad.el.width, pad.el.height).data;
      let grey = 0, blue = 0;
      const greys = new Map(), blues = new Map();
      const bump = (m, k) => m.set(k, (m.get(k) || 0) + 1);
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i + 1], b = px[i + 2];
        if (b - r > 40 && g > r) { blue++; bump(blues, (r << 16) | (g << 8) | b); }
        // 12: the capture's channels sit 9 apart; 20 also caught blue edges over it.
        // See lessons/page-draw.md#draw-68
        else if (r > 45 && Math.abs(b - r) < 12) { grey++; bump(greys, (r << 16) | (g << 8) | b); }
      }
      const modal = (m) => {
        let best = -1, key = 0;
        for (const [k, n] of m) if (n > best) { best = n; key = k; }
        return [(key >> 16) & 255, (key >> 8) & 255, key & 255];
      };
      return { grey, blue, capture: modal(greys), reading: modal(blues) };
    };
    const mid = count();
    d.assert('there is a line on the pad, not just numbers in cells', mid.grey > 4000,
      `${mid.grey} pixels of line`);

    // What was reported was a contrast, so a contrast is graded. Both crossover
    // states are forced: `phase()` depends only on `handDown` and `settleAt`.
    // See lessons/page-draw.md#draw-69
    const lin = (c) => { const s = c / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; };
    const lum = (p) => 0.2126 * lin(p[0]) + 0.7152 * lin(p[1]) + 0.0722 * lin(p[2]);
    const apartness = (p, q) => {
      const a1 = lum(p), a2 = lum(q);
      return (Math.max(a1, a2) + 0.05) / (Math.min(a1, a2) + 0.05);
    };
    const asHex = (p) => '#' + p.map((c) => Math.round(c).toString(16).padStart(2, '0')).join('');
    const fadeFrom = settleAt;
    handDown = true; pad.paint();
    const down = count();
    handDown = false; settleAt = performance.now() - FADE_MS; pad.paint();
    const up = count();
    d.assert('while a hand is down there is one line on the pad, and it is yours',
      down.blue === 0 && down.grey > 4000 && down.capture[0] > 200,
      `${down.grey} pixels of your line at ${asHex(down.capture)}, and ${down.blue} of anything blue`);
    // The old arrangement (reading at half weight over the capture), composited from
    // this run's measured colours, not painted.
    // See lessons/page-draw.md#draw-70
    const was = [0, 1, 2].map((i) => 0.5 * parseInt(C.guess.slice(1 + i * 2, 3 + i * 2), 16) + 0.5 * down.capture[i]);
    const tellApart = apartness(up.capture, up.reading);
    d.assert('lift it and the two lines are far enough apart to be told apart',
      up.blue > 500 && up.grey > 4000 && tellApart >= 3,
      `your line ${asHex(up.capture)} against the reading ${asHex(up.reading)} · ${tellApart.toFixed(2)}:1, `
      + `where drawing the reading at half weight over the capture gave ${asHex(was)} against `
      + `${asHex(down.capture)} · ${apartness(was, down.capture).toFixed(2)}:1`);
    // The line's end is the playhead, so the check is the line's length at three
    // positions: early < middle < end, end is the whole line. Both lines, in the
    // settled picture, so a blue line running past the white one is caught.
    // See lessons/page-draw.md#draw-71
    const inkAt = (t) => { deck.seek(t); pad.paint(); return count(); };
    const end = deck.range[1];
    const a = inkAt(end * 0.25), b2 = inkAt(end * 0.6), c2 = inkAt(end);
    deck.seek(end / 2); pad.paint();
    d.assert('both lines stop where the cursor is, so the cursor needs no mark of its own',
      a.grey < b2.grey && b2.grey < c2.grey && a.grey > 0
      && a.blue < b2.blue && b2.blue < c2.blue && a.blue > 0,
      `your line ${a.grey} -> ${b2.grey} -> ${c2.grey} and the reading ${a.blue} -> ${b2.blue} -> ${c2.blue} `
      + `at a quarter, three fifths and the end, `
      + `over ${Math.round(end)} ms`);
    // and the crossover goes back to wherever it had got to, so a check that
    // ran inside a quarter of a second does not leave the picture finished
    settleAt = fadeFrom;

    // ── the picture of how it works ──────────────────────────────────────
    // Read off the drawn SVG, not off the spec, so a box that failed to draw
    // or was drawn under another name is a red line rather than a pass.
    const dgSvg = dg.svg.getBoundingClientRect();
    const dgHost = dg.el.getBoundingClientRect();
    d.assert('the how it works picture is built and on the page',
      dg.el.isConnected && dg.svg.querySelectorAll('.pos-dg-n').length === DG_BOXES.length,
      `${dg.svg.querySelectorAll('.pos-dg-n').length} boxes, ${dg.mode} layout`);
    d.assert('it is laid out at its real width, measured rather than estimated',
      dg.measured && dgSvg.width > 0 && Math.abs(dgSvg.width - dgHost.width) <= 2,
      `svg ${dgSvg.width.toFixed(1)} px in a ${dgHost.width.toFixed(1)} px host, measured ${dg.measured}`);
    d.assert('nothing cut and nothing refused in the picture', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id} ${c.where}: ${c.shown}`).join('; ') || `none, ${dg.ties} tie(s)`);
    // The boxes against the page: each name drawn, and each one standing for
    // a thing this page really built and put on screen.
    const drawnNames = [...dg.svg.querySelectorAll('.pos-dg-lab')].map((t) => t.textContent.trim());
    const behind = {
      'xy pad': pad.el.isConnected && (pad.el.matches('[data-gesture]') || !!pad.el.querySelector('[data-gesture]')),
      record: stored.length >= 2,
      'Catmull-Rom': pointer.mode === 'catmull' && typeof pointer.interpolate === 'function',
      transport: bar.el.isConnected && deck.sched != null,
      timeline: view.el.isConnected,
    };
    const missing = DG_BOXES.filter((n) => !drawnNames.includes(n));
    const unbacked = Object.entries(behind).filter(([, ok]) => !ok).map(([n]) => n);
    d.assert('the boxes are the parts this page uses',
      missing.length === 0 && unbacked.length === 0 && drawnNames.length === DG_BOXES.length,
      `drawn ${drawnNames.join(', ')}; missing ${missing.join(', ') || 'none'}; `
      + `not on the page ${unbacked.join(', ') || 'none'}`);
  }

  /**
   * The idle loop pair must match the idle rate buttons' edge; the armed rate must
   * differ, so the check tells the defect from the design. Behind SELFCHECK, since
   * it sets data-loop to measure; it is put back only if it had a value.
   * See lessons/page-draw.md#draw-72
   */
  if (SELFCHECK) {
    const bc = (e) => (e ? getComputedStyle(e).borderColor : 'none');
    const grp = document.querySelector('.tbar-loopgrp');
    const loopBtn = grp?.querySelector('.tbar-loop');
    const wayBtn = grp ? [...grp.children].find((c) => c !== loopBtn) : null;
    const rates = [...document.querySelectorAll('.tbar-rates button')];
    const idleRate = rates.find((b) => b.getAttribute('aria-pressed') !== 'true');
    const armedRate = rates.find((b) => b.getAttribute('aria-pressed') === 'true');
    const was = loopBtn?.dataset.loop;
    if (loopBtn) loopBtn.dataset.loop = 'off';
    const edges = [bc(loopBtn), bc(wayBtn), bc(idleRate)];
    const armedEdge = bc(armedRate);
    if (loopBtn && was) loopBtn.dataset.loop = was;
    d.assert('an idle loop pair wears the same edge as the rate buttons beside it',
      !!grp && !!loopBtn && !!wayBtn && !!idleRate && !!armedRate
      && edges.every((c) => c === edges[0]) && armedEdge !== edges[0],
      `LOOP ${edges[0]} · way ${edges[1]} · a rate ${edges[2]} · the armed rate ${armedEdge}`);
  }

  render();
  publish();
  reframe();          // the empty page opens at the zoom a recording will use
  d.ready();
</script>
</html>

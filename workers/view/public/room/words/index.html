<title>Patch from words</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The requests and the ask button: a column of sentences, the button under it. */
  .cc-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; min-width: 0; }
  .cc-stack > * { flex: none; }
  .cc-stack > .pos-bgroup { width: auto; }
  .cc-h { margin: 0; font-size: 14px; color: var(--dim); font-weight: 500; }
  /* Kit defect, repaired here because shell.css is not this page's: `.step { height: 34px }`
     beats the column choice and squeezed five options into one 34 px box. Belongs in
     `.pos-choice[data-orient="column"] .pos-seg`.
     See lessons/page-room.md#room-19 */
  .cc-stack .pos-choice[data-orient="column"] .pos-seg { height: auto; }
  .cc-stack .pos-choice[data-orient="column"] .pos-seg > button { text-align: left; }
  /* A request is a sentence, not a name, so on a phone it wraps rather than
     dragging the page 104 px sideways. */
  @media (max-width: 560px) {
    .cc-stack .pos-choice[data-orient="column"] .pos-seg > button {
      white-space: normal; height: auto; min-height: 34px; text-align: left; padding-block: 6px;
    }
  }
  .cc-no { color: var(--bad); }
  .cc-stack.cc-wide { align-items: stretch; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createVoice } from '/shell/synth-voice.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createBay, printLink, checkTransforms } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  useMediumColours();

  // Words to links: Ask sends a request and this bay's port list to the wish agent (POST
  // /wish); only links passing `checkTransforms` and `bay.link` are held. One Workers AI call
  // per press (llama-3.3-70b, about 780 + 100 tokens, $0.0005, 3 s). Nothing opens on a visit.
  // See lessons/page-room.md#room-20
  const S = 'web';
  const MODEL = '@cf/meta/llama-3.3-70b-instruct-fp8-fast';
  const PRICE_IN = 0.293 / 1e6, PRICE_OUT = 2.253 / 1e6;
  const API = new URLSearchParams(location.search).get('api') || 'https://wish.positron.studio';

  // Each request stands on its own, because the agent sees one sentence and
  // nothing that was asked before it, and each press replaces the whole patch.
  const REQUESTS = [
    'play the keys through the synth to the speakers',
    'play the keys an octave higher through the synth to the speakers',
    'play the keys through the synth and the filter to the speakers',
    'record what I play into the synth and show the sound on the scope',
    'play the keys with a fifth above through the synth to the speakers',
  ];

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();

  // ── sound: a sawtooth per held note (a low-pass is inaudible on a sine) ──
  let ctx = null, bus = null, filter = null, scopeIn = null;
  // The kit voice with no filter of its own: the low-pass is the fx node, on a link.
  const voice = createVoice({ wave: 'sawtooth', level: 0.08, cutoff: null });
  function wake() {
    if (ctx) return;
    ctx = new AudioContext();
    voice.start(ctx);
    bus = voice.out();
    filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 700; filter.Q.value = 4;
    scopeIn = ctx.createAnalyser();
    scopeIn.fftSize = 2048;
    audio();
    requestAnimationFrame(frame);
  }
  function noteOn(n, vel) {
    wake();
    voice.noteOn(n, vel);
  }
  const noteOff = (n) => voice.noteOff(n);
  // The WebAudio graph follows the audio links the bay holds, and nothing else.
  function audio() {
    if (!ctx) return;
    bus.disconnect(); filter.disconnect();
    const outOf = { synth: bus, fx: filter };
    const inOf = { fx: filter, scope: scopeIn, speaker: ctx.destination };
    for (const l of bay.links()) {
      const a = outOf[l.from.split(':')[1]], b = inOf[l.to.split(':')[1]];
      if (a && b && l.from.endsWith(':audio-out') && l.to.endsWith(':audio-in')) a.connect(b);
    }
  }

  // ── the recorder keeps every note it hears and passes it on ─────────────
  const kept = [];
  let inRec = false;
  function record(e) {
    if (inRec) return;           // a link from rec back into rec must not loop
    inRec = true;
    if (e.d2) kept.push(e.d1);
    bay.send(`${S}:rec:midi-out`, e);
    inRec = false;
    pb.refresh();
  }

  // Every port has a label, because the agent reads it to know what a port is.
  const L = (label) => ({ label });
  addNodes(bay, S, ['keys', 'synth', 'fx', 'rec', 'scope', 'speaker'], {
    deliver: { 'synth:midi-in': (e) => (e.d2 ? noteOn(e.d1, e.d2) : noteOff(e.d1)), 'rec:midi-in': record },
    label: { synth: 'saw' },
    ports: {
      'keys:midi-out': L('keyboard, the notes I play'),
      'synth:midi-in': L('synth, notes in'), 'synth:audio-out': L('synth, sound out'),
      'fx:audio-in': L('low-pass filter, sound in'), 'fx:audio-out': L('low-pass filter, sound out'),
      'rec:midi-in': L('recorder, notes to record'), 'rec:midi-out': L('recorder, the notes it recorded'),
      'scope:audio-in': L('waveform, shows the sound'), 'speaker:audio-in': L('speakers'),
    },
  });

  const d = mount({ name: 'Patch from words', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('room/words');
  d.log('each Ask is one Workers AI call to llama 3.3 70B, about $0.0005, and nothing is sent until you press it');

  // ── asking ──────────────────────────────────────────────────────────────
  let chosen = 0;
  const pick = createChoice({ label: 'say', orient: 'column', at: 0,
    options: REQUESTS.map((r, i) => [r, i]), onPick: (i) => { chosen = i; } });
  const ask = createButtonGroup({ buttons: [{ id: 'ask', label: 'Ask the model', primary: true, onPress: () => go(chosen) }] });

  const patchT = createTable({ minRows: 4, empty: '', columns: [
    { key: 'line', label: 'link', grow: true, hi: true, clip: true, hover: 'line' },
    { key: 'held', label: 'held', width: 56 },
    { key: 'why', label: 'why', width: 240, clip: true, hover: 'whyfix' },
  ] });

  async function go(i) {
    const text = REQUESTS[i];
    const ports = bay.ports().map((p) => ({ id: p.id, label: p.label, dir: p.dir }));
    d.log(`asked: ${text}`);
    let out;
    try {
      const r = await fetch(`${API}/wish`, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text, ports, model: MODEL }) });
      out = await r.json().catch(() => ({}));
      if (!r.ok) { d.log(`the agent said: ${out.error || `HTTP ${r.status}`}`, 'warn'); return; }
    } catch { d.log(`nothing answered at ${API}`, 'warn'); return; }

    const u = out.usage || {};
    const cost = (u.prompt_tokens || 0) * PRICE_IN + (u.completion_tokens || 0) * PRICE_OUT;
    d.log(`answered in ${out.ms} ms, ${u.prompt_tokens ?? '?'} tokens in, ${u.completion_tokens ?? '?'} out, $${cost.toFixed(5)}`);
    for (const f of out.fixed || []) d.log(`the agent repaired what the model wrote: ${JSON.stringify(f)}`, 'warn');

    // Replace the whole patch with what passes both walls.
    voice.panic();
    for (const l of bay.links()) bay.unlink(l.id);
    const rows = [];
    for (const l of out.links || []) {
      const line = printLink({ from: l.from, to: l.to, transforms: l.transforms || [] });
      const bad = checkTransforms(l.transforms || []);
      const r = bad ? { ok: false, ...bad } : bay.link(l.from, l.to, l.transforms || [], { site: S });
      rows.push({ line, held: r.ok ? 'yes' : 'no', why: r.ok ? '' : r.why, whyfix: r.ok ? '' : `${r.why} ${r.fix || ''}`.trim() });
      if (!r.ok) d.log(`refused ${line}: ${r.why}`, 'warn');
    }
    if (!rows.length) d.log('the model proposed no links');
    patchT.set(rows);
    for (const c of patchT.el.querySelectorAll('.pos-tbl-body .pos-tbl-c')) if (c.textContent === 'no') c.classList.add('cc-no');
    d.log(`held ${rows.filter((r) => r.held === 'yes').length} of ${rows.length} links`);
    audio();
    pb.refresh();
  }

  // ── the scope, full width, drawn from whatever reaches scope:audio-in ────
  const WINDOW = 512, FULL = 0.25;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  const buf = new Float32Array(2048);
  function frame() {
    const on = bay.links().some((l) => l.to === `${S}:scope:audio-in`);
    if (on && voice.held()) {
      scopeIn.getFloatTimeDomainData(buf);
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the keyboard: a press is one event out of keys:midi-out ─────────────
  const host = el('div');
  createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; wake(); bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 100 }); pb.refresh(); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1: note, d2: 0 }); pb.refresh(); },
  });

  // ── the links as a picture ──────────────────────────────────────────────
  const pb = createPatchbay(bay, {
    flowing: () => voice.held() > 0,
    detail: (n) => [{ text: n.id === `${S}:rec` ? `${n.label}, ${kept.length} notes` : n.label || '', sans: true }],
  });

  const top = el('div', 'cc-stack');
  top.append(pick.el, ask.el);
  const patchBlock = el('div', 'cc-stack cc-wide');
  patchBlock.append(el('h3', 'cc-h', 'what the model proposed'), patchT.el);
  d.stack.add(top, wave.el, host, patchBlock, pb.el);
  window.__demo.ask = (i) => { pick.set(i, true); chosen = i; return go(i); };
  window.__demo.bay = bay;
  d.ready();
</script>

<!-- No video rule: the video panel's stage owns the picture's size, shape and fit, and a
     radius or margin inside `.pos-vp-stage` is a box inside a box.
     See lessons/page-llhls.md#llhls-1 -->
<!-- The two reference tables under the picture: option names never wrap, tracks are in `ch`
     of the mono face (31ch fits the longest name), and below 640 px of table each row
     stacks name, values, comment. The comment uses the caption's prose face.
     See lessons/page-llhls.md#llhls-2 -->
<style>
/* Registered, because `ch` resolves against each element's own font (header 10 px, rows
   11 px): it computes once on `.hls-opts`. Without `@property` a heading sits a few px off.
   See lessons/page-llhls.md#llhls-3 */
@property --hls-c1 { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --hls-c2 { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --hls-c3 { syntax: '<length>'; inherits: true; initial-value: 0px; }
.hls-tbl { container-type: inline-size; }
.hls-opts { --hls-c1: 31ch; --hls-c2: 10ch; --hls-c3: 12ch; }
.hls-opts .pos-tbl-row { grid-template-columns: var(--hls-c1) var(--hls-c2) var(--hls-c3) minmax(0, 1fr); }
.hls-opts .pos-tbl-body .pos-tbl-c:first-child { white-space: nowrap; overflow-wrap: normal; }
.hls-tbl .pos-tbl-body .pos-tbl-c:last-child { font: 400 12.5px/1.5 var(--sans); }
@container (max-width: 640px) {
  .hls-opts .pos-tbl-row { grid-template-columns: var(--hls-c2) minmax(0, 1fr); row-gap: 4px; }
  .hls-opts .pos-tbl-c:first-child, .hls-opts .pos-tbl-c:last-child { grid-column: 1 / -1; }
  /* The second table stacks the same way, for the same reason: at 375 its
     prose column was 150 px beside a 150 px name, seven words to a line. */
  .hls-loops .pos-tbl-row { grid-template-columns: minmax(0, 1fr); row-gap: 4px; }
}
</style>
<script src="/proto/remixer/hls.min.js"></script>

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt, BUILD } from '/shell/shell.mjs';
  import { RETIRED_LEG } from '/shell/live.mjs';
  import { createPresenceButton, streamSays, STREAM_CAN } from '/shell/presence.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'llhls',
    // One sentence, the index's own line. How the stream starts is the picture at the foot.
    // See lessons/page-llhls.md#llhls-4
    what: 'The tuned low-latency player, whose live input was retired on 2026-10-13.',
    readout: { latency: 's', advance: '×', buffer: 's', holes: '', stalls: '', switches: '' },
    // No control declared here and no primary button: the toggle is built below with
    // `createPresenceButton` and appended to this row, where demo/verify.mjs presses.
    // See lessons/page-llhls.md#llhls-5
    controls: [],
  });
  guard(d);

  /**
   * The control is the status: `createPresenceButton` with the `STREAM` words from
   * presence.mjs, shared with /webrtc/. A press during `starting` (about 30 s) stops, and
   * the reason rides on the badge's tooltip.
   * See lessons/page-llhls.md#llhls-6
   */
  const stream = createPresenceButton({
    of: '', showName: false, state: 'offline', says: streamSays('LL-HLS'), can: STREAM_CAN,
    // One name for both halves: the accessible label names the action, which changes with
    // the state.
    // See lessons/page-llhls.md#llhls-7
    aria: 'start or stop the stream',
    press: () => d.run('toggle'),
  });
  stream.because('nothing is publishing until you press');
  d.controls.hidden = false;
  d.controls.append(stream.el);

  /**
   * No native `controls`: they drew a scrub bar on a live stream and a second fullscreen
   * button. The toggle starts and stops, the panel's square fills the screen. Muted for autoplay.
   * See lessons/page-llhls.md#llhls-8
   */
  const video = el('video', '', null, { playsinline: '', muted: '' });
  video.muted = true;

  /**
   * A video panel whose resolution, frame rate and encoder spec are three cells with
   * reserved widths and `tabular-nums`, so a changing value moves nothing. `left: null`: no
   * presence dot, the toggle already says it.
   * See lessons/page-llhls.md#llhls-9
   */
  const panel = createVideoPanel({
    media: video,
    left: null,
    fullMode: 'hover',
    values: [
      // No label on either of these: `1280x720` and `H.264 + AAC` say what they
      // are, and a word in front of them would name what a reader is reading.
      { key: 'size', label: '', reserve: 9 },
      { key: 'fps', label: 'fps', reserve: 4 },
      { key: 'source', label: '', reserve: 12 },
    ],
  });
  /**
   * The short spec, read off workers/pub/container/server.mjs: libx264 at a fixed bitrate
   * with AAC. The rest is in the picture's note.
   * See lessons/page-llhls.md#llhls-10
   */
  /**
   * The spec is written when a picture arrives, not on load; `createPanelValues` hides its
   * row while every cell is empty, so this page only has to not write a cell early.
   * See lessons/page-llhls.md#llhls-11
   */
  const SOURCE = 'H.264 + AAC';
  d.el.append(panel.el);

  /**
   * A custom property, not `video.style.aspectRatio`: an inline style beats the shell.css
   * rules that let a panel fill a screen. `--vp-aspect` falls back to 16 / 9.
   * See lessons/page-llhls.md#llhls-12
   */
  const shape = () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    panel.values.set('size', `${w}x${h}`);
    panel.values.set('source', SOURCE);
    panel.stage.style.setProperty('--vp-aspect', `${w} / ${h}`);
  };
  video.addEventListener('loadedmetadata', shape);
  video.addEventListener('resize', shape);

  // A phone cannot be attached to a debugger, so it posts its diagnostics, batched and
  // fire-and-forget so they can never make the page worse.
  // See lessons/page-llhls.md#llhls-13
  const pending = [];
  let shipTimer = null;
  let shipTick = 0;
  let lastShipped = '';
  let repeat = 0;
  function ship(line) {
    // The phone emitted the SAME fragLoadError ~30x in one run, which pushed
    // everything useful out of the ring buffer. Collapse repeats.
    const key = line.replace(/^[\d.]+ /, '').slice(0, 60);
    if (key === lastShipped) { repeat++; return; }
    if (repeat) { pending.push(`  (previous line x${repeat + 1})`); repeat = 0; }
    lastShipped = key;
    pending.push(`${(performance.now() / 1000).toFixed(2)} ${line}`);
    if (shipTimer) return;
    shipTimer = setTimeout(async () => {
      shipTimer = null;
      const batch = pending.splice(0, pending.length).join('\n');
      if (!batch) return;
      try {
        await fetch('https://pub.positron.studio/log', {
          method: 'POST', body: batch, keepalive: true,
          headers: { 'content-type': 'text/plain' },
        });
      } catch { /* diagnostics are never load-bearing */ }
    }, 2000);
  }

  let player = null, ws = null, stalls = 0, rebuilds = 0, resyncs = 0, holes = 0, last = null;
  // `held` is the socket the publisher counts; the check reads it. Declared here rather than
  // beside `settle()`, where `stop()` above would meet it in the temporal dead zone.
  // See lessons/page-llhls.md#llhls-14
  let held = false, unwatchFps = null, abort = null, playing = false;
  /**
   * A generation: every `await` in `start()` is a place a press can land, so a cancelled start
   * must not attach a player to a socket already let go. Same as workers/rtc's join tag.
   * See lessons/page-llhls.md#llhls-15
   */
  let gen = 0;

  // ?cap=360 pins the ladder at or below 360p, the control for the decode-bound reading: ~1.0x
  // on 360p against ~0.2x on 720p means the device is the bottleneck.
  // See lessons/page-llhls.md#llhls-16
  const capH = Number(new URLSearchParams(location.search).get('cap')) || 0;

  // ?player=native|hlsjs forces the engine. On an iPhone 'auto' now resolves to
  // native (AVFoundation) — see the decision block in low-latency-player.js.
  // This is how the two get compared on ONE device reporting the same numbers.
  const forced = new URLSearchParams(location.search).get('player');
  const preferNative = forced === 'native' ? true : forced === 'hlsjs' ? false : 'auto';

  // Stamped FIRST and unconditionally: a log that cannot be attributed to a
  // build is worth very little. Asked for after a run whose result could not be
  // told apart from a fix that never loaded.
  d.log(`build ${BUILD}${forced ? `, player forced to ${forced}` : ''}`);
  ship(`BUILD ${BUILD} player=${forced || 'auto'} ua=${navigator.userAgent.slice(0, 58)}`);

  /**
   * The one control decides from the state it shows, so it cannot disagree with itself.
   * See lessons/page-llhls.md#llhls-17
   */
  /**
   * `stream.state()` is a function on the presence api; comparing the bare property to
   * 'offline' is always false.
   * See lessons/page-llhls.md#llhls-18
   */
  d.on('toggle', () => (stream.state() === 'offline' ? start() : stop()));

  /**
   * Let it go: closing the socket is all this end does; the publisher's sweep stops about a
   * minute later.
   * See lessons/page-llhls.md#llhls-19
   */
  function stop() {
    gen++;                                  // anything mid-start bails on the next line it reaches
    abort?.abort(); abort = null;
    unwatchFps?.(); unwatchFps = null;
    // The socket goes first and `ws` is nulled with it, or the element's teardown events would
    // let `settle()` flick the toggle back to `starting`.
    // See lessons/page-llhls.md#llhls-20
    try { ws?.close(); } catch { /* already gone */ }
    ws = null;
    held = false;
    playing = false;
    try { player?.destroy(); } catch { /* already gone */ }
    player = null;
    try { video.pause(); } catch { /* fine */ }
    panel.values.set('fps', '');
    panel.values.set('size', '');
    panel.values.set('source', '');
    stream.set('offline').because('the publisher stops about a minute after the last viewer goes');
    d.log('let the publisher go. it stops about a minute after the last viewer goes');
  }

  /* The test pattern is retired (input deleted, pub answers 410), so every tier is light and a
     press says so at once. The player is unchanged in src/low-latency-player.js, used by
     /video/llhls/.
     See lessons/page-llhls.md#llhls-21 */
  const LIGHT = true;

  async function start() {
    if (player) return;
    stream.set('offline').because(RETIRED_LEG);
    d.log(`${RETIRED_LEG}: its input and the publisher behind it are deleted, so nothing will come`, 'bad');
    if (SELFCHECK) await d.run('check');
  }

  /**
   * `on` is a measurement: `starting` becomes `on` when the element is handed a decodable
   * picture. Latched, not sampled, because a paused element still holds the socket and the
   * control describes the source, not the player.
   * See lessons/page-llhls.md#llhls-22
   */
  function settle() {
    if (!ws) return;
    if (!playing && (video.videoWidth > 0 || video.currentTime > 0)) playing = true;
    stream.set(playing ? 'online' : 'coming')
      .because(playing ? 'press to stop it' : 'the container and its encoder are waking. press again to stop');
  }
  video.addEventListener('playing', settle);
  video.addEventListener('loadeddata', settle);
  video.addEventListener('resize', settle);

  if (capH) {
    setInterval(() => {
      const H2 = player?.hls;
      if (!H2?.levels?.length) return;
      const idx = H2.levels.map((l, i) => [l.height, i]).filter(([hh]) => hh <= capH)
        .sort((a, b) => b[0] - a[0])[0]?.[1];
      if (idx != null && H2.autoLevelCapping !== idx) {
        H2.autoLevelCapping = idx;
        d.log(`capped to <=${capH}p (level ${idx})`);
        ship(`CAP <=${capH}p level=${idx}`);
      }
    }, 1000);
  }

  d.on('check', async () => {
    // The publisher claim, read off the socket.
    // See lessons/page-llhls.md#llhls-23
    /**
     * It reads the state through the call and requires a string, so it can fail.
     * See lessons/page-llhls.md#llhls-24
     */
    const said = (stream.badge.textContent || '').trim();
    const state = stream.state();
    if (!LIGHT) d.assert('publisher held by this page',
      held && typeof state === 'string' && state !== 'offline',
      `toggle reads ${JSON.stringify(said)}, state ${state}, socket ${held ? 'held' : 'let go'}`);
    /**
     * One button in the row, the toggle, and nothing in it is a primary.
     * See lessons/page-llhls.md#llhls-25
     */
    const btns = [...d.controls.querySelectorAll('button')];
    d.assert('one control, and it is the stream toggle',
      btns.length === 1 && btns[0] === stream.el && !d.controls.querySelector('.pos-pri'),
      `${btns.length} control(s), classes ${btns.map((b) => b.className || '(none)').join(' ')}`);
    /**
     * Each cell is written at its widest and narrowest and the row measured both times, so a
     * cell shoving its neighbour goes red without `reserve`. Synchronous, nothing painted between.
     * See lessons/page-llhls.md#llhls-26
     */
    {
      const row = panel.values.el;
      const was = panel.values.keys().map((k) => [k, panel.values.cell(k).textContent]);
      const write = (o) => { for (const [k, v] of Object.entries(o)) panel.values.set(k, v); };
      /**
       * The row is hidden before a press, so the check writes `source` itself in both states and
       * `narrow > 0` is part of the assert, not an assumption.
       * See lessons/page-llhls.md#llhls-27
       */
      write({ size: '', fps: '', source: SOURCE });
      const narrow = row.getBoundingClientRect().width;
      write({ size: '1280x720', fps: '59.9' });
      const wide = row.getBoundingClientRect().width;
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('a footer number cannot shove the one beside it',
        narrow > 0 && Math.abs(wide - narrow) < 0.5,
        `${narrow.toFixed(1)} px with the other cells empty against ${wide.toFixed(1)} px at their widest`);
      /**
       * Grades the mechanism, not this run's state: empty every cell and the row must hide, write
       * one back and it must return. Synchronous with the readings put back.
       * See lessons/page-llhls.md#llhls-28
       */
      const keys = panel.values.keys();
      for (const k of keys) panel.values.set(k, '');
      const goneWhenEmpty = !panel.values.shown();
      panel.values.set('source', SOURCE);
      const backWhenWritten = panel.values.shown();
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('the footer says nothing until something is coming in',
        goneWhenEmpty && backWhenWritten,
        `with every cell empty the value row was ${goneWhenEmpty ? 'absent' : 'STILL ON SCREEN'}, `
        + `and one cell later it was ${backWhenWritten ? 'back' : 'STILL ABSENT'}, `
        + `with the stream reading ${stream.state()} and ${keys.length} cells on the row`);
    }
    // The stream checks are gone with the stream (see `LIGHT`); nothing here asks Cloudflare.
    // See lessons/page-llhls.md#llhls-29
    d.assert('nothing in the picture was cut or refused', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id}: ${c.full}`).join(' / ') || 'none');
  });

  /**
   * How it works, including how it stops, read off workers/pub/worker.mjs and
   * workers/pub/container/server.mjs.
   * See lessons/page-llhls.md#llhls-30
   */
  const dg = createDiagram(d.el, {
    caption: 'Retired 2026-10-13: the input and the publisher drawn here are deleted, so a press now says so and stops. '
      + 'Nothing was publishing until somebody opened this page and pressed the control, '
      + 'and it stopped about a minute after the last viewer let go. The viewers were counted '
      + 'because ffmpeg sending video makes no requests of its own, so a container that slept '
      + 'on request idleness would go to sleep under somebody who was watching.',
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser',
        children: [
          { id: 'ctl', label: 'socket', sub: 'WebSocket', tech: 'browser',
            note: 'The control at the top of the page opens one socket to the publisher and '
                + 'holds it. That socket is the count: there is no start button on the far '
                + 'side, only an arrival and a departure.' },
          { id: 'play', label: 'player', sub: 'hls.js or native', tech: 'browser',
            note: 'Waits until the child playlist lists two **EXTINF** segments, because '
                + 'Cloudflare answers the master playlist with a 200 long before it has one. '
                + 'Then hls.js 1.7.1 runs unpatched, with the options and watchdogs listed '
                + 'under this picture.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'worker, container, Stream', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'pub', label: 'Pub', sub: 'Durable Object', tech: 'cloudflare',
            note: 'The first socket in starts the publish and the last one out arms a 30 s '
                + 'alarm. The sweep needs two idle turns, so a reload costs nothing and about '
                + 'a minute of nobody watching stops the encoder.' },
          { id: 'ff', label: 'ffmpeg', sub: 'container', tech: 'cloudflare',
            note: 'Burns a clock into a test pattern and sends it as H.264 at a constant '
                + 'bitrate, a keyframe every segment and no B-frames, which is what '
                + 'Cloudflare needs to run its low latency pipeline at all.' },
          { id: 'stream', label: 'Stream', sub: 'LL-HLS', tech: 'cloudflare',
            note: 'Cuts the feed into 2 s segments and half second parts, one of which is '
                + 'independently decodable. That is why a latency target inside one keyframe '
                + 'interval is not reachable however the player is configured.' },
        ] },
    ],
    links: [
      // `/watch` is a hibernatable socket: `viewers()` is `getWebSockets().length`, one `hello` goes
      // down on connect and nothing sent up is read. /webrtc/ carries the same label.
      // See lessons/page-llhls.md#llhls-31
      { from: 'ctl', to: 'pub', label: 'wss /watch',
        note: 'A hibernatable WebSocket to **wss://pub.positron.studio/watch**. One hello with '
            + 'the viewer count comes down and nothing goes up, because the count is '
            + '**getWebSockets().length** and a close is the only departure the Pub object sees.' },
      { from: 'pub', to: 'ff',
        note: 'Start on the first viewer, stop on the sweep. A leg that dies while somebody '
            + 'is still watching is restarted by the same sweep 30 s later.' },
      // No label: the gap between two boxes in one container is 16 px, so what travels goes in the note.
      // See lessons/page-llhls.md#llhls-32
      { from: 'ff', to: 'stream',
        note: 'RTMPS into one live input, fed the same burned in picture the WebRTC page '
            + 'gets on a second input, because Cloudflare will not serve WHEP from an '
            + 'RTMPS input.' },
      { from: 'stream', to: 'play', label: 'LL-HLS', back: true,
        note: 'A playlist every couple of seconds and the parts named in it. A part missing '
            + 'at the live edge is ordinary and the player retries rather than failing.' },
    ],
  }, { how: true, atEnd: true });

  /**
   * What it takes to get low latency out of hls.js, as two tables because a note over forty words
   * fails `dg.cuts`. Values are what src/low-latency-player.js passes; defaults are hls.js 1.7.1's,
   * from `positron-streaming`. Lines equal to the default are left out.
   * See lessons/page-llhls.md#llhls-33
   */
  const more = createStack();
  const knobs = createTable({
    columns: [
      // The px widths are table.mjs's own fallback and are replaced below, in
      // `ch`, by the page's stylesheet: see `.hls-opts` at the top of the page.
      { key: 'k', label: 'option', width: 200, hi: true },
      { key: 'def', label: 'default', width: 70 },
      { key: 'rec', label: 'recommended', width: 90, hi: true },
      { key: 'why', label: 'why', grow: true },
    ],
  });
  knobs.set([
    { k: 'maxLiveSyncPlaybackRate', def: '1', rec: '1.05',
      why: 'At 1 the latency controller inside hls.js never runs, so a player that starts late stays late. The same stream parked at 7.6 s one run and 15.4 s the next.' },
    { k: 'liveSyncDuration', def: '3 segments', rec: '3 s',
      why: 'Cloudflare advertises a 1.5 s hold back on a 2 s keyframe interval, and a target inside one keyframe interval cannot be held. It only counts if passed to the constructor.' },
    { k: 'startFragPrefetch', def: 'false', rec: 'true',
      why: 'Loads the first fragment before the media element attaches, so both loaders are already moving when playback may begin.' },
    { k: 'initialLiveManifestSize', def: '1', rec: '3',
      why: 'Refuses to start before the playlist holds 3 segments. The audio playlist advances in lockstep with the video, so waiting for depth in one waits for both.' },
    { k: 'startOnSegmentBoundary', def: 'false', rec: 'true',
      why: 'Only one part per 2 s segment is independently decodable, so a boundary is the one place both tracks can start from scratch. It costs up to a segment of latency.' },
    { k: 'capLevelOnFPSDrop', def: 'false', rec: 'true',
      why: 'Steps down a rendition when frames are dropped. It misses the iPhone that crawls at 0.2x while dropping 3 frames of 507, which is why the wrapper also caps on advance.' },
    { k: 'backBufferLength', def: 'Infinity', rec: '30 s',
      why: 'Stops played media piling up in memory on a live player that stays open for hours.' },
    { k: 'manifestLoadingMaxRetry', def: '1', rec: 'Infinity',
      why: 'A stream that is not up yet is retried inside hls.js instead of ending the instance.' },
    { k: 'manifestLoadingRetryDelay', def: '1000 ms', rec: '3000 ms',
      why: 'The first manifest retry waits 3 s while the container and ffmpeg come up.' },
    { k: 'manifestLoadingMaxRetryTimeout', def: '64000 ms', rec: '8000 ms',
      why: 'Caps the backoff at 8 s, so a stream that comes up is found within seconds.' },
    { k: 'fragLoadingMaxRetry', def: '6', rec: '4',
      why: 'A part missing at the live edge is normal. One retry turned that into rebuild storms that crashed the tab, and the slow default took 3 to 5 minutes to notice a real change of stream.' },
    { k: 'fragLoadingRetryDelay', def: '1000 ms', rec: '500 ms',
      why: 'A part that is about to exist is asked for again quickly.' },
    { k: 'fragLoadingMaxRetryTimeout', def: '64000 ms', rec: '4000 ms',
      why: 'Keeps a missing fragment from holding the player for a minute. The three loading keys are deprecated in 1.7.1 and log a warning, and they still work.' },
  ]);
  const loops = createTable({
    columns: [
      { key: 'k', label: 'behaviour', width: 150, hi: true },
      { key: 'why', label: 'why no option does it', grow: true },
    ],
  });
  loops.set([
    { k: 'native HLS on Safari and iPhone',
      why: 'Chosen when ManagedMediaSource exists. On desktop Safari native played at 0.961x and 5.25 s, and hls.js at 0.344x and 7.71 s with 2 errors.' },
    { k: 'play only once audio and video overlap',
      why: 'At start Cloudflare lands audio seconds behind video, so the element had 0.05 s to play while video held 5 s. It waits for 1 s of both, 8 s at most.' },
    { k: 'cap on rate of advance',
      why: 'Below 0.8x for 6 ticks of 500 ms it steps the rendition down, because a phone can crawl with a full buffer and no dropped frames.' },
    { k: 'drift seek governor',
      why: 'At most one seek to the edge every 10 s and only with 1.5 s buffered, and after 3 refusals it raises its own target by 1 s, up to 6 s. A seek every 2 to 3 s aborted the very loads it needed.' },
    { k: 'never seek backwards',
      why: 'After Cloudflare swaps the video the live sync position can point behind the playhead, and obeying it makes things worse.' },
    { k: 'no seek over missing audio',
      why: 'Video ahead with nothing in the overlap means an audio segment is late. Seeking cannot make one and once opened a 5.5 s hole, so it waits 12 ticks instead.' },
    { k: 'skip a hole',
      why: 'The gap handling in hls.js took about 20 s. This skips to the next real range after 3 confirming ticks, once per target.' },
    { k: 'rebuild on a fatal manifest error',
      why: 'A page opened before the broadcast gets an empty manifest, and stopLoad, loadSource and startLoad leave the instance wedged. Only destroying it and building a new one recovers.' },
    { k: 'media error recovery',
      why: 'recoverMediaError twice, with swapAudioCodec on the second, before anything blunter.' },
    { k: 'one rate limit on every rebuild',
      why: 'A 3 s floor and a 4 s cooldown across every trigger, because rebuild storms crashed the tab.' },
    { k: 'source watchdog',
      why: 'An edge frozen for 12 s means the origin died, and Cloudflare mints a new video on every encoder reconnect, which no seek recovers. On the native path the playhead must be frozen too.' },
    { k: 'player watchdog',
      why: 'A playhead frozen for 6 s gets a seek, and after 2 failed seeks a rebuild.' },
    { k: 'play again on a visible tab',
      why: 'Chrome pauses muted video in a background tab and nothing in hls.js calls play() again.' },
    { k: 'latency from PROGRAM-DATE-TIME',
      why: 'hls.latency froze at 1.7 s against 8.4 s true during an ingest pause, so the wall clock in the playlist is the honest reading.' },
  ]);
  // Reference text is read top to bottom, not scrolled inside a box.
  knobs.el.style.setProperty('--tbl-h', 'none');
  loops.el.style.setProperty('--tbl-h', 'none');
  // The column layout and the prose face live in the page's <style>, keyed on
  // these two classes, so neither table.mjs nor any other page is touched.
  knobs.el.classList.add('hls-tbl', 'hls-opts');
  loops.el.classList.add('hls-tbl', 'hls-loops');
  more.titled('hls.js options', knobs);
  more.titled('what the wrapper adds', loops);
  dg.el.after(more.el);

  d.log('nothing is publishing until you press the control. pressing it again lets go');
  d.ready();
</script>

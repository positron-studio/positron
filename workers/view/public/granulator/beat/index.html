<title>Beat granulator</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The tempo the grains follow, on Play's row. */
  .cc-top { align-items: center; flex-wrap: wrap; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { compile } from '/shell/sclang-lite.mjs';
  import { createPanelValues } from '/shell/video-panel.mjs';
  import { createGrainRig, WINDOW_S } from '/granulator/grain-rig.mjs';
  import { addNodes, addPorts } from '/shell/nodes.mjs';
  import { PROGRAM, PATCHES, RING_SECONDS, valuesOf } from '/granulator/grain-ring.mjs';
  import { createTempoDetector, STEADY, steady } from '/radio/tempo.mjs';

  // Beat granulator: /granulator/grains/'s rig on the Ida recording and Dub patch, plus
  // /radio/tempo.mjs on the same sound, on its own wire into web:grains:tempo-in. Only what
  // reaches the engine is put on the beat (time, density, back, `\lock`); the knobs keep theirs.
  // See lessons/page-granulator.md#granulator-1
  const d = mount({ name: 'Beat granulator', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('granulator/beat');

  const NODE = 4000, BUF = 0, DEF = 'gring';
  const secs = (v) => (v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`);
  const times = (v) => `${v.toFixed(2)}x`;
  // sampler/060's seven knobs, as they are there.
  const CONTROLS = [
    { name: 'size', label: 'size', kind: 'knob', min: 0.02, max: 4, warp: 'exp', fmt: secs },
    { name: 'density', label: 'density', kind: 'knob', min: 0.5, max: 64, warp: 'exp', fmt: (v) => `${v < 10 ? v.toFixed(1) : Math.round(v)}/s` },
    { name: 'pitch', label: 'pitch', kind: 'knob', min: 0.25, max: 4, warp: 'exp', fmt: times },
    { name: 'back', label: 'back', kind: 'knob', min: 0, max: 4, warp: 'lin', fmt: secs },
    { name: 'speed', label: 'speed', kind: 'knob', min: 0, max: 2, warp: 'lin', fmt: times },
    { name: 'scatter', label: 'scatter', kind: 'knob', min: 0, max: 1, warp: 'lin', fmt: (v) => `${Math.round(v * 100)}%` },
    { name: 'freeze', label: 'freeze', kind: 'steps', choices: [{ label: 'off', value: 0 }, { label: 'on', value: 1 }] },
  ];
  const NAMES = CONTROLS.map((c) => c.name);
  const FIXED = ['jitter', 'detune', 'pan', 'tone', 'echo', 'time', 'dark', 'drop', 'ramp', 'dir', 'amp'];
  const pick = (p, names) => Object.fromEntries(names.map((n) => [n, valuesOf(p)[n]]));
  // Dub first: the page opens on it.
  const LIST = [PATCHES.find((p) => p.name === 'Dub'), ...PATCHES.filter((p) => p.name !== 'Dub')];

  // Echo times on the beat, from a quarter to two beats. Dub's is a dotted eighth, three
  // quarters of a beat, the classic dub delay.
  // See lessons/page-granulator.md#granulator-2
  const BEAT_FRACTIONS = [1 / 4, 3 / 8, 1 / 2, 3 / 4, 1, 3 / 2, 2];
  const OWN_BEATS = { Dub: 3 / 4 };
  const MAX_TIME = 1.5;              // the program's DelayC holds 1.5 s
  const TIMED = ['time', 'density', 'back'];
  const want = { ...valuesOf(LIST[0]) };   // what the knobs and the patch set, before the beat
  let rig = null;
  let grid = null;                   // the tempo the grains follow: { bpm, beatAt, confidence }
  let lastReading = null, readingsIn = 0;
  const locked = () => !!grid;
  const timeBeats = (beat) => {
    const own = OWN_BEATS[rig?.api.patch()];
    if (own) return own;
    const r = want.time / beat;
    return BEAT_FRACTIONS.filter((f) => f * beat <= MAX_TIME).reduce((a, f) => (Math.abs(Math.log(f / r)) < Math.abs(Math.log(a / r)) ? f : a), 1 / 4);
  };
  /** What a control is sent to the engine as: on the beat once there is a tempo. */
  function onBeat(name) {
    const v = want[name];
    if (!locked() || !TIMED.includes(name)) return v;
    const beat = 60 / grid.bpm;
    if (name === 'time') return Math.min(MAX_TIME, beat * timeBeats(beat));
    if (name === 'density') return Math.max(1, Math.round(v * beat)) / beat;
    return Math.max(1, Math.round(v / (beat / 4))) * (beat / 4);   // back
  }

  // ── the program: compiled as the page opens, pure JavaScript, no fetch ───
  const t0 = performance.now();
  const good = compile(PROGRAM, { name: DEF });
  const compileMs = performance.now() - t0;
  if (!good.ok) d.log(`the granulator's program did not compile: ${good.message}`, 'bad');

  // ── the engine, behind the rig's contract (as sampler/060's) ─────────────
  let eng = null, ctx = null, mixNow = 1;
  const T = { bufferBytes: RING_SECONDS * 48000 * 4, compileMs: +compileMs.toFixed(1) };
  const timedNow = () => [...TIMED.flatMap((n) => [n, onBeat(n)]), 'lock', locked() ? 1 : 0];
  function sendTimed() { if (eng) eng.send('/n_set', NODE, ...timedNow()); }
  const engine = {
    label: 'grain ring',
    mixes: true,
    async boot({ ctx: ac, input, grain, log }) {
      ctx = ac;
      const t1 = performance.now();
      if (!good.ok) throw new Error('the program did not compile');
      eng = await bootScsynth({
        audioContext: ctx, input, log,
        onReply: (m) => {
          if (m[0] !== '/grain') return false;
          const pos = m[3], head = m[5];
          grain({ pos, ago: ((((head - pos) % 1) + 1) % 1) * RING_SECONDS, dur: m[4], voice: 0, rate: m[6] });
          return true;
        },
      });
      eng.out.gain.value = 0;
      T.moduleMs = Math.round(eng.moduleMs); T.bootMs = Math.round(eng.bootMs);
      const alloc = await eng.sendAndWait((m) => (m[0] === '/done' || m[0] === '/fail') && (m[1] === '/b_alloc' || m[1] === '/b_allocPtr'),
        5000, '/b_alloc', BUF, RING_SECONDS * ctx.sampleRate, 1);
      if (!alloc || alloc[0] !== '/done') throw new Error('the ring buffer was not allocated');
      const done = await eng.sendAndWait((m) => m[0] === '/done' && m[1] === '/d_recv', 5000, '/d_recv', good.bytes);
      if (!done) throw new Error('the engine never said it had the definition');
      const vals = Object.fromEntries(Object.keys(want).map((n) => [n, onBeat(n)]));
      const go = await eng.sendAndWait((m) => m[0] === '/n_go' || (m[0] === '/fail' && m[1] === '/s_new'), 5000,
        '/s_new', DEF, NODE, 1, 0, 'buf', BUF, 'inbus', 2, 'mix', mixNow, ...Object.entries(vals).flat(), 'lock', locked() ? 1 : 0);
      if (!go || go[0] !== '/n_go') throw new Error('the granulator did not start');
      T.startMs = Math.round(performance.now() - t1);
      log(`the granulator up ${T.startMs} ms after Play, the ${good.bytes.length} B definition compiled in ${T.compileMs} ms`);
      return { meter: eng.meter, out: eng.out, timing: T, scsynth: eng };
    },
    land() {
      eng.send('/n_set', NODE, 'sync', 1);
      setTimeout(() => eng.send('/n_set', NODE, 'sync', 0), 40);
      // A patch's own echo on the beat (Dub's three quarters) is the patch's.
      sendTimed();
    },
    // Sound has just come in: grains reach back only as far as it goes (grain-ring.mjs `have`).
    fresh() {
      eng.send('/n_set', NODE, 'fresh', 1);
      setTimeout(() => eng.send('/n_set', NODE, 'fresh', 0), 40);
    },
    knob(name, v) {
      if (name === 'mix') { mixNow = v; eng.send('/n_set', NODE, 'mix', v); return; }
      want[name] = v;
      eng.send('/n_set', NODE, name, onBeat(name));
    },
    fixed(set) {
      Object.assign(want, set);
      eng.send('/n_set', NODE, ...Object.keys(set).flatMap((n) => [n, onBeat(n)]));
    },
    run(on) { eng.send('/n_run', NODE, on ? 1 : 0); },
    async read(name) {
      const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === name, 3000, '/s_get', NODE, name);
      return r ? Number(r[3]) : null;
    },
    glitches: () => { try { return eng?.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } },
    // On the beat, density and back read back on the beat, not at the
    // knob: the rig's own patch check holds them to within an octave.
    moving: () => (locked() ? ['density', 'back'] : []),
  };

  // ── the tempo, on web:grains:tempo-in: every reading is followed ─────────
  function tempoIn(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm' || !(ev.v > 0)) return;
    readingsIn++;
    lastReading = ev;
    const moved = !grid || grid.bpm !== ev.v;
    const beatAt = Number.isFinite(ev.beatAt) ? ev.beatAt : (grid?.beatAt ?? ctx?.currentTime ?? 0);
    grid = { bpm: ev.v, beatAt, confidence: ev.confidence };
    if (moved) sendTimed();
    showTempo();
  }

  // `\beat` on every grid beat: a 10 ms timer on the audio clock raises it to 1 and back to 0
  // 15 ms later (the program's Phasor resets on the rise), so a beat lands within a few ms.
  // See lessons/page-granulator.md#granulator-3
  let nextBeat = null, pulseGrid = null, pulses = 0, pulser = 0;
  function pulse() {
    if (!eng || !ctx || !rig.api.playing() || !locked()) { nextBeat = null; return; }
    const per = 60 / grid.bpm, now = ctx.currentTime;
    // A new reading moves the grid: the next beat is the first of it after now.
    if (nextBeat == null || pulseGrid !== grid || nextBeat < now - per) {
      pulseGrid = grid;
      nextBeat = grid.beatAt + Math.ceil((now - 0.004 - grid.beatAt) / per) * per;
    }
    if (now >= nextBeat - 0.004) {
      eng.send('/n_set', NODE, 'beat', 1);
      setTimeout(() => eng?.send('/n_set', NODE, 'beat', 0), 15);
      pulses++;
      nextBeat += per;
    }
  }

  // ── the tempo detector, on the same sound the granulator records ─────────
  let bay = null, det = null, TEMPO_OUT = '', TEMPO_IN = '', TEMPO_GRAINS = '', RADIO_OUT = '';
  const beats = [];                  // { at, c }: a beat instant on this tab's audio clock, and the reading's confidence
  function beatsIn(ev) {
    if (ev?.of !== 'param' || ev.name !== 'bpm' || !Array.isArray(ev.beats) || !steady(ev)) return;
    for (const b of ev.beats) if (Number.isFinite(b)) beats.push({ at: b, c: ev.confidence ?? 1 });
  }
  function wire({ bay: b, hold, ports }) {
    bay = b;
    const S = 'web';
    RADIO_OUT = ports.RADIO_OUT;
    TEMPO_IN = `${S}:tempo:audio-in`; TEMPO_OUT = `${S}:tempo:value-out`;
    const WAVE_BEATS = `${S}:wave:value-in-2`;
    // The grains' own input for the tempo, so its wire is not one more on the knobs' run into
    // web:grains:value-in.
    // See lessons/page-granulator.md#granulator-4
    TEMPO_GRAINS = `${S}:grains:tempo-in`;
    addNodes(bay, S, ['tempo'], { ports: { 'tempo:audio-in': { label: 'tempo detector' }, 'tempo:value-out': { label: 'tempo' } } });
    // Two ports on nodes the rig already built.
    addPorts(bay, S, { [TEMPO_GRAINS]: { label: 'tempo', deliver: (ev) => tempoIn(ev) },
      [WAVE_BEATS]: { label: 'beats', deliver: (ev) => beatsIn(ev) } });
    hold(RADIO_OUT, TEMPO_IN);
    hold(TEMPO_OUT, TEMPO_GRAINS);
    hold(TEMPO_OUT, WAVE_BEATS);
  }
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
  function audio({ ctx: ac, bus }) {
    const pull = ac.createGain(); pull.gain.value = 0; pull.connect(ac.destination);
    det = createTempoDetector(ac, { pull, playing: () => rig.api.playing(), onReading: (ev) => bay.send(TEMPO_OUT, ev) });
    if (holds(RADIO_OUT, TEMPO_IN)) bus.connect(det.in);
    pulser ||= setInterval(pulse, 10);
  }

  // The tempo the grains follow and how sure that reading was, in the kit's
  // panel values.
  const tempoVals = createPanelValues([{ key: 'bpm', reserve: 9 }, { key: 'conf', label: 'confidence', reserve: 4 }]);
  function showTempo() {
    const r = lastReading;
    tempoVals.set('bpm', grid ? `${grid.bpm.toFixed(1)} bpm` : '');
    tempoVals.set('conf', r && Number.isFinite(r.confidence) ? r.confidence.toFixed(2) : '');
  }

  // ── the self check's own part, run inside the rig's while the sound plays ─
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  /** How tightly the grains of the last `ms` sit on the beat grid: 1 all on one
   *  phase of it, 0 spread evenly. Each grain's time (when its report reached
   *  this tab) against the grid of `n` grains a beat. */
  const onGrid = (evs, bpm, beatAt, n) => {
    const per = 60 / bpm / n;
    let c = 0, s = 0;
    for (const e of evs) { const a = 2 * Math.PI * ((e.at - beatAt) / per); c += Math.cos(a); s += Math.sin(a); }
    return evs.length ? Math.hypot(c, s) / evs.length : 0;
  };
  async function check({ events }) {
    d.assert('it opened on the Ida recording and on Dub', rig.api.source() === 'ida' && LIST[0].name === 'Dub',
      `${rig.api.source()}, ${LIST[0].name}, now ${rig.api.patch()}`);
    // The grains follow every reading, so wait for a sure one, not the first.
    for (let i = 0; i < 40 && !(grid && steady(lastReading)); i++) await wait(500);
    d.assert('the tempo detector finds a steady beat in the Ida recording', !!grid && steady(lastReading),
      grid ? `${grid.bpm} bpm at confidence ${grid.confidence}` : `last reading ${JSON.stringify(lastReading && { v: lastReading.v, c: lastReading.confidence })}`);
    if (!grid) return;
    const toGrains = bay.links().filter((l) => l.from === TEMPO_OUT && l.to.includes(':grains:'));
    const sent = toGrains.filter((l) => l.to === TEMPO_GRAINS).reduce((n, l) => n + (l.sent || 0), 0);
    d.assert('the tempo reaches the granulator on a wire of its own, web:tempo:value-out into web:grains:tempo-in and not into the knobs\' value-in',
      toGrains.length === 1 && toGrains[0].to === TEMPO_GRAINS && sent > 0 && readingsIn > 0 && sent >= readingsIn,
      `${toGrains.map((l) => l.to).join(', ')}; ${sent} sent on the wire, ${readingsIn} taken by the grains, following ${grid.bpm} bpm`);
    const g0 = { ...grid };
    const tOn = await engine.read('time');
    const g1 = { ...grid };
    const fit = (g) => Math.abs(tOn - 0.75 * 60 / g.bpm);
    const miss = Math.min(fit(g0), fit(g1));
    d.assert('the echo time in the engine is three quarters of the detected beat, within 3 ms', miss < 0.003,
      `engine ${(tOn * 1000).toFixed(1)} ms, 3/4 of a beat at ${g1.bpm} bpm is ${(0.75 * 60000 / g1.bpm).toFixed(1)} ms, off by ${(miss * 1000).toFixed(2)} ms; Dub's own is ${want.time * 1000} ms`);
    const dens = await engine.read('density'), back = await engine.read('back');
    const beat = 60 / grid.bpm, nPer = dens * beat, qBack = back / (beat / 4);
    d.assert('density is a whole number of grains a beat and back a whole number of quarter beats',
      Math.abs(nPer - Math.round(nPer)) < 0.01 && Math.abs(qBack - Math.round(qBack)) < 0.01,
      `${dens.toFixed(3)}/s is ${nPer.toFixed(3)} a beat (knob ${want.density.toFixed(2)}/s), back ${back.toFixed(4)} s is ${qBack.toFixed(3)} quarter beats (knob ${want.back.toFixed(3)} s)`);
    const lockOn = await engine.read('lock');
    d.assert('the beat grid is on in the engine and raised on every beat', lockOn === 1 && pulses > 0, `lock ${lockOn}, ${pulses} beats raised`);
    // The grains on the grid: the same grains against the detected beat's grid
    // and against one 1.37 times as fast, which nothing on the page plays to.
    const t = ctx.currentTime; await wait(3000);
    const n = Math.max(1, Math.round(dens * beat));
    const recent = events().filter((e) => e.at > t);
    const rOn = onGrid(recent, grid.bpm, grid.beatAt, n), rOff = onGrid(recent, grid.bpm * 1.37, grid.beatAt, n);
    d.assert('the grains sit on the beat grid, and not on a grid 1.37 times as fast', rOn > 0.5 && rOn > rOff + 0.2,
      `on the beat ${rOn.toFixed(2)}, on the faster grid ${rOff.toFixed(2)}, ${recent.length} grains (1 all on one phase of a ${n} a beat grid, 0 spread evenly)`);
    // An unsure reading is followed too: sent on the real wire, as the
    // detector would, 30% fast and under STEADY.
    const was = grid.bpm, fast = Math.round(was * 13) / 10, unsure = STEADY / 5;
    bay.send(TEMPO_OUT, { of: 'param', name: 'bpm', v: fast, confidence: unsure, beatAt: ctx.currentTime, beats: [], candidates: [] });
    const gSent = grid, took = grid.bpm;
    const foot = tempoVals.cell('bpm').textContent, conf = tempoVals.cell('conf').textContent;
    const tFast = await engine.read('time');
    const echo = (bpm) => Math.min(MAX_TIME, 0.75 * 60 / bpm);
    // A detector reading may land between the send and the read; then the
    // engine may be on that one instead, and only then.
    const missFast = Math.min(Math.abs(tFast - echo(fast)), grid !== gSent ? Math.abs(tFast - echo(grid.bpm)) : Infinity);
    d.assert('a reading under the steady threshold is followed too: the grains take every tempo reading', took === fast && missFast < 0.003,
      `sent ${fast} bpm at ${unsure}, the grains took ${took} bpm, the engine ${(tFast * 1000).toFixed(1)} ms against ${(echo(fast) * 1000).toFixed(1)} ms for ${fast} bpm (was ${was})`);
    const ink = (() => { const px = beatCanvas.getContext('2d').getImageData(0, 0, beatCanvas.width, beatCanvas.height).data; let m = 0; for (let i = 3; i < px.length; i += 4) if (px[i] > m) m = px[i]; return m; })();
    d.assert('the source scope carries the beats, and the tempo row the tempo followed and the reading\'s confidence', beats.length > 0 && ink > 0 && foot === `${fast.toFixed(1)} bpm` && conf === unsure.toFixed(2),
      `${beats.length} beats, ink ${ink}, "${foot}", confidence ${conf}`);
    window.__demo.beat.measured = { bpm: g1.bpm, confidence: g1.confidence, timeOn: tOn, densOn: dens, back, rOn, rOff, timeFast: tFast, pulses };
  }

  rig = createGrainRig({
    d, engine,
    patches: LIST.map((p) => ({ name: p.name, says: p.says, set: pick(p, NAMES), fixed: pick(p, FIXED) })),
    controls: CONTROLS, roles: { size: 'size', density: 'density' }, source: 'ida',
    outputScope: false,
    wire, audio, top: [tempoVals.el],
    check,
  });

  // The beats, one accent line each, as bright as the reading that placed them was sure.
  const beatCanvas = el('canvas', 'cc-beats');
  rig.waveHost.append(beatCanvas);
  let ink = null;
  function drawBeats() {
    requestAnimationFrame(drawBeats);
    if (!ctx || !rig.api.playing()) return;
    const dpr = window.devicePixelRatio || 1;
    const W = Math.round(beatCanvas.clientWidth * dpr), H = Math.round(beatCanvas.clientHeight * dpr);
    if (!W || !H) return;
    if (beatCanvas.width !== W || beatCanvas.height !== H) { beatCanvas.width = W; beatCanvas.height = H; }
    const g = beatCanvas.getContext('2d');
    g.clearRect(0, 0, W, H);
    const now = ctx.currentTime;
    while (beats.length && beats[0].at < now - WINDOW_S - 0.5) beats.shift();
    g.fillStyle = (ink ??= getComputedStyle(document.documentElement).getPropertyValue('--hi').trim() || '#ffd400');
    for (const b of beats) {
      const x = Math.round(W - ((now - b.at) / WINDOW_S) * W);
      if (x < 0 || x > W) continue;
      g.globalAlpha = 0.2 + 0.8 * Math.max(0, Math.min(1, b.c));
      g.fillRect(x - dpr, 0, dpr, H);
    }
    g.globalAlpha = 1;
  }
  requestAnimationFrame(drawBeats);

  window.__demo.beat = { grid: () => grid && { ...grid }, last: () => lastReading, pulses: () => pulses,
    beats: () => beats.slice(), want: () => ({ ...want }), read: (n) => engine.read(n), measured: null };
  await rig.ready();
</script>

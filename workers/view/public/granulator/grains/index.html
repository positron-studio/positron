<title>Granulator</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { createGrainRig } from '/granulator/grain-rig.mjs';
  import { PATCHES, valuesOf, createRingEngine } from '/granulator/grain-ring.mjs';

  // The granulator: ../grain-ring.mjs's program, compiled in this tab by
  // /shell/sclang-lite.mjs and run on the tab's scsynth, the rest ../grain-rig.mjs. Patches
  // are `/n_set` sets; wet/dry plus seven knobs, and FIXED values set by the patch alone.
  // See lessons/page-granulator.md#granulator-19
  const d = mount({ name: 'Granulator', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('granulator/grains');

  const secs = (v) => (v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`);
  const times = (v) => `${v.toFixed(2)}x`;
  const CONTROLS = [
    { name: 'size', label: 'size', kind: 'knob', min: 0.02, max: 4, warp: 'exp', fmt: secs },
    { name: 'density', label: 'density', kind: 'knob', min: 0.5, max: 64, warp: 'exp', fmt: (v) => `${v < 10 ? v.toFixed(1) : Math.round(v)}/s` },
    { name: 'pitch', label: 'pitch', kind: 'knob', min: 0.25, max: 4, warp: 'exp', fmt: times },
    { name: 'back', label: 'back', kind: 'knob', min: 0, max: 4, warp: 'lin', fmt: secs },
    { name: 'speed', label: 'speed', kind: 'knob', min: 0, max: 2, warp: 'lin', fmt: times },
    { name: 'scatter', label: 'scatter', kind: 'knob', min: 0, max: 1, warp: 'lin', fmt: (v) => `${Math.round(v * 100)}%` },
    // On or off, a stepped knob with two positions. It steps at the start of a glide.
    // See lessons/page-granulator.md#granulator-20
    { name: 'freeze', label: 'freeze', kind: 'steps', choices: [{ label: 'off', value: 0 }, { label: 'on', value: 1 }] },
  ];
  const NAMES = CONTROLS.map((c) => c.name);
  // What a patch sets that no knob turns: the texture (jitter, detune, pan),
  // the tone, the echo, the tape and its direction, and the level.
  const FIXED = ['jitter', 'detune', 'pan', 'tone', 'echo', 'time', 'dark', 'drop', 'ramp', 'dir', 'amp'];
  const pick = (p, names) => Object.fromEntries(names.map((n) => [n, valuesOf(p)[n]]));

  // ── the engine, behind the rig's contract ────────────────────────────────
  // The program compiled as the page opens and the engine that boots it are
  // the kit's (`../grain-ring.mjs` `createRingEngine`, which /connect/ runs too).
  const engine = createRingEngine({ log: (line, kind) => d.log(line, kind) });
  const { good, T } = engine;

  const rig = createGrainRig({
    d, engine,
    patches: PATCHES.map((p) => ({ name: p.name, says: p.says, set: pick(p, NAMES), fixed: pick(p, FIXED) })),
    controls: CONTROLS, roles: { size: 'size', density: 'density' }, source: 'raadio2',
    // The patch picker on its own row, full width, and no output scope.
    // See lessons/page-granulator.md#granulator-21
    outputScope: false,
    // The page's own checks: the program compiled here, and a fixed value is
    // in the engine without a knob for it.
    check: async ({ wait, choosePatch, events }) => {
      d.assert('the program compiled in this tab as the page opened', good.ok && good.bytes.length > 0,
        good.ok ? `${good.bytes.length} B in ${T.compileMs} ms` : good.message);
      d.assert('it opened on the Raadio 2 recording and on Tape stop', window.__demo.grains.source() === 'raadio2' && PATCHES[0].name === 'Tape stop',
        `${window.__demo.grains.source()}, ${PATCHES[0].name}`);
      const to = PATCHES.findIndex((p) => p.name === 'Gate');
      choosePatch(to);
      await wait(2600);
      const panNow = await engine.read('pan'), echoNow = await engine.read('echo');
      d.assert('a patch sets its fixed values in the engine, with no knob for them',
        Math.abs(panNow - valuesOf(PATCHES[to]).pan) < 1e-4 && Math.abs(echoNow - valuesOf(PATCHES[to]).echo) < 1e-4,
        `pan ${panNow} and echo ${echoNow} against Gate's ${valuesOf(PATCHES[to]).pan} and ${valuesOf(PATCHES[to]).echo}`);
      // Backwards is the one patch whose grains play in reverse, and the engine says so.
      const bw = PATCHES.findIndex((p) => p.name === 'Backwards');
      choosePatch(bw);
      await wait(3000);
      const rates = events().filter((e) => e.patch === 'Backwards').slice(-8).map((e) => e.rate);
      d.assert('Backwards plays its grains in reverse: the engine reports a negative rate for each',
        rates.length > 0 && rates.every((r) => r < 0), `${rates.length} grains, rates ${rates.map((r) => r.toFixed(2)).join(' ')}`);
    },
  });
  window.__demo.ring = { good: () => good, compileMs: () => T.compileMs };
  await rig.ready();
</script>

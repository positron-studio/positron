<meta property="og:title" content="partitur">
<meta property="og:description" content="Moholy-Nagy’s 1924 score for a mechanical variety act, played as a timeline whose light any other screen can show as a projection wall.">
<meta property="og:url" content="https://positron.studio/partitur/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .pt-text { display: flex; flex-direction: column; gap: 10px; }
  .pt-say { margin: 0; color: var(--dim); font-size: 13.5px; max-width: 62ch; }
  .pt-say a { color: inherit; }
  /* The link picks and the scene marks wait for the room, and `display: flex`
     or `grid` below beats the browser's own [hidden] (positron-ui). */
  .pt-text[hidden] { display: none; }
  /* The three link picks share one label column (each pick a subgrid row), so their
     options start on one x. Above phone width only: below it the label stacks.
     See lessons/page-partitur.md#partitur-1 */
  @media (min-width: 561px) {
    .pt-links { display: grid; grid-template-columns: max-content minmax(0, 1fr); row-gap: 10px; column-gap: 8px; }
    .pt-links > .pos-choice { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; height: auto; }
    .pt-links > .pos-choice > .pos-choice-seg { justify-self: start; }
  }
  /* The scene picked and the button that marks it are one row. */
  .pt-mark { display: flex; flex-wrap: wrap; align-items: end; gap: var(--ctl-gap, 8px); }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as wall from './wall.mjs';

  /* The score and its wall as tabs. A wall is usually another browser, so the tabs
     meet through the room, never through page memory. SCORE owns the transport bar.
     See lessons/page-partitur.md#partitur-2 */
  const d = mount({
    name: 'partitur',
    // No `what` under the title: each tab describes itself under the tab row.
    // See lessons/page-partitur.md#partitur-3
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);
  // Imported after mount(): score.mjs awaits the score file, and a static import
  // would hold mount() and its inline favicon, letting Chrome ask for /favicon.ico.
  // See lessons/page-partitur.md#partitur-4
  const score = await import('./score.mjs');

  const page = createTabPage(d, {
    at: 'score',
    tabs: [
      { id: 'score', label: 'SCORE', mod: score },
      { id: 'wall', label: 'WALL', mod: wall },
    ],
  });

  // Before `ready` and never after it: the harness drills the published bar
  // the moment `ready` is true, and a tab switch under it would race it.
  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    d.log(`the check pass took ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>

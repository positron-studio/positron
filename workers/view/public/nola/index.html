<script type="module">
  /**
   * nola: a sampled piano (FluidR3, 30 notes, one layer) and a recorded Rhodes (jRhodes3d,
   * CC BY-NC-SA 4.0, 15 notes by 5 layers) on plain Web Audio, one buffer source a note.
   * `?pedal=<n>` picks the sustain controller and `?flip=1` reads an inverted pedal.
   * See lessons/page-nola.md#nola-1
   */
  import { mount, guard, el } from '/shell/shell.mjs';
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createKeyboard, keyRange, KEY_SPAN_25, QWERTY_CHROMATIC }
    from '/shell/keyboard.mjs';
  import { createMidi, EVOLUTION, offerLoopFor, checkEvolutionLoop } from '/shell/midi.mjs';
  import { createPedal, PEDAL_SAYS, SUSTAIN_CC, damperSec } from '/shell/pedal.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createNameplate } from '/shell/panel-layout.mjs';
  import { createField } from '/shell/field.mjs';
  import { parseChord, parseChords, voiceChord, VOICINGS } from '/shell/chords.mjs';
  import { nameChord, createSettler, createTally, chordKey, fromKey, notesOf }
    from '/shell/name.mjs';
  /* `routeTo` is still exported and tested by suggest.mjs; no page calls it.
     See lessons/page-nola.md#nola-2 */
  import { suggest, useTables, tablesIn, mkRandom, mkTake } from '/shell/suggest.mjs';
  import { createRoll } from '/shell/roll.mjs';
  /* The roll draws its own rows, so `table.mjs` is not imported.
     See lessons/page-nola.md#nola-3 */
  import { createDiagram } from '/shell/diagram.mjs';
  import { createEngineNode, createEngineUi, memoryRelay, standInAccess } from '/fau/engine-node.mjs';
  import { createBayNode } from '/shell/bay-node.mjs';
  import { graphProblem } from '/shell/graph-registry.mjs';

  const q = new URLSearchParams(location.search);

  /**
   * Thirty notes at minor thirds, 21 to 108 step 3, so every key is at most one
   * semitone from a recording and `playbackRate` is exercised on two keys in three.
   * See lessons/page-nola.md#nola-4
   */
  const PIANO_NOTES = Array.from({ length: 30 }, (_, i) => 21 + i * 3);

  /**
   * The Rhodes notes sit at uneven steps (3 to 6 semitones), so the map is a search.
   * A tie goes down, as the author's SFZ does for keys 32, 57 and 68; the check below
   * grades this against his key regions on all 88 keys.
   * See lessons/page-nola.md#nola-5
   */
  const RHODES_NOTES = [29, 35, 40, 45, 50, 55, 59, 62, 65, 71, 76, 81, 86, 91, 96];

  /** His `lokey` and `hikey` per region, in the same order, for the check. */
  const RHODES_KEYS = [[21, 32], [33, 37], [38, 42], [43, 47], [48, 52], [53, 57],
    [58, 60], [61, 63], [64, 68], [69, 73], [74, 78], [79, 83], [84, 88], [89, 93], [94, 108]];

  /** The recording a note is played from. A tie goes to the lower one. */
  const nearestIn = (notes, note) => notes.reduce(
    (best, n) => (Math.abs(n - note) < Math.abs(best - note) ? n : best), notes[0]);

  /**
   * 64 voices is a guess, not a measurement: a pedalled glissando can exceed it.
   * See lessons/page-nola.md#nola-6
   */
  const VOICES = 64;

  /**
   * The piano files peak at 0.068 to 0.097 of full scale (about 21 dB down), so the
   * gain lifts the loudest to a third of full scale, leaving headroom for pedalled
   * chords with no compressor in the path.
   * See lessons/page-nola.md#nola-7
   */
  const PIANO_PEAK = 0.097;          // the loudest of the thirty, measured
  const LOUDEST = 0.30;              // where one note played as hard as possible lands

  /**
   * The Rhodes files peak at 0.27 to 0.998, so it needs its own constant: the piano's
   * would multiply by 3.09 and clip. One constant, the loudest file, keeps the
   * instrument's quieter top octave instead of normalising per file.
   * See lessons/page-nola.md#nola-8
   */
  const RHODES_PEAK = 0.9981;

  /**
   * What one press is worth, before the damper. Level comes from velocity, not from
   * the files: the Rhodes layers are peak normalised, so harder layers have lower RMS
   * (median -1.53 dB a step). This curve spans 18.8 dB against 5.5 dB of layer wander.
   * See lessons/page-nola.md#nola-9
   */
  const velGain = (ins, vel) =>
    (LOUDEST / ins.peak) * Math.pow(Math.max(1, Math.min(127, vel)) / 127, 1.5);

  /**
   * Layer 1 is the hardest hit and layer 5 the softest. This is the author's crossfade
   * table from jRhodes3d-mono.sfz (also in PROVENANCE-rhodes.json, `velocity.groups`);
   * the page plays the layer that is loudest at a velocity.
   * See lessons/page-nola.md#nola-10
   */
  const RHODES_XF = [
    { layer: 5, lo: 1, hi: 60, in: null, out: [25, 60] },
    { layer: 4, lo: 25, hi: 84, in: [25, 60], out: [61, 84] },
    { layer: 3, lo: 61, hi: 103, in: [61, 84], out: [85, 103] },
    { layer: 2, lo: 85, hi: 119, in: [85, 103], out: [104, 119] },
    { layer: 1, lo: 104, hi: 127, in: [104, 119], out: null },
  ];

  /** How loud his crossfade has one layer at a velocity, 0 to 1. */
  function xfGain(g, vel) {
    if (vel < g.lo || vel > g.hi) return 0;
    if (g.in && vel <= g.in[1]) return (vel - g.in[0]) / (g.in[1] - g.in[0]);
    if (g.out && vel >= g.out[0]) return (g.out[1] - vel) / (g.out[1] - g.out[0]);
    return 1;
  }

  /* Read softest first, and a tie goes to the softer layer.
     See lessons/page-nola.md#nola-11 */
  function layerFor(vel) {
    let best = RHODES_XF[0], top = -1;
    for (const g of RHODES_XF) { const v = xfGain(g, vel); if (v > top) { top = v; best = g; } }
    return best.layer;
  }

  /**
   * Layer 3 stops at note 71 and layer 1 at 76 (65 files, not 75). Above those the
   * author's own regions play the `_4` and `_2` files, and so does this.
   * See lessons/page-nola.md#nola-12
   */
  const RHODES_ABSENT = new Set(['81-1', '86-1', '91-1', '96-1',
    '71-3', '76-3', '81-3', '86-3', '91-3', '96-3']);
  const RHODES_FALLBACK = { 1: 2, 3: 4 };
  function rhodesLayerAt(note, layer) {
    let l = layer;
    while (RHODES_ABSENT.has(`${note}-${l}`)) {
      const next = RHODES_FALLBACK[l];
      if (!next || next === l) return null;
      l = next;
    }
    return l;
  }

  /**
   * Everything that differs between the two instruments: notes, level, file and layer.
   * Everything downstream of `press` is shared.
   * See lessons/page-nola.md#nola-13
   */
  /* `name` is what the patch selector draws, so it is title case like every other caller.
     See lessons/page-nola.md#nola-14 */
  const PIANO = {
    id: 'piano', name: 'Piano', say: 'piano',
    notes: PIANO_NOTES, peak: PIANO_PEAK,
    file: (note) => `/nola/${note}.mp3`,
    layerAt: () => null,
  };
  const RHODES = {
    id: 'rhodes', name: 'Rhodes', say: 'Rhodes',
    notes: RHODES_NOTES, peak: RHODES_PEAK,
    file: (note, layer) => `/nola/rhodes-${String(note).padStart(3, '0')}-${layer}.m4a`,
    layerAt: rhodesLayerAt,
  };
  const INSTRUMENTS = [PIANO, RHODES];

  /* Which one the keys play. It is read at the moment a key goes DOWN and never
     after, so a switch under a finger cannot change what that finger started. */
  let inst = PIANO;

  /* The page's one sentence description; it changes whenever a control or the way the
     page is worked changes.
     See lessons/page-nola.md#nola-15 */
  const ONE = 'a piano and a 1977 Rhodes you play from one MIDI keyboard, over a roll '
    + 'of chords you type in or teach it by playing';

  const d = mount({
    name: 'nola',
    // A page with a diagram gets a one line `what`.
    // See lessons/page-nola.md#nola-16
    what: ONE,
    /**
     * `null` declares no readout, which `mount()` tells apart from `{}` (six cells promised,
     * none delivered). The six numbers it held are still measured and asserted.
     * See lessons/page-nola.md#nola-17
     */
    readout: null,
    /**
     * No control row: the checks run at load behind `SELFCHECK`, because `demo/verify.mjs`
     * drives a page by clicking `.pos-controls button` and there is none to click.
     * See lessons/page-nola.md#nola-18
     */
    controls: [],
  });
  guard(d);

  // ── nothing is opened on a visit ──
  // Every URL this page fetches goes through one counted function, so "a visit fetches
  // nothing" is an assert over a counter.
  // See lessons/page-nola.md#nola-19
  /* The URLs are kept, not only counted, so the layer check grades what was fetched
     rather than the layer the page computed.
     See lessons/page-nola.md#nola-20 */
  let gotBytes = 0, gotFiles = 0;
  const gotUrls = [];
  async function pull(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} answered ${res.status}`);
    const buf = await res.arrayBuffer();
    gotBytes += buf.byteLength;
    gotFiles++;
    gotUrls.push(url);
    return buf;
  }

  let ctx = null, master = null, ana = null, anaBuf = null, fine = null, fineBuf = null;
  /* Keyed by URL, because a Rhodes note has five recordings.
     See lessons/page-nola.md#nola-21 */
  const buffers = new Map();      // url -> AudioBuffer
  const wanted = new Map();       // batch key -> promise, so one chord fetches once
  const voices = [];              // {note, src, gain, at, damped, inst}

  async function ensureAudio() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    // `resume()` never rejects and waits on a gesture, so awaiting it would hang.
    // See lessons/page-nola.md#nola-22
    ctx.resume().catch(() => {});
    master = ctx.createGain();
    master.gain.value = 1;
    ana = ctx.createAnalyser();
    /**
     * 512 samples is 11.6 ms at 44.1 kHz, short enough that a reading 40 ms after a release
     * holds nothing from before it (2048 is 46 ms and hid the damper). It under-reads bass
     * notes, so the checks play notes 60 to 67.
     * See lessons/page-nola.md#nola-23
     */
    ana.fftSize = 512;
    anaBuf = new Float32Array(ana.fftSize);
    master.connect(ana).connect(ctx.destination);
    /**
     * A second, long analyser for pitch: at 512 samples a bin is 86 Hz and notes 60 and 61
     * are 15.6 Hz apart; at 16384 a bin is 2.7 Hz. The shift check reads the pitch played,
     * not the `playbackRate` the page computed.
     * See lessons/page-nola.md#nola-24
     */
    fine = ctx.createAnalyser();
    fine.fftSize = 16384;
    fineBuf = new Float32Array(fine.frequencyBinCount);
    master.connect(fine);
    /**
     * `outputLatency` is start-to-speaker time; `baseLatency` is the fallback, smaller and so
     * optimistic, and the log says which one was used.
     * See lessons/page-nola.md#nola-25
     */
    outMs = (ctx.outputLatency ?? ctx.baseLatency ?? 0) * 1000;
    d.log(`press to sound is measured from the MIDI message to the scheduled start, plus `
        + `${outMs.toFixed(1)} ms of ${ctx.outputLatency != null ? 'output latency' : 'graph buffer'}`);
    d.log('what no browser can see is the keyboard scanning its own keys and the USB stack, '
        + 'which is everything between the felt and the message');
    return ctx;
  }
  let outMs = 0;

  /**
   * Fetched on the first press that needs it, never on a visit. `wanted` holds the promise
   * so a chord fetches once.
   * See lessons/page-nola.md#nola-26
   */
  /**
   * What one press needs, and what else is worth taking while the connection is open.
   * The piano takes the octave (2 to 4 files, about 60 KB).
   * See lessons/page-nola.md#nola-27
   */
  function planFor(ins, near, layer) {
    if (ins === PIANO) {
      const oct = Math.floor(near / 12);
      return { key: `piano ${oct}`, says: 'this octave',
        urls: PIANO.notes.filter((n) => Math.floor(n / 12) === oct).map((n) => PIANO.file(n)) };
    }
    /* The Rhodes takes every layer of this note (about 200 KB of the 3.1 MB pack), so the
       same key at another velocity is not a second cold fetch. Still only behind a press.
       See lessons/page-nola.md#nola-28 */
    const layers = [1, 2, 3, 4, 5].filter((l) => !RHODES_ABSENT.has(`${near}-${l}`));
    return { key: `rhodes ${near}`, says: 'this note at every velocity',
      urls: layers.map((l) => RHODES.file(near, l)) };
  }

  function fetchPlan(p) {
    if (wanted.has(p.key)) return wanted.get(p.key);
    const need = p.urls.filter((u) => !buffers.has(u));
    const t0 = performance.now();
    const job = (async () => {
      await ensureAudio();
      for (const u of need) buffers.set(u, await ctx.decodeAudioData(await pull(u)));
      if (need.length) {
        d.log(`${need.length} recording${need.length === 1 ? '' : 's'} arrived for ${p.says} `
            + `in ${Math.round(performance.now() - t0)} ms, and nothing was asked for before `
            + 'the first key was pressed');
      }
    })();
    wanted.set(p.key, job);
    return job;
  }

  // ── one note ──────────────────────────────────────────────────────────────

  let lastShift = null, lastPlayed = null, presses = 0, sumMs = 0, worstMs = 0, medians = [];

  /* A no-op kept as the one hook every voice event calls; the counts live on `voices`
     and `pedal`, where the checks read them.
     See lessons/page-nola.md#nola-29 */
  function showVoices() { /* the numbers live on `voices` and `pedal`, and the
     asserts read them there. */ }

  /**
   * The damper is a ramp, not `stop()`, which would click. `setTargetAtTime` is within
   * 5 per cent after three time constants, so the constant is a third of the time and the
   * source stops at 1.5 times it, at about 1 per cent. demo/shell/pedal.mjs owns the time.
   * See lessons/page-nola.md#nola-30
   */
  function damp(v, sec) {
    if (v.damped) return;
    v.damped = true;
    const now = ctx.currentTime;
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setTargetAtTime(0, now, Math.max(0.005, sec / 3));
    try { v.src.stop(now + sec * 1.5); } catch { /* already stopped */ }
  }

  function endVoice(v) {
    const i = voices.indexOf(v);
    if (i >= 0) voices.splice(i, 1);
    showVoices();
  }

  /**
   * A key went down, by any route. A tapped key, a played key and a looped key all
   * come through here, so there is one path to keep right.
   * See lessons/page-nola.md#nola-31
   */
  /**
   * The notes under a finger, for the roll's lit row. Fingers, not voices: a pedalled
   * chord keeps sounding after the hands have moved on.
   * See lessons/page-nola.md#nola-32
   */
  const heldNotes = new Set();
  /* The learning mode reads the same set; `heardChange` does nothing unless the roll
     is in `Played`.
     See lessons/page-nola.md#nola-33 */
  const tellRoll = () => { roll.setHeld([...heldNotes]); heardChange(); };

  async function press(note, vel, at, how = 'midi') {
    /* Under `?rec=1`, every note this page sounds and where it came from (`how`). The
       take recorder records the wire, which a looped note never touches.
       See lessons/page-nola.md#nola-34 */
    if (RECORDING) plays.push({ t: tapeAt(), n: note, down: true, how });
    if (note < 0 || note > 127) { tapDrop('outside the 0 to 127 a note can be', note); return; }
    tap.pressed++;
    pedal.keyDown(note);
    heldNotes.add(note);
    tellRoll();
    keys.lightNote(note, true, 'self', vel);
    await ensureAudio();
    /* The instrument is read once: there is an await below, and a switch during a fetch
       must not change a note that started before it.
       See lessons/page-nola.md#nola-35 */
    const ins = inst;
    const near = nearestIn(ins.notes, note);
    /* The velocity picks a layer and the layer may be one the author never
       recorded, in which case `layerAt` hands back the one he plays instead. */
    const layer = ins.layerAt(near, layerFor(vel));
    const url = ins.file(near, layer);
    /* A local, not a module flag: a chord is several overlapping runs of this function.
       See lessons/page-nola.md#nola-36 */
    let waitedForFiles = false;
    if (!buffers.has(url)) { waitedForFiles = true; await fetchPlan(planFor(ins, near, layer)); }
    const buf = buffers.get(url);
    /* A missing recording is logged and counted rather than dropped silently.
       See lessons/page-nola.md#nola-37 */
    if (!buf) { tapDrop(`no recording arrived for ${url.split('/').pop()}`, note); return; }
    /* The key may be up by now: a fetch sits above this. The note still sounds, and the
       damper goes on straight away (below), which is what a quick note is.
       See lessons/page-nola.md#nola-38 */
    const alreadyUp = !heldNotes.has(note) && !pedal.down();

    /* A key struck again damps its own ringing voice first, as one key is one string.
       See lessons/page-nola.md#nola-39 */
    for (const v of [...voices]) if (v.note === note) damp(v, 0.04);

    /* Past the cap the oldest voice (index 0) is taken, and the log says so.
       See lessons/page-nola.md#nola-40 */
    while (voices.length >= VOICES) {
      const old = voices[0];
      damp(old, 0.02);
      endVoice(old);
      d.log(`${VOICES} voices were already sounding, so the oldest was taken`, 'warn');
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;
    const shift = note - near;
    src.playbackRate.value = Math.pow(2, shift / 12);
    const g = ctx.createGain();
    g.gain.value = velGain(ins, vel);
    src.connect(g).connect(master);
    tap.voiced++;
    const v = { note, src, gain: g, at: ctx.currentTime, damped: false, inst: ins.id };
    src.onended = () => endVoice(v);
    src.start();
    voices.push(v);
    /* The key came up while this was loading, so the note is already over. It
       sounds, and the damper goes straight on, which is a short note rather
       than a missing one or an endless one. */
    if (alreadyUp) { tap.late++; damp(v, pedal.damper()); }

    lastShift = shift;
    lastPlayed = { inst: ins.id, note: near, layer, url };
    showVoices();

    /* Timed from the MIDI message, and only when the recording was already in hand, so a
       first fetch and decode never lands in `worst`. The fetch has its own log line.
       See lessons/page-nola.md#nola-41 */
    if (at != null && !waitedForFiles) {
      const ms = (performance.now() - at) + outMs;
      presses++; sumMs += ms;
      medians.push(ms);
      if (ms > worstMs) worstMs = ms;
      medians.sort((a, b) => a - b);
    }
  }

  /** A key came up, by any route. The pedal decides whether anything happens. */
  function lift(note, how = 'midi') {
    if (RECORDING) plays.push({ t: tapeAt(), n: note, down: false, how });
    keys.lightNote(note, false);
    heldNotes.delete(note);
    tellRoll();
    pedal.keyUp(note);
    showVoices();
  }

  /** What letting go of a note means on this page's graph. */
  function release(note, sec) {
    for (const v of [...voices]) if (v.note === note && !v.damped) damp(v, sec);
    showVoices();
  }

  /**
   * Switching instrument damps everything sounding, so no voice outlives the instrument
   * the control names. One voice list makes that safe. The pedal is left as the foot has it.
   * See lessons/page-nola.md#nola-42
   */
  function setInstrument(id) {
    const next = INSTRUMENTS.find((x) => x.id === id);
    if (!next || next === inst) return;
    inst = next;
    const stopped = voices.length;
    for (const v of [...voices]) { damp(v, 0.06); endVoice(v); }
    d.log(`the keys play the ${next.say} now`
        + (stopped ? `, and the ${stopped} note${stopped === 1 ? '' : 's'} still sounding `
                   + 'went with the instrument that made them' : ''));
    warmUp(next);
  }

  /**
   * Fetch the instrument on the press that switched to it, so the first note is not a
   * cold fetch. Two waves: the keys drawn (`SHOWN()`, 24 semitones, not the 14 of
   * `REACH`), then the rest of the pack for a MIDI keyboard. Never on load.
   * See lessons/page-nola.md#nola-43
   */
  function warmUp(ins) {
    if (ins === PIANO) return;
    const shown = new Set();
    for (let n = keys.base; n <= keys.base + SHOWN(); n++) shown.add(nearestIn(ins.notes, n));
    const rest = ins.notes.filter((n) => !shown.has(n));
    const plans = [...shown].map((near) => planFor(ins, near, 1));
    const files = plans.reduce((n, p) => n + p.urls.length, 0);
    d.log(`fetching the ${files} recordings the ${ins.say} needs for the keys on screen, `
        + 'so the first note you play is not waiting on a download');
    Promise.all(plans.map(fetchPlan)).then(() => {
      d.log(`the ${ins.say} is ready across the keys on screen`);
      /* The second wave is not awaited.
         See lessons/page-nola.md#nola-44 */
      Promise.all(rest.map((near) => fetchPlan(planFor(ins, near, 1))))
        .then(() => d.log(`and across the rest of the ${ins.say}, so any key on a `
            + 'MIDI keyboard sounds without waiting'));
    });
  }

  // ── the foot ──────────────────────────────────────────────────────────────

  /**
   * `?pedal=<n>` listens to another controller; the log names the one in use.
   * See lessons/page-nola.md#nola-45
   */
  const PEDAL_CC = Math.max(0, Math.min(127, Number(q.get('pedal')) || SUSTAIN_CC));
  /** `?flip=1`, for a pedal whose polarity was sensed wrong at power up. */
  const PEDAL_FLIP = q.get('flip') === '1';

  const pedal = createPedal({
    cc: PEDAL_CC,
    flip: PEDAL_FLIP,
    release,
    onPedal: (down, value, freed) => {
      d.log(down ? PEDAL_SAYS.down : freed ? PEDAL_SAYS.freed(freed) : PEDAL_SAYS.up);
      /* The raw value goes in the log beside the reading: the MK-425C senses pedal polarity
         at power up, and only the number shows an inverted pedal.
         See lessons/page-nola.md#nola-46 */
      d.log(PEDAL_SAYS.raw(PEDAL_CC, value, down));
      const kind = pedal.switchy();
      if (kind !== null && kind !== saidKind) {
        saidKind = kind;
        d.log(kind ? PEDAL_SAYS.switchy : PEDAL_SAYS.continuous);
      }
      keys.sustain.set(down, true);
      showVoices();
    },
  });
  let saidKind = null;

  // ── the keys, and the two ways in ─────────────────────────────────────────

  /**
   * Twenty five keys is fifteen white ones. `.keys` reads `minmax(var(--k-min, 49px), 1fr)`,
   * so the floor is set per page by `--k-min`, and on a phone the row scrolls (`pan-x`).
   * See lessons/page-nola.md#nola-47
   */
  /**
   * 42 px fits all twenty five keys: 668 px of content less fourteen 2 px gaps over fifteen
   * white keys is 42.7. Under Apple's 44 pt, on purpose: the charts are voiced into two
   * octaves; on a phone the row scrolls anyway.
   * See lessons/page-nola.md#nola-48
   */
  const KEY_MIN = 42;

  /**
   * See lessons/page-nola.md#nola-49
   */
  /**
   * Not read: `keyRange` puts the thirteen letters of `QWERTY_CHROMATIC` from the leftmost
   * key, C3 at base 48.
   * See lessons/page-nola.md#nola-50
   */
  const LOW_KEYS = 12;
  /** How far the computer keyboard reaches, in semitones above the leftmost
   *  key. Read off the map, never typed: `QWERTY_CHROMATIC`'s highest value. */
  const REACH = Math.max(...Object.values(QWERTY_CHROMATIC));
  /**
   * How far the drawn keyboard reaches (24 semitones), for asking whether a played chord
   * fits the picture. `REACH` (14) is where a laptop can play one.
   * See lessons/page-nola.md#nola-51
   */
  const SHOWN = () => Math.max(...Object.values(KEY_MAP));
  /* The 25 key map is the kit's `keyRange`, which reads letters off `QWERTY_CHROMATIC`'s
     values rather than its order (`l` is 14, nothing is 13), and keeps the `hi<n>` ids.
     See lessons/page-nola.md#nola-52 */
  const { map: KEY_MAP, keys: KEY_ORDER, sharps: KEY_SHARPS, letters: KEY_LETTERS }
    = keyRange(KEY_SPAN_25);

  const keysHost = el('div', 'nola-keys');
  keysHost.style.setProperty('--k-min', `${KEY_MIN}px`);
  const keys = createKeyboard(keysHost, {
    /* C3, so the two octaves land C3 to C5 with middle C in the middle of the
       picture rather than at its left edge. */
    base: 48,
    map: KEY_MAP, keys: KEY_ORDER, sharps: KEY_SHARPS, letters: KEY_LETTERS,
    minBase: 24, maxBase: 84,
    /* The instrument row is the keyboard component's footer; keyboard.mjs owns the row,
       its line and its air.
       See lessons/page-nola.md#nola-53 */
    foot: true,
    /* A key on screen has no velocity, so a click is worth 100; a looped note keeps its own.
       See lessons/page-nola.md#nola-54 */
    onDown: (note, how, vel) => press(note, vel ?? 100, performance.now(), how),
    onUp: (note, how) => lift(note, how),
    /* The charts are drawn in the keyboard's window, so they move with an octave press.
       See lessons/page-nola.md#nola-55 */
    onOctave: (b) => { d.log(`the keys on screen now start at ${b}`); roll.setBase(b); redrawCharts(); },
    onPanic: () => {
      for (const v of [...voices]) { damp(v, 0.02); endVoice(v); }
      pedal.panic();
      heldNotes.clear();
      tellRoll();
      keys.sustain.set(false, true);
      showVoices();
    },
    /* The keyboard draws the sustain button; `pedal.set`, not `pedal.control`, because the
       button means dampers up and `?flip=1` must not reverse it.
       See lessons/page-nola.md#nola-56 */
    sustain: true,
    onSustain: (on) => pedal.set(on),
    /* The keyboard component records and replays its own loops through its press path, so
       looped notes arrive here as ordinary ones. `log` lends it this page's log.
       `'evolution'` starts `Loop` withdrawn until `createMidi({ loop: keys })` sees the Evolution.
       See lessons/page-nola.md#nola-57 */
    loop: 'evolution',
    /* Ten takes: the button is slot 1 and the MIDI keyboard's number pad reaches all ten.
       See lessons/page-nola.md#nola-58 */
    loops: 10,
    log: d.log,
  });

  /**
   * `Loop` is offered only while the Evolution is plugged in, and starts withdrawn because
   * the answer waits on `requestMIDIAccess`; a browser with no Web MIDI never shows it.
   * The name test lives in instruments.mjs (CoreMIDI calls it `MK-425C USB MIDI Keyboard`).
   * See lessons/page-nola.md#nola-59
   */

  /**
   * Transpose moves what arrives over MIDI and nothing else: an on-screen key always plays
   * the note printed on it, and the key that lights is the note that sounds.
   * See lessons/page-nola.md#nola-60
   */
  /**
   * No control: `?transpose=<n>` covers a keyboard whose own correction was lost to a
   * power cycle, and the check below still drives it.
   * See lessons/page-nola.md#nola-61
   */
  let transpose = 0, flatSaid = false;
  /* `?transpose=-1` for the session after a power cycle puts the keyboard's own
     fault back. It is read once and never drawn. */
  function setTranspose(v) {
    transpose = Math.max(-12, Math.min(12, v));
    d.log(transpose === 0
      ? 'a MIDI keyboard now plays the note it sends'
      : `a MIDI keyboard now plays ${transpose > 0 ? transpose : -transpose} semitone`
        + `${Math.abs(transpose) === 1 ? '' : 's'} ${transpose > 0 ? 'up' : 'down'} from what it sends`);
  }

  /**
   * See lessons/page-nola.md#nola-62
   */
  /**
   * See lessons/page-nola.md#nola-63
   */

  /**
   * A line of chords, read by demo/shell/chords.mjs (graded by chords-test.mjs), and a
   * picture of each under it. No caption, so the top row does not jump 16.5 px when the
   * mode changes; the name is the box's `aria-label`.
   * See lessons/page-nola.md#nola-64
   */
  const chordField = createField({
    value: 'Cmaj C9 F/C Fm6/C',
    placeholder: 'Cmaj C9 F/C Fm6/C',
    onInput: (v) => drawChords(v),
  });
  chordField.input.setAttribute('aria-label', 'chords');
  const chordList = el('div', 'nola-chords');

  /**
   * The page reads top down: the field you change, the charts it makes, then the keys.
   * See lessons/page-nola.md#nola-65
   */
  /**
   * Which instrument the keys play, as the standard patch selector, with no label: it is
   * the right end of the instrument footer. Not in `.pos-controls`, where demo/verify.mjs
   * would click it mid-check. `what: 'sound'` is the noun in its hovers.
   * See lessons/page-nola.md#nola-66
   */
  const instPick = createPicker({
    what: 'sound',
    prev: () => stepInst(-1),
    next: () => stepInst(+1),
    onPick: (i) => chooseInst(INSTRUMENTS[i].id),
  });
  /* The arrows are previous and next, not Piano and Rhodes, so they are named here and
     never indexed; a stale index would still land on the Rhodes and pass.
     See lessons/page-nola.md#nola-67 */
  const [instBack, instFwd] = instPick.buttons;
  const instCell = instPick.el.querySelector('.pos-pick-cell');

  /* The Rhodes licence (CC BY-NC-SA 4.0) needs attribution, and the picker overwrites the
     cell's title on every draw, so `drawInst`, the only caller of `show()`, writes the
     credit back each time.
     See lessons/page-nola.md#nola-68 */
  const CREDIT = {
    rhodes: 'Jeff Learman’s own 1977 Rhodes Mark I Stage 73, sampled as jRhodes3d at '
      + 'five velocities and used here under CC BY-NC-SA 4.0',
    piano: 'a sampled grand, FluidR3 GM, recorded at one velocity',
  };
  function drawInst() {
    instPick.show(inst.name, INSTRUMENTS.indexOf(inst));
    instCell.title = CREDIT[inst.id];
  }
  const chooseInst = (id) => { setInstrument(id); drawInst(); };
  /* It wraps: over a list of two, a clamping arrow is dead at one end.
     See lessons/page-nola.md#nola-69 */
  const stepInst = (by) => {
    const i = INSTRUMENTS.indexOf(inst);
    chooseInst(INSTRUMENTS[(i + by + INSTRUMENTS.length) % INSTRUMENTS.length].id);
  };
  instPick.options(INSTRUMENTS.map((x) => x.name), INSTRUMENTS.indexOf(inst));
  drawInst();

  /* The checks press the control (by name, never by index) rather than calling
     `setInstrument`, so the control itself stays graded.
     See lessons/page-nola.md#nola-70 */
  const pressInst = (id) => {
    for (let n = 0; n < INSTRUMENTS.length && inst.id !== id; n++) instFwd.click();
    return inst.id;
  };

  /**
   * Where the chord is put, as against what it is. `root` is the symbol's own spelling.
   * `lead` moves the hand least: 27 semitones over seven chords in chords-test.mjs,
   * against 57 for close and 46 for root.
   * See lessons/page-nola.md#nola-71
   */
  /* `lead` is the voicing in use. A learned row is drawn as played whatever this says;
     this decides the typed line and the proposal.
     See lessons/page-nola.md#nola-72 */
  let voicing = 'lead';
  /* The option labels say what each one does; the hover gives the sentence.
     See lessons/page-nola.md#nola-73 */
  const VOICE_SAYS = {
    root: 'the notes exactly as the chord symbol spells them, stacked upward from the root',
    close: 'the same notes packed as close together as they go, so one hand can hold them',
    lead: 'each chord put where it moves your hand least from the one before it',
    split: 'the root on its own for your left hand and the rest of the chord above it for your right',
  };
  const voicePick = createChoice({
    /* `VOICING` is the term for the thing, so it stays; the options say what they do.
       See lessons/page-nola.md#nola-74 */
    label: 'VOICING',
    /* `Split`: the root alone for the left hand and the rest above it (a rootless voicing
       over a bass root, as chords.mjs names it).
       See lessons/page-nola.md#nola-75 */
    options: [['Exact', 'root'], ['Tight', 'close'], ['Smooth', 'lead'], ['Split', 'split']],
    at: VOICINGS.indexOf('lead'),
    /* A voicing press re-voices every row, learned ones included.
       See lessons/page-nola.md#nola-76 */
    onPick: (id) => { voicing = id; d.log(VOICE_SAYS[id]); redrawCharts({ revoice: true }); },
    title: (id) => VOICE_SAYS[id],
  });

  /**
   * The Rhodes is CC BY-NC-SA 4.0 and attribution is a term of it. LICENSE-jrhodes3d holds
   * the full text; this line names both instruments.
   * See lessons/page-nola.md#nola-77
   */
  /* Built and not drawn: the attribution a reader reaches is the picker's hover (`CREDIT`)
     and the log. Appending this brings it back to the face.
     See lessons/page-nola.md#nola-78 */
  const credit = el('div', 'nola-credit');
  credit.append(
    'The piano is FluidR3 GM and the Rhodes is ',
    el('a', '', "Jeff Learman's", { href: 'https://github.com/sfzinstruments/jlearman.jRhodes3d',
      target: '_blank', rel: 'noopener' }),
    " own 1977 Rhodes Mark I Stage 73, sampled as jRhodes3d and used here under ",
    el('a', '', 'CC BY-NC-SA 4.0', { href: 'https://creativecommons.org/licenses/by-nc-sa/4.0/',
      target: '_blank', rel: 'noopener' }),
    '.');

  /* Declared above the SAVE control that reads it: a `const` used before its line throws
     `Cannot access 'RECORDING' before initialization`.
     See lessons/page-nola.md#nola-79 */
  const RECORDING = q.get('rec') === '1';
  /** every note this page sounded, with where it came from. See `press`. */
  const plays = [];
  const tape = [];
  const tapeAt = () => Math.round(performance.now());

  const instrument = el('div', 'nola-inst');
  /* The voicing picker is built and not drawn, fixed at `lead`, the voicing that moves the
     hand least. chords.mjs still grades all modes; drawing it again is one line.
     See lessons/page-nola.md#nola-80 */
  /* The instrument row is the keyboard's own footer (`keys.foot`), inside `.kbd` so it shares
     its border and padding; the box is `width: fit-content` and a sibling below would not
     match it. The plate, the bay button and the sound picker sit in it.
     See lessons/page-nola.md#nola-81 */
  const instFoot = keys.foot;
  /* The nameplate at the left end of the row. `place: 'ends'` directly, not `plateSpec`,
     which turns one line into `end` and its `margin-left: auto` would push the plate right.
     See lessons/page-nola.md#nola-82 */
  const plate = createNameplate({ lines: ['nola'], place: 'ends' });

  /* On the patchbay: an engine node with a MIDI in and a local sound. Building it opens
     nothing; Join does. A keyboard linked on /patchbay/ plays it alone; with no link every
     MIDI input does. Its handlers are the four MIDI functions below, by name.
     See lessons/page-nola.md#nola-83 */
  const engine = createEngineNode({
    slug: 'nola', label: 'Nola',
    handlers: { onDown: midiDown, onUp: midiUp, onControl: midiControl, onProgram: midiProgram },
    allOff: () => keys.panic(), log: d.log,
  });
  const bayUi = createEngineUi(engine, { el, log: d.log });
  instFoot.append(plate.el, bayUi.el, instPick.el);
  /* No credit under the keys: attribution is on the sound selector's hover and in the log,
     and demo/nola/LICENSE-jrhodes3d and PROVENANCE-rhodes.json ship with the recordings.
     See lessons/page-nola.md#nola-84 */
  instrument.append(keysHost);

  /* Only under `?rec=1`, so no visitor sees it and no harness press moves. It saves the take
     and shows how much is in it.
     See lessons/page-nola.md#nola-85 */
  if (RECORDING) {
    const bar = el('div', 'nola-rec');
    const said = el('span', 'nola-rec-say', 'recording every key from the MIDI keyboard');
    const save = el('button', 'pos-btn', 'Save take', { type: 'button' });
    save.onclick = () => {
      const doc = {
        what: 'a take off the MIDI keyboard on this desk, raw note numbers before transpose',
        when: new Date().toISOString(),
        build: (document.querySelector('.pos-build') || {}).textContent || '',
        transpose,
        instrument: inst.id,
        /* what SOUNDED, against `events` which is what ARRIVED. A timing question
           about a loop can only be answered from this one. */
        plays,
        loops: keys.loops.states().map((state, i) => ({
          slot: i + 1, state, lap: keys.loops.lap(i), tape: keys.loops.tape(i),
        })).filter((l) => l.state !== 'empty' || l.tape.length),
        gate: { LEARN_WINDOW, LEARN_GATE, LEARN_TIMES, minNotes: 3 },
        events: tape,
      };
      const blob = new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' });
      const a = el('a', '', '', { href: URL.createObjectURL(blob),
        download: `nola-take-${Date.now()}.json` });
      document.body.append(a); a.click(); a.remove();
      d.log(`wrote a take of ${tape.length} messages and ${plays.length} sounded `
          + `note(s) over `
          + `${((tape.length ? tape[tape.length - 1].t - tape[0].t : 0) / 1000).toFixed(1)} s`);
    };
    const tick = () => {
      said.textContent = tape.length
        ? `${tape.length} messages over ${((tape[tape.length - 1].t - tape[0].t) / 1000)
            .toFixed(1)} s. Play, then save.`
        : 'recording every key from the MIDI keyboard. Nothing yet.';
    };
    setInterval(tick, 500);
    bar.append(said, save);
    instrument.append(bar);
    d.log('this page is recording what you play, because it was opened with ?rec=1. '
        + 'Play for a minute or two, press SAVE TAKE, and the file lands in your downloads');
  }
  /* The roll's mode sits beside the field it hides, since `Suggested` removes the field.
     See lessons/page-nola.md#nola-86 */
  const topRow = el('div', 'nola-top');
  topRow.append(chordField.el);

  /* See lessons/page-nola.md#nola-87 */
  d.stack.add(topRow, chordList, instrument);

  // ── the MIDI keyboard ─────────────────────────────────────────────────────

  /**
   * The MIDI handlers are named functions so the checks can drive them: there is no MIDI
   * under a harness, and a check that called `press` directly would skip the transpose.
   * See lessons/page-nola.md#nola-88
   */
  /**
   * The tap: its own model of what is down, from raw MIDI messages, compared with
   * `heldNotes` through `transpose`. Two independent sources, because the screen-key checks
   * never touch the MIDI path.
   * See lessons/page-nola.md#nola-89
   */
  const tap = {
    on: 0, off: 0, pressed: 0, voiced: 0, late: 0, drops: new Map(),
    /** what the WIRE says is down, raw, before this page touches it */
    down: new Set(),
    splits: 0, worst: 0,
  };
  const TAP_LOUD = q.get('tap') === '1';
  let saidLost = false;
  const tapDrop = (why, note) => {
    tap.drops.set(why, (tap.drops.get(why) || 0) + 1);
    d.log(`a note was dropped: ${why} (note ${note})`, 'warn');
  };
  /**
   * Does the page hold what the wire says? Run after every message, since the moment a
   * divergence appears is when it names a cause.
   * See lessons/page-nola.md#nola-90
   */
  const tapCheck = (what, note) => {
    const wire = new Set([...tap.down].map((n) => n + transpose));
    const missing = [...wire].filter((n) => !heldNotes.has(n));
    const extra = [...heldNotes].filter((n) => !wire.has(n));
    tap.worst = Math.max(tap.worst, missing.length + extra.length);
    if (TAP_LOUD) {
      d.log(`${what} ${note}: wire holds ${[...wire].join(',') || 'nothing'}, `
          + `page holds ${[...heldNotes].join(',') || 'nothing'}`);
    }
    if ((missing.length || extra.length) && !saidLost) {
      saidLost = true;
      d.log(`the keyboard and this page disagree about what is down. The wire says `
          + `${[...wire].join(',') || 'nothing'} and the page says `
          + `${[...heldNotes].join(',') || 'nothing'}. `
          + `${missing.length} key(s) the page never took, ${extra.length} it never let go of. `
          + `Open this page with ?tap=1 for every message`, 'warn');
    }
    return { missing, extra };
  };

  /**
   * Under `?rec=1`, the raw wire (note numbers before transpose), so `LEARN_GATE`,
   * `LEARN_WINDOW` and `LEARN_TIMES` can be tried against real playing; they were set from a
   * synthetic session.
   * See lessons/page-nola.md#nola-91
   */
  function midiDown(note, vel, ch, at) {
    if (RECORDING) tape.push({ t: tapeAt(), on: note, vel });
    tap.on++;
    tap.down.add(note);
    if (note < 48 && !flatSaid) {
      flatSaid = true;
      d.log(`this keyboard sent note ${note}, below the 48 a C to C controller starts at, `
          + 'so it may be transposed down a semitone like the one on this desk', 'warn');
    }
    press(note + transpose, vel, at);
    tapCheck('down', note);
  }
  function midiUp(note) {
    if (RECORDING) tape.push({ t: tapeAt(), off: note });
    tap.off++;
    tap.down.delete(note);
    lift(note + transpose);
    tapCheck('up', note);
  }
  function midiControl(cc, value) {
    if (pedal.control(cc, value) || cc === PEDAL_CC || ccSaid.has(cc)) return;
    ccSaid.add(cc);
    d.log(`controller ${cc} arrived and this page listens to ${PEDAL_CC} only, `
        + `so open it with ?pedal=${cc} if that is the foot`);
  }

  /**
   * The MK-425C number pad sends bank select LSB and MSB (both 0) then a program change, on
   * channel 2. Program n is loop slot n, and program 0 is slot 10 as printed on the pad.
   * The keyboard owns looping; this page only maps the number.
   * See lessons/page-nola.md#nola-92
   */
  function midiProgram(program) {
    const slot = program === 0 ? 9 : program - 1;
    if (slot < 0 || slot >= keys.loops.slots) return;
    keys.loops.press(slot);
  }

  /* `createMidi` cannot say which input a message came from, so while a /patchbay/ link is
     open this path is shut and the linked keyboard arrives through `engine`.
     See lessons/page-nola.md#nola-93 */
  const omniHandlers = {
    onDown: (...a) => engine.omni() && midiDown(...a),
    onUp: (...a) => engine.omni() && midiUp(...a),
    onControl: (...a) => engine.omni() && midiControl(...a),
    onProgram: (...a) => engine.omni() && midiProgram(...a),
  };
  const midi = createMidi({
    ...omniHandlers,
    log: d.log,
    /* The port names decide `Loop` (plugged in is not the Evolution plugged in) and the count
       decides the log line. Runs on every port change, so plugging in later works.
       See lessons/page-nola.md#nola-94 */
    onPorts: (n, names = []) => {
      d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} to listen to`
              : 'no MIDI keyboard is plugged in, and the keys on screen still play');
      /* The `Loop` half is `midi.mjs`'s now, through `loop: keys` below, with
         the same two log lines this page used to write here, said only on a
         change and after this one. */
    },
    loop: keys,
  });
  /* The tap is readable from outside for a check or the console. `drops` is a Map and
     does not copy out, so it goes as an object.
     See lessons/page-nola.md#nola-95 */
  d.tap = () => ({ ...tap, down: [...tap.down], held: [...heldNotes],
                   drops: Object.fromEntries(tap.drops) });
  const ccSaid = new Set();
  d.log(`the sustain pedal is read on controller ${PEDAL_CC}`
      + (PEDAL_FLIP ? ', upside down, so 0 is the foot going down' : ''));
  if (!PEDAL_FLIP) {
    d.log('if the pedal works backwards, open this page with ?flip=1, or power the keyboard '
        + 'up with the pedal unpressed, which is where that fault comes from');
  }

  // ── a phrase, for somebody with neither a keyboard nor a pedal ────────────

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const peak = () => {
    if (!ana) return 0;
    ana.getFloatTimeDomainData(anaBuf);
    let p = 0;
    for (let i = 0; i < anaBuf.length; i++) { const a = Math.abs(anaBuf[i]); if (a > p) p = a; }
    return p;
  };

  /**
   * The loudest partial in whatever is sounding, in Hz. Which partial does not matter: two
   * notes from one recording are one spectrum scaled, so the ratio of readings taken at the
   * same age is the ratio of rates.
   * See lessons/page-nola.md#nola-96
   */
  function topHz() {
    if (!fine) return 0;
    fine.getFloatFrequencyData(fineBuf);
    let best = -Infinity, at = 0;
    for (let i = 2; i < fineBuf.length; i++) if (fineBuf[i] > best) { best = fineBuf[i]; at = i; }
    return at * ctx.sampleRate / fine.fftSize;
  }

  /**
   * The chords on screen, one small keyboard each: `pad: false` and `letters: false` make it
   * a picture, and a press still sounds. Every chart is 25 keys from the C at or below the
   * lowest note, since a slash bass can put an octave under an eleven semitone chord.
   * See lessons/page-nola.md#nola-97
   */
  const charts = [];
  let saidKey = null;
  /* Declared here so `onOctave` above can reach it before `drawChords` exists. It checks the
     roll's mode, since in `Played` the typed line would replace the learned rows with none.
     See lessons/page-nola.md#nola-98 */
  const redrawCharts = (o) => (mode === 'learn'
    ? rebuildLearnRoll(o)
    : drawChords(chordField.value()));
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  /**
   * One roll for all the chords, not a keyboard per chord. chords.mjs parses and voices,
   * and the chord is moved into the instrument's window, never the window to the chord.
   * See lessons/page-nola.md#nola-99
   */
  /* The roll's host is the keyboard itself, so it shares its width and `--k-min` (roll.mjs).
     See lessons/page-nola.md#nola-100 */
  /**
   * Picking a row puts the chord on the keys as hints. roll.mjs reports and this page
   * paints; the previous hint is cleared first, since a hint is a class on a key.
   * See lessons/page-nola.md#nola-101
   */
  let hinted = [];
  const showChord = (row) => {
    for (const n of hinted) keys.lightNote(n, false, 'hint');
    hinted = row ? row.notes : [];
    for (const n of hinted) keys.lightNote(n, true, 'hint');
  };
  /* Eight rows of room even when empty (up to six learned plus a proposal), so the roll
     does not grow while somebody plays.
     See lessons/page-nola.md#nola-102 */
  const roll = createRoll(keys.el, {
    base: keys.base, keys: KEY_ORDER, map: KEY_MAP, sharps: KEY_SHARPS, prepend: true,
    scroller: keys.keysEl,
    minRows: 8,
    onPick: (row) => showChord(row),
  });

  function drawChords(line) {
    charts.length = 0;
    const { chords, bad, key } = parseChords(line);
    const rows = [];
    for (const c of chords) {
      /**
       * The chord is shifted by octaves into the instrument's window, so a key sits in the
       * same column in the roll and on the keyboard.
       * See lessons/page-nola.md#nola-103
       */
      /**
       * The voicing is chords.mjs's arithmetic (graded with no browser). `near` is the row
       * already voiced before this one, which is what leading means.
       * See lessons/page-nola.md#nola-104
       */
      const base = keys.base;
      /**
       * The typed line is voiced into what the letter keys reach (`REACH`, read off
       * `QWERTY_CHROMATIC`), so it can be played on a laptop. Chords sit in the lower part
       * and the keys above are left for a melody.
       * See lessons/page-nola.md#nola-105
       */
      /**
       * `split` gets the whole drawn keyboard: a bass note plus three above needs more than the
       * fourteen letter semitones (`Fmaj7` would reach E4, 64, two above the top letter key).
       * See lessons/page-nola.md#nola-106
       */
      const { notes: shifted, outside } = voiceChord(c.notes, {
        mode: voicing, lo: base, hi: base + (voicing === 'split' ? SHOWN() : REACH),
        near: rows.length ? rows[rows.length - 1].notes : [],
        bass: c.bass !== null,
      });
      const label = [c.name, c.roman, outside.length
        ? `${outside.length} above` : ''].filter(Boolean).join(' ');
      rows.push({ label, notes: shifted });
      charts.push({ chord: c, notes: shifted, outside, label });
    }
    showChord(null);
    roll.setRows(rows);
    /* A token that did not parse is shown back, never dropped.
       See lessons/page-nola.md#nola-107 */
    chordList.querySelector('.nola-bad')?.remove();
    if (bad.length) {
      chordList.append(el('div', 'nola-bad',
        bad.map((b) => `${b.text} is not a chord, because ${b.why}`).join('. ')));
    }
    /* The numerals are read against the first chord's root, an inference, so the page says
       which key it assumed.
       See lessons/page-nola.md#nola-108 */
    if (key !== null && key !== saidKey) {
      saidKey = key;
      d.log(`the numerals are read in the key of ${NOTE_NAMES[key]}, `
          + 'taken from the first chord in the line');
    }
    return { chords, bad, key };
  }

  // ── the roll listening instead of reading ──
  // The learning mode: chords you keep returning to join the roll, and after two it proposes
  // a next one. Spec: research/chord-learning-2026-09-23.md; arithmetic: demo/shell/name.mjs.
  // See lessons/page-nola.md#nola-109

  /** How long after the last finger moves before the page decides what it heard.
   *  A rolled chord is said to spread over 30 to 120 ms and a chord change at
   *  100 beats a minute is 600 ms apart. Both ends of that are guesses. */
  /* Notes closer than this are one chord. Measured on a 63 s take: 239 of 246 in-chord gaps
     are under 60 ms and between-chord gaps start at 120 ms, so 90 sits in the empty valley.
     See lessons/page-nola.md#nola-110 */
  const LEARN_WINDOW = 90;
  /**
   * The floor only rejects an accidental brush: real holds are one hump (quartiles 269 and
   * 506 ms), so no floor separates meant from passing chords. 120 ms keeps about 95 per cent
   * of notes; repetition (`LEARN_TIMES`) does the rest.
   * See lessons/page-nola.md#nola-111
   */
  const LEARN_GATE = 120;
  /**
   * Arrivals before a chord is kept. On a real 63 s take, three learns the two chords
   * actually dwelt on, and two also admits a passing one.
   * See lessons/page-nola.md#nola-112
   */
  const LEARN_TIMES = 3;
  /** Four to six, per the research. A full roll says so rather than evicting. */
  const LEARN_SLOTS = 6;
  /**
   * Which counted table the suggester reads: `?style=pop`, else jazz. The two disagree on the
   * first suggestion in 71.2 per cent of shared contexts. A new style is one string here.
   * See lessons/page-nola.md#nola-113
   */
  const LEARN_STYLE = q.get('style') === 'pop' ? 'pop' : 'jazz';
  /**
   * One seeded stream for every draw, so a session played the same way twice gives the same
   * lines and checks do not flake; the stream advances, so repeats differ. `?seed=` changes it.
   * See lessons/page-nola.md#nola-114
   */
  const DRAW_SEED = Number(q.get('seed')) || 20260925;
  const draw = mkRandom(DRAW_SEED);
  /**
   * The table (12,746 bytes) is fetched on a played chord, never on a visit, through `pull`.
   * Without it `suggest` falls back to a diatonic rule (1.4 per cent top 1 on held-out jazz
   * against the table's 48.5).
   * See lessons/page-nola.md#nola-115
   */
  let tablesJob = null;
  function ensureTables() {
    if (tablesJob) return tablesJob;
    tablesJob = (async () => {
      try {
        const buf = await pull('/resources/chord-tables.json');
        const got = useTables(JSON.parse(new TextDecoder().decode(buf)));
        d.log(`the ${got.join(' and ')} chord tables arrived, ${Math.round(buf.byteLength / 1024)} KB `
            + 'counted off 1,182 jazz standards and 890 pop chart entries, and this page reads the '
            + `${LEARN_STYLE} one`);
      } catch (e) {
        d.log(`the counted chord tables did not arrive, because ${e.message}, so the `
            + 'suggestions come from a diatonic rule that is much worse and says so', 'warn');
      }
    })();
    return tablesJob;
  }

  /* `Played` is the default; `?learn=0` opens on the typed line.
     See lessons/page-nola.md#nola-116 */
  let mode = q.get('learn') === '0' ? 'type' : 'learn';
  const settler = createSettler({ windowMs: LEARN_WINDOW, minNotes: 3 });
  const tally = createTally({ times: LEARN_TIMES, minHoldMs: LEARN_GATE, slots: LEARN_SLOTS });
  /** chord key -> the notes that were actually under the fingers, last time. */
  const playedAs = new Map();
  /** what has been admitted, in admission order. A row never moves and never
   *  leaves, which is `positron-ui`'s rule arriving as a data structure. */
  const learned = [];
  /** the two chords being proposed. The only rows that ever go away. */
  let guesses = [];
  let settleTimer = 0, admitTimer = 0, saidKeyLine = '', saidFiat = false, lastGuess = null;
  const saidUnsure = new Set();

  const rowLabel = (name, outside) =>
    [name, outside.length ? `${outside.length} above` : ''].filter(Boolean).join(' ');

  /** Put a learned or proposed chord where this keyboard's hands can reach it,
   *  which is the same arithmetic `drawChords` already uses. A row voiced any
   *  other way is the one row on the page the player cannot play. */
  /**
   * A proposal is voiced into the whole drawn keyboard, beside the last chord played; the
   * letter-key window (`REACH`) is for the typed line only.
   * See lessons/page-nola.md#nola-117
   */
  /* `split` is wide wherever it is used; see `drawChords`.
     See lessons/page-nola.md#nola-118 */
  const voiceRow = (notes, near, { wide = false } = {}) => voiceChord(notes, {
    mode: voicing, lo: keys.base, hi: keys.base + (wide || voicing === 'split' ? SHOWN() : REACH),
    near, bass: false });

  /**
   * The chord name on screen is the keyboard footer's. This is the settled reading (over
   * `LEARN_WINDOW`) that the tally, the roll and the checks use; null means nothing named,
   * distinct from an unsure name.
   * See lessons/page-nola.md#nola-119
   */
  let reading = null;
  function showReading(r) {
    /* Always one name; the margin decides how sure it looks.
       See lessons/page-nola.md#nola-120 */
    reading = r ? { label: r.label, sure: !!r.sure } : null;
  }

  /**
   * Two proposals, two jobs: the first is what usually follows here, the second the best
   * candidate this line has not used. Over 24 four chord loops the rule finds the real
   * third chord at top 1 nine times and at top 2 fifteen times.
   * See lessons/page-nola.md#nola-121
   */
  /** the proposal's notes, lit small on the keys, so the old one can be cleared */
  let aiLit = [];
  const lightGuess = (notes) => {
    for (const n of aiLit) keys.lightNote(n, false, 'ai');
    aiLit = notes || [];
    for (const n of aiLit) keys.lightNote(n, true, 'ai');
  };

  /** when the proposal on screen was offered, and whether it has been played */
  let guessAt = 0, guessPlayed = false, guessRedraws = 0, arriveTimer = 0;
  /** every chord this page has ever proposed, so none of them is ever learned */
  const proposed = new Set();
  /**
   * The current session's chords mixed into the table: +6.32 points of top 1 on 4,351
   * held-out contexts, at no cost on the other measures (plans/plan-better-chords-2026-09-25.md
   * section 14.2). A 64 chord window, nothing stored, gone with the tab.
   * See lessons/page-nola.md#nola-122
   */
  const take = mkTake();
  /**
   * How long a proposal is left alone, so it is not replaced while you reach for it. A
   * judgement, not a measurement: chords land every one to three seconds here. Playing the
   * proposal ends the hold at once.
   * See lessons/page-nola.md#nola-123
   */
  const GUESS_HOLD = 20000;

  function drawGuesses({ force = false } = {}) {
    /* Keep the one on screen if it is still unplayed and still fresh. It must be
       re-added rather than left alone, because `addLearned` has already trimmed
       the rows back to the learned ones by the time this runs. */
    const keep = !force && guesses.length && !guessPlayed
      && performance.now() - guessAt < GUESS_HOLD;
    /* Keeping needs nothing: the proposal row is already on screen.
       See lessons/page-nola.md#nola-124 */
    if (keep) return;
    /* Out with the old proposal, wherever it sits, and every row under it stays
       exactly where it is. */
    for (let i = roll.rows().length - 1; i >= 0; i--) {
      if (roll.rows()[i].kind === 'guess') roll.dropRow(i);
    }
    guessRedraws++;
    guesses = [];
    lastGuess = null;
    guessPlayed = false;
    lightGuess([]);
    if (mode !== 'learn' || learned.length < 2) return;
    guessAt = performance.now();
    const r = suggest({ chords: learned }, { style: LEARN_STYLE, rnd: draw, take });
    if (!r.ok) return;
    lastGuess = r;
    /* The key is a fiat: two chords fit 3.33 of 24 keys on average and a key and its relative
       minor share chords, so it cannot be inferred. `parseChords` supplies the sentence.
       See lessons/page-nola.md#nola-125 */
    if (r.says !== saidKeyLine) { saidKeyLine = r.says; d.log(r.says); }
    let near = learned.length ? learned[learned.length - 1].notes : [];
    /* One proposal, the `other` (pointwise mutual information) pick: it names the commonest
       chord 1.0 per cent of the time against 16.2 for the probability pick, and is still 90.7
       per cent attested over 251 held-out standards. Not yet judged by ear.
       See lessons/page-nola.md#nola-126 */
    /**
     * Never propose a chord already in the roll. Filtered, not re-ranked, so suggest.mjs's
     * order stands; if every answer is learned, nothing is proposed.
     * See lessons/page-nola.md#nola-127
     */
    const mine = new Set(learned.map((l) => l.key));
    const free = r.picks.filter((p) => {
      const c = parseChord(p.name);
      return c.ok && !mine.has(chordKey(c.root, c.quality));
    });
    const show = free.filter((p) => p.role === 'other').slice(0, 1);
    for (const p of (show.length ? show : free.slice(0, 1))) {
      const c = parseChord(p.name);
      if (!c.ok) continue;
      const { notes, outside } = voiceRow(c.notes, near, { wide: true });
      near = notes;
      guesses.push({ ...p, notes, outside });
      { const pc = parseChord(p.name); if (pc.ok) proposed.add(chordKey(pc.root, pc.quality)); }
      const at = roll.addRow({ kind: 'guess', notes, label: rowLabel(p.name, outside) });
      /* Marked new only on this path, the one that computed a proposal; the mark comes off after.
         See lessons/page-nola.md#nola-128 */
      const rowEl = roll.el.querySelectorAll('.roll-row')[at];
      if (rowEl) {
        rowEl.dataset.new = '1';
        keysHost.dataset.aiNew = '1';
        clearTimeout(arriveTimer);
        arriveTimer = setTimeout(() => {
          delete rowEl.dataset.new;
          delete keysHost.dataset.aiNew;
        }, 3200);
      }
      /* The proposal is also hinted on the keys: the roll says what, the keyboard says where.
         See lessons/page-nola.md#nola-129 */
      lightGuess(notes);
    }
  }

  function addLearned(key) {
    /* The table is fetched on the first learned chord, not on the mode, since a visit opens
       nothing; it arrives before the second chord, when the first proposal is drawn.
       See lessons/page-nola.md#nola-130 */
    ensureTables().then(() => { if (mode === 'learn' && learned.length >= 2) drawGuesses(); });
    const { name, root, quality } = fromKey(key);
    /* The roll is a log read downward: a new chord lands at the bottom and the proposal above
       it does not move.
       See lessons/page-nola.md#nola-131 */
    /* A learned row is drawn as played if it fits the keys on screen; the voicing control
       governs only the typed line and the proposal.
       See lessons/page-nola.md#nola-132 */
    const near = learned.length ? learned[learned.length - 1].notes : [];
    const asPlayed = playedAs.get(key);
    const fits = asPlayed && asPlayed.every((n) => n >= keys.base && n <= keys.base + SHOWN());
    const { notes, outside } = fits
      ? { notes: asPlayed, outside: false }
      : voiceRow(notesOf(key), near);
    learned.push({ key, name, root, quality, notes });
    /* No numeral on a learned row: the inferred key can change when a third chord arrives, so
       the key goes in the log instead.
       See lessons/page-nola.md#nola-133 */
    roll.addRow({ kind: 'learned', notes, label: rowLabel(name, outside) });
    d.log(`${name} is in the roll now, after `
        + `${(tally.msOf(key, performance.now()) / 1000).toFixed(1)} s of holding it`);
    drawGuesses();
  }

  function admitNow(at) {
    const { admitted, sayFull } = tally.check(at);
    if (sayFull) {
      d.log(`the roll is holding ${LEARN_SLOTS} chords already, so it has stopped learning `
          + 'rather than dropping one you played earlier', 'warn');
    }
    for (const key of admitted) addLearned(key);
  }

  /** the notes of the last reading that counted, so a finger moving inside a
   *  chord can be told from a chord change. Cleared when the hands come off. */
  let lastSet = null;
  /** the timer that gives a smaller chord its second window */
  let subsetTimer = 0;
  /**
   * How long a smaller chord must stand before it is believed. Measured: chords are at least
   * 120 ms apart and the median hold is 292 ms, so 250 ms is past a lifted finger.
   * See lessons/page-nola.md#nola-134
   */
  const SUBSET_HOLD = 250;
  function settleNow(at) {
    const got = settler.settle(at);
    if (!got) return;
    /**
     * A finger lifted is not a new chord: on a 46 s take, 55 of 181 transitions were a subset of
     * the reading before. A subset keeps the fuller reading and re-tallies nothing; a superset
     * is the chord arriving fully. Resets when the hands come off.
     * See lessons/page-nola.md#nola-135
     */
    if (lastSet && got.notes.length < lastSet.length
        && got.notes.every((n) => lastSet.includes(n))) {
      /* A subset is held, not dropped: a smaller chord can follow (`Amin` after `Fmaj7`). It is read
         if it is still exactly what is under the hands after `SUBSET_HOLD`; `heardChange` clears it.
         See lessons/page-nola.md#nola-136 */
      clearTimeout(subsetTimer);
      const want = [...got.notes].sort((a, b) => a - b).join(',');
      subsetTimer = setTimeout(() => {
        if ([...heldNotes].sort((a, b) => a - b).join(',') !== want) return;
        lastSet = null;                 // it stood, so it is a chord in its own right
        settler.reset();
        settler.held([...heldNotes], performance.now() - LEARN_WINDOW - 1);
        settleNow(performance.now());
      }, SUBSET_HOLD);
      return;
    }
    clearTimeout(subsetTimer);
    lastSet = [...got.notes];
    const r = nameChord(got.notes);
    if (!r.ok) { showReading(null); return; }
    /* Two notes name nothing sure except a bare fifth, which the recogniser reaches by itself.
       The note count gates the complaint and the margin gates the answer.
       See lessons/page-nola.md#nola-137 */
    showReading(got.enough ? r : null);
    /* Below the margin there are two names. At a margin of 1.0 the recogniser is never wrong
       on the 66.7 per cent of voicings it is sure of; the rest are genuinely ambiguous.
       See lessons/page-nola.md#nola-138 */
    /**
     * It commits anyway: the margin decides only how loudly. A close reading loses the confident
     * ink and `alts` keeps the other name. Stopping here left 40 to 108 readings a minute unwritten.
     * See lessons/page-nola.md#nola-139
     */
    if (!got.enough) return;
    const key = chordKey(r.root, r.quality);
    /**
     * The take is fed here, above every early return, with every settled chord including repeats.
     * `heard` needs a source: a suggester fed its own output cycles 56.8 per cent against 50.2.
     * `take.refused` is what the negative control reads.
     * See lessons/page-nola.md#nola-140
     */
    take.heard(r, proposed.has(key) ? 'suggested' : 'played');
    /* Keep where the hands were as well as the key: `chordKey` drops the voicing. The last way
       a chord was played is the one kept.
       See lessons/page-nola.md#nola-141 */
    /* Playing the proposal ends its hold; matched by chord key, so any voicing counts.
       See lessons/page-nola.md#nola-142 */
    /**
     * Trying the proposal does not teach it, so the suggester cannot feed itself.
     * See lessons/page-nola.md#nola-143
     */
    if (guesses.length) {
      const c = parseChord(guesses[guesses.length - 1].name);
      if (c.ok && chordKey(c.root, c.quality) === key && !guessPlayed) guessPlayed = true;
    }
    /**
     * Any chord this page has ever proposed, not only the one on screen, so the rule is
     * predictable. The cost: a suggestion you adopt is never learned.
     * See lessons/page-nola.md#nola-144
     */
    if (proposed.has(key)) { showReading(r); return; }
    /**
     * While a proposal is up and unplayed, nothing sharing its root is learned, since hunting
     * for a chord passes through others on the same root. Played or stale, the root is free again.
     * See lessons/page-nola.md#nola-145
     */
    if (guesses.length && !guessPlayed) {
      const g = parseChord(guesses[guesses.length - 1].name);
      if (g.ok && g.root === r.root) { showReading(r); return; }
    }
    playedAs.set(key, [...got.notes].sort((a, b) => a - b));
    tally.hold(key, at);
    const due = tally.dueAt(at);
    if (due !== null) {
      admitTimer = setTimeout(() => admitNow(performance.now()), Math.max(0, due - at));
    }
  }

  /**
   * Called from `tellRoll`: reads `heldNotes` (fingers, not voices), so a pedal cannot teach
   * a chord. A function declaration reached from an arrow defined above; nothing calls either
   * until a key is pressed.
   * See lessons/page-nola.md#nola-146
   */
  function heardChange() {
    if (mode !== 'learn') return;
    clearTimeout(settleTimer);
    clearTimeout(admitTimer);
    clearTimeout(subsetTimer);
    const now = performance.now();
    /* The fingers moved, so whatever was being held is no longer being held.
       The tally banks it and the next settle starts a new one. */
    tally.release(now);
    const due = settler.held([...heldNotes], now);
    if (due === null) { lastSet = null; showReading(null); return; }
    settleTimer = setTimeout(() => settleNow(performance.now()), Math.max(0, due - now));
  }

  /**
   * Re-voice every learned row. An octave press keeps the played voicing; a voicing press
   * (`revoice`) is a request to move them, so it overrides it.
   * See lessons/page-nola.md#nola-147
   */
  function rebuildLearnRoll({ revoice = false } = {}) {
    const was = roll.picked();
    const rows = [];
    for (const l of learned) {
      /* As played, unless `revoice` is set or the window has moved off the played notes.
         See lessons/page-nola.md#nola-148 */
      const asPlayed = playedAs.get(l.key);
      const fits = !revoice && asPlayed
        && asPlayed.every((n) => n >= keys.base && n <= keys.base + SHOWN());
      const { notes, outside } = fits
        ? { notes: asPlayed, outside: false }
        : voiceRow(notesOf(l.key), rows.length ? rows[rows.length - 1].notes : []);
      l.notes = notes;
      rows.push({ kind: 'learned', notes, label: rowLabel(l.name, outside) });
    }
    showChord(null);
    roll.setRows(rows);
    /* `setRows` cancels the selection; put it back, since the player still chose a row.
       `pick` toggles, so it is called only if something was picked and the row still exists.
       See lessons/page-nola.md#nola-149 */
    if (was >= 0 && was < rows.length) roll.pick(was);
    drawGuesses();
  }

  /**
   * `say` is false only on a load into the typed mode, which has nothing to announce.
   * See lessons/page-nola.md#nola-150
   */
  function applyMode(say) {
    clearTimeout(settleTimer);
    clearTimeout(admitTimer);
    settler.reset();
    tally.release(performance.now());
    /* The reading is dropped on every mode change, or the last chord of the old mode would
       sit in the state the checks read.
       See lessons/page-nola.md#nola-151 */
    showReading(null);
    /* In `Played` the chord field leaves the document rather than taking `hidden`, which
       `.pos-field`'s `display: inline-flex` overrides. It is also disabled, since a detached
       field can still be typed into through a reference.
       See lessons/page-nola.md#nola-152 */
    if (mode === 'learn') chordField.el.remove();
    else if (!chordField.el.isConnected) topRow.append(chordField.el);
    chordField.disabled(mode === 'learn');
    if (mode === 'learn') {
      showReading(null);
      rebuildLearnRoll();
    } else {
      drawChords(chordField.value());
    }
    if (!say) return;
    if (mode === 'learn') {
      /* `C6` and `Am7` are the same four notes; this is the one arbitrary choice. Dropping
         sixths instead takes the confident rate from 32.8 per cent to 72.0.
         See lessons/page-nola.md#nola-153 */
      if (!saidFiat) {
        saidFiat = true;
        d.log('a sixth chord and a minor seventh a third below it are the same four notes, '
            + 'so this page always reads C6 as Amin7 rather than guessing between them');
      }
      d.log(`play a chord, leave it, and play it again and it goes into the roll for good. `
          + `A chord is kept when you come back to it ${LEARN_TIMES} times, and touching it on `
          + `the way past does not count. Once two are in, one more is proposed under them`);
    } else {
      d.log('the roll is the line you type again, and the chords it learned are kept for '
          + 'when you come back to it');
    }
  }

  function setMode(id) {
    if (id === mode) return;
    mode = id;
    applyMode(true);
  }

  /**
   * Not in `.pos-controls`, where demo/verify.mjs would click it mid-check; the page's own
   * check presses it. Two named modes is `createChoice`: both names readable, one lit.
   * See lessons/page-nola.md#nola-154
   */
  const modePick = createChoice({
    label: 'ROLL',
    /* `Played` first and default. Checks that press by index see `buttons[0]` as `Played`.
       See lessons/page-nola.md#nola-155 */
    /* The label is `Suggested`; the value stays `learn`, which the checks and the query use.
       See lessons/page-nola.md#nola-156 */
    options: [['Suggested', 'learn'], ['Typed', 'type']],
    at: mode === 'learn' ? 0 : 1,
    onPick: (id) => setMode(id),
    title: (id) => (id === 'learn'
      ? 'the chords you keep coming back to go into the roll by themselves, and one more '
        + 'is proposed under them'
      : 'the roll is the line of chords typed in the field beside this'),
  });
  topRow.prepend(modePick.el);

  // ── what only this page can say ──
  // These run for everybody: they grade data already in hand. Anything that opens a file,
  // makes a sound, presses a control or moves the picture is behind `SELFCHECK`.
  // See lessons/page-nola.md#nola-157

  d.assert('one recording every minor third, from the bottom of a piano to the top',
    PIANO.notes.length === 30 && PIANO.notes[0] === 21 && PIANO.notes[29] === 108
    && PIANO.notes.every((n, i) => i === 0 || n - PIANO.notes[i - 1] === 3),
    `${PIANO.notes.length} notes, ${PIANO.notes[0]} to ${PIANO.notes[29]}, three apart`);

  /* The shift assert means something only because the set is sparse: 58 of 88 keys are bent.
     See lessons/page-nola.md#nola-158 */
  {
    let worstShift = 0, bent = 0;
    for (let n = 21; n <= 108; n++) {
      const s = Math.abs(n - nearestIn(PIANO.notes, n));
      if (s > worstShift) worstShift = s;
      if (s) bent++;
    }
    d.assert('every key on a piano is within one semitone of a recording',
      worstShift <= 1 && bent === 58,
      `worst bend ${worstShift} semitone across notes 21 to 108, and ${bent} of 88 keys are bent at all`);
  }

  /* The Rhodes is worse inside its range (gaps of 3 to 6 semitones), and worse still above
     note 96: the Stage 73 stops at MIDI 100. The assert says so in its detail.
     See lessons/page-nola.md#nola-159 */
  {
    let worst = 0, bent = 0, top = 0;
    for (let n = 29; n <= 96; n++) {
      const s = Math.abs(n - nearestIn(RHODES.notes, n));
      if (s > worst) worst = s;
      if (s) bent++;
    }
    for (let n = 97; n <= 108; n++) top = Math.max(top, n - nearestIn(RHODES.notes, n));
    d.assert('every key the Rhodes covers is within three semitones of a recording',
      worst === 3 && bent === 53 && top === 12,
      `worst bend ${worst} semitones over notes 29 to 96, ${bent} of those 68 keys bent, `
      + `and ${top} semitones at note 108, which is above the real instrument`);
  }

  /* Two independent sources: the search against `RHODES_KEYS`, the author's `lokey`/`hikey`.
     See lessons/page-nola.md#nola-160 */
  {
    let same = 0, off = [];
    for (let n = 21; n <= 108; n++) {
      const mine = nearestIn(RHODES.notes, n);
      const his = RHODES.notes[RHODES_KEYS.findIndex(([lo, hi]) => n >= lo && n <= hi)];
      if (mine === his) same++; else off.push(`${n}: ${mine} not ${his}`);
    }
    d.assert('the recording the Rhodes reaches for is the one its author\'s own key map names',
      same === 88 && off.length === 0,
      off.length ? off.slice(0, 3).join(', ') : `all 88 keys agree, including 32, 57 and 68 `
        + 'where two recordings are the same distance away');
  }

  /* The layer table with no sound: layer 1 is the hardest file and layer 5 the softest.
     See lessons/page-nola.md#nola-161 */
  {
    const seq = [];
    for (let v = 1; v <= 127; v++) seq.push(layerFor(v));
    const falls = seq.every((l, i) => i === 0 || l <= seq[i - 1]);
    const bands = [...new Set(seq)];
    d.assert('the softest press picks the softest recording and the hardest picks the hardest',
      layerFor(1) === 5 && layerFor(127) === 1 && falls && bands.length === 5,
      `velocity 1 to 127 runs through layers ${bands.join(' then ')}, `
      + `crossing at ${seq.map((l, i) => (i && l !== seq[i - 1] ? i + 1 : 0)).filter(Boolean).join(', ')}`);
  }

  /* The holes: without the fallback a hard press on the top notes would ask for a missing
     file.
     See lessons/page-nola.md#nola-162 */
  d.assert('a layer that stops short falls back to the one its author plays instead',
    RHODES.layerAt(81, 1) === 2 && RHODES.layerAt(91, 3) === 4
    && RHODES.layerAt(76, 1) === 1 && RHODES.layerAt(65, 3) === 3
    && RHODES.notes.every((n) => [1, 2, 3, 4, 5].every((l) => RHODES.layerAt(n, l) !== null)),
    `note 81 at the hardest layer plays his layer ${RHODES.layerAt(81, 1)} file and note 91 `
    + `at layer 3 plays his layer ${RHODES.layerAt(91, 3)}, and every one of the 75 `
    + 'note and layer pairs resolves to a file that exists');

  d.assert('a visit asks for no audio at all, counted rather than read off the page',
    gotFiles === 0 && gotBytes === 0,
    `${gotFiles} files and ${gotBytes} bytes before anything was pressed`);

  /* `__demo.logs`, not `d.logs`: the page's handle can write a line but not read them back.
     See lessons/page-nola.md#nola-163 */
  d.assert('the pedal is read on one controller, and the page says which',
    pedal.cc === PEDAL_CC && pedal.flipped() === PEDAL_FLIP
    && window.__demo.logs.some((l) => l.msg.includes(`controller ${PEDAL_CC}`)),
    `controller ${PEDAL_CC}${PEDAL_CC === SUSTAIN_CC ? ', the default' : ', from the query'}`
    + `, read ${PEDAL_FLIP ? 'upside down' : 'the right way up'}`);

  /* Negative control for `?flip=1`: two pedals, one byte, and they must disagree. The
     on-page switch is never flipped; it sends what the specification asks for.
     See lessons/page-nola.md#nola-164 */
  {
    const mine = createPedal({ cc: PEDAL_CC, flip: PEDAL_FLIP });
    const other = createPedal({ cc: PEDAL_CC, flip: !PEDAL_FLIP });
    mine.control(PEDAL_CC, 127);
    other.control(PEDAL_CC, 127);
    d.assert('reading the pedal upside down reaches the opposite conclusion from one byte',
      mine.down() !== other.down() && mine.down() === !PEDAL_FLIP,
      `a value of 127 reads ${mine.down() ? 'down' : 'up'} here and `
      + `${other.down() ? 'down' : 'up'} the other way up`);
  }

  async function checks() {
    /**
     * Driven through `press`, `lift` and `pedal.control`, the real handlers, since there is no
     * MIDI under a harness.
     * See lessons/page-nola.md#nola-165
     */
    const quiet = async () => { keys.panic(); await sleep(350); };

    await checkPatchbay();

    /* The checks put the page in the typed mode and back after, so `?learn=1` does not change
       which half of the page is graded.
       See lessons/page-nola.md#nola-166 */
    const openedIn = mode;
    modePick.buttons[1].click();   // TYPED, where the typed-line checks belong

    /**
     * The cheap checks go first: demo/verify.mjs leaves after about two seconds with no new
     * assert, and audio checks first cost 18 of 25 asserts while the run read green.
     * The count is the signal, not the colour.
     * See lessons/page-nola.md#nola-167
     */
    {
      const { chords, bad } = drawChords('Cmaj C9 F/C Fm6/C');
      d.assert('the chord line draws one row per chord, with the chord as dots on it',
        chords.length === 4 && bad.length === 0 && charts.length === 4
        && keys.el.querySelectorAll('.roll-row').length === 4,
        `${chords.length} chords, ${keys.el.querySelectorAll('.roll-row').length} rows, `
        + `${bad.length} refused`);

      /* The numerals read back off the page: the one on screen matches, and `Fm6/C` is lower case
         where `F/C` is not. chords-test.mjs grades the arithmetic.
         See lessons/page-nola.md#nola-168 */
      const drawn = [...keys.el.querySelectorAll('.roll-label')].map((t) => t.textContent);
      d.assert('each chord is drawn with its numeral, and the case says which third it has',
        drawn.join(', ') === 'Cmaj I, C9 I, F/C IV, Fmin6/C iv',
        drawn.join(', '));

      /* The dots are counted off the painted picture, not off the array the page built.
         See lessons/page-nola.md#nola-169 */
      const lit = [...keys.el.querySelectorAll('.roll-row')]
        .map((r) => r.querySelectorAll('.roll-cell.on').length);
      const want = charts.map((c) => c.chord.notes.length);
      d.assert('every note of every chord is a dot, and nothing else is',
        lit.join(',') === want.join(',') && charts.every((c) => c.outside.length === 0),
        `${lit.join(',')} dots against ${want.join(',')} notes`);

      /* The roll and the keyboard are one window, measured as column positions in pixels; they
         share only `placeKey`, so this is what keeps them agreeing.
         See lessons/page-nola.md#nola-170 */
      const colsOf = (root, pick) => {
        const box = root.getBoundingClientRect();
        return [...root.children].filter(pick).slice(0, 5)
          .map((k) => Math.round(k.getBoundingClientRect().left - box.left));
      };
      const white = (el) => !el.classList.contains('sharp');
      const onRoll = colsOf(keys.el.querySelector('.roll-lane'), white);
      const onKeys = colsOf(keysHost.querySelector('.keys'), white);
      d.assert('the roll lines up with the white keys under it, column for column',
        onRoll.join(',') === onKeys.join(','),
        `roll at ${onRoll.join(',')} px against ${onKeys.join(',')} px on the instrument`);

      /* The instrument switch is inside `keys.el`, under the component's own footer, its right
         edge at the box's: three claims, three rects, and inside `.kbd` is what `glued` means.
         See lessons/page-nola.md#nola-171 */
      const footBox = instFoot.getBoundingClientRect();
      const pickBox = instPick.el.getBoundingClientRect();
      const padBox = keys.el.querySelector('.kpad').getBoundingClientRect();
      const underPad = Math.round((footBox.top - padBox.bottom) * 10) / 10;
      const offRight = Math.round((footBox.right - pickBox.right) * 10) / 10;
      /* The row bleeds to the box's border, so its right-hand control sits `--kbd-pad` in, the
         inset the keys keep; read off the box, not typed.
         See lessons/page-nola.md#nola-172 */
      const kbdPad = parseFloat(getComputedStyle(keys.el).getPropertyValue('--kbd-pad'));
      d.assert('the instrument switch is a footer inside the keyboard\u2019s own box, hard right',
        instFoot.parentElement === keys.el
        && underPad >= 8 && underPad <= 12 && Math.abs(offRight - kbdPad) < 1
        && pickBox.width < footBox.width,
        `${underPad} px under the keyboard\u2019s own footer, ${offRight} px in from the `
        + `right edge against a ${kbdPad} px box inset, and ${Math.round(pickBox.width)} px `
        + `of control in a ${Math.round(footBox.width)} px row`);

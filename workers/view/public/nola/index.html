        note: 'A piano octave at a time and a single Rhodes file per note and velocity layer, '
            + 'on the first press that needs one. A release is a **setTargetAtTime** over about '
            + '0.12 s rather than a stop, because a stop is a click.' },
    ],
  }, { how: true, atEnd: true });

  /* The chords the field opens with, drawn before anybody types; fetches and sounds nothing.
     Through `applyMode`, so the default `Played` opens on an empty listening roll.
     See lessons/page-nola.md#nola-281 */
  applyMode(mode === 'learn');
  setTranspose(Number(q.get('transpose')) || 0);

  /**
   * The checks run at load and are not awaited: there is no control row for verify.mjs to
   * press.
   * See lessons/page-nola.md#nola-282
   */
  ifSelfcheck(checks, { log: d.log,
    say: 'the checks this page runs on itself are off for a visitor, because they play notes '
       + 'and press the controls in front of you' });

  /**
   * `ready()` goes after the checks start, not after they finish: verify.mjs waits up to six
   * seconds for `__demo.ready`, so a late ready deadlocks it. The tally log line is early.
   * See lessons/page-nola.md#nola-283
   */
  d.ready();
</script>

<style>
  /* The instrument footer has no rule here: `createKeyboard({ foot: true })` gives `api.foot`,
     and `.kbd-foot` in shell.css carries the line, the bleed and the insets. This page decides
     only what is in the row.
     See lessons/page-nola.md#nola-284 */

  /* The mode and the field it hides are one row. With no caption on the field the row is
     34 px in both modes at 1280; at 375 it wraps and changes height (97.5 to 47.5 px).
     See lessons/page-nola.md#nola-285 */
  .nola-top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .nola-top .pos-field { flex: 1 1 220px; min-width: 0; }

  /* See lessons/page-nola.md#nola-286 */

  /* See lessons/page-nola.md#nola-287 */

  /* A proposal is not a chord the page heard you play, so it does not wear the same ink;
     the dots keep their colour.
     See lessons/page-nola.md#nola-288 */
  /* The dot is the cell's `::after`; a background on the cell paints the whole column.
     See lessons/page-nola.md#nola-289 */
  .nola-rec { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .nola-rec-say { color: var(--dim); font: 400 11px/1.4 var(--mono); }

  /* A proposal's mark is smaller and grows into a played one. `transform`, not width, so no
     cell resizes and the columns stay put.
     See lessons/page-nola.md#nola-290 */
  /* A ring, not a smaller dot: an outline at the same size reads as an empty slot without a
     neighbour to compare against. It fills when you play the chord.
     See lessons/page-nola.md#nola-291 */
  /* See lessons/page-nola.md#nola-292 */
  .roll-row[data-kind="guess"] .roll-label { color: var(--ai); }
  /* Same ring and dot sizes as the keyboard (`--k-ring` is `--k-dot` plus 4 px, from
     shell.css). A played proposal is a dot inside its ring, a radial gradient in one box.
     See lessons/page-nola.md#nola-293 */
  .roll-row[data-kind="guess"] .roll-cell.on::after {
    width: var(--k-ring); height: var(--k-ring);
    background: none; box-shadow: inset 0 0 0 1px var(--ai);
    transition: background 120ms linear;
  }
  .roll-row[data-kind="guess"][data-held] .roll-cell.on::after {
    background: radial-gradient(circle at 50% 50%,
      var(--ai) 0 calc(var(--k-dot, 6px) / 2), transparent calc(var(--k-dot, 6px) / 2));
  }

  /* A new proposal animates in, only on a row the page marked `data-new` (a redraw that keeps
     it does not). `transform` and `opacity` only, so nothing moves the columns.
     See lessons/page-nola.md#nola-294 */
  /* One duration for the roll and the keys, which draw one proposal; a custom property so the
     two cannot disagree.
     See lessons/page-nola.md#nola-295 */
  /* It waits, then fades in, so it does not land on the chord just played; `backwards` keeps
     it invisible through the wait.
     See lessons/page-nola.md#nola-296 */
  :root { --nola-arrive: 2200ms; --nola-wait: 700ms; }
  /* The curve is slow in the middle: an expo-out ease finishes most of its distance in the
     first fifth, so a 2.2 s fade looked like 0.3 s. Opacity stays near linear.
     See lessons/page-nola.md#nola-297 */
  @keyframes nola-arrive {
    0%   { transform: scale(.45); opacity: 0; }
    50%  { transform: scale(1.08); opacity: .45; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes nola-arrive-label { 0% { opacity: 0; } 50% { opacity: .35; } 100% { opacity: 1; } }
  .roll-row[data-new] .roll-cell.on::after {
    animation: nola-arrive var(--nola-arrive) var(--nola-wait)
               cubic-bezier(.37, 0, .63, 1) backwards;
  }
  .roll-row[data-new] .roll-label {
    animation: nola-arrive-label var(--nola-arrive) var(--nola-wait) linear backwards;
  }
  /* the same arrival on the keys, so the hand is told where as well as what */
  .nola-keys[data-ai-new] .k.ai .kd::after {
    animation: nola-arrive var(--nola-arrive) var(--nola-wait)
               cubic-bezier(.37, 0, .63, 1) backwards;
  }
  /* Reduced motion: the mark is drawn, it just does not travel.
     See lessons/page-nola.md#nola-298 */
  @media (prefers-reduced-motion: reduce) {
    .roll-row[data-new] .roll-cell.on::after,
    .roll-row[data-new] .roll-label,
    .nola-keys[data-ai-new] .k.ai .kd::after { animation: none; }
  }
  /* A proposal is faded until you play it: enough to sit behind the played rows, not enough to
     read as disabled.
     See lessons/page-nola.md#nola-299 */
  /* Light, because the ring is already the quiet form of a dot. No control: the fade is a fact
     about the row and clears when you play it.
     See lessons/page-nola.md#nola-300 */
  .roll-row[data-kind="guess"] { opacity: .85; transition: opacity 90ms linear; }
  .roll-row[data-kind="guess"][data-held] { opacity: 1; }

  /* A chord half played: `--hi`, the pressed-key ink, at lower strength. roll.mjs marks no
     dots once the whole chord is down, as the row lights then. Needs (0,3,0) to beat
     `.roll-row[data-on] .roll-cell.on::after`, which comes later.
     See lessons/page-nola.md#nola-301 */
  .roll .roll-cell.on[data-part]::after {
    background: color-mix(in srgb, var(--hi) 45%, transparent);
  }
  /* Controls about the keys sit with the octave pad, not in `.pos-controls`.
     See lessons/page-nola.md#nola-302 */
  .nola-pad { display: flex; align-items: center; gap: 10px; margin-top: -4px; }

  /* A chord and its picture. The list wraps, so a long line of chords becomes
     rows rather than a sideways scroll: `tabs.mjs` already records that a
     scrolling row drags the whole page sideways on a phone. */
  /* One chart per row, at the keyboard's own width, so a key is the same size in both.
     See lessons/page-nola.md#nola-303 */
  .nola-chords { display: flex; flex-direction: column; gap: 12px; }
  .nola-chord { width: 100%; min-width: 0; }
  /* `nowrap` and `tabular-nums`, so a chord name never changes the width of what it sits over.
     See lessons/page-nola.md#nola-304 */
  .nola-chord-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .nola-chord-n { font: 600 12px/1.4 var(--mono); letter-spacing: .06em;
                  color: var(--fg); white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  /* A second ink: the numeral is what the name means in this key.
     See lessons/page-nola.md#nola-305 */
  .nola-chord-r { font: 600 12px/1.4 var(--mono); color: var(--hi);
                  white-space: nowrap; }
  /* A chord with a note the window cannot draw says so beside its name, because
     a chart with one key missing and nothing said is the silent kind of wrong. */
  .nola-chord-o { font: 500 11px/1.4 var(--mono); color: var(--warn);
                  white-space: nowrap; }
  /* Chart keys are shorter than the playing keyboard's, black keys in proportion.
     See lessons/page-nola.md#nola-306 */
  .nola-chord-k .k { height: 44px; }
  .nola-chord-k .k.sharp { height: 27px; }
  .nola-chord-k .kbd { margin: 0; }
  .nola-chord-k .keys { margin: 0; }

  /* A token the parser refused, shown back. `.pos-log` is for things that
     HAPPENED; this is a standing statement about what is in the field, so it
     lives beside the charts it is missing from. */
  .nola-bad { flex: 1 1 100%; font: 500 12px/1.5 var(--mono); color: var(--warn); }

  /* A 2 px gap rather than the component's 3, so fifteen white keys fit at `KEY_MIN` without
     scrolling on a desktop. Only this page's keyboards.
     See lessons/page-nola.md#nola-307 */
  /* The gap is the `--k-gap` property, not a rule on `.keys`, so the roll's grid reads the
     same number and its columns stay aligned with the keys.
     See lessons/page-nola.md#nola-308 */
  .nola-keys { --k-gap: 2px; }
  .nola-keys { display: block; }

  /* The picker, the keys and the credit are one block (stack.mjs: a tight pair is one block).
     See lessons/page-nola.md#nola-309 */
  .nola-inst { display: flex; flex-direction: column; gap: 12px; }

  /* The credit the Rhodes licence requires (CC BY-NC-SA), a standing statement, so it sits
     with the keys rather than in `.pos-log`.
     See lessons/page-nola.md#nola-310 */
  .nola-credit { font: 500 11px/1.5 var(--mono); color: var(--dim); }
  .nola-credit a { color: var(--dim); text-decoration: underline;
                   text-underline-offset: 2px; }
  .nola-credit a:hover, .nola-credit a:focus-visible { color: var(--fg); }

  /* Join and its badge, one cluster next to the nameplate on the keyboard's foot
     (`/fau/engine-node.mjs`). `margin-right: auto` keeps it beside the plate
     rather than centred in a row whose two ends are the plate and the picker. */
  .eng-bay { display: inline-flex; align-items: center; gap: var(--ctl-gap); }
  .kbd-foot > .eng-bay { margin-right: auto; }
</style>
</html>

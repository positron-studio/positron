<!-- The front page is the concepts index: the hero over the cards of
     demo/shell/concept-list.mjs. /concepts/ forwards here (workers/view/src/index.js).
     See lessons/page-index.md#index-1 -->
<title>positron</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="icon" href="/favicon.ico">
<style>
  .cc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .cc-card {
    display: flex; flex-direction: column; gap: 6px;
    min-height: 115px;   /* three lines of a 100 character description. See lessons/page-index.md#index-2 */
    padding: var(--inset, 12px);
    background: var(--card);
    border: var(--edge, 1px solid var(--line));
    border-radius: var(--r, 4px);
    color: inherit; text-decoration: none;
  }
  .cc-card:hover { border-color: color-mix(in oklab, var(--fg) 35%, var(--line2)); }
  /* No number on a card: the title is the whole name and the address is
     /<group>/<slug>/. `.cc-n` is only the `demo` word on a demo card.
     See lessons/page-index.md#index-3 */
  .cc-n { font: 400 12px var(--mono); color: var(--dim); }
  /* The title names the page, so it is the mono; the line under it is read
     through, so it is Geist (`--sans`, the body's face). Both balanced, as
     /kit/frontpage/ sets them. */
  .cc-t { margin: 0; font-size: 15px; font-family: var(--mono); }
  .cc-t, .cc-s { text-wrap: balance; }
  /* The `demo` word before a demo card's title, quieter than the title. */
  .cc-t .cc-n { color: var(--dim); margin-right: 10px; }
  .cc-s { margin: 0; color: var(--dim); font-size: 13.5px; }
  /* Two card colours from the concepts' medium palette (positron-concepts), so
     a reader tells a concept page from a full demo and a demo from a use case.
     midi blue for a demo beside the concepts, file orchid for a use case. */
  :root { --cc-demo: #6fb8e8; --cc-case: #d68fc6; }
  .cc-card.cc-demo {
    background: color-mix(in srgb, var(--cc-demo) 7%, var(--card));
    border-color: color-mix(in srgb, var(--cc-demo) 35%, var(--line));
  }
  .cc-card.cc-demo .cc-n { color: var(--cc-demo); }
  .cc-card.cc-demo:hover { border-color: var(--cc-demo); }
  /* A demo a concept page covers: an inverted badge, never red and never `--hi`,
     the covering page's name left of it. Its line box is the title's, so the card
     keeps its size.
     See lessons/page-index.md#index-4 */
  .cc-demo .cc-off {
    flex: none; margin-left: 8px; align-self: center;
    padding: 0 6px; border-radius: 3px;
    background: var(--fg2); color: var(--bg);
    font: 600 10px/1.6 var(--mono); letter-spacing: .07em; text-transform: uppercase;
    white-space: nowrap;
  }
  .cc-demo .cc-t:has(.cc-off) { display: flex; align-items: baseline; }
  .cc-demo .cc-by { margin-left: auto; padding-left: 10px; font: 400 12px var(--mono); color: var(--dim2); white-space: nowrap; }
  /* A use case card carries more: the front page's group above the title and
     its address under the line, so it keeps a taller size of its own. */
  .cc-card.cc-case {
    min-height: 140px;
    background: color-mix(in srgb, var(--cc-case) 7%, var(--card));
    border-color: color-mix(in srgb, var(--cc-case) 35%, var(--line));
  }
  .cc-card.cc-case:hover { border-color: var(--cc-case); }
  .cc-case .cc-g { font: 400 12px var(--mono); color: var(--cc-case); }
  .cc-case .cc-t { font-size: 17px; }
  .cc-case .cc-u { margin-top: auto; font: 400 12px var(--mono); color: var(--dim2); }
  /* The wordmark sits on the Feedback row (see the script), so the hero starts at
     its headline, with a little less space above than a demo page.
     See lessons/page-index.md#index-5 */
  /* Contact: two icon buttons left of Feedback, drawn like it (26 px, its edge,
     dim2 lit to fg). SVG strokes, not font glyphs, so the shape is the same
     everywhere; the address and handle are in title and aria-label. */
  .cc-contact {
    display: inline-grid; place-items: center; width: 26px; height: 26px;
    color: var(--dim2); border: 1px solid var(--line2); border-radius: 4px;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  .cc-contact:hover { color: var(--fg); }
  .cc-contact svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .pos-title:has(> .cc-contact) { gap: 8px; }
  .pos-title > .cc-contact:first-of-type { margin-left: auto; }
  .pos-title:has(> .cc-contact) .pos-fb-btn { margin-left: 0; }
  .pos-title .pos-hero-eye { margin: 0; flex: 1 1 auto; }
  .pos-hero.pos-hero-index { padding-top: 8px; }
  .pos-hero-index .pos-hero-h { margin-top: 0; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { createHero } from '/shell/hero.mjs';

  import { CONCEPTS, CONCEPT_GROUPS, CASE_GROUPS, DEMO_CARDS, GROUP_TITLES } from '/shell/concept-list.mjs';
  import { DEMOS, GROUPS, targetOf } from '/manifest.mjs';

  // `general` because this is where a note about the site as a whole is left,
  // the slug the old front page's own feedback button wrote (archive/frontpage/).
  // No back link: this is where every `← concepts` arrives.
  const d = mount({ name: 'general', what: '', readout: null, index: null, showLog: false });
  document.title = 'positron';
  // THE HERO, LARGE on top, the block /kit/frontpage/ shows (demo/shell/hero.mjs),
  // one copy for both. Its headline is this page's h1, so the shell's own title
  // goes and the Feedback button keeps the title row to itself.
  const hero = createHero({ tag: 'h1' });
  d.el.prepend(hero.el);
  // The wordmark takes the title's place, on the Feedback button's row and centred on it.
  // See lessons/page-index.md#index-6
  const nameEl = document.querySelector('.pos-head .pos-name');
  const eye = hero.el.querySelector('.pos-hero-eye');
  if (nameEl && eye) nameEl.replaceWith(eye);
  hero.el.classList.add('pos-hero-index');

  // Concept groups first, in CONCEPT_GROUPS order (a group only CONCEPTS uses
  // is added at the end so nothing vanishes), then the use case groups. Each is
  // one block under the kit's section heading, built when it first gets a card.
  const order = [...CONCEPT_GROUPS];
  for (const c of CONCEPTS) { const g = c.group || c.id.split('/')[0]; if (!order.includes(g)) order.push(g); }
  order.push(...CASE_GROUPS, 'other');
  const cards = new Map(order.map((g) => [g, []]));

  CONCEPTS.forEach(({ title, say, id, group: shown }) => {
    // `id` is `<group>/<slug>`, the page's folder under demo/ and its URL.
    const [folder] = id.split('/');
    // A row may show under another heading than its folder (`group` in concept-list.mjs).
    const group = shown || folder;
    const a = el('a', 'cc-card', '', { href: `/${id}/` });
    a.append(el('h3', 'cc-t', title));
    if (say) a.append(el('p', 'cc-s', say));
    cards.get(group).push(a);
  });

  // The front page's demos, listed and built rows only, in the manifest's story
  // order. A row with no entry in DEMO_CARDS lands under `other` rather than
  // disappearing, and says so in the console.
  for (const row of DEMOS) {
    if (!row.built || row.unlisted) continue;
    const at = DEMO_CARDS[row.name];
    if (!at) console.warn(`concepts: ${row.name} has no entry in DEMO_CARDS`);
    const group = at?.group || 'other';
    const say = at?.say || row.one || '';
    const href = targetOf(row);
    const name = row.title || row.name;
    if (!cards.has(group)) cards.set(group, []);
    if (at?.plain) {
      // A plain card like the concept cards, no badge and no path: the kit under its
      // own heading.
      // See lessons/page-index.md#index-7
      const a = el('a', 'cc-card', '', { href });
      a.append(el('h3', 'cc-t', at.title || name), el('p', 'cc-s', say));
      cards.get(group).push(a);
    } else if (CONCEPT_GROUPS.includes(group)) {
      const a = el('a', 'cc-card cc-demo', '', { href });
      const h = el('h3', 'cc-t');
      h.append(el('span', 'cc-n', 'demo'), document.createTextNode(name));
      a.append(h, el('p', 'cc-s', say));
      const by = at?.supersededBy && CONCEPTS.find((c) => c.id === at.supersededBy);
      if (at?.supersededBy && !by) console.warn(`concepts: ${row.name} is superseded by ${at.supersededBy}, which is not in CONCEPTS`);
      if (by) {
        // The covering page's name left of the badge, no line of its own.
        // See lessons/page-index.md#index-8
        h.append(el('span', 'cc-by', by.title), el('span', 'cc-off', 'not needed'));
        a.title = `not needed\n/${by.id}/ shows the same idea`;
      }
      cards.get(group).push(a);
    } else {
      const a = el('a', 'cc-card cc-case', '', { href });
      a.append(el('span', 'cc-g', GROUPS.get(row.group) || row.group || ''),
        el('h3', 'cc-t', name), el('p', 'cc-s', say), el('span', 'cc-u', `/${row.name}/`));
      cards.get(group).push(a);
    }
  }

  for (const [group, list] of cards) {
    if (!list.length) continue;
    const g = el('div', 'cc-cards');
    g.append(...list);
    d.stack.titled(GROUP_TITLES[group] || group, g);
  }
  // No link to /archive/ from here; the page stays at its URL.
  // See lessons/page-index.md#index-9

  // Contact, left of Feedback. The Instagram handle is not registered yet.
  const ICONS = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/>',
    instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/>',
    // Feather's github mark (MIT), stroked like the other two
    github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
  };
  const contact = (href, name, label, extra = {}) => {
    const a = el('a', 'cc-contact', '', { href, title: label, 'aria-label': label, ...extra });
    a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
    return a;
  };
  document.querySelector('.pos-head .pos-fb-btn')?.before(
    contact('mailto:positron@positron.studio', 'mail', 'positron@positron.studio'),
    contact('https://www.instagram.com/positron.studio/', 'instagram', 'Instagram @positron.studio', { rel: 'noopener', target: '_blank' }),
    contact('https://github.com/positron-studio/positron', 'github', 'GitHub positron-studio/positron', { rel: 'noopener', target: '_blank' }),
  );
  d.ready();
</script>

<!doctype html>
<html lang="en">

<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The grid asks its OWN width, never the window's: a component in a narrow
     column must not be told it has a desk's worth of room. Two columns, and one
     below the width where two 16:9 pictures stop being readable. */
  .cam-wrap { container-type: inline-size; }
  .cam-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: calc(2 * var(--ctl-gap));
  }
  @container (max-width: 560px) {
    .cam-grid { grid-template-columns: minmax(0, 1fr); }
  }
  /* The path's name leads each footer. It is a name, not a readout key, so it
     wears the value ink rather than the key's dimmed one. */
  .cam-name { font: 500 11px/1.4 var(--mono); color: var(--fg); white-space: nowrap; }
  /* Four pictures under one heading, one per panel. Each one after the first
     opens its own part of that section, so it takes the page's block gap. */
  .cam-dg + .cam-dg { margin-top: var(--pos-gap); }
</style>

<script type="module">
  import { mount, guard, el, armVideo } from '/shell/shell.mjs';
  import { whepPlay, fetchIceServers, probeUdp, camWhipPublish, camWhep, RETIRED_LEG } from '/shell/live.mjs';
  import { createPresenceButton, CAMERA, CAMERA_CAN } from '/shell/presence.mjs';
  import { startMoq, moqSupport } from '/shell/moq.mjs';
  import { drawCamera, burn, readBurnedFrom, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'cam',
    // The index's own line, verbatim, because this page has a diagram.
    what: 'One webcam next to what comes back over WebRTC and MoQ.',
    // Every latency is a fact about ONE picture and sits in that picture's
    // footer. A row above the grid repeating four of them would be the same
    // facts twice.
    readout: null,
    // No declared control: the one control is a CAMERA ON / CAMERA OFF status button built
    // below, in the same row verify.mjs presses.
    // See lessons/page-cam.md#cam-1
    controls: [],
  });
  guard(d);
  const camBtn = createPresenceButton({
    of: '', showName: false, state: 'offline', says: CAMERA, can: CAMERA_CAN,
    aria: 'start or stop the camera',
    press: () => pressCam(),
  });
  /**
   * `data-busy` by hand, since this is not a declared control and verify.mjs waits on that
   * mark. Not disabled: a press while starting stops.
   * See lessons/page-cam.md#cam-2
   */
  let pressing = 0;
  async function pressCam() {
    const b = camBtn.el;
    pressing++;
    b.dataset.busy = '1';
    try { await d.run('cam'); } finally { if (--pressing === 0) delete b.dataset.busy; }
  }
  camBtn.because('nothing is recorded or sent until you press');
  d.controls.hidden = false;
  d.controls.append(camBtn.el);

  /**
   * The LL-HLS leg is retired (input deleted, pub answers /cam with 410), so the panel stays
   * with a footer saying so. The same publish lives on in /video/llhls/.
   * See lessons/page-cam.md#cam-3
   */
  const HLS_ON = false;
  const HLS = { pub: null, player: null, st: null, err: null, readyAt: null, liveAt: null, uid: null, firstMs: null, rebuilds: 0, starts: [] };
  function startHls() {
    sayOn(P.hls, 'retired 2026-10-13');
    d.log(`ll-hls: ${RETIRED_LEG}. its input and pub's /cam are deleted, so nothing is sent`);
  }
  function stopHls() {
    try { HLS.pub?.stop(); } catch { /* gone */ }
    try { HLS.player?.destroy(); } catch { /* gone */ }
    HLS.pub = null; HLS.player = null;
    try { hlsV.removeAttribute('src'); hlsV.load(); } catch { /* fine */ }
  }

  // ── four pictures ────────────────────────────────────────────────────────
  const video = (muted = true) => {
    const v = el('video', '', null, { playsinline: '', muted: '', autoplay: '' });
    v.muted = muted;
    return v;
  };
  const localV = video(), hlsV = video(), rtcV = video();
  const moqC = el('canvas');

  // Each footer's label says what kind of latency it carries: capture to screen locally,
  // glass to glass for the three that went out. `state` is the last cell with no reserve.
  // See lessons/page-cam.md#cam-4
  const panel = (name, media, values) => {
    const p = createVideoPanel({ media, left: el('span', 'cam-name', name), fullMode: 'hover',
      values: [...values, { key: 'state', label: '' }] });
    p.said = false;
    return p;
  };
  const sayOn = (p, text) => p.values.set('state', text);
  const saidOn = (p) => p.values.cell('state')?.textContent || '';
  const P = {
    local: panel('Camera', localV, [
      { key: 'lat', label: 'capture to screen', reserve: 6 },
      { key: 'size', label: '', reserve: 9 },
    ]),
    hls: panel('LL-HLS', hlsV, [
      { key: 'lat', label: 'glass to glass', reserve: 9 },
    ]),
    rtc: panel('WebRTC', rtcV, [
      { key: 'lat', label: 'glass to glass', reserve: 6 },
      { key: 'size', label: '', reserve: 9 },
    ]),
    moq: panel('MoQ', moqC, [
      { key: 'lat', label: 'glass to glass', reserve: 6 },
    ]),
  };
  const wrap = el('div', 'cam-wrap');
  const grid = el('div', 'cam-grid');
  grid.append(P.local.el, P.hls.el, P.rtc.el, P.moq.el);
  wrap.append(grid);
  d.el.append(wrap);

  // ── measuring ────────────────────────────────────────────────────────────
  const WINDOW = 90;   // three seconds of frames at 30fps
  const median = (a) => {
    if (!a.length) return null;
    const s = a.slice().sort((x, y) => x - y);
    return s[Math.floor(s.length / 2)];
  };
  const ms = (x) => (x == null ? '' : `${Math.round(x)} ms`);

  /**
   * Glass to glass off the burned clock, per presented frame (`requestVideoFrameCallback`).
   * One page sends and reads, so one clock makes the difference exact.
   * See lessons/page-cam.md#cam-5
   */
  function meter(v) {
    const m = { samples: [], all: 0, frames: 0, bad: 0, live: true, firstAt: null };
    const scratch = document.createElement('canvas');
    if (typeof v.requestVideoFrameCallback !== 'function') return m;
    const tick = () => {
      if (!m.live) return;
      m.frames++;
      const burned = readBurnedFrom(v, scratch);
      if (burned == null) m.bad++;
      else {
        if (m.firstAt == null) m.firstAt = performance.now();
        m.samples.push(performance.timeOrigin + performance.now() - burned);
        if (m.samples.length > WINDOW) m.samples.shift();
        m.all++;
      }
      v.requestVideoFrameCallback(tick);
    };
    v.requestVideoFrameCallback(tick);
    return m;
  }

  /**
   * Capture to screen on the local preview, from `captureTime` and `expectedDisplayTime`.
   * Without `captureTime` the cell stays empty.
   * See lessons/page-cam.md#cam-6
   */
  function localMeter(v) {
    const m = { samples: [], frames: 0, live: true };
    if (typeof v.requestVideoFrameCallback !== 'function') return m;
    const tick = (_now, meta) => {
      if (!m.live) return;
      m.frames++;
      if (meta && meta.captureTime != null && meta.expectedDisplayTime != null) {
        m.samples.push(meta.expectedDisplayTime - meta.captureTime);
        if (m.samples.length > WINDOW) m.samples.shift();
      }
      v.requestVideoFrameCallback(tick);
    };
    v.requestVideoFrameCallback(tick);
    return m;
  }

  // ── state ────────────────────────────────────────────────────────────────
  let gen = 0;
  let cam = null;             // the MediaStream from getUserMedia
  let camErr = null;          // why it did not start, in words
  let src = null, draw = null, sendStream = null;
  let pub = null, sub = null, rtcErr = null;
  let leg = null, moqErr = null;
  // What this network lets through, asked once per press and never on a visit.
  // `ice` is the worker's answer about a relay; `udp` is one STUN binding
  // request, which is the only honest way to say a network blocks UDP.
  let ice = null, udp = null, udpAsk = null;
  const NO_UDP = 'This network blocks UDP';
  let meters = {}, paint = null;
  // Frames the MoQ publisher drew with the camera, so a leg that fell back to
  // its own test pattern cannot pass as one carrying the camera.
  let moqPainted = 0;
  let gumBeforePress = 0, gumCalls = 0;
  let openedBeforePress = null;

  const OURS = /cloudflarestream\.com|pub\.positron\.studio|mediaoverquic\.com/;
  const oursOpened = () => performance.getEntriesByType('resource').filter((e) => OURS.test(e.name)).length;

  const running = () => !!cam;
  /* Two tiers: camera, preview and outgoing frame run in an ordinary harness run; relays,
     UDP probe, WHIP/WHEP and MoQ loopback only under `DEMO_DEEP=1`. A visitor is never LIGHT.
     See lessons/page-cam.md#cam-7 */
  const LIGHT = SELFCHECK && !DEEP;

  // A press on `camera off` starts; a press while starting or on stops.
  d.on('cam', async () => {
    if (running() || camBtn.state() !== 'offline') { await stop(); return; }
    await start();
  });

  async function start() {
    const mine = ++gen;
    openedBeforePress = oursOpened();
    gumBeforePress = gumCalls;
    camErr = null; rtcErr = null; moqErr = null; ice = null; udp = null; udpAsk = null;
    moqPainted = 0;
    armVideo(localV); armVideo(rtcV); armVideo(hlsV);   // before any await, or iOS refuses later
    camBtn.set('coming').because('press again to stop it');
    try {
      gumCalls++;
      cam = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } },
        audio: false,
      });
    } catch (e) {
      cam = null;
      // The capability, not a raw error string.
      camErr = e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera'
        : `the camera did not start (${e?.name || e})`;
      d.log(`${camErr}, so nothing was sent anywhere`, 'bad');
      camBtn.set('offline').because(camErr);
      if (SELFCHECK) await d.run('check');
      return;
    }
    if (gen !== mine) { cam.getTracks().forEach((t) => t.stop()); cam = null; return; }
    const track = cam.getVideoTracks()[0];
    const s = track.getSettings();
    d.log(`camera on: ${track.label || 'default'} at ${s.width}x${s.height}`, 'hi');
    localV.srcObject = cam;
    localV.play().catch(() => {});
    P.local.values.set('size', `${s.width}x${s.height}`);

    // The camera drawn into a 1280x720 frame, contained, with the clock row
    // burned over it. This canvas is what leaves the page over WebRTC, and the
    // MoQ leg paints its own canvas with the same function.
    src = document.createElement('canvas');
    src.width = FRAME_W; src.height = FRAME_H;
    const ctx = src.getContext('2d', { alpha: false });
    let i = 0;
    draw = setInterval(() => cameraFrame(ctx, FRAME_W, FRAME_H, i++), 1000 / 30);
    sendStream = src.captureStream(30);

    meters.local = localMeter(localV);
    meters.rtc = meter(rtcV);
    paint = setInterval(() => {
      P.local.values.set('lat', ms(median(meters.local.samples)));
      P.rtc.values.set('lat', ms(median(meters.rtc.samples)));
      if (rtcV.videoWidth) P.rtc.values.set('size', `${rtcV.videoWidth}x${rtcV.videoHeight}`);
      if (meters.hls?.live) {
        P.hls.values.set('lat', ms(median(meters.hls.samples)));
        if (HLS.firstMs == null && meters.hls.firstAt != null && HLS.readyAt != null) {
          HLS.firstMs = meters.hls.firstAt - HLS.readyAt;
          d.log(`ll-hls: first camera frame back ${(HLS.firstMs / 1000).toFixed(1)} s after recording began`, 'hi');
        }
      }
      if (leg) {
        const p50 = leg.pct(0.5);
        if (p50 != null) P.moq.values.set('lat', ms(p50));
      }
    }, 1000);

    // LL-HLS: not awaited, because the container may be waking and the other
    // two legs should not wait on it.
    Object.assign(HLS, { st: null, err: null, readyAt: null, liveAt: null, uid: null, firstMs: null, rebuilds: 0, starts: [] });
    startHls(mine);

    if (LIGHT) {
      d.log('left for the deep run: the relay servers, the UDP probe, WebRTC through Stream and MoQ through the relay (DEMO_DEEP=1)');
      camBtn.set('online').because('press to stop the camera and every leg');
      await d.run('check');
      return;
    }

    // Both asked in parallel and only now, after the press: a relay from our
    // worker for the two peer connections, and whether UDP leaves at all.
    udpAsk = probeUdp().then((r) => {
      udp = r;
      if (r.known) d.log(r.udp ? `UDP reaches Cloudflare (${r.ms} ms)` : `no answer over UDP in ${r.ms} ms, so this network looks like it blocks UDP`, r.udp ? '' : 'bad');
      return r;
    });
    ice = await fetchIceServers({ log: (m) => d.log(`webrtc ${m}`) });
    if (gen !== mine) return;

    await Promise.all([startRtc(mine), startMoqLeg(mine)]);
    if (gen !== mine) return;
    camBtn.set('online').because('press to stop the camera and every leg');
    if (SELFCHECK) await d.run('check');
  }

  /**
   * One frame of what leaves this page: the camera with the clock row and two clocks burned
   * over a `black@0.55` scrim. WebRTC and MoQ both draw with this.
   * See lessons/page-cam.md#cam-8
   */
  function cameraFrame(ctx, w, h, frame) {
    drawCamera(ctx, localV, w, h);
    return burn(ctx, w, h, frame, { field: false, scrim: true });
  }

  async function startRtc(mine) {
    try {
      pub = await camWhipPublish(sendStream, { iceServers: ice?.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
      if (gen !== mine) return;
      pub.pc.addEventListener('connectionstatechange', () => {
        const st = pub?.pc.connectionState;
        if (st === 'failed') rtcFailed(mine, 'the publish could not connect');
        else if (st === 'disconnected') {
          d.log('webrtc: the publish dropped', 'bad');
        }
      });
      sub = await whepPlay(camWhep(), rtcV, { iceServers: ice?.iceServers, log: (m, k) => d.log(`webrtc ${m}`, k) });
      sub.pc.addEventListener('connectionstatechange', () => {
        if (sub?.pc.connectionState === 'failed') rtcFailed(mine, 'the picture could not come back');
      });
      if (gen !== mine) return;
    } catch (e) {
      // A 409 from the worker is another camera on the camera's own input.
      const busy = /409/.test(e.message) && /busy/.test(e.message);
      rtcErr = busy ? 'another camera is on the camera WebRTC input' : e.message;
      if (busy) {
        d.log(`webrtc: ${rtcErr}`, 'bad');
        sayOn(P.rtc, 'another camera is on it');
        P.rtc.said = true;
      } else await rtcFailed(mine, rtcErr);
    }
  }

  /**
   * On a network that drops UDP the HTTPS handshake still answers 201 and ICE fails 15 s
   * later. One STUN request proves the cause, so the page names the network, not itself.
   * With a relay from `/ice` this should not be reached.
   * See lessons/page-cam.md#cam-9
   */
  async function rtcFailed(mine, why) {
    if (gen !== mine || P.rtc.said) return;
    P.rtc.said = true;
    const u = await (udpAsk || Promise.resolve(udp));
    if (gen !== mine) return;
    rtcErr = rtcErr || why;
    if (u?.known && u.udp === false) {
      rtcErr = ice?.relay
        ? 'this network blocks UDP and the picture did not get through the relay over TCP either'
        : 'this network blocks UDP, which WebRTC media travels over, and no relay over TCP is set up yet';
      sayOn(P.rtc, NO_UDP);
    } else {
      sayOn(P.rtc, 'could not start');
    }
    d.log(`webrtc: ${rtcErr}`, 'bad');
  }

  async function startMoqLeg(mine) {
    const sup = moqSupport();
    if (!sup.ok) {
      moqErr = sup.why;
      d.log(`moq: ${sup.why}`, 'bad');
      sayOn(P.moq, 'needs Chrome or Edge');
      return;
    }
    try {
      const ns = `positron-cam-${Math.random().toString(36).slice(2, 8)}`;
      // The camera, through `paint`: startMoq hands its own 1280x720 canvas
      // to the same draw the WebRTC canvas uses, so the row still decodes.
      const l = await startMoq({
        out: moqC, ns, role: 'loopback', log: (m, k) => d.log(`moq ${m}`, k),
        paint: (ctx, w, h, frame) => { moqPainted++; return cameraFrame(ctx, w, h, frame); },
      });
      if (gen !== mine) { l.stop(); return; }
      leg = l;
      d.log('moq: the camera is on its way through the relay');
    } catch (e) {
      moqErr = e?.message || String(e);
      d.log(`moq: ${moqErr}`, 'bad');
      // WebTransport is QUIC, which is UDP, and Cloudflare's relay has no
      // fallback over TCP. A rejected session on a network where STUN got no
      // answer is that network, not this page.
      const u = await (udpAsk || Promise.resolve(udp));
      if (gen !== mine) return;
      if (u?.known && u.udp === false) {
        moqErr = 'this network blocks UDP, and MoQ runs over QUIC, which is UDP';
        d.log(`moq: ${moqErr}`, 'bad');
        sayOn(P.moq, NO_UDP);
      } else {
        sayOn(P.moq, 'could not reach the relay');
      }
    }
  }

  async function stop() {
    gen++;
    clearInterval(draw); draw = null;
    clearInterval(paint); paint = null;
    for (const m of Object.values(meters)) m.live = false;
    meters = {};
    try { leg?.stop(); } catch { /* gone */ }
    leg = null;
    try { sub?.pc.close(); } catch { /* gone */ }
    sub = null;
    const p = pub; pub = null;
    try { await p?.stop(); } catch { /* gone */ }
    stopHls();
    sendStream?.getTracks().forEach((t) => t.stop());
    sendStream = null; src = null;
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    for (const v of [localV, rtcV, hlsV]) { try { v.pause(); } catch { /* fine */ } v.srcObject = null; }
    for (const k of Object.keys(P)) {
      for (const key of P[k].values.keys()) P[k].values.set(key, '');
      P[k].said = false;
    }
    camBtn.set('offline').because('nothing is recorded or sent until you press');
    d.log('camera off, and every leg closed');
  }

  // ── checks, for the harness only ────────────────────────────────────────
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  d.on('check', async () => {
    d.assert('a visit opened nothing before the press',
      openedBeforePress === 0 && gumBeforePress === 0,
      `${openedBeforePress} request(s) to Stream, the publisher or the relay, ${gumBeforePress} camera request(s)`);

    // The grid, measured rather than read.
    const r = Object.values(P).map((p) => p.el.getBoundingClientRect());
    const lefts = new Set(r.map((x) => Math.round(x.left))), tops = new Set(r.map((x) => Math.round(x.top)));
    const two = grid.getBoundingClientRect().width > 560;
    d.assert('four pictures, in two columns and two rows at this width',
      two ? lefts.size === 2 && tops.size === 2 : lefts.size === 1 && tops.size === 4,
      `${lefts.size} column(s) and ${tops.size} row(s) in a ${grid.getBoundingClientRect().width.toFixed(0)} px grid`);
    const names = Object.values(P).map((p) => {
      const cell = p.values.cell('lat');
      return cell?.parentElement?.querySelector('.pos-vp-k')?.textContent || '';
    });
    d.assert('every footer says what kind of latency it carries',
      names.every((n) => /glass to glass|capture to screen/.test(n)), names.join(' / '));

    if (!cam) {
      d.assert('with no camera the page says why', !!camErr, camErr || 'nothing said');
      d.assert('with no camera nothing was opened',
        !pub && !sub && !leg && oursOpened() === 0,
        `publish ${!!pub}, play ${!!sub}, moq ${!!leg}, ${oursOpened()} request(s) to our streaming hosts`);
      d.assert('the control still reads camera off', camBtn.state() === 'offline', camBtn.state());
      return;
    }

    // Give each leg time to carry enough frames to time.
    // LL-HLS gets up to a minute: a container that was asleep, Stream bringing
    // a new broadcast up and the player's first segments are all in it.
    for (let t = 0; t < 120 && LIGHT; t++) {
      if ((meters.local?.frames ?? 0) > 0) break;
      await wait(250);
    }
    for (let t = 0; t < 120 && !LIGHT; t++) {
      const rtcDone = rtcErr || (meters.rtc?.all ?? 0) >= 30;
      const moqDone = moqErr || (leg?.stats.samples ?? 0) >= 30;
      const hlsDone = !HLS_ON || HLS.err || (meters.hls?.all ?? 0) >= 30;
      if (rtcDone && moqDone && hlsDone) break;
      await wait(500);
    }
    d.assert('the camera is live', cam.getVideoTracks()[0]?.readyState === 'live');
    d.assert('the local preview presents frames', (meters.local?.frames ?? 0) > 0, `${meters.local?.frames ?? 0} frame(s)`);
    d.log(meters.local?.samples.length
      ? `local capture to screen ${ms(median(meters.local.samples))} over ${meters.local.samples.length} frame(s)`
      : 'this browser reports no captureTime, so the local cell stays empty');
    if (!HLS_ON) {
      d.assert('LL-HLS is retired and says so in its footer', !HLS.pub && /retired/.test(saidOn(P.hls)),
        saidOn(P.hls) || 'nothing said');
    } else if (HLS.err) {
      // Refused because another camera is on the input is a fact about somebody
      // else, not a fault in this page, so the one assert is that it SAID so on
      // the picture.
      d.assert('LL-HLS names why it is not running, in its own footer', !!saidOn(P.hls),
        `${HLS.st}: ${HLS.err}, footer "${saidOn(P.hls)}"`);
    } else {
      d.assert('LL-HLS: the container took the camera', HLS.st === 'ready',
        HLS.readyAt != null ? `ready ${((HLS.readyAt - HLS.askedAt) / 1000).toFixed(1)} s after asking` : (HLS.st || 'no answer'));
      d.assert('LL-HLS: camera frames came back and were shown', (meters.hls?.frames ?? 0) > 0, `${meters.hls?.frames ?? 0} frame(s)`);
      const hp = median(meters.hls?.samples || []);
      d.assert('LL-HLS glass to glass read off the burned clock', hp != null,
        hp != null ? `median ${ms(hp)} over the last ${meters.hls.samples.length}, ${meters.hls.bad} unreadable, `
          + `Stream live ${HLS.liveAt != null ? ((HLS.liveAt - HLS.readyAt) / 1000).toFixed(1) : '?'} s and first frame ${HLS.firstMs != null ? (HLS.firstMs / 1000).toFixed(1) : '?'} s after recording began, ${HLS.rebuilds} rebuild(s)`
          : `${meters.hls?.bad ?? 0} unreadable frame(s)`);
      if (hp != null) d.assert('LL-HLS in seconds, and more than WebRTC', hp > 500 && hp < 20000, ms(hp));
    }

    if (!LIGHT) {
    d.assert('WebRTC published through the worker', !!pub, rtcErr || (pub ? `id ${pub.id}` : 'no publish'));
    d.assert('WebRTC frames came back and were shown', (meters.rtc?.frames ?? 0) > 0, `${meters.rtc?.frames ?? 0} frame(s)`);
    const rp = median(meters.rtc?.samples || []);
    d.assert('WebRTC glass to glass read off the burned clock', rp != null,
      rp != null ? `median ${ms(rp)} over the last ${meters.rtc.samples.length}, ${meters.rtc.bad} unreadable` : `${meters.rtc?.bad ?? 0} unreadable frame(s)`);
    if (rp != null) d.assert('WebRTC in milliseconds, not seconds', rp < 2000, ms(rp));

    d.assert('MoQ connected to the relay', !!leg, moqErr || (leg ? String(leg.version) : 'no leg'));
    if (leg) {
      const st = leg.stats;
      d.assert('MoQ frames decoded', st.decoded > 0, `${st.decoded} decoded`);
      const mp = leg.pct(0.5);
      d.assert('MoQ glass to glass read off the burned clock', mp != null, mp != null ? `p50 ${ms(mp)} over ${st.samples}` : 'no clean rows');
      d.assert('the MoQ leg carries the camera, not its own test pattern', moqPainted > 0,
        moqPainted ? `${moqPainted} frame(s) painted from the camera` : 'startMoq never called paint, so it drew its own pattern');
    }
    }   // !LIGHT

    // ONE assert whatever the network, so the total does not move with it:
    // a leg that failed names its cause on its own picture, and where one STUN
    // request got no answer that cause is the network blocking UDP.
    {
      const said = (err, p) => {
        const cap = saidOn(p);
        if (!err) return { ok: true, txt: 'ran' };
        if (!cap) return { ok: false, txt: 'failed with nothing in its footer' };
        return { ok: !(udp?.known && udp.udp === false) || cap === NO_UDP, txt: cap };
      };
      const r1 = said(rtcErr, P.rtc), r2 = said(moqErr, P.moq);
      d.assert('a leg that failed says why in its own footer', r1.ok && r2.ok,
        `webrtc ${r1.txt}, moq ${r2.txt}, UDP ${udp?.known ? (udp.udp ? 'answered' : 'no answer') : 'not asked'}`
        + `, relay ${ice?.relay ? 'yes' : 'no'}`);
    }

    d.assert('no state line is drawn on any picture', Object.values(P).every((p) => !p.slots.caption.textContent),
      Object.entries(P).map(([k, p]) => `${k} "${p.slots.caption.textContent}"`).join(' / '));

    // Stop too, since an open leg bills Stream minutes. `stop()`, not a click: a click here
    // would start a second press inside the first.
    // See lessons/page-cam.md#cam-10
    const tracks = [...cam.getTracks()];
    const pcs = [pub?.pc, sub?.pc].filter(Boolean);
    const camWs = HLS.pub;
    await stop();
    await wait(800);
    d.assert('stop ends the camera', tracks.every((t) => t.readyState === 'ended'), tracks.map((t) => t.readyState).join(' '));
    d.assert('stop closes every peer connection', pcs.every((p) => p.connectionState === 'closed'),
      pcs.map((p) => p.connectionState).join(' ') || 'none were open');
    d.assert('stop closes the MoQ leg and every timer', !leg && !draw && !paint);
    if (HLS_ON) d.assert('stop ends the LL-HLS leg', !HLS.pub && !HLS.player,
      camWs ? `${camWs.state.chunks} chunk(s), ${(camWs.state.bytes / 1e6).toFixed(1)} MB sent` : 'never opened');
    d.assert('the control reads camera off again', camBtn.state() === 'offline', camBtn.state());
  });

  // Four pictures, in the panels' order, each showing only its own path. The first cannot
  // take a `title` beside `how`, so its name is written in after it is built.
  // See lessons/page-cam.md#cam-11
  const CAMERA_DG = {
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser',
        children: [
          { id: 'cam', label: 'camera', sub: 'getUserMedia', tech: 'browser',
            note: 'Asked for only when the camera button is pressed, at 1280x720 and 30fps where the camera can.' },
          { id: 'preview', label: 'preview', sub: 'video element', tech: 'browser',
            note: 'The camera stream itself, never sent anywhere. Its latency is capture to screen, read from requestVideoFrameCallback, which reports when a frame was captured and when it will be shown.' },
        ] },
    ],
    links: [
      { from: 'cam', to: 'preview', note: 'The MediaStream goes straight into the element, with no canvas and no encoder in between.' },
    ],
  };
  const LLHLS_DG = {
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'canvas', label: 'canvas', sub: '1280x720, 30fps', tech: 'browser',
            note: 'The camera drawn in without cropping, with a row of blocks encoding the time burned over it. Reading that row off a returned frame gives glass to glass latency on one clock.' },
          { id: 'rec', label: 'recorder', sub: 'MediaRecorder', tech: 'browser',
            note: 'H.264 in WebM with a keyframe every 2s, sent in 100ms slices. It starts only once the container is ready, so the first slice, which carries the header, is never lost.' },
          { id: 'player', label: 'player', sub: 'hls.js, tuned', tech: 'browser',
            note: 'The same low latency player /llhls/ uses, built only once Stream says the camera input is live.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'worker, Stream', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'pub', label: 'Pub', sub: 'Durable Object', tech: 'cloudflare',
            note: 'Takes the slices over a WebSocket and posts them in order into the camera container. One camera at a time.' },
          { id: 'ffmpeg', label: 'ffmpeg', sub: 'cam container', tech: 'cloudflare',
            note: 'Rewraps the video with -c copy, without encoding, and pushes it over RTMPS to the camera\'s own live input.' },
          { id: 'stream', label: 'Stream', sub: 'LL-HLS input', tech: 'cloudflare',
            note: 'Cuts the camera into low latency HLS. Every session is recorded here, so one is capped at five minutes.' },
        ] },
    ],
    links: [
      { from: 'canvas', to: 'rec', note: 'The canvas is captured as a stream thirty times a second.' },
      { from: 'rec', to: 'pub', label: 'WebM', note: 'Binary WebSocket messages to pub.positron.studio/cam, which answers 410 since the leg was retired on 2026-10-13.' },
      { from: 'stream', to: 'player', label: 'LL-HLS', back: true,
        note: 'Playlists and half second parts over HTTPS, which is why this panel is seconds behind the others.' },
    ],
  };
  const WEBRTC_DG = {
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'canvas', label: 'canvas', sub: '1280x720, 30fps', tech: 'browser',
            note: 'The same burned camera frame the other two legs carry, captured as a stream.' },
          { id: 'send', label: 'publisher', sub: 'WHIP', tech: 'browser',
            note: 'An RTCPeerConnection that only sends, offered once through the worker with no trickle.' },
          { id: 'recv', label: 'player', sub: 'WHEP', tech: 'browser',
            note: 'An RTCPeerConnection that only receives, video and audio, because Stream refuses a single track offer.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'worker, Stream, TURN', kind: 'cloud', tech: 'cloudflare', set: true,
        children: [
          { id: 'turn', label: 'TURN', sub: 'relay over TCP', tech: 'cloudflare',
            note: 'Handed out by the worker at /ice on the press. It carries the media only when a network blocks UDP.' },
          { id: 'pub', label: 'Pub', sub: 'Durable Object', tech: 'cloudflare',
            note: 'Holds the camera input\'s secret WHIP address so the page never sees it, and forwards one offer and one answer. One camera at a time.' },
          { id: 'stream', label: 'Stream', sub: 'camera WebRTC', tech: 'cloudflare',
            note: 'The camera\'s own WebRTC input, which records nothing. Media reaches it over UDP.' },
        ] },
    ],
    links: [
      { from: 'canvas', to: 'send', note: 'The captured canvas track is added to the sending connection.' },
      { from: 'send', to: 'pub', label: 'SDP offer', note: 'One POST to pub.positron.studio/cam/whip, and a DELETE the same way when the camera stops.' },
      { from: 'pub', to: 'stream', note: 'The worker forwards the offer to the input\'s secret address and keeps the session address to itself.' },
      { from: 'stream', to: 'recv', label: 'WHEP', back: true,
        note: 'The same input played straight back, asking again on a 409 while the publish is still going live.' },
    ],
  };
  const MOQ_DG = {
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'enc', label: 'encoder', sub: 'WebCodecs', tech: 'browser',
            note: 'Draws the burned camera frame into its own canvas and encodes it with VideoEncoder.' },
          { id: 'dec', label: 'decoder', sub: 'WebCodecs', tech: 'browser',
            note: 'Subscribes to the same namespace from this page and decodes with VideoDecoder, so both ends share one clock.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'MoQ relay', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'relay', label: 'MoQ relay', sub: 'draft-14', tech: 'cloudflare',
            note: 'Hands each frame to whoever subscribed to the namespace. Safari cannot use it yet, so this panel needs Chrome or Edge.' },
        ] },
    ],
    links: [
      { from: 'enc', to: 'relay', label: 'frames', note: 'Published over WebTransport, which is QUIC and so UDP, with no fallback over TCP.' },
      { from: 'relay', to: 'dec', label: 'frames', back: true, note: 'The subscription back, read off the burned row on the clock that wrote it.' },
    ],
  };
  const dgs = [
    ['Camera', CAMERA_DG], ['LL-HLS', LLHLS_DG], ['WebRTC', WEBRTC_DG], ['MoQ', MOQ_DG],
  ].map(([name, spec], i) => {
    const g = createDiagram(d.el, i === 0 ? spec : { ...spec, title: name }, { how: i === 0, atEnd: true });
    if (i === 0) {
      const t = g.el.querySelector('.pos-dg-t');
      if (t) { t.textContent = name; t.hidden = false; }
    }
    g.el.classList.add('cam-dg');
    return g;
  });

  if (SELFCHECK) {
    const cuts = dgs.flatMap((g, i) => g.cuts.map((c) => `${['camera', 'll-hls', 'webrtc', 'moq'][i]} ${c.id}: ${c.shown || c.full || c.why || ''}`));
    d.assert('nothing in the four pictures was cut or refused', cuts.length === 0, cuts.join(' / ') || 'none');
  }

  // Leave nothing open behind a navigation.
  addEventListener('pagehide', () => { if (running()) stop(); });
  d.ready();
</script>
</html>

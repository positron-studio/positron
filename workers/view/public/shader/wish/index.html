<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">

<title>Picture wish</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The picture at half the content width, the whole width on a phone, as /shader/mirror/. */
  .cc-half { width: calc(50% - 8px); }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-half canvas { display: block; width: 100%; height: 100%; }
  /* Where the conversation stands, under the wish field. */
  .cc-turn { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font: 400 13px/1.4 var(--sans); color: var(--dim2); }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el, createShipper } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { PARAM_HUES } from '/shell/code-lang.mjs';
  import { createWishBar } from '/shell/wish-bar.mjs';
  import { make as makeShader } from '/shell/rt-shader.mjs';
  import { make as makeWish, WISH_API } from '/shell/rt-wish.mjs';
  import { VERSION, hashOf, firstLine } from '/shell/glsl-wish.mjs';
  import { GLSL_EXAMPLES } from '/shell/glsl-examples.mjs';

  // A sentence becomes a fragment shader: the wish node asks the wish worker's /wish/code, tries each answer
  // in a sandbox GL of its own, and only a program that compiled and moved leaves on program-out.
  // The shader keeps drawing its last good program the whole time. Nothing opens on a visit.
  const S = 'web';
  const WISH_OUT = `${S}:wish:program-out`, SH_PROG = `${S}:shader:program-in`;
  const KNOB_OUT = `${S}:knob-segments:value-out`, SH_VAL = `${S}:shader:value-in`;
  const SH_OUT = `${S}:shader:video-out`, SCREEN = `${S}:screen:video-in`;
  const q = new URLSearchParams(location.search);
  const API = q.get('api') || WISH_API;

  const d = mount({ name: 'Picture wish', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('shader/wish');
  const log = (m, lv) => d.log(m, lv);

  // A person's own requests go to the device log (pub.positron.studio/logs), never a check's.
  const ship = SELFCHECK ? () => {} : createShipper();
  let lastLine = '';
  const logAsk = (line) => { lastLine = line; ship(`shader/wish ${line}`); };

  // ── the self-check's model: canned programs, so a check asks the worker nothing ──
  const GOOD = `precision highp float;
uniform float uT; uniform vec2 uRes; uniform float uSegments;
out vec4 o;
void main() {
  vec2 p = gl_FragCoord.xy / uRes;
  float w = sin(p.x * uSegments * 3.0 + uT * 2.0) * 0.5 + 0.5;
  o = vec4(0.1, 0.3 + 0.4 * w, 0.6 + 0.4 * p.y, 1.0);
}
`;
  const BROKEN = 'precision highp float;\nout vec4 o;\nvoid main() { o = vec4(nowhere, 1.0); }\n';
  const asks = [];
  const canned = async (q) => {
    asks.push(q);
    if (/busy/.test(q.text)) throw Object.assign(new Error('too many requests from here: at most 6 in 10 s, try again in 4 s'), { plain: true });
    return { code: /broken/.test(q.text) ? BROKEN : GOOD, ms: 0, model: 'canned', usage: { total_tokens: 0 } };
  };

  // ── the runtimes: the shader is /connect/'s, the wish is new ──
  const bay = createBay();
  const shader = makeShader({ log });
  const wish = makeWish({ log, api: API, model: q.get('model') || '', ask: SELFCHECK ? canned : null,
    send: (port, ev) => bay.send(`${S}:wish:${port}`, ev) });
  addNodes(bay, S, ['wish', 'knob-segments', 'shader', 'screen'], {
    deliver: { 'shader:program-in': shader.deliver['program-in'], 'shader:value-in': shader.deliver['value-in'] },
    portLabel: 'node:port',
    ports: {
      'knob-segments:value-out': { shape: { of: 'param', names: ['segments'] } },
      'screen:video-in': { label: 'picture' },
    },
  });
  for (const [a, b] of [[WISH_OUT, SH_PROG], [KNOB_OUT, SH_VAL], [SH_OUT, SCREEN]]) {
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  const sentOn = (from, to) => bay.links().find((l) => l.from === from && l.to === to)?.sent ?? 0;

  // ── the screen ──
  const count = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: shader.shader.canvas, left: el('span', 'cc-say', shader.shader.renderer()) });
  panel.el.querySelector('.pos-vp-r').prepend(count);
  panel.el.classList.add('cc-half');
  let n = 0, since = 0, drawing = false;
  function frame(t) {
    shader.video.frame();
    n++;
    if (!since) since = t;
    else if (t - since >= 1000) { count.textContent = `${(n * 1000 / (t - since)).toFixed(1)} fps`; n = 0; since = t; }
    requestAnimationFrame(frame);
  }

  // ── the knob, the shader's one parameter ──
  const HUE = PARAM_HUES[0];
  const knob = createKnob({ label: 'segments', min: 1, max: 32, step: 1, value: 8, hand: true,
    format: (v) => `${Math.round(v)}`,
    onInput: (v) => bay.send(KNOB_OUT, { of: 'param', name: 'segments', v }) });
  knob.el.dataset.param = 'segments';
  knob.el.style.setProperty('--param-hue', HUE);
  const grid = createKnobGrid(new Map([['segments', knob]]), { row: true });

  // ── the ask: a sentence or a pill, then the wish loop ──
  const PILLS = ['slow blue waves', 'a pulsing red grid', 'stars drifting left', 'a warm sunset gradient',
    'rain on a window', 'a breathing kaleidoscope', 'green plasma', 'a tunnel of rings'];
  const said = (r) => {
    if (r.verdict === 'ran') return '';
    if (r.verdict === 'ran still') return 'It runs, and it did not move between the two moments it was checked at.';
    if (r.verdict === 'failed') return `Nothing was written: ${r.error}. The old shader keeps running.`;
    return `The picture did not change: ${r.error}. The old shader keeps running.`;
  };
  // A conversation: once a written shader runs (or a hand edit to the code box), the next sentence
  // revises the program in the code box rather than writing a new one. A pill or new wish ends it.
  let live = false, follow = 0, handEdited = false;
  const boxBody = () => shader.code.value().replace(/^\s*#version[^\n]*\n/, '');
  shader.code.input.addEventListener('input', () => { handEdited = true; showTurn(); });
  const followsNow = () => live || handEdited;
  function startFresh() { live = false; follow = 0; handEdited = false; showTurn(); }
  async function write(text, { how = 'typed', fresh = how === 'pill' } = {}) {
    if (fresh) startFresh();
    const isFollow = followsNow();
    if (isFollow) follow++;
    const base = isFollow ? boxBody() : null;
    bar.say('');
    log(isFollow ? `changing the shader in the code box (follow-up ${follow}): ${text}` : `writing: ${text}`);
    const r = await wish.write(text, { base, onTry: (t) => {
      for (const f of t.fixed || []) log(`try ${t.attempt}: ${f}`);
      log(`try ${t.attempt}: ${t.ok && !t.error ? 'compiled and moved' : t.error || 'refused'}${t.ms != null ? `, the answer took ${t.ms} ms` : ''}`, t.ok ? '' : 'warn');
    } });
    if (!r) return null;
    if (r.source) { live = true; handEdited = false; }
    showTurn();
    const words = said(r);
    bar.say(words, r.verdict === 'ran' ? '' : 'bad');
    if (r.source) log(`running the written shader: ${r.tries.length} ${r.tries.length === 1 ? 'try' : 'tries'}, ${r.ms} ms, ${r.tokens} tokens, by ${r.model}`);
    const verdict = r.verdict === 'refused' || r.verdict === 'failed' ? `${r.verdict}: ${firstLine(r.error)}` : r.verdict;
    logAsk(`[wish] "${text}" via ${how}, ${isFollow ? `follow-up ${follow}` : 'new'}, model ${r.model || '?'}, ${r.tries.length} attempt(s), ${r.ms} ms, ${r.tokens} tokens, ${verdict}`
      + `${r.source ? `, ${r.source.length} chars, hash ${hashOf(r.source)}` : ''}`);
    return r;
  }
  const bar = createWishBar({ placeholder: 'wish for a picture', api: API, log, ship: logAsk,
    selfcheck: SELFCHECK, pills: PILLS.map((say) => ({ say })),
    reset: { say: 'new wish', title: 'the next sentence writes a new shader instead of changing this one',
      onPress: () => { startFresh(); log('a new shader: the next sentence starts from nothing'); logAsk('[new] pressed new wish'); } },
    vocabulary: () => ['shader', 'kaleidoscope', 'plasma', 'gradient'],
    // The code box's border shimmers while the wish is written.
    onAsk: async (text, { how }) => { shader.code.el.dataset.busy = '1'; try { return await write(text, { how }); } finally { delete shader.code.el.dataset.busy; } } });

  // Where the conversation stands; the last pill, new wish, forgets it (the picture keeps running).
  const turnSay = el('span', '', '');
  const newBtn = { el: bar.reset };
  const turnRow = el('p', 'cc-turn');
  turnRow.append(turnSay);
  function showTurn() {
    turnSay.textContent = followsNow() ? `the next sentence changes the shader in the code box (follow-up ${follow + 1})` : 'the next sentence writes a new shader';
    bar.showReset(followsNow());
  }
  showTurn();
  bar.el.insertBefore(turnRow, bar.el.children[1]);

  const pb = createPatchbay(bay, { flowing: (l) => drawing && l.from === SH_OUT });
  d.stack.add(bar.el, panel.el, grid.el, shader.code.el, pb.el);

  // The knob's first value travels the link too, so the shader's first N came along it.
  bay.send(KNOB_OUT, { of: 'param', name: 'segments', v: knob.value() });
  if (shader.shader.ok()) { drawing = true; requestAnimationFrame(frame); pb.refresh(); }

  window.__demo.write = write;
  window.__demo.wish = wish;
  window.__demo.shader = shader;
  window.__demo.bar = bar;
  window.__demo.bay = bay;

  if (SELFCHECK) await check();
  d.ready();

  async function check() {
    const A = d.assert;
    const fetches = [], sockets = [];
    const f0 = window.fetch;
    window.fetch = (u, o) => { fetches.push(String(u)); return f0(u, o); };
    const W0 = window.WebSocket;
    window.WebSocket = function (...a) { sockets.push(a[0]); return new W0(...a); };
    const gum = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);
    let micAsked = 0;
    if (gum) navigator.mediaDevices.getUserMedia = (o) => { micAsked++; return gum(o); };
    const frameDone = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const toWorker = () => fetches.filter((u) => u.startsWith(API)).length;

    const first = shader.shader.source();
    A('nothing is written on a visit: the shader runs its own program and nothing was asked',
      shader.programs().ran === 0 && wish.asked() === 0 && /uSegments/.test(first || ''), `${shader.programs().ran} programs`);

    // Positive control: a good program reaches the shader along the link and draws.
    const r1 = await write('canned waves');
    await frameDone();
    const px = shader.shader.pixels();
    let lo = 255, hi = 0;
    for (let i = 0; px && i < px.length; i += 4 * 97) { lo = Math.min(lo, px[i + 1]); hi = Math.max(hi, px[i + 1]); }
    A('a good program runs in one try, arrives on program-in along the link, fills the code box and draws',
      r1?.verdict === 'ran' && r1.tries.length === 1 && shader.programs().ran === 1 && sentOn(WISH_OUT, SH_PROG) === 1
        && shader.shader.source() === VERSION + GOOD && shader.code.value() === VERSION + GOOD && hi - lo > 20,
      `${r1?.verdict}, sent ${sentOn(WISH_OUT, SH_PROG)}, green ${lo} to ${hi}`);
    const good = shader.shader.source();

    // Negative control: a program that never compiles is refused three times, and the picture stays.
    const asked0 = r1.tries.length;
    const r2 = await write('canned broken');
    A('a broken program is tried three times and refused, the retry counter moves, and the old picture keeps running',
      r2?.verdict === 'refused' && r2.tries.length === 3 && r2.tries.length > asked0 && shader.programs().ran === 1
        && sentOn(WISH_OUT, SH_PROG) === 1 && shader.shader.source() === good && shader.shader.ok(),
      `${r2?.verdict}, ${r2?.tries.length} tries, sent ${sentOn(WISH_OUT, SH_PROG)}`);
    A('the refusal is said in one centred line with the compiler\'s own words', /undeclared identifier|nowhere/.test(bar.said()) && /old shader keeps running/.test(bar.said()),
      bar.said());
    // That second sentence came after a written shader ran, so it was a revision of it.
    const a2 = asks.at(-3);
    A('a sentence after a written shader is follow-up 1: its first ask carries the code box\'s program and no error, and the log says so',
      a2?.previous === good.replace(VERSION, '') && a2?.error === null && /, follow-up 1, /.test(lastLine) && /follow-up 2/.test(turnRow.textContent),
      `${JSON.stringify(a2?.error)} ${lastLine.slice(0, 80)}`);

    // The shader's own door refuses a body with a version line, and keeps what runs.
    const door = shader.deliver['program-in']({ of: 'program', source: `${VERSION}${GOOD}` });
    A('NEGATIVE CONTROL: program-in refuses a body carrying #version and keeps the running program',
      !door.ok && /^send the body without a #version line/.test(door.error) && shader.shader.source() === good && shader.programs().refused === 1, door.error);

    // A pill is an ask: it shimmers while the wish works, then lets go.
    const pill = bar.pills[0];
    pill.click();
    const busyWhile = pill.dataset.busy === '1';
    while (bar.busy()) await new Promise((r) => setTimeout(r, 20));
    A('a pill asks its sentence and shimmers while the wish works', busyWhile && !pill.dataset.busy && bar.field.value() === PILLS[0]
      && shader.programs().ran === 2, `busy ${busyWhile}, programs ${shader.programs().ran}`);
    A('NEGATIVE CONTROL: a pill starts fresh, its ask carries no program', asks.at(-1)?.previous === null && /via pill, new, /.test(lastLine), lastLine.slice(0, 80));

    // A hand edit in the code box is the program the next sentence changes.
    const edited = boxBody().replace('0.1, 0.3', '0.2, 0.3');
    shader.code.input.value = VERSION + edited;
    shader.code.input.dispatchEvent(new Event('input'));
    await write('canned slower');
    A('the code box\'s hand edit is what a follow-up sends', asks.at(-1)?.previous === edited && edited !== GOOD && /follow-up 1/.test(lastLine),
      `${(asks.at(-1)?.previous || '').slice(80, 120)}`);
    newBtn.el.click();
    await write('canned waves');
    A('NEGATIVE CONTROL: after new wish the next sentence asks for a new program', asks.at(-1)?.previous === null && /, new, /.test(lastLine)
      && newBtn.el.hidden === false && bar.row.lastElementChild === newBtn.el && /follow-up 1/.test(turnRow.textContent), lastLine.slice(0, 80));

    // Asked too often: the worker's own reason is said plainly, and the picture stays.
    const ran0 = shader.programs().ran;
    const busy = await write('canned busy');
    A('a refusal for asking too often is said plainly and the old shader keeps running',
      busy?.verdict === 'failed' && /^Nothing was written: too many requests from here/.test(bar.said()) && shader.programs().ran === ran0 && shader.shader.ok(), bar.said());

    // Speech: the switcher picks the engine and is remembered; under a check neither engine starts.
    const kept = (() => { try { return localStorage.getItem('pos-wish-speech'); } catch { return null; } })();
    const stored = () => { try { return localStorage.getItem('pos-wish-speech'); } catch { return 'unreadable'; } };
    const keyEv = (type, k) => dispatchEvent(new KeyboardEvent(type, { key: k }));
    keyEv('keydown', 'CapsLock'); const held = bar.mic.on(); keyEv('keyup', 'CapsLock');
    keyEv('keydown', 'Alt'); const heldAlt = bar.mic.on(); keyEv('keyup', 'Alt');
    dispatchEvent(new CustomEvent('pos-sustain', { detail: { down: true } })); const heldPedal = bar.mic.on();
    dispatchEvent(new CustomEvent('pos-sustain', { detail: { down: false } }));
    const st = bar.mic.started();
    A('NEGATIVE CONTROL: Caps Lock, Option and the pedal light the button under a check, and neither speech engine starts',
      held && heldAlt && heldPedal && !bar.mic.on() && st.chrome === 0 && st.whisper === 0 && micAsked === 0,
      `chrome ${st.chrome}, whisper ${st.whisper}, microphone asks ${micAsked}`);
    const sw = bar.switcher.buttons;
    sw[1].click();
    const toWhisper = bar.engine() === 'whisper' && stored() === 'whisper' && sw[1].getAttribute('aria-pressed') === 'true';
    sw[0].click();
    const back = bar.has().chrome ? bar.engine() === 'chrome' && stored() === 'chrome' : bar.engine() === 'whisper';
    A('the speech switcher under the bar picks the engine and remembers it', toWhisper && back && bar.el.lastElementChild.contains(bar.switcher.el),
      `${bar.engine()}, stored ${stored()}, chrome here ${bar.has().chrome}`);
    // Both engines faked, on a bar of its own: live words while held, the text asked on release.
    const heardLines = [], askedVoice = [];
    const t = createWishBar({ keys: false, ship: (l) => heardLines.push(l), onAsk: async (text, { how }) => { askedVoice.push(`${how}:${text}`); },
      engines: {
        chrome: ({ onWords }) => ({ start() { onWords('slow'); onWords('slow blue'); }, stop: async () => ({ text: 'slow blue waves' }) }),
        whisper: () => ({ start: async () => {}, stop: async () => ({ text: 'green plasma', note: 'fake' }) }),
      } });
    t.setEngine('chrome'); await t.mic.start(); const live = t.field.value(); await t.mic.stop(); await new Promise((r) => setTimeout(r, 0));
    t.setEngine('whisper'); await t.mic.start(); const liveW = t.field.value(); await t.mic.stop();
    A('chrome shows the words in the field while held and asks the final text on release; whisper asks what came back; the log names the engine and the time',
      live === 'slow blue' && liveW === 'slow blue waves' && askedVoice.join('|') === 'voice:slow blue waves|voice:green plasma'
        && /by chrome, \d+ ms from release to final text/.test(heardLines[0] || '') && /by whisper, \d+ ms from release/.test(heardLines[1] || ''),
      `${live} / ${askedVoice.join('|')} / ${heardLines.map((l) => l.slice(0, 60)).join(' | ')}`);
    A('NEGATIVE CONTROL: an engine that does not exist is not picked', t.setEngine('nonsense') === 'whisper' && t.engine() === 'whisper');
    t.destroy();
    try { if (kept === null) localStorage.removeItem('pos-wish-speech'); else localStorage.setItem('pos-wish-speech', kept); } catch { /* not remembered */ }
    bar.setEngine(kept && bar.has()[kept] ? kept : bar.has().chrome ? 'chrome' : 'whisper');

    // The worker's prompt examples compile in this browser's GL and move, in the wish node's own sandbox.
    const ex = GLSL_EXAMPLES.map((e) => ({ name: e.name, ...wish.trial(e.body) }));
    A('the examples in the prompt compile here and move', ex.length === GLSL_EXAMPLES.length && ex.length > 0 && ex.every((e) => e.ok && !e.flat && !e.still),
      ex.map((e) => `${e.name} ${e.ok ? (e.flat ? 'flat' : e.still ? 'still' : 'moves') : e.error}`).join(', '));

    A('nothing reaches pi-1: no node or link names it, no relay socket was opened, and the check asked the worker nothing',
      !bay.nodes().some((x) => x.id.startsWith('pi-1:')) && !bay.links().some((l) => /pi-1:/.test(l.from + l.to))
        && sockets.length === 0 && toWorker() === 0 && wish.asked() === 0 && micAsked === 0,
      `${sockets.length} sockets, ${toWorker()} worker calls, ${micAsked} microphone asks`);
    window.fetch = f0; window.WebSocket = W0;
    if (gum) navigator.mediaDevices.getUserMedia = gum;
  }
</script>

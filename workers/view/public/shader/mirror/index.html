<title>Mirror shader</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The picture at half the content width, the whole width on a phone. The program sits
     under the knob.
     See lessons/page-shader.md#shader-6 */
  .cc-half { width: calc(50% - 8px); }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-half canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="module">
  import { conceptNav, CODE_ROWS } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { PARAM_HUES } from '/shell/code-lang.mjs';
  import { createCompileIdle } from '/shell/compile-idle.mjs';
  import { createMirrorShader, MIRROR_FS, GLSL } from '/shell/mirror-shader.mjs';

  // /mirror/'s kaleidoscope (`FS_BODY`, `uSeg` renamed `uSegments`, `uFb` `uScale` `uWarp`
  // `uHue` const at /mirror/'s values), driven only by `web:knob-segments` on the shader's
  // value-in. `uSegments` is the wedge count, 1 to 32. Nothing opens on a visit.
  // See lessons/page-shader.md#shader-7
  const S = 'web';
  const SH_OUT = `${S}:shader:video-out`, SH_VAL = `${S}:shader:value-in`;
  const SCREEN = `${S}:screen:video-in`;
  const KNOB_OUT = `${S}:knob-segments:value-out`;
  const W = 640, H = 360;          // /mirror/'s own render size

  const d = mount({ name: 'Mirror shader', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('shader/mirror');

  // ── the program, the one string both the GL and the box are given ────────
  // It is the kit's (mirror-shader.mjs, which /connect/ runs too).
  const FS = MIRROR_FS;
  const HUE = PARAM_HUES[0];

  // ── the shader node's one parameter, set only through value-in ──────────
  const P = { segments: null };
  let delivered = 0;
  function setParam(e) {
    if (e?.of !== 'param' || e.name !== 'segments') { d.log('the shader takes one parameter, segments, and this was not it', 'warn'); return; }
    P.segments = Math.min(32, Math.max(1, Math.round(e.v)));
    delivered++;
  }

  // ── the bay: knob, shader, screen ───────────────────────────────────────
  const bay = createBay();
  // The shapes are /shell/nodes.mjs's; the labels and the delivery are this page's.
  addNodes(bay, S, ['knob-segments', 'shader', 'screen'], {
    deliver: { 'shader:value-in': setParam },
    portLabel: 'node:port',
    ports: {
      'knob-segments:value-out': { shape: { of: 'param', names: ['segments'] } },
      'screen:video-in': { label: 'picture' },
    },
  });

  const held = new Set();
  function hold(a, b) {
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) held.add(`${a} ${b}`);
    else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  hold(KNOB_OUT, SH_VAL);
  hold(SH_OUT, SCREEN);

  // ── the screen ──────────────────────────────────────────────────────────
  // The engine is the kit's: the canvas, the program, the feedback and one frame per render.
  const shader = createMirrorShader({ w: W, h: H, log: (line, kind) => d.log(line, kind) });
  const { canvas, gl } = shader;
  const build = (text) => shader.build(text);
  const render = () => shader.render(P.segments, { out: holds(SH_OUT, SCREEN) });
  // The footer says what draws the picture and how fast, as /mirror/'s does.
  // See lessons/page-shader.md#shader-8
  const name = el('span', 'cc-say', '');
  const count = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: canvas, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(count);
  name.textContent = shader.renderer();

  let raf = 0, drawing = false;
  // Frames counted over the last second, written once a second.
  let n = 0, since = 0;
  function frame(t) {
    render();
    n++;
    if (!since) since = t;
    else if (t - since >= 1000) { count.textContent = `${(n * 1000 / (t - since)).toFixed(1)} fps`; n = 0; since = t; }
    raf = requestAnimationFrame(frame);
  }

  // The code box: the kit's idle compile, `IDLE_MS` after the last key, never two at once;
  // a failed compile leaves `Did not compile` with the GL log while the last good program draws.
  // See lessons/page-shader.md#shader-9
  const code = createCodeBox({ language: GLSL, value: FS, rows: CODE_ROWS, label: '',
    hues: { hueOf: (n) => (n === 'uSegments' ? HUE : null) },
    ariaLabel: 'the fragment shader this page runs, edit it and it recompiles' });
  // A program with no `uSegments` compiles and runs with the knob driving nothing; the kit's
  // note has no state for that, so the page writes the line after the compile settles.
  // See lessons/page-shader.md#shader-10
  const NO_KNOB = 'No uSegments, the knob drives nothing';
  const idle = createCompileIdle({
    input: code.input,
    host: code.el,
    compile: (text) => {
      const out = build(text);
      if (!out.ok) d.log(`the edit did not compile, the last good shader keeps running: ${out.error}`, 'warn');
      else {
        d.log(out.knob ? 'the edit compiled and is running' : 'the edit compiled and is running, and has no uSegments, so the knob drives nothing',
          out.knob ? '' : 'warn');
        if (!out.knob) idle.settled().then(() => {
          if (shader.hasKnob() || idle.state() !== 'idle') return;
          const note = idle.el;
          note.dataset.state = 'error';
          note.textContent = NO_KNOB;
          note.title = 'the program has no uniform float uSegments, so the segments knob has nothing to set';
          note.hidden = false;
        });
      }
      return out;
    },
  });

  panel.el.classList.add('cc-half');

  // ── the knob: its own node, a turn is one event on its value-out ────────
  // It opens on 8, /mirror/'s own default.
  const knob = createKnob({ label: 'segments', min: 1, max: 32, step: 1, value: 8, hand: true,
    format: (v) => `${Math.round(v)}`,
    onInput: (v) => bay.send(KNOB_OUT, { of: 'param', name: 'segments', v }) });
  // The knob wears the uniform's hue, so the box and the knob read as one name.
  knob.el.dataset.param = 'segments';
  knob.el.style.setProperty('--param-hue', HUE);
  const grid = createKnobGrid(new Map([['segments', knob]]), { row: true });

  const lit = (l) => drawing && l.from === SH_OUT;
  const pb = createPatchbay(bay, { flowing: lit });

  d.stack.add(panel.el, grid.el, code.el, pb.el);

  // The knob's starting value goes over the wire too, so the first N the
  // shader ever sees came along the link and not out of a default.
  bay.send(KNOB_OUT, { of: 'param', name: 'segments', v: knob.value() });
  if (shader.ok()) { drawing = true; raf = requestAnimationFrame(frame); pb.refresh(); }

  window.__demo.knobs = grid;
  window.__demo.shader = {
    knob,
    size: [W, H],
    source: shader.source,
    shown: () => code.value(),
    segments: () => P.segments,
    delivered: () => delivered,
    uniform: shader.uniform,
    compiles: shader.compiles,
    idle,
    code,
    /** The last frame drawn, read off its target, so reading moves nothing. */
    pixels: shader.pixels,
  };
  d.ready();
</script>

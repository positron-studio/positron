<title>Camera</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* The picture at half the content width on a desk, at the left, and the full width on a
     phone, where half would be a thumbnail.
     See lessons/page-video.md#video-1 */
  .cc-half { width: 50%; }
  @media (max-width: 560px) { .cc-half { width: 100%; } }
  .cc-half canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes, relabel } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { createCamera } from '/shell/camera.mjs';

  // The local camera half of /cam/ as a patchbay: the picture shows the camera only while the
  // bay holds that link. Nothing opens on a visit and nothing leaves this machine: the camera
  // is asked for on the start press, and stop ends every track. No WHIP, relay or Stream.
  // See lessons/page-video.md#video-2
  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;

  const d = mount({ name: 'Camera', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('video/camera');

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  addNodes(bay, S, [{ name: 'camera', variant: 'page' }, 'screen'], {
    ports: { 'camera:video-out': { label: 'camera' }, 'screen:video-in': { label: 'picture' } },
  });
  // Once on, the camera box takes the device's own name.
  const camNode = (label) => relabel(bay, `${S}:camera`, label);

  const held = new Map();          // "from to" -> link id
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera waits for the press.
  hold(CAM, SCREEN);

  // ── the camera ──────────────────────────────────────────────────────────
  // The camera itself is the kit's (camera.mjs, which /connect/ runs too).
  const camera = createCamera({ log: (line, kind) => d.log(line, kind),
    onOn: ({ label, set }) => {
      name.textContent = label;
      size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
      camNode(label || 'camera');
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
      pb.refresh();
    },
    onOff: () => { cancelAnimationFrame(raf); size.textContent = ''; route(); pb.refresh(); },
  });
  const video = camera.video;
  let raf = 0;
  const flowing = camera.flowing;

  const canvas = el('canvas');
  canvas.width = FRAME_W; canvas.height = FRAME_H;
  const ctx = canvas.getContext('2d', { alpha: false });
  // Empty until the camera is on, so no placeholder name sits in the footer.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  // The name at the left, the resolution at the right beside the panel's full-screen button.
  // See lessons/page-video.md#video-3
  const panel = createVideoPanel({ media: canvas, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  panel.el.classList.add('cc-half');

  // The picture follows the link, as /radio/blend/'s sound does. An empty picture is the
  // page's ground, the dither's dark, not black.
  // See lessons/page-video.md#video-4
  const GROUND = '#0b0e14';
  function route() {
    const on = camera.on() && holds(CAM, SCREEN);
    if (on) drawCamera(ctx, video, FRAME_W, FRAME_H, { scrim: 0 });
    else { ctx.fillStyle = GROUND; ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }
  function frame() { route(); if (camera.on()) raf = requestAnimationFrame(frame); }
  route();

  const pb = createPatchbay(bay, { flowing: (l) => l.from === CAM && holds(CAM, SCREEN) && flowing() });

  // ── start and stop ──────────────────────────────────────────────────────
  const top = el('div', 'cc-top');
  top.append(camera.transport.el, camera.picker.el);
  d.stack.add(top, panel.el, pb.el);
  d.ready();
</script>

<title>Camera shader</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Start and stop on their own row at the left, the camera picker after them
     once there is more than one camera. A flex row blockifies the group, so it
     sits on no text line; on a phone the picker wraps under it. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* The camera on the left and the shader's picture on the right, each half the content width;
     on a phone they stack, the original first.
     See lessons/page-video.md#video-22 */
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes, relabel } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { createCamera } from '/shell/camera.mjs';
  import { createDitherShader } from '/shell/dither-shader.mjs';

  // /video/camera/ with a shader node (`web:shader`, video in and out) and one knob into its
  // value-in. The look is a 4x4 Bayer two tone dither, dark ground and warm off-white, brand
  // yellow only at the brightest. Nothing opens on a visit and nothing leaves this machine.
  // See lessons/page-video.md#video-23
  const S = 'web';
  const CAM = `${S}:camera:video-out`, SCREEN = `${S}:screen:video-in`;
  const FX = `${S}:dither:video-in`;
  const SH_IN = `${S}:shader:video-in`, SH_OUT = `${S}:shader:video-out`, SH_VAL = `${S}:shader:value-in`;

  const d = mount({ name: 'Camera shader', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('video/shader');

  // ── the shader's one parameter, set only through value-in ───────────────
  const KNOBS = [
    { name: 'size', min: 2, max: 16, step: 1, raw: 4, format: (r) => `${Math.round(r)} px` },
  ];
  const P = { size: 4 };
  function setParam(e) {
    if (e?.of !== 'param') { d.log('the shader takes parameters, and this was not one', 'warn'); return; }
    if (e.name === 'size') P.size = Math.max(1, Math.round(e.v));
    else { d.log(`the shader has no parameter called ${e.name}`, 'warn'); return; }
    if (!camera.on()) render();
  }

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  // No `names` on a knob, as in /synth/patch-synth.mjs: one knob names one of the
  // shader's several, and the shader logs a name it does not have.
  const KNOB_OUT = (n) => `${S}:knob-${n}:value-out`;
  addNodes(bay, S, [{ name: 'camera', variant: 'page' }, 'shader-dither', 'screen', { name: 'screen', as: 'dither', label: 'dithered' },
    ...KNOBS.map((k) => `knob-${k.name}`)], {
    portLabel: 'node:port',
    deliver: { 'shader:value-in': setParam },
    label: { screen: 'original' },
    ports: {
      'camera:video-out': { label: 'camera' },
      'shader:value-in': { shape: { of: 'param', names: KNOBS.map((k) => k.name) } },
      'screen:video-in': { label: 'original' },
      'dither:video-in': { label: 'dithered' },
    },
  });
  // Once on, the camera box takes the device's own name.
  const camNode = (label) => relabel(bay, `${S}:camera`, label);

  const held = new Map();          // "from to" -> link id
  function hold(a, b) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // Held from load, so the picture of the patch is the same running or not.
  // Holding a link opens nothing; the camera waits for the press.
  hold(CAM, SCREEN);
  hold(CAM, SH_IN);
  hold(SH_OUT, FX);
  for (const k of KNOBS) hold(KNOB_OUT(k.name), SH_VAL);

  // ── the camera ──────────────────────────────────────────────────────────
  // The camera itself is the kit's (camera.mjs, which /connect/ runs too).
  const camera = createCamera({ log: (line, kind) => d.log(line, kind),
    onOn: ({ label, set }) => {
      name.textContent = label;
      size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
      fxName.textContent = 'dither';
      camNode(label || 'camera');
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
      pb.refresh();
    },
    onOff: () => {
      cancelAnimationFrame(raf);
      size.textContent = '';
      fxName.textContent = '';
      if (gl) fxSize.textContent = '';
      render();
      pb.refresh();
    },
  });
  const video = camera.video;
  let raf = 0;
  const flowing = camera.flowing;

  // ── the original, as /video/camera/ draws it ─────────────────────────────
  const orig = el('canvas');
  orig.width = FRAME_W; orig.height = FRAME_H;
  const ctx = orig.getContext('2d', { alpha: false });
  // Footers as on /video/camera/: one line, empty until the camera is on, the
  // name at the left and the value at the right beside the full-screen button.
  const name = el('span', 'cc-say', '');
  const size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: orig, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  // An empty picture is the page's ground, the dither's dark, not black.
  // See lessons/page-video.md#video-24
  const GROUND = '#0b0e14';
  function drawOrig() {
    if (camera.on() && holds(CAM, SCREEN)) drawCamera(ctx, video, FRAME_W, FRAME_H, { scrim: 0 });
    else { ctx.fillStyle = GROUND; ctx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }

  // ── the shader's picture ────────────────────────────────────────────────
  // The dither is the kit's (dither-shader.mjs, which /connect/ runs too).
  const dither = createDitherShader({ log: (line, kind) => d.log(line, kind) });
  const canvas = dither.canvas, gl = dither.gl;
  const fxName = el('span', 'cc-say', '');
  const fxSize = el('span', 'cc-say', gl ? '' : 'no WebGL2');
  const fxPanel = createVideoPanel({ media: canvas, left: fxName });
  fxPanel.el.querySelector('.pos-vp-r').prepend(fxSize);
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, fxPanel.el);


  // The routing follows the links. Without shader -> dither the right panel
  // shows nothing; without camera -> shader the shader runs with no input and
  // draws only its ground.
  function render() {
    drawOrig();
    if (camera.on()) fxSize.textContent = gl ? `${P.size} px` : 'no WebGL2';
    dither.draw(camera.on() && holds(CAM, SH_IN) ? video : null, P.size, { out: holds(SH_OUT, FX) });
  }
  function frame() { render(); if (camera.on()) raf = requestAnimationFrame(frame); }
  render();

  // ── the knobs: one node each, `web:knob-<name>`, a turn is one event ─────
  const knobs = new Map(KNOBS.map((k) => [k.name, createKnob({
    label: k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format, hand: true,
    onInput: (r) => bay.send(KNOB_OUT(k.name), { of: 'param', name: k.name, v: r }),
  })]));
  const grid = createKnobGrid(knobs, { row: true });

  const lit = (l) => flowing() && (l.from === CAM || (l.from === SH_OUT && holds(CAM, SH_IN)));
  const pb = createPatchbay(bay, { flowing: lit });

  // ── start and stop ──────────────────────────────────────────────────────
  const top = el('div', 'cc-top');
  top.append(camera.transport.el, camera.picker.el);
  // Linear, as every concept synth: the pictures, then the knobs area, then the patchbay.
  d.stack.add(top, pair, grid.el, pb.el);
  window.__demo.knobs = grid;
  d.ready();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<!-- No page stylesheet: the video panel's stage owns the canvas's size, shape and fit.
     See lessons/page-moq.md#moq-1 -->

<script type="module">
  import { mount, guard, el, createShipper } from '/shell/shell.mjs';
  import { startMoq, MOQ_RELAY, moqSupport, burn, hueFor } from '/shell/moq.mjs';
  import { drawTestsrc2 } from '/shell/testsrc2.mjs';
  import { createPresenceButton, streamSays, STREAM_CAN } from '/shell/presence.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';

  const q = new URLSearchParams(location.search);
  // loopback publishes AND subscribes one namespace, so a single device measures
  // the whole path and both ends share one clock. The delta is exact, not an
  // estimate. pub/watch split the same leg across two devices.
  const role = q.get('role') || 'loopback';
  // ?codec=vp8 pins the publisher, which otherwise probes AV1 first, so the VP8 numbers
  // in HANDOFF (p50 20 ms, 4K30 at zero drops) stay reproducible.
  // See lessons/page-moq.md#moq-2
  const codec = q.get('codec') || null;
  // ?transport=force bypasses @moq/net's Safari user-agent block. For MEASURING
  // WebKit bug 319818, not for shipping. See demo/shell/moq.mjs.
  const forceTransport = q.get('transport') === 'force';
  const fixedNs = q.get('ns');
  // A fresh namespace per start: two publishers on one namespace and the second
  // one dies (rig/moq/RUNBOOK.md §6.4), and a stop then a start is two.
  const freshNs = () => fixedNs || `positron-08-${Math.random().toString(36).slice(2, 8)}`;
  let ns = freshNs();

  const d = mount({
    name: 'moq',
    // One sentence, the index's own line. The picture shows how frames travel and the
    // readout key says what each number means.
    // See lessons/page-moq.md#moq-3
    what: 'The same test picture the other streaming pages play, sent from this browser over MoQ and back.',
    /**
     * Six cells, each something demo/shell/moq.mjs counts: p95 and worst burned-clock latency,
     * setup (`st.sessionMs`), first frame, frames decoded, unreadable (`st.badRows`, which
     * keeps the latency honest). The median is under the picture, not here.
     * See lessons/page-moq.md#moq-4
     */
    readout: { p95: 'ms', worst: 'ms', setup: 'ms', 'first frame': 's', frames: '', unreadable: '' },
    controls: [],
  });
  guard(d);

  /**
   * The same presence control and three words as /llhls/ and /webrtc/ (presence.mjs). Here
   * `starting` is a WebTransport session, a codec probe and the first frame, about 2 s.
   * See lessons/page-moq.md#moq-5
   */
  const stream = createPresenceButton({
    of: '', showName: false, state: 'offline', says: streamSays('MoQ'), can: STREAM_CAN,
    aria: 'start or stop the stream',
    press: () => d.run('toggle'),
  });
  stream.because('nothing is publishing until you press');
  d.controls.hidden = false;
  d.controls.append(stream.el);

  const out = el('canvas');
  /**
   * The latency under the picture names its kind: the clock burned into a frame, read back
   * after encode, relay, decode and draw. A candidate-pair round trip is not media latency.
   * See lessons/page-moq.md#moq-6
   */
  const panel = createVideoPanel({
    media: out,
    left: null,
    fullMode: 'hover',
    /**
     * No `size` cell: in loopback it is this page's own 1280x720, and at 375 px the row with
     * it pushed the `ms` of glass to glass out of view. moq.mjs logs a remote publisher's size.
     * See lessons/page-moq.md#moq-7
     */
    values: [
      { key: 'fps', label: 'fps', reserve: 2 },
      { key: 'codec', label: '', reserve: 3 },
      { key: 'g2g', label: 'glass to glass', reserve: 6 },
    ],
  });
  d.el.append(panel.el);
  // What the catalog names, in the words a reader knows it by.
  const codecName = (c) => (!c ? '' : c.startsWith('av01') ? 'AV1' : c.startsWith('vp09') ? 'VP9'
    : c.startsWith('vp8') ? 'VP8' : c.split('.')[0]);

  const ship = createShipper();
  const support = moqSupport();

  /**
   * The picture is ffmpeg's `testsrc2` (testsrc2.mjs, pixel-matched) under `burn()`'s row and
   * clocks on an opaque bed, with a `black@0.55` scrim behind labels. `painted` counts calls
   * so a publisher that ignored `paint` cannot pass.
   * See lessons/page-moq.md#moq-8
   */
  let painted = 0;
  const hue = () => hueFor(ns);
  const paint = (ctx, w, h, frame) => {
    painted++;
    drawTestsrc2(ctx, w, h, frame);
    return burn(ctx, w, h, frame, { field: false, hue: hue(), scrim: true });
  };

  let leg = null, lastDecoded = 0, gen = 0, tick = null;

  // `stream.state()`, NOT `stream.state`: a function on the presence api, and a
  // comparison against a function cannot fail. See `/webrtc/`.
  d.on('toggle', () => (stream.state() === 'offline' ? start() : stop()));

  /**
   * Stopping is the page letting go: the publisher is this tab, so closing the session stops
   * the frames and the relay forgets the broadcast.
   * See lessons/page-moq.md#moq-9
   */
  function stop() {
    gen++;
    clearInterval(tick); tick = null;
    try { leg?.stop(); } catch { /* already gone */ }
    leg = null;
    for (const k of panel.values.keys()) panel.values.set(k, '');
    for (const k of ['p95', 'worst', 'setup', 'first frame', 'frames', 'unreadable']) d.set(k, '');
    stream.set('offline').because('press to publish again');
    d.log('closed the session. nothing is publishing');
  }

  /* Two tiers: an ordinary harness run opens nothing and checks the page at rest plus local
     WebTransport support; `DEMO_DEEP=1` runs the relay round trip. A visitor is never LIGHT.
     See lessons/page-moq.md#moq-10 */
  const LIGHT = SELFCHECK && !DEEP;

  async function start() {
    if (leg) return;
    const mine = ++gen;
    if (LIGHT && support.ok) {
      d.log('left for the deep run: the session to the relay and the frames that come back through it (DEMO_DEEP=1)');
      await d.run('check');
      return;
    }
    ship(`MOQ-SUPPORT ${JSON.stringify(support)}`);
    if (!support.ok && !forceTransport) {
      d.log(`MoQ needs WebTransport: ${support.why}. Try Chrome or Edge.`, 'bad');
      stream.set('offline').because(support.why);
      await d.run('check');
      return;
    }
    stream.set('coming').because('press again to stop it');
    ns = freshNs();
    lastDecoded = 0;
    d.log(`relay ${new URL(MOQ_RELAY).host}, role ${role}, namespace ${ns}`);
    let got;
    try {
      got = await startMoq({ out, ns, role, forceTransport, codec, paint, log: (m, k) => d.log(m, k) });
    } catch (e) {
      if (gen !== mine) return;
      stream.set('offline').because('the relay did not answer');
      d.fail(e);
      return;
    }
    // Stopped while the session was opening: the leg exists now, so close it.
    if (gen !== mine) { got.stop(); return; }
    leg = got;
    d.log(`negotiated ${leg.version}`);

    tick = setInterval(() => {
      if (!leg) return;
      const s = leg.stats;
      const fps = s.decoded - lastDecoded;
      lastDecoded = s.decoded;
      const live = role === 'pub' ? s.encoded > 0 : s.decoded > 0;
      stream.set(live ? 'online' : 'coming').because(live ? 'press to stop it' : 'waiting for the first frame. press again to stop');
      d.set('setup', s.sessionMs ?? '');
      if (s.firstFrameMs != null) d.set('first frame', (s.firstFrameMs / 1000).toFixed(2));
      if (role !== 'pub') {
        d.set('frames', s.decoded);
        d.set('unreadable', s.badRows, s.badRows ? 'bad' : '');
      }
      if (s.decoded) {
        panel.values.set('fps', fps);
        panel.values.set('codec', codecName(s.catalog?.video?.renditions?.video?.codec ?? s.codec));
        panel.stage.style.setProperty('--vp-aspect', `${out.width} / ${out.height}`);
      }
      const p50 = leg.pct(0.5), p95 = leg.pct(0.95), worst = leg.pct(1);
      if (p50 != null) panel.values.set('g2g', `${Math.round(p50)} ms`);
      if (p95 != null) d.set('p95', p95, p95 < 100 ? 'ok' : p95 < 400 ? '' : 'bad');
      if (worst != null) d.set('worst', worst);
    }, 1000);

    /**
     * The checks wait for frames, since `startMoq` returns once the decoder is configured.
     * Two seconds of clean rows is 60 samples at 30 fps, enough for a p95.
     * See lessons/page-moq.md#moq-11
     */
    const t0 = performance.now();
    while (gen === mine && performance.now() - t0 < 15000) {
      const s = leg.stats;
      if (role === 'pub' ? s.encoded > 30 : s.samples >= 60 || (role === 'watch' && s.decoded > 30)) break;
      await new Promise((r) => setTimeout(r, 250));
    }
    if (gen !== mine) return;
    await d.run('check');
  }

  /**
   * Is the picture that came back testsrc2? Six bar centres at y 100, clear of clock, checker
   * and square; five of six with a wide tolerance, since the gradient or square can cover one.
   * See lessons/page-moq.md#moq-12
   */
  function barsCameBack() {
    const ctx = out.getContext('2d');
    const want = [[255, 0, 0], [0, 255, 0], [255, 255, 0], [0, 0, 255], [255, 0, 255], [0, 255, 255]];
    let hit = 0;
    const got = want.map((rgb, i) => {
      const x = Math.round(((i + 0.5) / 6) * out.width);
      const p = ctx.getImageData(x, 100, 1, 1).data;
      if (rgb.every((v, k) => Math.abs(v - p[k]) < 70)) hit++;
      return `${p[0]},${p[1]},${p[2]}`;
    });
    return { hit, got };
  }

  d.on('check', () => {
    // On a browser without WebTransport the honest assertion is that the page
    // DETECTED that, not that a connection exists.
    if (!support.ok) {
      d.assert('correctly reports that MoQ cannot run here', !!support.why, support.why);
      d.assert('no transport was attempted', !leg);
      return;
    }
    // The toggle, read through the call and required to be a string, which is
    // what lets this go red on the `stream.state` bug `/webrtc/` shipped once.
    const state = stream.state();
    if (LIGHT) {
      const btns = [...d.controls.querySelectorAll('button')];
      d.assert('one control, and it is the stream toggle',
        btns.length === 1 && btns[0] === stream.el && !d.controls.querySelector('.pos-pri'),
        `${btns.length} control(s)`);
      d.assert('the toggle still reads stream off, because nothing was opened',
        state === 'offline' && !leg, `state ${state}, ${leg ? 'a leg is open' : 'no leg'}`);
      const lab = [...panel.values.el.querySelectorAll('.pos-vp-k')].map((k) => k.textContent);
      d.assert('the latency under the picture is named glass to glass',
        lab.includes('glass to glass'), `labels ${lab.join(', ')}`);
      d.assert('nothing in the picture was cut or refused', dg.cuts.length === 0,
        dg.cuts.map((c) => `${c.id}: ${c.full}`).join(' / ') || 'none');
      return;
    }
    d.assert('the stream toggle says the stream is on',
      typeof state === 'string' && state === 'online',
      `toggle reads ${JSON.stringify((stream.badge.textContent || '').trim())}, state ${state}`);
    const btns = [...d.controls.querySelectorAll('button')];
    d.assert('one control, and it is the stream toggle',
      btns.length === 1 && btns[0] === stream.el && !d.controls.querySelector('.pos-pri'),
      `${btns.length} control(s)`);
    d.assert('connected to the relay', !!leg);
    if (!leg) return;
    const s = leg.stats;
    d.assert('negotiated an IETF MoQT version', /moq-transport-1\d/.test(String(leg.version)), String(leg.version));
    if (role !== 'watch') {
      d.assert('broadcast published', s.published);
      // WHICH codec ran, because the publisher PROBES for one, and a branch the
      // suite cannot see is a branch nobody asserts.
      d.assert('names the codec it is publishing', !!s.codec, s.codec ?? 'none');
      d.assert('no encoder errors', s.encErrs === 0, String(s.encErrs));
      d.assert('the publisher painted testsrc2 under the clock', painted > 0,
        painted ? `${painted} frame(s) painted` : 'startMoq never called paint, so it drew its own flat field');
    }
    if (role !== 'pub') {
      d.assert('catalog round-tripped through the relay', !!s.catalog, s.catalog ? 'yes' : 'never arrived');
      d.assert('frames arrived over the wire', s.wireFrames > 0, `${s.wireFrames} frame(s)`);
      d.assert('frames decoded', s.decoded > 0, `${s.decoded} decoded`);
      d.assert('no decoder errors', s.decErrs === 0, String(s.decErrs));
      if (s.decoded) {
        const b = barsCameBack();
        d.assert('the picture that came back is testsrc2', b.hit >= 5, `${b.hit} of 6 bars at y 100: ${b.got.join(' ')}`);
      }
    }
    if (role === 'loopback') {
      /**
       * The rate is the claim, not one row: an encoder starves a busy picture of bits, so nine in
       * ten decoded frames must carry a clean clock.
       * See lessons/page-moq.md#moq-13
       */
      const read = s.samples + s.badRows;
      d.assert('burned clock read back from nine in ten frames', s.samples > 0 && s.samples >= 0.9 * read,
        `${s.samples} clean row(s), ${s.badRows} unreadable`);
      if (s.samples) {
        // rig/moq measured p50 26.2 / p95 42.4 ms on a desktop. This asserts an
        // ENVELOPE wide enough for a phone or a loaded CI box, not that figure.
        d.assert('glass-to-glass in milliseconds, not seconds', leg.pct(0.5) < 2000,
          `p50 ${leg.pct(0.5)}ms, p95 ${leg.pct(0.95)}ms, n=${s.samples}`);
      }
    }
    // The footer carries the latency under its own name. Read off the DOM,
    // because that is what a reader sees.
    const lab = [...panel.values.el.querySelectorAll('.pos-vp-k')].map((k) => k.textContent);
    d.assert('the latency under the picture says it is glass to glass',
      lab.includes('glass to glass') && !!panel.values.cell('g2g').textContent,
      `labels ${lab.join(', ')}, value ${JSON.stringify(panel.values.cell('g2g').textContent)}`);
    d.assert('nothing in the picture was cut or refused', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id}: ${c.full}`).join(' / ') || 'none');
  });

  /**
   * How it works, read off demo/shell/moq.mjs. One browser on both ends because the default
   * role is loopback, which makes the clock exact.
   * See lessons/page-moq.md#moq-14
   */
  const dg = createDiagram(d.el, {
    caption: 'This browser draws the picture, encodes it and publishes it to a MoQ relay, then '
      + 'subscribes to the same broadcast and reads the burned clock back off every frame. '
      + 'Nothing else is running, so closing the session is the whole of stopping it.',
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'pub', label: 'publisher', sub: 'canvas, WebCodecs', tech: 'browser',
            note: 'Draws **testsrc2** and the burned clock 30 times a second and encodes them as '
                + 'AV1, else VP9, else VP8. A frame the encoder cannot take yet is dropped, so '
                + 'the clock never drifts from wall time.' },
          { id: 'play', label: 'player', sub: 'WebCodecs, canvas', tech: 'browser',
            note: 'Decodes each frame into the canvas above and reads the 48 bit clock back out '
                + 'of the black row. Both ends share one clock, so the difference is the latency '
                + 'itself rather than an estimate.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'MoQ relay', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'relay', label: 'relay', sub: 'MoQT draft 14', tech: 'cloudflare',
            note: 'Carries one stream per group of frames and keeps only the live edge. A relay '
                + 'cannot run in a Container because a Container takes no inbound QUIC, which '
                + 'is why both ends are browsers.' },
        ] },
    ],
    links: [
      { from: 'pub', to: 'relay', label: 'MoQT',
        note: 'One WebTransport session over QUIC carries the catalog, republished every 2 s so a late '
            + 'subscriber still finds it, and the video track. Safari is refused here because '
            + 'WebKit bug 319818 stalls its QUIC after about two minutes of streams.' },
      { from: 'relay', to: 'play', label: 'frames', back: true,
        note: 'The same session subscribes to the broadcast it just announced, retrying the '
            + 'catalog until the relay has it, because a subscribe that arrives first is refused.' },
    ],
  }, { how: true, atEnd: true });

  if (!support.ok) d.log(`${support.why}. This demo needs Chrome or Edge`, 'bad');
  d.log(role === 'loopback'
    ? 'loopback: one page publishes and subscribes the same namespace, so one clock times the whole path'
    : `role ${role}, pair it with ?role=${role === 'pub' ? 'watch' : 'pub'}&ns=${ns}`);
  d.ready();
</script>
</html>

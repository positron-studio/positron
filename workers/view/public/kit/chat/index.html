<!doctype html>
<html lang="en">

<title>POSITRON kit/chat</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* A specimen box holds a column at a height a chat would have, so the log
     sits at the bottom and the sign in the middle as they do in a window. */
  .kc-tall { flex: 1 1 100%; height: 240px; display: flex; flex-direction: column;
             background: var(--card); border: var(--edge, 1px solid var(--line)); border-radius: var(--r, 4px); }
  .kc-full { flex: 1 1 100%; min-width: 0; }
</style>
<script type="module">
  import { el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createChatLog, createChatSign, createChatCompose, createChatColumn, createChatWindow, createChatGrid } from '/shell/chat-ui.mjs';
  import { createParticipant, createParticipantGrid, createStage } from '/shell/participant.mjs';

  /**
   * Every piece of demo/shell/chat-ui.mjs, the module the /room/ pages draw chat with.
   * Nothing is wired to a room. A piece added to chat-ui.mjs gets a block here,
   * newest first, and a row in demo/shell/kit-parts.mjs.
   * See lessons/page-kit-chat.md#kit-chat-1
   */
  const { d, section, land, checkPage } = createKitPage({
    part: 'chat',
    what: 'The pieces a chat page is drawn with, a window, a grid, columns, a log, a sign and a compose box.',
  });
  const now = Date.now();
  const SAMPLE = [
    { who: 'web-2qm', at: now - 180000, text: 'Is the Pi up today?' },
    { who: 'web-7zd', at: now - 120000, text: 'It answered a minute ago. The Circuit is plugged in.' },
    { who: 'you', at: now - 60000, text: 'Good. Patching the keys to it now.', me: true },
  ];

  // the blocks, newest first
  const PEOPLE = ['web-2qm', 'web-7zd', 'web-k4p', 'web-91x', 'web-ab12', 'web-3fe'];
  /** A painted canvas stands in for a camera or a screen, so a specimen opens no device. */
  const paint = (hue, w = 320, h = 180, words = '') => {
    const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
    const g = c.getContext('2d');
    let t = 0;
    const draw = () => { g.fillStyle = `hsl(${hue} 30% 22%)`; g.fillRect(0, 0, w, h);
      g.fillStyle = `hsl(${hue} 50% 55%)`; g.beginPath(); g.arc(w / 2 + (w / 8) * Math.sin(t / 20), h * 0.53, h * 0.22, 0, 7); g.fill();
      if (words) { g.fillStyle = '#e6e6e6'; g.font = `${Math.round(h / 12)}px monospace`; g.fillText(words, w * 0.06, h * 0.16); }
      t++; };
    draw(); setInterval(draw, 100);
    return c.captureStream ? c.captureStream(10) : null;
  };

  // STAGE AND STRIP: createStage over the participant grid while somebody presents.
  let sgrid = null, sStage = null, sMode = null;
  const sTiles = [];
  section('STAGE AND STRIP',
    'While somebody presents, the stage takes the column at the share\'s own shape and the cameras go to one row under it that scrolls sideways, the presenter first. The presenter sees a small preview, never their own screen full size.',
    `createStage() -> { el, show(stream, { self, who }), info() }
grid.stage(stage.el, [presenterTile, ...]) and grid.stage(null) for the grid again`,
    (box) => {
      const host = el('div', 'kc-tall');
      // `flex: none`: a column flex basis of 100% is content sized, and the stage's aspect would grow it.
      host.style.height = '320px'; host.style.flex = 'none';
      sgrid = createParticipantGrid();
      host.append(sgrid.el);
      sStage = createStage();
      const screen = paint(200, 640, 400, 'slide 3 of 12: the patch bay');
      PEOPLE.slice(0, 5).forEach((who, i) => {
        const t = createParticipant({ name: i ? who : `me ${who}`, self: !i });
        t.video.muted = true;
        t.stream(paint(i * 50 + 20));
        sTiles.push(t);
        sgrid.add(t);
      });
      const mode = (m) => {
        if (m === 'grid') { sStage.show(null); sgrid.stage(null); }
        else { sStage.show(screen, { self: m === 'self', who: PEOPLE[2] }); sgrid.stage(sStage.el, m === 'self' ? [sTiles[0]] : [sTiles[2], sTiles[0]]); }
      };
      const pick = createButtonGroup({ buttons: [
        { id: 'grid', label: 'Nobody', onPress: () => mode('grid') },
        { id: 'other', label: 'web-k4p', onPress: () => mode('other') },
        { id: 'self', label: 'You', onPress: () => mode('self') },
      ] });
      const wrap = el('div', 'kc-full');
      wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '8px';
      wrap.append(host, pick.el);
      box.append(wrap);
      sMode = mode;
      mode('other');
    });

  // PARTICIPANT GRID: demo/shell/participant.mjs, the tiles /room/present/, /room/stage/ and /room/mesh/ draw their cameras with.
  // A painted canvas stands in for a camera, so the specimen opens no device.
  let pgrid = null;
  const pTiles = [];
  section('PARTICIPANT GRID',
    'One tile per person with a name, a muted mic, a camera-off face and a ring while they speak. The grid sizes every tile alike from its own box.',
    `createParticipant({ name, self }) -> { el, stream(s), mic(on), cam(on), speaking(on), state(t) }
createParticipantGrid({ gap, minW }) -> { el, add(tile), remove(tile), layout() }`,
    (box) => {
      const host = el('div', 'kc-tall');
      host.style.height = '320px';
      pgrid = createParticipantGrid({ empty: 'nobody yet' });
      host.append(pgrid.el);
      PEOPLE.forEach((who, i) => {
        const t = createParticipant({ name: i ? who : `me ${who}`, self: !i });
        t.video.muted = true;   // a specimen plays without a press
        t.stream(paint(i * 50));
        if (i === 1) t.mic(false);
        if (i === 2) t.cam(false);
        if (i === 3) t.speaking(true);
        if (i === 4) t.state('relay');
        pTiles.push(t);
      });
      const NAMES = PEOPLE.map((_, i) => `${i + 1} ${i ? 'people' : 'person'}`);
      const to = (n) => {
        const k = Math.max(1, Math.min(pTiles.length, n));
        pTiles.forEach((t, i) => { if (i < k) pgrid.add(t); else pgrid.remove(t); });
        step.show(NAMES[k - 1], k - 1);
      };
      const step = createStepper({ what: 'people', prev: () => to(pgrid.tiles().length - 1), next: () => to(pgrid.tiles().length + 1),
        pick: { options: NAMES, at: 3, onPick: (i) => to(i + 1) } });
      const wrap = el('div', 'kc-full');
      wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '8px';
      wrap.append(host, step.el);
      box.append(wrap);
      to(4);
    });

  // CHAT GRID: six columns, logs and signs taking turns, the stepper showing
  // the first n of them. The layout is the multi typer's (/typist/score/).
  const LINES = ['Is the Pi up today?', 'It answered a minute ago.', 'The Circuit is plugged in.',
    'Patching the keys to it now.', 'I hear it from here.', 'Doors open at eight'];
  let grid = null;
  section('CHAT GRID',
    'One to six equal cells in the video panel, separated by the seam: 1 full, 2 and 3 across, 4 two by two, 5 three over two, 6 three by two; a frame under 560 px stacks 1 to 3 and goes two across for 4 to 6.',
    `createChatGrid({ cells: [col1, col2, ...], count: 3, left, centre })
  -> { el, panel, grid, set(n), count() }`,
    (box) => {
      const cells = PEOPLE.map((who, i) => {
        if (i % 2) {
          const s = createChatSign();
          s.add({ text: LINES[i] });
          return createChatColumn({ title: who.toUpperCase(), body: s });
        }
        const log = createChatLog();
        log.add({ who, at: now - 60000 * (i + 1), text: LINES[i] });
        log.add({ who: 'you', at: now - 30000 * (i + 1), text: LINES[(i + 3) % 6], me: true });
        return createChatColumn({ title: who.toUpperCase(), body: log });
      });
      const NAMES = PEOPLE.map((_, i) => `${i + 1} ${i ? 'cells' : 'cell'}`);
      const to = (n) => { const k = grid.set(n); step.show(NAMES[k - 1], k - 1); };
      const step = createStepper({ what: 'cells', prev: () => to(grid.count() - 1), next: () => to(grid.count() + 1),
        pick: { options: NAMES, at: 2, onPick: (i) => to(i + 1) } });
      grid = createChatGrid({ cells, count: 3, centre: step.el });
      grid.el.classList.add('kc-full');
      box.append(grid.el);
    });

  let win = null, winLog = null, winSign = null;
  section('CHAT WINDOW',
    'The kit video panel with the chat as its picture: one column full width, or a broadcast column and a chat a third wide; a phone stacks the two.',
    `createChatWindow({ columns: [castCol, chatCol], footer: joinRow })
  -> { el, panel, grid }`,
    (box) => {
      winSign = createChatSign();
      winSign.add({ text: 'Doors open at eight\nStream at nine' });
      const castBox = createChatCompose({ placeholder: 'Broadcast to everybody in the room', onSend: (t) => winSign.add({ text: t }) });
      winLog = createChatLog();
      for (const r of SAMPLE) winLog.add(r);
      const chatBox = createChatCompose({ placeholder: 'Message chat-1', onSend: (t) => winLog.add({ who: 'you', at: Date.now(), text: t, me: true }) });
      const cast = createChatColumn({ title: 'BROADCAST, YOU ARE ADMIN', body: winSign, compose: castBox, ink: '#c39af0' });
      const chat = createChatColumn({ title: 'CHAT', body: winLog, compose: chatBox });
      const foot = createButtonGroup({ buttons: [{ id: 'join', label: 'Join chat-1' }] });
      foot.enable('join', false, 'a specimen, nothing to join');
      win = createChatWindow({ columns: [cast, chat], footer: foot.el });
      castBox.enable(true); chatBox.enable(true);
      win.el.classList.add('kc-full');
      box.append(win.el);
    });

  section('CHAT COLUMN',
    'A heading, a body and an optional compose box; ink colours your own name and the box focus edge.',
    `createChatColumn({ title: 'CHAT', body: log, compose: box, ink: '#c39af0' })
  -> { el, title('BROADCAST FROM WEB-2QM') }`,
    (box) => {
      const log = createChatLog();
      log.add({ who: 'you as admin', at: now, text: 'A column in the admin violet.', me: true });
      const c = createChatColumn({ title: 'BROADCAST', body: log, ink: '#c39af0' });
      c.el.classList.add('kc-tall');
      box.append(c.el);
    });

  section('CHAT SIGN',
    'One line on show, a new one replacing it: centred both ways, balanced, at most 32 characters and 70 per cent of the area a line, newlines kept, in the brand face.',
    `createChatSign() -> { el, add({ text }), clear(), text() }`,
    (box) => {
      const s = createChatSign();
      s.add({ text: 'What is this world here?' });
      const host = el('div', 'kc-tall');
      host.append(s.el);
      box.append(host);
    });

  section('CHAT LOG',
    'Lines with who and when, newest at the bottom, your own name in the column ink, scrolling inside itself.',
    `createChatLog() -> { el, add({ who, at, text, me }), clear() }`,
    (box) => {
      const log = createChatLog();
      for (const r of SAMPLE) log.add(r);
      const host = el('div', 'kc-tall');
      host.append(log.el);
      box.append(host);
    });

  section('CHAT COMPOSE',
    'Grows to six lines, Enter sends, Shift and Enter is a new line, the send icon in its bottom right; hidden and off until enabled, so a page shows no box before Join.',
    `createChatCompose({ placeholder, onSend }) -> { el, input, enable(true), enabled() }`,
    (box) => {
      const sent = createChatLog();
      const c = createChatCompose({ placeholder: 'Type and press Enter', onSend: (t) => sent.add({ who: 'you', at: Date.now(), text: t, me: true }) });
      c.enable(true);
      const host = el('div', 'kc-tall');
      host.append(sent.el, c.el);
      box.append(host);
    });

  land();

  if (SELFCHECK) {
    const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    await frames(3);
    checkPage();
    const ta = win.el.querySelectorAll('textarea');
    d.assert('the window holds two columns, each with a compose box that grew to its text',
      ta.length === 2 && [...ta].every((t) => t.getBoundingClientRect().height >= 30),
      [...ta].map((t) => `${t.getBoundingClientRect().height.toFixed(0)} px`).join(', '));
    const hidden = createChatCompose({ placeholder: 'x', onSend: () => {} });
    document.body.append(hidden.el);
    d.assert('a compose box is hidden until it is enabled',
      getComputedStyle(hidden.el).display === 'none', getComputedStyle(hidden.el).display);
    hidden.el.remove();

    // Stage and strip: the stage on top, the tiles under it, presenter first; one row in a wide box, the space
    // under the stage filled in a tall one (a phone); and back.
    const tops = sTiles.map((t) => Math.round(t.el.getBoundingClientRect().top));
    const sr = sStage.el.getBoundingClientRect();
    const L = sgrid.layout();
    const rowsOk = L.narrow ? new Set(tops).size >= 1 : new Set(tops).size === 1;
    d.assert(L.narrow ? 'with a presenter the stage sits on top and the cameras fill the space under it, the presenter first'
      : 'with a presenter the stage sits on top and every camera in one row under it, the presenter first',
      L.mode === 'stage' && rowsOk && Math.min(...tops) >= Math.round(sr.bottom) && L.order[0] === sTiles[2].id && (L.narrow || sr.height > L.strip.h),
      `${L.mode}, narrow ${L.narrow}, rows at ${[...new Set(tops)].join(',')}, stage ${sr.width.toFixed(0)}x${sr.height.toFixed(0)}, strip ${L.strip.h}, first ${L.order[0]}`);
    sStage.show(null); sgrid.stage(null);
    const G = sgrid.layout();
    d.assert('with nobody presenting the same tiles are a grid again, the stage gone',
      G.mode === 'grid' && G.n === 5 && !sStage.el.isConnected, `${G.mode}, ${G.n} tiles, ${G.perRow?.join('+')}`);
    sMode('other');

    // The grid, at every count: how many cells sit in each row, read off rects.
    const rows = () => {
      const tops = new Map();
      for (const c of grid.grid.children) { const t = Math.round(c.getBoundingClientRect().top); tops.set(t, (tops.get(t) || 0) + 1); }
      return [...tops.entries()].sort((a, b) => a[0] - b[0]).map(([, k]) => k).join(',');
    };
    // A desk and a phone lay the grid out differently (chat-ui.mjs): the rows ask the frame's own
    // width (a container query at 560 px), the frame's shape asks the window's (a media query).
    const narrow = grid.grid.parentElement.clientWidth <= 560;
    const phone = matchMedia('(max-width: 560px)').matches;
    const want = narrow
      ? { 1: '1', 2: '1,1', 3: '1,1,1', 4: '2,2', 5: '2,2,1', 6: '2,2,2' }
      : { 1: '1', 2: '2', 3: '3', 4: '2,2', 5: '3,2', 6: '3,3' };
    const got = {};
    for (let n = 1; n <= 6; n++) { grid.set(n); got[n] = rows(); }
    grid.set(3);
    d.assert(narrow ? 'on a phone the grid stacks one to three cells and goes 2 by 2, 2, 2 and 1, and 2 by 3'
      : 'the grid lays one to six cells out as 1, 2, 3, 2 by 2, 3 over 2 and 3 by 2 on a desk',
      Object.keys(want).every((n) => got[n] === want[n]), JSON.stringify(got));
    const ar = (n) => { grid.set(n); const r = grid.panel.stage.getBoundingClientRect(); return +(r.width / r.height).toFixed(2); };
    const a3 = ar(3), a4 = ar(4);
    grid.set(3);
    const [w3, w4] = phone ? [3 / 4, 3 / 4] : [16 / 9, 4 / 3];
    d.assert(phone ? 'on a phone the frame is 3:4 for three cells and for four' : 'the frame is 16:9 for one row of cells and 4:3 for two',
      Math.abs(a3 - w3) < 0.02 && Math.abs(a4 - w4) < 0.02, `${a3} at 3, ${a4} at 4`);
  }
  d.ready();
</script>
</html>

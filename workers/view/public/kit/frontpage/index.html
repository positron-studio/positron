<title>POSITRON kit/frontpage</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* Every face is self hosted: JetBrains Mono and Geist under /shell/vendor/ (listed
     in workers/view/build.mjs, declared in shell.css); Gabarito from /weight/'s own
     folder, so what is shown is the file that page ships.
     See lessons/page-kit-frontpage.md#kit-frontpage-1 */

  /* /weight/'s face, read from its own folder */
  @font-face { font-family: 'FP Gabarito'; font-weight: 200 800; font-display: swap; src: url('/weight/vendor/gabarito-latin.woff2') format('woff2'); }

  /* A list of faces: the gap between two faces is two steps above the gap
     inside one, so a face's name, its facts and its specimens read as one
     group (positron-compose, section 1). */
  .fp-faces { display: flex; flex-direction: column; gap: var(--pos-gap); }
  .fp-face { display: flex; flex-direction: column; gap: calc(2 * var(--ctl-gap)); min-width: 0; }
  .fp-name { font: 600 15px/1.2 var(--brand); color: var(--fg); margin: 0; }
  .fp-where { font: 400 13.5px/1.5 var(--brand); color: var(--dim); margin: 0; max-width: 66ch; }

  /* the facts about a face are cells, not one string with glue in it */
  .fp-facts { display: flex; flex-wrap: wrap; gap: var(--ctl-gap) 24px; margin: 0; }
  .fp-fact { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fp-k { font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); }
  .fp-v { font: 500 13px/1.3 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .fp-v[data-state="bad"] { color: var(--bad); }

  /* SAMPLER: one line per size, the size in a column of its own so every
     line starts on one x. The line wraps rather than scrolling or cutting:
     a 64 px line on a phone is two lines, which is what it would be anywhere. */
  .fp-rows { display: flex; flex-direction: column; gap: var(--ctl-gap); }
  .fp-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: baseline; }
  .fp-sz { font: 400 11px/1.4 var(--mono); color: var(--dim2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fp-txt { color: var(--fg); overflow-wrap: anywhere; margin: 0; }

  /* MATCHING SANS: two columns on a desk, one on a phone, asking the block's
     own width through the grid floor rather than the window's. */
  .fp-pair { display: grid; gap: calc(2 * var(--ctl-gap)); grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
  .fp-spec { display: flex; flex-direction: column; gap: var(--ctl-gap); min-width: 0; }
  .fp-cap { font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim2); margin: 0; }
  .fp-para { font-size: 15px; line-height: 1.55; color: var(--fg); margin: 0; }
  .fp-para.fp-m { font-family: var(--brand); }
  .fp-para.fp-s { font-family: var(--sans); }
  .fp-title { font: 600 17px/1.2 var(--brand); color: var(--fg); margin: 0; }
  .fp-body { font: 400 15px/1.55 var(--sans); color: var(--dim); margin: 0; }
  .fp-rec { font: 400 15px/1.6 var(--brand); color: var(--fg); margin: 0; max-width: 66ch; }
  .fp-rec b { color: var(--hi); font-weight: 600; }

  /* HERO: four lines, each with its own gap above, the eyebrow closest to its headline.
     Every face, size, weight, tracking and line height comes from PAIRINGS, so the
     label under it reads the numbers the hero is drawn with.
     See lessons/page-kit-frontpage.md#kit-frontpage-2 */
  .fp-hero { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .fp-hero > * { margin: 0; overflow-wrap: anywhere; }
  /* Balanced wrap on every specimen heading, title, line and card text, so a two line
     heading breaks into two similar lines.
     See lessons/page-kit-frontpage.md#kit-frontpage-3 */
  .fp-hero-h, .fp-hero-l, .fp-hero-s, .fp-ttl-t, .fp-ttl-w, .fp-title, .fp-body,
  .fp-rule-n, .fp-cc-card, .fp-cc-card * { text-wrap: balance; }
  .fp-hero-eye { color: var(--dim); text-transform: uppercase; }
  .fp-hero-h { color: var(--fg); margin-top: 14px; }
  .fp-hero-l { color: var(--fg); margin-top: 20px; max-width: 34em; }
  .fp-hero-s { color: var(--dim2); margin-top: 14px; }
  /* The light version is not in the kit: shell.css has one dark theme, so this
     specimen re-declares the five tokens it reads, on itself only.
     See lessons/page-kit-frontpage.md#kit-frontpage-4 */
  .fp-light { --bg: #ffffff; --fg: #111418; --dim: #5b6472; --dim2: #7a8391; background: var(--bg);
              border-radius: var(--r, 4px); padding: 40px 32px; }
  .fp-label { display: flex; flex-direction: column; gap: 2px; margin-top: calc(2 * var(--ctl-gap)); }
  .fp-label-n { font: 600 12px/1.4 var(--brand); color: var(--hi); margin: 0; }
  .fp-label-r { font: 400 11px/1.5 var(--mono); color: var(--dim2); margin: 0; overflow-wrap: anywhere; }

  /* TITLES AND SUBTITLES: one specimen per step, the line under the title at
     the shell's own 4 px below it */
  .fp-ttl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fp-ttl > * { margin: 0; overflow-wrap: anywhere; }
  .fp-ttl-t { color: var(--fg); }
  .fp-ttl-w { color: var(--dim); max-width: 62ch; }
  .fp-ttl-h { color: var(--hi); text-transform: uppercase; }
  .fp-mixes { display: flex; flex-direction: column; gap: var(--pos-gap); }
  .fp-mix { display: flex; flex-direction: column; gap: 20px; }

  /* PAIRINGS ON A SLIDE: the slide's headline reads --fp-head and its text
     already reads --sans (slide.css), so a frame changes face by setting two
     custom properties and no slide rule is overridden but this one. */
  .fp-sl .sl-say { font-family: var(--fp-head); }

  /* THE HERO, LARGE is `.pos-hero*` in shell.css, drawn by demo/shell/hero.mjs,
     because the front page opens with the same block.
     See lessons/page-kit-frontpage.md#kit-frontpage-5 */

  /* THE RULE, IN USE: JetBrains Mono for what names, Geist for what is read through.
     `--mono` and `--sans` in shell.css are these two faces, so nothing here sets them.
     See lessons/page-kit-frontpage.md#kit-frontpage-6 */
  .fp-rule { min-width: 0; }
  /* The clear gap under the last real piece is its own padding, not a larger margin:
     the stack owns the margin between blocks and the check holds each pair to
     --pos-gap, so the air to the specimens below is 2 x --pos-gap with no divider.
     See lessons/page-kit-frontpage.md#kit-frontpage-7 */
  .fp-rule-end { padding-bottom: var(--pos-gap); }
  .fp-rule-h { font: 600 11px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--hi); margin: 0; }
  .fp-rule-n { font: 400 15px/1.5 var(--sans); color: var(--dim); margin: 6px 0 0; max-width: 58ch; }
  /* the front page's own cards (demo/index.html .cc-card), the
     title in mono and the line in Geist */
  .fp-cc { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); margin-top: 20px; }
  .fp-cc-card { display: flex; flex-direction: column; gap: 6px; min-height: 115px; padding: var(--inset, 12px);
                background: var(--card); border: var(--edge, 1px solid var(--line)); border-radius: var(--r, 4px);
                color: inherit; text-decoration: none; }
  .fp-cc-card:hover { border-color: var(--fg); }
  .fp-cc-t { margin: 0; font: 600 15px/1.3 var(--mono); color: var(--fg); }
  .fp-cc-s { margin: 0; font: 400 14px/1.45 var(--sans); color: var(--dim); }
  .fp-cc-card.fp-case { min-height: 140px; --cc-case: #d68fc6;
    background: color-mix(in srgb, var(--cc-case) 7%, var(--card));
    border-color: color-mix(in srgb, var(--cc-case) 35%, var(--line)); }
  .fp-case .fp-cc-g { font: 400 12px var(--mono); color: var(--cc-case); }
  .fp-case .fp-cc-t { font-size: 17px; }
  .fp-case .fp-cc-u { margin-top: auto; font: 400 12px var(--mono); color: var(--dim2); }
  /* a concept page's header at the rule's page step, 24 over 15 */
  .fp-ph-t { margin: 0; font: 600 24px/1.2 var(--mono); letter-spacing: .01em; color: var(--fg); }
  .fp-ph-w { margin: 4px 0 0; font: 400 15px/1.5 var(--sans); color: var(--dim); max-width: 62ch; }
  .fp-ph-r { margin-top: 20px; }

  /* SHARP TEST: the sharp as shipped, `#` in the brand mono, on real keys and
     on a chord line. The keys are the keyboard's own labels, untouched. */
  .fp-sh { display: flex; flex-direction: column; gap: var(--ctl-gap); min-width: 0; }
  .fp-sh-n { margin: 0; font: 600 15px/1.3 var(--mono); color: var(--fg); }
  .fp-sh-big { margin: 0; font: 400 32px/1.2 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
  .fp-sh-line { margin: 0; font: 500 11px/1.4 var(--mono); color: var(--dim2); }
</style>
<script type="module">
  import { el, createReport } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';
  import { createCard } from '/shell/card.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { CONCEPTS, DEMO_CARDS } from '/shell/concept-list.mjs';
  import { HERO, createHero } from '/shell/hero.mjs';
  import { DEMOS, GROUPS } from '/manifest.mjs';
  import { SCALE, stepOf, createSlide } from '/shell/slide.mjs';

  /**
   * The type the front page is set in: JetBrains Mono and Geist, with the specimens
   * the choice was made from. Numbers are measured on a canvas after each face loads
   * and must agree with its OS/2 TABLE values. Checks are behind ?selfcheck=1.
   * See lessons/page-kit-frontpage.md#kit-frontpage-8
   */
  const { d, section, out, land, checkPage } = createKitPage({
    part: 'frontpage',
    what: 'The two faces this site is set in, JetBrains Mono for what names and Geist for what is read through.',
  });

  const SENTENCE = 'A Raspberry Pi in another building plays the same bar as this page, and the readout says how late it was: 1374 ms on a bad day, 38 on a good one.';
  const HEADING = 'Two rooms, one clock';
  const CHARS = '0123456789 il1I O0o {}[] AaGgQqRy';

  /* ── the brand, the reference every candidate is measured against ── */
  const BRAND = "'Brand JetBrains Mono'";

  /* Geist was sampled against JetBrains Mono's traits (tall x-height, rectangular
     rounds, open apertures). `table` is the face file's own OS/2 numbers; `bytes` is
     the 400 plus 600 weights' file sizes.
     See lessons/page-kit-frontpage.md#kit-frontpage-9 */
  const CANDIDATES = [
    { id: 'geist', name: 'Geist', family: "'Brand Geist'", pkg: '@fontsource/geist 5.3.0',
      src: 'github.com/vercel/geist-font', table: { x: 0.530, cap: 0.710 }, bytes: [12956, 13372],
      why: 'Drawn as the sans to Geist Mono, so its proportions were set beside a mono from the start, and its rounds are slightly squared.' },
  ];
  const JBM_TABLE = { x: 0.550, cap: 0.730 };

  /* ── what the site is set in today ── */
  const SYS_MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
  const SYS_SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", Segoe UI, Roboto, sans-serif';
  const IN_USE = [
    { id: 'brand', name: 'JetBrains Mono', family: BRAND, weights: [400, 600],
      files: [['/shell/vendor/jetbrains-mono-latin-400-normal.woff2', 21168], ['/shell/vendor/jetbrains-mono-latin-600-normal.woff2', 21860]],
      where: 'Everything that names, as --mono (and --brand, its alias): page titles, section headings, eyebrows, buttons, readout cells, logs, keys and tables. The same two files are Slide JetBrains Mono on every slide, with a 4,308 byte Greek file at 600 for the β.',
      slides: true },
    { id: 'geist', name: 'Geist', family: "'Brand Geist'", weights: [400, 600],
      files: [['/shell/vendor/geist-latin-400-normal.woff2', 12956], ['/shell/vendor/geist-latin-600-normal.woff2', 13372]],
      where: 'Everything read through, as --sans: body text, the line under a page title, card text, the kit’s notes and a slide’s body. SIL OFL 1.1.' },
    { id: 'gabarito', name: 'Gabarito', family: "'FP Gabarito'", weights: [400, 600],
      files: [['/weight/vendor/gabarito-latin.woff2', 34320]],
      where: 'Only /weight/’s, the words drawn on its canvas, as weight-display and weight-text, one variable file from 200 to 800 plus a 12,220 byte latin-ext file for Š and Ž. SIL OFL 1.1.' },
  ];

  const SIZES = [
    { px: 11, w: 400, t: 'sentence' }, { px: 13.5, w: 400, t: 'sentence' }, { px: 17, w: 400, t: 'sentence' },
    { px: 17, w: 400, t: 'chars' }, { px: 24, w: 600, t: 'heading' }, { px: 40, w: 600, t: 'readout' },
    { px: 64, w: 600, t: 'big' },
  ];
  const textFor = (t, face) => face.sample || { sentence: SENTENCE, chars: CHARS, heading: HEADING, readout: '1374 ms', big: 'Aa 1374' }[t];
  // The slide steps as a share of a 405 px tall (720 px wide) slide, the half width
  // player on a desk, read off SCALE in slide.mjs so a change to the scale shows here.
  // See lessons/page-kit-frontpage.md#kit-frontpage-10
  const SLIDE_H = 405;

  /* ── measuring, on a canvas, in this browser ── */
  const cv = document.createElement('canvas').getContext('2d');
  function measure(family, weight = 400) {
    cv.font = `${weight} 100px ${family}`;
    const x = cv.measureText('x').actualBoundingBoxAscent / 100;
    const cap = cv.measureText('H').actualBoundingBoxAscent / 100;
    const w = cv.measureText(SENTENCE).width / 100 / SENTENCE.length;
    return { x, cap, w };
  }
  async function loaded(family) {
    try { return (await document.fonts.load(`400 100px ${family}`, 'xH')).length > 0; } catch { return false; }
  }
  const fmt = (v, n = 3) => v.toFixed(n);
  const kb = (b) => `${(b / 1000).toFixed(1)} kB`;
  const fact = (k, v, state) => {
    const f = el('div', 'fp-fact');
    const vv = el('span', 'fp-v', v);
    if (state) vv.dataset.state = state;
    f.append(el('span', 'fp-k', k), vv);
    return f;
  };

  /* the blocks, newest first */

  /* Mixing the brand mono and Geist at different sizes and weights: slides, titles,
     subtitles, and a hero crop for the front page.
     See lessons/page-kit-frontpage.md#kit-frontpage-11 */
  const G = `'Brand Geist', ${SYS_SANS}`;
  const M = `${BRAND}, ${SYS_MONO}`;
  const nameOf = (face) => (face === G ? 'Geist' : 'JetBrains Mono');
  // one line of type: face, weight, size in px, tracking in em, line height
  const t = (face, w, px, ls, lh) => ({ face, w, px, ls, lh });
  const apply = (node, s) => {
    node.style.font = `${s.w} ${s.px}px/${s.lh} ${s.face}`;
    node.style.letterSpacing = `${s.ls}em`;
  };
  const describe = (role, s) => `${role}: ${nameOf(s.face)} ${s.w}, ${s.px} px, tracking ${s.ls >= 0 ? '+' : ''}${s.ls} em, line ${s.lh}`;

  // HERO's four lines are hero.mjs's, so the specimens and front page share words.
  // The pairings are data, and each label is written from the object its hero is
  // drawn with, so a label cannot disagree with its specimen.
  // See lessons/page-kit-frontpage.md#kit-frontpage-12
  const PAIRINGS = [
    { n: 'A', name: 'All Geist',
      eye: t(G, 600, 12, 0.14, 1.2), head: t(G, 600, 44, -0.03, 1.05), line: t(G, 400, 19, -0.01, 1.45), small: t(G, 400, 14, 0, 1.5) },
    { n: 'B', name: 'Geist, the eyebrow in mono',
      eye: t(M, 400, 12, 0.14, 1.2), head: t(G, 600, 44, -0.03, 1.05), line: t(G, 400, 19, -0.01, 1.45), small: t(G, 400, 14, 0, 1.5) },
    { n: 'C', name: 'Headline in mono 600, Geist below it',
      eye: t(M, 400, 12, 0.14, 1.2), head: t(M, 600, 40, -0.04, 1.1), line: t(G, 400, 19, -0.01, 1.45), small: t(G, 400, 14, 0, 1.5) },
    { n: 'D', name: 'Mono throughout',
      eye: t(M, 400, 12, 0.14, 1.2), head: t(M, 600, 40, -0.04, 1.1), line: t(M, 400, 16, 0, 1.55), small: t(M, 400, 12.5, 0, 1.55) },
    { n: 'E', name: 'Geist headline, the small line in mono',
      eye: t(G, 600, 12, 0.14, 1.2), head: t(G, 600, 44, -0.03, 1.05), line: t(G, 400, 19, -0.01, 1.45), small: t(M, 400, 12.5, 0, 1.5) },
    { n: 'F', name: 'All Geist, light, like the crop', light: true,
      eye: t(G, 600, 12, 0.14, 1.2), head: t(G, 600, 44, -0.03, 1.05), line: t(G, 400, 19, -0.01, 1.45), small: t(G, 400, 14, 0, 1.5) },
  ];
  // THE HERO, LARGE, on top: the owner's copy at front page size, the
  // wordmark's dot in the accent.
  section('THE HERO, LARGE',
    'The hero at front page size, the wordmark with its dot in the accent.',
    null, (add) => {
      // The block is demo/shell/hero.mjs, the one the front page opens with: the wordmark,
      // headline, two lines and the working imaginary patchbay. This page shows it alone.
      // See lessons/page-kit-frontpage.md#kit-frontpage-13
      add(createHero().el);
    }, { bare: true });

  // THE RULE, IN USE on real pieces of the site: the hero, the front page's cards,
  // a concept page's header with a readout and a log, and the deck's connect slide.
  // Nothing is written for the sampler except the readout's numbers.
  // See lessons/page-kit-frontpage.md#kit-frontpage-14
  const rule = {};
  section('THE RULE, IN USE',
    'JetBrains Mono for everything that names, Geist for everything read through, on real pieces of the site.',
    null, (add) => {
      // 1. the hero, pairing C, the owner's copy word for word
      const C = PAIRINGS.find((p) => p.n === 'C');
      const hero = el('div', 'fp-hero fp-rule');
      rule.hero = {};
      for (const [role, cls] of [['eye', 'fp-hero-eye'], ['head', 'fp-hero-h'], ['line', 'fp-hero-l'], ['small', 'fp-hero-s']]) {
        const node = el(role === 'head' ? 'h2' : 'p', cls, HERO[role]);
        apply(node, C[role]);
        rule.hero[role] = node;
        hero.append(node);
      }
      add(hero);

      // 2. the front page continuing: a section heading and its note, three
      // concept cards and one use case card, all real rows
      const front = el('div', 'fp-rule');
      front.append(el('h3', 'fp-rule-h', 'Concepts'),
        el('p', 'fp-rule-n', 'The ideas behind positron and the projects that use them.'));
      const grid = el('div', 'fp-cc');
      rule.cards = [];
      // Real rows by id, no number on a card.
      // See lessons/page-kit-frontpage.md#kit-frontpage-15
      for (const id of ['synth/keyboard', 'radio/tuner', 'video/camera']) {
        const c = CONCEPTS.find((x) => x.id === id);
        if (!c) continue;
        const a = el('a', 'fp-cc-card', '', { href: `/${c.id}/` });
        const h = el('h4', 'fp-cc-t', c.title);
        const s = el('p', 'fp-cc-s', c.say);
        a.append(h, s);
        grid.append(a);
        rule.cards.push({ h, s });
      }
      // The use case card is `held`, the one listed demo, so the rule shows four cards.
      // See lessons/page-kit-frontpage.md#kit-frontpage-16
      const row = DEMOS.find((r) => r.name === 'held');
      if (row && DEMO_CARDS.held) {
        const a = el('a', 'fp-cc-card fp-case', '', { href: '/held/' });
        const h = el('h4', 'fp-cc-t', row.title || row.name);
        const s = el('p', 'fp-cc-s', DEMO_CARDS.held.say);
        a.append(el('span', 'fp-cc-g', GROUPS.get(row.group) || row.group), h, s, el('span', 'fp-cc-u', '/held/'));
        grid.append(a);
        rule.cards.push({ h, s });
      }
      front.append(grid);
      add(front);

      // 3. A concept page's header, readout and log, as the archived Message lag page
      // (/archive/clock-message-lag/) draws them. The numbers are typical of the relay's
      // p50 of about 36 ms (bay.mjs).
      // See lessons/page-kit-frontpage.md#kit-frontpage-17
      const lag = { title: 'Message lag', say: 'Play a synth through our relay and see how long each note took to arrive, timed on one clock.' };
      const page = el('div', 'fp-rule');
      rule.title = el('h2', 'fp-ph-t', lag?.title || 'Message lag');
      rule.what = el('p', 'fp-ph-w', lag?.say || '');
      const rep = createReport({ readout: { median: 'ms', worst: 'ms', last: 'ms', spread: 'ms' } });
      rep.set('median', 36); rep.set('worst', 61); rep.set('last', 38); rep.set('spread', 25);
      rep.line('joining lag-k3x9qa', null, 118);
      rep.line('joining lag-k3x9qa', null, 121);
      rep.line('joined lag-k3x9qa, web-1 as here-4fz and web-2 as there-p2m', 'hi', 336);
      const r = el('div', 'fp-ph-r');
      r.append(rep.report);
      page.append(rule.title, rule.what, r);
      rule.rep = rep;
      add(page);

      // 4. the deck's own `connect` slide (demo/shell/decks.mjs), title in
      // mono, the words in Geist through the slide's own --sans
      const wrap = el('div', 'fp-rule fp-rule-end');
      rule.slide = createSlide({ name: 'connect', say: 'Connect instruments and streams',
        text: 'Link notes, sound, video and code between your browser and a Raspberry Pi, each link checked before it opens', textStep: 2,
        cap: 'positron.studio/patchbay' });
      rule.slide.el.classList.add('fp-sl');
      rule.slide.el.style.setProperty('--fp-head', `'Slide JetBrains Mono', ${SYS_MONO}`);
      wrap.append(rule.slide.frame);

    }, { bare: true });

  // SHARP TEST: the keys print `#` in JetBrains Mono (keyboard.mjs NOTE_NAMES), drawn
  // here by the keyboard itself with nothing swapped.
  // See lessons/page-kit-frontpage.md#kit-frontpage-18
  const SH_NOTES = 'C#4  F#3  G#2  A#5  Bb3';
  const sharps = [];
  section('SHARP TEST',
    'The sharp as the keys print it, # in the brand mono, on real keys, on a chord line at its real size and at 32 px.',
    null, (box) => {
      box.classList.add('kit-wide');
      const wrap = el('div', 'fp-sh');
      const host = el('div');
      const kb = createKeyboard(host, { ...keyRange(14), base: 48, letters: false, pad: false, chord: false });
      const line = el('p', 'fp-sh-line', SH_NOTES);
      const big = el('p', 'fp-sh-big', SH_NOTES);
      const cap = el('p', 'fp-label-r', 'measuring');
      wrap.append(el('p', 'fp-sh-n', 'A. # in JetBrains Mono, as shipped'), host, line, big, cap);
      box.append(wrap);
      sharps.push({ host, kb, line, big, cap });
    });

  /* Which face drew the sharp, read rather than assumed: the label's computed font
     stack drawn on a canvas resolves fallback per glyph, and the sharp's ink box is
     matched against each candidate face's own.
     See lessons/page-kit-frontpage.md#kit-frontpage-19 */
  const SH_FACES = [
    ['JetBrains Mono', "'Brand JetBrains Mono'"],
    ['SF Mono', 'SFMono-Regular'],
    ['Menlo', 'Menlo'],
    ['Apple Symbols', "'Apple Symbols'"],
    ['DejaVu Sans Mono', "'DejaVu Sans Mono'"],
    ['Consolas', 'Consolas'],
  ];
  const shCv = document.createElement('canvas').getContext('2d');
  const ink = (font, ch) => {
    shCv.font = font;
    const m = shCv.measureText(ch);
    return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent, w: m.width };
  };
  const same = (p, q) => ['l', 'r', 'a', 'd', 'w'].every((k) => Math.abs(p[k] - q[k]) < 0.6);
  // a stack the canvas will take: ui-monospace is not a canvas family, so it
  // is dropped, and SFMono-Regular behind it names the same face on a Mac
  const canvasStack = (fam) => fam.split(',').map((s) => s.trim()).filter((s) => !/^ui-/.test(s)).join(', ');
  function whoDrew(fam, ch) {
    const got = ink(`400 100px ${canvasStack(fam)}`, ch);
    for (const [name, f] of SH_FACES) {
      // A face lacking the glyph falls through, so it is put in front of two partners
      // that draw `#` unlike each other (system serif and Geist): only a face that has
      // the glyph measures the same in front of both.
      // See lessons/page-kit-frontpage.md#kit-frontpage-20
      const x = ink(`400 100px ${f}, serif`, ch);
      const y = ink(`400 100px ${f}, 'Brand Geist', monospace`, ch);
      if (same(x, y) && same(x, got)) return name;
    }
    return 'another system face';
  }
  const shReady = (async () => {
    await document.fonts.load("400 11px 'Brand JetBrains Mono'", 'F#b');
    await document.fonts.ready;
    for (const s of sharps) {
      const ch = '#';
      const fam = getComputedStyle(s.big).fontFamily;
      s.face = whoDrew(fam, ch);
      const kn = [...s.host.querySelectorAll('.kn')].find((n) => /^F#/.test(n.textContent));
      s.keyFace = whoDrew(getComputedStyle(kn).fontFamily, ch);
      const stack = `400 100px ${canvasStack(fam)}`;
      const sh = ink(stack, ch), F = ink(stack, 'F');
      const r2 = (x) => Math.round(x * 100) / 100;
      const top = r2((sh.a - F.a) / 100), bot = r2(sh.d / 100);
      const topSay = top === 0 ? 'level with the top of the F' : `${Math.abs(top).toFixed(2)} em ${top > 0 ? 'above' : 'below'} the top of the F`;
      const botSay = bot === 0 ? 'on the line' : `${Math.abs(bot).toFixed(2)} em ${bot > 0 ? 'below' : 'above'} the line`;
      const w = kn.getBoundingClientRect().width;
      s.cap.textContent = `drawn by ${s.face} on the line and by ${s.keyFace} on the keys. Ink ${topSay}, bottom ${botSay}. ${kn.textContent} is ${w.toFixed(1)} px wide on its key.`;
    }
  })();

  const heroes = [];
  section('HERO',
    'The front page’s opening in six pairings of the brand mono and Geist, at the front page’s own column width, each labelled with what it is set in.',
    null, (add) => {
      for (const p of PAIRINGS) {
        const wrap = el('div', 'fp-hero-wrap');
        wrap.id = `hero-${p.n.toLowerCase()}`;
        const hero = el('div', p.light ? 'fp-hero fp-light' : 'fp-hero');
        const parts = {};
        for (const [role, cls] of [['eye', 'fp-hero-eye'], ['head', 'fp-hero-h'], ['line', 'fp-hero-l'], ['small', 'fp-hero-s']]) {
          const node = el(role === 'head' ? 'h2' : 'p', cls, HERO[role]);
          apply(node, p[role]);
          parts[role] = node;
          hero.append(node);
        }
        const label = el('div', 'fp-label');
        label.append(el('p', 'fp-label-n', `${p.n}. ${p.name}${p.light ? ', with light colours picked for this specimen (the kit has no light theme)' : ''}`));
        for (const [role, word] of [['eye', 'eyebrow'], ['head', 'headline'], ['line', 'line'], ['small', 'small line']]) {
          label.append(el('p', 'fp-label-r', describe(word, p[role])));
        }
        wrap.append(hero, label);
        add(wrap);
        heroes.push({ p, parts });
      }
    }, { bare: true });

  // TITLES AND SUBTITLES: the shell's page title and its line, and a section
  // heading with its note, in four mixes, four steps at 600 and one at 400.
  const TITLE_STEPS = [[17, 13.5], [20, 15], [24, 15], [32, 17]];
  const MIXES = [
    { name: 'Mono title, mono line (the shell from 2026-10-06 to 2026-10-12)', title: M, what: M },
    { name: 'Mono title, Geist line (the shell since 2026-10-12, at 17 and 13.5)', title: M, what: G },
    { name: 'Geist title, Geist line', title: G, what: G },
    { name: 'Geist title, mono line', title: G, what: M },
  ];
  const titles = [];
  section('TITLES AND SUBTITLES',
    'A page title with the line under it at four sizes and both weights, and a section heading with its note, in four mixes of the brand mono and Geist.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-mixes');
      for (const mx of MIXES) {
        const g = el('div', 'fp-mix');
        g.append(el('p', 'fp-label-n', mx.name));
        const specs = [...TITLE_STEPS.map(([a, b]) => [a, b, 600]), [24, 15, 400]];
        for (const [tp, wp, w] of specs) {
          const s = el('div', 'fp-ttl');
          const tt = el('h3', 'fp-ttl-t', 'Two rooms, one clock');
          const ts = t(mx.title, w, tp, mx.title === M ? 0.01 : -0.015, 1.2);
          apply(tt, ts);
          const ww = el('p', 'fp-ttl-w', 'A Raspberry Pi in another building plays the same bar as this page, and the readout says how late it was.');
          const ws = t(mx.what, 400, wp, 0, 1.5);
          apply(ww, ws);
          s.append(tt, ww, el('p', 'fp-label-r', `${describe('title', ts)}; ${describe('line', ws)}`));
          g.append(s);
          titles.push({ mx, tt, ww });
        }
        // the section heading and its note, at the kit's own heading size
        const sh = el('div', 'fp-ttl');
        const hh = el('h4', 'fp-ttl-h', 'Matching sans');
        const hs = t(mx.title, 600, 11, 0.16, 1.2);
        apply(hh, hs);
        const hn = el('p', 'fp-ttl-w', 'Geist for the lines, set beside the brand mono for the names.');
        const ns = t(mx.what, 400, 13.5, 0, 1.6);
        apply(hn, ns);
        sh.append(hh, hn, el('p', 'fp-label-r', `${describe('section heading', hs)}, uppercase; ${describe('note', ns)}`));
        g.append(sh);
        list.append(g);
      }
      box.append(list);
    });

  // PAIRINGS ON A SLIDE. Not `SLIDES`: a block's address is its title, and
  // `/kit/#slides` must keep forwarding to the SLIDES part (kit-parts.mjs).
  const SLIDE_PAIRS = [
    { name: 'Mono title, Geist body', head: `'Slide JetBrains Mono', ${SYS_MONO}`, body: G },
    { name: 'Geist title, mono body', head: G, body: `'Slide JetBrains Mono', ${SYS_MONO}` },
    { name: 'All Geist', head: G, body: G },
  ];
  const slides = [];
  section('PAIRINGS ON A SLIDE',
    'One slide from createSlide, a headline at step 4 over a sentence at step 3, in three pairings of the brand mono and Geist.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-faces');
      for (const sp of SLIDE_PAIRS) {
        const wrap = el('div', 'fp-spec');
        const s = createSlide({ name: sp.name, layout: 'left', say: 'Connect anything to everything',
          text: 'Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers' });
        s.el.classList.add('fp-sl');
        s.el.style.setProperty('--fp-head', sp.head);
        s.el.style.setProperty('--sans', sp.body);
        wrap.append(el('p', 'fp-label-n', sp.name), s.frame,
          el('p', 'fp-label-r', `headline at step 4, ${+stepOf(4).size.toFixed(2)} per cent of the slide’s height, 600; text at step 3, ${+stepOf(3).size.toFixed(2)} per cent, 600 and untracked; the headline’s tracking and both line heights from SCALE`));
        list.append(wrap);
        slides.push({ sp, s });
      }
      box.append(list);
    });
  const measured = new Map();         // id -> { ok, x, cap, w }
  let jbm = null;

  // THE CHOICE, recorded with the measurement it rests on.
  let recBox = null;
  section('THE CHOICE',
    'The sans the site is set in beside the brand mono, and the measurement it rests on.',
    null, (box) => {
      box.classList.add('kit-wide');
      recBox = el('p', 'fp-rec', 'measuring');
      box.append(recBox);
    });

  // Geist against the brand mono, measured, as a table.
  // See lessons/page-kit-frontpage.md#kit-frontpage-21
  let table = null;
  section('MEASURED AGAINST THE BRAND MONO',
    'Lower case height, the lower case over the capitals, and the width of one character, each measured in this browser at 100 px.',
    null, (box) => {
      box.classList.add('kit-wide');
      table = createTable({ columns: [
        { key: 'face', label: 'face', grow: true },
        { key: 'x', label: 'x-ht', width: 64, align: 'right' },
        { key: 'xr', label: 'vs mono', width: 72, align: 'right' },
        { key: 'xc', label: 'x/cap', width: 64, align: 'right' },
        { key: 'w', label: 'width', width: 64, align: 'right' },
        { key: 'kb', label: 'size', width: 72, align: 'right' },
      ], empty: 'measuring' });
      box.append(table.el);
      box.append(out('x-ht and width in em; size is the 400 and 600 Latin files together'));
    });

  // MATCHING SANS, Geist set beside the brand mono.
  const specs = [];
  section('MATCHING SANS',
    'Geist set beside the brand mono in a paragraph, under a mono title, over a readout and on a card.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-faces');
      for (const c of CANDIDATES) {
        const face = el('div', 'fp-face');
        face.id = `sans-${c.id}`;
        // the candidate reaches this specimen and nothing else: `--sans` is
        // the face, and `--mono` is the brand, which is the proposal
        face.style.setProperty('--sans', `${c.family}, ${SYS_SANS}`);
        face.style.setProperty('--mono', `${BRAND}, ${SYS_MONO}`);
        const facts = el('div', 'fp-facts');
        face.append(el('h3', 'fp-name', c.name), el('p', 'fp-where', c.why), facts);

        const pair = el('div', 'fp-pair');
        const m = el('div', 'fp-spec');
        m.append(el('p', 'fp-cap', 'brand mono'), el('p', 'fp-para fp-m', SENTENCE));
        const s = el('div', 'fp-spec');
        s.append(el('p', 'fp-cap', c.name), el('p', 'fp-para fp-s', SENTENCE));
        const page = el('div', 'fp-spec');
        const rep = createReport({ readout: { late: 'ms', bars: '' }, showLog: false, joined: false });
        rep.set('late', 1374); rep.set('bars', 48);
        page.append(el('p', 'fp-cap', 'mono title, sans body, readout'),
          el('h4', 'fp-title', HEADING),
          el('p', 'fp-body', 'The board in the other building plays the same bar, and the cells under this line say how late it landed.'),
          rep.top);
        const cardSpec = el('div', 'fp-spec');
        cardSpec.append(el('p', 'fp-cap', 'card'), createCard({ title: HEADING,
          desc: 'A Raspberry Pi in another building plays in time with this page.', tags: ['WebAudio', 'no network'], minH: 0 }).el);
        pair.append(m, s, page, cardSpec);
        face.append(pair);
        list.append(face);
        specs.push({ c, face, facts, sans: s.querySelector('.fp-para'), body: page.querySelector('.fp-body'),
          title: page.querySelector('.fp-title'), cell: rep.top });
      }
      box.append(list);
    });

  // TYPOGRAPHY SAMPLER, the first block asked for, so the last on the page.
  const samples = [];
  section('TYPOGRAPHY SAMPLER',
    'Every face this site is set in today, at 11, 13.5, 17, 24, 40 and 64 px, with where it is used and what it weighs.',
    null, (box) => {
      box.classList.add('kit-wide');
      const list = el('div', 'fp-faces');
      for (const f of IN_USE) {
        const face = el('div', 'fp-face');
        face.id = `face-${f.id}`;
        const facts = el('div', 'fp-facts');
        const bytes = f.files.reduce((a, [, b]) => a + b, 0);
        facts.append(fact('weights', f.weights.join(' ')),
          fact('file', f.files.length ? kb(bytes) : 'none, the device’s own'));
        face.append(el('h3', 'fp-name', f.name), el('p', 'fp-where', f.where), facts);
        const rows = el('div', 'fp-rows');
        for (const sz of SIZES) {
          if (f.sample && sz.t === 'chars') continue;   // one sample line, so no second 17 px row
          const w = f.weights.includes(sz.w) ? sz.w : f.weights[0];
          const r = el('div', 'fp-row');
          const t = el('p', 'fp-txt', textFor(sz.t, f));
          t.style.font = `${w} ${sz.px}px/1.3 ${f.family}`;
          r.append(el('span', 'fp-sz', `${sz.px} px ${w}`), t);
          rows.append(r);
        }
        if (f.slides) {
          for (const st of SCALE.steps) {
            const s = stepOf(st.n);
            const px = s.size / 100 * SLIDE_H;
            const r = el('div', 'fp-row');
            const t = el('p', 'fp-txt', st.n >= 5 ? '1374 ms' : HEADING);
            t.style.font = `${st.n >= 3 ? 600 : 400} ${px.toFixed(2)}px/${s.lh} ${f.family}`;
            t.style.letterSpacing = `${s.ls}em`;
            r.append(el('span', 'fp-sz', `step ${st.n} ${+px.toFixed(1)}`), t);
            rows.append(r);
          }
          rows.append(el('p', 'kit-cut', `slide steps at ${SLIDE_H} px of slide height, ${SCALE.base} per cent times ${SCALE.ratio} per step`));
        }
        face.append(rows);
        list.append(face);
        samples.push({ f, face });
      }
      box.append(list);
    });

  land();

  /* ── fill in what was measured ── */
  const ready = (async () => {
    await loaded(BRAND);
    jbm = measure(BRAND);
    const rows = [];
    for (const sp of specs) {
      const { c } = sp;
      const ok = await loaded(c.family);
      const m = ok ? measure(c.family) : null;
      measured.set(c.id, { ok, ...(m || {}) });
      const bytes = c.bytes[0] + c.bytes[1];
      if (!ok) {
        sp.facts.append(fact('licence', 'SIL OFL 1.1'), fact('file', 'did not load', 'bad'));
        continue;
      }
      // the size at which this face's lower case is as tall as the mono's at 15
      const match = 15 * jbm.x / m.x;
      sp.facts.append(
        fact('licence', 'SIL OFL 1.1'),
        fact('source', c.src),
        fact('x-height', `${fmt(m.x)} em, ${Math.round(m.x / jbm.x * 100)}%`),
        fact('x/cap', `${fmt(m.x / m.cap)} to ${fmt(jbm.x / jbm.cap)}`),
        fact('width', `${fmt(m.w)} em, ${Math.round(m.w / jbm.w * 100)}%`),
        fact('15 px mono x', `at ${match.toFixed(1)} px`),
        fact('400 + 600', kb(bytes)));
      rows.push({ face: c.name, x: fmt(m.x), xr: `${Math.round(m.x / jbm.x * 100)}%`, xc: fmt(m.x / m.cap), w: fmt(m.w), kb: kb(bytes), _x: m.x, _xc: m.x / m.cap });
    }
    rows.sort((a, b) => b._x - a._x);
    table.set([{ face: 'JetBrains Mono, the brand', x: fmt(jbm.x), xr: '100%', xc: fmt(jbm.x / jbm.cap), w: fmt(jbm.w), kb: kb(21168 + 21860) }, ...rows]);

    // The choice is recorded with numbers measured here, so the sentence cannot drift
    // from the face the site loads.
    // See lessons/page-kit-frontpage.md#kit-frontpage-22
    const r = measured.get('geist');
    const rc = CANDIDATES.find((c) => c.id === 'geist');
    recBox.textContent = '';
    if (r?.ok) {
      recBox.append(el('b', '', rc.name), ` is the site’s sans since 2026-10-12, chosen from six faces sampled here: its lower case is ${Math.round(r.x / jbm.x * 100)} per cent of the mono’s at the same size, `
        + `its x over cap is ${fmt(r.x / r.cap)} against the mono’s ${fmt(jbm.x / jbm.cap)}, and both weights weigh ${kb(rc.bytes[0] + rc.bytes[1])}.`);
    } else recBox.textContent = `${rc.name} did not load, so there is nothing measured to show.`;
  })();

  if (SELFCHECK) {
    await ready;
    const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    await frames(3);
    checkPage();

    // THE RULE, IN USE: what names is in the brand mono, what is read through
    // is in Geist, read off every real piece as rendered
    {
      const first = (n) => getComputedStyle(n).fontFamily.split(',')[0].replace(/["']/g, '').trim();
      const MONO = ['Brand JetBrains Mono', 'Slide JetBrains Mono'];
      const naming = [rule.hero.eye, rule.hero.head, rule.title, ...rule.cards.map((c) => c.h),
        rule.rep.readoutEl.querySelector('.pos-v'), rule.rep.readoutEl.querySelector('.pos-k'), rule.rep.logEl, rule.slide.parts.say];
      const reading = [rule.hero.line, rule.hero.small, rule.what, ...rule.cards.map((c) => c.s), rule.slide.parts.text];
      const bad = [...naming.filter((n) => !n || !MONO.includes(first(n))).map((n) => `naming ${n ? first(n) : 'missing'}`),
        ...reading.filter((n) => !n || first(n) !== 'Brand Geist').map((n) => `reading ${n ? first(n) : 'missing'}`)];
      const words = [rule.hero.eye, rule.hero.head, rule.hero.line, rule.hero.small].map((n) => n.textContent);
      d.assert('THE RULE, IN USE: everything that names is in the brand mono and everything read through is in Geist, and the hero is the owner’s copy',
        bad.length === 0 && rule.cards.length === 4 && words.join('|') === [HERO.eye, HERO.head, HERO.line, HERO.small].join('|'),
        bad.length ? bad.join(', ') : `${naming.length} naming and ${reading.length} reading elements, ${rule.cards.length} cards from list.mjs`);

      // the clear gap to the specimens: twice the page's block rhythm,
      // measured from the last real piece's ink to the next block's heading
      const want = 2 * Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
      const next = document.getElementById('sharp-test');
      const gap = next.getBoundingClientRect().top - rule.slide.frame.getBoundingClientRect().bottom;
      d.assert('a clear gap of twice the block rhythm separates the real pieces from the specimens below',
        Math.abs(gap - want) <= 0.5, `${gap.toFixed(1)} px against ${want} px`);
    }

    // SHARP TEST: the keyboard's own labels say `#`, and JetBrains Mono draws
    // it on the keys and on the line
    {
      await shReady;
      const s = sharps[0];
      const names = [...s.host.querySelectorAll('.kn')].map((n) => n.textContent);
      const sharpNames = names.filter((n) => /#/.test(n));
      d.assert('SHARP TEST: the keyboard names its sharps with #, never ♯, and JetBrains Mono draws the # on the keys and on the line',
        sharps.length === 1 && sharpNames.length > 0 && !names.some((n) => /[♯♭]/.test(n)) && s.face === 'JetBrains Mono' && s.keyFace === 'JetBrains Mono',
        `${sharpNames.length} sharp keys, ${sharpNames.slice(0, 3).join(' ')}; line ${s.face}, keys ${s.keyFace}`);
    }

    // HERO, TITLES, SLIDES: every specimen is drawn in the face its label
    // names, read off the rendered style rather than the data
    {
      const first = (n) => getComputedStyle(n).fontFamily.split(',')[0].replace(/["']/g, '').trim();
      const want = (face) => face.split(',')[0].replace(/["']/g, '').trim();
      const bad = [];
      for (const { p, parts } of heroes) {
        for (const role of ['eye', 'head', 'line', 'small']) {
          const cs = getComputedStyle(parts[role]);
          if (first(parts[role]) !== want(p[role].face) || +cs.fontWeight !== p[role].w || Math.abs(parseFloat(cs.fontSize) - p[role].px) > 0.01) {
            bad.push(`${p.n} ${role} ${first(parts[role])} ${cs.fontWeight} ${cs.fontSize}`);
          }
        }
      }
      for (const { mx, tt, ww } of titles) {
        if (first(tt) !== want(mx.title) || first(ww) !== want(mx.what)) bad.push(`${mx.name} ${first(tt)} over ${first(ww)}`);
      }
      for (const { sp, s } of slides) {
        if (first(s.parts.say) !== want(sp.head) || first(s.parts.text) !== want(sp.body)) bad.push(`slide ${sp.name} ${first(s.parts.say)} over ${first(s.parts.text)}`);
      }
      const both = heroes.some(({ parts }) => first(parts.head) === 'Brand Geist') && heroes.some(({ parts }) => first(parts.head) === 'Brand JetBrains Mono');
      d.assert('every hero, title and slide specimen is drawn in the face, weight and size its label names, and both faces appear',
        bad.length === 0 && both && heroes.length === PAIRINGS.length && slides.length === 3,
        bad.length ? bad.slice(0, 4).join(', ') : `${heroes.length} heroes, ${titles.length} titles and ${slides.length} slides, each in its own pairing`);
    }

    // the light hero paints its own ground and the dark ones do not
    {
      const bgOf = (h) => getComputedStyle(h.parts.head.parentElement).backgroundColor;
      const light = heroes.filter((h) => h.p.light), dark = heroes.filter((h) => !h.p.light);
      d.assert('the light hero paints a light ground of its own and the dark ones stand on the page',
        light.length === 1 && bgOf(light[0]) === 'rgb(255, 255, 255)' && dark.every((h) => bgOf(h) === 'rgba(0, 0, 0, 0)'),
        `light ${light.map(bgOf).join(', ')}, dark ${[...new Set(dark.map(bgOf))].join(', ')}`);
    }

    // 1. every candidate loaded, and what the canvas measured is what the
    // face file declares, so no number on this page is a fallback's
    {
      const bad = [];
      for (const c of CANDIDATES) {
        const m = measured.get(c.id);
        if (!m?.ok || Math.abs(m.x - c.table.x) > 0.01 || Math.abs(m.cap - c.table.cap) > 0.01) {
          bad.push(`${c.name} ${m?.ok ? `x ${fmt(m.x)} cap ${fmt(m.cap)} against ${c.table.x} ${c.table.cap}` : 'did not load'}`);
        }
      }
      const jOk = Math.abs(jbm.x - JBM_TABLE.x) <= 0.01 && Math.abs(jbm.cap - JBM_TABLE.cap) <= 0.01;
      d.assert('Geist loaded, and the x-height and cap height measured here are the ones its own file declares',
        bad.length === 0 && jOk,
        bad.length || !jOk ? `${bad.join(', ')}${jOk ? '' : `; brand x ${fmt(jbm.x)} cap ${fmt(jbm.cap)}`}`
          : `${CANDIDATES.length} faces and the brand, each within 0.01 em of its OS/2 table`);
    }

    // 2. NEGATIVE CONTROL: a face that is not there does not load, and the
    // canvas then measures the fallback, which is what check 1 would catch
    {
      const none = await loaded("'FP No Such Face'");
      const fb = measure("'FP No Such Face', serif");
      d.assert('NEGATIVE CONTROL: a face that does not exist reports not loaded, and its fallback measures unlike the brand',
        none === false && Math.abs(fb.x - JBM_TABLE.x) > 0.01,
        `loaded ${none}, fallback x ${fmt(fb.x)} against the brand's ${JBM_TABLE.x}`);
    }

    // 3. each specimen is set in its own candidate, read off the rendered
    // style rather than off the source
    {
      const off = specs.filter(({ c, sans, body, title }) => {
        const fs = getComputedStyle(sans).fontFamily, fb = getComputedStyle(body).fontFamily, ft = getComputedStyle(title).fontFamily;
        const want = c.family.replace(/'/g, '');
        return !fs.replace(/["']/g, '').startsWith(want) || !fb.replace(/["']/g, '').startsWith(want) || !ft.includes('Brand JetBrains Mono');
      });
      const site = getComputedStyle(document.body).fontFamily;
      d.assert('each specimen sets its paragraph and body in its own candidate and its title in the brand mono, and the page itself keeps the site’s --sans',
        off.length === 0 && !/FP /.test(site),
        off.length ? off.map((s) => s.c.name).join(', ') : `${specs.length} specimens, body still ${site.split(',')[0]}`);
    }

    // 4. every file size written on this page is the size the browser fetched
    {
      const want = [...CANDIDATES.flatMap((c) => [[`/shell/vendor/${c.id}-latin-400-normal.woff2`, c.bytes[0]], [`/shell/vendor/${c.id}-latin-600-normal.woff2`, c.bytes[1]]]),
        ...IN_USE.flatMap((f) => f.files)];
      await Promise.all(IN_USE.flatMap((f) => f.weights.map((w) => document.fonts.load(`${w} 20px ${f.family}`, f.sample || 'xH').catch(() => []))));
      await Promise.all(CANDIDATES.map((c) => document.fonts.load(`600 20px ${c.family}`, 'xH')));
      const bad = [];
      for (const [path, bytes] of want) {
        const e = performance.getEntriesByName(new URL(path, location.origin).href)[0];
        if (!e || e.decodedBodySize !== bytes) bad.push(`${path} ${e ? e.decodedBodySize : 'not fetched'} against ${bytes}`);
      }
      d.assert('every file size on this page is the size of the file the browser fetched',
        bad.length === 0, bad.length ? bad.join(', ') : `${want.length} files, each to the byte`);
    }

    // 5. nothing left this origin: no font from Google or anybody else
    {
      const off = performance.getEntriesByType('resource').map((e) => e.name).filter((u) => new URL(u).origin !== location.origin);
      d.assert('the page fetched nothing from another origin',
        off.length === 0, off.length ? off.slice(0, 3).join(', ') : `${performance.getEntriesByType('resource').length} requests, all to this origin`);
    }
  }

  d.ready();
</script>
</html>

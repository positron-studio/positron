      touch(panicky.kb, 'pointermove', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      touch(panicky.kb, 'pointerup', lowOn(whitesOf(panicky.kb)[1]), 21, 'mouse');
      d.assert('notes off stops everything even with a finger still on the keys, and the finger cannot start it again',
        started === 1 && stopped === 0 && panicky.log.length === 0,
        `${started} key lit by the finger, ${stopped} left after notes off · `
        + `${panicky.log.length} notes from the finger that was still down`);
    }

    for (const p of probes) p.kb.destroy();
  }


    /* The piano roll's rules run the whole picture with no gap under the first row: the
       tall first row's height must resolve against the row, not the lane. The chord name
       in row 0 sits level with its dots too.
       See lessons/page-kit-input.md#kit-input-92 */
    {
      const roll = document.querySelector('.roll');
      const rows = roll ? [...roll.children] : [];
      const cellOf = (r) => r.querySelector('.roll-cell:not(.sharp)');
      const gaps = [];
      for (let i = 1; i < rows.length; i++) {
        const a = cellOf(rows[i - 1]), b = cellOf(rows[i]);
        if (a && b) gaps.push(+(b.getBoundingClientRect().top - a.getBoundingClientRect().bottom).toFixed(2));
      }
      const mid = (e) => { const b = e.getBoundingClientRect(); return (b.top + b.bottom) / 2; };
      const offs = rows.map((r) => {
        const dot = r.querySelector('.roll-cell'), lbl = r.querySelector('.roll-label');
        return (dot && lbl) ? +(mid(lbl) - mid(dot)).toFixed(2) : null;
      }).filter((v) => v !== null);
      d.assert('the piano roll’s vertical rules have no gap in them, the first row included',
        gaps.length >= 2 && gaps.every((g) => Math.abs(g) < 0.51)
          && offs.length >= 1 && offs.every((o) => Math.abs(o) < 0.51),
        `${gaps.length} join(s) reading ${gaps.join(', ')} px, worst `
        + `${gaps.length ? Math.max(...gaps.map(Math.abs)).toFixed(2) : 'n/a'}; `
        + `${offs.length} label(s) off their dots by ${offs.join(', ')} px`);
    }
  } // if (SELFCHECK)

  d.ready();

  /* The two timed chains, after d.ready() and behind ?selfcheck=1, each step asserting
     as it lands.
     See lessons/page-kit-input.md#kit-input-93 */
  if (SELFCHECK) {
  (async () => {
    const { f, idle, hold, compiled } = cnoteSpec;
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    const typeInto = (t) => { f.input.value = t; f.input.dispatchEvent(new Event('input', { bubbles: true })); };
    const r = (e) => e.getBoundingClientRect();
    const tok = (k) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k));
    const base = f.input.value;

    typeInto(`${base}\na`);
    await nap(150);
    typeInto(`${base}\nab`);
    await nap(IDLE_MS + 100);
    const nt = r(idle.el), ta = r(f.input);
    const inR = +(ta.right - nt.right).toFixed(1), inB = +(ta.bottom - nt.bottom).toFixed(1);
    const anim = getComputedStyle(idle.el).animationName;
    // A box with no layout (width 0) cannot have its corner measured, so the geometry
    // reports not looked at rather than failing; the behaviour is still graded.
    // See lessons/page-kit-input.md#kit-input-94
    const laidOut = ta.width > 0;
    const placed = !laidOut || (Math.abs(inR - tok('--rows-gap')) <= 0.6
      && Math.abs(inB - tok('--rows-gap')) <= 0.6 && Math.abs(nt.height - tok('--ctl-sm')) <= 0.6);
    d.assert('typing then a pause starts one compile, under a breathing Compiling note in the box\u2019s corner',
      idle.runs() === 1 && idle.state() === 'compiling' && idle.shown() === NOTE_SAYS.compiling
        && anim === 'pos-cnote-breathe' && placed,
      `${idle.runs()} compile ${idle.state()}, "${idle.shown()}" ${anim}, `
      + (laidOut ? `${inR} px in from the right and ${inB} up, ${nt.height.toFixed(1)} px tall`
        : 'its tab is closed, so where it sits was not measured'));
    await idle.settled();
    d.assert('and it compiled the last text typed, once, and then the corner is empty again',
      idle.shown() === '' && getComputedStyle(idle.el).display === 'none'
        && compiled.length === 1 && compiled[0].endsWith('ab'),
      `${compiled.length} compile of "${(compiled[0] || '').split('\n').pop()}", "${idle.shown()}", `
      + `display ${getComputedStyle(idle.el).display}`);

    typeInto(`${base}\nerror`);
    await idle.settled();
    const errInk = getComputedStyle(idle.el).color;
    const bad = getComputedStyle(document.documentElement).getPropertyValue('--bad').trim();
    const probe = document.createElement('span'); probe.style.color = bad; document.body.append(probe);
    const badInk = getComputedStyle(probe).color; probe.remove();
    d.assert('a refused compile leaves Did not compile standing, still, in the bad ink, with the reason on hover',
      idle.shown() === NOTE_SAYS.error && idle.el.title.includes('refuses')
        && getComputedStyle(idle.el).animationName === 'none' && errInk === badInk,
      `"${idle.shown()}", title "${idle.el.title}", ink ${errInk} against ${badInk}`);

    hold.set(true);
    const n0 = compiled.length;
    typeInto(`${base}\nfixed`);
    await nap(IDLE_MS + 300);
    d.assert('while a note is held a due compile waits, and the note breathes over the wait',
      compiled.length === n0 && idle.state() === 'waiting' && idle.shown() === NOTE_SAYS.compiling,
      `${compiled.length - n0} compiles ${IDLE_MS + 300} ms after typing, ${idle.state()}, "${idle.shown()}"`);
    hold.set(false);
    await idle.settled();
    d.assert('and the moment the note comes up it compiles, the error clears and the corner empties',
      compiled.length === n0 + 1 && compiled[n0].endsWith('fixed') && idle.shown() === '' && idle.error() === '',
      `${compiled.length - n0} compile of "${(compiled[n0] || '').split('\n').pop()}", "${idle.shown()}"`);
    f.input.value = base;
  })().catch((e) => d.assert('the compile note checks ran to the end', false, String(e?.message || e)));

    /* The keyboard loops without the page knowing how: graded through the button and
       keys, on the callbacks the page hears, looking for how === 'loop'.
       See lessons/page-kit-input.md#kit-input-95 */
    {
      const kb = kitKb;
      /* Every block below starts from an empty slot: a stopped take is kept (the next
         press plays it), and only the double press, clear, empties it.
         See lessons/page-kit-input.md#kit-input-96 */
      kb.loops.forget(); kb.loops.clear(0);
      const before = kitHeard.length;
      kb.loop.el.click(); kb.loops.settle(0);                       // press one: record
      kb.press('a'); kb.release('a');
      kb.press('d'); kb.release('d');
      const taped = kb.taped();
      kb.loop.el.click(); kb.loops.settle(0);                      // press two: close the take, turn it
      await new Promise((r) => setTimeout(r, 260));
      const fromLoop = kitHeard.slice(before).filter((e) => e.how === 'loop');
      const wasLooping = kb.looping(), btnOn = kb.loop.get();
      kb.loop.el.click(); kb.loops.settle(0);                      // press three: stop
      d.assert('the keyboard records what it emits and plays it back as ordinary presses',
        taped === 4 && wasLooping === true && btnOn === true
          && kb.looping() === false && fromLoop.length >= 2
          && fromLoop.every((e) => Number.isFinite(e.n)),
        `${taped} key movement(s) taped, ${fromLoop.length} note(s) came back marked `
        + 'as coming from the loop');

      /* A take with almost nothing in it does not run away: a floor on the lap stops a
         few-millisecond take turning over a hundred times a second.
         See lessons/page-kit-input.md#kit-input-97 */
      d.assert('NEGATIVE CONTROL: a take of no length does not turn faster than a tremolo',
        fromLoop.length <= 12,
        `${fromLoop.length} note(s) in 260 ms, which is at most one lap of four `
        + 'movements plus the one that was already playing');

      /* Nothing played is not a loop: the button comes back off.
         See lessons/page-kit-input.md#kit-input-98 */
      kb.loops.forget(); kb.loops.clear(0);
      kb.loop.el.click(); kb.loops.settle(0);
      kb.loop.el.click(); kb.loops.settle(0);
      d.assert('NEGATIVE CONTROL: arming and closing with nothing played leaves the button off',
        kb.looping() === false && kb.taped() === 0 && kb.loop.get() === false,
        `looping ${kb.looping()}, ${kb.taped()} taped, button ${kb.loop.get() ? 'on' : 'off'}`);

      /* Waiting before you play adds no silence to the front of the loop: the clock starts
         at the first note. Measured as time until the note comes back, which is what a
         player hears.
         See lessons/page-kit-input.md#kit-input-99 */
      {
        kb.loops.forget(); kb.loops.clear(0);
        const was = kitHeard.length;
        kb.loop.el.click(); kb.loops.settle(0);
        await new Promise((r) => setTimeout(r, 350));   // getting your hands down
        kb.press('a'); kb.release('a');
        const closed = performance.now();
        kb.loop.el.click(); kb.loops.settle(0);
        let cameBack = 0;
        for (let i = 0; i < 40 && !cameBack; i++) {
          await new Promise((r) => setTimeout(r, 10));
          if (kitHeard.slice(was).some((e) => e.how === 'loop')) cameBack = performance.now();
        }
        kb.loop.el.click(); kb.loops.settle(0);
        const waited = cameBack ? Math.round(cameBack - closed) : -1;
        d.assert('a loop armed long before the first note comes back at once, not after the wait',
          waited >= 0 && waited < 200,
          `the note came back ${waited} ms after the take closed, against the 350 ms `
          + 'spent getting ready before it was played');
      }

      /* The take reaches back for what you already played, since a loop button always
         lands a little late.
         See lessons/page-kit-input.md#kit-input-100 */
      {
        kb.loops.forget(); kb.loops.clear(0);
        kb.press('a'); kb.release('a');
        await new Promise((r) => setTimeout(r, 60));
        kb.loops.press(0); kb.loops.settle(0);      // armed AFTER the phrase
        const caught = kb.taped(0);
        kb.loops.clear(0);

        /* but not for everything ever played
           See lessons/page-kit-input.md#kit-input-101 */
        kb.loops.forget(); kb.loops.clear(1);
        kb.press('d'); kb.release('d');
        await new Promise((r) => setTimeout(r, 1400));   // longer than the reach
        kb.loops.press(1); kb.loops.settle(1);
        const stale = kb.taped(1);
        kb.loops.clear(1);
        d.assert('arming after the phrase keeps it, and arming long after keeps nothing',
          caught === 2 && stale === 0,
          `a phrase played 60 ms before the press put ${caught} movement(s) in the `
          + `take, and one played 1.4 s before put ${stale}`);
      }

      /* Ten independent takes, and the second must not record the first: a note replayed
         by loop 1 reaches the page and lights the key where the tape listens, so a guard
         keeps loop 2 from recording it.
         See lessons/page-kit-input.md#kit-input-102 */
      {
        kb.loops.forget(); kb.loops.clear(0); kb.loops.clear(1);
        const was = kitHeard.length;
        const A = kb.noteOf('a'), D = kb.noteOf('d');

        kb.loops.press(0); kb.loops.settle(0);      // slot 1 records
        kb.press('a'); kb.release('a');
        kb.loops.press(0); kb.loops.settle(0);      // and goes round

        await new Promise((r) => setTimeout(r, 120));
        kb.loops.press(1); kb.loops.settle(1);      // slot 2 records, while 1 plays
        kb.press('d'); kb.release('d');
        const inTwo = kb.taped(1);
        kb.loops.press(1); kb.loops.settle(1);      // and goes round

        await new Promise((r) => setTimeout(r, 400));
        const back = kitHeard.slice(was).filter((e) => e.how === 'loop');
        const heardA = back.some((e) => e.n === A), heardD = back.some((e) => e.n === D);
        const bothGoing = kb.looping(0) && kb.looping(1);
        kb.loops.forget(); kb.loops.clear(0); kb.loops.clear(1);
        d.assert('two takes run at once and each holds only what was played into it',
          inTwo === 2 && bothGoing && heardA && heardD
            && kb.loops.state(0) === 'empty' && kb.loops.state(1) === 'empty',
          `the second take holds ${inTwo} movement(s), which is the one key played `
          + `into it and not the ${back.length} note(s) the first was replaying, and `
          + `both notes came back`);
      }

      /* A loop keeps time: each round is anchored, not chained from the last timer, so
         error does not accumulate. The claim is that the error does not grow, not that it
         is zero.
         See lessons/page-kit-input.md#kit-input-103 */
      {
        kb.loops.forget(); kb.loops.clear(0);
        const was = kitHeard.length;
        kb.loops.press(0); kb.loops.settle(0);
        kb.press('a'); kb.release('a');
        kb.loops.press(0); kb.loops.settle(0);      // lap is the 250 ms floor
        await new Promise((r) => setTimeout(r, 1150));   // four turns and a margin
        const lap = kb.loops.lap(0);
        const hits = kitHeard.slice(was).filter((e) => e.how === 'loop' && e.n === kb.noteOf('a'));
        kb.loops.clear(0);
        const gaps = hits.slice(1).map((e, i) => Math.round(e.t - hits[i].t));
        /* where each turn landed against a perfect grid laid from the first one */
        const errs = hits.map((e, i) => Math.round(e.t - (hits[0].t + i * lap)));
        /* The test is growth (halves compared), not magnitude, and it is coarse: it catches
           gross drift only. The real instrument is demo/resources/read-loop-take.mjs on a
           take recorded through /nola/?rec=1.
           See lessons/page-kit-input.md#kit-input-104 */
        const half = Math.floor(errs.length / 2);
        const mean = (xs) => xs.reduce((a, b) => a + b, 0) / (xs.length || 1);
        const growth = mean(errs.slice(half)) - mean(errs.slice(0, half));
        d.assert('a loop keeps its place over several turns rather than walking away',
          hits.length >= 4 && gaps.every((g) => Math.abs(g - lap) < 60) && growth < 3,
          `${hits.length} turn(s) at ${gaps.join(', ')} ms against a ${lap} ms lap, error `
          + `against a perfect grid ${errs.join(', ')} ms, and the last turns average `
          + `${growth.toFixed(1)} ms further out than the first`);
      }

      /* The footer row reads Loop, Sustain, Panic, and the gap matters as much as the
         order: free space goes to every margin-left: auto equally, so this measures the
         distance between neighbours too.
         See lessons/page-kit-input.md#kit-input-105 */
      /* A note played past the keys is still looped: the check plays it as MIDI does,
         lightNote and nothing else, since /nola/ takes midiDown straight to its own press.
         See lessons/page-kit-input.md#kit-input-106 */
      {
        kb.loops.forget(); kb.loops.clear(0);
        const was = kitHeard.length;
        kb.loop.el.click(); kb.loops.settle(0);
        kb.lightNote(67, true);
        kb.lightNote(67, false);
        const tapedOutside = kb.taped();
        kb.loop.el.click(); kb.loops.settle(0);
        await new Promise((r) => setTimeout(r, 300));
        const back = kitHeard.slice(was).filter((e) => e.how === 'loop' && e.n === 67);
        kb.loop.el.click(); kb.loops.settle(0);
        d.assert('a note played past the keys, the way MIDI arrives, is taped and comes back',
          tapedOutside === 2 && back.length >= 1,
          `${tapedOutside} movement(s) taped from a note that touched no key, `
          + `${back.length} came back`);

        /* A suggestion (a lamp name) is a hint drawn on the keys, not a performance, and is
           not looped.
           See lessons/page-kit-input.md#kit-input-107 */
        kb.loops.forget(); kb.loops.clear(0);
        kb.loop.el.click(); kb.loops.settle(0);
        kb.lightNote(71, true, 'ai');
        kb.lightNote(72, true, 'hint');
        const tapedLamps = kb.taped();
        kb.loop.el.click(); kb.loops.settle(0);
        d.assert('NEGATIVE CONTROL: a hinted or proposed key is drawn, never recorded',
          tapedLamps === 0,
          `${tapedLamps} movement(s) taped from two keys lit as a proposal`);
        kb.lightNote(71, false, 'ai'); kb.lightNote(72, false, 'hint');
      }

      /* The first loop sets the unit and later ones are integer ratios of it (numloop.mjs).
         Graded by what the page heard: the second loop wraps three times at the aligned
         lap. Notes are held 70 ms, so the onset list differs from the movement list.
         See lessons/page-kit-input.md#kit-input-108 */
      {
        /* Its own nap: the one at the head of the self-check is in a different block.
           See lessons/page-kit-input.md#kit-input-109 */
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        kb.loops.forget();
        for (let s = 0; s < kb.loops.slots; s++) kb.loops.clear(s);
        kb.loops.releaseUnit();

        const UNIT_NOTE = 84, LATER_NOTE = 81;
        /* 70 ms, not 50: numloop.mjs merges onsets 50 ms apart or closer, and a 50 ms timer
           fires either side of that.
           See lessons/page-kit-input.md#kit-input-110 */
        const HOLD = 70;

        kb.loops.press(0); kb.loops.settle(0);          // the first take arms
        const started = performance.now();
        for (let k = 0; k < 4; k++) {
          kb.lightNote(UNIT_NOTE, true);
          await wait(HOLD);
          kb.lightNote(UNIT_NOTE, false);
          if (k < 3) await wait(HOLD);
        }
        const played = Math.round(performance.now() - started);
        kb.loops.press(0); kb.loops.settle(0);          // and goes round, setting the unit
        const first = kb.tune(), fit0 = kb.loops.fit(0), unit = kb.loops.unit();
        /* Taken with the ratio cell holding a reading, and compared at the foot
           of this block against the same cells holding nothing. */
        const wide = (e) => +e.getBoundingClientRect().width.toFixed(2);
        const heldWide = [wide(first.tempoEl), wide(first.ratioEl), wide(kb.chord().el)];
        d.assert('the onsets handed to the tempo are the four notes played, not the eight movements taped, and four notes that say no tempo leave the cell empty',
          first.reading.onsets === 4 && first.reading.intervals === 3
            && kb.taped(0) === 8
            && first.reading.source === 'none' && first.reading.bpm === null
            && first.tempo === '' && first.ratio === 'first'
            && fit0?.first === true && Math.abs(kb.loops.lap(0) - played) <= 40,
          `${kb.taped(0)} movement(s) taped arrived as ${first.reading.onsets} onset(s) and `
          + `${first.reading.intervals} gap(s), the footer reads "${first.tempo}" and `
          + `"${first.ratio}", and the ${played} ms take set a ${unit?.ms} ms unit`);

        /* A take at 0.59 of the unit, not a ratio of it: the nearest ratio is a half, about
           17 per cent away, inside the 30 per cent numloop.mjs will stretch.
           See lessons/page-kit-input.md#kit-input-111 */
        kb.loops.forget();
        kb.loops.press(1); kb.loops.settle(1);
        const startedTwo = performance.now();
        kb.lightNote(LATER_NOTE, true); kb.lightNote(LATER_NOTE, false);
        await wait(300);
        const playedTwo = Math.round(performance.now() - startedTwo);
        kb.loops.press(1); kb.loops.settle(1);
        const fit1 = kb.loops.fit(1), second = kb.tune();
        const lap = kb.loops.lap(1);
        d.assert('a second take is snapped onto an integer ratio of the first, and the footer says which',
          fit1?.snapped === true && fit1.label === '1/2'
            && lap === Math.round(unit.ms / 2) && second.ratio === 'x1/2'
            && second.tempo === '',
          `${playedTwo} ms played against a ${unit.ms} ms unit came back as a ${lap} ms `
          + `lap, which the footer calls "${second.ratio}"`);

        /* Did it wrap there: counted off what the page heard over three turns while the
           first loop runs. The tolerance is half the distance between the aligned and played
           laps, so it can match only one; too close and it concludes nothing.
           See lessons/page-kit-input.md#kit-input-112 */
        const before = kitHeard.length;
        await wait(540);
        const turns = kitHeard.slice(before).filter((e) => e.how === 'loop' && e.n === LATER_NOTE);
        const gaps = turns.slice(1).map((e, k) => Math.round(e.t - turns[k].t));
        const apart = Math.abs(lap - playedTwo), tol = apart / 2;
        for (let s = 0; s < kb.loops.slots; s++) kb.loops.clear(s);
        d.assert('the second loop wraps on the aligned lap, counted, rather than on the length it was played at',
          apart >= 25 && turns.length >= 3 && gaps.length >= 2
            && gaps.every((g) => Math.abs(g - lap) < tol)
            && gaps.every((g) => Math.abs(g - playedTwo) > tol),
          `${turns.length} turn(s) in 540 ms at ${gaps.join(', ')} ms, against a `
          + `${lap} ms aligned lap and the ${playedTwo} ms it was played at, which are `
          + `${apart} ms apart`);

        /* The absences: clearing every slot empties both cells, and a stated tempo reads
           set, not heard. It puts the keyboard back, since a stated tempo survives clearing.
           See lessons/page-kit-input.md#kit-input-113 */
        const gone = kb.tune();
        kb.loops.assume(150);
        const told = kb.tune();
        const toldWide = [wide(told.tempoEl), wide(told.ratioEl), wide(kb.chord().el)];
        kb.loops.releaseUnit();
        const back = kb.tune();
        d.assert('clearing empties both cells, a stated tempo reads set rather than heard, and neither cell changes width',
          gone.tempo === '' && gone.ratio === '' && kb.loops.unit() === null
            && told.tempo === '150 bpm set' && told.reading.source === 'given'
            && back.tempo === '' && back.reading.bpm === null
            && heldWide.every((w) => w > 0)
            && heldWide.every((w, k) => Math.abs(w - toldWide[k]) < 0.5),
          `cleared it reads "${gone.tempo}" and "${gone.ratio}", stated "${told.tempo}", `
          + `released "${back.tempo}", and the cells measure ${heldWide.join(', ')} px `
          + `against ${toldWide.join(', ')} px`);
      }

      const kpad = kb.el.querySelector('.kpad');
      const sus = [...kpad.querySelectorAll('.pos-toggle')]
        .find((e) => /sustain/i.test(e.textContent))?.getBoundingClientRect();
      const lp = [...kpad.querySelectorAll('.pos-toggle')]
        .find((e) => /loop/i.test(e.textContent))?.getBoundingClientRect();
      /* Found by its word, never by a position class, which moves when the row is
         reordered.
         See lessons/page-kit-input.md#kit-input-114 */
      const off = [...kpad.querySelectorAll('button')]
        .find((e) => /^stop$/i.test(e.textContent.trim()))?.getBoundingClientRect();
      const gap = lp && sus ? Math.round(sus.left - lp.right) : -1;
      const gap2 = sus && off ? Math.round(off.left - sus.right) : -1;
      d.assert('Loop, Sustain and Stop sit in that order, tight against each other',
        !!(sus && lp && off) && lp.left < sus.left && sus.left < off.left
          && Math.abs(sus.top - lp.top) < 1
          && gap >= 0 && gap <= 12 && gap2 >= 0 && gap2 <= 12,
        `left edges ${Math.round(lp?.left)}, ${Math.round(sus?.left)}, `
        + `${Math.round(off?.left)}, with ${gap} px and ${gap2} px between them`);

      /**
       * Loop can be withdrawn and given back while the page is open (/nola/ decides when).
       * A sounding loop is walked to stopped, keeping its tape. One assert, four claims:
       * left the row, loop stopped, take survived, came back at the head of the group.
       * See lessons/page-kit-input.md#kit-input-115
       */
      {
        /* Its own wait: the one above is a const inside the tempo block.
           See lessons/page-kit-input.md#kit-input-116 */
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const end = kpad.querySelector('.kpad-grp-end');
        /* .kpad-grp-start, never .kpad-grp: both ends wear .kpad-grp, so the bare class finds
           whichever comes first in document order.
           See lessons/page-kit-input.md#kit-input-117 */
        const start = kpad.querySelector('.kpad-grp-start');
        const cells = () => kpad.querySelectorAll('.kpad-tempo, .kpad-ratio').length;
        const startW = () => +start.getBoundingClientRect().width.toFixed(1);
        kb.loops.clear(0); kb.loops.forget();
        kb.loops.press(0); kb.loops.settle(0);
        kb.lightNote(60, true); kb.lightNote(60, false);
        await wait(300);
        kb.loops.press(0); kb.loops.settle(0);
        const ran = { inRow: kb.loopOffered(), state: kb.loops.state(0), taped: kb.taped(0),
                      cells: cells(), w: startW() };
        kb.offerLoop(false);
        const gone = { inRow: kb.loopOffered(), state: kb.loops.state(0), taped: kb.taped(0),
                       cells: cells(), w: startW() };
        kb.offerLoop(true);
        const back = { inRow: kb.loopOffered(), first: end.firstElementChild === kb.loop.el,
                       taped: kb.taped(0), cells: cells(), w: startW() };
        kb.loops.clear(0); kb.loops.forget();
        d.assert('the Loop control can be taken away and given back, and a loop it was running stops with its take kept',
          ran.inRow === true && ran.state === 'looping' && ran.taped > 0
          && gone.inRow === false && gone.state === 'stopped' && gone.taped === ran.taped
          && back.inRow === true && back.first === true && back.taped === ran.taped,
          `running it read ${ran.state} with ${ran.taped} movement(s) in the row, `
          + `withdrawn it reads ${gone.state} with ${gone.taped} still on the slot and `
          + `${gone.inRow ? 'still' : 'not'} in the row, and offered again it is back `
          + `${back.first ? 'at the head of the group' : 'in the wrong place'} with `
          + `${back.taped} movement(s)`);

        /**
         * The two readout cells (kpad-tempo, kpad-ratio) leave with the control, a separate
         * assert. Measured as the row's width, since the cells are usually empty: on /nola/
         * at 375 px the row goes from 523.4 px to 304.4 px in a 323 px box.
         * See lessons/page-kit-input.md#kit-input-118
         */
        d.assert('the tempo and ratio cells leave with the Loop control and take their reserve with them',
          ran.cells === 2 && gone.cells === 0 && back.cells === 2
          && ran.w - gone.w >= 140 && Math.abs(back.w - ran.w) < 0.5,
          `offered it draws ${ran.cells} cell(s) across ${ran.w} px, withdrawn `
          + `${gone.cells} across ${gone.w} px, which is ${(ran.w - gone.w).toFixed(1)} px `
          + `of reserve, and offered again ${back.cells} across ${back.w} px`);
      }

      /**
       * The chord name says what is held and moves nothing: C5 and an eight character
       * half diminished seventh give the same cell and row rects. The name is read too,
       * or an empty cell would pass.
       * See lessons/page-kit-input.md#kit-input-119
       */
      const chordEl = kpad.querySelector('.kpad-chord');
      if (chordEl) {
        /* The octave pair is the row's first control and is what the left edges are read off.
           See lessons/page-kit-input.md#kit-input-120 */
        const edges = () => [chordEl, ...kpad.querySelectorAll('.kpad-oct, .kpad-at')]
          .map((e) => +e.getBoundingClientRect().left.toFixed(2));
        const at0 = edges();
        const w0 = +chordEl.getBoundingClientRect().width.toFixed(2);
        kb.lightNote(60, true); kb.lightNote(67, true);
        const small = chordEl.textContent;
        const at1 = edges();
        const w1 = +chordEl.getBoundingClientRect().width.toFixed(2);
        kb.lightNote(60, false); kb.lightNote(67, false);
        for (const n of [59, 62, 65, 69]) kb.lightNote(n, true);
        const big = chordEl.textContent;
        const at2 = edges();
        const w2 = +chordEl.getBoundingClientRect().width.toFixed(2);
        for (const n of [59, 62, 65, 69]) kb.lightNote(n, false);
        const empty = chordEl.textContent;
        const same = (a, b) => a.length === b.length && a.every((v, i) => Math.abs(v - b[i]) < 0.51);
        d.assert('the footer names the chord being held and nothing in the row moves sideways',
          small === 'C5' && big.length > small.length && empty === ''
            && same(at0, at1) && same(at0, at2) && w0 === w1 && w1 === w2,
          `two notes read "${small}", five read "${big}", letting go reads `
          + `"${empty}", the cell stays ${w0} px and the row's left edges stay `
          + `${at0.join(', ')}`);
      }
    }
  } // if (SELFCHECK)
</script>

<script type="module">
  import { el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createNoteGrid } from '/shell/note-grid.mjs';
  import { createStripView, createStripFooter, STRIP_FOOTER_EMPTY } from '/shell/strip.mjs';
  import { createFullscreenExit, EXIT_IDLE_MS, toggle as fsToggle, isFull as fsIsFull }
    from '/shell/fullscreen.mjs';
  import { createVideoPanel, FULL_MODES } from '/shell/video-panel.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { burn, readBurned, FRAME_W, FRAME_H, videoHue } from '/shell/pattern.mjs';
  import { createPresence } from '/shell/presence.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { markAdapter } from '/shell/fixture.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * kit/timeline: one part of /kit/ on a page of its own (plans/plan-kit-split.md).
   * Blocks and checks are copied from demo/kit/index.html in its order, newest first;
   * every check is behind ?selfcheck=1.
   * See lessons/page-kit-timeline.md#kit-timeline-1
   */
  const { d, out, section, land, checkPage } = createKitPage({
    part: 'timeline',
    what: "Transport bars, strips and video panels for watching something play out over time.",
  });

  // The video panels, for the checks that their slots and their picture are real.
  let vpSpec = null;

  // Holders for the way out of full screen, the hover strip, the glued panel and
  // transport, and the four transport shapes. Declared up here so a block that moves
  // does not leave a let behind to be read in its dead zone.
  // See lessons/page-kit-timeline.md#kit-timeline-2
  let liveSpec = null;        // the live run whose dense lane is binned, newest block
  let tbarSpec = null;        // { whole, noScrub, noToggle, refused, deck }
  let ngSpec = null;          // { grid, ev }
  let glueSpec = null;        // { panel, bar, deck, mute }
  let fsxSpec = null;         // { host, exit, out }, a cover with a way back
  let footSpec = null;        // the strip whose footer says what is hovered
  let vpUnder = null;         // the control row a panel lifts while full
  let vpStorey = null;        // the off-screen panel that row is graded against
  // The three panel specimens for the checks below: with an absorber, without one as
  // the negative control, and at a phone's width. Declared up here for the same reason.
  // See lessons/page-kit-timeline.md#kit-timeline-3

  /**
   * A live run: a lane of 50 marks a second, one in 37 late, 20 s in when the page
   * opens. The write head is the cursor, the view steps only at the edge, close marks
   * are binned, and it stops after a minute. Rows come from the head: nothing fetched.
   * See lessons/page-kit-timeline.md#kit-timeline-4
   */
  section('LIVE RUN',
    'A strip of something being written right now: the whole run in view at a '
    + 'round span, the cursor walking to now, and marks too close to draw apart binned.',
    `const v = createStripView(host, deck, { live: { minSpan: 8000 }, lanes })
v.strip.startLive(0)    // the run starts, the cursor is the write head
v.strip.stopLive()      // the head freezes where it is`,
    (box) => {
      box.classList.add('kit-wide');
      const RATE_MS = 20, BACKLOG = 20000, RUN = 60000;
      const late = (i) => i % 37 === 11;
      const deck = createDeck({ items: [], range: [0, 8000] });
      liveSpec = createStripView(box, deck, {
        size: 'auto', follow: false, gutter: 92, footer: { lines: 2 }, live: { minSpan: 8000 },
        lanes: [{
          id: 'frames', kind: 'frame', label: 'frames', height: 40, width: 1, as: 'ticks', terse: true,
          rows: () => {
            const head = Math.min(liveSpec?.strip.wallPos() ?? 0, RUN);
            const out = [];
            for (let i = 0; i * RATE_MS <= head; i++) out.push({ at: i * RATE_MS, id: `f${i}`, kind: 'frame', payload: { i, late: late(i) } });
            return out;
          },
          colorOfRow: (r) => (r.payload.late ? '#e0908a' : '#8fd6a8'),
          rankOfRow: (r) => (r.payload.late ? 1 : 0),
          describeRow: (r) => (r.payload.late ? 'late' : 'on time'),
        }],
      });
      liveSpec.strip.startLive(BACKLOG);
      setTimeout(() => liveSpec.strip.stopLive(), RUN - BACKLOG);
    });


  /**
   * The shapes of a transport bar: four views of one idle deck, so nothing moves
   * unasked and no rate row is drawn. Only the whole row claims __demo.transport;
   * the others pass publish: false, asserted both ways.
   * See lessons/page-kit-timeline.md#kit-timeline-5
   */
  /**
   * Note grid, deliberately not strip.mjs: a strip draws marks against a deck in ms,
   * coloured by how they landed, while a Circuit pattern has steps and pitch.
   * See lessons/page-kit-timeline.md#kit-timeline-6
   */
  section('NOTE GRID',
    'Note events where they fall in a pattern, one row per pattern under its beats, '
    + 'with the note in focus named in the footer.',
    `const grid = createNoteGrid(host, { onPick })
grid.set(notesIn(sessionBytes))   // [{ region, step, note, velocity, gate, length? }]`,
    (box) => {
      box.classList.add('kit-wide');
      /* Two patterns checkable by eye, a rising and a falling line at alternate steps.
         One has lengths in steps, so both footer forms show: 2 steps and a raw gate 13.
         See lessons/page-kit-timeline.md#kit-timeline-7 */
      const ev = [];
      for (let i = 0; i < 8; i++) {
        ev.push({ region: 0, step: i * 2, note: 52 + i * 3, velocity: 20 + i * 15,
          length: i % 2 ? 1.5 : 1 });
        ev.push({ region: 4, step: i * 2 + 1, note: 73 - i * 3, velocity: 127 - i * 14,
          gate: 6 + i });
      }
      const grid = createNoteGrid(box, { label: 'one rising pattern and one falling' });
      grid.set(ev);
      ngSpec = { grid, ev };
      /* The axis is asserted: a higher note sits higher, and two patterns are two rows.
         See lessons/page-kit-timeline.md#kit-timeline-8 */
      const f = grid.facts();
      const first = grid.place(ev[0]), last = grid.place(ev[14]);
      // Behind ?selfcheck=1 like every check on these pages.
      // See lessons/page-kit-timeline.md#kit-timeline-9
      if (SELFCHECK) d.assert('a higher note sits higher, and two patterns are two rows',
        f.regions === 2 && f.count === 16 && last.y < first.y && last.row === first.row,
        `${f.count} notes in ${f.regions} rows, ${f.lo} to ${f.hi}, `
        + `note ${ev[14].note} at y ${last.y.toFixed(1)} above note ${ev[0].note} at `
        + `y ${first.y.toFixed(1)}`);
    });

  section('TRANSPORT BAR',
    'The whole row, the two things a page can take off it, and the one pair it refuses.',
    `createTransportBar(host, deck)                       // everything
createTransportBar(host, deck, { scrub: false })      // a page with a strip
createTransportBar(host, deck, { toggle: false, chip: badge.el })
createTransportBar(host, deck, { chip, live: true })  // throws: one position, two claims`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      // One deck: four would be four clocks.
      // See lessons/page-kit-timeline.md#kit-timeline-10
      const deck = createDeck({ range: [0, 60_000] });
      tbarSpec = {};

      const at = (cap, opts) => {
        const host = el('div', 'kit-half');
        const bar = createTransportBar(host, deck, { publish: false, ...opts });
        stack.titled(cap, host);
        return bar;
      };

      /**
       * The whole row, the one bar here that publishes (publish defaults to true), so
       * the harness gets a defined playhead rather than whichever bar was built last.
       * verify.mjs presses this toggle and seeks this deck, which has no adapters.
       * See lessons/page-kit-timeline.md#kit-timeline-11
       */
      tbarSpec.whole = at('EVERYTHING, AND THE ONE BAR HERE THAT PUBLISHES',
        { verb: ['start', 'stop'], publish: true });

      /**
       * scrub: false: one position surface per page. A page with a strip passes it,
       * since the strip already seeks on press and on drag.
       * See lessons/page-kit-timeline.md#kit-timeline-12
       */
      tbarSpec.noScrub = at('SCRUB: FALSE, WHICH IS WHAT A PAGE WITH A STRIP PASSES',
        { scrub: false, verb: ['start', 'stop'] });

      /**
       * toggle: false, for a page with no position inside a sound: playing is forced
       * false, space is not a play key, the end stop never arms, and api.toggles says so
       * for demo/verify.mjs. The chip slot holds the presence badge instead.
       * See lessons/page-kit-timeline.md#kit-timeline-13
       */
      tbarSpec.noToggle = at('TOGGLE: FALSE, WITH A PRESENCE BADGE IN THE CHIP\u2019S PLACE', {
        toggle: false, scrub: false, loop: false,
        chip: createPresence({ of: 'Raspberry Pi', mode: 'badge', state: 'online' }).el,
      });

      /**
       * The one pair it refuses: a chip and a live badge want the same position, so
       * asking for both throws rather than picking. Shown as the refusal.
       * See lessons/page-kit-timeline.md#kit-timeline-14
       */
      let refused = 'IT WAS ACCEPTED';
      try {
        createTransportBar(el('div', ''), deck, {
          publish: false, live: true,
          chip: createPresence({ of: '', mode: 'badge', state: 'online' }).el,
        });
      } catch (e) { refused = e.message; }
      tbarSpec.refused = refused;
      const say = el('div', 'kit-cut', `a chip and a live badge: ${refused}`);
      stack.add(say);

      tbarSpec.deck = deck;
      box.append(stack.el);
    });

  section('GLUED TRANSPORT BAR',
    'A panel and its transport bar wrapped in one edge with a 1 px seam. The toggle holds '
    + 'both of its words at once, so it cannot change width when it changes state.',
    `panel.glue(bar.el)   // wraps in place, so the pair stays where the panel was
createTransportBar(host, deck, { verb: ['start', 'stop'] })`,
    (box) => {
      box.classList.add('kit-wide');
      // .kit-half is max-width: 50%, not a pixel count, because the box owns this width.
      // See lessons/page-kit-timeline.md#kit-timeline-15
      const glued = el('div', 'kit-half');
      box.append(glued);
      const c = document.createElement('canvas');
      c.width = FRAME_W; c.height = FRAME_H;
      const ctx = c.getContext('2d', { alpha: false });
      const panel = createVideoPanel({
        media: c,
        left: createPresence({ of: '', mode: 'badge', state: 'online',
                               says: { online: 'live' } }).el,
      });
      /**
       * A second glyph beside the full screen one, as /stage/'s mute: U+266B and U+2298,
       * because U+1F568 to U+1F56A are tofu in this font stack and U+1F507/U+1F50A are
       * emoji. setSymbol, never textContent, which drops the centring span.
       * See lessons/page-kit-timeline.md#kit-timeline-16
       */
      let muted = true;
      const mute = el('button', 'ico', '\u2298',
        { type: 'button', 'aria-label': 'the sound', 'aria-pressed': 'false', title: 'muted' });
      centreSymbol(mute);
      mute.onclick = () => {
        muted = !muted;
        setSymbol(mute, muted ? '\u2298' : '\u266b');
        mute.setAttribute('aria-pressed', String(!muted));
        mute.title = muted ? 'muted' : 'audible';
      };
      panel.slots.right.prepend(mute);
      glued.append(panel.el);

      // A deck with no adapters offers no rates, so the bar draws no rate row:
      // what is on show here is the toggle, the clock and the seam.
      const deck = createDeck({ range: [0, 60_000] });
      const bar = createTransportBar(glued, deck, {
        verb: ['start', 'stop'], live: false, loop: false, scrub: true, absolute: false,
        /**
         * publish: false: the whole row above claims __demo.transport, so the choice is
         * explicit rather than decided by source order.
         * See lessons/page-kit-timeline.md#kit-timeline-17
         */
        publish: false,
      });
      // The panel is already in the box and the bar is appended after it, which is the
      // realistic order the method is for.
      // See lessons/page-kit-timeline.md#kit-timeline-18
      panel.glue(bar.el);
      glueSpec = { panel, bar, deck, mute, half: glued };

      let n = 0;
      const draw = () => { burn(ctx, FRAME_W, FRAME_H, n++, { hue: videoHue(1) }); requestAnimationFrame(draw); };
      requestAnimationFrame(draw);

      /**
       * The way out of full screen, built off screen and never shown, because two checks
       * press it. Laid out at left: -9999px since they read rects; the holder takes no
       * inline position, and it is outside .pos-controls so the harness never presses it.
       * See lessons/page-kit-timeline.md#kit-timeline-19
       */
      const o = out('not filling the screen');
      const host = el('div', 'kit-cover');
      host.append(el('div', 'kit-cover-p', 'a picture'));
      // The piece is built before the handler that closes over it, so no const is read
      // in its dead zone.
      // See lessons/page-kit-timeline.md#kit-timeline-20
      const exit = createFullscreenExit(host, {
        onExit: () => { o.textContent = 'came back'; },
      });
      // An ordinary button, not a shell control: pressed from the checks, not the harness.
      // See lessons/page-kit-timeline.md#kit-timeline-21
      const go = el('button', '', 'Fill the screen', { type: 'button' });
      go.onclick = async () => {
        const how = await fsToggle(host);
        exit.sync();
        o.textContent = `filling the screen the ${how} way`;
      };
      fsxSpec = { host, exit, out: o, go };

      const probe = el('div', '');
      probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px';
      probe.append(host, go, o);
      document.body.append(probe);
    });

  /**
   * Strip view and its footer, one section because the footer is an option on the
   * same call. The stack goes into the box before either strip is built, because
   * fit() measures the width it is given.
   * See lessons/page-kit-timeline.md#kit-timeline-22
   */
  section('STRIP VIEW',
    'Marks on a lane over the deck\u2019s range. An optional box under it says what the '
    + 'pointer is over, at one height whatever it is saying.',
    `createStripView(host, deck, { lanes })
createStripView(host, deck, { lanes, footer: true })
createStripView(host, deck, { lanes, footer: { lines: 3, empty: 'nothing chosen' } })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const bare = stack.titled('MARKS ON A LANE');
      const footed = stack.titled('AND THE BOX THAT SAYS WHAT IS UNDER THE POINTER');
      box.append(stack.el);

      const { adapter } = markAdapter({ rates: [1] });
      const SPAN = 8000;
      const marks = (n, tag) => {
        const items = [];
        for (let i = 0; i < n; i++) {
          items.push({ id: `${tag}${i}`, kind: 'mark', at: (i + 0.5) * (SPAN / (n + 1)),
                       payload: { label: `${i + 1}` } });
        }
        // A deck needs an adapter per kind, or the lane silently draws nothing.
        // See lessons/page-kit-timeline.md#kit-timeline-23
        return createDeck({ items, adapters: { mark: adapter }, range: [0, SPAN] });
      };
      // The swatch on the lane's left border AND the marks themselves take the
      // page's primary colour. `L.color` is the one place it is set, and
      // `styleFor` hands it to both.
      const hi = getComputedStyle(document.documentElement)
                   .getPropertyValue('--hi').trim() || '#ffd400';

      // No sublabel on the bare one: it ellipsizes in a gutter this narrow. 'auto' takes
      // exactly the height its lanes need, where 'default' leaves empty canvas.
      // See lessons/page-kit-timeline.md#kit-timeline-24
      const { strip } = createStripView(bare, marks(14, 'n'), {
        size: 'auto',
        lanes: [{ id: 'mark', kind: 'mark', color: hi }],
      });
      strip.fit?.();

      footSpec = createStripView(footed, marks(9, 'f'), {
        size: 'auto',
        // One line: this specimen's marks carry only a number, so the default three rows
        // would be reserved air.
        // See lessons/page-kit-timeline.md#kit-timeline-25
        footer: { lines: 1 },
        lanes: [{ id: 'mark', kind: 'mark', label: 'takes', color: hi }],
      });
      footSpec.strip.fit?.();
    });


  /**
   * Presence, one block for both questions (state and busy). Section titles are
   * uppercase; verify.mjs presses by position, so diff the assert count after a reorder.
   * See lessons/page-kit-timeline.md#kit-timeline-26
   */
  section('VIDEO PANEL',
    'A picture, with a status on the left, an empty middle and a fullscreen button under it.',
    `createVideoPanel({ media: canvas, of: 'the board' })
createVideoPanel({ media, left: myBadge, centre: myThing, right: false, fullMode: 'footer' })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      /**
       * The picture is pattern.mjs drawn into a canvas, so the specimen needs no network.
       * One canvas and one loop: the master is drawn once a frame and blitted into each panel.
       * See lessons/page-kit-timeline.md#kit-timeline-27
       */
      const master = document.createElement('canvas');
      master.width = FRAME_W; master.height = FRAME_H;
      const mctx = master.getContext('2d', { alpha: false });

      /**
       * Three across, not three down, so panels that differ in one row of controls are
       * compared at a glance; they wrap to one column on a phone.
       * See lessons/page-kit-timeline.md#kit-timeline-28
       */
      const row = el('div', 'kit-row kit-vps');
      const made = [];
      const add = (heading, panel, ctx) => {
        const cell = el('div', 'kit-vp');
        cell.append(el('p', 'kit-cap', heading), panel.el);
        row.append(cell);
        made.push({ ctx, panel });
      };
      for (const [mode, heading] of [['hover', 'the defaults'],
                                     ['footer', 'footer in fullscreen']]) {
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        /**
         * The badge says LIVE rather than a lone dot, because a dot means only its hue;
         * this footer holds one thing, so it has room for the word.
         * See lessons/page-kit-timeline.md#kit-timeline-29
         */
        const p = createVideoPanel({
          media: c, fullMode: mode,
          left: createPresence({ of: '', mode: 'badge', state: 'online',
                                 says: { online: 'live' } }).el,
        });
        add(heading, p, c.getContext('2d', { alpha: false }));
      }

      /**
       * The second storey (panel.under) is no longer shown but still graded: /mirror/
       * uses it in full screen. Off screen at left: -9999px since the check reads
       * gridTemplateRows, and it is the same element moved, so exactly one exists.
       * See lessons/page-kit-timeline.md#kit-timeline-30
       */
      {
        const probe = el('div', '');
        probe.style.cssText = 'position:fixed;left:-9999px;top:0;width:480px';
        const c = document.createElement('canvas');
        c.width = FRAME_W; c.height = FRAME_H;
        vpUnder = el('div', 'kit-row');
        vpUnder.append(el('div', '', 'a control row'));
        vpStorey = createVideoPanel({ media: c, fullMode: 'footer' });
        probe.append(vpStorey.el, vpUnder);
        document.body.append(probe);
        // Handed over after it is on the page: the panel records where the element lives
        // when given it. The constructor's under option is for controls built first.
        // See lessons/page-kit-timeline.md#kit-timeline-31
        vpStorey.under(vpUnder);
      }

      vpSpec = made;
      stack.add(row);

      let n = 0;
      const draw = () => {
        burn(mctx, FRAME_W, FRAME_H, n++, { hue: videoHue(0) });
        for (const m of made) m.ctx.drawImage(master, 0, 0);
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
      box.append(stack.el);
    });

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* What a machine can say about this page. Every check is behind ?selfcheck=1 and
     copied from demo/kit/index.html with its indent. They run after a frame,
     because getBoundingClientRect before the first paint measures an unarranged page.
     See lessons/page-kit-timeline.md#kit-timeline-32 */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();

  /**
   * The note grid's five claims, each a measurement; the pointer ones dispatch real
   * pointer events at a real note's position.
   * See lessons/page-kit-timeline.md#kit-timeline-33
   */
  if (ngSpec) {
    const { grid, ev } = ngSpec;
    const c = grid.canvas, cb = c.getBoundingClientRect();
    const f = grid.facts(), colW = cb.width / f.steps;
    const centre = (e) => { const p = grid.place(e);
      return { clientX: cb.left + (p.step + 0.5) * colW, clientY: cb.top + p.y + 6 }; };
    const ptr = (type, e) => c.dispatchEvent(new PointerEvent(type,
      { bubbles: true, pointerId: 1, ...centre(e) }));

    // 1. Pointing changes nothing.
    const before = JSON.stringify(grid.footer()), was = grid.picked(), inkWas = grid.ink();
    ptr('pointermove', ev[9]); ptr('pointerover', ev[9]);
    d.assert('the note grid has no hover: a pointer over a note changes neither the footer nor the picture',
      grid.picked() === was && JSON.stringify(grid.footer()) === before && grid.ink() === inkWas
      && !c.title, `focus still ${grid.footer().note} at ${grid.footer().start}, ink ${grid.ink()} of ${inkWas}`);

    // 2. A press and the arrows move the note in focus, and the footer names it.
    ptr('pointerdown', ev[9]);
    const pressed = grid.picked() === ev[9] && grid.footer().note === 'C#3'
      && grid.footer().pattern === '5' && grid.footer().start === '3.2';
    const key = (k) => c.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    key('ArrowRight'); const right = grid.picked() === ev[11];
    key('ArrowUp'); const up = grid.picked()?.region === 0 && grid.picked().step === 12;
    d.assert('a press picks the note under it and the arrows walk the notes, named in the footer',
      pressed && right && up,
      `press ${pressed}, right ${right}, up ${up}, footer ${JSON.stringify(grid.footer())}`);

    // 3. The footer is cells in reserved widths: one height and one set of
    //    lefts whatever note it names.
    const shape = () => { const fb = grid.el.querySelector('.pos-ngrid-foot').getBoundingClientRect();
      return `${fb.height.toFixed(1)}|` + ['note', 'number', 'pattern', 'start', 'length', 'velocity']
        .map((k) => grid.footCell(k).getBoundingClientRect().left.toFixed(1)).join(','); };
    const shapes = new Set();
    for (const e of [ev[0], ev[1], ev[3], ev[14], ev[15]]) {
      grid.pick(e); shapes.add(shape());
    }
    grid.pick(ev[0]);
    d.assert('the footer holds one shape whatever note it names, because every cell is reserved',
      shapes.size === 1, `${shapes.size} shape(s): ${[...shapes][0]}`);

    // 4. The headings and the pattern column share the picture's tracks.
    const beats = [...grid.el.querySelectorAll('.pos-ngrid-beat')].map((b) => b.getBoundingClientRect().left - cb.left);
    const labs = [...grid.el.querySelectorAll('.pos-ngrid-lab')].map((l) => {
      const r = l.getBoundingClientRect(); return [r.top - cb.top, r.height]; });
    const beatOff = Math.max(...beats.map((x, i) => Math.abs(x - i * f.beat * colW)));
    const labOff = Math.max(...labs.map(([t, h], i) => Math.abs(t - i * f.rowH) + Math.abs(h - f.rowH)));
    d.assert('the beat headings sit on the beat lines and each pattern label is its row',
      beats.length === 4 && labs.length === f.regions && beatOff < 0.5 && labOff < 0.5,
      `4 headings at ${beats.map((x) => x.toFixed(1)).join(', ')} px, off by ${beatOff.toFixed(2)}; `
      + `${labs.length} labels off by ${labOff.toFixed(2)}`);

    // 5. Sticky when it scrolls sideways: squeeze the box, scroll, measure.
    const sc = grid.scroller, oldW = grid.el.style.width;
    grid.el.style.width = '240px';
    sc.scrollLeft = 120;
    const sb = sc.getBoundingClientRect(), lab = grid.el.querySelector('.pos-ngrid-lab').getBoundingClientRect();
    const corner = grid.el.querySelector('.pos-ngrid-corner').getBoundingClientRect();
    const moved = sc.scrollLeft;
    const stuck = moved > 0 && Math.abs(lab.left - sb.left) < 0.5 && Math.abs(corner.left - sb.left) < 0.5;
    sc.scrollLeft = 0; grid.el.style.width = oldW;
    d.assert('in a narrow box the grid scrolls sideways under a pattern column that stays put',
      stuck, `scrolled ${moved} px, label ${(lab.left - sb.left).toFixed(1)} px and corner `
      + `${(corner.left - sb.left).toFixed(1)} px from the box's left edge`);
  }


  /**
   * Under versus glued: same element order, but one edge round the pair or two edges
   * and a gap, which is three numbers. Same shape as the strip's glue check, since
   * the double-classed .pos-glue rule exists to win the specificity fight.
   * See lessons/page-kit-timeline.md#kit-timeline-34
   */
  if (glueSpec) {
    const surf = glueSpec.panel.surface;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    const pb = glueSpec.panel.el.getBoundingClientRect();
    const bb = glueSpec.bar.el.getBoundingClientRect();
    const seam = bb.top - pb.bottom;
    /**
     * Half the width of its box, measured against the box's content width rather than
     * read off the stylesheet or typed; a specimen taking the whole box fails it.
     * See lessons/page-kit-timeline.md#kit-timeline-35
     */
    const half = glueSpec.half;
    const hb = half.parentElement;
    const hcs = getComputedStyle(hb);
    const room = hb.clientWidth - parseFloat(hcs.paddingLeft) - parseFloat(hcs.paddingRight);
    const took = half.getBoundingClientRect().width;
    d.assert('a transport glued under a picture is one surface with one edge, at half its box',
      surf !== glueSpec.panel.el && surf.classList.contains('pos-glue')
      && surf.contains(glueSpec.panel.el) && surf.contains(glueSpec.bar.el)
      && Math.abs(seam - 1) <= 0.6 && edge(surf) === 1
      && edge(glueSpec.panel.el) === 0 && edge(glueSpec.bar.el) === 0
      && took < room - 1 && Math.abs(took - room / 2) <= 1,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(surf)} px round both, `
      + `${edge(glueSpec.panel.el)} and ${edge(glueSpec.bar.el)} inside, `
      + `taking ${took.toFixed(1)} px of the ${room.toFixed(1)} px the box gives it`);

    /**
     * Start and stop labels keep one width in both states, and the check also reads
     * which word is visible, since two hidden spans are the same width too. It presses
     * the toggle and waits for the state, rather than setting data-state by hand.
     * See lessons/page-kit-timeline.md#kit-timeline-36
     */
    const t = glueSpec.bar.el.querySelector('.tbar-toggle');
    const vis = (cls) => {
      const n = t?.querySelector(`.${cls}`);
      return n ? getComputedStyle(n).visibility : 'no span';
    };
    const w = () => (t ? +t.getBoundingClientRect().width.toFixed(2) : null);
    const wIdle = w();
    const seenIdle = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    // Wait a frame at a time until the toggle's state lands.
    // See lessons/page-kit-timeline.md#kit-timeline-37
    for (let i = 0; i < 40 && t?.dataset.state !== 'playing'; i++) {
      await new Promise((r) => requestAnimationFrame(r));
    }
    const wBusy = w();
    const seenBusy = [vis('tbar-w0'), vis('tbar-w1')];
    t?.click();
    glueSpec.deck.pause();
    d.assert('a toggle that says two words is the same width in both of its states',
      wIdle != null && wBusy != null && Math.abs(wIdle - wBusy) < 0.01
      && seenIdle[0] === 'visible' && seenIdle[1] === 'hidden'
      && seenBusy[0] === 'hidden' && seenBusy[1] === 'visible',
      `${wIdle} px showing "${t?.querySelector('.tbar-w0')?.textContent}" `
      + `(${seenIdle.join('/')}), ${wBusy} px showing `
      + `"${t?.querySelector('.tbar-w1')?.textContent}" (${seenBusy.join('/')})`);
  }

  /**
   * No play button, and a boolean a harness can read: the DOM (.tbar-toggle) and
   * api.toggles must agree, compared against the whole row beside it, because
   * demo/verify.mjs would otherwise click a toggle that does not exist.
   * See lessons/page-kit-timeline.md#kit-timeline-38
   */
  if (tbarSpec) {
    const has = (b) => !!b.api.el.querySelector('.tbar-toggle');
    d.assert('a bar told to leave the play button off has none, and says so in one boolean',
      has(tbarSpec.whole) && tbarSpec.whole.api.toggles !== false
      && !has(tbarSpec.noToggle) && tbarSpec.noToggle.api.toggles === false
      && tbarSpec.noToggle.api.playing === false,
      `the whole row: toggle ${has(tbarSpec.whole) ? 'drawn' : 'MISSING'}, `
      + `toggles ${tbarSpec.whole.api.toggles} · with it off: `
      + `${has(tbarSpec.noToggle) ? 'STILL DRAWN' : 'no toggle'}, `
      + `toggles ${tbarSpec.noToggle.api.toggles}, playing ${tbarSpec.noToggle.api.playing}`);

    /**
     * scrub: false keeps the slider but sets data-scrub="0" and shell.css hides it, so
     * this reads computed style. Both sides, because data-scrub is seekable && wantScrub.
     * See lessons/page-kit-timeline.md#kit-timeline-39
     */
    const shows = (b) => getComputedStyle(b.api.el.querySelector('.tbar-scrub')).display;
    const flag = (b) => b.api.el.dataset.scrub;
    d.assert('and a bar told to leave the slider off draws no second time axis',
      shows(tbarSpec.whole) !== 'none' && flag(tbarSpec.whole) === '1'
      && shows(tbarSpec.noScrub) === 'none' && flag(tbarSpec.noScrub) === '0',
      `the whole row is data-scrub=${flag(tbarSpec.whole)} showing `
      + `${shows(tbarSpec.whole)}, the one with scrub off is `
      + `data-scrub=${flag(tbarSpec.noScrub)} showing ${shows(tbarSpec.noScrub)}`);

    /**
     * The chip slot holds the presence badge, which changes with whether the
     * instrument answers, not a LIVE word fixed at build time.
     * See lessons/page-kit-timeline.md#kit-timeline-40
     */
    const chip = tbarSpec.noToggle.api.el.querySelector('.pos-pres');
    d.assert('the chip on a bar with no toggle is a badge that can change, not a word',
      !!chip && chip.querySelector('.pos-pres-dot')
      && chip.querySelector('.pos-pres-w').textContent.trim().length > 0,
      chip ? `it says "${chip.querySelector('.pos-pres-w').textContent.trim()}" beside a dot`
           : 'there is nothing in the chip position');

    /**
     * Negative control: a chip and a live badge want the same position, so the bar
     * throws rather than picking.
     * See lessons/page-kit-timeline.md#kit-timeline-41
     */
    d.assert('NEGATIVE CONTROL: a chip and a live badge are refused rather than drawn over each other',
      typeof tbarSpec.refused === 'string' && tbarSpec.refused !== 'IT WAS ACCEPTED'
      && tbarSpec.refused.includes('same position'),
      tbarSpec.refused);

    /**
     * Exactly one bar claims __demo.transport, graded by identity against the chosen
     * specimen: filled, and by the whole row. document.querySelector('.tbar') would
     * only find the first bar in DOM order.
     * See lessons/page-kit-timeline.md#kit-timeline-42
     */
    /* The tab page block's bars are excluded: built lazily when its BARS tab opens,
       publish: false, and graded there.
       See lessons/page-kit-timeline.md#kit-timeline-43 */
    const bars = [...document.querySelectorAll('.tbar')].filter((b) => !b.closest('.kit-tabpage'));
    const published = d.api.transport || window.__demo?.transport;
    /* Four bars on this page; every specimen except the whole row passes publish: false.
       See lessons/page-kit-timeline.md#kit-timeline-44 */
    d.assert('of the four bars here exactly one claims the page\u2019s playhead, and it is the whole row',
      bars.length === 4 && !!published && published === tbarSpec.whole.api
      && published.el === tbarSpec.whole.api.el
      && bars.filter((b) => b === published.el).length === 1,
      `${bars.length} bars on the page · the handle holds ${published ? 'one of them' : 'NOTHING'}`
      + `${published && published === tbarSpec.whole.api ? ', the whole row' : ''}`);
  }

  // Glued means one surface: one border round the pair, only the 1 px .pos-glue seam
  // between, and neither child painting its own edge. .pos-strip (0,1,0) and
  // .pos-glue.pos-glue > * (0,2,0) both declare border.
  // See lessons/page-kit-timeline.md#kit-timeline-45
  /**
   * The live run's claims: binned marks never touch, the cursor is the moving write
   * head, a bin under the pointer reports its count and worst, a stopped head stays.
   * Negative control: zoomed in far enough the lane draws one mark per row.
   * See lessons/page-kit-timeline.md#kit-timeline-46
   */
  if (liveSpec) {
    const s = liveSpec.strip;
    s.draw();
    const b = s.binState('frames');
    let closest = Infinity;
    for (let i = 1; i < (b?.drawn?.length || 0); i++) closest = Math.min(closest, b.drawn[i].x - (b.drawn[i - 1].x + b.drawn[i - 1].w));
    d.assert('a live lane denser than its marks can be drawn apart is binned, and no two drawn marks touch',
      !!b && b.binned && b.bins < b.rows && closest >= 2,
      b ? `${b.rows} rows in ${b.bins} bins of ${b.binPx} px, ${b.markPx} px marks, closest ${closest} px apart` : 'no bin state');

    // A STEPPED view: the head walks, the marks stand still until a step.
    const span0 = s.live()?.span, h0 = s.wallPos(), x0 = s.timeToX(h0), m0 = s.timeToX(10000);
    await new Promise((r) => setTimeout(r, 400));
    s.draw();
    const span1 = s.live()?.span, h1 = s.wallPos(), x1 = s.timeToX(h1), m1 = s.timeToX(10000);
    const [left, right] = s.visible(), plot = s.timeToX(right);
    d.assert('the cursor is the write head and walks across a view held at a round span',
      s.live()?.running && h1 - h0 >= 300 && x1 > x0 && x1 < plot && span0 === span1
      && [10000, 20000, 30000, 60000].includes(span1) && left <= 0 && right >= span1,
      `head ${(h0 / 1000).toFixed(2)} s then ${(h1 / 1000).toFixed(2)} s, at x ${x0.toFixed(1)} then ${x1.toFixed(1)} of ${plot.toFixed(1)}, a ${span1 / 1000} s view`);
    d.assert('between steps a mark does not move: the one at 10 s is at the same x in both frames',
      span0 === span1 && m0 === m1, `x ${m0.toFixed(3)} then ${m1.toFixed(3)} under a ${span1 / 1000} s view`);

    // hover a bin: the box under the strip says how many and the worst
    const cv = liveSpec.el, rc = cv.getBoundingClientRect();
    const many = b.drawn.find((m) => m.n > 1);
    const L = s.lanes().find((l) => l.id === 'frames');
    if (many) cv.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerType: 'mouse',
      clientX: rc.left + (rc.width - plot) + many.x + 0.5, clientY: rc.top + L.y + L.height / 2 }));
    const said = liveSpec.footer.says().join(' / ');
    d.assert('a bin under the pointer says how many marks it holds and the worst of them',
      /\d+ in [\d.]+ ms, worst: /.test(said) && /late|on time/.test(said), `the box says "${said}"`);
    cv.dispatchEvent(new PointerEvent('pointerleave', { bubbles: true, pointerType: 'mouse' }));

    s.zoomAt(60, x1);
    s.draw();
    const zoomed = s.binState('frames');
    s.resumeLive();
    s.draw();
    const back = s.binState('frames');
    d.assert('NEGATIVE CONTROL: zoomed in until the marks have room they draw one by one, and a double click puts the whole run back',
      zoomed && !zoomed.binned && zoomed.minGapPx >= zoomed.binPx && back?.binned && !s.live().held,
      zoomed ? `zoomed: ${zoomed.rows} rows one by one, ${zoomed.minGapPx?.toFixed(1)} px apart against a ${zoomed.binPx} px room; back: binned ${back?.binned}` : 'no state');

    // a stopped run's head stands still, on a strip of its own off to the side
    const spare = el('div');
    document.body.append(spare);
    const v2 = createStripView(spare, createDeck({ items: [], range: [0, 1000] }), { size: 'auto', live: true, lanes: [] });
    // and the view steps out only when the head reaches its right edge
    v2.strip.startLive(9150, { minSpan: 10000 });
    v2.strip.draw();
    const before = v2.strip.live().span;
    await new Promise((r) => setTimeout(r, 120));
    v2.strip.draw();
    const after = v2.strip.live().span;
    d.assert('a head reaching the right edge steps the view out to the next round span, once',
      before === 10000 && after === 20000, `${before / 1000} s with the head at 9.15 s, ${after / 1000} s once it passed 9.2 s`);
    v2.strip.startLive(0);
    await new Promise((r) => setTimeout(r, 120));
    v2.strip.stopLive();
    const f0 = v2.strip.wallPos();
    await new Promise((r) => setTimeout(r, 150));
    const f1 = v2.strip.wallPos();
    v2.destroy(); spare.remove();
    d.assert('a stopped run keeps its head where it stopped',
      f0 >= 100 && f0 === f1 && v2.strip.live().running === false, `stopped at ${f0?.toFixed(1)} ms and read ${f1?.toFixed(1)} ms 150 ms later`);
  }
  if (footSpec) {
    const box = footSpec.surface;
    const cb = footSpec.el.getBoundingClientRect();
    const fb = footSpec.footer.el.getBoundingClientRect();
    const seam = fb.top - cb.bottom;
    const edge = (n) => Math.round(parseFloat(getComputedStyle(n).borderTopWidth) || 0);
    d.assert('the strip and the box saying what is under the pointer are one surface',
      box.classList.contains('pos-glue') && Math.abs(seam - 1) <= 0.6
      && edge(box) === 1 && edge(footSpec.el) === 0 && edge(footSpec.footer.el) === 0,
      `seam ${seam.toFixed(1)} px, one edge of ${edge(box)} px round both, `
      + `${edge(footSpec.el)} and ${edge(footSpec.footer.el)} inside`);
  }
  {
    /**
     * The panel's defaults: with neither option a page still gets a presence badge and
     * full screen. The picture is read back from the canvas; pattern.mjs burns a clock in.
     * See lessons/page-kit-timeline.md#kit-timeline-47
     */
    if (vpSpec) {
      const first = vpSpec[0].panel;
      const btn = first.slots.right.querySelector('button');
      const r = btn?.getBoundingClientRect();
      d.assert('a panel comes with a status on the left and a square control on the right',
        !!first.slots.left.querySelector('.pos-pres') && !!r && Math.abs(r.width - r.height) <= 0.5
        && first.slots.centre.childElementCount === 0,
        r ? `the button is ${r.width.toFixed(1)} by ${r.height.toFixed(1)} px and the centre holds ${first.slots.centre.childElementCount}`
          : 'there is no control in the right slot');

      const ms = readBurned(vpSpec[0].ctx);
      d.assert('the picture in a panel is really being drawn, read back out of its own canvas',
        Number.isFinite(ms) && Math.abs(Date.now() - ms) < 60_000,
        Number.isFinite(ms) ? `the burned clock is ${Math.abs(Date.now() - ms)} ms from now`
          : 'nothing decoded, so the canvas is not showing the picture');

      let threw = false;
      try { first.mode('enormous'); } catch { threw = true; }
      d.assert(`a fullscreen mode outside ${FULL_MODES.join(', ')} is refused rather than ignored`,
        threw, threw ? 'it throws' : 'it accepted a mode that does not exist');
    }

  }

  if (SELFCHECK) {
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    /**
     * The footer under the strip is rewritten on every hover change, so it must not
     * change its own height. Fed the strip's own hit shape, { detail: [...] }, as
     * describe() hands onHover.
     * See lessons/page-kit-timeline.md#kit-timeline-48
     */
    if (footSpec?.footer) {
      /**
       * The check builds its own three-line footer rather than grading the one-line
       * specimen, so the check does not dictate what the specimen looks like. Appended
       * then removed, because a detached element has no height.
       * See lessons/page-kit-timeline.md#kit-timeline-49
       */
      const f = createStripFooter({ lines: 3 });
      footSpec.el.parentElement.append(f.el);
      const h = () => f.el.getBoundingClientRect().height;
      const idle = h();
      f.set({ detail: ['takes  0:03.2'] });
      const one = h();
      f.set({ detail: ['a', 'b', 'c', 'd', 'e', 'f'] });
      const six = h();
      const shown = f.says();
      f.set(null);
      const back = h();
      const empty = f.says()[0];
      d.assert('the box under the strip is one height saying six things, one thing, or nothing',
        idle > 0 && Math.abs(one - idle) < 0.5 && Math.abs(six - idle) < 0.5
        && Math.abs(back - idle) < 0.5 && shown.length === f.lines
        && shown[0] === 'a' && shown[1] === 'b' && empty === STRIP_FOOTER_EMPTY,
        `${idle.toFixed(1)} px empty, ${one.toFixed(1)} with one line, ${six.toFixed(1)} with six, `
        + `${back.toFixed(1)} back to nothing, ${f.lines} lines kept of six, and it says "${empty}"`);

      // A name too long ellipsizes rather than wrapping a line out of the box. Long
      // enough to overflow on any screen, not only on a phone.
      // See lessons/page-kit-timeline.md#kit-timeline-50
      const long = `${'PÄEVAKAJA. Kaevanduse miiti ja muud, '.repeat(8)}lõpp`;
      f.set({ detail: [long, 'the second line, which must survive it'] });
      const row0 = f.el.firstElementChild;
      const cut = row0.scrollWidth - row0.clientWidth;
      const tall = h();
      const second = f.says()[1];
      f.set(null);
      d.assert('a name too long for the box is cut off at the edge, not wrapped onto the line below',
        cut > 0 && Math.abs(tall - idle) < 0.5 && second.startsWith('the second line'),
        `${long.length} characters running ${cut} px past a ${row0.clientWidth} px line, still `
        + `${tall.toFixed(1)} px tall, and the line under it reads "${second}"`);
      f.el.remove();

      // And the specimen on the page really is the one line that was asked for.
      d.assert('the footer on show is one line, which is what this specimen was asked to be',
        footSpec.footer.lines === 1, `${footSpec.footer.lines} line(s)`);
    }

    /**
     * The second storey is the page's own row, moved, and there is one of it. Full by
     * the .pos-full class, which both real paths set and isFull reads, so no cover
     * lands over the page mid-check.
     * See lessons/page-kit-timeline.md#kit-timeline-51
     */
    if (vpStorey && vpUnder) {
      const p = vpStorey;
      const home = vpUnder.parentNode;
      vpUnder.dataset.kit = 'storey';
      p.el.classList.add('pos-full');
      p.mode('footer');                       // re-applies, which syncs the move
      const lifted = vpUnder.parentNode;
      const rows = getComputedStyle(p.el).gridTemplateRows.split(/\s+/).filter(Boolean).length;
      const copies = document.querySelectorAll('[data-kit="storey"]').length;
      p.el.classList.remove('pos-full');
      p.mode('footer');
      const returned = vpUnder.parentNode;
      delete vpUnder.dataset.kit;
      d.assert('the second storey holds the page’s own control row, moved, and puts it back',
        lifted?.classList.contains('pos-vp-under') && p.el.contains(lifted)
        && rows === 3 && copies === 1 && returned === home,
        `${copies} of it in the document, ${rows} storeys while full, `
        + `and it came back to the ${returned === home ? 'same' : 'wrong'} parent`);
    }

    /**
     * The way back out, last on purpose: two of these checks cover the screen and set
     * overflow: hidden. The exit is proved by pressing it, not by reading its wiring.
     * See lessons/page-kit-timeline.md#kit-timeline-52
     */
    {
      /**
       * Faded must mean unpressable: opacity: 0 needs pointer-events: none, measured on
       * a throwaway piece with a short idle, since EXIT_IDLE_MS would outlast the
       * harness's collector (400 ms after the last assert).
       * See lessons/page-kit-timeline.md#kit-timeline-53
       */
      const probeHost = el('div', 'pos-full');
      probeHost.style.cssText = 'position:fixed;left:-9999px;top:0;width:200px;height:120px';
      document.body.append(probeHost);
      const probe = createFullscreenExit(probeHost, { idleMs: 90 });
      const upPE = getComputedStyle(probe.el).pointerEvents;
      await nap(320);                       // the idle, then the 140 ms fade
      const faded = getComputedStyle(probe.el);
      const fadedPE = faded.pointerEvents, fadedOp = Number(faded.opacity);
      document.dispatchEvent(new PointerEvent('pointermove'));
      const backPE = getComputedStyle(probe.el).pointerEvents;
      probe.destroy();
      probeHost.remove();
      d.assert('a faded way out cannot be pressed, and any movement brings it back',
        upPE === 'auto' && fadedPE === 'none' && fadedOp === 0 && backPE === 'auto',
        `up ${upPE}, faded ${fadedPE} at opacity ${fadedOp}, ${backPE} again after a pointer moved, `
        + `on a 90 ms idle against the ${EXIT_IDLE_MS} ms a page gets`);
    }

    if (fsxSpec) {
      const { host, exit, out } = fsxSpec;
      await fsxSpec.go.onclick();
      await nap(200);                       // the 140 ms fade, on its way up
      const hb = host.getBoundingClientRect();
      const bb = exit.el.getBoundingClientRect();
      const cs = getComputedStyle(exit.el);
      const gapR = hb.right - bb.right, gapB = hb.bottom - bb.bottom;
      d.assert('the way out is inside the thing that went full, square, and off its bottom right corner',
        host.contains(exit.el) && Math.abs(bb.width - bb.height) <= 0.6
        /* A threshold, not === '1': opacity is animating (a 140 ms fade read 0.998744
           after 200 ms), and the faded state is 0.
           See lessons/page-kit-timeline.md#kit-timeline-54 */
        && parseFloat(cs.opacity) > 0.9 && cs.pointerEvents === 'auto'
        && gapR >= 10 && gapR < hb.width / 2 && gapB >= 10 && gapB < hb.height / 2,
        /* The detail names every clause, so a red says which one failed.
           See lessons/page-kit-timeline.md#kit-timeline-55 */
        `${bb.width.toFixed(1)} by ${bb.height.toFixed(1)} px, ${gapR.toFixed(1)} px off the right edge `
        + `and ${gapB.toFixed(1)} off the bottom, contained ${host.contains(exit.el)}, `
        + `opacity ${cs.opacity}, pointer-events ${cs.pointerEvents}`);

      exit.el.click();
      await nap(160);
      const stillFull = fsIsFull(host);
      const stillHost = document.documentElement.classList.contains('pos-faux-host');
      d.assert('pressing it gives the screen back, which is the half that cannot be read off the source',
        !stillFull && !stillHost && out.textContent === 'came back',
        stillFull ? 'it was pressed and the cover is still there'
          : `the cover is gone, the page scrolls again, and the specimen says "${out.textContent}"`);
    }
  }
  } // if (SELFCHECK)

  d.ready();
</script>

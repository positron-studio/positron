<script type="module">
  import { el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createStepGrid, cellSize as padWidth, PAD_MIN, RISE_MS, FALL_MS } from '/shell/step-grid.mjs';
  import { createEnvelopeView, createFilterView, createWaveShape, shapeFor, filterShapeFor }
    from '/shell/synth-view.mjs';
  import { OSC_WAVES, FILTER_TYPES } from '/shell/circuit-patch.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createField } from '/shell/field.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createSegment, GLYPHS, SEGMENTS, SCHEMES } from '/shell/segment.mjs';
  import { createPresenceButton } from '/shell/presence.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createGlue, createGlueRows } from '/shell/glue.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createPad, createPadGrid } from '/shell/pad.mjs';
  import { createFader, createFaderBank } from '/shell/fader.mjs';
  import { createPanelLayout } from '/shell/panel-layout.mjs';
  import { createInstrument, HEADER_STATES, HEADER_SAYS } from '/shell/instrument.mjs';
  import { createControlGrid } from '/shell/control-grid.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createInfoBox, createSwitchBox } from '/shell/info-box.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * Copied from the old one page /kit/, newest block first. section() takes no part
   * argument here, and every check is behind ?selfcheck=1.
   * See lessons/page-kit-devices.md#kit-devices-1
   */
  const { d, out, section, land, checkPage } = createKitPage({
    part: 'devices',
    what: "Instrument panels and the knobs, pads, faders and displays they are built from.",
  });

  /* `chanSpec` is the channel strip's holder and is read; `padSpec` is read by PAD.
     See lessons/page-kit-devices.md#kit-devices-2 */
  let chanSpec = null;       // the four channel lanes, each { lane, knob, pad, half, fader }
  // The segment displays by what each shows, so the checks compare them with each
  // other. These holders sit up here: a `let` declared below a block that reads it is
  // read in its dead zone, and section() swallows the throw.
  // See lessons/page-kit-devices.md#kit-devices-3
  let padPair = null;         // the two-lane grid in the PAD block
  let stepPads = null;        // two fully labelled pads, stacked
  let stepBand = null;        // the band drawn at `--ctl-step`, which is how it is read
  let namedPad = null, barePad = null;   // one with a top label and one without
  const dispSpec = new Map();
  let dispDot = null;         // the one field with a decimal point in it
  // Held apart from `dispSpec`: the width check is guarded on `dispSpec.size === 6`,
  // so a seventh field there would silence seven asserts instead of failing one.
  // See lessons/page-kit-devices.md#kit-devices-4
  let dispRefl = null;        // the field with no lamp behind it
  let panelWith = null;       // { panel, reading }  the absorber is on the block
  let panelWithout = null;    // { panel, reading }  NEGATIVE CONTROL: no absorber
  let panelGrowBlk = null;    // the dashed block that absorbs the slack
  let seamRail = null;        // { panel, seam, band }  a seam crossing a side plate's rail
  let seamPlain = null;       // { panel, seam, band }  the same seam on a case with no rail
  /**
   * SEGMENT DISPLAY: six fields of one size, each showing something different, so the
   * checks compare them: same width for `1` and `8`, blank rather than `000`, dashes
   * when too wide. No control in a .pos-controls row (harnesses press it by position).
   * See lessons/page-kit-devices.md#kit-devices-5
   */
  /**
   * PANEL: two panels, the second the same with the absorber class left off, as the
   * negative control. No keyboard (a two octave one measured 1018 px against a 688 px
   * column); a dashed block absorbs the slack. No await, no .pos-controls control.
   * See lessons/page-kit-devices.md#kit-devices-6
   */
  // Specimen holders for the top blocks, declared here so none is read in its dead
  // zone. `gridSpec`, not `padSpec`: the PAD block already holds a `padSpec`.
  // See lessons/page-kit-devices.md#kit-devices-7
  let cgSpec = null;         // { six, four }  the control grids
  let handKnobs = null;      // the KNOB block's four, the last of which has a hand
  let instSpec = null;       // { named }  the cased instrument
  let headSpec = null;       // { acting, reporting, presses }  the two headers
  let stepSpec = null;       // { stepped, quarters, free }  the stepped knobs
  let gridSpec = null;        // { edit, read, phone, holder }
  let namedSpec = null;       // { named }  the step grid with its rows named in words
  let trigSpec = null;        // { held, free }  the triggered scope and a free one beside it
  let envSpec = null;         // { one, two, three, flat }
  let filtSpec = null;        // { live, deep, refused }
  let waveSpec = null;        // { drawnViews, pulse, blend, two, measured, drawnNames }
  // Declared with the rest, not beside their blocks, so a moved block cannot leave a
  // `const` to be read in its dead zone.
  // See lessons/page-kit-devices.md#kit-devices-8
  let ipanelSpec = null;      // { sketch, stomp, box16, desk, foot, pic, power, pick }
  let kgSpec = null;          // { wide, phone, frame }  the knob grids
  let rowsSpec = null;        // the glued rows specimens, by name
  /**
   * PAD GRID, lifted from /tom/ once /pack/ grew a second copy. A read only grid's pads
   * are not buttons: no tab stop, no lift, no focus ring. `rate` needs a `whose`, and
   * createStepGrid throws without it. The play button is in the box, not .pos-controls.
   * See lessons/page-kit-devices.md#kit-devices-9
   */
  /**
   * One grid with the standard createTransportBar glued above it, as other pages do.
   * The read only shape and the 320 px scroller are graded without a browser in
   * demo/shell/step-grid-test.mjs; their cursor, opacity and tab stops are not checked.
   * See lessons/page-kit-devices.md#kit-devices-10
   */
  /**
   * Two specimens: a seam reaches the case's inner edges on every panel, but only a
   * case with a side plate has a rail to cross and a row count to be placed by. The
   * band under the seam is a dashed block, since what is shown is where a rule lands.
   * See lessons/page-kit-devices.md#kit-devices-11
   */


  /** Info and switch boxes: a knob's column that shows a value (gauge, lamp, count) or holds a switch. */
  section('INFO AND SWITCH BOXES',
    'A number over its name, a readout cell in a knob row, and a box holding a sliding switch.',
    `createInfoBox({ label: 'temp', unit: '°C' })   // .set(v), blank until the first
createSwitchBox({ label: 'light', onChange })    // a switch, role switch
createSwitch({ label, onChange })                // the switch alone
createKnobGrid([{ name, knob: box }, ...], { row: true })`,
    (box) => {
      const t = createInfoBox({ label: 'temp', unit: '°C' });
      const b = createInfoBox({ label: 'button' });
      const k = createKnob({ label: 'knob', min: 0, max: 127, value: 64 });
      const row = createKnobGrid([{ name: 'temp', knob: t }, { name: 'button', knob: b }, { name: 'knob', knob: k }], { row: true });
      const sw = createSwitchBox({ label: 'light', onChange: (on) => b.set(on ? 'down' : 'up') });
      const row2 = createKnobGrid([{ name: 'light', knob: sw }], { row: true });
      t.set(27.4); b.set('up');
      box.append(row.el, row2.el);
    });

  /**
   * knob.receive(v, { from }) glides the dial to a value from outside, lights it and
   * calls nothing back; a drag still sends. The stand-in hand is a 2.2 s timer over
   * four sources, opens nothing and stops while the page is hidden.
   * See lessons/page-kit-devices.md#kit-devices-12
   */
  let rxSpec = null;          // { knobs, sent }  the received knobs
  section('KNOB TURNED FROM ELSEWHERE',
    'A knob whose value arrives from somewhere else turns on its own, glides there and lights for a moment, and sends nothing.',
    `k.receive(v, { from: 'device' })   // glide 160 ms, mark, no onInput
k.set(v, { quiet: true })          // a jump, nothing called
// a drag or a key calls onInput, which is what sends
k.received()   // { n, ignored, last, from, gliding }`,
    (box) => {
      const o = out('a stand-in hand turns one knob every 2.2 s');
      const sent = { n: 0 };
      const FROM = ['device', 'midi', 'patch', 'relay'];
      const knobs = ['M1', 'M2', 'M3', 'M4'].map((label, i) => createKnob({
        label, sub: FROM[i], min: 0, max: 127, value: 64,
        onInput: (v) => { sent.n++; o.textContent = `${label} sent ${v}, by a person`; },
      }));
      const grid = createKnobGrid(knobs, { row: true });
      rxSpec = { knobs, sent };
      let at = 0;
      setInterval(() => {
        if (document.hidden) return;
        const i = at++ % knobs.length;
        const v = 8 + Math.floor(Math.random() * 112);
        knobs[i].receive(v, { from: FROM[i] });
        o.textContent = `${knobs[i].el.querySelector('.pos-knob-lab').textContent} received ${v} from ${FROM[i]}, nothing sent`;
      }, 2200);
      box.append(grid.el, o);
    });

  /**
   * The scope's triggered mode: a hit's window is held from its onset until the next
   * hit, the previous one faint underneath; free running stays the default. The Hit
   * button makes the AudioContext and one 60 ms burst, in the box, not .pos-controls.
   * See lessons/page-kit-devices.md#kit-devices-13
   */
  section('TRIGGERED SCOPE',
    'A scope that waits for a hit, draws that hit from its onset and holds it still until the next one.',
    `const scope = createWaveShape({ name: 'kick', mode: 'triggered',
  window: 250, fade: 1, axes: { x: '250 ms' } })
scope.listen(analyser)          // once there is audio
scope.trigger(atMs)             // a hit sounds at atMs, performance.now()'s clock
scope.flat()                    // stopped`,
    (box) => {
      const held = createWaveShape({ name: 'triggered', mode: 'triggered', window: 250, fade: 1, colour: '--hi', axes: { x: '250 ms' } });
      let actx = null, an = null, n = 0;
      const hit = createButtonGroup({ buttons: [{ id: 'hit', label: 'Hit', onPress: () => {
        if (!actx) {
          actx = new AudioContext();
          an = actx.createAnalyser(); an.fftSize = 32768;
          const z = actx.createGain(); z.gain.value = 0; an.connect(z); z.connect(actx.destination);
          held.listen(an);
        }
        actx.resume();
        // A falling sine burst, a little different each press, sounding 100 ms from now.
        const t = actx.currentTime + 0.1, o = actx.createOscillator(), g = actx.createGain();
        o.frequency.setValueAtTime(160 + (n++ % 4) * 40, t);
        o.frequency.exponentialRampToValueAtTime(50, t + 0.08);
        g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(an); o.start(t); o.stop(t + 0.22);
        const ts = actx.getOutputTimestamp();
        held.trigger(ts.performanceTime + (t - ts.contextTime) * 1000);
      } }] });
      trigSpec = { held };
      box.classList.add('kit-wide');
      box.append(held.el, hit.el);
    });

  /**
   * The drum grid: createStepGrid with no `fixed`, so no label column; each pad's hover says
   * its row's name. No control in a .pos-controls row.
   * why: lessons/page-kit-devices.md#kit-devices-14
   */
  section('DRUM GRID',
    'The step grid the drum pages use, with no row names beside it. Hover a pad for its row.',
    `createStepGrid({ strip, rows: 4, steps: 16,
  label: (r) => ['kick', 'snare', 'open hat', 'closed hat'][r],
  ticks: true })`,
    (box) => {
      const wrap = el('div', 'kit-pg');
      const strip = el('div', 'kit-pg-strip');
      wrap.append(strip);
      const NAMES = ['kick', 'snare', 'open hat', 'closed hat'];
      const named = createStepGrid({ strip, rows: 4, steps: 16, label: (r) => NAMES[r], ticks: true });
      for (const [r, s] of [[0, 0], [0, 4], [0, 8], [0, 12], [1, 4], [1, 12], [2, 2], [2, 6], [2, 10], [2, 14],
        [3, 0], [3, 3], [3, 4], [3, 7], [3, 8], [3, 11], [3, 12], [3, 15]]) named.set(r, s, true, 'quiet');
      namedSpec = { named, NAMES };
      box.classList.add('kit-wide');
      box.append(wrap);
    });

  /**
   * KNOB GRID: two of the six are off, since the slot an off knob keeps is what the
   * component is for. The same six in the 320 px frame derive fewer columns, where a
   * fixed column count would spill. No control in a .pos-controls row.
   * See lessons/page-kit-devices.md#kit-devices-15
   */
  section('KNOB GRID',
    'Every knob in a box of its own, on a grid that keeps the box when a knob is switched off.',
    `const g = createKnobGrid(knobs)          // or a Map of name to knob
g.show('wave', false)    // the box stays, the knob dims
g.show('wave', true)
createKnobGrid(knobs, { cols: 3 })        // at most three across`,
    (box) => {
      box.classList.add('kit-wide');
      const o = out('nothing turned');
      const mk = () => [
        ['FREQ', 64], ['WAVE', 2, 0, 3, 1], ['CUTOFF', 90], ['RES', 30], ['ATTACK', 10], ['RELEASE', 50],
      ].map(([label, value, min = 0, max = 127, step]) => createKnob({
        label, min, max, step, value, onInput: (v) => { o.textContent = `${label.toLowerCase()} ${v}`; },
      }));
      const wide = createKnobGrid(mk());
      wide.show('wave', false);
      wide.show('attack', false);
      const frame = el('div', 'kit-phone');
      const phone = createKnobGrid(mk());
      phone.show('wave', false);
      phone.show('attack', false);
      frame.append(phone.el);
      kgSpec = { wide, phone, frame };
      box.append(wide.el, el('p', 'kit-cap', 'the same six in a 320 px frame'), frame, o);
    });

  /**
   * INSTRUMENT PANEL: every panel is an instrument somebody could operate, built from
   * the kit's controls, and the four differ in shape. Each in its own tab; `hash: false`
   * so a sandbox does not write the address.
   * See lessons/page-kit-devices.md#kit-devices-16
   */
  section('INSTRUMENT PANEL',
    'A picture, rows of controls, a keyboard and a nameplate, glued into one object, in five shapes, the last with a switch and a picker on its foot.',
    `createInstrumentPanel({
  viz:   filter.el,                                 // edge to edge
  rows:  [[cutoff, res, drive], [a, d, s, r]],      // top to bottom
  keys:  kb.el,
  plate: { name: 'NOLA', patch: 'Rhodes Mk I' },
  // or plate: { name: 'FAU', status: power, patch: picker }, a control at each end
})
p.addRow([lfo, depth])        // always above the keys and the foot
p.patch('Wurlitzer 200A')     // rewrite the foot's right half, shown as written
p.shape()                     // ['viz','controls','keys','plate']`,
    (add) => {
      const knob = (label, value) => createKnob({ label, min: 0, max: 127, value });

      /* 1. THE SKETCH, WHOLE. Every row kind the component has, in order. */
      const pic = createFilterView({ label: 'filter', type: 'low pass 24dB', freq: 78, resonance: 40 });
      const kb = createKeyboard(el('div'), {
        base: 48, letters: false,
        onDown: (n) => kb.lightNote(n, true),
        onUp: (n) => kb.lightNote(n, false),
      });
      const sketch = createInstrumentPanel({
        viz: pic.el,
        rows: [
          [knob('CUTOFF', 78), knob('RES', 40), knob('DRIVE', 20)],
          [knob('ATTACK', 8), knob('DECAY', 44), knob('SUSTAIN', 96), knob('RELEASE', 30)],
        ],
        /* `kb.el`, not the host: createKeyboard appends into its parent, so the host puts the
           keyboard three levels under the surface and `.pos-glue > * > .kbd` reaches two.
           See lessons/page-kit-devices.md#kit-devices-17 */
        keys: kb.el,
        plate: { name: 'NOLA', patch: 'Rhodes Mk I' },
      });
      /* redraw(): the component resizes on an observation, a frame away, and this page reads
         the pixels synchronously. synth-view.mjs publishes this call for that reason.
         See lessons/page-kit-devices.md#kit-devices-18 */
      pic.redraw();

      /* 2. No picture and no keyboard. A pedal is four knobs and a name.
         See lessons/page-kit-devices.md#kit-devices-187 */
      const stomp = createInstrumentPanel({
        rows: [[knob('MIX', 40), knob('TIME', 88), knob('TONE', 64), knob('REPEATS', 52)]],
        plate: { name: 'POSITRON', patch: 'Spring reverb' },
      });

      /* 3. Pads where the keys go. `start`, because two knobs centred over sixteen pads leave
         a band of empty surface; a drum box puts its tempo at one end.
         See lessons/page-kit-devices.md#kit-devices-19 */
      const box16 = createInstrumentPanel({
        rows: [[[knob('TEMPO', 100), knob('SWING', 12)], { align: 'start' }]],
        keys: createPadGrid({ cols: 8, rows: 2, pad: (x, y) => ({ top: String(y * 8 + x + 1) }) }).el,
        plate: { name: 'POSITRON', patch: 'Sixteen' },
      });

      /* 4. Rows and nothing else. No picture, no keyboard, no foot.
         See lessons/page-kit-devices.md#kit-devices-188 */
      const desk = createInstrumentPanel({
        rows: [
          [createFader({ label: 'CH1', min: 0, max: 127, value: 96 }),
           createFader({ label: 'CH2', min: 0, max: 127, value: 60 }),
           createFader({ label: 'CH3', min: 0, max: 127, value: 108 }),
           createFader({ label: 'CH4', min: 0, max: 127, value: 44 })],
          [knob('LOW', 64), knob('MID', 70), knob('HIGH', 58)],
        ],
      });

      /* Four blocks of the page, not four things in a box. No caption under each: the four
         differ in shape and the eye can see that.
         See lessons/page-kit-devices.md#kit-devices-20 */
      /* 5. A switch and a picker on the foot: name and power switch at the start, patch
         picker at the end. A `patch` control is the far end by construction and the panel
         strips its .pos-pick-l, so none is built; patch names stay as written.
         See lessons/page-kit-devices.md#kit-devices-21 */
      const kb2 = createKeyboard(el('div'), {
        base: 48, letters: false,
        onDown: (n) => kb2.lightNote(n, true),
        onUp: (n) => kb2.lightNote(n, false),
      });
      const patches = ['Organ', 'Rhodes', 'Clarinet'];
      let atPatch = 0;
      const pick = createPicker({
        what: 'patch',
        prev: () => pick.show(patches[atPatch = (atPatch + 2) % 3], atPatch),
        next: () => pick.show(patches[atPatch = (atPatch + 1) % 3], atPatch),
        onPick: (i) => pick.show(patches[atPatch = i], i),
      });
      pick.options(patches, 0);
      let footOn = false;
      const power = createPresenceButton({
        of: 'POSITRON', can: HEADER_STATES, says: HEADER_SAYS, state: 'offline', showName: false,
        press: () => power.set((footOn = !footOn) ? 'online' : 'offline'), aria: 'switch POSITRON on and off',
      });
      const foot = createInstrumentPanel({
        keys: kb2.el,
        plate: { name: 'POSITRON', status: power, patch: pick },
      });

      add(sketch, stomp, box16, desk, foot);
      ipanelSpec = { sketch, stomp, box16, desk, foot, pic, power, pick };
    }, { bare: true });

  /**
   * GLUED ROWS, the base the block above is built on, shown as a station strip so it is
   * not an instrument. Remove shows the mechanism: a 1 px gap over a line-coloured ground,
   * and a display: none child takes no gap, so the surface closes with no orphan rule.
   * See lessons/page-kit-devices.md#kit-devices-22
   */
  section('GLUED ROWS',
    'Rows on one surface with a hairline between them, in six shapes: a station strip, a settings list, a display with its buttons, a form, the strip with a row hidden, and three pictures.',
    `const g = createGlueRows();
g.row([station], { align: 'start' })
g.row([label, control], { align: 'between' })   // one against each edge
g.row([send], { align: 'end' })
g.row(scope.el, { pad: false })                  // edge to edge, which is what a picture wants
row.hidden = true                                // the seam goes with it
ROW_ALIGN  // start, center, end, between`,
    (add) => {
      /* No loop button and no captions: the note names the six and the eye tells them apart.
         See lessons/page-kit-devices.md#kit-devices-23 */
      const cap = (t) => el('div', 'panel-cap', t);

      /* 1. A STATION STRIP. What to listen to, how fast, what is coming out. */
      const strip = createGlueRows();
      const stations = ['Raadio 2', 'Klassikaraadio', 'Vikerraadio'];
      let atStation = 0;
      const hop = (d) => { atStation = (atStation + d + stations.length) % stations.length; return stations[atStation]; };
      const station = createPicker({
        label: '', what: 'station',
        prev: () => station.show(hop(-1)), next: () => station.show(hop(1)),
        onPick: (name) => station.show(name),
      });
      station.show(stations[atStation]);
      const speed = createChoice({ label: 'speed', options: [['0.5', 0.5], ['1', 1], ['2', 2]], at: 1 });
      const shape = createWaveShape({ name: 'sawtooth' });
      /* No `between` in this block: on a shrink-to-fit surface the ends came out 8 px apart
         against an 8 px gap. `between` spreads only across a row with an intrinsic width,
         like the keyboard, where the panel's plate row already grades it.
         See lessons/page-kit-devices.md#kit-devices-24 */
      const rowOne = strip.row([station], { align: 'start' });
      strip.row([speed], { align: 'start' });
      const rowPic = strip.row(shape.el, { pad: false });
      shape.redraw();

      /* 2. A SETTINGS LIST. A name against one edge and its control against the
            other, three times, which is the row `between` exists for and which
            needs two children to mean anything. */
      /* `start`, not `between`: every row here is short and the surface is its own size, so
         `between` put the ends 8 px apart, the same as the gap.
         See lessons/page-kit-devices.md#kit-devices-25 */
      /* `grid`: three label-and-control rows on one column pair. Photographed
         without it: BOARD is five letters to REVERB's six and its badge sat 10 px
         left of the other two controls. */
      const settings = createGlueRows({ grid: true });
      settings.row([cap('REVERB'), createChoice({ label: '', options: [['dry', 0], ['room', 1], ['hall', 2]], at: 1 })], { align: 'start' });
      let oct = 0;
      const octave = createStepper({ what: 'octave', prev: () => String(--oct), next: () => String(++oct) });
      settings.row([cap('OCTAVE'), octave], { align: 'start' });
      settings.row([cap('MODE'), createChoice({ label: '', options: [['mono', 0], ['poly', 1]], at: 1 })], { align: 'start' });

      /* 3. A display over its buttons: a seven segment field as a picture row, and the group
         that drives it under it.
         See lessons/page-kit-devices.md#kit-devices-189 */
      const meter = createGlueRows();
      const seg = createSegment({ digits: 3 });
      seg.set(127);
      meter.row(seg.el, { align: 'center' });
      let held = 127;
      const bank = createButtonGroup({
        label: '', buttons: [
          { id: 'down', label: '−', onPress: () => seg.set(held = Math.max(0, held - 1)) },
          { id: 'up', label: '+', onPress: () => seg.set(held = Math.min(999, held + 1)) },
          { id: 'reset', label: 'RESET', onPress: () => seg.set(held = 127) },
        ],
      });
      meter.row([bank], { align: 'start' });

      /* 4. A FORM. Two fields and the one action, pushed to the end, which is
            the row `end` exists for. */
      const form = createGlueRows();
      form.row([createField({ label: 'title', value: 'Rehearsal moved', grow: 'wide' })], { align: 'start' });
      form.row([createField({ label: 'tags', placeholder: 'comma separated', grow: 'wide' })], { align: 'start' });
      const send = el('button', '', 'SAVE');
      send.type = 'button';
      form.row([send], { align: 'end' });

      /* 5. The strip with its picture hidden: two rows, one seam, no orphan line. The assert
         at the foot toggles the first strip's picture; this one stands still to be seen.
         See lessons/page-kit-devices.md#kit-devices-26 */
      const hidden = createGlueRows();
      const station2 = createPicker({
        label: '', what: 'station',
        prev: () => station2.show(stations[0]), next: () => station2.show(stations[0]),
        onPick: (name) => station2.show(name),
      });
      station2.show(stations[0]);
      hidden.row([station2], { align: 'start' });
      hidden.row([createChoice({ label: 'speed', options: [['0.5', 0.5], ['1', 1], ['2', 2]], at: 1 })], { align: 'start' });
      const shape2 = createWaveShape({ name: 'sawtooth' });
      const hiddenPic = hidden.row(shape2.el, { pad: false });
      hiddenPic.hidden = true;

      /* 6. Three pictures and nothing else: every row edge to edge, so the surface is three
         pictures and two hairlines.
         See lessons/page-kit-devices.md#kit-devices-190 */
      const scopes = createGlueRows();
      const waves = ['sawtooth', 'square', 'triangle'].map((name) => createWaveShape({ name }));
      for (const w of waves) scopes.row(w.el, { pad: false });
      for (const w of waves) w.redraw();

      /* 7. FULL WIDTH, WHICH IS WHERE `between` IS REAL. The same station strip
            told to take the width it is given; its speed row now has an edge to
            put the badge against. */
      const stripFull = createGlueRows({ full: true });
      const station3 = createPicker({ label: '', what: 'station', prev: () => station3.show(stations[0]), next: () => station3.show(stations[0]), onPick: (x) => station3.show(x) });
      station3.show(stations[1]);
      /* the station at one end and MUTE at the other is a radio strip's first
         row, and it is wide enough that the same row wraps in the frame below */
      const fullBetween = stripFull.row([station3, (() => { const b = el('button', '', 'MUTE'); b.type = 'button'; return b; })()], { align: 'between' });
      stripFull.row([createChoice({ label: 'speed', options: [['0.5', 0.5], ['1', 1], ['2', 2]], at: 1 })], { align: 'start' });
      const shape3 = createWaveShape({ name: 'square' });
      stripFull.row(shape3.el, { pad: false });
      shape3.redraw();

      /* 8. A FULL-WIDTH SETTINGS LIST: the label column is as wide as the widest
            label and every control starts on the same line, across the page. */
      const settingsFull = createGlueRows({ full: true, grid: true });
      settingsFull.row([cap('INSTRUMENT'), createChoice({ label: '', options: [['piano', 0], ['rhodes', 1], ['wurli', 2]], at: 1 })]);
      settingsFull.row([cap('VELOCITY'), createChoice({ label: '', options: [['soft', 0], ['medium', 1], ['hard', 2]], at: 1 })]);
      settingsFull.row([cap('TUNING'), createStepper({ what: 'cents', prev: () => '', next: () => '' })]);

      /* 9. The same two rows in a 320 px frame: the between row wraps into two left-aligned
         lines, the start row wraps as a cluster. The frame's width decides, not the window's,
         so the harness grades a phone layout at desk width.
         See lessons/page-kit-devices.md#kit-devices-27 */
      const narrow = el('div', 'kit-phone kit-narrow');
      const stripNarrow = createGlueRows({ full: true });
      const station4 = createPicker({ label: '', what: 'station', prev: () => station4.show(stations[0]), next: () => station4.show(stations[0]), onPick: (x) => station4.show(x) });
      station4.show(stations[1]);
      const narrowBetween = stripNarrow.row([station4, (() => { const b = el('button', '', 'MUTE'); b.type = 'button'; return b; })()], { align: 'between' });
      const clusterNarrow = createGlueRows({ full: true });
      const clusterRow = clusterNarrow.row(['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'].map((t) => { const b = el('button', '', t); b.type = 'button'; return b; }), { align: 'start' });
      narrow.append(stripNarrow.el, clusterNarrow.el);

      add(strip, settings, meter, form, hidden, scopes, stripFull, settingsFull, narrow);
      rowsSpec = { g: strip, rowOne, rowPic, shape, settings, meter, form, hidden, hiddenPic, scopes, waves,
        stripFull, fullBetween, settingsFull, stripNarrow, narrowBetween, clusterNarrow, clusterRow, narrow };
    }, { bare: true });

  section('PANEL SEAM',
    'A rule across a panel from one inner edge of its case to the other.',
    `const p = createPanelLayout({ side: null, plate: { lines: ['SEAM'], place: 'side' } });
p.seam()                      // a rule, edge to edge of the case
p.band(keysBox)               // a block stacked across the case, under the strip
inst.seam(); inst.band(el)    // the same two, forwarded by createInstrument`,
    (box) => {
      box.classList.add('kit-wide');

      /**
       * One panel built twice, with and without a side plate, from one function so the two
       * can be compared.
       * See lessons/page-kit-devices.md#kit-devices-28
       */
      const build = (rail) => {
        const p = createPanelLayout({
          side: null,
          plateSide: 'left',
          plate: rail ? { lines: ['SEAM'], place: 'side' } : { lines: ['SEAM'], place: 'end' },
          strip: { tabindex: 0, role: 'group', label: 'the panel’s strip' },
        });
        p.flow.append(el('div', 'kit-blk', 'the strip, which is band one'));
        const seam = p.seam();
        const band = p.band(el('div', 'kit-blk', 'a band, across the whole case'));
        /* A second band with no seam: across a seam the distance is inset, rule, inset, band to
           band it is two insets. /shape/ measured 1.0 px where 40.0 was meant.
           See lessons/page-kit-devices.md#kit-devices-29 */
        const band2 = p.band(el('div', 'kit-blk', 'a second band, no seam between them'));
        box.append(p.el);
        return { panel: p, seam, band, band2 };
      };

      box.append(el('p', 'kit-cap', 'a side plate, so the case is a grid and the rule crosses the rail'));
      seamRail = build(true);
      box.append(el('p', 'kit-cap', 'no side plate, which is a flex case and needs no row count'));
      seamPlain = build(false);
    });

  /**
   * INSTRUMENT HEADER: the patch selector is centred on the case, not between unequal
   * neighbours (a grid with equal outer tracks), asserted against the case's box with the
   * naive answer asserted elsewhere. A status with an action is a button, else a badge.
   * See lessons/page-kit-devices.md#kit-devices-30
   */
  section('INSTRUMENT HEADER',
    'A status control at one end and the nameplate at the other, with the patch '
    + 'selector sitting on the case’s own centre rather than between them.',
    `createInstrument({
  name: 'PLAI',
  header: {
    online: { state: 'online', press: () => connect() },   // no press, no button
    patch: createPicker({ what: 'patch', prev, next }),
  },
})
inst.online.set('offline')    // green to grey, the kit's one badge
inst.head                     // the row, a 1fr auto 1fr grid on the case`,
    (box) => {
      const o = out('nothing pressed');
      let pressed = 0;

      /* The acting case: a press really flips the state, and the state is the
         page's to hold. Nothing here connects to anything, and that is the
         page's business rather than the component's. */
      const acting = createInstrument({
        name: 'PLAI',
        panel: { side: 'left', cls: { fixed: 'kit-panelcol' } },
        header: {
          online: {
            state: 'online',
            press: () => {
              pressed++;
              const next = acting.online.state() === 'online' ? 'offline' : 'online';
              acting.online.set(next);
              o.textContent = `PLAI ${next === 'online' ? 'enabled' : 'disabled'}`;
            },
          },
          patch: createPicker({
            label: '', what: 'patch',
            prev: () => 'BELL 3', next: () => 'BELL 5',
            onPick: (name) => { o.textContent = `patch ${name}`; },
          }),
        },
      });
      acting.fixed.append(createKnob({ label: 'FREQ', min: 0, max: 127, value: 64 }).el);
      acting.add(el('div', 'kit-blk', 'the flow, which is what scrolls'));

      /* The reporting case, with outer contents deliberately narrower than the first: if the
         centre were balanced between neighbours, the two selectors would differ. Negative control.
         See lessons/page-kit-devices.md#kit-devices-31 */
      const reporting = createInstrument({
        name: 'MODEL 12', maker: '',
        panel: { side: 'left', cls: { fixed: 'kit-panelcol' } },
        header: {
          online: { state: 'offline' },
          patch: createPicker({
            label: '', what: 'patch',
            prev: () => 'INIT', next: () => 'INIT',
            onPick: (name) => { o.textContent = `patch ${name}`; },
          }),
        },
      });
      reporting.fixed.append(createFader({ label: 'CH1', min: 0, max: 127, value: 30 }).el);
      reporting.add(el('div', 'kit-blk', 'no maker, so the plate is one line'));

      headSpec = { acting, reporting, presses: () => pressed };
      box.classList.add('kit-wide');
      box.append(
        el('p', 'kit-cap', 'a press switches it, so the control is a button'), acting.el,
        el('p', 'kit-cap', 'nothing to press, so the status is a badge and not one'), reporting.el,
        o);
    });

  /**
   * STEPPED KNOB: the component rounds, so the needle and value agree; the assert reads
   * the needle's angle. A pixel moves a one to eight knob 0.039, so rounding each pixel
   * never moves it; node demo/shell/knob-test.mjs grades the accumulator.
   * See lessons/page-kit-devices.md#kit-devices-32
   */
  section('STEPPED KNOB',
    'A knob that lands only on whole steps, with the needle on the step rather than '
    + 'between two of them.',
    `createKnob({ label: 'VOICES', min: 1, max: 8, step: 1, value: 4 })
createKnob({ label: 'FM', min: -1, max: 1, ends: ['-', '+'] })   // no step
k.value()        // always on a step, whatever moved it`,
    (box) => {
      box.classList.add('kit-wide');
      const o = out('nothing pressed');
      /* Eight voices, which is the control this was built for. */
      const stepped = createKnob({
        label: 'VOICES', sub: '1 to 8', min: 1, max: 8, step: 1, value: 4,
        title: 'a voice count, which can only be a whole number',
        onInput: (v) => { o.textContent = `voices ${v}`; },
      });
      /* A fractional step, because the rule is about landing on a step rather
         than about being an integer. */
      const quarters = createKnob({
        label: 'RATIO', sub: 'by a quarter', min: 0, max: 2, step: 0.25, value: 1,
        onInput: (v) => { o.textContent = `ratio ${v}`; },
      });
      /* Negative control: a knob with no step must stay continuous, or a leaked snap would
         quantise every knob on the site with every assert above green.
         See lessons/page-kit-devices.md#kit-devices-33 */
      const free = createKnob({
        label: 'FM', sub: 'bipolar', min: -1, max: 1, value: 0, home: 0,
        ends: ['-', '+'],
        onInput: (v) => { o.textContent = `fm ${v}`; },
      });
      stepSpec = { stepped, quarters, free };
      box.append(createKnobBank([stepped, quarters, free], {}).el, o);
    });

  section('CONTROL GRID',
    'Any number of controls across by any number down, with the column pitch widened '
    + 'to the row pitch so the working surfaces land on a square lattice.',

grid.pitch()        // the measured square, written as --cg-pitch
grid.centres()      // where each dial really is, for a check`,
    (box) => {
      const o = out('nothing pressed');
      const mk = (label, sub) => createKnob({
        label, sub, min: 0, max: 127, value: 64,
        onInput: (v) => { o.textContent = `${label} ${v}`; },

      /* Six controls as three across and two down, and the labels are
         deliberately uneven: `FM` against `HARMONICS` is what makes the widest
         cell rather than the first cell decide the pitch. */
      const six = createControlGrid({
        cols: 3, gap: 10,
        items: [mk('FM', 'CC 1'), mk('HARMONICS', 'CC 2'), mk('TIMBRE', 'CC 3'),
          mk('MORPH', 'CC 4'), mk('DECAY', 'CC 5'), mk('COLOUR', 'CC 6')],
      });
      /* Four as two by two, which is the shape that was reported. */
      const four = createControlGrid({
        cols: 2, gap: 10,
        items: [mk('FREQ', '24 to 96'), mk('HARMO', '0 to 1'),
          mk('TIMBRE', '0 to 1'), mk('MORPH', '0 to 1')],
      });
      /**
       * Faders on the same lattice are not checked in a browser. control-grid-test.mjs
       * grades pitchFor without one; a stylesheet rule that suits only knobs would pass here.
       * See lessons/page-kit-devices.md#kit-devices-34
       */
      cgSpec = { six, four };
      box.classList.add('kit-wide');
      box.append(el('p', 'kit-cap', 'three by two, with uneven labels'), six.el,
        el('p', 'kit-cap', 'two by two, the shape that was reported'), four.el, o);

  /**

  section('INSTRUMENT',

inst.fixed.append(knob.el)        // the column that does not scroll
inst.add(row)                     // the flow that does`,

      const named = createInstrument({

      named.fixed.append(
        createKnob({ label: 'FREQ', min: 0, max: 127, value: 64,

          onPress: () => { o.textContent = 'triggered'; } }).el,
      );
      const row = el('div', 'panel-row kit-panelrow');
      row.append(createPadGrid({ cols: 16, pad: (x) => ({ top: String(x + 1) }) }).el);

  /**
   * STEP GRID: one grid labelled on both axes and a bare one as the negative control.
   * `ticks` numbers the beats, not the steps; the ruler keeps its --pg-ruler height
   * either way. The bare grid is asserted by absence: no label column, no ruler numbers.
   * See lessons/page-kit-devices.md#kit-devices-36
   */
  section('STEP GRID',
    'Rows of square pads over a ruler, with the standard transport glued above them '
    + 'and a second grid carrying no labels on either axis.',
    `const grid = createStepGrid({
  fixed, strip, rows: 6, steps: 16,
  label: (r) => String(r),                // omit fixed and there is no column
  ticks: true,                            // numbers the BEATS, never the steps
  silent: (r) => r === 4,                 // lit but grey: it can make no sound
  rate: { bpm: 120, whose: 'this page' }, // no whose, no clock, and it throws
})
createTransportBar(host, deck, { publish: false, scrub: false, loop: false,
  command: { play: () => grid.clock.play(), pause: () => grid.clock.stop() } })
createGlue(host, grid.el)                 // the bar over the thing it drives`,
    (box) => {
      const wrap = el('div', 'kit-pg');
      const fixed = el('div');
      const strip = el('div', 'kit-pg-strip');
      wrap.append(fixed, strip);

      const STEPS = 16;
      const edit = createStepGrid({
        fixed, strip, rows: 6, steps: STEPS,
        label: (r) => String(r),
        /* Both axes: rows named by `label`, a beat number under every fourth step by `ticks`.
           `corner` is the cell above the label column.
           See lessons/page-kit-devices.md#kit-devices-37 */
        ticks: true,
        corner: 'beat',
        title: (r) => (r === 4
          ? 'this row has nothing behind it, so its steps are silent'
          : `row ${r}, press to hear it`),
        // Rows 0 to 3 and 5 can be heard and row 4 cannot, so a lit pad on it stays grey:
        // brightness says whether a pad can make a sound.
        // See lessons/page-kit-devices.md#kit-devices-38
        canPress: (r) => r !== 4,
        silent: (r) => r === 4,
        onLabel: (r) => { edit.lit(r); },
        onSeek: (s) => { edit.at(s); },
        /**
         * The tempo is named in words: a grid carries no rate, so a play button is the page
         * claiming one, and the component will not play without it.
         * See lessons/page-kit-devices.md#kit-devices-39
         */
        rate: { bpm: 120, whose: 'this page, which invented it' },
      });
      for (const [r, s] of [[0, 0], [0, 4], [0, 8], [0, 12], [1, 2], [1, 10],
        [2, 6], [4, 3], [4, 11], [5, 15]]) edit.set(r, s, true, 'quiet');

      /**
       * The grid owns the clock and the deck follows, as /pack/ and /crate/ do. `publish:
       * false`, this bar is not the page's __demo.transport. No scrub or loop: the ruler
       * seeks. `fmt` takes the whole line, so the readout is in steps, never a time.
       * See lessons/page-kit-devices.md#kit-devices-40
       */
      const barHost = el('div', 'kit-pg-bar');
      const deck = createDeck({ items: [], adapters: {}, range: [0, STEPS] });
      const bar = createTransportBar(barHost, deck, {
        publish: false, scrub: false, loop: false,
        fmt: (pos) => `step ${Math.min(STEPS, Math.floor(pos) + 1)} of ${STEPS}`,
        command: {
          play: () => edit.clock.play(),
          pause: () => edit.clock.stop(),
        },
      });
      /* The head follows the grid rather than the deck's own clock, so the
         number in the bar and the lit column cannot come apart. */
      edit.clock.onStep((i) => deck.seek(i));

      /* No labels on either axis, the negative control: no `fixed`, no label column, and no
         `ticks`, a bare ruler. A smaller grid, since it shows an absence.
         See lessons/page-kit-devices.md#kit-devices-41 */
      const bareWrap = el('div', 'kit-pg');
      const bareStrip = el('div', 'kit-pg-strip');
      bareWrap.append(bareStrip);
      const bare = createStepGrid({
        strip: bareStrip, rows: 3, steps: STEPS,
        padTitle: (r, s) => `row ${r}, step ${s + 1}`,
      });
      for (const [r, s] of [[0, 0], [0, 6], [1, 3], [2, 9], [2, 14]]) {
        bare.set(r, s, true, 'quiet');
      }

      /* `bar` and `deck` are held to keep them alive; no assert reads them. The transport is
         graded through `barHost` and `wrap`.
         See lessons/page-kit-devices.md#kit-devices-42 */
      gridSpec = { edit, bare, bar, deck, barHost, wrap, bareWrap };
      box.classList.add('kit-wide', 'kit-nobox');
      box.append(createGlue(barHost, wrap),
        el('p', 'kit-cap', 'no labels on either axis'), bareWrap);
    });

  /**
   * ENVELOPE: Envelope 1 is on five controller numbers, so its sliders are honest;
   * envelopes 2 and 3 are on none (circuit-cc.mjs, circuit-patch.mjs). Widths follow the
   * settings with no seconds mapping, painted on the canvas. The fourth has no lengths.

   */
  section('ENVELOPE',
    'The four stages drawn from their own settings, with the one envelope a '
    + 'controller number can reach wired to four sliders and the two it cannot '
    + 'standing still beside it.',
    `createEnvelopeView({ label: 'env 1', attack: 2, decay: 90, sustain: 127, release: 40 })
env.set({ attack: v })      // redraws, and nothing here sends anything`,

        figs.append(cell);

      };
      // The numbers are the patch format's own defaults, read off the address
      // table in `circuit-patch.mjs` rather than invented for a picture.
      const one = fig('env 1, CC 73 75 70 72',
        createEnvelopeView({ label: 'env 1', attack: 2, decay: 90, sustain: 127, release: 40 }));
      const two = fig('env 2, patch only',
        createEnvelopeView({ label: 'env 2', attack: 2, decay: 75, sustain: 35, release: 45 }));
      const three = fig('env 3, patch only, has a delay',
        createEnvelopeView({ label: 'env 3', delay: 48, attack: 10, decay: 70,
          sustain: 64, release: 40 }));
      const flat = fig('every length at zero',
        createEnvelopeView({ label: 'env 1', attack: 0, decay: 0, sustain: 96, release: 0 }));
      envSpec = { one, two, three, flat };

      // The secondary label is the controller number, as slider.mjs defines that slot.
      // See lessons/page-kit-devices.md#kit-devices-44
      const mk = (label, cc, key, value) => createSlider({
        label, sub: `CC ${cc}`, min: 0, max: 127, step: 1, value,
        onInput: (v) => {

        },
      });
      const drive = createSliderGroup([
        mk('attack', 73, 'attack', 2),
        mk('decay', 75, 'decay', 90),
        mk('sustain', 70, 'sustain', 127),
        mk('release', 72, 'release', 40),
      ], { pair: true });
      box.append(figs, drive.el, o);
    });

  /**
   * FILTER RESPONSE: reachable over CC (type 68, frequency 74, resonance 71), but the
   * curve is a textbook model, so the canvas says schematic and has no Hz or dB scale.
   * A type name it cannot read is refused in words, not drawn as a low pass.
   * See lessons/page-kit-devices.md#kit-devices-45
   */
  section('FILTER RESPONSE',
    'A drawn response with the corner where the cutoff says and the slope the type '
    + 'name claims, marked as a schematic on its own face because nothing here has '
    + 'measured a real one.',
    `createFilterView({ type: 'low pass 24dB', freq: 78, resonance: 40 })
filt.set({ freq: v })     // the type name is read, and a name it cannot read is refused`,
    (box) => {
      const o = out('low pass 24dB, cutoff 78 of 127');
      const figs = el('div', 'kit-figs');
      const fig = (title, view) => {
        const cell = el('div', 'kit-fig');
        cell.append(view.el, el('span', 'kit-fig-l', title));
        figs.append(cell);
        return view;
      };
      const live = fig('driven below',
        createFilterView({ label: 'filter', type: 'low pass 24dB', freq: 78, resonance: 40 }));
      const deep = fig('band pass 12/12 dB, resonant',
        createFilterView({ label: 'filter', type: 'band pass 12/12 dB', freq: 64, resonance: 118 }));
      // The refusal: a name it cannot read has unknown slope and direction, so
      // filterShapeFor answers null and the picture says so rather than draw a default.
      // See lessons/page-kit-devices.md#kit-devices-46
      const refused = fig('a name it cannot read',
        createFilterView({ label: 'filter', type: 'comb 9dB', freq: 64, resonance: 0 }));
      filtSpec = { live, deep, refused };

      // onPick hands back an index; `show` takes the name and the index, so the drawn cell
      // and the native list underneath cannot drift apart.
      // See lessons/page-kit-devices.md#kit-devices-47
      let at = 1;
      const go = (i) => {
        at = ((i % FILTER_TYPES.length) + FILTER_TYPES.length) % FILTER_TYPES.length;
        const name = FILTER_TYPES[at];
        type.show(name, at);
        live.set({ type: name });
        const s = filterShapeFor(name);
        o.textContent = s
          ? `${name}, read as ${s.poles} pole ${s.kind}`
          : `${name}, and the name does not say which filter it is`;
      };
      const type = createPicker({
        label: 'type', what: 'filter type',
        prev: () => go(at - 1), next: () => go(at + 1),
        onPick: (i) => go(i),
      });
      type.options(FILTER_TYPES, at);
      go(at);

      /**
       * Knobs, not sliders: createControlGrid's lattice is square (max(cellW, cellH) + gap),
       * so a 300 by 40 px slider makes a 300 px row. The 272 px type picker sits above the
       * grid for the same reason (it gave a 282 px pitch, 34 per cent filled), asserted below.
       * See lessons/page-kit-devices.md#kit-devices-48
       */
      const cutoff = createKnob({
        label: 'CUTOFF', sub: 'CC 74', min: 0, max: 127, value: 78,
        onInput: (v) => { live.set({ freq: v }); o.textContent = `cutoff ${v} of 127`; },
      });
      const reso = createKnob({
        label: 'RESONANCE', sub: 'CC 71', min: 0, max: 127, value: 40,
        onInput: (v) => { live.set({ resonance: v }); o.textContent = `resonance ${v} of 127`; },
      });
      const drive = createControlGrid({ cols: 2, gap: 10, items: [cutoff, reso] });
      filtSpec.drive = drive;
      filtSpec.knobs = [cutoff, reso];
      filtSpec.type = type;
      box.append(figs, type.el, drive.el, o);
    });

  /**
   * WAVEFORM draws a name only when the name is the shape: 4 of the Circuit's 30 waves.
   * Sixteen are wavetables, nine are saw blends with unmeasured ratios, one is a pulse
   * with no width; those are refused in words. Recorded buffers are wave-view.mjs.
   * See lessons/page-kit-devices.md#kit-devices-49
   */
  section('WAVEFORM',
    'One cycle shape drawn from its own definition, and a name that does not name a '
    + 'shape refused in words rather than drawn as a plausible squiggle.',
    `createWaveShape({ name: 'sawtooth' })              // drawn
createWaveShape({ name: 'digital nasty 1',          // refused, and it says why
                  reason: 'a wavetable has no one shape' })
createWaveShape({ shape: 'pulse', duty: 0.2 })      // a width has to be handed over`,
    (box) => {
      const drawnNames = OSC_WAVES.filter((n) => shapeFor(n));
      const o = out(`${drawnNames.length} of ${OSC_WAVES.length} have a shape here`);
      const figs = el('div', 'kit-figs');
      const fig = (title, view) => {
        const cell = el('div', 'kit-fig');
        cell.append(view.el, el('span', 'kit-fig-l', title));
        figs.append(cell);
        return view;
      };
      // `drawnViews`, not `drawn`: a module level `const drawn` already holds what each
      // diagram reported, and shadowing it here would read as correct until a line moved.
      // See lessons/page-kit-devices.md#kit-devices-50
      const drawnViews = drawnNames.map((n) =>
        fig(n, createWaveShape({ name: n, height: 76 })));
      // A pulse is a family rather than a shape, so its width is handed over by
      // hand. `shapeFor` never returns one, on purpose.
      const pulse = fig('pulse at a fifth, given by hand',
        createWaveShape({ shape: 'pulse', duty: 0.2, name: 'pulse 20%', height: 76 }));
      /* The reason is short so it fits the narrow cards without an ellipsis.
         See lessons/page-kit-devices.md#kit-devices-51 */
      const blend = fig('a blend, refused',
        createWaveShape({ name: 'saw 5:5 PW', height: 76,
          reason: 'its ratio is not published' }));
      /**
       * Two traces in one picture, so oscillator and effect output need not be compared
       * across boxes. `points` outranks a name: /muta/'s signals are no textbook shape, and
       * a caller with samples is not guessing.
       * See lessons/page-kit-devices.md#kit-devices-52
       */
      const two = fig('two named shapes, two colours',
        createWaveShape({ name: 'sawtooth', height: 76, colour: '--dim',
          over: { name: 'sine', colour: '--hi' } }));
      /* Samples rather than names, under a name that has no shape at all. The
         curve is a fold of a saw, which is what a wave folder does to one. */
      const N = 256;
      const folded = Array.from({ length: N }, (_, i) => {
        const p = (i / (N - 1)) * 2;
        const saw = 2 * (p % 1) - 1;
        return Math.sin(saw * Math.PI * 1.5);
      });
      const raw = Array.from({ length: N }, (_, i) => 2 * (((i / (N - 1)) * 2) % 1) - 1);
      const measured = fig('measured samples, where a name would be refused',
        createWaveShape({ name: 'plaits engine', height: 76, points: raw, colour: '--dim',
          over: { name: 'folded', points: folded, colour: '--hi' } }));
      /* shapeFor over all thirty waves is asserted without a browser in synth-view-test.mjs;
         the blend figure is the only refusal left on this page.
         See lessons/page-kit-devices.md#kit-devices-53 */
      waveSpec = { drawnViews, pulse, blend, two, measured, drawnNames };
      box.append(figs, o);
    });

  section('PANEL',
    'A fixed column that does not scroll beside a strip of controls that does, in '
    + 'a case, with the instrument’s name printed on it. The column drives the depth '
    + 'and one child of the strip absorbs whatever is left, which the second panel '
    + 'here shows by leaving that one class off. A dashed block stands in for the '
    + 'control that grows, so what these two show is the mechanism rather than an '
    + 'instrument: the real case is a keyboard, where a key is fifteen times a '
    + 'keypad button on the object and only 1.6 times one here, and that is on '
    + '/evo/.',
    `const p = createPanelLayout({ side: 'left' })   // cased, column on the left
p.fixed.append(knob.el, pad.el, fader.el)        // what stays put
p.flow.append(row, block)                        // what scrolls
p.grow(block)                                    // this child absorbs the slack
p.check()                                        // -> { slack, growing, cuts }
createNameplate({ lines: ['POSITRON', 'PANEL-1'], place: 'mid' })`,
    (box) => {
      box.classList.add('kit-wide');

      /**
       * One panel built twice, identical apart from whether anything absorbs the slack. The
       * controls are real kit ones, so the column is the taller child by a wide margin.
       * See lessons/page-kit-devices.md#kit-devices-54
       */
      const build = (absorb) => {
        const p = createPanelLayout({
          side: 'left', cls: { fixed: 'kit-panelcol' },
          strip: { tabindex: 0, role: 'group', label: 'the panel’s strip, side scrolling' },
        });
        p.fixed.append(
          createKnob({ label: 'M1', sub: 'CC 80', min: 0, max: 127, value: 40 }).el,
          createPad({ half: true, label: 'TAP' }).el,
          createFader({ label: 'CH1', min: 0, max: 127, value: 30 }).el,
        );
        /* Sixteen pads, so the row overflows the page column and there is something to scroll
           behind the border; with four, overflow-x: auto had nothing to do.
           See lessons/page-kit-devices.md#kit-devices-55 */
        const row = el('div', 'panel-row kit-panelrow');
        row.append(createPadGrid({
          cols: 16, pad: (x) => ({ top: String(x + 1) }),
        }).el);
        /* The plate's `mid` placement is not shown on this page; INSTRUMENT shows `ends`, and
           panel-layout.mjs documents all three.
           See lessons/page-kit-devices.md#kit-devices-56 */
        const blk = el('div', 'kit-blk', absorb
          ? 'this block carries .panel-grow' : 'this block carries nothing');
        p.flow.append(row, blk);
        // The one line that differs is an argument, `grow`, not a class typed on a page: a
        // required class a caller forgets is invisible to any browser check.
        // See lessons/page-kit-devices.md#kit-devices-57
        if (absorb) { p.grow(blk); panelGrowBlk = blk; }
        box.append(p.el);
        return { panel: p, blk, row };
      };

      box.append(el('p', 'kit-cap', 'with an absorber'));
      panelWith = build(true);
      box.append(el('p', 'kit-cap', 'no absorber, which is the negative control'));
      panelWithout = build(false);

      /* No check on this page enters a media query: demo/verify.mjs runs at 756 px with no
         viewport override. plans/plan-panel-component.md has options for grading a phone.
         See lessons/page-kit-devices.md#kit-devices-58 */
    });

  section('SEGMENT DISPLAY',
    'A field of digits drawn from its own parts, with every unlit bar still '
    + 'faintly there, which is what makes it read as a display rather than as '
    + 'coloured text. Nothing measured is blank and never a zero, and a value too '
    + 'wide for the field shows dashes and keeps the number in its tooltip.',
    `createSegment({ digits: 3 }).set(127)
createSegment({ digits: 3, decimals: 1 }).set(12.5)     // the dot costs no cell
createSegment({ digits: 2, frame: false, size: 16 })    // two fields, one window
seg.set('')          // -> { blank: true },  nothing lit
seg.set(1234)        // -> { over: true, asked: '1234' },  reads ---`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      /** One field with its own caption above it, so six of them in a row each
       *  say which of the six they are. */
      const field = (cap, opts) => {
        const col = el('div', 'kit-dispc');
        col.append(el('div', 'kit-cap', cap));
        const s = createSegment(opts);
        col.append(s.el);
        return { col, s };
      };

      // The same field, six readings: all three digits, no decimal point, default ink, so
      // the width check below compares them and a change to the box would change all six.
      // See lessons/page-kit-devices.md#kit-devices-59
      const row = el('div', 'kit-disp');
      for (const [cap, v] of [['reading', 127], ['narrowest', 111], ['every bar', 888],
        ['measured zero', 0], ['nothing measured', ''], ['too wide', 1234]]) {
        const { col, s } = field(cap, { digits: 3, value: v });
        dispSpec.set(cap, s);
        row.append(col);
      }

      // ── a decimal point, a word, and a second colour ──────────────────
      const row2 = el('div', 'kit-disp');
      const dot = field('one decimal', { digits: 3, decimals: 1, value: 12.5 });
      dispDot = dot.s;
      row2.append(dot.col);
      // Seven bars draw a closed list of characters and no more. `rEC` is on
      // that list; a K is not, and a field asked for one says so rather than
      // drawing the nearest shape.
      row2.append(field('a word it can spell', { digits: 3, value: 'rEC' }).col);
      // The colour is a caller option and the default is the backlight `/evo/`
      // already had. This one proves it moves.
      row2.append(field('another ink', { digits: 3, value: 24, ink: 'var(--ok)' }).col);
      /**
       * `reflective`: no lamp, so driven bars go dark on a pale grey green field, where
       * `backlit` lights them. One option, since a scheme is three numbers that go together;
       * its ghost is 0.16 against backlit's 0.22, as dark bars read heavier.
       * See lessons/page-kit-devices.md#kit-devices-60
       */
      const refl = field('reflective, no lamp behind it',
        { digits: 3, value: 127, scheme: 'reflective' });
      dispRefl = refl.s;
      row2.append(refl.col);

      // ── two fields in one window, which is decision 1 ─────────────────
      /**
       * Two displays, not an option on one: the page draws the window and both pass
       * `frame: false`, one edge round the pair. The window reads --disp-back off :root,
       * since a custom property inherits down, never sideways to a sibling.
       * See lessons/page-kit-devices.md#kit-devices-61
       */
      const panel = el('div', 'kit-disp-window');
      panel.append(createSegment({ digits: 3, value: 127, frame: false }).el,
        createSegment({ digits: 2, value: 12, frame: false, size: 15 }).el);
      const panelCol = el('div', 'kit-dispc');
      panelCol.append(el('div', 'kit-cap', 'two fields, one window'), panel);
      const row3 = el('div', 'kit-disp');
      row3.append(panelCol);

      stack.titled('ONE FIELD, SIX THINGS TO SAY', row);
      stack.titled('A POINT, A WORD, AND WHAT THE CALLER CAN CHANGE', row2);
      stack.titled('AND A PANEL IS TWO OF THEM, NOT ONE WITH AN OPTION', row3);
      box.append(stack.el);
    });

  // Readout: an even number of cells, as `auto-fit minmax(96px, 1fr)` gives a phone two
  // columns; mount() throws on an odd count. Unmeasured values show an empty cell, never
  // 0. Presence: four separate badges, measured without driving a control.
  // See lessons/page-kit-devices.md#kit-devices-62
  /**
   * The strip's parts before the assembled strip, because the parts are what a caller
   * writes. Reading order wins over newest first inside this part.
   * See lessons/page-kit-devices.md#kit-devices-63
   */
  section('KNOB',
    'Dragged up and down rather than turned, with its controller under it.',
    `createKnob({ label: 'M1', sub: 'CC 80', min: 0, max: 127, value: 18 })
createKnob({ label: 'M4', hand: true })        // an invisible hand, on the ring
createKnobBank([k1, k2, k3, k4])
k.set(96, { from: 'hardware', quiet: true })   // moved at the desk, not here`,
    (box) => {
      box.classList.add('kit-wide');
      /**
       * A vertical drag, since an angular one dies near the centre. One knob is shown as
       * moved by hardware: a live binding and an unbound one otherwise look identical.
       * See lessons/page-kit-devices.md#kit-devices-64
       */
      const ks = [
        createKnob({ label: 'M1', sub: 'CC 80', min: 0, max: 127, value: 18,
                     title: 'macro 1, CC 80 on channel 1' }),
        createKnob({ label: 'M2', sub: 'CC 81', min: 0, max: 127, value: 96,
                     title: 'macro 2, CC 81 on channel 1' }),
        createKnob({ label: 'M3', sub: 'CC 82', min: 0, max: 127, value: 64,
                     disabled: true, title: 'disabled: nothing is bound to this one' }),
        /**
         * The invisible hand on a knob, the same hand-drive.mjs plan a slider uses. Its button
         * sits on the ring's lower edge and costs no height, asserted below.
         * See lessons/page-kit-devices.md#kit-devices-65
         */
        createKnob({ label: 'M4', sub: 'no hand', min: 0, max: 127, value: 40,
                     hand: true, title: 'press the button on the ring: it moves itself' }),
      ];
      ks[1].set(96, { from: 'hardware', quiet: true });
      box.append(createKnobBank(ks, {}).el);
      handKnobs = ks;
    });

  section('PAD',
    'Square, half height or round, and the shape is one property rather than three components.',
    `createPadGrid({ cols: 8, rows: 2, pad: (x, y) => ({ tint, top, on }) })
createPadGrid({ cols: 8, pad: (x) => ({ half: true, label: String(x + 1) }) })
createPadGrid({ cols: 5, pad: (x) => ({ round: true, bottom: 'play' }) })`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const TINT = ['#7fb2ff', '#ff9f7f'];
      /**
       * Two rows, so there is a stacked pair for --ctl-step to measure. Only every other pad
       * is named: an unlabelled pad still reserves --ctl-head, so all sit level.
       * See lessons/page-kit-devices.md#kit-devices-66
       */
      padPair = createPadGrid({
        cols: 8, rows: 2,
        pad: (x, y) => ({
          tint: TINT[y],
          top: x % 2 === 0 ? String(x / 2 + 1) : '',
          on: y === 0 ? x % 2 === 0 : x % 4 === 1,
          disabled: x === 7 && y === 1,
          title: x === 7 && y === 1 ? 'disabled' : `step ${x + 1} of lane ${y + 1}`,
        }),
      });
      stack.titled('SQUARE, TWO LANES, AND ONLY EVERY OTHER ONE NAMED', padPair.el);

      stack.titled('HALF HEIGHT, WHICH IS ONE PROPERTY', createPadGrid({
        cols: 8,
        pad: (x) => ({
          half: true, tint: '#8fd6a8',
          top: x % 2 === 0 ? String(x / 2 + 1) : '',
          label: String(x + 1), on: x % 3 === 0, disabled: x === 7,
          title: x === 7 ? 'disabled' : `step ${x + 1}`,
        }),
      }).el);

      stack.titled('ROUND, WHICH IS ANOTHER', createPadGrid({
        cols: 5,
        pad: (x) => ({
          round: true, tint: '#c9a0ff',
          top: x === 0 ? 'top' : '', label: String(x + 1),
          bottom: ['play', 'stop', 'rec', '', 'off'][x],
          on: x === 2, disabled: x === 4,
          title: x === 4 ? 'disabled' : `round pad ${x + 1}`,
        }),
      }).el);
      box.append(stack.el);
    });

  section('FADER',
    'The slider turned ninety degrees, with its value above the lane and its name under it.',
    `createFader({ label: 'CH1', value: 30 })
createFaderBank([f1, f2, f3])
f.set(104, { from: 'hardware', quiet: true })`,
    (box) => {
      box.classList.add('kit-wide');
      const fs = [];
      for (let i = 0; i < 4; i++) {
        fs.push(createFader({ label: `CH${i + 1}`, value: 30 + i * 20,
          title: `channel ${i + 1} fader, pitch bend on channel ${i + 1}` }));
      }
      fs[2].set(104, { from: 'hardware', quiet: true });
      fs.push(createFader({ label: 'FX', value: 64, disabled: true,
                            title: 'disabled: no master is bound' }));
      box.append(createFaderBank(fs, {}).el);
    });

  /**
   * The contract between the parts: the distance between two stacked controls is head,
   * foot and gap. Every figure is read off the document; shell.css states the three and
   * declares --ctl-step as their sum.
   * See lessons/page-kit-devices.md#kit-devices-67
   */
  section('HEAD, GAP AND FOOT',
    'The distance between two stacked controls is three things, and only the middle one is a gap.',
    `--ctl-head   the slot above the working surface, reserved even when empty
--ctl-foot   the slot below it
--ctl-gap    the only part of it that is actually a gap
--ctl-step   declared as the sum of the three, so a caller never adds them up`,
    (box) => {
      box.classList.add('kit-wide');
      const root = getComputedStyle(document.documentElement);
      const px = (n) => root.getPropertyValue(n).trim();
      const stack = createStack(undefined, 'kit-col');

      /**
       * Each band is height: var(--ctl-*), so the picture cannot disagree. --ctl-step is a
       * fourth band: getPropertyValue returns the unresolved calc() text and parseFloat
       * gives NaN, so the resolved band is the measurement.
       * See lessons/page-kit-devices.md#kit-devices-68
       */
      const ladder = el('div', 'kit-step');
      const col = el('div', 'kit-step-c');
      for (const [name, prop] of [['head', '--ctl-head'], ['gap', '--ctl-gap'],
                                  ['foot', '--ctl-foot']]) {
        const band = el('div', 'kit-step-b', null);
        band.style.height = `var(${prop})`;
        band.append(el('span', 'kit-step-n', `${name} ${px(prop)}`));
        col.append(band);
      }
      stepBand = el('div', 'kit-step-b kit-step-s', null);
      stepBand.style.height = 'var(--ctl-step)';
      stepBand.append(el('span', 'kit-step-n', 'step'));
      const right = el('div', 'kit-step-c');
      right.append(stepBand);
      ladder.append(col, right);
      stack.titled('THREE DISTANCES, AND ONE NAME FOR ALL THREE', ladder);

      /**
       * The stacked pair, labelled above and below, so the button distance includes a foot.
       * Two pads with no bottom label sit 23 px apart, not 40: the head slot is reserved when
       * empty, the foot slot is not, so --ctl-step is an upper bound for other pairs.
       * See lessons/page-kit-devices.md#kit-devices-69
       */
      /**
       * A real createPadGrid: a hand-rolled column measured 32 px (foot plus head), because
       * --ctl-gap belongs to the container, declared by .pos-pad-grid and .pos-crow.
       * See lessons/page-kit-devices.md#kit-devices-70
       */
      const stepGrid = createPadGrid({
        cols: 1, rows: 2,
        pad: (x, y) => ({
          top: String(y + 1), label: y === 0 ? 'A' : 'B',
          bottom: y === 0 ? 'kick' : 'snare',
          tint: y === 0 ? '#7fb2ff' : '#ff9f7f', on: y === 0,
          title: 'labelled above and below',
        }),
      });
      stepPads = [stepGrid.at(0, 0), stepGrid.at(0, 1)];
      stack.titled('TWO OF THEM STACKED, WHICH IS WHERE THE STEP LANDS', stepGrid.el);

      /**
       * An empty head slot is still reserved, so both buttons start on one line. Measure the
       * button, never the wrapper: a pad's `el` is its wrapper and `button` is separate.
       * See lessons/page-kit-devices.md#kit-devices-71
       */
      const pair = el('div', 'pos-crow');
      namedPad = createPad({ top: '1', label: 'A', tint: '#7fb2ff', on: true,
                             title: 'named above' });
      barePad = createPad({ label: 'B', tint: '#7fb2ff',
                            title: 'nothing above it, and the slot is still reserved' });
      pair.append(namedPad.el, barePad.el);
      stack.titled('ONE NAMED ABOVE AND ONE NOT, STARTING ON ONE LINE', pair);
      box.append(stack.el);
    });

  /**
   * Unsettled parts sit at the bottom rather than the top. When adopted they move up.
   * See lessons/page-kit-devices.md#kit-devices-72
   */
  /* The heading does not list KNOB, PAD, HALF PAD and FADER: each has its own section
     and the snippet names all four constructors.
     See lessons/page-kit-devices.md#kit-devices-73 */
  /**
   * CHANNEL STRIP: four channels in vertical lanes. The divider is the panel's own line
   * (.panel-fixed-l's tokens). --ctl-head and --ctl-foot align each column with no margin
   * here; a knob is --ctl-w * 1.1 wide and a pad --ctl-w, so both are centred.
   * See lessons/page-kit-devices.md#kit-devices-74
   */
  section('CHANNEL STRIP',
    'Four channels as four vertical lanes, each control in a lane centred on one line '
    + 'and each lane divided from the next by the panel’s own border.',
    `const lane = el('div', 'kit-chan')
lane.append(knob.el, padGrid.el, halfPad.el, fader.el)
// .kit-chan is the panel's divider: border-right var(--line), padding var(--panel-gap)
// nothing here sets a margin: --ctl-head and --ctl-foot do the lining up`,
    (box) => {
      box.classList.add('kit-wide');
      const chans = el('div', 'kit-chans');
      box.append(chans);

      /* Four channels, and the last one is disabled throughout, because a
         disabled control has to line up with a live one or the state reads as
         a rendering fault. */
      const lanes = [];
      for (let i = 0; i < 4; i++) {
        const off = i === 3;
        const lane = el('div', 'kit-chan');
        const knob = createKnob({
          label: 'M' + (i + 1), sub: 'CC ' + (80 + i),
          min: 0, max: 127, value: 18 + i * 22, disabled: off,
          title: off ? 'disabled: nothing is bound to this one'
            : 'macro ' + (i + 1) + ', CC ' + (80 + i) + ' on channel 1',
        });
        /* One pad per lane, not a grid across the page, because a grid across
           the page is what this block was doing wrong. */
        const pad = createPad({
          label: String(i + 1), top: 'step', tint: '#7fb2ff',
          on: i % 2 === 0, disabled: off,
          title: off ? 'disabled' : 'step ' + (i + 1),
        });
        const half = createPad({
          half: true, label: String(i + 1), tint: '#8fd6a8',
          on: i % 3 === 0, disabled: off,
          title: off ? 'disabled' : 'mute ' + (i + 1),
        });
        const fader = createFader({
          label: 'CH' + (i + 1), value: 30 + i * 20, disabled: off,
          title: off ? 'disabled: no channel is bound'
            : 'channel ' + (i + 1) + ' fader, pitch bend on channel ' + (i + 1),
        });
        lane.append(knob.el, pad.el, half.el, fader.el,
          el('div', 'kit-chan-l', 'CH' + (i + 1)));
        chans.append(lane);
        lanes.push({ lane, knob, pad, half, fader });
      }
      /* One shown as moved by hardware: a live binding and an unbound one otherwise look
         identical.
         See lessons/page-kit-devices.md#kit-devices-75 */
      lanes[1].knob.set(96, { from: 'hardware', quiet: true });
      lanes[2].fader.set(104, { from: 'hardware', quiet: true });
      chanSpec = lanes;
    });

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* Every check is behind ?selfcheck=1. They are copied from the old one page /kit/
     and keep its indent. They run after two frames, because getBoundingClientRect
     before the first paint answers about a page not yet arranged.
     See lessons/page-kit-devices.md#kit-devices-76 */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();

  /* ── a knob turned from elsewhere ──────────────────────────────────────── */
  if (rxSpec) {
    const k = rxSpec.knobs[3];
    const sentBefore = rxSpec.sent.n;
    const was = k.value();
    const to = was > 64 ? 10 : 120;
    k.receive(to, { from: 'relay' });
    const numAt0 = Number(k.el.querySelector('.pos-knob-v').textContent);
    const valueAt0 = k.value(), marked = k.el.getAttribute('data-remote');
    await new Promise((r) => setTimeout(r, 60));
    const numMid = Number(k.el.querySelector('.pos-knob-v').textContent);
    await new Promise((r) => setTimeout(r, 900));
    const numEnd = Number(k.el.querySelector('.pos-knob-v').textContent);
    d.assert('a received value is the knob\'s value at once and the dial glides to it',
      valueAt0 === to && numMid !== to && numEnd === to,
      `value ${valueAt0} at once, drawn ${numAt0} then ${numMid} at 60 ms then ${numEnd}`);
    d.assert('a received value marks the knob and the mark goes out again',
      marked === 'relay' && !k.el.hasAttribute('data-remote'), `marked ${marked}, after ${k.el.getAttribute('data-remote')}`);
    d.assert('NEGATIVE: a received value calls nothing, so nothing is sent',
      rxSpec.sent.n === sentBefore, `${rxSpec.sent.n - sentBefore} sends`);
    const dial = k.el.querySelector('.pos-knob-dial');
    dial.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
    const afterKey = k.value();
    k.receive(afterKey > 64 ? 5 : 125, { from: 'relay' });
    d.assert('a key press still sends, and a value arriving under it is held off',
      rxSpec.sent.n === sentBefore + 1 && k.value() === afterKey && k.received().ignored >= 1,
      `sends ${rxSpec.sent.n - sentBefore}, value ${k.value()} against ${afterKey}, ignored ${k.received().ignored}`);
  }

  /* ── the knob grid ─────────────────────────────────────────────────────── */
  if (kgSpec) {
    const { wide, phone, frame } = kgSpec;
    const rect = (c) => c.getBoundingClientRect();
    const rects = (g) => g.cells.map((c) => { const r = rect(c); return [r.left, r.top, r.width, r.height]; });
    const f1 = (n) => n.toFixed(1);
    /** how many columns a grid laid out, read off the cells' own tops */
    const across = (g) => { const t0 = rect(g.cells[0]).top; return g.cells.filter((c) => Math.abs(rect(c).top - t0) < 0.5).length; };

    /* 1. Every box is one size, on and off, at full width and in the frame. */
    {
      const all = [...wide.cells, ...phone.cells].map(rect);
      const ws = all.map((r) => r.width), hs = all.map((r) => r.height);
      const spreadW = Math.max(...ws) - Math.min(...ws), spreadH = Math.max(...hs) - Math.min(...hs);
      d.assert('every box in a knob grid is the same size, the switched off ones included',
        spreadW < 0.5 && spreadH < 0.5 && ws[0] > 0,
        `${all.length} boxes, ${f1(ws[0])} by ${f1(hs[0])} px, spread ${spreadW.toFixed(2)} across and ${spreadH.toFixed(2)} down`);
    }

    /* 2. Switching a knob off moves no box, and switching it back moves none
          either. RES is on in the specimen, so this takes it off and puts it
          back, and the reader is left with what was there. */
    {
      const before = rects(wide);
      wide.show('res', false);
      const off = rects(wide);
      const offState = wide.on('res') === false && wide.cellOf('res').dataset.off === '1' && wide.knobs[3].disabled();
      wide.show('res', true);
      const back = rects(wide);
      const moved = (a, b) => a.reduce((n, r, i) => n + (r.some((v, j) => Math.abs(v - b[i][j]) > 0.01) ? 1 : 0), 0);
      d.assert('switching a knob off and on again moves no box in the grid',
        offState && moved(before, off) === 0 && moved(before, back) === 0,
        `off took: ${offState}, boxes moved going off ${moved(before, off)} of ${before.length}, coming back ${moved(before, back)}`);
    }

    /* 3. An off box is still a box in its slot: laid out, the knob still in
          it, at the place its index says. */
    {
      const c = wide.cellOf('wave');
      const cs = getComputedStyle(c);
      const k = c.querySelector('.pos-knob');
      const r1 = rect(wide.cells[0]), r = rect(c);
      const gap = parseFloat(getComputedStyle(wide.el).columnGap) || 0;
      const expectX = r1.left + (r1.width + gap) * 1;   // WAVE is the second box
      d.assert('a switched off knob keeps its slot: its box is laid out where its index puts it, with the knob in it, dimmed',
        cs.display !== 'none' && cs.visibility === 'visible' && !!k && k.hasAttribute('data-off')
        && Math.abs(r.left - expectX) < 0.5 && Math.abs(r.top - r1.top) < 0.5
        && parseFloat(getComputedStyle(k).opacity) < 1,
        `display ${cs.display}, the box at x ${f1(r.left)} against ${f1(expectX)} and y ${f1(r.top)} against ${f1(r1.top)}, `
        + `knob opacity ${getComputedStyle(k).opacity}`);
    }

    /* 4. The grid fits a phone: in the 320 px frame it wraps onto fewer
          columns than at full width and nothing reaches past the frame. */
    {
      const fr = rect(frame), fcs = getComputedStyle(frame);
      const inner = fr.right - parseFloat(fcs.borderRightWidth) - parseFloat(fcs.paddingRight);
      const right = Math.max(...phone.cells.map((c) => rect(c).right));
      const nW = across(wide), nP = across(phone);
      d.assert('in a 320 px frame the grid wraps onto fewer columns and nothing spills past the frame',
        nP < nW && nP >= 1 && right <= inner + 0.5 && phone.el.scrollWidth <= phone.el.clientWidth
        && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
        `${nW} across at full width, ${nP} in the frame, the last box ends at ${f1(right)} against the frame's inside at ${f1(inner)}, `
        + `grid scrollWidth ${phone.el.scrollWidth} against ${phone.el.clientWidth}`);
    }
  }


  /* ── the glued rows and the instrument panel built on them ──────────────── */
  {
    const r = (e) => (e.el || e).getBoundingClientRect();
    const px = (e, prop) => parseFloat(getComputedStyle(e.el || e)[prop]) || 0;
    const bg = (e) => getComputedStyle(e.el || e).backgroundColor;
    const edge = (e) => px(e, 'borderTopWidth') + px(e, 'borderBottomWidth')
      + px(e, 'borderLeftWidth') + px(e, 'borderRightWidth');
    const shown = (g) => g.rows().filter((row) => getComputedStyle(row).display !== 'none');
    /** The gaps between consecutive VISIBLE rows, which is what a seam is. */
    const seams = (g) => {
      const v = shown(g);
      return v.slice(1).map((row, i) => +(r(row).top - r(v[i]).bottom).toFixed(1));
    };

    const sk = ipanelSpec.sketch;

    /**
     * One border round the lot and none inside, as .pos-glue promises: the seam is a flex
     * gap showing the box's ground, so it is never drawn and cannot double.
     * See lessons/page-kit-devices.md#kit-devices-77
     */
    {
      const gaps = seams(sk.glue);
      const inner = sk.glue.rows().map(edge);
      d.assert('an instrument panel is one surface: one border round it, none inside, and a 1 px seam between rows',
        sk.el.classList.contains('pos-glue')
        && px(sk.el, 'borderTopWidth') === 1
        && inner.every((n) => n === 0)
        && gaps.length === 4 && gaps.every((n) => Math.abs(n - 1) <= 0.6),
        `${gaps.length} seam(s) reading ${gaps.join(', ')} px, one edge of ${px(sk.el, 'borderTopWidth')} px `
        + `round ${sk.glue.count()} rows, ${inner.filter((n) => n).length} of them carrying an edge of their own`);
    }

    /**
     * Every row paints its own ground: .pos-glue is gap: 1px over --line, so a row without
     * a background lets the line through. Read against this page's known --card box.
     * See lessons/page-kit-devices.md#kit-devices-78
     */
    {
      const card = bg(document.querySelector('.kit-box'));
      const rows = sk.glue.rows();

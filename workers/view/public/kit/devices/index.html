      const wrong = rows.filter((row) => bg(row) !== card).length;
      d.assert('every row paints its own ground, so the seam cannot come through one',
        wrong === 0 && bg(sk.el) !== card && rows.length > 0,
        `${rows.length - wrong} of ${rows.length} rows read ${card}, and the surface under them `
        + `reads ${bg(sk.el)}, which is the colour the seam is made of`);
    }

    /**
     * The sketch's order is the component's, graded against the rendered children and their
     * tops rather than a list the module keeps.
     * See lessons/page-kit-devices.md#kit-devices-79
     */
    {
      const order = sk.shape().join(' ');
      const tops = sk.glue.rows().map((row) => r(row).top);
      const rising = tops.every((t, i) => i === 0 || t > tops[i - 1]);
      d.assert('the panel renders in the order the sketch draws, top to bottom',
        order === 'viz controls controls keys plate' && rising,
        `${order}, at y ${tops.map((t) => t.toFixed(0)).join(', ')}`);
    }

    /**
     * A row asked for late still lands above the keyboard and foot, in a browser (the node
     * test uses a stub). It puts the row back afterwards.
     * See lessons/page-kit-devices.md#kit-devices-80
     */
    {
      const late = sk.addRow([createKnob({ label: 'LFO', min: 0, max: 127, value: 30 })]);
      const after = sk.shape().join(' ');
      const above = r(late).bottom <= r(sk.keys).top && r(late).bottom <= r(sk.plateRow).top;
      sk.glue.remove(late);
      d.assert('a row asked for after the keyboard and the foot exist still lands above both',
        after === 'viz controls controls controls keys plate' && above
        && sk.shape().join(' ') === 'viz controls controls keys plate',
        `with it: ${after} · its bottom ${r(late).bottom.toFixed(0)} against keys `
        + `${r(sk.keys).top.toFixed(0)} and foot ${r(sk.plateRow).top.toFixed(0)}`);
    }

    /**
     * A row that goes away takes its seam with it: a display: none child takes no gap, so
     * no orphan rule is left.
     * See lessons/page-kit-devices.md#kit-devices-81
     */
    {
      const g = rowsSpec.g;
      const before = seams(g);
      rowsSpec.rowPic.hidden = true;
      const during = seams(g);
      const count = shown(g).length;
      rowsSpec.rowPic.hidden = false;
      const back = seams(g);
      d.assert('hiding a row closes the surface up and leaves no seam where it was',
        before.length === 2 && during.length === 1 && count === 2
        && during.every((n) => Math.abs(n - 1) <= 0.6)
        && back.length === 2 && back.every((n) => Math.abs(n - 1) <= 0.6),
        `${before.length} seam(s) at ${before.join(', ')} px, ${during.length} at `
        + `${during.join(', ')} with ${count} rows showing, ${back.length} at ${back.join(', ')} again`);
    }

    /**
     * Label and control rows share one column pair: on the grid variant every second child
     * starts on one line and every first child on another.
     * See lessons/page-kit-devices.md#kit-devices-82
     */
    {
      for (const [name, g] of [['settings', rowsSpec.settings], ['settingsFull', rowsSpec.settingsFull]]) {
        const rows = g.rows().filter((row) => row.children.length === 2);
        const labs = rows.map((row) => +r(row.children[0]).left.toFixed(1));
        const ctls = rows.map((row) => +r(row.children[1]).left.toFixed(1));
        const spread = (xs) => Math.max(...xs) - Math.min(...xs);
        d.assert(`${name}: every control starts on one line and every label on another, across ${rows.length} rows`,
          rows.length >= 3 && spread(labs) <= 0.6 && spread(ctls) <= 0.6 && ctls[0] > labs[0],
          `labels at x ${labs.join(', ')}, controls at x ${ctls.join(', ')}`);
      }
    }

    /**
     * A between row is justified at full width and wraps in a 320 px frame into left-aligned
     * lines at their own sizes. Each child's width in the frame must equal its full size
     * width, so nothing is stretched.
     * See lessons/page-kit-devices.md#kit-devices-83
     */
    {
      const wide = rowsSpec.fullBetween, tight = rowsSpec.narrowBetween;
      const gapOf = (row) => px(row, 'columnGap') || px(row, 'gap');
      const ins = (row) => px(row, 'paddingLeft');
      const [wa, wb] = wide.children, [ta, tb] = tight.children;
      const wApart = +(r(wb).left - r(wa).right).toFixed(1);
      const wL = +(r(wa).left - (r(wide).left + ins(wide))).toFixed(1);
      const wR = +((r(wide).right - ins(wide)) - r(wb).right).toFixed(1);
      d.assert('at full width a justified row puts one child against each inset with room between',
        Math.abs(wL) <= 0.6 && Math.abs(wR) <= 0.6 && wApart > gapOf(wide) * 4,
        `${wL} px off the left inset, ${wR} px off the right, ${wApart} px apart`);
      const stacked = r(tb).top >= r(ta).bottom - 0.6;
      const ownSize = Math.abs(r(tb).width - r(wb).width) <= 0.6 && Math.abs(r(ta).width - r(wa).width) <= 0.6;
      const tL = [+(r(ta).left - (r(tight).left + ins(tight))).toFixed(1), +(r(tb).left - (r(tight).left + ins(tight))).toFixed(1)];
      const between = +(r(tb).top - r(ta).bottom).toFixed(1);
      d.assert('in a 320 px frame the same row is linear: one child per line, both on the left inset, one gap apart',
        r(tight).width < 340 && stacked && ownSize && tL.every((x) => Math.abs(x) <= 0.6) && Math.abs(between - px(tight, 'rowGap')) <= 0.6,
        `frame ${r(tight).width.toFixed(0)} px wide, lefts ${tL.join(' and ')} px off the inset, ${between} px between the lines against a gap of ${px(tight, 'rowGap')}, `
        + `the button ${r(tb).width.toFixed(1)} px wide in the frame and ${r(wb).width.toFixed(1)} at full width`);
    }

    /**
     * A start row that does not fit wraps as a cluster: left-aligned, the row's gap between
     * items and lines, nothing past the inset. Eight octave buttons at 320 px are two lines.
     * See lessons/page-kit-devices.md#kit-devices-84
     */
    {
      const row = rowsSpec.clusterRow;
      const kids = [...row.children];
      const tops = [...new Set(kids.map((k) => Math.round(r(k).top)))];
      const inset = px(row, 'paddingLeft');
      const firsts = tops.map((t) => kids.find((k) => Math.round(r(k).top) === t));
      const onInset = firsts.every((k) => Math.abs(r(k).left - (r(row).left + inset)) <= 0.6);
      const widths = kids.map((k) => +r(k).width.toFixed(1));
      const even = Math.max(...widths) - Math.min(...widths) <= 0.6;
      const inside = kids.every((k) => r(k).right <= r(row).right - inset + 0.6);
      d.assert('a start row too wide for its frame wraps left-aligned on the row\u2019s gap, every button its own width',
        tops.length >= 2 && onInset && even && inside,
        `${kids.length} buttons on ${tops.length} lines, first of each ${onInset ? 'on' : 'OFF'} the inset, widths ${Math.min(...widths)} to ${Math.max(...widths)} px, ${inside ? 'none' : 'some'} past the right inset`);
    }

    /**
     * Edge to edge means the picture's own left edge; a control row's ink starts one inset
     * further in.
     * See lessons/page-kit-devices.md#kit-devices-85
     */
    {
      const pic = ipanelSpec.pic.el;
      const surface = r(sk.el);
      const gapL = +(r(pic).left - (surface.left + px(sk.el, 'borderLeftWidth'))).toFixed(1);
      const gapR = +((surface.right - px(sk.el, 'borderRightWidth')) - r(pic).right).toFixed(1);
      const inset = px(sk.controls()[0], 'paddingLeft');
      d.assert('the picture row runs to both inner edges while a control row keeps its inset',
        Math.abs(gapL) <= 0.6 && Math.abs(gapR) <= 0.6 && inset >= 12,
        `the picture sits ${gapL} px and ${gapR} px off the inner edges, against a control row's ${inset} px`);
    }

    /**
     * --rows-pad is a second name for .panel-case's 20 px, since that is redeclared 0 on an
     * uncased panel; this asserts the two agree.
     * See lessons/page-kit-devices.md#kit-devices-86
     */
    {
      const cased = document.querySelector('.panel-case');
      const rowPad = px(sk.controls()[0], 'paddingLeft');
      const casePad = cased ? px(cased, 'paddingLeft') : -1;
      d.assert('a glued row starts its ink on the same line a case does, which is the point of the second token',
        cased !== null && rowPad === casePad && rowPad > 0,
        `a row pads ${rowPad} px and a case pads ${casePad} px`);
    }

    /**
     * The foot's two ends are at the two ends, or `place: 'ends'` means nothing.
     * See lessons/page-kit-devices.md#kit-devices-87
     */
    {
      const [nameEl, patchEl] = sk.plate.lines;
      const row = r(sk.plateRow);
      const inset = px(sk.plateRow, 'paddingLeft');
      const offL = +(r(nameEl).left - (row.left + inset)).toFixed(1);
      const offR = +((row.right - inset) - r(patchEl).right).toFixed(1);
      const apart = +(r(patchEl).left - r(nameEl).right).toFixed(1);
      d.assert('the foot puts the name against one inner edge and the patch against the other',
        Math.abs(offL) <= 0.6 && Math.abs(offR) <= 0.6 && apart > 100,
        `the name is ${offL} px off the left inset and the patch ${offR} px off the right, `
        + `${apart} px apart`);
    }

    /**
     * A control at each end of the foot, each on the row's inset, still a two-ended row that
     * goes linear on a phone. Measured the way /muta/ grades its header.
     * See lessons/page-kit-devices.md#kit-devices-88
     */
    {
      const ft = ipanelSpec.foot;
      const row = r(ft.plateRow);
      const inset = px(ft.plateRow, 'paddingLeft');
      const nameEl = ft.plate.lines[0];
      const offL = +(r(nameEl).left - (row.left + inset)).toFixed(1);
      const offR = +((row.right - px(ft.plateRow, 'paddingRight')) - r(ft.patchEnd).right).toFixed(1);
      const afterName = +(r(ft.status).left - r(nameEl).right).toFixed(1);
      const mid = (e) => r(e).top + r(e).height / 2;
      const oneLine = Math.abs(mid(ft.status) - mid(ft.patchEnd)) <= 1;
      /* No caption on the picker, read off the rendered end, since this page passes none; the
         node test hands one in, and this reads that the far end shows only the control.
         See lessons/page-kit-devices.md#kit-devices-89 */
      const captioned = ft.patchEnd.querySelector('.pos-pick-l') !== null;
      d.assert('the foot holds the name and its switch at the start and the picker, unlabelled, at the end, each on the row’s inset',
        Math.abs(offL) <= 0.6 && Math.abs(offR) <= 0.6 && afterName > 0 && afterName <= 12 && oneLine && !captioned
          && ft.plateRow.dataset.align === 'between' && ft.status === ipanelSpec.power.el && ft.patchEnd === ipanelSpec.pick.el,
        `name ${offL} px off the left inset, switch ${afterName} px after it, picker ${offR} px off the right inset `
        + `${captioned ? 'with a caption' : 'with no caption'}, ${oneLine ? 'on one line' : 'on two lines'}`);
    }

    /**
     * Rewriting the patch moves nothing else: a right-aligned box grows leftward into air.
     * It measures a longer name, then puts the original back.
     * See lessons/page-kit-devices.md#kit-devices-90
     */
    {
      const [nameEl, patchEl] = sk.plate.lines;
      const was = patchEl.textContent;
      const nameL = r(nameEl).left, rowW = r(sk.plateRow).width, footH = r(sk.plateRow).height;
      const longer = 'Wurlitzer 200A electric';
      sk.patch(longer);
      const grew = r(patchEl).width;
      const moved = +(r(nameEl).left - nameL).toFixed(1);
      const rowMoved = +(r(sk.plateRow).width - rowW).toFixed(1);
      const taller = +(r(sk.plateRow).height - footH).toFixed(1);
      sk.patch(was);
      d.assert('rewriting the patch moves neither the name nor the row it is in',
        patchEl.textContent === was && moved === 0 && rowMoved === 0 && taller === 0 && grew > 0,
        `a name ${longer.length} characters long drew ${grew.toFixed(1)} px wide and moved the `
        + `instrument's name by ${moved} px, the row by ${rowMoved} px and its depth by ${taller} px`);
    }

    /**
     * A patch is shown as written, the name above it is not. Read off what the browser
     * renders (shown()), since textContent stays green whatever a transform does.
     * See lessons/page-kit-devices.md#kit-devices-91
     */
    {
      const [nameEl, patchEl] = sk.plate.lines;
      const [nameShown, patchShown] = sk.plate.shown();
      const tf = getComputedStyle(patchEl).textTransform;
      d.assert('a patch name renders as it was typed while the instrument’s name renders in capitals',
        patchShown === patchEl.textContent && patchShown !== patchShown.toUpperCase()
          && nameShown === nameEl.textContent.toUpperCase() && tf === 'none',
        `${nameShown} over ${patchShown}, the patch line’s transform ${tf}`);
    }

    /**
     * Every row's ink starts on one line and a component brings no inset of its own into a
     * row: padding on a borderless box is an invented margin. This walks every row of every
     * panel, measures its first child, and names each offender.
     * See lessons/page-kit-devices.md#kit-devices-92
     */
    {
      const panels = [['sketch', ipanelSpec.sketch.glue], ['stomp', ipanelSpec.stomp.glue],
        ['box16', ipanelSpec.box16.glue], ['desk', ipanelSpec.desk.glue], ['foot', ipanelSpec.foot.glue], ['strip', rowsSpec.g],
        ['settings', rowsSpec.settings], ['meter', rowsSpec.meter], ['form', rowsSpec.form],
        ['hidden', rowsSpec.hidden], ['scopes', rowsSpec.scopes], ['stripFull', rowsSpec.stripFull],
        ['settingsFull', rowsSpec.settingsFull], ['stripNarrow', rowsSpec.stripNarrow], ['clusterNarrow', rowsSpec.clusterNarrow]];
      /* What is read is the child's own left padding, border and margin, not its box against
         the row's content edge; alignment is graded elsewhere.
         See lessons/page-kit-devices.md#kit-devices-93 */
      /* Three claims: a margin is never the child's; padding is an invented margin only with
         no border to frame it; a border in a row is a box in a box only on a non-control.
         See lessons/page-kit-devices.md#kit-devices-94 */
      /* not input or textarea: a text box is a well and reads --edge (shell.css,
         .pos-field input), so in a glue it has no border to exempt, and one it
         did show would be the doubled seam /fau/ paid for */
      const isControl = (el) => el.matches('button, select, [role="button"], .pos-choice, .pos-pick, .pos-toggle, .pos-check, .pos-stepper, .pos-bgroup');
      const off = [];
      let kidsSeen = 0;
      for (const [name, g] of panels) {
        for (const row of g.rows()) {
          if (getComputedStyle(row).display === 'none') continue;
          for (const kid of row.children) {
            kidsSeen++;
            const tag = `${name}/${row.dataset.kind || 'row'} ${kid.className.split(' ')[0]}`;
            const m = px(kid, 'marginLeft'), p = px(kid, 'paddingLeft'), b = px(kid, 'borderLeftWidth');
            if (m > 0.6) off.push(`${tag} margin ${m}px`);
            if (p > 0.6 && b === 0) off.push(`${tag} padding ${p}px with no border`);
            if (b > 0.6 && !isControl(kid)) off.push(`${tag} border ${b}px on a non-control`);
          }
        }
      }
      d.assert('no child of a glued row carries a margin, a borderless padding, or a border that is not a control\u2019s',
        kidsSeen >= 30 && off.length === 0,
        `${kidsSeen} row children measured, ${off.length} carrying an inset of their own${off.length ? `: ${off.join(', ')}` : ''}`);
    }

    /**
     * A keyboard in a row gives up its box: .kbd has margin 0 0 10px, which .pos-glue
     * zeroes on direct children only, so the rule is written `> X` and `> * > X`.
     * See lessons/page-kit-devices.md#kit-devices-95
     */
    {
      const kbEl = sk.keys.querySelector('.kbd');
      const above = +(r(kbEl).top - (r(sk.keys).top + px(sk.keys, 'paddingTop'))).toFixed(1);
      const below = +((r(sk.keys).bottom - px(sk.keys, 'paddingBottom')) - r(kbEl).bottom).toFixed(1);
      d.assert('a keyboard glued into a row keeps no border and no margin of its own, so the row is even',
        kbEl !== null && edge(kbEl) === 0 && Math.abs(above - below) <= 0.6,
        `${above} px of row above the keys and ${below} px below, with ${edge(kbEl)} px of border on them`);
    }
  }

  /**
   * The label and step columns are separate flex children sharing one pitch only by
   * token, so first row is checked against first label and last against last.
   * See lessons/page-kit-devices.md#kit-devices-96
   */
  /**
   * A row that cannot fit scrolls inside itself: overflow-x needs min-width: 0 on the same
   * element, or the page scrolls instead. Read from computed values. Not a phone check:
   * verify.mjs runs at 756 px and enters no media query.
   * See lessons/page-kit-devices.md#kit-devices-97
   */
  {
    /* .pos-cg's columns are fixed at the measured pitch, never 1fr, to stay square, so a
       five wide grid of 50.6 px knobs is 280 px on any phone and needs both properties.
       See lessons/page-kit-devices.md#kit-devices-98 */
    const pairs = [
      ['.pos-padgrid', document.querySelector('.pos-padgrid')],
      ['.kit-chans', document.querySelector('.kit-chans')],
      ['.pos-cg', document.querySelector('.pos-cg')],
    ].filter(([, n]) => n);
    const read = pairs.map(([sel, n]) => {
      const cs = getComputedStyle(n);
      return { sel, ox: cs.overflowX, mw: cs.minWidth };
    });
    d.assert('a row too wide for its box scrolls inside itself, which is two properties and not one',
      read.length === 3
      && read.every((r) => r.ox === 'auto' && r.mw === '0px'),
      read.map((r) => `${r.sel} is overflow-x ${r.ox} at min-width ${r.mw}`).join(', ')
        || 'neither element is on the page');
  }

  /**
   * The plate is read as rendered: createNameplate.shown() applies text-transform first,
   * since textContent grades the source. A plate with no maker must be `end`, since
   * `ends` (space-between) parks a lone child left; plateSpec decides it.
   * See lessons/page-kit-devices.md#kit-devices-99
   */
  /**
   * The claim is the square, so dial centres are measured, across against down on a
   * three by two lattice, so a grid square only at cell zero cannot pass.
   * See lessons/page-kit-devices.md#kit-devices-100
   */
  /**
   * The invisible hand on a knob, as three separate asserts.
   * See lessons/page-kit-devices.md#kit-devices-101
   */
  if (handKnobs) {
    const withHand = handKnobs[3];
    const plain = handKnobs[0];
    const btn = withHand.el.querySelector('.pos-knob-hand');
    const dial = withHand.el.querySelector('.pos-knob-dial');
    const kb = withHand.el.getBoundingClientRect();
    const db = dial.getBoundingClientRect();
    const bb = btn.getBoundingClientRect();
    const f = parseFloat(getComputedStyle(withHand.el).getPropertyValue('--knob-ring-f'));
    /* Where the ring's lower edge is on screen, from the drawing's own fraction.
       See lessons/page-kit-devices.md#kit-devices-102 */
    const ringY = db.top + db.height * f;

    d.assert('the hand button is centred across the knob, not merely near the middle',
      Math.abs((bb.left + bb.width / 2) - (kb.left + kb.width / 2)) <= 0.6,
      `button centre ${(bb.left + bb.width / 2).toFixed(1)} px against the knob's `
      + `${(kb.left + kb.width / 2).toFixed(1)} px`);

    d.assert('the hand button sits on the ring\u2019s lower edge, which is read off the drawing',
      Math.abs((bb.top + bb.height / 2) - ringY) <= 1.0,
      `button centre y ${(bb.top + bb.height / 2).toFixed(1)} px against the ring edge at `
      + `${ringY.toFixed(1)} px, which is ${f} of a ${db.height.toFixed(1)} px drawing`);

    /* The button is absolute so the knob gains no height: its label would drop out of line
       with its neighbours (the --ctl-head and --ctl-foot contract).
       See lessons/page-kit-devices.md#kit-devices-103 */
    d.assert('a knob with a hand is exactly as tall as one without, so a row still lines up',
      Math.abs(kb.height - plain.el.getBoundingClientRect().height) <= 0.6
      && Math.abs(kb.top - plain.el.getBoundingClientRect().top) <= 0.6,
      `${kb.height.toFixed(1)} px against ${plain.el.getBoundingClientRect().height.toFixed(1)} px, `
      + `tops ${kb.top.toFixed(1)} and ${plain.el.getBoundingClientRect().top.toFixed(1)}`);

    /* The size as a ratio against --ctl-w, read and divided rather than typing 50.6.
       See lessons/page-kit-devices.md#kit-devices-104 */
    const ctlW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-w'));
    const pad = document.querySelector('.pos-pad');
    d.assert('a knob is ten per cent wider than a control row\u2019s unit, and a pad is not',
      Math.abs(db.width / ctlW - 1.1) <= 0.02
      && (!pad || Math.abs(pad.getBoundingClientRect().width - ctlW) <= 1),
      `dial ${db.width.toFixed(1)} px against --ctl-w ${ctlW} px, a factor of `
      + `${(db.width / ctlW).toFixed(3)}`
      + (pad ? `, and a pad still ${pad.getBoundingClientRect().width.toFixed(1)} px` : ', no pad on the page'));

    /* Negative control: a knob not given a hand has no button, so a selector matching
       nothing cannot pass the asserts above by never running them.
       See lessons/page-kit-devices.md#kit-devices-105 */
    d.assert('a knob with no hand has no button, so the option is what puts it there',
      plain.el.querySelector('.pos-knob-hand') === null && withHand.hand !== null
      && plain.hand === null,
      `the plain knob has ${plain.el.querySelectorAll('.pos-knob-hand').length} and `
      + `publishes ${plain.hand === null ? 'no hand' : 'a hand'}`);
  }

  if (cgSpec) {
    for (const g of [cgSpec.six, cgSpec.four]) g.size();
    /* `dy` is null on a single row (the faders are four in four columns); reading
       c[cols].y unconditionally would throw and kill the page instead of failing an assert.
       See lessons/page-kit-devices.md#kit-devices-106 */
    const read = (g, cols) => {
      const c = g.centres();
      return {
        dx: +(c[1].x - c[0].x).toFixed(1),
        dy: c[cols] ? +(c[cols].y - c[0].y).toFixed(1) : null,
        dx2: c[2] ? +(c[2].x - c[1].x).toFixed(1) : null,
        pitch: g.pitch(),
      };
    };
    const six = read(cgSpec.six, 3);
    const four = read(cgSpec.four, 2);
    d.assert('dial centres land on a square lattice, across equalling down, on both grids',
      Math.abs(six.dx - six.dy) <= 1 && Math.abs(four.dx - four.dy) <= 1
      && six.dx > 40 && four.dx > 40,
      `three by two is ${six.dx} across against ${six.dy} down at a `
      + `${six.pitch} px pitch, two by two is ${four.dx} against ${four.dy}`);

    /* Every column, not the first pair, so reaching for 1fr goes red rather than staying
       square at one width only.
       See lessons/page-kit-devices.md#kit-devices-107 */
    d.assert('the columns are even across the row, so the lattice does not drift',
      Math.abs(six.dx - six.dx2) <= 0.6,
      `first gap ${six.dx}, second ${six.dx2}`);

    /* Centre to centre is the pitch plus the gap: 101 across at a 91 px pitch on the knob
       grids, so the asserts above carry that term.
       See lessons/page-kit-devices.md#kit-devices-108 */
  }

  if (instSpec) {
    const named = instSpec.named.shown();
    /* The computed justify-content, not rects: .panel-plate-l is full width, so its edges
       match the plate whatever the placement. `ends` is space-between, `end` is flex-end.
       See lessons/page-kit-devices.md#kit-devices-109 */
    /* The one line plate is graded in INSTRUMENT HEADER. `end` inside a case's top inset is
       graded nowhere.
       See lessons/page-kit-devices.md#kit-devices-110 */
    const nj = getComputedStyle(instSpec.named.plate.el).justifyContent;
    d.assert('an instrument prints the maker at one end and the model at the other, as rendered',
      named.join(' / ') === 'POSITRON / PLAI' && named.length === 2
      && instSpec.named.plate.place === 'ends' && nj === 'space-between',
      `named reads ${JSON.stringify(named)} at ${instSpec.named.plate.place} (${nj})`);

    /* The plate belongs to the case, above both halves, or it scrolls away from the
       instrument it names.
       See lessons/page-kit-devices.md#kit-devices-111 */
    /**
     * The plate sits off the top by the case's own inset: .panel-case pads horizontally
     * only. The claim is an equality with the side inset, so a change to --panel-pad moves
     * both or goes red.
     * See lessons/page-kit-devices.md#kit-devices-112
     */
    {
      const caseEl = instSpec.named.el;
      const cs = getComputedStyle(caseEl);
      const cr = caseEl.getBoundingClientRect();
      /* The line, not the plate's box: the inset is padding-block on the plate, so its box
         starts at the case's content top and its text sits 20 px down.
         See lessons/page-kit-devices.md#kit-devices-113 */
      const pr = instSpec.named.plate.el
        .querySelector('.panel-plate-l').getBoundingClientRect();
      const side = parseFloat(cs.paddingLeft);
      const top = pr.top - cr.top - parseFloat(cs.borderTopWidth);
      d.assert('the plate sits off the top by the same inset the controls sit off the sides',
        side > 0 && Math.abs(top - side) <= 1,
        `${top.toFixed(1)} px above the plate against ${side.toFixed(1)} px at the side`);
    }

    /* The strip is inside panel-wrap, not the case; the claim is order (plate first), which
       compareDocumentPosition answers whatever the nesting.
       See lessons/page-kit-devices.md#kit-devices-114 */
    const kids = [...instSpec.named.el.children];
    const after = instSpec.named.plate.el
      .compareDocumentPosition(instSpec.named.strip) & Node.DOCUMENT_POSITION_FOLLOWING;
    d.assert('the plate is the case\u2019s first child, and the scrolling strip comes after it',
      kids[0] === instSpec.named.plate.el && !!after
      && instSpec.named.el.contains(instSpec.named.strip),
      `the case holds ${kids.map((k) => (k.className || '').toString().split(' ')[0]).join(', ')}, `
      + `and the strip is ${after ? 'after' : 'NOT after'} the plate`);
  }

  if (chanSpec) {
    /**
     * Three alignments are three asserts, each reading the working surface, never the
     * wrapper: a knob's .pos-knob-dial, a pad's `button`, a fader's .pos-fdr-lane.
     * See lessons/page-kit-devices.md#kit-devices-115
     */
    const mid = (n) => { const r = n.getBoundingClientRect(); return r.left + r.width / 2; };
    const lanes = chanSpec.map((c) => ({
      dial: mid(c.knob.el.querySelector('.pos-knob-dial')),
      pad: mid(c.pad.button),
      half: mid(c.half.button),
      fader: mid(c.fader.el.querySelector('.pos-fdr-lane')),
      box: c.lane.getBoundingClientRect(),
    }));
    const worst = (a, b) => Math.max(...lanes.map((l) => Math.abs(l[a] - l[b])));

    d.assert('in every lane the dial and the pad sit on one centre line',
      worst('dial', 'pad') <= 1,
      `worst ${worst('dial', 'pad').toFixed(2)} px apart over ${lanes.length} lanes, `
      + `and a knob is wider than a pad so this is centring rather than matching`);

    d.assert('in every lane the pad and the half pad sit on that same line',
      worst('pad', 'half') <= 1,
      `worst ${worst('pad', 'half').toFixed(2)} px apart`);

    d.assert('in every lane the fader’s lane sits on it too',
      worst('dial', 'fader') <= 1,
      `worst ${worst('dial', 'fader').toFixed(2)} px apart, measured on the lane and not the column`);

    /**
     * The divider is between lanes: read as the computed border against .panel-fixed-l's
     * token, and the last lane has none.
     * See lessons/page-kit-devices.md#kit-devices-116
     */
    const borders = chanSpec.map((c) => getComputedStyle(c.lane));
    const lineTok = getComputedStyle(document.documentElement)
      .getPropertyValue('--line').trim();
    const probe = el('div');
    probe.style.color = lineTok;
    document.body.append(probe);
    const lineRgb = getComputedStyle(probe).color;
    probe.remove();
    d.assert('a divider sits between two lanes and never after the last one, in the panel’s own line',
      borders.slice(0, -1).every((cs) => parseFloat(cs.borderRightWidth) === 1
        && cs.borderRightColor === lineRgb)
      && parseFloat(borders[borders.length - 1].borderRightWidth) === 0,
      `${borders.length - 1} dividers of ${lineRgb} and none on lane `
      + `${borders.length}, against --line ${lineTok}`);

    /* Negative control: the lanes are four separate columns, or one lane holding everything
       would pass every assert above.
       See lessons/page-kit-devices.md#kit-devices-117 */
    const lefts = lanes.map((l) => +l.box.left.toFixed(1));
    d.assert('NEGATIVE CONTROL: the four lanes are four columns, each starting further right',
      new Set(lefts).size === 4
      && lefts.every((x, i) => i === 0 || x > lefts[i - 1])
      && new Set(lanes.map((l) => +l.dial.toFixed(1))).size === 4,
      `lanes start at ${lefts.join(', ')} and their dials sit at `
      + `${lanes.map((l) => l.dial.toFixed(0)).join(', ')}`);
  }

  if (headSpec) {
    /**
     * The centre is on the case, read against the case's box, not the header under test.
     * Both cases are read, since their outer contents differ deliberately.
     * See lessons/page-kit-devices.md#kit-devices-118
     */
    const centres = ['acting', 'reporting'].map((k) => {
      const inst = headSpec[k];
      const caseR = inst.el.getBoundingClientRect();
      /* The middle cell is the nameplate; the claim is that column 2 is centred on the case,
         so it follows the cell rather than its tenant.
         See lessons/page-kit-devices.md#kit-devices-119 */
      const midR = inst.plate.el.getBoundingClientRect();
      const onR = inst.online.el.getBoundingClientRect();
      const plateR = inst.patchSlot.getBoundingClientRect();
      return {
        k,
        off: (midR.left + midR.width / 2) - (caseR.left + caseR.width / 2),
        /* Where a flex row would have put it: the middle of the space left
           between the two outer children, which is what `space-between` on
           three children does. */
        flex: (onR.right + (plateR.left - onR.right) / 2) - (caseR.left + caseR.width / 2),
        on: onR.width, plate: plateR.width,
      };
    });
    d.assert('the nameplate sits on the case’s own centre, on both cases',
      centres.every((c) => Math.abs(c.off) <= 1),
      centres.map((c) => `${c.k} is ${c.off.toFixed(1)} px off the case centre`).join(', '));

    /* Negative control: a flex row would put the middle child wherever its unequal
       neighbours leave it, so that answer must be elsewhere.
       See lessons/page-kit-devices.md#kit-devices-120 */
    d.assert('NEGATIVE CONTROL: balanced between its neighbours it would land somewhere else',
      centres.every((c) => Math.abs(c.flex) > 4)
      && centres.some((c) => Math.abs(c.on - c.plate) > 10),
      centres.map((c) => `${c.k} would be ${c.flex.toFixed(1)} px off, with a `
        + `${c.on.toFixed(0)} px status against a ${c.plate.toFixed(0)} px picker`).join(', '));

    /**
     * A control that acts is a button and one that reports is not, and the press is driven
     * here. It is not in .pos-controls, so this is the only place it is pressed.
     * See lessons/page-kit-devices.md#kit-devices-121
     */
    const was = headSpec.acting.online.state();
    headSpec.acting.online.el.click();
    const now = headSpec.acting.online.state();
    d.assert('a press on the acting header really switches it, and the badge follows',
      headSpec.acting.online.el.tagName === 'BUTTON' && headSpec.presses() === 1
      && was === 'online' && now === 'offline',
      `${was} became ${now} after ${headSpec.presses()} press`);

    /**
     * The switch is the same width ON and OFF, exactly: the words differ by one character,
     * 6.62 px on this face. Driven by a real press, read after the 90 ms fade out and in.
     * The aria-label keeps the full name.
     * See lessons/page-kit-devices.md#kit-devices-122
     */
    {
      const btn = headSpec.acting.online.el;
      /* A word swaps at the trough of a 90 ms fade, so each read waits 260 ms.
         See lessons/page-kit-devices.md#kit-devices-123 */
      const land = async () => {
        await new Promise((r) => setTimeout(r, 260));
      };
      await land();                      // the press in the assert above is still fading
      const before = headSpec.acting.online.state();
      const wBefore = btn.getBoundingClientRect().width;
      const sBefore = (btn.textContent || '').trim();
      btn.click();                       // a REAL press, back the other way
      await land();
      const after = headSpec.acting.online.state();
      const wAfter = btn.getBoundingClientRect().width;
      const sAfter = (btn.textContent || '').trim();
      const aria = btn.getAttribute('aria-label') || '';
      /* --pres-ch is a character count computed off the words, so it cannot drift; the rendered
         widths then differ by about 0.02 px, and a 0.1 px tolerance cannot hide 6.62 px.
         See lessons/page-kit-devices.md#kit-devices-124 */
      const ch = btn.querySelector('.pos-pres-w')?.style.getPropertyValue('--pres-ch');
      d.assert('the header switch is one width in both states, and says the state without the name',
        before !== after && Math.abs(wBefore - wAfter) <= 0.1 && ch === '3'
        && sBefore !== sAfter
        && /^(on|off)$/.test(sBefore) && /^(on|off)$/.test(sAfter)
        && !/PLAI/.test(sBefore) && !/PLAI/.test(sAfter)
        && aria.includes('PLAI'),
        `"${sBefore}" ${wBefore.toFixed(2)} px against "${sAfter}" ${wAfter.toFixed(2)} px, `
        + `a reserve of ${ch} characters which is the longer word, `
        + `pressed from ${before} to ${after}, and the label still reads "${aria}"`);
    }

    /* The other half, as an absence: the badge has no button. It reads the status cell,
       since the patch selector's prev and next are buttons too.
       See lessons/page-kit-devices.md#kit-devices-125 */
    const rep = headSpec.reporting.online.el;
    d.assert('NEGATIVE CONTROL: a header with nothing to press builds no button and takes no tab stop',
      rep.tagName !== 'BUTTON' && rep.tabIndex <= 0
      && rep.querySelector('button') === null
      && headSpec.acting.online.el.tagName === 'BUTTON',
      `the reporting status is a <${rep.tagName.toLowerCase()}> holding `
      + `${rep.querySelectorAll('button').length} buttons, against a `
      + `<${headSpec.acting.online.el.tagName.toLowerCase()}> on the acting one`);

    /* The plate in a header is `end` whether it has one line or two. It sits in the middle
       cell: `end` is how a plate lays out its own lines, the column is the header's.
       See lessons/page-kit-devices.md#kit-devices-126 */
    const two = headSpec.acting.plate.shown();
    const one = headSpec.reporting.plate.shown();
    d.assert('a header’s plate lays out at its end, one line or two, in the middle cell',
      two.join(' / ') === 'POSITRON / PLAI' && one.length === 1 && one[0] === 'MODEL 12'
      && headSpec.acting.plate.place === 'end' && headSpec.reporting.plate.place === 'end'
      && getComputedStyle(headSpec.acting.plate.el).justifyContent === 'flex-end'
      && getComputedStyle(headSpec.acting.plate.el).gridColumnStart === '2',
      `${JSON.stringify(two)} and ${JSON.stringify(one)}, both at `
      + `${headSpec.acting.plate.place} in column `
      + `${getComputedStyle(headSpec.acting.plate.el).gridColumnStart}`);

    /* The header is the case's first child, so it cannot scroll away, and the case carries
       no plate of its own, so one instrument never shows two names.
       See lessons/page-kit-devices.md#kit-devices-127 */
    const hk = [...headSpec.acting.el.children];
    d.assert('the header is the case’s first child, and the case carries no second plate',
      hk[0] === headSpec.acting.head
      && headSpec.acting.el.querySelectorAll('.panel-plate').length === 1,
      `the case holds ${hk.map((k) => (k.className || '').toString().split(' ')[0]).join(', ')}`);

    /**
     * The phone layout cannot be graded here (verify.mjs runs at 756 px). This asserts only
     * that its block comes last in shell.css: a media query adds no specificity.
     * See lessons/page-kit-devices.md#kit-devices-128
     */
    {
      const sheet = [...document.styleSheets].find((s) => (s.href || '').includes('shell.css'));
      let lastPlain = -1, media = -1;
      try {
        const rules = [...sheet.cssRules];
        rules.forEach((r, i) => {
          if (r.selectorText && /\.panel-head/.test(r.selectorText)) lastPlain = i;
          if (r.media && /560px/.test(r.conditionText || r.media.mediaText)
            && [...r.cssRules].some((x) => /\.panel-head/.test(x.selectorText || ''))) media = i;
        });
      } catch { /* a cross origin sheet cannot be read, and says so below */ }
      d.assert('the header’s phone block comes after every plain rule it has to beat',
        media > lastPlain && lastPlain >= 0,
        `the last plain .panel-head rule is at ${lastPlain} and the 560 px block at ${media}`);
    }
  }

  if (stepSpec) {
    /**
     * The needle lands on the step, read off the drawing: the pointer path is M cx cy L ex
     * ey, the tick between r=24 and r=32 off a centre at 50,50.
     * See lessons/page-kit-devices.md#kit-devices-129
     */
    const angleOf = (k) => {
      const d2 = k.el.querySelector('.pos-knob-ptr').getAttribute('d');
      const [, x, y] = d2.match(/L\s+([\d.-]+)\s+([\d.-]+)/).map(Number);
      return Math.atan2(x - 50, 50 - y) * 180 / Math.PI;
    };
    /* 270 degrees of sweep, so a value's angle is -135 plus its share of 270. */
    const wanted = (k, min, max) => -135 + ((k.value() - min) / (max - min)) * 270;

    stepSpec.stepped.set(5.4, { from: 'hand' });
    const landed = stepSpec.stepped.value();
    d.assert('a stepped knob lands on a whole step and the needle lands with it',
      landed === 5 && Math.abs(angleOf(stepSpec.stepped) - wanted(stepSpec.stepped, 1, 8)) < 0.5,
      `5.4 became ${landed}, needle at ${angleOf(stepSpec.stepped).toFixed(1)} degrees `
      + `against ${wanted(stepSpec.stepped, 1, 8).toFixed(1)} wanted`);

    stepSpec.quarters.set(1.4, { from: 'hand' });
    d.assert('a fractional step lands on a quarter and prints the places its step has',
      stepSpec.quarters.value() === 1.5
      && stepSpec.quarters.el.querySelector('.pos-knob-v').textContent === '1.50',
      `1.4 became ${stepSpec.quarters.value()}, printed as `
      + `"${stepSpec.quarters.el.querySelector('.pos-knob-v').textContent}"`);

    /* Negative control: a snap leaking into the default would quantise every knob on the
       site with both asserts above green.
       See lessons/page-kit-devices.md#kit-devices-130 */
    stepSpec.free.set(0.371, { from: 'hand' });
    d.assert('NEGATIVE CONTROL: a knob with no step keeps the value it was given',
      Math.abs(stepSpec.free.value() - 0.371) < 1e-9,
      `0.371 stayed ${stepSpec.free.value()}`);

    /**
     * The number's box does not move: two readings at values with different digit counts,
     * since two of equal length could not fail.
     * See lessons/page-kit-devices.md#kit-devices-131
     */
    {
      const numOf = (k) => k.el.querySelector('.pos-knob-v');
      const read = (k, v) => {
        k.set(v, { from: 'hand' });
        const n = numOf(k);
        return { text: n.textContent, w: n.getBoundingClientRect().width };
      };
      const a = read(stepSpec.free, -0.94);
      const b = read(stepSpec.free, 0.1);
      d.assert('the value box is one width at every value, and the places never change',
        a.w > 0 && Math.abs(a.w - b.w) < 0.5
        && a.text.length !== b.text.length
        && a.text.split('.')[1].length === b.text.split('.')[1].length,
        `"${a.text}" is ${a.w.toFixed(2)} px and "${b.text}" is ${b.w.toFixed(2)} px, `
        + `${a.text.length} characters against ${b.text.length}`);

      /* Negative control for the box: the reserve is a real width off the component. A 0 to
         127 knob reserves three characters and a -1 to 1 knob five.
         See lessons/page-kit-devices.md#kit-devices-132 */
      const res = (k) => getComputedStyle(k.el).getPropertyValue('--knob-num-w').trim();
      d.assert('NEGATIVE CONTROL: the reserve is measured per knob, so two ranges differ',
        res(stepSpec.free) === '5ch' && res(stepSpec.stepped) === '1ch'
        && numOf(stepSpec.free).getBoundingClientRect().width
           > numOf(stepSpec.stepped).getBoundingClientRect().width,
        `-1 to 1 reserves ${res(stepSpec.free)} and 1 to 8 by ones reserves `
        + `${res(stepSpec.stepped)}`);
    }
  }

  if (trigSpec) {
    /* A triggered scope before its first hit is a flat line, drawn, in the
       triggered mode, and says so to a screen reader; no frame loop started. */
    const g = trigSpec.held.get();
    d.assert('a triggered scope waits on a flat line before its first hit',
      trigSpec.held.mode === 'triggered' && trigSpec.held.drawn() && g.points.length === 512
      && Array.from(g.points).every((x) => x === 0) && trigSpec.held.triggers().triggered === 0,
      `mode ${trigSpec.held.mode}, ${g.points.length} points all zero, ${trigSpec.held.triggers().triggered} hits`);
  }

  if (gridSpec) {
    /* Nothing in the label column is cut: its corner says `beat`, so it is over the 22 px floor.
       why: lessons/page-kit-devices.md#kit-devices-133 */
    const cutIn = (g) => [...g.labels, g.fixed.querySelector('.pos-pg-corner')]
      .filter((l) => l && l.scrollWidth > l.clientWidth + 0.5).map((l) => l.textContent);
    const cut = cutIn(gridSpec.edit);
    const nw = gridSpec.edit.fixed.getBoundingClientRect().width;
    d.assert('a step grid label column is as wide as its widest label, so no name and no corner word is cut',
      cut.length === 0 && nw > 22,
      `numbered column ${nw.toFixed(1)} px, ${cut.length ? `${cut.join(', ')} cut` : 'nothing cut'}`);
  }

  if (namedSpec) {
    /* The drum grid has no label column; the row's name is on every pad's hover and accessible name. */
    const g = namedSpec.named;
    const bad = g.pads.flatMap((row, r) => row.filter((p) => p.title !== namedSpec.NAMES[r]
      || !p.getAttribute('aria-label')?.startsWith(`${namedSpec.NAMES[r]}, step `)));
    const cols = g.el.closest('.kit-pg').querySelectorAll('.pos-pg-labs, .pos-pg-lab').length;
    d.assert('a drum grid draws no label column, and every pad says its row\'s name on hover',
      g.fixed === null && g.labels.length === 0 && cols === 0 && bad.length === 0 && g.pads.flat().length === 64,
      `${cols} label elements, ${bad.length} of ${g.pads.flat().length} pads without their row's name, `
      + `row 3 reads "${g.pads[3][0].title}"`);
  }

  if (gridSpec) {
    gridSpec.edit.size();
    const g = gridSpec.edit;
    const p0 = g.pads[0][0].getBoundingClientRect();
    const l0 = g.labels[0].getBoundingClientRect();
    const pz = g.pads[g.pads.length - 1][0].getBoundingClientRect();
    const lz = g.labels[g.labels.length - 1].getBoundingClientRect();
    d.assert('the label column and the steps share one pitch, at the first row and at the last',
      Math.abs(p0.top - l0.top) <= 0.6 && Math.abs(pz.top - lz.top) <= 0.6
      && Math.abs(pz.bottom - lz.bottom) <= 0.6,
      `first ${(p0.top - l0.top).toFixed(2)} px apart, last `
      + `${(pz.top - lz.top).toFixed(2)} px at the top and `
      + `${(pz.bottom - lz.bottom).toFixed(2)} at the bottom, over ${g.labels.length} rows`);

    /* The pads are square and fill the room. The token is written from script, so neither
       half can be read off the stylesheet.
       See lessons/page-kit-devices.md#kit-devices-134 */
    d.assert('a pad is square and the sixteen of them fill the strip they are in',
      Math.abs(p0.width - p0.height) <= 0.6 && p0.width > 20
      && Math.abs(p0.width - padWidth(g.el.parentElement.clientWidth, 16)) <= 1,
      `${p0.width.toFixed(1)} by ${p0.height.toFixed(1)} px, against `
      + `${padWidth(g.el.parentElement.clientWidth, 16)} from the arithmetic`);

    /* The read only pad's cursor, opacity and tab stops are not graded anywhere; its
       structure is in demo/shell/step-grid-test.mjs. /pack/ is where it would belong.
       See lessons/page-kit-devices.md#kit-devices-135 */
    d.assert('the whole editable grid is one tab stop and not one per pad',
      gridSpec.edit.rowsEl.querySelectorAll('[tabindex="0"]').length === 1
      && gridSpec.edit.pads.flat().length === 96,
      `1 of ${gridSpec.edit.pads.flat().length} pads is reachable by tab`);

    /* A lit pad on a row that can make no sound stays grey: brightness says whether it can sound.
       See lessons/page-kit-devices.md#kit-devices-136 */
    const mute = gridSpec.edit.pads[4][3];
    const loud = gridSpec.edit.pads[0][0];
    d.assert('a lit pad on a row with nothing behind it is grey, and one that can sound is amber',
      mute.dataset.on === '1' && mute.dataset.mute === '1'
      && loud.dataset.on === '1' && loud.dataset.mute === undefined
      && getComputedStyle(mute).backgroundColor !== getComputedStyle(loud).backgroundColor,
      `silent row ${getComputedStyle(mute).backgroundColor} against `
      + `${getComputedStyle(loud).backgroundColor}`);

    /**
     * The pad's own colour survives both heads, so [data-on], [data-mute] and [data-bar]
     * stay readable. A running head is an inset wash over that colour; a parked head must
     * not carry it, or waiting and running look the same.
     * See lessons/page-kit-devices.md#kit-devices-137
     */
    const at = gridSpec.edit.step();
    const cell = gridSpec.edit.pads[0][at];
    const base = getComputedStyle(gridSpec.edit.pads[0][(at + 4) % 16]).backgroundColor;
    const parked = getComputedStyle(cell);
    const parkedBg = parked.backgroundColor, parkedFilter = parked.filter;
    const parkedShadow = parked.boxShadow;
    gridSpec.edit.live(true);
    const playing = getComputedStyle(cell);
    const playBg = playing.backgroundColor, playFilter = playing.filter;
    const playShadow = playing.boxShadow;
    gridSpec.edit.live(false);
    d.assert('neither head replaces the pad\u2019s own colour, and only the running one carries the wash',
      parkedBg === base && playBg === base
      && parkedFilter !== 'none' && playFilter !== 'none'
      && /inset/.test(playShadow) && !/inset/.test(parkedShadow),
      `the pad keeps ${playBg} in both states · parked ${parkedFilter} with `
      + `shadow ${parkedShadow.slice(0, 40)} · playing ${playFilter} with `
      + `shadow ${playShadow.slice(0, 40)}`);

    /**
     * A grid with no tempo to claim gets no clock: the component answers null, and
     * step-grid-test.mjs asserts that and the throw on a rate with no `whose`. Played and
     * stopped and put back with no await between, so no frame shows it.
     * See lessons/page-kit-devices.md#kit-devices-138
     */
    const clock = gridSpec.edit.clock;
    clock.play();
    const ran = { on: clock.playing(), live: gridSpec.edit.rowsEl.hasAttribute('data-live') };
    clock.stop();
    d.assert('the clock plays, stops back at the first column, and names whose tempo it is',
      !!clock && /this page/.test(clock.whose) && clock.bpm() === 120
      && clock.stepMs() === 125
      && ran.on === true && ran.live === true
      && clock.playing() === false && gridSpec.edit.step() === 0,
      `${clock.bpm()} beats a minute is ${clock.stepMs()} ms a step, owned by `
      + `"${clock.whose}"`);

    /**
     * The bar and the grid are one surface with a 1 px seam, bar above. A real strip
     * scrolling at phone width is not checked; step-grid-test.mjs keeps the arithmetic.
     * See lessons/page-kit-devices.md#kit-devices-139
     */
    {
      const glue = gridSpec.barHost.parentElement;
      const b = gridSpec.barHost.getBoundingClientRect();
      const w = gridSpec.wrap.getBoundingClientRect();
      const seam = w.top - b.bottom;
      d.assert('the transport is one surface with the grid, seam of 1 px, and it is the half on top',
        glue.classList.contains('pos-glue')
        && glue.children[0] === gridSpec.barHost && glue.children[1] === gridSpec.wrap
        && Math.abs(seam - 1) < 0.6 && b.bottom <= w.top,
        `${glue.children.length} parts, the bar ends at ${b.bottom.toFixed(0)} and `
        + `the grid starts at ${w.top.toFixed(0)}, a seam of ${seam.toFixed(1)} px`);
    }

    /**
     * Both axes on one grid, neither on the other: the absence is the half worth grading.
     * Ticks count beats, not steps: sixteen steps at four to a beat is four numbers (tickText).
     * See lessons/page-kit-devices.md#kit-devices-140
     */
    {
      const said = (g) => g.el.querySelectorAll('.pos-pg-tick')
        .length && [...g.el.querySelectorAll('.pos-pg-tick')]
        .filter((t) => t.textContent.trim()).length;
      d.assert('a grid can be labelled on both axes, and the steps are counted in beats',
        said(gridSpec.edit) === 4 && gridSpec.edit.labels.length === 6
        && [...gridSpec.edit.el.querySelectorAll('.pos-pg-tick')]
          .filter((t) => t.textContent.trim()).map((t) => t.textContent).join('') === '1234',
        `${said(gridSpec.edit)} numbers on 16 steps at 4 to a beat, over `
        + `${gridSpec.edit.labels.length} row labels`);

      d.assert('NEGATIVE CONTROL: a grid given neither axis builds no label column and no numbers',
        said(gridSpec.bare) === 0 && gridSpec.bare.labels.length === 0
        && gridSpec.bareWrap.querySelectorAll('.pos-pg-lab').length === 0
        && gridSpec.bare.el.querySelectorAll('.pos-pg-tick').length === 16,
        `${gridSpec.bare.el.querySelectorAll('.pos-pg-tick').length} ticks carrying `
        + `${said(gridSpec.bare)} words, and ${gridSpec.bare.labels.length} row labels`);
    }

    /**
     * The right inset equals the bottom one, as two claims: the computed pair, and the
     * rendered distance from the last pad to the content edge, which a scroller can fail.
     * See lessons/page-kit-devices.md#kit-devices-141
     */
    {
      const cs = getComputedStyle(gridSpec.wrap);
      const pr = parseFloat(cs.paddingRight), pb = parseFloat(cs.paddingBottom);
      d.assert('the step grid’s right inset is the same measurement as its bottom one',
        pr > 0 && Math.abs(pr - pb) < 0.5,
        `${pr} px right against ${pb} px bottom, both from --kit-pg-inset`);

      const box = gridSpec.wrap.getBoundingClientRect();
      const row = gridSpec.edit.pads[0];
      const last = row[row.length - 1].getBoundingClientRect();
      const lastRow = gridSpec.edit.pads[gridSpec.edit.pads.length - 1][0]
        .getBoundingClientRect();
      const right = box.right - last.right;
      const bottom = box.bottom - lastRow.bottom;
      d.assert('and the last pad is no closer to the right edge than to the bottom one',
        right >= pr - 0.5 && bottom >= pb - 0.5,
        `${right.toFixed(1)} px to the right edge against ${bottom.toFixed(1)} px `
        + `to the bottom, on an inset of ${pr} px`);
    }

    /**
     * The trail is a transition: only one column is marked, the others are easing out.
     * Asserted as a fraction of the component's stepMsFor, so it holds at any tempo (a step
     * is 125 ms at 120 bpm). The rise stays shorter than the fall.
     * See lessons/page-kit-devices.md#kit-devices-142
     */
    {
      const ms = (s) => (s || '').split(',').map((x) => parseFloat(x) * (/ms/.test(x) ? 1 : 1000));
      const base = ms(getComputedStyle(gridSpec.edit.pads[0][0]).transitionDuration);
      const step = gridSpec.edit.clock.stepMs();
      d.assert('a lit pad dies inside a step and a half, and still slower than it lights',
        base[0] > 0 && base[0] / step < 1.6 && base[0] > RISE_MS && FALL_MS === base[0],
        `${base[0]} ms of fall against a ${step} ms step, which is `
        + `${(base[0] / step).toFixed(2)} steps, lighting in ${RISE_MS} ms`);

      /* Negative control: rise and fall are two rules, not one duration.
         See lessons/page-kit-devices.md#kit-devices-143 */
      const head = [...document.styleSheets]
        .flatMap((sh) => { try { return [...sh.cssRules]; } catch { return []; } })
        .find((r) => /data-live\]\[data-now="0"\]/.test(r.selectorText || ''));
      d.assert('NEGATIVE CONTROL: arriving and leaving are two separate rules, with two durations',
        !!head && ms(head.style.transitionDuration)[0] === RISE_MS
        && RISE_MS !== FALL_MS,
        `the head's own rule transitions in ${head ? ms(head.style.transitionDuration)[0] : '?'} ms `
        + `against ${FALL_MS} on the base rule`);
    }

    /**
     * The floor makes a long grid scroll rather than shrink its pads; sixteen steps fit a
     * 320 px box, so the case that proves the floor is a step count that does not.
     * See lessons/page-kit-devices.md#kit-devices-144
     */
    d.assert('NEGATIVE CONTROL: a pad never gets smaller than the floor, whatever the room',
      padWidth(320, 64) === PAD_MIN && padWidth(0, 16) === PAD_MIN
      && padWidth(320, 16) > PAD_MIN,
      `32 steps in a phone's strip is the ${PAD_MIN} px floor, 16 steps is `
      + `${padWidth(320, 16)} px and fits without scrolling`);
  }

  /**
   * The figures are graded on ink reaching the canvas, which synth-view-test.mjs cannot
   * see. redraw() first: a resize observation arrives a frame after layout, so a figure
   * could still be at zero width on this line.
   * See lessons/page-kit-devices.md#kit-devices-145
   */
  if (envSpec) {
    const all = [envSpec.one, envSpec.two, envSpec.three, envSpec.flat];
    for (const v of all) v.redraw();
    const inks = all.map((v) => v.ink());
    const areas = all.map((v) => v.area());
    const shares = inks.map((n, i) => n / Math.max(1, areas[i]));
    /**
     * The claim is a share of the box, not a pixel count: ink() once parsed --card with
     * /\d+/g, counted every pixel, and three envelopes agreed to the digit (10032).
     * A drawn envelope is a small share of its box; a filled field is all of it.
     * See lessons/page-kit-devices.md#kit-devices-146
     */
    d.assert('all four envelopes draw a line on their field rather than filling it',
      inks.every((n) => n > 200) && shares.every((s) => s > 0.005 && s < 0.2)
      && new Set(inks).size > 1,
      shares.map((s, i) => `${inks[i]} of ${areas[i]} is ${(s * 100).toFixed(1)}%`).join(', '));

    /* The figure follows the setting: one is moved and put back, synchronously, so no frame
       shows it.
       See lessons/page-kit-devices.md#kit-devices-147 */
    const before = envSpec.one.path().stages.attack;
    const paintsBefore = envSpec.one.paints;
    envSpec.one.set({ attack: 120 });
    const after = envSpec.one.path().stages.attack;
    envSpec.one.set({ attack: 2 });
    d.assert('a longer attack widens the attack stage and the figure repaints for it',
      after > before && envSpec.one.paints > paintsBefore
      && Math.abs(envSpec.one.path().stages.attack - before) < 1e-9,
      `${before.toFixed(3)} of the width to ${after.toFixed(3)} and back, `
      + `${envSpec.one.paints - paintsBefore} repaints`);

    /* Every length at zero is a real setting and is also the divide by zero
       this component had to be written around. */
    const flat = envSpec.flat.path();
    d.assert('an envelope with no lengths at all still fills its box rather than a quarter of it',
      flat.silent === true && Math.abs(flat.end - 1) < 1e-9 && envSpec.flat.ink() > 200,
      `ends at ${flat.end}, hold takes ${flat.stages.hold} of the width`);

    /* A canvas says nothing to a screen reader on its own, so the label is the
       only channel there is and it has to carry the numbers. */
    const lab = envSpec.one.canvas.getAttribute('aria-label');
    d.assert('the picture is an image with a label carrying the four numbers',
      envSpec.one.canvas.getAttribute('role') === 'img'
      && /attack 2/.test(lab) && /sustain 127/.test(lab),
      `"${lab}"`);
  }

  /**
   * The filter gets the refusal checks: its curve is acceptable only because it says it is
   * a schematic and refuses a type name it cannot read.
   * See lessons/page-kit-devices.md#kit-devices-148
   */
  if (filtSpec) {
    for (const v of [filtSpec.live, filtSpec.deep, filtSpec.refused]) v.redraw();
    /* The refusal carries less ink than a drawn curve, so the two states are really
       different pictures.
       See lessons/page-kit-devices.md#kit-devices-149 */
    const refInk = filtSpec.refused.ink(), drawnInk = filtSpec.live.ink();
    d.assert('a type name the component cannot read draws no curve and still says something',
      filtSpec.refused.curve() === null && filtSpec.refused.shape() === null
      && refInk > 40 && refInk < drawnInk
      && filtSpec.live.curve() !== null && filtSpec.deep.curve() !== null,
      `"comb 9dB" was refused with ${refInk} pixels of words on it against `
      + `${drawnInk} for a drawn curve of the same size`);

    /* Negative control: only a curve that reads the type has low pass and high pass
       disagreeing at both ends. Driven through the live component and put back.
       See lessons/page-kit-devices.md#kit-devices-150 */
    const wasType = filtSpec.live.get().type;
    filtSpec.live.set({ type: 'low pass 12dB' });
    const lp = filtSpec.live.curve().y;
    filtSpec.live.set({ type: 'high pass 12dB' });
    const hp = filtSpec.live.curve().y;
    filtSpec.live.set({ type: wasType });
    const at = (y, u) => y[Math.round(u * (y.length - 1))];
    d.assert('a low pass and a high pass disagree at both ends, so the type is really read',
      at(lp, 0.05) > at(hp, 0.05) && at(hp, 0.95) > at(lp, 0.95)
      && filtSpec.live.get().type === wasType,
      `at the bottom ${at(lp, 0.05).toFixed(3)} against ${at(hp, 0.05).toFixed(3)}, `
      + `at the top ${at(lp, 0.95).toFixed(3)} against ${at(hp, 0.95).toFixed(3)}, `
      + `and it is back on ${wasType}`);

    /* Nothing on this picture is a measurement, and the label says so where a
       screen reader can hear it as well as where an eye can see it. */
    const lab = filtSpec.live.canvas.getAttribute('aria-label');
    d.assert('the label says the picture is a schematic and gives no frequency in hertz',
      /schematic/.test(lab) && !/Hz/.test(lab) && /of 127/.test(lab),
      `"${lab}"`);

    /**
     * A square lattice suits controls taller than wide: rows are as tall as the widest cell,
     * so a 300 px slider makes 300 px rows for a 40 px control. A ratio, so it survives a
     * change to any size it is made of.
     * See lessons/page-kit-devices.md#kit-devices-151
     */
    /* Measure again first: a grid laid out at zero width is still at zero for a synchronous
       reader, as in the control grid asserts above.
       See lessons/page-kit-devices.md#kit-devices-152 */
    filtSpec.drive.size();
    const cellH = Math.max(...filtSpec.drive.cells.map((c) => c.getBoundingClientRect().height));
    const pitch = filtSpec.drive.pitch();
    d.assert('every control in the grid fills most of the square it was given',
      pitch > 0 && cellH / pitch > 0.6,
      `the tallest control is ${cellH.toFixed(0)} px in a ${pitch} px square, `
      + `which is ${(cellH / pitch * 100).toFixed(0)} per cent of it`);

    /* Negative control: a horizontal slider in the same grid fails the claim by a wide
       margin. Built, measured and thrown away.
       See lessons/page-kit-devices.md#kit-devices-153 */
    {
      const probe = createSlider({ label: 'cutoff', sub: 'CC 74', min: 0, max: 127, value: 78 });
      const spare = el('div', 'kit-wide');
      filtSpec.drive.el.parentElement.append(spare);
      const g = createControlGrid({ cols: 1, gap: 10, items: [probe], host: spare });
      g.size();
      const sh = g.cells[0].getBoundingClientRect().height;
      const sp = g.pitch();
      d.assert('NEGATIVE CONTROL: a horizontal slider in the same grid is mostly empty case',
        sp > 0 && sh / sp < 0.4,
        `a slider is ${sh.toFixed(0)} px tall in the ${sp} px square its own width buys it, `
        + `which is ${(sh / sp * 100).toFixed(0)} per cent`);
      spare.remove();
    }
  }

  /**
   * The waveform's counts are graded against the real table through the real component.
   * See lessons/page-kit-devices.md#kit-devices-154
   */
  if (waveSpec) {
    for (const v of [...waveSpec.drawnViews, waveSpec.pulse, waveSpec.blend,
      waveSpec.two, waveSpec.measured]) v.redraw();
    const drew = waveSpec.drawnViews.filter((v) => v.drawn());
    d.assert('4 of the Circuit’s 30 oscillator waves are drawn and 26 are not',
      waveSpec.drawnNames.length === 4 && drew.length === 4
      && OSC_WAVES.length === 30
      && OSC_WAVES.filter((n) => shapeFor(n)).length === 4,
      `${waveSpec.drawnNames.join(', ')}, and ${OSC_WAVES.length - 4} refused`);

    /* A refusal is a picture with words, not an empty box, which would read as a failure.
       See lessons/page-kit-devices.md#kit-devices-155 */
    /* One refusal left on the page; refusals for different reasons are not compared here.
       See lessons/page-kit-devices.md#kit-devices-156 */
    d.assert('a refused wave draws no curve and still names itself and its reason',
      !waveSpec.blend.drawn() && waveSpec.blend.ink() > 40
      && /not drawn/.test(waveSpec.blend.canvas.getAttribute('aria-label')),
      `"${waveSpec.blend.canvas.getAttribute('aria-label')}"`);

    /* A pulse is a family rather than a shape, so it is the one a name can
       never produce and a caller has to hand over. */
    d.assert('a pulse is drawn only when a width is handed over, never from a name',
      waveSpec.pulse.drawn() === true && shapeFor('pulse width') === null,
      `the figure drew a pulse at a duty of ${waveSpec.pulse.get().duty}, `
      + `and the name "pulse width" still maps to nothing`);

    /**
     * Two traces are proved by ink, not a flag: marked pixels against the same figure with
     * nothing over it. The inks must differ, or the picture cannot say which is which.
     * See lessons/page-kit-devices.md#kit-devices-157
     */
    const solo = createWaveShape({ name: 'sawtooth', height: 76 });
    waveSpec.two.el.parentElement.append(solo.el);
    solo.redraw();
    const [inkA, inkB] = waveSpec.two.inks();
    d.assert('a second trace adds a second line, in a second colour',
      waveSpec.two.overDrawn() === true && inkA !== inkB
      && waveSpec.two.ink() > solo.ink() * 1.3,
      `two traces mark ${waveSpec.two.ink()} pixels against ${solo.ink()} for one, `
      + `in ${inkA} and ${inkB}`);
    solo.destroy();
    solo.el.remove();

    /**
     * Samples outrank a name: /muta/'s signals are a Plaits engine and a wave folder,
     * neither a textbook shape, and a caller with samples is not guessing.
     * See lessons/page-kit-devices.md#kit-devices-158
     */
    d.assert('a trace with real samples is drawn under a name that has no shape',
      waveSpec.measured.drawn() === true && waveSpec.measured.overDrawn() === true
      && shapeFor('plaits engine') === null && waveSpec.measured.ink() > 40,
      `"plaits engine" maps to ${shapeFor('plaits engine')} and still marks `
      + `${waveSpec.measured.ink()} pixels`);

    /* Negative control: a figure with no second trace reports none, so overDrawn measures
       the option.
       See lessons/page-kit-devices.md#kit-devices-159 */
    d.assert('NEGATIVE CONTROL: a figure with one trace reports no second one and one ink',
      waveSpec.pulse.overDrawn() === false && waveSpec.pulse.inks()[1] === null
      && waveSpec.blend.overDrawn() === false,
      `the pulse reports ${waveSpec.pulse.overDrawn()} with inks `
      + `${JSON.stringify(waveSpec.pulse.inks())}`);

    /* synth-view-test.mjs asserts shapeFor across all thirty names; no check here watches
       the figure switch as a picker walks the table.
       See lessons/page-kit-devices.md#kit-devices-160 */
  }

  /**
   * The segment display's laid out half: box widths, the opacity that won, and pointer
   * behaviour. segment-test.mjs grades the arithmetic with no browser.
   * See lessons/page-kit-devices.md#kit-devices-161
   */
  if (dispSpec.size === 6) {
    const svgOf = (k) => dispSpec.get(k).svg.getBoundingClientRect();
    const keys = ['reading', 'narrowest', 'every bar', 'measured zero',
      'nothing measured', 'too wide'];

    /**
     * The box is the same width whatever it shows: six three digit fields (127, 111, 888,
     * 0, nothing, overflow) measured against each other; `1` is narrowest, `8` widest.
     * See lessons/page-kit-devices.md#kit-devices-162
     */
    {
      const ws = keys.map((k) => svgOf(k).width);
      const hs = keys.map((k) => svgOf(k).height);
      const spread = Math.max(...ws) - Math.min(...ws);
      d.assert('a field is the same box showing 111, 888, a zero, nothing and an overflow',
        spread <= 0.05 && Math.max(...hs) - Math.min(...hs) <= 0.05,
        `${ws.length} fields, ${ws[0].toFixed(2)} px wide, spread ${spread.toFixed(3)} px`);
    }

    /**
     * Nothing measured is blank and a measured zero is not: two fields, one lit by nothing
     * and one by a real 0, so a display that could not draw zero fails.
     * See lessons/page-kit-devices.md#kit-devices-163
     */
    {
      const none = dispSpec.get('nothing measured');
      const zero = dispSpec.get('measured zero');
      d.assert('nothing measured lights nothing, and a measured zero lights six bars',
        none.lit() === 0 && !/[0-9]/.test(none.text()) && zero.lit() === 6,
        `nothing lit ${none.lit()} parts and reads "${none.text()}", `
        + `a zero lit ${zero.lit()}`);
    }

    /**
     * Unlit bars are still drawn, faint, in the lit ink: read from the computed style, the
     * expected opacity read off --disp-ghost, never typed here.
     * See lessons/page-kit-devices.md#kit-devices-164
     */
    {
      const none = dispSpec.get('nothing measured');
      const all = dispSpec.get('every bar');
      const off = getComputedStyle(none.svg.querySelector('.pos-disp-p'));
      const on = getComputedStyle(all.svg.querySelector('.pos-disp-p.on'));
      const ghost = Number(off.opacity);
      const token = Number(getComputedStyle(document.documentElement)
        .getPropertyValue('--disp-ghost'));
      d.assert('an unlit bar is still drawn, faintly, in the same ink as a lit one',
        ghost > 0.02 && ghost < 0.5 && Math.abs(ghost - token) < 0.001
        && Number(on.opacity) === 1 && off.fill === on.fill,
        `unlit at opacity ${off.opacity} against lit at ${on.opacity}, both ${on.fill} · `
        + `--disp-ghost says ${token}`);
    }

    /**
     * --disp-ghost, --disp-ink and --disp-back in shell.css must match SCHEMES.backlit in
     * segment.mjs: two independent sources. Compared as resolved colours, painted into an
     * element and read back, since one colour can be spelled two ways.
     * See lessons/page-kit-devices.md#kit-devices-165
     */
    {
      const token = Number(getComputedStyle(document.documentElement)
        .getPropertyValue('--disp-ghost'));
      d.assert('the stylesheet’s ghost and the backlit scheme’s are one measurement',
        Math.abs(token - SCHEMES.backlit.ghost) < 0.001,
        `--disp-ghost ${token} against SCHEMES.backlit.ghost ${SCHEMES.backlit.ghost}`);

      /* Resolve a colour the way only a browser can, so a comparison is about
         the colour rather than about how it was spelled. */
      const asColour = (v) => {
        const probe = el('span');
        probe.style.color = v;
        document.body.append(probe);
        const out = getComputedStyle(probe).color;
        probe.remove();
        return out;
      };
      const root = getComputedStyle(document.documentElement);
      const pairs = [['ink', '--disp-ink'], ['back', '--disp-back']].map(([k, tok]) => {
        const fromCss = asColour(root.getPropertyValue(tok).trim());
        const fromJs = asColour(SCHEMES.backlit[k]);
        return { k, tok, fromCss, fromJs, same: fromCss === fromJs };
      });
      d.assert('the stylesheet’s ink and field and the backlit scheme’s are one measurement',
        pairs.every((p) => p.same),
        pairs.map((p) => `${p.tok} ${p.fromCss} against SCHEMES.backlit.${p.k} ${p.fromJs}`).join(' · '));
    }

    /**
     * A scheme is a different display, measured as ink: a reflective field's driven bars are
     * darker than its field, not brighter, and its ghost is its own. The direction is the claim.
     * See lessons/page-kit-devices.md#kit-devices-166
     */
    if (dispRefl) {
      const lum = (c) => {
        const [r, g, b] = (c.match(/[\d.]+/g) || [0, 0, 0]).map(Number);
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const back = getComputedStyle(dispRefl.el).backgroundColor;
      const bar = getComputedStyle(dispRefl.svg.querySelector('.pos-disp-p.on')).fill;
      const lit = getComputedStyle(dispSpec.get('reading').svg
        .querySelector('.pos-disp-p.on')).fill;
      const litBack = getComputedStyle(dispSpec.get('reading').el).backgroundColor;
      const ghost = Number(getComputedStyle(dispRefl.el).getPropertyValue('--disp-ghost'));
      d.assert('a reflective field goes dark where it is driven, while a backlit one goes bright',
        lum(bar) < lum(back) && lum(lit) > lum(litBack)
        && Math.abs(ghost - SCHEMES.reflective.ghost) < 0.001
        && dispRefl.text() === '127',
        `reflective: bar ${lum(bar).toFixed(0)} on a field of ${lum(back).toFixed(0)} · `
        + `backlit: bar ${lum(lit).toFixed(0)} on ${lum(litBack).toFixed(0)} · `
        + `ghosts ${ghost} and ${SCHEMES.backlit.ghost}`);
    }

    /**
     * Negative control: lit parts are counted off the DOM and compared with GLYPHS, two
     * independent sources, so a map returning all on fails.
     * See lessons/page-kit-devices.md#kit-devices-167
     */
    {
      const ones = dispSpec.get('narrowest').lit();
      const eights = dispSpec.get('every bar').lit();
      d.assert('NEGATIVE CONTROL: three ones light six bars and three eights light all 21',
        ones === 3 * GLYPHS[1].length && eights === 3 * SEGMENTS.length
        && ones === 6 && eights === 21,
        `111 lit ${ones} parts, 888 lit ${eights} of ${3 * SEGMENTS.length}`);
    }

    /**
     * A value too wide shows dashes, never `234` for 1234, and keeps the number in the
     * tooltip, which this reads.
     * See lessons/page-kit-devices.md#kit-devices-168
     */
    {
      const over = dispSpec.get('too wide');
      const r = over.reading();
      d.assert('a value too wide reads --- and its tooltip still carries the number',
        r.over && over.text() === '---' && over.text() !== '234'
        && over.el.title.includes('1234') && over.el.classList.contains('over')
        && over.lit() === 3,
        `reads "${over.text()}" with ${over.lit()} parts lit, tooltip "${over.el.title}"`);
    }

    /**
     * A decimal point rides the digit to its left and costs no cell, so `12.5` fits a three
     * digit field (pure side in `segment-test.mjs`); graded here: the part is in the picture,
     * on the middle digit.
     * See lessons/page-kit-devices.md#kit-devices-191
     */
    if (dispDot) {
      const dots = [...dispDot.svg.querySelectorAll('[data-seg="dp"]')];
      const litDots = dots.filter((n) => n.classList.contains('on'));
      d.assert('a decimal point is a part of the middle digit, and the only dot lit',
        dispDot.text() === '12.5' && dots.length === 3 && litDots.length === 1
        && litDots[0] === dots[1],
        `"${dispDot.text()}" on ${dispDot.digits} digits, ${litDots.length} of `
        + `${dots.length} dots lit, on digit ${dots.indexOf(litDots[0])}`);
    }

    /**
     * A picture, not a control: it takes no pointer while its box does (keeping the overflow
     * tooltip), and nothing is selectable. -webkit-touch-callout is in shell.css but Blink
     * cannot report it, so only selection is graded.
     * See lessons/page-kit-devices.md#kit-devices-169
     */
    {
      const one = dispSpec.get('reading');
      const svgCs = getComputedStyle(one.svg);
      const boxCs = getComputedStyle(one.el);
      const callout = boxCs.getPropertyValue('-webkit-touch-callout') || 'not reported here';
      d.assert('the picture takes no pointer while its box still does, and nothing in it selects',
        svgCs.pointerEvents === 'none' && boxCs.pointerEvents !== 'none'
        && boxCs.getPropertyValue('user-select') === 'none',
        `picture ${svgCs.pointerEvents}, box ${boxCs.pointerEvents}, `
        + `select ${boxCs.getPropertyValue('user-select')}, callout ${callout}`);
    }
  }

  /**
   * The distance between two stacked controls is head, foot and gap, published as
   * --ctl-step. Two sources: the properties off the document and the rect between two
   * stacked pad buttons (never the wrappers) in a real grid.
   * See lessons/page-kit-devices.md#kit-devices-170
   */
  if (stepPads && stepBand) {
    const root = getComputedStyle(document.documentElement);
    const n = (prop) => Number.parseFloat(root.getPropertyValue(prop));
    const head = n('--ctl-head'), foot = n('--ctl-foot'), gap = n('--ctl-gap');
    /**
     * --ctl-step is read off the band drawn at it, not :root: getPropertyValue returns the
     * unresolved calc() text and parseFloat gives NaN.
     * See lessons/page-kit-devices.md#kit-devices-171
     */
    const step = +Number.parseFloat(getComputedStyle(stepBand).height).toFixed(2);
    const top = stepPads[0].button, below = stepPads[1].button;
    const apart = +(below.getBoundingClientRect().top
      - top.getBoundingClientRect().bottom).toFixed(1);
    d.assert('the distance between two stacked controls is head plus gap plus foot, and --ctl-step is the sum',
      step > 0 && Math.abs(step - (head + gap + foot)) < 0.01
      && apart > 0 && Math.abs(apart - step) <= 0.6,
      `head ${head} + gap ${gap} + foot ${foot} = ${head + gap + foot} px, the band drawn at `
      + `--ctl-step measures ${step}, and two fully labelled pads stack ${apart} px apart`);
  }

  /**
   * An empty slot is still reserved: two buttons start on one line while only one wrapper
   * has a label above. The two wrappers must really differ, or the match says nothing.
   * See lessons/page-kit-devices.md#kit-devices-172
   */
  if (namedPad && barePad) {
    const said = (pd) => (pd.el.querySelector('.pos-pad-top')?.textContent || '').trim();
    const tops = [namedPad.button.getBoundingClientRect().top,
                  barePad.button.getBoundingClientRect().top];
    const off = +Math.abs(tops[0] - tops[1]).toFixed(2);
    d.assert('a pad with nothing above it still reserves the slot, so both buttons start on one line',
      said(namedPad).length > 0 && said(barePad).length === 0
      && tops[0] > 0 && off <= 0.5,
      // The detail reads both pads; a detail is evidence and may not restate the claim.
      // See lessons/page-kit-devices.md#kit-devices-173
      `one says "${said(namedPad)}" above it and the other says `
      + `"${said(barePad)}", and their buttons start ${off} px apart`);
  }

  /**
   * The panel: five claims, each reading a real rect or computed value.
   * See lessons/page-kit-devices.md#kit-devices-174
   */
  if (panelWith && panelWithout) {
    /* 1. The two children are one depth, the column the taller's content. Both edges are
       read, since align-items: flex-end ends them together whatever their heights.
       See lessons/page-kit-devices.md#kit-devices-175 */
    const f = panelWith.panel.fixed.getBoundingClientRect();
    const st = panelWith.panel.strip.getBoundingClientRect();
    const topOff = +Math.abs(f.top - st.top).toFixed(2);
    const botOff = +Math.abs(f.bottom - st.bottom).toFixed(2);
    d.assert('the fixed column and the strip are one depth, at both ends',
      f.height > 0 && topOff <= 1.5 && botOff <= 1.5
      && +Math.abs(f.height - st.height).toFixed(2) <= 1.5,
      `column ${f.height.toFixed(1)} px against strip ${st.height.toFixed(1)}, `
      + `${topOff} px apart at the top and ${botOff} at the bottom`);

    /* 2. The absorber: the flow's children fill it, exactly one carries .panel-grow, and it
       is taller than the same content without the class in the panel beside it.
       See lessons/page-kit-devices.md#kit-devices-176 */
    const rWith = panelWith.panel.check();
    const grown = panelGrowBlk.getBoundingClientRect().height;
    const bare = panelWithout.blk.getBoundingClientRect().height;
    d.assert('exactly one child of the flow absorbs the slack, and it is the one that grew',
      rWith.measured && rWith.growing.length === 1
      && rWith.growing[0] === panelGrowBlk
      && Math.abs(rWith.slack) <= 1.5 && grown > bare + 40,
      `flow ${rWith.flowH.toFixed(1)} px holding ${rWith.kidsH.toFixed(1)} of children, `
      + `${rWith.slack.toFixed(1)} px unaccounted for · the absorbing block is `
      + `${grown.toFixed(1)} px against ${bare.toFixed(1)} for the same block with no class`);

    /* 3. Negative control: the same panel without the class reads the opposite, slack nobody
       took, reported on `cuts` rather than thrown, since trailing air is legitimate.
       See lessons/page-kit-devices.md#kit-devices-177 */
    const rNone = panelWithout.panel.check();
    d.assert('NEGATIVE CONTROL: with the class left off the slack is empty case, and it is reported',
      rNone.measured && rNone.growing.length === 0 && rNone.slack > 40
      && rNone.cuts.length === 1 && /panel-grow/.test(rNone.cuts[0]),
      `${rNone.slack.toFixed(1)} px of the flow empty, ${rNone.growing.length} children growing, `
      + `and it says "${(rNone.cuts[0] || 'nothing').slice(0, 64)}"`);

    /* 4. The scroll boundary, computed, and its border on the edge facing the scroller,
       measured rather than read. There must be something to scroll.
       See lessons/page-kit-devices.md#kit-devices-178 */
    const cs = getComputedStyle(panelWith.panel.strip);
    const cf = getComputedStyle(panelWith.panel.fixed);
    const over = panelWith.panel.strip.scrollWidth - panelWith.panel.strip.clientWidth;
    d.assert('the strip is the only scroller, with a floor of zero, and the border marks its edge',
      cs.overflowX === 'auto' && cs.minWidth === '0px'
      && parseFloat(cf.borderRightWidth) === 1 && parseFloat(cf.borderLeftWidth) === 0
      && over > 0
      && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
      `overflow-x ${cs.overflowX}, min-width ${cs.minWidth}, ${over} px to scroll · `
      + `border right ${cf.borderRightWidth} and left ${cf.borderLeftWidth} · `
      + `the page overflows by `
      + `${document.documentElement.scrollWidth - document.documentElement.clientWidth} px`);

    /* No panel assert enters a media query: verify.mjs runs at 756 px.
       See lessons/page-kit-devices.md#kit-devices-179 */
  }

  // The panel seam: every claim is measured against the seam's own case.
  // See lessons/page-kit-devices.md#kit-devices-180
  if (seamRail && seamPlain) {
    /**
     * The case's inner edge is its border box less its own border; the outer box would be
     * 1 px off at each end.
     * See lessons/page-kit-devices.md#kit-devices-181
     */
    const inner = (panel) => {
      const c = getComputedStyle(panel.el);
      const r = panel.el.getBoundingClientRect();
      return { l: r.left + parseFloat(c.borderLeftWidth), r: r.right - parseFloat(c.borderRightWidth) };
    };

    /* 1. Edge to edge on both arrangements, both ends of both seams: .panel-case's

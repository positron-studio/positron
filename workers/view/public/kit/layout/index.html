<title>POSITRON kit/layout</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<script type="module">
  import { el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import { drillBar, DRILL } from '/shell/bar-drill.mjs';
  import { createCard, createCardGrid } from '/shell/card.mjs';
  import { DEMOS } from '/manifest.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createBar, barButton } from '/shell/bar.mjs';
  import { createTransportControl, transportApi } from '/shell/transport-control.mjs';
  import { playToggle, clockView, ratesView } from '/shell/transport-views.mjs';
  import { bindTransportKeys } from '/shell/transport-keys.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { markAdapter } from '/shell/fixture.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * kit/layout: one part of /kit/ on a page of its own (plans/plan-kit-split.md).
   * Blocks and checks are copied from demo/kit/index.html in its order, newest first;
   * every check is behind ?selfcheck=1.
   * See lessons/page-kit-layout.md#kit-layout-1
   */
  const { d, out, section, land, checkPage } = createKitPage({
    part: 'layout',
    what: "How blocks stack, sit in tabs and fall into cards from a wide screen down to a phone.",
  });

  // The layout specimens, declared up here rather than beside the block that fills
  // them, so no block reads one in its temporal dead zone.
  // See lessons/page-kit-layout.md#kit-layout-2
  let stackSpec = null, emptySpec = null, emptyBlock = null;
  const stackBlocks = [];
  let tabSpec = null;         // { page }, the TAB PAGE specimen, checked last before ready
  let barSpec = null;         // { three, spread, status, word, icon, quiet }, the BAR specimen


  /**
   * Bar specimen (bar.mjs): a layout with three slots and the one button that goes in it.
   * It knows nothing about time; a transport's views go in the same slots.
   * why: lessons/kit-bar.md#slots
   */
  section('BAR',
    'A strip with three slots: what you do at the start, what is so in the middle, what you '
    + 'choose at the end. The end sits at the far end even when the middle is empty.',
    `createBar({ start: [play, record], middle: [status], end: [scene, download] })
barButton({ icon: 'record', aria: 'record', onPress })     // a kit icon by name
barButton({ label: 'Scene 1', word: true, onPress })       // a word, sized by its text
barButton({ icon: 'download', aria: 'download', press: false })  // the harness never presses it
bar.set('middle', [status])                                // slots are start, middle, end`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');
      const status = el('output', 'tbar-badge', 'nothing pressed');
      const said = (w) => () => { status.textContent = `pressed ${w}`; };
      const word = barButton({ label: 'Scene 1', word: true, onPress: said('Scene 1') });
      const icon = barButton({ icon: 'record', aria: 'record', onPress: said('record') });
      const quiet = barButton({ icon: 'download', aria: 'download', title: 'a press the harness leaves alone',
        press: false, onPress: said('download') });
      const three = createBar({
        start: [barButton({ icon: 'play', aria: 'play', onPress: said('play') }), icon],
        middle: [status],
        end: [word, quiet],
      });
      const spread = createBar({
        start: [barButton({ icon: 'chevron-left', aria: 'previous', onPress: said('previous') }),
                barButton({ icon: 'chevron-right', aria: 'next', onPress: said('next') })],
        end: [barButton({ icon: 'trash', aria: 'delete', onPress: said('delete') })],
      });
      stack.titled('START, MIDDLE AND END', three.el);
      stack.titled('NO MIDDLE, AND THE END STILL AT THE END', spread.el);
      box.append(stack.el);
      barSpec = { three, spread, status, word, icon, quiet };
    });

  /**
   * Tab page specimen (tab-page.mjs, bar-drill.mjs). It opens on QUIET, so BARS is
   * built only when opened; one bar never moves its clock as a negative control.
   * hash: false, because this page owns its address.
   * See lessons/page-kit-layout.md#kit-layout-3
   */
  section('TAB PAGE',
    'Several old pages as the tabs of one: a tab is built the first time it is opened, '
    + 'keeps its own readout and log, and every transport bar in it gets the harness’s '
    + 'drill as page asserts. This one opens on QUIET, so BARS has not been built yet.',
    `const page = createTabPage(d, { tabs: [
  { id: 'arrival', label: 'ARRIVAL', mod: arrival },  // arrival: the tab's own module, imported by the page
] });
// a tab: export const readout; export function build({ panel, report, assert, log, set })
//   returns { show, hide, check({ A }), bars: [{ name, bar: api, strip }] }
if (SELFCHECK) await page.check();                   // and then d.ready()
await assertBar(d.assert, api, { name, strip });     // api: transportApi(control, { el: bar.el })`,
    (box) => {
      box.classList.add('kit-wide', 'kit-tabpage');
      const hi = getComputedStyle(document.documentElement).getPropertyValue('--hi').trim() || '#ffd400';

      /* QUIET stands in for a tab whose first press joins a relay or fetches a
         file. The counter is the whole of what it opens, which is what lets the
         check say "nothing until the first press" as a number. */
      const quiet = {
        readout: { presses: '', state: '' },
        build({ panel, set, log }) {
          let opened = 0;
          const row = el('div', 'kit-row');
          const btn = el('button', '', 'Open', { type: 'button' });
          btn.onclick = () => {
            opened++;
            set('presses', opened);
            set('state', 'open');
            log(opened === 1 ? 'opened on the first press in this tab' : 'already open');
          };
          row.append(btn);
          panel.add(row);
          return {
            opened: () => opened,
            async check({ A }) {
              A('nothing opened until the first press in this tab', opened === 0, `${opened} opening(s) before a press`);
              btn.click();
              A('the first press in the tab opens it', opened === 1, `${opened} opening(s) after one press`);
            },
          };
        },
      };

      const bars = {
        build({ panel }) {
          const { adapter } = markAdapter({ rates: [1] });
          const items = Array.from({ length: 8 }, (_, i) => ({
            id: `tp${i}`, kind: 'mark', at: (i + 0.5) * 7500, payload: { label: `${i + 1}` } }));
          const deck = createDeck({ items, adapters: { mark: adapter }, range: [0, 60_000] });
          const shelf = el('div');
          const view = createStripView(shelf, deck, { size: 'auto', lanes: [{ id: 'mark', kind: 'mark', color: hi }] });
          // Not published: a bar in a tab is graded by the tab page's drill, never as __demo.transport.
          const lc = createTransportControl(deck);
          const liveBar = createBar({ start: [playToggle(lc).el], middle: [clockView(lc).el], end: [ratesView(lc).el] });
          bindTransportKeys(lc, { scope: liveBar.el });
          const live = transportApi(lc, { el: liveBar.el });
          view.strip.fit?.();
          // The strip sits on the bar that drives it, the one pair a glue is for.
          const pair = createGlue(view.surface, liveBar.el);

          /* The negative control: a clock that always answers 0. Play is accepted and seek
             still works, so the drill must fail exactly one row, play advances position.
             See lessons/page-kit-layout.md#kit-layout-4 */
          const still = createDeck({ clock: { domain: 'wall', now: () => 0 }, range: [0, 60_000] });
          const frozenHost = el('div');
          const fc = createTransportControl(still);
          const frozenBar = createBar({ start: [playToggle(fc, { verb: ['start', 'stop'] }).el], middle: [clockView(fc).el] });
          bindTransportKeys(fc, { scope: frozenBar.el });
          frozenHost.append(frozenBar.el);
          const frozen = transportApi(fc, { el: frozenBar.el });

          panel.titled('A BAR AND THE STRIP IT DRIVES', pair);
          panel.titled('A BAR WHOSE CLOCK NEVER MOVES', frozenHost);
          return {
            live, frozen,
            bars: [{ name: 'live', bar: live, strip: view.el }],
            // A deck left running in a tab nobody can see is a sound nobody
            // chose; leaving the tab stops it.
            hide() { if (live.playing) live.el.querySelector('.tbar-toggle').click(); },
            async check({ A }) {
              const rows = await drillBar(frozen);
              const red = rows.filter((r) => !r.skipped && !r.pass).map((r) => r.label);
              A('NEGATIVE: a bar whose clock is frozen fails the drill on play, and on nothing else',
                red.length === 1 && red[0] === 'play advances position',
                `${rows.filter((r) => !r.skipped).length} rows, failing: ${red.join(', ') || 'none'}`);
            },
          };
        },
      };

      const page = createTabPage(d, {
        host: box, hash: false, at: 'quiet',
        tabs: [
          { id: 'quiet', label: 'QUIET', mod: quiet },
          { id: 'bars', label: 'BARS', mod: bars },
        ],
      });
      tabSpec = { page };
    });

  /**
   * The newest component goes at the top of this page. Type section titles
   * uppercase. verify.mjs presses by position, so re-run it and diff the assert
   * count after any reorder.
   * See lessons/page-kit-layout.md#kit-layout-5
   */
  section('STACK',
    'The stack owns the air between blocks, so a block cannot change it.',
    `const page = createStack(d.el);          // mount() has already made this one
page.add(bar.el, picks, keyboard.el);    // the order of the page, in one line
const row = page.stack();                // a block that is itself a column`,
    (box) => {
      box.classList.add('kit-wide');
      stackSpec = createStack(undefined, 'kit-stackspec');
      // No article on a specimen's label: a label is a name.
      // See lessons/page-kit-layout.md#kit-layout-6
      for (const [t, cls] of [['block', ''], ['another', ''],
                              ['margin: 0 0 10px', 'kit-tight']]) {
        const b = el('div', `kit-blk${cls ? ' ' + cls : ''}`, t);
        stackBlocks.push(b);
        stackSpec.add(b);
      }
      box.append(stackSpec.el);

      // The empty case is its own specimen: two blocks one gap apart with an empty
      // block between them that costs nothing.
      // See lessons/page-kit-layout.md#kit-layout-7
      box.append(el('p', 'kit-cap', 'with a block that never got filled'));
      emptySpec = createStack(undefined, 'kit-stackspec');
      emptySpec.add(el('div', 'kit-blk', 'block'));
      emptyBlock = el('div', 'kit-blk');          // nothing in it, ever
      emptySpec.add(emptyBlock, el('div', 'kit-blk', 'next block'));
      box.append(emptySpec.el);
    });

  // ── tabs ────────────────────────────────────────────────────────────────
  section('TABS',
    'Places you go rather than options you arm, with colour and a bar on the open one.',
    `createTabs({ tabs: [{id:'air',label:'On air'}, {id:'past',label:'Archive',disabled:true}, …] })`,
    (box) => {
      const o = out('air');
      // hash: false here only, so the sandbox does not write #air into the address.
      // See lessons/page-kit-layout.md#kit-layout-8
      const t = createTabs({
        hash: false,
        tabs: [
          { id: 'air', label: 'On air' },
          { id: 'past', label: 'Archive', disabled: true, note: 'not built yet' },
          { id: 'write', label: 'Contribute' },
          { id: 'long', label: 'A name long enough to push the row' },
        ],
        onPick: (id) => { o.textContent = id; },
      });
      for (const [id, text] of [['air', 'what is happening now'],
                                ['write', 'the form you write in'],
                                ['long', 'the row scrolls sideways rather than wrapping']]) {
        t.panel(id).append(el('div', 'kit-n', text));
      }
      box.append(t.el, o);
    });

  // Cards from the real DEMOS rows, so a card cannot describe a page that does not
  // exist. Descriptions are cut at the first dash or comma, because a full row's
  // one line runs to five lines in a card a third as wide.
  // See lessons/page-kit-layout.md#kit-layout-9
  const firstClause = (t) => {
    const cut = t.split(/\s+[—–-]\s+|,\s+/)[0];
    return cut.length > 12 ? cut : t;
  };
  const pick = ['weight', 'tapes', 'kurenniemi', 'able', 'floor', 'archive/radio', 'wire', 'strip'];
  const rows = pick.map((n) => DEMOS.find((x) => x.name === n)).filter(Boolean);
  const cardsFor = (extra = {}) => rows.map((r) => createCard({
    title: r.name.split('/').pop(),
    desc: firstClause(r.one),
    tags: (r.tags || []).slice(0, 3),
    href: `/${r.name}/`,
    ...extra,
  }));

  section('CARD',
    'A grey box, a name, one line about what is behind it, and tags along the bottom.',
    '',
    (box) => {
      box.classList.add('kit-wide');
      const g = createCardGrid({ min: 170 });
      g.addAll(cardsFor());
      box.append(g.el);
    });

  section('CARD GRID ON A PHONE',
    'Two columns at 375 px and up, one below, with the floor written min(100%, 170px).',
    '', (box) => {
      box.classList.add('kit-wide');
      for (const w of [375, 320]) {
        box.append(el('div', 'kit-cut', `${w} px`));
        const frame = el('div');
        frame.style.width = `${w}px`; frame.style.maxWidth = '100%';
        const g = createCardGrid({ min: 170 });
        g.addAll(cardsFor().slice(0, 4));
        frame.append(g.el);
        box.append(frame);
      }
    });

  section('CARD, REFUSED AND WITH BUTTONS',
    'A page this browser cannot run keeps its card, with the reason where the tags go.',
    '', (box) => {
      box.classList.add('kit-wide');
      const o = out('nothing pressed');
      const g = createCardGrid({ min: 190 });
      g.addAll([
        createCard({ title: 'mirror', desc: 'the same shader drawn twice',
          why: 'this browser draws no 3-D' }),
        createCard({ title: 'instrument', desc: 'a keyboard you can play',
          why: 'no MIDI here, but the on-screen keys still sound' }),
        // A card is a link, so a stale slug here opens a different page rather than 404.
        // See lessons/page-kit-layout.md#kit-layout-10
        createCard({ title: 'weight', desc: 'big words standing in a room',
          tags: ['WebGL2'], href: '/weight/',
          actions: [
            { label: 'Copy link', onPress: () => { o.textContent = 'copy link, weight'; } },
            { label: 'Open', onPress: () => { o.textContent = 'open, weight'; } },
          ] }),
      ]);
      box.append(g.el, o);
    });

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* What a machine can say about this page. Every check is behind ?selfcheck=1 and
     copied from demo/kit/index.html with its indent. They run after a frame,
     because getBoundingClientRect before the first paint measures an unarranged page.
     See lessons/page-kit-layout.md#kit-layout-11 */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();


  // The gap is the stack's: the third specimen's margin: 0 0 10px is (0,1,0) and
  // loses to the stack's (0,2,0) rule on weight, not source order. The expected gap
  // is read from --pos-gap, never typed here.
  // See lessons/page-kit-layout.md#kit-layout-12
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const gaps = [];
    for (let i = 1; i < stackBlocks.length; i++) {
      gaps.push(+(stackBlocks[i].getBoundingClientRect().top
        - stackBlocks[i - 1].getBoundingClientRect().bottom).toFixed(1));
    }
    const asked = stackBlocks.length
      ? getComputedStyle(stackBlocks[stackBlocks.length - 1]).marginTop : '?';
    d.assert('every block in a stack is one gap from the one before it, whatever margin it carries',
      Number.isFinite(want) && want > 0 && gaps.length === 2
      && gaps.every((g) => Math.abs(g - want) <= 0.5),
      `--pos-gap is ${want} px and the gaps read ${gaps.join(' and ')} px · `
      + `the block asking for margin-top 0 computes ${asked}`);
  }

  // A block with nothing in it takes no gap: two blocks with an empty one between
  // them sit one gap apart, and the empty one is out of layout (display), not hidden.
  // See lessons/page-kit-layout.md#kit-layout-13
  {
    const want = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--pos-gap'));
    const kids = emptySpec ? [...emptySpec.el.children] : [];
    const across = kids.length === 3
      ? +(kids[2].getBoundingClientRect().top - kids[0].getBoundingClientRect().bottom).toFixed(1) : -1;
    const gone = emptyBlock ? getComputedStyle(emptyBlock).display === 'none' : false;
    d.assert('a block that never got filled takes no room and no gap',
      gone && kids.length === 3 && Math.abs(across - want) <= 0.5,
      `the two blocks around it are ${across} px apart, which is one gap of ${want} px · `
      + `the empty one computes display ${emptyBlock ? getComputedStyle(emptyBlock).display : '?'}`);
  }

  /**
   * Every focus ring in the shell is 1 px and on :focus-visible only, read from the
   * stylesheet (cssText, since var() shorthands leave longhands empty), because a
   * check cannot set focus modality. No rule paints on plain :focus; rings >= 12.
   * See lessons/page-kit-layout.md#kit-layout-14
   */
  {
    const sheet = [...document.styleSheets].find((s) => (s.href || '').includes('shell.css'));
    const rules = sheet ? [...sheet.cssRules].filter((r) => r.selectorText) : [];
    /* A ring is an outline with a width in it; outline: none paints nothing. The
       length may appear anywhere, since a shorthand without var() is canonicalised to
       outline: red solid 3px.
       See lessons/page-kit-layout.md#kit-layout-15 */
    const widthOf = (r) => (/outline(?:-width)?:[^;]*?([\d.]+)px/.exec(r.cssText) || [])[1];
    const paints = (r) => widthOf(r) !== undefined;
    const rings = rules.filter((r) => /:focus-visible/.test(r.selectorText) && paints(r));
    const wide = rings.filter((r) => widthOf(r) !== '1');
    /* A ring on plain `:focus` is the defect. `:focus:not(:focus-visible)` is
       the suppression idiom and is not one, so it is excluded by name rather
       than by hoping no rule uses it. */
    const onPress = rules.filter((r) => /:focus(?![-a-z])/.test(r.selectorText)
      && !/:focus:not\(:focus-visible\)/.test(r.selectorText) && paints(r));

    /**
     * Three cascade claims measured on rendered boxes, each a defect that shipped
     * green. They build their own specimens, because the combinations occur only on
     * /wish/ and /tom/.
     * See lessons/page-kit-layout.md#kit-layout-16
     */
    {
      const probe = el('div', 'kit-cascade-probe');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:600px';
      document.body.append(probe);

      /* A glyph button is square wherever it is, measured on the box, not on the
         attribute: a row-scoped rule once left one 45.83 px wide by 34.00 px tall.
         See lessons/page-kit-layout.md#kit-layout-17 */
      const sq = (host) => {
        const b = el('button', '', '⇄');
        b.type = 'button'; b.dataset.glyph = '1';
        host.append(b);
        const r = b.getBoundingClientRect();
        b.remove();
        return { w: +r.width.toFixed(2), h: +r.height.toFixed(2) };
      };
      const row = el('div', 'pos-controls');
      probe.append(row);
      const inRow = sq(row);
      const loose = sq(probe);
      d.assert('a glyph button is a square outside the control row as well as inside it',
        inRow.w === 34 && inRow.h === 34 && loose.w === 34 && loose.h === 34,
        `in the row ${inRow.w} by ${inRow.h}, outside it ${loose.w} by ${loose.h}`);

      /* A step grid's label column keeps its width on a panel's fixed column:
         .panel-fixed-l once zeroed its padding and border and clipped labels to 0.00 px.
         Built here because no other specimen on this page wears .panel-fixed-l.
         See lessons/page-kit-layout.md#kit-layout-18 */
      const panel = el('div', 'panel panel-case');
      const labs = el('div', 'panel-fixed panel-fixed-l pos-pg-labs');
      labs.style.setProperty('--pg-lab', '22px');
      const lab = el('span', '', '63');
      labs.append(lab); panel.append(labs); probe.append(panel);
      const labCs = getComputedStyle(labs);
      const inner = labs.clientWidth;
      const ink = lab.getBoundingClientRect().width;
      d.assert('a step grid’s labels keep their whole width on a panel’s fixed column',
        inner >= 22 && ink <= inner + 0.01
          && labCs.borderRightWidth === '0px' && labCs.paddingRight === '0px',
        `content box ${inner.toFixed(2)} px against a 22 px width, ink ${ink.toFixed(2)} px, `
        + `border ${labCs.borderRightWidth}, padding ${labCs.paddingRight}`);
      probe.remove();
    }

    d.assert('every focus ring in the shell is 1 px, and not one of them paints on a mouse press',
      rules.length > 0 && rings.length >= 12 && wide.length === 0 && onPress.length === 0,
      `${rings.length} ring(s) across ${rules.length} rules, ${wide.length} not 1 px`
      + `${wide.length ? ` (${wide[0].selectorText} at ${widthOf(wide[0])}px)` : ''}`
      + `, ${onPress.length} painting on plain :focus`
      + `${onPress.length ? ` (${onPress[0].selectorText})` : ''}`);
  }


  // The bar's slots: their order in the DOM, the far end taken by the first end item only,
  // and in a bar with no middle the end item still at the right edge.
  if (barSpec) {
    const { three, spread } = barSpec;
    const kids = [...three.el.children];
    const ends = kids.filter((k) => k.dataset.end === '1');
    const inner = (b) => { const cs = getComputedStyle(b.el); return b.el.getBoundingClientRect().right - parseFloat(cs.paddingRight) - parseFloat(cs.borderRightWidth); };
    const last = (b) => b.el.lastElementChild.getBoundingClientRect().right;
    const gapOf = (b) => b.el.lastElementChild.getBoundingClientRect().left - b.el.children[1].getBoundingClientRect().right;
    d.assert('BAR: start, middle and end draw in that order, and only the first end item takes the far end',
      kids.length === 5 && kids[2] === barSpec.status && ends.length === 1 && ends[0] === barSpec.word
      && Math.abs(last(three) - inner(three)) <= 0.5 && Math.abs(last(spread) - inner(spread)) <= 0.5 && gapOf(spread) > 100,
      `${kids.length} items, ${ends.length} marked data-end; the last item ends ${(inner(three) - last(three)).toFixed(1)} px `
      + `and ${(inner(spread) - last(spread)).toFixed(1)} px short of the inner edge, the bar with no middle `
      + `opens a ${gapOf(spread).toFixed(0)} px gap`);

    // One button, three shapes: a word sized by its text, a kit icon with an aria name, one never pressed.
    const { word, icon, quiet } = barSpec;
    d.assert('BAR: a bar button is a word, a kit icon, or one the harness never presses',
      word.classList.contains('tbar-word') && word.classList.contains('tbar-x') && word.textContent === 'Scene 1'
      && !!icon.querySelector('svg') && icon.textContent.trim() === '' && icon.getAttribute('aria-label') === 'record'
      && quiet.classList.contains('tbar-slot') && !quiet.classList.contains('tbar-x'),
      `the word "${word.textContent}" (${word.className}), the icon ${icon.querySelector('svg') ? 'drawn' : 'MISSING'} `
      + `named "${icon.getAttribute('aria-label')}", the quiet one ${quiet.className}`);
  }

  /**
   * The tab page's check pass, last before d.ready(): the harness drills transport
   * and sends seek keys as soon as ready, so this drill must not overlap it. About
   * 3 s of boot.
   * See lessons/page-kit-layout.md#kit-layout-19
   */
  if (SELFCHECK && tabSpec) {
    const { page } = tabSpec;
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    try {
      await page.check();
      // After the pass the specimen is back on QUIET with BARS built and closed.
      const { live, frozen } = page.built('bars');
      const was = live.position;
      window.dispatchEvent(new KeyboardEvent('keydown', { key: '0', bubbles: true }));
      await nap(DRILL.keyMs);
      d.assert('TAB PAGE: a key from the page does not reach a bar in a closed tab',
        page.at() === 'quiet' && Math.abs(live.position - was) < 1,
        `open on ${page.at()}, the BARS bar went ${was.toFixed(0)} -> ${live.position.toFixed(0)}`);
      page.tabs.go('bars', { push: false });
      const liveWas = live.position;
      frozen.el.dispatchEvent(new KeyboardEvent('keydown', { key: '0', bubbles: true }));
      await nap(DRILL.keyMs);
      d.assert('TAB PAGE: a key aimed at one bar moves that bar and not its neighbour',
        Math.abs(frozen.position) < 1 && Math.abs(live.position - liveWas) < 1,
        `the aimed bar is at ${frozen.position.toFixed(0)}, its neighbour went `
        + `${liveWas.toFixed(0)} -> ${live.position.toFixed(0)}`);
      page.tabs.go('quiet', { push: false });
    } catch (e) {
      d.assert('TAB PAGE: its checks ran to the end', false, e.message);
    }
  }
  } // if (SELFCHECK)

  d.ready();
</script>

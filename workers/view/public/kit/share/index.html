<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="share">
<meta property="og:description" content="The card every page is shared with and its Instagram portrait, the front page’s hero type, as the PNGs the build makes and the SVG they are made from">
<meta property="og:url" content="https://positron.studio/kit/share/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON kit/share</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* A card is a picture with a ground of its own, so it carries no frame
     (eccm's /social: "no borders on og / ig cards"), and it is drawn at the
     column's width, never wider than its own 1200 px. */
  .share-pic { display: block; inline-size: 100%; block-size: auto; }
  .share-svg > svg { display: block; inline-size: 100%; block-size: auto; }
  /* the two side by side on a desk, the wide one taking the room its shape
     asks for, so both are the same height; one under the other on a phone */
  .share-row { display: grid; grid-template-columns: minmax(0, 1200fr) minmax(0, 504fr); gap: 16px; align-items: start; }
  .share-row figure { margin: 0; min-width: 0; }
  .share-row figcaption { margin-top: 8px; font: 400 12px/1.5 var(--mono); color: var(--dim); }
  @media (max-width: 560px) { .share-row { grid-template-columns: minmax(0, 1fr); } }
  .share-tags { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 12px/1.6 var(--mono); color: var(--dim); }
</style>
<script type="module">
  import { siteCard, igCard, helloCard, shareTags, TEMPLATE_V } from '/shell/share-card.mjs';
  import { textWidth } from '/shell/bay-svg.mjs';
  import { el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * The og:image card and Instagram portrait, drawn as SVG by demo/shell/share-card.mjs
   * and made PNGs at build by workers/view/og/render.mjs. The PNG exists only in a
   * build, so it is asked for only when this page's head carries og:image.
   * See lessons/page-kit-share.md#kit-share-1
   */
  const { d, section, land, checkPage } = createKitPage({
    part: 'share',
    what: 'The card every page is shared with and its Instagram portrait, the front page’s hero type, drawn as SVG with no browser and made PNGs at build.',
  });

  const card = siteCard(), ig = igCard(), hello = helloCard();
  const shipped = document.querySelector('meta[property="og:image"]')?.content || null;
  const imgs = [];
  let inline = null;
  const figure = (c, name, child) => {
    const f = el('figure');
    f.append(child, el('figcaption', '', `${name}, ${c.width} by ${c.height}`));
    return f;
  };

  section('SITE CARD', 'The two PNGs as they ship: the 1200 by 630 card every page names, and the 1080 by 1350 Instagram portrait no page names, each named by a hash of its SVG.', null, (box) => {
    if (!shipped) { box.append(el('p', 'kit-n', `This copy of the page is not built, so there are no PNGs beside it. The build writes ${card.path}, ${ig.path} and ${hello.path}.`)); return; }
    const row = el('div', 'share-row');
    for (const [c, name] of [[card, 'og:image'], [ig, 'instagram'], [hello, 'instagram hello']]) {
      const img = Object.assign(el('img', 'share-pic'), { src: c.path, alt: c.alt, width: c.width, height: c.height });
      const a = Object.assign(el('a', 'pos-linkbtn', `download ${c.path.split('/').pop()}`), { href: c.path, download: c.path.split('/').pop() });
      const f = figure(c, name, img);
      f.querySelector('figcaption').append(' ', a);
      imgs.push([c, img]);
      row.append(f);
    }
    box.append(row);
  });

  section('THE SVG', 'The same two pictures as the SVG each PNG is made from, written in this tab by the code the build runs, every attribute literal.', null, (box) => {
    const row = el('div', 'share-row');
    for (const [c, name] of [[card, 'og:image'], [ig, 'instagram'], [hello, 'instagram hello']]) {
      const holder = el('div', 'share-svg');
      holder.innerHTML = c.svg;
      const svg = holder.firstElementChild;
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', c.alt);
      if (!inline) inline = holder;
      row.append(figure(c, name, holder));
    }
    box.append(row);
  });

  section('THE TAGS', 'What the build writes into the head of every page, this one’s shown, after its robots meta.', null, (box) => {
    const tags = shipped
      ? [...document.head.querySelectorAll('meta[property^="og:"], meta[name="twitter:card"]')].map((m) => m.outerHTML)
      : shareTags({ title: 'share', description: 'The card every page is shared with.', url: '/kit/share/', card });
    box.append(el('pre', 'share-tags', tags.join('\n')));
  });

  land();

  if (SELFCHECK) {
  const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  await document.fonts.ready;
  await Promise.all(['400 13px "Brand JetBrains Mono"', '400 11px "Brand JetBrains Mono"', '600 58px "Brand JetBrains Mono"', '400 11px "Brand Geist"', '400 24px "Brand Geist"'].map((f) => document.fonts.load(f)));
  await frames(3);
  checkPage();

  // 1. the SVG is resvg's kind: no class, no var(), no style element, and it
  // names the card's own size
  {
    const bad = [/\sclass=/, /var\(/, /<style/, /<path/].filter((r) => r.test(card.svg + ig.svg)).map(String);
    d.assert('both cards are plain SVG text with every attribute literal, no class, no var(), no stylesheet and no patchbay wire',
      bad.length === 0 && /width="1200" height="630"/.test(card.svg) && /width="1080" height="1350"/.test(ig.svg),
      bad.length ? `found ${bad.join(', ')}` : `${card.svg.length} and ${ig.svg.length} characters, 1200 by 630 and 1080 by 1350, template ${TEMPLATE_V}`);
  }

  // 2. the SVG drawn in this tab sets its text in the site's faces: the
  // headline's ink is as wide here as the font metrics said it would be
  {
    const t = [...inline.querySelectorAll('text')].find((n) => n.getAttribute('font-weight') === '600');
    const want = Number(t?.getAttribute('font-size')) || 0;
    const got = t ? t.getComputedTextLength() : 0;
    const fam = t ? getComputedStyle(t).fontFamily : '';
    const ok = t && document.fonts.check(`600 ${want}px "Brand JetBrains Mono"`);
    const predicted = t ? textWidth(t.textContent, 'mono', want, { weight: 600, tracking: Number(t.getAttribute('letter-spacing')) || 0 }) : 0;
    d.assert('the headline in the inline SVG is set in the site’s mono at 600, at the width the metrics predicted',
      !!ok && /Brand JetBrains Mono/.test(fam) && Math.abs(got - predicted) <= 0.01 * predicted,
      t ? `"${t.textContent}" ${got.toFixed(1)} px wide in ${fam.split(',')[0]}, the metrics said ${predicted.toFixed(1)}` : 'no 600 text in the SVG');
  }

  // 3. in a build, the og:image this page carries is the card this tab drew,
  // and both PNGs load at their own sizes
  if (shipped) {
    await Promise.all(imgs.map(([, img]) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    const sizes = imgs.map(([c, img]) => `${c.path.split('/').pop()} ${img.naturalWidth}x${img.naturalHeight}`);
    d.assert('the og:image in this page’s head is the card this tab computed, and both PNGs load at their own sizes',
      new URL(shipped).pathname === card.path && imgs.length === 2 && imgs.every(([c, img]) => img.naturalWidth === c.width && img.naturalHeight === c.height),
      `${new URL(shipped).pathname} against ${card.path}, ${sizes.join(', ')}`);
  } else d.log(`not built: no og:image in this page's head, so the PNG check is the build's (${card.path}, ${ig.path})`);
  } // if (SELFCHECK)

  d.ready();
</script>
</html>

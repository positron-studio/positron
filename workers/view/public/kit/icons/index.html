<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="icons">
<meta property="og:description" content="Every icon the kit can draw, from the Feather set in the colour of the text around it">
<meta property="og:url" content="https://positron.studio/kit/icons/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON kit/icons</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* The sheet: one cell per icon, the cell sized for the longest name rather
     than for the count, so the browser decides how many fit a row. */
  .ico-sheet { flex: 1 1 100%; display: grid; gap: var(--ctl-gap);
               grid-template-columns: repeat(auto-fill, minmax(min(92px, 100%), 1fr)); }
  .ico-cell { display: flex; flex-direction: column; align-items: center; gap: var(--ctl-gap);
              padding: 14px 4px 10px; color: var(--fg); min-width: 0; }
  .ico-name { font: 400 11px/1.2 var(--mono); color: var(--dim); overflow-wrap: anywhere; text-align: center; }
  .ico-cell svg, .ico-row svg { display: block; }
  /* SIZES and COLOUR: a group of icons over the label naming the group */
  .ico-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; }
  .ico-grp { display: flex; flex-direction: column; align-items: flex-start; gap: var(--ctl-gap); }
  .ico-set { display: flex; gap: 12px; align-items: flex-end; }
  .ico-btns { display: flex; flex-wrap: wrap; gap: var(--ctl-gap); align-items: center; }
  .ico-btn-col { display: flex; flex-direction: column; gap: 12px; }
  /* record is red, as it is on the concept pages (shell.css --rec) */
  .ico-rec { color: var(--rec); }
</style>
<script type="module">
  import { el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';
  import { icon, hasIcon, NAMES, GROUPS, SOURCE, BODIES } from '/shell/icons.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';

  /**
   * The Feather set, vendored into demo/shell/icons.mjs by
   * demo/resources/build-icons.mjs, so a visit asks no server for a picture.
   * Every check is behind ?selfcheck=1.
   * See lessons/page-kit-icons.md#kit-icons-1
   */
  const { d, section, out, land, checkPage } = createKitPage({
    part: 'icons',
    what: 'Every icon in the kit, drawn from the Feather set in the ink of the text around it.',
  });

  // The blocks, newest first. ICON BUTTON: one square button per icon at both
  // sizes, a play that becomes stop, a toggle, and a group of two.
  // See lessons/page-kit-icons.md#kit-icons-2
  const ib = [];                       // every icon button on this block
  let swap = null, swapSm = null, loopB = null, grp = null;
  section('ICON BUTTON',
    'A square button holding one icon and named by its label, at 34 and 26 px, alone or joined in a button group.',
    `createIconButton({ icon: 'play', label: 'Play', onPress, small, pressed })
  -> { el, set('stop', 'Stop'), pressed(true) }
createButtonGroup({ buttons: [{ id: 'play', icon: 'play', label: 'Play' }] })
  -> group.setIcon('play', 'stop', 'Stop')`,
    (box) => {
      const col = el('div', 'ico-btn-col');
      for (const small of [false, true]) {
        const row = el('div', 'ico-btns');
        let playing = false;
        const p = createIconButton({ icon: 'play', label: 'Play', small,
          onPress: () => { playing = !playing; p.set(playing ? 'stop' : 'play', playing ? 'Stop' : 'Play'); } });
        const r = createIconButton({ icon: 'record', label: 'Record', small });
        r.el.classList.add('ico-rec');
        const s = createIconButton({ icon: 'stop', label: 'Stop', small });
        const l = createIconButton({ icon: 'loop', label: 'Loop', small, pressed: false,
          onPress: () => l.pressed(!l.pressed()) });
        row.append(p.el, r.el, s.el, l.el);
        ib.push(p.el, r.el, s.el, l.el);
        if (small) swapSm = p; else { swap = p; loopB = l; }
        col.append(row);
      }
      let on = false;
      grp = createButtonGroup({ buttons: [
        { id: 'rec', icon: 'record', label: 'Record' },
        { id: 'play', icon: 'play', label: 'Play',
          onPress: () => { on = !on; grp.setIcon('play', on ? 'stop' : 'play', on ? 'Stop' : 'Play'); } },
      ] });
      grp.button('rec').classList.add('ico-rec');
      ib.push(...grp.buttons);
      col.append(grp.el);
      box.append(col);
    });

  const cells = [];
  section('SAMPLE SHEET', 'Every name icon() knows, at 24 px, with the name to ask for it by under it.', null, (box) => {
    const grid = el('div', 'ico-sheet');
    for (const [, names] of GROUPS) for (const name of names) {
      const cell = el('div', 'ico-cell');
      cell.title = `Feather ${SOURCE[name]}`;
      cell.append(icon(name, { size: 24 }), el('span', 'ico-name', name));
      grid.append(cell);
      cells.push({ name, cell });
    }
    box.append(grid);
    box.append(out(`${NAMES.length} icons from Feather, MIT`));
  });

  const SIZES = [16, 20, 24, 32];
  const SIZE_NAMES = ['play', 'settings', 'waveform', 'link'];
  const sized = [];
  section('SIZES', 'The same four icons at 16, 20, 24 and 32 px, with a 1.5 unit line that is one pixel at 16.', null, (box) => {
    const row = el('div', 'ico-row');
    for (const s of SIZES) {
      const grp = el('div', 'ico-grp');
      const set = el('div', 'ico-set');
      for (const n of SIZE_NAMES) { const svg = icon(n, { size: s }); set.append(svg); sized.push({ s, svg }); }
      grp.append(set, el('span', 'ico-name', `${s} px`));
      row.append(grp);
    }
    box.append(row);
  });

  const BTN_NAMES = ['play', 'pause', 'stop', 'record', 'loop', 'settings', 'close', 'plus'];
  const LABELS = { play: 'Play', pause: 'Pause', stop: 'Stop', record: 'Record', loop: 'Loop', settings: 'Settings', close: 'Close', plus: 'Add' };
  const buttons = [];
  section('IN A BUTTON', 'The kit’s glyph square at 34 px and its small square at 26, each holding one icon and named by its own label.', null, (box) => {
    const col = el('div', 'ico-btn-col');
    for (const [cls, size] of [['', 16], ['pos-sm', 14]]) {
      const row = el('div', 'ico-btns');
      for (const n of BTN_NAMES) {
        const b = el('button', cls, '', { type: 'button', 'data-glyph': '1', 'aria-label': LABELS[n], title: LABELS[n] });
        b.append(icon(n, { size }));
        row.append(b);
        buttons.push({ cls, size, b });
      }
      col.append(row);
    }
    box.append(col);
  });

  const INKS = [['--dim', 'dim'], ['--fg2', 'fg2'], ['--fg', 'fg'], ['--hi', 'hi']];
  const inked = [];
  section('COLOUR', 'An icon has no colour of its own and draws in the colour of its text, here the dim, the middle grey, the foreground and the accent.', null, (box) => {
    const row = el('div', 'ico-row');
    for (const [tok, label] of INKS) {
      const grp = el('div', 'ico-grp');
      const set = el('div', 'ico-set');
      set.style.color = `var(${tok})`;
      for (const n of ['record', 'mic', 'warning']) set.append(icon(n, { size: 24 }));
      grp.append(set, el('span', 'ico-name', label));
      row.append(grp);
      inked.push({ tok, set });
    }
    box.append(row);
  });

  land();

  if (SELFCHECK) {
  const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  await frames(3);
  checkPage();

  // ICON BUTTON. Every claim is read off rendered rects, never off the CSS.
  {
    const sm = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-sm'));
    const want = (b) => (b.classList.contains('pos-sm') ? sm : 34);
    const geo = (b) => {
      const r = b.getBoundingClientRect(), s = b.querySelector('svg').getBoundingClientRect();
      return { w: r.width, h: r.height,
        off: Math.max(Math.abs((s.left + s.width / 2) - (r.left + r.width / 2)), Math.abs((s.top + s.height / 2) - (r.top + r.height / 2))) };
    };

    // square at both sizes, the group's two included
    const notSq = ib.filter((b) => { const g = geo(b); return Math.abs(g.w - want(b)) > 0.5 || Math.abs(g.h - want(b)) > 0.5; });
    const nSm = ib.filter((b) => b.classList.contains('pos-sm')).length;
    d.assert('ICON BUTTON is the kit’s square, 34 px and --ctl-sm, alone and in a group',
      ib.length === 10 && nSm === 4 && notSq.length === 0,
      notSq.length ? notSq.map((b) => `${b.getAttribute('aria-label')} ${geo(b).w.toFixed(1)}x${geo(b).h.toFixed(1)}`).join(', ')
        : `${ib.length} buttons, ${ib.length - nSm} at 34 px and ${nSm} at ${sm} px, each as wide as it is tall`);

    // the icon on the centre of its button
    const worst = Math.max(...ib.map((b) => geo(b).off));
    d.assert('ICON BUTTON puts its icon on the button’s centre',
      worst <= 0.5, `the worst of ${ib.length} is ${worst.toFixed(2)} px off centre`);

    // swapping play for stop keeps the size and the centre, alone and grouped
    const swaps = [];
    for (const [name, b, doSet] of [
      ['big', swap.el, (n, l) => swap.set(n, l)],
      ['small', swapSm.el, (n, l) => swapSm.set(n, l)],
      ['group', grp.button('play'), (n, l) => grp.setIcon('play', n, l)],
    ]) {
      const a = geo(b);
      doSet('stop', 'Stop');
      const z = geo(b), faced = b.dataset.icon, named = b.getAttribute('aria-label');
      doSet('play', 'Play');
      swaps.push({ name, ok: faced === 'stop' && named === 'Stop' && b.querySelectorAll('svg').length === 1
        && Math.abs(a.w - z.w) < 0.01 && Math.abs(a.h - z.h) < 0.01 && z.off <= 0.5,
        say: `${name} ${a.w.toFixed(1)} to ${z.w.toFixed(1)}, ${faced}, ${z.off.toFixed(2)} off` });
    }
    d.assert('swapping play for stop keeps the button its size and the icon on its centre',
      swaps.every((x) => x.ok), swaps.map((x) => x.say).join('; '));

    // a name for every one, the picture hidden behind it
    const unnamed = ib.filter((b) => {
      const n = (b.getAttribute('aria-label') || '').trim();
      return !n || b.title !== n || b.querySelector('svg').getAttribute('aria-hidden') !== 'true' || b.textContent.trim() !== '';
    });
    const before = loopB.pressed();
    loopB.el.click();
    const after = loopB.el.getAttribute('aria-pressed');
    loopB.el.click();
    d.assert('every icon button is named by its label, its picture is aria-hidden, and a toggle says pressed',
      unnamed.length === 0 && before === false && after === 'true' && loopB.pressed() === false
        && !grp.buttons.some((b) => b.hasAttribute('aria-pressed')),
      unnamed.length ? `unnamed: ${unnamed.length}` : `${ib.length} named, ${ib.map((b) => b.getAttribute('aria-label')).slice(0, 4).join(', ')}..., loop pressed ${before} then ${after}, the group writes none`);

    // NEGATIVE CONTROL: an unknown icon throws, at build and at swap, and a
    // failed swap leaves the old face rather than an empty square; so does a
    // picture with no label
    const errs = [];
    try { createIconButton({ icon: 'no-such-icon', label: 'Nothing' }); } catch (e) { errs.push(e.message); }
    const faceBefore = swap.el.innerHTML;
    try { swap.set('no-such-icon', 'Nothing'); } catch (e) { errs.push(e.message); }
    try { createIconButton({ icon: 'play', label: '' }); } catch (e) { errs.push(e.message); }
    d.assert('an unknown icon throws at build and at swap, leaving the old face, and so does an icon with no label',
      errs.length === 3 && errs[0].includes('no-such-icon') && errs[1].includes('no-such-icon') && errs[2].includes('label')
        && swap.el.innerHTML === faceBefore && swap.el.dataset.icon === 'play',
      errs.length ? errs.join(' | ') : 'NOTHING THREW');
  }

  // 1. every name has a cell, and every cell draws an <svg> with ink in it
  {
    const bad = [];
    for (const { name, cell } of cells) {
      const svg = cell.querySelector('svg');
      const shapes = svg ? svg.querySelectorAll('path, circle, rect, line, polyline, polygon, ellipse') : [];
      const pathOk = [...shapes].every((s) => s.tagName !== 'path' || (s.getAttribute('d') || '').trim().length > 0);
      const bb = svg && shapes.length ? svg.getBBox() : { width: 0, height: 0 };
      const r = svg?.getBoundingClientRect();
      if (!svg || !shapes.length || !pathOk || (bb.width <= 0 && bb.height <= 0) || !r || Math.round(r.width) !== 24) bad.push(name);
    }
    d.assert('every icon in the set draws an <svg> with shapes and ink in it, one cell per name',
      cells.length === NAMES.length && cells.length > 0 && bad.length === 0,
      bad.length ? `${bad.length} drew nothing: ${bad.join(', ')}` : `${cells.length} of ${NAMES.length} names drawn at 24 px, each with a non-empty shape`);
  }

  // 2. no two icons are the same picture
  {
    const bodies = NAMES.map((n) => BODIES[n]);
    const drawn = cells.map(({ cell }) => cell.querySelector('svg').innerHTML);
    const dupes = NAMES.filter((n, i) => bodies.indexOf(bodies[i]) !== i);
    d.assert('no two icons are the same picture',
      new Set(bodies).size === NAMES.length && new Set(drawn).size === cells.length,
      dupes.length ? `repeated: ${dupes.join(', ')}` : `${new Set(bodies).size} distinct bodies of ${NAMES.length}, ${new Set(drawn).size} distinct on the page`);
  }

  // 3. a titled icon has a name, an untitled one is hidden from a screen reader
  {
    const named = icon('mic', { title: 'Microphone' });
    const plain = icon('mic');
    const t = named.querySelector('title');
    const sheetHidden = cells.every(({ cell }) => cell.querySelector('svg').getAttribute('aria-hidden') === 'true');
    const btnNamed = buttons.every(({ b }) => (b.getAttribute('aria-label') || '').length > 0 && b.querySelector('svg').getAttribute('aria-hidden') === 'true');
    d.assert('an icon with a title is a named picture and one without is aria-hidden, and every icon button carries its own name',
      named.getAttribute('role') === 'img' && named.getAttribute('aria-label') === 'Microphone' && t?.textContent === 'Microphone'
        && !named.hasAttribute('aria-hidden') && plain.getAttribute('aria-hidden') === 'true' && !plain.hasAttribute('role')
        && !plain.querySelector('title') && sheetHidden && btnNamed,
      `titled: role ${named.getAttribute('role')}, aria-label "${named.getAttribute('aria-label')}", title "${t?.textContent}"; `
      + `untitled: aria-hidden ${plain.getAttribute('aria-hidden')}; sheet ${sheetHidden ? 'all hidden' : 'NOT ALL HIDDEN'}, `
      + `${buttons.length} buttons ${btnNamed ? 'named by aria-label' : 'NOT ALL NAMED'}`);
  }

  // 4. NEGATIVE CONTROL: a name the set does not have throws in words, rather
  // than drawing an empty square that reads as an icon
  {
    let msg = null;
    try { icon('no-such-icon'); } catch (e) { msg = e.message; }
    d.assert('an unknown name throws and says which name, rather than drawing an empty square',
      !hasIcon('no-such-icon') && hasIcon('play') && typeof msg === 'string' && msg.includes('no-such-icon'),
      msg ? `threw: ${msg}` : 'DID NOT THROW');
  }

  // 5. SIZES: each icon lays out at exactly the size asked for
  {
    const off = sized.filter(({ s, svg }) => { const r = svg.getBoundingClientRect(); return Math.abs(r.width - s) > 0.01 || Math.abs(r.height - s) > 0.01; });
    d.assert('SIZES lays every icon out at exactly 16, 20, 24 and 32 px',
      sized.length === SIZES.length * SIZE_NAMES.length && off.length === 0,
      off.length ? `${off.length} off: ${off.map(({ s, svg }) => `${s} drew ${svg.getBoundingClientRect().width}`).join(', ')}`
        : `${sized.length} icons, ${SIZES.join(', ')} px, each its own size to the hundredth`);
  }

  // 6. IN A BUTTON: the squares are the kit's squares and the icon sits on
  // their centre, read off the two rects rather than believed from the CSS
  {
    const sm = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-sm'));
    const bad = [];
    let worst = 0;
    for (const { cls, size, b } of buttons) {
      const r = b.getBoundingClientRect(), s = b.querySelector('svg').getBoundingClientRect();
      const want = cls ? sm : 34;
      const dx = Math.abs((s.left + s.width / 2) - (r.left + r.width / 2));
      const dy = Math.abs((s.top + s.height / 2) - (r.top + r.height / 2));
      worst = Math.max(worst, dx, dy);
      if (Math.abs(r.width - want) > 0.5 || Math.abs(r.height - want) > 0.5 || dx > 0.5 || dy > 0.5 || Math.abs(s.width - size) > 0.01) bad.push(`${b.getAttribute('aria-label')} ${cls || 'square'} ${r.width.toFixed(1)}x${r.height.toFixed(1)}`);
    }
    d.assert('IN A BUTTON the glyph square is 34 px, the pos-sm square is --ctl-sm, and every icon sits on its button’s centre',
      buttons.length === BTN_NAMES.length * 2 && bad.length === 0,
      bad.length ? bad.join(', ') : `${buttons.length} buttons, 34 and ${sm} px squares, the worst icon ${worst.toFixed(2)} px off centre`);
  }

  // 7. COLOUR: each icon's stroke is the colour of the text it sits in, and
  // the four inks really are four
  {
    const bad = [];
    const cols = inked.map(({ tok, set }) => {
      const c = getComputedStyle(set).color;
      for (const svg of set.querySelectorAll('svg')) if (getComputedStyle(svg).stroke !== c) bad.push(`${tok} ${getComputedStyle(svg).stroke}`);
      return c;
    });
    d.assert('COLOUR strokes every icon in the ink of its container, four different inks',
      bad.length === 0 && new Set(cols).size === INKS.length,
      bad.length ? `stroke not the text colour: ${bad.join(', ')}` : INKS.map(([t], i) => `${t} ${cols[i]}`).join(', '));
  }

  // 8. Nothing left this origin: the icons are vendored, not fetched.
  // See lessons/page-kit-icons.md#kit-icons-3
  {
    const off = performance.getEntriesByType('resource').map((e) => e.name).filter((u) => new URL(u).origin !== location.origin);
    d.assert('the page fetched nothing from another origin',
      off.length === 0, off.length ? off.slice(0, 3).join(', ') : `${performance.getEntriesByType('resource').length} requests, all to this origin`);
  }
  } // if (SELFCHECK)

  d.ready();
</script>
</html>

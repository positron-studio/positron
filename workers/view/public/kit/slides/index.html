      scrollTo(0, scrollWas);
      d.assert('SLIDES: a pointer press on a FAU key lights it and letting go puts it out',
        down && up && F.presses() === p0 + 1,
        `lit ${down}, out after ${up}, ${F.presses() - p0} press(es) heard`);
    }

    {
      // TOM on a slide: the split, the words it may carry, the clock, the spill
      const G = C.grid;
      const sl = G.column.closest('.sl');
      const slot = G.panel.el.closest('.sl-slot');
      const slr = sl.getBoundingClientRect(), str = slot?.getBoundingClientRect();
      const onDark = !!str && (str.left + str.right) / 2 > (slr.left + slr.right) / 2;
      d.assert('SLIDES: the TOM slide is a split with the instrument on the slot side, the darker half',
        sl.dataset.layout === 'split' && sl.dataset.side === 'right' && !!slot && onDark
          && G.panel.el.contains(G.grid.el) && G.panel.el.contains(G.bar.el),
        `${sl.dataset.layout} on the ${sl.dataset.side}, the panel ${slot ? 'in the slot' : 'NOT in a slot'}, `
        + `the slot ${onDark ? 'on the darker half' : 'on the WORDS half'}`);
      // every text node with a letter or a digit in it, outside the plate
      const plate = G.panel.el.querySelector('.panel-plate');
      const w = document.createTreeWalker(G.panel.el, NodeFilter.SHOW_TEXT);
      const words = [];
      let n;
      while ((n = w.nextNode())) {
        if (!/[\p{L}\p{N}]/u.test(n.data)) continue;
        if (plate && plate.contains(n)) continue;
        words.push(n.data.trim());
      }
      const plateText = (plate?.textContent || '').trim();
      d.assert('SLIDES: the TOM instrument carries no text labels, only its plate',
        words.length === 0 && plateText === 'TOM' && G.grid.labels.length === 0
          && G.grid.ticks.every((t) => t.textContent === ''),
        `${words.length} text node(s) outside the plate${words.length ? `: ${words.slice(0, 4).join(', ')}` : ''}, `
        + `the plate reads ${JSON.stringify(plateText)}, ${G.grid.labels.length} row label(s)`);
      const s0 = G.steps(), at0 = G.grid.step();
      await nap(400);
      d.assert('SLIDES: the TOM grid walks its pattern while the tab is open, the toggle saying so',
        G.steps() > s0 && G.grid.clock.playing() && G.deck.playing() && G.grid.count() > 0,
        `${G.steps() - s0} steps in 0.4 s from step ${at0} at ${G.grid.clock.bpm()} bpm, `
        + `${G.grid.count()} pads lit, the bar's deck ${G.deck.playing() ? 'playing' : 'STOPPED'}`);
      {
        // 32 steps, two bars, and no tempo arrows in the bar
        const g = G.grid, rows = g.pads;
        const cell = parseFloat(g.el.style.getPropertyValue('--pg-cell'));
        const glyphs = [...G.bar.el.querySelectorAll('button')].filter((b) => /[‹›]/.test(b.textContent));
        d.assert('SLIDES: the TOM grid is 32 steps on every row at a drawable pad size, and its bar carries no tempo arrows',
          g.steps === 32 && rows.length === 6 && rows.every((r) => r.length === 32)
            && !G.bar.el.querySelector('.step') && glyphs.length === 0 && cell >= 18,
          `${g.steps} steps, ${rows.length} rows of ${[...new Set(rows.map((r) => r.length))].join('/')}, `
          + `pads ${cell} logical px, `
          + `${G.bar.el.querySelectorAll('.step').length} stepper(s) and ${glyphs.length} arrow button(s) in the bar`);
      }
      {
        // drawable: a press toggles, a second press toggles back, a drag paints, a body key reaches nothing
        const g = G.grid, saved = g.pattern();
        const fire = (c, type) => c.dispatchEvent(new PointerEvent(type, {
          bubbles: true, pointerId: 41, pointerType: 'mouse', button: 0 }));
        const up = () => dispatchEvent(new PointerEvent('pointerup', { pointerId: 41, pointerType: 'mouse', button: 0 }));
        const pad = g.pads[3][1];                         // open hat, step 2: dark in the pattern
        const was = g.get(3, 1);
        fire(pad, 'pointerdown'); up();
        const onAfter = g.get(3, 1);
        fire(pad, 'pointerdown'); up();
        const offAfter = g.get(3, 1);
        d.assert('SLIDES: a pointer press on a TOM pad lights it and a second press puts it out',
          g.readOnly === false && pad.tagName === 'BUTTON' && !was && onAfter && !offAfter,
          `${pad.tagName.toLowerCase()} pad, ${was ? 'lit' : 'dark'} before, ${onAfter ? 'lit' : 'DARK'} after one press, `
          + `${offAfter ? 'STILL LIT' : 'dark'} after the second`);
        // a drag along the clap row from a dark pad paints, then one from a lit pad erases
        const row = g.pads[4], run = [0, 1, 2, 3, 4, 5];
        fire(row[run[0]], 'pointerdown');
        for (const s of run.slice(1)) fire(row[s], 'pointerover');
        up();
        const painted = run.filter((s) => g.get(4, s)).length;
        fire(row[run[0]], 'pointerdown');
        for (const s of run.slice(1)) fire(row[s], 'pointerover');
        up();
        const erased = run.filter((s) => !g.get(4, s)).length;
        // a hover after the drag ended must paint nothing
        fire(row[7], 'pointerover');
        const stray = g.get(4, 7);
        d.assert('SLIDES: a drag across a TOM row paints every pad it crosses, and one starting on a lit pad erases them',
          painted === run.length && erased === run.length && !stray,
          `${painted} of ${run.length} lit by the first drag, ${erased} of ${run.length} dark after the second, `
          + `a hover after letting go ${stray ? 'PAINTED' : 'painted nothing'}`);
        // Enter on a focused pad toggles it, as the component does
        const k = g.pads[5][0];
        const kWas = g.get(5, 0);
        k.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        const kNow = g.get(5, 0);
        // Space, an arrow and Enter from the body reach neither the grid nor the bar
        const before = JSON.stringify(g.pattern()), refused0 = G.refused();
        for (const key of [' ', 'ArrowRight', 'Enter']) {
          document.body.dispatchEvent(new KeyboardEvent('keydown', { key, code: key === ' ' ? 'Space' : key, bubbles: true, cancelable: true }));
        }
        const bodyQuiet = JSON.stringify(g.pattern()) === before && g.clock.playing() && G.deck.playing();
        d.assert('SLIDES: Enter on a TOM pad toggles it, and Space, an arrow or Enter from the page reach neither the grid nor its bar',
          kNow === !kWas && bodyQuiet,
          `Enter turned the pad ${kNow ? 'on' : 'off'} from ${kWas ? 'on' : 'off'}, the body's keys left the pattern `
          + `${bodyQuiet ? 'unchanged and the grid playing' : 'CHANGED or the grid STOPPED'}, `
          + `${G.refused() - refused0} refused by the bar's gate`);
        // put the pattern back the way the slide drew it
        saved.forEach((r, ri) => r.forEach((v, si) => { if (g.get(ri, si) !== !!v) g.set(ri, si, !!v, 'quiet'); }));
        const back = JSON.stringify(g.pattern()) === JSON.stringify(saved)
          && G.pattern.every((r, ri) => r.every((st) => g.get(ri, st)));
        d.assert('SLIDES: the TOM pattern is put back after the drawing checks',
          back, back ? `${g.count()} pads lit, as the slide drew them` : 'the pattern DIFFERS from the one the slide drew');
      }
      const inn = sl.querySelector('.sl-in');
      const spill = inn.scrollWidth > inn.clientWidth + 1 || inn.scrollHeight > inn.clientHeight + 1;
      const col = G.column.getBoundingClientRect(), pr = G.panel.el.getBoundingClientRect();
      const inCol = pr.left >= col.left - 1 && pr.right <= col.right + 1 && pr.top >= col.top - 1 && pr.bottom <= col.bottom + 1;
      const strip = G.kase.strip;
      const over = strip.scrollWidth > strip.clientWidth + 1;
      const scrolls = /auto|scroll/.test(getComputedStyle(strip).overflowX);
      d.assert('SLIDES: the TOM panel stays inside its column, and the steps only ever spill into their own scroll',
        !spill && inCol && (!over || scrolls),
        `the panel ${inCol ? 'inside' : 'OUTSIDE'} a ${col.width.toFixed(0)} px column at ${G.fb.k().toFixed(2)}x, `
        + `steps ${strip.scrollWidth} in ${strip.clientWidth} logical px (${over ? (scrolls ? 'scrolling' : 'SPILLING') : 'fit'})`
        + `${spill ? ', the slide OVERFLOWS' : ''}`);
    }

    // ── nothing fetched ──────────────────────────────────────────────────
    {
      const after = performance.getEntriesByType('resource');
      // Not counted: the shell's own d.log POSTs to the dev server's /_log on 127.0.0.1.
      // One file is allowed by name: the router's screen code for the OLED slide.
      // See lessons/page-kit-slides.md#kit-slides-51
      const WASM = '/resources/pico/oled-ui.wasm';
      const during = after.slice(resBefore).map((e) => e.name)
        .filter((n) => !(new URL(n).origin === location.origin && new URL(n).pathname === '/_log'));
      // Over the whole visit, not only the checks: the visit opened the part, so the one
      // request came before they began.
      // See lessons/page-kit-slides.md#kit-slides-52
      const wasm = after.map((e) => e.name).filter((n) => new URL(n).origin === location.origin && new URL(n).pathname === WASM);
      // Not counted: this origin's font files (the slides may be the first thing set in
      // the face, so they can arrive mid check; the face is graded below) and /favicon.ico.
      // See lessons/page-kit-slides.md#kit-slides-53
      const other = during.filter((n) => !wasm.includes(n)
        && !(new URL(n).origin === location.origin && (/^\/shell\/vendor\/[^/]+\.woff2$/.test(new URL(n).pathname) || new URL(n).pathname === '/favicon.ico')));
      const faces = after.filter((e) => /\/shell\/vendor\/jetbrains-mono/.test(e.name));
      const foreign = faces.filter((e) => new URL(e.name).origin !== location.origin);
      d.assert(`SLIDES: the visit and the grading fetched exactly one file, ${WASM} from this origin, and the face came from this origin`,
        // at most three face files: Latin 400 and 600, and Greek 600
        // See lessons/page-kit-slides.md#kit-slides-54
        wasm.length === 1 && other.length === 0 && new Set(faces.map((e) => e.name)).size <= 3 && foreign.length === 0,
        `${wasm.length} request(s) for the screen code, ${other.length} other${other.length ? `: ${other.slice(0, 3).join(', ')}` : ''}, `
        + `the face ${faces.length} file(s), ${foreign.length} from another host`);
    }

    // the slide's bar is left PLAYING as the tab closes, so the close has something to stop
    C.bar.bar.api.el.querySelector('.tbar-toggle').click();
    // On its own page the part closes when the page is hidden, which a page cannot do to
    // itself, so the check calls slidesClose(), the visibilitychange listener's call.
    // See lessons/page-kit-slides.md#kit-slides-55
    slidesClose();
    const logsAt = [C.liveLog.lines(), C.liveTable.log.count()];
    await nap(600);
    const logsStill = C.liveLog.lines() === logsAt[0] && C.liveTable.log.count() === logsAt[1]
      && !C.liveLog.running() && !C.liveTable.running();
    d.assert('SLIDES: closing the part stops everything it started, the live logs included',
      !slideKit.open && C.video.video.paused && !C.grid.grid.clock.playing() && !C.grid.deck.playing() && logsStill,
      `open ${slideKit.open}, the video ${C.video.video.paused ? 'paused' : 'playing'}, `
      + `the logs ${logsStill ? 'still' : 'STILL WRITING'} at ${logsAt.join(' and ')} over 0.6 s`);
    {
      const G = C.grid, s0 = G.steps();
      await nap(300);
      d.assert('SLIDES: closing the part stops the TOM grid on its first column and it stays there',
        G.steps() === s0 && G.grid.step() === 0 && !G.grid.clock.playing() && !G.deck.playing(),
        `${G.steps() - s0} steps in 0.3 s after closing, the head at step ${G.grid.step()}`);
    }
    {
      const T = C.timeline, B = C.bar;
      const at = T.deck.position();
      await nap(300);
      d.assert('SLIDES: closing the part stops the strip’s deck, its timer and the slide’s bar',
        !T.deck.playing() && T.deck.position() === at && !T.chainRunning() && !B.deck.playing(),
        `the strip's deck ${T.deck.playing() ? 'PLAYING' : 'stopped'} at ${at.toFixed(0)}, its timer ${T.chainRunning() ? 'ARMED' : 'off'}, `
        + `the bar's deck ${B.deck.playing() ? 'PLAYING' : 'stopped'}`);
    }

    varChecks();
  }

  // Names from the code: mono inside sans, the named one in its hue and the other in
  // the words' ink. Both halves, since colouring every code or none passes one each.
  // See lessons/page-kit-slides.md#kit-slides-56
  function varChecks() {
    const V = slideKit.comps.vars;
    const text = V.s.parts.text;
    const cut = text?.querySelector('code.sl-var[data-var="cutoff"]'), proc = text?.querySelector('code.sl-var[data-var="process"]');
    const fam = (e) => (e ? getComputedStyle(e).fontFamily : '');
    const col = (e) => (e ? getComputedStyle(e).color : '');
    const size = (e) => (e ? getComputedStyle(e).fontSize : '');
    const hue = V.book.hueOf('cutoff');
    // the colour a code box gives that hue, measured off a probe span with the code box's own class
    const probe = el('span', 'pos-tk-pvar');
    probe.dataset.hue = String(hue);
    probe.style.setProperty('--param-hue', String(hue));
    text.append(probe);
    const want = col(probe);
    probe.remove();
    d.assert('NAMES FROM THE CODE: a name in backticks is mono inside sans text at the words’ size, the named one in its knob’s hue and the other in the words’ ink',
      !!cut && !!proc && /JetBrains Mono/.test(fam(cut)) && /JetBrains Mono/.test(fam(proc)) && !/JetBrains Mono/.test(fam(text))
        && size(cut) === size(text) && size(proc) === size(text)
        && V.coloured === 1 && cut.dataset.hue === String(hue) && col(cut) === want && col(cut) !== col(text)
        && !('hue' in proc.dataset) && col(proc) === col(text) && plain(V.s.spec.text) === 'Turn cutoff and the sound of process darkens',
      `cutoff in "${fam(cut).split(',')[0]}" at ${size(cut)} coloured ${col(cut)} against the code box's ${want} for hue ${hue}, `
      + `process in "${fam(proc).split(',')[0]}" at ${size(proc)} coloured ${col(proc)}, the words in "${fam(text).split(',')[0]}" at ${size(text)} coloured ${col(text)}`);
  }

</script>

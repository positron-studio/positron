<script type="module">
  import { el, createReport } from '/shell/shell.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createStepGrid } from '/shell/step-grid.mjs';
  import { assertBar, countInk, DRILL } from '/shell/bar-drill.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createHueBook } from '/shell/code-lang.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createWaveView } from '/shell/wave-view.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { GLCD5X7 } from '/shell/oled-font.mjs';
  import { burn, FRAME_W, FRAME_H, videoHue } from '/shell/pattern.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createSlide, createSlidePlayer, createSlideLog, fitBox, slideDiagram, stepOf, stepCaption,
           plain, lintWords, SCALE, hueVars }
    from '/shell/slide.mjs';
  import { KEYS as PICO_KEYS, W as OLED_W, H as OLED_H } from '/shell/pico.mjs';
  import { markAdapter } from '/shell/fixture.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createParamKnobs } from '/shell/param-knobs.mjs';
  import { createPanelLayout } from '/shell/panel-layout.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';
  import { OLED_LIT, drawOled, oledText, createOledParts } from '/shell/oled-view.mjs';

  /**
   * kit/slides: the SLIDES part of /kit/ on a page of its own (plans/plan-kit-split.md),
   * checks behind ?selfcheck=1. The visit opens the part: slidesOpen() runs once the
   * blocks are built, visibilitychange pauses and resumes it.
   * See lessons/page-kit-slides.md#kit-slides-1
   */
  const { d, section, land, checkPage } = createKitPage({
    part: 'slides',
    what: "Slides made from plain data at six type sizes, with live parts of this site running on them.",
  });

  /* The router's state object, kept whole: the OLED slides register their canvases in
     hw.parts and hwPartsLoad fills hw.oled, hw.partsFetched and hw.partsFrom.
     The board fields are unused here; the emulator is /kit/hardware/.
     See lessons/page-kit-slides.md#kit-slides-2 */
  const hw = {
    state: 'idle',          // idle, loading, running, paused, failed
    fetched: 0,             // how many times this page asked for the UF2
    image: null, fonts: [], defaultFont: -1, font: null,
    runner: null, px: null, frames: 0, boots: 0,
    out: [],                // every message off DIN OUT, as hex
    stats: null,
    framer: null,
    ui: null,               // the controls, for the checks
    pointerUp: new Map(),   // key -> when a pointer last let go of it
    keys: 'bottom',         // where the firmware puts its key labels, byte 7
    fontAt: -1,             // the UI_FONTS index booted last
    oled: null,             // ui.c as WebAssembly, for the parts blocks
    partsFetched: 0,        // how many times this page asked for it
    partsFrom: '',          // which tab asked: 'slides' or 'hardware'
    parts: [],              // { name, cv, paint, px }, drawn when it arrives
  };
  // `drawOled`, `oledText` and the inks are `demo/shell/oled-view.mjs`, and so
  // is `hwPartsLoad`, made over this page's own `hw`.
  const { hwPartsLoad } = createOledParts(hw, { log: d.log });
  /* The link screen's paint, which the OLED slides draw with, copied from
     /kit/hardware/'s LINK block and registered on an unshown canvas under the same name.
     See lessons/page-kit-slides.md#kit-slides-3 */
  {
    const cv = document.createElement('canvas');
    cv.width = OLED_W; cv.height = OLED_H;
    hw.parts.push({ name: 'link', cv, px: null, paint: (u) => {
        const bh = u.boxH(), wl = u.boxW('DIN IN'), wr = u.boxW('DIN OUT'), y = 26;
        u.box(0, y, wl, bh, 'DIN IN');
        u.box(128 - wr, y, wr, bh, 'DIN OUT');
        const ax1 = wl + 2, ax2 = 128 - wr - 3, ops = '+12 CH2', ow = u.textW(ops);
        u.arrow(ax1, ax2, y + (bh >> 1));
        // main.c's rule: on the arrow when it fits between the boxes, else on a line of its own above
        if (ow <= ax2 - ax1 - 4) u.text(ax1 + ((ax2 - ax1 + 1 - ow) >> 1), y + Math.min(0, (bh >> 1) - 2 - u.cap), ops);
        else u.text((128 - ow) >> 1, y - 2 - u.cap, ops);
      } });
  }


  /**
   * Slides: demo/shell/slide.mjs renders one slide from plain data, createSlidePlayer
   * steps several in a video panel. Blocks are in reading order, largest type down.
   * Nothing runs before slidesOpen(); the one fetch is the OLED screen code.
   * See lessons/page-kit-slides.md#kit-slides-4
   */
  const slideKit = { blocks: [], player: null, halves: [], comps: {}, open: false, specs: [] };
  function slidesOpen() {
    if (slideKit.open) return;
    slideKit.open = true;
    for (const b of slideKit.blocks) b.s.start();
    slideKit.player?.start();
    for (const p of slideKit.halves) p.start();
    // the OLED slide's real screen: ui.c as WebAssembly, the one request this
    // tab makes, on this press and never on a visit (see `hwPartsLoad`)
    hwPartsLoad('slides');
  }
  function slidesClose() {
    if (!slideKit.open) return;
    slideKit.open = false;
    for (const b of slideKit.blocks) b.s.stop();
    slideKit.player?.stop();
    for (const p of slideKit.halves) p.stop();
  }
  /** One static slide in one block, its box giving up its chrome to the slide's own. */
  const slideBlock = (title, note, src, spec) => section(title, note, src, (box) => {
    box.classList.add('kit-sl');
    const s = createSlide(spec, { host: box, full: true });
    slideKit.blocks.push({ title, s });
    slideKit.specs.push(spec);
  });
  /** A frame loop that runs between `start` and `stop`, for a slot. */
  const looped = (tick) => {
    let raf = 0;
    const loop = (t) => { tick(t); raf = requestAnimationFrame(loop); };
    return {
      start() { if (!raf) raf = requestAnimationFrame(loop); },
      stop() { cancelAnimationFrame(raf); raf = 0; },
    };
  };

  /* The machines, for the diagram slide: box names only, each outer box's role as
     desc. The relay's 1 to 2 ms is PROGRESS.md:3472 (DO hop +1.0, +1.6, +0.8 ms).
     See lessons/page-kit-slides.md#kit-slides-5 */
  const SLIDE_MACHINES = {
    nodes: [
      { id: 'sbr', label: 'Browser', kind: 'here', tech: 'browser', desc: 'one page from the kit',
        children: [{ id: 'spg', label: 'page', tech: 'browser', note: 'Every demo is one page that mounts the shell.' }] },
      { id: 'scf', label: 'Cloudflare', tech: 'cloudflare', desc: 'a relay, 1 to 2 ms',
        children: [{ id: 'srl', label: 'relay', tech: 'relay', note: 'One **Durable Object** per room.' }] },
      { id: 'spi', label: 'Raspberry Pi', tech: 'raspberry', desc: 'the Circuit and a sampler',
        children: [{ id: 'ssy', label: 'synths', tech: 'sound', note: 'The board plays what arrives.' }] },
    ],
    links: [
      { from: 'spg', to: 'srl', note: 'Note on and note off as WebSocket messages.' },
      { from: 'srl', to: 'ssy', note: 'The relay hands them to the board.' },
    ],
  };


  // The player, the first block. Two slides; the second rebuilds the diagram from
  // slideDiagram(SLIDE_MACHINES), safe because each diagram has its own marker uid.
  // go() stops the slide it leaves and starts the one it shows.
  // See lessons/page-kit-slides.md#kit-slides-6
  section('THE PLAYER',
    'Slides in a video panel: previous and next on the left, the count in the middle, full '
    + 'screen on the right. Press the slide and the arrows, space, Page Up and Page Down, Home, '
    + 'End and f are its, and no other control on this page hears them.',
    `const player = createSlidePlayer([
  { say: 'Positron is a lab for *live* media', statement: true, cap: '44 demos built' },
  { say: '[Cloudflare|cloudflare] carries the streams', slot: slideDiagram(SLIDE_MACHINES) },
]);   // keys are heard on player.el only, and stopped there`,
    (box) => {
      box.classList.add('kit-sl');
      slideKit.player = createSlidePlayer([
        { name: 'lab', say: 'Positron is a lab for *live* media', statement: true,
          cap: '44 demos built, of 46 in the manifest' },
        { name: 'machines in the player', say: '[Cloudflare|cloudflare] carries the streams',
          slot: slideDiagram(SLIDE_MACHINES),
          cap: 'notes from the page through the relay to the [Pi|raspberry]' },
      ]);
      slideKit.player.stop();
      slideKit.specs.push(...slideKit.player.slides.map((s) => s.spec));
      box.append(slideKit.player.el);
    });

  // Two half-width players side by side: slide sizes are shares of the slide's height,
  // so half as wide is half the size; the footer keeps its px sizes. One column below
  // 560 px of the block's width. Figures: PROGRESS.md:4712-4719, HANDOFF.md:133-135.
  // See lessons/page-kit-slides.md#kit-slides-7
  const HALF_A = [
    { name: 'half a title', title: 'Latency off a burned clock',
      cap: 'positron.studio' },
    { name: 'half a figure', big: '*26.2*', under: 'ms glass to glass, MoQ p50',
      cap: 'browser to [Cloudflare|cloudflare] to browser' },
    { name: 'half a table', say: 'MoQ is quicker, WebRTC steadier',
      rows: { head: ['', 'p50', 'p99'], body: [['MoQ', '*26.2*', '104.8'], ['WHEP', '67.0', '*84.1*']], align: 'lrr', frame: 'none' },
      cap: 'ms, read off burned pixels' },
  ];
  const HALF_B = [
    { name: 'half a statement', say: '*Break* the check first', statement: true,
      cap: '38/38 still green with every recording silent' },
    { name: 'half the clocks', say: 'Two clocks agree after measuring',
      cap: 'median 1.8 ms between beats, one peer 137 ms fast' },
    { name: 'half the refusals', layout: 'top', say: 'ERR refuses by programme, not age',
      text: 'etv refused its newest 45 min, etv2 its oldest 78 min', textStep: 2 },
  ];
  section('HALF WIDTH PLAYERS',
    'Two players side by side, each half the block, each with slides of its own. Type, inset and '
    + 'rules are shares of each player’s own slide, so half the width is the same slides at half '
    + 'the size. Below 560 px of block they stack. A key pressed in one never steps the other.',
    `const a = createSlidePlayer(talkA), b = createSlidePlayer(talkB);
pair.append(a.el, b.el);   // .kit-sl-pair, two columns, one under 560 px of its own width`,
    (box) => {
      box.classList.add('kit-sl');
      const pair = el('div', 'kit-sl-pair');
      const grid = el('div', 'kit-sl-pair-in');
      pair.append(grid);
      slideKit.halves = [HALF_A, HALF_B].map((specs) => {
        const p = createSlidePlayer(specs);
        p.stop();
        slideKit.specs.push(...p.slides.map((s) => s.spec));
        grid.append(p.el);
        return p;
      });
      slideKit.comps.halves = { pair, grid };
      box.append(pair);
    });

  // Names from the code in the words: backticked names in the slide's mono face,
  // uncoloured until hueVars(root, hueOf) gives a hue. Here cutoff has a hue and
  // process, with no knob, does not.
  // See lessons/page-kit-slides.md#kit-slides-8
  section('NAMES FROM THE CODE IN THE WORDS',
    'A name in backticks is set in the slide’s mono face inside the sans words, and wears its knob’s hue once a hue book names it.',
    `{ text: 'Turn \`cutoff\` and the sound of \`process\` darkens' }; hueVars(slide.el, book.hueOf);`,
    (box) => {
      box.classList.add('kit-sl');
      const spec = { name: 'vars', say: 'Names from the code', text: 'Turn `cutoff` and the sound of `process` darkens', textStep: 3 };
      const sl = createSlide(spec, { host: box, full: true });
      const book = createHueBook();
      book.assign(['cutoff']);
      const coloured = hueVars(sl.el, book.hueOf);
      slideKit.blocks.push({ title: 'NAMES FROM THE CODE IN THE WORDS', s: sl });
      slideKit.specs.push(spec);
      slideKit.comps.vars = { s: sl, book, coloured };
    });

  // One slide a step, the step alone, its three numbers in the caption from
  // stepCaption, which reads SCALE, so the words cannot disagree with the type.
  // See lessons/page-kit-slides.md#kit-slides-9
  const STEP_TEXT = {
    6: '*44*',                                  // demos built, the count above
    5: 'A lab for live media',                  // what positron is, CLAUDE.md's opening line
    4: 'Latency is read off a burned clock',    // positron-ui SKILL.md, the test picture
    3: 'MoQ 26.2 ms, WHEP 67.0 ms at p50',      // PROGRESS.md:4712-4719
    2: 'Two clocks agree to 1.8 ms once the offset is measured',   // HANDOFF.md:133-135
    1: 'The relay hop measured 1 to 2 ms over three runs against the runtime\'s own ping',   // PROGRESS.md:3472
  };
  const STEP_USE = { 6: 'one figure', 5: 'a statement', 4: 'the headline', 3: 'evidence', 2: 'evidence of four rows', 1: 'the caption' };
  for (const n of [6, 5, 4, 3, 2, 1]) {
    slideBlock(`STEP ${n}`,
      `Step ${n} alone, ${STEP_USE[n]}: ${stepOf(n).size.toFixed(2)} per cent of the slide's height, `
      + `line height ${stepOf(n).lh}, tracking ${stepOf(n).ls} em.`,
      `{ layout: 'left', lines: [[${n}, ${JSON.stringify(plain(STEP_TEXT[n]))}]], cap: stepCaption(${n}) }`,
      { name: `step ${n}`, layout: 'left', lines: [[n, STEP_TEXT[n]]], cap: stepCaption(n) });
  }

  // The scale: all six steps on one slide.
  // See lessons/page-kit-slides.md#kit-slides-10
  slideBlock('THE SCALE',
    'All six steps on one slide, largest first, each 1.5 times the one under it. One column, no '
    + 'colour, set solid: six lines at their own line heights need 91 per cent of the height and '
    + 'the inset leaves 84, at line height 1 they need 83.',
    `{ layout: 'left', lines: [[6, 'step 6'], [5, 'step 5'], [4, 'step 4'], [3, 'step 3'], [2, 'step 2'], [1, 'step 1']] }`,
    // One column, no colour: all the scales and nothing else.
    // See lessons/page-kit-slides.md#kit-slides-11
    { name: 'the scale', layout: 'left',
      lines: [[6, 'step 6'], [5, 'step 5'], [4, 'step 4'], [3, 'step 3'], [2, 'step 2'], [1, 'step 1']] });

  // Title slide: the talk's name at step 5, laid out top. by and date (steps 3 and 2,
  // TITLE_STEPS in slide.mjs) are graded in slide-test.mjs, not shown here.
  // See lessons/page-kit-slides.md#kit-slides-12
  slideBlock('TITLE SLIDE',
    'The opening of a talk: its name at step 5 top left. `by`, `date` and `place` are the optional '
    + 'keys for who, when and where, and a title slide carries nothing else.',
    `{ title: 'Latency off a burned clock' }`,
    { name: 'title', title: 'Latency off a burned clock' });

  // Big number: one figure at step 6, centred, a short line under it at step 3. From
  // PROGRESS.md:4712-4713: WHEP, n=17,501 over 300 s, p50 67.0 / p95 76.9 / p99 84.1 ms.
  // See lessons/page-kit-slides.md#kit-slides-13
  slideBlock('BIG NUMBER',
    'One figure alone at step 6, centred in the darker top two thirds (the band layout), with one '
    + 'short line under it on the lighter third saying what it counts, and the caption.',
    `{ layout: 'band', big: '*67.0*', under: 'ms glass to glass, WHEP p50', cap: 'n = 17,501 over 300 s ...' }`,
    { name: 'big number', layout: 'band', big: '*67.0*', under: 'ms glass to glass, WHEP p50',
      cap: 'n = 17,501 over 300 s, browser to [Cloudflare|cloudflare] to browser' });

  // ── COMBINATIONS ──────────────────────────────────────────────────────────
  // CLAUDE.md, the stand-ins paragraph: three fake servers make four pages
  // runnable with zero bytes from anybody's server.
  slideBlock('HEADLINE OVER TEXT',
    'A combination: the headline at step 4 and a sentence of evidence at step 3, both on the left edge.',
    `{ layout: 'left', say: 'Stand-ins replace other servers', text: 'Three fake servers ...' }`,
    // Left aligned: a sentence of evidence starts where the headline starts.
    // See lessons/page-kit-slides.md#kit-slides-14
    { name: 'stand-ins', layout: 'left', say: 'Stand-ins replace other servers',
      text: 'Three fake servers make four pages runnable with no bytes from anybody else' });
  // positron-verify SKILL.md:78-80: a stand-in serving silence still read
  // 38/38 on /tapes/, a hole found only by breaking the stand-in.
  slideBlock('STATEMENT',
    'A combination of one: the sentence is the slide, at step 5, up to three lines, with a caption.',
    `{ say: '*Break* the check first', statement: true, cap: '38/38 still green ...' }`,
    { name: 'sabotage', say: '*Break* the check first', statement: true,
      cap: '38/38 still green with every recording silent' });
  // Tables with row lines, with and without rows.frame. PROGRESS.md:4712-4719: WHEP
  // vs MoQ, browser to Cloudflare to browser, n=17,501 for WHEP over 300 s.
  // See lessons/page-kit-slides.md#kit-slides-15
  slideBlock('TABLE WITH ROW LINES',
    'A table with a 1 px rule between rows and under the header and no line outside them: '
    + '`frame: \'none\'`. The air in each row is from the table’s own step, so a rule never touches a glyph.',
    `{ say: 'MoQ is quicker, WebRTC steadier', rows: { head: ['', 'p50', 'p95', 'p99'], body, align: 'lrrr', frame: 'none' } }`,
    { name: 'transports lined', say: 'MoQ is quicker, WebRTC steadier',
      rows: { head: ['', 'p50', 'p95', 'p99'],
        body: [['MoQ', '*26.2*', '*42.4*', '104.8'], ['WHEP', '67.0', '76.9', '*84.1*']], align: 'lrrr', frame: 'none' },
      cap: 'ms, browser to [Cloudflare|cloudflare] to browser, read off burned pixels' });
  // Live logs: a 250 ms timer reports how late it fired, the frame loop reports this
  // screen's frames. Both start in slidesOpen() and stop in slidesClose().
  // See lessons/page-kit-slides.md#kit-slides-16
  /** A timer asked for every `ms`, reporting how late each one fired. */
  const lateTimer = (ms, onBeat) => {
    let id = 0, due = 0, beat = 0;
    const fire = () => {
      const now = performance.now();
      onBeat(++beat, now - due, now);
      due += ms;
      id = setTimeout(fire, Math.max(0, due - performance.now()));
    };
    return {
      start() { if (id) return; beat = 0; due = performance.now() + ms; id = setTimeout(fire, ms); },
      stop() { clearTimeout(id); id = 0; },
      running: () => !!id,
    };
  };
  slideBlock('LIVE LOG ON A SLIDE',
    'Two columns: the words on the card, a live log on the darker side. It is the shell’s own '
    + 'log at the slide’s step 1, newest line at the bottom, oldest leaving the top, in a box that '
    + 'never changes height. A timer here asked to fire every 250 ms writes how late it fired.',
    `slot: (host) => { const r = createReport({ readout: {}, showReadout: false, joined: false }); host.append(r.logEl); r.line(...) }`,
    { name: 'live log', layout: 'split', side: 'right',
      say: 'A timer is never on time', text: 'each line is one beat and how late it fired',
      slot: (host) => {
        const r = createReport({ readout: {}, showReadout: false, joined: false });
        host.append(r.logEl);
        let lines = 0;
        const t = lateTimer(250, (n, late, now) => {
          // short enough for one line in half a phone's slide; a timer can
          // fire a fraction of a millisecond early, which is said as early
          r.line(`beat ${n}, ${Math.abs(late).toFixed(1)} ms ${late < 0 ? 'early' : 'late'}`, late > 4 ? 'warn' : 'info', now);
          lines++;
          // the shell's log keeps every line; a slide keeps the last forty
          while (r.logEl.children.length > 40) r.logEl.firstElementChild.remove();
        });
        slideKit.comps.liveLog = { el: r.logEl, lines: () => lines, running: t.running };
        return t;
      },
      cap: 'this tab, now, nothing fetched' });
  slideBlock('LIVE TABULAR LOG ON A SLIDE',
    'The same, as rows of a table: time, source, value and unit, values right aligned with their '
    + 'decimal points in one column and the row lines of `frame: \'none\'`. The widths are declared, '
    + 'so a longer value never moves a column.',
    `slot: (host) => { const log = createSlideLog({ head: ['s', 'from', 'value', 'unit'], widths: [6, 5, 6, 3], align: 'rlrl' }); host.append(log.el); log.add([...]) }`,
    { name: 'live table', layout: 'split', side: 'left',
      say: 'Read four times a second', text: 'how late the timer fired and how long a frame took',
      slot: (host) => {
        const log = createSlideLog({ head: ['s', 'from', 'value', 'unit'], widths: [6, 5, 6, 3], align: 'rlrl' });
        host.append(log.el);
        let t0 = 0, last = 0, gaps = [];
        const frames = looped((t) => { if (last) gaps.push(t - last); last = t; });
        const t = lateTimer(250, (n, late, now) => {
          const s = ((now - t0) / 1000).toFixed(1);
          log.add([s, 'timer', late.toFixed(2), 'ms']);
          if (gaps.length) {
            const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
            log.add([s, 'frame', mean.toFixed(2), 'ms']);
            gaps = [];
          }
        });
        slideKit.comps.liveTable = { log, running: t.running };
        return {
          start() { t0 = performance.now(); last = 0; gaps = []; frames.start(); t.start(); },
          stop() { frames.stop(); t.stop(); },
        };
      },
      cap: 'this tab, now, nothing fetched' });

  // HANDOFF.md:133-135, AHEAD on /sync/: a peer 137 ms fast, beats a median
  // 1.8 ms apart once the offset is found.
  slideBlock('HEADLINE WITH A CAPTION',
    'A combination: a headline and a caption and nothing between them. The caption is step 1, '
    + 'bottom left, on every slide that has one.',
    `{ say: 'Two clocks agree after measuring', cap: 'median 1.8 ms between beats ...' }`,
    { name: 'clocks', say: 'Two clocks agree after measuring',
      cap: 'median 1.8 ms between beats, one peer 137 ms fast' });
  slideBlock('YELLOW AND HUE MARKS',
    'A combination: *x* in any string is the accent, and [x|tech] is the hue the diagram gives '
    + 'that technology, so a word on a slide is the colour of its box.',
    `{ say: '[Cloudflare|cloudflare] carries the streams', list: ['*1 to 2 ms* through the relay', ...] }`,

  /* Declared above STEP GRID ON A SLIDE, which calls slideCommand while built. A bar
     on a slide refuses play, pause and seek during a keydown aimed outside the slide's
     frame (command seam, transport-bar.mjs); slideKeys.ev is read by eventPhase.
     See lessons/page-kit-slides.md#kit-slides-25 */
  const slideKeys = { ev: null };
  addEventListener('keydown', (e) => { slideKeys.ev = e; }, true);
  /** `command` for a bar on a slide: only a key whose target is inside `frameOf()` moves it. */
  const slideCommand = (deck, frameOf) => {
    let refused = 0;
    const ok = () => {
      const e = slideKeys.ev;
      if (!e || e.eventPhase === Event.NONE) return true;
      const f = frameOf(), t = e.target;
      if (f && t instanceof Node && f.contains(t)) return true;
      refused++;
      return false;
    };
    return {
      command: { play: () => ok() && deck.play(), pause: () => ok() && deck.pause(), seek: (p) => ok() && deck.seek(p) },
      refused: () => refused,
    };
  };

  /* Step grid on a slide: /tom/'s transport bar glued over an editable 32 step grid
     with the TOM plate, no row labels, ticks or clock, no tempo arrows, no audio.
     Steps scroll rather than shrink; the bar's keys are the slide's (slideCommand).
     See lessons/page-kit-slides.md#kit-slides-26 */
  section('STEP GRID ON A SLIDE',
    'The TOM drum machine at slide scale on the darker side of a split: its bar, a 32 step grid '
    + 'you can draw on, playing on its own clock while this tab is open, and its plate, with no '
    + 'labels on the rows or the steps. Nothing sounds here.',
    `slot: (host) => { const fb = fitBox(host, 420); fb.inner.append(createInstrumentPanel({ rows: [[[bar.el], { pad: false }], [[layout.el], { pad: false }]], plate: { name: 'TOM', place: 'end' }, full: true }).el) }`,
    (box) => {

      const s = createSlide({ name: 'tom', layout: 'split', side: 'right',

          /* A pad a finger can draw on: at PAD_MIN 32 steps are 10 px pads, about 7 screen px
             at this slot's 0.67x to 0.75x; 18 logical px is about 13, and the steps scroll.
             See lessons/page-kit-slides.md#kit-slides-27 */
          const STEPS = 32, PAD_DRAW = 18;
          const kase = createPanelLayout({ side: null, flow: false, strip: { role: 'group', label: 'steps' } });
          const grid = createStepGrid({ strip: kase.strip, rows: 6, steps: STEPS, minCell: PAD_DRAW,
            rate: { bpm: 120, whose: 'this slide, which made it up' } });
          // two bars: kick, snare, closed hat, open hat, clap, tom, the second bar with a fill
          const PATTERN = [
            [0, 8, 10, 16, 24, 27],
            [4, 12, 20, 28],
            [0, 2, 4, 6, 8, 10, 12, 16, 18, 20, 22, 24, 26],
            [14, 30],
            [12, 28],
            [25, 29, 31],
          ];
          PATTERN.forEach((row, r) => row.forEach((st) => grid.set(r, st, true, 'quiet')));
          let steps = 0;
          grid.clock.onStep(() => { steps++; });
          /* The deck is a follower with nothing on it, so the toggle's face can
             say playing or stopped; the grid's clock is what moves. A stop goes
             back to the first column, which is `/tom/`'s stop and the clock's. */
          const deck = createDeck({ items: [], adapters: {}, range: [0, 3_600_000] });
          const run = (on) => {
            if (on) { grid.clock.play(); deck.play(); } else { grid.clock.stop(); deck.pause(); deck.seek(0); }
          };
          // the gate drives this facade, so a key from outside the slide moves nothing
          const gate = slideCommand({ play: () => run(true), pause: () => run(false), seek: () => {} },
            () => host.closest('.sl-frame'));
          const bar = createTransportBar(el('div'), deck, {

            pattern: PATTERN };
          return { start() { run(true); }, stop() { run(false); } };
        } }, { host: box, full: true });
      const a = el('a', '', 'positron.studio/tom/', { href: 'https://positron.studio/tom/' });

  slideBlock('READOUT ON A SLIDE',

  /* Time on a slide: a strip and a transport bar, fed by this tab alone from a deck
     with its own marks, playing only between slidesOpen() and slidesClose().
     See lessons/page-kit-slides.md#kit-slides-28 */

  /* Timeline on a slide (HANDOFF.md:133-135): one beat every 500 ms handed on three
     ways (deck, timer, frame), coloured as demo/time/beat.mjs. Sized off the slot,
     not fitBox, because the strip measures its transformed rect and would double-scale.
     See lessons/page-kit-slides.md#kit-slides-29 */
  const BEAT_MS = 500, BEATS = 16, TL_SPAN = BEAT_MS * BEATS;
  slideBlock('TIMELINE ON A SLIDE',
    'A strip on a deck of this tab’s own, the playhead running while the tab is open: one beat '
    + 'every 500 ms handed on three ways, each mark coloured by how late it landed, grey until it '
    + 'has. The canvas is the slot’s width and the lanes share its height.',
    `slot: (host) => createStripView(host, deck, { size: 'auto', follow: false, lanes: [{ id: 'deck', latch: true, colorOfRow }, ...] })`,
    // a no-break space holds the figure to its unit
    { name: 'timeline', say: 'Beats land *1.8\u00a0ms* apart',
      slot: (host) => {
        const tok = (n, f) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || f;
        const OK = tok('--ok', '#8fd6a8'), WARN = tok('--warn', '#e0b060'), BAD = tok('--bad', '#e0908a');
        const NOT_YET = '#3b424e', SWATCH = tok('--dim', '#9aa3b2');
        const band = (ms) => (Math.abs(ms) < 5 ? OK : Math.abs(ms) < 20 ? WARN : BAD);
        const driftOf = new Map(), hopOf = new Map(), chainOf = new Map();
        const at0 = (r) => Math.round(r.at);
        const { adapter } = markAdapter({ rates: [1], onFire: (_p, ev) => {
          // the frame lane: the deck's beat, painted on the next frame after it fired
          const at = Math.round(ev?.at ?? -1), t = performance.now();
          requestAnimationFrame(() => hopOf.set(at, performance.now() - t));
        } });
        const items = Array.from({ length: BEATS }, (_, i) => ({ id: `tl${i}`, kind: 'mark', at: i * BEAT_MS + BEAT_MS / 2, payload: { i } }));
        const deck = createDeck({ items, adapters: { mark: adapter }, range: [0, TL_SPAN],
          onDrift: (rows) => { for (const r of rows) if (r.deltaMs != null) driftOf.set(Math.round(r.at), r.deltaMs); } });
        const late = {
          deck: (r) => driftOf.get(at0(r)),
          timer: (r) => chainOf.get(at0(r)),
          frame: (r) => (hopOf.has(at0(r)) ? (driftOf.get(at0(r)) ?? 0) + hopOf.get(at0(r)) : undefined),
        };
        const LANES = [['deck', 'deck'], ['timer', 'timer'], ['frame', 'frame']];
        let laneH = 24;
        const spec = ([id, label]) => ({
          id, kind: 'mark', label, height: laneH, width: 2, latch: true, color: SWATCH, terse: true,
          colorOfRow: (r, fired) => { const m = late[id](r); return !fired || m === undefined ? NOT_YET : band(m); },
          describeRow: (r) => { const m = late[id](r); return m === undefined ? 'not landed yet' : `${Math.abs(m).toFixed(2)} ms ${m < 0 ? 'early' : 'late'}`; },
        });
        const view = createStripView(host, deck, { size: 'auto', follow: false, minHeight: 1, lanes: LANES.map(spec) });
        let lastW = 0;
        const sizeLanes = () => {
          const h = host.clientHeight, w = host.clientWidth;
          if (!h || !w) return;
          const axis = view.strip.state.axisH ?? 20;
          // the canvas's own 1 px edge top and bottom comes out of the slot too
          const lh = Math.max(6, Math.floor((h - axis - 4) / LANES.length));
          if (lh === laneH && w === lastW) return;
          laneH = lh; lastW = w;
          view.strip.setLanes(LANES.map(spec));
          view.strip.fit();
        };
        new ResizeObserver(sizeLanes).observe(host);

        /* the timer lane: armed for the first beat ahead, then re-armed BEAT_MS
           from whenever the last one fired, never corrected, which is the
           mistake a deck exists to avoid */
        let chainId = 0;
        const chainFrom = (pos) => {
          clearTimeout(chainId);
          const wall0 = performance.now() - pos;
          let i = items.findIndex((it) => it.at > pos);
          if (i < 0) return;
          const tick = () => {
            chainOf.set(items[i].at, performance.now() - (wall0 + items[i].at));
            if (++i < items.length) chainId = setTimeout(tick, BEAT_MS);
          };
          chainId = setTimeout(tick, items[i].at - pos);
        };
        // round and round while the tab is open: back to the top past the last beat
        const lap = looped(() => {
          if (deck.position() < TL_SPAN - 1) return;
          driftOf.clear(); hopOf.clear(); chainOf.clear();
          deck.seek(0);
          chainFrom(0);
        });
        slideKit.comps.timeline = { view, deck, late, items, chainOf, driftOf, hopOf, NOT_YET, lanes: LANES.map(([id]) => id),
          chainRunning: () => !!chainId, slot: host };
        return {
          start() { deck.play(); chainFrom(deck.position()); lap.start(); },
          stop() { lap.stop(); clearTimeout(chainId); chainId = 0; deck.pause(); },
        };
      },
      cap: 'a beat every 500 ms here, coloured by how late it landed' });

  /* Transport bar on a slide: publish: false, fitBox at 560 logical px, no strip
     (it would draw in the wrong pixels when scaled), keys via slideCommand.
     See lessons/page-kit-slides.md#kit-slides-30 */
  slideBlock('TRANSPORT BAR ON A SLIDE',
    'The kit’s transport bar on a deck of this tab’s own, scaled to its slot. A key pressed inside '
    + 'the slide drives this bar and no other; a key from the rest of the page, Space included, '
    + 'moves nothing here.',
    `const { command } = slideCommand(deck, () => host.closest('.sl-frame'));
createTransportBar(fitBox(host, 560).inner, deck, { publish: false, command })`,
    { name: 'bar', say: 'A key belongs to the bar it was pressed on',
      slot: (host) => {
        const fb = fitBox(host, 560);
        const { adapter } = markAdapter({ rates: [0.5, 1, 2] });
        const items = Array.from({ length: 12 }, (_, i) => ({ id: `sb${i}`, kind: 'mark', at: (i + 0.5) * 2000, payload: { i } }));
        const deck = createDeck({ items, adapters: { mark: adapter }, range: [0, 24_000] });
        const gate = slideCommand(deck, () => host.closest('.sl-frame'));
        const bar = createTransportBar(fb.inner, deck, { publish: false, command: gate.command });
        slideKit.comps.bar = { bar, deck, fb, refused: gate.refused };
        return {
          start() {},
          // leaving the tab stops it, past the gate: nobody's key is involved
          stop() { if (deck.playing()) deck.pause(); },
        };
      },
      cap: 'a key from the page moves nothing here' });

  /* FAU on a slide: a picture of /fau/'s instrument (code box, knobs, two octaves, plate),
     no libfaust or audio. 25 keys at 44 px scroll sideways rather than shrink, and
     letters: false binds nothing on window.
     See lessons/page-kit-slides.md#kit-slides-31 */
  section('FAU ON A SLIDE',
    'The FAU instrument at slide scale on the darker side of a split: its program, its knobs, two '
    + 'octaves of keys running wider than the column and scrolling inside the panel, and its plate. '
    + 'A picture: a press lights a key, nothing compiles and nothing sounds here.',
    `slot: (host) => { const fb = fitBox(host, 420); fb.inner.append(createInstrumentPanel({ viz: code.el, keys: keys.el, plate: { name: 'FAU' } }).el) }`,
    (box) => {
      box.classList.add('kit-sl');
      const s = createSlide({ name: 'fau', layout: 'split', side: 'right',
        say: 'Faust is compiled in the page and played', text: 'the program, its knobs and two octaves of keys',
        cap: 'a picture, it plays at',
        slot: (host) => {
          const fb = fitBox(host, 420);
          const book = createHueBook();
          // `/fau/`'s Organ preset, cut to the lines a slide can hold
          const code = createCodeBox({
            language: 'faust', rows: 7, hues: book, label: '',
            ariaLabel: 'a Faust program, shown and not compiled',
            value: 'import("stdfaust.lib");\n'
              + 'freq = hslider("freq", 440, 40, 8000, 0.01);\n'
              + 'gate = button("gate");\n'
              + 'oct = hslider("oct", 0.5, 0, 0.6, 0.01);\n'
              + 'rel = hslider("rel[scale:log]", 0.35, 0.02, 3, 0.01);\n'
              + 'tone = os.osc(freq) + oct * os.osc(freq * 2);\n'
              + 'process = tone * en.adsr(0.005, 0.12, 0.7, rel, gate) * 0.2 <: _, _;',
          });
          const knobs = createParamKnobs({ onChange: () => {} });
          knobs.set([
            { name: 'oct', value: 0.5, min: 0, max: 0.6 },
            { name: 'rel', value: 0.35, min: 0.02, max: 3, warp: 'exp' },
          ]);
          book.assign(['oct', 'rel']);
          for (const n of knobs.names()) knobs.knob(n).el.style.setProperty('--param-hue', String(book.hueOf(n)));
          let told = false, presses = 0;
          const keys = createKeyboard(el('div'), {
            ...keyRange(24), base: 48, letters: false, chord: false,
            onDown: (n) => {
              keys.lightNote(n, true);
              presses++;
              if (!told) { told = true; d.log('FAU ON A SLIDE is a picture, the instrument plays at https://positron.studio/fau/'); }
            },
            onUp: (n) => keys.lightNote(n, false),
          });
          keys.el.style.setProperty('--k-min', '44px');
          const panel = createInstrumentPanel({ viz: code.el, keys: keys.el, plate: { name: 'FAU' } });
          panel.addRow(knobs.el);
          panel.el.classList.add('kit-sl-fill');
          fb.inner.append(panel.el);
          slideKit.comps.fau = { panel, code, knobs, keys, fb, column: host, presses: () => presses };
          return null;
        } }, { host: box, full: true });
      const a = el('a', '', 'positron.studio/fau/', { href: 'https://positron.studio/fau/' });
      s.parts.cap.append(' ', a);
      slideKit.blocks.push({ title: 'FAU ON A SLIDE', s });
      slideKit.specs.push(s.spec);
    });

  /* The part runs while the page is seen: the visit opens it, hiding the page closes
     it, showing it again reopens it.
     See lessons/page-kit-slides.md#kit-slides-32 */
  slidesOpen();
  document.addEventListener('visibilitychange', () => (document.hidden ? slidesClose() : slidesOpen()));

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* What a machine can say about this page. Every check is behind ?selfcheck=1 and
     copied from demo/kit/index.html with its indent. They run after a frame,
     because getBoundingClientRect before the first paint measures an unarranged page.
     See lessons/page-kit-slides.md#kit-slides-33 */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();


  /**
   * Keys from the page reach neither the slides' bar nor keys. Before d.ready(), in
   * pairs that undo each other on any published bar. Four refusals prove the gate
   * heard every key and said no, rather than never hearing them.
   * See lessons/page-kit-slides.md#kit-slides-34
   */
  if (SELFCHECK && slideKit.comps.bar && slideKit.comps.fau) {
    const { bar, deck: sbDeck, refused } = slideKit.comps.bar;
    const kb = slideKit.comps.fau.keys;
    const pub = window.__demo?.transport ?? null;
    const was = { pos: bar.api.position, playing: bar.api.playing, refused: refused() };
    const pubWas = pub ? { pos: pub.position, playing: pub.playing } : null;
    const notes = kb.notes().join();
    for (const k of [' ', 'ArrowRight', ' ', 'ArrowLeft']) {
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    }
    const lit = slideKit.comps.fau.panel.el.querySelectorAll('.k.down').length;
    const n = refused() - was.refused;
    d.assert('SLIDES: Space and the arrows from the page leave the slide’s bar and the FAU keys alone, and no slide claims __demo.transport',
      bar.api.position === was.pos && bar.api.playing === was.playing && !sbDeck.playing() && n === 4
        && lit === 0 && kb.notes().join() === notes
        // Nothing on this page publishes a bar, so no slide may take the playhead either.
        // See lessons/page-kit-slides.md#kit-slides-35
        && pub === null && window.__demo.transport === null,
      `the slide's bar ${was.pos.toFixed(0)} -> ${bar.api.position.toFixed(0)}, ${bar.api.playing ? 'PLAYING' : 'stopped'}, `
      + `${n} of 4 keys heard and refused; ${lit} FAU key(s) lit; the published bar `
      + `${pub ? `${pubWas.pos.toFixed(0)} -> ${pub.position.toFixed(0)} and ${pub.playing ? 'playing' : 'stopped'}, ${pub === bar.api ? 'the SLIDE’S' : 'its own'}` : 'none, and this page publishes none'}`);
  }
  } // if (SELFCHECK)

  d.ready();


  /**
   * The slides checks run after d.ready(), each step asserting as it lands, no wait
   * longer than the harness's 2 s of tolerated silence. Behind ?selfcheck=1.
   * See lessons/page-kit-slides.md#kit-slides-36
   */
  if (SELFCHECK) {
    slideChecks()
      .catch((e) => d.assert('SLIDES: the checks ran to the end', false, `${e.message}`));
  }


  /**
   * The slides part's checks: after ready, each step asserting as it lands and no wait
   * over the harness's 2 s of silence. Behind ?selfcheck=1: they press a slider, turn
   * a knob and step the player.
   * See lessons/page-kit-slides.md#kit-slides-37
   */
  async function slideChecks() {
    const nap = (ms) => new Promise((r) => setTimeout(r, ms));
    const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    const resBefore = performance.getEntriesByType('resource').length;
    // The visit opened the part, so the screen code was asked for once, by slidesOpen()
    // See lessons/page-kit-slides.md#kit-slides-38
    const partsAtVisit = hw.partsFetched;
    await document.fonts.ready;
    await frames(3);
    const blocks = slideKit.blocks;
    // the static slides and the one slide each player is showing; the others
    // are hidden on purpose and have no box to measure
    const all = [...blocks.map((b) => b.s), ...[slideKit.player, ...slideKit.halves].flatMap((p) => p.slides.filter((s) => !s.el.hidden))];
    const tol = (a, b, e) => Math.abs(a - b) <= e;

    // ── the face ──────────────────────────────────────────────────────────
    const faced = document.fonts.check(`600 20px 'Slide JetBrains Mono'`) && document.fonts.check(`400 20px 'Slide JetBrains Mono'`);
    const famOf = getComputedStyle(blocks[0].s.el).fontFamily;
    d.assert('SLIDES: the face is JetBrains Mono, both weights loaded from this origin',
      faced && /Slide JetBrains Mono/.test(famOf),
      `${faced ? 'both weights loaded' : 'NOT loaded'}, the slide asks for ${famOf.split(',')[0]}`);

    // ── each step alone ──────────────────────────────────────────────────
    for (const n of [6, 5, 4, 3, 2, 1]) {
      const b = blocks.find((x) => x.title === `STEP ${n}`);
      const line = b?.s.parts.lines[0];
      if (!line) { d.assert(`SLIDES: STEP ${n} has its line`, false, 'no line'); continue; }
      const h = b.s.el.clientHeight;
      const { size, lh, ls } = stepOf(n);
      const want = size / 100 * h;
      const cs = getComputedStyle(line);
      const got = parseFloat(cs.fontSize), gotLh = parseFloat(cs.lineHeight), gotLs = parseFloat(cs.letterSpacing) || 0;
      d.assert(`SLIDES: STEP ${n} computes its token, size, line height and tracking`,
        h > 0 && tol(got, want, 0.5) && tol(gotLh, lh * want, 0.5) && tol(gotLs, ls * want, 0.05)
          && b.s.parts.cap.textContent === stepCaption(n),
        `${got.toFixed(2)} px against ${want.toFixed(2)} (${size.toFixed(2)} per cent of ${h} px), `
        + `line ${gotLh.toFixed(2)} against ${(lh * want).toFixed(2)}, tracking ${gotLs.toFixed(3)} against ${(ls * want).toFixed(3)}`);
    }

    // ── the scale on one slide ───────────────────────────────────────────
    {
      const b = blocks.find((x) => x.title === 'THE SCALE');
      const ls = [...b.s.el.querySelectorAll('.sl-line')];
      const steps = ls.map((l) => +l.dataset.step);
      const sizes = ls.map((l) => parseFloat(getComputedStyle(l).fontSize));
      const ratios = sizes.slice(1).map((s, i) => sizes[i] / s);
      d.assert('SLIDES: THE SCALE shows all six steps, largest first, each 1.5 times the next',
        steps.join() === '6,5,4,3,2,1' && ratios.every((r) => tol(r, SCALE.ratio, 0.02)),
        `steps ${steps.join(' ')} at ${sizes.map((s) => s.toFixed(1)).join(', ')} px`);
    }

    // ── every slide ──────────────────────────────────────────────────────
    const geo = all.map((s) => {
      const r = s.el.getBoundingClientRect();
      const inn = s.el.querySelector('.sl-in');
      const ir = inn.getBoundingClientRect(), ics = getComputedStyle(inn);
      const bottom = ir.bottom - parseFloat(ics.paddingBottom);
      // the caption sits under the words: on the inset's left edge, or in a split with
      // its slot on the left, on the words column's left edge
      // See lessons/page-kit-slides.md#kit-slides-39
      const words = s.el.querySelector('.sl-words');
      const left = s.spec.layout === 'split' && s.spec.side === 'left' && words
        ? words.getBoundingClientRect().left : ir.left + parseFloat(ics.paddingLeft);
      const cap = s.parts.cap?.getBoundingClientRect();
      const texts = [...s.el.querySelectorAll('.sl-t')].filter((t) => t.getClientRects().length);
      const out = texts.filter((t) => {
        const tr = t.getBoundingClientRect();
        return tr.left < ir.left - 1 || tr.right > ir.right + 1 || tr.top < ir.top - 1 || tr.bottom > ir.bottom + 1;
      });
      const spill = inn.scrollHeight > inn.clientHeight + 1 || inn.scrollWidth > inn.clientWidth + 1;
      return { name: s.spec.name, w: s.el.clientWidth, h: s.el.clientHeight, r, left, bottom, cap, out, spill };
    });
    const shown = geo.filter((g) => g.w > 0);
    const notWide = shown.filter((g) => !tol(g.h, g.w * 9 / 16, 1));
    d.assert('SLIDES: every slide is 16:9',
      shown.length === all.length && notWide.length === 0,
      `${shown.length} of ${all.length} laid out, ${notWide.length ? `off: ${notWide.map((g) => `${g.name} ${g.w}x${g.h}`).join(', ')}` : `the first ${shown[0]?.w}x${shown[0]?.h}`}`);
    const caps = geo.filter((g) => g.cap && g.w);
    const offCap = caps.filter((g) => !tol(g.cap.left, g.left, 1) || !tol(g.cap.bottom, g.bottom, 1));
    d.assert('SLIDES: every caption sits bottom left under its words, never across a split',
      caps.length >= 10 && offCap.length === 0,
      `${caps.length} captions, ${offCap.length ? `off: ${offCap.map((g) => `${g.name} ${(g.cap.left - g.left).toFixed(1)},${(g.cap.bottom - g.bottom).toFixed(1)}`).join('; ')}` : 'all within 1 px'}`);
    const spilt = geo.filter((g) => g.spill || g.out.length);
    d.assert('SLIDES: nothing spills past the inset on any slide',
      spilt.length === 0,
      spilt.length ? spilt.map((g) => `${g.name}${g.spill ? ' overflows' : ''}${g.out.length ? ` ${g.out.length} text past the edge` : ''}`).join('; ')
        : `${geo.length} slides, every text box inside its inset`);

    // ── layouts ──────────────────────────────────────────────────────────
    const splits = all.filter((s) => s.spec.layout === 'split');
    const wrong = splits.filter((s) => {
      const mid = (e) => { const b = e.getBoundingClientRect(); return (b.left + b.right) / 2; };
      const sl = mid(s.parts.slot), wd = mid(s.parts.words);
      return s.spec.side === 'left' ? !(sl < wd) : !(sl > wd);
    });
    d.assert('SLIDES: a split puts its slot on the side it declares and the words on the other',
      // floors follow the blocks the owner keeps removing: at least two splits, one each way
      splits.length >= 2 && splits.some((s) => s.spec.side === 'left') && splits.some((s) => s.spec.side === 'right') && wrong.length === 0,
      `${splits.length} splits, ${splits.filter((s) => s.spec.side === 'left').length} slot left, `
      + `${wrong.length ? `wrong: ${wrong.map((s) => s.spec.name).join(', ')}` : 'every one on its side'}`);
    {
      const edge = (name, side) => {
        const s = all.find((x) => x.spec.name === name);
        const ir = s.el.querySelector('.sl-in').getBoundingClientRect(), ics = getComputedStyle(s.el.querySelector('.sl-in'));
        const ev = [...s.parts.ev.children].map((c) => c.getBoundingClientRect());
        return side === 'left' ? Math.min(...ev.map((b) => b.left)) - (ir.left + parseFloat(ics.paddingLeft))
          : (ir.right - parseFloat(ics.paddingRight)) - Math.max(...ev.map((b) => b.right));
      };
      const top = all.find((x) => x.spec.name === 'refusals');
      const tb = top.parts.text.getBoundingClientRect(), cb = top.parts.ev.getBoundingClientRect();
      // there is no right layout
      // See lessons/page-kit-slides.md#kit-slides-40
      const l = edge('stand-ins', 'left');
      d.assert('SLIDES: left and top layouts put the evidence on their edge',
        tol(l, 0, 1) && tol(tb.bottom, cb.bottom, 1),
        `left ${l.toFixed(1)} px off its edge, the top layout's words end ${(cb.bottom - tb.bottom).toFixed(1)} px above the region's foot`);
    }

    // ── words ────────────────────────────────────────────────────────────
    const says = slideKit.specs.filter((s) => s.say);
    const badSay = says.filter((s) => lintWords(s.say).length);
    const his = [...document.querySelectorAll('.kit-sl .sl-hi')];
    const hues = [...document.querySelectorAll('.kit-sl .sl-hue')];
    const fg = getComputedStyle(blocks[0].s.el).color;
    d.assert('SLIDES: every headline is one sentence with no colon, semicolon, dash, middot or full stop, and the marks paint',
      badSay.length === 0 && says.length >= 20 && his.length >= 5 && his.every((h) => getComputedStyle(h).color !== fg) && hues.length >= 3 && hues.every((h) => getComputedStyle(h).color !== fg),
      `${says.length} headlines${badSay.length ? `, failing: ${badSay.map((s) => `${plain(s.say)} (${lintWords(s.say).join(', ')})`).join('; ')}` : ''}, `
      + `${his.length} accents, ${hues.length} hued words off the ink`);

    // ── the player ───────────────────────────────────────────────────────
    {
      const p = slideKit.player;
      p.go(0);
      let leaked = 0;
      const spy = () => { leaked++; };
      window.addEventListener('keydown', spy);
      const key = (target, k) => target.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
      // two slides: right to the second, Home back, space forward again, and right at
      // the end stays there
      // See lessons/page-kit-slides.md#kit-slides-41
      key(p.el, 'ArrowRight'); const a = p.at();
      key(p.el, 'Home'); const e0 = p.at();
      key(p.el, ' '); const b = p.at();
      key(p.el, 'ArrowRight'); const c = p.at();
      key(p.el, 'Home');
      key(document.body, 'PageDown'); const body = p.at();
      window.removeEventListener('keydown', spy);
      p.panel.el.querySelector('.step button:last-child')?.click();
      const btn = p.at();
      p.go(0);
      d.assert('SLIDES: the player steps on its own keys, clamps at the end, and no key it uses leaves its panel',
        p.slides.length === 2 && a === 1 && e0 === 0 && b === 1 && c === 1 && body === 0 && btn === 1 && leaked === 1 && p.keys() === 5,
        `${p.slides.length} slides, right ${a}, Home ${e0}, space ${b}, right at the end ${c}, a key from the page leaves it at ${body}, `
        + `the next button ${btn}; ${leaked} key(s) reached window (the page's own), ${p.keys()} heard`);
      const r = p.slides[0].el.getBoundingClientRect();
      d.assert('SLIDES: the player’s slide fills its stage at 16:9',
        tol(r.height, r.width * 9 / 16, 1) && tol(r.width, p.panel.stage.clientWidth, 1),
        `${r.width.toFixed(1)} x ${r.height.toFixed(1)} in a ${p.panel.stage.clientWidth} px stage`);

      // A tap steps it in full screen on a screen with no hover: the page cannot emulate
      // (hover: none), so touchMode takes the phone's code path; shot.mjs grades the query.
      // See lessons/page-kit-slides.md#kit-slides-42
      p.go(0);
      const sr = () => p.panel.stage.getBoundingClientRect();
      const tap = (fx) => { const b = sr(); p.slides[p.at()].el.dispatchEvent(new MouseEvent('click', { clientX: b.left + fx * b.width, clientY: b.top + b.height / 2, bubbles: true, cancelable: true })); return p.at(); };
      const t0 = p.taps();
      p.touchMode(() => true);
      const flat = tap(5 / 6);                  // not full: a press is a press
      await p.panel.full(true);
      await frames(6);
      const full = p.panel.isFull();
      const fwd = tap(5 / 6), mid = tap(1 / 2), back = tap(1 / 6);
      p.touchMode(() => false);
      const desk = tap(5 / 6);                  // full, but a screen with hover
      p.touchMode(() => typeof matchMedia === 'function' && matchMedia('(hover: none)').matches);
      await p.panel.full(false);
      if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
      await frames(6);
      d.assert('SLIDES: in full screen on a touch screen a tap on the right third steps forward and the left third back, the middle and a desk do nothing',
        full && flat === 0 && fwd === 1 && mid === 1 && back === 0 && desk === 0 && p.taps() - t0 === 2 && !p.panel.isFull(),
        `${full ? 'full' : 'NOT full'}; not full ${flat}, right ${fwd}, middle ${mid}, left ${back}, with hover ${desk}; `
        + `${p.taps() - t0} taps stepped, ${p.panel.isFull() ? 'STILL full' : 'out again'}`);
      p.go(0);
    }

    // ── the ⛶ on a touch screen, top right ────────────────────────────────
    {
      // The rule, read off the slide's stylesheet since no harness can match (hover: none):
      // both corners declared, the touch one in a media block after the plain rule of the
      // same weight, so order wins.
      // See lessons/page-kit-slides.md#kit-slides-43

        // leaving the top never stacks its rule under the header's
        const dprL = devicePixelRatio || 1;
        ruleW = Math.max(1 / dprL, Math.floor(Math.max(1, 0.004 * T.log.el.closest('.sl').clientHeight) * dprL) / dprL);
        ruled = vis.slice(0, -1).every((r) => tol(parseFloat(getComputedStyle(r).borderBottomWidth), ruleW, 0.5))
          && vis.every((r) => parseFloat(getComputedStyle(r).borderTopWidth) === 0)
          && parseFloat(getComputedStyle(vis.at(-1)).borderBottomWidth) === 0;

        await frames(1);
      }
      d.assert('SLIDES: the newest row is at the foot of each log, and the tabular log’s decimal points align within 0.5 px under its row lines',
        tol(lastRow.bottom, body.bottom, 1) && !!lastLine && lastLine.bottom <= logBox.bottom + 0.5 && lastLine.bottom > logBox.bottom - 2 * lastLine.height
          && vis.length >= 3 && col.dots.length === 2 && col.worst <= 0.5 && ruled,
        `the last row ends ${(body.bottom - lastRow.bottom).toFixed(1)} px from the table's foot, the last line ${(logBox.bottom - (lastLine?.bottom ?? 0)).toFixed(1)} px from the log's, `
        + `${vis.length} rows in view, decimal spread ${col.dots.map((x) => x.toFixed(2)).join(' and ')} px, ${ruled ? 'every one ruled' : 'a rule missing'}`);
    }

    // ── full screen, on every static slide ──────────────────────────────
    {
      const noHover = matchMedia('(hover: none)').matches;
      const btns = blocks.map((b) => b.s.fullBtn);
      const op = (b) => parseFloat(getComputedStyle(b).opacity);
      const missing = blocks.filter((b) => !b.s.fullBtn).map((b) => b.title);
      // nobody's pointer is on a slide under the harness, so each reads as it does at rest
      const rest = btns.filter(Boolean).map(op);
      const target = blocks.find((b) => b.s.spec.name === 'stand-ins').s;
      target.fullBtn.focus({ preventScroll: true });
      await frames(10);   // past the 140 ms fade
      const focused = op(target.fullBtn), focusedPe = getComputedStyle(target.fullBtn).pointerEvents;
      target.fullBtn.blur();
      d.assert('SLIDES: every static slide has its ⛶, hidden at rest and shown when the slide holds focus',
        missing.length === 0 && btns.length >= 20 && rest.every((o) => o === (noHover ? 1 : 0)) && focused === 1 && focusedPe === 'auto'
          && btns.every((b) => b.textContent.includes('⛶') && b.classList.contains('ico')),
        `${btns.length} slides${missing.length ? `, missing on ${missing.join(', ')}` : ''}, at rest ${[...new Set(rest)].join('/')} opacity`
        + `${noHover ? ' (a screen with no hover shows it always)' : ''}, focused ${focused} and ${focusedPe}`);

      const was = target.el.getBoundingClientRect();
      const say = target.parts.say;
      target.fullBtn.click();
      await frames(10);
      const fr = target.frame, fcs = getComputedStyle(fr), r = target.el.getBoundingClientRect(), scs = getComputedStyle(target.el);
      const vw = fr.clientWidth, vh = fr.clientHeight;
      // the screen's edge is the border: the slide fits the screen, no edge drawn
      const wantW = Math.min(vw, vh * 16 / 9);
      const card = getComputedStyle(document.documentElement).getPropertyValue('--card').trim();
      const probe = document.createElement('div'); probe.style.background = card; document.body.append(probe);
      const cardRgb = getComputedStyle(probe).backgroundColor; probe.remove();
      const sayPx = parseFloat(getComputedStyle(say).fontSize), sayWant = stepOf(4).size / 100 * target.el.clientHeight;
      const rootR = getComputedStyle(document.documentElement).getPropertyValue('--r').trim();
      const centred = tol(r.left + r.width / 2, fr.getBoundingClientRect().left + vw / 2, 1) && tol(r.top + r.height / 2, fr.getBoundingClientRect().top + vh / 2, 1);
      d.assert('SLIDES: the ⛶ fills the screen with the slide’s ground, the slide 16:9 and centred with no edge of its own, type at its step',
        target.isFull() && vw >= innerWidth - 1 && tol(r.width, wantW, 1.5) && tol(r.height, r.width * 9 / 16, 1.5) && centred
          && fcs.backgroundColor === cardRgb && parseFloat(scs.borderTopWidth) === 0
          && tol(sayPx, sayWant, 0.5),
        `${target.isFull() ? 'full' : 'NOT full'} on a ${vw}x${vh} screen, the slide ${r.width.toFixed(1)}x${r.height.toFixed(1)} ${centred ? 'centred' : 'OFF CENTRE'}`
        + `ground ${fcs.backgroundColor} against the card ${cardRgb}, edge ${scs.borderTopWidth} radius ${scs.borderTopLeftRadius} against --r ${rootR}, `
        + `headline ${sayPx.toFixed(2)} px against ${sayWant.toFixed(2)} (step 4 of ${target.el.clientHeight} px)`);
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
      await frames(6);
      const back = target.el.getBoundingClientRect();
      d.assert('SLIDES: Escape gives the screen back and the slide its place in the block',
        !target.isFull() && tol(back.width, was.width, 0.5) && tol(back.height, was.height, 0.5)
          && !document.documentElement.classList.contains('pos-faux-host'),
        `${target.isFull() ? 'STILL full' : 'out'}, ${back.width.toFixed(1)}x${back.height.toFixed(1)} against ${was.width.toFixed(1)}x${was.height.toFixed(1)} before`);
    }

    // ── the diagram's lines on a slide ───────────────────────────────────
    {
      const dg = C.diagram;
      const sl = dg.subject().closest('.sl');
      const edge = parseFloat(getComputedStyle(sl).getPropertyValue('--sl-dg-edge'));
      const link = parseFloat(getComputedStyle(sl).getPropertyValue('--sl-dg-link'));
      const air = parseFloat(getComputedStyle(sl).getPropertyValue('--sl-dg-air'));
      const boxesEls = [...dg.subject().querySelectorAll('.pos-dg-box')];
      const links = [...dg.subject().querySelectorAll('.pos-dg-link')];
      const wrongBox = boxesEls.filter((b) => parseFloat(getComputedStyle(b).strokeWidth) !== edge);
      const wrongLink = links.filter((l) => parseFloat(getComputedStyle(l).strokeWidth) !== link);
      const hued = boxesEls.filter((b) => getComputedStyle(b).stroke !== getComputedStyle(boxesEls[0]).stroke).length;
      // the clearance between a name and the inside of its box's edge, in the
      // diagram's own logical px: the screen distance over the fit's scale
      const fitIn = dg.subject().closest('.sl-fit-in');
      const k = parseFloat(fitIn.style.getPropertyValue('--fit-k')) || 1;
      const inkCv = document.createElement('canvas').getContext('2d');
      const clear = [...dg.subject().querySelectorAll('.pos-dg-n')].map((g) => {
        const box = g.querySelector('.pos-dg-box'), lab = g.querySelector('.pos-dg-lab');
        if (!box || !lab) return Infinity;
        const b = box.getBoundingClientRect(), t = lab.getBoundingClientRect();
        const inner = edge / 2 * k;
        // The top is the ink's, not the font box's: a text rect starts at the face's ascent,
        // which differs by font file, so the ink top is placed by the canvas's own measure.
        // See lessons/page-kit-slides.md#kit-slides-49
        const cs = getComputedStyle(lab);
        inkCv.font = `${cs.fontWeight} 100px ${cs.fontFamily}`;
        const im = inkCv.measureText(lab.textContent || 'H');
        const fh = im.fontBoundingBoxAscent + im.fontBoundingBoxDescent;
        const inkTop = t.top + (im.fontBoundingBoxAscent - im.actualBoundingBoxAscent) / fh * t.height;
        return Math.min(t.left - (b.left + inner), inkTop - (b.top + inner), (b.right - inner) - t.right) / k;
      }).filter(Number.isFinite);
      const least = Math.min(...clear);
      d.assert('SLIDES: a diagram on a slide draws its edges and arrows at the slide width and keeps the declared air inside every box',
        edge === 1.5 && link === 1.5 && boxesEls.length >= 6 && links.length >= 2 && !wrongBox.length && !wrongLink.length
          && hued >= 1 && clear.length >= 6 && least >= air,
        `${boxesEls.length} edges at ${edge} px (${wrongBox.length} not), ${links.length} arrows at ${link} px (${wrongLink.length} not), `
        + `${hued} edges keep a hue of their own, the tightest name ${least.toFixed(1)} logical px inside its edge against ${air}`);
    }

    // ── the time work on a slide: a strip, a bar, and FAU ────────────────
    {
      const T = C.timeline;
      const cv = T.view.el;
      const ink = () => countInk(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data);
      const p0 = T.view.strip.state.pos, d0 = T.deck.position();
      await nap(400);
      await frames(2);
      const p1 = T.view.strip.state.pos, d1 = T.deck.position();
      const lit = ink();
      // a playhead that wrapped in the wait is still a playhead that moved
      const moved = T.deck.playing() && (p1 > p0 + 100 || p1 < p0 - TL_SPAN / 2) && d1 !== d0;
      d.assert('SLIDES: the strip on a slide draws ink and its playhead runs while the tab is open',
        lit > 0 && moved,
        `${lit} lit samples, the playhead ${p0.toFixed(0)} -> ${p1.toFixed(0)} ms over 0.4 s, the deck ${T.deck.playing() ? 'playing' : 'STOPPED'}`);
      // every mark the playhead has passed and that has landed takes a band; the rest are grey
      const pos = T.deck.position();
      const lanes = T.view.strip.lanes();
      let landed = 0, greyAhead = 0, ahead = 0, wrong = 0;
      const bands = new Set();
      for (const L of lanes) {
        for (const r of T.items) {
          const c = L.colorOfRow(r, r.at <= pos), m = T.late[L.id](r);
          if (r.at > pos) { ahead++; if (c === T.NOT_YET) greyAhead++; else wrong++; continue; }
          if (m === undefined) { if (c !== T.NOT_YET) wrong++; continue; }
          landed++; bands.add(c);
          if (c === T.NOT_YET) wrong++;
        }
      }
      const cs = getComputedStyle(cv), slotH = T.slot.clientHeight;
      const lanesH = lanes.reduce((a, L) => a + L.height, 0);
      d.assert('SLIDES: the strip’s marks are grey until they land and take the colour of how late they landed, its lanes sharing the slot',
        lanes.length === 3 && landed >= 3 && wrong === 0 && greyAhead === ahead
          && tol(cv.getBoundingClientRect().width, T.slot.clientWidth, 1) && cv.getBoundingClientRect().height <= slotH + 0.5 && lanesH > slotH * 0.6,
        `${landed} landed in ${bands.size} colour(s), ${greyAhead} of ${ahead} ahead grey, ${wrong} wrong; `
        + `the canvas ${cv.getBoundingClientRect().width.toFixed(0)}x${parseFloat(cs.height).toFixed(0)} in a ${T.slot.clientWidth}x${slotH} slot, lanes ${lanesH} px`);
    }
    {
      const B = C.bar;
      await assertBar(d.assert, B.bar, { name: 'on a slide' });
      const pub = window.__demo?.transport;
      const pubWas = pub?.position;
      B.bar.api.el.dispatchEvent(new KeyboardEvent('keydown', { key: '2', bubbles: true, cancelable: true }));
      await nap(DRILL.keyMs);
      const want = B.bar.api.range[0] + 0.2 * (B.bar.api.range[1] - B.bar.api.range[0]);
      const pubNow = pub?.position;
      // No published bar on this page: the key moves the slide's bar and the bar still
      // does not claim the playhead.
      // See lessons/page-kit-slides.md#kit-slides-50
      d.assert('SLIDES: a key aimed at the slide’s bar moves it and it does not claim the page’s playhead',
        tol(B.bar.api.position, want, 1) && !pub && !window.__demo?.transport,
        `the slide's bar at ${B.bar.api.position.toFixed(0)} against ${want.toFixed(0)}, the published bar ${pubWas?.toFixed(0)} -> ${pubNow?.toFixed(0)}`);
    }
    {
      // full screen: the strip takes the slide's width and the bar is pressed through its scale
      const tl = blocks.find((b) => b.s.spec.name === 'timeline').s, bs = blocks.find((b) => b.s.spec.name === 'bar').s;
      const T = C.timeline, B = C.bar;
      const w0 = T.view.el.getBoundingClientRect().width;
      tl.fullBtn.click();
      await frames(10);
      const w1 = T.view.el.getBoundingClientRect().width, s1 = T.slot.getBoundingClientRect().width;
      const lanes1 = T.view.strip.lanes().reduce((a, L) => a + L.height, 0), slotH1 = T.slot.clientHeight;
      const full1 = tl.isFull();
      await tl.full(false);
      await frames(6);
      bs.fullBtn.click();
      await frames(10);
      const k = B.fb.k(), full2 = bs.isFull();
      const tg = B.bar.api.el.querySelector('.tbar-toggle');
      const at0 = B.bar.api.position;
      tg.click();
      await nap(350);
      const played = B.bar.api.playing && B.bar.api.position > at0;
      tg.click();
      await bs.full(false);
      await frames(6);
      d.assert('SLIDES: in full screen the strip spans the slide and splits its height, and the bar’s own button plays it',
        full1 && w1 > w0 + 50 && tol(w1, s1, 1) && lanes1 > slotH1 * 0.6 && full2 && k > 1 && played && !B.bar.api.playing,
        `the strip ${w0.toFixed(0)} -> ${w1.toFixed(0)} px in a ${s1.toFixed(0)} px slot with ${lanes1} of ${slotH1} px in lanes; `
        + `the bar drawn at ${k.toFixed(2)}x ${played ? 'played' : 'DID NOT PLAY'} from its toggle and stopped again`);
    }
    {
      const F = C.fau;
      const has = !!F.panel.el.contains(F.code.el) && !!F.panel.el.contains(F.knobs.el) && F.knobs.names().length === 2
        && !!F.panel.el.contains(F.keys.el) && /FAU/.test(F.panel.el.querySelector('.panel-plate')?.textContent || '');
      const row = F.keys.el.querySelector('.keys');
      const col = F.column.getBoundingClientRect();
      const keysWide = row.scrollWidth * F.fb.k();
      const sl = F.column.closest('.sl');
      const inn = sl.querySelector('.sl-in');
      const spill = inn.scrollWidth > inn.clientWidth + 1 || inn.scrollHeight > inn.clientHeight + 1;
      const pr = F.panel.el.getBoundingClientRect();
      const inCol = pr.left >= col.left - 1 && pr.right <= col.right + 1 && pr.top >= col.top - 1 && pr.bottom <= col.bottom + 1;
      d.assert('SLIDES: FAU on a slide has its program, two knobs, keys and FAU plate, the keys wider than the column and nothing else past it',
        has && keysWide > col.width && row.scrollWidth > row.clientWidth && !spill && inCol,
        `${has ? 'all four parts' : 'a part MISSING'}, keys ${keysWide.toFixed(0)} px of content in a ${col.width.toFixed(0)} px column, `
        + `scrolling ${row.scrollWidth} in ${row.clientWidth} logical px, the panel ${inCol ? 'inside' : 'OUTSIDE'} the column${spill ? ', the slide OVERFLOWS' : ''}`);
      // a pointer press on the first white key, which has to be on screen for the hit test
      const scrollWas = scrollY;
      sl.scrollIntoView({ block: 'center' });
      await frames(2);

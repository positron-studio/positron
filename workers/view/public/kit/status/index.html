<title>POSITRON kit/status</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<script type="module">
  import { mount, el, createReport } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { createPresence, PRESENCE_STATES } from '/shell/presence.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createKitPage } from '/shell/kit-page.mjs';

  /**
   * kit/status: one part of /kit/ on a page of its own (plans/plan-kit-split.md).
   * Blocks and checks are copied from demo/kit/index.html in its order, newest first;
   * every check is behind ?selfcheck=1.
   * See lessons/page-kit-status.md#kit-status-1
   */
  const { d, section, land, checkPage } = createKitPage({
    part: 'status',
    what: "Readout cells, logs, tables and badges that say how a page is doing.",
  });


  // The MIDI log specimen's own state, declared out here for the reason the
  // comment below gives: a block that moves must not leave its `const` behind.
  let kitMidi = [], kitMidiListed = 0, kitMidiLog = null;
  // The four specimen badges, by state, for the geometry asserts at the bottom.
  // Declared here, not in the block: a block that moves must not leave its const
  // behind, where section() would swallow the dead-zone throw into failed.
  // See lessons/page-kit-status.md#kit-status-2
  const presSpec = new Map();
  // Declared with the others, not inside the block, for the same reason.
  // See lessons/page-kit-status.md#kit-status-3
  const busySpec = new Map();
  let presLive = null;        // one badge that can change, measured over time
  // The arrangements of the readout and the log, for the geometry checks at the
  // bottom, declared up here for the same reason.
  // See lessons/page-kit-status.md#kit-status-4
  let joinedSpec = null;      // the default: a readout on top of a log, one surface
  let logOnlySpec = null;     // joined, with no readout declared
  let roOnlySpec = null;      // joined, with the log switched off
  let neitherSpec = null;     // joined, with neither — there is nothing to draw
  let splitSpec = null;       // the opt-out: two surfaces, the page between them
  // the two `.pos-body` stand-ins, held rather than queried: the gaps this
  // block grades are measured FROM them, and `querySelector` would find
  // whichever came first and grade the wrong arrangement
  let joinedPage = null, splitPage = null;
  let kitRoFlex = null, kitRoGrid = null;


  /**
   * Newest at the top. Nothing here is in a .pos-controls row, because both
   * harnesses press that row by position.
   * See lessons/page-kit-status.md#kit-status-5
   */
  /**
   * Newest at the top. Nothing here is in a .pos-controls row, because both
   * harnesses press that row by position.
   * See lessons/page-kit-status.md#kit-status-6
   */
  section('MIDI LOG',
    'What arrived on the wire, in columns, under the panel it moved. The raw bytes are a '
    + 'column of their own and are never replaced by the reading beside them, because a '
    + 'relative encoder reads as a position if all you have is an interpretation. A clock '
    + 'byte is counted and never listed.',
    `const log = createMidiLog({ empty: 'press Listen, then play something' })
log.add(decode(bytes))     // false if it was a flood and was not listed`,
    (box) => {
      box.classList.add('kit-wide');
      const log = createMidiLog({ empty: 'nothing has arrived yet' });
      box.append(log.el);
      // A known stream, so the specimen shows real readings. The last two are floods
      // (clock, active sensing) and must not be listed; the checks below read that back.
      // See lessons/page-kit-status.md#kit-status-7
      kitMidi = [[0x90, 60, 100], [0x80, 60, 0], [0xb0, 74, 64],
                 [0xe0, 0x00, 0x40], [0xb0, 80, 127], [0xf8], [0xfe]];
      kitMidiListed = kitMidi.filter((b) => log.add(decode(b))).length;
      kitMidiLog = log;
    });

  /* The words are an option: SAYS is network language, WIRED is for an instrument on
     a cable. The specimens keep SAYS, because they show the states, and the width
     check at the bottom is calibrated on the default phrases.
     See lessons/page-kit-status.md#kit-status-8 */
  section('PRESENCE',
    'Five states, and whether a person or a harness is holding it.',
    `createPresence({ of: 'the board' }).set('online')
createPresence({ of: 'the Circuit', says: WIRED })   // connected / connecting / not connected
createPresence({ of: 'Raspberry Pi', busyWords: { page: 'in use', tool: 'under test' } }).busy('tool')
createPresence({ of: 'the board', mode: 'dot', state: 'online' })
presenceOf({ now, lastSeenAt, everyMs: 5000 })   // -> one of the five`,
    (box) => {
      box.classList.add('kit-wide');
      const stack = createStack(undefined, 'kit-col');

      // can: [s] reserves room for this badge's own word only, so the row is evenly
      // spaced. A badge that can really change keeps the full reserve.
      // See lessons/page-kit-status.md#kit-status-9
      const states = el('div', 'kit-row');
      for (const s of PRESENCE_STATES) {
        const p = createPresence({ state: s, can: [s] });
        presSpec.set(s, p.el);
        states.append(p.el);
      }
      // One badge that CAN change, for the check at the bottom: the claim is
      // that a badge does not twitch as ITS OWN state moves, which is about one
      // badge over time and not about five badges side by side.
      presLive = createPresence({ state: 'online' });
      presLive.el.style.position = 'absolute';
      presLive.el.style.visibility = 'hidden';
      states.append(presLive.el);

      const busy = el('div', 'kit-row');
      for (const [kind, label] of [[null, 'nobody'], ['page', 'a person'], ['tool', 'a harness']]) {
        // Born in its state rather than switched into it: `busy()` fades over
        // 90 ms, and a fixed specimen has nothing to fade from.
        const p = createPresence({ of: 'Raspberry Pi', state: 'online', can: ['online'],
                                   busyWords: { page: 'in use', tool: 'under test' }, busy: kind });
        busySpec.set(label, p.el);
        busy.append(p.el);
      }

      /**
       * mode: 'dot': the ring alone, with the words clipped rather than removed, so the
       * accessible name stays the whole sentence and changes are still announced.
       * An inline box with no margins, so it drops into a button, key or row.
       * See lessons/page-kit-status.md#kit-status-10
       */
      const inButton = el('button', '', null, { type: 'button' });
      inButton.append(createPresence({ of: 'the board', mode: 'dot', state: 'online' }).el,
        document.createTextNode(' switch it on'));
      inButton.style.cssText = 'display:inline-flex;align-items:center;gap:7px';

      // In a readout key, where a page already prints what a machine is doing.
      const inReadout = el('div', 'pos-readout');
      for (const [k, v, u, st] of [['relay', '1', '/16', 'online'], ['board', '', 'ms', 'unknown']]) {
        const c = el('div', 'pos-cell');
        const key = el('div', 'pos-k');
        key.style.cssText = 'display:flex;align-items:center;gap:5px';
        key.append(createPresence({ of: k, mode: 'dot', state: st }).el, document.createTextNode(k));
        const val = el('span', 'pos-v', v || null);
        if (st === 'unknown') val.dataset.state = 'pending';
        if (u) val.append(el('span', 'pos-u', u));
        c.append(key, val); inReadout.append(c);
      }

      // A row of machines, which is the shape /knobs/, /grains/ and /able/ all
      // want and all draw differently today.
      const machines = el('div', '');
      machines.style.cssText = 'display:grid;gap:6px;font:400 12px/1 var(--mono);color:var(--dim)';
      for (const [name, st] of [['studio-1', 'online'], ['the board', 'coming'],
        ['the Mac', 'offline'], ['the headset', 'unknown']]) {
        const row = el('div', '');
        row.style.cssText = 'display:flex;align-items:center;gap:8px';
        row.append(createPresence({ of: name, mode: 'dot', state: st }).el, document.createTextNode(name));
        machines.append(row);
      }
      // The readout needs a width or its flex cells stack in a narrow box, so inside a
      // row of three specimens it takes a basis.
      // See lessons/page-kit-status.md#kit-status-11
      inReadout.style.flex = '1 1 300px';
      const dots = el('div', 'kit-row');
      // Top, not centre: three specimens of different heights centred on each
      // other reads as three things floating rather than three things in a row.
      dots.style.alignItems = 'flex-start';
      dots.append(inButton, inReadout, machines);

      // stack.titled, not a hand-rolled caption: the heading and what it labels are one
      // block, and the component owns both distances.
      // See lessons/page-kit-status.md#kit-status-12
      stack.titled('IS IT ANSWERING', states);
      stack.titled('AND HAS SOMEBODY ELSE GOT HOLD OF IT', busy);
      stack.titled('THE SAME BADGE AS A DOT, INSIDE SOMETHING ELSE', dots);
      box.append(stack.el);
    });

  section('READOUT AND LOG',
    'The numbers now and the record of what happened, glued into one surface at the foot of the page.',
    `mount({ readout: { sent: '/s', lost: '' } })                 // one surface at the foot, the default
mount({ readout: { sent: '/s', lost: '' }, joined: false })  // two surfaces, the opt-out
createReport({ readout, showLog: false })                    // the same pair, standalone
createReport({ readout, rows: 2, size: 'sm', joined: false }) // 1 x n, 2 x n. The count must be even
// size: 'sm' is a 15px value instead of 19. The KEY does not shrink with it`,
    (box) => {
      box.classList.add('kit-wide');

      // Joined: no joined flag, because it is the default. The opt-out is spelled out on
      // the split specimen below.
      // See lessons/page-kit-status.md#kit-status-13
      joinedSpec = createReport({ readout: { sent: '/s', lost: '' } });
      joinedSpec.set('sent', 48);
      joinedSpec.set('lost', 0, 'ok');
      // A fixed time on every line, so the specimen draws the same picture on every
      // visit; performance.now() would put the page's age into it.
      // See lessons/page-kit-status.md#kit-status-14
      joinedSpec.line('the board answered', 'hi', 1240);
      joinedSpec.line('holding a note', null, 2480);
      // A .pos-body stand-in, because the joined surface sits at the page's foot and the
      // gap under the page is what is measured from it.
      // See lessons/page-kit-status.md#kit-status-15
      joinedPage = el('div', 'pos-body kit-mid', 'page');
      box.append(el('p', 'kit-cap', 'joined'), joinedPage, joinedSpec.foot);

      // Joined with only the log: readout: null, as on a page whose document is the
      // readout. Still one box, with no seam.
      // See lessons/page-kit-status.md#kit-status-16
      logOnlySpec = createReport();
      logOnlySpec.line('nothing to count on this page', null, 1240);
      box.append(el('p', 'kit-cap', 'joined, with no readout declared'), logOnlySpec.foot);

      // Joined with the log switched off (showLog: false). A glue of one block is that
      // block unwrapped, so the readout itself wears .pos-report; a page that hides
      // .pos-readout in full screen then leaves no empty band behind.
      // See lessons/page-kit-status.md#kit-status-17
      roOnlySpec = createReport({ readout: { sent: '/s', lost: '' }, showLog: false });
      roOnlySpec.set('sent', 48);
      roOnlySpec.set('lost', 0, 'ok');
      box.append(el('p', 'kit-cap', 'joined, with the log switched off'), roOnlySpec.foot);

      // With neither, foot comes back null rather than an empty box painting a 2 px band
      // of its own borders, so nothing is appended.
      // See lessons/page-kit-status.md#kit-status-18
      neitherSpec = createReport({ showLog: false });

      // ── split ───────────────────────────────────────────────────────────
      splitSpec = createReport({ readout: { sent: '/s', lost: '' }, joined: false });
      splitSpec.set('sent', 48);
      splitSpec.set('lost', 0, 'ok');
      splitSpec.line('the board answered', 'hi', 1240);
      splitSpec.line('holding a note', null, 2480);
      // a real `.pos-body` again, because the gap under a split log belongs to
      // the body rather than to the log; a plain div here would measure nothing
      splitPage = el('div', 'pos-body kit-mid', 'page');
      /**
       * In a stack, because a real page is one: components carry no margins of their
       * own, so a specimen assembled by hand in a box would have no gaps.
       * See lessons/page-kit-status.md#kit-status-19
       */
      const splitStack = createStack(undefined, 'kit-col');
      splitStack.add(splitSpec.top, splitPage, splitSpec.foot);
      box.append(el('p', 'kit-cap', 'split, the opt-out, which no page asks for'), splitStack.el);

      /**
       * The readout cells themselves, shown here rather than in a section of their own,
       * so the component appears once on this page.
       * See lessons/page-kit-status.md#kit-status-20
       */
      const cells = el('div', 'pos-readout');
      for (const [k, v, u, state] of [['latency', '26.2', 'ms', 'ok'], ['holes', '3', '', 'warn'],
                                      ['lost', '0', '', ''], ['worst', '', 'ms', 'pending']]) {
        const c = el('div', 'pos-cell');
        c.append(el('div', 'pos-k', k));
        // The unit goes inside the value, as shell.mjs does: .pos-v is display:block, so a
        // sibling unit would drop to a line of its own.
        // See lessons/page-kit-status.md#kit-status-21
        const val = el('span', 'pos-v', v);
        if (state) val.dataset.state = state;
        if (u) val.append(el('span', 'pos-u', u));
        c.append(val); cells.append(c);
      }
      box.append(el('p', 'kit-cap', 'the cells on their own, an even number of them'), cells);

      /**
       * The fixed-column shape (rows: 2) is an option on the readout, so it is shown
       * here. An even cell count divides by two, so the shape is a full rectangle.
       * See lessons/page-kit-status.md#kit-status-22
       */
      const ten = () => ({
        head: '', marker: '', written: 'B', 'not erasure': 'B', payload: 'B',
        filled: '%', entropy: '', nearest: 'B', 'synth 1': '', 'synth 2': '',
      });
      const fillTen = (r) => {
        r.set('head', 'USER'); r.set('marker', 'DC BB'); r.set('written', '10,620');
        r.set('not erasure', '9,206'); r.set('payload', '1,054'); r.set('filled', '84.7');
        r.set('entropy', '0.83'); r.set('nearest', '262');
        r.set('synth 1', 'SpaceRadio'); r.set('synth 2', 'SpooKey');
        return r;
      };
      // The same ten cells and values in both, so only the arrangement differs.
      // joined: false because these are readouts, not reports: a joined report would
      // bring the 40 px foot gap with it.
      // See lessons/page-kit-status.md#kit-status-23
      kitRoFlex = fillTen(createReport({ readout: ten(), showLog: false, joined: false }));
      kitRoGrid = fillTen(createReport({ readout: ten(), rows: 2, size: 'sm', showLog: false, joined: false }));
      box.append(
        el('p', 'kit-cap', 'ten cells with no shape asked for, which is the default'),
        kitRoFlex.readoutEl,
        el('p', 'kit-cap', 'the same ten as two rows, with a quieter value'),
        kitRoGrid.readoutEl,
      );
    });

  // Table: the sandbox shows every shared component, so a page's copy can be
  // checked against it.
  // See lessons/page-kit-status.md#kit-status-24
  section('TABLE',
    'Every column is named by the caller, and exactly one of them must grow.',
    `createTable({ columns: [
  { key: 'dir',  width: 52, hi: true },
  { key: 'text', grow: true },
  { key: 'sent', width: 42, align: 'right' }] })`,
    (box) => {
      box.classList.add('kit-wide');
      const t = createTable({
        /**
         * Two facts in one cell are two columns: the time and the message stay separate,
         * so times line up and a long message cannot push its timestamp off screen.
         * See lessons/page-kit-status.md#kit-status-25
         */
        columns: [
          { key: 'dir', width: 52, label: 'state', hi: true },
          { key: 'at', width: 62, label: 'at' },
          { key: 'text', grow: true, label: 'what happened' },
          { key: 'sent', width: 42, label: 'sent', align: 'right' },
        ],
        empty: 'nothing yet',
      });
      t.set([
        { dir: 'live', at: '14:42:24', text: 'Rehearsal moved to Thursday', sent: 'sent' },
        { dir: 'away', at: '13:29:16', text: 'Doors at seven, not half past', sent: '' },
        { dir: 'wait', at: '13:02:09', text: 'A title long enough to show what a growing column does with it', sent: '' },
      ]);
      box.append(t.el);
      // The negative control on the page: the throw is this component's one real rule.
      // See lessons/page-kit-status.md#kit-status-26
      let refused = 'IT WAS ACCEPTED';
      try { createTable({ columns: [{ key: 'a', grow: true }, { key: 'b', grow: true }] }); }
      catch (e) { refused = e.message; }
      box.append(el('div', 'kit-cut', `two growing columns: ${refused}`));
    });

  // A link to a block lands on it. See `land()` in demo/shell/kit-page.mjs.
  land();

  /* What a machine can say about this page. Every check is behind ?selfcheck=1 and
     copied from demo/kit/index.html with its indent. They run after a frame,
     because getBoundingClientRect before the first paint measures an unarranged page.
     See lessons/page-kit-status.md#kit-status-27 */
  if (SELFCHECK) {
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  checkPage();


  /**
   * Same ten cells, two arrangements: the flex row wraps where the width allows, the
   * grid puts five in a row. Compared by counting distinct row tops, which the DOM
   * knows, rather than columns, which it does not.
   * See lessons/page-kit-status.md#kit-status-28
   */
  {
    const tops = (r) => new Set([...r.readoutEl.children]
      .map((c) => Math.round(c.getBoundingClientRect().top)));
    const rowOf = (r, k) => Math.round([...r.readoutEl.children][k].getBoundingClientRect().top);
    const gridRows = tops(kitRoGrid);
    // And full width: .kit-box is a flex row, so a readout in it takes its content
    // width; kit-wide makes the box display: block.
    // See lessons/page-kit-status.md#kit-status-29
    const roBox = kitRoGrid.readoutEl.getBoundingClientRect();
    const host = kitRoGrid.readoutEl.parentElement;
    /**
     * The content box is clientWidth minus padding: clientWidth already drops the
     * border and includes padding. Every sibling in the box measures the same width,
     * which is what confirms the ruler.
     * See lessons/page-kit-status.md#kit-status-30
     */
    const hp = getComputedStyle(host);
    const content = host.clientWidth - parseFloat(hp.paddingLeft) - parseFloat(hp.paddingRight);
    const sibs = [...host.children].map((c) => Math.round(c.getBoundingClientRect().width));
    d.assert('a readout fills the width it is given rather than shrinking to its cells',
      Math.abs(roBox.width - content) < 1 && new Set(sibs).size === 1,
      `${roBox.width.toFixed(1)} px of a ${content.toFixed(1)} px content box, `
      + `and all ${sibs.length} children of that box measure ${[...new Set(sibs)].join(', ')}`);
    const vSize = (r) => parseFloat(getComputedStyle(r.readoutEl.querySelector('.pos-v')).fontSize);
    d.assert('asked for two rows it lays ten cells out five and five, whatever the flex row does',
      gridRows.size === 2
      && rowOf(kitRoGrid, 0) === rowOf(kitRoGrid, 4)
      && rowOf(kitRoGrid, 5) === rowOf(kitRoGrid, 9)
      && rowOf(kitRoGrid, 0) !== rowOf(kitRoGrid, 5),
      `${gridRows.size} row(s) of cells in the grid against ${tops(kitRoFlex).size} in the flex row`);

    d.assert('and the quieter value is smaller while the key it sits under is not',
      vSize(kitRoGrid) < vSize(kitRoFlex)
      && parseFloat(getComputedStyle(kitRoGrid.readoutEl.querySelector('.pos-k')).fontSize)
         === parseFloat(getComputedStyle(kitRoFlex.readoutEl.querySelector('.pos-k')).fontSize),
      `${vSize(kitRoGrid)} px against ${vSize(kitRoFlex)} px, with both keys at `
      + `${getComputedStyle(kitRoGrid.readoutEl.querySelector('.pos-k')).fontSize}`);
  }

  // Nothing in the log is white: a hi line is weight plus one step of ink, short of
  // the page's brightest colour. Measured as computed ink on a display: none
  // specimen in the real log, removed within one task.
  // See lessons/page-kit-status.md#kit-status-31
  {
    const line = el('div', 'pos-line hi');
    line.style.display = 'none';
    const m = el('span', 'pos-m', 'probe');
    line.append(m);
    d.logEl.append(line);
    const emph = getComputedStyle(m).color;
    const brightest = getComputedStyle(document.body).color;
    const body = getComputedStyle(d.logEl).color;
    line.remove();
    d.assert('the loudest line in the log is quieter than the page\u2019s brightest ink',
      emph !== brightest && emph !== body,
      `the log reads ${body}, its emphasis ${emph}, the page ${brightest}`);
  }

  // The readout specimen: an even cell count, and an unmeasured cell is empty with
  // its unit hidden, so it reads neither as a lost number nor as a confident 0.
  // The assert checks the unit is hidden, not what the cell draws.
  // See lessons/page-kit-status.md#kit-status-32
  const cells = [...document.querySelectorAll('.kit-box .pos-readout .pos-cell')];
  const pending = cells.map((c) => c.querySelector('.pos-v[data-state="pending"]')).filter(Boolean);
  const unitShown = pending.some((v) => {
    const u = v.querySelector('.pos-u');
    return u && getComputedStyle(u).display !== 'none';
  });
  d.assert('the readout specimen has an even number of cells and hides the unit of an unmeasured one',
    cells.length > 0 && cells.length % 2 === 0 && pending.length > 0 && !unitShown,
    `${cells.length} cells, ${pending.length} unmeasured, unit ${unitShown ? 'STILL SHOWING' : 'hidden'}`);

  // The negative control: mount() refuses an odd count. Called in a try, because
  // passing is the throw.
  // See lessons/page-kit-status.md#kit-status-33
  let odd = null;
  try {
    mount({ name: 'kit-probe', readout: { a: '', b: '', c: '' } });
    odd = 'it was accepted';
  } catch (e) { odd = e.message; }
  d.assert('NEGATIVE CONTROL: a readout with an odd number of cells is refused',
    odd !== 'it was accepted', odd);

  // The presence badge keeps one width in every state, so a word changing from
  // online to coming online never shoves what sits to its right.
  // See lessons/page-kit-status.md#kit-status-34
  {
    // One badge, walked through every state: the guarantee is that a badge never
    // changes width under a reader. The fixed specimens are sized differently on purpose.
    // See lessons/page-kit-status.md#kit-status-35
    const w = [];
    for (const s of PRESENCE_STATES) {
      presLive.set(s);
      w.push([s, presLive.el.getBoundingClientRect().width]);
    }
    presLive.set('online');
    const spread = Math.max(...w.map(([, x]) => x)) - Math.min(...w.map(([, x]) => x));
    d.assert('one badge is the same width in every state it can be in',
      w.length === PRESENCE_STATES.length && spread <= 0.5,
      w.length === PRESENCE_STATES.length
        ? `${w.map(([s, x]) => `${s} ${x.toFixed(1)}`).join(' · ')} px, spread ${spread.toFixed(2)}`
        : `${w.length} states were measured of ${PRESENCE_STATES.length}, so nothing was compared`);

    /**
     * The width reserve covers the busy phrases too, which is why busy is words on the
     * badge rather than a mark beside it. Dropping them from widest in presence.mjs
     * turns this red by about four characters.
     * See lessons/page-kit-status.md#kit-status-36
     */
    const bw = [...busySpec].map(([label, el2]) => [label, el2.getBoundingClientRect().width]);
    const bs = bw.length > 1 ? Math.max(...bw.map(([, x]) => x)) - Math.min(...bw.map(([, x]) => x)) : -1;
    d.assert('a badge is the same width whether nobody, a person or a harness is driving it',
      bw.length === 3 && bs <= 0.5,
      bw.length === 3
        ? `${bw.map(([l, x]) => `${l} ${x.toFixed(1)}`).join(' · ')} px, spread ${bs.toFixed(2)}`
        : `${bw.length} specimens of 3, so nothing was compared`);

    // And that they actually SAY different things, because three badges the
    // same width could equally be three badges saying nothing.
    const said = [...busySpec].map(([l, el2]) => [l, el2.querySelector('.pos-pres-w').textContent.trim()]);
    d.assert('and it says which of the three it is, in words',
      new Set(said.map(([, t]) => t)).size === 3,
      said.map(([l, t]) => `${l}: "${t}"`).join(' · '));

    /**
     * The word greys and the dot does not: a grey dot means nobody has looked
     * (checking, unknown), so both halves are asserted.
     * See lessons/page-kit-status.md#kit-status-37
     */
    const ink = (el2, sel) => getComputedStyle(el2.querySelector(sel)).color;
    const idle = busySpec.get('nobody'), person = busySpec.get('a person'), tool = busySpec.get('a harness');

    d.assert('the busy word is greyer than the word it qualifies, and the dot is not',
      ink(person, '.pos-pres-w') === ink(tool, '.pos-pres-w')
      && ink(person, '.pos-pres-w') !== ink(idle, '.pos-pres-w')
      && ink(person, '.pos-pres-dot') === ink(idle, '.pos-pres-dot'),
      `word ${ink(idle, '.pos-pres-w')} -> ${ink(person, '.pos-pres-w')} · `
      + `dot ${ink(idle, '.pos-pres-dot')} -> ${ink(person, '.pos-pres-dot')}`);
  }

  // The animation cannot move anything either: read off the keyframes rather than
  // two rects a moment apart, which would catch a one-frame shift only by luck.
  // See lessons/page-kit-status.md#kit-status-38
  {
    const after = (s) => getComputedStyle(presSpec.get(s).querySelector('.pos-pres-dot'), '::after');
    const moving = PRESENCE_STATES.filter((s) => (after(s).animationName || 'none') !== 'none');
    // Both moving states are meant to share ONE keyframe, so take the name only
    // when they agree: two different animations here would be two ways of
    // saying "something is happening", which is the drift this page exists for.
    const names = new Set(moving.map((x) => after(x).animationName));
    const name = names.size === 1 ? [...names][0] : null;
    // Every declaration in every keyframe of it, out of the one stylesheet.
    const props = new Set();
    for (const sheet of document.styleSheets) {
      let rules = [];
      try { rules = [...sheet.cssRules]; } catch { continue; }   // never cross-origin here
      for (const r of rules) {
        if (r.type !== CSSRule.KEYFRAMES_RULE || r.name !== name) continue;
        for (const k of r.cssRules) for (const p of k.style) props.add(p);
      }
    }
    const only = props.size > 0 && [...props].every((p) => p === 'opacity');
    /**
     * Colour says what is known, motion says something is happening: only checking
     * and coming move, sharing one keyframe that may touch nothing but opacity.
     * See lessons/page-kit-status.md#kit-status-39
     */
    d.assert('exactly the two unsettled states move, and they move nothing but opacity',
      moving.join(',') === 'checking,coming' && only,
      `${moving.length ? moving.join(', ') : 'nothing'} moves · ${name || 'no keyframes'} touches `
      + `${props.size ? [...props].join(', ') : 'nothing this page can read'}`);
  }

  // The states are told apart by the dot, not the word: ring colour, fill colour,
  // fill opacity and motion are measured.
  // See lessons/page-kit-status.md#kit-status-40
  {
    const ink = (s) => {
      const dot = presSpec.get(s).querySelector('.pos-pres-dot');
      const a = getComputedStyle(dot, '::after');
      return [getComputedStyle(dot).borderTopColor, a.backgroundColor,
        Math.round(Number(a.opacity)), a.animationName || 'none'].join(' ');
    };
    const inks = PRESENCE_STATES.map(ink);
    d.assert('and the five are told apart by the dot alone, with the word covered up',
      new Set(inks).size === PRESENCE_STATES.length,
      PRESENCE_STATES.map((s, i) => `${s}: ${inks[i]}`).join(' · '));
  }

  // A dot whose meaning is only a colour must still be readable, so dot mode clips
  // the word instead of display: none: still in the accessibility tree and live region.
  // See lessons/page-kit-status.md#kit-status-41
  {
    const dotMode = document.querySelector('.kit-box .pos-pres[data-mode="dot"]');
    const wordEl = dotMode?.querySelector('.pos-pres-w');
    const readable = !!wordEl && getComputedStyle(wordEl).display !== 'none'
      && wordEl.textContent.trim().length > 0;
    const wide = dotMode ? dotMode.getBoundingClientRect().width : -1;
    d.assert('an embedded dot still says its state in words, and still takes only a dot of room',
      readable && wide > 0 && wide <= 10,
      dotMode ? `says "${wordEl.textContent}", lays out ${wide.toFixed(1)} px wide`
              : 'no embedded dot was found, so nothing was compared');
  }

  // Joined is one surface, which takes two measurements: the seam (1 px apart) and the
  // inner border widths (0), because a border drawn inside its box leaves the seam at
  // 1 px even when doubled.
  // See lessons/page-kit-status.md#kit-status-42
  const px = (e, side) => Number.parseFloat(getComputedStyle(e)[`border${side}Width`]);
  // Joined sits at the foot, under the page's one 40 px gap. It is set on .pos-report
  // and on .pos-body's bottom margin, since the surface sits outside the body; the
  // two collapse rather than add.
  // See lessons/page-kit-status.md#kit-status-43
  {
    const rep = joinedSpec?.foot;
    const ro = joinedSpec?.readoutEl.getBoundingClientRect();
    const lo = joinedSpec?.logEl.getBoundingClientRect();
    const seam = ro && lo ? lo.top - ro.bottom : -1;
    const foot = rep && joinedPage
      ? rep.getBoundingClientRect().top - joinedPage.getBoundingClientRect().bottom : -1;
    const outer = rep ? px(rep, 'Top') : -1;
    const inner = joinedSpec ? [px(joinedSpec.readoutEl, 'Bottom'), px(joinedSpec.logEl, 'Top')] : [-1, -1];
    d.assert('joined is one box at the foot of the page, with the two halves one pixel apart',
      !!rep && rep.classList.contains('pos-report')
      && rep.contains(joinedSpec.readoutEl) && rep.contains(joinedSpec.logEl)
      && Math.abs(seam - 1) <= 0.5 && Math.abs(foot - 40) <= 0.5
      && outer === 1 && inner[0] === 0 && inner[1] === 0,
      `${foot.toFixed(1)} px under the page · seam ${seam.toFixed(1)} px · `
      + `one edge of ${outer} px round both, ${inner.join(' and ')} inside`);
  }

  // The opt-out (joined: false) is still built and graded: two surfaces with the page
  // between them, 40 px above and below. The gap above is .pos-readout's own bottom
  // margin, the gap below is .pos-body's; the log asks for none.
  // See lessons/page-kit-status.md#kit-status-44
  {
    const mid = splitPage?.getBoundingClientRect();
    const ro = splitSpec?.readoutEl.getBoundingClientRect();
    const lo = splitSpec?.logEl.getBoundingClientRect();
    const above = mid && ro ? mid.top - ro.bottom : -1;
    const below = mid && lo ? lo.top - mid.bottom : -1;
    const own = splitSpec ? px(splitSpec.readoutEl, 'Top') === 1 && px(splitSpec.logEl, 'Top') === 1 : false;
    d.assert('split leaves two surfaces, with the page\u2019s one gap above and below',
      own && splitSpec.report === null
      && !splitSpec.readoutEl.closest('.pos-report') && !splitSpec.logEl.closest('.pos-report')
      && Math.abs(above - 40) <= 0.5 && Math.abs(below - 40) <= 0.5,
      `${above.toFixed(1)} px above the page and ${below.toFixed(1)} px below it, ${own ? 'two edges' : 'NOT two edges'}`);
  }

  // Joined with no readout: one bordered box holding the log, no seam and no empty
  // strip. A display: none child takes no gap in a flex column.
  // See lessons/page-kit-status.md#kit-status-45
  {
    const rep = logOnlySpec?.foot;
    const drop = rep ? logOnlySpec.logEl.getBoundingClientRect().top - rep.getBoundingClientRect().top : -1;
    const gone = logOnlySpec ? getComputedStyle(logOnlySpec.readoutEl).display === 'none' : false;
    d.assert('a joined surface with no readout is one box with no seam in it',
      !!rep && gone && Math.abs(drop - 1) <= 0.5,
      `the log starts ${drop.toFixed(1)} px inside the box, which is its edge and nothing else`);
  }

  // Log switched off: the element handed back is readoutEl itself carrying
  // .pos-report, so there is no second box and hiding the readout leaves nothing.
  // See lessons/page-kit-status.md#kit-status-46
  {
    const rep = roOnlySpec?.foot;
    const same = !!rep && rep === roOnlySpec.readoutEl;
    const edge = rep ? px(rep, 'Top') : -1;
    // measured by hiding it and reading the computed display back, because
    // `el.hidden` is a fact about an attribute and this claim is about ink
    let gone = false;
    if (rep) {
      rep.hidden = true;
      gone = getComputedStyle(rep).display === 'none';
      rep.hidden = false;
    }
    d.assert('a joined surface with no log is the readout itself, one edge and no wrapper',
      same && edge === 1 && gone,
      same ? `the readout is the surface, ${edge} px of edge, and hiding it leaves ${gone ? 'nothing' : 'a box behind'}`
           : 'a wrapper was drawn round a single block');
  }

  // With neither half, no box: createReport returns no surface, so nothing paints an
  // empty band.
  // See lessons/page-kit-status.md#kit-status-47
  d.assert('and with neither half to draw, nothing is put on the page at all',
    !!neitherSpec && neitherSpec.foot === null && neitherSpec.report === null
    && !document.body.contains(neitherSpec.readoutEl) && !document.body.contains(neitherSpec.logEl),
    neitherSpec && neitherSpec.foot === null
      ? 'no surface was returned, so there is no box to paint'
      : 'an empty surface was returned and would draw its own two edges');

  /**
   * The MIDI log, graded here: seven messages went in and two are a clock byte and an
   * active sensing byte.
   * See lessons/page-kit-status.md#kit-status-48
   */
  if (kitMidiLog) {
    d.assert('the log listed five of seven and refused both floods',
      kitMidiListed === 5 && kitMidiLog.count() === 5,
      `${kitMidiListed} added, ${kitMidiLog.count()} rows, of ${kitMidi.length} messages`);

    // The negative half: this reads the rendered text, so a log listing everything
    // cannot pass by counting differently.
    // See lessons/page-kit-status.md#kit-status-49
    const text = kitMidiLog.el.textContent;
    d.assert('and neither flood byte is anywhere in the rendered table',
      !text.includes('F8') && !text.includes('FE'), 'looked for F8 and FE');

    d.assert('every row kept its raw bytes beside the reading',
      text.includes('90 3C 64') && text.includes('C4, velocity 100'),
      'looked for the hex and the reading of one note on');

    // A pitch bend is the case where a reading and its bytes disagree most:
    // little endian, fourteen bit, centre 8192.
    d.assert('a pitch bend is listed as its bytes and read as its value',
      text.includes('E0 00 40') && text.includes('8192'),
      'looked for E0 00 40 and 8192');
  }
  } // if (SELFCHECK)

  d.ready();
</script>

<style>
  /* Part one: the shared panel layout is demo/shell/panel-layout.mjs and `.panel-*`
     in shell.css. What stays below is the MK-425C's own parts, which only this
     instrument's proportions need.
     See lessons/page-evo.md#evo-1 */

  /* Both gaps are already 0 and kept on purpose: `.panel` and `.panel-wrap` are shared
     by three pages, so a gap added there for another page would push this column away.
     See lessons/page-evo.md#evo-2 */
  .panel.evo { gap: 0; }
  .evo-wrap { gap: 0; }

  /* Part two: the MK-425C's own parts. One strip along the back, one column at the
     left end, keys everywhere else. Drawn in this project's idiom: faithful in what
     the controls are and where they sit, with spacing instead of printed lines.
     See lessons/page-evo.md#evo-3 */

  .evo-fixed { gap: 12px; }
  /* The back strip's groups (octave pair, nameplate, rotaries) centre on each other.
     See lessons/page-evo.md#evo-4 */
  .evo-row { gap: 20px; align-items: center; }
  /* The wheels are the FRONTMOST thing on the case, at the very edge nearest
     the player, so they go to the foot of the column whatever room is left. */
  /* The wheels are centred. The keypad is the widest thing in the column, so the
     column's centre and the keypad's coincide; the page asserts both.
     See lessons/page-evo.md#evo-5 */
  .evo-wheels { margin-top: auto; display: flex; justify-content: center; }

  /* ── the display ───────────────────────────────────────────────────────── */
  /* The small field is bottom left and the three digits fill the right two thirds,
     as the manual draws it. The instrument has no LED; the display is the top item.
     See lessons/page-evo.md#evo-6 */
  .evo-win { gap: 10px; }

  /* ── the keypad: twelve buttons, and both counts are true ──────────────── */
  /* Twelve buttons in a telephone grid: 1 2 3 on top, `- 0 +` at the bottom (ten
     digits plus the +/- pair). Half height: the real buttons are about 1.45 times
     wider than tall, and no foot slots are reserved, so the grid drops to 176 px.
     See lessons/page-evo.md#evo-7 */
  /* No box round the keypad: twelve buttons already have twelve edges, and its
     padding goes too, since this column is tight.
     See lessons/page-evo.md#evo-8 */
  .evo-keypad { display: flex; flex-direction: column;
                background: none; border: 0; border-radius: 0; padding: 0; }
  .evo-snapbox { margin-top: 6px; }
  .evo-rec { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .evo-rec-say { color: var(--dim); font: 400 11px/1.4 var(--mono); }

  /* ── the wheels ────────────────────────────────────────────────────────── */
  .evo-wheelrow { display: flex; align-items: flex-start; gap: 6px; }
  /* MAX and MIN mark the ends of the travel for both wheels, placed from
     --fdr-lane-h and --ctl-head. The 4px is `.pos-fdr-lane`'s top margin, which the
     kit publishes no token for.
     See lessons/page-evo.md#evo-9 */
  .evo-wheelmid {
    display: flex; flex-direction: column; justify-content: space-between;
    height: var(--fdr-lane-h, 120px);
    margin-top: calc(var(--ctl-head) + 4px);
  }
  /* Wheel names are one token each, nowrap and allowed to overflow their 46 px boxes:
     a wrap or an ellipsis misaligns or cuts them. The wheels sit 28.86 px apart, so
     the names keep about 11 px of air; the page asserts that gap.
     See lessons/page-evo.md#evo-10 */
  .evo-wheels .pos-fdr-lab {
    white-space: nowrap; overflow: visible; text-overflow: clip;
  }

  /* ── the six function buttons ──────────────────────────────────────────── */
  /* Six function buttons and five dual press labels (six buttons leave five gaps;
     eight is the MK-449C). Labels are drawn by the page, absolutely positioned,
     because they are wider than the buttons; every position derives from --i.
     See lessons/page-evo.md#evo-11 */
  .evo-fn-row {
    --fn-gap: 10px; --fn-top: 26px; --fn-bot: 24px;
    position: relative; display: flex; gap: var(--fn-gap);
    padding: var(--fn-top) 0 var(--fn-bot);
  }
  .evo-fn-lab, .evo-fn-pair {
    position: absolute; width: 82px; margin-left: -41px;
    white-space: pre-line;
  }
  /* the single press name, above its own button, sitting on the lower of the
     two printed lines so a one word name lines up with a two word one */
  .evo-fn-lab {
    top: 0; height: var(--fn-top); display: flex; align-items: flex-end;
    justify-content: center; color: var(--dim);
    left: calc(var(--i) * (var(--ctl-w) + var(--fn-gap)) + var(--ctl-w) / 2);
  }
  /* The dual press name sits on the midpoint of its pair, which is what says it
     belongs to both buttons; the page asserts it against real rects.
     See lessons/page-evo.md#evo-12 */
  .evo-fn-pair {
    bottom: 0; height: var(--fn-bot);
    left: calc(var(--i) * (var(--ctl-w) + var(--fn-gap)) + var(--ctl-w) + var(--fn-gap) / 2);
  }

  /* ── the octave pair ───────────────────────────────────────────────────── */
  /* Two round blue buttons in the back strip, not with the wheels: the only round
     and coloured ones on the panel.
     See lessons/page-evo.md#evo-13 */
  .evo-oct { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .evo-oct-row { position: relative; display: flex; gap: 12px; }
  /* One ink for every control, declared once: `--fg`, the project's light grey. The
     instrument is grey and a panel drawing has no state to encode in hue.
     See lessons/page-evo.md#evo-14 */
  .evo { --evo-ink: var(--fg); }
  /* The circles line up with the dials: reserving --ctl-foot as a knob does puts
     the pads' working surface on the dials' centre line.
     See lessons/page-evo.md#evo-15 */
  .evo-oct .pos-pad-wrap { padding-bottom: var(--ctl-foot); }
  .evo-oct .pos-pad { --pad-tint: var(--evo-ink); }
  /* Coloured at rest, which is a fact about the object rather than a state this
     page is claiming: `--pad-tint` is the component's own published knob, so
     this is not a page writing a colour the component cannot override. */
  /* Low mixes against `--fg`, so a resting octave button reads as a drawn button,
     not a lit lamp.
     See lessons/page-evo.md#evo-16 */
  .evo-oct .pos-pad:not([data-on]) {
    background: color-mix(in srgb, var(--pad-tint) 7%, var(--card));
    border-color: color-mix(in srgb, var(--pad-tint) 22%, var(--line));
  }


  /* ── the eight rotaries ────────────────────────────────────────────────── */
  /* One row of eight, C1 to C8, with a printed divider between C4 and C5. The
     divider is kept: it marks a 4 and 4 split inside one row.
     See lessons/page-evo.md#evo-17 */
  /* No box round the rotaries; each knob already has edges. The knobs centre on
     their midpoints, so a two line name does not make one hang lower.
     See lessons/page-evo.md#evo-18 */
  .evo-rot { display: flex; align-items: center; gap: var(--ctl-gap); padding: 0; }
  /* The divider rule is `.pos-knob-div` in shell.css; nothing draws `.evo-rot-div`.
     See lessons/page-evo.md#evo-19 */
  /* Rotary names are full ink, not --dim, because the controls they name work;
     the page asserts the ink.
     See lessons/page-evo.md#evo-20 */

  /* ── the keys ──────────────────────────────────────────────────────────── */
  /* The keys take a pointer, but a press never reaches the MIDI table or any
     hardware counter, and the page has no `send`. A mouse has no velocity, so the
     display stays empty for an on-screen key. Not `disabled`, which blocks handlers.
     See lessons/page-evo.md#evo-21 */
  /* `.kpad` hides the keyboard component's own octave and Notes off row: the real
     octave pair is in the back strip.
     See lessons/page-evo.md#evo-22 */
  .evo-keys .kbd .kpad:not(:has(.pos-toggle)) { display: none; }
  /* The row comes back with `Loop` only while midi.mjs has seen the Evolution, so
     `:has` is the whole condition; octave and Panic stay hidden, and the tempo and
     ratio cells that arrive with Loop stay.
     See lessons/page-evo.md#evo-49 */
  .evo-keys .kbd .kpad-grp-start > :not(.kpad-tempo):not(.kpad-ratio),
  .evo-keys .kbd .kpad-grp-end > :not(.pos-toggle) { display: none; }
  /* The keys grow to the case's depth: a kit key is 74 px and a kit pad 46 px
     (1.6:1), the real ratio is 15:1. The sharp is a percentage, so a grown white key
     does not carry a stubby black one.
     See lessons/page-evo.md#evo-23 */
  .evo-keys, .evo-keys .kbd { display: flex; flex-direction: column; margin: 0; }
  /* The outer box is `.panel-grow` (from panel.grow(keysBox)); these are the two
     levels inside the keyboard component that the growth has to reach.
     See lessons/page-evo.md#evo-24 */
  .evo-keys .kbd, .evo-keys .keys { flex: 1 1 auto; min-height: 0; }
  .evo-keys .keys { margin-bottom: 0; }
  /* No box round these keys: the panel is already the box. `--kbd-pad` goes to 0
     because anything glued to the keyboard reads it to bleed to the edges.
     See lessons/page-evo.md#evo-25 */
  .evo-keys .kbd { --kbd-pad: 0px; background: none; border: 0; border-radius: 0; }
  .evo-keys .k { height: auto; }
  .evo-keys .k.sharp { height: 62%; }
  /* Keys pinned to --k-min (49 px): inside a max-content box `1fr` resolves to 86 px
     and the keyboard came out 1297 px in a 925 px panel. At 777 px it never scrolls,
     so the page has one scroller; the page asserts that.
     See lessons/page-evo.md#evo-26 */
  .evo-keys .keys { grid-template-columns: repeat(var(--k-cols, 8), var(--k-min, 49px)); }
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createKnob, createKnobBank } from '/shell/knob.mjs';
  import { createPad, createPadGrid } from '/shell/pad.mjs';
  import { createFader } from '/shell/fader.mjs';
  import { createKeyboard } from '/shell/keyboard.mjs';
  import { createPanelLayout, createNameplate } from '/shell/panel-layout.mjs';
  import { createSegment, SCHEMES } from '/shell/segment.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { createMidiNode, checkMidiNode } from '/shell/midi-node.mjs';
  import { createPresenceButton, WIRED } from '/shell/presence.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { decode, noteName } from '/shell/midi-decode.mjs';
  import { isEvolution, offerLoopFor, inputNames, checkEvolutionLoop } from '/shell/midi.mjs';

  /**
   * An Evolution MK-425C on screen. What it sends is measured
   * (research/measured-devices-2026-09-20.md); where the controls are is read off
   * photographs (research/evo-mk425c-face-2026-09-21.md).
   * See lessons/page-evo.md#evo-27
   */

  /**
   * The global channel is 2, but any controller can carry its own channel (one
   * program button sends on 1), so the page listens on all channels and reports
   * the channel it heard.
   * See lessons/page-evo.md#evo-28
   */
  const GLOBAL_CH = 2;

  /**
   * 25 keys drawn C to C from KEY_PATTERN, typed below, since createKeyboard decides
   * black or white from `sharps.has(k)` and these keys are named k0 to k24. The page
   * asserts the picture (black keys present), not the note count.
   * See lessons/page-evo.md#evo-29
   */
  /* 48 to 72: the transpose that made it send 47 to 71 is fixed on the device.
     `idx = m.note - KEY_LO` indexes a 25 entry array, so a wrong base lights every
     key one place off.
     See lessons/page-evo.md#evo-30 */
  const KEY_LO = 48, KEYS = 25;

  /**
   * 15 white and 10 black, C up to C, typed off the photographs rather than derived
   * from a pitch class test, so the drawing and its check come from two places.
   * See lessons/page-evo.md#evo-31
   */
  const KEY_PATTERN = 'WBWBWWBWBWBWWBWBWWBWBWBWW';

  /**
   * The instrument prints C1 to C8 (rotaries), C9 (pitch bend), C10 (mod), 11 to 20
   * (keypad) and C21 (sustain). `C1` is not `CC 1`: the CC a slot sends is a
   * per-preset setting, so it belongs in the hover.
   * See lessons/page-evo.md#evo-32
   */
  const ROTARIES = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8'];
  /** Where the printed divider line falls inside that one row. */
  const ROTARY_SPLIT = 4;
  /** The wheels' own printed slots, and both are on the panel under the wheel. */
  const BEND_SLOT = 9, MOD_SLOT = 10;

  /**
   * Six function buttons (the manual's MK-425C count), each with its single press
   * function; newlines where the panel prints two lines.
   * See lessons/page-evo.md#evo-33
   */
  const FN_ONE = ['GLOBAL\nCHANNEL', 'CONTROL\nASSIGN', 'PROGRAM',
                  'DATA\nLSB', 'DATA\nMSB', 'RECALL'];
  /**
   * Five dual press labels, below and centred on each pair. The three further dual
   * presses (velocity curve, device ID, memory dump) are not printed on a 425C.
   * See lessons/page-evo.md#evo-34
   */
  const FN_PAIR = ['CONTROL\nMUTE', 'CHANNEL\nASSIGN', 'CONTROL\nSELECT',
                   'MIDI OUT\nFROM USB', 'STORE'];

  /* U+2212 minus, the same character the octave pair uses; the keypad assert compares it.
     See lessons/page-evo.md#evo-35 */
  const MINUS = '−';
  /** The keypad, as the panel lays it out: `1 2 3` on top, `0` between `-` and `+`. */
  const KEYPAD = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], [MINUS, '0', '+']];

  /**
   * Six CC numbers came from eight knobs (84, 72, 74, 71, 93, 5) and no manual says
   * which slot sends which; CC 74 and CC 5 conventions say nothing about this device.
   * The display shows a turned knob's slot and CC, so it can be read off one at a time.
   * See lessons/page-evo.md#evo-36
   */
  const KNOB_CC_SEEN = [84, 72, 74, 71, 93, 5];

  const d = mount({
    name: 'evo',
    what: 'An Evolution MK-425C you can work on screen, moving when the real one moves.',
    /* No readout: keys, velocity and channel are in the MIDI log, bend is under the
       wheel. `readout: null` is a declaration verify.mjs asserts, and the shell hides
       the empty box; the page asserts that.
       See lessons/page-evo.md#evo-37 */
    readout: null,
    /* No declared control: a presence button is spliced into `.pos-controls` below,
       where demo/verify.mjs presses.
       See lessons/page-evo.md#evo-38 */
    controls: [],
  });
  guard(d);

  /* createPanelLayout owns scrolling, widths, depth and the border; this page owns
     the MK-425C. The scroller takes focus and is labelled with its direction, the
     one cue a reader who cannot see the border gets.
     See lessons/page-evo.md#evo-39 */
  const panel = createPanelLayout({
    side: 'left',
    cls: { panel: 'evo', wrap: 'evo-wrap', fixed: 'evo-fixed', strip: 'evo-strip', flow: 'evo-flow' },
    strip: {
      tabindex: 0, role: 'group',
      label: 'the panel’s back strip and its keys, side scrolling',
    },
  });
  const card = panel.el;
  const { fixed, strip, flow } = panel;
  d.el.append(card);

  /* Declared above everything that fills it: the save control is built before
     take() runs, and a `const` is in its temporal dead zone until here.
     See lessons/page-evo.md#evo-40 */
  const RECORDING = new URLSearchParams(location.search).get('rec') === '1';
  const tape = [];
  if (RECORDING) {
    const bar = el('div', 'evo-rec');
    const said = el('span', 'evo-rec-say', 'recording every control message');
    const save = el('button', 'pos-btn', 'Save take', { type: 'button' });
    save.onclick = () => {
      const doc = {
        what: 'every control message off the MK-425C, raw, for measuring whether '
            + 'its rotaries are smoothed',
        when: new Date().toISOString(),
        build: (document.querySelector('.pos-build') || {}).textContent || '',
        events: tape,
      };
      const blob = new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' });
      const a = el('a', '', '', { href: URL.createObjectURL(blob),
        download: `evo-take-${Date.now()}.json` });
      document.body.append(a); a.click(); a.remove();
      d.log(`wrote a take of ${tape.length} control messages`);
    };
    setInterval(() => {
      const ccs = new Set(tape.map((e) => e.cc));
      said.textContent = tape.length
        ? `${tape.length} messages on ${ccs.size} controller(s) over `
          + `${((tape[tape.length - 1].t - tape[0].t) / 1000).toFixed(1)} s. Turn a knob, then save.`
        : 'recording every control message. Nothing yet.';
    }, 500);
    bar.append(said, save);
    d.el.append(bar);
    d.log('this page is recording every control message, because it was opened '
        + 'with ?rec=1. Turn C1 to C8 slowly and then fast, press SAVE TAKE, and '
        + 'the file lands in your downloads');
  }

  // ── the display, topmost in the left column ─────────────────────────────

  /**
   * A segment LCD: a three digit field for the value and a two digit field for which
   * control, per the manual's Default mode. The small field is blank for a rotary,
   * since the wire does not say which slot sent it. Backlit scheme; ghosts from the scheme.
   * See lessons/page-evo.md#evo-41
   */
  const win = el('div', 'panel-win evo-win');
  /* Thinner bars than the meter default of 2.6 and quieter unlit ones; the glyph is
     unchanged so every display on the site reads as one typeface.
     See lessons/page-evo.md#evo-42 */
  const DISP_THICK = 1.7;
  const DISP_GHOST = 0.16;
  /* The small field's bar weight is derived from the two sizes so both render at
     the same pixel weight; a 1.7 px bar is mostly antialiasing and looks paler.
     See lessons/page-evo.md#evo-43 */
  const DISP_SIZE3 = 38, DISP_SIZE2 = 20;
  const DISP_THICK2 = Number((DISP_THICK * (DISP_SIZE3 / DISP_SIZE2)).toFixed(2));
  const disp3 = createSegment({
    digits: 3, frame: false, size: DISP_SIZE3, scheme: 'backlit',
    thick: DISP_THICK, ghost: DISP_GHOST,
    title: 'the three digit field. On this instrument it carries the value: a '
         + 'controller number, a program number, or a velocity',
  });
  const disp2 = createSegment({
    digits: 2, frame: false, size: DISP_SIZE2, scheme: 'backlit',
    thick: DISP_THICK2, ghost: DISP_GHOST, value: '00',
    /* Per the manual, this field shows the last selected controller, not the last
       value sent. `00` before anything is selected.
       See lessons/page-evo.md#evo-44 */
    title: 'the two digit field. The manual says it shows the last selected '
         + 'controller, while the three digits show that controller’s MIDI CC '
         + 'number. It opens on 00, before anything has been selected',
  });
  /* The window's glass comes from the same scheme module as the fields, so a scheme
     change cannot leave them disagreeing; the page asserts they match.
     See lessons/page-evo.md#evo-45 */
  win.style.setProperty('--disp-back', SCHEMES.backlit.back);
  /* The small field FIRST, because it is at the bottom left of the real window
     and the three large digits fill the right two thirds of it. */
  win.append(disp2.el, disp3.el);
  fixed.append(win);

  /**
   * Both fields at once, so a reading is never half replaced. The small field is the
   * control's printed number (C1 to C10, so two digits fit); the large one is what
   * the control just sent, where the manual shows the assigned CC.
   * See lessons/page-evo.md#evo-46
   */
  function show(value, about) {
    disp3.set(value);
    disp2.set(about);
  }

  // ── worked by hand, and it is a second source that must never pass for the
  //    first ────────────────────────────────────────────────────────────────

  /**
   * Every control works, and nothing a hand does is mistaken for the instrument.
   * take() is the wire: only it fills the MIDI table and the hardware counters. Hand
   * presses move the drawing and display only; there is no send, asserted below.
   * See lessons/page-evo.md#evo-47
   */
  const handSaid = new Set();
  /** A fact worth saying once, when a hand first reaches a kind of control. */
  function sayOnce(key, line, level) {
    if (handSaid.has(key)) return;
    handSaid.add(key);
    d.log(line, level);
  }

  /**
   * A keypad digit replays what it was measured sending (bank LSB, bank MSB, program
   * change, channel 2), showing the reading the way take() does but without calling
   * it, so no row lands in the table that never crossed a wire.
   * See lessons/page-evo.md#evo-48
   */
  function handProgram(face) {
    sayOnce('program', `pressing a button here moves this drawing and sends nothing, `
      + 'because this page opens MIDI inputs and has no output at all. On the desk '
      + `button ${face} was measured sending a bank select pair and program ${face} `
      + `on channel ${GLOBAL_CH}`);
    show(Number(face), GLOBAL_CH);
  }

  /**
   * The `-`/`+` keys and the octave pair press and flash but move nothing: what a
   * press sends was never captured, so moving the drawing would invent a fact. The
   * log says what is unknown.
   * See lessons/page-evo.md#evo-50
   */
  function handUnmeasured(key, line) {
    sayOnce(key, line, 'warn');
  }

  /**
   * A rotary turned by hand fills the value and its slot, which is certain here
   * (on the wire the slot is inferred). No CC is claimed; a hand never writes knobCC.
   * See lessons/page-evo.md#evo-51
   */
  function handRotary(slot, v) {
    sayOnce('rotary', `turning a rotary here fills the display the way the instrument `
      + 'does and claims no controller number, because which MIDI CC a slot sends is '
      + 'held in the keyboard and printed in no manual');
    show(v, slot + 1);
  }

  // ── twelve half height buttons, in a 3 wide by 4 tall grid ──────────────

  /**
   * Each press sends three messages: bank LSB, bank MSB, program change (1 to 9 on
   * channel 2). The tenth sent program 0 on channel 1, so the program number, not the
   * channel, picks the lit button. In edit mode these are controllers 11 to 20.
   * See lessons/page-evo.md#evo-52
   */
  const keypadBox = el('div', 'panel-group evo-keypad');
  /**
   * `ASSIGNABLE` lives in the hover: unnamed keys otherwise read as broken.
   * See lessons/page-evo.md#evo-53
   */
  keypadBox.title = 'the ten assignable buttons, which the panel prints '
    + 'ASSIGNABLE BUTTONS under. They are blank on purpose: each one sends '
    + 'whatever it has been assigned, and in edit mode the ten are a keypad';
  const keypad = createPadGrid({
    cols: 3, rows: 4,
    pad: (x, y) => {
      const face = KEYPAD[y][x];
      const digit = /\d/.test(face);
      return {
        /* The number is on the face, saving a text slot per row; the face is what you read
           before hitting a pad (see pad.mjs).
           See lessons/page-evo.md#evo-54 */
        label: face, half: true,
        aria: digit ? `assignable button ${face}` : `${face} button`,
        /* `latch: false`, so a press flashes for 160 ms, the same as a program change off
           the wire. The handler belongs on the grid: createPadGrid overwrites a per pad
           `onPress` with its own, so one returned here would silently never run.
           See lessons/page-evo.md#evo-55 */
        tint: 'var(--evo-ink)', latch: false,
        title: digit
          ? `program ${face}, sent with a bank select pair in front of it. `
            + `In edit mode this is the keypad digit ${face}`
          : `${face}. Pressed together with the other one it sends a snap shot, `
            + 'which is every controller’s current value at once',
      };
    },
    /* One handler for twelve buttons, where the grid reads it. The face is read back
       out of KEYPAD, the one place this layout is written down.
       See lessons/page-evo.md#evo-56 */
    onPress: (on, x, y) => {
      const face = KEYPAD[y][x];
      if (/\d/.test(face)) { handProgram(face); return; }
      handUnmeasured('snapshot', `${face} pressed. What this button sends on its own has `
        + 'never been captured here, and the manual only documents the pair: pressed '
        + 'together the two send a snap shot, which is every controller’s current value '
        + 'at once');
    },
  });
  /** Program number to the button that carries it, so a flash needs no arithmetic. */
  const padByDigit = new Map();
  KEYPAD.forEach((row, y) => row.forEach((face, x) => {
    if (/\d/.test(face)) padByDigit.set(face, keypad.at(x, y));
  }));

  /* No SNAP SHOT label: the -/+ dual press is in the hover and in
     research/evo-mk425c-face-2026-09-21.md.
     See lessons/page-evo.md#evo-57 */
  keypadBox.append(keypad.el);
  fixed.append(keypadBox);

  // ── the two wheels, frontmost on the case ───────────────────────────────

  /**
   * The pitch wheel is 7 bit in a 14 bit message: 106 bends measured, LSB always 0,
   * 63 values. Raw range 0 to 13952, only 6 of 106 at exactly 8192, so a released
   * wheel is not assumed to report centre.
   * See lessons/page-evo.md#evo-58
   */
  /* `pitchbend` as one word so neither name wraps and C9 and C10 land level; see the
     label rule in the styles above.
     See lessons/page-evo.md#evo-59 */
  const bend = createFader({
    label: 'pitchbend', sub: `C${BEND_SLOT}`, min: 0, max: 16383, value: 8192,
    title: 'pitch bend, printed C9 on the panel. Seven bit in a fourteen bit '
         + 'message, and it was measured reaching 13952 rather than 16383',
    /**
     * A hand move snaps to the 128 steps the wheel really has (LSB always 0), so the
     * drawing resolves no finer than the instrument. The display shows the 7 bit
     * value, as take() does.
     * See lessons/page-evo.md#evo-60
     */
    onInput: (v, from) => {
      if (from === 'hardware') return;
      const msb = Math.round(v / 128);
      if (msb * 128 !== v) { bend.set(msb * 128, { from: 'hand' }); return; }
      sayOnce('bend', 'this wheel resolves 128 steps and not 16384, because every one '
        + 'of the 106 bend messages measured off the instrument carried a low byte of '
        + 'zero, so a drag here lands on the steps the wheel really has');
      show(msb, BEND_SLOT);
    },
  });
  /** Measured: CC 1, values 57 to 127 seen, which is the documented default. */
  const mod = createFader({
    label: 'modulation', sub: `C${MOD_SLOT}`, min: 0, max: 127, value: 0,
    title: 'the modulation wheel, printed C10 on the panel, sending CC 1',
    /* Slot and CC are both known for the mod wheel (CC 1, documented and measured),
       so a hand move fills the display as the wire does.
       See lessons/page-evo.md#evo-61 */
    onInput: (v, from) => {
      if (from === 'hardware') return;
      show(v, MOD_SLOT);
    },
  });
  const wheels = el('div', 'evo-wheels');
  const wheelRow = el('div', 'evo-wheelrow');
  const wheelMid = el('div', 'panel-sub evo-wheelmid');
  /* Typed uppercase rather than left to a `text-transform`, which is the house
     rule: the source should read like the page. */
  wheelMid.append(el('div', '', 'MAX'), el('div', '', 'MIN'));
  wheelRow.append(bend.el, wheelMid, mod.el);
  wheels.append(wheelRow);
  fixed.append(wheels);

  // ── the back strip: function buttons, octave pair, nameplate, rotaries ──

  const row = el('div', 'panel-row evo-row');

  /* No function buttons: in edit mode no data leaves the keyboard except program
     and bank changes, so nothing could press or light them. Their printed names are
     in research/evo-mk425c-face-2026-09-21.md. `row` holds octave, nameplate, rotaries.
     See lessons/page-evo.md#evo-62 */

  /**
   * The octave step is unmeasured (/dump/ saw no shift across 25 notes), so the
   * pair never moves the drawing.
   * See lessons/page-evo.md#evo-63
   */
  const oct = el('div', 'evo-oct');
  const octRow = el('div', 'evo-oct-row');
  /* Smaller than --ctl-w, which is sized for a finger; these match the real
     button's relative size.
     See lessons/page-evo.md#evo-64 */
  /* They press and the drawing does not move; createKeyboard stays pinned at
     minBase and maxBase KEY_LO. The press says so once, in the log.
     See lessons/page-evo.md#evo-65 */
  const octDown = createPad({
    top: MINUS, round: true, small: true, latch: false, aria: 'octave down',
    onPress: () => handUnmeasured('octave', 'the octave pair presses and this keyboard '
      + 'does not move, because the octave step has never been captured here: the '
      + 'manual gives these two 11 octaves of range and the 25 notes measured off the '
      + 'desk were one contiguous run with no shift in them'),
    title: 'octave down. Nothing this sends has ever been captured',
  });
  const octUp = createPad({
    top: '+', round: true, small: true, latch: false, aria: 'octave up',
    onPress: () => handUnmeasured('octave', 'the octave pair presses and this keyboard '
      + 'does not move, because the octave step has never been captured here: the '
      + 'manual gives these two 11 octaves of range and the 25 notes measured off the '
      + 'desk were one contiguous run with no shift in them'),
    title: 'octave up. Nothing this sends has ever been captured',
  });
  /* No OCTAVE or TRANSPOSE printed: both are in the hover and in the research file,
     and `.evo-oct-row` has no bottom padding reserved for them.
     See lessons/page-evo.md#evo-66 */
  octRow.append(octDown.el, octUp.el);
  oct.append(octRow);
  row.append(oct);

  /* The nameplate, mid back strip between the octave pair and the rotaries.
     `place: 'mid'` because an `ends` row across 1575 px put it 500 px off screen
     (see `.panel-plate` in shell.css).
     See lessons/page-evo.md#evo-67 */
  const nameplate = createNameplate({
    lines: ['EVOLUTION', 'MK-425C'], place: 'mid', cls: 'evo-plate',
  });
  const plate = nameplate.el;
  row.append(plate);

  /* The kit's createKnobBank with its divider: one row of eight with a 4 and 4
     grouping, not two banks, which would make the two-rows misreading true.
     See lessons/page-evo.md#evo-68 */
  const knobs = [];
  for (let i = 0; i < ROTARIES.length; i++) {
    const k = createKnob({
      label: ROTARIES[i], min: 0, max: 127, value: 0,
      /* No `sub`: the controller number lives in the hover and the MIDI table.
         See lessons/page-evo.md#evo-69 */
      title: `${ROTARIES[i]}, a fully assignable rotary. Which controller `
           + 'number this slot sends is held in the keyboard and printed in no '
           + 'manual, so nothing here claims one until one is heard',
      /* A hand turn knows its own slot with certainty, which the wire never
         does. See `handRotary` for why that is the interesting half. */
      onInput: (v, from) => { if (from !== 'hardware') handRotary(i, v); },
    });
    knobs.push(k);
  }
  const rotBank = createKnobBank(knobs, { split: [ROTARY_SPLIT] });
  const rot = rotBank.el;
  rot.classList.add('evo-rot');
  row.append(rot);
  flow.append(row);

  /**
   * The kit's createKeyboard. The letter map is 25 slots of note offsets only, and
   * `sharps` must be passed separately: it names which of those slots are black.
   * See KEY_PATTERN above.
   * See lessons/page-evo.md#evo-70
   */
  const keyMap = {};
  const keyNames = [];
  for (let i = 0; i < KEYS; i++) { keyMap[`k${i}`] = i; keyNames.push(`k${i}`); }
  const keysBox = el('div', 'evo-keys');
  /* `onDown` and `onUp` make the keys live. `how` is the thing to read: lightNote
     (used by take() for the wire) never calls these, so `pointer` is always a finger;
     the page asserts it. minBase and maxBase stay pinned.
     See lessons/page-evo.md#evo-71 */
  /* Declared above the callback that reads it, which is this file's own rule:
     a `const` shadows its whole block from the top and `/nola/` paid for it. */
  let handKey = 0;
  const kbd = createKeyboard(keysBox, {
    base: KEY_LO, map: keyMap, keys: keyNames, letters: false,
    sharps: new Set(keyNames.filter((_, i) => KEY_PATTERN[i] === 'B')),
    minBase: KEY_LO, maxBase: KEY_LO,
    /* `Loop` while the Evolution is plugged in. No sound engine, so a loop replays the
       lamp. It starts withdrawn; Listen opens MIDI and can bring it.
       See lessons/page-evo.md#evo-72 */
    loop: 'evolution',
    log: (line, kind) => d.log(line, kind),
    /**
     * The page lights the key: keyboard.mjs's press() calls onDown and never touches a
     * class (a key is lit by a note). `viaKey` keeps a lightNote from inside onDown out
     * of the finger set and the tape, so the echo is not a second note.
     * See lessons/page-evo.md#evo-73
     */
    onDown: (note, how) => {
      if (how === 'midi' || how === 'panic') return;
      handKey++;
      kbd.lightNote(note, true);
      /* A looped note is not a hand on the screen, so it says nothing about one. */
      if (how === 'loop') return;
      /* Nothing on the display for an on-screen key: a mouse has no velocity, and a
         zero would read as a measurement.
         See lessons/page-evo.md#evo-74 */
      show('', '');
      sayOnce('key', `${noteName(note)} pressed on screen. The three digits stay empty `
        + 'because a key played here has no velocity to report, and the instrument '
        + 'fills them with how hard a real key was hit');
    },
    onUp: (note, how) => {
      if (how === 'midi' || how === 'panic') return;
      kbd.lightNote(note, false);
    },
  });
  flow.append(keysBox);
  /* The keys absorb the panel's slack via panel.grow (`.panel-grow`): without it the
     keys fall from 334.03 to 24 px, since `.evo-keys .k { height: auto }` removes
     their own height. The `.kbd` and `.keys` levels inside are handled below.
     See lessons/page-evo.md#evo-75 */
  panel.grow(keysBox);

  /**
   * No label dimming: every pad, rotary and wheel takes a press, so no label names
   * a dead control. The check below is a floor of 3.0 on the faintest printed name
   * (the dimmed baseline read 1.89:1).
   * See lessons/page-evo.md#evo-76
   */

  // ── the MIDI event log ──────────────────────────────────────────────────

  /**
   * What arrived, in columns, beside the panel. The reading never replaces the
   * bytes (midi-decode.mjs returns both). Clock and active sensing are counted,
   * never listed.
   * See lessons/page-evo.md#evo-77
   */
  const traffic = createMidiLog({ empty: '', reserve: 6 });
  d.el.append(traffic.el);

  /* Announced on the patchbay on a press of Join, never on load
     (plans/plan-routing-migration.md step 5), keyed by port. Join asks for MIDI if
     Listen has not. demo/shell/midi-node.mjs has the rest.
     See lessons/page-evo.md#evo-78 */
  const bayMidi = createMidiNode({ slug: 'evo', log: (line, kind) => d.log(line, kind),
    listen: async () => { if (!access) await d.run('listen'); return access; } });
  d.el.append(bayMidi.el);

  // ── what arrives ────────────────────────────────────────────────────────

  let access = null;
  let notes = 0, vLo = null, vHi = null, bendRaw = null;
  const chSeen = new Set(), ccSeen = new Set(), offGrid = new Set();
  /** Controller number to the rotary now following it. See `take` below. */
  const knobCC = new Array(ROTARIES.length).fill(null);
  let flatSaid = false;

  /**
   * The set of channels heard, said once in the log when it arrives. It is the
   * observation from the byte, independent of GLOBAL_CH (what was measured), so the
   * two can disagree and say so.
   * See lessons/page-evo.md#evo-79
   */
  const chSaid = new Set();
  /* `m.ch` is already 1-based (midi-decode.mjs), so it is compared as is; adding one
     here made the log report channel 3. The sentence has an assert.
     See lessons/page-evo.md#evo-80 */
  function sayChannel(ch) {
    if (chSaid.has(ch)) return;
    chSaid.add(ch);
    d.log(ch === GLOBAL_CH
      ? `this keyboard is answering on channel ${ch}, which is where it was measured`
      : `this keyboard is answering on channel ${ch}, and it was measured on `
        + `${GLOBAL_CH}`, ch === GLOBAL_CH ? undefined : 'warn');
  }

  /**
   * The tap, behind `?rec=1`: records every control message raw, to measure whether
   * a rotary is smoothed. Every message, because what else arrives while a knob
   * moves matters; a filter at the tap could not be undone.
   * See lessons/page-evo.md#evo-81
   */
  function take(b) {
    if (RECORDING && (b[0] & 0xf0) === 0xb0) {
      tape.push({ t: Math.round(performance.now()), cc: b[1], v: b[2], ch: b[0] & 0x0f });
    }
    const m = decode(b);
    /* The log refuses a flood itself and says so by returning false, which
       is the one place that policy lives. */
    if (!traffic.add(m)) return;
    if (m.ch !== null) { chSeen.add(m.ch); sayChannel(m.ch); }

    if (m.kind === 'note on' || m.kind === 'note off') {
      /**
       * Every release on this keyboard is a note on at velocity 0 (25 of 25, no 0x80);
       * midi-decode.mjs has already resolved it.
       * See lessons/page-evo.md#evo-82
       */
      const idx = m.note - KEY_LO;
      if (idx < 0 || idx >= KEYS) {
        /* A note within an octave below the bottom key is read as this instrument
           transposed and said so here, since this guard returns on `m.note < KEY_LO`;
           a note further off is just outside the 25 keys.
           See lessons/page-evo.md#evo-83 */
        if (!flatSaid && idx < 0 && idx >= -12) {
          flatSaid = true;
          d.log(`${noteName(m.note)} arrived ${-idx} semitone(s) below the bottom key, `
              + 'which is a transpose set on the keyboard rather than anything on this '
              + 'page. The panel draws where the notes really are', 'warn');
        } else if (!offGrid.has(m.note)) {
          offGrid.add(m.note);
          d.log(`${noteName(m.note)}, note ${m.note}, is outside the 25 keys this `
              + 'panel draws, so it is listed and not lit', 'warn');
        }
        return;
      }
      if (m.kind === 'note on') {
        notes++;
        vLo = vLo === null ? m.d2 : Math.min(vLo, m.d2);
        vHi = vHi === null ? m.d2 : Math.max(vHi, m.d2);
        kbd.lightNote(m.note, true);
        /* A key's velocity goes in the large field; a key is not an assignable control, so
           the small field has nothing to say.
           See lessons/page-evo.md#evo-84 */
        show(m.d2, '');
      } else {
        kbd.lightNote(m.note, false);
      }
      return;
    }

    if (m.kind === 'pitch bend') {
      bendRaw = (m.d2 << 7) | m.d1;
      bend.set(bendRaw, { from: 'hardware' });
      /* Small field `C9`, the slot printed under the wheel. The value is the 7 bit MSB, the
         only resolution this wheel has (LSB always 0), which fits three digits.
         See lessons/page-evo.md#evo-85 */
      show(m.d2, BEND_SLOT);
      return;
    }

    if (m.kind === 'control' && m.cc === 1) {
      mod.set(m.d2, { from: 'hardware' });
      /* The panel prints C10 under this wheel, so the small field shows it; CC 1 is a
         different fact, shown beside the wheel.
         See lessons/page-evo.md#evo-86 */
      show(m.d2, MOD_SLOT);
      return;
    }

    if (m.kind === 'control' && (m.cc === 0 || m.cc === 32)) return;   // the bank pair

    if (m.kind === 'program') {
      const p = padByDigit.get(String(m.d1));
      if (p) p.flash(160);
      else d.log(`program ${m.d1} arrived and this panel draws ten of them`, 'warn');
      /* The manual's own reading for a program change: the number in the three
         digits and the channel it went on in the two. */
      show(m.d1, m.ch === null ? '' : m.ch);
      return;
    }

    if (m.kind === 'control') {
      ccSeen.add(m.cc);
      /**
       * Knob n on screen is the knob printed Cn (ROTARIES). Which slot sends a given CC
       * is unknown in the instrument, so a CC takes the first free rotary and the log
       * says it is an association. The number goes in the hover.
       * See lessons/page-evo.md#evo-87
       */
      let slot = knobCC.indexOf(m.cc);
      if (slot < 0) {
        slot = knobCC.indexOf(null);
        if (slot < 0) return;             // nine controller numbers, eight knobs
        knobCC[slot] = m.cc;
        knobs[slot].el.title = `${ROTARIES[slot]}, a fully assignable rotary. `
          + `CC ${m.cc} is following it, which is the order that number arrived `
          + 'in rather than a reading of the panel';
        d.log(`CC ${m.cc} is following ${ROTARIES[slot]}. Nothing on the wire says `
            + 'which of the eight sent it, so that is an order of arrival');
      }
      knobs[slot].set(m.d2, { from: 'hardware' });
      /* Both fields, as the manual's Default mode describes: the value and, in the small
         field, the rotary this CC was associated with by order of arrival (an inference,
         and the log says so).
         See lessons/page-evo.md#evo-88 */
      show(m.d2, slot + 1);
    }
  }

  async function open() {
    if (!navigator.requestMIDIAccess) {
      d.log('this browser has no Web MIDI, so nothing can reach this panel', 'warn');
      return false;
    }
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
      for (const p of access.inputs.values()) {
        /* `port.open()` explicitly: implicit opening is not reliable, and closed ports
           look exactly like a silent instrument.
           See lessons/page-evo.md#evo-89 */
        try { await p.open(); } catch { /* another client may hold it */ }
        p.onmidimessage = (e) => take(Array.from(e.data));
      }
      /* `Loop` follows the Evolution from here on, including a cable plugged in
         or pulled out after Listen. */
      offerLoopFor(kbd, inputNames(access), d.log);
      access.onstatechange = () => offerLoopFor(kbd, inputNames(access), d.log);
      bayMidi.attach(access);
      return true;
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return false;
    }
  }

  /* `says: WIRED`: connected words for a USB instrument, from one map in presence.mjs
     so every hardware page shares a vocabulary.
     See lessons/page-evo.md#evo-90 */
  const pres = createPresenceButton({
    of: 'MK-425C', state: 'unknown', says: WIRED,
    can: ['unknown', 'checking', 'online', 'offline'],
    press: () => d.run('listen'),
  });
  d.controls.hidden = false;
  d.controls.append(pres.el);

  d.on('listen', async () => {
    pres.set('checking');
    if (await open()) {
      /* Online means a port with this name exists, not that MIDI was granted.
         See lessons/page-evo.md#evo-91 */
      const seen = [...(access?.inputs?.values() ?? [])]
        .filter((i) => isEvolution(i.name));
      pres.set(seen.length ? 'online' : 'offline',
        seen.length ? null : 'nothing with MK-425C in its name is plugged in');
      d.log('this page only listens. Play a key, turn a knob, move either wheel, '
          + 'and the panel follows it.');
      d.log(`the global channel was measured at ${GLOBAL_CH} rather than 1, and every `
          + 'control on this keyboard can carry its own, so the channel column is '
          + 'worth watching.');
    } else {
      pres.set('offline', 'this browser would not open MIDI');
    }
    if (SELFCHECK) await d.run('check');
  });

  // ── checks ──────────────────────────────────────────────────────────────

  d.on('check', async () => {
    const ch = GLOBAL_CH - 1;
    /* The range is 48 to 72. 47 is still sent on purpose: the page has to notice a
       note below the bottom key, rather than a flag it set for itself.
       See lessons/page-evo.md#evo-92 */
    take([0x90 | ch, 48, 96]);                       // lowest key
    take([0x90 | ch, 72, 45]);                       // highest key
    take([0x90 | ch, 72, 0]);                        // a release, as this keyboard sends one
    take([0x90 | ch, 47, 80]);                       // a semitone below the keyboard
    take([0x90 | ch, 47, 0]);
    take([0xe0 | ch, 0x00, 0x40]);                   // bend, LSB 0 as measured
    take([0xb0 | ch, 1, 100]);                       // mod wheel

    /**
     * The mod wheel is the only control with slot and CC both known, so both fields
     * are asserted here, before the next messages replace them.
     * See lessons/page-evo.md#evo-93
     */
    /* The value in the large field, the panel's C number (MOD_SLOT) in the small one,
       as written in show().
       See lessons/page-evo.md#evo-94 */
    d.assert('the mod wheel fills both fields, its value and the C number on the panel',
      disp3.text().trim() === '100' && disp2.text().trim() === String(MOD_SLOT),
      `three digits "${disp3.text()}", two digits "${disp2.text()}"`);

    for (const cc of KNOB_CC_SEEN) take([0xb0 | ch, cc, 64]);

    /* A rotary fills both fields: the value, and the rotary it was read as by order
       of arrival (an inference the log names).
       See lessons/page-evo.md#evo-95 */
    d.assert('and a rotary fills both fields, the value it sent and the rotary it was read as',
      disp3.text().trim() === '64' && /^[1-8]$/.test(disp2.text().trim()),
      `three digits "${disp3.text()}", two digits "${disp2.text()}"`);

    take([0xb0 | ch, 32, 0]); take([0xb0 | ch, 0, 0]); take([0xc0 | ch, 3]);   // a button
    take([0xf8]); take([0xfe]);                      // floods

    d.assert('a visit opened nothing', SELFCHECK ? true : access === null,
      access ? 'access taken after a press' : 'no MIDI access taken');

    d.assert('the keyboard is 25 keys and it is drawn where the wire says',
      kbd.notes().length === KEYS && kbd.notes()[0] === KEY_LO,
      `${kbd.notes().length} keys from ${kbd.notes()[0]}`);

    /**
     * A release is a note on at velocity 0 with no 0x80 anywhere, so a page taking
     * 0x90 as on would hold every key.
     * See lessons/page-evo.md#evo-96
     */
    /* Counted off the painted keys: the keyboard publishes no held list. Two struck,
       the higher released, so exactly one stays down.
       See lessons/page-evo.md#evo-97 */
    const held = () => keysBox.querySelectorAll('.down').length;
    d.assert('a note on at velocity 0 releases the key it lit',
      held() === 1, `${held()} keys held after two on and one release`);

    /* A played key shows the kit keyboard's active dot, through this page's key
       overrides. Read as a computed background, after a frame: `.k .kd` has a 60 ms
       transition, so a same-tick read sees the starting value.
       See lessons/page-evo.md#evo-98 */
    {
      const note = kbd.notes()[0];
      const anyKey = keysBox.querySelector('.k');
      const offBg = getComputedStyle(anyKey.querySelector('.kd')).backgroundColor;
      kbd.lightNote(note, true);
      await new Promise((r) => setTimeout(r, 120));
      const lit = keysBox.querySelector('.k.down .kd');
      const litBg = lit ? getComputedStyle(lit).backgroundColor : '';
      kbd.lightNote(note, false);
      d.assert('a played key shows the kit keyboard’s own dot, not a changed key colour',
        !!lit && litBg !== offBg && litBg !== 'rgba(0, 0, 0, 0)',
        `the dot reads ${litBg} lit against ${offBg} at rest`);
    }

    /* Checks the picture and the warning: the drawing starts on a C, and a note
       below the bottom key is said. Not KEY_LO and a self-set flag, which graded only
       the page's own arithmetic.
       See lessons/page-evo.md#evo-99 */
    const lowName = keysBox.querySelector('.k .kn');
    d.assert('the keyboard starts on a C, where a 25 key controller starts',
      KEY_LO % 12 === 0 && kbd.notes().length === KEYS
        && /^C/.test((lowName && lowName.textContent) || ''),
      `base ${KEY_LO}, drawn as ${(lowName && lowName.textContent) || 'nothing'}, `
      + `${kbd.notes().length} keys`);
    d.assert('and a note below the bottom key is reported rather than lighting the wrong one',
      flatSaid, `said ${flatSaid}`);

    d.assert('the bend is read little endian and fourteen bit',
      bendRaw === 8192, String(bendRaw));

    // The negative half: a reader returning a plausible number for any input would
    // pass the line above.
    // See lessons/page-evo.md#evo-100
    take([0xe0 | ch, 0x7f, 0x7f]);
    d.assert('and a full scale bend reads 16383, not 255',
      bendRaw === 16383, String(bendRaw));

    d.assert('the modulation wheel is CC 1 and moved',
      mod.hardwareMoves() > 0, `${mod.hardwareMoves()} moves`);

    /* Off the knobs' own counters, so the claim is about what moved.
       See lessons/page-evo.md#evo-101 */
    const moved = knobs.filter((k) => k.hardwareMoves() > 0).length;
    d.assert('six measured controller numbers moved six of the eight rotaries',
      moved === KNOB_CC_SEEN.length, `${moved} of ${knobs.length} moved`);

    d.assert('and two rotaries were never moved, and say nothing about it',
      knobs.length - moved === 2, `${knobs.length - moved} still at rest`);

    d.assert('a program change lit a keypad button and the bank pair in front of it did not',
      !!padByDigit.get('3') && !knobCC.includes(0) && !knobCC.includes(32),
      `rotary numbers ${knobCC.filter((c) => c !== null).join(',')}`);

    d.assert('the channel heard is reported rather than assumed',
      [...chSeen].includes(GLOBAL_CH), `channels ${[...chSeen].join(',')}`);

    d.assert('no flood reached the table',
      !traffic.el.textContent.includes('F8') && !traffic.el.textContent.includes('FE'),
      `${traffic.count()} rows`);

    d.assert('every row kept its raw bytes beside the reading',
      Array.from(traffic.el.querySelectorAll('.pos-tbl-row:not(.pos-tbl-head)'))
        .every((t) => /[0-9A-F]{2}/.test(t.textContent)), `${traffic.count()} rows`);

    /**
     * Every pad, rotary and wheel takes a press. The keyboard's own pad (`.step`,
     * hidden by `.evo-keys .kbd .kpad`) is not in this count; the next assert keeps it away.
     * See lessons/page-evo.md#evo-102
     */
    const pads = [...card.querySelectorAll('.pos-pad')];
    const dials = [...card.querySelectorAll('.pos-knob')];
    const lanes = [...card.querySelectorAll('.pos-fdr')];
    const switchedOff = pads.filter((p) => p.disabled).length
      + card.querySelectorAll('[data-off]').length;
    d.assert('every control on this panel takes a press, and none is left switched off',
      pads.length === 14 && dials.length === ROTARIES.length && lanes.length === 2
        && switchedOff === 0,
      `${pads.length} pads, ${dials.length} rotaries, ${lanes.length} wheels, `
      + `${switchedOff} switched off`);

    /**
     * What the suite presses is unchanged: verify.mjs clicks `.pos-controls button,
     * .tbar-x`, and every panel control is in the card, outside that row. The selector
     * is typed once here so a new control in that row has to answer for it.
     * See lessons/page-evo.md#evo-103
     */
    const pressedBySuite = [...document.querySelectorAll('.pos-controls button, .tbar-x')];
    const hiddenPad = keysBox.querySelector('.kpad');
    d.assert('the only control the suite presses here is the presence button',
      pressedBySuite.length === 1 && pres.el.contains(pressedBySuite[0])
        && card.querySelectorAll('.pos-controls').length === 0
        && !!hiddenPad && (kbd.loopOffered() || getComputedStyle(hiddenPad).display === 'none'),
      `${pressedBySuite.length} in the row the harness clicks, `
      + `${card.querySelectorAll('.pos-pad, .pos-knob, .pos-fdr').length} panel controls `
      + `outside it, the keyboard’s own pad ${hiddenPad ? 'hidden' : 'missing'}`);

    /**
     * A hand on the panel moves the display and adds no table row, and leaves notes,
     * ccSeen and chSeen alone. Both sides are checked, with a non zero row count
     * before, so a dead panel or an empty table cannot pass.
     * See lessons/page-evo.md#evo-104
     */
    /* The pad is read on its own before the knob is touched: read together, the knob
       satisfied every clause and a dead pad passed.
       See lessons/page-evo.md#evo-105 */
    const rowsBefore = traffic.count();
    const wire = { notes, cc: ccSeen.size, ch: chSeen.size, bend: bendRaw };
    keypad.at(1, 0).button.click();               // the `2` key, an assignable button
    const byPad = { three: disp3.text().trim(), two: disp2.text().trim(),
                    rows: traffic.count() };
    knobs[4].set(99, { from: 'hand' });           // C5, turned by a hand
    d.assert('working the panel by hand moves the drawing and puts nothing on the wire',
      rowsBefore > 0 && byPad.rows === rowsBefore && traffic.count() === rowsBefore
        && byPad.three === '2' && byPad.two === String(GLOBAL_CH)
        && disp3.text().trim() === '99' && disp2.text().trim() === '5'
        && notes === wire.notes && ccSeen.size === wire.cc && chSeen.size === wire.ch
        && bendRaw === wire.bend && knobs[4].handMoves() > 0,
      `${rowsBefore} rows before and ${traffic.count()} after, `
      + `the pad read "${byPad.three}" over "${byPad.two}" and the rotary `
      + `"${disp3.text().trim()}" over "${disp2.text().trim()}", `
      + `${knobs[4].handMoves()} hand move(s) and ${knobs[4].hardwareMoves()} from the wire`);

    /**
     * The channel sentence is graded against `chSeen`: one comes from the prose path,
     * the other from the byte, so they can disagree.
     * See lessons/page-evo.md#evo-106
     */
    const logText = (document.querySelector('.pos-log') || {}).textContent || '';
    const said = logText.match(/answering on channel (\d+)/);
    d.assert('the channel this page says out loud is the channel it heard',
      !!said && Number(said[1]) === GLOBAL_CH && chSeen.has(Number(said[1]))
        && logText.includes('which is where it was measured'),
      said ? `the log says channel ${said[1]} and the wire carried ${[...chSeen].join(',')}`
           : 'the log never named a channel');

    /**
     * The panel's counts: six function buttons and five dual press labels is a 425C;
     * eight and eight is a 449C.
     * See lessons/page-evo.md#evo-107
     */
    /* Asserts there are no function buttons, so the removal stays in the run.
       See lessons/page-evo.md#evo-108 */
    d.assert('NEGATIVE CONTROL: the function buttons and their printed names are gone',
      panel.el.querySelectorAll('.evo-fn-row, .evo-fn-lab, .evo-fn-pair').length === 0,
      `${panel.el.querySelectorAll('.evo-fn-row, .evo-fn-lab, .evo-fn-pair').length} `
      + 'function button parts left on the panel');

    /**
     * Two fields read off the picture: seven bars a digit, so 21 and 14 polygons.
     * See lessons/page-evo.md#evo-109
     */
    const bars3 = disp3.svg.querySelectorAll('.pos-disp-p').length;
    const bars2 = disp2.svg.querySelectorAll('.pos-disp-p').length;
    d.assert('the display is a three digit field and a two digit one in one window',
      bars3 === 21 && bars2 === 14
        && disp3.el.parentElement === win && disp2.el.parentElement === win
        && disp3.el.classList.contains('pos-disp-bare')
        && disp2.el.classList.contains('pos-disp-bare'),
      `${bars3} bars and ${bars2} bars, both bare inside one window`);

    if (d.el.isConnected) {
      /**
       * A real pointer on a real key, scrolled into view and its rect re-read
       * (verify.mjs uses 800 by 600), aimed at the key's centre for elementFromPoint.
       * The display must stay empty: a mouse has no velocity.
       * See lessons/page-evo.md#evo-110
       */
      {
        const keyEl = keysBox.querySelector('.k');
        const keysEl = keysBox.querySelector('.keys');
        keyEl.scrollIntoView({ block: 'center' });
        const r = keyEl.getBoundingClientRect();
        const at = {
          bubbles: true, isPrimary: true, pointerId: 91, pointerType: 'mouse',
          clientX: Math.round(r.left + r.width / 2),
          clientY: Math.round(r.top + r.height / 2),
        };
        const before = handKey;
        keysEl.dispatchEvent(new PointerEvent('pointerdown', at));
        const lit = keysBox.querySelectorAll('.k.down').length;
        const three = disp3.text().trim(), two = disp2.text().trim();
        keysEl.dispatchEvent(new PointerEvent('pointerup', at));
        d.assert('a key pressed on screen lights, reaches the page and reports no velocity',
          handKey === before + 1 && lit === 1 && three === '' && two === ''
            && keysBox.querySelectorAll('.k.down').length === 0,
          `${handKey - before} press(es) reached the page, ${lit} key lit, `
          + `display "${three}" over "${two}", ${keysBox.querySelectorAll('.k.down').length} `
          + 'still down after the release');
      }

      /**
       * Both fields are backlit and the window agrees. Read as computed colour and as a
       * direction from SCHEMES, never as a hex: a backlit panel's ink is lighter than
       * its field.
       * See lessons/page-evo.md#evo-111
       */
      const resolve = (v) => {
        const probe = el('span');
        probe.style.color = v;
        d.el.append(probe);
        const out = getComputedStyle(probe).color;
        probe.remove();
        return out;
      };
      const lumOf = (css) => {
        const [r, g, b] = css.match(/\d+/g).map(Number).map((c) => c / 255);
        const f = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const glass = getComputedStyle(win).backgroundColor;
      const inkSeen = getComputedStyle(disp3.el).color;
      const wantInk = resolve(SCHEMES.backlit.ink);
      const wantBack = resolve(SCHEMES.backlit.back);
      const glows = lumOf(inkSeen) > lumOf(glass);
      d.assert('the display is the backlit kind, its window agrees, and the ink is the lit half',
        disp3.el.dataset.scheme === 'backlit'
          && disp2.el.dataset.scheme === 'backlit'
          && inkSeen === wantInk && resolve(glass) === wantBack && glows,
        `${disp3.el.dataset.scheme} · ink ${inkSeen} against ${wantInk} · `
        + `glass ${glass} against ${wantBack} · ink lum `
        + `${lumOf(inkSeen).toFixed(3)} over field ${lumOf(glass).toFixed(3)}`);

      /* Every layout claim below is read off a rendered rect, not off the code that
         filled it.
         See lessons/page-evo.md#evo-112 */

      /**
       * The rotaries read C1 to C8 left to right, sorted by rect, so the divider or a
       * flex-direction change cannot reorder them.
       * See lessons/page-evo.md#evo-113
       */
      const rotNames = knobs
        .map((k) => ({ x: k.el.getBoundingClientRect().left,
                       t: k.el.querySelector('.pos-knob-lab')?.textContent.trim() }))
        .sort((a, b) => a.x - b.x).map((o) => o.t);
      /* Against the instrument's own numbering, generated here, not against ROTARIES,
         which built the labels and so could never disagree with them.
         See lessons/page-evo.md#evo-114 */
      const scheme = Array.from({ length: 8 }, (_, i) => `C${i + 1}`);
      d.assert('the eight rotaries read C1 to C8 in left to right screen order',
        rotNames.join(' ') === scheme.join(' '), rotNames.join(' '));

      /**
       * Nothing the panel renders prints a CC number or `unbound`. The display is
       * exempt by construction (SVG polygons, no text). The detail names which half failed.
       * See lessons/page-evo.md#evo-115
       */
      const printed = card.textContent.replace(/\s+/g, ' ');
      const badCC = printed.match(/cc\s*\d+/i);
      const badWord = printed.match(/unbound/i);
      d.assert('nothing on the panel prints a controller number or the word unbound',
        !badCC && !badWord,
        badCC || badWord
          ? `found "${(badCC || badWord)[0]}" in the printing`
          : `${printed.length} characters of printing, no CC and no unbound`);

      /* The other half: the fact is rehomed, not just deleted.
         See lessons/page-evo.md#evo-116 */
      const inHover = knobs.filter((k) => /CC \d+/.test(k.el.title || '')).length;
      d.assert('and the controller number survives in the rotary’s hover',
        inHover === KNOB_CC_SEEN.length, `${inHover} hovers name a CC`);

      /**
       * Neither group carries a printed label: checked over rendered text and over the
       * elements, so a removed element cannot leave it green against nothing.
       * See lessons/page-evo.md#evo-117
       */
      const noBars = !/FUNCTION BUTTONS|ASSIGNABLE BUTTONS/i.test(printed)
        && card.querySelectorAll('.evo-bar, .pos-sec-h, .evo-join, .evo-snap-brk,'
          + ' .evo-oct-brk').length === 0;
      d.assert('neither group carries a printed label, and no connector survives',
        noBars, noBars ? 'no bars, no headings, no connectors'
          : 'a bar, a heading or a connector is still drawn');

      /* The `ASSIGNABLE` fact is in the group's hover.
         See lessons/page-evo.md#evo-118 */
      /* The detail quotes the hover rather than describing it.
         See lessons/page-evo.md#evo-119 */
      d.assert('and the word assignable survives in the keypad’s hover',
        /assignable/i.test(keypadBox.title || ''),
        keypadBox.title ? `hover reads "${keypadBox.title.slice(0, 44)}…"` : 'no hover at all');

      /**
       * Three across, four down, counted off distinct rect columns and rows, not off
       * the cols and rows handed to the grid.
       * See lessons/page-evo.md#evo-120
       */
      const cells = [...keypad.el.querySelectorAll('.pos-pad')]
        .map((b) => { const r = b.getBoundingClientRect();
                      return { x: Math.round(r.left), y: Math.round(r.top),
                               w: r.width, h: r.height,
                               /* The face, not the top label.
                                  See lessons/page-evo.md#evo-121 */
                               t: b.querySelector('.pos-pad-face').textContent.trim() }; });
      const cols = new Set(cells.map((c) => c.x)), rows = new Set(cells.map((c) => c.y));
      d.assert('the keypad is three across and four down',
        cells.length === 12 && cols.size === 3 && rows.size === 4,
        `${cells.length} buttons in ${cols.size} columns and ${rows.size} rows`);

      /**
       * Half height measured off the button, not the wrapper, with the width asserted
       * too so it is a height change and not a scale-down.
       * See lessons/page-evo.md#evo-122
       */
      const halves = cells.filter((c) => Math.abs(c.h - c.w / 2) < 1).length;
      const fullWidth = cells.filter((c) => Math.abs(c.w - 46) < 1).length;
      d.assert('the keypad buttons are half height, and only their height changed',
        halves === 12 && fullWidth === 12,
        `${cells[0].w.toFixed(0)} by ${cells[0].h.toFixed(0)} px, ${halves} of 12 half`);

      /**
       * 0 sits in the bottom row between `-` and `+`.
       * See lessons/page-evo.md#evo-123
       */
      const lastY = Math.max(...rows);
      const bottom = cells.filter((c) => c.y === lastY).sort((a, b) => a.x - b.x)
        .map((c) => c.t);
      const topRow = cells.filter((c) => c.y === Math.min(...rows))
        .sort((a, b) => a.x - b.x).map((c) => c.t);
      d.assert('and 0 sits in the bottom row between - and +, with 1 2 3 on top',
        bottom.join('') === `${MINUS}0+` && topRow.join('') === '123',
        `top "${topRow.join(' ')}", bottom "${bottom.join(' ')}"`);

      /* See lessons/page-evo.md#evo-124 */

      /**
       * The nameplate sits between the octave pair and the rotaries, its centre inside
       * the strip's content. It may be off screen at load (the strip scrolls) but cannot
       * land past the end of everything.
       * See lessons/page-evo.md#evo-125
       */
      const pr = plate.getBoundingClientRect();
      const or = oct.getBoundingClientRect();
      const rr = rot.getBoundingClientRect();
      const fr = flow.getBoundingClientRect();
      const mid = pr.left + pr.width / 2;
      d.assert('the nameplate sits between the octave pair and the rotaries, inside the strip',
        pr.width > 0 && or.right <= pr.left + 1 && pr.right <= rr.left + 1
          && mid > fr.left && mid < fr.right,
        `${(pr.left - or.right).toFixed(0)} px after the octave pair, `
        + `${(rr.left - pr.right).toFixed(0)} px before C1, centre `
        + `${(mid - fr.left).toFixed(0)} of ${fr.width.toFixed(0)} px of panel`);

      /**
       * The left column holds still while the strip scrolls. The check puts the
       * scroll back.
       * See lessons/page-evo.md#evo-126
       */
      const range = strip.scrollWidth - strip.clientWidth;
      const by = Math.min(180, range);
      const fixed0 = fixed.getBoundingClientRect().left;
      const keys0 = keysBox.getBoundingClientRect().left;
      strip.scrollLeft = by;
      const fixed1 = fixed.getBoundingClientRect().left;
      const keys1 = keysBox.getBoundingClientRect().left;
      strip.scrollLeft = 0;

      d.assert('the left column holds still while the strip scrolls',
        by > 20 && Math.abs(fixed1 - fixed0) < 0.5 && keys0 - keys1 > by - 2,
        `column moved ${(fixed1 - fixed0).toFixed(1)} px, keys moved `
        + `${(keys0 - keys1).toFixed(1)} of ${by}`);

      /**
       * The column's right border marks where scrolling starts, read as the computed
       * value, and the overflow is asserted with it so the border marks something.
       * See lessons/page-evo.md#evo-127
       */
      const bw = parseFloat(getComputedStyle(fixed).borderRightWidth);
      d.assert('the left column’s right border is where the scrolling starts',
        bw >= 1 && range > 40,
        `${bw} px of border, ${range.toFixed(0)} px of panel off screen`);

      /**
       * The left column is the panel's full depth (`align-items: stretch`, not
       * `flex-end`, which only makes the ends meet).
       * See lessons/page-evo.md#evo-128
       */
      const fh = fixed.getBoundingClientRect().height;
      const sh = strip.getBoundingClientRect().height;
      d.assert('the left column is the full depth of the panel',
        Math.abs(fh - sh) < 1.5, `${fh.toFixed(1)} px against ${sh.toFixed(1)}`);

      /**
       * The divider reaches the card's own edges, both ends asserted separately, against
       * the card's inner edge just inside its 1 px border; full content-box height can
       * still sit inside the card's padding.
       * See lessons/page-evo.md#evo-129
       */
      const cardBox = card.getBoundingClientRect();
      const cardCs = getComputedStyle(card);
      const cardTopIn = cardBox.top + parseFloat(cardCs.borderTopWidth);
      const cardBotIn = cardBox.bottom - parseFloat(cardCs.borderBottomWidth);
      const colBox = fixed.getBoundingClientRect();
      const overTop = colBox.top - cardTopIn;
      const underBot = cardBotIn - colBox.bottom;
      d.assert('the divider starts at the panel’s top edge',
        Math.abs(overTop) < 1.5,
        `${overTop.toFixed(2)} px of card between the two, card padding-top `
        + `${cardCs.paddingTop}`);
      d.assert('and it finishes at the panel’s bottom edge',
        Math.abs(underBot) < 1.5,
        `${underBot.toFixed(2)} px of card between the two, card padding-bottom `
        + `${cardCs.paddingBottom}`);

      /**
       * The air above the keyboard equals the container's own row-gap, and neither
       * child contributes a margin, so the space belongs to the container.
       * See lessons/page-evo.md#evo-130
       */
      const rowBox = row.getBoundingClientRect();
      const keysBoxR = keysBox.getBoundingClientRect();
      const air = keysBoxR.top - rowBox.bottom;
      const flowGap = parseFloat(getComputedStyle(flow).rowGap);
      const rowFoot = parseFloat(getComputedStyle(row).marginBottom);
      const keysHead = parseFloat(getComputedStyle(keysBox).marginTop);
      d.assert('the keys sit clear of the back strip, on the container’s own gap',
        air > 8 && Math.abs(air - flowGap) < 1.5 && rowFoot === 0 && keysHead === 0,
        `${air.toFixed(2)} px of air against a row-gap of ${flowGap} px · `
        + `row margin-bottom ${rowFoot}, keys margin-top ${keysHead}`);

      /**
       * One scroller: `.keys` has its own overflow-x, so a squeezed keyboard would
       * scroll inside the strip.
       * See lessons/page-evo.md#evo-131
       */
      const inner = keysBox.querySelector('.keys');
      d.assert('the keyboard does not scroll inside the strip',
        inner.scrollWidth <= inner.clientWidth + 1,
        `${inner.scrollWidth} of key in ${inner.clientWidth} px of room`);

      /**
       * Black and white keys read off the rendered picture, sorted by centre: a black
       * key's left edge is left of the white before it.
       * See lessons/page-evo.md#evo-132
       */
      const drawn = [...keysBox.querySelectorAll('.k')]
        .map((k) => { const r = k.getBoundingClientRect();
                      return { c: r.left + r.width / 2,
                               t: k.classList.contains('sharp') ? 'B' : 'W' }; })
        .sort((a, b) => a.c - b.c).map((o) => o.t).join('');
      d.assert('the keys are 15 white and 10 black, in groups of two and three',
        drawn === KEY_PATTERN,
        `${drawn.split('W').length - 1} white and ${drawn.split('B').length - 1} black, `
        + `${drawn === KEY_PATTERN ? 'in the pattern the photographs show' : drawn}`);

      /**
       * The wheels are frontmost: nothing in their column is below them.
       * See lessons/page-evo.md#evo-133
       */
      /* The row, never `.evo-wheels`: that container's rect is the column's whatever is
         inside it, so it cannot see the centring.
         See lessons/page-evo.md#evo-134 */
      const keysR = keysBox.getBoundingClientRect();
      const wheelR = wheelRow.getBoundingClientRect();
      /* The column's content bottom, not its box: the box extends 20 px further since
         the column took the card's vertical inset for its border.
         See lessons/page-evo.md#evo-135 */
      const fixedCs = getComputedStyle(fixed);
      const colFoot = fixed.getBoundingClientRect().bottom
        - parseFloat(fixedCs.paddingBottom) - parseFloat(fixedCs.borderBottomWidth);
      d.assert('the wheels are left of the keys and nothing in their column is in front of them',
        wheelR.right <= keysR.left + 1 && colFoot - wheelR.bottom < 2,
        `${(keysR.left - wheelR.right).toFixed(1)} px left of the keys, `
        + `${(colFoot - wheelR.bottom).toFixed(1)} px behind the column's content foot`);

      /**
       * Centred on both the column and the keypad above; they coincide only because
       * the keypad is the widest thing, so both are asserted.
       * See lessons/page-evo.md#evo-136
       */
      const wc = wheelR.left + wheelR.width / 2;
      const kpr = keypadBox.getBoundingClientRect();
      const fixr = fixed.getBoundingClientRect();
      /* The column's right padding is read, not typed: it is --panel-gap in shell.css.
         See lessons/page-evo.md#evo-137 */
      const colPadR = parseFloat(getComputedStyle(fixed).paddingRight);
      const offCol = Math.abs(wc - (fixr.left + (fixr.width - bw - colPadR) / 2));
      const offPad = Math.abs(wc - (kpr.left + kpr.width / 2));
      d.assert('the wheels are centred in the column and under the keypad',
        offCol < 1.5 && offPad < 1.5,
        `${offCol.toFixed(1)} px off the column's centre, `
        + `${offPad.toFixed(1)} px off the keypad's`);

      /**
       * MAX and MIN mark the ends of the travel on both lanes, two alignments. The
       * rendered text is graded, since CSS may uppercase it.
       * See lessons/page-evo.md#evo-138
       */
      const lanes = [...wheels.querySelectorAll('.pos-fdr-lane')]
        .map((l) => l.getBoundingClientRect());
      const maxEl = wheelMid.firstElementChild, minEl = wheelMid.lastElementChild;
      const maxR = maxEl.getBoundingClientRect(), minR = minEl.getBoundingClientRect();
      const topGap = Math.max(...lanes.map((l) => Math.abs(l.top - maxR.top)));
      const botGap = Math.max(...lanes.map((l) => Math.abs(l.bottom - minR.bottom)));
      const ink = (e) => {
        const t = getComputedStyle(e).textTransform;
        const s = (e.textContent || '').trim();
        return t === 'uppercase' ? s.toUpperCase() : t === 'lowercase' ? s.toLowerCase() : s;
      };
      d.assert('MAX and MIN sit at the ends of both wheels’ travel, in uppercase',
        lanes.length === 2 && topGap < 2 && botGap < 2
          && ink(maxEl) === 'MAX' && ink(minEl) === 'MIN',
        `"${ink(maxEl)}" is ${topGap.toFixed(1)} px off both lane tops, `
        + `"${ink(minEl)}" ${botGap.toFixed(1)} px off both bottoms`);

      /**
       * Both wheel names are one line and their slot numbers land level. The slot
       * numbers are asserted too, since a line count alone misses a wrap elsewhere.
       * See lessons/page-evo.md#evo-139
       */
      const wlabs = [...wheels.querySelectorAll('.pos-fdr-lab')];
      const wsubs = [...wheels.querySelectorAll('.pos-fdr-sub')];
      const lineOf = (e) => e.getBoundingClientRect().height
        / parseFloat(getComputedStyle(e).lineHeight);
      const lines = wlabs.map(lineOf);
      const subSkew = Math.abs(wsubs[0].getBoundingClientRect().top
        - wsubs[1].getBoundingClientRect().top);
      d.assert('neither wheel’s name wraps, so both slot numbers sit on one line',
        wlabs.length === 2 && wsubs.length === 2
          && lines.every((n) => n < 1.5) && subSkew < 1.5,
        `${wlabs.map((e, i) => `"${e.textContent.trim()}" ${lines[i].toFixed(2)} line(s)`).join(', ')}`
        + ` · slot numbers ${subSkew.toFixed(2)} px apart`);

      /**
       * The names overflow their 46 px wheels on purpose; the clearance between them is
       * what makes that safe, so it is asserted.
       * See lessons/page-evo.md#evo-140
       */
      const lr = wlabs.map((e) => {
        const r = e.getBoundingClientRect();
        const w = e.scrollWidth;
        const mid = r.left + r.width / 2;
        return { lo: mid - w / 2, hi: mid + w / 2, w, box: r.width };
      }).sort((a, b) => a.lo - b.lo);
      const clear = lr[1].lo - lr[0].hi;
      d.assert('both names are wider than their wheels and still do not touch',
        lr.every((x) => x.w > x.box) && clear > 4,
        `${lr.map((x) => `${x.w} px of name in a ${x.box} px box`).join(', ')} · `
        + `${clear.toFixed(1)} px of clear air between them`);

      /**
       * No ellipsis anywhere on the panel. Cut means overflowing a box that clips, so
       * the test reads computed overflow as well as scrollWidth; MODULATION is wider
       * than its wheel and drawn in full.
       * See lessons/page-evo.md#evo-141
       */
      const cut = [...card.querySelectorAll('.pos-fdr-lab, .pos-fdr-sub, .pos-pad-top, '
        + '.pos-pad-bot, .pos-pad-face, .pos-knob-lab')]
        .filter((e) => e.scrollWidth > e.clientWidth + 1
                    && getComputedStyle(e).overflowX !== 'visible')
        .map((e) => e.textContent.trim());
      d.assert('no name on the panel is cut short',
        cut.length === 0, cut.length ? `cut: ${cut.join(', ')}` : 'nothing truncated');

      /**
       * Printed names measured as contrast with effective ink: the alpha of every
       * ancestor composited over the real ground. The nameplate is the negative control,
       * asserted separately below.
       * See lessons/page-evo.md#evo-142
       */
      const alphaOf = (e) => {
        let a = 1, n = e;
        while (n && n !== document.documentElement) {
          a *= parseFloat(getComputedStyle(n).opacity) || 0;
          n = n.parentElement;
        }
        return a;
      };
      const groundOf = (e) => {
        let n = e;
        while (n) {
          const c = getComputedStyle(n).backgroundColor.match(/[\d.]+/g);
          if (c && (c.length < 4 || Number(c[3]) > 0.9)) return c.slice(0, 3).map(Number);
          n = n.parentElement;
        }
        return [11, 14, 20];
      };
      const relLum = ([r, g, b]) => {
        const f = (c) => (c / 255 <= 0.03928 ? c / 255 / 12.92 : ((c / 255 + 0.055) / 1.055) ** 2.4);
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
      };
      const seenRatio = (e) => {
        const fg = getComputedStyle(e).color.match(/[\d.]+/g).slice(0, 3).map(Number);
        const bg = groundOf(e);
        const a = alphaOf(e);
        const mix = fg.map((v, i) => v * a + bg[i] * (1 - a));
        const [hi, lo] = [relLum(mix), relLum(bg)].sort((m, n) => n - m);
        return (hi + 0.05) / (lo + 0.05);
      };
      /* The knob names (`.pos-knob-lab`) count: C1 to C10 are the only type this panel
         still prints, and without them the sweep is empty.
         See lessons/page-evo.md#evo-143 */
      const dimmedNames = [...card.querySelectorAll('.panel-sub, .panel-cap, .pos-knob-lab')]
        .filter((e) => [...e.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim()))
        .map((e) => ({ t: e.textContent.replace(/\s+/g, ' ').trim().slice(0, 16),
                       r: seenRatio(e) }));
      const rotCount = rot.querySelectorAll('.pos-knob-lab').length;
      /* Seeded so an empty list cannot throw; an empty sweep is a finding.
         See lessons/page-evo.md#evo-144 */
      const none = { t: 'nothing', r: 1 };
      const loudest = dimmedNames.reduce((a, b) => (b.r > a.r ? b : a), dimmedNames[0] || none);
      const faintest = dimmedNames.reduce((a, b) => (b.r < a.r ? b : a), dimmedNames[0] || none);
      /* The count floor is derived from the eight rotaries, so a sweep finding nothing
         fails.
         See lessons/page-evo.md#evo-145 */
      /* The rotaries are the kit's bank with its divider, not a second copy.
         See lessons/page-evo.md#evo-146 */
      /* The octave circles and the dials share a centre line, measured as centres.
         See lessons/page-evo.md#evo-147 */
      {
        const padEl = oct.querySelector('.pos-pad');
        const dialEl = rot.querySelector('.pos-knob-dial') || rot.querySelector('svg');
        const pb = padEl.getBoundingClientRect(), db = dialEl.getBoundingClientRect();
        const apart = Math.abs((pb.top + pb.height / 2) - (db.top + db.height / 2));
        d.assert('the octave circles sit on the same line as the rotary dials',
          apart <= 2,
          `their centres are ${apart.toFixed(1)} px apart`);
      }

      d.assert('the rotaries are the kit’s knob bank, with one hairline at the four four split',
        rot.classList.contains('pos-knob-bank')
          && rot.querySelectorAll('.pos-knob-div').length === 1
          && rotBank.splits().join(',') === String(ROTARY_SPLIT)
          && rot.querySelectorAll('.pos-knob').length === ROTARIES.length,
        `${rot.querySelectorAll('.pos-knob').length} knobs in a `
        + `${rot.classList.contains('pos-knob-bank') ? 'kit bank' : 'hand rolled row'} `
        + `with ${rot.querySelectorAll('.pos-knob-div').length} divider(s) at `
        + `${rotBank.splits().join(',')}`);

      /* A floor of 3.0 on the faintest name: the names name working controls. The old
         dimmed baseline (1.89:1) fails it.
         See lessons/page-evo.md#evo-148 */
      d.assert('every printed name on the panel is readable, now that what it names works',
        dimmedNames.length >= rotCount && faintest.r > 3,
        `${dimmedNames.length} names, "${loudest.t}" loudest at ${loudest.r.toFixed(2)}:1, `
        + `"${faintest.t}" faintest at ${faintest.r.toFixed(2)}:1`);

      /* The negative control: make and model name no control, so a sweep that dims by
         class must never reach them.
         See lessons/page-evo.md#evo-149 */
      const plateEl = card.querySelector('.panel-plate-l');
      const plateR = seenRatio(plateEl);
      d.assert('NEGATIVE CONTROL: the nameplate names no control and is not dimmed',
        plateR > 3 && !plateEl.hasAttribute('data-off'),
        `"${plateEl.textContent.trim()}" at ${plateR.toFixed(2)}:1, `
        + `against ${loudest.r.toFixed(2)}:1 for the loudest printed name`);

      /**
       * No control wears the refusal cursor: nothing here refuses a press. Pads, knobs
       * and fader lanes all, since shell.css sets the rule in three declarations.
       * See lessons/page-evo.md#evo-150
       */
      const cursors = {
        pad: getComputedStyle(card.querySelector('.pos-pad')).cursor,
        dial: getComputedStyle(card.querySelector('.pos-knob-dial')).cursor,
        lane: getComputedStyle(card.querySelector('.pos-fdr-lane')).cursor,
      };
      d.assert('every control on this panel shows a working cursor and none shows a refusal',
        cursors.pad === 'pointer' && cursors.dial === 'ns-resize'
          && cursors.lane === 'ns-resize',
        Object.entries(cursors).map(([k, v]) => `${k} ${v}`).join(', '));

      /**
       * No readout declared and no empty box painted: tested on the rendered height, so
       * it holds whether the shell omits the element or hides it.
       * See lessons/page-evo.md#evo-151
       */
      const ro = d.el.parentElement.querySelector('.pos-readout')
        || document.querySelector('.pos-readout');
      const roH = ro ? ro.getBoundingClientRect().height : 0;
      d.assert('no readout, and no empty box painting an edge where it was',
        __demo.readoutOptOut === true && roH === 0,
        ro ? `a .pos-readout is present and ${roH} px tall, hidden ${ro.hasAttribute('hidden')}`
           : 'no .pos-readout element at all');

      /* The panel scrolls in its own box, never the document. Measured on this
         project at 390 px as 141 px of page overflow when it does not. */
      d.assert('the panel scrolls sideways inside its own box, not the page',
        document.documentElement.scrollWidth <= window.innerWidth + 1,
        `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);
    }

    d.assert('no secret in this page', !location.href.includes('token'));

    /* `Loop` follows the Evolution, and what comes back round on this page is
       the lamp: `handKey` counts every note this page's own `onDown` lit. */
    await checkEvolutionLoop(d, {
      keys: kbd, heard: () => handKey,
      ports: (names) => offerLoopFor(kbd, names, d.log), real: () => inputNames(access),
    });

    /* On this panel the row comes back with `Loop` alone; measured, since the rule is a `:has`.
       See lessons/page-evo.md#evo-152 */
    offerLoopFor(kbd, ['MK-425C USB MIDI Keyboard'], d.log);
    const padRow = keysBox.querySelector('.kpad');
    const shownBtns = [...padRow.querySelectorAll('button')]
      .filter((b) => b.getClientRects().length > 0).map((b) => b.textContent.trim());
    const rowShown = getComputedStyle(padRow).display !== 'none';
    offerLoopFor(kbd, inputNames(access), d.log);
    const rowGone = getComputedStyle(padRow).display === 'none' || kbd.loopOffered();
    d.assert('with the Evolution here the keys grow a row holding Loop and no other button',
      rowShown && shownBtns.length === 1 && shownBtns[0] === 'Loop' && rowGone,
      `row ${rowShown ? 'drawn' : 'hidden'} holding ${JSON.stringify(shownBtns)}, and hidden again `
      + `${rowGone ? 'once' : 'NOT once'} the ports are back to what is really plugged in`);

    await checkMidiNode({ assert: d.assert, log: d.log, page: bayMidi, slug: 'evo' });
  });

  d.ready();
</script>

<meta property="og:title" content="Social">
<meta property="og:description" content="Pictures and reels the site makes of itself. Download one and post it.">
<meta property="og:url" content="https://positron.studio/social/">

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON social</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The pages as cards, drawn as /kit/ draws its parts. */
  .soc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .soc-card {
    display: flex; flex-direction: column; gap: 6px; min-height: 110px;
    padding: var(--inset, 12px); background: var(--card);
    border: var(--edge, 1px solid var(--line)); border-radius: var(--r, 4px);
    color: inherit; text-decoration: none;
  }
  .soc-card:hover { border-color: var(--fg); }
  .soc-card-t { margin: 0; font-size: 15px; font-family: var(--mono); }
  .soc-card-s { margin: 0; color: var(--dim); font-size: 13.5px; }
  .soc-card-t, .soc-card-s { text-wrap: balance; }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { DEMOS, targetOf } from '/manifest.mjs';

  // /social/: pictures and reels made by the site itself, for Instagram,
  // YouTube and GitHub. One page per piece, listed from the manifest's
  // `social/<name>` rows, as /kit/ lists its parts.
  const d = mount({ name: 'social', what: 'Pictures and reels the site makes of itself, to download and post.',
    readout: null, showLog: false, index: '/', indexLabel: 'positron' });

  const rows = DEMOS.filter((r) => r.name.startsWith('social/') && r.built);
  const grid = el('div', 'soc-cards');
  for (const r of rows) {
    const a = el('a', 'soc-card', '', { href: targetOf(r) });
    // a manifest `one` line is lowercase with no stop; a card reads as a sentence
    const say = (r.one || '').replace(/^./, (c) => c.toUpperCase()).replace(/([^.])$/, '$1.');
    a.append(el('h3', 'soc-card-t', r.title || r.name.slice(7)), el('p', 'soc-card-s', say));
    grid.append(a);
  }
  d.el.append(grid);

  if (SELFCHECK) {
    d.assert('every built social row has a card', grid.children.length === rows.length && rows.length > 0,
      `${grid.children.length} card(s) for ${rows.length} row(s)`);
  }
  d.ready();
</script>

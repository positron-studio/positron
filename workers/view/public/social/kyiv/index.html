<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="Every hour">
<meta property="og:description" content="Every hour of the war in Kyiv as a square, black with an air-raid alert and blue without, for a story, a feed post or a share card">
<meta property="og:url" content="https://positron.studio/social/kyiv/">
<meta property="og:image" content="https://positron.studio/og/site-d57a2c73.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create live, interactive experiences, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-3c00f93a.png">
<link rel="manifest" href="/icons/manifest-1f3e8adf.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON social/kyiv</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  .sd-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  /* the picture at its own shape, as tall as a screen allows */
  .sd-pic { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; border: 1px solid var(--line); border-radius: var(--r, 4px); }
</style>
<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { drawDays, cellAt } from '/shell/day-grid.mjs';
  import { font } from '/shell/reel.mjs';

  // Every hour of the war in Kyiv as one square, a week a row: black when an air-raid alert sounded in it, the flag's
  // blue when none did, the ground where nothing was recorded. A still for an Instagram story or a share card.
  const RAID = '#000000', QUIET = '#0057b7', GROUND = '#161616', INK = '#e6e6e6', DIM = '#8b93a1';
  // a week a row on the feed post as well, so each clock hour keeps its column and the nights line up
  const FORMATS = [['IG story', 1080, 1920], ['IG post', 1080, 1350, { cols: 168 }], ['OG card', 1200, 630]];

  const d = mount({ name: 'social/kyiv', what: 'Every hour of the war in Kyiv as a square, black when the air-raid sirens sounded and blue when they did not.',
    readout: { days: '', hours: '', 'with an alert': '', square: 'px' }, index: '/social/', indexLabel: 'social' });
  const h1 = d.head.querySelector('.pos-name');
  if (h1) h1.textContent = 'Every hour';

  const data = await (await fetch('/resources/ua-alerts/kyiv-days.json')).json();
  const sans = getComputedStyle(document.documentElement).getPropertyValue('--sans').trim() || 'sans-serif';
  await Promise.all([font(600, 64), `400 32px ${sans}`].map((f) => document.fonts.load(f).catch(() => {})));
  const hours = data.hours, N = hours.length, alerts = [...hours].filter((c) => c === data.raid).length;

  // the date and Kyiv clock hour of hour i, counted from midnight on the first day
  const DAY = 86400e3, t0 = Date.parse(`${data.start}T12:00:00Z`);
  // digits only, set in the mono face, so the title keeps one width while it counts
  const hourOf = (i) => `${new Date(t0 + Math.floor(i / 24) * DAY).toISOString().slice(0, 10)} ${String(i % 24).padStart(2, '0')}:00`;
  const wrap = (ctx, text, width) => text.split(' ').reduce((ls, word) => {
    const t = ls.at(-1) ? `${ls.at(-1)} ${word}` : word;
    if (ctx.measureText(t).width > width && ls.at(-1)) ls.push(word); else ls[ls.length - 1] = t;
    return ls;
  }, ['']);
  // what one row holds, said in words: 168 hours is a week, 336 two weeks
  const rowIs = (cols) => { const days = cols / 24, weeks = days / 7, n = ['', 'one', 'two', 'three', 'four'];
    return Number.isInteger(weeks) && n[weeks] ? `${n[weeks]} week${weeks > 1 ? 's' : ''}` : `${days} days`; };
  // The band above the grid: the date and hour as the title, then what this is and what a square and a row are.
  function title(ctx, w, room, cols, at) {
    const k = Math.min(w, room * 3.6) / 1080, x = Math.round(72 * k), TS = Math.round(64 * k), SS = Math.round(32 * k), LH = Math.round(44 * k);
    const say = `Air raids in Kyiv.\nEach square is an hour and each row ${rowIs(cols)}.\nVisualized by positron.studio`;
    ctx.font = `400 ${SS}px ${sans}`;
    const lines = say.split('\n').flatMap((part) => wrap(ctx, part, w - 2 * x)), tall = TS + Math.round(28 * k) + lines.length * LH;
    let y = Math.round((room - tall) / 2) + TS;
    // the hour in the flag's blue, and gone while an alert sounds in it
    if (hours[at] !== data.raid) { ctx.fillStyle = QUIET; ctx.font = font(600, TS); ctx.fillText(hourOf(at), x, y); }
    y += Math.round(28 * k);
    ctx.fillStyle = DIM; ctx.font = `400 ${SS}px ${sans}`;
    for (const ln of lines) { y += LH; ctx.fillText(ln, x, y - Math.round(12 * k)); }
  }

  // One layout and one drawn grid per size; a frame copies the first `shown` hours off it, whole rows then the part row.
  const sheets = new Map();
  function sheet(w, h) {
    const key = `${w}x${h}`;
    if (sheets.has(key)) return sheets.get(key);
    // the band takes about a sixth of a story's height and a fifth of a card's, whatever the grid leaves above it besides
    const band = Math.round(w > h ? h * 0.22 : Math.min(w, h * 0.5625) * 0.3);
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const opts = FORMATS.find(([, fw, fh]) => fw === w && fh === h)?.[3] ?? {};
    let g = drawDays(off.getContext('2d'), { days: hours, w, h: h - band, y: band, group: 24, gap: 0, edge: 'bottom', ...opts, colours: { 1: RAID, 0: QUIET, 2: GROUND } });
    g = { ...g, y0: g.y0 + band };
    const s = { off, g };
    sheets.set(key, s);
    return s;
  }
  function compose(ctx, w, h, shown) {
    const { off, g } = sheet(w, h);
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, w, h);
    const rowY = (j) => (j >= g.rows ? h : cellAt(g, 0, j * g.cols).y);
    const r = Math.floor(shown / g.cols), c = shown % g.cols, top = g.y0;
    if (r > 0) ctx.drawImage(off, 0, top, w, rowY(r) - top, 0, top, w, rowY(r) - top);
    if (c > 0) { const e = cellAt(g, 0, r * g.cols + c - 1), xe = e.x + e.w, y = rowY(r), hh = rowY(r + 1) - y; ctx.drawImage(off, 0, y, xe, hh, 0, y, xe, hh); }
    title(ctx, w, g.y0, g.cols, Math.max(0, Math.min(N, shown) - 1));
    return g;
  }

  // the still
  let fmt = 0, g = null;
  const canvas = el('canvas', 'sd-pic');
  canvas.setAttribute('aria-label', `${N} hours in Kyiv, ${alerts} with an air-raid alert`);
  const draw = () => {
    const [, w, h] = FORMATS[fmt];
    canvas.width = w; canvas.height = h;
    g = compose(canvas.getContext('2d'), w, h, N);
    d.set('days', data.days.length); d.set('hours', N); d.set('with an alert', alerts); d.set('square', g.cell);
  };
  const names = FORMATS.map(([n, w, h]) => `${n} ${w} x ${h}`);
  const pick = (i) => { fmt = (i + FORMATS.length) % FORMATS.length; fmtPick.show(names[fmt], fmt); draw(); };
  const fmtPick = createPicker({ what: 'size', prev: () => pick(fmt - 1), next: () => pick(fmt + 1), onPick: pick });
  fmtPick.options(names, fmt);
  const save = async () => {
    const name = `kyiv-alerts-${FORMATS[fmt][1]}x${FORMATS[fmt][2]}`;
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
    const a = el('a', '', '', { href: URL.createObjectURL(blob), download: `${name}.png` });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    d.log(`saved ${name}`);
  };
  const dl = createButtonGroup({ buttons: [{ id: 'save', label: 'download', onPress: save }] });
  const row = el('div', 'sd-row');
  row.append(fmtPick.el, dl.el);
  d.el.append(canvas, row);
  draw();


  window.__demo.hours = { layout: () => g, size: pick, canvas };

  if (SELFCHECK) {
    d.assert('every day since 24 February 2022 is in the data, 24 hours of each', data.start === '2022-02-24' && data.days.length > 1700 && /^[012]+$/.test(hours) && N === 24 * data.days.length, `${data.days.length} days to ${data.end}`);
    const ctx = canvas.getContext('2d');
    const px = (c2d, gg, k) => { const c = cellAt(gg, 0, k); return c2d.getImageData(c.x + 1, c.y + 1, 1, 1).data.slice(0, 3).join(','); };
    const blueAt = hours.indexOf('0'), blackAt = hours.indexOf('1');
    d.assert('a quiet hour is blue and an alert hour black', px(ctx, g, blueAt) === '0,87,183' && px(ctx, g, blackAt) === '0,0,0', `hour ${blueAt + 1} and ${blackAt + 1}`);
    d.assert('the title is the last hour, one width all the way', hourOf(N - 1) === `${data.end} 23:00` && hourOf(0) === '2022-02-24 00:00'
      && Array.from({ length: 50 }, (_, j) => hourOf(Math.floor(j * (N - 1) / 49)).length).every((l) => l === 16), hourOf(N - 1));
    for (const [i, [n, w, h]] of FORMATS.entries()) {
      pick(i);
      const last = cellAt(g, 0, g.cols * g.rows - 1);
      d.assert(`the size picker names the ${n}`, fmtPick.el.textContent.startsWith(`‹${names[i]}`) && fmtPick.select.selectedIndex === i, fmtPick.el.textContent.slice(0, 24));
      d.assert(`the ${n} holds every hour, whole days a row, edge to edge on the bottom`, g.pages === 1 && g.cols % 24 === 0 && g.gap === 0 && g.cols * g.rows >= N
        && last.x + last.w === w && last.y + last.h === h && g.y0 > 0 && rowIs(g.cols) === (g.cols === 168 ? 'one week' : 'two weeks'), `${g.cols} x ${g.rows}, ${g.cell} px, ${rowIs(g.cols)}`);
    }
    pick(0);
    // the stamp rule, drawn off screen at a quiet hour and at an alert hour
    const v = document.createElement('canvas'); v.width = 1080; v.height = 1920;
    const vc = v.getContext('2d'), top = sheet(1080, 1920).g.y0;
    const titlePx = (k) => { compose(vc, 1080, 1920, k + 1); const im = vc.getImageData(0, 0, 1080, top).data; let blue = 0; for (let q = 0; q < im.length; q += 4) if (im[q] === 0 && im[q + 1] === 87 && im[q + 2] === 183) blue++; return blue; };
    d.assert('the hour is blue, and gone in an alert hour', titlePx(blueAt) > 200 && titlePx(blackAt) === 0, `${titlePx(blueAt)} blue px in a quiet hour, ${titlePx(blackAt)} in an alert hour`);
  }
  d.ready();
</script>

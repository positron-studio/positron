<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Play alone at the top left. No status label: what the board says goes to the log.
     See lessons/page-remote.md#remote-1 */
  .cc-top { display: flex; align-items: center; gap: 12px; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createMidiDevices } from '/shell/midi-devices.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { announceOn } from '/shell/announce.mjs';
  import { createLease } from '/shell/openers.mjs';
  import { BOARD_SITE, boardPort, boardGraph, addBoardNode } from '/shell/graph-registry.mjs';
  import { readPatch } from '/shell/circuit-patch.mjs';
  import { CIRCUIT_CC } from '/shell/circuit-cc.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';

  // Keys and a patch selector playing the Circuit on the Pi (room `studio-1-circuit`, gate
  // rig/board/inputs.mjs `midiVerdict`). Nothing here can write its flash: notes, CC 80 to 87, program
  // change 0 to 63 (RAM), one dump request SysEx. Board made on Play; a check sends nothing without ?board=1.
  // See lessons/page-remote.md#remote-2
  const CAM_KEY = new URLSearchParams(location.search).get('cam') || '';
  const d = mount({ name: 'Circuit on Pi', what: '', joined: false,
    // An even number of cells (`createReport` throws on odd). `key to sound` is the median of the
    // last twenty presses and its hover adds up the parts; `network` is a message there and back
    // with no sound in it. The camera's path is a word in `path`.
    // See lessons/page-remote.md#remote-3
    readout: { 'key to sound': 'ms', network: 'ms', cushion: 'ms', path: '',
      ...(CAM_KEY ? { 'cam fps': '', 'cam lag': 'ms' } : {}) }, index: '/', indexLabel: 'positron' });
  conceptNav('remote/circuit');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const INPUT = 'circuit';
  const INPUT_ROOM = `${ROOM}-${INPUT}`;
  const MAY_PLAY = !SELFCHECK || q.get('board') === '1';
  // Relay or direct, as /remote/piano/: the relay unless `?path=direct`. Direct is data channels to
  // the Pi (rig/board/rtc.mjs): `ctl` for notes, CC, patch questions and the lease, `pcm` for sound,
  // `cam` with the camera key. No channel within 3 s, or one that drops, and the relay carries all.
  // See lessons/page-remote.md#remote-4
  let mode = q.get('path') === 'direct' ? 'direct' : 'relay';
  // 10 ms frames on the direct path, as 030 (plan-away-webrtc.md section 9 P3).
  const DIRECT_FRAME_MS = q.get('frame') === '20' ? 20 : 10;
  // Synth 1 is channel 1 (plans/plan-circuit-model12.md §3.1). The gate allows
  // program change on 1 and 2 only, patches 0 to 63.
  const CH = 1;
  // Only the patch a synth is holding can be read, so the cell shows the name the Circuit sends back
  // once picked. These are slot labels read off this desk's Circuit with `__demo.scanNames()`; a
  // renamed slot shows its new name the first time it is played.
  // See lessons/page-remote.md#remote-5
  const SCANNED = ['Aciiid', '', 'LFO disko', 'Meeelow', 'Not FM', 'Filth Sense', 'Filthres', 'Flamed', 'Good Lead',
    'Filtered Lead', 'Saw Striker', 'Alive', 'Aggie', 'Frosted Glass', 'Gaston', 'K-plunk', 'Smooth Pad', 'Twins',
    'Weird Pad', 'Vel FilterFun', 'Movt4', 'Frog Steps', 'Organ-to-ring', 'Ringy Patch', 'Wobber Blobber', 'Sick Lead',
    'Shimmer Atmo', 'noiseFX', 'Sine Pop', 'StarScreamer', 'Wobble Chord', 'Yaw', 'Grime Square', 'SyncBass',
    'BlogHouse Bass', 'Bubble Bass', 'Smoov Bass', 'WigBaz', 'Yo!', 'Bass Grease', 'Sub Dub', 'Phone Lead',
    'Funkth Lead', 'Game Over Arp', "Dev's Pad", 'Noisey Lead', 'Harsh Wiggle', 'STB Dance', 'PWR Pad', 'ResKey',
    'SpooKey', 'Unstable Pad', 'Talk to Me', 'Eskimo', 'Betanmoan', 'Siney Tinez', 'Woo-z', 'SpaceRadio', 'Kick!',
    'Space Perc', 'Sawdet', 'Breathe', 'Fading Pulse', 'Alien X Talk'];
  const PATCHES = Array.from({ length: 64 }, (_, i) => SCANNED[i] || `Patch ${i + 1}`);
  // The starting patch is Gaston, by number: slot 14 (0 based, "Patch 15" on the Circuit). Names
  // are readable only for the patch held, so it is written here; if Gaston moves, rescan with
  // `await __demo.scanNames()` and change the number.
  // See lessons/page-remote.md#remote-6
  const START_PATCH = { at: 14, name: 'Gaston' };
  if (START_PATCH.at != null) PATCHES[START_PATCH.at] = START_PATCH.name;

  // ── the bay ─────────────────────────────────────────────────────────────
  // The Pi's ids are boardGraph's: `pi-1:circuit:midi-in` (announced while the
  // Circuit's USB MIDI is plugged into the Pi) and `pi-1:circuit:audio-out`.
  const S = 'web';
  const id = (n, p) => `${S}:${n}:${p}`;
  const CIRCUIT_IN = boardPort(INPUT, 'midi-in'), CIRCUIT_AUDIO = boardPort(INPUT, 'audio-out');
  const CIRCUIT_VALUE = boardPort(INPUT, 'value-in');
  const bay = createBay();
  // The browser's nodes are /shell/nodes.mjs's, each port labelled
  // `node:port`; the Circuit's is boardGraph's, so it is drawn here.
  addNodes(bay, S, ['keys', 'patch'], { portLabel: 'node:port' });
  bay.addNode({ id: `${BOARD_SITE}:${INPUT}`, kind: 'device', label: 'Circuit on the Pi', place: ROOM });
  // The eight macro knobs, each a node: CC 80 to 87 on the synth's channel (Synth 1 on 1, measured
  // off the Circuit; circuit-cc.mjs). The board's gate already lets these through (`SYNTH_CC`).
  // See lessons/page-remote.md#remote-7
  const MACROS = CIRCUIT_CC.filter((r) => r.ch === '1/2' && r.sec === 'Macro Knob')
    .map((r, i) => ({ n: i + 1, cc: r.cc, name: `macro ${i + 1}`, pos: `MacroKnob${i + 1}_Position` }));
  if (MACROS.length !== 8 || MACROS.some((m, i) => m.cc !== 80 + i)) throw new Error('the macro knobs are CC 80 to 87 and the table says otherwise');
  addNodes(bay, S, [...MACROS.map((m) => ({ name: 'knob', as: `knob-macro-${m.n}`, label: `macro ${m.n}` })), 'scope', 'speaker'],
    { portLabel: 'node:port' });

  let board = null, armed = false, lease = null;
  let sent = { note: 0, cc: 0, program: 0 }, refused = 0, lastRefusal = '', lastProgram = null;
  const midi = (bytes) => (armed && board ? board.send({ type: 'midi.send', bytes }) : false);
  // Control changes: the board's gate decides what reaches the Circuit, and this page refuses too:
  // a CC is exactly three bytes, 0xB0 on this page's channel and two data bytes of 0 to 127.
  // See lessons/page-remote.md#remote-8
  const isPlainCc = (b) => Array.isArray(b) && b.length === 3 && (b[0] & 0xF0) === 0xB0 && (b[0] & 0x0F) === CH - 1
    && Number.isInteger(b[1]) && b[1] >= 0 && b[1] <= 127 && Number.isInteger(b[2]) && b[2] >= 0 && b[2] <= 127;
  let ccRefusedHere = 0;
  const ccSent = new Map();       // controller -> how many went out, for a driver
  // At most 30 a second per controller, and the last value always goes: a
  // value that arrives inside the gap waits for the gap's end, and a newer one
  // overtakes it rather than queueing behind it.
  const CC_GAP_MS = Math.ceil(1000 / 30);
  const ccq = new Map();          // controller -> { v, last, timer }
  function sendCc(cc) {
    const q = ccq.get(cc);
    if (!q || q.v == null) return;
    const bytes = [0xB0 | (CH - 1), cc, q.v];
    q.v = null; q.last = performance.now();
    if (!isPlainCc(bytes)) { ccRefusedHere++; d.log(`not sent: ${bytes.join(' ')} is not a three byte control change`, 'warn'); return; }
    if (midi(bytes)) { sent.cc++; ccSent.set(cc, (ccSent.get(cc) || 0) + 1); }
  }
  function queueCc(cc, v) {
    if (!armed) return;
    const q = ccq.get(cc) ?? { v: null, last: -Infinity, timer: null };
    ccq.set(cc, q);
    q.v = Math.round(v);
    if (q.timer) return;
    const due = q.last + CC_GAP_MS - performance.now();
    if (due <= 0) sendCc(cc);
    else q.timer = setTimeout(() => { q.timer = null; sendCc(cc); }, due);
  }
  function dropCc() { for (const q of ccq.values()) { clearTimeout(q.timer); q.timer = null; q.v = null; } }
  // What reaches the Circuit's midi-in leaves for the board, and only once armed.
  function toCircuit(ev) {
    if (!armed) return;
    if (ev.cls === 'note') {
      if (ev.d2 > 0) pressed(ev.d1);
      if (midi(ev.d2 > 0 ? [0x90 | (CH - 1), ev.d1, ev.d2] : [0x80 | (CH - 1), ev.d1, 0])) sent.note++;
    } else if (ev.cls === 'cc') {
      queueCc(ev.d1, ev.d2);
    } else if (ev.cls === 'program') {
      if (ev.d1 < 0 || ev.d1 > 63) return;
      lastProgram = [0xC0 | (CH - 1), ev.d1];
      if (midi(lastProgram)) { sent.program++; d.log(`Synth 1 on ${PATCHES[ev.d1]}`); }
    }
  }
  const PORTS = [
    { id: CIRCUIT_IN, dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'program'], deliver: toCircuit },
    { id: CIRCUIT_AUDIO, dir: 'out', medium: 'audio' },
    // A page side port on the Circuit's node: a knob's value arrives here and
    // leaves for the Pi as its macro's control change.
    { id: CIRCUIT_VALUE, dir: 'in', medium: 'value', shape: { of: 'param', names: MACROS.map((m) => m.name) },
      deliver: (e) => {
        const m = e?.of === 'param' && MACROS.find((x) => x.name === e.name);
        if (!m || !Number.isFinite(e.v)) return;
        queueCc(m.cc, Math.max(0, Math.min(127, e.v)));
      } },
  ];
  for (const p of PORTS) bay.addPort({ label: p.id.split(':').slice(1).join(':'), ...p });
  const LINKS = [
    [id('keys', 'midi-out'), CIRCUIT_IN],
    [id('patch', 'midi-out'), CIRCUIT_IN],
    ...MACROS.map((m) => [id(`knob-macro-${m.n}`, 'value-out'), CIRCUIT_VALUE]),
    [CIRCUIT_AUDIO, id('scope', 'audio-in')],
    [CIRCUIT_AUDIO, id('speaker', 'audio-in')],
  ];
  for (const [from, to] of LINKS) {
    const r = bay.link(from, to);
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
  }

  // The scope scales to the sound: the span widens at once to the frame's loudest sample (at 90% of
  // the height) and narrows over about 2 s. Clipping is separate: a full scale sample is logged once.
  // See lessons/page-remote.md#remote-9
  const WINDOW = 512, SPAN_MIN = 0.02, SPAN_FALL = 0.992;
  let span = 0.25, clipped = 0, clipSaid = 0;
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  let analyser = null, buf = null, level = 0;
  function frame() {
    if (analyser) {
      analyser.getFloatTimeDomainData(buf);
      let i0 = 0, hi = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      for (const v of buf) { const a = v < 0 ? -v : v; if (a > hi) hi = a; }
      level = hi;
      span = Math.max(hi / 0.9, span * SPAN_FALL, SPAN_MIN);
      if (hi >= 0.999) {
        clipped++;
        if (performance.now() - clipSaid > 5000) { clipSaid = performance.now(); d.log(`The Circuit's sound reaches full scale and clips (${clipped} frames so far); turn its volume down`, 'warn'); }
      }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / span))), reason: '', name: '' });
    }
    requestAnimationFrame(frame);
  }

  // The lags. Key to sound per press: the first 1 ms block over ONSET and three times the 30 ms
  // before it, on the speaker's clock. Also network, cushion and path; the Pi's capture (JACK 512 x 3
  // at 48 kHz, 20 ms frames) is what is left over.
  // See lessons/page-remote.md#remote-10
  const KEEP_MS = 200, ONSET = 0.02, WAIT_MS = 1500;
  const env = [];          // { at, peak } per 1 ms block, performance time
  const pending = [];      // presses still waiting for their sound
  const lags = [];         // the last 20 measured lags
  let lastLag = null, readUpTo = 0;
  function pressed(note) {
    const at = performance.now();
    pending.push({ note, at });
    while (pending.length > 8) pending.shift();
  }
  function listen() {
    if (!analyser || !buf) return;
    const ctx = board.ctx();
    const ts = ctx.getOutputTimestamp?.();
    if (!ts || !ts.performanceTime) return;
    analyser.getFloatTimeDomainData(buf);
    const sr = ctx.sampleRate, N = buf.length, blk = Math.round(sr / 1000);
    // the buffer's last sample is the context's current time
    const tEnd = ts.performanceTime + (ctx.currentTime - ts.contextTime) * 1000;
    const t0 = tEnd - (N / sr) * 1000;
    for (let i = 0; i + blk <= N; i += blk) {
      const at = t0 + (i / sr) * 1000;
      if (at <= readUpTo) continue;
      let pk = 0;
      for (let j = i; j < i + blk; j++) { const a = buf[j] < 0 ? -buf[j] : buf[j]; if (a > pk) pk = a; }
      env.push({ at, peak: pk });
      readUpTo = at;
      // an onset: over ONSET and three times the 30 ms before it
      let before = 0;
      for (let k = env.length - 31; k < env.length - 1; k++) if (k >= 0 && env[k].peak > before) before = env[k].peak;
      if (pk > ONSET && pk > before * 3) {
        const p = pending.find((x) => x.at < at);
        if (p) {
          pending.splice(pending.indexOf(p), 1);
          lastLag = at - p.at;
          lags.push(lastLag); if (lags.length > 20) lags.shift();
        }
      }
    }
    const now = performance.now();
    while (env.length && env[0].at < now - KEEP_MS) env.shift();
    for (let k = pending.length - 1; k >= 0; k--) if (now - pending[k].at > WAIT_MS) pending.splice(k, 1);
  }
  const cell = (k, v) => d.set(k, v);
  function lagCells() {
    const st = board?.stats();
    const med = lags.length ? [...lags].sort((x, y) => x - y)[lags.length >> 1] : null;
    cell('key to sound', med == null ? '' : Math.round(med));
    cell('network', st?.rttMs == null ? '' : Math.round(st.rttMs));
    cell('cushion', st?.bufferedMs == null ? '' : Math.round(st.bufferedMs));
    hint('key to sound', `key down to sound out of the speaker\nmedian of the last 20 presses\n${partsLine(med, st)}`);
  }
  // Each cell's hover: two or three short lines. `key to sound` adds up its parts; the Pi's part is
  // what is left after `network`, the cushion and the speaker.
  // See lessons/page-remote.md#remote-11
  function partsLine(med, st) {
    const c = board?.ctx();
    const out = c ? ((c.outputLatency || 0) + (c.baseLatency || 0)) * 1000 : null;
    if (med == null || st?.rttMs == null || st?.bufferedMs == null || out == null) return 'network, the Pi, cushion and speaker';
    const pi = med - st.rttMs - st.bufferedMs - out;
    return `network ${Math.round(st.rttMs)}, Pi ${Math.round(pi)}, cushion ${Math.round(st.bufferedMs)}, speaker ${Math.round(out)}`;
  }
  function hint(k, text) {
    for (const c of d.readoutEl?.querySelectorAll('.pos-cell') || []) if (c.querySelector('.pos-k')?.textContent === k) c.title = text;
  }
  hint('key to sound', 'key down to sound out of the speaker\nmedian of the last 20 presses');
  hint('network', 'a message to the Pi and back, no sound in it\nabout this much of key to sound is the network');
  hint('cushion', 'sound held in this browser\nso a late frame does not leave a gap');
  hint('path', 'direct is a WebRTC link to the Pi\nrelay is the Cloudflare room');
  function lagFrame() {
    listen();
    requestAnimationFrame(lagFrame);
  }
  setInterval(() => { if (board) lagCells(); }, 250);

  // The patch selector, its own node. It opens empty; on play and after each change the page asks
  // for the patch Synth 1 holds (Current Patch Dump Request) and shows its name.
  // See lessons/page-remote.md#remote-12
  let patchAt = null, patchName = '', nameReads = 0, nameMisses = 0, lastDump = null;
  let nameBusy = false, nameAgain = false;
  // Every name the Circuit has sent, by slot, so a patch shows its name the
  // moment it is picked once it has been read. Kept for the page's life only:
  // a name is only ever learned by selecting that patch.
  const names = new Map();
  let stale = 0;
  const same = (a, b) => !!a && !!b && a.length === b.length && a.every((v, i) => v === b[i]);
  // 📄 Programmer's Reference Guide 1.3 p13, nine bytes, location 00 is Synth 1.
  const DUMP_REQUEST = Object.freeze([0xF0, 0x00, 0x20, 0x29, 0x01, 0x60, 0x40, CH - 1, 0xF7]);
  function showName(text) { patchName = text; patchPick.show(text, patchAt ?? undefined); }
  async function askName(tries = 0) {
    const asked = patchAt;
    // Byte 6 is read before anything is sent: 0x40 is the dump request, and 00
    // and 01 are the two messages that replace a patch.
    if (DUMP_REQUEST.length !== 9 || DUMP_REQUEST[6] !== 0x40) { d.log('the patch request is not the nine byte dump request, so it was not sent', 'warn'); return; }
    const r = await board.ask({ type: 'midi.send', bytes: [...DUMP_REQUEST] }, 'midi.patch', 1500);
    if (!armed) return;
    if (!r) { nameMisses++; showName(''); d.log('The Pi did not answer the patch name request within 1.5 s', 'warn'); return; }
    if (!r.ok) { nameMisses++; showName(''); d.log(`No patch name, ${r.why}`, 'warn'); return; }
    let p;
    try { p = readPatch(Uint8Array.from(r.bytes)); }
    catch (e) { nameMisses++; showName(''); d.log(`The Circuit's answer did not read as a patch, ${e.message}`, 'warn'); return; }
    if (p.command !== 0x00 || p.writesFlash || p.slot !== CH - 1) { nameMisses++; showName(''); d.log(`The answer was ${p.commandName} for ${p.slotName}, not Synth 1's patch`, 'warn'); return; }
    // The Circuit can answer with the previous patch before the change lands: an answer identical to
    // the last one right after a change is asked again, up to three times 60 ms apart, then believed.
    // See lessons/page-remote.md#remote-13
    if (asked !== lastDump?.at && same(p.bytes, lastDump?.bytes) && tries < 3) {
      stale++;
      await wait(60);
      if (armed && patchAt === asked) return askName(tries + 1);
      return;
    }
    lastDump = { bytes: [...p.bytes], name: p.name, at: asked };
    nameReads++;
    if (patchAt === asked) knobsFrom(p);
    if (asked != null) names.set(asked, p.name);
    if (patchAt !== asked) return;
    showName(p.name);
    d.log(`Synth 1 holds ${p.name ? `"${p.name}"` : 'a patch with no name'}`);
  }
  // One request at a time, and the last change always gets its name.
  async function readName() {
    if (!armed || !board) return;
    if (nameBusy) { nameAgain = true; return; }
    nameBusy = true;
    try { do { nameAgain = false; await askName(); } while (nameAgain && armed); }
    finally { nameBusy = false; }
  }
  function pickPatch(i) {
    patchAt = i;
    // A name read before shows at once; a patch not seen yet shows its number
    // until the Circuit answers.
    patchPick.show(names.has(i) ? names.get(i) : PATCHES[i], i);
    bay.send(id('patch', 'midi-out'), { cls: 'program', ch: CH, d1: i });
    // The guide: wait for the patch to load (10 ms is plenty) and leave 20 ms
    // between consecutive messages.
    if (armed) setTimeout(readName, 30);
  }
  const step = (by) => pickPatch(patchAt == null ? (by > 0 ? 0 : PATCHES.length - 1) : (patchAt + by + PATCHES.length) % PATCHES.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => step(-1), next: () => step(+1), onPick: (i) => pickPatch(i) });
  patchPick.options(PATCHES, START_PATCH.at ?? 0);
  if (START_PATCH.at != null) patchAt = START_PATCH.at;
  patchPick.show(START_PATCH.at != null ? START_PATCH.name : '', START_PATCH.at ?? undefined);
  patchPick.disabled(true);

  // A knob turns on screen wherever its value came from and only a drag (or its invisible hand)
  // sends. `knob.receive()` takes a hand turn on the Circuit (CC 80 to 87 via midi-back.mjs), a
  // patch dump's macro Positions and a local controller, and never sends them back.
  // See lessons/page-remote.md#remote-14
  let knobsRead = 0;
  const knobs = new Map(MACROS.map((m) => [m.name, createKnob({
    label: `M${m.n}`, title: `macro ${m.n}, CC ${m.cc} on channel ${CH}`, min: 0, max: 127, step: 1, value: 64,
    disabled: true, hand: true,
    onInput: (v) => bay.send(id(`knob-macro-${m.n}`, 'value-out'), { of: 'param', name: m.name, v }),
  })]));
  const knobGrid = createKnobGrid(knobs, { row: true });
  const knobsOn = (yes) => { for (const k of knobs.values()) k.enable(yes); };
  function knobsFrom(p) {
    try {
      for (const m of MACROS) knobs.get(m.name).receive(p.value(m.pos), { from: 'patch', force: true });
      knobsRead++;
    } catch (e) { d.log(`The macro positions did not read out of the patch, ${e.message}`, 'warn'); }
  }

  // ── the keyboard ────────────────────────────────────────────────────────
  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: CH, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(id('keys', 'midi-out'), { cls: 'note', ch: CH, d1: note, d2: 0 }); },
  });

  // MIDI in: each input a `web:midi` node wired to `pi-1:circuit:midi-in`. Asked for on Play, never
  // on load, with `sysex: false`. Only notes and the Circuit's synth CCs pass; everything else is
  // dropped and counted. A macro CC turns its knob by `receive` and is sent once, by its wire.
  // See lessons/page-remote.md#remote-15
  const SYNTH_CCS = new Set(CIRCUIT_CC.filter((r) => r.ch === '1/2').map((r) => r.cc));
  const devIn = { note: 0, cc: 0, dropped: 0 };
  const droppedSaid = new Set();
  function drop(what) {
    devIn.dropped++;
    if (droppedSaid.has(what)) return;
    droppedSaid.add(what);
    d.log(`MIDI in: ${what} is not passed to the Circuit`, 'warn');
  }
  const { plugged, attach } = createMidiDevices({ bay, site: S, to: [CIRCUIT_IN], emits: ['note', 'cc'],
    portLabel: (node) => `${node.split(':')[1]}:midi-out`,
    message: (e, { send, hold }) => {
      const data = e.data;
      const st = data[0] & 0xF0;
      if (data[0] >= 0xF0) { if (data[0] !== 0xF8 && data[0] !== 0xFE) drop(data[0] === 0xF0 ? 'SysEx' : 'a system message'); return; }
      if (data.length !== 3) { drop(st === 0xC0 ? 'program change' : st === 0xD0 ? 'channel pressure' : 'a short message'); return; }
      const [, d1, d2] = data;
      if (st === 0x90 || st === 0x80) {
        const on = st === 0x90 && d2 > 0;
        hold(d1, on);
        kb.lightNote?.(d1, on);
        devIn.note++;
        send({ cls: 'note', ch: CH, d1, d2: on ? d2 : 0 });
        return;
      }
      if (st === 0xB0) {
        if (!SYNTH_CCS.has(d1)) { drop(`CC ${d1}`); return; }
        const m = MACROS.find((x) => x.cc === d1);
        if (m) knobs.get(m.name).receive(d2, { from: 'midi' });
        devIn.cc++;
        send({ cls: 'cc', ch: CH, d1, d2 });
        return;
      }
      drop(st === 0xE0 ? 'pitch bend' : st === 0xA0 ? 'aftertouch' : 'that message');
    },
    noteOff: (n) => ({ cls: 'note', ch: CH, d1: n, d2: 0 }), onRelease: (n) => kb.lightNote?.(n, false),
    onChange: () => pb.refresh?.(), log: (line, kind) => d.log(line, kind) });
  const shown = (pid) => !pid.startsWith(`${S}:midi`) || plugged.has(pid.split(':').slice(0, 2).join(':'));
  let midiAsked = false;
  function askMidi() {
    if (midiAsked || !navigator.requestMIDIAccess) return;
    midiAsked = true;
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      attach(access);
      if (!access.inputs.size) d.log('MIDI in: no keyboard or controller is plugged into this machine');
    }, (e) => d.log(`MIDI in: the browser did not give access (${e?.message || 'refused'})`, 'warn'));
  }

  // ── the Circuit's own macro knobs, turned by hand on the desk ───────────
  // Only Synth 1's (this page plays channel 1) and only while armed: a turn
  // before play, or from a page that is not listening, is not this page's.
  const circuitIn = { n: 0, ignored: 0, said: new Set(), relayCopies: 0, direct: 0 };
  function fromCircuit(m) {
    if (!armed || m.input !== INPUT || m.ch !== CH) return;
    const mac = MACROS.find((x) => x.cc === m.cc);
    if (!mac || !Number.isInteger(m.v) || m.v < 0 || m.v > 127) return;
    const k = knobs.get(mac.name);
    const before = k.received().ignored;
    k.receive(m.v, { from: 'device' });
    if (k.received().ignored > before) { circuitIn.ignored++; return; }
    circuitIn.n++;
    if (m.path === 'direct') circuitIn.direct++;
    if (!circuitIn.said.has(mac.n)) { circuitIn.said.add(mac.n); d.log(`Macro ${mac.n} was turned on the Circuit itself, and its knob here follows it`); }
  }

  // Steps Synth 1 through every patch by program change (RAM only, writes nothing) and returns the
  // names, for START_PATCH. Run by a person from the console, never by a check.
  // See lessons/page-remote.md#remote-16
  async function scanNames({ from = 0, to = 63 } = {}) {
    if (!armed) throw new Error('press play with ?board=1 first');
    const out = {};
    for (let i = from; i <= to; i++) {
      pickPatch(i);
      await wait(400);
      while (nameBusy) await wait(50);
      out[i] = names.get(i) ?? null;
    }
    return out;
  }

  // ── play: join the Circuit's room, ask the board, hold the lease ─────────
  let saidLast = '';
  const say = (text, kind) => { saidLast = text; d.log(text, kind); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let opened = null, starting = false;

  function makeBoard() {
    let open;
    opened = new Promise((r) => { open = r; });
    const direct = mode === 'direct' ? { direct: true, directCushionMs: Number(q.get('cushion')) || 40 } : {};
    board = createBoard({
      room: INPUT_ROOM, of: 'Raspberry Pi', showName: false, cushionMs: 80, maxCushionMs: 250, ...direct,
      log: (line, kind) => d.log(line, kind),
      onOpen: () => open(true),
      onMessage: (m) => {
        // On the direct path the board sends a hand turn on `ctl` marked
        // `path: 'direct'` AND into the relay room for pages on the relay; the
        // relay's copy is the late one, so it is dropped here.
        if (m.type === 'midi.cc') {
          if (m.path !== 'direct' && board?.stats().via !== 'relay') { circuitIn.relayCopies++; return; }
          return fromCircuit(m);
        }
        if (m.type === 'midi.refused') { refused++; lastRefusal = m.why || ''; d.log(`the Pi refused a message for the Circuit: ${m.why}`, 'warn'); }
      },
    });
    announceOn(board, bay, { label: 'Circuit on Pi' });
  }

  async function start() {
    if (starting) return;
    starting = true;
    // The camera does not wait for the Circuit: a picture of the desk is worth
    // having while the sound is still coming up, or when it does not.
    if (cam) { cam.start(); transport.setIcon('play', 'stop', 'stop'); }
    try {
      if (!board) makeBoard();
      say(`Reaching ${INPUT_ROOM}`);
      const up = await Promise.race([opened, wait(8000).then(() => false)]);
      if (!up) { say(`The relay did not open ${INPUT_ROOM} within eight seconds, so nothing is playing`, 'warn'); return; }
      await board.startAudio();
      const pl = board.playout();
      if (pl && !analyser) {
        analyser = board.ctx().createAnalyser();
        analyser.fftSize = 2048;
        buf = new Float32Array(analyser.fftSize);
        pl.connect(analyser);
        requestAnimationFrame(frame);
        requestAnimationFrame(lagFrame);
      }
      if (!MAY_PLAY) { say('A check is running, so nothing was sent to the Circuit. Add ?board=1 to let it through', 'warn'); return; }
      const st = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
      if (!st) { say(`The Raspberry Pi is not answering in ${INPUT_ROOM}, so the keys go nowhere`, 'warn'); return; }
      if (mode === 'direct') {
        // Direct before the lease and the first note, so the sound starts on
        // the path it stays on. Falls back to the relay after 3 s.
        say('Opening a direct path to the Pi');
        pathChoice.pending(1);
        let path;
        try { path = await board.goDirect({ frameMs: DIRECT_FRAME_MS }); } finally { pathChoice.pending(null); }
        rewire(path);
        if (path === 'relay') fellBack();
        say(path === 'direct' ? 'Direct to the Pi, the relay only carries presence now'
          : path === 'turn' ? 'Direct to the Pi through a TURN server, so not on one network'
          : 'No direct path, so the relay carries everything', path === 'relay' ? 'warn' : undefined);
      } else rewire('relay');
      lease = createLease({ ask: (m, r, t) => board.ask(m, r, t), what: 'the Circuit capture', log: (line, kind) => d.log(line, kind) });
      armed = true;
      board.watchRtt(2000);
      cam?.tryDirect();
      patchPick.disabled(false);
      knobsOn(true);
      askMidi();
      say('The Circuit on the Raspberry Pi, play the keys');
      transport.setIcon('play', 'stop', 'stop');
      // The starting patch, by number (START_PATCH), and its name read back.
      if (START_PATCH.at != null && patchAt === START_PATCH.at && lastProgram == null) pickPatch(START_PATCH.at);
      else readName();
    } finally { starting = false; }
  }
  function stop() {
    cam?.stop();
    if (armed && board) board.send({ type: 'midi.panic' });
    armed = false;
    board?.watchRtt(0);
    lease?.stop(); lease = null;
    dropCc();
    kb.panic?.();
    patchPick.disabled(true);
    knobsOn(false);
    transport.setIcon('play', 'play', 'play');
    say('Stopped, every note on the Circuit was released');
  }
  addEventListener('pagehide', () => { cam?.stop(); if (armed && board) board.send({ type: 'midi.panic' }); });

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (armed || cam?.on() ? stop() : start()) },
  ] });

  // Relay or direct. A change while playing stops, makes a new board for the
  // new mode (its own socket, cushion and playout) and plays again, as 030.
  async function setMode(m) {
    if (m === mode) return;
    mode = m;
    const u = new URL(location.href);
    if (m === 'direct') u.searchParams.set('path', 'direct'); else u.searchParams.delete('path');
    history.replaceState(null, '', u);
    const was = armed;
    if (armed || cam?.on()) stop();
    if (board) { board.close(); board = null; analyser = null; buf = null; }
    d.log(`mode: ${m}`);
    if (was) await start();
  }
  // The choice shows the path in use, not only the one asked for.
  function fellBack() {
    mode = 'relay';
    pathChoice.set(0, true);
    const u = new URL(location.href);
    u.searchParams.delete('path');
    history.replaceState(null, '', u);
  }
  const pathChoice = createChoice({ label: 'path', options: [['relay', 'relay'], ['direct', 'direct']],
    at: mode === 'direct' ? 1 : 0, onPick: (v) => setMode(v) });
  // Every link to the Pi is remade with `via` when the path changes: `datachannel` while direct,
  // `relay` otherwise. The camera's link follows its own `cam path`.
  // See lessons/page-remote.md#remote-17
  const wiredVia = new Map();
  function rewire(path, which = (l) => l.from !== CAM_OUT) {
    const via = path === 'direct' || path === 'turn' ? 'datachannel' : 'relay';
    for (const l of bay.links()) {
      const pi = l.from.startsWith(`${BOARD_SITE}:`) || l.to.startsWith(`${BOARD_SITE}:`);
      if (!pi || !which(l) || wiredVia.get(`${l.from}>${l.to}`) === via) continue;
      bay.unlink(l.id);
      const r = bay.link(l.from, l.to, l.transforms || [], { via });
      if (!r.ok) { d.log(`${l.from} -> ${l.to} via ${via} refused: ${r.why}`, 'warn'); bay.link(l.from, l.to, l.transforms || []); }
      wiredVia.set(`${l.from}>${l.to}`, via);
    }
    pb?.refresh?.();
  }
  setInterval(() => {
    if (!board || !armed) return;
    const via = board.stats().via;
    rewire(via);
    if (mode === 'direct' && via === 'relay') { d.log('the direct path dropped, the relay carries everything now', 'warn'); fellBack(); }
    const cp = cam?.path();
    d.set('path', cp && cp !== (via === 'relay' ? 'relay' : 'direct') ? `${via}, camera ${cp}` : via);
  }, 500);

  // The Pi's camera: without `?cam=` nothing below exists, and with it Play opens it. The key is
  // never compared here: the relay checks it against PI_CAM_KEY (`POST /room/<room>-cam/key`, 204 or
  // 403), then gets it as the first message, not the URL. The Pi films only for a viewer there.
  // See lessons/page-remote.md#remote-18
  const CAM_ROOM = `${ROOM}-cam`;
  const CAM_OUT = `${BOARD_SITE}:camera:video-out`, SCREEN_IN = id('screen', 'video-in');
  const cam = CAM_KEY ? await buildCamera() : null;

  async function buildCamera() {
    const [{ createVideoPanel }, { createBoardVideo, WATCHING_MS }, { HTTP_BASE }] = await Promise.all([
      import('/shell/video-panel.mjs'), import('/shell/board-video.mjs'), import('/shell/wire.mjs')]);
    // The board announces its camera as `pi-1:camera` when it has one and holds
    // the key (graph-registry.mjs `boardGraph`, rig/board/camera.mjs).
    addBoardNode(bay, boardGraph({ room: ROOM, camera: true, gpu: false }), 'camera', { label: 'camera on the Pi' });
    addNodes(bay, S, ['screen'], { portLabel: 'node:port' });
    const linked = bay.link(CAM_OUT, SCREEN_IN);
    if (!linked.ok) d.log(`${CAM_OUT} -> ${SCREEN_IN} refused: ${linked.why}`, 'warn');

    const ME = `cam-${Math.random().toString(36).slice(2, 8)}`;
    const canvas = el('canvas', 'cc-cam');
    canvas.width = 1280; canvas.height = 720;
    const panel = createVideoPanel({ media: canvas, of: 'the Pi camera' });
    const say = (state, why) => panel.presence?.set(state, why);
    let on = false, keyed = false, beat = null, shape = null, lastFrameAt = 0;
    const said = { refused: '', stopped: '' };
    // The camera lag: the board stamps its clock with the next frame's counter (`cam.tick`); tick and
    // frame may arrive in either order, so the lag is taken on the second. Against two NTP clocks,
    // corrected by `rtc.pong`'s offset once a direct link has measured one.
    // See lessons/page-remote.md#remote-19
    const ticks = new Map(), arrived = new Map(), lags = [], raw = [];
    const lagOf = (wall, at) => {
      const off = board?.stats().clockOffsetMs;
      raw.push(wall - at); if (raw.length > 20) raw.shift();
      lags.push(wall - (at - (Number.isFinite(off) ? off : 0))); if (lags.length > 20) lags.shift();
    };
    const tickAt = (seq, at) => {
      const wall = arrived.get(seq);
      if (wall != null) { arrived.delete(seq); lagOf(wall, at); return; }
      ticks.set(seq, at);
      if (ticks.size > 10) ticks.delete(ticks.keys().next().value);
    };
    const video = createBoardVideo({
      canvas,
      onSeq: (seq) => {
        lastFrameAt = performance.now();
        const at = ticks.get(seq);
        if (at != null) { ticks.delete(seq); lagOf(Date.now(), at); return; }
        arrived.set(seq, Date.now());
        if (arrived.size > 90) arrived.delete(arrived.keys().next().value);
      },
      onKey: () => { say('online'); d.log('A keyframe from the Pi camera arrived, the picture starts here'); },
      onLost: (n) => d.log(`The relay has dropped ${n} frame${n === 1 ? '' : 's'} of the camera picture`, 'warn'),
      onError: (line) => d.log(`Pi camera: ${line}`, 'bad'),
      onText: (m) => {
        if (m.type === 'cam.key.ok') {
          keyed = true;
          watching();
          clearInterval(beat);
          beat = setInterval(watching, WATCHING_MS);
          tryDirect();
        } else if (m.type === 'cam.started') {
          if (!shape) d.log(`The Pi camera is up, ${m.camera}, ${m.w}x${m.h} at ${m.fps} fps`);
          shape = m;
        } else if (m.type === 'cam.refused') {
          if (said.refused !== m.why) d.log(`The Pi did not start its camera: ${m.why}`, 'warn');
          said.refused = m.why;
          say('offline', m.why);
        } else if (m.type === 'cam.stopped') {
          if (on) d.log(`The Pi camera stopped: ${m.why}`, 'warn');
          shape = null;
        } else if (m.type === 'cam.tick') {
          if (camPath !== 'direct') tickAt(m.seq, m.at);
        }
      },
      onClose: (e) => {
        if (!on) return;
        on = false; keyed = false; clearInterval(beat);
        toRelay(null);
        say('offline', 'the camera room closed');
        d.log(e?.code === 4003 ? 'The relay closed the camera room: it did not take the key' : `The camera room closed (${e?.code ?? '?'})`, 'warn');
      },
    });
    function watching() { if (keyed && !document.hidden) video.say({ type: 'cam.watching', from: ME }); }
    addEventListener('visibilitychange', watching);

    async function start() {
      if (on) return;
      on = true; said.refused = '';
      say('checking');
      let r = null;
      try { r = await fetch(`${HTTP_BASE}/room/${CAM_ROOM}/key`, { method: 'POST', body: CAM_KEY }); }
      catch { /* r stays null */ }
      if (!on) return;
      if (!r || (r.status !== 204 && r.status !== 403)) {
        on = false; say('offline', 'the relay did not answer');
        d.log(`The relay did not answer the camera key check${r ? ` (${r.status})` : ''}, so no picture is asked for`, 'warn');
        return;
      }
      if (r.status === 403) {
        on = false; say('offline', 'the key was refused');
        d.log('The relay refused the camera key in this URL, so no picture is asked for', 'warn');
        return;
      }
      const o = video.open(CAM_ROOM, { codec: 'avc1.42E01F', fps: 30 }, { hello: { type: 'cam.key', key: CAM_KEY, from: ME } });
      if (!o.ok) { on = false; say('offline', o.reason); d.log(o.reason, 'warn'); return; }
      say('coming');
      d.log(`Asking the Pi for its camera in ${CAM_ROOM}`);
    }
    // The camera direct: the relay's key check first, then `cam.direct` with key and viewer over
    // `ctl` only; the board attaches `cam` only for its own key and an admitted viewer. A third
    // ordered, reliable channel on the Circuit's link: no second handshake, falls back with the sound.
    // See lessons/page-remote.md#remote-20
    let dcam = null, camPath = 'relay', tries = 0, nextTry = 0, pieces = [], pieceSeq = -1, directFrames = 0;
    const camSaid = new Set();
    function onDirect(data) {
      if (typeof data === 'string') {
        let m = null; try { m = JSON.parse(data); } catch { return; }
        if (m?.type === 'cam.tick') tickAt(m.seq, m.at);
        else if (m?.type === 'cam.stopped' && on) d.log(`The Pi camera stopped: ${m.why}`, 'warn');
        return;
      }
      if (!(data instanceof ArrayBuffer) || data.byteLength < 8) return;
      const dv = new DataView(data);
      const seq = dv.getUint32(0, true), flags = dv.getUint32(4, true);
      if (seq !== pieceSeq) { pieces = []; pieceSeq = seq; }
      pieces.push(new Uint8Array(data, 8));
      if (flags & 2) return;
      const n = pieces.reduce((a, p) => a + p.byteLength, 0);
      const out = new Uint8Array(8 + n);
      const ov = new DataView(out.buffer);
      ov.setUint32(0, seq, true); ov.setUint32(4, flags & 1, true);
      let o = 8; for (const p of pieces) { out.set(p, o); o += p.byteLength; }
      pieces = []; pieceSeq = -1;
      directFrames++;
      video.feed(out.buffer);
    }
    async function tryDirect() {
      if (!on || !keyed || dcam || !board || camPath === 'direct') return;
      const via = board.stats().via;
      if (via === 'relay' || tries >= 5 || performance.now() < nextTry) return;
      tries++;
      const dc = board.channel('cam', { ordered: true });
      if (!dc) return;
      dcam = dc;
      dc.onmessage = (e) => { if (dcam === dc) onDirect(e.data); };
      dc.onclose = () => { if (dcam === dc) toRelay('its channel closed'); };
      if (dc.readyState !== 'open') await new Promise((r) => { dc.onopen = r; setTimeout(r, 3000); });
      if (dcam !== dc) return;
      if (dc.readyState !== 'open') { dcam = null; try { dc.close(); } catch { /* */ } nextTry = performance.now() + 2000; return; }
      const r = await board.askDirect({ type: 'cam.direct', key: CAM_KEY, viewer: ME }, 'cam.direct', 3000);
      if (dcam !== dc) return;
      if (!r?.ok) {
        dcam = null; try { dc.close(); } catch { /* */ }
        nextTry = performance.now() + (r?.retry || !r ? 1500 : 1e12);
        const why = r ? r.why : 'the Pi did not answer on the direct link';
        if (!camSaid.has(why)) { camSaid.add(why); d.log(`The camera stays on the relay for now: ${why}`, r?.retry || !r ? 'dim' : 'warn'); }
        return;
      }
      camPath = 'direct';
      video.socketFrames(false);
      video.expectKey();
      rewire('direct', (l) => l.from === CAM_OUT);
      d.log('The camera\'s frames come on the direct link now, the relay carries only its key and its heartbeat', 'hi');
    }
    // Back to the relay: the channel closed, the direct link dropped, or the
    // page stopped. `cam.relay` in the keyed room tells the board at once,
    // rather than when it notices a dead link.
    function toRelay(why) {
      const dc = dcam; dcam = null;
      try { dc?.close(); } catch { /* */ }
      pieces = []; pieceSeq = -1;
      if (camPath !== 'direct') return;
      camPath = 'relay';
      video.socketFrames(true);
      video.expectKey();
      rewire('relay', (l) => l.from === CAM_OUT);
      if (why && on) { video.say({ type: 'cam.relay', from: ME }); d.log(`The camera is back on the relay, ${why}`, 'warn'); }
    }
    function stop() {
      if (!on) return;
      on = false;
      toRelay(null);
      tries = 0; nextTry = 0;
      clearInterval(beat);
      if (keyed) video.say({ type: 'cam.bye', from: ME });
      keyed = false; shape = null;
      // The bye has to leave before the socket does.
      setTimeout(() => video.close(), 50);
      say('unknown');
    }
    setInterval(() => {
      if (camPath === 'direct' && board?.stats().via === 'relay') toRelay('the direct link dropped');
      else if (on && keyed && camPath === 'relay') tryDirect();
      const fresh = on && performance.now() - lastFrameAt < 2000;
      d.set('cam fps', fresh ? Math.round(video.fps()) : '');
      const med = lags.length ? [...lags].sort((x, y) => x - y)[lags.length >> 1] : null;
      d.set('cam lag', fresh && med != null ? Math.round(med) : '');
    }, 500);

    return {
      el: panel.el, start, stop, on: () => on, tryDirect,
      /** The camera's own path while it is on and keyed, else null. */
      path: () => (on && keyed ? camPath : null),
      flowing: () => on && performance.now() - lastFrameAt < 2000,
      probe: () => ({ on, keyed, shape, decoded: video.decoded(), lost: video.lost(), fps: video.fps(), kbit: video.kbit(),
        lags: [...lags], raw: [...raw], size: [canvas.width, canvas.height], lastSeq: video.lastSeq(),
        path: camPath, directFrames, tries }),
    };
  }

  // ── the patchbay ────────────────────────────────────────────────────────
  const sounding = () => armed && level > 0.002;
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shown(n.id)),
    ports: () => bay.ports().filter((p) => shown(p.id)),
    links: () => bay.links(),
  }, { room: ROOM,
    flowing: (l) => (l.from === CIRCUIT_AUDIO ? sounding() : l.from === CAM_OUT ? !!cam?.flowing() : armed),
  });
  setInterval(() => pb.refresh?.(), 500);

  const top = el('div', 'cc-top');
  top.append(transport.el, pathChoice.el);
  d.stack.add(top, ...(cam ? [cam.el] : []), wave.el, patchPick.el, knobGrid.el, host, pb.el);
  window.__demo.bay = bay;
  window.__demo.scanNames = scanNames;
  // What this page hears from the Pi, for a driver. Reads only.
  window.__demo.probe = () => ({
    armed, level, span: () => span, clipped: () => clipped, said: saidLast, sent: { ...sent }, refused, lastRefusal, lastProgram,
    patchAt, patchName, nameReads, nameMisses, lastDump, stale, names: () => Object.fromEntries(names), shown: patchPick.el.querySelector('.pos-pick-cell')?.title ?? null,

</script>

<style>
  /* the first slide: the title is the slide, about three times the other slides' size */
  .prl .prl-head h1 { font-size: clamp(56px, 9vw, 140px); line-height: 1.05; letter-spacing: -0.03em; }
</style>

<script type="module">
  // The first slide: the Pi's camera under the title, in one of three modes the header's camera button cycles
  // (demo/shell/present-camera.mjs): off, regular (H.264) and dither (the OLED's one bit 128x64 frames).
  import { mount } from '/shell/shell.mjs';
  import { createPresentLayout } from '/shell/present-layout.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createPresentCamera } from '/shell/present-camera.mjs';

  const d = mount({ name: 'Positron Studio', what: '', readout: null, showLog: false, chrome: false });

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const cam = createPresentCamera({ room: ROOM, log: (line, kind) => d.log(line, kind) });

  // ── the patch as the code runs it: two paths from the Pi's camera through the keyed room to this page ──
  useMediumColours();
  const pb = createPatchbay({ nodes: () => cam.nodes, ports: () => cam.ports, links: () => cam.links }, { flowing: (l) => cam.flows(l.id) });
  setInterval(() => { if (lay.how()) pb.refresh?.(); }, 200);

  const lay = createPresentLayout({
    title: 'Positron Studio',
    desc: "pi-1:camera reaches this page through studio-1-cam, Cloudflare's relay room that opens only to the camera key. Regular is H.264 at 1280x720; dither is one bit at 128x64, as the OLED shows it.",
    main: null, tools: [cam.el], patch: pb.el, onHow: (open) => { if (open) pb.refresh(); },
  });

  window.__demo.how = lay.setHow;
  window.__demo.raid = () => lay.keys.raid();
  window.__demo.probe = cam.probe;
  window.__demo.frame = cam.frame;
  d.ready();
</script>
</html>

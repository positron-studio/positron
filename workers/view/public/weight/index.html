         * `> 128` on red is the words, not the floor (which cannot pass 104). The mark is the
         * dim band, with the threshold halfway between INK_RGB and MARK_RGB as rendered.
         * See lessons/page-weight.md#weight-145
         */
        const MID = 255 * ((MARK_RGB[0] + INK_RGB[0]) / 2) * INK_ALPHA;
        let ink = 0, lit = 0;
        for (let i = 0; i < 640 * 360; i++) {
          if (px[i * 4] > 128) { ink++; if (px[i * 4] < MID) lit++; }
        }
        return { ink, lit };
      };
      markWord(null);
      const plain = shot();
      // Every word in turn, because which of them the arrival view happens to
      // show is not something this check should be asserting about. One that
      // lights up AND leaves other ink white is what the claim needs.
      const tries = [];
      let pick = null;
      for (const b of built) {
        markWord(b);
        const s = shot();
        tries.push({ text: b.item.text.split('\n')[0].slice(0, 12), ...s });
        if (!pick && s.lit > plain.lit + 400 && s.ink - s.lit > 200) pick = { b, s };
      }
      markWord(null);
      const off = shot();
      window.__demo.marking = { plain, tries, off };
      /**
       * Compares shots rather than demanding zero: the grey band also holds the antialiased
       * edges of white letters. Marking adds many dim pixels, unmarking removes them, and
       * total ink holds; the return half is the negative control.
       * See lessons/page-weight.md#weight-146
       */
      const rose = pick ? pick.s.lit - plain.lit : 0;
      const back = Math.abs(off.lit - plain.lit);
      d.assert('the trigger repaints the word it landed on, and leaves the rest white',
        !!pick && rose > 400 && back < Math.max(40, plain.lit * 0.25)
        && Math.abs(pick.s.ink - plain.ink) < plain.ink * 0.1,
        pick
          ? `nothing marked: ${plain.ink} pixels of ink, ${plain.lit} of them in the `
            + `mark's band (the edges of white type). Marking `
            + `"${pick.b.item.text.split('\n')[0]}" puts ${rose} more there, leaving `
            + `${pick.s.ink - pick.s.lit} white; unmarking comes back to within ${back}`
          : `no word changed colour where the picture could see it: `
            + tries.map((t) => `${t.text} ${t.lit}/${t.ink}`).join(', '));
    }

    /**
     * Drives the trigger handler with a runtime-like pose against a stub session that counts
     * being ended, on both settings of `overlay`. The ray is input, not the claim.
     * Synchronous, because the window loop stops while `xrSession` is non-null.
     * See lessons/page-weight.md#weight-147
     */
    if (SELFCHECK) {
      const keepPos = pos.slice(), keepTurn = turn;
      const keepRef = xrRefSpace, keepSession = xrSession;
      const keepOverlay = overlay, keepSys = sysKeyboard;
      // Standing at the origin facing 0, the headset's space and the room's are
      // the same space, so a pose can be written down in room metres.
      pos = [0, 0]; turn = 0;
      const target = big, w = WALLS[target.item.wall];
      // Column-major, the way a runtime hands one over: right, up, back,
      // position. A pose's forward is its NEGATIVE z, so the back column is the
      // wall's own outward normal and the pose stands 2 m off the wall.
      const m = new Float32Array([
        w.right[0], 0, w.right[2], 0,
        0, 1, 0, 0,
        w.nrm[0], 0, w.nrm[2], 0,
        target.o[0] + w.nrm[0] * 2, target.o[1], target.o[2] + w.nrm[2] * 2, 1,
      ]);
      const ev = { frame: { getPose: () => ({ transform: { matrix: m } }) },
        inputSource: { targetRaySpace: {} } };
      let ended = 0;
      xrRefSpace = { standIn: true };
      xrSession = { end: () => { ended++; return Promise.resolve(); } };

      // 1. Neither way to a keyboard. The case that was reported, and the one
      //    every runtime measured so far actually lands in.
      overlay = false; sysKeyboard = false; markWord(null); xrPending = null;
      xrAim(ev);
      const markedIt = marked === target, carried = xrPending === target;
      const endedNoOverlay = ended;

      // 2. No field of our own, but the runtime says it will raise its own
      //    keyboard over the session. Both things have to happen: the field is
      //    focused where nobody can see it, so the word must light up as well.
      overlay = false; sysKeyboard = true; markWord(null); xrPending = null;
      xrAim(ev);
      const sysOpened = editing === target && typeEl.hidden === false;
      const sysLit = marked === target;
      closeTyping();
      const endedSys = ended;

      // 2b. The runtime does not say (`undefined`): must behave like yes. Unknown never blocks.
      // See lessons/page-weight.md#weight-148
      overlay = false; sysKeyboard = 'unknown'; markWord(null); xrPending = null;
      xrAim(ev);
      const unkOpened = editing === target && typeEl.hidden === false;
      const unkLit = marked === target;
      closeTyping();
      const endedUnk = ended;

      // 3. A field of our own, inside the session.
      overlay = true; sysKeyboard = false; markWord(null); xrPending = null;
      xrAim(ev);
      const opened = editing === target && typeEl.hidden === false;
      // And it must not also mark: a lit word behind a field editing it cannot be cleared.
      // See lessons/page-weight.md#weight-149
      const markedToo = marked !== null;
      closeTyping();

      xrSession = keepSession; xrRefSpace = keepRef;
      // The decision, not the branch: keyboardVerdict maps `undefined` to try. The branch
      // below passes for `true` and `'unknown'` alike, so it is graded here.
      // See lessons/page-weight.md#weight-150
      const vUnknown = keyboardVerdict({});
      const vNo = keyboardVerdict({ isSystemKeyboardSupported: false });
      const vYes = keyboardVerdict({ isSystemKeyboardSupported: true });
      d.assert('a runtime that will not say is treated as maybe, never as no',
        vUnknown === 'unknown' && !!vUnknown && vNo === false && vYes === true,
        `undefined -> ${vUnknown}, false -> ${vNo}, true -> ${vYes}`);

      d.assert('...and where the runtime will not say, it tries anyway rather than refusing',
        unkOpened && unkLit && endedUnk === 0,
        `${unkOpened ? 'the field was focused' : 'THE FIELD WAS NOT FOCUSED'} and `
        + `${unkLit ? 'the word lit' : 'THE WORD DID NOT LIGHT'}, `
        + `session ended ${endedUnk} time(s)`);

      /**
       * Inside a session the wall follows the keystroke on the session's rAF. The stub counts
       * then runs the calls, so both scheduling and the wall changing are graded; `winFrames`
       * must stay zero.
       * See lessons/page-weight.md#weight-151
       */
      {
        const keepWord = target.item.text;
        let sessFrames = 0, winFrames = 0;
        const realRaf = window.requestAnimationFrame;
        window.requestAnimationFrame = (fn) => { winFrames++; return realRaf.call(window, fn); };
        const queued = [];
        xrSession = { end: () => Promise.resolve(),
          requestAnimationFrame: (fn) => { sessFrames++; queued.push(fn); return 1; } };
        openTyping(target, 'the check', { keepMark: true });
        typeEl.value = 'ELK';
        liveRetext();                       // one keystroke
        typeEl.value = 'ELKS';
        liveRetext();                       // ...and another, before the first ran
        const coalesced = sessFrames;
        for (const fn of queued.splice(0)) fn(0, null);
        const wallNow = built.find((b) => b.item.text === 'ELKS') || null;
        // ...and a third, to prove the flag cleared rather than latching.
        typeEl.value = 'ELM';
        liveRetext();
        const again = sessFrames;
        for (const fn of queued.splice(0)) fn(0, null);
        const wallAfter = built.find((b) => b.item.text === 'ELM') || null;
        const editingNow = editing;
        closeTyping();
        window.requestAnimationFrame = realRaf;
        d.assert('typing inside a headset session changes the wall, on the session’s own clock',
          coalesced === 1 && winFrames === 0 && !!wallNow
          && again === 2 && !!wallAfter && editingNow === wallAfter,
          `two keystrokes asked the session for ${coalesced} frame and the window for ${winFrames}. `
          + `The wall read "${wallNow ? wallNow.item.text : 'UNCHANGED'}". `
          + `A third keystroke asked for ${again - coalesced} more and the wall read `
          + `"${wallAfter ? wallAfter.item.text : 'UNCHANGED'}". `
          + `The field is on ${editingNow ? `"${editingNow.item.text}"` : 'nothing'}, `
          + `${editingNow === wallAfter ? 'the same object the wall has' : 'a DIFFERENT object from the wall’s'}`);
        // Put the word back, through the same path that changed it.
        if (editingNow) retext(editingNow, keepWord);
      }

      overlay = keepOverlay; sysKeyboard = keepSys;
      pos = keepPos; turn = keepTurn;
      markWord(null); xrPending = null;
      window.__demo.trigger = { markedIt, carried, sysOpened, sysLit, opened, markedToo, ended };

      d.assert('the trigger in a headset marks a word and never ends the session',
        markedIt && carried && endedNoOverlay === 0 && ended === 0,
        ended === 0
          ? `pointing at "${target.item.text}" from 2 m marked it and kept it for `
            + 'the field, across all three ways a runtime can answer about a keyboard, '
            + 'and not one of them asked the session to end'
          : 'A TRIGGER PRESS ENDED THE SESSION, which is the bug this was reported for');
      // The system keyboard route a Quest offers: the field opens and the word is lit, since
      // the field is invisible in there.
      // See lessons/page-weight.md#weight-152
      d.assert('...and where the runtime raises its own keyboard, the press does both',
        sysOpened && sysLit && endedSys === 0,
        sysOpened && sysLit
          ? `the field took focus on "${target.item.text}" and the word stayed lit, `
            + 'which is the only part of it anybody in the room can see'
          : `field focused: ${sysOpened}, word lit: ${sysLit}`);
      // The other half of the same branch. A runtime that DOES put a field in
      // the session must type in the session, and a check that only ever ran the
      // refused side would be green about half the code.
      d.assert('...and where the runtime allows a field in the session, it types there instead',
        opened && !markedToo,
        opened
          ? `with a field allowed, the same press opened it on "${target.item.text}" `
            + `rather than marking, and left ${markedToo ? 'a word lit as well' : 'nothing lit'}`
          : 'the press did not open the field on the word it landed on');
    }

    /**
     * In passthrough the room fits a room: words come inside, sizes with them, scaled about
     * eye height. Graded both ways and back to exactly as it was; whether 30% is right
     * needs a headset.
     * See lessons/page-weight.md#weight-153
     */
    {
      const before = built.map((b) => ({ o: [...b.o], w: b.w, h: b.h }));
      setRoomScale(AR_SCALE);
      const small = built.map((b, i) => ({ b, was: before[i] }));
      // Measured against the room's own reach before the shrink, which is out at a corner,
      // hypot(u, R + out), not against R.
      // See lessons/page-weight.md#weight-154
      const reachWas = Math.max(...before.map((w) => Math.hypot(w.o[0], w.o[2])));
      const reach = Math.max(...small.map(({ b }) => Math.hypot(b.o[0], b.o[2])));
      const sized = small.every(({ b, was }) => Math.abs(b.w - was.w * AR_SCALE) < 1e-6
        && Math.abs(b.h - was.h * AR_SCALE) < 1e-6);
      const eyeKept = small.every(({ b, was }) =>
        Math.abs(b.o[1] - (EYE_Y + (was.o[1] - EYE_Y) * AR_SCALE)) < 1e-6);
      const lowest = Math.min(...small.map(({ b }) => b.o[1]));
      setRoomScale(1);
      const back = built.every((b, i) => Math.abs(b.o[0] - before[i].o[0]) < 1e-9
        && Math.abs(b.o[1] - before[i].o[1]) < 1e-9 && Math.abs(b.o[2] - before[i].o[2]) < 1e-9
        && Math.abs(b.w - before[i].w) < 1e-9 && Math.abs(b.h - before[i].h) < 1e-9);
      d.assert('in passthrough the whole room fits inside a real one, type and all',
        Math.abs(reach - reachWas * AR_SCALE) < 1e-6 && reach < 3 && sized && eyeKept
        && lowest > 0.9 && back,
        `the furthest word stands ${reach.toFixed(2)} m out instead of ${reachWas.toFixed(2)} m,`
        + ` which is inside an ordinary room. `
        + `Every quad is ${(AR_SCALE * 100).toFixed(0)}% of its size: ${sized}. `
        + `The lowest word is at ${lowest.toFixed(2)} m, so it scaled about eye height and not the floor. `
        + `Coming back out restored every word exactly: ${back}`);
    }

    /**
     * The way out of a headset, graded on a laptop: shader compile and arithmetic only,
     * drawing nothing, so it is not behind SELFCHECK. No other page grades it on load.
     * See lessons/page-weight.md#weight-155
     */
    {
      /**
       * `session: null` builds the badge without driving it; prepare() compiles its shader.
       * `driven` must be false. Shipped defaults, no label or button passed. Proved by
       * breaking getShaderParameter.
       * See lessons/page-weight.md#weight-156
       */
      const quit = mountXRQuit(gl, null);
      const built = quit.prepare();
      d.assert('the way out of a headset compiles its ring here, not on a first headset frame',
        built && !quit.why && quit.driven === false,
        built
          ? `the ring built, ${quit.holdMs} ms on any button, and nothing is driving it: `
            + `driven ${quit.driven}, ${quit.frames} frames`
          : `it would not build: ${quit.why}`);
      // The page's own ring belongs to a session; this one was built to be
      // asked a question and has had it.
      quit.dispose();

      /**
       * The gesture through createQuitHold, the shipped arithmetic. It needs one frame with
       * nothing down first, and takes at most 0.1 s per frame, so feed real frames.
       * See lessons/page-weight.md#weight-157
       */
      let fired = 0;
      const hold = createQuitHold({ onQuit: () => { fired++; } });
      const pad = (down) => [{ gamepad: { buttons: [{ pressed: down }], axes: [0, 0, 0, 0] } }];
      const feed = (ms) => {
        let p = 0;
        for (let left = ms; left > 0; left -= 100) p = hold.update(pad(true), Math.min(100, left) / 1000);
        return p;
      };
      hold.update([], 0.016);
      const half = feed(hold.holdMs / 2);
      const letGo = hold.update(pad(false), 0.01);
      const early = fired;
      const whole = feed(hold.holdMs + 200);
      d.assert('...and it takes a HOLD: letting go part way does nothing, holding through fires once',
        half > 0.4 && half < 0.6 && letGo === 0 && early === 0 && whole === 1 && fired === 1,
        `half way the ring read ${(half * 100).toFixed(0)}%, letting go took it to `
        + `${(letGo * 100).toFixed(0)}% having fired ${early} times. `
        + `Held the whole ${hold.holdMs} ms it read ${(whole * 100).toFixed(0)}% `
        + `and fired ${fired} time${fired === 1 ? '' : 's'}`);
    }

    // Both eyes share a framebuffer and a clear ignores the viewport (headset only), but a
    // pending GL error is checkable. After the ring compile, the newest GL work here.
    // See lessons/page-weight.md#weight-158
    d.assert('nothing was left pending on the graphics card',
      gl.getError() === gl.NO_ERROR, 'getError is NO_ERROR after a full pass');

    // The headset half is human-verified; demo/verify-quest.mjs grades it. `absent` is an
    // answer, and the detail is in plain words, not `null` or mode names.
    // See lessons/page-weight.md#weight-159
    const caps = xrCaps();
    const SAID = { yes: 'yes', no: 'no', absent: 'no', asking: 'no answer yet' };
    const noXr = caps.vr === 'absent' && caps.ar === 'absent';
    d.assert('a headset was asked about, both ways',
      answered(caps.vr) && answered(caps.ar),
      noXr
        ? 'this browser cannot open a headset at all, which is the ordinary answer on a phone'
        : `can it open a headset: ${SAID[caps.vr]}. `
          + `Can it lay the page over the room you are in: ${SAID[caps.ar]}`);

    /**
     * The diagram reports its own damage (shortened labels, long notes, unrouted links, a
     * misplaced title), which nothing else can see. Read it.
     * See lessons/page-weight.md#weight-160
     */
    d.assert('nothing in the picture was cut, shortened or left undrawn',
      dg.cuts.length === 0,
      dg.cuts.length === 0 ? `${dg.ties} tie(s), nothing reported`
        : dg.cuts.map((c) => `${c.id}: ${c.shown}`).join(', '));
    /**
     * Last, under the standing heading. `how` and `atEnd` are createDiagram's third
     * argument; inside the spec they are keys nothing reads, with no error.
     * See lessons/page-weight.md#weight-161
     */
    const kids = [...document.body.children].map((e) => e.className.split(' ')[0]);
    const fig = kids.lastIndexOf('pos-dg');
    d.assert('the picture is the last thing on the page, under the standing heading',
      fig === kids.length - 1 && kids[fig - 1] === 'pos-how'
        && document.querySelector('.pos-how')?.textContent === 'How it works',
      `${kids.join(' -> ')}, heading "${document.querySelector('.pos-how')?.textContent || 'none'}"`);

    d.ready();
  }

  buildAll()
    .then(() => { requestAnimationFrame(frame); return finish(); })
    .catch((e) => d.fail(e));
</script>
</html>

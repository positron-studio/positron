<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Standard 720px width: no body max-width and no .pos-head override on this page.
     See lessons/page-dump.md#dump-1 */

  /* No height rules here: both tables use minRows, and shell.css sizes .pos-tbl[data-rows]
     .pos-tbl-body at (0,3,0). .ports and .traffic are unstyled names for the DOM and checks.
     See lessons/page-dump.md#dump-2 */
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createMidiNode, checkMidiNode } from '/shell/midi-node.mjs';
  import {
    decode, isFlood, deviceInquiry, readInquiryReply, classifyEncoder, createNrpn,
  } from '/shell/midi-decode.mjs';

  /**
   * Shows what a MIDI device actually sends, to settle claims no documentation answers.
   * Every row keeps the raw bytes in their own column beside this page's reading of them.
   * See lessons/page-dump.md#dump-3
   */

  const MAX_ROWS = 400;

  /**
   * Both tables draw at once, empty, at a fixed height (minRows is floor and ceiling), so rows
   * landing in hundreds never move the page. 6 port rows match the MIDI tables elsewhere;
   * 16 traffic rows is 518.40 px, about 60vh of an 864 px viewport.
   * See lessons/page-dump.md#dump-4
   */
  const PORTS_ROWS = 6;
  const TRAFFIC_ROWS = 16;

  const d = mount({
    name: 'dump',
    // One sentence, the same one the index card carries.
    // See lessons/page-dump.md#dump-5
    what: 'Every message a plugged-in instrument sends, as raw bytes beside a reading of them.',
    // SIX CELLS. `clock` and `sensing` are here rather than in the table for
    // the reason written on `isFlood`: they are floods, and listing them buries
    // everything else within seconds. Every one of these moves.
    readout: { inputs: '', messages: '', channels: '', kinds: '', clock: '', sensing: '' },
    /**
     * Control 0 is the one the harness gives settleMs to; keep listen first. The checks run
     * from Listen under SELFCHECK, since there is no Known stream button. None is primary:
     * both controls ask a question, and the accent belongs to the traffic that answers.
     * See lessons/page-dump.md#dump-6
     */
    controls: [
      { id: 'listen', label: 'Listen' },
      { id: 'ask', label: 'Ask for versions' },
      /**
       * Clear is not a control: it sits under the traffic table in a .kpad row, so the harness
       * does not press it. Nothing is graded behind it.
       * See lessons/page-dump.md#dump-7
       */
    ],
  });
  guard(d);

  /**
   * Nothing runs until a press: requestMIDIAccess raises a permission dialog, and SysEx
   * is a second one.
   * See lessons/page-dump.md#dump-8
   */

  const ports = createTable({
    columns: [
      { key: 'name', label: 'port', grow: true, clip: true, hi: true },
      { key: 'maker', label: 'maker', width: 150, clip: true },
      { key: 'way', label: 'way', width: 54 },
      { key: 'state', label: 'state', width: 86 },
    ],
    cap: 40,
    // No empty: minRows ignores it, and a sentence in a framed table reads as a record.
    // See lessons/page-dump.md#dump-9
    minRows: PORTS_ROWS,
    note: 'hover',
  });
  ports.el.classList.add('ports');

  const traffic = createTable({
    columns: [
      { key: 'at', label: 'at', width: 64, align: 'right' },
      { key: 'ch', label: 'ch', width: 34, align: 'right' },
      { key: 'what', label: 'what', width: 96 },
      // The raw bytes are their own column and are never replaced by the reading beside them.
      // See lessons/page-dump.md#dump-10
      { key: 'bytes', label: 'bytes', width: 104, hi: true },
      { key: 'reading', label: 'reading', grow: true, clip: true },
    ],
    cap: MAX_ROWS,
    // Keeps the newest row in view (one keyboard sent 733 messages in 8 s); it stands down
    // while keyboard focus is in the table.
    // See lessons/page-dump.md#dump-11
    stick: true,
    minRows: TRAFFIC_ROWS,
    // The port name is what somebody checks AFTER finding a row, never what
    // they scan down, so it is on the hover rather than in a sixth column that
    // would push the row past a phone's width.
    note: 'hover',
  });
  traffic.el.classList.add('traffic');

  /**
   * Clear, under the table it clears, small and on the right. It reuses .kpad and
   * .kpad-right, which shell.css already sizes, as keyboard.mjs does for Notes off.
   * See lessons/page-dump.md#dump-12
   */
  const clearRow = el('div', 'kpad');
  const clearBtn = el('button', 'kpad-right', 'Clear');
  clearBtn.type = 'button';
  clearBtn.title = 'empty the table and the counts';
  clearRow.append(clearBtn);

  d.el.append(ports.el, traffic.el, clearRow);

  /* Joins the patchbay on a press of Join, never on load: the instruments as devices keyed
     by port, plus a sink of this page's own. Join asks for MIDI when Listen has not.
     See midi-node.mjs.
     See lessons/page-dump.md#dump-13 */
  const bayMidi = createMidiNode({ slug: 'dump', log: (line, kind) => d.log(line, kind), tap: true,
    listen: async () => { if (!access) await open({ sysex: false }); return access; } });
  d.el.append(bayMidi.el);

  // ---------------------------------------------------------------- state

  let access = null;
  let t0 = 0, shown = 0, clock = 0, sensing = 0;
  const channels = new Set(), kinds = new Set();
  const seenValues = new Map();     // `ch/cc` -> values, for classifyEncoder
  const nrpn = createNrpn();
  const inquiries = [];             // every reply that came back
  let sysexGranted = false;

  function render() {
    d.set('inputs', access ? countInputs() : '');
    d.set('messages', shown || '');
    d.set('channels', channels.size || '');
    d.set('kinds', kinds.size || '');
    // Empty until one arrives rather than 0: a zero would claim this device sends no clock.
    // See lessons/page-dump.md#dump-14
    d.set('clock', clock || '');
    d.set('sensing', sensing || '');
  }

  function countInputs() {
    let n = 0;
    for (const _ of access.inputs.values()) n++;
    return n;
  }

  /**
   * One decoded message into the table.
   * @param {ReturnType<decode>} m
   * @param {string} from  which port it arrived on
   */
  /**
   * The tap: on the dev server only, presses are posted to /_tap and land in .tap/midi.jsonl.
   * workers/view has no /_tap route, so a deployed page posts nowhere. Batched every 500 ms
   * (one keyboard sends about 90 messages a second) and fire and forget.
   * See lessons/page-dump.md#dump-15
   */
  const LOCAL = ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname);
  let pending = [], tapTimer = 0, tapped = 0, tapDead = false;

  function tap(m, from) {
    if (!LOCAL || tapDead) return;
    /**
     * A harness run writes nothing to the capture file: a label on a row does not keep it
     * out of the counts read-tap.mjs computes.
     * See lessons/page-dump.md#dump-16
     */
    if (SELFCHECK) return;
    pending.push({ from, bytes: m.bytes, ch: m.ch, kind: m.kind, d1: m.d1, d2: m.d2 });
    if (tapTimer) return;
    tapTimer = setTimeout(() => {
      const batch = pending; pending = []; tapTimer = 0;
      fetch('/_tap', { method: 'POST', body: JSON.stringify({ at: Date.now(), rows: batch }) })
        .then((r) => {
          if (r.ok) { tapped += batch.length; return; }
          // Say it once and stop: a server without the route answers 404 on every batch.
          // See lessons/page-dump.md#dump-17
          tapDead = true;
          d.log('nothing is listening on /_tap, so nothing is being written down');
        })
        .catch(() => { tapDead = true; });
    }, 500);
  }

  function show(m, from) {
    if (m.flood) {
      // Counted, never listed. See `isFlood`.
      if (m.status === 0xf8) clock++; else sensing++;
      render();
      return;
    }
    tap(m, from);
    if (m.ch !== null) channels.add(m.ch);
    kinds.add(m.kind);

    // NRPN is four ordinary messages that also mean themselves, so all four
    // rows stay and the completed parameter is appended to the fourth.
    const done = nrpn.feed(m);

    if (m.cc !== null) {
      const key = `${m.ch}/${m.cc}`;
      const list = seenValues.get(key) || [];
      list.push(m.d2);
      seenValues.set(key, list);
    }

    shown++;
    traffic.add({
      at: `${((performance.now() - t0) / 1000).toFixed(2)}s`,
      ch: m.ch === null ? '' : m.ch,
      what: m.what,
      bytes: m.bytes,
      reading: done ? `${m.reading} ${done}` : m.reading,
      hover: `${from}\nstatus 0x${m.status.toString(16).toUpperCase()}`,
    });

    const reply = readInquiryReply(Array.from(m.raw || []));
    if (reply) inquiries.push({ from, reply });
    render();
  }

  // ---------------------------------------------------------------- the browser

  function listPorts() {
    const rows = [];
    for (const p of access.inputs.values()) {
      rows.push({ name: p.name || '(unnamed)', maker: p.manufacturer || '',
        way: 'in', state: p.state === 'connected' ? p.connection : p.state,
        hover: `id ${p.id}\nversion ${p.version || 'not reported'}` });
    }
    for (const p of access.outputs.values()) {
      rows.push({ name: p.name || '(unnamed)', maker: p.manufacturer || '',
        way: 'out', state: p.state === 'connected' ? p.connection : p.state,
        hover: `id ${p.id}\nversion ${p.version || 'not reported'}` });
    }
    ports.set(rows);
    render();
    return rows;
  }

  /**
   * open() each port explicitly. Assigning onmidimessage is meant to open it, but not
   * reliably across a reload, and a closed port fails silently; port.connection, shown in
   * the ports table, is the one thing that tells them apart.
   * See lessons/page-dump.md#dump-18
   */
  async function wire() {
    for (const p of access.inputs.values()) {
      // A port already open resolves immediately, so this is safe to repeat on
      // every `onstatechange`.
      try { await p.open(); } catch (e) { d.log(`could not open ${p.name}: ${e.message}`, 'warn'); }
      p.onmidimessage = (e) => {
        if (!t0) t0 = performance.now();
        const m = decode(e.data);
        m.raw = e.data;
        show(m, p.name || p.id);
      };
    }
  }

  async function open({ sysex }) {
    if (!navigator.requestMIDIAccess) {
      // No Web MIDI (Safari) is not a fault, so it is a warning and not an error.
      // See lessons/page-dump.md#dump-19
      d.log('this browser has no Web MIDI, so there is nothing to read here', 'warn');
      return false;
    }
    try {
      access = await navigator.requestMIDIAccess({ sysex });
      sysexGranted = sysexGranted || sysex;
      listPorts();
      await wire();
      // Plugging something in after the page loaded is the ordinary case.
      access.onstatechange = async () => { await wire(); listPorts(); };
      bayMidi.attach(access);
      return true;
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return false;
    }
  }

  d.on('listen', async () => {
    const got = await open({ sysex: false });
    if (got) {
      const n = countInputs();
      d.log(n
        ? `${n} input${n === 1 ? '' : 's'} open. Play something, turn something.`
        : 'no MIDI inputs. Plug something in and this list follows it.', n ? 'hi' : '');
    }
    /**
     * verify.mjs presses controls and never calls check, so Listen runs it under SELFCHECK,
     * feeding the known stream itself. A visitor gets only their own instruments.
     * See lessons/page-dump.md#dump-20
     */
    if (SELFCHECK) await d.run('check');
  });

  /**
   * Device inquiry: the one version question every maker's box understands. Under
   * ?selfcheck=1 it sends nothing to real hardware and answers from the stand-in.
   * See lessons/page-dump.md#dump-21
   */
  d.on('ask', async () => {
    if (SELFCHECK) {
      d.log('self-check: asking the known stream rather than the hardware', 'warn');
      feedInquiry();
      return;
    }
    if (!await open({ sysex: true })) {
      d.log('SysEx was refused, so no version can be asked for', 'warn');
      return;
    }
    let sent = 0;
    for (const p of access.outputs.values()) { p.send(deviceInquiry()); sent++; }
    d.log(sent ? `asked ${sent} output${sent === 1 ? '' : 's'} for a version`
               : 'no MIDI outputs to ask', sent ? '' : 'warn');
    // A device may ignore the inquiry; silence is a permitted answer, not an absent device.
    // See lessons/page-dump.md#dump-22
    setTimeout(() => {
      if (!inquiries.length && sent) {
        d.log(`no reply after 1.5 s. A device is allowed to ignore this, so `
            + `silence here does not mean it is absent or asleep.`);
      }
    }, 1500);
  });

  /**
   * Both a handler and the button's action, so d.run('clear') and a press do the same thing.
   * See lessons/page-dump.md#dump-23
   */
  clearBtn.onclick = () => d.run('clear');

  d.on('clear', () => {
    traffic.clear();
    shown = 0; clock = 0; sensing = 0; t0 = 0;
    channels.clear(); kinds.clear(); seenValues.clear(); inquiries.length = 0;
    render();
  });

  // ---------------------------------------------------------------- the stand-in

  /**
   * A known stream, written down here: the only input that can grade the decoder, since what
   * a real device sends is not a known answer. Fed by check only.
   * See lessons/page-dump.md#dump-24
   */
  const KNOWN = [
    [0x90, 60, 100],              // middle C down
    [0x90, 60, 0],                // and up, the way most keyboards do it
    [0x80, 64, 64],               // a real note off, from a keyboard that sends them
    [0xb0, 74, 0],                // an absolute knob, swept
    [0xb0, 74, 18], [0xb0, 74, 37], [0xb0, 74, 55], [0xb0, 74, 74],
    [0xb0, 74, 92], [0xb0, 74, 110], [0xb0, 74, 127], [0xb0, 74, 96],
    [0xb0, 74, 60], [0xb0, 74, 31],
    [0xb1, 16, 1], [0xb1, 16, 1], [0xb1, 16, 1], [0xb1, 16, 65],   // a V-Pot, clicked
    [0xb1, 16, 65], [0xb1, 16, 1], [0xb1, 16, 1], [0xb1, 16, 65],
    [0xb1, 16, 1], [0xb1, 16, 1], [0xb1, 16, 65], [0xb1, 16, 1],
    [0xb0, 99, 1], [0xb0, 98, 40], [0xb0, 6, 77],                  // an NRPN write
    [0xe0, 0x00, 0x40],                                            // pitch bend, centred
    [0xe0, 0x00, 0x60],                                            // and bent up
    [0xc0, 5],                                                     // a patch change
    [0xf8], [0xf8], [0xf8], [0xfe],                                // floods
  ];

  function feedKnown() {
    if (!t0) t0 = performance.now();
    for (const b of KNOWN) { const m = decode(b); m.raw = b; show(m, 'known stream'); }
  }

  function feedInquiry() {
    if (!t0) t0 = performance.now();
    const b = [0xf0, 0x7e, 0x00, 0x06, 0x02, 0x00, 0x20, 0x29,
               0x01, 0x00, 0x02, 0x00, 1, 2, 3, 4, 0xf7];
    const m = decode(b); m.raw = b;
    show(m, 'known stream');
  }

  // ---------------------------------------------------------------- what it can say

  /** Every controller seen, with a verdict about what KIND of controller it is. */
  function verdicts() {
    const out = [];
    for (const [key, values] of seenValues) {
      const [ch, cc] = key.split('/');
      out.push({ ch: +ch, cc: +cc, n: values.length, ...classifyEncoder(values) });
    }
    return out;
  }

  // ---------------------------------------------------------------- checks

  d.on('check', async () => {
    /**
     * Read the empty frame before anything is fed. Measure .pos-tbl-body, the box that
     * scrolls, and the heading's computed display, since [hidden] alone can lose to display: grid.
     * See lessons/page-dump.md#dump-25
     */
    const bodyOf = (t) => t.el.querySelector('.pos-tbl-body');
    const boxH = (t) => +bodyOf(t).getBoundingClientRect().height.toFixed(2);
    const roomIn = (t) => bodyOf(t).querySelectorAll('.pos-tbl-rest').length;
    const headDrawn = (t) => getComputedStyle(t.el.querySelector('.pos-tbl-head')).display !== 'none';
    const empty = {
      h: boxH(traffic), text: bodyOf(traffic).textContent,
      room: roomIn(traffic), rows: traffic.count(),
      portsH: boxH(ports), portsRoom: roomIn(ports), portsRows: ports.count(),
      heads: headDrawn(ports) && headDrawn(traffic),
    };

    // Everything gradable here is gradable from the known stream, which is why
    // it is a control rather than a branch. Nothing below needs a device.
    if (!shown) feedKnown();

    d.assert('the known stream reached the table',
      traffic.count() === KNOWN.length - 4, `${traffic.count()} rows for ${KNOWN.length} messages`);

    // The four flood messages are why the row count is KNOWN.length - 4.
    // See lessons/page-dump.md#dump-26
    d.assert('clock and active sensing were counted, not listed',
      clock === 3 && sensing === 1, `${clock} clock, ${sensing} sensing`);

    // With isFlood off, the count above would be zero and the row count four higher,
    // so asserting both stops the failure moving somewhere quiet.
    // See lessons/page-dump.md#dump-27
    d.assert('no flood reached the table',
      !traffic.columns || clock + sensing === 4, `${clock + sensing} of 4 counted`);

    d.assert('a note on at velocity 0 was read as a note off',
      kinds.has('note off') && !Array.from(kinds).includes('note on at zero'),
      Array.from(kinds).join(', '));

    d.assert('two channels were seen', channels.size === 2, Array.from(channels).join(', '));

    const v = verdicts();
    const abs = v.find((x) => x.cc === 74);
    const rel = v.find((x) => x.cc === 16);

    // Asserted in both directions: a page calling everything relative passes only the first.
    // See lessons/page-dump.md#dump-28
    d.assert('a swept knob is read as absolute', abs?.verdict === 'absolute',
      `CC 74: ${abs?.verdict} (${abs?.why})`);
    d.assert('a clicked encoder is read as relative', rel?.verdict === 'relative',
      `CC 16: ${rel?.verdict} (${rel?.why})`);

    // The four NRPN messages stay rows and the fourth says what they meant.
    // .pos-tbl-head also carries .pos-tbl-row, so the query excludes it.
    // See lessons/page-dump.md#dump-29
    const rows = Array.from(traffic.el.querySelectorAll('.pos-tbl-row:not(.pos-tbl-head)'))
      .map((r) => r.textContent);
    d.assert('the NRPN write is spelled out on its last message',
      rows.some((t) => t.includes('NRPN 168 = 77')), 'looked for `NRPN 168 = 77`');
    d.assert('and its four messages are all still rows',
      rows.filter((t) => / 06 | 62 | 63 /.test(t)).length >= 3, 'CC 99, 98 and 6');

    // Raw bytes beside the reading, asserted on the DOM because the rule is about the screen.
    // See lessons/page-dump.md#dump-30
    d.assert('every row shows its raw bytes',
      rows.every((t) => /[0-9A-F]{2} /.test(t)), `${rows.length} rows`);

    // Pitch bend is the one place the byte order is a trap.
    d.assert('pitch bend is read little endian',
      rows.some((t) => t.includes('8192, centred')), 'looked for `8192, centred`');

    // A version reply decodes even with a three byte manufacturer id.
    feedInquiry();
    d.assert('a device inquiry reply names its maker and version',
      inquiries.length === 1 && inquiries[0].reply.includes('version 1.2.3.4'),
      inquiries[0]?.reply || 'nothing parsed');

    // The ports table stays empty until Listen: a visit opens nothing.
    // See lessons/page-dump.md#dump-31
    d.assert('nothing was opened without a press',
      !SELFCHECK || access === null || countInputs() >= 0,
      access ? `${countInputs()} inputs, after a press` : 'no MIDI access taken');

    d.assert('no secret in this page', !location.href.includes('token'));

    // ── the frame, measured at every filling it can have ──────────────────
    /**
     * minRows means the box never moves: one height at four fillings (empty, overflowing,
     * cleared by the real Clear handler through d.run, and a single row).
     * See lessons/page-dump.md#dump-32
     */
    const full = { h: boxH(traffic), rows: traffic.count() };
    await d.run('clear');
    const cleared = { h: boxH(traffic), rows: traffic.count(), room: roomIn(traffic) };
    feedInquiry();
    const one = { h: boxH(traffic), rows: traffic.count(), room: roomIn(traffic) };

    d.assert('the table is the same height empty, overflowing and emptied again',
      empty.h > 0 && empty.h === full.h && full.h === cleared.h && cleared.h === one.h,
      `${empty.h} px at ${empty.rows} rows, ${full.h} px at ${full.rows}, `
      + `${cleared.h} px cleared, ${one.h} px at ${one.rows}`);

    // The other half: placeholder rows are given back one at a time, always summing to the
    // reserved count, and a placeholder is never counted as a record.
    // See lessons/page-dump.md#dump-33
    d.assert('the room is given back a row at a time, and a row of room is not a row',
      cleared.room === TRAFFIC_ROWS && cleared.rows === 0
        && one.room === TRAFFIC_ROWS - 1 && one.rows === 1,
      `${cleared.room} rows of room over ${cleared.rows} records, `
      + `then ${one.room} over ${one.rows}`);

    d.assert('both tables stood open with nothing written in them, under their own column names',
      empty.text.trim() === '' && empty.rows === 0 && empty.room === TRAFFIC_ROWS
        && empty.portsRows === 0 && empty.portsRoom === PORTS_ROWS && empty.heads,
      `traffic ${empty.room} rows of room and ${empty.rows} records at ${empty.h} px, `
      + `ports ${empty.portsRoom} and ${empty.portsRows} at ${empty.portsH} px, `
      + `both headings drawn, text ${JSON.stringify(empty.text)}`);

    // What a real device would add, said in words rather than left as a silence.
    if (!access) {
      d.log('these checks all ran against the known stream. Press Listen with '
          + 'something plugged in and the same columns describe it.');
    }

    await checkMidiNode({ assert: d.assert, log: d.log, page: bayMidi, slug: 'dump', tap: true });
  });


  render();
  d.ready();
</script>
</html>

<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Every box here has a reserved height: each is filled over the network a second or
     two after the press, and blocks appearing one at a time move what is under the hand.
     See lessons/page-wish.md#wish-1 */
  .wish-said, .wish-patch, .wish-why, .wish-dg, .wish-dump { min-width: 0; }
  .wish-patch { overflow-x: auto; }

  /* The answer is one glued component of three parts: picker row, picture, JSON.
     A glue takes a child's border and shows a 1px `--line` seam through the gap, so
     every part paints its own ground here, on this page's elements, never on `.pos-glue`.
     See lessons/page-wish.md#wish-2 */
  .wish-part { background: var(--card); padding: 10px 12px; }
  /* Action on the left, its model picker on the right. `space-between`, and it wraps,
     because at 390px a button and a five option picker on one line scrolls the page.
     See lessons/page-wish.md#wish-3 */
  .wish-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  /* The picker does not grow, so the word `model` stays with its options.
     See lessons/page-wish.md#wish-4 */
  .wish-head > * { flex: 0 0 auto; }

  /* The bottom part is the object and the verdict on it: every verdict row reads a link
     in the JSON above it, so they share one part with no seam.
     See lessons/page-wish.md#wish-5 */
  /* Its own border: outside the glue nothing else draws its edge.
     See lessons/page-wish.md#wish-6 */
  .wish-dump {
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--line); border-radius: 4px;
  }
  /* Editable with a fixed height: it scrolls rather than grows, and `resize: none`
     because a draggable corner changes the page's height.
     See lessons/page-wish.md#wish-7 */
  .wish-said {
    display: block; width: 100%; height: 64px; resize: none; overflow-y: auto;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px;
    background-color: var(--card); color: var(--ink);
    /* Monospaced: these are the exact words sent to a model, above a monospaced object.
       The size drops with the face, since a monospaced 15px reads larger than a proportional one.
       See lessons/page-wish.md#wish-8 */
    font-family: var(--mono, ui-monospace, monospace); font-size: 13.5px;
    line-height: 1.5;
  }
  .wish-patch {
    /* `pre-wrap`, not `pre`: a long object wraps instead of running off the right edge.
       See lessons/page-wish.md#wish-9 */
    /* Floor and ceiling the same: one connection is 7 lines bare, 12 with one transform,
       16 with two. 14 holds the common case and the longest scrolls inside rather than
       clipping, since the argument a refusal names can be on any line.
       See lessons/page-wish.md#wish-10 */
    min-height: calc(14 * 12px * 1.6); max-height: calc(14 * 12px * 1.6);
    overflow-y: auto;
    white-space: pre-wrap; overflow-wrap: anywhere;
    /* `--dim`, not `--ink`: the object is evidence to check against, not the thing read first.
       See lessons/page-wish.md#wish-11 */
    font: 12px/1.6 var(--mono, ui-monospace, monospace); color: var(--dim);
    /* Empty until there is an answer, with the room still taken. No border here: the edge
       belongs to `.wish-dump`. `[data-shown]` has no rule on purpose; `show()` and
       `clearAnswer()` set it and the checks read it.
       See lessons/page-wish.md#wish-12 */
  }

  /* See lessons/page-wish.md#wish-13 */
  /* No shimmer on either box: `data-busy` is still set on both and the checks read it,
     but the busy state is said by the button's sweep and the log line.
     See lessons/page-wish.md#wish-14 */
  /* One row per connection, each a part of the glue with its own picture and sentence.
     A grid, so the right column is reserved even when empty (see `--wish-act`).
     See lessons/page-wish.md#wish-15 */
  .wish-conn {
    /* Declared here rather than at `:root`, because it is this component's own
       measure and the one element that reads it is a child of this one. */
    --wish-act: 72px;
    display: grid; grid-template-columns: minmax(0, 1fr) var(--wish-act);
    column-gap: 12px;
    /* Overridden by the unified `padding: 10px` further down.
       See lessons/page-wish.md#wish-16 */
    padding: 6px 10px;
  }
  /* The right column is for actions (today the remove `×`) and its width never changes
     with its contents, or the picture moves sideways. `diagram.mjs` stacks below 560px;
     662px of row less 72 and the 12px gap leaves 578, and the check prints that width.
     See lessons/page-wish.md#wish-17 */
  .wish-conn-act {
    grid-column: 2; grid-row: 1 / 3; min-width: 0;
    /* One 34px control fits; two side by side measured 77.3px against 72, so another
       control goes underneath.
       See lessons/page-wish.md#wish-18 */
    /* `flex-start` so the button lines up with the top of the picture, not the middle
       of a 120px tall column.
       See lessons/page-wish.md#wish-19 */
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: flex-start; gap: 6px;
  }
  /* `shell.css`'s 34px square, copied because its rule is scoped to `.pos-controls`.
     Without it this glyph button lays out 45.8px wide in a 72px column.
     See lessons/page-wish.md#wish-20 */
  .wish-conn-act button[data-glyph="1"] {
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    font-size: 15px; line-height: 1;
  }
  /* A row is pressed to choose it. The treatment is copied from `.pos-tbl-row.on`, not
     borrowed by class, and the check compares the two computed grounds.
     See lessons/page-wish.md#wish-21 */
  .wish-conn.pick { cursor: pointer; }
  .wish-conn.pick:hover { background: var(--card2); }
  .wish-conn.pick:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px; }
  /* The lifted ground only, no yellow left bar: on a 180px row it reads as a stripe.
     See lessons/page-wish.md#wish-22 */
  .wish-conn.on { background: var(--card2); }
  /* See lessons/page-wish.md#wish-23 */
  /* Only the row with no picture (a link that starts and ends at one instrument) writes
     here; every other sentence is in the figure's caption, so an empty one takes no room.
     See lessons/page-wish.md#wish-24 */
  .wish-why {
    grid-column: 1; grid-row: 2; min-width: 0;
    font-size: 13px; color: var(--dim);
  }
  .wish-why:empty { display: none; }
  /* The sentence shows when nobody hovers the picture: `createDiagram` marks its caption
     `data-on` on hover. `visibility`, never `display`, so the row keeps its height;
     without `:has()` the rule is dropped and the sentence always shows.
     See lessons/page-wish.md#wish-25 */
  .wish-conn:has(.pos-dg-cap[data-on]) .wish-why { visibility: hidden; }
  .wish-why b { color: var(--bad, #e0908a); font-weight: 600; }
  /* The third verdict, a link missing an argument a person can supply: `--warn`, not
     `--hi`, which already marks the chosen row.
     See lessons/page-wish.md#wish-26 */
  .wish-why-q { color: var(--warn, #e0b060); font-weight: 600; }
  .wish-why i { color: var(--ok, #8fd6a8); font-style: normal; }
  .wish-why-l { color: var(--ink); }

  /* The picture's room is `min-height` and `display: flex` here. The host is inside the
     glue, out of reach of `.pos-stack > div:empty { display: none }`.
     See lessons/page-wish.md#wish-27 */
  /* 120, not 100: `.pos-dg` is 100 but the host is 119 with the figure's caption line.
     See lessons/page-wish.md#wish-28 */
  .wish-dg {
    /* Both states lay out at 119px at this width, so 120 is the default; the box grows
       past it where a narrow screen makes the drawer stack. Padding belongs to the row, so
       `min-height` is the figure's own; `diagram.mjs` centres the figure in its width.
       See lessons/page-wish.md#wish-29 */
    grid-column: 1; grid-row: 1; min-width: 0;
    /* `flex-start` so the picture and the `×` both start at the top of the row at any width;
       the 120px reserve's slack sits under the picture.
       See lessons/page-wish.md#wish-30 */
    min-height: 120px; display: flex; flex-direction: column; justify-content: flex-start;
  }
  /* One padding on both axes, so the air above a picture equals the air beside it.
     See lessons/page-wish.md#wish-31 */
  .wish-conn { padding: 10px; }
  /* No margin: `.pos-dg` carries `margin: 0 0 14px`, which would make a 119px picture
     need 133px against the 120px floor, and the glue only clears direct children.
     See lessons/page-wish.md#wish-32 */
  .wish-dg .pos-dg { margin: 0; }

  /* No `cursor: progress` on the busy hold button: macOS draws a spinner under the hand.
     (0,2,1) beats shell.css's `button[data-busy="1"]` at (0,1,1), whose order this page
     cannot change. The `data-busy` sweep is the button's only signal.
     See lessons/page-wish.md#wish-33 */
  .pos-controls button[data-busy="1"] { cursor: default; }
  /* Nothing paints the model pickers while busy: a picker holds a choice somebody made.
     The check reads them through the whole span and expects nothing.
     See lessons/page-wish.md#wish-34 */
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createTable } from '/shell/table.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, printLink, checkTransforms, delivers, eventOf, isNoteOff, OP_HELP } from '/shell/bay.mjs';
  import { describe, reword } from '/shell/instruments.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { createDiagram } from '/shell/diagram.mjs';

  /**
   * Counts calls to `navigator.requestMIDIAccess`, which prompts and hands over every port,
   * so an assert can read that a visit opened nothing. Wrapped before any page code runs.
   * See lessons/page-wish.md#wish-35
   */
  let midiAsked = 0;
  if (navigator.requestMIDIAccess) {
    const real = navigator.requestMIDIAccess.bind(navigator);
    navigator.requestMIDIAccess = (...a) => { midiAsked++; return real(...a); };
  }

  /**
   * Say what you want and the desk proposes a patch via Workers AI models. Each row it
   * returns is made with `bay.mjs`'s link, send and unlink, and `×` takes it down. No MIDI
   * or Cloudflare call before a press; under `?selfcheck=1` a canned reply and stand-in ports.
   * See lessons/page-wish.md#wish-36
   */

  /**
   * The agent's URL. `?api=` wins, which points the page at `node demo/wish-local.mjs`.
   * See lessons/page-wish.md#wish-37
   */
  /**
   * Otherwise the deployed Worker everywhere: its `NEAR` pattern in
   * `workers/wish/src/wish.mjs` already answers localhost and private ranges.
   * See lessons/page-wish.md#wish-38
   */
  const API = new URLSearchParams(location.search).get('api')
    || 'https://wish.positron.studio';

  /**
   * The desk is described rather than discovered: this page is about the sentence, and
   * each id is the one `/bay/` would build for the same device.
   * See lessons/page-wish.md#wish-39
   */
  /**
   * `box` is declared because the Model 12's `MIDI IN` and `MIDI OUT` ids differ in the
   * middle segment, so an id split cannot pair them.
   * See lessons/page-wish.md#wish-40
   */
  const PORTS = [
    { id: 'here:mk-425c-usb-midi-keyboard:out', dir: 'out', box: 'keys', label: 'MK-425C USB MIDI Keyboard' },
    { id: 'here:circuit:out', dir: 'out', box: 'circuit', label: 'Circuit' },
    { id: 'here:model-12-midi-in:out', dir: 'out', box: 'model12', label: 'Model 12 MIDI IN' },
    /**
     * The Model 12 has two pairs. The control surface is `DAW Control IN` (525 messages
     * measured); `MIDI IN` is the DIN socket and stays silent. The port list is an enum, so a
     * port missing from it is one the model can never name.
     * See lessons/page-wish.md#wish-41
     */
    { id: 'here:model-12-daw-control-in:out', dir: 'out', box: 'model12',
      label: 'Model 12 DAW Control IN' },
    { id: 'here:model-12-daw-control-out:in', dir: 'in', box: 'model12',
      label: 'Model 12 DAW Control OUT' },
    { id: 'here:circuit:in', dir: 'in', box: 'circuit', label: 'Circuit' },
    { id: 'here:model-12-midi-out:in', dir: 'in', box: 'model12', label: 'Model 12 MIDI OUT' },
    { id: 'here:mk-425c-usb-midi-keyboard:in', dir: 'in', box: 'keys', label: 'MK-425C USB MIDI Keyboard' },
  ];
  const PORT = new Map(PORTS.map((p) => [p.id, p]));
  /**
   * Measured facts handed to the model because no manual carries them: knob and macro
   * controller numbers from `research/measured-devices-2026-09-20.md`. Macros 7 and 8
   * (CC 86, 87) are inferred and the prompt says so.
   * See lessons/page-wish.md#wish-42
   */
  const FACTS = 'The MK-425C keyboard sends on MIDI channel 2 and its keys are one semitone '
    + 'flat. Its six rotary knobs send, in the order they are printed on the panel, '
    + 'CC 84, 72, 74, 71, 93 and 5, so its FIRST rotary knob is CC 84. '
    + 'The Circuit listens for Synth 1 on channel 1, Synth 2 on channel 2, drums on '
    + 'channel 10 at notes 60, 62, 64 and 65, and its master filter on channel 16. '
    + 'The Circuit has eight macro knobs on channel 1 sending CC 80 to 87 in order, so its '
    + 'FIRST macro knob is CC 80, and CC 86 and 87 are inferred rather than measured. The '
    + 'Circuit is never sent SysEx, because one SysEx message can overwrite a saved patch. '
    // Model 12 REC is notes 0 to 7 and sends no release; SOLO and MUTE do. A patch playing a
    // synth from REC leaves notes hanging, so the model is told.
    // See lessons/page-wish.md#wish-43
    + 'The TASCAM Model 12 has TWO port pairs and they carry different things. Its '
    + 'buttons, knobs and faders all come out of Model 12 DAW Control IN, and they only '
    + 'send anything when DAW control mode is switched on at the mixer. Model 12 MIDI IN '
    + 'is the 5 pin DIN socket bridged to USB and carries only whatever is patched into '
    + 'that socket, so it is the wrong port for the mixer own controls. '
    + 'On DAW Control IN the REC buttons are notes 0 to 7, SOLO is notes 8 to 15 and MUTE '
    + 'is notes 16 to 23, the PAN knobs are relative CC 16 upward and the faders are pitch '
    + 'bend. REC SENDS NO NOTE OFF, so a link that plays a synth from REC leaves notes '
    + 'hanging, and SOLO or MUTE should be used instead. Those notes are very low, 0 is '
    + 'C-1, so playing a synth from them wants a transpose of about 60. '
    // The operator table is `systemFor()` in `workers/wish/src/wish.mjs`, built from `bay.mjs`.
    // This line says what no per-op line can: a split is two links.
    // See lessons/page-wish.md#wish-44
    + 'A split is two links between the same pair of ports with different ranges and '
    + 'different channels, never one link. Sending one row of buttons somewhere wants a '
    + 'range around just those note numbers, or everything else on that port rides along.';

  /** What each port consents to. The Circuit's line is the one that matters. */
  /**
   * `accepts` is what a port handles (the rest is dropped at the boundary); `never` refuses
   * the link. The Circuit's SysEx is on `never`: its sessions are not restorable.
   * See lessons/page-wish.md#wish-45
   */
  const ACCEPTS = {
    'here:circuit:in': ['note', 'cc', 'bend'],
    'here:model-12-midi-out:in': ['note', 'cc'],
    'here:mk-425c-usb-midi-keyboard:in': [],
  };
  const NEVER = ['sysex'];
  const EMITS = ['note', 'cc', 'bend', 'touch', 'program', 'clock', 'transport'];

  /**
   * `turbo` takes base64, the two older ones an array of bytes (2.67 times the body). On
   * 79s of speech `turbo` returned 1,653 chars in 11.0s, `whisper` 839 in 29.1s. Voice
   * activity detection is `turbo`'s alone.
   * See lessons/page-wish.md#wish-46
   */
  const HEAR = [['turbo', '@cf/openai/whisper-large-v3-turbo'],
                ['whisper', '@cf/openai/whisper'],
                ['tiny', '@cf/openai/whisper-tiny-en']];
  /**
   * The row is `patch`, the project's word for the output; `wire` is taken by
   * `demo/shell/wire.mjs`.
   * See lessons/page-wish.md#wish-47
   */
  const PATCH = [['70B', '@cf/meta/llama-3.3-70b-instruct-fp8-fast'],
                 ['8B', '@cf/meta/llama-3.1-8b-instruct-fp8-fast'],
                 ['3B', '@cf/meta/llama-3.2-3b-instruct'],
                 ['Mistral', '@cf/mistralai/mistral-small-3.1-24b-instruct'],
                 ['Scout', '@cf/meta/llama-4-scout-17b-16e-instruct']];

  /**
   * Full model name and price for the hover title, from Cloudflare's Workers AI pricing
   * page: $0.011 per 1,000 neurons, 10,000 free a day. `whisper-tiny-en` has no published
   * price and says so; the pricing table wins where pages disagree.
   * See lessons/page-wish.md#wish-48
   */
  const PRICE = {
    '@cf/openai/whisper-large-v3-turbo': '$0.0005 per audio minute',
    '@cf/openai/whisper': '$0.0005 per audio minute',
    '@cf/openai/whisper-tiny-en': 'no price published by Cloudflare',
    '@cf/meta/llama-3.3-70b-instruct-fp8-fast':
      '$0.293 per M input tokens, $2.253 per M output tokens',
    '@cf/meta/llama-3.1-8b-instruct-fp8-fast':
      '$0.045 per M input tokens, $0.384 per M output tokens',
    '@cf/meta/llama-3.2-3b-instruct':
      '$0.051 per M input tokens, $0.335 per M output tokens',
    '@cf/mistralai/mistral-small-3.1-24b-instruct':
      '$0.351 per M input tokens, $0.555 per M output tokens',
    '@cf/meta/llama-4-scout-17b-16e-instruct':
      '$0.270 per M input tokens, $0.850 per M output tokens',
  };
  /**
   * A model with no row in `PRICE` gets a one line tooltip and the check goes red; `filter`
   * drops the missing line rather than print `undefined`.
   * See lessons/page-wish.md#wish-49
   */
  const priceTip = (id) => [id, PRICE[id]].filter(Boolean).join('\n');

  const d = mount({
    name: 'wish',
    /**
     * See lessons/page-wish.md#wish-50
     */
    /**
     * One sentence; a row that arrives is already made, and what `×` does is on its hover.
     * See lessons/page-wish.md#wish-51
     */
    what: 'Say which instrument should play which, and a language model makes the connection on the desk.',
    /**
     * `readout: null` declares no readout on purpose (the shell's `readoutOptOut`). Each
     * proposal logs its time, link count, refusals and tokens instead. The empty box is
     * measured below: an empty `.pos-readout` draws a band.
     * See lessons/page-wish.md#wish-52
     */
    readout: null,
    controls: [
      /* Control 0, so `settleMs` lands on it and the harness presses it; canned reply under
         `?selfcheck=1`. The label names the gesture. Not primary: it also wears the busy sweep.
         See lessons/page-wish.md#wish-53 */
      { id: 'speak', label: 'Hold to talk' },
      /* No `Ask` button: a release transcribes and proposes by itself, and the box submits on
         Enter (Shift+Enter is a newline). Examples are in `EXAMPLES`. The checks hang off
         `d.on('check')`, so the harness reaching this row adds no asserts.
         See lessons/page-wish.md#wish-54 */
      /* `Interpret` asks about whatever is in the box. A button because a harness cannot press
         a key in a textarea. All three ways in share `askBox()`.
         See lessons/page-wish.md#wish-55 */
      { id: 'interpret', label: 'Interpret' },
    ],
  });
  guard(d);

  /**
   * Each picker heads the component its model fills. Rows, not loose pickers, because
   * `.pos-choice` is inline and takes no margin; `.pos-crow` is the kit's row for this.
   * See lessons/page-wish.md#wish-56
   */
  /**
   * Both pickers say `model`; the button on the left names the step.
   * See lessons/page-wish.md#wish-57
   */
  const hearPick = createChoice({ label: 'model', options: HEAR, at: 0, title: priceTip });
  const patchPick = createChoice({ label: 'model', options: PATCH, at: 0, title: priceTip });

  /**
   * A header is an action left and its model right. The buttons leave `.pos-controls`, and
   * `demo/verify.mjs` presses only that row, so the checks press `speak` and `interpret` by
   * name. `d.button(id)` finds a control wherever it sits.
   * See lessons/page-wish.md#wish-58
   */
  const header = (left, pick) => {
    const part = el('div', 'wish-part');
    const row = el('div', 'wish-head');
    row.append(left, pick.el);
    part.append(row);
    return { part, row };
  };

  /**
   * Editable: a mis-heard word is retyped rather than re-recorded, and re-asking the same
   * words tells a mis-hearing from a mis-reading.
   * See lessons/page-wish.md#wish-59
   */
  const said = el('textarea', 'wish-said');
  /**
   * No placeholder: `Hold to talk` and `Interpret` name the gestures. Enter still asks
   * and Shift+Enter makes a newline; the check stays.
   * See lessons/page-wish.md#wish-60
   */
  said.spellcheck = false;
  const patch = el('pre', 'wish-patch');

  /**
   * A connection is a row: its picture left, a reserved actions column right, its sentence
   * under. One empty row is built whenever there is no answer, so the component keeps its
   * height when a one link reply lands.
   * See lessons/page-wish.md#wish-61
   */
  function connRow() {
    const row = el('div', 'wish-part wish-conn');
    /* The picture's room, taken from the first paint. See `.wish-dg`. */
    const fig = el('div', 'wish-dg');
    const act = el('div', 'wish-conn-act');
    const say = el('div', 'wish-why');
    row.append(fig, act, say);
    return { el: row, fig, act, say };
  }

  /**
   * `createGlue` is documented for one pair; it takes `...blocks`, so three parts is fine.
   * The middle part has no outer border, only seams, so every part carries `wish-part`
   * to paint its own ground (see the stylesheet).
   * See lessons/page-wish.md#wish-62
   */
  /**
   * See lessons/page-wish.md#wish-63
   */
  const dump = el('div', 'wish-dump wish-part');
  dump.append(patch);
  const speakBtn = d.button('speak');
  /**
   * The hear block is glued too: picker and transcript are one surface, and `said`
   * carries `wish-part` to paint its own ground.
   * See lessons/page-wish.md#wish-64
   */
  said.classList.add('wish-part');
  const hear = header(speakBtn, hearPick);
  const patchHead = header(d.button('interpret'), patchPick);
  const hearRow = hear.row;
  const patchRow = patchHead.row;
  /**
   * See lessons/page-wish.md#wish-65
   */
  const heard = createGlue(hear.part, said);
  /**
   * Connection rows sit after the header and are the only parts that come and go; a part
   * inserted into `.pos-glue` gets the same 1px seam as the rest.
   * See lessons/page-wish.md#wish-66
   */
  /**
   * The object block is its own surface, not the glue's last part: it is a reading of the
   * row a person pressed, so the page's rhythm sits between them.
   * See lessons/page-wish.md#wish-67
   */
  const answer = createGlue(patchHead.part, connRow().el);

  /**
   * Example sentences, some of which go wrong. A row writes into the box the microphone
   * fills and asks. Its own block: `.pos-tbl` paints its own border, which a glue would take.
   * The table never says what the answer will be; what each returned is on the row's hover.
   * See lessons/page-wish.md#wish-68
   */
  /**
   * One dim column. `about` is still carried and the check drill reports with it; a marked
   * row still lifts, since `.pos-tbl-row.on` is a rule on the row.
   * See lessons/page-wish.md#wish-69
   */
  const examples = createTable({
    columns: [
      { key: 'say', label: 'ask', grow: true },
    ],
    note: 'was',
    empty: '',
    onPick: (r) => useExample(r),
  });
  /**
   * Above `Hold to talk`, so the page reads in order: examples, your own sentence, answer.
   * See lessons/page-wish.md#wish-70
   */
  /* The object block is a sibling of the answer, so the page's rhythm sits between them.
     See lessons/page-wish.md#wish-71 */
  d.el.append(examples.el, heard, answer, dump);

  /**
   * See lessons/page-wish.md#wish-72
   */
  /**
   * A row presses `Interpret` rather than doing its work, so `shell.mjs` paints the busy
   * state, disables and clears it in one place. The box is filled first, since `askBox`
   * reads it on the press. A row pressed mid-flight is refused before it marks anything.
   * See lessons/page-wish.md#wish-73
   */
  function useExample(r) {
    const go = d.button('interpret');
    if (go.disabled) {
      d.log('a proposal is already being made, so that example was not asked');
      return;
    }
    said.value = r.say;
    examples.mark((x) => x.say === r.say);
    go.click();
  }

  /**
   * Every control lives in a glued header, so the empty row is hidden or it draws a 14px
   * band. Asked of the row, so a control returning to it brings it back.
   * See lessons/page-wish.md#wish-74
   */
  if (!d.controls.querySelector('button')) d.controls.hidden = true;

  /**
   * The box an answer will land in sweeps while its model works: `said` while `/hear` is
   * out, `patch` while `/wish` is out, never both and never the pickers. Paint only, so
   * nothing changes size.
   * See lessons/page-wish.md#wish-76
   */
  function waitFor(stage = null) {
    /* Set and deleted, never `''`: `[data-busy]` matches on presence.
       See lessons/page-wish.md#wish-75 */
    const paint = (node, on) => { if (on) node.dataset.busy = '1'; else delete node.dataset.busy; };
    paint(said, stage === 'hear');
    paint(patch, stage === 'patch');
  }

  // ── the desk, as a bay, so the proposal is graded by the real validator ───

  /**
   * See lessons/page-wish.md#wish-77
   */
  function freshBay({ live = false } = {}) {
    const b = createBay();
    for (const p of PORTS) {
      b.addPort({
        id: p.id, label: p.label, dir: p.dir, medium: 'midi', shape: { protocol: '1.0' },
        ...(p.dir === 'in'
          ? { accepts: ACCEPTS[p.id] ?? ['note', 'cc'], never: NEVER,
              ...(live ? { deliver: (ev) => writeOut(p.id, ev) } : {}) }
          : { emits: EMITS }),
      });
    }
    return b;
  }

  /**
   * Every proposed link goes through `bay.mjs`'s validator and refusals sit beside the line
   * that caused them: a model's output is an opinion, the validator has the argument.
   * See lessons/page-wish.md#wish-78
   */
  /**
   * A transform with a required argument absent (e.g. `{ op: 'cc', to: 1 }`) is a question,
   * not a refusal. Tested on the object via `OP_HELP`'s `args`, `need`, `oneOf`, never on
   * `checkTransforms`' English. A key the op does not have, or a bad type, stays refused.
   * See lessons/page-wish.md#wish-79
   */
  const OP_BY_NAME = new Map(OP_HELP.map((o) => [o.op, o]));
  function missingArg(transforms) {
    for (const t of transforms || []) {
      const op = OP_BY_NAME.get(t?.op);
      if (!op) continue;
      const given = Object.keys(t).filter((k) => k !== 'op');
      if (given.some((k) => !op.args.includes(k))) continue;
      const gap = op.need.find((k) => t[k] === undefined || t[k] === null);
      if (gap) return { op: t.op, key: gap };
      if (op.oneOf.length && op.oneOf.every((k) => t[k] === undefined || t[k] === null)) {
        return { op: t.op, key: op.oneOf.join(' or ') };
      }
    }
    return null;
  }

  function grade(links) {
    const b = freshBay();
    const rows = [];
    let ok = 0;
    let waiting = 0;
    for (const l of links) {
      const bad = checkTransforms(l.transforms || []);
      /* `checkTransforms` says what a transform is missing, `validate` what the desk will not
         do; a gap is a question, not a verdict.
         See lessons/page-wish.md#wish-80 */
      const gap = bad ? missingArg(l.transforms) : null;
      const v = bad ? { ok: false, ...bad } : b.validate(l.from, l.to, l.transforms || []);
      if (v.ok) { b.link(l.from, l.to, l.transforms || []); ok++; }
      else if (gap) waiting++;
      /**
       * `warn` on an allowed link is what the far end drops (e.g. touch, program, clock).
       * See lessons/page-wish.md#wish-81
       */
      /* `fix` is `bay.mjs`'s own sentence, so both pages that print refusals share one vocabulary.
         See lessons/page-wish.md#wish-82 */
      rows.push({ link: l, say: sayLink(l), carries: carriedBy(l),
                  ok: v.ok, needs: !v.ok && !!gap, gap,
                  why: v.why, fix: v.fix || '', warn: v.warn || '' });
    }
    /* Three disjoint counts: a link awaiting a number is neither ok nor refused.
       See lessons/page-wish.md#wish-83 */
    return { rows, ok, needs: waiting, refused: rows.length - ok - waiting };
  }

  // ── the desk, and the links that are real ────────────────────────────────

  /**
   * A proposal is made into a connection with `bay.mjs`: `link()` validates and holds it,
   * `send()` transforms and filters, `deliver` is the one way out, `unlink()` takes it down.
   * `grade()` uses a fresh bay per press; this one holds only links actually made.
   * See lessons/page-wish.md#wish-84
   */
  /** Destination port id -> something with `.send(bytes)`. */
  const outs = new Map();
  /** Source port id -> something with `.onmidimessage`. */
  const ins = new Map();
  /**
   * Counts messages turned into bytes and written to a port, the only number here that
   * means something left the tab; `bay.mjs` counts only queued and handed.
   * See lessons/page-wish.md#wish-85
   */
  let crossed = 0;
  let deskOpen = null;

  const desk = freshBay({ live: true });

  /**
   * Event to bytes. No branch for SysEx, program change or clock, so none can be expressed
   * whatever a link says: a second wall behind `never`, since the Circuit's sessions are
   * not restorable. The one function on this page that can put a byte on a wire.
   * See lessons/page-wish.md#wish-86
   */
  function toBytes(ev) {
    const ch = Math.max(0, Math.min(15, (ev.ch ?? 1) - 1));
    if (ev.cls === 'note') return [(isNoteOff(ev) ? 0x80 : 0x90) | ch, ev.d1, ev.d2 ?? 0];
    if (ev.cls === 'cc') return [0xb0 | ch, ev.d1, ev.d2 ?? 0];
    if (ev.cls === 'bend') return [0xe0 | ch, ev.d1 ?? 0, ev.d2 ?? 64];
    return null;
  }

  function writeOut(id, ev) {
    const bytes = toBytes(ev);
    const port = outs.get(id);
    if (!bytes || !port) return;
    try { port.send(bytes); crossed++; }
    catch (e) { d.log(`${NAME_OF(id)} refused a message: ${e.message}`, 'warn'); }
  }

  /**
   * All Notes Off (CC 123) then All Sound Off (CC 120) on every channel when a link comes
   * down: Model 12 REC sends no note off, and a stuck note is on a channel nothing tracks.
   * Ordinary channel mode messages, nothing `toBytes` could not build.
   * See lessons/page-wish.md#wish-87
   */
  function hush(id) {
    const port = outs.get(id);
    if (!port) return 0;
    let n = 0;
    for (let ch = 1; ch <= 16; ch++) {
      for (const cc of [123, 120]) {
        try { port.send(toBytes({ cls: 'cc', ch, d1: cc, d2: 0 })); n++; crossed++; }
        catch { /* a port may have gone between the press and here */ }
      }
    }
    return n;
  }

  /**
   * See lessons/page-wish.md#wish-88
   */
  function wireSource(id, port) {
    port.onmidimessage = (e) => {
      desk.send(id, eventOf(decode(Array.from(e.data))));
    };
  }

  /**
   * Nothing is opened until an answer to a press arrives (`show`, `connectAll`, `connect`),
   * and never under `?selfcheck=1`, where the same wiring runs against two stand-in ports.
   * See lessons/page-wish.md#wish-89
   */
  function openDesk() {
    if (!deskOpen) deskOpen = SELFCHECK ? Promise.resolve(standInPorts()) : realPorts();
    return deskOpen;
  }

  /**
   * Matched on the port's name, a known weakness: `PORTS` is declared, and CoreMIDI renames
   * a held port (`Circuit 2`). A renamed instrument reads as unplugged and the log names it.
   * See lessons/page-wish.md#wish-90
   */
  async function realPorts() {
    if (!navigator.requestMIDIAccess) {
      d.log('this browser has no Web MIDI, so nothing here can be connected', 'warn');
      return { real: true, ports: 0 };
    }
    let access;
    try { access = await navigator.requestMIDIAccess({ sysex: false }); }
    catch (e) { d.log(`MIDI was refused: ${e.message}`, 'warn'); return { real: true, ports: 0 }; }
    const adopt = () => {
      for (const p of PORTS) {
        /* A port this page calls `out` is a thing that SENDS, which is a Web
           MIDI input. The two vocabularies are opposite and this is where they
           meet. */
        const pool = p.dir === 'out' ? access.inputs : access.outputs;
        const found = [...pool.values()].find((x) => x.name === p.label);
        const map = p.dir === 'out' ? ins : outs;
        if (!found) { map.delete(p.id); continue; }
        if (map.get(p.id) === found) continue;
        map.set(p.id, found);
        if (p.dir === 'out') wireSource(p.id, found);
      }
    };
    adopt();
    /* Plugging an instrument in after the page loaded is the ordinary case, not
       an edge one. A page that looks once is a page you have to reload. */
    access.onstatechange = adopt;
    const here = PORTS.filter((p) => ins.has(p.id) || outs.has(p.id)).length;
    d.log(`${here} of ${PORTS.length} ports on this desk answered`);
    return { real: true, ports: here };
  }

  /**
   * The stand-in swaps two objects for two ports and keeps the decode, class, encoder and
   * both maps on the path. It cannot grade `requestMIDIAccess` or real port names.
   * See lessons/page-wish.md#wish-91
   */
  const heardBytes = [];
  function standInPorts() {
    for (const p of PORTS) {
      if (p.dir === 'in') {
        outs.set(p.id, { send: (bytes) => heardBytes.push({ id: p.id, bytes }) });
      } else {
        const port = { name: p.label, onmidimessage: null };
        ins.set(p.id, port);
        wireSource(p.id, port);
      }
    }
    return { real: false, ports: PORTS.length };
  }

  /**
   * Both ends must be there, or the row says connected and nothing can cross.
   * See lessons/page-wish.md#wish-92
   */
  async function connect(c) {
    await openDesk();
    const miss = !ins.has(c.link.from) ? c.link.from : !outs.has(c.link.to) ? c.link.to : null;
    if (miss) {
      d.log(`nothing on this desk answered to ${NAME_OF(miss)}, so that connection was not made`, 'warn');
      return false;
    }
    const r = desk.link(c.link.from, c.link.to, c.link.transforms || []);
    if (!r.ok) { d.log(`the desk refused that connection: ${r.why}`, 'warn'); return false; }
    c.linkId = r.id;
    d.log(`connected ${c.row.say}`, 'hi');
    return true;
  }

  /** @param {boolean} [quiet] one line per answer rather than one per link. */
  function disconnect(c, quiet = false) {
    if (!c.linkId) return false;
    desk.unlink(c.linkId);
    c.linkId = null;
    const n = hush(c.link.to);
    if (!quiet) d.log(`disconnected ${c.row.say}, and ${n} quietening messages went after it`);
    return true;
  }

  // ── the words, the names and the picture ─────────────────────────────────

  /**
   * A row shows the port's name; the site (`here:`) appears only when it is not this machine.
   * `printLink` is not changed for this: `parseLink` reads its output back and `bay-test.mjs`
   * asserts the round trip. This reuses it for the transform half.
   * See lessons/page-wish.md#wish-93
   */
  const NAME_OF = (id) => {
    const p = PORT.get(id);
    if (!p) return id;                      // a port the model invented
    const site = id.split(':')[0];
    return site === 'here' ? p.label : `${site} ${p.label}`;
  };
  /** ` { transpose +1 }` or `''`, straight out of `printLink`. */
  const TRANSFORM_TEXT = (l) =>
    printLink({ from: 'x', to: 'y', transforms: l.transforms || [] }).slice('x -> y'.length);
  const sayLink = (l) => `${NAME_OF(l.from)} to ${NAME_OF(l.to)}${TRANSFORM_TEXT(l)}`;

  /** What would actually cross this link: what the source can emit, after the
   *  transforms, kept to what the destination consents to. */
  function carriedBy(l) {
    const dst = PORT.get(l.to);
    if (!PORT.get(l.from) || !dst) return [];
    try {
      const could = delivers(EMITS, l.transforms || []);
      const takes = ACCEPTS[dst.id] ?? ['note', 'cc'];
      return [...could].filter((c) => takes.includes(c));
    } catch { return []; }                  // a transform name that does not exist
  }

  /**
   * The result diagram: no `how`, no title, under the JSON it draws. Only instruments a link
   * touches are drawn, so an arrow to the wrong instrument shows at once.
   * See lessons/page-wish.md#wish-94
   */
  /**
   * `also` is what people call each instrument (the MK-425C is an Evolution). Typed data,
   * never derived from the label, and only in the prose the model reads: `from` and `to` stay
   * an enum of real ids. `the desk` is not an alias, since it means the whole rig.
   * See lessons/page-wish.md#wish-95
   */
  /**
   * A box's note is built from `PORTS`, `ACCEPTS`, `EMITS` and `NEVER`, the same tables the
   * proposal is validated against, plus one typed line per box: the channel it answers on,
   * shared with `FACTS`.
   * See lessons/page-wish.md#wish-96
   */
  /**
   * Terse: `createDiagram` reports a note that overruns its box.
   * See lessons/page-wish.md#wish-97
   */
  const CHANNELS = {
    keys: 'Sends on channel 2, one semitone flat.',
    circuit: 'Synth 1 ch 1, synth 2 ch 2, drums ch 10, master filter ch 16.',
    model12: 'Nine faders sending pitch bend.',
  };
  const INSTRUMENTS = [
    { id: 'keys', label: 'MK-425C', sub: 'MIDI keyboard', kind: 'device',
      also: ['Evolution', 'Evolution MK-425C', 'MK-425C', 'the keyboard'] },
    { id: 'circuit', label: 'Circuit', sub: 'Novation synth', kind: 'device',
      also: ['Novation', 'Novation Circuit', 'the synth'] },
    { id: 'model12', label: 'Model 12', sub: 'TASCAM mixer', kind: 'device',
      also: ['TASCAM', 'TASCAM Model 12', 'the mixer'] },
  ];

  /**
   * `never` is named apart from what a port does not accept: off `accepts` is dropped and
   * reported, on `never` refuses the link.
   * See lessons/page-wish.md#wish-98
   */
  function portNote(boxId) {
    const mine = PORTS.filter((p) => p.box === boxId);
    const lines = mine.map((p) => {
      if (p.dir === 'out') return `Out sends ${EMITS.join(', ')}.`;
      const takes = ACCEPTS[p.id] ?? ['note', 'cc'];
      /**
       * A port with `ACCEPTS` of `[]` says it accepts nothing, and the `never` refusal gets its
       * own sentence with the word `refused`, so the two lists do not read as one.
       * See lessons/page-wish.md#wish-99
       */
      const refused = NEVER.length
        ? ` A ${NEVER.join(' or ')} link is refused.` : '';
      return (takes.length
        ? `In accepts ${takes.join(', ')}.`
        : 'In accepts no messages at all.') + refused;
    });
    return [CHANNELS[boxId], ...lines].filter(Boolean).join(' ');
  }

  /**
   * The sub names which port of the instrument the proposal uses (Model 12 has four, and
   * only `DAW Control IN` carries its buttons); an untouched box keeps its kind. The
   * instrument's name comes off the front; `Circuit` falls back to the direction.
   * See lessons/page-wish.md#wish-100
   */
  function portSub(boxId, rows) {
    const box = INSTRUMENTS.find((n) => n.id === boxId);
    const used = [];
    for (const r of rows) {
      for (const id of [r.link.from, r.link.to]) {
        const p = PORT.get(id);
        if (p && p.box === boxId && !used.includes(p)) used.push(p);
      }
    }
    return used.map((p) => {
      const rest = box && p.label.startsWith(box.label)
        ? p.label.slice(box.label.length).trim() : p.label;
      return rest || (p.dir === 'in' ? 'in' : 'out');
    }).join(' and ');
  }

  /**
   * Built at call time, not folded into `PORTS`, which `freshBay()` and the picture read.
   * See lessons/page-wish.md#wish-101
   */
  const portsForModel = () => PORTS.map((p) => {
    const also = INSTRUMENTS.find((n) => n.id === p.box)?.also;
    return also?.length ? { ...p, also } : { ...p };
  });
  /**
   * No caption: a refused arrow says `refused` itself. The line under the picture is a box's
   * hover sentence, and `captionTexts` reserves its height.
   * See lessons/page-wish.md#wish-102
   */

  /**
   * One arrow per pair of instruments. A refused link is drawn, labelled `refused`. Two links
   * between one pair are one arrow; every caller passes one link today. A link that starts and
   * ends at one instrument has no arrow and is counted.
   * See lessons/page-wish.md#wish-103
   */
  function arrowsFor(rows) {
    const pairs = new Map();
    let loops = 0;
    for (const r of rows) {
      const a = PORT.get(r.link.from)?.box, b = PORT.get(r.link.to)?.box;
      if (!a || !b) continue;
      if (a === b) { loops++; continue; }
      const key = `${a}|${b}`;
      const g = pairs.get(key) || { from: a, to: b, n: 0, ok: 0, needs: 0, why: '',
                                    carries: new Set(), ts: new Set(), ports: new Set(),
                                    drops: '' };
      g.n++;
      if (r.needs) g.needs++;
      /* Which ports, as a `Set`: a split sends two links down the same pair.
         See lessons/page-wish.md#wish-104 */
      g.ports.add(`${NAME_OF(r.link.from)} to ${NAME_OF(r.link.to)}`);
      if (r.ok) {
        g.ok++;
        r.carries.forEach((c) => g.carries.add(c));
        /* Every distinct transform, since a split carries two.
           See lessons/page-wish.md#wish-105 */
        const t = TRANSFORM_TEXT(r.link).replace(/^ \{ | \}$/g, '');
        if (t) g.ts.add(t);
        g.drops = g.drops || r.warn;
      } else if (!g.why) g.why = r.why;
      pairs.set(key, g);
    }
    /**
     * See lessons/page-wish.md#wish-106
     */
    /**
     * An allowed arrow is labelled with the classes that cross it, a refused one `refused`.
     * A label gets 52px over two lines (`GAP_X_MAX` 58 less 2 x `EDGE_OUT`); `note, cc, bend`
     * is the longest and wraps. Everything longer is in the note.
     * See lessons/page-wish.md#wish-107
     */
    const links = [...pairs.values()].map((g) => {
      const ports = [...g.ports].join(' and ');
      const also = g.n > 1 ? ` The model proposed ${g.n} links between these two.` : '';
      const ts = [...g.ts].join(' and ');
      /**
       * Allowed: grey line named by its cargo. Incomplete: grey line, `?`. Refused: red, `refused`.
       * Boxes stay solid on all three. A missing instrument is not reachable: ports are an enum,
       * so drawing one needs a free text field in the Worker's schema.
       * See lessons/page-wish.md#wish-108
       */
      const state = g.ok ? 'ok' : g.needs === g.n ? 'needs' : 'bad';
      return {
        from: g.from,
        to: g.to,
        /* `bad: true` paints line, label and arrowhead red; the label still says `refused`.
           See lessons/page-wish.md#wish-109 */
        bad: state === 'bad',
        label: state === 'ok' ? [...g.carries].join(', ') : state === 'needs' ? '?' : 'refused',
        /* The whole connection in the line under the picture: which ports, what crosses and after
           what, and what the far end drops.
           See lessons/page-wish.md#wish-110 */
        note: state === 'ok'
          ? `${ports}. It carries ${[...g.carries].join(', ') || 'nothing'}`
            + `${ts ? `, after ${ts}` : ''}.`
            + (g.drops ? ` ${g.drops}.` : '')
            + also
          : `${ports}. ${g.why}` + also,
      };
    });
    return { links, loops };
  }

  /**
   * Draws one row's links into that row's own host, through `arrowsFor`, which takes a list.
   * See lessons/page-wish.md#wish-111
   */
  function drawOne(host, r) {
    const { links, loops } = arrowsFor([r]);
    if (loops) {
      d.log('a proposed link began and ended at one instrument, '
        + 'so its row has no picture in it');
    }
    /**
     * Only the instruments the proposal touches: an unattached box would claim the model
     * considered and left it out. Both ends of a refused link stay.
     * See lessons/page-wish.md#wish-112
     */
    const touched = new Set(links.flatMap((l) => [l.from, l.to]));
    /**
     * The note is derived by `portNote()` from the validator's own tables, so it cannot drift.
     * See lessons/page-wish.md#wish-113
     */
    const nodes = INSTRUMENTS.filter((n) => touched.has(n.id))
      .map((n) => ({ ...n, sub: portSub(n.id, [r]) || n.sub, note: portNote(n.id) }));
    /**
     * No links, no picture: an empty `createDiagram` still draws a figure and a caption line
     * round nothing. `clearAnswer()` empties the host on the other route. The room stays (see
     * `.wish-dg`).
     * See lessons/page-wish.md#wish-114
     */
    if (!links.length) { host.replaceChildren(); return { dg: null, drawn: 0, loops, boxes: 0 }; }
    /* The row's sentence is this figure's caption, the slot `createDiagram` swaps on hover.
       See `captionFor`.
       See lessons/page-wish.md#wish-115 */
    const caption = captionFor(r);
    /**
     * `align: 'left'`: centred, rows with different box counts put their first box at
     * different x. Reserving the action column only moves where the space ends.
     * See lessons/page-wish.md#wish-116
     */
    return { dg: createDiagram(host, { nodes, links, caption, align: 'left' }),
             drawn: links.length, loops, boxes: nodes.length };
  }

  /**
   * Two empty states: nothing asked yet (the box shows nothing and `.wish-patch` holds its
   * floor), and a model that proposed nothing, which is reported in the log.
   * See lessons/page-wish.md#wish-117
   */
  /* Nothing in the box: the empty reply is reported in the log, since a comment inside a
     JSON box is something a reader tries to parse.
     See lessons/page-wish.md#wish-118 */
  const EMPTY_PATCH = '';

  /**
   * The patch box is JSON: the compact patch language hid evidence, e.g. a `to: 1` the
   * refusal underneath named.
   * See lessons/page-wish.md#wish-119
   */
  /**
   * The lines a row says about its connection. No verdict word: the arrow carries all three
   * states, and `data-verdict` carries it for checks. A refusal gets `bay.mjs`'s problem and
   * fix; an allowed link gets what the far end drops (a MIDI source emits six classes).
   * See lessons/page-wish.md#wish-120
   */
  /**
   * Every row names its connection first, then what is wrong, then what would fix it; an
   * allowed link prints what the far end drops instead.
   * See lessons/page-wish.md#wish-121
   */
  function sayRow(r) {
    const lines = [r.say];
    if (r.ok) { if (r.warn) lines.push(r.warn); }
    else {
      if (r.why) lines.push(r.why);
      if (r.fix) lines.push(r.fix);
    }
    return lines.filter(Boolean);
  }
  /**
   * The same lines as one string for the caption slot, which `createDiagram` shows when
   * nothing is hovered. Newline-joined; `.wish-dg .pos-dg-cap` makes it break.
   * See lessons/page-wish.md#wish-122
   */
  const captionFor = (r) => sayRow(r).join('\n');

  /**
   * `chosen` is an index into this list, so the object block has one answer to which
   * connection it shows.
   * See lessons/page-wish.md#wish-123
   */
  let conns = [];
  let chosen = -1;

  /** Put a fresh set of rows into the glue, between the header and the object. */
  /* Rows go at the end of the glue: the object block is not a child of it, and an
     `insertBefore` on a non-child throws.
     See lessons/page-wish.md#wish-124 */
  function layRows(rows) {
    for (const old of [...answer.children]) {
      if (old.classList.contains('wish-conn')) old.remove();
    }
    for (const row of rows) answer.append(row);
  }

  /**
   * The object block shows the chosen connection, still as a one element array so its shape
   * never changes. Indented and wrapped, never clipped.
   * See lessons/page-wish.md#wish-125
   */
  function choose(i) {
    chosen = conns[i] ? i : -1;
    conns.forEach((c, n) => {
      c.el.classList.toggle('on', n === chosen);
      c.el.setAttribute('aria-pressed', String(n === chosen));
    });
    patch.textContent = conns[chosen]
      ? JSON.stringify([conns[chosen].link], null, 2) : EMPTY_PATCH;
    /* Both of these are things to show, the object and the report that there is
       no object, so both get the box's edges. See `.wish-patch`. */
    patch.dataset.shown = '1';
  }

  /**
   * One tab stop for the list, arrows move inside it, Enter and Space choose: `table.mjs`'s
   * pattern, which is on this page too.
   * See lessons/page-wish.md#wish-126
   */
  function wire(c, i) {
    c.el.classList.add('pick');
    c.el.setAttribute('role', 'button');
    c.el.tabIndex = i === 0 ? 0 : -1;
    c.el.addEventListener('click', () => choose(conns.indexOf(c)));
    c.el.addEventListener('focus', () => {
      for (const other of conns) other.el.tabIndex = other === c ? 0 : -1;
    });
    c.el.addEventListener('keydown', (e) => {
      /* Only the row's own keys: otherwise a Space on the remove button inside the row is taken
         as choose and the button never fires.
         See lessons/page-wish.md#wish-127 */
      if (e.target !== c.el) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(conns.indexOf(c)); return; }
      const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
      const jump = e.key === 'Home' ? 0 : e.key === 'End' ? conns.length - 1 : null;
      if (step === undefined && jump === null) return;
      /* Or the page scrolls under the arrow as well as the focus moving, which
         puts the row you just reached somewhere you did not expect. */
      e.preventDefault();
      const here = conns.indexOf(c);
      const want = jump !== null ? jump : here + step;
      conns[Math.max(0, Math.min(conns.length - 1, want))]?.el.focus();
    });
  }

  /**
   * The right of a row holds one control, `×`. A row that exists is connected (`show` connects
   * every allowed row), and `×` takes link and row down in one gesture. Not in `.pos-controls`,
   * which `demo/verify.mjs` presses in order and would empty the page mid-check.
   * See lessons/page-wish.md#wish-128
   */
  function fitActions(c) {
    /* `×` U+00D7 has no emoji form, unlike `✖`.
       See lessons/page-wish.md#wish-129 */
    const rm = el('button', '', '×', { 'data-glyph': '1',
      'aria-label': `remove ${c.row.say}`,
      title: 'takes this connection down\nand off the page' });
    rm.addEventListener('click', (e) => {
      /* The row is `role="button"`; stop the press here or it would choose a row that is about
         to go.
         See lessons/page-wish.md#wish-130 */
      e.stopPropagation();
      removeRow(c);
    });
    c.rm = rm;
    c.act.append(rm);
  }

  /**
   * Laying rows down makes the connections. `show` runs only out of `think`, after a press;
   * `requestMIDIAccess` sits behind `openDesk` under the first `connect`. A row the desk could
   * not make has no `data-connected`. One chain so answers cannot overlap and checks await one.
   * See lessons/page-wish.md#wish-131
   */
  let connecting = Promise.resolve();
  function connectAll() {
    const want = conns.filter((c) => c.row.ok && !c.linkId);
    connecting = connecting.then(async () => {
      for (const c of want) {
        /* Removed, or replaced by a newer answer, while the desk was opening. */
        if (!conns.includes(c)) continue;
        if (await connect(c)) c.el.dataset.connected = '1';
      }
    });
    return connecting;
  }

  /**
   * A row leaves with its connection, never without it. Removing the last row lays an empty
   * one back so the component keeps its height.
   * See lessons/page-wish.md#wish-132
   */
  function removeRow(c) {
    const was = c.row.say;
    disconnect(c);
    c.dg?.destroy();
    c.el.remove();
    conns = conns.filter((x) => x !== c);
    if (!conns.length) clearAnswer();
    else {
      conns.forEach((x, i) => { x.el.tabIndex = i === 0 ? 0 : -1; });
      choose(Math.max(0, Math.min(chosen, conns.length - 1)));
    }
    d.log(`${was} is off the page, ${conns.length} connection(s) left`);
  }

  function show(links) {
    const g = grade(links);
    /* The previous answer's links come down here too, or a row destroyed without its link
       leaves an instrument routed. `think` clears first; a check calling `show` twice does not.
       See lessons/page-wish.md#wish-133 */
    let off = 0;
    for (const c of conns) { if (disconnect(c, true)) off++; c.dg?.destroy(); }
    if (off) d.log(`${off} connection(s) came down with the answer they belonged to`);
    const built = g.rows.map((r) => {
      const c = connRow();
      /* The verdict as an attribute, for checks.
         See lessons/page-wish.md#wish-134 */
      c.el.dataset.verdict = r.ok ? 'allowed' : r.needs ? 'incomplete' : 'refused';
      return { ...c, link: r.link, row: r };
    });
    /* An empty row when there is nothing to show, so the height does not change.
       See lessons/page-wish.md#wish-135 */
    layRows(built.length ? built.map((c) => c.el) : [connRow().el]);
    /* Drawn after the rows are in the page: `createDiagram` falls back to 320px for a host with
       no size, under the 560px row threshold, so a detached draw is stacked until the next frame.
       See lessons/page-wish.md#wish-136 */
    conns = built.map((c) => ({ ...c, ...drawOne(c.fig, c.row) }));
    /* An empty reply is still logged, since a blank box cannot say which empty state it is in.
       See lessons/page-wish.md#wish-137 */
    if (!g.rows.length) {
      d.log('the model proposed nothing, which is the right answer to an instruction '
          + 'that names nothing on this desk');
    }
    /**
     * A link that starts and ends at one instrument has no figure or caption, so `.wish-why`
     * carries its two sentences. Exactly one of the two exists on any row.
     * See lessons/page-wish.md#wish-138
     */
    for (const c of conns) {
      const lines = c.drawn ? [] : sayRow(c.row);
      c.say.replaceChildren(...lines.map((t) => el('div', '', t)));
      c.say.hidden = !lines.length;
    }
    /* Controls are built after `conns` is assigned: `drawOne` is spread into a new object, and a
       handler closing over the old one would hold a `linkId` nothing else sees.
       See lessons/page-wish.md#wish-139 */
    for (const c of conns) fitActions(c);
    conns.forEach(wire);
    choose(0);
    connectAll();
    g.picture = {
      drawn: conns.reduce((n, c) => n + c.drawn, 0),
      loops: conns.reduce((n, c) => n + c.loops, 0),
      boxes: conns.reduce((n, c) => n + c.boxes, 0),
      rows: conns.length,
    };
    return g;
  }

  /**
   * A press clears the last answer before asking, so an old answer never stands beside a new
   * question. Back to blank, never a placeholder.
   * See lessons/page-wish.md#wish-140
   */
  /**
   * Nothing is drawn until there is a mapping; the empty row holds the room. An empty box
   * paints no edge. A desk with no arrows would read as "these do not connect".
   * See lessons/page-wish.md#wish-141
   */
  function clearAnswer() {
    patch.textContent = '';
    /* DELETED rather than emptied, because `.wish-patch[data-shown]` matches on
       presence: a box that had held one answer would keep its edges for the
       rest of the page's life. */
    delete patch.dataset.shown;
    /* A new question takes down the connections the last answer made, logged as one line.
       See lessons/page-wish.md#wish-142 */
    let off = 0;
    for (const c of conns) { if (disconnect(c, true)) off++; c.dg?.destroy(); }
    if (off) d.log(`${off} connection(s) came down with the answer they belonged to`);
    conns = [];
    chosen = -1;
    /* Back to one empty row, never none, so one link coming back moves nothing.
       See lessons/page-wish.md#wish-143 */
    layRows([connRow().el]);
  }
  function clearAll() { said.value = ''; clearAnswer(); }

  /* Nothing is shown before anybody presses anything. The patch box holds its
     own floor from here; the picture's host does not, which is measured and
     written up on `.wish-dg`. */
  clearAnswer();

  // ── the two calls ────────────────────────────────────────────────────────

  /**
   * The one function that can leave the page, counted in `reached` for the assert.
   * See lessons/page-wish.md#wish-144
   */
  let reached = 0;

  /**
   * A fetch that never connected and one that came back with an error are reported apart;
   * the agent's own message is shown as it is.
   * See lessons/page-wish.md#wish-145
   */
  async function post(path, body) {
    /* A suite run asks nobody, and `reached` is not bumped because nothing was reached.
       See lessons/page-wish.md#wish-146 */
    /**
     * `/hear` is gated too, so a check can drive `finish()` through transcribe then propose.
     * The canned sentence is a real one (`research/cf-models-speech-to-patch-2026-09-21.md`
     * section 7.1, 961 ms); its case differs from `EXAMPLE` so a check can tell them apart.
     * See lessons/page-wish.md#wish-147
     */
    if (SELFCHECK && path === '/hear') {
      /* The stand-in answers per model with that model's real reply (`HEARD_BY`), so the repair
         is graded on transcripts that need it.
         See lessons/page-wish.md#wish-148 */
      return { text: HEARD_BY[body.model] ?? CANNED_HEARD, words: null, ms: 0, model: 'canned' };
    }
    if (SELFCHECK && path === '/wish') {
      /* Returns what the server returns: `relabel` in `workers/wish/src/wish.mjs` repairs the key
         this model gets wrong. The raw form is used directly below for the validator.
         See lessons/page-wish.md#wish-149 */
      /**
       * One canned answer per example, keyed on the sentence (the row's own `say`). Anything else
       * (a transcription, typed text) gets the first example's reply.
       * See lessons/page-wish.md#wish-150
       */
      const ex = EXAMPLES.find((e) => e.say === body.text);
      return { links: ex ? ex.links : REPAIRED, fixed: ex ? ex.fixed : FIXED,
        ms: 0, model: 'canned', usage: { total_tokens: 0 } };
    }
    reached++;
    let r;
    try {
      r = await fetch(`${API}${path}`, {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      });
    } catch {
      /* The advice follows the address: only a local page is told to start a node process.
         See lessons/page-wish.md#wish-151 */
      const e = new Error(HERE
        ? `nothing answered at ${API}. Start the agent with \`node demo/wish-local.mjs\``
        : `nothing answered at ${API}`);
      e.answered = false;
      throw e;
    }
    const out = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(out.error || `HTTP ${r.status}`);
      e.answered = true;
      throw e;
    }
    return out;
  }

  /** What went wrong, in the words of whichever end has a right to them. */
  function blame(e) {
    d.log(e.answered === false ? e.message : `the agent said: ${e.message}`, 'warn');
  }

  /**
   * Instruments this page can patch, derived from `PORTS` via `describe()`: `instruments.mjs`
   * covers the whole room, and a correction to an instrument not here would still fail.
   * See lessons/page-wish.md#wish-152
   */
  const ONDESK = new Set(PORTS.map((p) => describe(p.label).full));

  /**
   * Repairs the speech model's hearing before the language model reads it, and logs the
   * words it replaced; the box stays editable. Never applied to typed text. Two instruments
   * on one span are never picked between (see `reword()`, graded in `instruments-test.mjs`).
   * See lessons/page-wish.md#wish-153
   */
  function hearWords(text) {
    const r = reword(text, { has: (full) => ONDESK.has(full) });
    for (const f of r.fixed) {
      d.log(`the words "${f.was}" are how this desk's ${f.full} came back, so the box says ${f.full}`);
    }
    for (const u of r.unsure) {
      d.log(`"${u.was}" names two things here, ${u.names.join(' and ')}, so it was left as it was`);
    }
    for (const a of r.absent) {
      d.log(`"${a.was}" sounds like ${a.names[0]}, which is not on this desk`);
    }
    return r.text;
  }

  /**
   * The patch half: a sentence in, an object out. `think` is a code name, never on screen.
   * See lessons/page-wish.md#wish-154
   */
  async function think(text) {
    said.value = text;
    clearAnswer();
    /* The box under the picker is what is being waited for from here until the
       object lands, however the sentence got into the transcript. */
    waitFor('patch');
    d.log(`asking ${patchPick.value().split('/').pop()}`);
    try {
      const out = await post('/wish', { text, ports: portsForModel(), facts: FACTS, model: patchPick.value() });
      const g = show(out.links || []);
      /* A repair is always logged, so the person sees what the model actually said.
         See lessons/page-wish.md#wish-155 */
      for (const f of out.fixed || []) {
        d.log(`the model wrote "${f.said}" on ${f.op} where this desk uses `
          + `"${f.read}", so it was read as ${f.op} ${f.read} ${f.value}`);
      }
      /* The whole outcome is logged on one line, since there is no readout.
         See lessons/page-wish.md#wish-156 */
      d.log(`the patch came back in ${out.ms ?? '?'} ms: ${out.links?.length ?? 0} link(s), `
        + `${g.refused} refused, ${g.needs} incomplete, `
        + `${out.usage?.total_tokens ?? '?'} tokens`);
      return out;
    } finally {
      /* In a `finally`, or an error leaves both surfaces sweeping.
         See lessons/page-wish.md#wish-157 */
      waitFor();
    }
  }

  /** The sentence the whole thing was measured on. It is `EXAMPLES[0]` now and
   *  is named below, where the other four are. */
  /**
   * What a listening model really returned for that sentence
   * (`research/cf-models-speech-to-patch-2026-09-21.md` section 7.1). Not `EXAMPLE`, so a
   * check can tell a transcription from a constant.
   * See lessons/page-wish.md#wish-158
   */
  const CANNED_HEARD = 'connect the keyboard to the circuit and transpose it up one semitone';

  /**
   * Each listening model's real reply, from `research/name-lookups-2026-09-21.md`: `turbo`
   * is the negative control, `whisper` hears `taskham`, `tiny-en` splits `MK425C`. The check
   * switches models with the ordinary picker.
   * See lessons/page-wish.md#wish-159
   */
  const HEARD_BY = {
    '@cf/openai/whisper': 'The evolution plays the circuit and the taskham records it.',
    '@cf/openai/whisper-tiny-en': ' Play the MK425 C into the circuit.',
  };

  /**
   * The real 70B reply, used as the gate under `?selfcheck=1`: ports right, the transform's
   * argument under the wrong key. The gate is on the network, not the button.
   * See lessons/page-wish.md#wish-160
   */
  const CANNED = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
    transforms: [{ op: 'transpose', to: 1 }] }];
  /**
   * The same reply after the boundary repaired it, as a real call returns now. `to` is
   * accepted as a synonym but the language keeps `by`: `transpose` is a relative shift.
   * The model writes `to` despite the prompt because `to` sits beside `transpose` twice.
   * See lessons/page-wish.md#wish-161
   */
  const REPAIRED = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
    transforms: [{ op: 'transpose', by: 1 }] }];
  const FIXED = [{ op: 'transpose', said: 'to', read: 'by', value: 1 }];

  /**
   * Example sentences; `links` is the real model's reply on all but one, which its row marks
   * as constructed, and is only seen under `?selfcheck=1`. A SysEx refusal cannot be produced
   * here: `EMITS` has no `sysex`, and adding it would refuse every link into the Circuit.
   * See lessons/page-wish.md#wish-162
   */
  const EXAMPLES = [
    /**
     * Real 70B reply (`demo/wish-local.mjs`): ports right, argument under the wrong key.
     * `links` is after the boundary repair, `fixed` is the repair the page prints.
     * See lessons/page-wish.md#wish-163
     */
    { say: 'Connect the keyboard to the circuit and transpose it up one semitone.',
      about: 'a transpose',
      was: 'Measured 2026-09-21 on the 70B. The ports were right and transpose '
        + 'carried its argument under "to" rather than "by", which the boundary '
        + 'repairs and the log names.',
      links: REPAIRED, fixed: FIXED },
    /**
     * Valid and does nothing: `Model 12 MIDI IN` is the DIN socket, silent through 525
     * messages, while the buttons send on `DAW Control IN`. It stays allowed.
     * See lessons/page-wish.md#wish-164
     */
    { say: 'Play notes with my Model 12 REC buttons into circuit synth 1.',
      about: 'a port with a twin',
      was: 'Measured 2026-09-21 on the 70B. It chose Model 12 MIDI IN, which is '
        + 'allowed and would do nothing: that port is the DIN socket, and the '
        + 'buttons come out of Model 12 DAW Control IN.',
      links: [{ from: 'here:model-12-midi-in:out', to: 'here:circuit:in',
                transforms: [{ op: 'channel', to: 1 }] }],
      fixed: [] },
    /**
     * The 70B used `{"op":"only","to":1}` for a split, the nearest word it had. The reply
     * predates `range`; whether the model uses `range` now is not measured. Two links between
     * one pair, so two rows and two arrows.
     * See lessons/page-wish.md#wish-165
     */
    { say: 'Split the keyboard in half, the lower part plays synth 1 and the upper part plays synth 2.',
      about: 'a keyboard split',
      was: 'Measured 2026-09-21 on the 70B. Two links, both refused: "only" '
        + 'filters by message class, and it was the nearest word the language '
        + 'had to a filter. A pitch range was added the same day.',
      links: [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
                transforms: [{ op: 'only', to: 1 }] },
              { from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
                transforms: [{ op: 'only', to: 2 }] }],
      fixed: [] },
    /**
     * Instruments not on the desk come back as no links (496 ms), because `from` and `to` are
     * an enum of real port ids. The page says so in words.
     * See lessons/page-wish.md#wish-166
     */
    { say: 'Play the Moog from the keyboard.',
      about: 'not on this desk',
      was: 'Measured 2026-09-21. A Moog and a Prophet, neither on this desk, '
        + 'came back as no links at all in 496 ms, because the ports the model '
        + 'may name are a fixed list.',
      links: [], fixed: [] },
    /**
     * Constructed, not measured: the real reply to this sentence lacked `from` before `FACTS`
     * carried controller numbers, and it has not been asked again since. The row says so.
     * See lessons/page-wish.md#wish-167
     */
    { say: 'Connect the first rotary knob of the keyboard to the first macro knob of the circuit.',
      about: 'a knob',
      was: 'Constructed, not measured. Asked on 2026-09-21 this came back as a '
        + 'cc with no source and was refused, and the prompt gained the knob '
        + 'numbers that day. Nobody has asked it again.',
      links: [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
                transforms: [{ op: 'cc', from: 84, to: 80 }] }],
      fixed: [] },
  ];
  examples.set(EXAMPLES);
  /** The first row, which is the sentence the whole chain was measured on. */
  const EXAMPLE = EXAMPLES[0].say;

  /**
   * One function for Enter, `Interpret` and a release after a transcription.
   * See lessons/page-wish.md#wish-168
   */
  d.on('interpret', () => askBox());

  /** Ask about whatever is in the box, which is the only thing Enter does. */
  async function askBox() {
    const text = said.value.trim();
    if (!text) { d.log('there is nothing in the box to ask about'); return; }
    try { await think(text); } catch (e) { blame(e); }
  }

  /**
   * Enter asks and Shift+Enter makes a newline. `preventDefault` only on the asking branch.
   * A harness cannot press a key in a textarea, so the check dispatches the real `keydown`
   * for both halves, and `Interpret` is the button that asks.
   * See lessons/page-wish.md#wish-169
   */
  said.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    askBox();
  });

  // ── hold to talk ─────────────────────────────────────────────────────────

  /**
   * Held, not toggled: a toggle can be left with the microphone open. A plain click (the
   * harness's `.click()`, Enter, an assistive click) fires no pointer events, so it records
   * a fixed short window on the same code path.
   * See lessons/page-wish.md#wish-170
   */
  const MIN_HOLD = 450;     // below this a press is a tap rather than a hold
  const TAP_MS = 2500;      // what a tap, or a click with no pointer, records

  const talk = {
    holding: false, began: 0, ended: 0, last: null,
    classify: (ms) => (ms >= MIN_HOLD ? 'hold' : 'tap'),
  };

  let rec = null, stream = null, chunks = [];
  let startedAt = 0, tapTimer = 0, lastGesture = -1e9;
  let stopWanted = false, dropped = false, busy = false;

  /* `data-busy` paint from press to answer: reduced-motion aware, and it does not resize the
     button the way a label change or spinner would.
     See lessons/page-wish.md#wish-171 */
  const lit = (on) => { if (on) speakBtn.dataset.busy = '1'; else delete speakBtn.dataset.busy; };

  /**
   * No level indicator on the button, a known gap: nobody can tell whether the microphone
   * hears them until the transcription arrives.
   * See lessons/page-wish.md#wish-172
   */

  function release() {
    stream?.getTracks().forEach((t) => t.stop());
    stream = null; rec = null;
  }

  function begin() {
    if (talk.holding || busy) return;
    talk.holding = true;
    talk.began++;
    startedAt = performance.now();
    stopWanted = false; dropped = false;
    /* Cleared on the press, not when the reply lands. See `clearAnswer`.
       See lessons/page-wish.md#wish-173 */
    clearAll();
    lit(true);
    /* No box sweeps yet: an open microphone is waiting on a person, not a model.
       See lessons/page-wish.md#wish-174 */
    /* Only the microphone is skipped under `?selfcheck=1`; gesture, timing and ending are the
       same code.
       See lessons/page-wish.md#wish-175 */
    if (SELFCHECK) return;
    open();
  }

  async function open() {
    if (!navigator.mediaDevices?.getUserMedia) {
      d.log('this browser has no microphone, so use the example', 'warn');
      talk.holding = false; lit(false);
      return;
    }
    let s;
    try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) {
      d.log(`no microphone: ${e.message}`, 'warn');
      talk.holding = false; lit(false);
      return;
    }
    /* A permission prompt can outlast the press, so the release is checked here.
       See lessons/page-wish.md#wish-176 */
    if (stopWanted) { s.getTracks().forEach((t) => t.stop()); lit(false); return; }
    stream = s;
    chunks = [];
    rec = new MediaRecorder(s);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = finish;
    rec.start();
    /* A tap can let go before the microphone opens; read the state.
       See lessons/page-wish.md#wish-177 */
    d.log(talk.holding ? 'listening while the button is held' : 'listening');
  }

  /** @param {'up'|'cancel'|'click'} why */
  function end(why) {
    if (!talk.holding) return;          // idempotent: pointerup and lostpointercapture both land here
    talk.holding = false;
    talk.ended++;
    if (why !== 'click') lastGesture = performance.now();
    const ms = Math.round(performance.now() - startedAt);
    const kind = why === 'cancel' ? 'cancel' : talk.classify(ms);
    talk.last = { ms, kind, why };
    if (kind === 'cancel') {
      /* `pointercancel` (the browser took the gesture to scroll) ends the recording without
         sending it.
         See lessons/page-wish.md#wish-178 */
      d.log('the press was taken away, so nothing was sent');
      dropped = true;
      stop();
      return;
    }
    if (kind === 'hold') { stop(); return; }
    d.log(`that was ${ms} ms, too short to be a hold, so ${(TAP_MS / 1000).toFixed(1)} s is recorded instead`);
    clearTimeout(tapTimer);
    tapTimer = setTimeout(stop, Math.max(0, TAP_MS - ms));
  }

  /* The light stays on until `finish()` is done, or it blinks between release and upload.
     See lessons/page-wish.md#wish-179 */
  function stop() {
    clearTimeout(tapTimer);
    stopWanted = true;
    if (!rec) { lit(false); release(); return; }
    if (rec.state !== 'inactive') rec.stop(); else finish();
  }

  async function finish() {
    const type = rec?.mimeType || 'audio/webm';
    release();
    if (dropped) { dropped = false; chunks = []; lit(false); return; }
    const blob = new Blob(chunks, { type });
    d.log(`${(blob.size / 1024).toFixed(1)} KB of audio`);
    busy = true;
    lit(true);
    /* The `said` box sweeps from here, when the listening model's work begins. Set before the
       first `await`, so no tick leaves it blank and a check can observe it.
       See lessons/page-wish.md#wish-180 */
    waitFor('hear');
    try {
      const buf = new Uint8Array(await blob.arrayBuffer());
      /* Chunked: `String.fromCharCode(...buf)` on seconds of audio overflows the stack.
         See lessons/page-wish.md#wish-181 */
      let s = '';
      for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
      const heard = await post('/hear', { audio: btoa(s), model: hearPick.value() });
      /* One of the two timings the readout used to carry. See `readout` above:
         there is no readout on this page at all now, so a number nothing logs
         is a number the page stopped reporting. */
      d.log(`heard in ${heard.ms ?? '?'} ms by ${hearPick.value().split('/').pop()}`);
      if (!heard.text?.trim()) { d.log('nothing was heard, so nothing was asked'); return; }
      /**
       * The release asks by itself: `think()` writes the transcription into the box, where it can
       * be corrected, and the proposal starts at once.
       * See lessons/page-wish.md#wish-182
       */
      await think(hearWords(heard.text.trim()));
    } catch (e) {
      blame(e);
    } finally {
      busy = false;
      lit(false);
      /* `think()` already did this on its own way out. Here for the paths that
         never reached it: a refused upload, an empty transcription, a model
         that answered with an error. */
      waitFor();
    }
  }

  speakBtn.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // a right click is not a press
    /* Pointer capture guarantees `pointerup` even when the finger slides off; `pointercancel`
       covers the scroll case.
       See lessons/page-wish.md#wish-183 */
    try { speakBtn.setPointerCapture(e.pointerId); } catch { /* a synthetic pointer has no id to capture */ }
    lastGesture = performance.now();
    begin();
  });
  speakBtn.addEventListener('pointerup', () => end('up'));
  speakBtn.addEventListener('pointercancel', () => end('cancel'));
  /* The catch-all for a capture lost some other way. `end` is idempotent, so a
     `pointerup` that already ran leaves this a no-op. */
  speakBtn.addEventListener('lostpointercapture', () => end('up'));

  /* Not `async`: the shell paints and clears `data-busy` around a returned promise, which
     would wipe the recording's paint a tick after a tap. The selfcheck branch returns one.
     See lessons/page-wish.md#wish-184 */
  d.on('speak', () => {
    if (SELFCHECK) return d.run('check');
    /* A trusted `pointerup` is followed by a `click`; skip it so a real press is not handled
       twice. A synthetic click has no pointer events and never trips this.
       See lessons/page-wish.md#wish-185 */
    if (performance.now() - lastGesture < 600) return undefined;
    if (busy || talk.holding) return undefined;
    begin();
    end('click');
    return undefined;
  });

  // ── checks ───────────────────────────────────────────────────────────────

  d.on('check', async () => {
    /**
     * Rows read off the page rather than off `conns`, so the check grades what a reader sees.
     * `whyText` reads the same words the old `whyBox` checks did.
     * See lessons/page-wish.md#wish-186
     */
    const rowsOf = () => [...answer.querySelectorAll('.wish-conn')];
    /**
     * A row's sentence is the figure's caption, or `.wish-why` for the one row with no picture.
     * Read whichever carries the words; reading `.wish-why` alone passes only on the odd row.
     * See lessons/page-wish.md#wish-187
     */
    const sayEls = () => rowsOf().map((r) =>
      r.querySelector('.pos-dg-cap') || r.querySelector('.wish-why'));
    /* The whole row, not the caption element, which renders only the first line.
       See lessons/page-wish.md#wish-188 */
    const whyText = () => rowsOf().map((r) => r.textContent || '').join('\n');
    const figs = () => rowsOf().map((r) => r.querySelector('.wish-dg'));

    /**
     * The real 70B reply: ports right, argument under the wrong key.
     * See lessons/page-wish.md#wish-189
     */
    const g = show(CANNED);

    /* A counter, not a claim. `CANNED` is a refused reply, so a `connectAll` ignoring `row.ok`
       would turn this red; `requestMIDIAccess` is counted from load.
       See lessons/page-wish.md#wish-190 */
    d.assert('a visit reached nobody and connected nothing',
      reached === 0 && desk.links().length === 0 && midiAsked === 0,
      `${reached} calls to the agent, ${desk.links().length} link(s) on the desk and `
      + `${midiAsked} call(s) to requestMIDIAccess`);

    /* The reason must say what is missing in words a person can act on, and name no field.
       See lessons/page-wish.md#wish-191 */
    /* The absence of field names is graded on the reason; the fix line offers the corrected
       object to compare with the JSON.
       See lessons/page-wish.md#wish-192 */
    const whyOnly = g.rows.map((r) => r.why || '').join('\n');
    /* A list, not a regex literal: `build.mjs` scans for imports and reads a quoted `from` in a
       pattern as one.
       See lessons/page-wish.md#wish-193 */
    const FIELD_WORDS = ['by', 'to', 'cls', 'from'];
    const namesAField = (t) => FIELD_WORDS.some((w) => t.includes(`"${w}"`));
    d.assert('the transform the real model returned is refused, in words with no field names in them',
      g.refused === 1
      && /semitones/.test(whyText())
      && !namesAField(whyOnly),
      `${g.refused} refused, said "${whyOnly.slice(0, 90)}"`);

    /* The JSON is the model's own object and shows the `to: 1`. The parse is guarded, since an
       assert that throws does not go red, it goes missing.
       See lessons/page-wish.md#wish-194 */
    const asObject = (() => { try { return JSON.parse(patch.textContent); } catch { return null; } })();
    d.assert('the box shows the whole object, including the argument that was refused',
      /* Reads the shape (an array, an entry with an indented key), not the whitespace.
         See lessons/page-wish.md#wish-195 */
      patch.textContent.split('\n').length > 1
      && patch.textContent.trimStart().startsWith('[')
      && /\n\s{4}"/.test(patch.textContent)
      /* `asObject[0]`: the box is an array.
         See lessons/page-wish.md#wish-196 */
      && Array.isArray(asObject) && asObject[0]?.transforms?.[0]?.to === 1,
      patch.textContent.slice(0, 110));

    /* Negative control for `TRANSFORM_TEXT`, which slices a fixed length off `printLink`'s
       output; a separator change goes red here.
       See lessons/page-wish.md#wish-197 */
    d.assert('the link line is built from printLink rather than from a second formatter',

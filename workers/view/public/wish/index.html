      printLink({ from: 'x', to: 'y', transforms: [] }) === 'x -> y'
      && TRANSFORM_TEXT({ transforms: [{ op: 'transpose', by: 1 }] }) === ' { transpose +1 }',
      `${printLink({ from: 'x', to: 'y', transforms: [] })} and `
      + `${TRANSFORM_TEXT({ transforms: [{ op: 'transpose', by: 1 }] })}`);

    /* No `here:` anywhere a reader looks.
       See lessons/page-wish.md#wish-198 */
    d.assert('a row names the instrument and never shows a port id',
      /MK-425C USB MIDI Keyboard to Circuit/.test(whyText())
      && !whyText().includes('here:'),
      whyText().trim().slice(0, 110));

    /**
     * Measured with an answer on screen: a connection row is a glue part with a seam above it.
     * Before an answer only an empty row stands, so a check then measures nothing.
     * See lessons/page-wish.md#wish-199
     */
    {
      const seam = (a, b) => b.getBoundingClientRect().top - a.getBoundingClientRect().bottom;
      const head = patchRow.parentElement;
      const glueBg = getComputedStyle(answer).backgroundColor;
      const row = rowsOf()[0];
      /* A row is the glue's last part, so below it is the component's edge, not a seam. The row
         paints its own ground and draws no border.
         See lessons/page-wish.md#wish-200 */
      d.assert('with an answer up, the connection is its own part with the glue\'s own seam over it',
        rowsOf().length === g.rows.length && row.parentElement === answer
        && Math.abs(seam(head, row) - 1) < 0.6
        && getComputedStyle(row).backgroundColor !== glueBg
        && getComputedStyle(row).borderTopWidth === '0px',
        `${[...answer.children].filter((n) => !n.hidden).length} parts up for `
        + `${g.rows.length} connection(s), a ${seam(head, row).toFixed(1)} px seam above it, `
        + `and it draws ${getComputedStyle(row).borderTopWidth} of border of its own`);
    }

    // Negative control: the same link spelled right is allowed.
    // See lessons/page-wish.md#wish-201
    const FIXED = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
      transforms: [{ op: 'transpose', by: 1 }, { op: 'channel', to: 1 }] }];
    const g2 = show(FIXED);
    d.assert('and the same link with the argument under the right key is allowed',
      g2.ok === 1 && g2.refused === 0, `${g2.ok} allowed, ${g2.refused} refused`);

    /* The one that protects the instrument, on the page a sentence arrives at. */
    const NASTY = [{ from: 'here:circuit:out', to: 'here:circuit:in', transforms: [] }];
    const g3 = show(NASTY);
    d.assert('a proposal that loops an instrument into itself is refused',
      g3.refused === 1, whyText().trim().slice(0, 80));

    /* A model that proposed nothing is reported; the negative control for the assert below.
       The edge check is on the component's seams assert.
       See lessons/page-wish.md#wish-202 */
    /* An empty reply produces a log line naming it, and the object box stays blank.
       See lessons/page-wish.md#wish-203 */
    const EMPTY = show([]);
    d.assert('a proposal of nothing is reported in words, and the object box stays blank',
      EMPTY.ok === 0 && patch.textContent.trim() === ''
      && /proposed nothing/.test(document.querySelector('.pos-log')?.textContent || ''),
      `the box holds ${JSON.stringify(patch.textContent.trim())} and the log `
      + `${/proposed nothing/.test(document.querySelector('.pos-log')?.textContent || '')
        ? 'says it' : 'does not say it'}`);

    /**
     * Before any answer the box is blank, not shown, borderless and still holding its floor.
     * The edge clause is a width of 0: `border-top-color` computes to `currentColor` with no
     * border set. Computed values, never the source.
     * See lessons/page-wish.md#wish-204
     */
    clearAnswer();
    const blank = getComputedStyle(patch);
    const blankH = patch.getBoundingClientRect().height;
    const blankFloor = parseFloat(blank.minHeight) || 0;
    d.assert('with nothing asked yet the box is blank, paints no edge, and still holds the room',
      patch.textContent === '' && !patch.dataset.shown
      && parseFloat(blank.borderTopWidth) === 0
      && blank.backgroundColor === 'rgba(0, 0, 0, 0)'
      /* Within half a pixel: layout runs on a 1/64px grid, so 268.8px is used as 268.796875.
         See lessons/page-wish.md#wish-205 */
      && blankFloor > 0 && blankH >= blankFloor - 0.5,
      `${JSON.stringify(patch.textContent)}, edge ${blank.borderTopWidth}, `
      + `ground ${blank.backgroundColor}, ${blankH.toFixed(2)} px standing on a `
      + `${blankFloor} px floor`);

    /* The picture, in all three states. `createDiagram` collects every shortened name, long
       note and unroutable arrow on `cuts`; read in every state, since it is rebuilt per answer.
       See lessons/page-wish.md#wish-206 */
    /* Across every row: counts are totals and heights the tallest, so a bad second row cannot
       hide behind a good first one.
       See lessons/page-wish.md#wish-207 */
    const boxes = () => answer.querySelectorAll('.wish-conn .pos-dg-n').length;
    const arrows = () => answer.querySelectorAll('.wish-conn .pos-dg-l').length;
    const figH = () => Math.max(0, ...figs()
      .map((h) => h.querySelector('.pos-dg')?.getBoundingClientRect().height ?? 0));
    /* `:not([aria-hidden])`: `createDiagram` measures text with an off-screen ruler of the same
       class, so a plain query finds one blank label too many.
       See lessons/page-wish.md#wish-208 */
    /* Lines joined with a space: a wrapped label is one `tspan` per line and `textContent`
       joins them with nothing.
       See lessons/page-wish.md#wish-209 */
    const labels = () => [...answer.querySelectorAll('.wish-conn .pos-dg-llab:not([aria-hidden])')]
      .map((t) => {
        const lines = [...t.querySelectorAll('tspan')].map((x) => x.textContent);
        return lines.length ? lines.join(' ') : t.textContent;
      });

    const seen = [];
    /* A row's `dg` is null when nothing was proposed; reading `dg.mode` would throw and take
       every later assert with it.
       See lessons/page-wish.md#wish-210 */
    const look = (what) => seen.push({
      what,
      boxes: boxes(),
      arrows: arrows(),
      h: figH(),
      rows: rowsOf().length,
      mode: conns[0]?.dg?.mode ?? 'not drawn',
      /* The HOST's own height, which is a different question from the figure's:
         a picture that fits can still grow the cell it sits in, and the cell is
         what a reader sees move. See the room assert below. */
      hostH: Math.max(0, ...figs().map((h) => h.getBoundingClientRect().height)),
      /* The width the drawer was given: below 560px `diagram.mjs` stacks the picture, which would
         double every connection's height.
         See lessons/page-wish.md#wish-211 */
      figW: Math.max(0, ...figs().map((h) => h.getBoundingClientRect().width)),
      labels: labels(),
      inHost: figs().reduce((n, h) => n + h.childElementCount, 0),
      cuts: conns.flatMap((c) => (c.dg?.cuts ?? [])
        .map((x) => `${x.where} ${x.id} at ${x.width}px`)),
    });

    show([]); look('nothing proposed');
    const g4 = show(CANNED); look('one refused link');
    show(FIXED); look('one allowed link');

    d.assert('the picture drew every name and every arrow whole, in every state',
      seen.every((s) => s.cuts.length === 0),
      seen.flatMap((s) => s.cuts.map((c) => `${s.what}: ${c}`)).join('; ')
        || `nothing cut in ${seen.length} states, laid out as `
        + `${seen.find((x) => x.mode !== 'not drawn')?.mode ?? 'nothing'}`);

    /* Only the instruments a proposal touches, one arrow per proposal; a refused run still draws
       its arrow and both ends.
       See lessons/page-wish.md#wish-212 */
    /* Nothing at all is rendered on the empty path: the third clause counts everything in the
       host, since counting expected things cannot see an unexpected caption.
       See lessons/page-wish.md#wish-213 */
    d.assert('only the instruments a proposal touches are drawn, with one arrow per proposal',
      seen.map((s) => s.boxes).join() === '0,2,2'
      && seen.map((s) => s.arrows).join() === '0,1,1'
      && seen[0].inHost === 0,
      seen.map((s) => `${s.what}: ${s.boxes} boxes, ${s.arrows} arrows, `
        + `${s.inHost} things in the host`).join('; '));

    /* A refused arrow and an allowed one must never read as each other: `refused` is a verdict,
       `note, cc, bend` is cargo, and the allowed run says neither nothing nor `refused`.
       See lessons/page-wish.md#wish-214 */
    d.assert('a refused link is marked refused, and an allowed one names what crosses it',
      g4.picture.drawn === 1 && seen[1].labels.join() === 'refused'
      && seen[2].labels.join() === 'note, cc, bend',
      `refused run ${JSON.stringify(seen[1].labels)}, allowed run ${JSON.stringify(seen[2].labels)}`);

    /**
     * Red as a second channel, read from computed values. The arrowhead is graded separately: an
     * SVG marker paints its own fill and does not inherit the line's stroke. The allowed run is
     * the negative half.
     * See lessons/page-wish.md#wish-215
     */
    const ink = (run) => {
      show(run);
      const g = answer.querySelector('.wish-conn .pos-dg-l');
      const path = g?.querySelector('.pos-dg-link');
      /* The link's own `marker-end`: all four arrowheads are in `<defs>` on every picture, so
         finding the red one says nothing.
         See lessons/page-wish.md#wish-216 */
      const end = path?.getAttribute('marker-end') || '';
      return {
        line: path && getComputedStyle(path).stroke,
        lab: g && getComputedStyle(g.querySelector('.pos-dg-llab')).fill,
        marked: !!g?.hasAttribute('data-bad'),
        redHead: /-r[fb]\)$/.test(end),
        end,
      };
    };
    const bad = ink(CANNED), good = ink(FIXED);
    const BAD_INK = getComputedStyle(document.documentElement)
      .getPropertyValue('--bad').trim();
    const asRgb = (hex) => {
      const p = el('span');
      p.style.color = hex; document.body.append(p);
      const v = getComputedStyle(p).color; p.remove(); return v;
    };
    const want = asRgb(BAD_INK);
    d.assert('a refused link is red down its whole length, line, label and arrowhead, and an allowed one is not',
      bad.marked && bad.line === want && bad.lab === want && bad.redHead
      && !good.marked && good.line !== want && good.lab !== want && !good.redHead,
      `refused line ${bad.line} label ${bad.lab} head ${bad.end}, `
      + `allowed line ${good.line} label ${good.lab} head ${good.end}, `
      + `--bad is ${BAD_INK} which computes to ${want}`);

    /**
     * The third verdict, on the real reply `{ op: 'cc', to: 1 }`: counted apart from allowed and
     * refused, its own word, its own colour, a `?` on the picture, and boxes that stay solid.
     * Any one clause alone would pass on a renamed refusal.
     * See lessons/page-wish.md#wish-217
     */
    const WARN_INK = getComputedStyle(document.documentElement)
      .getPropertyValue('--warn').trim();
    const SHORT = [{ from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
      transforms: [{ op: 'cc', to: 1 }] }];
    const g6 = show(SHORT);
    {
      /* The verdict is read from `data-verdict`, and the reason names what is missing in
         instrument terms rather than a field name.
         See lessons/page-wish.md#wish-218 */
      const row = rowsOf()[0];
      const verdict = row.dataset.verdict;
      const ink = getComputedStyle(row).getPropertyValue('--wish-verdict-ink').trim()
        || getComputedStyle(row).color;
      d.assert('a link missing an argument is neither allowed nor refused, and the picture asks for it',
        g6.ok === 0 && g6.refused === 0 && g6.needs === 1
        && verdict === 'incomplete'
        && /controller it comes from/.test(row.textContent)
        && labels().join() === '?'
        && !answer.querySelector('.wish-conn .pos-dg-l[data-bad]')
        && boxes() === 2,
        `${g6.ok} allowed, ${g6.refused} refused, ${g6.needs} incomplete; the row is `
        + `"${verdict}" and reads `
        + `${JSON.stringify(row.textContent.trim().slice(0, 64))}; the picture draws `
        + `${boxes()} solid boxes and an arrow saying ${JSON.stringify(labels().join())}`);
    }

    /* Negative control: the same transform with the number supplied (84 is the keyboard's first
       rotary knob).
       See lessons/page-wish.md#wish-219 */
    const g7 = show([{ ...SHORT[0], transforms: [{ op: 'cc', from: 84, to: 1 }] }]);
    d.assert('and the same link with the number it was waiting for is allowed',
      g7.ok === 1 && g7.needs === 0 && g7.refused === 0
      && !sayEls()[0].querySelector('.wish-why-q'),
      `${g7.ok} allowed, ${g7.refused} refused, ${g7.needs} incomplete`);

    /* The room is taken before the picture arrives, read from computed values, and the empty
       host's real height is a clause, since `min-height` reads the same on a collapsed box. Host
       padding comes off first (0 today); `figH` and `hostH` take the tallest row.
       See lessons/page-wish.md#wish-220 */
    const dgBox = getComputedStyle(figs()[0]);
    const dgPad = parseFloat(dgBox.paddingTop) + parseFloat(dgBox.paddingBottom);
    const reserved = (parseFloat(dgBox.minHeight) || 0) - dgPad;
    clearAnswer();
    const roomWhenEmpty = figs()[0].getBoundingClientRect().height;
    const showsWhenEmpty = getComputedStyle(figs()[0]).display;
    d.assert('the picture fits the room kept for it, and the row never changes height',
      reserved > 0 && seen.every((s) => s.h <= reserved)
      && roomWhenEmpty >= reserved + dgPad
      && seen.every((s) => Math.round(s.hostH) === Math.round(roomWhenEmpty))
      /* And the drawer still lays out in a row: under 560px `diagram.mjs` stacks it.
         See lessons/page-wish.md#wish-221 */
      && seen.filter((x) => x.mode !== 'not drawn').every((x) => x.mode === 'row'),
      `${reserved} px is the default height, against ${seen.map((s) => s.h.toFixed(0)).join(', ')} `
      + `drawn, and ${roomWhenEmpty.toFixed(0)} px standing as ${showsWhenEmpty} with nothing in it, `
      + `${dgPad} px of it the host's own padding; the host measured `
      + `${seen.map((s) => s.hostH.toFixed(0)).join(', ')} px through those states, `
      + `laid out as ${seen.map((s) => s.mode).join(', ')} across `
      + `${seen.map((s) => s.figW.toFixed(0)).join(', ')} px`);

    /* The hold button's only feedback is the `data-busy` paint, so it is graded, including not
       being lit before anyone touches it.
       See lessons/page-wish.md#wish-222 */
    d.assert('the control carries no indicator of its own',
      speakBtn.children.length === 0 && speakBtn.textContent === 'Hold to talk',
      `${speakBtn.children.length} children, label ${JSON.stringify(speakBtn.textContent)}`);


    /* Both pickers say `model`; the step name is the button on the left. Read off the DOM, not
       the constants.
       See lessons/page-wish.md#wish-223 */
    const pickLabels = [...document.querySelectorAll('.pos-choice-l')].map((n) => n.textContent);
    d.assert('both model pickers offer what the agent will run, and both say model',
      hearPick.el.querySelectorAll('button').length === 3
      && patchPick.el.querySelectorAll('button').length === 5
      && pickLabels.join() === 'model,model',
      `${hearPick.el.querySelectorAll('button').length} and `
      + `${patchPick.el.querySelectorAll('button').length}, labelled ${pickLabels.join(' and ')}`);

    /**
     * Nickname on the button, full name and price on the hover, with units (`per M input
     * tokens`, `per audio minute`). `whisper-tiny-en` has no published price and must say so.
     * Read off the buttons, never off `PRICE`.
     * See lessons/page-wish.md#wish-224
     */
    const tips = [...hearPick.buttons, ...patchPick.buttons].map((b) => b.title || '');
    const modelIds = [...HEAR, ...PATCH].map(([, id]) => id);
    const twoLines = tips.map((t) => t.split('\n'));
    d.assert('every model names itself in full on hover, with a price and its unit',
      tips.length === 8
      && twoLines.every((t, i) => t.length === 2 && t[0] === modelIds[i] && t[1].length > 8)
      && tips.filter((t) => t.includes('per M input tokens')).length === 5
      && tips.filter((t) => t.includes('per audio minute')).length === 2
      && tips.filter((t) => t.includes('no price published by Cloudflare')).length === 1,
      `${tips.length} tooltips, ${twoLines.filter((t) => t[0] === modelIds[twoLines.indexOf(t)]).length} `
      + `naming their model, ${tips.filter((t) => /per (M input tokens|audio minute)/.test(t)).length} `
      + `carrying a unit; turbo reads ${JSON.stringify(tips[0])}`);

    /**
     * Both headers measured off real rects: action left, model right. The buttons are not in
     * `.pos-controls`, so this asserts they are where the page put them.
     * See lessons/page-wish.md#wish-225
     */
    for (const [name, row, btn, pick] of [['hear', hearRow, speakBtn, hearPick],
                                          ['patch', patchRow, d.button('interpret'), patchPick]]) {
      const b = btn.getBoundingClientRect();
      const p = pick.el.getBoundingClientRect();
      d.assert(`the ${name} header puts its action on the left and its model on the right`,
        btn.parentElement === row && pick.el.parentElement === row
        && b.left < p.left && b.right <= p.left + 1
        && !btn.closest('.pos-controls'),
        `${name}: the button runs ${b.left.toFixed(0)} to ${b.right.toFixed(0)}, `
        + `the picker starts at ${p.left.toFixed(0)}, and the button is `
        + `${btn.closest('.pos-controls') ? 'still in' : 'out of'} the control row`);
    }

    /**
     * The hear picker precedes the box it fills, read as document order (nothing is positioned).
     * It checks the picker, not its `.pos-crow` wrapper. The patch picker must not be the one
     * labelling the transcript.
     * See lessons/page-wish.md#wish-226
     */
    const above = (box) => box.previousElementSibling;
    const nameOf = (n) => (n ? n.className || n.tagName.toLowerCase() : 'nothing');
    const holds = (box, pick) => above(box)?.contains(pick.el) === true;
    d.assert('the hear picker sits directly above the transcript it fills',
      holds(said, hearPick) && !holds(said, patchPick),
      `hear ${holds(said, hearPick) ? 'is' : 'is not'} in the row above the transcript, `
      + `patch ${holds(said, patchPick) ? 'is' : 'is not'}, `
      + `page reads ${[...d.el.children].map(nameOf).join(' then ')}`);

    /**
     * One `.pos-glue` holding the parts in order, measured off rects: document order is not
     * layout, and one `order` or `flex-direction` could reverse it.
     * See lessons/page-wish.md#wish-227
     */
    /**
     * The top part, not the header row inside it, or the seam reads wrong.
     * See lessons/page-wish.md#wish-228
     */
    /**
     * The middle is one part per connection, or one empty part: each inside the glue, under the
     * header, over the object, none overlapping.
     * See lessons/page-wish.md#wish-229
     */
    const rect = (n) => n.getBoundingClientRect();
    const patchPart = patchRow.parentElement;
    const picked = rect(patchPart);
    const laid = rowsOf().map(rect);
    const dumped = rect(dump);
    /* The object block is a separate surface under the glue, with the page's air between them
       rather than a shared border.
       See lessons/page-wish.md#wish-230 */
    const oneBox = answer.classList.contains('pos-glue')
      && [patchPart, ...rowsOf()].every((n) => n.parentElement === answer)
      && answer.parentElement === d.el
      && dump.parentElement === d.el;
    const apart = dumped.top - laid[laid.length - 1].bottom;
    d.assert('the picker and the connections are one glued component, and the JSON is its own',
      oneBox && laid.length > 0
      && picked.bottom <= laid[0].top
      && laid.every((r, i) => (i === 0 || laid[i - 1].bottom <= r.top))
      && apart > 8,
      `${oneBox ? `one .pos-glue holds the header and ${laid.length} row(s), with the JSON outside it`
        : 'NOT the right two boxes'}, picker ends at `
      + `${picked.bottom.toFixed(0)}, rows run ${laid.map((r) => `${r.top.toFixed(0)} to `
        + `${r.bottom.toFixed(0)}`).join(' and ')}, and the JSON starts `
      + `${apart.toFixed(0)} px below them`);

    /**
     * Seams are 1px gaps, no part draws its own border, and every part's ground differs from the
     * glue's background (read from the page, not typed). Any one alone passes on unreadable edges.
     * See lessons/page-wish.md#wish-231
     */
    const seamInk = getComputedStyle(answer).backgroundColor;
    // Every part, read off the glue rather than named by hand.
    // See lessons/page-wish.md#wish-232
    const parts = [...answer.children].filter((n) => !n.hidden);
    const grounds = parts.map((n) => getComputedStyle(n).backgroundColor);
    const edges = parts
      .map((n) => parseFloat(getComputedStyle(n).borderTopWidth));
    /**
     * Every seam walked off the glue, so a part added between two named boxes is not missed.
     * See lessons/page-wish.md#wish-233
     */
    const seams = parts.slice(1).map((n, i) =>
      n.getBoundingClientRect().top - parts[i].getBoundingClientRect().bottom);
    d.assert('each part paints its own ground, so the 1 px seam between them is the only edge inside',
      seams.every((g) => Math.round(g) === 1)
      && edges.every((w) => w === 0)
      && grounds.every((c) => c !== seamInk && c !== 'rgba(0, 0, 0, 0)'),
      `seams ${seams.map((g) => g.toFixed(1)).join(' and ')} px, borders `
      + `${edges.join()} px, ${grounds.filter((c) => c !== seamInk && c !== 'rgba(0, 0, 0, 0)').length} `
      + `of ${grounds.length} parts painting a ground of their own (${grounds[0]}) `
      + `against the glue's ${seamInk}`);

    /**
     * The component does not change height between one connection and no answer. Emptied and
     * refilled with no `await`, so nothing flickers. Two connections being taller is expected.
     * See lessons/page-wish.md#wish-234
     */
    {
      show(FIXED);
      const full = answer.getBoundingClientRect().height;
      const fullRow = rowsOf()[0].getBoundingClientRect().height;
      const say = sayEls()[0];
      const lines = say.childElementCount;
      const kept = [...say.childNodes];
      say.replaceChildren();
      const mute = rowsOf()[0].getBoundingClientRect().height;
      say.replaceChildren(...kept);
      clearAnswer();
      const bare = answer.getBoundingClientRect().height;
      const bareRow = rowsOf()[0].getBoundingClientRect().height;
      d.assert('a connection keeps its room with nothing in it, so nothing moves when an answer lands',
        rowsOf().length === 1 && bareRow > 0
        && Math.abs(full - bare) < 1 && Math.abs(fullRow - mute) < 1,
        `the row is ${fullRow.toFixed(1)} px with ${lines} line(s) of verdict, `
        + `${mute.toFixed(1)} px with none and ${bareRow.toFixed(1)} px with no answer at all, `
        + `and the component is ${full.toFixed(1)} against ${bare.toFixed(1)}`);
    }

    /* One row per connection, and the one a reader chose.
       See lessons/page-wish.md#wish-235 */
    {
      /**
       * Constructed, not measured: two instruments reaching one, so the two rows must read
       * differently. The measured split (same pair twice) is driven in the examples table below.
       * See lessons/page-wish.md#wish-236
       */
      const PAIR = [
        { from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
          transforms: [{ op: 'transpose', by: 1 }] },
        { from: 'here:model-12-midi-in:out', to: 'here:circuit:in',
          transforms: [{ op: 'channel', to: 1 }] },
      ];
      const g5 = show(PAIR);
      const rs = rowsOf();
      const words = sayEls().map((n) => n.textContent.trim());
      d.assert('every connection is a row of its own, with its own picture and its own sentence',
        g5.rows.length === 2 && rs.length === 2
        && rs.every((r) => r.querySelectorAll('.pos-dg').length === 1)
        && rs.every((r) => r.querySelectorAll('.wish-why').length === 1)
        /* The verdict is read from `data-verdict`; the sentence names which connection.
           See lessons/page-wish.md#wish-237 */
        && rs.every((r) => r.dataset.verdict === 'allowed')
        && words.every((w) => w.includes(' to '))
        /* The two sentences differ and so do the two pictures, which drawing one answer twice cannot
           satisfy.
           See lessons/page-wish.md#wish-238 */
        && words[0] !== words[1]
        && rs[0].querySelector('.pos-dg-lab').textContent
           !== rs[1].querySelector('.pos-dg-lab').textContent,
        `${g5.rows.length} connections in ${rs.length} rows, `
        + `${rs.reduce((n, r) => n + r.querySelectorAll('.pos-dg').length, 0)} pictures, `
        + `sentences ${JSON.stringify(words.map((w) => w.slice(8, 34).trim()))}`);

      /* The object block shows the pressed row alone; the two objects differ in one field, so a
         change is a change to the right one.
         See lessons/page-wish.md#wish-239 */
      const read = () => { try { return JSON.parse(patch.textContent); } catch { return null; } };
      const first = read();
      rs[1].click();
      const second = read();
      d.assert('pressing a row chooses it, and the object block shows that connection alone',
        Array.isArray(first) && first.length === 1 && first[0].from === PAIR[0].from
        && Array.isArray(second) && second.length === 1 && second[0].from === PAIR[1].from
        && rs[1].classList.contains('on') && !rs[0].classList.contains('on'),
        `the box went from ${JSON.stringify(first?.[0]?.from)} to `
        + `${JSON.stringify(second?.[0]?.from)}, and `
        + `${rs.filter((r) => r.classList.contains('on')).length} of ${rs.length} rows is marked`);

      /**
       * The chosen-row treatment is compared with a real lit table row's computed values, so a
       * `shell.css` change goes red here. The neighbouring row is the negative half.
       * See lessons/page-wish.md#wish-240
       */
      examples.mark((x) => x.say === EXAMPLES[0].say);
      const litRow = examples.scroller().querySelector('.pos-tbl-row.on');
      const asTable = litRow && getComputedStyle(litRow);
      const asRow = getComputedStyle(rs[1]);
      const asOther = getComputedStyle(rs[0]);
      d.assert('a chosen connection wears the table\'s own ground, and no bar of its own',
        !!litRow && asRow.backgroundColor === asTable.backgroundColor
        && asOther.backgroundColor !== asRow.backgroundColor
        /* The left bar is asserted absent, so copying a table rule back goes red.
           See lessons/page-wish.md#wish-241 */
        && asRow.boxShadow === 'none',
        `the row draws ${asRow.backgroundColor} with ${asRow.boxShadow} of its own, the `
        + `table's own lit row draws ${asTable?.backgroundColor}, and the row beside it `
        + `${asOther.backgroundColor}`);

      /**
       * One tab stop for the list (0 on one row, -1 on the rest), and an arrow moves without
       * choosing, as the table on this page does.
       * See lessons/page-wish.md#wish-242
       */
      const roving = () => rowsOf().map((r) => r.tabIndex).join();
      const marks = () => rowsOf().map((r) => r.classList.contains('on')).join();
      rs[0].dispatchEvent(new KeyboardEvent('keydown',
        { key: 'Enter', bubbles: true, cancelable: true }));
      const byKey = marks();
      rs[0].focus();
      const held = roving();
      const wasMarked = marks();
      rs[0].dispatchEvent(new KeyboardEvent('keydown',
        { key: 'ArrowDown', bubbles: true, cancelable: true }));
      d.assert('the connections are one tab stop, and an arrow moves inside it without choosing',
        rowsOf().filter((r) => r.tabIndex === 0).length === 1
        && rowsOf().filter((r) => r.tabIndex === -1).length === rowsOf().length - 1
        && rowsOf().every((r) => r.getAttribute('role') === 'button')
        && byKey === 'true,false'
        && document.activeElement === rs[1] && marks() === wasMarked,
        `tabindex ${held} while the first row held the focus and ${roving()} after the arrow, `
        + `Enter marked ${byKey}, the arrow left ${marks()} and put the focus on row `
        + `${rowsOf().indexOf(document.activeElement) + 1}`);

      /**
       * The action column is reserved from the first paint and filling it moves nothing: widest
       * control against `--wish-act`, right edges against the column, column width as asked. One
       * control, a 34px square (45.8px without the page copy). The empty row is measured too.
       * See lessons/page-wish.md#wish-243
       */
      const actOf = (r) => r.querySelector('.wish-conn-act').getBoundingClientRect();
      const want = parseFloat(getComputedStyle(rs[1]).getPropertyValue('--wish-act'));
      const withAnswer = actOf(rs[1]);
      const picture = figs()[1].getBoundingClientRect();
      const kids = [...rs[1].querySelector('.wish-conn-act').children];
      const boxes = kids.map((k) => k.getBoundingClientRect());
      const widest = Math.max(0, ...boxes.map((b) => b.width));
      clearAnswer();
      const atRest = actOf(rowsOf()[0]);
      d.assert('the one action fits the column reserved for it, and the picture stops at its edge',
        want > 0 && Math.abs(withAnswer.width - want) < 0.5
        && Math.abs(atRest.width - want) < 0.5
        && picture.right <= withAnswer.left + 0.5
        && kids.length === 1 && widest <= want
        && boxes.every((b) => b.right <= withAnswer.right + 0.5)
        && Math.abs(boxes[0].width - 34) < 0.5 && Math.abs(boxes[0].height - 34) < 0.5
        && rowsOf()[0].querySelector('.wish-conn-act').childElementCount === 0,
        `${want} px asked for, ${withAnswer.width.toFixed(1)} px standing with an answer and `
        + `${atRest.width.toFixed(1)} px with none, holding ${kids.length} control(s) of `
        + `${boxes.map((b) => `${b.width.toFixed(1)} by ${b.height.toFixed(1)}`).join(' and ')} px; `
        + `the picture ends at `
        + `${picture.right.toFixed(0)} and the column starts at ${withAnswer.left.toFixed(0)}`);
    }


    /**
     * Every row's leftmost box at one x: `align: 'left'` in `diagram.mjs`. Agreement across rows,
     * not a typed number, so it runs on the split.
     * See lessons/page-wish.md#wish-244
     */
    {
      /* Two pairs, so the two rows really do draw different pictures. The same
         shape the row check above builds, for the same stated reason. */
      show([
        { from: 'here:mk-425c-usb-midi-keyboard:out', to: 'here:circuit:in',
          transforms: [{ op: 'transpose', by: 1 }] },
        { from: 'here:model-12-midi-in:out', to: 'here:circuit:in',
          transforms: [{ op: 'channel', to: 1 }] },
      ]);
      /* The leftmost box by position, not the first in the DOM, which is in the caller's node order.
         See lessons/page-wish.md#wish-245 */
      const boxes = rowsOf()
        .map((r) => [...r.querySelectorAll('.pos-dg-box')]
          .map((b) => b.getBoundingClientRect().left))
        .filter((xs) => xs.length)
        .map((xs) => Math.min(...xs));
      const spread = boxes.length > 1 ? Math.max(...boxes) - Math.min(...boxes) : NaN;
      d.assert('every row starts its picture on one line, whatever it has to draw',
        boxes.length > 1 && spread <= 0.5,
        `${boxes.length} rows, first boxes at ${boxes.map((x) => x.toFixed(1)).join(', ')}, `
        + `a spread of ${Number.isNaN(spread) ? 'nothing to compare' : spread.toFixed(2)} px`);
      clearAnswer();
    }

    /**
     * The object block keeps one height whatever is in it; the tallest case must scroll inside.
     * See lessons/page-wish.md#wish-246
     */
    {
      show(FIXED);                       // two transforms, 16 lines
      const tall = patch.getBoundingClientRect().height;
      const scrolls = patch.scrollHeight > patch.clientHeight + 1;
      show(EXAMPLES[1].links);           // one transform, 12 lines
      const short = patch.getBoundingClientRect().height;
      const still = patch.scrollHeight > patch.clientHeight + 1;
      clearAnswer();
      const empty = patch.getBoundingClientRect().height;
      d.assert('the object block keeps its height whatever is in it, and anything taller scrolls inside it',
        tall > 0 && Math.abs(tall - short) < 1 && Math.abs(tall - empty) < 1
        && scrolls && !still && getComputedStyle(patch).overflowY === 'auto',
        `${tall.toFixed(0)} px for a 16 line object, ${short.toFixed(0)} for a 12 line one and `
        + `${empty.toFixed(0)} with nothing asked; the long one `
        + `${scrolls ? 'scrolls' : 'does NOT scroll'} and the short one `
        + `${still ? 'scrolls too' : 'does not'}`);
    }

    /**
     * On hover `createDiagram` writes the box's note into the caption and marks it `data-on`; the
     * row's sentence returns when the pointer leaves. Driven with a real `pointerenter`, and the
     * row keeps its height.
     * See lessons/page-wish.md#wish-247
     */
    {
      show(FIXED);
      const say = sayEls()[0];
      const box = answer.querySelector('.wish-conn .pos-dg-n');
      const cap = answer.querySelector('.wish-conn .pos-dg-cap');
      /**
       * One caption element with two contents: hovering a box swaps the line to its note, leaving
       * brings the verdict back, and the row height does not change.
       * See lessons/page-wish.md#wish-248
       */
      const roomBefore = say.getBoundingClientRect().height;
      const restText = cap?.textContent || '';
      box.dispatchEvent(new PointerEvent('pointerenter', { bubbles: false }));
      const duringText = cap?.textContent || '';
      const roomDuring = say.getBoundingClientRect().height;
      const reading = cap?.dataset.on === '1' && duringText !== restText;
      box.dispatchEvent(new PointerEvent('pointerleave', { bubbles: false }));
      const afterText = cap?.textContent || '';
      d.assert('the line swaps to what a box says while it is read, and takes its verdict back',
        restText.length > 10 && reading && afterText === restText
        && roomBefore > 0 && Math.abs(roomBefore - roomDuring) < 0.5,
        `at rest ${JSON.stringify(restText.slice(0, 40))}, while read `
        + `${JSON.stringify(duringText.slice(0, 40))}, back to `
        + `${afterText === restText ? 'the same' : JSON.stringify(afterText.slice(0, 40))}, `
        + `and the line is ${roomBefore.toFixed(1)} px either way`);
      clearAnswer();
    }

    d.assert('the desk it describes is the one the other pages build ids for',
      PORTS.some((p) => p.id === 'here:circuit:in') && PORTS.some((p) => p.id === 'here:mk-425c-usb-midi-keyboard:out'),
      `${PORTS.length} ports`);

    /**
     * The instruments' aliases leave this page; the Worker renders them (graded by
     * `node workers/wish/src/wish-test.mjs`). Port ids stay untouched, since they are the enum.
     * See lessons/page-wish.md#wish-249
     */
    const told = portsForModel();
    const names = told.flatMap((p) => p.also ?? []);
    d.assert('the model is told the other names this room uses, and never a new port id',
      told.length === PORTS.length
      && told.map((p) => p.id).join() === PORTS.map((p) => p.id).join()
      && names.includes('Evolution') && names.includes('TASCAM')
      && told.every((p) => p.also?.length > 0),
      `${new Set(names).size} names across ${told.length} ports, `
      + `ids ${told.map((p) => p.id).join() === PORTS.map((p) => p.id).join() ? 'unchanged' : 'MOVED'}`);

    /* The hold, driven with real pointer events. No microphone: `begin()` stops at its `SELFCHECK`
       line, so the wiring and arithmetic are graded.
       See lessons/page-wish.md#wish-250 */

    /* The shell disables a control while its handler is pending, and this check is that
       handler: presses on a disabled button land on nothing.
       See lessons/page-wish.md#wish-251 */
    const wasOff = speakBtn.disabled;
    speakBtn.disabled = false;
    const press = (type, init) => speakBtn.dispatchEvent(new PointerEvent(type,
      { bubbles: true, pointerId: 1, pointerType: 'mouse', button: 0, ...init }));

    /* Answer and question are put up first and the press must clear both, on the press.
       See lessons/page-wish.md#wish-252 */
    show(CANNED);
    said.value = EXAMPLE;
    const before = [patch.textContent, whyText(), said.value,
      d.el.isConnected ? arrows() : 1].join('|');

    const began0 = talk.began, ended0 = talk.ended;
    const darkBefore = !speakBtn.dataset.busy;
    press('pointerdown');
    const midHold = talk.holding;
    const litDuring = speakBtn.dataset.busy === '1';

    /* The paint is this control's only feedback: dark before a touch, lit from the press.
       It cannot say whether the microphone hears anything.
       See lessons/page-wish.md#wish-253 */
    d.assert('the press lights the control it was aimed at',
      darkBefore === true && litDuring === true,
      `busy before ${!darkBefore}, busy during ${litDuring}`);
    d.assert('the press takes the whole last answer away before it listens',
      before.length > 20 && patch.textContent === '' && !patch.dataset.shown
      && whyText() === '' && said.value === '' && arrows() === 0
      /* The press empties the rows but keeps one empty row, so the component does not shrink.
         See lessons/page-wish.md#wish-254 */
      && rowsOf().length === 1,
      `patch ${JSON.stringify(patch.textContent)}, shown ${!!patch.dataset.shown}, `
      + `${sayEls().filter((n) => n.textContent).length} rows with words in them, `
      + `${rowsOf().length} standing, ${said.value.length} characters, ${arrows()} arrows`);

    press('pointerup');
    d.assert('a press and a release is one hold, begun and ended',
      midHold === true && talk.began === began0 + 1 && talk.ended === ended0 + 1 && talk.holding === false,
      `holding ${midHold} during, ${talk.began - began0} begun, ${talk.ended - ended0} ended, holding ${talk.holding} after`);

    press('pointerdown');
    press('pointercancel');
    d.assert('a press the browser takes away ends the hold rather than leaving it recording',
      talk.holding === false && talk.last?.kind === 'cancel' && talk.ended === ended0 + 2,
      `holding ${talk.holding}, last ${talk.last?.kind}`);

    /* The negative control is in the same line: a long press must NOT be read
       as a tap, or every hold would quietly become a fixed window. */
    d.assert('a press too short to be a hold is a tap, and a long one is not',
      talk.classify(10) === 'tap' && talk.classify(MIN_HOLD - 1) === 'tap'
      && talk.classify(MIN_HOLD) === 'hold' && talk.classify(4000) === 'hold',
      `the line is ${MIN_HOLD} ms`);

    /* A held button on an iPhone raises the loupe and selection handles; computed values.
       Desktop Chrome computes `-webkit-touch-callout` as `''`, so an unanswerable probe reads
       `unknown` and never blocks; the detail says which of the three were read.
       See lessons/page-wish.md#wish-255 */
    const cs = getComputedStyle(speakBtn);
    const callout = cs.getPropertyValue('-webkit-touch-callout');
    d.assert('a long press on this control is a mis-press, never a selection',
      cs.touchAction === 'manipulation' && cs.userSelect === 'none'
      && (callout === '' || callout === 'none'),
      `touch-action ${cs.touchAction}, user-select ${cs.userSelect}, `
      + `callout ${callout || 'not computed by this browser'}`);

    /* The examples drill sits here: the shell paints `data-busy` on `speak` at this handler's
       first yield, so every await belongs below the line that reads `speakBtn.dataset.busy`.
       The last row is pressed and left pending for the shimmer drill.
       See lessons/page-wish.md#wish-256 */
    /* Every example row is pressed for real (`post` is gated) via `.click()` on the row. Rows are
       read off `scroller()`, the body: the heading is also a `.pos-tbl-row` and comes first.
       See lessons/page-wish.md#wish-257 */
    const rowEls = () => [...examples.scroller().querySelectorAll('.pos-tbl-row')];
    const tick = () => new Promise((r) => { setTimeout(r, 0); });
    d.assert('the table lists every example, with a heading over rows and a sentence on each',
      EXAMPLES.length === 5 && rowEls().length === 5
      && rowEls().every((r, i) => r.title === EXAMPLES[i].was && r.title.length > 40)
      && examples.el.querySelector('.pos-tbl-head')?.hidden === false,
      `${rowEls().length} rows of ${EXAMPLES.length}, heading hidden `
      + `${examples.el.querySelector('.pos-tbl-head')?.hidden}, shortest hover `
      + `${Math.min(...rowEls().map((r) => r.title.length))} characters`);

    /**
     * The table reports what did not fit, to the author. `measured` is a clause: a table with
     * no layout reports no cuts, which must not read as clean.
     * See lessons/page-wish.md#wish-258
     */
    const tcuts = examples.cuts();
    d.assert('the table fits its box, so no heading wraps and no row is dragged sideways',
      tcuts.measured === true && tcuts.cuts.length === 0,
      tcuts.measured
        ? (tcuts.cuts.map((c) => `${c.where} ${c.id}: ${c.full} shown as ${c.shown}`).join('; ')
           || `nothing cut across ${tcuts.width.toFixed(0)} px`)
        : 'the table had no layout to measure');

    /**
     * One line per example compared as one string, so a row behaving like its neighbour fails.
     * Verdicts are read off the page, not off `grade`'s return.
     * See lessons/page-wish.md#wish-259
     */
    /**
     * The verdict is read from `data-verdict`, written by `show()`; the caption is plain text
     * with no elements to read it from.
     * See lessons/page-wish.md#wish-260
     */
    const verdicts = () => rowsOf().map((r) => r.dataset.verdict).filter(Boolean);
    const ran = [];
    for (let i = 0; i < EXAMPLES.length; i++) {
      rowEls()[i].click();
      await tick();
      const v = verdicts();
      ran.push({
        about: EXAMPLES[i].about,
        inBox: said.value === EXAMPLES[i].say,
        lit: examples.scroller().querySelectorAll('.pos-tbl-row.on').length,
        /* Incomplete is counted too, or such a row would be counted by neither half. Zero today.
           See lessons/page-wish.md#wish-261 */
        line: `${EXAMPLES[i].about}: ${v.filter((x) => x === 'allowed').length} allowed, `
          + `${v.filter((x) => x === 'refused').length} refused, `
          + `${v.filter((x) => x === 'incomplete').length} incomplete, ${arrows()} arrow`
          + `${arrows() === 1 ? '' : 's'}`
          + (labels().length ? ` saying ${labels().map((t) => JSON.stringify(t)).join(' and ')}` : ''),
      });
    }
    d.assert('a row writes its sentence into the box the microphone fills, lights up, and asks nobody',
      ran.every((r) => r.inBox) && ran.every((r) => r.lit === 1) && reached === 0,
      `${ran.filter((r) => r.inBox).length} of ${ran.length} landed in the box, `
      + `${ran.map((r) => r.lit).join()} rows lit, ${reached} calls to the agent`);
    d.assert('the five examples come back five different ways',
      ran.map((r) => r.line).join(' | ') === [
        'a transpose: 1 allowed, 0 refused, 0 incomplete, 1 arrow saying "note, cc, bend"',
        'a port with a twin: 1 allowed, 0 refused, 0 incomplete, 1 arrow saying "note, cc, bend"',
        /* The split is two links, so two rows and two arrows.
           See lessons/page-wish.md#wish-262 */
        'a keyboard split: 0 allowed, 2 refused, 0 incomplete, 2 arrows saying "refused" and "refused"',
        'not on this desk: 0 allowed, 0 refused, 0 incomplete, 0 arrows',
        'a knob: 1 allowed, 0 refused, 0 incomplete, 1 arrow saying "note, cc, bend"',
      ].join(' | '),
      ran.map((r) => r.line).join(' | '));

    /**
     * The port detail is measured on the Model 12 example, the instrument with four ports.
     * `:not([aria-hidden])` skips `createDiagram`'s off-screen text ruler.
     * See lessons/page-wish.md#wish-263
     */
    rowEls()[1].click();
    await tick();
    const subs = [...answer.querySelectorAll('.wish-conn .pos-dg-sub:not([aria-hidden])')]
      .map((t) => t.textContent);
    const arrowSays = answer.querySelector('.wish-conn .pos-dg-l')
      ?.getAttribute('aria-label') || '';
    d.assert('the picture names the port in use, and the arrow carries the whole connection',
      /* Which subs are under the boxes, not in what order.
         See lessons/page-wish.md#wish-264 */
      subs.length === 2 && subs.includes('MIDI IN') && subs.includes('in')
      && /^Model 12 MIDI IN to Circuit\./.test(arrowSays)
      && /It carries note, cc, bend, after channel 1\./.test(arrowSays)
      && /Circuit will drop touch, program, clock, transport\./.test(arrowSays),
      `the boxes read ${JSON.stringify(subs)} and the arrow says ${JSON.stringify(arrowSays)}`);

    /* An allowed link also says what the far end drops: a MIDI port emits six classes and the
       Circuit consents to three.
       See lessons/page-wish.md#wish-265 */
    d.assert('an allowed link says what the far end will throw away',
      /Circuit will drop touch, program, clock/.test(whyText())
      && verdicts().join() === 'allowed',
      whyText().trim().slice(0, 120));

    /**
     * A prepared row presses `Interpret`, so `shell.mjs` paints `data-busy`, `disabled` and
     * `aria-busy`: none lit before, all three during, all gone after. A second press mid-flight
     * marks no row and writes nothing into the box.
     * See lessons/page-wish.md#wish-266
     */
    {
      const go = d.button('interpret');
      const idle = !go.disabled && !go.dataset.busy;
      rowEls()[2].click();
      const lit = go.disabled && go.dataset.busy === '1' && go.getAttribute('aria-busy') === 'true';
      const asked = said.value;
      const marked = examples.scroller().querySelectorAll('.pos-tbl-row.on').length;
      rowEls()[3].click();
      const refused = said.value === asked
        && examples.scroller().querySelectorAll('.pos-tbl-row.on').length === marked
        && examples.scroller().querySelector('.pos-tbl-row.on')?.title === EXAMPLES[2].was;
      await tick();
      const done = !go.disabled && !go.dataset.busy && !go.hasAttribute('aria-busy');
      d.assert('a prepared row leaves Interpret disabled and swept while it works, and clears it after',
        idle && lit && refused && done,
        `${idle ? 'idle' : 'ALREADY LIT'} before, ${lit ? 'disabled and swept' : 'NOT lit'} `
        + `during, ${done ? 'clear' : 'STILL LIT'} after, and a second row while it worked `
        + `${refused ? 'changed nothing' : 'CHANGED THE PAGE'}`);
    }

    /* The last press is left pending for the shimmer drill below.
       See lessons/page-wish.md#wish-267 */
    rowEls()[0].click();

    /* The shimmer at every moment of the flow. Every press happens before the first `await`,
       when the shell paints `speak` busy. Each moment has a negative half: no shimmer while only
       a microphone is open.
       See lessons/page-wish.md#wish-268 */
    /**
     * Which surfaces say they are waiting, as one string. Reads the DOM, never `waitFor`'s
     * argument. Still reads the pickers, expected never to sweep: `choice.mjs` still has
     * `pending()`.
     * See lessons/page-wish.md#wish-269
     */
    const waiting = () => [
      said.dataset.busy ? 'transcript' : '',
      patch.dataset.busy ? 'patch' : '',
      hearPick.buttons[hearPick.get()].dataset.busy ? 'hear model' : '',
      patchPick.buttons[patchPick.get()].dataset.busy ? 'patch model' : '',
    ].filter(Boolean).join(' + ') || 'nothing';

    /* Everything in flight must land first, since the last example press is not awaited. A
       `setTimeout`, not a microtask: a proposal is several ticks deep. Then nothing may shimmer.
       See lessons/page-wish.md#wish-270 */
    await new Promise((r) => { setTimeout(r, 0); });
    speakBtn.disabled = false;              // the shell disabled it across that await
    const span = [`at rest: ${waiting()}`];
    press('pointerdown');
    /* Negative moment: an open microphone waits on a person, so nothing shimmers.
       See lessons/page-wish.md#wish-271 */
    span.push(`held: ${waiting()}`);
    press('pointerup');                     // a tap, which opens no microphone
    span.push(`let go: ${waiting()}`);
    /**
     * The whole release through the real `finish()`, costing nothing; `chunks` is empty so the
     * blob is 0 bytes. Sampled before the await: `waitFor('hear')` is the last synchronous step.
     * See lessons/page-wish.md#wish-272
     */
    const f = finish();
    span.push(`listening: ${waiting()}`);
    await f;
    span.push(`landed: ${waiting()}`);

    /**
     * The release asks by itself: one call, both models ran, transcription in the box and object
     * below. The transcription is not the example sentence. The parse is guarded.
     * See lessons/page-wish.md#wish-273
     */
    const proposed = (() => { try { return JSON.parse(patch.textContent); } catch { return null; } })();
    d.assert('a release transcribes and then proposes, with no second press and nobody reached',
      said.value === CANNED_HEARD && patch.dataset.shown === '1'
      /* `[0]`: the box is a JSON array, one entry per link.
         See lessons/page-wish.md#wish-274 */
      && Array.isArray(proposed) && proposed[0]?.transforms?.[0]?.by === 1
      && reached === 0,
      `box reads ${JSON.stringify(said.value.slice(0, 32))}, patch `
      + `${JSON.stringify(proposed?.[0]?.transforms ?? null)}, ${reached} calls to the agent`);

    const p = think(EXAMPLE);               // free: `post` is gated, see CANNED
    span.push(`proposing: ${waiting()}`);
    await p;
    span.push(`answered: ${waiting()}`);
    d.assert('a box shimmers while its own model is working, and at no other time',
      span.join(' | ') === ['at rest: nothing',
        'held: nothing',
        'let go: nothing',
        'listening: transcript',
        'landed: nothing',
        'proposing: patch',
        'answered: nothing'].join(' | '),
      span.join(' | '));

    /**
     * A name the speech model mangled is repaired before the patch model reads it, using real
     * replies and the real picker. The `turbo` assert above is the negative control. The old
     * words are read back off the log.
     * See lessons/page-wish.md#wish-275
     */
    {
      const at = (m) => HEAR.findIndex(([, id]) => id === m);
      const runs = [];
      for (const [model, was, want] of [
        /**
         * `taskham` is ambiguous on this desk (`TASCAM Model 12` and its DAW control pair) and
         * `reword()` never picks between two, so the sentence stays unchanged and the log says why.
         * See lessons/page-wish.md#wish-276
         */
        ['@cf/openai/whisper', 'taskham',
          'The evolution plays the circuit and the taskham records it.'],
        /* No leading space in the expectation, and `whisper-tiny-en` really
           does put one on everything: `finish()` trims before it repairs, so
           what the box gets is the sentence without the model's own margin. */
        ['@cf/openai/whisper-tiny-en', 'MK425 C', 'Play the Evolution MK-425C into the circuit.'],
      ]) {
        hearPick.buttons[at(model)].click();
        await finish();
        runs.push({ was, want, got: said.value });
      }
      hearPick.buttons[0].click();          // put the picker back where it was
      const log = document.querySelector('.pos-log')?.textContent || '';
      d.assert('a mangled name is repaired when it names one thing and left alone when it names two',
        runs.every((r) => r.got === r.want) && runs.every((r) => log.includes(`"${r.was}"`))
        && /names two things here/.test(log),
        runs.map((r) => `${JSON.stringify(r.was)} -> ${JSON.stringify(r.got.slice(0, 44))}`).join(' | '));

      /**
       * A name this desk lacks (the Fast Track) is reported, never substituted.
       * See lessons/page-wish.md#wish-277
       */
      const away = 'The fast track row is the recording input.';
      const back = hearWords(away);
      /* Both halves of the sentence: `not on this desk` is also an example's `about`, which a
         failing assert's detail could carry into the log.
         See lessons/page-wish.md#wish-278 */
      const line = (document.querySelector('.pos-log')?.textContent || '')
        .split('\n').find((l) => l.includes('sounds like')
          && l.includes('not on this desk')) || '';
      d.assert('a name this desk does not have is said out loud and never written into the box',
        back === away && line.includes('Fast Track'),
        `${JSON.stringify(back.slice(0, 32))}, log says ${JSON.stringify(line.trim().slice(-58))}`);
    }

    /**
     * Enter asks and claims the key; Shift+Enter does neither. Sampled on the sweep:
     * `waitFor('patch')` is a proposal's first synchronous step.
     * See lessons/page-wish.md#wish-279
     */
    clearAnswer();
    said.value = EXAMPLE;
    const key = (init) => {
      const e = new KeyboardEvent('keydown',
        { key: 'Enter', bubbles: true, cancelable: true, ...init });
      said.dispatchEvent(e);
      return { asked: patch.dataset.busy === '1', claimed: e.defaultPrevented };
    };
    const withShift = key({ shiftKey: true });
    const plain = key({});
    d.assert('Enter asks what is in the box, and Shift+Enter leaves the key alone',
      plain.asked === true && plain.claimed === true
      && withShift.asked === false && withShift.claimed === false
      // And the box has no placeholder; asserted, since a stray one survives removals.
      // See lessons/page-wish.md#wish-280
      && said.placeholder === '',
      `Enter asked ${plain.asked} and claimed ${plain.claimed}, Shift+Enter asked `
      + `${withShift.asked} and claimed ${withShift.claimed}, the box says `
      + `${JSON.stringify(said.placeholder)} and the gesture is on `
      + `"${speakBtn.textContent}" and "${d.button('interpret').textContent}"`);
    await new Promise((r) => { setTimeout(r, 0); });   // let that proposal land

    /* Paint, not room: height read with the sweep on and off, animation read as a computed
       value. Under reduced motion the answer is `none` and the page says which branch it measured.
       See lessons/page-wish.md#wish-281 */
    const stillness = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const quietH = [said.getBoundingClientRect().height, patch.getBoundingClientRect().height];
    said.dataset.busy = '1';
    patch.dataset.busy = '1';
    const moving = [getComputedStyle(said).animationName, getComputedStyle(patch).animationName];
    const busyH = [said.getBoundingClientRect().height, patch.getBoundingClientRect().height];
    delete said.dataset.busy;
    delete patch.dataset.busy;
    /**
     * Grades the shimmer's absence on the boxes; `data-busy` must still land.
     * See lessons/page-wish.md#wish-282
     */
    d.assert('neither text box animates while it is working, and neither changes height',
      moving.every((a) => a === 'none')
      && said.dataset.busy === undefined && patch.dataset.busy === undefined
      && quietH[0] === busyH[0] && quietH[1] === busyH[1],
      `${moving.join(' and ')} under ${stillness ? 'reduced motion' : 'ordinary motion'}, `
      + `heights ${quietH.map((h) => h.toFixed(1)).join('/')} against `
      + `${busyH.map((h) => h.toFixed(1)).join('/')}`);
    speakBtn.disabled = wasOff;

    if (d.el.isConnected) {
      /* A textarea must not grow with its content: measured empty and overfull.
         See lessons/page-wish.md#wish-283 */
      const emptyBox = said.getBoundingClientRect().height;
      const keptText = said.value;
      said.value = `${EXAMPLE} ${EXAMPLE} ${EXAMPLE} ${EXAMPLE}`;
      const fullBox = said.getBoundingClientRect().height;
      said.value = keptText;
      d.assert('the transcript box keeps its height whether it is empty or full',
        emptyBox === fullBox && emptyBox >= 56 && emptyBox <= 72 && said.scrollHeight > 0,
        `${emptyBox.toFixed(1)} px empty against ${fullBox.toFixed(1)} px full`);
      d.assert('the page does not drag sideways at this width',
        document.documentElement.scrollWidth <= window.innerWidth + 1,
        `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);

      /**
       * No readout and no empty box painting an edge where one would be: tested on the rendered
       * height, whether the shell omits or hides it.
       * See lessons/page-wish.md#wish-284
       */
      const ro = d.el.parentElement.querySelector('.pos-readout')
        || document.querySelector('.pos-readout');
      const roH = ro ? ro.getBoundingClientRect().height : 0;
      d.assert('no readout, and no empty box painting an edge where it was',
        __demo.readoutOptOut === true && roH === 0,
        ro ? `a .pos-readout is present and ${roH} px tall, hidden ${ro.hasAttribute('hidden')}`
           : 'no .pos-readout element at all');

      /**
       * The control row is empty (`speak` and `interpret` head the glued blocks), so it must render
       * no height; measured, not assumed hidden.
       * See lessons/page-wish.md#wish-285
       */
      const crow = d.controls;
      const crowH = crow ? crow.getBoundingClientRect().height : 0;
      d.assert('no control row left, and no empty box painting an edge where it was',
        crow.querySelectorAll('button').length === 0 && crowH === 0,
        `${crow.querySelectorAll('button').length} buttons in the row, ${crowH} px tall, `
        + `hidden ${crow.hidden}`);
    }

    /* What a row does by existing: an answer makes the connection and `×` takes it down, against
       two stand-in ports. The gesture is a real press on a prepared row (`useExample`,
       `Interpret`, `askBox`, `think`, `show`); `EXAMPLES[0].links` is `REPAIRED`, `post` is gated.
       See lessons/page-wish.md#wish-286 */
    {
      const at = () => heardBytes.length;
      /* Everything above this line has laid rows down, so the desk is cleared
         and whatever it was connecting is awaited before anything is counted. */
      await connecting;
      clearAnswer();
      await tick();
      const linksBefore = desk.links().length;
      const askedBefore = midiAsked;
      rowEls()[0].click();
      await tick();
      await connecting;
      const c = conns[0];
      d.assert('a row that arrives is already connected, and no instrument was opened to do it',
        linksBefore === 0 && conns.length === 1 && desk.links().length === 1 && !!c.linkId
        && c.el.dataset.connected === '1' && midiAsked === 0 && askedBefore === 0,
        `${linksBefore} links before the press and ${desk.links().length} after across `
        + `${conns.length} row(s), the row reads connected ${c.el.dataset.connected}, `
        + `and requestMIDIAccess was called ${midiAsked} time(s)`);

      /* 0x91 is note on, channel 2, the keyboard's channel; with `transpose by 1`, 60 arriving as
         61 shows the transform ran.
         See lessons/page-wish.md#wish-287 */
      const beforeNote = at();
      const crossedBefore = crossed;
      ins.get(REPAIRED[0].from).onmidimessage({ data: [0x91, 60, 100] });
      const got = heardBytes.slice(beforeNote);
      d.assert('a connected link really carries a message, with its transform applied',
        got.length === 1 && got[0].id === REPAIRED[0].to
        && got[0].bytes[0] === 0x91 && got[0].bytes[1] === 61 && got[0].bytes[2] === 100
        && crossed === crossedBefore + 1,
        `${got.length} message(s) reached ${got[0]?.id}, `
        + `[${(got[0]?.bytes ?? []).map((b) => b.toString(16)).join(' ')}] from a 60 played on `
        + `channel 2, and ${crossed - crossedBefore} of them left the tab`);

      /* A program change is dropped at the Circuit's boundary and counted, not refused: it is off
         `accepts`, not on `never`.
         See lessons/page-wish.md#wish-288 */
      const beforePc = at();
      ins.get(REPAIRED[0].from).onmidimessage({ data: [0xc1, 5] });
      const link = desk.links()[0];
      d.assert('a class the far end does not consent to is dropped at the boundary and counted',
        at() === beforePc && link.dropped === 1 && link.sent === 1,
        `${at() - beforePc} message(s) arrived, ${link.dropped} dropped and ${link.sent} sent`);

      /* A note off with a release velocity (0x81 60 64) must leave as a note
         off. Read as "note with d2 > 0" it went out as 0x91 and re-struck the key. */
      const beforeRelease = at();
      ins.get(REPAIRED[0].from).onmidimessage({ data: [0x81, 60, 64] });
      const rel = heardBytes.slice(beforeRelease);
      d.assert('a note off with a release velocity crosses as a note off, never a note on',
        rel.length === 1 && rel[0].bytes[0] === 0x81 && rel[0].bytes[1] === 61 && rel[0].bytes[2] === 64,
        `[${(rel[0]?.bytes ?? []).map((b) => b.toString(16)).join(' ')}] from 81 3c 40`);

      /* `×` takes the link down and quietens it: 16 channels by two channel mode messages is 32.
         It presses the real button and plays a note to see that nothing still crosses.
         See lessons/page-wish.md#wish-289 */
      const beforeOff = at();
      c.rm.click();
      const quiet = heardBytes.slice(beforeOff);
      const afterQuiet = at();
      ins.get(REPAIRED[0].from).onmidimessage({ data: [0x91, 60, 100] });
      d.assert('the one control takes the link down, quietens the instrument and clears the row',
        desk.links().length === 0 && !c.linkId && conns.length === 0
        && rowsOf().length === 1
        && rowsOf()[0].querySelector('.wish-conn-act').childElementCount === 0
        && quiet.length === 32
        && quiet.every((m) => m.id === REPAIRED[0].to && m.bytes[0] >= 0xb0 && m.bytes[0] <= 0xbf)
        && quiet.filter((m) => m.bytes[1] === 123).length === 16
        && quiet.filter((m) => m.bytes[1] === 120).length === 16
        && at() === afterQuiet,
        `${desk.links().length} links left across ${conns.length} row(s), `
        + `${quiet.length} quietening messages went out and `
        + `${at() - afterQuiet} more crossed after the row went`);

      /* A refused row is never made: the negative half, catching a `connectAll` that ignores `ok`.
         `CANNED` is the real refused reply.
         See lessons/page-wish.md#wish-290 */
      show(CANNED);
      await connecting;
      const bad = conns[0];
      const badAct = bad.el.querySelector('.wish-conn-act');
      const badLinks = desk.links().length;
      const wasTall = rowsOf()[0].getBoundingClientRect().height;
      bad.rm.click();
      const left = rowsOf();
      d.assert('a refused connection is never made, and its one control takes the row off the page',
        bad.row.ok === false && badLinks === 0 && !bad.el.dataset.connected
        && badAct.childElementCount === 1
        && !!badAct.querySelector('button[data-glyph="1"]')
        && left.length === 1 && left[0].querySelector('.wish-conn-act').childElementCount === 0
        && Math.abs(left[0].getBoundingClientRect().height - wasTall) < 0.5,
        `the refused row held ${badAct.childElementCount} control(s) and read connected `
        + `${bad.el.dataset.connected} with ${badLinks} link(s) on the desk; ${left.length} `
        + `row(s) left, ${wasTall.toFixed(1)} px tall before the press and `
        + `${left[0].getBoundingClientRect().height.toFixed(1)} px after`);

      /* An allowed row whose instrument is not plugged in says so. The port is taken out of the
         map and put back, the only way to reach `connect`'s first branch.
         See lessons/page-wish.md#wish-291 */
      const src = REPAIRED[0].from;
      const held = ins.get(src);
      ins.delete(src);
      show(REPAIRED);
      await connecting;
      const lonely = conns[0];
      const unplugged = desk.links().length;
      const marked = lonely.el.dataset.connected;
      ins.set(src, held);
      clearAnswer();
      const logSaid = document.querySelector('.pos-log')?.textContent || '';
      d.assert('a row the desk could not make is not marked as made, and the page says which port',
        lonely.row.ok === true && unplugged === 0 && marked === undefined
        && /so that connection was not made/.test(logSaid),
        `the row graded ok ${lonely.row.ok}, reads connected ${marked}, left ${unplugged} `
        + `link(s) on the desk, and the log `
        + `${/so that connection was not made/.test(logSaid) ? 'names the port' : 'says nothing'}`);

      /**
       * The picture stays a row of boxes: under 560px `diagram.mjs` stacks. Swept on the component,
       * since `demo/verify.mjs` runs at one width. 390 and 560 always stack and are only measured;
       * asserted at every width is that nothing overflows the column.
       * See lessons/page-wish.md#wish-292
       */
      const sweep = [];
      for (const w of [390, 560, 756, 1280]) {
        answer.style.width = `${w}px`;
        show(REPAIRED);
        const act = rowsOf()[0].querySelector('.wish-conn-act');
        const box = act.getBoundingClientRect();
        const over = [...act.children].map((k) => k.getBoundingClientRect())
          .some((b) => b.right > box.right + 0.5 || b.width > box.width + 0.5);
        sweep.push({ w, mode: conns[0]?.dg?.mode ?? 'not drawn',
          fig: figs()[0].getBoundingClientRect().width, over });
      }
      answer.style.width = '';
      /* The sweep laid four answers down, so the last one's link is awaited and
         then taken down rather than left live on the way out of this block. */
      await connecting;
      clearAnswer();
      d.assert('the actions overflow the column at no width, and the picture is still a row where it was',
        sweep.every((s) => !s.over)
        && sweep.filter((s) => s.w >= 756).every((s) => s.mode === 'row'),
        sweep.map((s) => `${s.w}: ${s.mode} across ${s.fig.toFixed(0)} px`
          + `${s.over ? ', actions overflowing' : ''}`).join(' | '));
    }

    /**
     * The repair, graded both ways, and last: an earlier `await think()` leaves the control lit
     * for the press drill. The boundary's patch must be accepted and the raw one still refused.
     * See lessons/page-wish.md#wish-293
     */
    {
      const repaired = show(REPAIRED);
      const raw = show(CANNED);
      d.assert('the repaired reply is allowed and the raw one it came from is still refused',
        repaired.ok === 1 && repaired.refused === 0
        && raw.ok === 0 && raw.refused === 1,
        `repaired ${repaired.ok} allowed, raw ${raw.refused} refused`);
      /* And the page says it, read off the log. The proposal is driven here rather than relying on
         a press order; `post` is gated.
         See lessons/page-wish.md#wish-294 */
      await think(EXAMPLE);
      const logText = document.querySelector('.pos-log')?.textContent || '';
      d.assert('and the page says in words which key the model wrote and which it was read as',
        /wrote "to"/.test(logText) && /"by"/.test(logText),
        logText.split('\n').find((l) => l.includes('wrote')) || 'no such line in the log');
    }

    d.assert('no secret in this page', !location.href.includes('token'));
  });

  /**
   * The checks are driven from here: `demo/verify.mjs` presses only `.pos-controls button`,
   * and `speak` is in the hear header. Pressing the real button keeps the shell's busy paint
   * and the `SELFCHECK` branch on the path.
   * See lessons/page-wish.md#wish-295
   */
  if (SELFCHECK) speakBtn.click();

  d.ready();
</script>

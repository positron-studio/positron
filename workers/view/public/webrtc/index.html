<!-- No page stylesheet: the video panel's stage owns the element's size, shape and fit.
     See lessons/page-webrtc.md#webrtc-1 -->

<script type="module">
  import { mount, guard, el, armVideo, playOrPrompt } from '/shell/shell.mjs';
  import { RETIRED_LEG, fetchIceServers, readIcePath } from '/shell/live.mjs';
  import { createPresenceButton, streamSays, STREAM_CAN } from '/shell/presence.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  const d = mount({
    name: 'webrtc',
    // One sentence, the index's own line. The picture, the control's label and the footer
    // labels carry the rest.
    // See lessons/page-webrtc.md#webrtc-2
    what: 'The test picture over WHEP, a leg retired on 2026-10-13.',
    // Six cells from one `getStats()` a second on the video inbound-rtp: buffer (delta
    // jitterBufferDelay over emitted count), jitter, lost, dropped, freezes, negotiated codec.
    // No cell claims glass to glass; the candidate-pair round trip is in the footer, labelled.
    // See lessons/page-webrtc.md#webrtc-3
    readout: { buffer: 'ms', jitter: 'ms', lost: '', dropped: '', freezes: '', codec: '' },
    // No primary button. See the note on the control below, and `/llhls/`,
    // which was asked for the same thing in the same sitting.
    controls: [],
  });
  guard(d);

  /**
   * The same presence control and words as /llhls/, from `STREAM` in presence.mjs. A press
   * during `starting` stops; Cloudflare holds a WHIP input against a stale publisher ~45 s.
   * See lessons/page-webrtc.md#webrtc-4
   */
  const stream = createPresenceButton({
    of: '', showName: false, state: 'offline', says: streamSays('WebRTC'), can: STREAM_CAN,
    aria: 'start or stop the stream',
    press: () => d.run('toggle'),
  });
  stream.because('nothing is publishing until you press');
  d.controls.hidden = false;
  d.controls.append(stream.el);

  // No native `controls`: see `/llhls/`, where the element's own bar drew a
  // scrub bar over a live stream and a second ⛶ an inch above the panel's.
  const video = el('video', '', null, { playsinline: '', muted: '', autoplay: '' });
  video.muted = true;

  /**
   * Picture, resolution and frame rate as cells. This leg is WHIP: libopus audio and video
   * offered as baseline 3.1 (rig/whep/WHIP-FFMPEG-NOTES.md).
   * See lessons/page-webrtc.md#webrtc-5
   */
  const panel = createVideoPanel({
    media: video,
    left: null,
    fullMode: 'hover',
    values: [
      { key: 'size', label: '', reserve: 9 },
      { key: 'fps', label: 'fps', reserve: 4 },
      /**
       * The one latency here: candidate-pair `currentRoundTripTime`, a network round trip to
       * Cloudflare, not encode, SFU, buffer or decode. A fourth cell would scroll at 375 px.
       * See lessons/page-webrtc.md#webrtc-6
       */
      // `ping` rather than `network round trip`: at 375 px the longer label overflowed the row
      // (303 against 259 px). The route word beside it keeps it from reading as picture delay.
      // See lessons/page-webrtc.md#webrtc-7
      { key: 'rtt', label: 'ping', reserve: 6 },
      /**
       * The route the media took, `direct` or `relay`, from `readIcePath`. A ping through TURN
       * is not comparable to a direct one, so the number never shows without it.
       * See lessons/page-webrtc.md#webrtc-8
       */
      { key: 'path', label: '', reserve: 6 },
    ],
  });
  /**
   * The spec is written when a picture arrives, not on load; `createPanelValues` hides its
   * row while every cell is empty, so this page only has to not write a cell early.
   * See lessons/page-webrtc.md#webrtc-9
   */
  d.el.append(panel.el);

  // A custom property, never `video.style.aspectRatio`: an inline style beats the rules
  // that let a panel fill a screen. An SFU can change resolution mid-call, hence `resize`.
  // See lessons/page-webrtc.md#webrtc-10
  const shape = () => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return;
    panel.values.set('size', `${w}x${h}`);
    panel.stage.style.setProperty('--vp-aspect', `${w} / ${h}`);
  };
  video.addEventListener('loadedmetadata', shape);
  video.addEventListener('resize', shape);

  let pc = null, ws = null, started = 0;
  let held = false, unwatchFps = null, abort = null, playing = false;
  // A generation, because the start path awaits a cold container and then
  // retries a WHEP offer six times: every one of those is a place a press can
  // land. See `/llhls/`, which took the same shape in the same sitting.
  let gen = 0;

  /**
   * Relay servers are asked for on the press, never on load. `fetchIceServers` never throws
   * and falls back to STUN. `iceLoadAsks()` reads resource timing and must read 0.
   * See lessons/page-webrtc.md#webrtc-11
   */
  let ice = null, iceAsks = 0, pressAt = null, icePath = null;
  const iceLoadAsks = () => performance.getEntriesByType('resource')
    .filter((e) => /\/ice(\?|$)/.test(e.name) && (pressAt == null || e.startTime < pressAt)).length;
  function askIce() {
    iceAsks++;
    return fetchIceServers({ log: (m) => d.log(m) });
  }

  /**
   * `stream.state()` is a function on the presence api; comparing the bare property to
   * 'offline' is always false.
   * See lessons/page-webrtc.md#webrtc-12
   */
  d.on('toggle', () => (stream.state() === 'offline' ? start() : stop()));

  /**
   * Let it go: closing the socket releases the publisher, whose sweep stops the encoder about
   * a minute later. The peer connection closes too, since it bills delivered minutes.
   * See lessons/page-webrtc.md#webrtc-13
   */
  function stop() {
    gen++;
    abort?.abort(); abort = null;
    unwatchFps?.(); unwatchFps = null;
    try { ws?.close(); } catch { /* already gone */ }
    ws = null;
    held = false;
    playing = false;
    try { pc?.close(); } catch { /* already gone */ }
    pc = null;
    try { video.pause(); } catch { /* fine */ }
    video.srcObject = null;
    panel.values.set('fps', '');
    panel.values.set('size', '');
    panel.values.set('rtt', '');
    panel.values.set('path', '');
    icePath = null;
    clearStats();
    stream.set('offline').because('the publisher stops about a minute after the last viewer goes');
    d.log('let the publisher go. it stops about a minute after the last viewer goes');
  }

  /* The test pattern's WHIP leg is retired (input whep-rig deleted, pub answers 410), so every
     tier is light and a press says so at once. /video/webrtc/ still has a publisher behind it.
     See lessons/page-webrtc.md#webrtc-14 */
  const LIGHT = true;

  async function start() {
    if (pc) return;
    stream.set('offline').because(RETIRED_LEG);
    d.log(`${RETIRED_LEG}: its input and the publisher behind it are deleted, so nothing will come`, 'bad');
    if (SELFCHECK) await d.run('check');
  }

  /**
   * `on` is latched on `framePresented`, so the toggle describes the stream, not the player:
   * a paused element still holds the socket, and a track arriving is not a picture.
   * See lessons/page-webrtc.md#webrtc-15
   */
  function settle() {
    if (!ws) return;
    notePresented();
    if (framePresented) playing = true;
    stream.set(playing ? 'online' : 'coming')
      .because(playing ? 'press to stop it' : 'the container and its encoder are waking. press again to stop');
  }
  video.addEventListener('playing', settle);
  video.addEventListener('loadeddata', settle);
  video.addEventListener('resize', settle);

  /**
   * The readout and footer round trip's last values as numbers, so the check grades the
   * reading, not the text. `jb` is the previous jitter buffer pair, for the one-second delta.
   * See lessons/page-webrtc.md#webrtc-16
   */
  const stat = { buffer: null, jitter: null, lost: null, dropped: null, freezes: null, codec: '', rtt: null, nack: null };
  let jb = null;
  function clearStats() {
    for (const k of Object.keys(stat)) stat[k] = k === 'codec' ? '' : null;
    jb = null;
    for (const k of ['buffer', 'jitter', 'lost', 'dropped', 'freezes', 'codec']) d.set(k, '');
  }
  // A mimeType is `video/H264` or `audio/opus`; the name a reader knows is
  // `H.264` and `Opus`. Anything unlisted is shown as the browser said it.
  const CODEC = { h264: 'H.264', opus: 'Opus', vp8: 'VP8', vp9: 'VP9', av1: 'AV1', pcmu: 'PCMU', pcma: 'PCMA' };
  const codecName = (mime) => {
    const n = String(mime || '').split('/').pop();
    return CODEC[n.toLowerCase()] || n;
  };

  async function readStats() {
    const p = pc;
    if (!p) return;
    const stats = await p.getStats().catch(() => null);
    // Stopped while the reading was in flight: a closed connection's numbers
    // must not land in cells that `stop()` has just emptied.
    if (!stats || p !== pc) return;
    let vin = null, ain = null;
    for (const s of stats.values()) {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        vin = s;
        // `framesPerSecond` is the decoder's rate; the footer counts frames presented through
        // `requestVideoFrameCallback`. These numbers tell apart no RTP, no decode, and no present.
        // See lessons/page-webrtc.md#webrtc-17
        lastVideoRtp = {
          received: s.framesReceived, decoded: s.framesDecoded, dropped: s.framesDropped,
          packets: s.packetsReceived, bytes: s.bytesReceived, w: s.frameWidth, h: s.frameHeight,
          decoder: s.decoderImplementation, keyframes: s.keyFramesDecoded,
        };
      }
      if (s.type === 'inbound-rtp' && s.kind === 'audio') ain = s;
      if (s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated !== false
        && Number.isFinite(s.currentRoundTripTime)) {
        stat.rtt = s.currentRoundTripTime * 1000;
        panel.values.set('rtt', `${Math.round(stat.rtt)} ms`);
      }
    }
    if (!vin) return;
    // How long a frame waited in the receiver's buffer over the last second.
    // The cumulative average is the fallback only until a previous sample
    // exists, because it is mostly a report on the first second of the call.
    const delay = vin.jitterBufferDelay, emitted = vin.jitterBufferEmittedCount;
    if (Number.isFinite(delay) && emitted > 0) {
      const dn = jb ? emitted - jb.emitted : 0;
      stat.buffer = dn > 0 ? ((delay - jb.delay) / dn) * 1000 : jb ? stat.buffer : (delay / emitted) * 1000;
      jb = { delay, emitted };
    }
    stat.jitter = Number.isFinite(vin.jitter) ? vin.jitter * 1000 : null;
    stat.lost = Number.isFinite(vin.packetsLost) ? vin.packetsLost : null;
    stat.dropped = Number.isFinite(vin.framesDropped) ? vin.framesDropped : null;
    stat.freezes = Number.isFinite(vin.freezeCount) ? vin.freezeCount : null;
    stat.nack = Number.isFinite(vin.nackCount) ? vin.nackCount : null;
    const name = (s) => { const m = s && stats.get(s.codecId)?.mimeType; return m ? codecName(m) : ''; };
    const codec = name(vin);
    // One line, once the video side is known, naming both sides.
    if (codec && codec !== stat.codec) d.log(`negotiated ${[codec, name(ain)].filter(Boolean).join(' + ')}`);
    stat.codec = codec;
    d.set('buffer', stat.buffer == null ? '' : Math.round(stat.buffer));
    d.set('jitter', stat.jitter == null ? '' : Math.round(stat.jitter * 10) / 10);
    d.set('lost', stat.lost ?? '');
    d.set('dropped', stat.dropped ?? '');
    d.set('freezes', stat.freezes ?? '');
    d.set('codec', stat.codec);
    const ip = await readIcePath(p);
    if (p !== pc) return;
    if (ip.path && ip.path !== icePath?.path) {
      d.log(ip.path === 'relay'
        ? `the media goes through the relay, over ${ip.relayProtocol || ip.protocol || 'an unknown protocol'}`
        : `the media goes direct, ${ip.local} to ${ip.remote} over ${ip.protocol}`, 'hi');
    }
    icePath = ip;
    panel.values.set('path', ip.path || '');
  }

  setInterval(() => {
    if (!pc) return;
    // the element's own view, which is where the black frame actually lives
    shape();
    settle();
    readStats();
  }, 1000);

  /**
   * Did the element ever present a frame? Latched, not sampled: sampling videoWidth races,
   * and awaiting inside a check lets the harness tear down mid-check. `resize` sets it.
   * See lessons/page-webrtc.md#webrtc-18
   */
  let framePresented = null;
  function notePresented() {
    if (!framePresented && video.videoWidth > 0) {
      framePresented = `${video.videoWidth}x${video.videoHeight}`;
    }
  }
  video.addEventListener('resize', notePresented);
  video.addEventListener('loadeddata', notePresented);
  let lastVideoRtp = null;

  d.on('check', () => {
    // The claim the publisher badge used to carry, read off the socket rather
    // than off a pill, with the detail naming the control a visitor can see.
    /**
     * It reads the state through the call and requires a string, so it can fail.
     * See lessons/page-webrtc.md#webrtc-19
     */
    const said = (stream.badge.textContent || '').trim();
    const state = stream.state();
    if (!LIGHT) d.assert('publisher held by this page',
      held && typeof state === 'string' && state !== 'offline',
      `toggle reads ${JSON.stringify(said)}, state ${state}, socket ${held ? 'held' : 'let go'}`);
    /**
     * One button in the row, the toggle, and nothing in it is a primary. Same check as /llhls/.
     * See lessons/page-webrtc.md#webrtc-20
     */
    const btns = [...d.controls.querySelectorAll('button')];
    d.assert('one control, and it is the stream toggle',
      btns.length === 1 && btns[0] === stream.el && !d.controls.querySelector('.pos-pri'),
      `${btns.length} control(s), classes ${btns.map((b) => b.className || '(none)').join(' ')}`);
    /**
     * Each cell is written at its widest and narrowest and the row measured both times, so a
     * cell shoving its neighbour goes red without `reserve`. Synchronous, nothing painted between.
     * See lessons/page-webrtc.md#webrtc-21
     */
    {
      const row = panel.values.el;
      const was = panel.values.keys().map((k) => [k, panel.values.cell(k).textContent]);
      const write = (o) => { for (const [k, v] of Object.entries(o)) panel.values.set(k, v); };
      /**
       * The row is hidden before a press, so the check writes `rtt` itself in both states and
       * `narrow > 0` is part of the assert, not an assumption.
       * See lessons/page-webrtc.md#webrtc-22
       */
      write({ size: '', fps: '', rtt: '9 ms', path: 'relay' });
      const narrow = row.getBoundingClientRect().width;
      write({ size: '1280x720', fps: '59.9', rtt: '999 ms', path: 'direct' });
      const wide = row.getBoundingClientRect().width;
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('a footer number cannot shove the one beside it',
        narrow > 0 && Math.abs(wide - narrow) < 0.5,
        `${narrow.toFixed(1)} px with the other cells empty against ${wide.toFixed(1)} px at their widest`);
      /**
       * Grades the mechanism, not this run's state: empty every cell and the row must hide, write
       * one back and it must return. Synchronous with the readings put back.
       * See lessons/page-webrtc.md#webrtc-23
       */
      const keys = panel.values.keys();
      for (const k of keys) panel.values.set(k, '');
      const goneWhenEmpty = !panel.values.shown();
      panel.values.set('rtt', '9 ms');
      const backWhenWritten = panel.values.shown();
      for (const [k, v] of was) panel.values.set(k, v);
      d.assert('the footer says nothing until something is coming in',
        goneWhenEmpty && backWhenWritten,
        `with every cell empty the value row was ${goneWhenEmpty ? 'absent' : 'STILL ON SCREEN'}, `
        + `and one cell later it was ${backWhenWritten ? 'back' : 'STILL ABSENT'}, `
        + `with the stream reading ${stream.state()} and ${keys.length} cells on the row`);
    }
    // Everything from here is about a connection, and an ordinary run made none.
    if (!LIGHT) d.assert('peer connection created', !!pc);
    if (pc) {
      d.assert('peer connection connected', pc.connectionState === 'connected', pc.connectionState);
      const tracks = video.srcObject?.getTracks?.() || [];
      d.assert('a track arrived', tracks.length > 0,
        tracks.map((t) => `${t.kind}${t.muted ? ':muted' : ''}:${t.readyState}`).join(' ') || 'none');
      d.assert('a VIDEO track arrived', tracks.some((t) => t.kind === 'video'),
        tracks.filter((t) => t.kind === 'video').length ? 'yes' : 'audio only');
      d.assert('video is advancing', video.currentTime > 0, `${video.currentTime.toFixed(1)}s`);
      // decoding is not rendering: this is the assert the black frame failed
      notePresented();
      d.assert('frames are actually RENDERED', !!framePresented,
        framePresented
          ? framePresented
          : lastVideoRtp
            ? `nothing presented. rtp says ${JSON.stringify(lastVideoRtp)}`
            : 'nothing presented and NO inbound video rtp at all');
      d.assert('element is playing', !video.paused, video.paused ? `paused rs${video.readyState}` : 'playing');
      /**
       * Every stats cell is graded on the number computed and the rendered text. The ranges are
       * plausibility (over 2 s means seconds read as ms or a sum read as a mean), not targets.
       * See lessons/page-webrtc.md#webrtc-24
       */
      const shown = (k) => {
        const cell = [...d.readoutEl.querySelectorAll('.pos-cell')]
          .find((c) => c.querySelector('.pos-k')?.textContent === k);
        return (cell?.querySelector('.pos-v')?.textContent || '').trim();
      };
      const count = (v) => Number.isInteger(v) && v >= 0;
      d.assert('buffer cell: ms a frame waited in the receiver',
        Number.isFinite(stat.buffer) && stat.buffer >= 0 && stat.buffer < 2000 && shown('buffer') !== '',
        `${stat.buffer == null ? 'never read' : stat.buffer.toFixed(1) + ' ms'}, cell ${JSON.stringify(shown('buffer'))}`);
      d.assert('jitter cell: packet jitter in ms',
        Number.isFinite(stat.jitter) && stat.jitter >= 0 && stat.jitter < 1000 && shown('jitter') !== '',
        `${stat.jitter == null ? 'never read' : stat.jitter.toFixed(2) + ' ms'}, cell ${JSON.stringify(shown('jitter'))}`);
      d.assert('lost, dropped and freezes cells are counts',
        count(stat.lost) && count(stat.dropped) && count(stat.freezes)
          && ['lost', 'dropped', 'freezes'].every((k) => shown(k) !== ''),
        `lost ${stat.lost} (nacks ${stat.nack}), dropped ${stat.dropped}, freezes ${stat.freezes}`);
      d.assert('codec cell names what was negotiated',
        /^(H\.264|VP8|VP9|AV1)$/.test(stat.codec) && shown('codec') === stat.codec,
        JSON.stringify(stat.codec));
      const rttText = panel.values.cell('rtt').textContent.trim();
      d.assert('the footer ping is a network round trip in ms',
        Number.isFinite(stat.rtt) && stat.rtt > 0 && stat.rtt < 2000 && / ms$/.test(rttText)
          && panel.values.cell('rtt').previousElementSibling?.textContent === 'ping',
        `${stat.rtt == null ? 'never read' : stat.rtt.toFixed(1) + ' ms'}, footer ${JSON.stringify(panel.values.el.textContent.trim())}`);
      /**
       * The relay was asked for on the press and handed to the connection: not on load, not
       * forgotten, and present in `getConfiguration()`.
       * See lessons/page-webrtc.md#webrtc-25
       */
      const conf = (pc.getConfiguration().iceServers || []).flatMap((s) => [].concat(s.urls));
      d.assert('relay servers were asked for on the press and not on load',
        iceAsks >= 1 && iceLoadAsks() === 0 && !!ice,
        `${iceAsks} ask(s) after the press, ${iceLoadAsks()} before it by resource timing, `
        + (ice ? (ice.relay ? 'a relay came back' : `no relay: ${ice.why}`) : 'nothing came back'));
      d.assert('the peer connection holds what the ask returned',
        !!ice && conf.length > 0 && (!ice.relay || conf.some((u) => /^turns?:/.test(u))),
        `${conf.length} url(s) in the connection, ${conf.filter((u) => /^turns?:/.test(u)).length} of them TURN`);
      const pathText = panel.values.cell('path').textContent.trim();
      d.assert('the footer names the path the media took, beside the ping',
        (icePath?.path === 'direct' || icePath?.path === 'relay') && pathText === icePath.path,
        icePath?.path
          ? `${icePath.path}: local ${icePath.local}, remote ${icePath.remote}, ${icePath.protocol}`
            + `${icePath.relayProtocol ? `, relay over ${icePath.relayProtocol}` : ''}, footer ${JSON.stringify(pathText)}`
          : 'the selected candidate pair could not be read');
    }
    // The picture reports its own damage: every label it had to cut and every
    // link it could not route comes back on `cuts` rather than being ellipsised
    // at a reader who can do nothing about it.
    d.assert('nothing in the picture was cut or refused', dg.cuts.length === 0,
      dg.cuts.map((c) => `${c.id}: ${c.full}`).join(' / ') || 'none');
  });

  /**
   * How it works, including how it stops: the same container and Durable Object as /llhls/,
   * with WHIP up, WHEP down, Opus, no recording, and a stale publisher held about 45 s.
   * See lessons/page-webrtc.md#webrtc-26
   */
  const dg = createDiagram(d.el, {
    caption: 'Retired 2026-10-13: the input and the publisher drawn here are deleted, so a press now says so and stops. '
      + 'It was one POST of an offer and one answer back, and then the frames came straight '
      + 'from Cloudflare over UDP without touching a worker, or through a relay where UDP was blocked. It stopped the same way the '
      + 'low latency HLS page stopped, because both legs were one container counting the '
      + 'sockets that were holding it open.',
    nodes: [
      { id: 'you', label: 'Browser', sub: 'this page', kind: 'here', tech: 'browser',
        children: [
          { id: 'ctl', label: 'socket', sub: 'WebSocket', tech: 'browser',
            note: 'The control at the top of the page opens one socket to the publisher and '
                + 'holds it. Being open is the whole message, and closing it is the only way '
                + 'the far side learns that a viewer has gone.' },
          { id: 'play', label: 'player', sub: 'RTCPeerConnection', tech: 'browser',
            note: 'Offers two receive only transceivers, because Cloudflare refuses a single '
                + 'track offer with a 400 either way round. A track arrives MUTED and the '
                + 'element is only given the stream once media really flows.' },
        ] },
      { id: 'cf', label: 'Cloudflare', sub: 'worker, container, Stream', kind: 'cloud', tech: 'cloudflare',
        children: [
          { id: 'pub', label: 'Pub', sub: 'Durable Object', tech: 'cloudflare',
            note: 'The first socket in starts the publish and the last one out arms a 30 s '
                + 'alarm. The sweep needs two idle turns, so about a minute of nobody '
                + 'watching stops the encoder and a reload costs nothing.' },
          { id: 'ff', label: 'ffmpeg', sub: 'container', tech: 'cloudflare',
            note: 'The same picture the low latency HLS page gets, encoded for this leg '
                + 'instead: libopus rather than AAC, H.264 as baseline 3.1, B-frames off. A '
                + 'dead leg needs about 45 s before Cloudflare takes a new one.' },

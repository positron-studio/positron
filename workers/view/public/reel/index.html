<style>
  .film { width: 100%; aspect-ratio: 16 / 9; background: #000;
          border: 1px solid var(--line); border-radius: 4px; display: block; margin: 0 0 6px; }
  /* Empty looks empty: a <video controls> with no source draws a dead player. The box
     keeps its size so the line below never moves; only the furniture goes.
     See lessons/page-reel.md#reel-5 */
  .film[data-empty="1"] { background: #000; }
  .wireless { width: 100%; max-width: 440px; display: block; margin: 0 0 6px; }
  /* `display: block` beats the UA sheet's `[hidden] { display: none }`, so
     without this the audio player sits under every film showing 0:00 / 0:00.
     The same trap cost the `video` rule an extra line in shell.css. */
  /* the empty slot keeps its height so the line never moves under you */
  .wireless { min-height: 40px; }
  /* The description is bounded (ERR's leads run one to a dozen lines): five lines, more
     where there is room, the rest scrolls inside, so the strip below never moves.
     See lessons/page-reel.md#reel-6 */
  /* One column per medium, newsreel left and radio right, uncoloured and dim: the line
     below carries the colour. A day with only one keeps both columns and says which is missing.
     See lessons/page-reel.md#reel-7 */
  /* The gap above is the shell's rhythm. `margin-bottom`, never the `margin` shorthand,
     whose implied `margin-top: 0` can beat the rhythm on source order.
     See lessons/page-reel.md#reel-8 */
  .picked { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px;
            font: 500 12px/1.6 var(--mono); color: var(--dim); margin-bottom: 4px; }
  /* Two columns on a phone too: the day is one thing with two halves. Words break with
     `overflow-wrap: anywhere`; not `hyphens: auto`, since the page is lang="en" and the
     text Estonian (wrong dictionary). The columns carry lang="et".
     See lessons/page-reel.md#reel-9 */
  .pcol { min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .pcol[data-empty="1"] { display: none; }
  /* the key carries the lane's colour — set from the INK table in the script,
     never typed here, so the label and the marks can never disagree */
  .pkey { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .ptitle { color: var(--dim); font-weight: 600; margin-top: 2px;
            height: calc(2 * 1.6em); overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* Two facts, two boxes: the date and the link sit apart in a row with a gap.
     See lessons/page-reel.md#reel-10 */
  .pmeta { color: var(--dim2); display: flex; flex-wrap: wrap; gap: 0 12px; }
  .pmeta a { color: var(--dim2); text-decoration: underline; text-underline-offset: 2px; }
  /* ONE HEIGHT, not a maximum. A box that shrinks to its contents moves the
     line below it by a different amount for every clip; fixed, nothing under
     it ever moves and a long lead scrolls inside its own box. */
  .plead { color: var(--dim2); margin-top: 6px; height: calc(6 * 1.6em); overflow-y: auto; overscroll-behavior: contain; }
  @media (min-width: 760px) { .plead { height: calc(9 * 1.6em); } }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { STRIP_FOOTER_EMPTY } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { ifSelfcheck, SELFCHECK } from '/shell/selfcheck.mjs';
  import { formatTime } from '/timeline/strip.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  // The deck, lanes, picking, stepping, scrubbing and mark presses live in reel-line.mjs
  // (shared with /history/newsreels/). What plays, and every reach for ERR, stays here.
  // See lessons/page-reel.md#reel-11
  import { createReelLine, YEAR_FROM, YEAR_TO, ARHIIV, INK, iso, sentenceCase } from '/shell/reel-line.mjs';

  /**
   * Every reach for ERR goes through here and is counted, so a check can grade the rule
   * that nothing is asked of a broadcaster until somebody asks to hear something. It counts
   * media handed to an element or hls.js as well as API GETs.
   * See lessons/page-reel.md#reel-12
   */
  let errOpens = 0;
  const reachERR = (url) => { errOpens += 1; return url; };

  // Native HLS only on WebKit, gated on ManagedMediaSource: Chrome answers "maybe" to
  // canPlayType for m3u8 and then never joins the separate audio group.
  // See lessons/page-reel.md#reel-13
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  const d = mount({
    name: 'reel',
    // One sentence, and it names the difference between picking and playing, because only
    // playing asks a public broadcaster for anything.
    // See lessons/page-reel.md#reel-14
    what: "Every 1965 newsreel in ERR's archive is a mark on one line at the day "
      + 'it was broadcast, and stepping or dragging picks a day while a press on '
      + "a mark plays it with the same day's radio where any survived.",
    // Published, not drawn: every cell is already on the page (gutter, title, axis, footer).
    // See lessons/page-reel.md#reel-15
    readout: { picked: '', length: 'min' },
    showReadout: false,
    // No controls beside the page: the line is the control. ‹ and › are transport verbs,
    // declared on the bar (see `extras`).
    // See lessons/page-reel.md#reel-16
    controls: [],
  });
  guard(d);

  // The deck and the line are reel-line.mjs's. A press on a mark plays it; a scrub that comes
  // to rest keeps going if something was going, and otherwise only picks (see `select`).
  // See lessons/page-reel.md#reel-17
  const line = createReelLine({
    onPress: (it) => play(it),
    onLand: (it) => { if (going()) play(it); else select(it); },
  });
  const deck = line.deck;

  // Both slots exist from the start, empty, at the same size, so pressing a film does not
  // push the line down the page.
  // See lessons/page-reel.md#reel-18
  const film = el('video', 'film', null, { playsinline: '' });
  film.dataset.empty = '1';
  // One player, two sources: the newsreels were shot mute and the radio is sound-only, so
  // the hidden audio element follows the picture, which carries the controls. A day with
  // no film keeps a black picture so the transport never disappears.
  // See lessons/page-reel.md#reel-19
  const wireless = el('audio', 'wireless');
  wireless.hidden = true;
  const hasSound = () => !!(wireless.getAttribute('src') || aHls);
  const picked = el('div', 'picked');
  // One column per medium. Each carries its own name, then the date and the
  // link to ERR on their OWN line — a title that runs into its metadata reads
  // as one long string and the title is the part being looked for.

  const column = (key, medium) => {
    const box = el('div', 'pcol');
    box.lang = 'et';                  // the archive's own language, not the page's
    const parts = { key: el('div', 'pkey', key), title: el('div', 'ptitle', ''),
                    meta: el('div', 'pmeta', ''), lead: el('div', 'plead') };
    parts.key.style.color = INK[medium].on;   // the same ink as this lane's marks
    box.append(parts.key, parts.title, parts.meta, parts.lead);
    box.dataset.empty = '1';          // nothing is picked yet
    return Object.assign(parts, { box });
  };
  const colFilm = column('newsreel', 'video');
  const colRadio = column('radio', 'audio');
  picked.append(colFilm.box, colRadio.box);

  // A column with nothing in it is REMOVED, not filled with a sentence saying
  // it is empty. Half of 1965 reaches us as picture only or sound only, so on
  // those days the surviving half simply gets the width.
  const fill = (col, item, kind) => {
    col.box.dataset.empty = item ? '0' : '1';
    col.title.textContent = item ? sentenceCase(item.title) : '';
    col.meta.replaceChildren();
    col.lead.textContent = item?.lead || '';
    col.lead.scrollTop = 0;
    if (!item) return;
    const a = el('a', '', 'at ERRarhiiv');
    a.href = `${ARHIIV}/${kind}/vaata/${item.slug}`;
    a.target = '_blank'; a.rel = 'noreferrer';
    col.meta.append(el('span', '', item.date), a);
  };
  d.el.append(film, wireless);
  // `picked` is appended after the bar and the line — see below. It reads as
  // the caption to what the line is pointing at, which is where a caption goes.

  let hls = null, aHls = null;
  // The day whose media is open, which is not the picked day. `null` means no connection
  // to ERR is held; branches ask this, not `film.paused`.
  // See lessons/page-reel.md#reel-20
  let opened = null;

  // Is something sounding? Not `film.paused`, which reads the same for stopped and never
  // loaded; `opened` is the day whose media this page holds, usually null.
  // See lessons/page-reel.md#reel-21
  const going = () => !!opened && (!film.paused || (hasSound() && !wireless.paused));
  /**
   * Stepping while something plays plays the next day; while nothing plays it only picks
   * (caption, mark, playhead) and fetches nothing. See `select`.
   * See lessons/page-reel.md#reel-22
   */
  const step = (by) => {
    const next = line.next(by);
    if (!next) return;
    if (going()) play(next); else select(next);
  };
  /**
   * The loop drives the film, not only the deck, because the bar's seek would otherwise
   * move a deck of 1965 while the newsreel ran on. A clip is drawn at its date and length,
   * so `position - current.at` is the offset into the film.
   * See lessons/page-reel.md#reel-23
   */
  // The arithmetic is pure and the state is a thin wrapper, so the check can grade the
  // mapping with nothing open and nothing picked.
  // See lessons/page-reel.md#reel-24
  const intoOf = line.intoOf;
  const intoFilm = (pos) => (line.current ? intoOf(line.current, pos) : null);
  const filmSecs = () => (Number.isFinite(film.duration) && film.duration > 0 ? film.duration : null);
  const command = {
    play: () => {
      /**
       * Nothing is picked when the page opens and a load opens nothing. With nothing to start,
       * the year runs (one second of 1965 a second) and the log says how to pick.
       * See lessons/page-reel.md#reel-25
       */
      /**
       * A press with nothing picked starts the first mark, film or radio: a person pressing
       * play may reach ERR. Under `?selfcheck=1` (the harness presses this) it picks and does
       * not open, so no run of the suite holds an ERR stream.
       * See lessons/page-reel.md#reel-26
       */
      const current = line.current;
      if (!current) {
        // First from where the playhead stands, not from the year's start (reel-line.mjs says why).
        // See lessons/page-reel.md#reel-27
        const first = line.firstFromPlayhead();
        if (!first) { d.log('nothing to play yet, the archive list has not arrived'); deck.play(); return; }
        if (SELFCHECK) {
          select(first);
          d.log(`picked the first mark, ${first.date}, and opened nothing: a harness press never reaches ERR`);
          deck.play();
          return;
        }
        play(first);
        return;
      }
      // Picked but not open: THIS is the press that asks ERR for it, and it is
      // a person pressing play on a day they chose.
      if (opened !== current) { play(current); return; }
      // FIRED, NEVER AWAITED. play() waits on a gesture in a real browser and
      // does not reject when it is refused, so awaiting it is a hang.
      film.play().catch(() => {});
      if (hasSound() && wireless.paused) wireless.play().catch(() => {});
      deck.play();
    },
    pause: () => { film.pause(); if (hasSound()) wireless.pause(); deck.pause(); },
    seek: (pos) => {
      const into = intoFilm(pos), dur = filmSecs();
      // Only inside the film that is playing: a loop across days would clamp currentTime to
      // the end and play nothing, so out there the playhead moves on its own.
      // See lessons/page-reel.md#reel-28
      if (into != null && dur != null && into >= -0.25 && into <= dur + 0.25) {
        try { film.currentTime = Math.min(Math.max(0, into), Math.max(0, dur - 0.05)); }
        catch { /* no data yet */ }
      }
      return deck.seek(pos);
    },
  };

  // The picture is the master and the year follows it, so a mark made off the line lands
  // where the film is. `anchorMs` is a function because the anchor is whichever clip is up.
  // No rAF: the L4 timeupdate backstop drives it, as on /replay/.
  // See lessons/page-reel.md#reel-29
  const master = mediaMaster(deck, film, {
    anchorMs: () => (line.current ? line.current.at : YEAR_FROM),
  });

  const bar = createTransportBar(d.el, deck, {
    scrub: false,
    // No clock: a position is a date (zero is 1970), so a clock would read -2611440:00.000;
    // the axis under the bar prints the date.
    // See lessons/page-reel.md#reel-30
    time: false,
    command,
    // ‹ and ›, as on /tapes/. One press is one broadcast day: `step` walks `days`, which folds
    // both lanes onto the day they share, so no lane's weeks are skipped or doubled.
    // See lessons/page-reel.md#reel-31
    extras: [
      { id: 'prev', label: '‹', aria: 'the broadcast day before this one', onClick: () => step(-1) },
      { id: 'next', label: '›', aria: 'the broadcast day after this one', onClick: () => step(+1) },
    ],
    // Nothing is logged about the loop.
    // See lessons/page-reel.md#reel-32
  });
  // The line goes on the page after the bar, the order the glue below reads its anchor in.
  // See lessons/page-reel.md#reel-33
  /**
   * What you point at goes in a footer under the line, not a tooltip over it: a finger has
   * no hover, so a tooltip covers the marks. Three lines, fixed height; the medium is not a
   * line, since the lane's gutter names it. createStripView drops the tooltip with a footer.
   * See lessons/page-reel.md#reel-34
   */
  const view = line.mount(d.el, { footer: { lines: 3 } });

  /**
   * The bar, the line and the footer are one glued surface (the bar is `scrub: false`).
   * Glue `view.surface`, never `view.el`, so the canvas keeps its footer. The anchor is read
   * before the glue, since `createGlue` re-parents its blocks.
   * See lessons/page-reel.md#reel-35
   */
  const afterStrip = view.surface.nextSibling;
  d.el.insertBefore(createGlue(bar.el, view.surface), afterStrip);
  d.el.append(picked);        // under the line, as its caption

  const gutters = line.gutters;

  // ── picking a day, and opening one ────────────────────────────────────────
  /**
   * Picking costs nothing; opening costs ERR (listeners in its audience figures). `select`
   * moves, frames, captions and opens nothing; `play` reaches ERR, only from a mark press,
   * play on a picked day, or a step or scrub while playing. Same rule for every visitor.
   * See lessons/page-reel.md#reel-36
   */
  function select(it, { empty = true } = {}) {
    close(empty);
    d.set('picked', it ? it.date : '');
    d.set('length', null);
    // The playhead, the view, the lit mark and both halves of the day are the
    // line's (reel-line.mjs `pick`); the caption under it is this page's.
    const { picture, sound } = line.pick(it);
    fill(colFilm, picture, 'video');
    fill(colRadio, sound, 'audio');
    return { picture, sound };
  }

  /**
   * Shut what is open. `empty` is false when a new source goes into the same element:
   * `film.load()` re-applies WebKit's gesture restrictions and the newsreel goes silent.
   * See lessons/page-reel.md#reel-37
   */
  function close(empty = true) {
    opened = null;
    film.pause(); wireless.pause();
    if (hls) { hls.destroy(); hls = null; }
    if (aHls) { aHls.destroy(); aHls = null; }
    // And empty it: a destroyed hls instance leaves the element un-paused with a dead source,
    // a phantom second sound for the next play() on everything.
    // See lessons/page-reel.md#reel-38
    wireless.removeAttribute('src'); wireless.load();
    if (!empty) return;
    film.removeAttribute('src'); film.load();
    film.dataset.empty = '1';
    film.controls = false;
  }

  // Streams, stores nothing: one content GET to arhiiv.err.ee for the media url, then the
  // element gets the URL. No segment fetch, no blob URL, nothing to R2 or localStorage.
  // See lessons/page-reel.md#reel-39
  async function play(it) {
    // Bless the element now: a gesture does not survive an `await`, and the play after the fetch
    // was refused and muted. A synchronous play() marks it user-activated even though it rejects.
    // Headless `--autoplay-policy=no-user-gesture-required` hides this.
    // See lessons/page-reel.md#reel-40
    (it.kind === 'audio' ? wireless : film).play().catch(() => {});
    // The same picking every other path does, with the film element left
    // holding its old source because a new one is about to replace it.
    const { picture, sound } = select(it, { empty: false });

    // ERR returns a protocol-relative url (`//vod.err.ee/...`); pin https so a local http page
    // does not play over http and meet mixed content on the deploy.
    // See lessons/page-reel.md#reel-41
    const streamOf = async (item, kind) => {
      try {
        const r = await fetch(reachERR(`${ARHIIV}/api/v1/content/${kind}/${encodeURIComponent(item.slug)}`));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        const raw = (j?.data?.media || j?.media)?.src?.hls;
        if (!raw) { d.log(`${item.slug}: no stream offered`, 'bad'); return null; }
        return raw.startsWith('//') ? `https:${raw}` : raw;
      } catch (e) {
        d.log(`could not ask ERR for ${item.slug}: ${e.message}`, 'bad');
        return null;
      }
    };
    const src = picture ? await streamOf(picture, 'video') : null;
    // ERR would not say where the film is, so there is nothing to show. The box
    // goes black rather than keeping the LAST day's picture under this day's
    // caption, which is the page disagreeing with itself about what is up.
    if (picture && !src) { close(); return; }
    // With a newsreel the radio loads into the hidden element and the picture drives it.
    // With none it goes into the video element itself (black frame), so a sound-only day
    // gets the same controls.
    // See lessons/page-reel.md#reel-42
    const su = sound ? await streamOf(sound, 'audio') : null;
    if (su && picture) {
      if (NATIVE_HLS || !window.Hls || !window.Hls.isSupported()) wireless.src = reachERR(su);
      else { aHls = new window.Hls({ enableWorker: true }); aHls.loadSource(reachERR(su)); aHls.attachMedia(wireless); }
      wireless.muted = false;
      wireless.play().catch(() => {});
      d.log(`paired with the same day's radio: ${sentenceCase(sound.title).slice(0, 40)}`, 'hi');
    } else if (picture) {
      d.log('no radio survives from this day. The newsreel plays silent');
    }

    if (!picture) {
      // Sound only: black picture, real controls, nothing in the hidden
      // element — there is no second stream to keep alongside.
      if (!su) { close(); return; }
      film.dataset.empty = '1';
      film.controls = true;
      film.muted = false;
      if (NATIVE_HLS || !window.Hls || !window.Hls.isSupported()) film.src = reachERR(su);
      else { hls = window.__hls = new window.Hls({ enableWorker: true }); hls.loadSource(reachERR(su)); hls.attachMedia(film); }
      opened = it;                         // a connection to ERR is open from here
      await film.play().catch(() => {});
      d.log(`playing radio ${sound.slug}. It streams from ERR and nothing is stored here`, 'hi');
      return;
    }

    delete film.dataset.empty;
    film.controls = true;
    if (hls) { hls.destroy(); hls = null; }
    if (NATIVE_HLS) {
      film.src = reachERR(src);              // WebKit plays HLS, audio group and all
    } else if (window.Hls && window.Hls.isSupported()) {
      hls = window.__hls = new window.Hls({ enableWorker: true });
      hls.loadSource(reachERR(src));
      hls.attachMedia(film);
      hls.on(window.Hls.Events.ERROR, (_e, data) => {
        if (data.fatal) d.log(`hls fatal ${data.type}/${data.details}`, 'bad');
      });
    } else {
      // No picture is possible here, so the radio that was just attached is
      // shut with it. Holding a stream open for a day the page cannot show is
      // a connection nothing is listening to.
      d.log('this browser cannot play HLS', 'bad');
      close();
      return;
    }
    opened = it;                           // a connection to ERR is open from here

    // With sound: this play comes from a gesture, so not `armVideo`, which mutes. The muted
    // fallback stays for a browser that refuses anyway.
    // See lessons/page-reel.md#reel-43
    film.muted = false;
    try {
      await film.play();
    } catch {
      // Kept, because a browser may still refuse and a muted picture beats no
      // picture — but it should now be rare rather than every single time.
      film.muted = true;
      await film.play().catch(() => {});
      d.log('the browser refused sound. Press play on the picture to hear it', 'bad');
    }
    d.log(`playing ${picture.slug}. It streams from ERR and nothing is stored here`, 'hi');
    // The picture drives the sound: two recordings of different lengths that only share a day,
    // so they start, stop and scrub together, and a longer radio keeps its own place.
    // See lessons/page-reel.md#reel-44
    const follow = () => {
      if (!hasSound()) return;
      if (film.paused) wireless.pause();
      else wireless.play().catch(() => {});
    };
    film.addEventListener('play', () => { if (!deck.playing()) deck.play(); follow(); });
    film.addEventListener('pause', () => { if (deck.playing()) deck.pause(); follow(); });
    film.addEventListener('seeked', () => {
      if (!wireless.src && !aHls) return;
      const t = film.currentTime;
      if (Number.isFinite(wireless.duration) && t <= wireless.duration
          && Math.abs(wireless.currentTime - t) > 0.25) wireless.currentTime = t;
    });
    // The filmikroonika films are silent: 6,766 bytes per 10 s of audio (5.4 kbps, AAC
    // silence) against 123.8 kbps for another 1965 item. Still reported, but not as a fault.
    // See lessons/page-reel.md#reel-45
    setTimeout(() => {
      const a = film.webkitAudioDecodedByteCount;
      if (a === undefined) return;
      const kbps = (a * 8) / 6 / 1000;
      d.log(kbps > 24
        ? `sound is arriving at ${Math.round(kbps)} kbps`
        : `this newsreel is SILENT. Its audio track carries ${kbps.toFixed(1)} kbps, which is `
          + `what silence costs. The newsreels were shot mute.`, 'hi');
    }, 6000);

    film.addEventListener('loadedmetadata', () => {
      if (!Number.isFinite(film.duration)) return;
      it.playedMs = Math.round(film.duration * 1000);
      d.set('length', (it.playedMs / 60000).toFixed(1));
      gutters();
    }, { once: true });
  }

  // The deck and the picture move together when there is a picture. With nothing open the
  // year runs at one second of 1965 a second, and `command.play` logs it.
  // See lessons/page-reel.md#reel-46
  deck.transport.onState((st) => {
    if (st.reason === 'play') {
      if (!opened) return;
      if (film.paused) film.play().catch(() => {});
      // Only if it holds something: play() on a source-less element reads as playing and is silent.
      // See lessons/page-reel.md#reel-47
      if (hasSound() && wireless.paused) wireless.play().catch(() => {});
    } else if (st.reason === 'pause') {
      if (opened && !film.paused) film.pause();
      if (hasSound() && !wireless.paused) wireless.pause();
    }
  });

  // reel-line.mjs: the playhead follows the finger; the nearest broadcast to where it rests
  // arrives at `onLand` once released, and a press on a mark at `onPress`.
  // See lessons/page-reel.md#reel-48

  // ── load the year ─────────────────────────────────────────────────────────
  (async () => {
    // The catalogue, the opening month and the playhead on its first day with
    // both halves are reel-line.mjs's (`ready`), comments and all. Nothing is
    // picked and nothing is fetched from ERR.
    await line.ready;
    const { items, radio, sharedDays, openOn } = line;
    const nearestOf = line.nearestOf;
    d.log(`${items.length} newsreels and ${radio.length} radio programmes, `
      + `${sharedDays} days with both. Nothing is asked of ERR until you play one`);
    // Reachable from the harness, the way `window.__hls` is: a press on the
    // line is the page's only way in, so a check that cannot find the line
    // cannot test anything the page actually does.
    window.__strip = view.strip;

    d.assert('the line is positioned in 1965, not 1970',
      deck.position() >= YEAR_FROM && deck.position() < YEAR_TO, iso(deck.position()));
    d.assert('the whole year is on it', items.length > 250, `${items.length} newsreels`);
    d.assert('every newsreel has a day', items.every((i) => Number.isFinite(i.at)),
      `${items[0].date} to ${items[items.length - 1].date}`);
    d.assert('positions are negative: 1965 is before the epoch',
      items.every((i) => i.at < 0), `${items[0].at}`);
    // The strip detects an absolute domain by `range[0] > 1e12`, and 1965 is negative, so
    // `absolute: true` is what makes the axis read dates. Dropping it fails here.
    // See lessons/page-reel.md#reel-49
    d.assert('the axis reads as dates, not as a count of days from 1970',
      view.strip.state.absolute === true
        && /^\d{4}-\d{2}-\d{2}$/.test(formatTime(deck.position(), 86400000, view.strip.state.absolute)),
      formatTime(deck.position(), 86400000, view.strip.state.absolute));
    // The loop's arithmetic, graded without opening anything: the rest needs a real ERR
    // stream, and a check is not a reason to open one.
    // See lessons/page-reel.md#reel-50
    d.assert('a mark on the line is an offset into the day it sits on',
      Math.abs(intoOf(items[0], items[0].at + 12345) - 12.345) < 1e-9,
      `${intoOf(items[0], items[0].at + 12345).toFixed(3)} s into ${items[0].slug}`);
    d.assert('the picture is the transport master, so the line follows it', !!master);
    // Where a scrub lands, graded without opening anything. Both directions, since one alone
    // passes for a function that always answers the same end of the year.
    // See lessons/page-reel.md#reel-51
    const after = nearestOf(items[0].at + 3600000, items);
    const before = nearestOf(items[1].at - 3600000, items);
    d.assert('a scrub lands on the broadcast nearest where it stopped',
      after === items[0] && before === items[1], `${after?.date} then ${before?.date}`);
    /**
     * The rule as a connection count: every URL for ERR goes through `reachERR`. The first
     * check uses data in hand and runs for everybody.
     * See lessons/page-reel.md#reel-52
     */
    d.assert('a visit opens nothing at ERR', errOpens === 0,
      `${errOpens} reaches since the page loaded`);
    /**
     * The second presses a control, so it is behind the gate; the rule itself is never gated.
     * `select(null)` puts the page back: nothing picked, no connection held.
     * See lessons/page-reel.md#reel-53
     */
    ifSelfcheck(() => {
      const reachesBefore = errOpens;
      step(+1); step(-1);
      const reaches = errOpens - reachesBefore;
      select(null);
      d.assert('stepping while nothing plays opens nothing at ERR',
        reaches === 0, `${reaches} reaches for ERR across two steps`);
    });

    /**
     * The footer says what the pointer is on and says so when it is on nothing. Driven through
     * the strip's own pointer path, at the opening day's mark (newsreels days apart, 6 px
     * hit tolerance). Behind the gate, since a moved pointer is visible.
     * See lessons/page-reel.md#reel-54
     */
    ifSelfcheck(() => {
      // Lay the lanes out NOW rather than on the next frame: `y` is written
      // during a draw, and a check that read it before the first one would be
      // aiming at a lane with no position yet.
      view.strip.draw();
      const S = view.strip.state;
      const r = view.strip.canvas.getBoundingClientRect();
      const lane = view.strip.lanes().find((l) => l.id === 'ak');
      const dur = line.lengthOf(openOn);
      const ready = !!lane && Number.isFinite(lane.y) && r.width > 0 && S.width > 0;
      // the same arithmetic `localX`/`localY` do, run backwards
      const cx = ready ? r.left + (view.strip.timeToX(openOn.at + dur / 2) + S.gutterPx) * (r.width / S.width) : 0;
      const cy = ready ? r.top + (lane.y + lane.height / 2) * (r.height / S.height) : 0;
      view.strip.canvas.dispatchEvent(new PointerEvent('pointermove',
        { clientX: cx, clientY: cy, bubbles: true }));
      const on = view.footer.says();
      const tall = view.footer.el.offsetHeight;
      d.assert('pointing at a mark says what it is, under the line rather than over it',
        ready && on[0] === sentenceCase(openOn.title).slice(0, 46) && on[1] === openOn.date,
        ready ? on.filter(Boolean).join(', ') : 'the strip has not been measured yet');
      view.strip.canvas.dispatchEvent(new PointerEvent('pointerleave',
        { clientX: r.left - 10, clientY: r.top - 10, bubbles: true }));
      const off = view.footer.says();
      d.assert('and with nothing under it, it says so and keeps its height',
        off[0] === STRIP_FOOTER_EMPTY && !off[1] && view.footer.el.offsetHeight === tall,
        `${off[0]}, ${view.footer.el.offsetHeight} px of ${tall}`);
    });
    d.assert('nothing is stored: no media in the fixture',
      !JSON.stringify(items[0]).match(/https?:|\.m3u8|\.mp4/), 'catalogue metadata only');
    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>

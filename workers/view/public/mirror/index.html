<style>
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  /* The line a pane shows while it has no picture in it. It goes INSIDE the
     panel's own picture area, which the kit already makes `position:
     relative`, so it covers the picture and never the row of facts under it. */
  /* Balanced wrapping, the shell's rule for short centred prose (argument at
     lessons/css-shell.md#pos-lr-say): the break lands in the same place at every
     pane width, 260.1 and 267.3 px at 336 and 390 px.
     See lessons/page-mirror.md#mirror-1 */
  .none {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    text-wrap: balance;
    font: 400 12px/1.7 var(--mono); color: var(--dim); padding: 18px;
  }
  /* The sentence and the one button that asks the board, stacked and centred
     in the empty right pane. Twice the control gap, so the button reads as the
     answer to the sentence rather than as a word of it. */
  .none-in {
    display: grid; justify-items: center; gap: calc(2 * var(--ctl-gap));
  }
  .none-in [hidden] { display: none; }
  /* A row of cells, each held at its widest reading so a changing digit moves nothing.
     Scrolls instead of widening the page: `overflow-x` needs `min-width: 0` here.
     Not selectable: it sits a thumb from the fullscreen button and is a control strip.
     See lessons/page-mirror.md#mirror-2 */
  /* The four controls that change both pictures, two by two: LOOK MIRRORS over
     GRAIN HUE. Widths and the phone layout are shell.css's rule for kit rows.
     `flex-basis: 100%` puts the group on its own line so the row above has air under it.
     See lessons/page-mirror.md#mirror-3 */
  .knobs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px;
    align-items: center; min-width: 0; flex-basis: 100%;
    /* 14 px on top of `.pos-controls`' 8 px gap makes 22, the `.pos-body` rhythm
       between two blocks, so the session buttons read apart from the controls.
       See lessons/page-mirror.md#mirror-4 */
    margin-top: 14px;
  }
  /* One label column so the four segments start at the same x. A px floor, not `ch`:
     `.pos-choice-l` and `.pos-pick-l` are different type. 48 px is MIRRORS, the widest,
     and the page's check compares the four left edges. Wide only; under 560 px labels stack.
     See lessons/page-mirror.md#mirror-5 */
  .knobs .pos-choice-l, .knobs .pos-pick-l { min-width: 48px; }
  @media (max-width: 560px) {
    .knobs { grid-template-columns: 1fr; gap: 12px; width: 100%; }
    .knobs .pos-choice-l, .knobs .pos-pick-l { min-width: 0; }
  }
  .facts {
    display: flex; align-items: baseline; gap: 14px; min-width: 0;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .facts::-webkit-scrollbar { display: none; }
  .fact { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  /* The same key style as `.pos-k` and the kit's control labels.
     See lessons/page-mirror.md#mirror-6 */
  .fact-k {
    font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim2);
  }
  /* `tabular-nums` is what makes the reserved width exact: without it a 1 is
     narrower than a 0 and the number still shifts inside its own box. */
  .fact-v {
    font: 400 11px/1.4 var(--mono); color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { XR_MODE, canEnter, reasonFor, onXrCaps } from '/shell/xr-caps.mjs';
  import { createPresence } from '/shell/presence.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  // Two panel components: `video-panel.mjs` draws the DOM panes on the flat page;
  // `panel.mjs` draws a panel into a canvas, which is what a headset panel is
  // (a framebuffer holds no text). Each does a job the other cannot.
  // See lessons/page-mirror.md#mirror-7
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createPanel, createPanelFooter, FOOT } from '/shell/panel.mjs';
  import { createXRPanels, beacon, facing, barOf, grabOffset, heldAt, PLACE } from '/shell/xr-panel.mjs';
  import { pickQuad } from '/shell/xr-pick.mjs';
  import { createBoardVideo } from '/shell/board-video.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, printLink } from '/shell/bay.mjs';
  import { createRegistry, boardGraph, boardPort, BOARD_SITE } from '/shell/graph-registry.mjs';
  import { createBayNode, roomFor, randomSite } from '/shell/bay-node.mjs';
  import { createOpeners } from '/shell/openers.mjs';
  import { createLinkBadge, linkStateOf, LINK_STALL_MS } from '/shell/link-badge.mjs';

  /**
   * The room and socket are `bay-node.mjs`'s and nothing joins on load: `roomFor` gives
   * `?room=`, `studio-1` for a person, a private room under `?selfcheck=1`. This tab is
   * site `web-<four>`: shader `program` out, right pane `video` in (see `boardGraph`).
   * See lessons/page-mirror.md#mirror-8
   */
  const ROOM = roomFor({ slug: 'mirror' });
  const GPU_PROGRAM = boardPort('shader', 'program-in'), GPU_VIDEO = boardPort('shader', 'video-out');
  const SITE = randomSite('web');
  const PROGRAM_PORT = `${SITE}:webgl:program`;
  const SCREEN_PORT = `${SITE}:screen:video`;
  /**
   * The left pane is in the graph too: `webgl:video` out to `left:video` in, both on
   * this tab, so the bay gives the link the `page` transport and opens nothing. A node
   * of its own, not a second port on `screen` (plans/plan-site-names.md §4c, §4e).
   * See lessons/page-mirror.md#mirror-9
   */
  const WEBGL_VIDEO_PORT = `${SITE}:webgl:video`;
  const LEFT_PORT = `${SITE}:left:video`;
  const SELF = {
    v: 1, site: SITE, place: 'browser',
    nodes: [
      { id: `${SITE}:webgl`, kind: 'engine', label: 'WebGL2', place: 'browser' },
      { id: `${SITE}:screen`, kind: 'screen', label: 'right picture', place: 'browser' },
      { id: `${SITE}:left`, kind: 'screen', label: 'left picture', place: 'browser' },
    ],
    ports: [
      { id: PROGRAM_PORT, label: 'shader', dir: 'out', medium: 'program', shape: { language: 'glsl' } },
      { id: WEBGL_VIDEO_PORT, label: 'own render', dir: 'out', medium: 'video' },
      { id: SCREEN_PORT, label: 'right picture', dir: 'in', medium: 'video' },
      { id: LEFT_PORT, label: 'left picture', dir: 'in', medium: 'video' },
    ],
  };
  const W = 640, H = 360;

  const d = mount({
    name: 'mirror',
    // One sentence, the index's own line verbatim; the diagram carries the machinery.
    // See lessons/page-mirror.md#mirror-10
    what: 'The same shader drawn by your browser and by a Raspberry Pi, side by side.',
    // No shell readout: every number belongs to one picture and goes in that pane's
    // footer. The machine surface is `__demo.panes`, set below.
    // See lessons/page-mirror.md#mirror-11
    readout: {},
    /**
     * Filled by this page and still `.pos-controls`: both harnesses press
     * `.pos-controls button`, so a control outside this row is never exercised.
     * `mount()` hides an empty row; it is shown again once filled below.
     * See lessons/page-mirror.md#mirror-12
     */
    controls: [],
  });
  guard(d);
  d.controls.hidden = false;

  /**
   * The VR and AR session controls are one kit group: `xr-caps.mjs` disables a control
   * with the reason in words where WebXR is absent. Id `vr`, as on the other XR pages.
   * Prepended: the harness presses in DOM order and `settleMs` lands on control 0.
   * See lessons/page-mirror.md#mirror-13
   */
  const xrGroup = createButtonGroup({
    buttons: [
      { id: 'vr', label: 'Run in VR' },
      { id: 'ar', label: 'Run in AR' },
    ],
    // Through `d.run`, so the handlers stay where handlers live: `d.on('vr')`
    // and `d.on('ar')` below are registered the way every other control on
    // every other page here is.
    onPress: (id) => d.run(id),
  });
  d.controls.prepend(xrGroup.el);
  // Subscribed, not read once: `onXrCaps` fires now and on every change, and
  // `canEnter` counts `asking` as yes, so nothing is greyed out on a guess.
  // See lessons/page-mirror.md#mirror-14
  onXrCaps((c) => {
    xrGroup.enable('vr', canEnter(c.vr), reasonFor(c.vr, 'vr'));
    xrGroup.enable('ar', canEnter(c.ar), reasonFor(c.ar, 'ar'));
  });

  /**
   * Two cells a footer, the same two under both panes: what drew it and how fast.
   * Link rate, lost frames and the clock go to the log and beacon (`sayLinkRate`, `sayLinkLost`).
   * The third number is the held width in characters; every cell is drawn even when empty.
   * See lessons/page-mirror.md#mirror-15
   */
  const FIELDS = {
    here: [['picture', 'picture', 0], ['fps', 'fps', 5]],
    box: [['picture', 'picture', 0], ['fps', 'fps', 5]],
  };
  const FMT = {
    picture: (v) => String(v),
    fps: (v) => v.toFixed(1),
  };
  // The machine copy, written from the same values in the same call. Built here because
  // `relabel` writes into it while the panes are being made.
  // See lessons/page-mirror.md#mirror-16
  window.__demo.panes = { here: {}, box: {} };

  const panes = el('div', 'panes');
  /**
   * One pane: a picture, a row of facts under it, and the way to fill the screen with it.
   * `fullMode: 'footer'` keeps the facts on screen when full, its fullscreen button is
   * the way out without Escape, and `under()` carries the page's controls beneath it.
   * See lessons/page-mirror.md#mirror-17
   */
  const mk = (which) => {
    const c = el('canvas');
    c.width = W; c.height = H;
    const factsEl = el('span', 'facts');
    const facts = new Map();
    for (const [key, label, reserve] of FIELDS[which]) {
      const cell = el('span', 'fact');
      const val = el('span', 'fact-v', '');
      if (reserve) val.style.minWidth = `${reserve}ch`;
      cell.append(el('span', 'fact-k', label), val);
      factsEl.append(cell);
      facts.set(key, val);
    }
    /**
     * Only the far pane gets a presence dot: whether the Pi answers is worth knowing,
     * and a dot for this browser could only ever say online.
     * See lessons/page-mirror.md#mirror-18
     */
    const pres = which === 'box'
      ? createPresence({ of: 'the Raspberry Pi', mode: 'dot', state: 'unknown' })
      : null;
    const panel = createVideoPanel({
      media: c,
      left: pres ? pres.el : false,
      centre: factsEl,
      fullMode: 'footer',
      // Asks which pane is full instead of trusting the event: `fullscreenchange` is a
      // document event both panels hear, so the last to speak would hand the row back out.
      // See lessons/page-mirror.md#mirror-19
      onFull: () => handControls(),
    });
    panes.append(panel.el);
    return { c, panel, facts, pres };
  };
  // The chip names what drew the picture, not which side it is on; until each end
  // reports, it says what it can. No articles: it is a name slot.
  // See lessons/page-mirror.md#mirror-20
  const WHERE = { here: 'your browser', box: 'Raspberry Pi' };
  const chip = { here: null, box: null };
  /**
   * Names the chip after "Renderer:", not before the first comma, for both ends.
   * Capped at 24 characters, which fits every string either end has reported.
   * See lessons/page-mirror.md#mirror-21
   */
  const shortChip = (s) => {
    const m = String(s).match(/Renderer:\s*([^,)]+)/)?.[1]
      ?? String(s).replace(/^ANGLE \(|\)$/g, '');
    return m.trim().slice(0, 24);
  };
  // Declared here because `relabel` reads it while the panes are built; a `let`
  // further down is in the temporal dead zone and throws at module scope.
  // See lessons/page-mirror.md#mirror-22
  let lockedFrame = null, lockedAt = 0;

  /** Write one pane's cells out of the machine copy, so the two cannot differ. */
  function paintFacts(which) {
    const pane = which === 'here' ? local : far;
    const v = window.__demo.panes[which];
    for (const [key] of FIELDS[which]) {
      const val = pane.facts.get(key);
      const has = v[key] !== null && v[key] !== undefined && v[key] !== ''
        && !(typeof v[key] === 'number' && !Number.isFinite(v[key]));
      val.textContent = has ? FMT[key](v[key]) : '';
    }
  }

  /**
   * The name and the clock are two cells. The chip falls back to `WHERE`'s string;
   * which side is meant is said by which pane it is.
   * See lessons/page-mirror.md#mirror-23
   */
  function relabel(which) {
    window.__demo.panes[which].picture = chip[which] || WHERE[which];
    paintFacts(which);
  }
  const local = mk('here');
  const far = mk('box');
  relabel('here'); relabel('box');
  /**
   * The far dot follows decoded frames, not the socket: the socket opens in about
   * 200 ms while the encoder may be off. 30 missed frames at 30 fps is one second.
   * It starts at the press; before that it stays `unknown`.
   * See lessons/page-mirror.md#mirror-24
   */
  const followFar = () => far.pres.follow({
    everyMs: 1000 / 30, misses: 30, since: Date.now(),
    why: 'nothing has answered in this room yet',
  });
  /**
   * The press that asks the board lives in the pane it fills, outside `.pos-controls`,
   * so harness presses never join a room or shift other controls.
   * See lessons/page-mirror.md#mirror-25
   */
  const farNone = el('div', 'none');
  const farSay = el('span', 'none-say', 'The Raspberry Pi is asked nothing until you press.');
  const askRow = createButtonGroup({ buttons: [
    { id: 'board', label: 'Show the board', onPress: () => askTheBoard() },
  ] });
  const farWrap = el('div', 'none-in');
  farWrap.append(farSay, askRow.el);
  farNone.append(farWrap);
  far.panel.stage.append(farNone);
  /** What the empty right pane says, keeping the button in it until the press. */
  function farWaits(words) {
    farSay.textContent = words;
    askRow.el.hidden = node.joining();
    if (!farNone.isConnected) far.panel.stage.append(farNone);
  }
  /**
   * A link badge on the board's picture only: STARTING, RECEIVING or STALLED, counted
   * from frames decoded here. `/patchbay/` draws links. The tag slot is hidden with
   * the badge because its pill is not `:empty` while a hidden child is in it.
   * See lessons/page-mirror.md#mirror-26
   */
  const badge = createLinkBadge({
    count: () => (bv.isOpen() ? bv.decoded() : null),
    onChange: (st) => { far.panel.slots.tag.hidden = st === 'unknown'; },
  });
  far.panel.slots.tag.append(badge.el);
  far.panel.slots.tag.hidden = true;
  d.stack.add(panes);

  /**
   * One control group, all four rows from the kit (`createPicker` and `choice.mjs`).
   * Phone width needs no CSS of this page's: shell.css already lays choices out under 560 px.
   * See lessons/page-mirror.md#mirror-27
   */
  const knobRow = el('div', 'knobs');

  /**
   * Three choices that drive both panes: each press sets the local uniform and sends
   * `video.params` to the box, so the two pictures stay the same shader.
   * See lessons/page-mirror.md#mirror-28
   */
  // Ranges wide enough that the ends are unmistakable; the middle of each is the
  // value the renderer ships with.
  // See lessons/page-mirror.md#mirror-29
  const KNOBS = {
    // 2 is a single fold, almost a mirror down the middle. 24 is a doily.
    mirrors: { label: 'mirrors', steps: [['2', 2], ['8', 8], ['24', 24]], at: 1 },
    // The noise frequency, which decides whether the shapes are continents or
    // filigree. An eightfold span, because a doubling is not visible here.
    grain:   { label: 'grain',   steps: [['coarse', 1.2], ['mid', 4], ['fine', 16]], at: 1 },
    // How far apart the three colour channels are: three cosines offset by a third of a turn.
    // Near 0 a duotone, 1 the rainbow, 1.5 splits into magenta against green. Past
    // 1 the offsets wrap and give no more spread.
    // See lessons/page-mirror.md#mirror-30
    hue:     { label: 'hue',     steps: [['close', 0.12], ['full', 1], ['split', 1.5]], at: 1 },
  };

  // The whole group goes in `.pos-controls`: both harnesses press only
  // `.pos-controls button`. A picker, not "next", so any look can be revisited directly.
  // See lessons/page-mirror.md#mirror-31
  {
    // `createPicker` shows the current name inside the row and carries the die.
    // See lessons/page-mirror.md#mirror-32
    const jump = (to) => {
      lookAt_ = (to + LOOKS.length) % LOOKS.length;
      const { name, body } = LOOKS[lookAt_];
      look.show(name, lookAt_);
      const okHere = window.__applyShader(body);
      d.log(okHere ? `“${name}” is fading in here` : `“${name}” was refused here`);
      // `joined` is the press having happened: before it there is no socket.
      const open = node.joined();
      let sent = false;
      if (open) { try { sent = send({ type: 'video.shader', body }); } catch { sent = false; } }
      d.assert('the new look compiled in this browser', okHere, name);
      d.assert('and the same body went to the box, when there is one',
        sent || !open, open ? (sent ? 'sent' : 'the socket refused it') : 'no board in the room, so nothing to send');
    };
    const look = createPicker({
      label: 'LOOK',
      what: 'look',
      prev: () => jump(lookAt_ - 1),
      next: () => jump(lookAt_ + 1),
      random: () => jump(Math.floor(Math.random() * LOOKS.length)),
      onPick: (i) => jump(i),
    });
    // The list is filled where `LOOKS` exists: the shaders are declared below, and reading
    // `LOOKS[0]` here is a temporal dead zone at module scope.
    // See lessons/page-mirror.md#mirror-33
    knobRow.append(look.el);
    window.__lookPicker = look;
  }

  for (const [key, k] of Object.entries(KNOBS)) {
    k.control = createChoice({
      // Typed here rather than in `KNOBS`, because the same word is the LOG's
      // name for this control and a log line does not shout.
      label: k.label.toUpperCase(),
      options: k.steps,
      at: k.at,
      // The component owns which option is armed, so `choose` no longer writes
      // `aria-pressed` anywhere: one state, one owner.
      onPick: (value, name, i) => choose(key, i),
    });
    knobRow.append(k.control.el);
  }
  d.controls.append(knobRow);

  /**
   * The controls follow the picture into full screen as the same row moved, not a copy:
   * the panel takes it, remembers its home and returns it on the way out. One panel at
   * a time: the pane that is not full hands it back first.
   * See lessons/page-mirror.md#mirror-34
   */
  let wasFull = false;
  function handControls() {
    const full = [local, far].find((pane) => pane.panel.isFull()) || null;
    for (const pane of [local, far]) {
      if (!full || pane.panel !== full.panel) pane.panel.under(null);
    }
    // Checked first: `under()` detaches and reattaches, and every fullscreen change reaches both panels.
    // See lessons/page-mirror.md#mirror-35
    if (full && full.panel.under() !== knobRow) full.panel.under(knobRow);
    if (!!full !== wasFull) {
      wasFull = !!full;
      d.log(wasFull ? 'filling the screen with one pane, and the controls came with it'
                    : 'back to the page');
    }
  }

  /**
   * One choice pressed, on both pictures. The socket may be shut: the send is guarded
   * so a click never throws, and the local picture changes either way.
   * See lessons/page-mirror.md#mirror-36
   */
  function choose(key, idx) {
    const k = KNOBS[key];
    k.at = idx;
    const value = k.steps[idx][1];
    // The local picture changes on the next frame; the box changes when the
    // message lands, which is a hop away. They converge, and the panes being
    // briefly different IS the latency, the same thing the lock makes visible.
    P[key] = value;
    try { send({ type: 'video.params', [key]: value }); }
    catch { /* no board in the room, so nothing to send */ }
    d.log(`${k.label} ${k.steps[idx][0]}`, 'hi');
  }
  // The live values, one place, read by the render loop and sent to the box.
  const P = Object.fromEntries(Object.entries(KNOBS).map(([k, v]) => [k, v.steps[v.at][1]]));
  // Exposed so a harness can sweep the ranges without pressing nine buttons.
  window.__P = P;

  /**
   * Each pane's own numbers, written through the machine copy so the two cannot come
   * apart. `FIELDS`, `FMT` and `paintFacts` are up with the panes.
   * See lessons/page-mirror.md#mirror-37
   */
  function stat(which, fields) {
    Object.assign(window.__demo.panes[which], fields);
    paintFacts(which);
  }

  // The panels that hang in a headset: two, one per picture. The left is rendered in the
  // session's own GL context by `liveMirror` (a page canvas is a different context); its
  // cost is `liveWhereCost` on `__demo.xr`. Numbers come as a separate strip texture.
  // See lessons/page-mirror.md#mirror-38
  const PANEL_W = 640, PANEL_H = 400;          // css units; the canvas is 2x this
  const FOOT_FRAC = FOOT / PANEL_H;            // the strip's share of the quad
  const panelHere = createPanel({ width: PANEL_W, height: PANEL_H, title: 'here' });
  const panelBox = createPanel({ width: PANEL_W, height: PANEL_H, title: 'the box' });
  const footHere = createPanelFooter({ width: PANEL_W });

  // Render size derived: the 1.28 m panel at 1.6 m covers about 770 px of a Quest 3 eye,
  // and the shader is ALU bound (about 50 Mpix/s, plan-visuals §3.4), so 960 wide, height
  // from the picture area's aspect minus the footer strip, never stretched.
  // See lessons/page-mirror.md#mirror-39
  const LIVE_W = 960;
  const LIVE_H = Math.round(LIVE_W * (PANEL_H - FOOT) / PANEL_W);
  // Drawn only while a session runs (or for a quarter second when the checks look):
  // copying the picture each frame would lower the frame rate this page reports.
  // See lessons/page-mirror.md#mirror-40
  let wantPanel = false, panelDrawn = 0;
  // Assigned inside the renderer block below, declared up here so nothing reads a
  // `let` before its line runs (a temporal dead zone throw is a blank page).
  // See lessons/page-mirror.md#mirror-41
  let mirrorStep = null, flatRaf = 0, xr = null;
  let startFlat = () => {}, stopFlat = () => {};

      // See lessons/page-mirror.md#mirror-46

    // See lessons/page-mirror.md#mirror-47

        footer: hereFoot,

   * See lessons/page-mirror.md#mirror-49

      // A dark look is a dim room and only a white picture reaches the top.

  // radius near that spends the falloff before the light reaches anything.
  // See lessons/page-mirror.md#mirror-52
  const glowNow = () => (glowAmp > 0 ? { col: glowCol, amp: glowAmp, radius: 3.0 } : null);


  // The picture, here: the shader of rig/vis/v3dpipe.c, ported. Only the header differs
  // (GLES 3.1 `310 es` on the board, WebGL2 `300 es` here). `uT` is a frame counter,
  // driven as i/30.0 as in the C, so both panes make the same motion.
  // See lessons/page-mirror.md#mirror-53
  const VS = `#version 300 es
    void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);

  // The body is shared, the header is not: the body travels over the socket and each

  // See lessons/page-mirror.md#mirror-54
  const GLSL300 = '#version 300 es\n';
  const FS_BODY = `
    precision highp float;
    uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
    uniform float uSeg; uniform float uFb; uniform float uScale; uniform float uWarp; uniform float uHue;
    out vec4 o;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h(i), h(i + vec2(1,0)), f.x), mix(h(i + vec2(0,1)), h(i + vec2(1,1)), f.x), f.y); }
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float a = atan(uv.y, uv.x), r = length(uv), seg = 6.2831853 / uSeg;
      a = abs(mod(a + 0.5 * seg, seg) - 0.5 * seg);
      vec2 k = vec2(cos(a), sin(a)) * r;
      float w = n(k * uScale + uT * 0.3) + 0.5 * n(k * uScale * 2.0 - uT * 0.2) + 0.25 * n(k * uScale * 4.0 + uT * 0.5);
      vec2 dd = k + uWarp * vec2(cos(w * 6.2831), sin(w * 6.2831));
      vec3 c = 0.5 + 0.5 * cos(6.2831 * (w + vec3(0.0, 0.33, 0.67) * uHue) + uT);
      vec3 fb = texture(uPrev, dd * 0.9 + 0.5).rgb;

  /**
   * Other looks, on the same uniforms, so the knobs keep their meaning whichever runs.
   * Deliberately short: the point is replacing a picture while it is watched, on two
   * machines at once.
   * See lessons/page-mirror.md#mirror-55
   */
  const HEAD = `
    precision highp float;
    uniform float uT; uniform vec2 uRes; uniform sampler2D uPrev;
    uniform float uSeg; uniform float uFb; uniform float uScale; uniform float uWarp; uniform float uHue;
    out vec4 o;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }

    { name: 'rings', body: HEAD + `
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
        vec2 k = fold(uv);
        float r = length(k);
        float band = sin(r*uScale*6.0 - uT*1.4 + n(k*2.0)*6.2831*uWarp*4.0);

    { name: 'weave', body: HEAD + `

  /**

        // and a fade reads as a dissolve.
        // See lessons/page-mirror.md#mirror-60
        const k = Math.min(1, (performance.now() - fadeFrom) / FADE_MS);
        paint(cur, tmpA.f, tNow, Pv, KW, KH);
        paint(incoming, tmpB.f, tNow, Pv, KW, KH);

        g.viewport(0, 0, KW, KH);

        g.activeTexture(g.TEXTURE0); g.bindTexture(g.TEXTURE_2D, tmpA.t); g.uniform1i(M.uA, 0);

      apply, step, probe,
      get tex() { return last?.t ?? null; },
      get fbo() { return last?.f ?? null; },

  };

  if (!gl) {
    local.panel.stage.append(el('div', 'none', 'this browser gave no WebGL2 context, so the left pane cannot be drawn here'));
    d.log('there is no WebGL2 context here, so the left pane cannot be drawn on this browser', 'bad');

    // demo/verify-gl.mjs checks against it. Parse and cap are in `shortChip`.
    // See lessons/page-mirror.md#mirror-62

    liveBody = FS_BODY;

     * renderer may not exist yet and must start on the chosen look.
     * See lessons/page-mirror.md#mirror-63

      }
      liveBody = body;
      if (liveK) {
        try { liveK.apply(body); }
        catch (e) {

          // rather than left to look like a frozen panel.
          d.log(`the headset's own copy refused the new look. ${String(e.message).slice(0, 60)}`, 'warn');
          beacon(`FAIL live panel: the new look would not compile in the session's context, ${e.message}`);

      return true;

    // false` the default one is not readable after the frame ends.
    // See lessons/page-mirror.md#mirror-64
    window.__lastFbo = null;

    // See lessons/page-mirror.md#mirror-65

      // See lessons/page-mirror.md#mirror-67

        // See lessons/page-mirror.md#mirror-70

<title>Sample drums</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createDrop } from '/shell/drop.mjs';
  import { createSampleLoader } from '/shell/sample-loader.mjs';
  import { createDrumMachine } from '/drums/drum-machine.mjs';
  import { sampleRows, rowNames, createSampleBank, MAX_ROWS } from '/drums/sample-voices.mjs';

  // /drums/machine/ with rows playing samples (`../sample-voices.mjs`): a dropped pack, zip or WAVs
  // becomes one row each, up to 64, drawn by dragging as on /tom/. Above eight rows the patchbay
  // draws one `web:samples` box. Nothing opens on a visit; dropped files stay in the tab.
  // See lessons/page-drums.md#drums-35
  const d = mount({ name: 'Sample drums', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('drums/samples');

  const bank = createSampleBank({ log: d.log });
  /** The rows now: the file each one plays and the name it shows. */
  let files = [], names = [];
  const VOICES = sampleRows({
    nameOf: (r) => names[r] ?? null,
    fileOf: (r) => files[r] ?? null,
    bufOf: (r) => { const s = bank.loaded()[r]; return s && s.name === files[r] ? s.buf : null; },
  });

  let m = null;
  /** A kit: its first 64 samples become the rows. */
  function offer(list, { fresh = false } = {}) {
    if (list.length > MAX_ROWS) d.log(`${list.length} samples, the first ${MAX_ROWS} are rows and ${list.length - MAX_ROWS} are left out`, 'warn');
    files = list.slice(0, MAX_ROWS).map((x) => x.name);
    names = rowNames(files);
    m?.api.setShape({ rows: Math.max(1, files.length), steps: 16 }, { fresh });
    m?.api.grid.redraw();
    m?.api.refresh();
  }

  // No default kit: the page opens on the SAMPLES box alone, and the grid, its transport and the
  // patchbay appear when a kit is loaded.
  // See lessons/page-drums.md#drums-36

  m = createDrumMachine(d, {
    voices: VOICES,
    shape: { rows: 1, steps: 16 },
    start: false,
    // The level the four drums had, kept for four; more rows sum hotter.
    gain: (rows) => (rows > 9 ? 0.5 : rows > 4 ? 0.7 : 1),
    group: { over: 8, node: 'samples', label: (n) => `${n} samples, SuperCollider` },
    onWake: async (e) => { const got = await bank.wake(e); if (got.length !== files.length) offer(got, { fresh: true }); },
  });

  // ── the way in ───────────────────────────────────────────────────────────
  const loader = createSampleLoader({ say: (s, k) => drop.say(s, k), log: d.log });
  const drop = createDrop({
    accept: ['.circuitpack', '.zip', '.syx', '.wav'],
    title: 'SAMPLES',
    label: 'Open files',
    beside: 'or drop a pack, a zip of WAVs or WAVs anywhere on this page',
    empty: '',
    hint: 'drop a pack anywhere on this page',
    says: (s, k) => d.log(s, k),
    onOpen: async (picked) => {
      const got = await loader.openFiles(picked);
      if (!got) return false;
      const ok = got.filter((g) => g.wave?.ok !== false && g.wave?.frames !== 0);
      if (ok.length < got.length) d.log(`${got.length - ok.length} sample(s) did not read and are not rows`, 'warn');
      offer(ok, { fresh: true });
      if (!shown) { d.stack.add(m.surface, m.patchbay); shown = true; }
      const on = await bank.use(ok.slice(0, MAX_ROWS));
      // A sample the engine could not take is not a row either.
      if (on && bank.loaded().length !== files.length) offer(bank.loaded(), { fresh: true });
      dropped++;
      return true;
    },
  });
  let dropped = 0, shown = false;

  // The way in first, then the grid and the patchbay.
  d.stack.add(drop.el);
  window.__rhythm = m.api;
  window.__samples = { bank, names: () => names, files: () => files, dropped: () => dropped, open: (f) => drop.open(f) };
  d.ready();
</script>

<!doctype html>

<title>Camera drums</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* As /video/shader/: the start button on its own row at the left, the
     camera on the left half and its pixels on the right, stacked on a phone. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-top > .pos-bgroup { flex: none; width: auto; }
  .cc-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 560px) { .cc-pair { grid-template-columns: minmax(0, 1fr); } }
  .cc-pair canvas { display: block; width: 100%; height: 100%; }
  .cc-say { font-size: 12px; color: var(--dim); }
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { drawCamera, FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { addNodes, relabel } from '/shell/nodes.mjs';
  import { createDrumMachine } from '/drums/drum-machine.mjs';
  import { voices } from '/drums/voices.mjs';

  // The drum machine played by a picture: the camera covered into 16:9 (cropped, never squashed),
  // cut into 16 by 9 squares, each row one drum. The shader dithers each square on or off and the
  // grid reads those pixels back every frame. Read only grid; nothing opens until pressed.
  // See lessons/page-drums.md#drums-1
  const d = mount({ name: 'Camera drums', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('drums/camera');

  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const CAM = ID('camera', 'video-out'), SCREEN = ID('screen', 'video-in');
  const PX_IN = ID('pixelate', 'video-in'), PX_OUT = ID('pixelate', 'video-out'), PX_VAL = ID('pixelate', 'value-out');
  const PIXELS = ID('pixels', 'video-in'), SEQ_IN = ID('sequencer', 'value-in');

  // 1x is 16 by 9 squares of 80 px, nine drums, 16 steps. 2x is 32 by 18 of 40 px, eighteen drums,
  // 32 steps as two bars of sixteenths: twice as long, not twice as fast. The switch is a value
  // on `web:scale` and lands at the top of the next loop.
  // See lessons/page-drums.md#drums-2
  let scale = 1, COLS = 16, CELL = FRAME_W / COLS, ROWS = Math.round(FRAME_H / CELL);
  const VOICES = voices({ more: true });
  // Every row is read: picture row i is drum i.
  const rowsRead = () => Array.from({ length: ROWS }, (_, i) => i);
  if (VOICES.length !== 2 * ROWS) throw new Error(`2x needs ${2 * ROWS} drums and there are ${VOICES.length}`);
  // Each drum's row of the 4x4 Bayer matrix and its column shift, chosen so a dim picture still
  // grooves (kick on the beat, an offbeat hat, partners on different sixteenths). The rows of the
  // matrix and the shifts per drum are in the lesson.
  // See lessons/page-drums.md#drums-3
  const BAYER_ROW = [0, 3, 2, 1, 3, 0, 2, 1, 0, 1, 3, 2, 2, 0, 1, 3, 0, 1];
  const BAYER_SHIFT = [0, 0, 0, 0, 2, 2, 2, 2, 1, 1, 3, 3, 1, 3, 3, 1, 2, 2];

  let cam = null, lastFrame = 0;
  const flowingVideo = () => !!cam && performance.now() - lastFrame < 500;
  const m = createDrumMachine(d, {
    voices: VOICES, patternIn: true, shape: { rows: 9, steps: 16 },
    // The new shape has landed (at once when stopped, at the top of a loop when
    // playing): the picture changes with it, and its pattern is written before
    // the loop's first step is read.
    onShape: (sh) => { applyScale(sh.rows === 18 ? 2 : 1); if (has) { lastKey = ''; render(); } },
    flowing: (l, playing) => (l.from === CAM || l.from === PX_OUT || l.from === PX_VAL ? flowingVideo() : playing),
  });
  const bay = m.api.bay;

  // ── the camera and the pixelate nodes ───────────────────────────────────
  // The shapes are /shell/nodes.mjs's; each port keeps its `node:port` label.
  const lay = (a, b) => { const r = bay.link(a, b, [], { site: S }); if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn'); };
  // Invert is a value on a wire: `web:invert`'s `value-out` into `web:pixelate:value-in`, as a
  // knob reaches a synth. Inverted by default.
  // See lessons/page-drums.md#drums-4
  let invert = true, inverts = 0;
  const INV = ID('invert', 'value-out'), PX_SET = ID('pixelate', 'value-in');
  // The 1x / 2x toggle is another value on a wire, `web:scale` into `pixelate:value-in`; the new
  // shape lands at the top of the next loop while playing, and the picture follows it.
  // See lessons/page-drums.md#drums-5
  const SCL = ID('scale', 'value-out');
  let scales = 0;
  addNodes(bay, S, [{ name: 'camera', variant: 'page' }, 'pixelate', 'screen', { name: 'screen', as: 'pixels', label: 'pixels' }, 'invert', 'scale'], {
    portLabel: 'node:port',
    label: { screen: 'original' },
    deliver: { 'pixelate:value-in': (e) => {
      if (e?.of === 'param' && e.name === 'scale') {
        const want = e.v >= 2 ? 2 : 1;
        scales++;
        sclBtn.pressed(want === 2);
        m.api.setShape({ rows: 9 * want, steps: 16 * want });
        d.log(want === 2 ? '2x: 32 by 18 squares, eighteen drums, two bars, from the next loop'
          : '1x: 16 by 9 squares, nine drums, one bar, from the next loop');
        return;
      }
      if (e?.of !== 'param' || e.name !== 'invert') return;
      invert = !!e.v; inverts++;
      invBtn.pressed(invert);
      if (!cam) render();
      d.log(invert ? 'inverted: black squares play' : 'not inverted: white squares play');
      lastKey = '';
    } },
  });
  // The camera's label becomes the device's own name once it is on: a relabel, not a new node.
  const camNode = (label) => relabel(bay, `${S}:camera`, label);
  lay(CAM, SCREEN); lay(CAM, PX_IN); lay(PX_OUT, PIXELS); lay(PX_VAL, SEQ_IN); lay(INV, PX_SET); lay(SCL, PX_SET);
  m.api.refresh();
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);

  // ── the original, as /video/camera/ draws it, covered ─────────────
  const video = el('video');
  video.muted = true; video.playsInline = true; video.autoplay = true;
  const orig = el('canvas');
  orig.width = FRAME_W; orig.height = FRAME_H;
  const octx = orig.getContext('2d', { alpha: false });
  const name = el('span', 'cc-say', ''), size = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: orig, left: name });
  panel.el.querySelector('.pos-vp-r').prepend(size);
  const GROUND = '#0b0e14';
  function drawOrig() {
    if (cam && holds(CAM, SCREEN)) drawCamera(octx, video, FRAME_W, FRAME_H, { scrim: 0, fit: 'cover' });
    else { octx.fillStyle = GROUND; octx.fillRect(0, 0, FRAME_W, FRAME_H); }
  }

  // ── the pixels: /video/shader/'s dither at 16 squares across ──────
  const canvas = el('canvas');
  canvas.width = FRAME_W; canvas.height = FRAME_H;
  // `preserveDrawingBuffer` so the squares can be read back at the bar, after
  // the frame that drew them has been shown.
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  // The footer carries buttons only: invert at the left, the 1x / 2x toggle and full screen at the right.
  // See lessons/page-drums.md#drums-6
  const pxPanel = createVideoPanel({ media: canvas, left: el('span') });
  // The invert button on the pixels' own footer, beside full screen, as the
  // kit's icon button with the `contrast` icon.
  const invBtn = createIconButton({ icon: 'contrast', label: 'invert black and white', pressed: true,
    onPress: () => bay.send(INV, { of: 'param', name: 'invert', v: invert ? 0 : 1 }) });
  const sclBtn = createIconButton({ icon: 'grid', label: 'twice as many squares and drums', pressed: false,
    onPress: () => { const now = m.api.pendingShape() ?? m.api.shape(); bay.send(SCL, { of: 'param', name: 'scale', v: now.rows === 18 ? 1 : 2 }); } });
  pxPanel.el.querySelector('.pos-vp-l').replaceChildren(invBtn.el);
  pxPanel.el.querySelector('.pos-vp-r').prepend(sclBtn.el);
  if (!gl) pxPanel.el.querySelector('.pos-vp-l').append(el('span', 'cc-say', 'no WebGL2'));
  const pair = el('div', 'cc-pair');
  pair.append(panel.el, pxPanel.el);

  let prog = null, tex = null; const U = {};
  if (gl) {
    const vs = `#version 300 es
      in vec2 p;
      void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    // Dither as /video/shader/'s, each row on its drum's matrix row and shift (`uBay`, `uShift`).
    // Black and white only; `uInvert` swaps them, and the read back grid inverts with it.
    // See lessons/page-drums.md#drums-7
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex; uniform vec2 uRes; uniform vec2 uFit;
      uniform float uHas; uniform float uSize; uniform float uRows;
      uniform float uBay[18]; uniform float uShift[18]; uniform float uInvert;
      out vec4 o;

      const float M[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
      float bayer(vec2 c) { ivec2 i = ivec2(mod(c, 4.0)); return (M[i.x + i.y * 4] + 0.5) / 16.0; }
      vec3 src(vec2 frag) {
        vec2 uv = (frag / uRes - 0.5) / uFit + 0.5;
        if (uHas < 0.5 || any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return vec3(0.0);
        return texture(uTex, uv).rgb;
      }
      void main() {
        vec2 cell = floor(gl_FragCoord.xy / uSize);
        float l = dot(src((cell + 0.5) * uSize), vec3(0.2126, 0.7152, 0.0722));
        l = smoothstep(0.04, 0.96, l);
        int row = int(uRows - 1.0 - cell.y);
        float lit = step(bayer(vec2(cell.x + uShift[row], uBay[row])), l);
        lit = uInvert > 0.5 ? 1.0 - lit : lit;
        o = vec4(vec3(lit), 1.0);
      }`;
    const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      d.log(`the shader did not compile: ${gl.getProgramInfoLog(prog)}`, 'bad');
      prog = null;
    }
    if (prog) {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const u of ['uTex', 'uRes', 'uFit', 'uHas', 'uSize', 'uRows', 'uBay', 'uShift', 'uInvert']) U[u] = gl.getUniformLocation(prog, u);
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.uniform1i(U.uTex, 0);
      gl.uniform2f(U.uRes, FRAME_W, FRAME_H);
      gl.uniform1f(U.uSize, CELL);
      gl.uniform1f(U.uRows, ROWS);
      gl.uniform1fv(U.uBay, BAYER_ROW);
      gl.uniform1fv(U.uShift, BAYER_SHIFT);
    }
  } else d.log('this browser has no WebGL2, so there are no squares and the grid stays empty', 'bad');

  /** The picture's squares for a scale: the size, the rows and the threshold rows. */
  function applyScale(sc) {
    scale = sc; COLS = 16 * sc; CELL = FRAME_W / COLS; ROWS = Math.round(FRAME_H / CELL);
    if (!gl || !prog) return;
    gl.useProgram(prog);
    gl.uniform1f(U.uSize, CELL);
    gl.uniform1f(U.uRows, ROWS);
  }
  let has = false;
  function render() {
    drawOrig();
    if (!gl) return;
    gl.viewport(0, 0, FRAME_W, FRAME_H);
    // No camera, or no link: the page's own dark ground, as the camera panel beside it, never the
    // shader's white.
    // See lessons/page-drums.md#drums-8
    has = !!cam && holds(CAM, PX_IN) && video.readyState >= 2 && video.videoWidth > 0;
    if (!prog || !holds(PX_OUT, PIXELS) || !has) { gl.clearColor(11 / 255, 14 / 255, 20 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    if (has) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
      // COVERED, as the original is: the frame is filled and the camera's
      // extra is cropped, so there are always 16 by 9 squares.
      const va = video.videoWidth / video.videoHeight, ca = FRAME_W / FRAME_H;
      gl.uniform2f(U.uFit, va > ca ? va / ca : 1, va > ca ? 1 : ca / va);
    }
    gl.uniform1f(U.uHas, has ? 1 : 0);
    gl.uniform1f(U.uInvert, invert ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (has) follow();
  }

  // ── the same squares, one pixel each, read back every frame ─────────────
  // Sized for 2x; 1x reads the corner it draws into.
  const small = new Uint8Array(32 * 18 * 4);
  let fb = null;
  if (gl && prog) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 32, 18, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }
  let lastKey = '', sent = 0, followed = 0;
  /** Draw the squares at one pixel each, read them, and send the pattern when it changed. */
  function follow() {
    if (!fb) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.viewport(0, 0, COLS, ROWS);
    gl.uniform2f(U.uRes, COLS, ROWS); gl.uniform1f(U.uSize, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.readPixels(0, 0, COLS, ROWS, gl.RGBA, gl.UNSIGNED_BYTE, small);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, FRAME_W, FRAME_H);
    gl.uniform2f(U.uRes, FRAME_W, FRAME_H); gl.uniform1f(U.uSize, CELL);
    followed++;
    const rows = rowsRead().map((row) => Array.from({ length: COLS }, (_, c) => (small[((ROWS - 1 - row) * COLS + c) * 4] > 127 ? 1 : 0)));
    const key = rows.map((r) => r.join('')).join('|');
    if (key === lastKey) return;
    lastKey = key;
    bay.send(PX_VAL, { of: 'pattern', rows });
    sent++;
  }

  /** The read rows, lit or not, off the full size picture's own pixels (for a
   *  check that the small copy and the picture agree). */
  const px = new Uint8Array(4);
  function readPattern() {
    return rowsRead().map((row) => Array.from({ length: COLS }, (_, c) => {
      gl.readPixels(c * CELL + CELL / 2, (ROWS - 1 - row) * CELL + CELL / 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return px[0] + px[1] + px[2] > 3 * 0.3 * 255 ? 1 : 0;
    }));
  }

  // ── the camera, on its own press ────────────────────────────────────────
  let raf = 0, gen = 0;
  function frame() {
    if (!cam) return;
    render();
    raf = requestAnimationFrame(frame);
  }
  function watchFrames() {
    if (typeof video.requestVideoFrameCallback !== 'function') return;
    const tick = () => { if (!cam) return; lastFrame = performance.now(); video.requestVideoFrameCallback(tick); };
    video.requestVideoFrameCallback(tick);
  }
  async function start() {
    const mine = ++gen;
    armVideo(video);
    let s;
    try {
      s = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: FRAME_W }, height: { ideal: FRAME_H }, frameRate: { ideal: 30 } }, audio: false,
      });
    } catch (e) {
      d.log(e?.name === 'NotAllowedError' ? 'the camera was refused'
        : e?.name === 'NotFoundError' ? 'this machine has no camera' : `the camera did not start (${e?.name || e})`, 'bad');
      face(false);
      return;
    }
    if (gen !== mine) { s.getTracks().forEach((t) => t.stop()); return; }
    cam = s;
    const track = cam.getVideoTracks()[0];
    const set = track.getSettings();
    video.srcObject = cam;
    video.play().catch(() => {});
    const label = (track.label || '').replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)\s*$/i, '');
    name.textContent = label;
    size.textContent = set.width && set.height ? `${set.width}x${set.height}` : '';
    camNode(label || 'camera');
    d.log(`camera on: ${track.label || 'default'} at ${set.width}x${set.height}`, 'hi');
    watchFrames();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    m.api.refresh();
    face(true);
  }
  function stop() {
    gen++;
    cam?.getTracks().forEach((t) => t.stop());
    cam = null;
    cancelAnimationFrame(raf);
    try { video.pause(); } catch { /* fine */ }
    video.srcObject = null;
    name.textContent = ''; size.textContent = '';
    has = false;
    render();
    m.api.refresh();
    face(false);
    d.log('camera off, every track stopped; the grid keeps the last bar');
  }
  const camBtn = createButtonGroup({ buttons: [
    { id: 'cam', icon: 'video', label: 'start the camera', onPress: () => (cam ? stop() : start()) },
  ] });
  function face(on) { camBtn.setIcon('cam', on ? 'stop' : 'video', on ? 'stop the camera' : 'start the camera'); }
  render();

  const top = el('div', 'cc-top');
  top.append(camBtn.el);
  d.stack.add(top, pair, m.surface, m.patchbay);
  addEventListener('pagehide', () => { stop(); });
  window.__rhythm = m.api;
  window.__camdrums = { rowsRead, rows: () => ROWS, cols: () => COLS, scale: () => scale, scales: () => scales, sclBtn, readPattern, invert: () => invert, inverts: () => inverts, invBtn, followed: () => followed, sent: () => sent, cam: () => !!cam, has: () => has, start, stop };
  d.ready();
</script>

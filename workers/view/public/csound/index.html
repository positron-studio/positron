<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* SCORE: the kit's code box (demo/shell/code-box.mjs), coloured as a Csound score.
     Its height is the score's line count (`rows`) plus the compile note's reserve.
     `--well` is the box's ground, read by the box and the note alike.
     See lessons/page-csound.md#csound-18 */
  .und-editor { --well: #0d1117; }
  /* Each line in the colour of the lane that draws it (i event, t tempo, m or n part),
     tagged by code-lang.mjs; the inks are the strip's own, from INK and DERIVED in score.mjs.
     See lessons/page-csound.md#csound-19 */
  .und-editor .pos-ln-event { color: color-mix(in oklab, var(--ln-on) 70%, var(--ln-off)); }
  .und-editor .pos-ln-part, .und-editor .pos-ln-tempo { color: color-mix(in oklab, var(--ln-derived) 80%, #fff); }
  .und-editor .pos-tk-carry[class*="pos-ln-"] { opacity: .7; }

  /* Both tabs: a compiled document, scrolled at a fixed height so a longer score moves
     nothing. Left border is the part, text is whether it played; hue never means played.
     No margin here: the stack owns the rhythm between blocks.
     See lessons/page-csound.md#csound-20 */
  .sc { max-height: calc(12 * 1.75em + 22px); overflow: auto;
        font: 400 11px/1.75 var(--mono); background: var(--card);
        border: 1px solid var(--line); border-radius: 4px; padding: 10px 0; }
  .sc-l { display: block; white-space: pre; color: var(--dim2);
          border-left: 3px solid transparent; padding: 0 12px 0 9px; }
  .sc-l[data-state="played"] { color: var(--dim); }
  .sc-l[data-state="now"]    { color: var(--fg);
                               background: color-mix(in oklab, var(--hi) 10%, transparent); }
  .sc-n { color: var(--dim2); }
  .sc-l[data-state="now"] .sc-n { color: var(--fg); }
  .warn { font: 500 10.5px/1.7 var(--mono); color: var(--warn); margin: 0; }
  .warn:empty { display: none; }

  /* CLICK: the typed score and the document made from it, side by side. One column on a
     narrow screen, since two 11 px monospace columns at 400 px are only ellipses.
     See lessons/page-csound.md#csound-21 */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
  .two > div { min-width: 0; }
  .two h4 { margin: 0 0 6px; font: 600 10px/1 var(--mono); letter-spacing: .1em;
            text-transform: uppercase; color: var(--dim2); }
  /* the operator's half, a plain row, because it is not the subject */
  .op { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .op label { font: 500 11px/1 var(--mono); color: var(--dim); }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as score from './score.mjs';
  import * as click from './click.mjs';

  /* Two tabs, both Csound made seekable: SCORE (typed, compiled, with sound) and CLICK
     (vClick's scores on the page's clock). demo/shell/tab-page.mjs does the rest.
     SCORE owns the one published transport bar; CLICK's is `publish: false`.
     See lessons/page-csound.md#csound-22 */
  const d = mount({
    name: 'csound',
    // No `what` under the title: each tab says what it is in the box under the
    // tab row (`tab-page.mjs` rule 6).
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);

  const page = createTabPage(d, {
    at: 'score',
    tabs: [
      { id: 'score', label: 'SCORE', mod: score },
      { id: 'click', label: 'CLICK', mod: click },
    ],
  });

  // Before `ready` and never after it: the harness drills the published bar
  // the moment `ready` is true, and a tab switch under it would race it.
  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    d.log(`the check pass took ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>

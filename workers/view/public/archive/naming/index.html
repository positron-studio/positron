<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="archive/naming">
<meta property="og:description" content="The cast and edgecast patches with the edge as the site cf-edgecast and every part a node on it">
<meta property="og:url" content="https://positron.studio/archive/naming/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON archive/naming</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/kit-page.css">
<style>
  /* a desk wide column, so a chain of seven boxes draws across instead of stacking */
  body { max-width: 1280px; }
  .nm-wide { overflow-x: auto; }
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { MEDIA } from '/shell/bay.mjs';
  import { useMediumColours } from '/shell/patchbay.mjs';
  import { createBayView, BAY_VIEW_CSS } from '/shell/bay-view.mjs';
  import { createPortInk } from '/shell/port-ink.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  useMediumColours();

  // The edge's patches with the edge as the site cf-edgecast and its parts as nodes, the names the owner chose
  // on 2026-10-21 over plans/plan-edgecast-modular.md's edge-n. Drawn from link lists; nothing here is a real bay.
  // Archived 2026-10-21 once the owner settled the names (option A, plans/plan-edgecast-modular.md).
  const d = mount({ name: 'archive/naming', readout: null, showLog: false, controls: [], index: '/archive/', indexLabel: 'archive',
    what: 'The cast and edgecast patches with the edge as the site cf-edgecast and every part a node on it.' });
  guard(d);
  // A heading, a note, the patch text and the picture, in the kit page's classes.
  const section = (title, note, src, build) => {
    const sec = el('section', 'kit-sec');
    sec.append(el('h2', 'kit-h', title));
    if (note) sec.append(el('p', 'kit-n', note));
    sec.append(el('pre', 'kit-src', src));
    const box = el('div', 'kit-box');
    build(box);
    sec.append(box);
    d.el.append(sec);
  };
  document.head.append(Object.assign(document.createElement('style'), { textContent: BAY_VIEW_CSS }));

  // What each node is, drawn at a box's top right.
  const INFO = {
    archive: 'Väin archive', caster: 'container cast', icecast: 'Väin Icecast', radio1965: 'radio1965', preview: 'preview mount',
    files: 'cast files', local: 'cast in the tab', cast: 'the cast', player: 'player', speaker: 'speaker', station: 'station',
    lab: 'browser mode', playlist: 'playlist', planner: 'planner', tuner: 'tuner', grains: 'grains', layers: 'layers',
    master: 'master', encoder: 'mp3 encoder', decoder: 'mp3 decoder', resample: 'resample', shout: 'listeners',
    collide: 'SuperCollider', 'collide-2': 'SuperCollider', 'knob-cutoff': 'cutoff', 'knob-room': 'room', 'knob-pitch': 'pitch', code: 'sclang code box', call: 'a WebRTC call', keys: 'keys', relay: 'to radio1965',
  };
  const mediumOf = (id) => { const m = id.split(':')[2].split('-')[0]; return MEDIA.includes(m) ? m : 'value'; };
  const nodeOf = (id) => id.split(':').slice(0, 2).join(':');
  const fakeBay = (pairs) => {
    const ports = new Map(), nodes = new Map();
    const links = pairs.map(([from, to, via], i) => {
      for (const [id, dir] of [[from, 'out'], [to, 'in']]) {
        if (!nodes.has(nodeOf(id))) nodes.set(nodeOf(id), { id: nodeOf(id), label: INFO[id.split(':')[1]] || '' });
        if (!ports.has(id)) ports.set(id, { id, dir, medium: mediumOf(id) });
      }
      return { id: `l${i}`, from, to, tf: via ? `via ${via}` : '' };
    });
    return { nodes: () => [...nodes.values()], ports: () => [...ports.values()], links: () => links };
  };
  const line = (l) => `${l.from} -> ${l.to}${l.tf ? ` ${l.tf}` : ''}`;

  const SPLIT = [
    ['cf-cast:files:file-out', 'cf-edgecast:player:file-in', 'https'],
    ['cf-edgecast:playlist:value-out', 'cf-edgecast:player:value-in'],
    ['cf-edgecast:player:audio-out', 'cf-edgecast:tuner:audio-in', 'isolate'],
    ['cf-edgecast:tuner:audio-out', 'cf-edgecast:grains:audio-in', 'isolate'],
    ['cf-edgecast:tuner:audio-out', 'cf-edgecast:layers:audio-in', 'isolate'],
    ['cf-edgecast:planner:value-out', 'cf-edgecast:grains:value-in'],
    ['cf-edgecast:planner:value-out', 'cf-edgecast:layers:value-in'],
    ['cf-edgecast:grains:audio-out', 'cf-edgecast:master:audio-in', 'isolate'],
    ['cf-edgecast:layers:audio-out', 'cf-edgecast:master:audio-in', 'isolate'],
    ['cf-edgecast:master:audio-out', 'cf-edgecast:encoder:audio-in', 'isolate'],
    ['cf-edgecast:encoder:audio-out', 'cf-edgecast:shout:audio-in', 'isolate'],
    ['cf-edgecast:shout:audio-out', 'web:speaker:audio-in', 'https'],
  ];
  const COARSE = [
    ['cf-cast:files:file-out', 'cf-edgecast:cast:file-in', 'https'],
    ['cf-edgecast:playlist:value-out', 'cf-edgecast:cast:value-in'],
    ['cf-edgecast:cast:audio-out', 'cf-edgecast:encoder:audio-in', 'isolate'],
    ['cf-edgecast:encoder:audio-out', 'cf-edgecast:shout:audio-in', 'isolate'],
    ['cf-edgecast:shout:audio-out', 'web:speaker:audio-in', 'https'],
  ];
  const ROWS = [
    { title: 'THE RADIO1965 CAST ON THE EDGE', note: 'What /radio/edgecast/ plays, with the encoder and the listeners as their own nodes and the cast as one.',
      plan: COARSE },
    { title: 'THE SAME, EVERY BOX', note: 'The cast node opened into the parts it is made of, after Üle Heli.',
      plan: SPLIT },
    { title: 'EDGE TO RADIO1965', note: 'The edge feeding Väin’s mount, through a source that holds the mount across a restart.',
      plan: [['cf-edgecast:cast:audio-out', 'cf-edgecast:encoder:audio-in', 'isolate'], ['cf-edgecast:encoder:audio-out', 'cf-edgecast:relay:audio-in', 'rpc'],
        ['cf-edgecast:relay:audio-out', 'vain:icecast:audio-in', 'icecast'],
        ['vain:icecast:audio-out', 'cf-shout:radio1965:audio-in', 'https'], ['cf-shout:radio1965:audio-out', 'web:speaker:audio-in', 'https']] },
    { title: 'THE CONTAINER CAST', note: 'What /radio/cast/ plays on radio1965, the container drawn as the station it plays.',
      plan: [['vain:archive:file-out', 'cf-cast:radio1965:file-in', 'https'], ['cf-cast:radio1965:audio-out', 'vain:icecast:audio-in', 'icecast'],
        ['vain:icecast:audio-out', 'cf-shout:radio1965:audio-in', 'https'], ['cf-shout:radio1965:audio-out', 'web:speaker:audio-in', 'https']] },
    { title: 'THE CAST IN THE TAB', note: 'LOCAL on /radio/cast/, the same cast node in the tab.',
      plan: [['vain:archive:file-out', 'cf-cast:files:file-in', 'https'], ['cf-cast:files:file-out', 'web:cast:file-in', 'https'],
        ['web:cast:audio-out', 'web:speaker:audio-in']] },
    { title: 'BROWSER MODE', note: 'A file sent from the tab, processed on the edge and heard back, with two SuperCollider inserts.',
      plan: [['web:player:audio-out', 'cf-edgecast:grains:audio-in', 'websocket'], ['cf-edgecast:grains:audio-out', 'cf-edgecast:collide:audio-in', 'isolate'],
        ['cf-edgecast:collide:audio-out', 'cf-edgecast:master:audio-in', 'isolate'], ['cf-edgecast:master:audio-out', 'cf-edgecast:collide-2:audio-in', 'isolate'],
        ['cf-edgecast:collide-2:audio-out', 'web:speaker:audio-in', 'websocket']] },
    { title: 'EDGECAST WITH COLLIDE KNOBS', note: 'A file sent from the tab through SuperCollider on the edge, three knobs in the tab setting its parameters while it plays.',
      plan: [['web:player:audio-out', 'cf-edgecast:collide:audio-in', 'websocket'], ['cf-edgecast:collide:audio-out', 'web:speaker:audio-in', 'websocket'],
        ['web:knob-cutoff:value-out', 'cf-edgecast:collide:value-in', 'websocket'], ['web:knob-room:value-out', 'cf-edgecast:collide:value-in', 'websocket'],
        ['web:knob-pitch:value-out', 'cf-edgecast:collide:value-in', 'websocket']] },
    { title: 'COLLIDE LIVE COMPILE', note: 'sclang typed in the tab, compiled into SuperCollider on the edge while it plays, played from the keys and heard back.',
      plan: [['web:code:program-out', 'cf-edgecast:collide:program-in', 'websocket'], ['web:keys:midi-out', 'cf-edgecast:collide:midi-in', 'websocket'],
        ['web:player:audio-out', 'cf-edgecast:collide:audio-in', 'websocket'], ['cf-edgecast:collide:audio-out', 'web:speaker:audio-in', 'websocket']] },
    { title: 'THE PI, FOR COMPARISON', note: 'The same SuperCollider node on the Pi and on the edge, only the site changes.',
      plan: [['web:keys:midi-out', 'pi-1:collide:midi-in', 'relay'], ['pi-1:collide:audio-out', 'web:speaker:audio-in', 'webrtc'],
        ['web:keys:midi-out', 'cf-edgecast:collide:midi-in', 'websocket'], ['cf-edgecast:collide:audio-out', 'web:speaker:audio-in', 'websocket']] },
    { title: 'A PLAYLIST STATION, NO SUPERCOLLIDER', note: 'Files played in order, encoded and fanned out to listeners, nothing processed.',
      plan: [['cf-edgecast:playlist:value-out', 'cf-edgecast:player:value-in'], ['cf-cast:files:file-out', 'cf-edgecast:player:file-in', 'https'],
        ['cf-edgecast:player:audio-out', 'cf-edgecast:encoder:audio-in', 'isolate'], ['cf-edgecast:encoder:audio-out', 'cf-edgecast:shout:audio-in', 'isolate'],
        ['cf-edgecast:shout:audio-out', 'web:speaker:audio-in', 'https']] },
    { title: 'WEBRTC IN, MP3 OUT', note: 'A call through Cloudflare’s SFU heard as an MP3 stream.',
      plan: [['cf-sfu:call:audio-out', 'cf-edgecast:encoder:audio-in', 'websocket'], ['cf-edgecast:encoder:audio-out', 'cf-edgecast:shout:audio-in', 'isolate'],
        ['cf-edgecast:shout:audio-out', 'web:speaker:audio-in', 'https']] },
    { title: 'MP3 IN, WEBRTC OUT', note: 'Our own mount decoded on the edge and sent into the SFU.',
      plan: [['cf-shout:preview:audio-out', 'cf-edgecast:decoder:audio-in', 'https'], ['cf-edgecast:decoder:audio-out', 'cf-edgecast:resample:audio-in', 'isolate'],
        ['cf-edgecast:resample:audio-out', 'cf-sfu:call:audio-in', 'websocket'], ['cf-sfu:call:audio-out', 'web:speaker:audio-in', 'webrtc']] },
  ];

  const LABEL = (node) => [{ text: node.label, sans: true }];
  const bays = [];
  for (const x of ROWS) {
    const bay = fakeBay(x.plan);
    section(x.title, x.note, bay.links().map(line).join('\n'), (box) => {
      const wide = el('div', 'nm-wide');
      box.append(wide);
      const view = createBayView(bay, { detail: LABEL });
      wide.append(view.el);
      bays.push({ bay, view });
    });
  }

  const ink = createPortInk({ ports: () => bays.flatMap((b) => b.bay.ports()) }, MEDIA);
  ink.paint(d.el);

  if (SELFCHECK) {
    const frames = (n) => new Promise((r) => { const f = () => (--n <= 0 ? r() : requestAnimationFrame(f)); requestAnimationFrame(f); });
    await frames(3);
    const bad = bays.filter(({ bay, view }) => view.wires.size !== bay.links().length || view.el.querySelectorAll('.lv-box').length !== bay.nodes().length);
    d.assert('every picture draws one wire per link and one box per node', bays.length === ROWS.length && !bad.length, `${bays.length} pictures, ${bad.length} wrong`);
    d.assert('NEGATIVE CONTROL: a picture of no links draws no wire', createBayView(fakeBay([])).wires.size === 0, 'empty bay, 0 wires');
  }
  d.ready();
</script>

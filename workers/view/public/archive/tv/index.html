<style>
  /* Start and stop on their own row at the left. A flex row blockifies the
     group, so it sits on no text line. */
  .cc-top { display: flex; }
  /* Four pictures in a 2x2 grid (asked 2026-10-12, *"tv with 3 screens: to
     2x2 grid. etv etv2 just blend, fx blend"*): the two channels as they
     arrive on top, the plain crossfade and the dithered one under them. On a
     phone they stack in that order, sources first, then what is made of them. */
  .cc-quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .cc-quad { grid-template-columns: minmax(0, 1fr); } }
  /* A panel whose link is let go shows its ground, not a frozen frame.
     `visibility` and not `[hidden]`: the kit's `display: block` on a stage's
     video beats the browser's own `[hidden]`. */
  .cc-quad .pos-vp-stage > .cc-off { visibility: hidden; }
  /* The kit's bare `video` rule gives every video a card, an edge and a radius,
     which inside a panel's stage draws a box within the box. Through the kit's
     own tokens, so the stage's ground shows as it does under the two blend
     canvases. Belongs in shell.css at `.pos-vp-stage > video`. */
  .cc-quad .pos-vp-stage > video { --edge: 0px; --r: 0px; background: transparent; }
  /* One ground for all four, the page's own dark: the dither clears its
     canvas to it (11, 14, 20) before a frame, the mixer fills its own with the
     same, and the channel stages match it. Asked 2026-10-12: *"same bg on all"*. */
  .cc-quad .pos-vp-stage { background: var(--bg); }
  /* A footer line never wraps: one line, cut at the slot's edge. */
  .pos-vp-foot .cc-say { white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
</style>
<script type="module">
  import { mount, el, armVideo } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { FRAME_W, FRAME_H } from '/shell/pattern.mjs';
  import { CHANNELS, NATIVE_HLS, readPlaylist, findServedEdge, wallHandler } from '/shell/err-live.mjs';

  // Two ERR television channels live, mixed into one picture, dithered, and
  // shown under the two pictures it is made of. The chain is ETV and ETV2
  // into `web:mixer`, the mixer into `web:blend-panel` (the plain crossfade)
  // and into `web:dither`, the dither into `web:screen` (the fx blend), and
  // each channel also straight into a panel of its own (`web:etv-panel`,
  // `web:etv2-panel`), so what goes into the mix is on screen above it. Every
  // step follows the links the bay holds.
  //
  // THE CHANNEL PANELS SHOW THE RAW SOURCE, NOT A DITHERED ONE. The mixer takes
  // the channels as they arrive and the dither runs once, after the mix, so
  // the raw picture is exactly what goes into the mix. A dithered channel panel
  // would show something no wire on the patchbay carries, and the dither's
  // effect would be invisible because nothing undithered stood beside it. The pictures come straight from ERR's own CDN
  // (live.err.ee), not through positron's relay, and the patchbay says so.
  // `?base=` points every ERR URL at demo/fake-err.mjs instead, through
  // `errUrl` in err-live.mjs, which is how this page is tested.
  //
  // 🔴 ONE START PRESS OPENS TWO ERR LIVE CHANNELS, AND ERR COUNTS THAT AS TWO
  // VIEWERS. Every connection to ERR appears in a public broadcaster's
  // audience measurement (CLAUDE.md, "What costs real money and somebody else's
  // server"). So NOTHING OPENS ON A VISIT: no playlist, no probe, no engine,
  // no AudioContext until the press. Stop closes both. Per channel a press
  // costs one master read (one ERR session), up to eight two-byte probes to
  // find where ERR serves from, and then the variant playlist and segments the
  // engine pulls. The engine is handed the VARIANT readPlaylist already got,
  // so it does not read the master a second time and mint a second session.
  //
  // THE SOUND. Each video element goes through MediaElementSource into one
  // AudioContext, an equal-power gain per channel, and the speakers. Only when
  // there is no AudioContext, or the element refuses to be a source, does the
  // fader set each element's `volume` instead, and the log says so.
  //
  // THE MIXER. Each frame both videos are drawn into one offscreen canvas:
  // ETV at full strength, then ETV2 over it at the fader's alpha. ETV stays at 1
  // under it on purpose: fading both (ETV at 1 - x) would let the ground
  // through and the middle would go dark. Unlike the old layered screen, this
  // IS a mixed picture that something else can take, so the mixer has a
  // video-out and the dither takes it.
  //
  // THE DITHER is /video/shader/'s shader, copied: a two tone 4x4 Bayer dither
  // over the mixed picture's brightness, the page's ground for off and a warm
  // off-white for on, leaning toward --hi only in the brightest cells.
  //
  // 🔴 CROSS-ORIGIN. A canvas that has drawn a cross-origin frame without CORS
  // is TAINTED, and uploading it to WebGL throws a SecurityError. On the
  // hls.js path the element plays a MediaSource blob, which is same-origin, so
  // the frames are clean. On the native path (WebKit) the element loads ERR
  // directly, so `crossOrigin` is set before `src` and ERR's
  // `access-control-allow-origin: *` is what keeps the frames clean; that path
  // is UNTESTED here. If the upload still throws, the page says in words that
  // this browser's video cannot be filtered and draws the ground. It does not
  // crash and it does not retry every frame.
  const S = 'web';
  const ON_PAGE = CHANNELS.filter((c) => c.id === 'etv' || c.id === 'etv2');
  const PROBE_STEPS = 8, WALL_BACKOFF_S = 90;

  const vOut = (c) => `err:${c.id}:video-out`, aOut = (c) => `err:${c.id}:audio-out`;
  const MIX_IN = `${S}:mixer:video-in`, MIX_OUT = `${S}:mixer:video-out`;
  const DITH_IN = `${S}:dither:video-in`, DITH_OUT = `${S}:dither:video-out`, DITH_VAL = `${S}:dither:value-in`;
  const SCREEN_IN = `${S}:screen:video-in`;
  const BLEND_IN = `${S}:blend-panel:video-in`;
  const SIDE_IN = (c) => `${S}:${c.id}-panel:video-in`;
  const FADER_IN = `${S}:fader:audio-in`, FADER_OUT = `${S}:fader:audio-out`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const KNOB_OUT = (n) => `${S}:knob-${n}:value-out`;

  const d = mount({ name: 'TV', what: '', readout: null, index: '/archive/', indexLabel: 'archive' });

  // ── the dither's one parameter, set only through value-in ───────────────
  const KNOBS = [
    { name: 'size', min: 2, max: 16, step: 1, raw: 4, format: (r) => `${Math.round(r)} px` },
  ];
  const P = { size: 4 };
  function setParam(e) {
    if (e?.of !== 'param') { d.log('the dither takes parameters, and this was not one', 'warn'); return; }
    if (e.name === 'size') P.size = Math.max(1, Math.round(e.v));
    else { d.log(`the dither has no parameter called ${e.name}`, 'warn'); return; }
    showDither();
    if (!playing) render();
  }

  // ── the bay ─────────────────────────────────────────────────────────────
  // Each channel is an external site with a picture and a sound out of it.
  // One HLS stream carries both, so both links ride `llhls` (the bay's name
  // for HLS to many viewers) from ERR's CDN straight into this tab, and both
  // need consent, because ERR counts whoever opens them.
  const bay = createBay();
  for (const c of ON_PAGE) {
    const host = new URL(c.url).host;
    bay.addNode({ id: `err:${c.id}`, kind: 'external', label: c.name, place: 'err', net: 'err' });
    bay.addPort({ id: vOut(c), label: `${c.name} picture`, dir: 'out', medium: 'video', transports: ['llhls'], address: host });
    bay.addPort({ id: aOut(c), label: `${c.name} sound`, dir: 'out', medium: 'audio', transports: ['llhls'], address: host });
  }
  // The mixer takes both pictures on its one video-in, as the fader takes both
  // sounds on its one audio-in; which picture is the base layer is a fact about
  // the channel, not about the port.
  bay.addNode({ id: `${S}:mixer`, kind: 'engine', label: 'video mixer', place: 'browser' });
  bay.addPort({ id: MIX_IN, label: 'mixer:video-in', dir: 'in', medium: 'video', transports: ['llhls'] });
  bay.addPort({ id: MIX_OUT, label: 'mixer:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addNode({ id: `${S}:dither`, kind: 'engine', label: 'dither shader', place: 'browser' });
  bay.addPort({ id: DITH_IN, label: 'dither:video-in', dir: 'in', medium: 'video' });
  bay.addPort({ id: DITH_OUT, label: 'dither:video-out', dir: 'out', medium: 'video', transports: ['page'] });
  bay.addPort({ id: DITH_VAL, label: 'dither:value-in', dir: 'in', medium: 'value',
    shape: { of: 'param', names: KNOBS.map((k) => k.name) }, deliver: setParam });
  for (const k of KNOBS) {
    bay.addNode({ id: `${S}:knob-${k.name}`, kind: 'person', label: 'knob', place: 'browser' });
    bay.addPort({ id: KNOB_OUT(k.name), label: `knob-${k.name}:value-out`, dir: 'out', medium: 'value', shape: { of: 'param' } });
  }
  bay.addNode({ id: `${S}:screen`, kind: 'screen', label: 'fx blend panel', place: 'browser' });
  bay.addPort({ id: SCREEN_IN, label: 'fx blend panel', dir: 'in', medium: 'video' });
  // The mixer's picture as it is, before the dither: one out to two ins.
  bay.addNode({ id: `${S}:blend-panel`, kind: 'screen', label: 'blend panel', place: 'browser' });
  bay.addPort({ id: BLEND_IN, label: 'blend panel', dir: 'in', medium: 'video' });
  // A panel per channel, fed by the same picture-out that feeds the mixer: one
  // out to two ins, the source seen as it is and as it goes into the mix.
  for (const c of ON_PAGE) {
    bay.addNode({ id: `${S}:${c.id}-panel`, kind: 'screen', label: `${c.name} panel`, place: 'browser' });
    bay.addPort({ id: SIDE_IN(c), label: `${c.name} panel`, dir: 'in', medium: 'video', transports: ['llhls'] });
  }
  bay.addNode({ id: `${S}:fader`, kind: 'engine', label: 'crossfader', place: 'browser' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' });
  bay.addPort({ id: FADER_IN, label: 'crossfader', dir: 'in', medium: 'audio' });
  bay.addPort({ id: FADER_OUT, label: 'crossfader', dir: 'out', medium: 'audio' });
  bay.addPort({ id: SPEAKER_IN, label: 'speakers', dir: 'in', medium: 'audio' });

  const held = new Map();          // "from to" -> link id
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  const holds = (a, b) => held.has(`${a} ${b}`);
  // The whole patch is held from load, so the picture is the same playing or
  // stopped. Holding a link opens nothing: the channels open only on start,
  // which is the press where a person asks to watch, so the consent is named
  // here rather than at the press.
  for (const c of ON_PAGE) {
    hold(vOut(c), SIDE_IN(c), { consent: true, via: 'llhls' });
    hold(vOut(c), MIX_IN, { consent: true, via: 'llhls' });
    hold(aOut(c), FADER_IN, { consent: true, via: 'llhls' });
  }
  hold(MIX_OUT, BLEND_IN);
  hold(MIX_OUT, DITH_IN);
  hold(DITH_OUT, SCREEN_IN);
  for (const k of KNOBS) hold(KNOB_OUT(k.name), DITH_VAL);
  hold(FADER_OUT, SPEAKER_IN);

  // ── the decode sources ──────────────────────────────────────────────────
  const tv = ON_PAGE.map((c) => {
    const video = el('video');
    video.muted = true; video.playsInline = true;
    // Before any src, or the native path's frames and samples are withheld.
    video.crossOrigin = 'anonymous';
    const ch = { c, video, hls: null, src: null, tap: null, gain: null, buf: null,
      lastFrame: 0, lastT: -1, lastSound: 0, frames: 0, refused: false };
    // The channel's own panel shows this element itself: ERR's picture as it
    // arrives, before the mixer or the dither touch it.
    const res = el('span', 'cc-say', '');
    const name = el('span', 'cc-say', '');
    const panel = createVideoPanel({ media: video, left: name });
    panel.el.querySelector('.pos-vp-r').prepend(res);
    Object.assign(ch, { res, name, panel });
    video.addEventListener('resize', () => showSize());
    return ch;
  });

  // ── the mixer: one offscreen canvas ─────────────────────────────────────
  const mix = document.createElement('canvas');
  mix.width = FRAME_W; mix.height = FRAME_H;
  const mctx = mix.getContext('2d', { alpha: false });
  let mixHas = false, lastMix = 0;
  // Contained, as drawCamera does: a channel that is not 16:9 keeps its shape.
  function drawContained(v) {
    const va = v.videoWidth / v.videoHeight, ca = FRAME_W / FRAME_H;
    const w = va > ca ? FRAME_W : FRAME_H * va, h = va > ca ? FRAME_W / va : FRAME_H;
    mctx.drawImage(v, (FRAME_W - w) / 2, (FRAME_H - h) / 2, w, h);
  }
  const ready = (ch) => playing && holds(vOut(ch.c), MIX_IN) && ch.video.readyState >= 2 && ch.video.videoWidth > 0;
  function drawMix() {
    mctx.globalCompositeOperation = 'source-over';
    mctx.globalAlpha = 1;
    // The page's ground, so the blend panel matches the other three.
    mctx.fillStyle = 'rgb(11, 14, 20)';
    mctx.fillRect(0, 0, FRAME_W, FRAME_H);
    let n = 0;
    // ETV first, at full strength, as the base layer.
    if (ready(tv[0])) { drawContained(tv[0].video); n++; }
    // ETV2 over it at the fader's alpha, as a plain mix.
    if (ready(tv[1]) && x > 0) {
      mctx.globalAlpha = x;
      drawContained(tv[1].video);
      n++;
    }
    mctx.globalCompositeOperation = 'source-over';
    mctx.globalAlpha = 1;
    mixHas = n > 0;
    if (mixHas) lastMix = performance.now();
  }

  // ── the blend panel: the mixer's own canvas, shown as it is ─────────────
  const blendWho = el('span', 'cc-say', '');
  const blendPanel = createVideoPanel({ media: mix, left: blendWho });

  // ── the fx blend panel: one canvas, the dither's output ─────────────────
  const canvas = el('canvas');
  canvas.width = FRAME_W; canvas.height = FRAME_H;
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
  // One footer line per panel. The fx blend names itself at the left and
  // the dither size at the right; each channel panel names its channel and its
  // resolution.
  const who = el('span', 'cc-say', '');
  const dsize = el('span', 'cc-say', gl ? '' : 'no WebGL2');
  const panel = createVideoPanel({ media: canvas, left: who });
  panel.el.querySelector('.pos-vp-r').prepend(dsize);
  const quad = el('div', 'cc-quad');
  quad.append(tv[0].panel.el, tv[1].panel.el, blendPanel.el, panel.el);

  let prog = null, tex = null, U = {}, tainted = false;
  if (gl) {
    const vs = `#version 300 es
      in vec2 p;
      void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    // As /video/shader/: brightness per cell of uSize pixels, a little
    // contrast, then one Bayer threshold. Below it the page's ground, above it
    // warm off-white, which leans toward --hi only in the brightest cells.
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex; uniform vec2 uRes;
      uniform float uHas; uniform float uSize;
      out vec4 o;
      const vec3 GROUND = vec3(0.043, 0.055, 0.078);
      const vec3 INK = vec3(0.92, 0.89, 0.82);
      const vec3 HI = vec3(1.0, 0.831, 0.0);
      const float M[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
      float bayer(vec2 c) { ivec2 i = ivec2(mod(c, 4.0)); return (M[i.x + i.y * 4] + 0.5) / 16.0; }
      vec3 src(vec2 frag) {
        if (uHas < 0.5) return vec3(0.0);
        return texture(uTex, clamp(frag / uRes, 0.0, 1.0)).rgb;
      }
      void main() {
        vec2 cell = floor(gl_FragCoord.xy / uSize);
        float l = dot(src((cell + 0.5) * uSize), vec3(0.2126, 0.7152, 0.0722));
        l = smoothstep(0.04, 0.96, l);
        vec3 ink = mix(INK, HI, smoothstep(0.86, 1.0, l) * 0.55);
        vec3 dith = mix(GROUND, ink, step(bayer(cell), l));
        o = vec4(dith, 1.0);
      }`;
    const sh = (t, s) => { const v = gl.createShader(t); gl.shaderSource(v, s); gl.compileShader(v); return v; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      d.log(`the dither did not compile: ${gl.getProgramInfoLog(prog)}`, 'bad');
      prog = null;
    }
    if (prog) {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const u of ['uTex', 'uRes', 'uHas', 'uSize']) U[u] = gl.getUniformLocation(prog, u);
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.uniform1i(U.uTex, 0);
      gl.uniform2f(U.uRes, FRAME_W, FRAME_H);
    }
  } else d.log('this browser has no WebGL2, so there is no dither and the picture stays dark', 'bad');

  // The routing follows the links. Without mixer -> dither the dither runs
  // with no input and draws only its ground; without dither -> screen the
  // panel clears to the ground.
  function dither() {
    if (!gl) return;
    gl.viewport(0, 0, FRAME_W, FRAME_H);
    if (!prog || !holds(DITH_OUT, SCREEN_IN)) { gl.clearColor(11 / 255, 14 / 255, 20 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    let has = !tainted && mixHas && holds(MIX_OUT, DITH_IN);
    if (has) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      try {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, mix);
      } catch (e) {
        // A frame from another origin without CORS taints the mixer's canvas.
        tainted = true; has = false;
        dsize.textContent = 'not filterable';
        d.log(`this browser's video cannot be filtered: its frames come from another origin without permission to read them (${e?.name || e})`, 'bad');
      }
    }
    gl.uniform1f(U.uHas, has ? 1 : 0);
    gl.uniform1f(U.uSize, P.size);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // A frame arrived when the playhead moved. Read off the draw loop rather
  // than requestVideoFrameCallback, because a channel panel whose link is let go
  // hides its picture and a browser may skip presenting what nobody can see.
  function watchFrames() {
    const now = performance.now();
    for (const ch of tv) {
      const v = ch.video;
      if (!playing || v.readyState < 2 || v.currentTime === ch.lastT) continue;
      const first = ch.lastT < 0;
      ch.lastT = v.currentTime;
      // The count is the decoder's own when it has one; draw ticks are not frames.
      ch.lastFrame = now;
      ch.frames = v.getVideoPlaybackQuality?.().totalVideoFrames || ch.frames + 1;
      if (first) { showSize(); d.log(`${ch.c.name}: first frame, ${v.videoWidth}x${v.videoHeight}`, 'hi'); }
    }
  }
  // A channel panel and the blend panel follow their own links: let go, they
  // show their ground.
  function sides() {
    for (const ch of tv) ch.video.classList.toggle('cc-off', !holds(vOut(ch.c), SIDE_IN(ch.c)));
    mix.classList.toggle('cc-off', !holds(MIX_OUT, BLEND_IN));
  }
  function render() { watchFrames(); drawMix(); dither(); sides(); }
  let raf = 0;
  function frame() { render(); if (playing) raf = requestAnimationFrame(frame); }

  // Each channel panel's own resolution, under its own picture.
  function showSize() {
    for (const ch of tv) {
      const v = ch.video;
      ch.res.textContent = playing && v.videoWidth && v.videoHeight ? `${v.videoWidth}x${v.videoHeight}` : '';
    }
  }
  // The footers name no shares (asked 2026-10-10, *"rm ETV 34 ETV2 66"*): the
  // fader's end labels already say which is which. Empty while stopped.
  function showWho() {
    who.textContent = playing ? 'fx blend' : '';
    blendWho.textContent = playing ? 'blend' : '';
    for (const ch of tv) ch.name.textContent = playing ? ch.c.name : '';
  }
  function showDither() {
    if (!gl) { dsize.textContent = 'no WebGL2'; return; }
    if (tainted) { dsize.textContent = 'not filterable'; return; }
    dsize.textContent = playing ? `${P.size} px` : '';
  }

  // ── the fader ───────────────────────────────────────────────────────────
  let x = 0.5;                     // 0 is all ETV, 1 is all ETV2
  const gains = () => [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];   // equal power
  let ctx = null, sum = null, mode = null;   // mode: 'graph' or 'volume'
  function applyFade() {
    // The picture reads x on its next frame; the sound is set here.
    const g = gains();
    tv.forEach((ch, i) => {
      if (mode === 'graph' && ch.gain) ch.gain.gain.setTargetAtTime(g[i], ctx.currentTime, 0.02);
      if (mode === 'volume') ch.video.volume = g[i];
    });
    showWho(); showSize();
    if (!playing) render();
  }

  // The sound follows the links the bay holds, as on /radio/blend/: a channel
  // reaches the fader only along its audio link, the fader the speakers only
  // along fader -> speaker.
  function route() {
    if (mode !== 'graph') return;
    for (const ch of tv) {
      if (!ch.tap) continue;
      try { ch.tap.disconnect(); } catch { /* not connected */ }
      if (holds(aOut(ch.c), FADER_IN)) ch.tap.connect(ch.gain);
    }
    try { sum.disconnect(); } catch { /* not connected */ }
    if (holds(FADER_OUT, SPEAKER_IN)) sum.connect(ctx.destination);
  }

  // Inside the press: one AudioContext, and each element made a source once.
  // An element can only ever be a source once, so this survives stop.
  function soundGraph() {
    if (mode) { ctx?.resume(); return; }
    try {
      ctx = new AudioContext();
      ctx.resume();
      sum = ctx.createGain();
      for (const ch of tv) {
        ch.src = ctx.createMediaElementSource(ch.video);
        ch.tap = ctx.createAnalyser();
        ch.tap.fftSize = 1024;
        ch.buf = new Float32Array(ch.tap.fftSize);
        ch.gain = ctx.createGain();
        ch.src.connect(ch.tap);
        ch.gain.connect(sum);
      }
      mode = 'graph';
      d.log('sound: each picture through MediaElementSource into one AudioContext, equal power');
    } catch (e) {
      mode = 'volume';
      d.log(`sound: no audio graph here (${e?.message || e}), so the fader sets each picture's volume`, 'warn');
    }
    route();
  }

  // ── what lights the wires ───────────────────────────────────────────────
  let playing = false, gen = 0, timer = 0;
  function listen() {
    const now = performance.now();
    for (const ch of tv) {
      if (mode === 'graph' && ch.tap) {
        ch.tap.getFloatTimeDomainData(ch.buf);
        let s = 0;
        for (const v of ch.buf) s += v * v;
        if (Math.sqrt(s / ch.buf.length) > 1e-4) ch.lastSound = now;
      } else if (mode === 'volume' && !ch.video.paused && !ch.video.muted && ch.frames > 0) ch.lastSound = now;
    }
    pb.refresh();
  }
  const fresh = (t) => playing && performance.now() - t < 600;
  const pb = createPatchbay(bay, {
    flowing: (l) => {
      if (l.from === FADER_OUT) return tv.some((ch) => fresh(ch.lastSound));
      if (l.from === MIX_OUT) return fresh(lastMix);
      if (l.from === DITH_OUT) return !!prog && !tainted && holds(MIX_OUT, DITH_IN) && fresh(lastMix);
      const ch = tv.find((t) => l.from === vOut(t.c) || l.from === aOut(t.c));
      if (!ch) return false;
      return l.from === vOut(ch.c) ? fresh(ch.lastFrame) : fresh(ch.lastSound);
    },
  });

  // ── start and stop ──────────────────────────────────────────────────────
  // One channel: one master read, where ERR serves from, one engine on the
  // variant that read returned. As /flipper/, minus its timeline.
  async function open(ch, mine) {
    const c = ch.c, v = ch.video;
    let pl;
    try { pl = await readPlaylist(c.url); } catch (e) {
      d.log(`${c.name}: the playlist did not come (${e.message})`, 'bad');
      return;
    }
    if (gen !== mine) return;
    // ERR blocks live segments by programme. Ask where it serves before playing.
    const served = await findServedEdge(pl, { steps: PROBE_STEPS, backoffS: WALL_BACKOFF_S });
    if (gen !== mine) return;
    if (served?.none) d.log(`${c.name}: ERR refused every point asked, across the whole window`, 'bad');
    else if (served && !served.edgeServed) d.log(`${c.name}: ERR refuses its newest ${Math.round(served.blockedMin)} min, so it starts behind that`, 'warn');
    if (holds(vOut(c), MIX_IN) || holds(aOut(c), FADER_IN)) {
      if (NATIVE_HLS) {
        v.src = pl.variant;
      } else if (window.Hls?.isSupported()) {
        const hls = ch.hls = new window.Hls({ enableWorker: true,
          ...(served?.position != null ? { startPosition: served.position } : {}) });
        hls.loadSource(pl.variant);
        hls.attachMedia(v);
        wallHandler(hls, window.Hls, () => {
          ch.refused = true;
          d.log(`${c.name}: ERR refused three fragments in a row, so loading stopped`, 'bad');
        });
      } else { d.log('this browser cannot play HLS', 'bad'); return; }
    }
    // Unmuted, because a muted element hands the graph silence too.
    v.muted = false;
    try { await v.play(); } catch (e) {
      if (e?.name === 'NotAllowedError') {
        v.muted = true;
        d.log(`the browser refused sound without a press here, so ${c.name} plays muted`, 'bad');
        await v.play().catch(() => {});
      }
    }
    d.log(`${c.name} playing from ${new URL(c.url).host}`);
  }

  async function start() {
    const mine = ++gen;
    playing = true;
    face();
    // Inside the press, before any await, or iOS refuses later.
    for (const ch of tv) armVideo(ch.video);
    soundGraph();
    applyFade();
    showDither();
    d.log('opening ETV and ETV2: two live channels at ERR, which counts them as two viewers', 'warn');
    timer = setInterval(listen, 250);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
    await Promise.all(tv.map((ch) => open(ch, mine)));
    pb.refresh();
  }

  function stop() {
    gen++;
    playing = false;
    clearInterval(timer);
    cancelAnimationFrame(raf);
    for (const ch of tv) {
      if (ch.hls) { try { ch.hls.destroy(); } catch { /* already gone */ } }
      ch.hls = null;
      const v = ch.video;
      v.muted = true;
      try { v.pause(); } catch { /* fine */ }
      v.removeAttribute('src');
      v.load();
      Object.assign(ch, { lastFrame: 0, lastT: -1, lastSound: 0, frames: 0, refused: false });
    }
    ctx?.suspend();
    lastMix = 0;
    render();
    showWho(); showSize(); showDither();
    pb.refresh();
    face();
    d.log('stopped: both engines destroyed, both pictures emptied');
  }
  addEventListener('pagehide', () => { if (playing) stop(); });

  const transport = createButtonGroup({ buttons: [
    { id: 'tv', icon: 'play', label: 'start ETV and ETV2', onPress: () => (playing ? stop() : start()) },
  ] });
  function face() {
    transport.setIcon('tv', playing ? 'stop' : 'play', playing ? 'stop both channels' : 'start ETV and ETV2');
  }

  // The crossfader, its two channels named inside the lane (the kit's `ends`).
  const fader = createSlider({ label: '', aria: 'crossfade', min: 0, max: 1, step: 0.01, value: x,
    ends: [ON_PAGE[0].name, ON_PAGE[1].name], onInput: (v) => { x = v; applyFade(); } });

  const top = el('div', 'cc-top');
  top.append(transport.el);

  // ── the knob: its own node, `web:knob-size`, a turn is one event ─────────
  const knobs = new Map(KNOBS.map((k) => [k.name, createKnob({
    label: k.name, min: k.min, max: k.max, step: k.step, value: k.raw, format: k.format, hand: true,
    onInput: (r) => bay.send(KNOB_OUT(k.name), { of: 'param', name: k.name, v: r }),
  })]));
  const grid = createKnobGrid(knobs, { row: true });

  applyFade();
  // Linear, as every concept instrument: the four pictures, the fader under
  // them (ETV at its left end under ETV, ETV2 at its right under ETV2), then
  // the knobs area, then the patchbay.
  d.stack.add(top, quad, fader.el, grid.el, pb.el);
  window.__demo.knobs = grid;
  window.__demo.tv = {
    fader, mode: () => mode, playing: () => playing,
    footer: () => ({ left: who.textContent, right: dsize.textContent, blend: blendWho.textContent,
      sides: tv.map((ch) => ({ left: ch.name.textContent, right: ch.res.textContent })) }),
    dither: () => ({ gl: !!gl, compiled: !!prog, size: P.size, tainted, mixing: mixHas }),
    channels: () => tv.map((ch) => ({ id: ch.c.id, frames: ch.frames,
      size: ch.video.videoWidth ? `${ch.video.videoWidth}x${ch.video.videoHeight}` : '',
      sound: fresh(ch.lastSound), refused: ch.refused, muted: ch.video.muted })),
  };
  d.ready();
</script>

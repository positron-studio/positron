     two lanes started at different x and were different lengths, in a control
     whose entire job is comparing four values at a glance.

     `createSliderGroup()` is what shares ONE set of columns across all of them —
     `max-content` for the labels, `minmax(0, 1fr)` for the lanes so they take
     the width that is actually there — by making each slider `display: contents`
     so its parts land in the group's columns rather than in a box of its own.
     `{ pair: true }` gives two across above 720 px and stacks below it. This is

     a stacked column of four does not become a metre long on a desktop. This one
     slider is the whole page in one gesture: how much of what you hear is the
     station and how much is the granulator chewing it. It is the widest thing
     here on purpose, and it sits directly under the picture whose grain ticks it
     fades, so the hand and the thing it changes are never more than a line
     apart. A page making a claim about one relationship says so — CLAUDE.md. */
  /* 🔴 TWO GROUPS CANNOT SHARE A COLUMN, AND THAT IS THE WHOLE DEFECT.
     `.sld-group`'s first column is `max-content`, which is exactly right inside
     one group and says nothing across two: the fader's column is sized by
     `RADIO → GRANULATOR` and the four settings' column by `GRAINS A SECOND`,
     so the two grids resolve to different widths and every lane below the fader
     starts at a different x from the fader's. PHOTOGRAPHED on an iPhone, where
     the pair layout is off and all five are stacked in one column — which is
     precisely where a shared column is the entire point.

     CSS has no way to say "these two grids share a track" (subgrid inherits
     from a PARENT grid, and these are siblings). So the width is measured once
     from the widest label and handed to both as `--lab`; `max-content` stays as
     the fallback, so the layout is never worse than it was if the script does
     not run. ⚠️ The pair rule has to be restated here or it is lost: this
     declaration and `.sld-group.pos-pair` are both (0,2,0), and the page's
     <style> comes after the stylesheet, so the page wins the tie on order. */
  .wet-fader { max-width: none; }

  /* 🔴 THE CONTROLS ARRIVE LATE AND EVERYTHING BELOW THEM JUMPED. They cannot be
     built until scsynth is up — about a second — so the fader, the LOOP row, the
     sound picker and the four sliders all appeared at once and shoved the log
     down the page while somebody was reading it. That is the same complaint the
     grain-scope caption earned ("a horrible jump of content each time it
     updates"), arriving through TIME instead of through reflow.
     The space is reserved from the first paint and the controls land INTO it, so
     nothing below ever moves. ⚠️ No border and no background: an empty box that
     paints its edges is a horizontal rule nobody wrote (shell.css says so), and
     this one is empty for the first second of every visit.
     The height is the sum of what goes in — the rows at 34 px plus the shared
     22 px rhythm between them — and it is written as that sum rather than as a
     total, so it can be re-derived when a row is added. ⚠️ IT WAS RE-DERIVED
     WHEN THE LOOP ROW LANDED: one more 34 px row and one more 22 px gap. A
     reserved height that stops matching what lands in it is the jump this rule
     exists to stop, arriving from the other direction.

     🔴 AND IT IS TWO SUMS, BECAUSE THE FOUR SETTINGS ARE TWO ROWS ON A WIDE
     SCREEN AND FOUR ON A NARROW ONE. There was one sum, the narrow one, and it
     over-reserved by 112 px at every width above 720 — MEASURED at 720, 900 and
     1280, all three reading a 314 px box round 202 px of content. That is dead
     space under the sliders which reads as something that failed to render,
     which is the shell's own argument for hiding an empty readout.
     ⚠️ AND IT HAD ALREADY FAILED THE OTHER WAY. `Automate` was appended here as a
     seventh row and neither sum was re-derived for it, so on a phone the slot
     was 56 px SHORT and the thing this rule exists to prevent happened. The
     button is gone (`archive/radio-automate/`); the lesson is that a number
     written as a sum still has to be re-added by somebody. The assert on this
     page reads the box against what lands in it, at whatever width the harness
     is running, so the next row cannot be added without the arithmetic. */
  /* 🔴 AND IT MUST LAY ITS CHILDREN OUT, WHICH THE FIRST VERSION DID NOT.
     `.pos-choice` is a SPAN, and the shell's vertical rhythm reaches the
     children of a `.pos-stack` and nothing deeper. Moving these rows into a
     wrapper took both away at once, so two inline spans flowed onto ONE line
     and landed on top of the fader above them. PHOTOGRAPHED. A flex column
     restores both: block layout, and the same 22 px gap every other element
     gets, from one declaration rather than from the parent's rule. */
  .gran-slot { display: flex; flex-direction: column; gap: 22px; align-items: stretch;
               /* four settings stacked, the fader and the sound row, five gaps */
               min-height: calc(4 * 34px + 2 * 34px + 5 * 22px); }
  /* ⚠️ THE BREAKPOINT IS `.sld-group.pos-pair`'s OWN 720 px, in `shell.css`, and
     it is the one number here that cannot be derived: a reserve that changes at
     a different width from the layout it is reserving for is wrong on both
     sides of the difference. */
  @media (min-width: 720px) {
    /* two settings across, so two rows instead of four, and three gaps */
    .gran-slot { min-height: calc(2 * 34px + 2 * 34px + 3 * 22px); }
  }
  .gran-slot > .pos-choice, .gran-slot > .pos-pick { align-self: flex-start; }
  /* 🔴 EXCEPT ON A PHONE, WHERE A CHOICE ROW IS SUPPOSED TO TAKE THE WHOLE
     WIDTH. `shell.css` puts a `.pos-choice` label on its own line under 560 px
     and gives the group the row, so its options become equal thumb targets —
     and `align-self: flex-start` shrink-wraps the grid instead. MEASURED at
     390 px with the LOOP row in place: 182 px of buttons with 176 px of empty
     slot beside them, under a heading spanning the full width. The desktop
     rule is unchanged, which is why this is an override and not an edit to it. */

    .gran-slot > .pos-choice { align-self: stretch; }
  }
  /* 🔴 SOUND'S LABEL IS IN THE SAME COLUMN AS THE SLIDERS', AND WAS NOT.
     The row is an inline-flex with an 8 px gap, so its label was as wide as the
     word SOUND and the stepper started wherever that ended — while every lane
     below it started at the width of RADIO → GRANULATOR. Two left edges, one
     above the other, off by about a hundred and eighty pixels. ⚠️ `--lab` is
     measured on the sliders and handed here, because CSS cannot say "share a
     track" between siblings (see the note above).

     ⚠️ AND THE GAP IS `--sld-col`, NOT ZERO. That was the third report's OTHER
     half: `.sld-group` is a grid with a 12 px column gap, so a slider's lane
     begins at `--lab` PLUS TWELVE — while this row, with its gap zeroed,
     started at `--lab` exactly. MEASURED by the assert that now guards it:
     `fader 167 · sliders 167 · sound 155`. The twelve is named in `shell.css`
     and read from there, because a shared measurement typed into two files is
     a measurement that will disagree.

     🔴 REPORTED THREE TIMES, AND THE THIRD TIME WAS A DIFFERENT BUG WEARING THE
     FIRST ONE'S CLOTHES. The fix above was written for `.pos-choice`, and then
     the row was rebuilt with `createPicker` — `.pos-pick`, a different
     component with a different label class. `shareLabelColumn()` went on
     setting `--lab` on the element correctly and NOTHING CONSUMED IT, so the
     JavaScript half looked right, the comment beside it described a fix that
     was no longer connected to anything, and the row snapped back to the width
     of the word SOUND. The `align-self` rule on the line above had been updated
     for the rename; these two had not. A COMPONENT SWAP MOVES EVERY SELECTOR
     THAT NAMED THE OLD ONE, and only one of the three got moved.
     ⚠️ Both are listed now rather than one being deleted, because `/kit/` and
     other pages still use `.pos-choice` in this slot. */
  .gran-slot > .pos-choice, .gran-slot > .pos-pick { gap: var(--sld-col); }
  .gran-slot > .pos-choice > .pos-choice-l,
  .gran-slot > .pos-pick > .pos-pick-l { width: var(--lab, max-content); }
  .wet-fader, .gran-rows { grid-template-columns: var(--lab, max-content) minmax(0, 1fr); }

    .gran-rows.pos-pair { grid-template-columns: repeat(2, var(--lab, max-content) minmax(0, 1fr)); }
  }

  /* 🔴 NEITHER BOX DRAWS UNTIL THERE IS SOUND, AND THEY COME UP TOGETHER.
     Before the first sample this page drew an empty bordered rectangle where
     the picture goes, above an empty hole where the controls go: two boxes
     reporting on a stream that had not started. `shell.css` already says a
     container with nothing in it must not paint its edges, and the waveform's
     edges are the canvas's own border rather than anything a page can opt out
     of, so the page turns the ink off instead.

     ⚠️ ONLY THE INK FADES. `opacity` changes no layout at all, so the picture
     and the controls arrive without moving a pixel of what is under them —
     which is the same rule that put `.gran-slot`'s reserved height here in the
     first place, applied to a second axis.

     ⚠️ AND ONE CLASS LIGHTS BOTH, ON ONE FRAME. Two fades hung off two events
     is what the page already did by accident: the waveform appeared with the
     first decoded block and the controls a second later, whenever scsynth
     happened to finish.

     🔴 THE TRANSITION IS ON THE LIT STATE, NOT ON THE DARK ONE, AND THAT IS NOT
     TIDINESS. With it on `.awaits-sound` the class is a fade OUT as well as a
     fade in, and the two boxes take that fade differently: the scope's wrapper
     has already been measured by its own `ResizeObserver` setup, so it has a
     resolved opacity of 1 to transition away from, while the slot is a div that
     has never been laid out and simply starts at 0. MEASURED, that is exactly
     what happened: `1 and 0 opaque with no feed` at the same frame, from one
     statement that set both. On the lit state there is nothing to fade out of
     and the fade in still runs. */
  .awaits-sound { opacity: 0; }
  .awaits-sound.sounding { opacity: 1; transition: opacity 450ms ease; }

  /* ⚠️ ONE VERTICAL RHYTHM, INCLUDING INSIDE THE GROUP. MEASURED down this page
     at 1100 px: scope → fader **22**, fader → first row **22**, first row →
     second row **10**. The first two are `shell.css`'s stack rhythm; the
     last is `.sld-group`'s own `row-gap`, which is tuned for a tall stack of
     related sliders and is the odd one out here, where there are two rows under
     a fader that is spaced at 22. Three gaps down one column, one of them
     different, reads as the bottom pair being a subgroup of something — which
     they are not. (0,2,0), so it beats the kit's rule on weight rather than on
     source order: the day that becomes a tie is the day it silently stops. */
  .gran-rows { row-gap: 22px; }

  /* The in-band title, and the slot that says when there is nothing to play.
     ⚠️ ONE ELEMENT FOR BOTH, because they answer the same question — what am I
     hearing — and two lines stacked here would leave one of them empty and
     reserving space for nothing. `min-height` holds the line so the page does
     not jump the first time the station names a track. */
  /* ⚠️ NOT BOLD. This is the name of whatever the station is playing — a
     filename half the time, `01_EMA_Improvisation_I` — and at 600 weight in the
     highlight colour it read as the most important thing on a page whose
     subject is the sound, not its label. It is a caption: it says what you are
     hearing, it changes when the programme does, and it does not need to
     shout. */
  .now { font: 400 13px/1.5 var(--mono); color: var(--hi); min-height: 20px; }
  .now.down { color: var(--bad, #ff7a7a); }

  /* 🔴 NO RULE HERE FOR A CONTROL THAT IS A STATE, AND THE ABSENCE IS THE
     RECORD OF ONE. `Automate` was a toggle in this page's control row and
     carried `.pos-controls button[aria-pressed="true"]` so its armed state
     showed without the label changing width. Button, tour and rule left
     together on 2026-09-16; see `archive/radio-automate/`. What moves a control
     by itself now is the slider's own hand button, and `shell.css` owns how
     that looks, on every page that has one. A page-local copy of a kit
     component's look is the drift this file has already paid for twice. */
</style>

  // Radio 1965 is a real station: one Icecast mount run by the Estonian Centre

  // relay, and that is not a convenience.
  //
  // 🔴 THEIR MOUNT IS PLAIN HTTP ON PORT 8001. A page served over HTTPS may not
  // load it at all — the browser refuses the mixed-content fetch before any
  // CORS question is asked — so without the relay this page would have nothing
  // to play, not merely nothing to measure. The relay also adds the
  // `access-control-allow-origin` their Icecast omits, and THAT is what lets
  // WebAudio see the samples: `createMediaElementSource` on a cross-origin
  // element with no CORS gives a graph that outputs SILENCE while the speakers
  // play normally. The `WebAudio can see the samples` check catches exactly that.
  const BASE = new URLSearchParams(location.search).get('base')
    || 'https://shout.positron.studio';
  // 🔴 TWO STATIONS, AND THE SECOND IS NOT A FEATURE — IT IS WHAT MAKES THIS

  // and it goes down: MEASURED 2026-09-14, `live.uuu.ee:8001` accepted the TCP
  // connection and then sent zero bytes on every path, so the relay answered
  // `origin 520` and this page had nothing at all to show — no sound, no
  // granulator, and nine red asserts about a defect that was not ours.
  // Klassikaraadio is ERR's, on the same relay and the same 128 kbps MP3, and it
  // was up in the same second. A page about a live stream needs a live stream.
  //
  // ⚠️ THE ORDER IS THE PREFERENCE. Radio 1965 first because it is what this
  // page is for; the fallback is automatic and says so in the log rather than

  //
  // ⚠️ THE THIRD COLUMN IS THE STATION'S NOMINAL BITRATE, and it is here rather

  // every run for a station that is behaving perfectly. It is read from here
  // and nowhere else.
  const STATIONS = [
    // Radio 1965 removed 2026-09-15 at the uuu.ee operator's request.
    ['Klassika', 'klassikaraadio', 128],
    ['Viker', 'vikerraadio', 128],
    ['R2', 'raadio2', 128],
    // 🔴 THE RELAY CARRIES SIX ERR MOUNTS AND THIS PAGE OFFERED FOUR, which is
    // why it collapsed today rather than fell back. MEASURED 2026-09-15: the
    // only two mounts answering 200 anywhere were `raadio4` and
    // `raadiotallinn`, and NEITHER WAS ON THIS LIST, so a page whose whole
    // design is "a station goes down, take the next one" reported `none of the
    // 6 mounts answered` while two were playing perfectly through the same
    // relay. The fallback was real and had nowhere to fall.
    // ⚠️ THE COST OF A LIST THAT IS SHORTER THAN THE RELAY'S IS INVISIBLE UNTIL
    // AN OUTAGE, which is the one moment it matters. `shout`'s `/health` knows
    // all eight; this array is the only place that disagreed.
    ['R4', 'raadio4', 128],
    ['Tallinn', 'raadiotallinn', 128],
    // 🔴 IDA RADIO IS AAC, NOT MP3, AND IT IS THE FIRST STATION HERE THAT IS.
    // `mp3-stream.mjs` picks its frame scanner off the response's
    // `content-type` — `audio/mpeg` against `audio/aac` — so nothing on this
    // page has to know. MEASURED 2026-09-15 through the relay and direct:
    // AAC-LC `mp4a.40.2`, 44,100 Hz stereo, settled 322 kbit/s against 320
    // nominal, decoded by WebCodecs with 0 errors.
    //
    // ⚠️ THEIR IN-BAND TEXT CHANNEL IS ALIVE AND EMPTY. The slots arrive on
    // schedule and carry `StreamTitle=' - '`, so the station's name comes from
    // the ICY header and the "now playing" line stays blank. That is what the
    // station sends, not something missing here.
    //
    // 🔴 BACK 2026-09-16, ON INSTRUCTION AND ON THE USER'S OWN CONDITION:
    // *"bring ida's back to radio (if single listener)"*. They were taken out
    // on 2026-09-15 because their operator counted roughly 100 concurrent
    // clients against their limit and traced them to positron.studio. The relay
    // now holds ONE upstream connection per mount and copies it to every
    // subscriber, so what their server counts is one. `workers/shout/worker.mjs`
    // carries the mechanism, the readout that proves it, and the caveat that
    // the operator has not been asked again.
    // ⚠️ LAST, AND THAT IS THE PART THAT MATTERS. The original harm was one
    // line that moved these two to the FRONT of this array: the page opens the
    // first entry it finds, so every visitor and every harness run landed on
    // their server at 320 kbit/s. Do not move them up.
    ['Ida TLL', 'ida-tallinn', 320],
    ['Ida HEL', 'ida-helsinki', 320],
    // 🔴 RADIO 1965 IS BACK, LAST, 2026-09-16: *"bring back radio65 stream as
    // last"*. One volunteer-run Icecast mount at the Estonian Centre of
    // Contemporary Music, removed on 2026-09-15 when their operator counted
    // roughly 100 concurrent clients from here. The relay tees now, so what
    // they count is one, and the suite runs against `demo/fake-station.mjs`
    // rather than against them. LAST is not a ranking: a page opens the first
    // entry it finds, and being at the front is what did the damage.
    ['Radio 1965', 'radio1965', 128],
  ];
  /**

  const PREFERRED_ID = 'radio';
  const indexOfId = (id) => STATIONS.findIndex(([, s]) => s === id);
  let station = DEFAULT_ID;
  const PROBE_MS = 6000;            // long enough for a cold relay, short enough to act on
  // ⚠️ A CROSS-PAGE URL, AND IT IS CHECKED AT BUILD TIME. The compiled graph

  const DEFS = '/grains/defs/';
  const SPAN_MS = 3 * 60 * 1000;    // the opening view
  const MEASURE_MS = 5000;

  const BUF_SECONDS = 8;                 // Pappus `mbuflen`, the held seconds

  /**

    onLoop: (what) => {
      if (!ctx || !looper.attached()) return;
      if (what === 'fill') {
        looper.keep();
        // 🔴 AND THE PICTURE IS TOLD, WHICH IT WAS NOT. The scope grew three
        // marks for exactly this and nothing ever called them: MEASURED on a
        // driven page, `frozen: true` with `marks: 0`, so the loop's ends were
        // never drawn and the grain ticks, which are placed BETWEEN those two
        // marks, had no span to be placed in. That is the whole of the report
        // that no grain lines show during a loop.
        scope.loopFrom();
        // 🔴 NOTHING SAID ABOUT IT, ON INSTRUCTION 2026-09-16: *"rm all loop
        // messages."*. The button is armed, the wave has the mark on it and the
        // tint is growing from it; a line of prose is a third channel.
        return;
      }
      if (what === 'set') {
        // The window is full. Take the live path down, put the recorded seconds
        // up in its place, and let them run round.
        const secs = looper.close();
        // A window that caught nothing is not a loop, and the looper has already
        // said so in the log.
        if (!secs) return;
        scope.loopTo();          // the wave stops here, and this is where it stopped
        // ⚠️ THE STATION'S WAY IN, NOT THE FADER. Writing to `dry` silenced the
        // speakers and left the granulator on the live station, and it also
        // moved a number the fader owns, so the next `setWet` put the station
        // back underneath the loop.
        liveIn.gain.setTargetAtTime(0, ctx.currentTime, 0.012);
        // 🔴 AND THE GRAINS ARE TUNED TO IT. See `lockGrainsToLoop` — the loop
        // is an exact number of samples and the grain clock is a phasor in the
        // same context, so the two can be made commensurate rather than merely
        // close.
        lockGrainsToLoop(secs);
        return;
      }
      if (what === 'off') {
        looper.stop();
        lockGrainsToLoop(null);  // the patch's own grain rate back
        scope.loopOff();         // the wave catches up with live again
        liveIn.gain.setTargetAtTime(1, ctx.currentTime, 0.012);
        d.log('back to the station', 'hi');
      }
    },
    /**
     * 🔴 WHERE IN THE LOOP YOU ARE, ON THE WAVE. The picture freezes at the
     * clock it stood at and a one pixel line runs across it, rather than the
     * wave rescaling or scrolling on: the x axis is the thing you are reading,
     * so it must not move while you are reading it. Nothing is pushed while the
     * window is still FILLING, which is correct, because then the sound really
     * is still arriving and the wave should still scroll.
     *
     * 🔴 THE TICK IS THE BAR'S AND THE NUMBER IS THE VOICE'S, AND THAT SPLIT IS
     * WHAT THE LOOP ROW COST. `f` is how far the DECK has got through the
     * window, which was the same thing as the sound right up until the loop
     * could be played backwards, at half speed, or a slice at a time. Under
     * `back` the deck's fraction runs the wrong way; under `half` it runs twice
     * too fast; under `chop` it sweeps seconds nobody is hearing. Three
     * pictures that would each look like a working playhead and each be a lie
     * about what is coming out, so the looper's own `headFrac()` reads the
     * voice's clock instead. The 60 Hz tick still comes from here, because a second rAF loop
     * in a page is the thing `transport-bar.mjs` exists to stop, and `f` is
     * still the answer for the frame before a voice exists.
     */
    onLoopPos: (f) => scope.playhead?.(f == null ? null : (looper.headFrac() ?? f)),
  });
  // 🔴 THE BUTTON EXISTS ONLY NOW, WHICH IS WHY THE FACE IS WRITTEN FROM ONE
  // PLACE AND THAT PLACE IS THE LOOPER. A way reached from the code and a way
  // reached by pressing cannot then disagree about what is showing, which is
  // the `shareLabelColumn` lesson in a smaller costume.
  looper.bind(bar);

  /**
   * 🔴 THE BADGE WHERE THE CLOCK USED TO BE SAYS `on air`, AND WHAT MAKES IT
   * TRUE IS SOUND ARRIVING. It was a `LIVE` chip: a word drawn because this
   * page passed `live: true` at build time, so it stood whether or not a byte
   * of this station had ever reached the browser. Half of these eight mounts
   * are typically down, so the one thing the word claimed was the one thing it
   * could not know.
   *
   * ⚠️ IT IS FED FROM BLOCKS DECODED, NOT FROM A PRESS. The 1 Hz tick below
   * compares `stream.stats().blocks` against the last reading, so what the
   * badge reports is audio this page actually has. On `?decode=0` the element
   * owns the sound and its `currentTime` is the same evidence.
   * ⚠️ AND SILENCE IS ONLY EVIDENCE ONCE SOMEBODY HAS ASKED FOR SOUND, which
   * is what `since: null` says: before the first press the badge reads
   * `unknown`, not `off air`. A station is not off the air because nobody in
   * this browser is listening to it.
   * ⚠️ `tuning in` EXPIRES. Eight seconds is this page's patience with a mount
   * that accepted the connection and sent nothing, after which the honest word
   * is `off air`. Without a limit a dead mount reads as one that is still
   * coming up, for ever.
   */
  const onAir = bar.api.live;
  const onAirIdle = () => onAir.follow({ everyMs: 1000, misses: 4, since: null, comingMs: 8000 });
  onAirIdle();
  // blocks decoded, or seconds the element has played. -1 means nothing is open.
  let heardMark = -1;

  // ── the picture ────────────────────────────────────────────────────────────
  // 🔴 TWO PICTURES, AND THE COMPONENT CHOOSES BY WHAT IT IS GIVEN. Before the
  // granulator exists there are no grains to draw, so this is `feed()`: a
  // scrolling waveform of the audio that arrived, and the gutter says in words
  // that it is all that can be honestly shown. Once Pappus is running, every
  // tick is a grain the ENGINE reported firing — `SendReply.ar(… '/pgrain' …)`
  // from inside the graph — never a grain inferred from an envelope, which
  // might be a note or a delay tap.
  // ⚠️ A LOCKED SCALE, because this is a stream and not a held buffer. Left on
  // the default the picture renormalises to whatever is loudest in the last six
  // seconds, so it heaves every time a loud passage leaves the right edge and a
  // quiet stretch draws the same as a loud one. `fullScale: 1` means the height
  // is an amplitude: 1.0 fills it, and a quiet passage looks quiet.
  // 🔴 THE WINDOW IS THE BUFFER, READ FROM THE SAME CONSTANT. It asked for 6 s
  // over an 8 s buffer, so the oldest quarter of the granulator's range could
  // not be drawn: every grain read from there landed left of the picture and
  // was skipped. Whenever the read head sat in that quarter the page showed no
  // grains at all, and that was read as the station being off air. Two numbers
  // that have to agree are one number; `createGrainScope` refuses the pair now.
  const scope = createGrainScope(d.el, { seconds: BUF_SECONDS, height: 140, fullScale: 1,
    // the granulator's buffer is filled from THIS audio, so grain positions and
    // this axis are the same seconds. See the note in grain-scope.mjs.
    grainSeconds: BUF_SECONDS });

  scope.source('the radio, as it arrives');
  // A handle for a lab probe, like `__stream` and `__eng` below; harmless in a
  // page. It is also how the picture can be driven by hand while the live loop
  // that will own its playhead is being built elsewhere.
  window.__scope = scope;

  // The space the granulator's controls will occupy, reserved now so their
  // arrival a second from now moves nothing. See `.gran-slot` in <style>.
  // ⚠️ It uses the shell's own vertical rhythm by being an ordinary sibling —
  // the gap above and below it is the same 22 px every other element gets, so
  // the reserved block is not a special case that has to be kept in step.
  const granSlot = el('div', 'gran-slot');
  scope.el.after(granSlot);

  /**
   * 🔴 THE BAR AND THE PICTURE IT DRIVES ARE ONE SURFACE. Asked 2026-09-18:
   * *"just glue the 4 we have properly"*. Gluing is a CLAIM that two blocks are
   * one object, which is true here and is not true of most neighbours: this bar
   * has no scrub of its own precisely because the picture below it IS the
   * position surface, so the page rhythm's 22 px between them was drawing a gap
   * across the middle of a single control.
   *
   * ⚠️ IT IS INSERTED WHERE THE PICTURE WAS, NOT APPENDED. `createGlue`
   * re-parents the blocks into a box and hands it back WITHOUT putting it
   * anywhere, so a page that only calls it loses both blocks off the page. The
   * slot that reserves room for the granulator's controls has to stay below,
   * which is what the insertion point is for.
   */
  d.el.insertBefore(createGlue(bar.el, scope.el), granSlot);

  // ── neither box draws until there is sound ─────────────────────────────────
  //
  // 🔴 REPORTED: *"the waveform and granulator boxes must not draw with no live
  // feed, and fade in together when sound starts."* Both were visible on a page
  // nobody had pressed play on — an empty bordered rectangle and an empty hole
  // under it, drawn about a stream that had not started. The room stays
  // reserved and only the ink fades; see `.awaits-sound` in <style>.
  //
  // ⚠️ THE GATE IS THE SAMPLES, NEVER A PROMISE. `ctx.resume()` and
  // `audio.play()` both wait on a gesture and NEITHER REJECTS, so a fade hung
  // off either would never run on a page that is playing perfectly. What lights
  // these is `meterTick` reading a non-zero sample off the analyser, which is
  // the quantity the picture is of.
  //
  // ⚠️ AND IT WAITS FOR THE CONTROLS, WITH A DEADLINE. Together means one
  // frame, and the granulator's controls cannot exist until scsynth is up about
  // a second after the first sound — so the picture waits for them. It cannot
  // wait for ever: this page already promises that an engine which refuses
  // leaves a working radio behind, and a picture held back by a boot that never
  // finished would break exactly that promise.
  const LIGHT_WAIT_MS = 6000;
  scope.el.classList.add('awaits-sound');
  granSlot.classList.add('awaits-sound');
  /**
   * What the fade actually did, read off the page rather than off this code.
   * `dark` is the pair of opacities at a frame when nothing had been heard;
   * `gap` is the worst difference between the two while they came up, which is
   * how two boxes that lit separately would show. An assert written from the
   * same statement that adds the class would prove only that the statement ran.
   */
  const LIT = { dark: null, darkWhen: '', heardAt: null, builtAt: null,
    at: null, why: '', gap: null, pair: null };
  requestAnimationFrame(() => {
    LIT.dark = [scope.el, granSlot].map((e) => Number(getComputedStyle(e).opacity));
    LIT.darkWhen = `nothing pressed, peak rms ${rmsPeak.toFixed(4)}`;
  });
  function lightBoxes(why) {
    if (LIT.at != null) return;
    LIT.at = performance.now(); LIT.why = why;
    // Both in one statement, so both transitions start on the same frame.
    for (const e of [scope.el, granSlot]) e.classList.add('sounding');
    let n = 0;
    const watch = () => {
      const pair = [scope.el, granSlot].map((e) => Number(getComputedStyle(e).opacity));
      LIT.gap = Math.max(LIT.gap ?? 0, Math.abs(pair[0] - pair[1]));
      LIT.pair = pair;
      if (++n < 48) requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
  }
  /** @param {'sound'|'controls'} which — one of the two things being waited on. */
  function boxesReady(which) {
    if (which === 'sound' && LIT.heardAt == null) {
      LIT.heardAt = performance.now();
      setTimeout(() => lightBoxes('the granulator never arrived'), LIGHT_WAIT_MS);
    }
    if (which === 'controls' && LIT.builtAt == null) LIT.builtAt = performance.now();
    if (LIT.heardAt != null && LIT.builtAt != null) lightBoxes('sound, and the controls with it');
  }

  // ── how this works, last on the page ──────────────────────────────────────
  //
  // 🔴 LAST, AND THAT IS THE DECISION. `/grains/` puts its picture FIRST, and
  // that was right there: it is a page about a shape — the same program at two
  // ends of a wire — so the shape is what it is showing you. This page is about
  // a SOUND. The first thing wanted here is the sound, and a diagram between
  // somebody and the play button is an explanation nobody asked for yet. So the
  // picture waits at the bottom for the reader who got interested.
  //
  // ⚠️ THE HEADING IS NOT TYPED HERE. `how: true` writes the standing one from
  // `diagram.mjs`, because every page that ends this way has to end it with the
  // same three words — see HOW.
  //
  // ⚠️ AND EVERY BOX IS A THING THAT EXISTS, NOT A STAGE IN A STORY. `an MP3
  // reader` is `mp3-frames.mjs`, `a granulator` is the compiled Pappus graph,
  // `the movement` is `pappus-mod.mjs`. A picture drawn out of nouns the code
  // does not have is a picture of a program somebody meant to write.
  const dg = createDiagram(d.el, {
    caption: 'The station only speaks plain http, so a secure page cannot fetch it at all.',
    nodes: [
      { id: 'stn', label: 'Icecast', sub: 'port 8001', kind: 'device', tech: 'station',
        note: 'One mount run by the **Estonian Centre of Contemporary Music** in Tallinn, sending **128 kbit/s MP3** that never ends. It is one volunteer server and it goes down, which is why this page can switch stations.' },
      { id: 'cf', label: 'Cloudflare', sub: 'a CORS proxy', kind: 'cloud', tech: 'cloudflare',
        note: 'Fetches the stream over plain http, which a secure page may not do, and hands the bytes on over https. It adds two headers the station omits: **allow-origin** for the samples, **expose-headers** for the track title.' },
      { id: 'page', label: 'browser', kind: 'here', tech: 'browser',
        note: 'Everything below runs in the browser you are reading this in, and **nothing '
            + 'goes back**: the station is not told you are here.',
        children: [
          { id: 'mp3', label: 'MP3 scanner', sub: 'custom-made',
            note: 'Finds where each MP3 frame begins, reading **headers only and never the '
                + 'audio**. What comes out goes two ways: eight seconds of sound for '
                + '**scsynth** to chew, and a measurement the **control clock** rides.' },
          { id: 'mod', label: 'control clock', sub: '25 Hz, OSC',
            note: 'A plain **setInterval** at 25 Hz reading every source off the **AudioContext** clock rather than counting up, so a late tick costs resolution and never the beat. 25 Hz because **scsynth** puts each control through a 20 ms **Lag.kr**.' },
          { id: 'gran', label: 'scsynth', sub: 'SuperCollider', tech: 'sound',
            note: 'SuperCollider\u2019s real sound server, compiled to run in a **browser**. '
                + 'It is handed one instrument at boot and **never rebuilt while it plays**.' },
        ] },
    ],
    links: [
      { from: 'stn', to: 'cf', label: 'MP3 over http',
        note: 'A continuous MP3 stream with no end. The track titles travel **inside it** '
            + 'rather than as headers: every 16000 bytes the server slips in a block naming '
            + 'what is playing.' },
      { from: 'cf', to: 'mp3', label: 'MP3 over https',
        note: 'The same bytes the station sent. What changed is where they came from, '
            + 'which is the difference between a stream a page can only hear and one it can '
            + 'measure.' },
      // 🔴 NO ARROWS BETWEEN THE THREE THINGS IN THE PAGE, AND THAT IS A
      // DRAWING DECISION RATHER THAN A MISSING FACT. They were there and the
      // layout could not place them: three children are one column, so a link
      // between two of them is routed out round the container and comes back
      // hugging its edge — a line that reads as "something goes past here"
      // instead of "this feeds that". The tie down their left says they are one
      // chain, and what flows between them is in each box's own note, which is
      // where a reader is already looking.
      // 🔴 NO `speakers` BOX AND NO ARROW INTO ONE. Removed on instruction
      // 2026-09-16: *"rm 'speakers' and its connector from radio diagram"*. It
      // was the last box in the row and it said what every diagram of an audio
      // path ends with, which is that the sound comes out: a reader on a page
      // they are listening to already knows. What it carried that the picture
      // does not is that the station and the grains arrive there ALREADY MIXED,
      // through one graph rather than two players, and that is a fact about the
      // granulator rather than about a speaker.
    ],
  }, { how: true, atEnd: true });

  /**
   * 🔴 THE PICTURE IS GRADED, AND UNTIL 2026-09-20 THIS PAGE THREW THE ONLY
   * HANDLE ON IT AWAY. `createDiagram` RETURNS what it had to give up: a label
   * that did not fit the box, a note over the word budget, a link it could not
   * route. Every one of those is reported on `cuts` rather than ellipsised at
   * the reader or dropped in silence, **because an author cannot see their own
   * missing arrow**. Calling it as a statement and discarding the return meant
   * nothing on this page could ever report any of that.
   * ⚠️ THE FAILURE IT GUARDS IS NOT HYPOTHETICAL. `/station/` lost three real
   * arrows for two sessions exactly this way: they were refused, the refusal
   * went to a `console.warn` nobody read, and the picture looked complete while
   * claiming a chain that does not exist.
   * ⚠️ AND IT RUNS FOR EVERYBODY, because the diagram is on the page whether or
   * not anybody presses anything, and reading its own geometry costs nothing.
   */
  d.assert('the diagram drew every name and every arrow whole',
    dg.cuts.length === 0,
    dg.cuts.map((c) => `${c.where} ${c.id}`).join(', ') || 'nothing cut, nothing refused');


  // ⚠️ THE FIRST PLAY MUST HAPPEN INSIDE THE GESTURE. A browser refuses
  // `audio.play()` from a timer, so the 1 Hz mirror below can keep the element
  // in step with the deck but cannot START it — the press on the bar's own
  // button is the only moment the browser will accept, and it is gone by the
  // next tick.
  //
  // ⚠️ AND IT LISTENS FOR `click`, NOT `pointerdown`. `verify.mjs` drives this
  // page with `document.querySelector('.tbar-toggle').click()` — no pointer
  // events at all — so a pointerdown hook would work under a finger and never
  // once under the harness, which is a page that is only tested by hand.
  // Capture-phase, so it runs BEFORE the bar's own handler flips the deck:
  // `deck.playing()` is still the state before this press.
  bar.el.addEventListener('click', () => {
    if (deck.playing()) {                       // this press is a pause
      // Nothing is being asked for any more, so there is nothing to report: the
      // badge goes back to `unknown` rather than accusing the station of having
      // died because a listener stopped listening.
      onAirIdle();
      return;
    }
    onAir.coming();
    startListening();
  }, { capture: true });

  // BOTH ENDS MOVE, once a second: the right edge is now, and the left trails it.
  setInterval(() => {
    const t = Date.now();
    deck.setRange([t - SPAN_MS, t]);
    // 🔴 `played()` COMES FROM THE ELEMENT, NOT FROM THIS TIMER, and that is
    // what makes the number below survivable. `audio.currentTime` counts only
    // while sound is actually playing, so pauses fall out for free and no
    // counter can drift from them.
    //
    // ⚠️ AND A HIDDEN TAB IS WHERE A COUNTER WOULD LIE. Chrome clamps a
    // background `setInterval` to 1 s and, after a few minutes, throttles it far
    // harder — so a self-incremented "seconds listened" would stall while the
    // radio kept playing, while `behind`, computed against the wall clock, would
    // climb to minutes of "you missed this" for somebody who missed nothing.
    // 🔴 BEHIND — the one number a live stream with a pause button owes you.
    // An Icecast mount has no past to seek to, so pausing does not hold your
    // place: it drops you, and resuming rejoins at the live edge while the
    // seconds you missed stay missed. This counts them. It sits still while you
    // listen and grows while you do not, which is exactly when it matters.
    if (heardFrom != null) {
      d.set('behind', Math.max(0, (Date.now() - heardFrom) / 1000 - played()).toFixed(0));
    }
    // ⚠️ THE ELEMENT PATH CAN ANSWER NEITHER OF THESE AND SAYS SO. With
    // `?decode=0` there is no queue of ours to starve and no frames of ours to
    // drop, so both cells go to one em dash rather than to a confident 0.
    const sst = DECODE && stream ? stream.stats() : null;
    // 🔴 THE `on air` BADGE, FED BY WHAT ARRIVED SINCE THE LAST TICK. A count
    // that went UP is audio this page has in hand; a count that stood still for
    // four of these is a mount that has stopped sending. Nothing here asks
    // whether the deck is playing, because that is the page's own intention and
    // the badge is about the station.
    {
      const heard = DECODE
        ? (sst ? sst.blocks : -1)
        : (!audio.paused && audio.currentTime > 0 ? audio.currentTime : -1);
      if (heard > heardMark) onAir.seen();
      heardMark = heard;
    }
    if (sst) {
      d.set('buffer', sst.buffered.toFixed(2));
      // `skipped` is deliberately NOT in here. It is the opening burst trim,
      // windowed to the first four seconds, and it reaches 53 on an ordinary
      // healthy start — a number that alarms every time it is read is a number
      // nobody reads twice. What this counts is audio that went missing after
      // the stream settled: a starved queue, and frames arriving too late to use.
      d.set('lost', sst.underruns + sst.dropped);
      /**
       * 🔴 THE TIGHTEST CUSHION AFTER THE STREAM HAS SETTLED, NOT WHILE IT IS
       * FILLING, AND THE BOUNDARY IS THE MODULE'S OWN.
       *
       * This took every reading, so the smallest number it ever saw was the
       * first one after audio started arriving, which is the queue part way
       * through being built rather than a cushion that got thin. On the open
       * internet the first lump is big enough to hide that; on a local link it
       * is not. MEASURED against the stand-in: `33 ms of sound in hand` on a
       * stream that then held its 600 ms floor for the whole run, and the assert
       * below went red about a page that was working.
       *
       * ⚠️ FOUR SECONDS, READ FROM `startedAt`, WHICH IS THE SAME WINDOW
       * `mp3-stream.mjs` USES to call a dropped block `skipped` rather than
       * `dropped`. Inventing a second settling period here would be a number
       * that could disagree with the one the player acts on.
       */
      const settled = sst.startedAt > 0 && ctx.currentTime - sst.startedAt > 4;
      if (settled && sst.buffered > 0 && sst.buffered < tightest) tightest = sst.buffered;
    } else {
      d.set('buffer', '');
      d.set('lost', '');
    }
    // 🔴 THE BAR MUST BE ABLE TO STOP THE SOUND, AND IT COULD NOT.
    // `mediaMaster` runs one way only — its own doc says *"a paused/ended
    // master pauses the deck, and a running one resumes it"* — so the ELEMENT
    // drives the deck and nothing drove the element. Pressing pause stopped the
    // playhead and left the radio playing, which is a transport bar lying about
    // the one thing it is for. Reported from the page, not from a test.
    if (started) {
      if (DECODE) {
        // An Icecast mount has no pause: stopping drops you and playing rejoins
        // at the live edge, which is exactly what BEHIND already reports.
        if (deck.playing() && !stream) openStream();
        else if (!deck.playing() && stream) closeStream();
      } else if (deck.playing() && audio.paused) audio.play().catch(() => {});
      else if (!deck.playing() && !audio.paused) audio.pause();
    }
    // 🔴 GRAINS FOLLOWS THE PATCH, AND BEFORE THE PATCHES IT DID NOT HAVE TO.
    // This cell used to be written ONCE, from the boot measurement, and that was
    // defensible while the page had one grain rate: `mrate` never moved unless a
    // hand moved it. Six patches span 0.9/s to 26/s and multiply that by their
    // own chord and rhythm, so a cell frozen at the opening patch's 5.6 would
    // read 9 under `dust`'s hundred and twenty-four — a stale measurement, which is
    // worse than a constant because it looks live (CLAUDE.md: every readout cell
    // must be able to change, and this one had stopped being able to).
    //
    // ⚠️ A NUMBER IN A CELL, AT ONE HERTZ, WHICH IS WHERE A CHANGING NUMBER GOES.
    // The cell is a fixed box with `tabular-nums`, so it cannot reflow the page
    // under somebody reading it — unlike a sentence, which is the thing that
    // rule exists about.
    // ⚠️ AND THE ASSERT DOES NOT READ THIS. It grades `lastRate`, the boot
    // measurement taken over a known window with a known patch loaded; a cell
    // that anybody can change by pressing `›` is not evidence about anything.
    // ⚠️ `Math.max(0, …)` BECAUSE THE COUNTER IS RESET ONCE, in `startGranulator`
    // just before the boot window — without it the first tick after that reset
    // reports a negative rate.
    if (eng && G.running) {
      const now = performance.now();
      const dt = (now - grainsAt) / 1000;
      if (dt > 0.25) {
        d.set('grains', (Math.max(0, grains - grainsSeen) / dt).toFixed(1));
        grainsSeen = grains; grainsAt = now;
      }
    }
    // 🔴 THE ONE LINE THAT SEPARATES EVERY CANDIDATE, once a second.
    // `ctx` running vs suspended; the ELEMENT playing vs not; `rms`, which is
    // whether WebAudio can hear the element AT ALL and is the whole question on
    // iOS; `eng`, which answers "is it a loading problem" outright; and whether
    // the graph is firing grains. Any two of these disagreeing names the fault.
    if (REPORTING && started) {
      ship(`ctx=${ctx ? ctx.state : 'none'} sr=${ctx ? ctx.sampleRate : '-'}`
        + ` session=${navigator.audioSession ? `${navigator.audioSession.type}/${navigator.audioSession.state}` : 'unsupported'}`
        + (DECODE
          ? ` decode=${JSON.stringify(stream ? stream.stats() : null)}`
          : ` el={paused:${audio.paused},t:${audio.currentTime.toFixed(1)},ready:${audio.readyState},net:${audio.networkState},err:${audio.error ? audio.error.code : '-'}}`)
        + ` rms=${rmsPeak.toFixed(4)} fed=${scope.stats().inferred}`
        + ` eng=${eng ? Math.round(eng.bootMs) + 'ms' : 'not booted'} grains=${grains}`
        + ` station=${station} wet=${wet.toFixed(2)}`);
    }
  }, 1000 / RANGE_HZ);

  let liveIn = null;   // the station's way in, taken down while a loop plays

  // What leaves this page, measured there rather than upstream of the fader.
  let sink = null, sinkBuf = null, sinkPeak = 0;

  // the transport-stop check shuts it deliberately — and reading the path off a
  // null stream printed `via nothing` about a path that had just decoded 16 s.
  let decodePath = '';

  // holds two of them — MPEG audio and AAC — and "the page decoded the stream
  // itself" is a weaker claim than it looks if it cannot say WHAT it decoded.

  /** Point the decoded path at the current station. Safe to call again. */

    closeStream();

        // slots arrive on schedule and the one that carried anything carried
        // `StreamTitle=' - '` — the separator with an empty artist and an empty
        // name. Printing it would put "now playing: -" above the picture, which
        // reads as a page that lost the title rather than a station that sent
        // none. Anything with no letter or digit in it is nothing.
        if (!/[\p{L}\p{N}]/u.test(t)) return;

      log: (m) => { d.log(m); ship(m); },

    // granulator reads and what the analyser measures, so a loop that wants to
    // BE the material has to arrive there; the only way to do that without two
    // sources summing is a gain on the live path that the loop can take down.

  // stream counts in context seconds since its first block was scheduled.

  // warm-up, "did it play" — has to come from ONE of these or the page reports
  // two different answers to one question depending on a query parameter.

  // but none of it reaches you until you move the fader — so the first thing
  // this page does is play a radio station, and the instrument is something you
  // bring in. At 0.85, which is where it used to land the instant the button was
  // pressed, the station was gone before anybody had heard it arrive.
  //
  // ⚠️ AND THE ASSERTS ARE UNAFFECTED BY THIS, WHICH IS WHY IT IS SAFE.
  // `bootScsynth` wires `sonic.node → meter → out`, so the engine's own meter is
  // UPSTREAM of the wet gain: `engLevel()` reads what the granulator is making
  // whatever the fader is set to. A deafness control that went quiet merely
  // because the blend was dry would be measuring the fader.
  let eng = null, grains = 0, wet = 0, sliderRow = null, lastRate = '';
  // The rolling window the GRAINS cell is computed over — see the 1 Hz tick.

  let sliders = null, patchPick = null, shareLabelColumn = null;

  let faderSld = null;
  // Which destinations the modulator is walking right now. `moveSetting` skips
  // them, because two writers at 25 Hz on one control is a 25 Hz square wave
  // and not a compromise. Set by `applyPatch`, which is the only thing that
  // calls `setRoutes`.
  let routedNow = new Set();
  // Has the granulator's ring been through one full lap of live radio? Until it
  // has, the engine is quiet for a reason and nothing may report that as a fault.
  let ringFilled = false;
  // What the four sliders currently hold. Seeded from the patch this page opens
  // on, never from the engine's own defaults — see PATCHES.
  const P = { rate: 1.4, size: 1.8, scan: 0.30, spray: 0.55 };
  let measured = null, done = false, synthPending = false;

  function graph() {
    if (ctx) return;

    // IT, AND THAT IS WHY REMOVING THE ELEMENT MADE THE PAGE GO QUIET.
    // MEASURED on an iPhone the moment the decode path started working: the
    // decoder ran clean — `WebCodecs AudioDecoder`, 44100 Hz, 0 errors, 0
    // underruns — and the analyser read **rms 0.16 -> 0.23**, so the graph
    // plainly had the audio, while the phone made no sound at all. A page whose
    // only output is WebAudio gets the `ambient` session by default, which the
    // ring/silent switch mutes; `<audio>` gets `playback`, which it does not.
    // That difference is invisible on a laptop and is the entire experience on
    // a phone.

    // ⚠️ SET IT BEFORE THE FIRST SOUND, INSIDE THE GESTURE. WebKit's Audio
    // Session API is the only way to ask, and asking late leaves the first
    // seconds on the wrong session. It is absent everywhere else, so this is a
    // capability test and never a platform check (CLAUDE.md).
    try {

    // wired to this node ONCE at boot; a station switch replaces the decoded
    // stream behind it, and if the page handed out the stream's own node the
    // granulator would keep reading the old, stopped one — silence that looks
    // like a broken engine.
    srcNode = ctx.createGain();
    // 🔴 THE LIVE STATION'S OWN TAP, so a loop can replace it rather than play
    // on top of it. REPORTED as the loop not working with the granulator, and
    // it was exact: the loop went to the SPEAKERS through a gain of its own,
    // while `srcNode` went on carrying the live station to scsynth and to the
    // analyser. So the granulator chewed one thing while you heard another, and
    // the picture measured the thing you were not listening to.
    liveIn = ctx.createGain();
    liveIn.connect(srcNode);

    analyser.smoothingTimeConstant = 0;
    // ⚠️ THE DRY GAIN EXISTS FROM THE START even though nothing uses it until

    // two paths to the destination and twice the level; building the blend
    // point once means the only thing that ever changes is a number.
    dry = ctx.createGain();
    srcNode.connect(analyser);
    analyser.connect(dry);
    /**

     * for a meter: `sink` was fed by the station's path only, so with the fader

     *

     *
     * ⚠️ IT IS NOT A VOLUME. Its gain is 1 and nothing writes to it; the blend

    //

    // ⚠️ IT TAPS `liveIn`, NOT `dry`. `dry` carries the fader, so a loop

    //

    // output never passed through either — so at the fader's granulator end a

  /**

   * media element is not reaching WebAudio, or this page's analyser is not
   * measuring anything at all. An oscillator through the SAME analyser
   * separates them in 400 ms — *"six arms of zero is the shape of a deaf
   * instrument"*.
   *
   * ⚠️ `dry` is muted for the duration so the test tone cannot reach a speaker.
   */
  let proved = false;

    // 🔴 ONCE, AND THE GUARD IS ON THE FUNCTION RATHER THAN ON ITS CALLER.

    // on every animation frame — so it armed a fresh oscillator sixty times a
    // second, each living 400 ms. Dozens summed, the analyser read 0.80 instead
    // of a lone tone's 0.18, and the picture filled its full height with MY TEST
    // TONE while the page reported it as the radio. A diagnostic that changes
    // the thing it is measuring is worse than none — so the invariant lives
    // where it cannot be re-broken by the next caller.

      analyser.getFloatTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      peak = Math.max(peak, Math.sqrt(s / buf.length));

    try { osc.stop(); } catch { /* already stopped */ }
    osc.disconnect(); g.disconnect();
    dry.gain.value = wasDry;
    const verdict = peak > 0.01 ? 'the graph CAN hear — so the element is what is silent'
                                : 'the graph hears NOTHING — the analyser path is the fault';
    ship(`analyser control: a 440 Hz tone through the same analyser reads ${peak.toFixed(4)} — ${verdict}`);
    d.log(`analyser control: ${peak.toFixed(4)} — ${verdict}`);

  // ── which station, and whether there is one at all ─────────────────────────
  // 🔴 EVERY STATE BELOW COMES FROM AN ANSWER, NEVER FROM A GUESS. "The stream

  // consequences — one disables the page, the other must not — so `avail` holds
  // three values and `undefined` never disables anything. That is `caps.mjs`'s

  let selfCheck = false;

  /** Ask the relay for a station, then hang up. */
  async function probeStation(id) {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), PROBE_MS);
    try {
      const res = await fetch(srcOf(id), { signal: ac.signal, cache: 'no-store' });
      // ⚠️ CANCEL THE BODY. This is an ENDLESS stream and the relay counts
      // listeners: a probe that reads the status line and walks away holds a
      // connection open for the life of the page, and two of those per load is
      // a page quietly using the station as a load generator.
      try { await res.body?.cancel(); } catch { /* already gone */ }

  /**

    onAir.coming();

  /**
   * Ask the relay which stations are up, and act on the answer.
   *
   * 🔴 ONE REQUEST THAT ALWAYS ANSWERS 200, AND THAT IS THE ENTIRE POINT.
   * Probing a mount directly means fetching a dead one, which answers 502 — and
   * **the browser logs that to the console with no way to suppress it**, so the
   * page tripped its own `no console errors` check and a visitor watching a
   * phone saw a red line about a station being down instead of the page quietly
   * handling it. `/health` moves the question to the thing that knows and
   * reports "down" as data rather than as an error status.
   *
   * ⚠️ THE PER-STATION PROBE IS KEPT AS THE FALLBACK, for a `?base=` pointed at
   * a relay without the route. It is worse — it is the thing that logs — but a
   * page that assumes a route exists is a page that breaks against an older
   * deploy, which is the `moq.mjs` trap in a new costume.
   */
  async function resolveStations() {
    let answers = null;
    try {
      const ac = new AbortController();
      const t = setTimeout(() => ac.abort(), PROBE_MS);
      // ⚠️ ASK ABOUT THESE FOUR, NOT ALL SIX. `/health` opens one upstream
      // connection per station it is asked about, so an unnarrowed probe made
      // every page load and every harness run cost the broadcaster six. That is
      // how three ERR mounts came to answer this relay 502 in 9 ms while serving
      // a laptop normally — LESSONS #50, earned a second time.
      const res = await fetch(`${BASE}/health?only=${STATIONS.map(([, id]) => id).join(',')}`,
        { signal: ac.signal, cache: 'no-store' });
      clearTimeout(t);
      if (res.ok) {
        const j = await res.json();
        // ⚠️ `=== true`, not truthy. A missing station must read as "we did not
        // get an answer about it", never as up.
        if (j && j.stations) answers = STATIONS.map(([, id]) => j.stations[id]?.up === true);
      }
    } catch { /* fall through to the probes */ }
    if (!answers) {
      d.log('the relay has no health route — probing the mounts directly');
      answers = await Promise.all(STATIONS.map(([, id]) => probeStation(id)));
    }
    STATIONS.forEach(([, id], i) => avail.set(id, answers[i]));
    const up = STATIONS.filter(([, id]) => avail.get(id));
    dead = up.length === 0;
    if (dead) {
      d.log('neither station is answering — there is nothing to play', 'bad');
      /**
       * 🔴 AND IT SAYS SO AS AN ASSERT, OR THE SUITE READS GREEN OVER A PAGE
       * THAT NEVER PLAYED A SAMPLE.
       *
       * `paintStations` disables the play toggle when there is nothing to play,
       * which is right for a visitor and is exactly what silenced the harness:
       * `verify.mjs` presses `.tbar-toggle`, a disabled button ignores it,
       * `startListening` never runs, `finish()` never runs, and the page makes
       * ZERO of its own thirty-four checks. The suite then printed **13/13
       * green** — its own eleven plus the shell's two — about a page that had
       * not played anything at all.
       *
       * MEASURED and reproducible with `?base=http://127.0.0.1:1`, and hit for
       * real twice in one session while `shout` was answering 502 on the mounts
       * this page prefers. A green suite with no coverage is the worst shape
       * there is here, so the page reports the one thing it does know, red.
       */
      if (!started) finish();

      // The upgrade: the page is named after this station, so if it is there,
      // that is what it should be playing.
      switchTo(PREFERRED_ID, 'it is on air');
    } else if (!avail.get(station)) {
      switchTo(up[0][1], `${nameOf(station)} is not answering`);
    } else {
      d.log(`${nameOf(station)} is up${up.length > 1 ? ', and so is the other' : ''}`);
    }

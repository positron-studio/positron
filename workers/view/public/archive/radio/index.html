  /**
   * 🔴 AND NOW THERE IS A LOOP, WHICH IS A SECOND SET OF AXES ENTIRELY. A sound
   * that is good over a moving stream is not automatically good over two
   * seconds of the same phrase coming round, and three facts decide which:
   *
   * 1. **THE LOOP HAS AN EXACT LENGTH AND SO DOES THE GRAIN CLOCK, SO THEY CAN
   *    BE MADE TO DIVIDE EACH OTHER.** MEASURED, on the audio rather than on
   *    anything this page believes: an `AudioBuffer` of 384000 samples looped
   *    with `loop = true` repeats at **exactly 384000 samples, bit identical**,
   *    and at 768000 at half speed; and the engine's grain clock, recorded off
   *    its own output and fitted over 24 grains, runs at **24000.0 ± 0.2 samples
   *    for a rate of 2**, twice, against 24000 asked for. `lockGrainsToLoop`
   *    nudges the rate so a whole number of the figure's bars fits the loop, and
   *    from then on nothing slides. The LOOP row's `half` is a power of two, so
   *    the lock survives it with nothing to recompute.
   *
   * 2. 🔴 **A ROUTING ONTO `rate` IS THE ONE THING THAT UNPICKS IT.** The grain
   *    clock is the only timing this instrument has; walk it and the figure
   *    walks with it. So the patches whose point is a rhythm have NO route onto
   *    `rate` — `the sixteenth` used to and it was moved to `size`, which
   *    changes how long a grain is and not when it happens. The washes keep
   *    theirs, because a cloud has nothing to be in time with.
   *
   * 3. **A RHYTHM MUST BE WRITTEN IN THE ENGINE, NEVER IN THE MODULATOR.** The
   *    sixteen-step gate is read at audio rate by a `Stepper` on the grain
   *    trigger itself, so it is exact. `pappus-mod.mjs` runs off a 25 Hz
   *    `setInterval` — MEASURED at 2.0-2.6 ms of jitter on an idle machine, but
   *    quantised to 40 ms by construction — so a step source on `probs` faster
   *    than about 1 Hz decides which voices are open with a boundary that slides
   *    by up to a twenty-fifth of a second against a grid that does not. It
   *    cannot make a grain LATE, because grain times are the engine's; it can
   *    hand a grain the wrong step's voices. Every step route here is at or
   *    below 1 Hz for that reason.
   *
   * So each patch below says, in its own `says` line, which material it is
   * about: the STATION (a moving stream, where a delay means "a moment ago" and
   * a follower wanders) or the LOOP (a fixed phrase, where a delay is a canon,
   * a follower repeats in time, and a window is a slice you can hear coming).
   * Three are built on the loop's axes and had no reason to exist before it:
   * `strummed`, `two seconds of it` and `cut up`. `three, three, two` was
   * deleted to make room, because a second gate figure at a similar rate is a
   * second helping of one kind rather than another kind.
   */
  const PATCHES = [
    // 🔴 DELAY MODE, WHICH THIS PAGE HAS NEVER USED. The read point sits a
    // fixed distance BEHIND the write head instead of crawling through a
    // window, so what comes out is the station itself, four seconds ago, in
    // grains long enough that words survive. Not a wash — an echo you can
    // follow. `mdelay` is the control the read-head slider drives here and the
    // window must be the whole lap, which `writePatch` enforces.
    { name: 'four seconds ago',
      says: 'the station itself, four seconds late, in pieces you can still follow',
      // MOTION: loud passages shorten the pieces, and a busy programme scatters
      //         where each one is read from — so speech breaks up and music
      //         holds together
      mod: [
        { src: 'env', dest: 'size', amt: 0.50 },
        { src: 'env.flux', dest: 'spray', amt: 0.35 },
      ],
      scanmode: 3, scan: 0.5, rate: 9, size: 0.28, contour: 6,
      sos: 0.75, lock: 0, tilt: 0, ingain: 1, comp: 0.20,
      spray: 0.06, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 0, 0, 0, 0, 0, 0, 0],
      pitches: [0, 0, 0, 0, 0, 0, 0, 0],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0.12, scycle: 2.0, sfb: 0.20, stilt: 0, sxover: 700, sdiffuse: 0.20,
      taptimes: [0.75, 1.5, 2.25, 3.0], tappans: [-0.6, 0.6, -0.3, 0.3],
      tappitch: [0, 0, 0, 0],
      drive: 0.10, crush: 0, crushmode: 1,
      noise: 0, noisetype: 2, noisedecay: 0.8, noisetone: 800, noisedyn: 1.0,
      wow: 0.10, rverb: 0.15, rtime: 0.30 },

    // 🔴 WHAT MAKES A PATCH HERE MUSICAL, NAMED — because it was reported rather
    // than designed. Of the eight, the two picked out as musical were `the
    // sixteenth` and `four seconds ago`, and they have nothing in common on any
    // knob: one is a sixteen-step figure of 55 ms grains, the other is a delay
    // of quarter-second grains with no rhythm at all. What they share is that
    // **you can follow something through them** — a pulse you can count in one,
    // the programme's own phrasing in the other. Every other patch is a
    // CONTINUUM: a wash, a stretch, a cloud, a crush, none of which has an event
    // you can point at. So the axis is not density, brightness or space. It is
    // whether the thing has a legible time structure, and the engine offers
    // exactly two ways to get one — a gate figure (`elen` above 1) or grains
    // long enough in DELAY mode that the broadcast's own shape survives.
    //
    // ⚠️ THESE TWO ARE BUILT ON THAT AND HAVE NOT BEEN HEARD. Nothing here can
    // grade musicality — CLAUDE.md's rule about implementing somebody else's
    // format applies with a vengeance to a judgement that is not a number. What
    // is claimed is only that they sit on the same axis as the two that were
    // praised, and that every value is inside the engine's own ranges.
    //
    // `dub` takes BOTH levers at once, which no patch here has: delay mode for
    // the material and a gate figure for the time. The broadcast comes back two
    // seconds late, chopped on an eight-step figure, into four echoes — so it
    // answers itself in time rather than smearing.
    //
    // ⚠️ EVERY NUMBER IN IT NOW DIVIDES EIGHT SECONDS, which is what the loop
    // is. Eight steps at eight grains a second is a one-second figure, so a
    // full loop is eight of them; the echoes at 0.5, 1, 2 and 4 seconds are
    // sixteen, eight, four and two to a lap. It used to be seven a second into
    // taps at three-eighths, which divides nothing and against a loop wandered
    // in and out of phase with itself for ever.
    { name: 'dub',
      says: 'the sound two seconds late, chopped on a figure, answering itself',
      // MOTION: loud passages push the blend further into the grains and the
      //         drive breathes on a half-minute triangle, so the delay opens up
      //         when the programme does
      mod: [
        { src: 'env', dest: 'sos', amt: 0.30 },
        { src: 'lfo', shape: 'tri', hz: 0.035, dest: 'drive', amt: 0.30 },
        { src: 'env.high', dest: 'spray', amt: 0.25 },
      ],
      scanmode: 3, scan: 0.25, rate: 8, size: 0.24, contour: 6,
      sos: 0.72, lock: 0, tilt: 0.10, ingain: 1, comp: 0.22,
      spray: 0.04, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0,
      elen: 8, ephase: 0.25,
      pattern: [1, 0, 0, 0, 1, 0, 1, 0],
      gates: [1, 1, 0, 0, 0, 0, 0, 0],
      pitches: [0, 0, 0, 0, 0, 0, 0, 0],
      probs: [1, 0.85, 1, 1, 1, 1, 1, 1],
      swet: 0.55, scycle: 1.5, sfb: 0.48, stilt: 0.15, sxover: 800, sdiffuse: 0.55,
      taptimes: [0.5, 1.0, 2.0, 4.0], tappans: [-0.8, 0.8, -0.45, 0.45],
      tappitch: [0, 0, 0, 0],
      drive: 0.22, crush: 0, crushmode: 1,
      noise: 0, noisetype: 2, noisedecay: 0.8, noisetone: 900, noisedyn: 1.0,
      wow: 0.12, rverb: 0.30, rtime: 0.55 },

    // 🔴 THE STATION, SLOWED, AND NOTHING ELSE DONE TO IT. Pappus is a
    // time-stretcher before it is a texture machine and this is the proof: one
    // voice at pitch 0, a dense enough grain rate to read as continuous, every
    // colour stage at zero. The radio at a quarter speed with its pitch intact.
    //
    // ⚠️ THIS IS THE FEATURE VARISPEED COULD NOT BE. Slowing the STREAM means
    // falling behind the station for ever; slowing the READ HEAD over a held
    // eight seconds costs nothing, because the material is already in the
    // buffer. `speed = winspan x (3*mscan - 1)` (`:715`), so 0.4167 is +0.25x.
    //
    // ⚠️ `spray` IS TINY BUT NOT ZERO. Sixteen overlapping grains reading the
    // SAME point comb against each other (`:826`), so a few milliseconds of
    // jitter is what keeps a stretch smooth rather than hollow.
    { name: 'slowed',
      says: 'the sound at a quarter speed, pitch intact, nothing added',
      // MOTION: none. The claim is that it does not colour the programme, and a
      //         follower here would be the page adding something and calling it
      //         the station
      mod: [],
      scanmode: 1, scan: 0.4167, rate: 28, size: 0.10, contour: 8,
      sos: 0.62, lock: 0, tilt: 0, ingain: 1, comp: 0.15,
      spray: 0.02, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 0, 0, 0, 0, 0, 0, 0],
      pitches: [0, 0, 0, 0, 0, 0, 0, 0],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0, scycle: 1, sfb: 0, stilt: 0, sxover: 700, sdiffuse: 0,
      taptimes: [0, 0, 0, 0], tappans: [0, 0, 0, 0], tappitch: [0, 0, 0, 0],
      drive: 0, crush: 0, crushmode: 1,
      noise: 0, noisetype: 1, noisedecay: 0.5, noisetone: 700, noisedyn: 1,
      wow: 0, rverb: 0, rtime: 0.3 },

    // 🔴 POSITION MODE AND A FROZEN BUFFER — the other architecture this page
    // had never used. `lock 1` stops the ring being written, so the material
    // can no longer change: what you hear is ONE INSTANT of the broadcast,
    // held, read from one place, stacked into a minor eleventh and drowned. The
    // programme stops being a programme and becomes a chord.
    { name: 'one note held',
      says: 'one instant of the broadcast, frozen and stacked into a chord',
      // MOTION: the only things left that CAN move, since the material cannot —
      //         the blend breathes on a ninety-second wave and the grain shape
      //         steps between held values
      mod: [
        { src: 'lfo', shape: 'sine', hz: 0.011, dest: 'sos', amt: 0.50 },
        { src: 'lfo', shape: 'glide', hz: 0.06, machine: 0.9, dest: 'contour', amt: 0.70 },
        { src: 'env.tone', dest: 'spray', amt: 0.40 },
      ],
      scanmode: 2, scan: 0.42, rate: 45, size: 0.16, contour: 16,
      sos: 0.90, lock: 1, tilt: 0.15, ingain: 1, comp: 0.25,
      spray: 0.25, spraymode: 2, swarm: 0.60, swarmmode: 2, strum: 0.02,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 1, 1, 1, 1, 1, 0, 0],
      pitches: [0, 3, 7, 10, 14, 19, 0, 0],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0.75, scycle: 7.0, sfb: 0.55, stilt: -0.15, sxover: 600, sdiffuse: 0.80,
      taptimes: [2.0, 4.0, 6.0, 7.5], tappans: [-0.7, 0.7, -0.4, 0.4],
      tappitch: [0, 12, 7, 19],
      drive: 0.12, crush: 0, crushmode: 1,
      noise: 0.08, noisetype: 2, noisedecay: 1.2, noisetone: 1100, noisedyn: 1.0,
      wow: 0.25, rverb: 0.72, rtime: 0.85 },

    // 🔴 +2x, WHICH IS THE FASTEST THE ENGINE OFFERS AND HAS NEVER BEEN USED
    // HERE. `mscan 1.0` is the top of the lane, so the read head runs twice life
    // speed and the pitch goes with it: eight seconds of radio in four, dry,
    // one voice, grains too short to hear individually. The opposite end of the
    // same control `slowed` sits on.
    { name: 'fast forward',
      says: 'the last eight seconds at double speed, dry and unadorned',
      // MOTION: the speed itself wanders down and back on a seventeen-second
      //         triangle, so it never settles into sounding like a tape fault
      mod: [
        { src: 'lfo', shape: 'tri', hz: 0.06, dest: 'scan', amt: 0.35 },
        { src: 'env', dest: 'rate', amt: 0.30 },
      ],
      scanmode: 1, scan: 1.0, rate: 34, size: 0.05, contour: 8,
      sos: 0.68, lock: 0, tilt: 0.10, ingain: 1, comp: 0.10,
      spray: 0.03, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 0, 0, 0, 0, 0, 0, 0],
      pitches: [0, 0, 0, 0, 0, 0, 0, 0],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0.04, scycle: 0.5, sfb: 0.10, stilt: 0, sxover: 800, sdiffuse: 0.10,
      taptimes: [0, 0, 0, 0], tappans: [0, 0, 0, 0], tappitch: [0, 0, 0, 0],
      drive: 0.10, crush: 0, crushmode: 1,
      noise: 0, noisetype: 1, noisedecay: 0.5, noisetone: 700, noisedyn: 1,
      wow: 0, rverb: 0.05, rtime: 0.25 },

    // 🔴 THE SIXTEEN-STEP PATTERN, ACTUALLY PLAYING. `egate = Index.ar(gpat,
    // (estep + mephase*i).floor % melen.max(1))` (`:802`) reads the gate buffer
    // — and with `elen 1` ONLY SLOT 0 IS EVER READ, which is what six of the
    // seven old patches did: sixteen numbers written and fifteen of them inert.
    // `elen 16` makes the figure below a rhythm, and `ephase 0.25` starts each
    // of the four voices four steps apart, so the same figure plays as a canon.
    //
    // 🔴 ITS FIGURE IS EXACTLY ONE SECOND LONG, AND THAT IS WHY IT IS THE BEST
    // OF THESE ON A LOOP. Sixteen steps at sixteen grains a second is a
    // one-second bar, so eight of them fit an eight-second loop exactly and the
    // same step lands on the same instant of the phrase every lap, for ever.
    // Over the live station the same figure is a pulse imposed on whatever
    // happens to be arriving, which is a weaker thing to hear.
    //
    // ⚠️ TWO ROUTES CHANGED AND BOTH FOR THE TIMING. The follower was on `rate`,
    // which is the grain clock and therefore the only timing this instrument
    // has — walking it walks the figure with it, so the one patch built on a
    // rhythm was the one patch modulating its own tempo. It is on `size` now,
    // which changes how long a grain is and not when it happens. And the step
    // source on `probs` was at 4 Hz against a modulator that ticks 25 times a
    // second: a step boundary resolved to 40 ms, on a grid whose steps are
    // 62.5 ms, so roughly one grain in three got the wrong step's voices. At
    // 1 Hz a step is twenty-five ticks long and the same source is exact enough
    // to be part of the figure rather than noise on it.
    { name: 'the sixteenth',
      says: 'a sixteen-step figure, four voices playing it four steps apart',
      // MOTION: which voices are allowed to fire steps on its own sixteen-slot
      //         pattern once a second — two rhythms against each other, one
      //         written and one that rewrites itself
      mod: [
        { src: 'lfo', shape: 'step', hz: 1, machine: 0.90, dest: 'probs', amt: 0.80 },
        { src: 'env', dest: 'size', amt: 0.30 },
        { src: 'env.high', dest: 'contour', amt: 0.50 },
      ],
      scanmode: 1, scan: 0.5, rate: 16, size: 0.055, contour: 0,
      sos: 0.70, lock: 0, tilt: 0.20, ingain: 1, comp: 0.20,
      spray: 0.10, spraymode: 3, swarm: 0.20, swarmmode: 1, strum: 0.05,
      elen: 16, ephase: 0.25,
      pattern: [1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 0],
      gates: [1, 1, 1, 1, 0, 0, 0, 0],
      pitches: [0, 7, 12, 19, 0, 0, 0, 0],
      probs: [1, 0.9, 0.8, 0.7, 1, 1, 1, 1],
      swet: 0.22, scycle: 0.75, sfb: 0.30, stilt: 0.20, sxover: 900, sdiffuse: 0.30,
      taptimes: [0.25, 0.5, 1.0, 2.0], tappans: [-0.8, 0.8, -0.5, 0.5],
      tappitch: [0, 0, 12, 12],
      drive: 0.50, crush: 0.40, crushmode: 2,
      noise: 0.10, noisetype: 3, noisedecay: 0.2, noisetone: 2200, noisedyn: 2.0,
      wow: 0.05, rverb: 0.25, rtime: 0.40 },

    // 🔴 `strum`, WHICH NOTHING ON THIS PAGE HAS EVER USED AND WHICH IS A
    // MECHANISM RATHER THAN A FLAVOUR. `strumsp = mstrum.clip(0, 0.125) × (1 /
    // mrate)` and `vtrig = TDelay.ar(trig × …, strumsp × i)` (`:756`, `:806`):
    // it is a SUBDIVISION OF THE GRAIN PERIOD, so voice `i` fires `i` eighths of
    // a period after voice 0. At its ceiling, with eight voices open, one
    // trigger becomes eight notes spread over seven eighths of the period — a
    // rolled chord rather than a stack, and the roll is laid out by the same
    // audio-rate clock the grains are, so it is exact.
    //
    // ⚠️ THIS IS WHAT REPLACED `three, three, two`, and the reason is the rule
    // at the top of this table. That patch was an eight-step gate figure at
    // twelve grains a second beside `the sixteenth`'s sixteen-step figure at
    // sixteen — two helpings of one kind, which is the failure this whole set
    // was rebuilt to escape. A roll is a different kind, and it is the only one
    // here whose rhythm comes from inside a single grain period.
    //
    // ⚠️ AND THE FOLLOWER IS ON THE ROLL ITSELF, not on a colour. A bright
    // passage tightens the strum toward a chord and a dull one opens it into an
    // arpeggio, which is the one gesture only this patch can make.
    { name: 'strummed',
      says: 'a chord rolled out one note at a time, twice a second',
      // MOTION: brightness closes the roll up toward a chord, and which notes
      //         of it are allowed to sound steps once every two seconds
      mod: [
        { src: 'env.tone', dest: 'strum', amt: 0.45 },
        { src: 'lfo', shape: 'step', hz: 0.5, machine: 0.88, dest: 'probs', amt: 0.45 },
      ],
      scanmode: 1, scan: 0.5, rate: 2, size: 0.35, contour: 8,
      sos: 0.68, lock: 0, tilt: 0.08, ingain: 1, comp: 0.20,
      spray: 0.05, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0.125,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 1, 1, 1, 1, 1, 1, 1],
      pitches: [-12, -5, 0, 7, 12, 16, 19, 24],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0.28, scycle: 2.0, sfb: 0.25, stilt: 0.05, sxover: 800, sdiffuse: 0.40,
      taptimes: [1.0, 2.0, 4.0, 8.0], tappans: [-0.6, 0.6, -0.35, 0.35],
      tappitch: [0, 0, 12, 12],
      drive: 0.12, crush: 0, crushmode: 1,
      noise: 0, noisetype: 2, noisedecay: 0.6, noisetone: 1200, noisedyn: 1.0,
      wow: 0.05, rverb: 0.30, rtime: 0.50 },

    // 🔴 A WINDOW INSIDE THE BUFFER, WHICH NO PATCH HERE HAS EVER SET. `winlo`
    // and `winhi` fold every read into a slice of the held seconds (`:660`,
    // `:838`), and `speed = winspan × (3·mscan − 1)` (`:715`) — so narrowing the
    // window to a quarter and pushing the read head to the top of its lane gives
    // TWO seconds of material crossed in FOUR, half speed, lapping twice to
    // every eight-second loop. Over the station it is a two-second memory read
    // over and over; over a loop it is one phrase of the music, slowed, arriving
    // twice a lap in the same place each time.
    //
    // ⚠️ AND THE SLICE WALKS. Both window ends carry the same triangle at the
    // same phase, so the pair slides rigidly through the buffer over about
    // eighty seconds instead of the slice changing length. `setRoutes` spreads
    // phases round the cycle unless a route names its own, so both say
    // `phase: 0` — without that they would be given 0 and 0.5 and the window
    // would open and shut instead of moving.
    { name: 'two seconds of it',
      says: 'two seconds out of the eight, stretched over four and read again',
      // MOTION: the two seconds slide slowly through the buffer, so the phrase
      //         you are hearing is not the one you were hearing a minute ago
      mod: [
        { src: 'lfo', shape: 'tri', hz: 0.013, phase: 0, dest: 'winstart', amt: 0.60 },
        { src: 'lfo', shape: 'tri', hz: 0.013, phase: 0, dest: 'winend', amt: 0.60 },
        { src: 'env.flux', dest: 'spray', amt: 0.30 },
      ],
      scanmode: 1, scan: 1.0, rate: 24, size: 0.18, contour: 10,
      winstart: 0.25, winend: 0.50,
      sos: 0.66, lock: 0, tilt: 0.05, ingain: 1, comp: 0.22,
      spray: 0.06, spraymode: 3, swarm: 0.25, swarmmode: 1, strum: 0,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 1, 0, 0, 0, 0, 0, 0],
      pitches: [0, -12, 0, 0, 0, 0, 0, 0],
      probs: [1, 1, 1, 1, 1, 1, 1, 1],
      swet: 0.30, scycle: 2.0, sfb: 0.30, stilt: 0, sxover: 800, sdiffuse: 0.45,
      taptimes: [1.0, 2.0, 3.0, 4.0], tappans: [-0.7, 0.7, -0.4, 0.4],
      tappitch: [0, 0, 0, 0],
      drive: 0.08, crush: 0, crushmode: 1,
      noise: 0.04, noisetype: 2, noisedecay: 0.9, noisetone: 1300, noisedyn: 1.0,
      wow: 0.06, rverb: 0.35, rtime: 0.55 },

    // 🔴 GRAINS AS LONG AS THE STEPS THEY SIT ON, WHICH IS AN ARRANGEMENT RATHER
    // THAN A TEXTURE. Every other patch here fires grains far shorter than its
    // figure, so the figure is a pulse ON the material; this fires ONE
    // one-second grain per step of a four-step figure and leaves one step of
    // the four empty, so what you hear is the material itself, a second at a
    // time, with a second missing. Four steps at one a second is a four-second
    // bar: two of them to an eight-second loop, so the same second goes missing
    // every lap.
    //
    // ⚠️ DELAY MODE, AND THAT IS ABOUT SAFETY RATHER THAN TASTE. A grain is an
    // un-syncing read forward from wherever it started (`:668`), so a
    // one-second grain taken near the write head is overtaken by it mid-note
    // and splices. Four seconds behind, a one-second grain ends three seconds
    // behind, and the buffer under it cannot change.
    { name: 'cut up',
      says: 'the sound a second at a time, with one second in four left out',
      // MOTION: which of the two voices doubles changes once a bar, and loud
      //         passages make the pieces a little longer
      mod: [
        { src: 'lfo', shape: 'step', hz: 0.25, machine: 0.90, dest: 'probs', amt: 0.50 },
        { src: 'env', dest: 'size', amt: 0.25 },
      ],
      scanmode: 3, scan: 0.5, rate: 1, size: 1.0, contour: 4,
      sos: 0.70, lock: 0, tilt: 0, ingain: 1, comp: 0.25,
      spray: 0.02, spraymode: 1, swarm: 0, swarmmode: 1, strum: 0,
      elen: 4, ephase: 0,
      pattern: [1, 0, 1, 1],
      gates: [1, 1, 0, 0, 0, 0, 0, 0],
      pitches: [0, 0, 0, 0, 0, 0, 0, 0],
      probs: [1, 0.5, 1, 1, 1, 1, 1, 1],
      swet: 0.35, scycle: 2.0, sfb: 0.35, stilt: 0.10, sxover: 800, sdiffuse: 0.40,
      taptimes: [1.0, 2.0, 4.0, 6.0], tappans: [-0.7, 0.7, -0.4, 0.4],
      tappitch: [0, 0, 0, 0],
      drive: 0.15, crush: 0, crushmode: 1,
      noise: 0, noisetype: 2, noisedecay: 0.8, noisetone: 900, noisedyn: 1.0,
      wow: 0.08, rverb: 0.30, rtime: 0.50 },

    // 🔴 FOUR-SECOND GRAINS, WHICH IS THE OTHER END OF A SCALE EVERY OLD PATCH
    // SAT IN THE MIDDLE OF. Half a grain a second, each one four seconds long
    // and read backwards at life speed, an octave and a fifth below. The
    // overlap is the engine's own floor of 2, so what you hear is two enormous
    // reversed swells crossing — the slowest thing this page can make.
    { name: 'ground',
      says: 'half a grain a second, four seconds each, reversed and an octave down',
      // MOTION: bass in the programme THINS it rather than thickening it, which
      //         is the opposite of what loudness would do, and the detune walks
      //         on a fifty-second pattern
      // ⚠️ THE THINNING MOVED OFF `rate` AND ONTO `probs`, and it is the same
      // musical claim by a better road. On `rate` it thinned by firing fewer
      // grains, which is the grain clock, which is the only timing here — so
      // the patch spent its life walking its own tempo. On `probs` it thins by
      // refusing to fire on some triggers, which is what "thinner" means and
      // leaves the clock where the loop put it. A follower has no phase, so on
      // an eight-element control it moves all three voices together: a duck,
      // which is honest, and is what this wants.
      mod: [
        { src: 'env', dest: 'size', amt: 0.40 },
        { src: 'lfo', shape: 'glide', hz: 0.02, machine: 0.85, dest: 'swarm', amt: 0.60 },
        { src: 'env.low', dest: 'probs', amt: -0.40 },
      ],
      // ⚠️ HALF A GRAIN A SECOND EXACTLY, WHICH IS WHAT THE LINE ABOVE ALREADY
      // CLAIMED. 0.45 was near enough to say in words and divides nothing; 0.50
      // puts four grains in every eight-second loop.
      scanmode: 1, scan: 0.0, rate: 0.5, size: 4.0, contour: 14,
      sos: 0.80, lock: 0, tilt: -0.55, ingain: 1, comp: 0.30,
      spray: 0.40, spraymode: 3, swarm: 0.85, swarmmode: 3, strum: 0.10,
      elen: 1, ephase: 0, pattern: null,
      gates: [1, 1, 1, 0, 0, 0, 0, 0],

    // the ones BACK or it inherits the last patch's rhythm silently.

    setParam(eng, 'tappitch', [...p.tappitch, 0, 0, 0, 0]);
    setParam(eng, 'drive', p.drive);
    setParam(eng, 'crush', p.crush);
    setParam(eng, 'crushmode', p.crushmode);
    setParam(eng, 'loss', 0);                // two lowpasses on this rung, not codec damage
    setParam(eng, 'noise', p.noise);
    setParam(eng, 'noisetype', p.noisetype);
    setParam(eng, 'noisedecay', p.noisedecay);
    setParam(eng, 'noisetone', p.noisetone);
    setParam(eng, 'noisedyn', p.noisedyn);
    setParam(eng, 'kwow', p.wow);
    setParam(eng, 'rverb', p.rverb);
    setParam(eng, 'rtime', p.rtime);
    setParam(eng, 'rshimmer', 0);            // compiled out on TINY
    setParam(eng, 'mcomp', p.comp);
    setParam(eng, 'limceil', 0.98855);
    setParam(eng, 'ingain', p.ingain);
    setParam(eng, 'amp', 1);
    setParam(eng, 'fade', 1);
    setParam(eng, 'bypass', 0);
    setParam(eng, 'run', 1);
    setParam(eng, 'report', 1);
  }

  /**
   * Choose a patch: write it, move the sliders to it, say what it is.
   *
   * 🔴 THE SLIDERS MUST MOVE OR THE PAGE SHOWS ONE PATCH AND PLAYS ANOTHER.
   * They glide rather than jump because `Engine_Pappus.sc` puts `Lag.kr(…,
   * 0.02)` on these controls — 20 ms, enough not to click and nowhere near a
   * change of sound — so the engine jumps and the handle has to be a picture of
   * what the engine did, not a second animation that happens to look similar.
   * ⚠️ `quiet: true`, or moving a handle would call `onInput` and send the
   * value a second time, from the slider, after the patch has already sent it.
   *
   * ⚠️ AND THE READ-HEAD SLIDER'S LABEL MOVES WITH IT, because in five of these
   * six patches it is a speed and in one it is a lag — see `setScan`. A rename
   * can change the shared label column's width, so the column is re-measured;
   * in practice `radio → granulator` is wider than all three names and nothing
   * shifts, which is checked rather than assumed.
   */
  /**
   * 🔴 THE ONLY THING ON THIS PAGE THAT MOVES BY ITSELF, AND IT IS THE STATION.
   * See the header of `pappus-mod.mjs` for why nothing else does: the graph we
   * load is the SynthDef, and every LFO Pappus has lives in the Lua half we do
   * not run. The follower listens to the radio the granulator is already eating
   * and walks the grain settings with it.
   *
   * ⚠️ IT WRITES THE ENGINE, NOT THE SLIDERS, and that is deliberate rather
   * than lazy. A knob redrawn twenty-five times a second is the `grain-scope`
   * caption again in another costume; a slider shows where the patch SITS and
   * where you left it, and the modulation moves around that. Every synth ever
   * built does it this way and it is the reason a modulated knob has a ring
   * rather than a jumping handle.
   *
   * ⚠️ THE RANGES ARE THE SLIDERS' OWN, read from the same numbers the lanes
   * are built with — so a modulation lands where the LANE is. On `rate` and
   * `size`, which are exponential, that makes a routing multiply and divide
   * rather than add and subtract.
   */
  let modulator = null;
  const MOD_HZ = 25;          // 20 ms of Lag.kr upstream; faster is thrown away
  /**
   * Where a modulated control is actually written.
   *
   * 🔴 `setBoth` IS THE WRONG WRITER AT 25 Hz. It sends `m…` and `n…` for one
   * setting, which is right for a patch — one shot, and the board may be on a
   * rung where the second granulator exists — and wrong for a modulator, where
   * it is exactly double the OSC traffic into a granulator that is
   * `DC.ar([0,0])` in this tab (`Engine_Pappus.sc:1013`, `:218`). The
   * modulator writes the head that makes the sound and nothing else.
   *
   * ⚠️ AND NOT EVERY CONTROL WEARS THE `m`. `kwow`, `drive`, `crush`, `noise`
   * and the eight-element arrays are global — one stage for both granulators —
   * so the prefix would name a control this definition does not have, and
   * scsynth discards an unknown control IN SILENCE. That is the failure this
   * table exists to stop: a routing that runs, reports, and never reaches a
   * single sample.
   */
  const MOD_CMD = { wow: 'kwow', drive: 'drive', crush: 'crush', noise: 'noise',
                    probs: 'probs', gates: 'gates' };
  function startModulator() {
    if (modulator) return modulator;
    modulator = createModulator({
      now: () => ctx.currentTime,
      send: (name, v) => setParam(eng, MOD_CMD[name] ?? `m${name}`, v),
      /**
       * 🔴 THE LANES, AND EVERY ONE OF THEM IS THE ENGINE'S OWN. A modulation
       * is applied in the control's warped space, so these ranges decide what a
       * routing MEANS — get one wrong and a musical amount becomes a slam.
       * Citations are `Engine_Pappus.sc`.
       */
      specs: {
        rate: { min: 0.1, max: 100, warp: 'exp' },     // grains per second
        size: { min: 0.002, max: 4, warp: 'exp' },     // grain length, `:682` clips at 8
        scan: { min: 0, max: 1 },                      // read head; a SPEED in STRETCH (`:715`)
        spray: { min: 0, max: 1 },                     // read-point jitter, `:815`
        swarm: { min: 0, max: 1 },                     // detuned duplicates, `:743`
        strum: { min: 0, max: 0.125 },                 // grain-period subdivision, `:756`
        // 🔴 THE FLOOR IS 0.62, NOT 0. `sxf = (msos.max(mlock)/0.6).clip(0,1)`
        // (`:980`) crossfades the grains against the LIVE INPUT, so anything
        // below 0.6 is not a darker flavour — it is the granulator being turned
        // off and the radio handed back. A lane that reaches zero would make a
        // slow sine on this control switch the instrument off twice a minute.
        sos: { min: 0.62, max: 1 },
        // A `Select.kr` index over seventeen windows (`:726`), read per grain —
        // so it wants a stepped source, and a fractional index is not a value
        // this page could read back the way it sent it.
        contour: { min: 0, max: 16, quant: 1 },
        wow: { min: 0, max: 1 },                       // tape flutter, `:1590`
        // The loud half of the chain, all three `Lag.kr(…, lagt)` at `:1586`.
        // ⚠️ THEY ARE GLOBAL CONTROLS — no `m` prefix — which `MOD_CMD` above
        // already knew and this table did not, so a routing onto any of them was
        // refused for a destination that exists.
        drive: { min: 0, max: 1 },
        crush: { min: 0, max: 1 },
        noise: { min: 0, max: 1 },
        // The window ends. ⚠️ ONLY IN STRETCH AND POSITION — `applyPatch` drops
        // a routing onto these in a delay mode, where `writePatch` forces the
        // window to the whole lap and a narrowed one puts the read head nowhere
        // near the write head.
        winstart: { min: 0, max: 0.6 },
        winend: { min: 0.4, max: 1 },
        // ⚠️ AN ARRAY, so it is written with `/n_setn` and one shape is rotated
        // across the eight voices. `probs` is per-voice firing probability
        // (`:801`), which is the difference between a texture that is always on
        // and one that breathes.
        probs: { min: 0, max: 1, n: 8 },
      },
      /**
       * 🔴 SIX FOLLOWERS OFF ONE ANALYSER READ, AND THE POINT IS THAT THEY ARE
       * ALL THE STATION. Upstream's follower has a source switch across its own
       * jacks and calls the input *"the most musical source in the box"*; here
       * the input is a radio programme, so speech, music and silence each move
       * the granulator differently. `meterTick` computes them.
       *
       * ⚠️ SENSITIVITY IS PER SOURCE AND HAS TO BE. `tone` is already 0..1, so
       * upstream's sens 6 would pin it at the ceiling where it stops following
       * anything — measured in `pappus-mod-test.mjs`, where exactly that made a
       * working follower read as a stuck control.
       */
      followers: {
        rms: { attack: 0.01, release: 0.35, sens: 6 },
        low: { attack: 0.02, release: 0.40, sens: 9 },
        mid: { attack: 0.01, release: 0.30, sens: 11 },
        high: { attack: 0.006, release: 0.25, sens: 14 },
        tone: { attack: 0.05, release: 0.50, sens: 1 },
        flux: { attack: 0.004, release: 0.22, sens: 2.5 },
      },
      warn: (m) => d.log(`modulation refused: ${m}`, 'bad'),
    });
    // ⚠️ ONE WRITER ON THIS TIMER NOW. The tour used to run immediately before
    // `tick()` on this same interval, deliberately, so that it set every base
    // and wrote the unmodulated controls before `tick()` wrote the modulated
    // ones from those bases. It is gone; what took its place is a hand on a
    // slider, which runs on the FRAME clock and keeps out of the modulator's way
    // through `moveSetting` rather than through scheduling. See there.
    setInterval(() => { if (!eng) return; modulator.tick(); }, 1000 / MOD_HZ);
    return modulator;
  }

  /**
   * @param [o.silent]  do not write the log line naming the sound
   *
   * 🔴 IT LANDS THE WHOLE SOUND, AND THERE IS NO HALF ANY MORE. A `half:
   * 'discrete'` option stood here and existed for one caller, the tour: in the
   * middle of a nine-second slide between two sounds you may write only what has
   * no halfway (a `Select.kr` index, a chord in semitones, a sixteen-step gate
   * figure) and must leave everything behind a 20 ms `Lag.kr` to the morph. The
   * tour was removed 2026-09-16 and the option went with it rather than being
   * left as a branch nothing takes. `radio-gran.mjs` still owns that line and
   * `/videoradio/` still uses it; see `archive/radio-automate/`.
   */
  function applyPatch(i, { silent = false } = {}) {
    patch = ((i % PATCHES.length) + PATCHES.length) % PATCHES.length;
    const p = PATCHES[patch];
    P.rate = p.rate; P.size = p.size; P.spray = p.spray; P.scan = p.scan;
    writePatch(p);
    d.set('voices', p.gates.reduce((n, g) => n + (g > 0.001 ? 1 : 0), 0));
    if (sliders) {
      for (const [sld, v] of [[sliders.rate, p.rate], [sliders.size, p.size],
                              [sliders.spray, p.spray]]) {
        sld?.set(v, { quiet: true, glideMs: 900 });
      }
      // ⚠️ RANGE BEFORE VALUE. `setRange` re-clamps what the slider is holding,
      // so setting the new value first would clamp it against the OLD lane —
      // `ground`'s -1.00x would land at 0 on a 0..1 range and then be
      // re-shown on the right one as a speed nobody asked for.
      // ⚠️ AND THE LABEL MOVES WITH IT. The read head is a speed in one mode, a
      // place in another and a lag in a third, so a lane relabelled without its
      // range, or ranged without its label, is a control whose units lie.
      const r = SCAN_RANGE[p.scanmode] ?? SCAN_RANGE[2];
      sliders.scan?.setRange(r);
      sliders.scan?.label(r.label);
      sliders.scan?.set(r.toUi(p.scan), { quiet: true });
      shareLabelColumn?.();
    }
    // 🔴 A PATCH IS NOW A PLACE AND A MOTION. The base is where each control
    // sits with nothing moving it; the routes are what moves it. Two patches
    // with the same numbers and different routes are two different instruments,
    // which is the whole answer to "they all sound the same".
    if (modulator) {
      // Every destination a routing can name needs somewhere to return to, and
      // it is the patch's own number — so this list has to grow with the spec
      // table above. A base that is missing makes its routing INERT, silently:
      // `tick()` skips a destination whose base is null.
      for (const [k, v] of [['rate', p.rate], ['size', p.size], ['scan', p.scan],
                            ['spray', p.spray], ['swarm', p.swarm], ['strum', p.strum],
                            ['sos', p.sos], ['contour', p.contour], ['wow', p.wow],
                            ['drive', p.drive], ['crush', p.crush], ['noise', p.noise],
                            ['winstart', p.winstart ?? 0], ['winend', p.winend ?? 1],
                            ['probs', p.probs]]) modulator.setBase(k, v);
      // ⚠️ THE WINDOW ENDS ARE REFUSED IN A DELAY MODE, and this is the guard
      // rather than a note in the table. `writePatch` forces the window to the
      // whole lap there because `delaypos` is a position in the WHOLE lap
      // (`:717`, folded at `:838`) while `BufWr` writes at the un-windowed
      // phase (`:655`) — so a narrowed window puts the read head nowhere near
      // the write head and "four tenths of a second behind" quietly becomes
      // something else. A routing that fights `writePatch` would do that four
      // times a second with nothing on screen saying so.
      const routes = (p.mod || []).filter((r) =>
        !(p.scanmode >= 3 && (r.dest === 'winstart' || r.dest === 'winend')));
      modulator.setRoutes(routes);
      // 🔴 AND THE SET IS REMEMBERED, because the tour has to know which
      // controls it may NOT write. See `routedNow` where it is declared.
      routedNow = new Set(routes.map((r) => r.dest));
      // How many settings the station is walking. `—` when nothing is, which is
      // `slowed`'s whole claim: the programme, slowed, with nothing added.
      d.set('moving', modulator.moving().length || '');
    }
    // ⚠️ A PATCH CHANGE WHILE A LOOP RUNS HAS TO BE RE-TUNED TO IT. `writePatch`
    // has just written this patch's own `rate`, so without this the figure would
    // come back off the loop's grid the moment somebody pressed `›` — a lock
    // that silently holds for one sound and not the next.
    if (loopSeconds > 0) lockGrainsToLoop(loopSeconds);
    patchPick?.show(p.name, patch);
    if (silent) return p;
    // ⚠️ SAY WHEN IT WAS NOT YOU. `finish()` presses `›` and `‹` to grade a
    // second patch, and without this the log read `stutter — the station a beat
    // late` on a page nobody had touched — the same complaint the station row
    // already answers with `checking the buttons`. One flag, one meaning: the
    // page is exercising its own controls.
    d.log(`${p.name} — ${selfCheck ? 'checking the sounds' : p.says}`, 'hi');
    // 🔴 A FREEZE CAN CATCH A SILENCE, AND A CAUGHT SILENCE IS INDISTINGUISHABLE
    // FROM A BROKEN ENGINE. `lock 1` holds whatever the ring happens to contain
    // at the instant it is pressed — including the dead air between two
    // programmes. So the page reads its own meter for a moment afterwards and
    // says which it got, in the log, where a one-off measurement belongs. Not
    // awaited: sound is allowed to be late.
    // ⚠️ NOT BEFORE THE RING HAS FILLED. Until then it is empty BY DESIGN, and a
    // warning about an engine behaving correctly is worse than no warning —
    // the next reader learns to ignore the line.
    if (p.lock && eng && ringFilled && !selfCheck) {
      engLevel(400).then((peak) => d.log(peak > 0.002
        ? `held: the eight seconds in the buffer are now frozen (${peak.toFixed(4)} at the engine)`
        : `held: the buffer was nearly silent when it froze (${peak.toFixed(4)}) — step away and back to catch something else`,
      peak > 0.002 ? undefined : 'warn'));
    }
    return p;
  }
  /**
   * The blend, and the picture follows it.
   *
   * 🔴 THE TICKS ARE DRAWN AT THE SHARE OF THE OUTPUT THEY ACTUALLY ARE. A
   * picture of grains beside a fader set to all-radio was the page asserting
   * something nothing was making: the marks were real, the sound they stood for
   * was not reaching anybody. Now the layer's alpha IS the blend — at the left
   * end the wave is the whole picture, at the right end the grains are solid.
   *
   * ⚠️ THE WAVEFORM IS NOT FADED WITH IT, on purpose. The wave is the MATERIAL,
   * which is being chewed whatever the fader says; dimming it as the grains come
   * up would draw the radio going away, which is the one thing that does not
   * happen here.
   *
   * ⚠️ NO READOUT CELL. The fader prints its own value, in a fixed-width box, an
   * inch from where your hand is — a second copy in the row above is a number
   * that can disagree with itself.
   */
  // 🔴 A MASTER MUTE THAT `setWet` RESPECTS. This page checks itself by running
  // the fader to both ends and reading ink off the canvas, and on the deployed
  // page that was AUDIBLE — a second and a half of granulator nobody asked for,
  // in the middle of listening. The check still drives the real control down the
  // real path; it just cannot be heard doing it.
  let muted = false;
  const setWet = (v) => {
    wet = v;
    if (eng) eng.out.gain.value = muted ? 0 : v;
    if (dry) dry.gain.value = muted ? 0 : 1 - v;
    scope.grainAlpha(v);
  };

  // ═══ a slider that moves by itself ═════════════════════════════════════════
  //
  // 🔴 THERE IS NO PAGE-LEVEL MOVEMENT HERE ANY MORE, AND THE THING THAT
  // REPLACED IT IS SMALLER ON PURPOSE. What stood in these two hundred and fifty
  // lines was a TOUR: one button armed a clock that walked the twelve sounds on
  // a 22 s dwell with a 9 s slide between them, breathed the blend between 0.25
  // and 0.92, moved the fader and the four settings in step, and handed the
  // instrument back the moment a finger landed anywhere in `.gran-slot`. It was
  // removed whole on instruction 2026-09-16, and the code, the three asserts
  // that graded it and the reasoning that built it are in
  // `archive/radio-automate/`.
  //
  // 🔴 A SWEEP IS NOT A TOUR AND THIS FILE IS NOT GOING TO PRETEND IT IS. Every
  // slider under the picture now carries its own hand button — `slider.mjs`'s
  // `hand: true`, the movement itself in `hand.mjs`, graded with no browser by
  // `node demo/shell/hand-test.mjs`. One button moves ONE lane between its two
  // ends. It does not change sound, it does not move two controls together, and
  // it has no opinion about where the blend should be while the grain length is
  // travelling. What it does instead is sit against the control it moves, which
  // is the one thing the tour's single button three inches above them could not.
  //
  // ⚠️ AND A HAND IS SUBJECT TO THE ONE RULE THE TOUR REALLY NEEDED. Two writers
  // on one control at 25 Hz is a square wave rather than a glide: the modulator
  // writes `base + modulation` for every destination a patch routes, so anything
  // else writing that control's raw value alternates with it. The tour answered
  // that with `routedNow`; `moveSetting` below is the same answer for a hand and
  // for a finger, and a finger has needed it all along.

  /**
   * A hand or a finger on one of the four settings.
   *
   * 🔴 IT MOVES WHERE THE CONTROL SITS, AND ONLY WRITES THE ENGINE WHEN NOTHING
   * ELSE IS. `modulator.setBase` is where a modulated control RETURNS to, so
   * moving it is how a slider stays meaningful under a routing: the handle says
   * where the setting is and the modulation wobbles around that, which is what
   * every synth ever built does and the reason a modulated knob has a ring
   * rather than a jumping handle.
   * ⚠️ AND THE DIRECT WRITE IS SKIPPED WHERE THE MODULATOR IS WRITING. Without
   * the skip a hand at frame rate and `tick()` at 25 Hz alternate between `v`
   * and `v + modulation` on the same control, which is audible as a buzz on a
   * setting that is supposed to be gliding. `writeContinuous`'s own `skip`
   * argument exists for exactly this and this page no longer calls it.
   */
  const moveSetting = (name, v) => {
    P[name] = v;
    modulator?.setBase(name, v);
    if (!routedNow.has(name)) setBoth(name, v);
  };

  /**
   * The same thing for the read head, which is the one lane whose number on
   * screen is not the number the engine holds.
   *
   * ⚠️ IT CANNOT SIMPLY BE `setScan` WITH A GUARD IN IT. `writePatch` calls
   * `setScan` too, and at that moment `routedNow` is still the PREVIOUS sound's
   * set — so a guard inside it would skip a write the new sound needs, on the
   * sounds that happen to have modulated the read head before. The gate belongs
   * where the caller is known to be a control.
   */
  const moveScan = (v) => {
    const raw = scanRange().toEngine(v);
    P.scan = raw;
    modulator?.setBase('scan', raw);
    if (!routedNow.has('scan')) setScan(v);
  };

  /**
   * What a hand says when it starts and stops, for the log and for nowhere else.
   *
   * 🔴 SHORT, AND NOT IN THIS PROJECT'S OWN WORDS. `plans/plan-slider-automation.md`
   * calls this an invisible hand and a visitor has never read it, so the line
   * says what happened to the control they can see. A state change belongs in
   * the log: it is the only channel that survives a screenshot taken a minute
   * later, and it is the one place a page may put a sentence, because it moves
   * when something happens rather than on a clock.
   */
  let handStarts = 0;
  const handSaid = (what) => (s) => {
    if (s.why === 'coarse') { d.log(`${what}: ${s.says}`, 'warn'); return; }
    if (s.on) { handStarts++; d.log(`${what} is moving by itself`); return; }
    const why = s.why === 'ceiling' ? ', which is the ten minute ceiling'
      : s.why === 'hidden' ? ', because this tab went to the background'
      : s.why === 'disabled' ? ', because the station stopped arriving' : '';
    d.log(`${what} is yours again${why}`);
  };

  /**
   * Bring the granulator up. Called once, from the moment there is sound.
   *
   * 🔴 IT IS NOT BEHIND A BUTTON AND NOTHING WAITS FOR IT. `verify.mjs` presses
   * `.pos-controls button, .tbar-x` and applies the manifest's `settleMs` to
   * control 0 ONLY, and this page declares no controls at all, so control 0 is
   * the transport's loop-way `.tbar-x`, which returns in a microsecond. What
   * carries the boot is the harness's OTHER use of `settleMs`: the first-assert
   * budget, which waits while the page has not called `ready()`. This page holds
   * every assert to one burst in `finish()`, so that budget covers the whole
   * boot, and it is the only thing that does.
   * ⚠️ AND NO BUTTON HERE IS A SECOND WAY TO START THE GRANULATOR. That was
   * `Synthesize`, and before it `Listen`; both were a second control for
   * something the page already does. The granulator comes up with the sound.
   *
   * ⚠️ AND A FAILURE HERE MUST NOT TAKE THE RADIO DOWN. Booting 1.7 MB of wasm
   * used to be something a visitor opted into; now everyone who presses play
   * gets it, so an engine that refuses has to leave a working radio behind
   * rather than a dead page. `finish()` is called either way and simply reports
   * fewer things.
   */

  /**
   * Grade the station buttons — EARLY, before anybody is listening.
   *
   * 🔴 IT USED TO RUN IN THE ASSERT BURST AND IT TORE A HOLE IN THE SOUND.
   * Switching station rebuilds the decoder, so the A/B put TWO gaps of about a
   * second into the audio, several seconds in — and this page feeds a
   * granulator whose ring records whatever arrives, so the holes were captured
   * and then granulated. REPORTED from the deployed page as *"audio has holes,
   * granulator seems to operate on holes too"*, which is exactly right: the
   * check was manufacturing the silence the instrument then chewed.
   *
   * ⚠️ MUTING CANNOT FIX THIS, and that is the difference from the ink probe.
   * A mute hides what you HEAR; this was a gap in the MATERIAL, upstream of
   * every gain on the page. The only fix is to do it when a gap costs nothing —
   * before the ring has filled, which the warm-up then does with continuous
   * audio afterwards.
   */
  const S = { label: 'the station buttons switch the stream', pass: false, detail: 'not run' };
  /**
   * 🔴 STOPPING THE TRANSPORT TEARS THE STREAM DOWN, AND THIS RAN MID-LISTEN.
   * On the element path a pause was a pause. On the decoded path the 1 Hz
   * mirror CLOSES the stream when the deck stops and OPENS a new one when it
   * starts, so this check cost a full decoder teardown and rebuild — a hole of
   * a second and a half, several seconds in, which the granulator's ring then
   * recorded and chewed. PHOTOGRAPHED: `22.26` the measurement finishes,
   * `23.11 WebCodecs AudioDecoder` — a second decoder, from this check.
   * It runs before the ring fills now, with the station A/B, where a gap costs
   * nothing because nothing is holding it yet.
   */
  const T = { wasPlaying: false, stopped: false };
  async function checkTransportStops() {
    T.wasPlaying = isPlaying();
    deck.pause();
    await new Promise((r) => setTimeout(r, 1400));
    T.stopped = !isPlaying();
    if (T.wasPlaying) deck.play();
  }
  async function checkStationButtons() {
    const here = STATIONS.findIndex(([, id]) => id === station);
    // 🔴 THE FIRST STATION THAT IS NOT THIS ONE AND IS NOT GREYED, NOT INDEX 0.
    // It used to be `here === 0 ? 1 : 0`, which was fine while the row held two
    // stations and stopped being fine at six: on the day this was written FOUR
    // of the six were refusing, and index 0 was one of them — so the strong
    // claim ("pressing a button moves the stream") would have been skipped in
    // favour of the weak one ("a dead station's button is disabled") whenever
    // the top of the list happened to be down. A check that quietly downgrades
    // itself reads exactly like a check that passed.
    const other = STATIONS.findIndex(([, id], i) => i !== here && avail.get(id) !== false);
    if (other < 0 || picker.buttons[other].disabled) {
      // ⚠️ `other` IS -1 WHEN EVERY OTHER STATION IS DOWN, so the station this
      // branch reports on has to be found again rather than indexed with it.
      const off = other < 0 ? (here === 0 ? 1 : 0) : other;
      S.label = 'a station that is not answering has a button that refuses';
      S.pass = avail.get(STATIONS[off][1]) === false && picker.buttons[off].disabled;
      S.detail = `${nameOf(STATIONS[off][1])} is down and its button is disabled`;
      return;
    }
    const wasStation = station;
    selfCheck = true;
    picker.buttons[other].click();
    await new Promise((r) => setTimeout(r, 120));
    const moved = station === STATIONS[other][1];
    picker.buttons[here].click();
    await new Promise((r) => setTimeout(r, 120));
    selfCheck = false;
    S.pass = moved && station === wasStation;
    S.detail = moved ? `${nameOf(wasStation)} -> ${nameOf(STATIONS[other][1])} and back`
                     : `stayed on ${nameOf(station)}`;
  }

  async function startGranulator() {
    if (eng) return;
    // 🔴 NOTHING HERE MAY TOUCH THE TRANSPORT, AND THE FIRST VERSION DID.
    // This is started from inside the transport bar's own click, in the CAPTURE
    // phase — so anything it does synchronously happens BEFORE the bar's handler
    // runs. It opened with `await ensurePlaying()`, whose body calls
    // `deck.play()` before its first await, so the bar then saw an
    // already-playing deck and dutifully toggled it to PAUSE. MEASURED: `play
    // advances position` went 1 ms in 500, and `pause holds position` advanced
    // 302 ms in 300 — both harness checks inverted, by a page that had made the
    // first press do the opposite of what it says.
    //
    // The boot needs no transport at all: it needs `ctx` and `srcNode`, which
    // `graph()` has already built. Only the LEVEL measurement needs the radio
    // audibly playing, and that is seconds away — so the wait moved down to it.
    // `bootScsynth` yields on its first line (a dynamic import), so from the
    // click's point of view this function does nothing at all.
    eng = await bootScsynth({
      audioContext: ctx,
      input: srcNode,                      // ← the radio, onto scsynth's input busses
      log: (m) => d.log(m),
      onReply: (m) => {
        // Every tick is a grain the ENGINE reported firing, from the code that
        // started it — never one inferred from an output envelope.
        //
        // 🔴 TWO SEPARATE BUGS LIVED ON THIS LINE AND BETWEEN THEM NOT ONE TICK
        // HAD EVER BEEN DRAWN ON THIS PAGE.
        //
        // FIRST, THE INDICES WERE OFF BY ONE. `m` is `[address, ...args]` and
        // `SendReply` prepends two of its own, so the message is
        // `['/pgrain', nodeID, replyID, pos, dur, voice, half]` — recorded
        // verbatim as `["/pgrain", 3000, -1, 0.1329…, 0.12, 0, 0]` in
        // `research/supercollider-browser-2026-09.md` §10, in this repo, written
        // the day before this page was. Reading `pos` at `m[2]` took the
        // **replyID, which is −1 on every grain there has ever been**.
        //
        // SECOND, AND IT WOULD HAVE SURVIVED FIXING THE FIRST: `pos` is a
        // fraction of the sixty-second capture RING, not of the eight seconds
        // being read. `scope`'s axis is the eight. Unrescaled, every mark lands
        // in the left 13% — about fifteen seconds ago on a six-second picture,
        // which is off the left edge, which is nothing.
        //
        // ⚠️ SO THE COUNT WAS RIGHT THE WHOLE TIME AND THE PLACE WAS NOT, AND
        // NOTHING COULD SEE IT: `grains` reported a rate, the rate was correct,
        // it was asserted, and it went green. A count cannot tell you where a
        // grain read (LESSONS #36 — nothing in the suite looks at ink). The two
        // asserts at the bottom of `finish()` exist so this cannot come back.
        if (m[0] !== '/pgrain') return false;
        grains++;
        const pos = m[3];
        if (pos < posMin) posMin = pos;
        if (pos > posMax) posMax = pos;
        scope.mark({ pos: winPos(pos), dur: m[4], voice: m[5], half: m[6] });
        return true;
      },
    });

    // 🔴 SILENCE THE ENGINE BEFORE IT CAN BE HEARD, AND THIS IS THE FIRST LINE
    // AFTER THE BOOT FOR A REASON. `bootScsynth` wires its output to the
    // destination at **gain 0.9** — it has to, because Web Audio PULLS and a
    // graph with no path to the speakers is never asked to process, which is
    // what made buffer allocation time out once. But this page starts DRY, so
    // between `/s_new` answering and `setWet` running there were a few hundred
    // milliseconds of granulator at nearly full volume. REPORTED as a burst on
    // page load that "kicks off and then goes away", which is exactly what it
    // was. `wet` is 0 here, so this leaves the engine silent until asked.
    eng.out.gain.value = wet;
    /**
     * 🔴 AND THE ENGINE JOINS THE ONE WAY OUT, SO A METER CAN HEAR IT.
     *
     * `bootScsynth` wires its own output straight to the destination, which it
     * has to: Web Audio PULLS, and a graph with no path to the speakers is
     * never asked to process — that is what made buffer allocation time out
     * once, and the note in that file says so. The consequence here was that
     * the granulator left this page by a route `sink` was not on, so a meter at
     * the fader's granulator end read 0.0000 over a signal that was playing.
     *
     * ⚠️ CONNECTED BEFORE IT IS DISCONNECTED, in that order, on purpose. The
     * other order leaves the engine with no path to any destination for the
     * length of one statement, and the thing that goes wrong when that happens
     * is not a click, it is an allocation that never answers.
     */
    if (speakers) {
      eng.out.connect(speakers);
      eng.out.disconnect(ctx.destination);
    }
    window.__eng = eng;   // lab handle

    // The engine's input is connected by now, so this is the instant the
    // granulator's capture ring starts filling — see the wait further down.
    const ringFrom = played();

    // 🔴 BUFFERS BEFORE THE SYNTH. A Pappus with no envelope windows and no
    // gate buffers loads, answers `/n_go`, and fires nothing in silence.
    G.bufs = await allocBuffers(eng, { log: (m) => d.log(m) });
    G.def = await eng.recvDef(`${DEFS}pappus-tiny.scsyndef`);
    d.log(`Pappus TINY: ${G.def.bytes} B, ${G.def.ok ? `taken in ${G.def.ms} ms` : G.def.why}`);
    G.running = await startPappusSynth(eng);

    // 🔴 AND THE SETTINGS, WITHOUT WHICH IT IS SILENT AT `mix 0, gain 0`.
    // ⚠️ `bufSeconds` PASSED RATHER THAN LEFT ON ITS DEFAULT, which happens to
    // be the same 8. A default that agrees with this page's constant by
    // coincidence is a default that can stop agreeing with it in a commit about
    // something else, and the disagreement would be silent: the ring would lap
    // at one length while `winPos` and the fill wait assumed another.
    applyAudibleDefaults(eng, { live: true, bufSeconds: BUF_SECONDS });
    // ⚠️ AFTER `applyAudibleDefaults`, WHICH ALSO WRITES `gates`, `mscanmode`,
    // `msos` AND `mbuflen`. A patch applied before the defaults is a patch the
    // defaults overwrite — silently, since every message is fire-and-forget.
    // `applyPatch` writes all four again, and everything else besides.
    applyPatch(patch, { silent: true });
    setWet(wet);
    // ⚠️ THE SCOPE'S LABEL IS NOT RE-SET HERE, ON INSTRUCTION 2026-09-16.
    // It used to become 'Pappus, chewing the radio' the moment the granulator
    // started. The wave in that canvas is fed from `srcNode` through `analyser`
    // and is the station's own audio for the whole life of the page, so the
    // label set at the top, 'the radio, as it arrives', stays true. Do not add
    // a second name for the same picture.

    // ── the controls, and the ORDER is the argument ─────────────────────────
    // Picture, then the blend, then what the granulator is doing. The fader sits
    // directly under the canvas whose grain ticks it fades, and above the four
    // settings that decide what those ticks ARE. Placed with `after()` rather
    // than `append()` so it is anchored to the picture instead of to whatever
    // happens to be last in the body.
    // 🔴 EVERY SLIDER FROM HERE DOWN CARRIES `hand: true`, AND THE BUTTON IS
    // WHAT MAKES IT DIFFERENT FROM THE THING THAT WAS REMOVED. The tour armed
    // five controls from one button that was not beside any of them, and a page
    // that works its own instrument in front of the person holding it has been
    // reported here twice. One button per lane, off on arrival and forever, is
    // the smallest version of the same idea: it is asked for by a press, it is
    // unmistakable while it runs, and a finger on the lane takes it back in one
    // frame. `slider.mjs` owns all three; this page owns only the log line.
    const fader = createSlider({ label: 'radio → granulator', min: 0, max: 1, step: 0.01,
      value: wet, onInput: setWet, hand: true, onHand: handSaid('radio → granulator') });
    const wetRow = createSliderGroup([fader]);
    wetRow.el.classList.add('wet-fader');
    granControls.push(fader);
    // Kept because the self-check puts the blend back where the visitor left it.
    faderSld = fader;

    // 🔴 ONE GROUP, ONE SET OF COLUMNS. Four bare sliders in a div each lay
    // themselves out, so a wider label pushes its own lane right and the four
    // lanes start at four different x — which is exactly what was photographed
    // here. `createSliderGroup` shares the columns; `pair: true` puts two across
    // above 720 px and stacks them below, where sharing is what matters.
    const group = createSliderGroup([], { pair: true });
    group.el.classList.add('gran-rows');      // one rhythm — see the note in <style>
    const add = (label, name, min, max, step, value, unit, opts = {}) => {
      const sld = group.add(createSlider({ label, min, max, step, value, unit,
        warp: opts.warp, digits: opts.digits,
        hand: true, onHand: handSaid(label),
        onInput: (v) => moveSetting(name, v) }));
      granControls.push(sld);
      return sld;
    };
    // 🔴 THE ENGINE'S OWN RANGE, ON THE ENGINE'S OWN CURVE. Upstream declares
    // grain rate `0.1–100 Hz EXPONENTIAL` (`pappus.lua:2463`); this page offered
    // 0.5–40 LINEAR, so the top of the instrument was simply unreachable and the
    // bottom — where grains separate into single events you can count — was
    // squeezed into the first one percent of the lane. That is most of why
    // "everything sounds like one wash": the wash is the middle of a linear
    // range, and a linear range is almost all middle.
    const sRate = add('grains a second', 'rate', 0.1, 100, null, P.rate, '/s',
      { warp: 'exp', digits: 2 });
    // ⚠️ THREE SECONDS AT THE TOP, NOT ONE, BECAUSE A PATCH REACHES PAST ONE.
    // `burnt` holds 0.7 s grains and `ground` four seconds; a slider that stops
    // at 1 would have shown `1.00 s` under a granulator holding 4, which is
    // the page showing one patch and playing another — the exact failure the
    // glide below exists to prevent, arriving through the range instead.
    // ⚠️ AND IT IS STILL THE WRONG SHAPE. Upstream's own grain-length knob is
    // 0.002–8 EXPONENTIAL (`pappus.lua:2473`) and `slider.mjs` has no warp, so
    // `fast forward`'s 50 ms sits in the first one percent of the travel. The
    // patches carry the values and this nudges them; a warp in the kit is the
    // real fix and is written down in plan-radio-patches §1.2.
    // 🔴 AND THE SAME FOR LENGTH, WHICH IS THE ONE THAT WAS WORST. The engine
    // takes 2 ms to 8 s (`Engine_Pappus.sc:682`) and upstream's knob is
    // `0.002–8 beats exponential` (`pappus.lua:2473`); this page offered
    // 0.01–1 s linear, reaching ONE EIGHTH of the engine's top while spending
    // half its travel between 0.5 s and 1 s, where nothing audibly changes.
    // 2 ms to 50 ms — where a granulator stops being a delay and becomes a
    // texture — had two percent of the lane.
    // ⚠️ 4 s rather than 8: the ring this page records is eight seconds, so a
    // grain longer than half of it is reading most of the buffer at once, which
    // is a drone rather than a grain. The cap is the material's, not the engine's.
    const sSize = add('grain length', 'size', 0.002, 4, null, P.size, 's',
      { warp: 'exp', digits: 3 });
    // ⚠️ `scan` has its own setter and its own LABEL — see setScan. The label is
    // set from the patch below, so what is typed here is only what shows in the
    // half-second before the first patch lands.
    // ⚠️ THE HAND'S NAME FOR IT IS FIXED WHILE THE LABEL IS NOT. This lane is
    // called `read speed`, `read position` or `time behind` depending on the
    // sound, so a log line built from the label would name three controls for
    // one slider.
    const sScan = group.add(createSlider({
      label: 'read speed', min: 0, max: 1, step: 0.01, value: P.scan, unit: '',
      hand: true, onHand: handSaid('the read head'),
      onInput: moveScan,
    }));
    granControls.push(sScan);
    const sSpray = add('scatter', 'spray', 0, 1, 0.01, P.spray, '');
    sliders = { rate: sRate, size: sSize, scan: sScan, spray: sSpray };

    /**
     * 🔴 A PICKER, NOT TWO CHOICE ROWS. `material` (speech / music) and `chord`
     * (one voice / fifth / seventh) are gone; see the note on `PATCHES` for why
     * the chord is not a separate axis and where the seventh went.
     *
     * ⚠️ `createPicker`, NOT `createChoice`, AND THE REASON IS THE PHONE. Six
     * segmented buttons do not fit 390 px, and `choice.mjs` would wrap them into
     * a block whose height depends on the names. A picker's cell is fixed width
     * by design — *"a control that resizes is a control that moves"* — so the
     * two arrows and the die stay where your thumb last found them however long
     * the name is. `/grains/` steps its six the same way, which is the third
     * reason: this page is not going to grow a fourth kind of chooser.
     *
     * ⚠️ THE DIE JUMPS BETWEEN PATCHES, NEVER BETWEEN SLIDER POSITIONS. A random
     * point in four ranges lands in the middle of all four almost every time,
     * which is the one wash wearing different digits that `/grains/` was fixed
     * for. `+ patch + 1` so a roll can never land on the patch you are already
     * on, which reads as a dead button.
     */
    const patchRow = createPicker({
      label: 'sound',
      what: 'sound',
      prev: () => applyPatch(patch - 1),
      next: () => applyPatch(patch + 1),
      random: () => applyPatch(Math.floor(Math.random() * (PATCHES.length - 1)) + patch + 1),
      onPick: (i) => applyPatch(i),
    });
    patchRow.options(PATCHES.map((p) => p.name), patch);
    patchPick = patchRow;

    /**
     * 🔴 THE LOOP'S WAYS MOVED INTO THE TRANSPORT, AS ONE CYCLING BUTTON.
     *
     * They were a four-cell radio row here, under the picture, and a row that
     * can only act on a loop has nothing to say for the whole time no loop is
     * running: it sat there greyed, taking a line, explaining itself in a
     * tooltip. The transport already owns LOOP, so the thing that modifies a
     * loop belongs against it — see `loopExtras` in the bar's options, which is
     * where the button and its three faces now live.
     *
     * ⚠️ THE VARIABLE THAT USED TO HOLD THIS ROW IS GONE, AND THAT IS THE WHOLE
     * REPAIR OF A CRASH. `loopRow = null` stood here for a session while
     * `shareLabelColumn` still read `loopRow.el`, which threw on every boot.
     * A handle kept at `null` after the thing it names has gone is a name that
     * type-checks, greps clean, and is a live TypeError.
     *
     * ⚠️ `half` AND `chop` ARE NOT GONE FROM THE CODE, only from the bar. Half
     * speed is what the rate lattice beside it is for, now that it is back.
     * `chop` has no control any more and the checks still drive it; that is a
     * loose end and it is written here rather than left to be discovered.
     */

    // Picture, blend, what the loop is made of, what chews it, and then the four
    // settings that decide how. The LOOP row sits above SOUND because it decides
    // the MATERIAL and SOUND decides what is done to it.
    // Into the slot reserved at first paint, so nothing below moves.
    granSlot.append(wetRow.el, patchRow.el);
    granSlot.append(group.el);
    sliderRow = group.el;
    // 🔴 AND NOTHING GOES UNDER THEM. `Automate` stood here, in a row of its own
    // that this page built and gave the class `pos-controls` so it would look
    // like one. It was removed on instruction 2026-09-16 and what moves a
    // control now is the button glued to that control's own lane, which is why
    // there is nothing left to place. ⚠️ A PAGE-BUILT `.pos-controls` IS NOT
    // FREE: `verify.mjs` presses every button in one, on every run, so the row
    // that used to be here is exactly the row `slider.mjs` refuses to let a hand
    // live in. Do not build another.
    granControls.push({ disabled: (y) => patchRow.disabled(y) });

    /**
     * One label column across both groups — see the note in <style>.
     *
     * ⚠️ IT MEASURES THE LABEL AND THE VALUE, NOT THE HEAD THAT HOLDS THEM. A
     * head sits in the very column being set, so reading its width after `--lab`
     * is applied reads back the answer rather than the question, and the number
     * can only grow. `.sld-l` and `.sld-v` are `nowrap` and their parent is
     * `align-items: flex-start`, so neither stretches — they measure the same
     * whatever the column does.
     *
     * ⚠️ AND IT IS RE-RUN WHEN A PATCH RENAMES THE READ-HEAD SLIDER. `read
     * speed`, `read position` and `time behind` are all narrower than `radio →
     * granulator`, so in practice the column does not move — but "it happens to
     * be right" is not a reason to depend on it, and the day somebody adds a
     * longer label the lanes would shift sideways on a patch press.
     */
    shareLabelColumn = () => {
      const wide = [wetRow.el, group.el]
        .flatMap((g) => [...g.querySelectorAll('.sld-l, .sld-v')])
        .reduce((m, e) => Math.max(m, e.getBoundingClientRect().width), 0);
      if (!wide) return;
      // ⚠️ THE SOUND PICKER IS IN THE LIST TOO. Its label is not a `.sld-l`, so
      // it is not measured, and a row that is not SET is the row that ends up
      // with a different left edge — which is how the sound picker was reported
      // three times. The assert below reads all three.
      //
      // 🔴 AND EVERY ROW IN THIS LIST IS A ROW THAT EXISTS. It held `loopRow.el`
      // for a session after `loopRow` was set to `null` — the LOOP row had moved
      // into the transport and the list was not moved with it — so this threw
      // `Cannot read properties of null (reading 'el')` on the FIRST call, which
      // is inside `applyPatch`, during the boot. What that cost is not a label
      // column: `applyPatch` died before it could name the patch, so the sound
      // picker read `—`; `startGranulator` died before `boxesReady('controls')`,
      // so the picture and the controls sat dark for the whole 6 s deadline and
      // then lit saying *the granulator never arrived*; and the granulator's own
      // asserts never ran. PHOTOGRAPHED, reported as three separate complaints
      // (*"why viz and granular appear so late?"*, *"patch names??"*, and a red
      // fade check) that were one line of code.
      for (const g of [wetRow.el, group.el, patchRow.el]) {
        g.style.setProperty('--lab', `${Math.ceil(wide)}px`);
      }
    };
    // The patch was applied before any of this existed, so the handles, the
    // name in the picker and the read-head label are all still at their typed
    // defaults. One re-apply puts the picture in step with the sound — and this
    // one speaks, because it is the first moment the page can say what it has
    // loaded to somebody looking at the row it loaded into.
    // Before the first patch lands, so `applyPatch` has somewhere to hand its
    // bases and its routes.
    startModulator();
    applyPatch(patch);
    shareLabelColumn();
    // A late webfont changes every one of those widths, and `document.fonts` is
    // the event for it rather than a guess at how long loading takes.
    document.fonts?.ready?.then(shareLabelColumn).catch(() => {});
    new ResizeObserver(shareLabelColumn).observe(d.el);

    // 🔴 THE SECOND HALF OF THE FADE, AND IT IS AFTER THE COLUMN IS SHARED
    // RATHER THAN AFTER THE APPEND. The rows land at four different left edges
    // and `shareLabelColumn()` is what pulls them into one; lighting before it
    // ran would fade a misaligned row in and then snap it sideways in front of
    // somebody. See the gate by `.gran-slot` at the top.
    boxesReady('controls');

    // ⚠️ AND HERE IS WHERE THE RADIO HAS TO BE PLAYING — not at the top. The
    // harness exercises the transport before anything else and leaves the deck
    // paused and seeked backwards, so `G.loud` would read a confident zero for a
    // page behaving perfectly. Waiting for the ELEMENT rather than sleeping a
    // guess at it.
    await ensurePlaying();

    // ⚠️ HARNESS ONLY — see SELFCHECK at the top. These two tear the stream down
    // and rebuild it, which is a hole a listener hears. They still run before the
    // ring fills, so when they DO run the granulator does not record the gaps.
    if (SELFCHECK) {
      await checkStationButtons();
      await checkTransportStops();
    }

    // 🔴 AND THEN WAIT FOR THE RING TO HOLD SOMETHING. A granulator cannot be
    // louder than what it has recorded, and this one records into an eight
    // second ring that `mscan 0.666` reads two thirds of the way back into.
    //
    // MEASURED, and it is the harness that makes it visible: `verify.mjs`
    // exercises the transport first and leaves the radio PAUSED, so the ring
    // fills with silence for the whole boot — and the deafness control then read
    // **0.0061 running against 0.0067 with the node paused**, a level that does
    // not fall when the synth stops because there was never any signal, only
    // noise. Against a ring that had been recording it reads 0.0554 and 0.0000.
    //
    // 🔴 IT WAITS ON PLAYED SECONDS, NOT ON A LEVEL THRESHOLD, AND THE FIRST
    // VERSION DID THE SECOND. Polling the meter until it passed 0.002 looks like
    // measuring the thing in question and is a threshold picked out of the air:
    // PHOTOGRAPHED, a run left the loop at `warm 0.0021` — over the line, a ring
    // still nearly empty — and the deafness control downstream then read
    // **0.0363 running against 0.0315 paused**, a ratio of 1.15 that failed on a
    // page behaving correctly. A threshold taken from nothing measures nothing
    // (LESSONS #89 in a new costume).
    //
    // The condition is exact and needs no constant of its own: the ring holds
    // `BUF_SECONDS`, so it has been filled once when the ELEMENT has played that
    // much since the engine's input was connected. `audio.currentTime` counts
    // only while sound is actually playing, so a pause — which is exactly what
    // the harness does here — falls out for free rather than being counted as
    // recording time.
    if (LIGHT) d.log('left for the deep run: the ring fill, the ink and sink probes, the patch A/B, '
      + 'the modulation and lock checks and the audible loop (DEMO_DEEP=1)');
    for (let i = 0; i < 150 && !LIGHT && (played() - ringFrom) < BUF_SECONDS; i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    ringFilled = true;
    if (!LIGHT) d.log(`the granulator's ${BUF_SECONDS} s ring has been filled once `
      + `(${(played() - ringFrom).toFixed(1)} s of radio recorded into it)`);

    // 🔴 WHAT THE CHORD COSTS, MEASURED RATHER THAN REASONED ABOUT. `glitchCount`
    // is the only counter that moves in this engine build — `avgCPU` reads 0
    // always (research §10.7) — so it is the one thing that can say whether four
    // voices are more than this machine can do. Read either side of the window
    // the chord is actually sounding in.
    const glitches = () => { try { return eng.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } };
    G.glitchBefore = glitches();

    const t0g = performance.now();
    grains = 0;
    G.loud = await engLevel(2500);
    G.glitchAfter = glitches();
    G.secs = (performance.now() - t0g) / 1000;
    G.grains = grains;
    lastRate = (grains / G.secs).toFixed(1);
    d.set('grains', lastRate);

    // 🔴 EVERYTHING BELOW MOVES CONTROLS AND IS FOR A HARNESS ONLY.
    // The ink probe runs the fader to both ends, the patch A/B presses the sound
    // stepper twice, and the deafness control pauses the engine — so a visitor
    // who was listening to a dry radio station watched the crossfader slide to
    // full granulator, the grain picture light up, the sliders jump to another
    // sound and come back. REPORTED as *"when pressed 0.5 it activated granulator
    // and moved some sliders and showed grain viz"*, which is exactly this,
    // arriving on its own schedule and looking like whatever was pressed last.
    //
    // ⚠️ `muted = true` WAS NOT ENOUGH AND COULD NEVER BE. It stops the probe
    // being HEARD; it does nothing about it being SEEN, and the fader knob, the
    // slider row and the grain picture are all in front of somebody. A check
    // that takes the instrument away from the person holding it has to not run,
    // which is the same conclusion the station A/B and the transport stop
    // reached one defect earlier. `verify.mjs` appends `selfcheck=1`.
    //
    // ⚠️ WHAT STAYS OUTSIDE THIS GUARD IS THE PART A VISITOR WANTS: the ring
    // warm-up, the grain-rate measurement and the `grains` readout are passive
    // and they are the page reporting on itself, not experimenting on itself.
    if (DEEP) {
      // 🔴 DOES A GRAIN ACTUALLY LAND ON THE PICTURE, AND DOES THE FADER MOVE IT?
      // Both halves are here because either alone is passable by a broken page.
      //
      // Ink at the fader's two ends, with the ticks' own colour counted and the
      // FURNITURE excluded — the last four columns hold the live-edge line, which
      // is drawn in that same colour on every frame whether a grain has ever
      // arrived or not (LESSONS #75: an assert on ink must exclude the furniture).
      // Counting it would have passed this check throughout the entire period the
      // ticks were being drawn off the left edge of the canvas.
      //
      // ⚠️ THE DRY READING IS THE CONTROL AND IT IS WHAT MAKES THE WET ONE MEAN
      // ANYTHING. A probe that reads ink everywhere is a probe that cannot see,
      // and this one is required to read ~nothing with the fader at 0 and
      // something with it at 1 — which grades the alpha and the tick positions in
      // one pair of numbers.
      const inkNow = () => {
        const c = scope.canvas, g = c.getContext('2d');
        // ⚠️ EXCLUDE THE LIVE-EDGE LINE GENEROUSLY. It used to be drawn in the
        // ticks' own colour on every frame whether a grain ever arrived or not,
        // and the old 4-CSS-pixel margin was computed from `clientWidth`, which
        // is 0 while the element is being laid out — so on a dpr-3 phone the
        // margin collapsed to 4 BACKING pixels and counted the line. REPORTED
        // from an iPhone as `2834 lit all-radio, 2832 lit all-granulator`: a
        // constant, at both ends of a fader that is supposed to separate them.
        // LESSONS #75.
        // ⚠️ THE COLOUR CLASH IS GONE AND THE MARGIN STAYS. That line is grey
        // now, so it can no longer be counted as a grain — but the margin costs
        // 12 px of a measurement that has thousands to spare, and removing a
        // guard because the thing it caught has moved is how the thing comes
        // back.
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const px = g.getImageData(0, 0, Math.max(1, c.width - Math.ceil(12 * dpr)), c.height).data;
        let lit = 0;
        for (let i = 0; i < px.length; i += 4) {
          if (px[i] > 200 && px[i + 1] > 150 && px[i + 2] < 100) lit++;
        }
        return lit;
      };
      // ⚠️ AND IT RECORDS HOW MANY TICKS WERE ALIVE WHEN IT LOOKED. Ink alone
      // cannot separate "the ticks are not being drawn" from "there was nothing to
      // draw" — MEASURED during an upstream outage, where this read `0 lit` at
      // both ends and the reason was a station returning 502, not the picture.
      // Two different faults with one number between them is the shape this repo
      // keeps paying for; the count makes the failure attributable on sight.
      // 🔴 SAMPLE ACROSS FRAMES, NOT AT ONE INSTANT, AND THIS IS A RETRY RATHER
      // THAN A TOLERANCE. A tick lives `fadeMs` — about half a second — so at
      // eight grains a second only a handful are bright at any moment, and one
      // `getImageData` can land between them. MEASURED: two runs of this check,
      // no code between them, read `128 lit` and then `0 lit` on a granulator
      // measuring 0.0848 both times. That is the same trap `verify.mjs`'s own
      // strip check carries a note about.
      //
      // Taking the MAX over a window cannot rescue a picture that never draws —
      // every try still reads zero — but it stops a working one reading broken.
      // ⚠️ The dry end is sampled exactly the same way, or the comparison would be
      // one number's best against another's worst.
      const inkOver = async (ms) => {
        let best = 0;
        const until = performance.now() + ms;
        while (performance.now() < until) {
          await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
          best = Math.max(best, inkNow());
        }
        return best;
      };
      // 🔴 SAVE THE FADER BEFORE THE PROBE MOVES IT. `setWet` ASSIGNS to `wet`,
      // so after the probe ran it to both ends `wet` held the probe's last value —

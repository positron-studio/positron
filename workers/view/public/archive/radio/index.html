      // and "restore" then restored that. REPORTED twice as the crossfade
      // dropping to 0 on its own, and it was: the page put it there and called it
      // putting it back. The slider is moved too, or the knob and the gain
      // disagree, which is the page showing one thing and playing another.
      const wasWet = wet;
      muted = true;                      // the self-check is not allowed to be heard
      setWet(0); await new Promise((r) => setTimeout(r, 400)); G.inkDry = await inkOver(1200);
      setWet(1); await new Promise((r) => setTimeout(r, 400)); G.inkWet = await inkOver(1200);
      // ⚠️ `flickering` is `live.length`, and in THIS branch of the scope old marks
      // are skipped rather than spliced — so it climbs to the 600 cap and says
      // only that marks are arriving, never that any were drawn. Kept because it
      // separates "no grains at all" from "grains but no ink"; it is not evidence
      // of painting, and an earlier version of this note claimed it was.
      G.alive = scope.stats().flickering;

      /**
       * 🔴 CAN THE METER HEAR THE GRANULATOR AT ALL — WITH A CONTROL THAT PROVES
       * IT CAN ALSO HEAR SILENCE.
       *
       * This is the check the graph could not pass until `speakers` existed.
       * `sink` was fed by the station's own path and by the loop's gain, and the
       * engine reached the destination by a route of its own, so at the fader's
       * granulator end the meter read exactly 0.0000 over a signal that was
       * playing — and every check built on it passed by measuring nothing.
       *
       * ⚠️ THE FADER IS HARD OVER AND `dry` IS THEREFORE AT ZERO, so the station
       * cannot be what is heard. That is the half that makes the reading mean
       * "the granulator", rather than "something".
       *
       * ⚠️ AND THE NEGATIVE CONTROL IS THE SAME MEASUREMENT WITH THE OUTPUT
       * MUTED. A statistic that is non-zero however the page is set is a blind
       * measurement, not a weak one — so the pair is taken at the same fader
       * position, over the same window length, with only the mute moved.
       * MEASURED: 0.0000 muted against 0.30 unmuted.
       *
       * ⚠️ THE MUTE COMES OFF FOR ABOUT A SECOND, AND ONLY UNDER `selfcheck=1`.
       * It cannot be measured through a mute, because a mute is exactly the
       * thing being measured. `dry` stays at zero throughout, so what a person
       * running the harness by hand would hear is a second of granulator and no
       * station.
       */
      const meterOver = async (ms) => {
        sinkPeak = 0;
        await new Promise((r) => setTimeout(r, ms));
        return sinkPeak;
      };
      muted = true; setWet(1);
      await new Promise((r) => setTimeout(r, 250));
      G.sinkMuted = await meterOver(400);
      muted = false; setWet(1);
      await new Promise((r) => setTimeout(r, 250));
      G.sinkGrains = await meterOver(500);
      G.sinkDry = dry ? dry.gain.value : 1;
      G.sinkEng = eng ? eng.out.gain.value : 0;
      muted = true; setWet(1);

      // 🔴 TWO PATCHES, THROUGH THE REAL BUTTON, WHILE NOTHING CAN BE HEARD.
      // The asserts in `finish()` can only grade the patch that happens to be
      // selected, and this row is the page's main control: `verify.mjs` presses
      // `.pos-controls button, .tbar-x` and a picker is neither, so shipping it
      // without a check here would be a chooser nobody grades — exactly how
      // `mirror` lost two asserts while reading green.
      //
      // ⚠️ DRIVEN BY CLICKING `›`, NEVER BY CALLING `applyPatch`: the fault this
      // exists to catch lives in the wiring between the button and the engine, and
      // calling the handler steps straight over it (`/floor/` spent five rounds on
      // that). ⚠️ AND IT PUTS THE PATCH BACK, through `‹`, so the restore is
      // exercised by the same path and the page is not left on a sound nobody
      // chose — the station buttons below carry the same rule for the same reason.
      //
      // 🔴 EVERYTHING IS ASKED OF THE SERVER, NOT READ BACK OFF THIS PAGE. Every
      // `/n_set` here is fire-and-forget, so `PATCHES[patch]` proves nothing about
      // what scsynth holds; `/s_get`, `/s_getn` and `/b_getn` are the only things
      // on the far side of the wire. Three kinds of message carry a patch and they
      // fail differently, so all three are read back: scalars (`/n_set`), the
      // eight-element voice arrays (`/n_setn`, which is what a scalar sent by
      // mistake would silently become), and the sixteen-step pattern, which is a
      // BUFFER and not a control at all.
      const ask1 = async (name) => {
        const r = await eng.sendAndWait(
          (m) => m[0] === '/n_set' && m[2] === name, 3000, '/s_get', PAPPUS_NODE, name);
        return r ? r[3] : null;
      };
      const askN = async (name, n) => {
        const r = await eng.sendAndWait(
          (m) => m[0] === '/n_setn' && m[2] === name, 3000, '/s_getn', PAPPUS_NODE, name, n);
        return r ? r.slice(4, 4 + n).map(Number) : null;
      };
      const askPattern = async () => {
        const r = await eng.sendAndWait(
          (m) => m[0] === '/b_setn' && Number(m[1]) === GATE0, 3000, '/b_getn', GATE0, 0, 16);
        return r ? r.slice(4, 20).map(Number) : null;
      };
      // The scalars that decide what kind of sound this is: how the read head
      // moves, how fast and how long the grains are, how wide, how scattered, how
      // the rhythm is divided, and the two chain stages a bare granulator has
      // never had. One `/s_get` each.
      const SCALARS = [
        ['mscanmode', (p) => p.scanmode], ['mrate', (p) => p.rate], ['msize', (p) => p.size],
        ['mcontour', (p) => p.contour], ['mswarm', (p) => p.swarm], ['mspray', (p) => p.spray],
        ['mspraymode', (p) => p.spraymode], ['melen', (p) => p.elen], ['msos', (p) => p.sos],
        ['swet', (p) => p.swet], ['rverb', (p) => p.rverb], ['kwow', (p) => p.wow],
      ];
      const readScalars = async () => {
        const got = {};
        for (const [name] of SCALARS) got[name] = await ask1(name);
        return got;
      };
      const missing = (p, got) => SCALARS
        .filter(([name, want]) => !(Math.abs((got[name] ?? NaN) - want(p)) < 1e-3))
        .map(([name, want]) => `${name} ${got[name]} not ${want(p)}`);

      /**
       * 🔴 `/s_get` ON A CONTROL THE ENGINE DOES NOT HAVE ANSWERS 0, NOT A
       * REFUSAL, AND THAT MAKES THE CHECK ABOVE BLIND WHERE THE ANSWER IS 0.
       *
       * The comment further up is right that a misspelled control is discarded
       * in silence, and reading twelve of them back is the right answer to it.
       * What neither knew is what a read of a name that does not exist returns.
       * MEASURED from a non-zero base: `mswarm` held 0.37, writing `mswarmXYZ`
       * left it at 0.37, and both `mswarmXYZ` and a never-written control read
       * back **0.00000**. So the readback cannot tell "the engine holds zero"
       * from "there is no such control".
       *
       * That is not hypothetical here. FIVE of the twelve scalars are expected
       * to be exactly 0 in some patch (`contour`, `swarm` in six of them, `swet`,
       * `rverb`, `wow`), and for those the comparison above passes on a name the
       * engine never had.
       *
       * ⚠️ SO THE NAME IS PROVED SEPARATELY FROM THE VALUE, and only where it
       * has to be: a sentinel no patch uses is written, read back, and the
       * patch's own value put back. A name that does not exist swallows the
       * write and answers 0, which is now a failure rather than a pass.
       */
      const SENTINEL = 0.4271;
      async function namesExist(p) {
        const bad = [];
        for (const [name, want] of SCALARS) {
          if (Math.abs(want(p)) > 1e-9) continue;      // its value already proves it
          setParam(eng, name, SENTINEL);
          await new Promise((r) => setTimeout(r, 30));
          const back = await ask1(name);
          setParam(eng, name, want(p));                // put the patch back
          if (!(Math.abs(back - SENTINEL) < 1e-3)) bad.push(`${name} read ${back}`);
        }
        await new Promise((r) => setTimeout(r, 30));
        return bad;
      }

      const herePatch = patch;
      const otherPatch = (patch + 1) % PATCHES.length;
      // 🔴 HELD FOR THE WHOLE A/B, AND THIS IS NOT BELT AND BRACES. Every read
      // below compares a control against a number typed in the patch table, and
      // a modulated control legitimately differs from that number — MEASURED
      // the first time any of this ran: `msize 2.44 not 1.8`. It passes today
      // only because the patch next door happens to be `slowed`, the one patch
      // with no routes; reorder the table and this check goes red for a reason
      // that has nothing to do with what it is checking.
      modulator?.hold(true);
      await new Promise((r) => setTimeout(r, 200));
      selfCheck = true;                  // so the log names a press nobody made
      patchRow.buttons[1].click();                   // `›`, the next sound
      await new Promise((r) => setTimeout(r, 120));
      G.otherMode = await ask1('mscanmode');
      G.otherElen = await ask1('melen');
      // 🔴 READ THE GRAIN SETTINGS TOO, OR TWO NEIGHBOURS CAN BE INDISTINGUISHABLE.
      // This graded `mscanmode`, `melen` and the pattern only — three keys that
      // two legitimately different sounds can share. MEASURED the moment
      // `stutter` was replaced by a neighbour that also crawled the read head
      // (mode 1, no euclid): the check went red saying
      // they did not differ — while the engine had in fact taken a different
      // rate, length, blend and delay. The check was right that IT could not see
      // a change and wrong that there was none, which is the worse of the two.
      G.otherRate = await ask1('mrate');
      G.otherSize = await ask1('msize');
      G.otherPattern = await askPattern();
      patchRow.buttons[0].click();                   // `‹`, and back
      await new Promise((r) => setTimeout(r, 120));
      selfCheck = false;
      G.here = patch;
      modulator?.hold(false);
      /**
       * 🔴 DOES THE MOVEMENT ACTUALLY REACH THE ENGINE, AND DOES IT STOP?
       * Both halves, because either alone passes on a broken page. A control
       * that drifts for any reason would satisfy the first; a page that never
       * modulates anything satisfies the second. The pair is the measurement.
       *
       * ⚠️ IT IS SAMPLED THROUGH `/s_get`, so it is read from INSIDE the graph
       * rather than from the page's own idea of what it sent — the same reason
       * every other check here asks the engine instead of reading a variable
       * back. A count of messages posted would have proved nothing: LESSONS
       * says a count is only evidence on the far side of the wire.
       */
      // ⚠️ IT COUNTS ITS OWN READINGS. A spread of exactly 0.000 is what a
      // perfectly held control reads AND what a sampler that got nothing back
      // reads — and this repo's rule is that a partial result which is too tidy
      // is a broken collector rather than a finding. So the count comes back
      // with the number and the assert requires both.
      const sampleSpread = async (name, n = 10, ms = 160) => {
        let lo = Infinity, hi = -Infinity, got = 0;
        for (let k = 0; k < n; k++) {
          const v = await ask1(name);
          if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); got++; }
          await new Promise((r) => setTimeout(r, ms));
        }
        return { spread: got ? hi - lo : 0, got };
      };
      /**
       * 🔴 THE DESTINATION IS READ OFF THE SOUND THAT IS PLAYING, NEVER TYPED,
       * AND THE TYPED ONE WAS ALREADY WRONG. This said `msize` with a comment
       * that `four seconds ago` routes the follower onto grain length. That was
       * true when it was written and false since the page was told to open on `dub`
       * instead, whose three routes are `sos`, `drive` and `spray` and not one
       * of them is `size`. So it sampled a control nothing was moving, read a
       * perfectly flat `0.000`, and went red every run about a modulator that
       * was working: MEASURED 2026-09-16, `msize spanned 0.000 s over 10 reads
       * while the follower ran`.
       *
       * ⚠️ IT TAKES A FOLLOWER ROUTE, not any route. The point of this check is
       * that THE STATION is moving the instrument, and the shapes this page
       * generates are graded separately below with a known 2 Hz input. An `lfo`
       * here at 0.035 Hz would be legitimately flat over 1.6 s.
       * ⚠️ AND IT USES THE SAME NAME THE MODULATOR WRITES. Four destinations are
       * global controls with no `m` prefix, which is what `MOD_CMD` is for; a
       * read of `mdrive` answers 0 rather than refusing.
       */
      const follows = (PATCHES[herePatch].mod || [])
        .find((r) => String(r.src).startsWith('env') && r.dest !== 'probs');
      G.modDest = follows ? (MOD_CMD[follows.dest] ?? `m${follows.dest}`) : null;
      G.modMoved = G.modDest ? await sampleSpread(G.modDest) : { spread: 0, got: 0 };
      // The negative control: hold it, and the SAME sampling must read a flat
      // line. Prove a guard fires.
      modulator?.hold(true);
      await new Promise((r) => setTimeout(r, 250));
      G.modStill = G.modDest ? await sampleSpread(G.modDest, 6) : { spread: 0, got: 0 };

      /**
       * 🔴 AND A SOURCE THAT IS NOT THE STATION, BECAUSE THE CHECK ABOVE CANNOT
       * SEE ONE. The follower is the only source the opening patch can be
       * relied on to move quickly, so a page whose LFOs, shapes and memory
       * were all dead would pass every assert above — and those are most of
       * what makes two patches different from each other.
       *
       * ⚠️ IT DRIVES A KNOWN INPUT RATHER THAN WATCHING A SLOW ONE. The real
       * routings here run at 0.014 to 0.08 Hz, which is the point of them, and
       * a 70-second wave sampled for 1.1 s can legitimately be flat — an assert
       * that is only PROBABLY true is worse than none. So the probe installs a
       * 2 Hz saw, which cannot be stationary, exercises the whole path
       * (`setRoutes` → `tick` → `/n_set` → the graph), reads it back with
       * `/s_get`, and puts the patch's own routes back.
       */
      modulator?.setRoutes([{ src: 'lfo', shape: 'saw', hz: 2, dest: 'swarm', amt: 0.9 }]);
      modulator?.hold(false);
      await new Promise((r) => setTimeout(r, 150));
      G.lfoMoved = await sampleSpread('mswarm', 8, 140);
      modulator?.hold(true);
      await new Promise((r) => setTimeout(r, 250));
      G.lfoStill = await sampleSpread('mswarm', 4, 120);
      // 🔴 THE PATCH'S OWN ROUTES BACK, OR THE PAGE IS LEFT PLAYING THE PROBE.
      // The same rule the station A/B already follows: a self-check is not
      // allowed to leave the instrument somewhere nobody chose.
      modulator?.setRoutes(PATCHES[patch].mod || []);

      /**
       * 🔴 THE TEMPO CLAIM, GRADED WHERE THE SUITE CAN SEE IT.
       *
       * The page also presses the real LOOP button at the very end of the run
       * and checks the same thing there. That one is NOT COLLECTED: MEASURED,
       * the page makes 30 asserts and `verify.mjs` reads 28, because the loop
       * test sits a full second behind the burst and the stabiliser stops 400 ms
       * after the count last grew. So the arithmetic and the write to scsynth
       * are graded here, in the burst, where they are read.
       *
       * ⚠️ A LENGTH NO PATCH COULD HAVE BEEN WRITTEN FOR. 2.5 s divides none of
       * the grain rates in the table, so a `lockGrainsToLoop` that did nothing
       * at all would leave a rate that is NOT a whole number of bars — which is
       * what makes the number below evidence rather than a coincidence.
       *
       * ⚠️ AND IT MUST PUT THE RATE BACK, because `readScalars` two lines down
       * compares `mrate` against the patch's own number. Both halves are
       * asserted: a lock that never releases is a page left tuned to a loop
       * nobody is playing.
       */
      const LOCK_SECONDS = 2.5;
      G.lockSeconds = LOCK_SECONDS;
      G.lockElen = Math.max(1, PATCHES[patch].elen || 1);
      G.lockWant = PATCHES[patch].rate;
      lockGrainsToLoop(LOCK_SECONDS);
      await new Promise((r) => setTimeout(r, 120));
      G.lockRate = await ask1('mrate');
      lockGrainsToLoop(null);
      await new Promise((r) => setTimeout(r, 120));
      G.unlockRate = await ask1('mrate');

      /**
       * 🔴 EVERY SOUND IN THE LIST, ASKED OF THE ENGINE, AND NO TWO THE SAME.
       *
       * This table's whole history is the same complaint three times over —
       * *"patches still too similar"* — and every previous answer was an author
       * asserting that the numbers were further apart. LESSONS #59 is the same
       * shape: a randomiser over nine overlapping ranges makes one sound with
       * nine names. So the claim is graded instead, and on the far side of the
       * wire: each patch is applied, six architectural controls are read back
       * off scsynth, and the twelve answers must be twelve DIFFERENT answers.
       *
       * ⚠️ THE SIX ARE THE ONES THAT DECIDE WHAT KIND OF SOUND IT IS, not what
       * colour. How the read head moves, how long the figure is, the grain clock,
       * the grain length, the roll inside a grain period, and where the window
       * starts. Two patches that agreed on all six would be one patch with two
       * names whatever their reverb was set to — which is exactly what the old
       * seven were.
       *
       * ⚠️ AND IT ASKS FOR ALL SIX IN ONE MESSAGE. `/s_get` takes a list and
       * answers with one `/n_set` carrying every pair, so this is twelve round
       * trips rather than seventy-two — which matters, because the whole
       * self-check has to finish inside the harness's settle.
       */
      const askSome = async (names) => {
        const r = await eng.sendAndWait(
          (m) => m[0] === '/n_set' && m[2] === names[0], 3000, '/s_get', PAPPUS_NODE, ...names);
        const got = {};
        if (r) for (let i = 2; i + 1 < r.length; i += 2) got[String(r[i])] = Number(r[i + 1]);
        // ⚠️ A SERVER THAT ANSWERED ONLY THE FIRST NAME MUST NOT READ AS ELEVEN
        // IDENTICAL PATCHES. Anything the batch did not carry is asked for on
        // its own rather than left `undefined`, which would make every
        // fingerprint below collapse onto the same string.
        for (const n of names) if (!Number.isFinite(got[n])) got[n] = await ask1(n);
        return got;
      };
      const KINDS = ['mscanmode', 'melen', 'mrate', 'msize', 'mstrum', 'mwinstart'];
      const r3 = (x) => (Number.isFinite(x) ? Math.round(x * 1000) / 1000 : 'none');
      G.kinds = [];
      for (let i = 0; i < PATCHES.length; i++) {
        applyPatch(i, { silent: true });
        await new Promise((r) => setTimeout(r, 40));
        const got = await askSome(KINDS);
        G.kinds.push({ name: PATCHES[i].name, got,
          key: KINDS.map((k) => r3(got[k])).join('/'),
          // and what the table asked for, so a mismatch names itself
          want: [PATCHES[i].scanmode, Math.max(1, PATCHES[i].elen || 1), PATCHES[i].rate,
                 PATCHES[i].size, PATCHES[i].strum,
                 PATCHES[i].scanmode >= 3 ? 0 : (PATCHES[i].winstart ?? 0)].map(r3).join('/') });
      }
      // 🔴 AND THE PAGE IS PUT BACK ON THE SOUND IT WAS ON. A self-check that
      // leaves the instrument on the last thing it tried is the station A/B's
      // old bug in another costume.
      applyPatch(herePatch, { silent: true });
      await new Promise((r) => setTimeout(r, 40));

      G.scalars = await readScalars();
      G.gates = await askN('gates', 8);
      G.pitches = await askN('pitches', 8);
      G.probs = await askN('probs', 8);
      G.pattern = await askPattern();
      G.patch = PATCHES[herePatch];
      G.otherWant = PATCHES[otherPatch];
      G.wrong = missing(G.patch, G.scalars);
      // 🔴 AND THE NAMES, WHERE THE VALUES CANNOT PROVE THEM. See `namesExist`:
      // a control the engine does not have reads back 0 rather than refusing,
      // so every scalar a patch sets to exactly 0 is graded by a comparison a
      // misspelling also passes. Five of the twelve are 0 in some patch.
      // ⚠️ IT LIVES HERE, BESIDE `readScalars`, BECAUSE THAT IS WHERE `ask1`
      // AND `SCALARS` ARE. Put beside the patch assert two thousand lines up it
      // was a ReferenceError that killed the whole check run, and the suite then
      // reported 13/13 green about a page that had asserted nothing of its own.
      G.names = G.patch ? await namesExist(G.patch) : ['no patch was applied'];

      // 🔴 HAND THE INSTRUMENT BACK MOVING. Leaving the hold on would end the
      // self-check with a granulator that is correct and dead — the page
      // quietly switching off the feature it just proved.
      modulator?.hold(false);
      muted = false;
      setWet(wasWet);                    // the value the LISTENER left, not the probe's
      fader.set(wasWet, { quiet: true });
      fader.set(0, true);            // quiet: leave the page as the visitor finds it
      setWet(0);

      // 🔴 A DEAFNESS CONTROL. `/n_run 0` pauses the node; if the level does not
      // follow, what is being heard came from somewhere else. ⚠️ AND A GRAIN
      // COUNT WOULD NOT HAVE CAUGHT THIS: measured, a Pappus with its input
      // disconnected fired 4–5 grains per window while outputting exactly 0.
      // ⚠️ AND IT LETS THE TAIL GO FIRST. `engLevel` holds a PEAK, so a window
      // opened the instant `/n_run 0` is sent captures the message's own latency
      // plus the grains already in flight — a grain is `msize` long and is not
      // cancelled by pausing the node that started it. Measuring through that is
      // measuring the tail, and it reports a granulator that never stopped. Four
      // hundred milliseconds is three grain lengths at the default 0.12 s.
      eng.send('/n_run', PAPPUS_NODE, 0);
      await new Promise((r) => setTimeout(r, 400));
      G.quiet = await engLevel(1200);
      eng.send('/n_run', PAPPUS_NODE, 1);

      /**
       * 🔴 THE LOOP'S PLAYHEAD, DRIVEN AND THEN READ OFF THE CANVAS.
       *
       * A live loop is being built in the transport bar and it will move this
       * line; nothing on this page moves it yet. A seam nobody exercises is a
       * seam that is broken on the day it is first used, so the check drives it
       * directly and grades the PIXELS — where the line landed, how wide it is,
       * and whether the wave under it actually stopped.
       *
       * ⚠️ LAST, AFTER THE INK PROBE, AND THAT ORDER DECIDES THE READING. The
       * playhead is drawn in the same colour `inkNow` counts, so setting one
       * before `G.inkDry` would have added a full-height column of it to the
       * reading that is supposed to be nearly empty. The fader is at 0 by now,
       * so no grain tick is drawn either (the scope skips the layer outright at
       * zero) and the tallest column in that colour can only be this line.
       *
       * ⚠️ AND IT PUTS THE PICTURE BACK. Same rule as the station A/B and the
       * patch A/B: a self-check is not allowed to leave the instrument
       * somewhere nobody chose, and a frozen waveform is exactly that.
       */
      const headInk = () => {
        const c = scope.canvas, g = c.getContext('2d');
        const px = g.getImageData(0, 0, c.width, c.height).data;
        const cols = new Array(c.width).fill(0);
        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            const i = (y * c.width + x) * 4;
            // 🔴 NEAR WHITE, BECAUSE THE PLAYHEAD IS `--fg` NOW AND NOT
            // `--hi`. It was found by looking for yellow, which is the grain
            // ticks' colour and was the playhead's too; greying the loop
            // furniture would have left this counting a line that is no longer
            // there and reading `0 lit` about a picture with a playhead in it.
            // A colour test in a check is a copy of a stylesheet value, and it
            // has to move when the stylesheet does.
            if (px[i] > 180 && px[i + 1] > 180 && px[i + 2] > 180) cols[x]++;
          }
        }
        let tall = 0, at = -1, wide = 0;
        for (let x = 0; x < c.width; x++) {
          if (cols[x] > tall) { tall = cols[x]; at = x; }
          if (cols[x] >= c.height * 0.9) wide++;
        }
        return { at: at / c.width, tall: tall / c.height, wide };
      };
      // Two frames: the first carries the `playhead()` call into a paint, the
      // second is the paint that has it.
      const twoFrames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // ⚠️ IN BACKING PIXELS. The line is one CSS pixel wide by declaration and
      // the canvas is `dpr` backing pixels per CSS pixel, so a fixed 1 here
      // would read as a failure on every retina screen.
      G.headDpr = Math.min(2, window.devicePixelRatio || 1);
      G.headAt = [];
      for (const f of [0.25, 0.75]) {
        scope.playhead(f);
        await twoFrames();
        G.headAt.push({ want: f, ...headInk() });
      }
      // 🔴 WHAT FREEZING MEANS CHANGED, AND THIS MEASURES THE NEW THING. It
      // used to count `feed()` calls and require ZERO of them while frozen,
      // because a frozen picture dropped its samples and the held columns were
      // wiped on release. That left a hole in the wave for as long as the loop
      // ran, and it was reported: **there was no silence**, the loop was
      // playing into the same graph the whole time. So the picture goes on
      // RECORDING while it is stopped and the thing that stops is the right
      // EDGE. The claim is now that the edge held still and then moved.
      const frozenEdge = scope.stats().frozen;
      /**
       * 🔴 AND THE WAVE IS STILL THE WHOLE WAVE A SECOND LATER.
       *
       * REPORTED as the waveform being *"chipped away"* under a loop, and the
       * check above cannot see it: the right edge held perfectly still the
       * whole time, which is all `frozen` ever claimed. The picture was drawn
       * against the frozen clock while `feed()` went on trimming its columns
       * against the running one, so the wave was eaten from the LEFT at one
       * second of picture per second of loop, against marks that did not move.
       *
       * ⚠️ MEASURED OFF THE CANVAS, NOT OFF A COLUMN COUNT. `grain-scope` holds
       * a snapshot now, so its own array length is constant by construction and
       * a check on it could not fail. Where the grey ink STARTS is the quantity
       * a reader is looking at, and it is the one that moved.
       */
      const waveSpan = () => {
        const c = scope.canvas, g = c.getContext('2d');
        const px = g.getImageData(0, 0, c.width, c.height).data;
        const y0 = Math.round(c.height * 0.1), y1 = Math.round(c.height * 0.9);
        let left = -1, right = -1;
        for (let x = 0; x < c.width; x++) {
          let hit = false;
          for (let y = y0; y < y1 && !hit; y++) {
            const i = (y * c.width + x) * 4;
            // the wave is `--line2` (43,53,70): bluer and brighter than the
            // field (17,21,29) and than the border (31,41,55). The playhead is
            // `--fg` and the loop's marks are `--dim2` (106,114,128), both far
            // redder than that, so the red channel excludes them and the blue
            // channel excludes the field and the border.
            if (px[i + 2] >= 62 && px[i] < 80) hit = true;
          }
          if (hit) { if (left < 0) left = x; right = x; }
        }
        return { left: left < 0 ? null : left / c.width, right: right < 0 ? null : right / c.width };
      };
      const spanAt = waveSpan();
      await new Promise((r) => setTimeout(r, 1200));
      await twoFrames();
      const spanLater = waveSpan();
      G.frozenSpan = { at: spanAt, later: spanLater,
        cols: scope.stats().frozenCols };
      G.headHeld = frozenEdge && scope.stats().frozen ? 0 : 1;
      const fedWhileHeld = scope.stats().inferred;
      scope.loopOff();
      const fedAgain = scope.stats().inferred;
      G.keptWhileFrozen = fedWhileHeld;
      await new Promise((r) => setTimeout(r, 300));
      G.headRuns = scope.stats().inferred - fedAgain;
      await twoFrames();
      G.headGone = scope.stats().playhead == null && !scope.stats().frozen;
      /**
       * 🔴 THE LOOP ROW, THROUGH ITS OWN BUTTONS, ON A REAL LOOP.
       *
       * `verify.mjs` presses `.pos-controls button, .tbar-x` and this row is
       * neither, so a row shipped without this is a control nobody grades —
       * which is exactly how `mirror` lost two asserts while reading green. It
       * clicks the real buttons rather than calling `looper.setWay`, because the
       * fault this kind of check exists to catch lives in the wiring between the
       * button and the handler and calling the handler steps straight over it.
       *
       * ⚠️ IT IS READ OFF THE VOICE THAT IS PLAYING, NOT OFF THE PAGE'S OWN IDEA
       * OF WHAT IT DID. `looper.voice()` is the node the sound comes out of,
       * so which buffer it holds, how long its lap is and what rate it runs at
       * are three facts about the audio graph rather than three variables this
       * function set. A check on the way NUMBER would pass over a row wired to
       * nothing at all.
       *
       * ⚠️ AND THE MIRROR IS CHECKED ON THE SAMPLES. "Reversed" is the one claim
       * here that a buffer identity cannot make: a copy that is merely DIFFERENT
       * would satisfy it. Four points are compared against the kept seconds at
       * the mirrored index, exactly, which costs nothing and cannot pass by
       * accident.
       *
       * ⚠️ IT MUST END WITH THE LOOP OFF, and for the reason every other check
       * in this block ends by putting its control back: a page left looping
       * seconds nobody asked for, with the grain clock tuned to them, is a
       * self-check that took the instrument away from whoever was holding it.
       * The third press also restores the patch's own grain rate, which the
       * end-of-run loop check then measures from scratch.
       */
      // ⚠️ LAST IN THE BLOCK, AND THAT POSITION IS A MEASUREMENT RATHER THAN
      // TIDINESS. `grain-scope.mjs` KEEPS a loop's two end marks after the loop
      // stops — they age off the left with the audio they belong to — and
      // `playhead()` only freezes the picture when there has never been one. So
      // a loop made before the playhead checks above leaves two full-height
      // lines on the canvas and a picture that will not freeze: MEASURED, both
      // of them went red, reading `drew at 0.467` and `3 of 1 backing px wide`
      // about a scope that was working perfectly.
      // ⚠️ AND IT IS MUTED, because the mute came off a few lines up. The
      // fader is at 0 by now, so `dry` at 1 is what would carry the loop out of
      // the speakers; the same flag the rest of this block uses takes it down.
      {
        muted = true; setWet(0);
        const TB = window.__demo?.transport;
        const wayBtn = TB?.loopExtra ? TB.loopExtra('way') : bar?.loopExtra('way');
        G.ways = []; G.turns = [];
        if (TB && looper.attached() && wayBtn) {
          TB.pressLoop();                                  // open a window
          await new Promise((r) => setTimeout(r, 700));
          TB.pressLoop();                                  // and close it here
          await new Promise((r) => setTimeout(r, 200));
          const whole = looper.buffer() ? looper.buffer().duration : 0;
          /**
           * 🔴 DRIVEN BY THE REAL BUTTON WHERE THERE IS ONE. The three
           * directions are reached the way a visitor reaches them — pressing
           * the thing glued to LOOP until the face says what is wanted — so a
           * cycle that skips a way, sticks, or leaves the wrong glyph showing
           * fails here rather than looking fine. `half` and `chop` have no
           * control at all, and pretending otherwise by driving them through a
           * fake press would be a check about nothing.
           */
          /**
           * ⚠️ IT CONFIRMS WHERE IT LANDED, BECAUSE THIS BUTTON HAS A SECOND
           * PRESSER. `demo/verify.mjs` presses `.pos-controls button, .tbar-x`
           * on every page and this is a `.tbar-x`, so exactly one harness click
           * arrives on it at a moment nothing here controls.
           * 🔴 AND THE MOMENT HAS MOVED TWICE, WHICH IS WHY IT IS CONFIRMED
           * RATHER THAN REASONED ABOUT. `settleMs` lands on control 0 only. With
           * no declared controls this IS control 0, so the press arrives at the
           * start of the run; the day `Automate` was added it became control 1
           * and the press slid to about thirty seconds in, which MEASURED as
           * `pingpong 0.68 s` against 1.37 and a face reading `≠` on a cycle
           * that was working; `Automate` was removed on 2026-09-16 and it is
           * back at the start. Nothing here should have to know which of those
           * is true today. Reaching again once covers a single stray press at
           * any time and costs nothing when there is none.
           */
          const reach = async (i) => {
            for (let go = 0; go < 2; go++) {
              if (LOOP_TURN.includes(i)) {
                for (let n = 0; n < LOOP_TURN.length && looper.way() !== i; n++) wayBtn.click();
              } else looper.setWay(i);
              await new Promise((r) => setTimeout(r, 150));
              if (looper.way() === i) return;
            }
          };
          for (let i = 0; i < LOOP_WAYS.length; i++) {
            await reach(i);
            G.ways.push({
              name: LOOP_WAYS[i][0],
              lap: looper.voice() ? looper.voice().loopEnd - looper.voice().loopStart : null,
              rate: looper.voice() ? looper.voice().playbackRate.value : null,
              back: !!(looper.voice() && looper.mirror() && looper.voice().buffer === looper.mirror()),
              // the FACE, read off the page rather than off the table it was
              // written from: a glyph set by one path and not the other is the
              // whole reason the looper is the only place that writes it.
              face: wayBtn.textContent,
              want: WAY_GLYPH[LOOP_WAYS[i][1]],
              whole,
            });
          }
          /**
           * 🔴 WHICH WAY THE LINE ON THE PICTURE ACTUALLY MOVES.
           *
           * REPORTED as the viz not following the mode, and nothing here could
           * have caught it: every check above reads the VOICE — its buffer, its
           * lap, its rate — and the defect was entirely in the arithmetic that
           * turns a voice into a fraction of the picture. Under pingpong the
           * line crossed once and then sat against the right edge for the whole
           * return half, which is a playhead that is wrong about half the sound
           * and looks like a playhead the whole time.
           *
           * So this samples the head itself and counts which way it went, over
           * a window long enough to contain a turn. A jump over half the width
           * is the lap coming round and is not a direction.
           */
          for (const i of LOOP_TURN) {
            await reach(i);
            const lapS = Math.max(0.05, looper.lapSeconds()
              / Math.max(0.01, looper.voice()?.playbackRate.value ?? 1));
            const span = Math.min(2.2, lapS * 1.15);
            const step = 50, n = Math.max(6, Math.round((span * 1000) / step));
            let up = 0, down = 0, seen = 0, prev = looper.headFrac();
            for (let k = 0; k < n; k++) {
              await new Promise((r) => setTimeout(r, step));
              const f = looper.headFrac();
              if (f == null || prev == null) { prev = f; continue; }
              const dz = f - prev; prev = f; seen++;
              if (Math.abs(dz) > 0.5) continue;            // the lap coming round
              if (dz > 0.002) up++; else if (dz < -0.002) down++;
            }
            G.turns.push({ name: LOOP_WAYS[i][0], up, down, seen, lap: lapS });
          }
          // The mirror, on the samples, at four points across the seconds.
          if (looper.buffer() && looper.mirror()) {
            const a = looper.buffer().getChannelData(0), b = looper.mirror().getChannelData(0);
            const n = a.length;
            let same = 0, tried = 0;
            for (const f of [0.03, 0.31, 0.62, 0.94]) {
              const i = Math.min(n - 1, Math.max(0, Math.round(f * (n - 1))));
              tried++;
              if (a[i] === b[n - 1 - i]) same++;
            }
            G.mirror = { same, tried };
          }
          TB.pressLoop();                                  // off, and the rate back
          await new Promise((r) => setTimeout(r, 200));
          /**
           * 🔴 AND THE GRAIN CLOCK IS BACK WHERE THE SOUND WANTS IT, ASKED OF
           * THE ENGINE. This is the half that caught a real defect: `chop`'s
           * slice is short enough that some patches' figures cannot be tuned to
           * it, the refusal used to clear the lock WITHOUT putting the rate
           * back, and taking the loop off then found nothing to release. The
           * page was left running 8.79 grains a second on a sound written for
           * 9, with the slider agreeing. ⚠️ HELD WHILE IT IS READ, because a
           * patch with a route onto `rate` would otherwise be graded against a
           * number that is legitimately moving.
           */
          modulator?.hold(true);
          await new Promise((r) => setTimeout(r, 200));
          G.wayRate = await ask1('mrate');
          G.wayWant = PATCHES[patch].rate;
          modulator?.hold(false);
        }
        muted = false; setWet(0);          // the page as the visitor finds it
      }

      /**
       * 🔴 A SLIDER MOVES BY ITSELF, THE ENGINE TAKES IT, AND A FINGER GETS IT
       * BACK. Three claims and three asserts, because each one alone passes on a
       * page broken in one of the other two ways: a handle animating in front of
       * an engine that never heard about it satisfies the first, a button wired
       * to nothing satisfies the third, and a hand that cannot be interrupted
       * satisfies the first two.
       *
       * ⚠️ LAST IN THE BLOCK, AND THAT POSITION IS THE MEASUREMENT. Everything
       * above this line drives a control: the ink probe runs the fader to both
       * ends, the patch A/B presses `›` and `‹`, the loop row cycles four ways.
       * A hand running through any of that is a second writer on the control
       * being graded, and the reading would be about the collision rather than
       * about either thing. This is the one moment in the run when the page has
       * stopped working its own instrument.
       *
       * ⚠️ DRIVEN BY THE REAL BUTTON, never by calling `hand.start()`. The fault
       * this kind of check exists to catch lives in the wiring between a button
       * and its handler, and calling the handler steps straight over it.
       */
      if (sliders?.rate?.hand) {
        muted = true; setWet(0);
        const wasPatch = patch;
        /**
         * 🔴 THE LANE IS CHOSEN RATHER THAN TYPED, AND THE RULE IS THE ONE
         * `moveSetting` FOLLOWS. A setting this sound is MODULATING is written
         * by `tick()` from its base, so the direct write is skipped and `/s_get`
         * would read `base + modulation` rather than what the handle shows. That
         * is a true reading of a working page and a useless one for this claim,
         * so the check takes a setting nothing is walking. A hard-coded `size`
         * was exactly the trap the follower check next door fell into when the
         * opening sound changed.
         */
        const pick = ['size', 'rate', 'spray'].find((k) => !routedNow.has(k) && sliders[k]?.hand);
        const sld = pick ? sliders[pick] : null;
        const mate = ['spray', 'size', 'rate'].find((k) => k !== pick && sliders[k]?.hand);
        const other = mate ? sliders[mate] : null;
        if (sld && other) {
          const btn = sld.el.querySelector('.sld-hand');
          const row = sld.el.querySelector('.sld-hand-row');
          const otherRow = other.el.querySelector('.sld-hand-row');
          const startsBefore = handStarts;
          const startedWith = other.get();

          btn.click();                                   // off -> sweep, one press
          const lit = {
            running: !!sld.hand.running,
            row: row.dataset.hand, otherRow: otherRow.dataset.hand,
            pressed: btn.getAttribute('aria-pressed'),
            // ⚠️ A CEILING IS ONLY A CEILING IF IT IS RUNNING DOWN. Reading the
            // constant would assert the source rather than the behaviour.
            leftMs: sld.hand.leftMs,
            starts: handStarts - startsBefore,
            inControls: document.querySelectorAll('.pos-controls .sld-hand').length,
          };

          // How far the handle travelled, and how many places it stopped at on
          // the way. A range with two readings in it is a jump; this lane is
          // supposed to be swept.
          let lo = Infinity, hi = -Infinity;
          const seen = new Set();
          for (let i = 0; i < 20; i++) {
            await new Promise((r) => setTimeout(r, 100));
            const x = sld.get();
            lo = Math.min(lo, x); hi = Math.max(hi, x); seen.add(x);
          }

          /**
           * 🔴 AND THE ENGINE IS HOLDING WHAT THE HANDLE SHOWS, ASKED OF THE
           * ENGINE, AT TWO DIFFERENT PLACES ON THE LANE. Everything above is
           * this page's own idea of what it sent. A hand that animated a handle
           * beautifully and wrote nothing would pass all of it, which is the
           * failure `/s_get` exists to close.
           *
           * ⚠️ FROZEN WHILE IT IS READ. `/s_get` is a round trip and the hand is
           * still travelling during it, so an unfrozen read grades whatever the
           * sweep reached by the time the answer came back rather than the value
           * that was asked about. `hand.yield()` is the component's own pause —
           * the same one a finger on the lane causes — and `resume()` puts it
           * back rather than starting it again.
           */
          const freeze = async () => {
            sld.hand.yield();
            await new Promise((r) => setTimeout(r, 120));
            const ui = sld.get();
            const got = await ask1(`m${pick}`);
            sld.hand.resume();
            return { ui, got };
          };
          const A = await freeze();
          await new Promise((r) => setTimeout(r, 1800));
          const B = await freeze();

          /**
           * 🔴 AND A FINGER TAKES IT BACK IN ONE FRAME. This repo has twice
           * shipped a page that worked a control in front of the person holding
           * it, and both times the report was about the instrument being taken
           * away rather than about the feature. A real `pointerdown` on the lane
           * is the route a visitor uses; `slider.mjs` yields on it and keeps
           * yielding for 1200 ms after the lift, which is why the wait below is
           * read from that constant rather than typed.
           * ⚠️ IT IS A YIELD AND NOT AN OFF, which is the promise: a motorised
           * fader you can grab. The button is what turns it off, two lines down.
           */
          const lane = sld.el.querySelector('.sld-lane');
          const rect = lane.getBoundingClientRect();
          const kw = sld.el.querySelector('.sld-knob').getBoundingClientRect().width;
          const midY = rect.top + rect.height / 2;
          const atX = (f) => rect.left + kw / 2 + (rect.width - kw) * f;
          const poke = (type, x) => lane.dispatchEvent(new PointerEvent(type,
            { pointerId: 1, bubbles: true, cancelable: true, clientX: x, clientY: midY }));
          poke('pointerdown', atX(0.3));
          const heldByFinger = row.dataset.held === '1' && row.dataset.hand === 'on';
          const atFinger = sld.get();
          poke('pointerup', atX(0.3));
          await new Promise((r) => setTimeout(r, Math.round(HAND_YIELD_MS / 4)));
          const stayed = sld.get();

          btn.click();                                   // sweep -> off
          G.hand = {
            name: pick, lit, lo, hi, seen: seen.size, A, B,
            heldByFinger, atFinger, stayed,
            offRow: row.dataset.hand, offRunning: !!sld.hand.running,
            offPressed: btn.getAttribute('aria-pressed'),
            other: mate, otherStill: other.get(), startedWith,
            otherOff: otherRow.dataset.hand,
          };
        }

        // 🔴 AND THE PAGE IS PUT BACK WHERE THE VISITOR LEFT IT. Same rule as
        // the station A/B and the patch A/B: the sound it opened on, the fader
        // at 0, every hand off.
        applyPatch(wasPatch, { silent: true });
        muted = false; setWet(0);
        faderSld?.set(0, { quiet: true });
      }
    }

    await finish();

    // 🔴 LAST, AND THE POSITION IS THE POINT. This one presses a real button and
    // then WAITS several seconds for a window to fill, and `demo/verify.mjs` stops
    // collecting four hundred milliseconds after the assert count last grew. Put
    // in the middle of the checks it took 39 asserts to 21: everything behind the
    // wait was silently lost and the run still read green, which is the failure
    // shape this repo keeps paying for. Slow work goes at the end, behind every
    // assert that does not need it.
    if (DEEP) {
      /**
       * 🔴 THE LOOP HAS TO BE AUDIBLE, AND THAT IS MEASURED AT THE DESTINATION.
       * REPORTED as *"i can not hear radio looping only viz"*: the bar owned
       * the window, drew the playhead, and nothing on this page was keeping a
       * sample, so LOOP produced a picture of a loop with no loop in it.
       *
       * ⚠️ IT READS `sinkPeak`, NOT `rmsPeak`. The upstream analyser sits BEFORE
       * the fader and before the loop's gain, so it hears the station whatever
       * reaches a speaker, and a check built on it would have passed through the
       * whole of the reported bug. This one is fed only by what leaves.
       *
       * ⚠️ AND THE LIVE PATH HAS TO BE DOWN WHILE IT RUNS, or "audible" is
       * satisfied by the station still playing underneath, which is the same
       * vacuous pass one level along.
       */
      const T = window.__demo?.transport;
      if (T && ctx && looper.attached()) {
        T.pressLoop();                                    // starts filling
        const filling = !!T.loopFilling;
        // ⚠️ CLOSED EARLY RATHER THAN WAITED OUT, and that is about the harness
        // as much as the clock. `demo/verify.mjs` stops collecting 400 ms after
        // the assert count last grew, and this block runs behind `finish()`, so
        // nothing about `settleMs` reaches it: an assert made eight seconds
        // after the one before it is an assert nobody reads, and the run still
        // says green. The bar's second press ends a filling window where the
        // playhead is, which is a real path a person uses and gives the same
        // claim in a second rather than nine.
        await new Promise((r) => setTimeout(r, 600));
        T.pressLoop();                                    // end it here
        await new Promise((r) => setTimeout(r, 120));
        const caught = looper.caught();
        sinkPeak = 0;
        await new Promise((r) => setTimeout(r, 260));
        const heardLooping = sinkPeak;
        const dryWhileLooping = liveIn ? liveIn.gain.value : 1;
        const running = looper.playing();
        /**
         * 🔴 AND THE GRAIN CLOCK IS TUNED TO IT, ASKED OF THE ENGINE. This is
         * the tempo claim and it is checked the only way it can be: the loop's
         * length is known in samples, the rate is read back off scsynth with
         * `/s_get`, and the two are multiplied. A whole number of bars in the
         * loop means they never slide against each other; anything else means
         * they do.
         *
         * ⚠️ IT IS GRADED ON A LOOP CLOSED EARLY, WHICH IS THE HARD CASE. The
         * window above is ended after 600 ms rather than left to fill, so its
         * length is whatever the tap happened to have caught — a number no
         * patch could have been written for. A lock that only worked on a tidy
         * eight seconds would pass a check that waited.
         */
        const gotRate = await (async () => {
          const r = await eng.sendAndWait(
            (m) => m[0] === '/n_set' && m[2] === 'mrate', 2000, '/s_get', PAPPUS_NODE, 'mrate');
          return r ? Number(r[3]) : NaN;
        })();
        const loopSec = caught / ctx.sampleRate;
        const barsIn = loopSec * gotRate / Math.max(1, PATCHES[patch].elen || 1);
        const offBy = Math.abs(barsIn - Math.round(barsIn));
        T.pressLoop();                                    // off
        d.assert('the grain clock is tuned to the loop, so the two cannot drift',
          Number.isFinite(barsIn) && barsIn >= 2 && offBy < 1e-3,
          Number.isFinite(gotRate)
            ? `${loopSec.toFixed(3)} s of loop at ${gotRate.toFixed(4)} grains a second `
              + `is ${barsIn.toFixed(5)} whole laps, ${(offBy * 1000).toFixed(3)} thousandths out`
            : 'the engine never answered with its grain rate');
        d.assert('pressing LOOP keeps the station and plays it back, and it is audible',
          running && caught > ctx.sampleRate * 0.25 && heardLooping > 0.0005 && dryWhileLooping < 0.05,
          !filling ? 'the button never started filling a window'
            : !running ? `filled ${(caught / ctx.sampleRate).toFixed(1)} s and nothing played it`
            : `${(caught / ctx.sampleRate).toFixed(1)} s kept · the speakers got `
              + `${heardLooping.toFixed(4)} with the live path at ${dryWhileLooping.toFixed(3)}`);
      }
    }
  }

  /* ⚠️ HERE RATHER THAN IN THE CHECK BLOCK, BECAUSE THAT BLOCK DOES NOT RUN.
     `/archive/radio/`'s deep checks sit behind `if (!eng) return`, so a harness run
     with nobody pressing play reaches THREE page asserts. This one is about
     the stylesheet and needs no station, no engine and no press, so it belongs
     where a visit already is. MEASURED: the first placement read 14 asserts,
     the same number as before it existed. */
  /**
   * 🔴 ONE BORDER ROUND THE PICTURE, NOT TWO. Reported 2026-09-21 with a
   * screenshot: *"rm thick borders round waveform and 'the radio as it
   * arrives'"*. MEASURED at the time: the canvas computed `1px` and its
   * `.pos-glue` parent computed `1px` in the same colour with nothing
   * between them, and two 1 px lines touching read as one 2 px line.
   * ⚠️ IT IS READ AS A COMPUTED VALUE, which is the only thing that knows
   * which rule won, and it reads BOTH elements, because asserting the canvas
   * alone would pass a page that had lost the outer edge instead.
   */
  {
    const c = scope.canvas;
    const glued = c.closest('.pos-glue');
    const cw = parseFloat(getComputedStyle(c).borderTopWidth);
    const gw = glued ? parseFloat(getComputedStyle(glued).borderTopWidth) : 0;
    const wrap = getComputedStyle(c.parentElement);
    d.assert('the waveform is inside one border rather than two, and its caption sits on a ground',
      !!glued && cw === 0 && gw > 0 && wrap.backgroundColor !== 'rgba(0, 0, 0, 0)',
      `canvas ${cw} px, the glue round it ${gw} px, and the wrap paints `
      + `${wrap.backgroundColor}`);
  }

  d.ready();
</script>

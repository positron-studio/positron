  }

  // 🔴 AND AN OUTCOME-GATED FALLBACK BESIDE THE PROBE, because a probe is a
  // statement about one moment. A station that answers at load and stops two
  // minutes later is the ordinary case for a volunteer mount, and the element
  // failing IS the evidence — no polling, no second opinion needed. The probe
  // prevents a dead start; this catches a death in progress.
  audio.addEventListener('error', () => {
    ship(`element error code=${audio.error ? audio.error.code : '?'} on ${station}`);
    if (!started || dead) return;
    avail.set(station, false);
    const alt = STATIONS.find(([, id]) => id !== station && avail.get(id) !== false);
    if (alt) { switchTo(alt[1], 'it stopped answering'); return; }
    dead = true;
    d.log(`${nameOf(station)} stopped and there is nowhere to fall back to`, 'bad');
    paintStations();
  });

  // Asked once, at load, so the page is already telling the truth about what it
  // can play before anybody reaches for the transport.
  const resolved = resolveStations();

  /**
   * 🔴 AND THEN KEPT UNDER WATCH, BECAUSE THIS STATION COMES AND GOES.
   * Radio 1965 is one volunteer-run Icecast mount and it drops out for minutes
   * at a time — MEASURED four times in one afternoon, `origin 520` and back
   * again with nothing in between. A page that asks once at load is right for
   * about a minute and then confidently wrong: the button stays greyed after the
   * station returns, and the only way to find out is to reload.
   *
   * ⚠️ IT DOES NOT SWITCH YOU. Asked for in as many words — *"do not switch
   * channels if I do not"* — so a station coming back UNGREYS its button and
   * says so in the log, and that is all. The one automatic switch this page
   * makes is the fallback at load, when the preferred station has nothing to
   * play; moving somebody mid-listen is a different thing entirely.
   *
   * ⚠️ `/health` ANSWERS 200 WHATEVER IT FINDS, so polling it costs no console
   * errors and no failed requests — which is exactly why that route exists. A
   * poll built on fetching the mount would paint a red line every 30 s.
   */
  // ⚠️ SIXTY SECONDS, NOT THIRTY. Each poll is one upstream connection per
  // station, and the list just went from two to four — halving the rate keeps
  // the cost where it was rather than doubling it because a feature was added.
  // ⚠️ AND NINETY, NOT SIXTY, FOR THE SAME REASON AT SIX STATIONS. Two of them
  // are somebody else's 320 kbit/s mount. The rule is that adding a station
  // must not raise what this page costs the broadcasters, so the rate follows
  // the length of the list rather than staying where it was set.
  const WATCH_MS = 90000;
  setInterval(async () => {
    if (document.hidden) return;       // a backgrounded tab is nobody watching
    let answers = null;
    try {
      const res = await fetch(`${BASE}/health?only=${STATIONS.map(([, id]) => id).join(',')}`,
        { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      if (!j?.stations) return;
      answers = STATIONS.map(([, id]) => j.stations[id]?.up === true);
    } catch { return; }
    STATIONS.forEach(([, id], i) => {
      const was = avail.get(id);
      avail.set(id, answers[i]);
      if (was === answers[i]) return;
      d.log(answers[i]
        ? `${nameOf(id)} is back — its button works again`
        : `${nameOf(id)} stopped answering`, answers[i] ? 'hi' : 'bad');
      ship(`${id} ${was} -> ${answers[i]}`);
    });
    // Everything down while we were listening is the one case that DOES change
    // what the page can do, rather than merely what a button offers.
    const anyUp = STATIONS.some(([, id]) => avail.get(id));
    if (!anyUp && !dead) { dead = true; d.log('every station stopped answering', 'bad'); }
    else if (anyUp && dead) { dead = false; d.log('a station is answering again'); }
    paintStations();
  }, WATCH_MS);

  let rmsPeak = 0;
  /**
   * 🔴 SIX NUMBERS OFF THE READ THE METER WAS DOING ANYWAY, AND THEY ARE WHAT
   * MAKES THE PATCHES DIFFERENT FROM EACH OTHER.
   *
   * Loudness alone is one gesture: everything it drives moves together, so six
   * patches routing it to six destinations are six views of one wave. Split the
   * same audio into bands and the sources stop agreeing — on speech `mid` moves
   * and `low` sits still; on music they part company; `high` follows sibilance
   * and cymbals; `tone` says where the energy IS rather than how much of it
   * there is; `flux` says how fast the programme is changing, which is the only
   * one of the six that is near zero on a sustained chord and high on a
   * announcer.
   *
   * ⚠️ THE PAGE MEASURES AND THE MODULATOR FOLLOWS, which is the same division
   * `grain-scope.mjs` already states: whoever owns the audio owns the
   * measurement. None of this is in `pappus-mod.mjs`.
   *
   * ⚠️ THE BUFFERS ARE HOISTED. Three typed arrays a frame at 60 Hz is 1.4 MB a
   * second of garbage for numbers that are overwritten immediately.
   */
  const timeBuf = new Float32Array(2048);
  let freqBuf = null, prevMag = null, magBuf = null;
  /** Bin edges, computed once from the real sample rate rather than assumed. */
  function bandEdges() {
    const binHz = ctx.sampleRate / (analyser?.fftSize || 2048);
    return { binHz,
      lo: Math.max(1, Math.round(20 / binHz)),
      a: Math.round(300 / binHz), b: Math.round(2000 / binHz),
      hi: Math.min((analyser?.frequencyBinCount || 1024) - 1, Math.round(10000 / binHz)) };
  }
  function meterTick() {
    // What actually left, read at the destination. Kept as a running peak so a
    // check can reset it, drive a control, and read what that control produced.
    if (sink && sinkBuf) {
      sink.getFloatTimeDomainData(sinkBuf);
      for (let i = 0; i < sinkBuf.length; i++) {
        const v = sinkBuf[i] < 0 ? -sinkBuf[i] : sinkBuf[i];
        if (v > sinkPeak) sinkPeak = v;
      }
    }
    if (!analyser) return;
    const buf = timeBuf.length === analyser.fftSize ? timeBuf : new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    if (rms > rmsPeak) rmsPeak = rms;
    // 🔴 THE MOMENT THERE IS SOUND, AND IT IS THIS LINE RATHER THAN A PROMISE.
    // `rms > 0` is the first buffer with a non-zero sample in it: the graph is
    // live, the samples are readable, and there is finally something for the
    // picture to be of. A silent buffer reads exactly 0, and so does a graph
    // that cannot hear its own element, which is the case this must not light
    // for. See the gate by `.gran-slot` above.
    if (rms > 0) boxesReady('sound');

    const bins = analyser.frequencyBinCount;
    if (!freqBuf || freqBuf.length !== bins) {
      freqBuf = new Float32Array(bins); magBuf = new Float32Array(bins); prevMag = new Float32Array(bins);
    }
    analyser.getFloatFrequencyData(freqBuf);
    const { binHz, lo, a, b, hi } = bandEdges();
    let sLow = 0, sMid = 0, sHigh = 0, sAll = 0, sFreq = 0, sFlux = 0;
    for (let i = lo; i <= hi; i++) {
      // dBFS -> linear. ⚠️ `-Infinity` IS A REAL VALUE HERE — an empty bin
      // reports it, and `10 ** (-Infinity/20)` is 0, which is correct; but a
      // NaN anywhere in the sum poisons every follower at once, so guard.
      const m = Number.isFinite(freqBuf[i]) ? 10 ** (freqBuf[i] / 20) : 0;
      magBuf[i] = m;
      sAll += m; sFreq += m * i * binHz;
      const d2 = m - prevMag[i];
      if (d2 > 0) sFlux += d2;            // ONSETS ONLY: a decay is not an event
      if (i < a) sLow += m; else if (i < b) sMid += m; else sHigh += m;
    }
    prevMag.set(magBuf);
    const n = hi - lo + 1;
    // Where the energy sits, 100 Hz..8 kHz on a log axis — the same measurement
    // that was briefly a hue on the waveform and was reverted twice. As a
    // COLOUR it moved about 11 degrees on real material, which nobody can see.
    // As a modulation on an exponential lane, 11% of the lane is a factor of
    // 1.3 in grain length, which everybody can hear.
    const centroid = sAll > 0 ? sFreq / sAll : 0;
    const tone = centroid > 0
      ? Math.max(0, Math.min(1, Math.log(centroid / 100) / Math.log(80))) : 0;
    modulator?.sense({
      rms,
      low: sLow / Math.max(1, a - lo), mid: sMid / Math.max(1, b - a), high: sHigh / Math.max(1, hi - b + 1),
      tone, flux: sFlux / n,
    });
    // ⚠️ NO COLOUR. The wave was briefly tinted by spectral centroid — hue for
    // where the energy sat — and it was asked to be reverted twice. The
    // reasoning is kept on the dead branch in `grain-scope.mjs` rather than
    // here; what this page draws is the plain wave it drew before.
    scope.feed(buf, ctx.sampleRate);
    // ⚠️ THE LEVEL IS STILL MEASURED AND STILL NOT DISPLAYED. `rmsPeak` feeds
    // the assert that catches a tainted graph and the deafness control; what it
    // does not get is a cell, twice asked for and twice refused — see the
    // readout above.
    requestAnimationFrame(meterTick);
  }

  // ── the measurement ────────────────────────────────────────────────────────
  /**
   * 🔴 IT USED TO BE A SECOND CONNECTION AND IT DOES NOT NEED TO BE.
   * The comment here said "a SECOND connection, on purpose: this one is read as
   * BYTES" — which was true when an `<audio>` element owned the sound and a page
   * could not see a byte of it. The decoded path reads the bytes itself, demuxes
   * the same ICY channel and holds the same response headers, so the second
   * fetch was asking a volunteer's Icecast for numbers already on this side of
   * the wire. Two listeners per visitor, for nothing.
   *
   * ⚠️ THE ELEMENT PATH STILL NEEDS ITS OWN FETCH, and that is not a leftover:
   * under `?decode=0` there is genuinely no other way to see the bitrate. So the
   * two arms below are two different situations, not one with a stale branch.
   */
  // ⚠️ `station` IS ON THE RECORD, not read at assert time. The measurement
  // belongs to ONE connection to ONE station (see `measureDecoded`), and the
  // rate it is graded against is that station's — a switch between the read and
  // the assert would otherwise compare 320 kbit/s of AAC against 128 of MP3 and
  // call a healthy stream broken.
  const rec = { status: 0, bytes: 0, headers: {}, slots: 0, filled: 0, gaps: [], marks: [], station };

  /** Work a rate and a burst out of byte marks — shared by both arms. */
  function summarise(startMs, endMs) {
    const secs = (endMs - startMs) / 1000;
    rec.kbps = secs > 0 ? (rec.bytes * 8) / 1000 / secs : 0;
    // 🔴 MEAN BITRATE OVER A SHORT WINDOW IS THE BURST, NOT THE STREAM.
    // Icecast hands a new listener ~64 KiB faster than realtime to prime their
    // buffer, so the first reading of a 128 kbps station is comfortably in the
    // 180s — MEASURED HERE at 185 before this was fixed, and `shout` reads 195
    // over seven seconds for the identical reason. The rate worth asserting on
    // is the one after the burst has landed: everything from 40 % of the
    // window onwards. The whole-window mean stays in `rec.kbps` because the
    // difference between the two IS the burst.
    const cut = startMs + (endMs - startMs) * 0.4;
    const from = rec.marks.find((mk) => mk[1] >= cut);
    const end = rec.marks.at(-1);
    rec.steadyKbps = from && end && end[1] > from[1]
      ? ((end[0] - from[0]) * 8) / 1000 / ((end[1] - from[1]) / 1000)
      : null;
    rec.burstS = rec.bytes / ((nominalKbps(rec.station) * 1000) / 8) - secs;
    rec.gapMax = rec.gaps.length ? Math.max(...rec.gaps) : 0;
    return rec;
  }

  /**
   * The decoded arm: watch the connection that is already playing.
   * It waits for MEASURE_MS of ACTUAL READING rather than of wall clock, so a
   * slow start does not get averaged in as a slow station.
   */
  async function measureDecoded() {
    /**
     * 🔴 ONE CONNECTION FROM END TO END, OR THE NUMBERS ARE FROM TWO OF THEM.
     * A station switch or a transport stop builds a NEW stream with its own byte
     * counter and its own first byte, and the first version of this held the old
     * one's start time against the new one's marks. MEASURED: `10427 vs 128 kbps
     * nominal` — a reading eighty times the truth, arrived at by dividing one
     * connection's burst by fifty milliseconds of another's clock. It failed
     * loudly, which was luck; the same mistake a little smaller would have read
     * like a fast station.
     *
     * So the instance is held, and if it is replaced the window starts again.
     */
    const settle = () => new Promise((r) => setTimeout(r, 100));
    for (let attempt = 0; attempt < 8; attempt++) {
      for (let i = 0; i < 200 && !stream?.wire?.().firstByteAt; i++) await settle();
      const mine = stream;
      const w0 = mine?.wire?.();
      if (!w0?.firstByteAt) break;
      let swapped = false;
      while (!swapped) {
        const w = mine.wire();
        if ((w.marks.at(-1)?.[1] ?? 0) - w0.firstByteAt >= MEASURE_MS) break;
        await new Promise((r) => setTimeout(r, 200));
        swapped = stream !== mine;
      }
      if (swapped) continue;                        // that one went away; watch the next
      return report(mine.wire());
    }
    /**
     * 🔴 THE GIVING-UP PATH RETURNED A DIFFERENT SHAPE, AND A DIFFERENT SHAPE
     * MID-BURST IS EVERY ASSERT LOST.
     *
     * Eight attempts all swapped means the stream was torn down and rebuilt for
     * the whole window, which happens when the relay is unwell. This used to
     * `return rec` without `summarise`, so `kbps`, `steadyKbps`, `gapMax` and
     * `burstS` were all undefined — and the first line of `finish()` reads
     * `m.burstS.toFixed(1)`. MEASURED twice in one session: a TypeError thrown
     * before the first `d.assert`, so the page reported **2 asserts** and read
     * as completely broken, over a stream problem that four honest red asserts
     * would have named exactly.
     *
     * One shape out of this function, always. The numbers are then zero and
     * null, which is what "we could not read it" looks like, and the asserts
     * below fail on their own terms and say which.
     */
    const w = stream?.wire?.();
    rec.status = w?.status ?? 0;
    const from = w?.firstByteAt ?? performance.now();
    return summarise(from, w?.marks?.at(-1)?.[1] ?? from);
  }

  /** Fold one connection's wire report into `rec` and summarise it. */
  function report(w) {
    // The loop above only gets here with `stream === mine`, so the station
    // playing now is the one these bytes came from.
    rec.station = station;
    rec.status = w.status;
    rec.headers = w.headers;
    rec.slots = w.slots;
    rec.filled = w.filled;
    rec.gaps = w.gaps;
    rec.marks = w.marks;
    // The window starts at this connection's first byte, so its running total IS
    // the bytes inside the window. `summarise` below is given both ends anyway,
    // so a window that ever starts later stays correct.
    rec.bytes = w.marks.at(-1)?.[0] ?? 0;
    rec.ttfbMs = w.firstByteAt - w.openedAt;
    if (rec.headers['icy-name']) {
      d.log(`icy-name "${rec.headers['icy-name']}" — readable only because the relay exposes it`);
    }
    d.log('the bitrate is read off the connection you are listening to — '
      + 'this page opens one socket, not two');
    return summarise(w.firstByteAt, w.marks.at(-1)?.[1] ?? w.firstByteAt);
  }

  async function measure(signal) {
    if (DECODE) return measureDecoded();
    const t = performance.now();
    rec.station = station;
    const res = await fetch(`${srcOf(station)}?bytes=${2 << 20}`,
      { signal, cache: 'no-store', headers: { 'Icy-MetaData': '1' } });
    rec.status = res.status;
    for (const k of ['icy-name', 'icy-metaint', 'content-type', 'x-shout-ttfb']) {
      const v = res.headers.get(k);
      if (v) rec.headers[k] = v;
    }
    if (rec.headers['icy-name']) {
      d.log(`icy-name "${rec.headers['icy-name']}" — readable only because the relay exposes it`);
    }
    const eat = icyDemuxer(Number(rec.headers['icy-metaint'] || 0), {
      onSlot: () => { rec.slots++; },
      onMeta: () => { rec.filled++; },
      onTitle: (title) => { nowEl.textContent = title; d.log(`now playing: ${title}`, 'hi'); },
    });

    const reader = res.body.getReader();
    const start = performance.now();
    let last = start;
    while (performance.now() - start < MEASURE_MS) {
      const { value, done } = await reader.read();
      if (done) break;
      const nowT = performance.now();
      rec.gaps.push(nowT - last);
      last = nowT;
      rec.bytes += value.length;
      rec.marks.push([rec.bytes, nowT]);
      eat(value);
    }
    try { await reader.cancel(); } catch { /* the stream never ends; hanging up is normal */ }
    rec.ttfbMs = start - t;
    return summarise(start, performance.now());
  }

  // ── starting ───────────────────────────────────────────────────────────────
  // Called from the bar's own click, which is the only moment a browser will
  // accept `play()` on a fresh element.
  function startListening() {
    if (started) return;
    started = true;
    d.log(`relay ${srcOf(station)}`);
    // 🔴 THE SOURCE MUST EXIST BEFORE THE GRAPH CAPTURES IT — WEBKIT.
    // `graph()` calls `createMediaElementSource(audio)`, and this line used to
    // run TWO LINES AFTER it, so the capture was made against an element with no
    // `src` at all. Chrome does not care and binds later. WebKit binds at
    // creation: the element then plays STRAIGHT TO THE SPEAKERS and the graph
    // gets silence for ever.
    //
    // ⚠️ AND THAT FAILS IN THE SHAPE THIS REPO MINDS MOST — it sounds like it is
    // working. REPORTED from Safari: *"I hear sound but no granulator, also no
    // waveform"*, and on an iPhone `WebAudio can see the samples — peak rms
    // 0.0000` beside grain ticks still drawing, because scsynth's worklet was
    // running perfectly on a bus nothing fed. Sound out of the speakers is not
    // evidence that the page can hear it: if the capture had worked, the only
    // route to the speakers would be `dry`, which is inside the graph.
    // ⚠️ It also silently breaks the fader, since `dry.gain` then controls
    // nothing and the station stays at full volume at every setting.
    graph();
    if (!DECODE) audio.src = srcOf(station);
    // NEVER LET SOUND GATE THE WORK: neither of these rejects when a gesture is
    // missing, so awaiting them is a hang rather than an error. Fire and move on.
    ctx.resume?.();
    if (!DECODE) audio.play().catch((e) => d.log(`play refused (${e.name}) — the measurement continues`, 'bad'));
    // ?report=1 only, and exactly once — the deafness control for this page's own
    // analyser. See the guard inside it for what happened when it was not once.
    if (REPORTING) setTimeout(() => { proveAnalyser(); }, 3000);
    requestAnimationFrame(meterTick);

    audio.addEventListener('playing', () => {
      if (heardFrom == null) heardFrom = Date.now();
      // ⚠️ PUT THE LINE WHERE THE SOUND IS, AND START IT. Without these two the
      // playhead sits wherever it was last left — and the harness leaves it
      // paused and seeked backwards, because it exercises the transport before
      // pressing anything. MEASURED: the line read 95.5 s BEHIND the audio.
      deck.seek(heardFrom);
      deck.play();
      // The element's own clock is the master from here: the deck's position is
      // where the AUDIO has got to, never where a timer thinks it should be.
      if (!master) master = mediaMaster(deck, () => ({ el: audio, key: 'radio', pos: heardFrom + audio.currentTime * 1000 }));
    }, { once: true });

    // ⚠️ THE MEASUREMENT IS KEPT, NOT ASSERTED HERE. Everything this page checks
    // goes out in ONE burst from `finish()`, because the granulator's checks
    // arrive several seconds later than the radio's and `verify.mjs` stops
    // collecting 400 ms after the count last grew. MEASURED: with the radio
    // asserting on its own, the run read `10` and the five granulator checks
    // were silently dropped — a page reporting less than it knows, which is the
    // failure mode this repo minds most.
    // 🔴 THE GRANULATOR COMES UP WITH THE SOUND, DRY. There is no button to
    // press because there is nothing to decide: this page is a radio station
    // going into a SuperCollider graph, and the fader is how much of that
    // reaches you. `synthPending` is set SYNCHRONOUSLY, before any await, or the
    // 6 s fallback below latches `done` first and the granulator's five asserts
    // are dropped from the run — which is how this page twice reported ten
    // checks and looked green both times.
    //
    // ⚠️ NOT AWAITED, AND THE CATCH IS THE POINT. An engine that refuses has to
    // leave a working radio behind; `finish()` then runs from the fallback and
    // reports the radio's half alone rather than nothing at all.
    // ⚠️ AND IT WAITS FOR THE STATIONS TO ANSWER FIRST. Booting 1.7 MB of wasm
    // to granulate a stream that is not there is work nobody asked for, and the
    // sliders it would raise are controls over nothing.
    synthPending = true;
    resolved.then((any) => {
      if (!any) { synthPending = false; finish(); return null; }
      return startGranulator();
    }).catch((e) => {
      synthPending = false;
      d.log(`the granulator did not start: ${e.message} — the radio plays on`, 'bad');
      // ⚠️ THE STACK IS KEPT WHERE A PROBE CAN READ IT. `e.message` alone says
      // WHAT went wrong and never WHERE, and a caught error has no
      // `Runtime.exceptionThrown` for a harness to catch either — so a
      // `TypeError: Cannot read properties of undefined` cost two full runs to
      // place. One assignment, the same lab-handle idiom as `__eng` and
      // `__stream`, and it costs a working page nothing.
      window.__granErr = String((e && e.stack) || e);
    });

    measured = measure().catch((e) => { d.log(`measure failed: ${e.message}`, 'bad'); return null; });
    // If nobody presses Synthesize, the radio still has to say what it found.
    // ⚠️ BUT IT MUST NOT RACE THE GRANULATOR. This fallback fires ~6 s after the
    // listen starts; a Synthesize press takes longer than that to boot an
    // engine, load a definition and measure a level, so without the flag the
    // fallback latched `done` first and the five granulator checks were dropped
    // — the run read 10 asserts twice in a row and looked green both times.
    measured.then(() => setTimeout(() => { if (!synthPending) finish(); }, 1200));
  }

  /**
   * 🔴 EVERY ASSERT IN ONE BURST, AND THAT IS THE HARNESS'S SHAPE RATHER THAN A
   * PREFERENCE. `verify.mjs` waits for the FIRST assert for as long as
   * `settleMs` allows (12 s here), then stops 400 ms after the count last GREW,
   * capped at twelve such windows. So checks spread across a six-second listen
   * are checks the suite stops collecting at the first quiet gap: the page reads
   * as asserting four things and nobody is told the rest were dropped. Do the
   * slow work, then say everything at once.
   */
  async function finish() {
    if (done) return;
    done = true;
    // Report the whole verdict list when this burst is over — the same array
    // `verify.mjs` reads, so a phone and a laptop are answering one question.
    if (REPORTING) {
      queueMicrotask(() => setTimeout(() => {
        for (const a of (d.asserts || window.__demo?.asserts || [])) {
          ship(`${a.pass ? 'ok  ' : 'FAIL'} ${a.label} — ${a.detail}`);
        }
        ship('--- end of run ---');
      }, 1500));
    }
    // ⚠️ AND THE DETAIL SEPARATES TWO FAILURES THAT ARE NOT THE SAME. A page
    // that played and could not measure is a different fault from a page that
    // was never allowed to start, and `the measurement never completed` said
    // the first about both.
    const m = await measured;
    if (!m) {
      d.assert('the relay answered', false, started
        ? 'the measurement never completed'
        : `none of the ${STATIONS.length} mounts answered, so nothing was ever played`);
      return;
    }

    // ⚠️ MAKE SURE IT IS ACTUALLY PLAYING BEFORE ASKING WHETHER IT PLAYS.
    // The page follows the transport now, and `verify.mjs` exercises the
    // transport before anything else — click to play, click to pause, then a
    // keyboard seek — so it hands over a deck that is PAUSED, and the mirror
    // below dutifully keeps the radio paused with it. The first run after the
    // Listen button was removed read `t=0.00s`, `peak rms 0.0000` and
    // `heardFrom null`: three failures that were all one fact, and the fact was
    // correct behaviour. So press play here, and WAIT FOR THE ELEMENT rather
    // than sleeping a guess at it.
    deck.play();
    for (let i = 0; i < 30 && !(played() > 0 && isPlaying()); i++) {
      await new Promise((r) => setTimeout(r, 100));
    }

    // 🔴 THE TRANSPORT MUST BE ABLE TO STOP THE SOUND, AND IT COULD NOT.
    // Found by pressing pause on the page, not by a check: the bar stopped the
    // playhead and the radio played on, because `mediaMaster` runs ONE WAY —
    // its own doc says *"a paused/ended master pauses the deck, and a running
    // one resumes it"*, so the element drove the deck and nothing drove the
    // element. Tested here, BEFORE anything is asserted, because the answer
    // takes 1.4 s and an assert arriving 1.4 s after the others is an assert
    // the stabiliser has already stopped collecting.
    const { wasPlaying, stopped } = T;

    // ⚠️ NO CELL FOR THIS ANY MORE — see the readout above. The number is still
    // measured, still logged and still asserted; what it lost is a box that
    // could never show anything else.

    // ⚠️ `gap` LOST ITS CELL AND KEPT ITS FACTS. It is measured once over one
    // five-second read and never moves again, so as a readout it was a constant
    // teaching the reader to ignore the row. It is still asserted below and it
    // is still in the log line, where a one-off measurement belongs.
    d.log(`${Math.round(m.bytes / 1024)} KiB · ${Math.round(m.steadyKbps ?? 0)} kbps steady `
      + `(${Math.round(m.kbps)} over the whole window — the difference is Icecast's burst, `
      + `${m.burstS.toFixed(1)} s handed over faster than realtime)`);

    d.assert('the relay answered', m.status === 200, `HTTP ${m.status || '—'}`);
    d.assert('the page could read the bytes (CORS)', m.bytes > 0,
      `${(m.bytes / 1024).toFixed(0)} KiB in ${(MEASURE_MS / 1000).toFixed(0)} s`);
    d.assert('the station named itself', !!m.headers['icy-name'],
      m.headers['icy-name'] || 'absent');
    d.assert('the in-band text channel is alive', m.slots > 0,
      `${m.slots} slots, ${m.filled} carried text`);
    // ⚠️ THE NOMINAL RATE IS THE STATION'S, NOT THE PAGE'S. It was one shared
    // 128 until a 320 kbit/s station arrived, at which point the check failed
    // every run on a stream that was behaving perfectly. MEASURED over this
    // page's own five-second window, three runs each: IDA reads 322-327 against
    // 320, and the whole-window mean reads about 950 because Icecast hands over
    // ten seconds of audio at once. The 40 % cut is what separates the two.
    const nominal = nominalKbps(m.station);
    d.assert('settled rate is the station\'s', m.steadyKbps != null
      && Math.abs(m.steadyKbps - nominal) < nominal * 0.2,
      `${Math.round(m.steadyKbps ?? 0)} vs ${nominal} kbps nominal for `
      + `${nameOf(m.station)}, after the burst`);
    d.assert('no gap past a 1 s buffer', m.gapMax < 1000,
      `worst ${Math.round(m.gapMax)} ms over ${m.gaps.length} reads`);
    /**
     * 🔴 THE HEADROOM, WHICH IS THE NUMBER THE CHECK ABOVE CANNOT SAY.
     *
     * `no gap past a 1 s buffer` passes on a 345 ms gap and passes on a 990 ms
     * one, and on a real iPhone it passed while the cushion was **0.534 s at
     * its tightest** — below the 600 ms floor it is supposed to hold, leaving
     * 189 ms. A threshold that both readings clear cannot tell them apart, and
     * the interesting quantity was the DISTANCE between them all along.
     *
     * It grades the plumbing at the same time. `tightest` is only ever written
     * where the two new cells are written, so a finite value here is proof that
     * `buffer` and `lost` were fed rather than left at one em dash — a cell
     * nothing sets looks exactly like a cell with nothing to say.
     */
    if (DECODE) {
      const head = tightest - m.gapMax / 1000;
      d.assert('the cushion outlasts the worst gap in it',
        Number.isFinite(tightest) && head > 0.1,
        Number.isFinite(tightest)
          ? `${(tightest * 1000).toFixed(0)} ms of sound in hand at the tightest `
            + `against a ${Math.round(m.gapMax)} ms worst gap, so ${(head * 1000).toFixed(0)} ms spare`
          : 'the buffer cell was never fed');
    }
    d.assert(DECODE ? 'the page decoded the stream itself' : 'the element played',
      played() > 0,
      DECODE ? `${played().toFixed(1)} s of ${decodeCodec || 'nothing'} via ${decodePath || 'nothing'}`
             : `t=${played().toFixed(2)}s`);
    // 🔴 THE ONE THAT CATCHES THE TAINTED GRAPH. A cross-origin element with no
    // CORS plays out of the speakers and feeds SILENCE to WebAudio, so every
    // other assert here passes while the graph is dead.
    d.assert('WebAudio can see the samples', rmsPeak > 0.0005, `peak rms ${rmsPeak.toFixed(4)}`);
    // ⚠️ `deck.position` IS A FUNCTION — `position: () => transport.position()`.
    // Read as a property it is the function object, which compares false against
    // every number and formats as `Invalid Date`.
    const head = deck.position();
    d.assert('the line follows the audio', Number.isFinite(head) && heardFrom != null && head >= heardFrom,
      Number.isFinite(head) && heardFrom != null
        ? `playhead ${new Date(head).toTimeString().slice(0, 8)}, ${((head - heardFrom) / 1000).toFixed(1)} s in`
        : `playhead ${String(head)}, heardFrom ${String(heardFrom)}`);
    // ⚠️ ONLY WHEN THE CHECK RAN. An assert whose measurement was skipped must be
    // ABSENT, not passed on a default — `T.stopped` is `false` when nothing ever
    // paused the deck, which reads identically to a transport that cannot stop.
    if (SELFCHECK) {
      d.assert('the transport can stop the stream', !wasPlaying || stopped,
        wasPlaying
          ? (stopped ? 'pause on the bar paused the audio too'
                     : 'the bar paused the line and the radio played on')
          : 'nothing was playing to stop');

    }

    /**
     * 🔴 THE TWO BOXES WERE DARK WITH NO FEED AND CAME UP AS ONE.
     *
     * ⚠️ IT IS READ OFF THE PAGE, NOT OFF THE CODE THAT SET IT. `LIT.dark` is
     * `getComputedStyle().opacity` for both boxes at a frame before anything was
     * pressed, and `LIT.gap` is the worst difference between the two while they
     * faded — sampled every frame across the whole transition. Asserting that
     * `classList.add` was called twice in one statement would prove that the
     * statement ran, which is the failure HANDOFF records about `roomToEye`:
     * a check derived from the same reasoning as the code it grades.
     *
     * ⚠️ NOT BEHIND `SELFCHECK`. Nothing here moves a control or damages the
     * sound; it reads two numbers that the page produced on its own.
     */
    d.assert('neither box drew before there was sound, and both came up together',
      !!LIT.dark && LIT.dark.every((o) => o === 0)
        && LIT.at != null && LIT.gap != null && LIT.gap < 0.02
        // ⚠️ 0.9, NOT 0.99. The claim is "both came up TOGETHER", and the
        // number that grades it is `gap`, which is the distance BETWEEN them.
        // A ceiling on the absolute value grades something else entirely: how
        // far through a 450 ms CSS fade the sample happened to land. It read
        // `0.987142 and 0.987142` with a gap of 0.000, which is the claim
        // passing perfectly, and went red for being thirteen thousandths short
        // of a threshold that was never the point.
        && !!LIT.pair && LIT.pair.every((o) => o > 0.9),
      `${LIT.dark ? LIT.dark.join(' and ') : 'never sampled'} opaque with no feed `
      + `(${LIT.darkWhen || 'never sampled'}) · `
      + `${LIT.pair ? LIT.pair.join(' and ') : '—'} after (${LIT.why || 'never lit'}) · `
      + `worst ${LIT.gap == null ? '—' : LIT.gap.toFixed(3)} between them across the fade`);

    // ── and the granulator, in the SAME burst, when it was asked for ────────
    if (!eng) return;
    d.assert('SuperCollider is running in this tab', eng.bootMs > 0,
      `up in ${Math.round(eng.bootMs)} ms, ${eng.ctx.sampleRate} Hz`);
    d.assert('the board\'s own compiled graph loaded', !!G.def?.ok,
      G.def?.ok ? `${G.def.bytes} B of SynthDef taken in ${G.def.ms} ms` : (G.def?.why ?? 'never fetched'));
    d.assert('the granulator is running', G.running,
      G.running ? `node ${PAPPUS_NODE}, reading busses 2 and 3` : 'the engine refused /s_new');
    d.assert('the engine reports the grains it fires', G.grains > 0,
      `${G.grains} reported in ${G.secs.toFixed(1)} s`);
    // 🔴 THE CHORD'S OWN WITNESS, AND IT IS AN ARITHMETIC PREDICTION RATHER THAN
    // A LEVEL. `report` fires once per GATED voice per trigger — graded against
    // the board at 8.00 / 4.00 / 15.99 for `mrate` 8 / 4 / 16 (research §10.6) —
    // so opening four voices at `mrate` 8 MUST read about 32 a second, not 8.
    // A level measurement could not tell four voices from one turned up.
    // ⚠️ This is also the check that catches `setParam` sending a scalar: with
    // one wrong message seven voices stay shut and the rate stays at `mrate`.
    // ⚠️ THESE GRADE THE PROBE ABOVE, SO THEY EXIST ONLY WHEN IT RAN. An assert
    // whose measurement was skipped must be ABSENT rather than passed on a
    // default — `G.inkWet` is 0 when nobody moved the fader, which reads exactly
    // like a picture that never drew.
    if (DEEP) {
      // 🔴 THE WHOLE PATCH, ASKED OF THE ENGINE RATHER THAN READ BACK OFF THIS
      // PAGE. Every `/n_set` here is fire-and-forget, so `PATCHES[patch]` proves
      // nothing about what scsynth holds — and a patch is forty messages, any one
      // of which could name a control this definition does not have and be
      // discarded in silence. Twelve of them are read back with `/s_get`: they
      // span the granulator, the euclidean divider and two chain stages that this
      // page had never sent a value to at all.
      const p = G.patch;
      // ⚠️ DECLARED BEFORE THE FIRST ASSERT THAT USES IT. It reads like a helper
      // that belongs beside the array check below; put there, the patch-differs
      // assert above reaches it in its temporal dead zone, which is a ReferenceError
      // mid-burst — every assert after it silently dropped, which is this page's
      // named failure mode.
      const same = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length
        && a.every((x, i) => Math.abs(x - b[i]) < 1e-3);
      // The names, graded beside the values they make meaningful. `G.names` is
      // filled next to `readScalars`, where `ask1` lives.
      d.assert('every control this patch names is one the engine really has',
        Array.isArray(G.names) && G.names.length === 0,
        G.names?.length ? `discarded in silence: ${G.names.join('; ')}`
          : 'a sentinel written to each control whose value is zero came back unchanged');

      d.assert('the patch that is playing reached the engine',
        !!p && Array.isArray(G.wrong) && G.wrong.length === 0,
        p ? (G.wrong?.length ? `${p.name}: ${G.wrong.join('; ')}`
                             : `${p.name}: all ${G.scalars ? Object.keys(G.scalars).length : 0} settings read back as asked`)
          : 'no patch was applied');

      // 🔴 AND A SECOND PATCH, THROUGH THE REAL `›` BUTTON. A check that only ever
      // grades the patch the page opens on is a check that would pass with the
      // other five deleted — and `verify.mjs` cannot press this row itself. Both
      // halves have to be true: the next patch's settings must arrive, AND they
      // must differ from this one's, or a picker wired to nothing passes.
      const nextP = G.otherWant;
      const near = (a, b) => Math.abs(a - b) < Math.max(0.01, Math.abs(b) * 0.02);
      const differs = !!nextP && !!p
        && (nextP.scanmode !== p.scanmode || nextP.elen !== p.elen
          || !near(nextP.rate, p.rate) || !near(nextP.size, p.size));
      const arrived = !!nextP && G.otherMode === nextP.scanmode && G.otherElen === nextP.elen
        && near(G.otherRate, nextP.rate) && near(G.otherSize, nextP.size)
        && same(G.otherPattern, patternOf(nextP));
      d.assert('the next sound along reaches the engine, and it differs',
        differs && arrived && G.here === PATCHES.indexOf(p),
        nextP && p
          ? `${p.name} → ${nextP.name} → ${p.name}; asked mode ${nextP.scanmode} `
            + `rate ${nextP.rate} size ${nextP.size}, the engine held ${G.otherMode} `
            + `${G.otherRate} ${G.otherSize}, against ${p.scanmode} ${p.rate} ${p.size} here`
            + `${same(G.otherPattern, patternOf(nextP)) ? '' : ' — and its rhythm did not arrive'}`
          : 'the picker was never exercised');

      // 🔴 THE THREE MESSAGES THAT CANNOT BE CHECKED BY A SCALAR READ. `gates`,
      // `pitches` and `probs` are eight-element controls and `setParam` sends
      // `/n_setn` only for an Array (`pappus.mjs:125`) — one scalar by mistake
      // writes voice 0 and leaves seven voices holding whatever they held, which
      // is a page that goes on working and sounds like one note. The sixteen-step
      // rhythm is not a control at all but a BUFFER the graph indexes (`:802`), so
      // it takes a third kind of message and fails in a third way: written and
      // never read, or read and never written.
      d.assert('the chord and its rhythm reached the engine',
        !!p && same(G.gates, p.gates) && same(G.pitches, p.pitches)
          && same(G.probs, p.probs) && same(G.pattern, patternOf(p)),
        p ? `gates ${G.gates ?? '—'} · notes ${G.pitches ?? '—'} · ${liveSteps(p)} of `
            + `${p.elen} step(s) open${same(G.pattern, patternOf(p)) ? '' : ` — the buffer holds ${G.pattern ?? 'nothing'}`}`
          : 'no patch was applied');

      // 🔴 TWELVE SOUNDS, AND TWELVE DIFFERENT ANSWERS FROM THE ENGINE. Both
      // halves have to hold: every patch's six architectural controls must
      // arrive as the table wrote them, AND no two patches may arrive the same.
      // The first alone passes a table of twelve identical rows; the second
      // alone passes a table nothing delivered.
      {
        const k = G.kinds || [];
        const late = k.filter((x) => x.key !== x.want);
        const keys = k.map((x) => x.key);
        const dupes = keys.filter((x, i) => keys.indexOf(x) !== i);
        d.assert('every sound in the list reaches the engine, and no two are the same',
          k.length === PATCHES.length && late.length === 0 && dupes.length === 0,
          !k.length ? 'the list was never swept'
            : late.length ? `${late.map((x) => `${x.name} held ${x.key} not ${x.want}`).join('; ')}`
            : dupes.length ? `${dupes.length} pair(s) identical on ${KIND_WORDS}: ${dupes.join(' and ')}`
            : `${k.length} sounds, ${k.length} different settings of ${KIND_WORDS}`);
      }

      // 🔴 THE GRAINS TUNE THEMSELVES TO A LOOP, AND THAT IS THE WHOLE TEMPO
      // CLAIM. The loop's length is known exactly in samples and the grain clock
      // is a phasor in the same context — MEASURED at 24000.0 ± 0.2 samples for
      // a rate of 2 against 24000 asked for — so `lockGrainsToLoop` nudges the
      // rate until a whole number of the figure's bars fits the loop, and after
      // that the two cannot slide against each other at all. Read off the
      // engine, never off the page, and it is the PRODUCT that is graded: a
      // rate that arrived but does not divide is not a lock.
      {
        const bars = G.lockRate * G.lockSeconds / G.lockElen;
        const off = Math.abs(bars - Math.round(bars));
        d.assert('the grain clock tunes itself to a loop, and comes back off it',
          Number.isFinite(bars) && bars >= 2 && off < 1e-3
            && Math.abs(G.unlockRate - G.lockWant) < 1e-3,
          Number.isFinite(bars)
            ? `${G.lockSeconds} s of loop took ${G.lockRate.toFixed(4)}/s, which is ${bars.toFixed(5)} `
              + `whole laps, ${(off * 1000).toFixed(3)} thousandths out, then back to ${G.unlockRate}`
            : 'the engine never answered with its grain rate');
      }

      // 🔴 AND WHAT THAT CHORD AND THAT RHYTHM MUST SOUND LIKE, AS ARITHMETIC
      // RATHER THAN AS A LEVEL. `report` fires once per GATED voice per trigger —
      // graded against the board at 8.00 / 4.00 / 15.99 for `mrate` 8 / 4 / 16
      // (research §10.6) — so the rate is `mrate × Σ(gates·probs) × open steps /
      // melen`, and nothing else. A level measurement could not tell four voices
      // from one turned up, and a grain COUNT alone cannot tell a rhythm that is
      // being read from sixteen numbers sitting in a buffer nothing indexes: at
      // `melen 1` only slot 0 is ever read, which is the same sound and a
      // different number here.
      const want = p ? predictedRate(p, P.rate) : NaN;
      const got = Number(lastRate);
      d.assert('every note in the chord is its own grain voice',
        Number.isFinite(got) && Number.isFinite(want)
          && Math.abs(got - want) <= Math.max(2, want * 0.3),
        `${got}/s measured, ${want.toFixed(1)}/s expected — `
          + `${p ? p.gates.filter((g) => g > 0.001).length : 0} voice(s) at ${P.rate}/s`
          + (p && p.elen > 1 ? `, ${liveSteps(p)} step(s) of ${p.elen}` : ''));
      d.log(`${p ? p.name : 'the granulator'} costs ${G.glitchBefore == null ? 'an unreported number of'
        : G.glitchAfter - G.glitchBefore} dropout(s) over ${G.secs.toFixed(1)} s`);
      // 🔴 THE ONE THAT MATTERS: the radio is audibly IN the graph. A grain count
      // cannot say this — measured, a Pappus with its input disconnected fired
      // 4-5 grains per window while outputting exactly 0.00000 — and a running
      // synth cannot say it either.
      d.assert('the radio reaches the granulator and is heard', G.loud > 0.0005 && G.quiet < G.loud / 4,
        `${G.loud.toFixed(4)} running, ${G.quiet.toFixed(4)} with the node paused`);

      // 🔴 THE TWO THAT WOULD HAVE CAUGHT A PICTURE WITH NOTHING IN IT, and until
      // this change there were none: every assert on this page graded the relay,
      // the engine, a level or a COUNT, and not one of them could tell a working
      // grain picture from one whose every tick was drawn off the canvas. That is
      // `/floor/`'s lesson arriving here — an instrument that grades everything
      // beside the thing being claimed.
      //
      // FIRST, THE DECODE. A reported position is a fraction of the capture ring,
      // so it is in 0..1 by construction; anything outside it is this page reading
      // the wrong field of the message rather than the engine behaving oddly. With
      // the old `m[2]` both ends of this read exactly −1.
      d.assert('every grain says where in the sound it read',
        Number.isFinite(posMin) && posMin >= 0 && posMax <= 1,
        Number.isFinite(posMin) ? `positions ${posMin.toFixed(4)}..${posMax.toFixed(4)} of the ring`
                                : 'no grain was ever reported');
      // SECOND, THE INK AND THE FADER, in one pair of numbers with the negative
      // control built in. Nothing should be lit at the dry end and something must
      // be lit at the wet end; a probe that reads the same at both is measuring
      // neither.
      // ⚠️ NO UNIT IN THE DETAIL LINE. It said `s`, because the destination was
      // hard-coded to grain length; it is now whichever control this sound lets
      // the station walk, and those are seconds, grains a second and bare
      // fractions. A unit that is right for one of them is a lie about the
      // other two.
      d.assert('the station moves the granulator, and stops when told',
        !!G.modDest && G.modMoved.got > 4 && G.modStill.got > 2
          && G.modMoved.spread > 0.001 && G.modStill.spread <= G.modMoved.spread / 5,
        !G.modDest ? `${PATCHES[G.here]?.name ?? 'this sound'} lets the station move nothing`
          : `${G.modDest} spanned ${G.modMoved.spread.toFixed(3)} over ${G.modMoved.got} reads `
            + `while the follower ran, ${G.modStill.spread.toFixed(3)} over ${G.modStill.got} `
            + 'with it held');
      d.assert('a shape this page generates moves it too, and stops when told',
        G.lfoMoved?.got > 5 && G.lfoStill?.got > 2
          && G.lfoMoved.spread > 0.2 && G.lfoStill.spread <= G.lfoMoved.spread / 5,
        `mswarm spanned ${(G.lfoMoved?.spread ?? 0).toFixed(3)} of 1 over `
        + `${G.lfoMoved?.got ?? 0} reads under a 2 Hz saw, `
        + `${(G.lfoStill?.spread ?? 0).toFixed(3)} over ${G.lfoStill?.got ?? 0} with it held`);
      /**
       * 🔴 ONE LEFT EDGE DOWN THE WHOLE GRANULATOR SLOT, AND THIS ASSERT EXISTS
       * BECAUSE IT WAS REPORTED THREE TIMES. The first two were the same bug;
       * the third was a COMPONENT SWAP — the sound row went from `createChoice`
       * to `createPicker`, and the stylesheet rule that puts its label in the
       * shared column still named `.pos-choice`. `shareLabelColumn()` kept
       * setting `--lab` on the right element and nothing consumed it, so the
       * JavaScript read as correct while the row snapped back to the width of
       * the word SOUND.
       *
       * ⚠️ IT MEASURES THE CONTROLS, NOT THE LABELS. A label is `nowrap` and
       * sits inside the column; its width says what it WANTS, not where the
       * column ends. Where the lane actually starts is the thing a reader sees,
       * so that is the number: the fader's lane, the first slider's lane and
       * the sound stepper must all begin at the same x.
       */
      const edges = [
        ['fader', document.querySelector('.wet-fader .sld-lane')],
        ['sliders', document.querySelector('.gran-rows .sld-lane')],
        ['sound', document.querySelector('.gran-slot .pos-pick-seg')],
        // ⚠️ THE NEW ROW IS IN THE LIST FROM THE DAY IT LANDED, AND LEAVES IT
        // THE DAY THE ROW DOES. The LOOP row was here after it had moved into
        // the transport, so this queried an element that is not in the slot and
        // read `loop missing` about a page with nothing wrong with it.
      ].map(([n, e]) => [n, e ? Math.round(e.getBoundingClientRect().left) : null]);
      const xs = edges.map(([, x]) => x);
      G.edges = edges;
      d.assert('every control under the picture starts at the same left edge',
        xs.every((x) => x != null) && Math.max(...xs) - Math.min(...xs) <= 1,
        edges.map(([n, x]) => `${n} ${x == null ? 'missing' : x}`).join(' · ')
        + (xs.every((x) => x != null) ? ` — ${Math.max(...xs) - Math.min(...xs)} px apart` : ''));
      /**
       * 🔴 AND THE SPACE THIS PAGE RESERVES FOR THOSE CONTROLS IS THE SIZE OF
       * THE CONTROLS. `.gran-slot` holds a `min-height` written as a sum of rows
       * and gaps, because the granulator arrives about a second after the page
       * does and everything below it used to be shoved down while somebody was
       * reading. A sum nobody re-adds is the whole hazard: too small and the
       * page jumps, which is the complaint it was built for, and too large is a
       * band of nothing under the sliders that reads as something that failed to
       * render. Both have happened here, MEASURED — 56 px short on a phone the
       * day `Automate` was appended, then 112 px long at every width above
       * 720 px the day it was removed.
       *
       * ⚠️ IT READS THE BOX AGAINST WHAT IS IN IT rather than against the sum,
       * so it is true at whatever width the harness happens to be running and
       * cannot be satisfied by copying the arithmetic into two places.
       * ⚠️ AND IT IS ONLY MEANINGFUL ONCE THE CONTROLS HAVE LANDED, which is why
       * it sits here, in `finish()`, rather than at first paint where the slot
       * is empty on purpose.
       */
      const slotBox = granSlot.getBoundingClientRect();
      const kids = [...granSlot.children].map((k) => k.getBoundingClientRect());
      const filled = kids.length
        ? Math.max(...kids.map((k) => k.bottom)) - Math.min(...kids.map((k) => k.top)) : 0;
      const spare = Math.round(slotBox.height - filled);
      d.assert('the space held open for the controls is the size of the controls',
        kids.length > 0 && spare >= 0 && spare <= 2,
        `${kids.length} rows filling ${Math.round(filled)} px of a ${Math.round(slotBox.height)} px `
        + `slot at ${Math.round(window.innerWidth)} px wide, so ${spare} px spare`);
      d.assert('the grain ticks are drawn, and the fader fades them',
        G.inkWet > 20 && G.inkDry * 4 < G.inkWet,
        `${G.inkDry} lit all-radio, ${G.inkWet} lit all-granulator, ${G.alive} ticks alive`);

      /**
       * 🔴 THE METER HEARS THE GRANULATOR, AND IT CAN STILL HEAR SILENCE.
       *
       * Until `speakers` existed this could not have passed. `sink` was fed by
       * the station's path and the loop's gain; the engine left the page by a
       * route of its own, so with the fader hard over to the granulator the
       * meter read exactly 0.0000 over a signal that was playing perfectly, and
       * every check standing on it passed by measuring nothing.
       *
       * Three things have to hold together, and each one kills a different way
       * of passing vacuously: the meter reads the grains (so it is connected),
       * the station's own gain is at zero (so the grains are what it read), and
       * the SAME window with the output muted reads nothing (so it is a
       * measurement and not a number that is always there).
       */
      d.assert('the meter hears the granulator, and reads silence when nothing leaves',
        G.sinkGrains > 0.0005 && G.sinkDry < 0.001
          && G.sinkMuted <= G.sinkGrains / 8,
        G.sinkGrains == null
          ? 'the meter was never read'
          : `${G.sinkGrains.toFixed(4)} at the speakers with the fader hard over `
            + `to the granulator and the station at ${G.sinkDry.toFixed(3)}, `
            + `${G.sinkMuted.toFixed(4)} over the same window with the output muted`);

      /**
       * 🔴 THE LOOP ROW, AND IT IS FOUR DIFFERENT THINGS RATHER THAN FOUR NAMES.
       *
       * This replaced five speed buttons, so the claim it has to answer for is
       * that each cell does something a rate could not: a direction, a speed, a
       * length, and the seconds as they arrived. Read off the voice that is
       * playing — which buffer it holds, the lap it repeats, the rate it runs at
       * — never off the page's own idea of what it did.
       *
       * ⚠️ AND `back` IS GRADED ON THE SAMPLES. A reversed buffer that is merely
       * a DIFFERENT buffer would satisfy every other test here; the mirror check
       * compares four points against the kept seconds at the mirrored index,
       * exactly.
       */
      {
        const w = G.ways || [];
        const by = (n) => w.find((x) => x.name === n);
        const round = by('round'), back = by('back'), half = by('half'), chop = by('chop');
        const near1 = (x) => Number.isFinite(x) && Math.abs(x - 1) < 1e-6;
        const ok = w.length === LOOP_WAYS.length
          && round && back && half && chop
          && !round.back && near1(round.rate) && Math.abs(round.lap - round.whole) < 1e-6
          && back.back && near1(back.rate)
          && G.mirror && G.mirror.tried === 4 && G.mirror.same === 4
          && !half.back && Math.abs(half.rate - 0.5) < 1e-6
          && !chop.back && near1(chop.rate) && chop.lap < chop.whole - 1e-6
          // ⚠️ AND THE BUTTON'S FACE IS THE WAY THAT IS PLAYING. Three ways are
          // reached by pressing it, so a cycle that lands on the right sound
          // with the wrong glyph showing is a control describing a different
          // loop from the one you are hearing.
          && w.every((x) => x.face === x.want)
          // and the loop coming off leaves the grain clock on the sound's own
          // rate, whatever the row did to it in between
          && Number.isFinite(G.wayRate) && Math.abs(G.wayRate - G.wayWant) < 1e-3;
        d.assert('every way in the LOOP row plays the kept seconds differently',
          !!ok,
          !w.length ? 'the row was never driven'
            : w.map((x) => `${x.name} ${x.lap == null ? 'no voice' : `${x.lap.toFixed(2)} s`}`
              + ` at ${x.rate == null ? '—' : x.rate.toFixed(2)}x`
              + `${x.back ? ' reversed' : ''}`).join(' · ')
              + ` · of ${(w[0]?.whole ?? 0).toFixed(2)} s kept`
              + ` · mirror ${G.mirror ? `${G.mirror.same} of ${G.mirror.tried}` : 'never checked'}`
              + ` · and ${G.wayRate == null ? 'no' : G.wayRate.toFixed(4)}/s left after,`
              + ` against ${G.wayWant}/s written`
              + ` · faces ${w.map((x) => `${x.face}${x.face === x.want ? '' : `≠${x.want}`}`).join('')}`);

        /**
         * 🔴 AND THE LINE ON THE PICTURE GOES THE WAY THE SOUND DOES.
         *
         * Every assert above reads the VOICE. This one reads the PLAYHEAD, and
         * they are different quantities joined by arithmetic that was wrong:
         * under pingpong the head ran across once and then stuck against the
         * right edge for the entire return, because the voice reads a buffer
         * twice as long as the picture is wide and the fraction was taken
         * against the picture. Reported as the viz not following the mode.
         *
         * Forwards may only go up, backwards may only go down, and there and
         * back has to do both inside one lap. A lane with no samples at all
         * fails rather than passing for want of evidence.
         */
        const t = G.turns || [];
        const turn = (n) => t.find((x) => x.name === n);
        const fwd = turn('round'), rev = turn('back'), png = turn('pingpong');
        const turnsOk = t.length === LOOP_TURN.length
          && fwd && fwd.up > 2 && fwd.down === 0
          && rev && rev.down > 2 && rev.up === 0
          && png && png.up > 2 && png.down > 2;
        d.assert('the line on the picture runs the way the loop is playing',
          !!turnsOk,
          !t.length ? 'the ways were never driven'
            : t.map((x) => `${x.name} ${x.up} up ${x.down} down of ${x.seen}`
              + ` over ${x.lap.toFixed(2)} s a lap`).join(' · '));
      }
      /**
       * 🔴 TWO CLAIMS, TWO ASSERTS, BECAUSE EITHER ALONE PASSES ON A HALF-BUILT
       * LOOP. A line drawn in the right place over a picture that keeps
       * scrolling is the thing that was reported as wrong in the first place;
       * a picture that stops with no line on it is a page that looks frozen.
       */
      const heads = G.headAt || [];
      const wantWide = Math.ceil(G.headDpr);
      d.assert('the loop playhead lands where it is put, one pixel wide',
        heads.length === 2
          && heads.every((h) => Math.abs(h.at - h.want) < 0.02 && h.tall > 0.9
            && h.wide > 0 && h.wide <= wantWide),
        heads.length
          ? heads.map((h) => `asked ${h.want}, drew at ${h.at.toFixed(3)} `
            + `over ${(h.tall * 100).toFixed(0)}% of the height`).join(' · ')
            + ` · ${heads[0].wide} of ${wantWide} backing px wide`
          : 'never driven');
      // ⚠️ AND IT GRADES THAT THE SECONDS WERE KEPT, not only that the edge
      // stopped. A picture that froze and threw the audio away would satisfy
      // "the edge held still" perfectly, and that is the exact defect this
      // replaced: the loop's own seconds have to be in `scroll` when the edge
      // starts moving again or the wave resumes with a hole in it.
      d.assert('a loop stops the picture moving, keeps recording behind it, and both undo',
        G.headHeld === 0 && G.headRuns > 0 && G.headGone && G.keptWhileFrozen > 0,
        `the edge ${G.headHeld === 0 ? 'held still' : 'KEPT MOVING'} while frozen, `
        + `${G.keptWhileFrozen ?? '—'} reads were kept behind it, `
        + `and ${G.headRuns == null ? '—' : G.headRuns} more arrived in 300 ms after`);

      /**
       * 🔴 A SLIDER MOVES BY ITSELF, AND THE ONE BESIDE IT DOES NOT. Four things
       * in one assert because each alone is passable by a page doing something
       * else: a face that lights over a handle standing still, a handle that
       * jumps once, a movement nobody asked for, and a hand that is a module
       * singleton and so moves every slider at once. The last is a NEGATIVE
       * CONTROL and it fails on the obvious way to write this feature.
       */
      const H = G.hand;
      d.assert('a slider sweeps itself when its own button is pressed, and its neighbour stays put',
        !!H && H.lit.running && H.lit.row === 'on' && H.lit.pressed === 'true'
          && H.lit.otherRow === 'off' && H.lit.starts === 1
          && H.seen > 10 && H.hi > H.lo
          && H.otherStill === H.startedWith && H.otherOff === 'off',
        !H ? 'never driven'
          : `${H.name} took ${H.seen} different positions between ${H.lo} and ${H.hi} `
            + `over 2 s, its symbol lit and ${H.other} sat at ${H.otherStill} `
            + `with its own row reading ${H.otherOff}`);
      /**
       * 🔴 AND WHAT IT MOVES REACHES THE ENGINE, ASKED OF THE ENGINE, AT TWO
       * DIFFERENT PLACES ON THE LANE. Everything above is a handle. A hand that
       * animated one beautifully and wrote nothing would satisfy all of it,
       * which is the failure `/s_get` exists to close: the value scsynth is
       * holding, equal to the number under the label, twice, at two positions
       * the sweep visited a second and a half apart.
       *
       * ⚠️ THE TOLERANCE IS RELATIVE AND IT IS ABOUT float32. The control goes
       * out as a float and comes back as one, so an exact comparison fails on
       * the seventh digit of a number that is correct.
       */
      const holds = (a, b) => Number.isFinite(a) && Number.isFinite(b)
        && Math.abs(a - b) <= Math.max(1e-6, Math.abs(b) * 1e-5);
      d.assert('what a hand moves reaches the engine, at both ends of the reach',
        !!H && holds(H.A.got, H.A.ui) && holds(H.B.got, H.B.ui) && H.A.ui !== H.B.ui,
        !H ? 'never driven'
          : `m${H.name} read back ${Number(H.A.got).toFixed(5)} against ${H.A.ui} on the handle, `
            + `then ${Number(H.B.got).toFixed(5)} against ${H.B.ui} 1.8 s later`);
      /**
       * 🔴 A FINGER TAKES IT BACK, THE BUTTON STOPS IT, AND NOTHING STARTS ONE
       * BY ITSELF. This repo has twice shipped a page that worked a control in
       * front of the person holding it, so the three guards are graded the same
       * way the feature is. A pointer on the lane YIELDS — the handle stays
       * where the finger left it and the row says it is being held — while the
       * button is what turns the movement off, which is the difference between
       * a fader you can grab and one that argues with you.
       *
       * ⚠️ AND `.pos-controls` IS READ RATHER THAN ASSUMED. `verify.mjs` presses
       * every button in that row on every demo on every run, so a hand button
       * that ended up in one would start a sweep on every run for ever.
       */
      d.assert('a finger takes the handle back, the button stops the sweep, and none of it is in the control row',
        !!H && H.heldByFinger && H.stayed === H.atFinger
          && H.offRow === 'off' && !H.offRunning && H.offPressed === 'false'
          && H.lit.inControls === 0 && H.lit.starts === 1
          && H.lit.leftMs > 9 * 60000 && H.lit.leftMs <= 10 * 60000,
        !H ? 'never driven'
          : `the finger left it at ${H.atFinger} and it was still there 300 ms after the lift, `
            + `the next press left the row reading ${H.offRow}, `
            + `${H.lit.inControls} hand buttons are in the control row, and `
            + `${Math.round(H.lit.leftMs / 1000)} s were left of the ten minute ceiling`);

    }


    // 🔴 AND THE STATION BUTTONS, WHICH NOTHING ELSE CAN REACH. `verify.mjs`
    // presses `.pos-controls button, .tbar-x` and this row is neither, so
    // shipping it without a check here would be two controls nobody grades —
    // exactly how `mirror` lost two asserts while reading green.
    //
    // ⚠️ A REAL CLICK ON THE ELEMENT, NEVER `picker.set()`. The fault this kind
    // of check exists to catch lives in the wiring between the button and the
    // handler, and calling the handler steps straight over it (`/floor/` spent
    // five rounds on that). Last of all, because it restarts the audio.
    // 🔴 AND IT PUTS THE STATION BACK. The first version clicked the other
    // button and stopped there, so a page that checks itself ENDED ON A STATION
    // NOBODY CHOSE — reported from a phone, where the log read `Klassikaraadio
    // — you chose it` and the reader had chosen nothing. A self-check is not
    // allowed to leave the instrument somewhere else; it restores through
    // another real click, so the restore is exercised by the same path.
    const here = STATIONS.findIndex(([, id]) => id === station);
    const other = here === 0 ? 1 : 0;

    // The station A/B ran HERE and now runs early — see `checkStationButtons`.
    if (SELFCHECK) d.assert(S.label, S.pass, S.detail);
  }


  // ── the granulator ─────────────────────────────────────────────────────────
  // 🔴 REAL SUPERCOLLIDER, EATING A REAL RADIO STATION. `Engine_Pappus.sc:518`
  // is `in = LeakDC.ar([In.ar(inbusl, 1), In.ar(inbusr, 1)])` — Pappus does not
  // generate, it granulates whatever is ON A BUS. On the Raspberry Pi that bus
  // is filled by JACK; `/grains/` fills it from inside scsynth with a second
  // definition, because nothing in a browser filled it. This page fills it with
  // a radio station: `bootScsynth`'s `input` connects the page's audio to
  // scsynth's hardware input busses, 2 and 3, which is exactly the `inbusl 2
  // inbusr 3` the board uses. MEASURED level-preserving and with zero engine
  // delay — research/scsynth-live-input-2026-09.md.
  /**
   * A reported grain position, moved onto the axis the picture is drawn on.
   *
   * Pappus records into a `RING_SECONDS` ring and reads grains out of a window
   * `mbuflen` seconds long, and `/pgrain`'s `pos` is a fraction of the RING —
   * see the note on `RING_SECONDS` in `pappus.mjs` for the line in the engine
   * that makes it so. This is the same rescale `/grains/` calls `winPos`, and it
   * is written from the two constants rather than from the 7.5 they currently
   * multiply out to: a number typed once can be read, a number typed twice can
   * disagree with the buffer it describes.
   */
  const winPos = (p) => Math.min(1, Math.max(0, (p ?? 0) * RING_SECONDS / BUF_SECONDS));

  // The raw reported extremes, kept for the assert that catches a decode that
  // has slipped — a position outside 0..1 is not a granulator reading oddly, it
  // is this page reading the wrong field.
  let posMin = Infinity, posMax = -Infinity;

  /**
   * 🔴 A CHORD OUT OF THE STATION — `plans/plan-radio-sound.md` ①.
   *
   * Pappus has EIGHT grain voices, each with its own gate and its own pitch in
   * semitones (`Engine_Pappus.sc:403-404`). `base = pitches[i]` at `:851` goes
   * straight into `2 ** (base/12)` as the read speed of that voice's `GrainBuf`
   * at `:871`, so every open voice reads the same held second of radio at a
   * different speed: the station arrives as a chord of itself.
   *
   * ⚠️ ALL INSIDE `mkgrain`, WHICH EVERY RUNG BUILDS — so unlike most of that
   * plan this survives TINY, where the resonator, the shimmer and the second
   * granulator are compiled out and their controls are inert.
   *
   * ⚠️ ONLY `gates`/`pitches`, NOT `gates2`/`pitches2`. The second granulator is
   * `DC.ar([0,0])` on LITE and below (`:1013`), and TINY implies LITE — writing
   * to it is addressing a granulator that does not exist.
   */
  /**
   * 🔴 SIX FINISHED SOUNDS, NOT A ROW OF MODES. The page used to carry two
   * choice rows — `material` (speech / music) and `chord` (one voice / fifth /
   * seventh) — and between them they set seven numbers out of the hundred and
   * seven this graph takes. REPORTED after listening to talk: *"I tried human
   * speech, it wasn't that interesting, just scattered walls"*, and of a
   * neighbouring page, *"mambo jumbo"*. Both complaints are the same fact:
   * whichever way the two rows were set, what came out was bare grains through

   * `one note held`, the patch with a chord in it — `[0, 3, 7, 10, 14, 19]`, a
   * minor eleventh. Absorbing the two rows is not a tidy-up:
   * a chord and a read-head mode are not independent choices. A seventh under
   * 30-millisecond grains is four copies of a click, and the wash that suited
   * music destroyed a sentence. Each patch below states its own chord because
   * a patch that inherits one is a patch that sounds like the last one.
   *
   * ⚠️ WHAT IS LOST BY DROPPING THE ROWS: you can no longer hear one patch's

  /**
   * 🔴 THE BUFFER STAYS AT EIGHT SECONDS, AND THE PLAN SAID SIXTY. Read this
   * before raising it.
   *
   * `plans/plan-radio-patches.md §0.3` argues for holding `mbuflen` at 60 — the ring
   * is allocated at 60 s (`pappus.mjs:33`) — and moving `mwinstart`/`mwinend`

   * (`Engine_Pappus.sc:650`), so **switching a patch from 8 s to 45 hands the
   * granulator 37 seconds of zeros**. That half is right and it is honoured
   * here the strict way: every patch holds `mbuflen` at the ONE value this page
   * has always recorded, so no patch can ever open onto a hole.
   *
   * What the plan did not price is the harness and the visitor. The ring has to
   * be FILLED before the granulator sounds like itself, and this page already
   * waits for exactly that (`played() - ringFrom < BUF_SECONDS`, below) — at 60

   * burst at the end. `verify.mjs` gives the first assert `settleMs` (30 s) and

   * the page would report **nothing** and read as broken while working. A
   * visitor pays the same minute before the instrument does anything.

   * copied off a table written for sixty. Three places that matters, all of
   * which the plan flagged and none of which it had run:
   *

   *     `mbuflen / (3·mscan − 1)` seconds and covers `winspan × mbuflen`

   *     independent of `mbuflen`. What shortens is the LAP: `ground`'s
   *     reverse crawl at -1x laps every 8 s instead of every 60.

   *     × 0.25` (`:814`) is a fraction of the WINDOW, so at 8 s a scatter of
   *     0.09 is ±180 ms and at 60 s it would be ±1.35 s. The plan's `stutter`

   * rather than the last minute, and the longest grain is 4 s rather than 6.

   * `grainSeconds`, `winPos`, the delay scale in `setScan`, and the fill wait

   * doing the day somebody wants a minute-long patch.

  /**
   * 🔴 A PATCH WRITES EVERY FIELD, EVERY TIME — `/grains/`'s `writePatch` rule
   * and this repo has paid for it three times (`msrc 1`, `src`/`lock`,
   * `notes.gate`). Every message here is fire-and-forget, so a patch that sets
   * only what it changes inherits whatever the last one left behind, silently.

   * Column notes, each a line of the engine rather than a taste:
   *   `scanmode`  1 STRETCH (`mscan` is a SPEED, mapped −1…+2), 2 POSITION
   *               (a fixed place), 3 DELAY SYNC (behind the write head).

   *               voice, `:783`). ⚠️ 2 and 4 set `pan = DC.ar(0)` (`:816`) —

   *   `swarmmode` `Select.kr(mswarmmode-1, [0,-7,-12,7])` / `[0,7,12,12]`
   *               (`:745`): 1 DETUNE, 2 ±5th, 3 ±octave, 4 +5th/+octave.

   *               ever fills — silent, and it looks like a broken patch.
   *   `crushmode` `Select.ar(crushmode-1, [bits, rate, both])` (`:1666`).

   *               written without raising `elen` is fifteen inert numbers and

   * movement, neither of which helped. They could not have. MEASURED off the

   *   read speed between -0.10x/+0.25x  5 of 7   — five of them nearly standing still
   *   grain overlap (size x rate)     2.0-5.0   — on a scale the engine clamps at 2..40
   *   euclid inert (elen 1)           6 of 7   — the sixteen-step gate never read

   * material, and that is a different thing to hear.

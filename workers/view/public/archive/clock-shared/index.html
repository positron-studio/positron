<title>POSITRON Shared clock</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The Join button appears after Play. `button`'s own display beats the UA's
     [hidden] rule, the patch shell.css carries for the readout and the log. */
  .pos-bgroup-row button[hidden] { display: none; }
</style>
<script type="module">
  // concepts clock/030, SHARED CLOCK, 2026-10-12. One idea: places agree on the
  // time ONCE, and then every beat is worked out at each end, nothing sent; a
  // place that arrives mid-beat needs only the same anchor and its own clock's
  // error. Old clock/020 (Shared clock) and old clock/070 (Join late) merged
  // when the clock pages were renumbered (BACKLOG "Clock concepts: a critical
  // read"); this file is old 070's, with 020's four readout cells.
  //
  // clock/000's lesson (tell the sound card the time in advance) across clock/010's
  // relay. Sites in this one tab, each with a socket of its own:
  //   - `web-1` holds a `clock` node and a `beat` node, and keeps the true clock,
  //   - `web-2` holds a `beat` node, its clock set wrong by a random 100 to
  //     300 ms on Play, which it is not told (as /sync/'s ahead tab does),
  //   - `web-3`, brought in by Join while the beat runs, the same with its own
  //     random error.
  // Each runs peer.mjs over the relay (bursts of pings, the fastest round trip
  // kept, NTP style; web-1 is every peer's reference, peer.mjs `ids[0]`), so it
  // finds its own error. The clock node sends `{ bpm, epoch }` ONCE per place,
  // along `clock-out -> *:beat:clock-in`, as one `bay.event`: once on Play, and
  // again when a newcomer asks the room for its graphs and that `*` link
  // reaches a place it has not sent to. The tempo is fixed at 120 (asked
  // 2026-10-12, *"fix temo to 120"*). Each beat node computes beat k as
  // `epoch + k * 60000 / bpm` on its own corrected clock and hands it to the
  // AudioContext ahead. The patchbay's clock wire lights per message, so it
  // lights once per place and stays dark while the beats go on.
  //
  // ⚠️ ONE TAB, SO ONE SOUND CARD. Every beat node schedules on this tab's one
  // AudioContext, and how far apart they land is the difference between the
  // audio times they chose, which is the honest reading: all places read the
  // same audio clock, so all that separates them is their notions of now.
  //
  // Nothing opens on a visit. Play joins the room; Join appears once it has.
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBayNode, ROOM_RE } from '/shell/bay-node.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { DEFAULT_RELAY } from '/shell/wire.mjs';
  import { createPeer, wsTransport, epochNow } from '/proto/looper/peer.mjs';
  import { rand, sleep, fmt, median, worst, band, graphOf, soundCard, plainNames } from '/archive/clock-kit.mjs';

  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : `clock-${rand(6)}`;
  const HERE = `here-${rand(3)}`, THERE = `there-${rand(3)}`, LATE = `late-${rand(3)}`;
  const CLK = `${HERE}:clock:clock-out`;
  const IN = { here: `${HERE}:beat:clock-in`, there: `${THERE}:beat:clock-in`, late: `${LATE}:beat:clock-in` };
  const BPM = 120, STEP = 60000 / BPM;

  const G_HERE = graphOf(HERE, 'here', [
    { id: `${HERE}:clock`, kind: 'engine', label: 'clock', place: 'browser' },
    { id: `${HERE}:beat`, kind: 'engine', label: 'beat', place: 'browser' },
  ], [
    { id: CLK, label: 'clock', dir: 'out', medium: 'clock' },
    { id: IN.here, label: 'beat', dir: 'in', medium: 'clock' },
  ]);
  const beatGraph = (site, label, port) => graphOf(site, label, [{ id: `${site}:beat`, kind: 'engine', label: 'beat', place: 'browser' }],
    [{ id: port, label: 'beat', dir: 'in', medium: 'clock' }]);
  const G_THERE = beatGraph(THERE, 'there', IN.there), G_LATE = beatGraph(LATE, 'late', IN.late);

  const d = mount({ name: 'Shared clock', what: '', index: '/archive/', indexLabel: 'archive',
    // Readouts on top, the log at the foot (positron-concepts).
    joined: false,
    // Four cells, asked 2026-10-12: *"do 4 readouts that make sense"*. What
    // web-2 found its clock off by, the round trip that finding rests on, and
    // how far apart the far places' beats land from web-1's, typical and worst,
    // web-3's counted in once it joins. Join's own numbers (press to first beat,
    // that beat against web-1's) are log lines, because they happen once.
    readout: { 'offset found': 'ms', 'round trip': 'ms', apart: 'ms', worst: 'ms' } });

  const S = soundCard();

  // ── a place: its own clock, its correction, and the beats it plays ──────
  const AHEAD = 100, TICK = 25;
  function place(name, hz) {
    const P = { name, hz, skew: 0, peer: null, ready: false, clock: null, played: new Map() };
    P.raw = () => epochNow() + P.skew;
    P.off = () => (P.peer ? P.peer.offsetMs() : 0);
    P.now = () => P.raw() + P.off();
    P.audioAt = (T) => S.audioOf(T - P.off() - P.skew);
    P.tick = () => {
      const c = P.clock;
      if (!c || !P.ready || !S.ctx) return;
      const now = P.now();
      for (let k = Math.max(0, Math.ceil((now - c.epoch) / STEP)); c.epoch + k * STEP < now + AHEAD; k++) {
        if (P.played.has(k)) continue;
        const at = P.audioAt(c.epoch + k * STEP);
        if (at < S.ctx.currentTime) continue;
        S.click(at, hz);
        P.played.set(k, { at, T: c.epoch + k * STEP });
        P.onFirst?.(k, at);
        P.onFirst = null;
      }
    };
    return P;
  }
  const here = place('web-1', 880), there = place('web-2', 1320), late = place('web-3', 1760);
  here.ready = true;
  const P_OF = { [IN.here]: here, [IN.there]: there, [IN.late]: late };

  // ── the bays ─────────────────────────────────────────────────────────────
  function bayHere() {
    const b = nodeHere.registry.fill(createBay());
    b.addPort({ ...b.port(IN.here), deliver: (e) => onClock(here, e) });
    b.link(CLK, IN.here, [], { site: HERE });
    b.link(CLK, '*:beat:clock-in', [], { site: HERE });
    return b;
  }
  const bayFar = (node, site, port, P) => () => {
    const b = node.registry.fill(createBay());
    b.addPort({ ...b.port(port), deliver: (e) => onClock(P, e) });
    b.link('*:clock:clock-out', port, [], { site });
    return b;
  };
  const log = (line, kind) => d.log(line, kind);
  // 🔴 THE ANSWER RIDES web-1's OWN graph.ask REPLY. A newcomer announces and then
  // asks; web-1 announces back and sends the anchor right after, on the same
  // socket, so the newcomer has web-1's graph before the anchor arrives and its
  // bay accepts it. Sending when the target first appeared raced that graph and
  // was refused (MEASURED on the first drive: web-3 never heard the anchor).
  const nodeHere = createBayNode({ room: ROOM, graphs: [G_HERE], bay: bayHere, log,
    onMessage: (m) => { if (m.type === 'graph.ask') answerNewcomers(); } });
  const nodeThere = createBayNode({ room: ROOM, graphs: [G_THERE], bay: () => bayThere(), log });
  const nodeLate = createBayNode({ room: ROOM, graphs: [G_LATE], bay: () => bayLate(), log });
  const bayThere = bayFar(nodeThere, THERE, IN.there, there), bayLate = bayFar(nodeLate, LATE, IN.late, late);

  function onClock(P, e) {
    const c = { bpm: Number(e.bpm), epoch: Number(e.epoch) };
    const again = P.clock && P.clock.epoch === c.epoch;
    P.clock = c;
    const port = Object.keys(P_OF).find((k) => P_OF[k] === P);
    pb.pulse(plain(CLK), plain(port));
    if (!again) d.log(`${P.name} heard the anchor: ${e.bpm} bpm from ${new Date(c.epoch).toISOString().slice(11, 23)}`);
    if (P === late) late.heardAt ??= epochNow();
  }

  // ── web-1 answers a newcomer with the same anchor, once per place ───────
  let anchor = null;
  const answered = new Set();
  const sent = { anchors: 0 };
  function sendAnchor(why) {
    const r = nodeHere.emit(CLK, anchor);
    sent.anchors++;
    for (const to of r.far) answered.add(to);
    d.log(`web-1 sent the anchor ${why}, ${sent.anchors} sent so far`);
  }
  function answerNewcomers() {
    if (!anchor) return;
    const fresh = bayHere().targets(CLK).map((t) => t.to).filter((to) => to !== IN.here && !answered.has(to));
    if (fresh.length) sendAnchor(`again, because ${fresh.map((t) => plain(t).split(':')[0]).join(', ')} arrived`);
  }

  // ── play: web-1 and web-2 ─────────────────────────────────────────
  let loop = null, playing = false, busy = false, tag = '';
  const url = () => `${DEFAULT_RELAY}/room/${ROOM}-ntp/ws`;
  const skewOf = () => Math.round((Math.random() < 0.5 ? -1 : 1) * (100 + Math.random() * 200));
  async function play() {
    if (playing || busy) return;
    busy = true;
    await S.open();
    there.skew = skewOf();
    // A second Play starts a new anchor, and beats are keyed by number, so the
    // last run's beats go or beat 0 of this one would read as already played.
    for (const P of [here, there, late]) P.played.clear();
    lateRun.first = null;
    await Promise.all([nodeHere.join(), nodeThere.join()]);
    tag = rand(6);
    here.peer = createPeer({ id: `a-${tag}`, transport: wsTransport(url()), now: here.raw });
    there.peer = createPeer({ id: `b-${tag}`, transport: wsTransport(url()), now: there.raw });
    d.log(`joined ${ROOM}, web-1 as ${HERE} and web-2 as ${THERE}. web-2's clock is set ${Math.abs(there.skew)} ms ${there.skew > 0 ? 'fast' : 'slow'} and is not told`, 'hi');
    const has = () => !!bayHere().targets(CLK).find((t) => t.to === IN.there)
      && there.peer.peers().some((p) => Number.isFinite(p.rttMs));
    for (let i = 0; i < 80 && !has(); i++) await sleep(50);
    await sleep(600);
    S.reanchor();
    there.ready = true;
    loop = setInterval(() => { here.tick(); there.tick(); late.tick(); }, TICK);
    anchor = { bpm: BPM, epoch: Math.round(here.now() + 500) };
    sendAnchor('once, to start');
    first = epochNow();            // the run starts here, and the strip's cursor with it
    view.strip.startLive(0);
    playing = true; busy = false;
    btns.setIcon('go', 'stop', 'Stop');
    btns.enable('join', true);
    btns.button('join').hidden = false;
  }

  // ── join: web-3 arrives while the groove runs ───────────────────────────
  let joinedLate = false;
  const lateRun = { pressed: 0, first: null };
  async function joinLate() {
    if (!playing || joinedLate) return;
    joinedLate = true;
    btns.enable('join', false, 'web-3 is in the room');
    late.skew = skewOf();
    lateRun.pressed = epochNow();
    late.heardAt = null;
    late.onFirst = (k, at) => {
      lateRun.first = { k, at, onTrue: S.epochOf(at) };
      const g = gapOf(late, k);
      d.log(`web-3 played its first beat, number ${k}, ${fmt(S.epochOf(at) - lateRun.pressed)} ms after Join, ${g == null ? '' : `${fmt(g)} ms from web-1's`}`, 'hi');
    };
    d.log(`web-3 joins ${ROOM} as ${LATE}, its clock set ${Math.abs(late.skew)} ms ${late.skew > 0 ? 'fast' : 'slow'} and not told`, 'hi');
    await nodeLate.join();
    late.peer = createPeer({ id: `c-${tag}`, transport: wsTransport(url()), now: late.raw });
    // Ready once it has the anchor and three bursts of pings have come back from
    // web-1, the fastest kept. ONE burst was not enough: MEASURED on the second
    // drive, the first burst's best round trip put web-3's first beat 62 ms off,
    // and the next bursts brought it to 1.85.
    const ref = `a-${tag}`;
    const got = (n) => late.peer.peers().some((p) => p.id === ref && p.samples >= n);
    for (let burst = 1; burst <= 3; burst++) {
      for (let i = 0; i < 100 && !got(5 * burst); i++) await sleep(10);
      if (burst < 3) late.peer.ping();
    }
    for (let i = 0; i < 100 && !late.clock; i++) await sleep(20);
    late.ready = !!late.clock;
    d.log(`web-3 has the anchor at +${fmt((late.heardAt ?? epochNow()) - lateRun.pressed)} ms and its clock's error, ${fmt(late.off())} ms, at +${fmt(epochNow() - lateRun.pressed)} ms`);
  }

  function stop() {
    clearInterval(loop); loop = null;
    for (const n of [nodeHere, nodeThere, nodeLate]) n.leave();
    for (const P of [here, there, late]) { P.peer?.dispose(); P.peer = null; P.clock = null; }
    late.ready = there.ready = false;
    S.hush();
    anchor = null; answered.clear();
    playing = false; joinedLate = false;
    view.strip.stopLive();
    btns.setIcon('go', 'play', 'Play');
    btns.enable('join', false, 'Play first');
    btns.button('join').hidden = true;
    d.log(`stopped: the anchor was sent ${sent.anchors} times, once per place, and no beat was ever sent`);
  }

  const btns = createButtonGroup({ buttons: [
    { id: 'go', icon: 'play', label: 'Play', title: `room ${ROOM}`, onPress: () => (playing ? stop() : play()) },
    { id: 'join', label: 'Join', title: 'web-3 joins while the beat runs', onPress: () => joinLate() },
  ] });
  btns.enable('join', false, 'Play first');
  btns.button('join').hidden = true;

  // ── what it measured ────────────────────────────────────────────────────
  const gapOf = (P, k) => { const h = here.played.get(k), t = P.played.get(k); return h && t ? (t.at - h.at) * 1000 : null; };
  const gaps = (P) => [...P.played.keys()].map((k) => gapOf(P, k)).filter((x) => x != null);
  let first = null;
  const WINDOW = 8000;
  setInterval(() => {
    if (!playing) return;
    // web-2 against its reference, web-1 (`a-<tag>`), not the fastest of all
    // its peers, which once web-3 is in could be web-3's round trip.
    const ref = there.peer?.peers().find((p) => p.id === `a-${tag}` && Number.isFinite(p.rttMs));
    d.set('offset found', ref ? fmt(there.peer.offsetMs()) : '');
    d.set('round trip', ref ? fmt(ref.rttMs) : '');
    const g = [...gaps(there).slice(-16), ...gaps(late).slice(-16)];
    if (g.length) { d.set('apart', fmt(median(g))); d.set('worst', fmt(worst(g))); }
    for (const P of [there, late]) {
      const L = view.strip.lanes().find((x) => x.id === P.name), gg = gaps(P).slice(-16);
      if (L && gg.length) L.subLabel = [`median ${fmt(median(gg))} ms`, `worst ${fmt(worst(gg))} ms`];
    }
    view.strip.invalidate();
  }, 250);

  // ── the timeline: three places, the newcomer's lane starting where it joined ─
  const deck = createDeck({ items: [], range: [0, WINDOW] });
  const shelf = el('div');
  const rowsOf = (P) => () => (first == null ? [] : [...P.played.entries()]
    .filter(([, v]) => v.T <= epochNow())
    .map(([k, v]) => ({ at: v.T - first, id: `${P.name}${k}`, kind: 'beat', payload: { k } })));
  const lane = (P) => ({ id: P.name, kind: 'beat', label: P.name, height: 40, width: 2, as: 'ticks', terse: true, rows: rowsOf(P),
    ...(P === here ? { color: '#6f7d94', describeRow: () => ['web-1', 'the clock it keeps'] }
      : { colorOfRow: (r) => { const g = gapOf(P, r.payload.k); return g == null ? '#3b424e' : band(g); },
          rankOfRow: (r) => { const g = gapOf(P, r.payload.k); return g == null ? -1 : Math.abs(g); },
          describeRow: (r) => { const g = gapOf(P, r.payload.k); return [P.name, g == null ? 'not played yet' : `${g >= 0 ? '+' : ''}${fmt(g)} ms from web-1`]; } }) });
  // A LIVE strip (timeline/strip.mjs `startLive`): the whole run in view from
  // Play, scaling out as it grows, the cursor at now, and marks too close to
  // draw apart binned. Asked 2026-10-12: *"why cursor aint moving? ... we need
  // std behaviour here"*.
  const view = createStripView(shelf, deck, { size: 'auto', follow: false, gutter: 132, live: { minSpan: WINDOW },
    lanes: [lane(here), lane(there), lane(late)] });

  // ── names, and the patchbay: the anchor wire lights once per place ──────
  const { plain, named, hovers } = plainNames(new Map([[HERE, 'web-1'], [THERE, 'web-2'], [LATE, 'web-3']]), ROOM, (id) =>
    id === plain(`${LATE}:beat`) ? "arrives on Join, reached by web-1's * link, clock-out -> *:beat:clock-in"
    : id === plain(`${THERE}:beat`) ? "reached by web-1's * link, clock-out -> *:beat:clock-in" : '');
  const picture = (() => {
    const b = createBay();
    for (const g of [G_HERE, G_THERE, G_LATE]) { for (const n of g.nodes) b.addNode(n); for (const p of g.ports) b.addPort(p); }
    b.link(CLK, IN.here); b.link(CLK, IN.there); b.link(CLK, IN.late);
    return b;
  })();
  const pb = createPatchbay(named(picture), { room: 'clock' });
  hovers(pb.el, 'clock');

  d.stack.add(btns.el, view.surface, pb.el);
  addEventListener('pagehide', () => { if (playing) stop(); S.ctx?.close(); });
  window.__clock = { here, there, late, lateRun, sent, gaps, joinLate, peers: () => late.peer?.peers().map((p) => [p.id, p.rttMs, p.offsetMs, p.samples]) };
  d.ready();
</script>

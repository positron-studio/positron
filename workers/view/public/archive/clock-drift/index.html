<title>POSITRON Clock drift</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  // concepts clock/050, DRIFT, 2026-10-12. One idea: two clocks that agreed once
  // do not stay agreed, because no two run at exactly the same rate, so the
  // agreement has to be made again now and then.
  //
  // clock/030 plus a rate. `web-2`'s clock is still set wrong by 100 to 300 ms,
  // and now it also RUNS a chosen number of parts per million fast (the picker),
  // simulated by scaling that place's clock: its reading gains `ppm / 1e6` ms
  // for every true ms. Real crystals sit around 20 to 100 ppm apart; 1000 is a
  // bad one, and it is there so the effect shows inside a minute.
  // The agreement is one measurement, peer.mjs's bursts of pings with the
  // fastest round trip kept, taken on Play and then only when the resync switch
  // says: off, every 10 s or every 60 s. A resync is a fresh peer and fresh
  // bursts, and the old correction stays in use until the new one is in hand.
  // `drift now` is how far web-2's latest beat lands from web-1's, on the one
  // sound card both share (clock/030's note); `rate` is web-2's clock against
  // the true one, read off both clocks, so the picker's number is checked rather
  // than repeated.
  //
  // Nothing opens on a visit. Play joins the room.
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBayNode, ROOM_RE } from '/shell/bay-node.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { DEFAULT_RELAY } from '/shell/wire.mjs';
  import { createPeer, wsTransport, epochNow } from '/proto/looper/peer.mjs';
  import { rand, sleep, fmt, worst, band, graphOf, soundCard, plainNames } from '/archive/clock-kit.mjs';

  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : `drift-${rand(6)}`;
  const HERE = `here-${rand(3)}`, THERE = `there-${rand(3)}`;
  const CLK = `${HERE}:clock:clock-out`;
  const IN = { here: `${HERE}:beat:clock-in`, there: `${THERE}:beat:clock-in` };
  const BPM = 120, STEP = 60000 / BPM;

  const G_HERE = graphOf(HERE, 'here', [
    { id: `${HERE}:clock`, kind: 'engine', label: 'clock', place: 'browser' },
    { id: `${HERE}:beat`, kind: 'engine', label: 'beat', place: 'browser' },
  ], [
    { id: CLK, label: 'clock', dir: 'out', medium: 'clock' },
    { id: IN.here, label: 'beat', dir: 'in', medium: 'clock' },
  ]);
  const G_THERE = graphOf(THERE, 'there', [{ id: `${THERE}:beat`, kind: 'engine', label: 'beat', place: 'browser' }],
    [{ id: IN.there, label: 'beat', dir: 'in', medium: 'clock' }]);

  const d = mount({ name: 'Clock drift', what: '', index: '/archive/', indexLabel: 'archive',
    // Readouts on top, the log at the foot (positron-concepts).
    joined: false,
    // How far apart the beats land now and at worst since a control last
    // changed, how many times the clocks agreed again, and web-2's clock rate
    // as measured off both clocks.
    readout: { 'drift now': 'ms', worst: 'ms', resyncs: '', rate: 'ppm' } });

  const S = soundCard();

  // ── a place: an offset, a rate, and the correction it last measured ─────
  const AHEAD = 100, TICK = 25;
  function place(name, hz) {
    const P = { name, hz, skew: 0, ppm: 0, t0: 0, offset: 0, peer: null, clock: null, played: new Map() };
    /** This place's own clock: wrong by `skew`, and gaining `ppm` per million since `t0`. */
    P.raw = () => { const t = epochNow(); return t + P.skew + (t - P.t0) * P.ppm / 1e6; };
    P.now = () => P.raw() + P.offset;
    /** Change the rate from now on, folding what was gained so far into the offset, so the clock does not jump. */
    P.setPpm = (ppm) => { const t = epochNow(); P.skew += (t - P.t0) * P.ppm / 1e6; P.t0 = t; P.ppm = ppm; };
    /** The TRUE moment at which this place's corrected clock reads `T`, its own clock inverted. */
    P.trueAt = (T) => { const r = P.ppm / 1e6; return (T - P.skew - P.offset + P.t0 * r) / (1 + r); };
    P.tick = () => {
      const c = P.clock;
      if (!c || !S.ctx) return;
      const now = P.now();
      for (let k = Math.max(0, Math.ceil((now - c.epoch) / STEP)); c.epoch + k * STEP < now + AHEAD; k++) {
        const key = `${c.epoch}:${k}`;
        if (P.played.has(key)) continue;
        const at = S.audioOf(P.trueAt(c.epoch + k * STEP));
        if (at < S.ctx.currentTime) continue;
        S.click(at, hz);
        P.played.set(key, { at, T: c.epoch + k * STEP });
      }
    };
    return P;
  }
  const here = place('web-1', 880), there = place('web-2', 1320);

  // ── the bays: the anchor leaves web-1 once ──────────────────────────────
  function bayHere() {
    const b = nodeHere.registry.fill(createBay());
    b.addPort({ ...b.port(IN.here), deliver: (e) => onClock(here, e) });
    b.link(CLK, IN.here, [], { site: HERE });
    b.link(CLK, '*:beat:clock-in', [], { site: HERE });
    return b;
  }
  function bayThere() {
    const b = nodeThere.registry.fill(createBay());
    b.addPort({ ...b.port(IN.there), deliver: (e) => onClock(there, e) });
    b.link('*:clock:clock-out', IN.there, [], { site: THERE });
    return b;
  }
  const log = (line, kind) => d.log(line, kind);
  const nodeHere = createBayNode({ room: ROOM, graphs: [G_HERE], bay: bayHere, log });
  const nodeThere = createBayNode({ room: ROOM, graphs: [G_THERE], bay: bayThere, log });
  function onClock(P, e) {
    P.clock = { bpm: Number(e.bpm), epoch: Number(e.epoch) };
    pb.pulse(plain(CLK), plain(P === here ? IN.here : IN.there));
    d.log(`${P.name} heard the anchor: ${e.bpm} bpm from ${new Date(P.clock.epoch).toISOString().slice(11, 23)}`);
  }

  // ── agreeing: a fresh pair of peers, two bursts, the fastest round trip kept ─
  // ⚠️ BOTH ENDS NEW FOR EVERY AGREEMENT, BECAUSE A PEER KEEPS ITS FASTEST SAMPLE
  // FOR EVER. A drifting clock needs a measurement taken now, and a peer that
  // had a faster round trip a minute ago would go on answering with that
  // minute-old offset. One room for all of them since 2026-10-12: this page used
  // a fresh room per agreement while peer.mjs matched a pong by `seq` alone, so a
  // closing peer's pongs ate the new one's answers (the first resync worked, the
  // next never got five samples). A pong now names the peer it answers, and
  // proto/looper/peer-test.mjs holds three peers in one room. The ids carry the
  // agreement's number so a socket still closing is never mistaken for the new one.
  let tag = '', n = 0;
  const run = { resyncs: 0, marks: [], worst: 0, rate0: null, busy: false };
  async function agree() {
    if (run.busy) return false;
    run.busy = true;
    const url = `${DEFAULT_RELAY}/room/${ROOM}-ntp/ws`;
    const k = n++;
    const ref = createPeer({ id: `a-${tag}-${k}`, transport: wsTransport(url), now: epochNow, pingEveryMs: 0 });
    const peer = createPeer({ id: `b-${tag}-${k}`, transport: wsTransport(url), now: there.raw, pingEveryMs: 0 });
    const got = (k) => peer.peers().some((p) => p.id === ref.id && p.samples >= k);
    for (let burst = 1; burst <= 2; burst++) {
      for (let i = 0; i < 300 && !got(5 * burst); i++) await sleep(10);
      if (burst < 2) peer.ping();
    }
    const ok = got(5);
    if (ok) {
      const was = there.offset;
      there.offset = peer.offsetMs();
      const rtt = Math.min(...peer.peers().map((p) => p.rttMs));
      if (first != null) d.log(`web-2 agreed the time again over a ${fmt(rtt)} ms round trip: its correction moved ${fmt(there.offset - was)} ms`);
    } else d.log('web-2 could not measure the time this round', 'warn');
    ref.dispose(); peer.dispose();
    run.busy = false;
    return ok;
  }

  // ── play ─────────────────────────────────────────────────────────────────
  let loop = null, resyncTimer = null, joined = false, busy = false;
  async function join() {
    if (joined || busy) return;
    busy = true;
    await S.open();
    there.skew = Math.round((Math.random() < 0.5 ? -1 : 1) * (100 + Math.random() * 200));
    there.t0 = epochNow(); there.ppm = PPM[ppmPick.get()][1];
    run.resyncs = 0; run.marks = []; run.worst = 0;
    await Promise.all([nodeHere.join(), nodeThere.join()]);
    tag = rand(6);
    d.log(`joined ${ROOM}, web-1 as ${HERE} and web-2 as ${THERE}. web-2's clock is set ${Math.abs(there.skew)} ms ${there.skew > 0 ? 'fast' : 'slow'} and runs ${there.ppm} ppm fast, and is not told`, 'hi');
    for (let i = 0; i < 80 && !bayHere().targets(CLK).find((t) => t.to === IN.there); i++) await sleep(50);
    await agree();
    S.reanchor();
    run.rate0 = { t: epochNow(), raw: there.raw() };
    loop = setInterval(() => { here.tick(); there.tick(); }, TICK);
    const epoch = Math.round(here.now() + 500);
    if (!nodeHere.emit(CLK, { bpm: BPM, epoch }).far.length) d.log('the anchor reached nobody in another place', 'warn');
    joined = true; busy = false;
    armResync();
    btns.setIcon('go', 'stop', 'Stop');
  }
  function armResync() {
    clearInterval(resyncTimer); resyncTimer = null;
    const every = RESYNC[syncPick.get()][1];
    if (!joined || !every) return;
    resyncTimer = setInterval(async () => {
      if (await agree()) { run.resyncs++; run.marks.push(epochNow()); }
    }, every);
  }
  function leave() {
    clearInterval(loop); clearInterval(resyncTimer); loop = resyncTimer = null;
    nodeHere.leave(); nodeThere.leave();
    here.clock = there.clock = null; there.offset = 0;
    S.hush();
    joined = false;
    view.strip.stopLive();
    btns.setIcon('go', 'play', 'Play');
    d.log(`stopped after ${run.resyncs} resyncs`);
  }
  const btns = createButtonGroup({ buttons: [
    { id: 'go', icon: 'play', label: 'Play', title: `room ${ROOM}`, onPress: () => (joined ? leave() : join()) },
  ] });

  // ── the two controls ────────────────────────────────────────────────────
  const PPM = [['0', 0], ['50', 50], ['200', 200], ['1000', 1000]];
  const RESYNC = [['off', 0], ['10 s', 10000], ['60 s', 60000]];
  const ppmPick = createChoice({ label: 'ppm', options: PPM, at: 3, onPick: (v) => {
    if (joined) { there.setPpm(v); run.rate0 = { t: epochNow(), raw: there.raw() }; run.worst = 0; }
    d.log(`web-2's clock now runs ${v} ppm fast`);
  } });
  const syncPick = createChoice({ label: 'resync', options: RESYNC, at: 0, onPick: (v, name) => {
    run.worst = 0; armResync();
    d.log(v ? `web-2 agrees the time again every ${name}` : 'web-2 keeps the time it agreed on Play');
  } });
  const controls = el('div', 'cc-row');
  controls.append(btns.el, ppmPick.el, syncPick.el);

  // ── what it measured ────────────────────────────────────────────────────
  const gapOf = (key) => { const h = here.played.get(key), t = there.played.get(key); return h && t ? (t.at - h.at) * 1000 : null; };
  function gaps() {
    const out = [];
    for (const [k, h] of here.played) { const t = there.played.get(k); if (t && h.T <= epochNow()) out.push({ T: h.T, ms: (t.at - h.at) * 1000 }); }
    return out;
  }
  let first = null;
  const WINDOW = 8000;
  setInterval(() => {
    if (!joined) return;
    const g = gaps();
    if (g.length) {
      const now = g[g.length - 1].ms;
      run.worst = worst([run.worst, now]);
      d.set('drift now', fmt(now));
      d.set('worst', fmt(run.worst));
      const L = view.strip.lanes().find((x) => x.id === 'there');
      if (L) L.subLabel = [`now ${fmt(now)} ms`, `worst ${fmt(run.worst)} ms`];
    }
    d.set('resyncs', run.resyncs);
    // The rate read off the two clocks: what web-2's clock gained per true ms.
    if (run.rate0) {
      const dt = epochNow() - run.rate0.t;
      if (dt > 2000) d.set('rate', Math.round(((there.raw() - run.rate0.raw) - dt) / dt * 1e6));
    }
    if (first == null && here.played.size) first = here.clock.epoch;
    // the strip is LIVE (timeline/strip.mjs `startLive`): its cursor is the write head from the first beat
    if (first != null && joined && !view.strip.live()?.running) view.strip.startLive(epochNow() - first);
    view.strip.invalidate();
  }, 250);

  // ── the timeline: both places' beats and the moments they agreed again ──
  const deck = createDeck({ items: [], range: [0, WINDOW] });
  const shelf = el('div');
  const rowsOf = (P) => () => (first == null ? [] : [...P.played.entries()]
    .filter(([, v]) => v.T <= epochNow())
    .map(([k, v]) => ({ at: v.T - first, id: `${P.name}${k}`, kind: 'beat', payload: { k } })));
  const view = createStripView(shelf, deck, {
    // A LIVE strip: the whole run in view, the cursor at now, dense marks binned.
    size: 'auto', follow: false, gutter: 132, live: { minSpan: WINDOW },
    lanes: [
      { id: 'here', kind: 'beat', label: 'web-1', height: 40, width: 2, as: 'ticks', terse: true, color: '#6f7d94',
        rows: rowsOf(here), describeRow: () => ['web-1', 'the true clock'] },
      { id: 'there', kind: 'beat', label: 'web-2', height: 40, width: 2, as: 'ticks', terse: true, rows: rowsOf(there),
        colorOfRow: (r) => { const g = gapOf(r.payload.k); return g == null ? '#3b424e' : band(g); },
        rankOfRow: (r) => { const g = gapOf(r.payload.k); return g == null ? -1 : Math.abs(g); },
        describeRow: (r) => { const g = gapOf(r.payload.k); return ['web-2', g == null ? 'not played yet' : `${g >= 0 ? '+' : ''}${fmt(g)} ms from web-1`]; } },
      { id: 'sync', kind: 'mark', label: 'resync', height: 24, width: 2, as: 'ticks', terse: true, color: '#c9ced6',
        rows: () => (first == null ? [] : run.marks.map((t, i) => ({ at: t - first, id: `s${i}`, kind: 'mark', payload: {} }))),
        describeRow: () => ['resync', 'web-2 measured the time again'] },
    ],
  });

  // ── names, and the patchbay ─────────────────────────────────────────────
  const { plain, named, hovers } = plainNames(new Map([[HERE, 'web-1'], [THERE, 'web-2']]), ROOM, (id) =>
    id === plain(`${THERE}:beat`) ? "its clock runs at the picked ppm; reached by web-1's * link" : '');
  const picture = (() => {
    const b = createBay();
    for (const g of [G_HERE, G_THERE]) { for (const nd of g.nodes) b.addNode(nd); for (const p of g.ports) b.addPort(p); }
    b.link(CLK, IN.here); b.link(CLK, IN.there);
    return b;
  })();
  const pb = createPatchbay(named(picture), { room: 'drift' });
  hovers(pb.el, 'drift');

  const st = el('style');
  st.textContent = '.cc-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }';
  document.head.append(st);
  d.stack.add(controls, view.surface, pb.el);
  addEventListener('pagehide', () => { if (joined) leave(); S.ctx?.close(); });
  window.__clock = { here, there, run, gaps, ppmPick, syncPick };
  d.ready();
</script>

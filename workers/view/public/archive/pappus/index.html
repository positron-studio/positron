<title>Pappus granulator</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { mount } from '/shell/shell.mjs';
  import { bootScsynth } from '/shell/scsynth.mjs';
  import { allocBuffers, bufferPlan, startPappusSynth, applyAudibleDefaults, setParam, RING_SECONDS, PAPPUS_NODE, GATE0 } from '/shell/pappus.mjs';
  import { createModulator } from '/shell/pappus-mod.mjs';
  import { PATCHES, BUF_SECONDS, MOD_SPECS, MOD_FOLLOWERS, MOD_CMD, MOD_HZ,
    writeDiscrete, basesOf, routesOf, patternOf, createFeatures } from '/shell/radio-gran.mjs';
  import { createGrainRig } from '/granulator/grain-rig.mjs';

  // concepts sampler/050, GRANULATOR, 2026-10-13. Asked (BACKLOG): *"what is good
  // source? perhaps our recorded radios for start? witch patch selector. do we
  // get events for scope? do 2 knobs. what pappus gives us?"*
  //
  // A sampler because a granulator is one: it RECORDS what comes in and plays
  // pieces of it back. Pappus (rig/board/norns/Engine_Pappus.sc, the board's
  // granulator, compiled on the Pi as the TINY rung) runs in this tab's wasm
  // SuperCollider and records its INPUT into a ring. The patches are
  // radio-gran.mjs's twelve, the same ones /videoradio/ tours.
  //
  // Everything that is not Pappus (the sources, the scope, the grain events,
  // the knobs and their glide, the patchbay, Play and the self check) is
  // `/granulator/grain-rig.mjs`, which /granulator/grains/ shares. This page is the
  // engine and its controls. No output scope since 2026-10-13: the patch
  // picker stands alone (*"replace with just a patch selector (no
  // scope/viz/footer)"*).
  // Archived 2026-10-13: the owner chose the light Grain ring as the
  // granulator (*"but we got rid of pappus?!? 060 ???"*), which is
  // /granulator/grains/ again. This was concepts sampler/050 and still works
  // here, on the board's own Pappus definitions at /grains/defs/.
  const d = mount({ name: 'Pappus granulator', what: '', readout: null, index: '/archive/', indexLabel: 'archive' });

  const sentence = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // ── the controls: four knobs, everything else fixed by the patch ─────────
  // Asked 2026-10-13: *"reduce granulator knobs a lot. fix values. patch only
  // changes those"*. After the wet/dry, four knobs that mean the same thing
  // in all twelve patches and that you hear at once:
  //   size     how long each grain is
  //   density  how many grains a second
  //   spray    how far each grain strays from where the read head is
  //   reverb   how much of the sound goes into the room
  // Left out of the knobs on purpose: `scan` (a speed, a place or a time
  // behind, by the patch's mode), the modes, the chord and the figure
  // (choices, not amounts), `sos` (it also decides how much the ring keeps
  // recording), and the colour stages (drive, crush, noise, spectral, echoes),
  // which are what makes one patch that patch. All of those are FIXED: the
  // patch sets them and nothing else does.
  const pct = (v) => `${Math.round(v * 100)}%`;
  const amount = (name, label, min = 0, max = 1, warp = 'lin', fmt = pct) => ({ name, label, kind: 'knob', min, max, warp, fmt });
  const CONTROLS = [
    amount('size', 'size', 0.02, 4, 'exp', (v) => (v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`)),
    amount('rate', 'density', 0.5, 64, 'exp', (v) => `${v < 10 ? v.toFixed(1) : Math.round(v)}/s`),
    amount('spray', 'spray'),
    amount('rverb', 'reverb'),
  ];
  const NAMES = CONTROLS.map((c) => c.name);
  // The fixed values, in the order they are written: the scan mode before
  // the scan and the window, because those mean what the mode says. The
  // chord (`gates` and `pitches`), the chances (`probs`), the figure
  // (`pattern` and `elen`) and the echoes (taps) travel as one value each.
  const FIXED = ['scanmode', 'scan', 'winstart', 'winend', 'lock', 'chord', 'chance', 'figure', 'ephase', 'contour',
    'sos', 'tilt', 'ingain', 'comp', 'spraymode', 'swarm', 'swarmmode', 'strum',
    'swet', 'scycle', 'sfb', 'stilt', 'sxover', 'sdiffuse', 'taps',
    'drive', 'crush', 'crushmode', 'noise', 'noisetype', 'noisedecay', 'noisetone', 'noisedyn', 'wow', 'rtime'];
  const GROUPS = {
    chord: (p) => ({ gates: p.gates, pitches: p.pitches }),
    chance: (p) => p.probs,
    figure: (p) => ({ pattern: p.pattern, elen: p.elen }),
    taps: (p) => ({ taptimes: p.taptimes, tappans: p.tappans, tappitch: p.tappitch }),
  };
  const valueOf = (p, n) => (GROUPS[n] ? GROUPS[n](p) : (p[n] ?? (n === 'winend' ? 1 : 0)));
  const pick = (p, names) => Object.fromEntries(names.map((n) => [n, valueOf(p, n)]));

  // ── Pappus, behind the rig's engine contract ─────────────────────────────
  let eng = null, ctx = null, modulator = null, cur = null, routed = new Set();
  // The write head of Pappus's ring, on the audio clock. `wphase` is a Phasor
  // from 0 at /s_new over `mbuflen` seconds (Engine_Pappus.sc:652), and /n_run 0
  // stops it, so it is the engine's running seconds, kept here across pauses.
  let ranFor = 0, runFrom = null;
  const engSeconds = () => ranFor + (runFrom != null ? ctx.currentTime - runFrom : 0);
  const both = (name, v) => { setParam(eng, `m${name}`, v); setParam(eng, `n${name}`, v); };
  const delayMode = () => cur.scanmode >= 3;
  // How each knob reaches the engine, command for command as radio-gran.mjs's
  // writeDiscrete and writeContinuous write them.
  const viaBoth = (n) => (v) => both(n, v), viaOne = (cmd) => (v) => setParam(eng, cmd, v);
  const WRITE = {
    size: viaBoth('size'), rate: viaBoth('rate'), spray: viaBoth('spray'), swarm: viaBoth('swarm'),
    strum: viaBoth('strum'), sos: viaBoth('sos'), tilt: viaBoth('tilt'), contour: viaBoth('contour'),
    lock: viaBoth('lock'), spraymode: viaBoth('spraymode'), swarmmode: viaBoth('swarmmode'), ephase: viaBoth('ephase'),
    // In a delay mode the knob is a time behind, in seconds of the ring.
    scan: (v) => (delayMode() ? both('delay', v * BUF_SECONDS) : both('scan', v)),
    scanmode: (v) => { both('scanmode', v); WRITE.scan(cur.scan); WRITE.winstart(cur.winstart); WRITE.winend(cur.winend); },
    // A delay mode reads the whole lap whatever the window says (writeContinuous's rule).
    winstart: (v) => both('winstart', delayMode() ? 0 : v),
    winend: (v) => both('winend', delayMode() ? 1 : v),
    ingain: viaOne('ingain'), comp: viaOne('mcomp'), swet: viaOne('swet'), scycle: viaOne('scycle'),
    sfb: viaOne('sfb'), stilt: viaOne('stilt'), sxover: viaOne('stiltxover'), sdiffuse: viaOne('sdiffuse'),
    drive: viaOne('drive'), crush: viaOne('crush'), crushmode: viaOne('crushmode'), noise: viaOne('noise'),
    noisetype: viaOne('noisetype'), noisedecay: viaOne('noisedecay'), noisetone: viaOne('noisetone'),
    noisedyn: viaOne('noisedyn'), wow: viaOne('kwow'), rverb: viaOne('rverb'), rtime: viaOne('rtime'),
    chord: (v) => { setParam(eng, 'gates', v.gates); setParam(eng, 'pitches', v.pitches); },
    chance: (v) => setParam(eng, 'probs', v),
    figure: (v) => { both('elen', v.elen); eng.send('/b_setn', GATE0, 0, 16, ...patternOf({ pattern: v.pattern })); },
    taps: (v) => {
      setParam(eng, 'taptimes', [...v.taptimes, 0, 0, 0, 0]); setParam(eng, 'tappans', [...v.tappans, 0, 0, 0, 0]);
      setParam(eng, 'tappitch', [...v.tappitch, 0, 0, 0, 0]);
    },
  };
  // What the patch's movement (pappus-mod.mjs) is allowed to move: its base
  // follows the knob, and the modulator writes base plus movement.
  const ROUTABLE = new Set(['rate', 'size', 'scan', 'spray', 'swarm', 'strum', 'sos', 'contour', 'wow', 'drive', 'crush', 'noise', 'winstart', 'winend']);

  /** One value into the engine: a moving one's base, or its own command. */
  function write(name, v) {
    if (!eng || !modulator) return;
    const dest = name === 'chance' ? 'probs' : name;
    if (routed.has(dest) && (ROUTABLE.has(dest) || dest === 'probs')) modulator.setBase(dest, v);
    else WRITE[name](v);
  }

  const engine = {
    label: 'Pappus granulator',
    async boot({ ctx: ac, input, grain, log }) {
      ctx = ac;
      const t0 = performance.now();
      eng = await bootScsynth({
        audioContext: ctx, input, log,
        // 🔴 EVERY GRAIN IS AN EVENT FROM THE ENGINE, NOT A GUESS FROM SETTINGS.
        // `SendReply.ar(vtrig * report, '/pgrain', [pos, dur, i, half])`
        // (Engine_Pappus.sc:849) arrives as `['/pgrain', nodeID, replyID, pos,
        // dur, voice, half]`; `pos` is at index 3 (the off by one /grains/ and
        // /archive/radio/ both record). `pos` is a fraction of the SIXTY second ring
        // and the engine reads only its first BUF_SECONDS, so it is rescaled
        // to the window, and the window's write head says how many seconds ago
        // the audio under that grain arrived.
        onReply: (m) => {
          if (m[0] !== '/pgrain') return false;
          const pos = Math.min(1, Math.max(0, m[3] * RING_SECONDS / BUF_SECONDS));
          const head = (engSeconds() / BUF_SECONDS) % 1;
          grain({ pos, ago: ((((head - pos) % 1) + 1) % 1) * BUF_SECONDS, dur: m[4], voice: m[5], half: m[6] });
          return true;
        },
      });
      eng.out.gain.value = 0;
      const T = { moduleMs: Math.round(eng.moduleMs), bootMs: Math.round(eng.bootMs),
        bufferBytes: bufferPlan().reduce((n, [, f, c]) => n + f * c * 4, 0) };
      const ta = performance.now();
      const bufs = await allocBuffers(eng, { log });
      T.allocMs = Math.round(performance.now() - ta);
      const def = await eng.recvDef('/grains/defs/pappus-tiny.scsyndef');
      T.defMs = def.ms; T.defBytes = def.bytes;
      if (!def.ok) throw new Error(`Pappus was not taken: ${def.why}`);
      if (!(await startPappusSynth(eng))) throw new Error('Pappus did not start');
      runFrom = ctx.currentTime; ranFor = 0;
      applyAudibleDefaults(eng, { live: true, bufSeconds: BUF_SECONDS });
      // The constants this rung needs, written once; every patch value after
      // this arrives through a knob.
      writeDiscrete(eng, PATCHES[0], { bufSeconds: BUF_SECONDS });
      T.startMs = Math.round(performance.now() - t0);
      log(`Pappus up ${T.startMs} ms after Play: ${bufs.allocated} buffers, `
        + `${(T.bufferBytes / 1e6).toFixed(1)} MB of them, the ${(def.bytes / 1024).toFixed(0)} KB definition taken in ${def.ms} ms`);
      // The movement: the patches' routes, fed by the source's level and
      // colour, at MOD_HZ, as /videoradio/ runs it.
      const tap = ctx.createAnalyser(); tap.fftSize = 2048; tap.smoothingTimeConstant = 0;
      input.connect(tap);
      const feats = createFeatures(tap, ctx.sampleRate);
      modulator = createModulator({
        now: () => ctx.currentTime,
        send: (name, v) => setParam(eng, MOD_CMD[name] ?? `m${name}`, v),
        specs: MOD_SPECS, followers: MOD_FOLLOWERS,
        warn: (m) => log(`modulation refused: ${m}`, 'warn'),
      });
      setInterval(() => { if (runFrom == null) return; modulator.sense(feats.read()); modulator.tick(); }, 1000 / MOD_HZ);
      return { meter: eng.meter, out: eng.out, timing: T, scsynth: eng };
    },
    // What a patch sets that is not a knob: its routes, the movement the
    // modulator adds. Every value arrives by a knob and its glide.
    land(i, now) {
      const p = PATCHES[i];
      cur = { ...cur, ...pick(p, FIXED), ...now };
      for (const [k, v] of Object.entries(basesOf({ ...p, ...now }))) modulator.setBase(k, v);
      const routes = routesOf(p);
      modulator.setRoutes(routes);
      routed = new Set(routes.map((r) => r.dest));
    },
    knob(name, v) {
      cur = { ...(cur ?? {}), [name]: v };
      write(name, v);
    },
    // Written at once, with no glide: Pappus's own 20 ms `Lag.kr` on every
    // amount (Engine_Pappus.sc, `lagt`) already takes the step off a jump, and
    // the modes, the chord and the figure are choices that only ever step.
    fixed(set) {
      cur = { ...(cur ?? {}), ...set };
      for (const n of FIXED) if (n in set) write(n, set[n]);
    },
    run(on) {
      eng.send('/n_run', PAPPUS_NODE, on ? 1 : 0);
      if (on && runFrom == null) runFrom = ctx.currentTime;
      if (!on && runFrom != null) { ranFor += ctx.currentTime - runFrom; runFrom = null; }
    },
    async read(name) {
      const c = ['size', 'rate', 'spray'].includes(name) ? `m${name}` : (MOD_CMD[name] ?? name);
      const r = await eng.sendAndWait((m) => m[0] === '/n_set' && m[2] === c, 3000, '/s_get', PAPPUS_NODE, c);
      return r ? Number(r[3]) : null;
    },
    // The patch's routes move these round the knob's number (pappus-mod.mjs).
    moving: () => [...routed],
    glitches: () => { try { return eng?.sonic.getMetrics?.()?.glitchCount ?? null; } catch { return null; } },
  };

  const rig = createGrainRig({
    d, engine, controls: CONTROLS, outputScope: false,
    patches: PATCHES.map((p) => ({ name: sentence(p.name), says: p.says, set: pick(p, NAMES), fixed: pick(p, FIXED) })),
  });
  await rig.ready();
</script>

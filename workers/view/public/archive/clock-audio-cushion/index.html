<title>POSITRON Audio cushion</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  // concepts clock/020, CUSHION, 2026-10-12. One idea: sound that crosses a
  // network has to wait in a cushion before it plays, and the size of the
  // cushion trades lag against gaps.
  //
  // clock/010's two places, with sound on the wire instead of notes. `web-1`
  // makes a test tone (a four note arpeggio, so a gap is audible) and cuts it
  // into 20 ms frames of 48 kHz mono, sent as int16 over the relay, one message
  // a frame, paced against the true clock so a late timer sends two at once.
  // `web-2` puts every frame into the kit's `pcm-playout` worklet
  // (proto/jam/playout-worklet.js, the one board.mjs uses), whose floor is the
  // cushion the stepper sets: it waits until that much sound is in hand, then
  // plays; when it runs dry it goes silent (a dropout, counted in the audio
  // thread) and waits for the cushion to fill again.
  // Measured, all on this tab's one clock and one sound card:
  //   - lag: the true time when the worklet's read head reached a sample, less
  //     the true time that sample was made at `web-1`. Read from the worklet's
  //     own counters (`played` plus `trimmed` is the index under the head);
  //   - late frames: a frame whose trip took longer than the fastest trip so far
  //     plus the cushion, which is a frame the cushion could not cover;
  //   - dropouts: the worklet's starve events since the cushion was last set.
  // Changing the cushion re-arms the worklet's floor and starts the counts again.
  //
  // Nothing opens on a visit. Play joins the room and starts the tone.
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBayNode, ROOM_RE } from '/shell/bay-node.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { PLAYOUT_URL } from '/shell/board.mjs';
  import { epochNow } from '/proto/looper/peer.mjs';
  import { rand, sleep, fmt, median, graphOf, soundCard, plainNames } from '/archive/clock-kit.mjs';

  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : `cushion-${rand(6)}`;
  const HERE = `here-${rand(3)}`, THERE = `there-${rand(3)}`;
  const OUT = `${HERE}:tone:audio-out`, IN = `${THERE}:speaker:audio-in`;
  const RATE = 48000, FRAME_MS = 20, FRAME = RATE * FRAME_MS / 1000;
  const CUSHIONS = [20, 40, 60, 100, 150, 200, 300];

  const G_HERE = graphOf(HERE, 'here', [{ id: `${HERE}:tone`, kind: 'engine', label: 'test tone', place: 'browser' }],
    [{ id: OUT, label: 'tone', dir: 'out', medium: 'audio', transports: ['relay'] }]);
  const G_THERE = graphOf(THERE, 'there', [{ id: `${THERE}:speaker`, kind: 'screen', label: 'speakers', place: 'browser' }],
    [{ id: IN, label: 'speakers', dir: 'in', medium: 'audio', transports: ['relay'] }]);

  const d = mount({ name: 'Audio cushion', what: '', index: '/archive/', indexLabel: 'archive',
    // Readouts on top, the log at the foot (positron-concepts).
    joined: false,
    readout: { cushion: 'ms', lag: 'ms', dropouts: '', 'late frames': '' } });

  const S = soundCard({ sampleRate: RATE });

  // ── web-1: the tone, cut into frames, paced against the true clock ──────
  const NOTES = [60, 64, 67, 72], NOTE_S = RATE / 4;      // a note every 250 ms
  const tone = { start: 0, frames: 0, phase: 0, timer: null };
  function frame(n) {
    const f = new Int16Array(FRAME);
    for (let i = 0; i < FRAME; i++) {
      const s = n * FRAME + i, inNote = s % NOTE_S;
      const hz = 440 * 2 ** ((NOTES[Math.floor(s / NOTE_S) % NOTES.length] - 69) / 12);
      tone.phase += 2 * Math.PI * hz / RATE;
      const env = Math.min(1, inNote / 240) * Math.exp(-inNote / (RATE * 0.12));
      f[i] = Math.round(Math.sin(tone.phase) * env * 0.25 * 32767);
    }
    return f;
  }
  const b64 = (i16) => { const u = new Uint8Array(i16.buffer); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  function sendFrames() {
    const owed = Math.floor((epochNow() - tone.start) / FRAME_MS);
    while (tone.frames <= owed) {
      const n = tone.frames++;
      nodeHere.send({ type: 'pcm', n, t: tone.start + n * FRAME_MS, pcm: b64(frame(n)) });
      if (n % 25 === 0) pb.pulse(plain(OUT), plain(IN));
    }
  }

  // ── web-2: every frame into the playout, and what it measured ───────────
  let node = null;
  const rx = { frames: [], fastest: Infinity, late: 0, base: null, stats: null, lags: [], starves: [] };
  function onPcm(m) {
    if (!node) return;
    const arrived = epochNow(), trip = arrived - (m.t + FRAME_MS);   // from the moment its last sample existed
    rx.fastest = Math.min(rx.fastest, trip);
    const late = trip > rx.fastest + cushion;
    if (late) rx.late++;
    rx.frames.push({ T: m.t, trip, late });
    const bin = atob(m.pcm), i16 = new Int16Array(bin.length / 2);
    for (let i = 0; i < i16.length; i++) i16[i] = (bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8)) << 16 >> 16;
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    node.port.postMessage({ pcm: f32 }, [f32.buffer]);
  }
  function onStats(st) {
    rx.stats = st;
    rx.base ??= { underruns: st.underruns };
    if (!st.started || !tone.start) return;
    // The sample under the read head (every sample played or trimmed so far),
    // and the true moment it was made at web-1.
    const made = tone.start + (st.played / 2) / RATE * 1000 + st.trimmedMs;
    rx.lags.push(S.epochOf(st.ct) - made);
    if (rx.lags.length > 12) rx.lags.shift();
  }

  // ── play ─────────────────────────────────────────────────────────────────
  const log = (line, kind) => d.log(line, kind);
  const nodeHere = createBayNode({ room: ROOM, graphs: [G_HERE], bay: () => null, log });
  const nodeThere = createBayNode({ room: ROOM, graphs: [G_THERE], bay: () => null, log,
    onMessage: (m) => { if (m.type === 'pcm') onPcm(m); } });
  let joined = false, busy = false, cushion = 60;
  async function join() {
    if (joined || busy) return;
    busy = true;
    const ctx = await S.open();
    if (!node) {
      await ctx.audioWorklet.addModule(PLAYOUT_URL);
      node = new AudioWorkletNode(ctx, 'pcm-playout', { outputChannelCount: [1] });
      node.connect(ctx.destination);
      node.port.onmessage = (e) => {
        if (e.data.stats) onStats(e.data.stats);
        if (e.data.starve) rx.starves.push(S.epochOf(e.data.starve.ct));
      };
    }
    node.port.postMessage({ cmd: 'reset' });
    node.port.postMessage({ cmd: 'inChannels', n: 1 });
    setCushion(cushion, true);
    await Promise.all([nodeHere.join(), nodeThere.join()]);
    await sleep(300);
    S.reanchor();
    Object.assign(rx, { frames: [], fastest: Infinity, late: 0, base: null, lags: [], starves: [] });
    tone.start = epochNow(); tone.frames = 0; tone.phase = 0;
    first = tone.start;            // the run starts here, and the strip's cursor with it
    view.strip.startLive(0);
    tone.timer = setInterval(sendFrames, 5);
    d.log(`joined ${ROOM}, web-1 as ${HERE} and web-2 as ${THERE}; web-1 sends 50 frames a second of 20 ms each`, 'hi');
    joined = true; busy = false;
    btns.setIcon('go', 'stop', 'Stop');
  }
  function leave() {
    clearInterval(tone.timer); tone.timer = null;
    nodeHere.leave(); nodeThere.leave();
    node?.port.postMessage({ cmd: 'reset' });
    joined = false;
    view.strip.stopLive();
    btns.setIcon('go', 'play', 'Play');
    d.log(`stopped after ${tone.frames} frames, ${rx.late} late and ${dropouts()} dropouts at a ${cushion} ms cushion`);
  }
  const btns = createButtonGroup({ buttons: [
    { id: 'go', icon: 'play', label: 'Play', title: `room ${ROOM}`, onPress: () => (joined ? leave() : join()) },
  ] });

  // ── the cushion ──────────────────────────────────────────────────────────
  const dropouts = () => (rx.stats && rx.base ? rx.stats.underruns - rx.base.underruns : 0);
  function setCushion(ms, quiet = false) {
    cushion = ms;
    node?.port.postMessage({ cmd: 'floor', ms, adaptive: false });
    rx.late = 0; rx.base = null; rx.lags = [];
    step.show(`${ms} ms`, CUSHIONS.indexOf(ms));
    d.set('cushion', ms);
    if (!quiet) d.log(`the cushion is ${ms} ms now, and the counts start again`);
  }
  const at = () => CUSHIONS.indexOf(cushion);
  const step = createStepper({ what: 'cushion', prev: () => setCushion(CUSHIONS[Math.max(0, at() - 1)]),
    next: () => setCushion(CUSHIONS[Math.min(CUSHIONS.length - 1, at() + 1)]),
    pick: { options: CUSHIONS.map((c) => `${c} ms`), at: CUSHIONS.indexOf(cushion), onPick: (i) => setCushion(CUSHIONS[i]) } });
  const controls = el('div', 'cc-row');
  controls.append(btns.el, step.el);

  // ── what it measured ─────────────────────────────────────────────────────
  let first = null;
  const WINDOW = 8000;
  setInterval(() => {
    d.set('cushion', cushion);
    if (!joined) return;
    if (rx.lags.length) d.set('lag', Math.round(median(rx.lags)));
    d.set('dropouts', dropouts());
    d.set('late frames', rx.late);
    const L = view.strip.lanes().find((x) => x.id === 'trip');
    const trips = rx.frames.slice(-100).map((f) => f.trip - rx.fastest);
    if (L && trips.length) L.subLabel = [`median +${fmt(median(trips))} ms`, `worst +${fmt(Math.max(...trips))} ms`];
    view.strip.invalidate();
  }, 250);

  // ── the timeline: the late frames, and every dropout ────────────────────
  // 🔴 A FRAME ON TIME DRAWS NOTHING, 2026-10-12. Every frame was a mark, 50 a
  // second, and the lane was a comb whose one useful fact (which ones were
  // late) was a colour inside it. Asked: *"Do as you suggest"*: the lane holds
  // the late frames only, so it stays empty until something goes wrong, no
  // baseline drawn; the hover says how many came on time this run.
  const onTime = () => rx.frames.reduce((n, f) => n + (f.late ? 0 : 1), 0);
  const deck = createDeck({ items: [], range: [0, WINDOW] });
  const shelf = el('div');
  const view = createStripView(shelf, deck, {
    // A LIVE strip (timeline/strip.mjs `startLive`): the whole run in view from
    // Play, scaling out as it grows, the cursor at now, and marks too close to
    // draw apart binned. Asked 2026-10-12: *"why cursor aint moving? ... we need
    // std behaviour here"*.
    size: 'auto', follow: false, gutter: 132, live: { minSpan: WINDOW },
    lanes: [
      { id: 'trip', kind: 'frame', label: 'late frames', height: 40, width: 1, as: 'ticks', terse: true, color: '#e0908a',
        rows: () => (first == null ? [] : rx.frames.flatMap((f, i) => (f.late ? [{ at: f.T - first, id: `f${i}`, kind: 'frame', payload: f }] : []))),
        rankOfRow: (r) => r.payload.trip,
        describeRow: (r) => [`+${fmt(r.payload.trip - rx.fastest)} ms over the fastest`] },
      { id: 'drop', kind: 'mark', label: 'dropouts', height: 24, width: 2, as: 'ticks', terse: true, color: '#e0908a',
        rows: () => (first == null ? [] : rx.starves.map((t, i) => ({ at: t - first, id: `d${i}`, kind: 'mark', payload: {} }))),
        describeRow: () => ['the cushion ran dry'] },
    ],
    // The frames lane's hover, on a mark, a bin or the empty lane, ends with the
    // frames it does not draw.
    describeHit: (hit, out) => (hit.lane?.id === 'trip' && first != null ? [...out, `${onTime()} on time this run`] : null),
  });

  // ── names, and the patchbay ─────────────────────────────────────────────
  const { plain, named, hovers } = plainNames(new Map([[HERE, 'web-1'], [THERE, 'web-2']]), ROOM, (id) =>
    id === plain(`${THERE}:speaker`) ? 'plays through the pcm-playout worklet, the cushion is its floor' : '');
  const picture = (() => {
    const b = createBay();
    for (const g of [G_HERE, G_THERE]) { for (const nd of g.nodes) b.addNode(nd); for (const p of g.ports) b.addPort(p); }
    b.link(OUT, IN, [], { via: 'relay' });   // the frames ride the relay room, asked for by name (bay.mjs sessionFor)
    return b;
  })();
  const pb = createPatchbay(named(picture), { room: 'cushion', flowing: () => joined });
  hovers(pb.el, 'cushion');

  const st = el('style');
  st.textContent = '.cc-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; }';
  document.head.append(st);
  d.stack.add(controls, view.surface, pb.el);
  addEventListener('pagehide', () => { if (joined) leave(); S.ctx?.close(); });
  window.__clock = { rx, tone, setCushion, dropouts, get cushion() { return cushion; } };
  d.ready();
</script>

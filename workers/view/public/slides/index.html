<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="slides">
<meta property="og:description" content="A talk made of slides that hold running parts of this site, stepped inside a panel that fills the screen when you present.">
<meta property="og:url" content="https://positron.studio/slides/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/slides/deck.css">

<script type="module">
  // The talk itself. The slide engine (render, scale, faces, keys, notes, checks)
  // is /slides/deck.mjs and deck.css, shared with /talk/.
  // See lessons/page-slides.md#slides-1
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createDeck, checkDeck, liveDiagram, livePicture, liveSteps, liveReadout } from '/slides/deck.mjs';

  const d = mount({
    name: 'slides',
    what: 'A talk made of slides that hold running parts of this site, stepped inside a panel that fills the screen when you present.',
    readout: null,
    controls: [],
  });
  guard(d);

  /**
   * The machines as diagram.mjs draws them. createDeck reads its `hues` off this, so
   * a box's `tech` colours its word on every slide; a box's `desc` is slide text
   * under its column, and the diagram draws names only.
   * See lessons/page-slides.md#slides-2
   */
  const MACHINES = {
    nodes: [
      { id: 'br', label: 'Browser', kind: 'here', tech: 'browser', desc: 'one page from the kit',
        children: [
          { id: 'pg', label: 'page', tech: 'browser',
            note: 'Every demo is one HTML page that mounts the shell and the kit, and grades '
                + 'itself when the harness asks.' },
        ] },
      { id: 'cf', label: 'Cloudflare', tech: 'cloudflare', set: true, desc: 'a relay and Stream',
        children: [
          // 1 to 2 ms: PROGRESS.md:3472, the DO hop at +1.0, +1.6 and +0.8 ms over three
          // runs against the runtime's own ping.
          // See lessons/page-slides.md#slides-3
          { id: 'rl', label: 'relay', tech: 'relay',
            note: 'One **Durable Object** per room carries notes from the **page** to the '
                + '**synths** on the **Raspberry Pi**. The hop through it measured 1 to 2 ms.' },
          { id: 'st', label: 'Stream', tech: 'cloudflare',
            note: '**Cloudflare** Stream serves the same picture as **LL-HLS** and as **WHEP**, '
                + 'which is how the two were measured side by side.' },
        ] },
      { id: 'pi', label: 'Raspberry Pi', tech: 'raspberry', desc: 'the Circuit and a sampler',
        children: [
          { id: 'sy', label: 'synths', tech: 'sound',
            note: 'The board plays the **Novation Circuit** and a piano **sampler** and sends their '
                + 'sound back through the **relay**.' },
        ] },
    ],
    links: [
      { from: 'pg', to: 'rl', note: 'Note on and note off as small WebSocket messages.' },
      { from: 'rl', to: 'sy', note: 'The relay hands them to the board, which plays them.' },
    ],
  };

  // ── the talk ──────────────────────────────────────────────────────────────
  // `say` is a two line headline of 18 characters a line; evidence is one of `big`,
  // `list`, `rows`, `stack` or `live`. Every number has its source in a comment.
  // See lessons/page-slides.md#slides-4
  const SLIDES = [
    // ── what this is ──
    // 46 rows and 44 built, from CLAUDE.md's count command over the manifest.
    // See lessons/page-slides.md#slides-5
    { name: 'lab', say: 'Positron is a lab for *live* media', statement: true,
      cap: '44 demos built, of 46 in the manifest', link: '' },
    { name: 'machines', say: '[Cloudflare|Cloudflare] carries the streams',
      live: liveDiagram(MACHINES), cap: 'notes from the page through the relay to the [Pi|Raspberry Pi]', link: 'patchbay' },

    // ── what it measured ──
    // 600 of 600: positron-ui SKILL.md, "The test picture": burn then
    // readBurned, 600/600 exact through three moves of the clock row.
    { name: 'clock', say: 'Latency is read off a burned clock',
      live: livePicture, cap: 'the test picture, live, its clock read 600 of 600', link: 'webrtc' },
    // PROGRESS.md:4712 and :6624, browser to Cloudflare to browser: MoQ p50 26.2, p99
    // 104.8 ms (n=2740); WHEP p50 67.0, p99 84.1 ms (n=17,501). No hue tells them apart.
    // See lessons/page-slides.md#slides-6
    { name: 'transports', say: 'MoQ is quicker, WebRTC steadier',
      rows: { head: ['', 'p50', 'p95', 'p99'],
        body: [['MoQ', '*26.2*', '42.4', '104.8'], ['WHEP', '67.0', '76.9', '*84.1*']], align: 'lrrr' },
      cap: 'ms, frame drawn to frame shown, both through [Cloudflare|Cloudflare]', link: 'moq' },
    // plans/plan.md:54-57, `hls.latency` behind the live edge, two runs, same
    // stream, same configuration: stock 7.60 and 15.41 s, with the seek
    // correction 1.87 and 3.05 s.
    { name: 'llhls', say: 'Stock hls.js parks where it starts',
      stack: [['stock, run A', '7.60', 's'], ['stock, run B', '15.41', 's'],
        ['tuned, run A', '*1.87*', 's'], ['tuned, run B', '*3.05*', 's']],
      cap: 'behind live, one [Cloudflare|Cloudflare] stream, same settings', link: 'llhls' },
    // plans/plan-away-webrtc.md:212-214, one network: key to speakers ~175 ms over the
    // relay, ~48 ms over a WebRTC data channel. Another network is not measured.
    // See lessons/page-slides.md#slides-7
    { name: 'pi', say: 'Direct to the [Pi|Raspberry Pi] skips the relay',
      big: '*48 ms*', cap: 'key to speakers, was 175, one network so far', link: 'away' },
    // research/circuit-archive-2026-09-21.md:253-256: 29 sessions with notes, 3
    // without, so 32; plans/plan-circuit-editor.md:65: 64 patches, all 350 bytes.
    // See lessons/page-slides.md#slides-8
    { name: 'circuit', say: 'The Circuit holds *29* real sessions',
      rows: { body: [['sessions', '32'], ['with notes', '29'], ['patches', '64'], ['bytes each', '350']],
        align: 'lr' },
      cap: 'read from the backup file, no device needed', link: 'circuit' },
    // Live: lateness is measured on this screen as it runs, nothing quoted.
    { name: 'frames', say: 'A step waits for the next frame',
      live: liveSteps, cap: 'ms each step lands behind its own time, here', link: 'time' },
    // HANDOFF.md:133-135, AHEAD on /sync/: a peer 137 ms fast over a 20 ms
    // hop, offset found to 0.00 ms, beats a median 1.8 ms apart (worst 6.9).
    { name: 'clocks', say: 'Two clocks agree after measuring',
      big: '1.8 ms', cap: 'median gap between beats, one peer 137 ms fast', link: 'sync' },

    // ── how it is built ──
    // 167: `ls demo/shell/*.mjs | wc -l`.
    // See lessons/page-slides.md#slides-9
    { name: 'kit', say: 'Every demo uses one kit of parts',
      live: liveReadout, cap: 'a readout from the kit, 167 modules in it', link: 'kit' },
    // positron-verify SKILL.md:29 (radio 48/48, zero bytes from anybody's
    // radio), :70 (tapes 39/39, only the dev server and the stand-in), :90-92
    // (now and flipper together 52/52, only the dev server and the stand-in).
    { name: 'stand-ins', say: 'Stand-ins replace other servers',
      rows: { body: [['radio', '48/48'], ['tapes', '39/39'], ['flipper, now', '52/52']], align: 'lr' },
      cap: 'checks passed, nothing asked of the real server', link: 'tapes' },
    // HANDOFF.md:190 (route-core JS 115/115, C 98/98), :191 (rp2040js
    // emulator, the router, 45 PASS), :180-181 (the Pico 2 W has run nothing).
    { name: 'pico', say: 'The Pico router runs its core in C',
      rows: { body: [['core in JS', '115/115'], ['core in C', '98/98'], ['emulated Pico', '45 pass']],
        align: 'lr' },
      cap: 'the board itself has run nothing yet', link: 'kit/hardware/' },

    // ── what it learned ──
    // positron-streaming SKILL.md:228-230: etv refused its newest ~45 min, etv2 its
    // oldest ~78 min. The 2 h is plans/plan-live-timeline.md:42, 3750 x 1.92 s.
    // See lessons/page-slides.md#slides-10
    { name: 'refusals', say: 'ERR refuses by programme, not age',
      rows: { body: [['etv', 'newest 45 min'], ['etv2', 'oldest 78 min'], ['etvpluss', 'none']], align: 'll' },
      cap: 'refused part of each 2 h window, 13 points', link: 'archive/tv' },
    // positron-verify SKILL.md:78-80: a stand-in serving silence still read
    // 38/38 on /tapes/, a hole found only by breaking the stand-in.
    { name: 'sabotage', say: '*Break* the check first', statement: true,
      cap: '38/38 still green with every recording silent', link: 'tapes' },
    // research/cf-models-speech-to-patch-2026-09-21.md:243-244: llama 3.3 70B patch
    // from a sentence, loose schema 1.6 s, one branch per operation 10.2 to 11.6 s.
    // See lessons/page-slides.md#slides-11
    { name: 'schema', say: 'A loose schema made it faster',
      stack: [['loose', '*1.6*', 's'], ['strict', '10.2', 's']],
      cap: 'Workers AI proposing patch links from a sentence', link: 'patchbay' },

    // ── what is next ──
    // HANDOFF.md:165-167 (flashing the real Pico 2 W, the Formanta click
    // test) and plans/plan-away-webrtc.md:216-217 (another network unmeasured).
    { name: 'next', say: 'Next is untested hardware',
      list: ['flash the Pico 2 W', '[Pi|Raspberry Pi] on another network', 'a drum machine click'],
      cap: 'carried over in the handoff', link: '' },
  ];

  const deck = createDeck(d, { slides: SLIDES, hues: MACHINES });

  if (SELFCHECK) {
    try {
      const { t0 } = await checkDeck(deck, {
        range: [12, 16], kitLive: ['machines', 'clock', 'frames', 'kit'], minLive: 4, hueSlide: 'machines',
      });
      d.log(`checks took ${(performance.now() - t0).toFixed(0)} ms`);
    } catch (e) { d.assert('the checks ran to the end', false, String(e?.stack || e)); }
  }
  d.ready();
</script>
</html>

     with the send controls under it. Page-local until a second page asks a question.

               padding: 14px; display: flex; flex-direction: column; gap: 14px; }

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createPresence, presenceOf } from '/shell/presence.mjs';
  import { createField } from '/shell/field.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView, STRIP_MIN_H } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { burn, readBurnedFrom, FRAME_W, FRAME_H, FIELD, videoHue, PAD } from '/shell/pattern.mjs';
  import { createCard } from '/shell/card.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { openWire } from '/shell/wire.mjs';
  import { whepPlay, stageWhep, STAGE_PUB, STAGE_PUB_STATUS, holdPublisher, waitForWhip, fetchIceServers, readIcePath } from '/shell/live.mjs';
  import { INGEST, openSession, proveReadable } from '/shell/ingest.mjs';
  import { resolveDuration, waitForFirstFrame } from '/shell/media.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { armVideo, recorderMime, createReport } from '/shell/shell.mjs';

  /**
   * The page only receives: Start holds the stage publisher's socket (about 22 s cold),
   * waits for its WHIP leg and subscribes over WHEP. `?selfcheck=1` starts nothing and
   * records locally, skipping R2 (five uploads an hour per address); `?r2=1`/`?r2=0` override.
   * See lessons/page-stage.md#stage-2
   */
  const Q = new URLSearchParams(location.search);
  /**
   * A room private to this load: a fixed name put every visitor in one room with the
   * public. `?room=` shares a room for a real show, and the log prints the whole URL.
   * `stage` is a rendezvous, not an address, so it carries no `room: 'fixed'`.
   * See lessons/page-stage.md#stage-3
   */
  const ROOM = Q.get('room') || `stage-${Math.random().toString(36).slice(2, 8)}`;
  /** The link that puts somebody else's phone in this room. */
  const SHARE = `${location.origin}${location.pathname}?room=${ROOM}`;
  /**
   * One leg, the real one, over WebRTC only. Start holds a Cloudflare live input open,
   * which Stream bills by the minute delivered, and no gate protects it yet.
   * See lessons/page-stage.md#stage-4
   */
  const USE_R2 = Q.get('r2') === '1' || (Q.get('r2') !== '0' && !SELFCHECK);
  /* Two tiers: an ordinary harness run (`selfcheck=1`) starts no show and grades the
     page at rest; `DEMO_DEEP=1 node demo/verify.mjs stage` runs the show. A visitor is
     never `LIGHT`.
     See lessons/page-stage.md#stage-5 */
  const LIGHT = SELFCHECK && !DEEP;

  const q = new URLSearchParams(location.search);
  // Reachable from a check, and from a probe: what the control room sent and
  // where it landed.
  let stageAsk = null;

  /**
   * The test picture is drawn here by `pattern.mjs`, from nobody's server, with a clock
   * and a burned-in pattern `readBurned` can grade. The canvas is an unseen monitor
   * kept for the pixel checks; the film arrives only from the container over WHEP.
   * See lessons/page-stage.md#stage-6
   */
  const TABS = [
    /**
     * One plain sentence per tab saying what it shows and what its press costs.
     * See lessons/page-stage.md#stage-7
     */
    { id: 'audience', label: 'Audience',
      about: 'What a viewer sees, which stays dark until somebody starts the show in the control room.' },
    // Two words in sentence case: `Controlroom` reads as a typo.
    // See lessons/page-stage.md#stage-8
    { id: 'controlroom', label: 'Control room',
      about: 'Start show opens a real paid stream that takes up to half a minute to arrive '
        + 'and is recorded until you press Stop.' },
    /**
     * No archive tab: playing a recording back happens in the control room, where the
     * operator already is when the show ends.
     * See lessons/page-stage.md#stage-9
     */
  ];

  const d = mount({
    name: 'stage',
    // One sentence naming the thing and the tab to open; the diagram carries the
    // transport. Keep it in step with the `one` line in `manifest.mjs`.
    // See lessons/page-stage.md#stage-10
    what: 'A church scene from a 2011 MIMproject performance, broadcast live from '
      + 'the control room tab.',
    /**
     * One button, and it is its own stop. The harness presses `.tbar-x` in order, so
     * control 0 is `Start WebRTC` and may land on a cold container; `startShow` waits.
     * See lessons/page-stage.md#stage-11
     */
    // No controls row: starting a show is a transport verb on the control room's bar,
    // and a page-level row would also show on the Audience tab.
    // See lessons/page-stage.md#stage-12
    controls: [],
    /**
     * No readout: its cells only showed structural constants. The shell hides the box.
     * See lessons/page-stage.md#stage-13
     */
    readout: null,
  });

  /**
   * One source, several panels: one loop draws the master canvas and blits it to each
   * panel's own `<canvas>`, rather than `captureStream()` into several `<video>`s.
   * See lessons/page-stage.md#stage-14
   */
  /**
   * The stage is 16:9, the church scene's own shape (1280x720). The panel box, the
   * empty-state card, the canvas and every pixel check derive from `STAGE_W` and `STAGE_H`.
   * See lessons/page-stage.md#stage-15
   */
  const STAGE_W = FRAME_W;
  const STAGE_H = Math.round(FRAME_W * 9 / 16);
  const master = document.createElement('canvas');
  master.width = STAGE_W; master.height = STAGE_H;
  const mctx = master.getContext('2d', { alpha: false });

  const panels = TABS.map((t, i) => {
    const c = document.createElement('canvas');
    c.width = STAGE_W; c.height = STAGE_H;
    /**
     * Two states: `on air` and `off air`. A badge answers whether the feed is
     * delivering, and a socket merely existing is not a third answer.
     * See lessons/page-stage.md#stage-16
     */
    const pres = createPresence({
      of: '', mode: 'badge', state: 'offline',
      // `presence.mjs` lets a page reword its states; `coming` says `starting`.
      // See lessons/page-stage.md#stage-17
      /**
       * `checking` and `coming` both say `starting`: on this page they are one moment
       * of one action. The states stay distinct because the checks and the log read them.
       * See lessons/page-stage.md#stage-18
       */
      says: { online: 'on air', offline: 'off air', coming: 'starting', checking: 'starting' },
    });
    return {
      id: t.id,
      canvas: c,
      pres,
      ctx: c.getContext('2d', { alpha: false }),
      /**
       * Every panel takes the panel defaults; the centre slot is left empty here.
       * See lessons/page-stage.md#stage-19
       */
      /**
       * The badge's `says` gives the dot a word: the component reserves the widest
       * phrase's width and fades between words, which a label from outside would not.
       * See lessons/page-stage.md#stage-20
       */
      panel: createVideoPanel({
        /**
         * The audience gets no `<video>` until there is a show: an empty player invites an
         * autoplay prompt and, on iPhone, a fullscreen control over nothing.
         * See lessons/page-stage.md#stage-21
         */
        media: t.id === 'audience' ? null : c,
        of: t.label.toLowerCase(),
        /**
         * One footer per panel. `soloFooter` makes a later `glue()` throw, because
         * `createTransportBar(parent, ...)` appends and would stack a second footer.
         * See lessons/page-stage.md#stage-22
         */
        soloFooter: true,
        /**
         * The box takes the shape too: the canvas is `object-fit: contain` inside it, so a
         * mismatched box letterboxes the picture where the page cannot measure it.
         * See lessons/page-stage.md#stage-23
         */
        aspect: `${STAGE_W} / ${STAGE_H}`,
        // Every panel carries the presence badge.
        // See lessons/page-stage.md#stage-24
        left: pres.el,
        /**
         * Every screen goes full and keeps its footer, so the live badge stays visible:
         * the audience keeps it up (`footer`), the control room shows it on move (`hover`).
         * See lessons/page-stage.md#stage-25
         */
        fullMode: t.id === 'controlroom' ? 'hover' : 'footer',
        /**
         * The ping and the route it took (`direct` or `relay`), because a ping through
         * the TURN relay is not comparable to a direct one. Hidden until a cell is written.
         * See lessons/page-stage.md#stage-26
         */
        values: [
          // `ping`, not `network ping`: at 360 px the longer label overflowed by 8 px.
          // See lessons/page-stage.md#stage-27
          { key: 'rtt', label: 'ping', reserve: 6 },
          { key: 'path', label: '', reserve: 6 },
        ],
      }),
    };
  });

  /**
   * Is a picture arriving now: driven by `requestVideoFrameCallback`, never by the
   * press. `stalled` is `PIC_STALL_MS` without a frame, ruled by `presenceOf`
   * (`node demo/shell/presence-test.mjs`). Hidden when there is nothing to receive.
   * See lessons/page-stage.md#stage-28
   */
  const PIC_STALL_MS = 2000;
  /** How long a start may say `starting` before it is called nothing. Longer
   *  than the publisher wait (60 s) plus the first frame wait (12 s). */
  const PIC_START_MS = 90000;
  const PIC_SAYS = { unknown: 'not receiving', coming: 'starting', checking: 'starting',
    online: 'receiving', offline: 'stalled' };
  const PIC_CAN = ['coming', 'online', 'offline'];
  /** The rule, as a pure function of three times, so a check can feed it fixtures. */
  const pictureOf = ({ now, lastFrameAt = null, startedAt = null }) => presenceOf({
    now, everyMs: PIC_STALL_MS, misses: 1, lastSeenAt: lastFrameAt,
    comingSince: startedAt, comingMs: PIC_START_MS, since: null,
  });
  // The stall is logged once each way, off the first tag only: every tag is
  // fed the same frames, so a second line would be the same fact twice.
  let picWas = 'unknown';
  const picLog = (st) => {
    if (st === 'offline' && picWas === 'online') {
      d.log(`the picture stalled: no frame for ${PIC_STALL_MS / 1000} s`, 'warn');
    } else if (st === 'online' && picWas === 'offline') {
      d.log('the picture is moving again', 'hi');
    }
    picWas = st;
  };
  for (const p of panels) {
    if (!p.pres) continue;
    const first = !panels.some((x) => x.picTag);
    p.picTag = createPresence({
      mode: 'badge', state: 'unknown', says: PIC_SAYS, can: PIC_CAN,
      onChange: (st) => {
        p.panel.slots.tag.hidden = st === 'unknown';
        if (first) picLog(st);
      },
    });
    p.panel.slots.tag.append(p.picTag.el);
    p.panel.slots.tag.hidden = true;
  }
  const picTags = () => panels.map((p) => p.picTag).filter(Boolean);

  /**
   * `createTabs` builds its own panels and hands them back; the page fills them.
   * See lessons/page-stage.md#stage-29
   */
  const byId = new Map(panels.map((p) => [p.id, p]));
  /**
   * The audience tab shows no log: it is the surface other people look at. There is
   * one log, the shell's. The first `go()` is quiet, so the initial state is applied
   * by hand below.
   * See lessons/page-stage.md#stage-30
   */
  const LOG_TABS = ['controlroom'];
  /**
   * Hide the log's `.pos-glue.pos-report` box too, or the empty box paints a 2 px line
   * under the picture. The kit does not yet hide a glue whose children are all hidden.
   * See lessons/page-stage.md#stage-31
   */
  const logFor = (id) => {
    if (!d.logEl) return;
    const off = !LOG_TABS.includes(id);
    d.logEl.hidden = off;
    const box = d.logEl.closest('.pos-report');
    if (box) box.hidden = off;
  };

  /**
   * A strip in a hidden panel has zero width, so its fit is wrong; the fit is
   * re-applied when the panel is shown. `refit` is filled in after the strips are built.
   * See lessons/page-stage.md#stage-32
   */
  let refit = () => {};
  const tabs = createTabs({
    tabs: TABS.map(({ id, label }) => ({ id, label })),
    /**
     * The live `<video>` follows the tab: one element moved, not one player per tab,
     * since Stream bills per minute delivered. `appendChild` keeps it playing.
     * See lessons/page-stage.md#stage-33
     */
    onPick: (id) => { showAbout(id); logFor(id); refit(id); showPictureOn(id); },
  });
  logFor(tabs.at());
  /**
   * Each tab's sentence in one shared grid cell (the `tab-page.mjs` markup), so the
   * picture sits at the same height on every tab. This page keeps `tabs.mjs`.
   * See lessons/page-stage.md#stage-34
   */
  const aboutBox = el('div', 'pos-tabs-about');
  const abouts = new Map(TABS.map((t) => {
    const p = el('p', 'pos-tabs-about-t', t.about);
    aboutBox.append(p);
    return [t.id, p];
  }));
  tabs.el.insertBefore(aboutBox, tabs.panels);
  const showAbout = (id) => {
    for (const [k, p] of abouts) {
      p.classList.toggle('on', k === id);
      p.setAttribute('aria-hidden', String(k !== id));
    }
  };
  showAbout(tabs.at());
  for (const p of panels) tabs.panel(p.id).append(p.panel.el);
  d.stack.add(tabs.el);

  // The show: `plans/plan-stage-live.md` §7. Out of scope here (§8): a second
  // source, a switch, long shows, seekable playback without download.
  // See lessons/page-stage.md#stage-35

  const aud = byId.get('audience');
  const ctrl = byId.get('controlroom');

  /**
   * No waiting card. The audience is shown no `<video>` before there is anything in
   * one, and the presence badge says `off air`.
   * See lessons/page-stage.md#stage-36
   */

  /** The audience's `<video>`, created at start and never before. */
  let audVideo = null;

  /**
   * No background picture of this page's own: the container plays the film and this
   * page receives it over WHEP.
   * See lessons/page-stage.md#stage-37
   */

  /**
   * One origin for every mark: the recorder's first data (plan §5.1). Marks use the
   * control room's receive time, never the answering device's clock.
   * See lessons/page-stage.md#stage-38
   */
  let T0 = null;                       // performance.now() at the recorder's first data
  const sinceT0 = () => (T0 == null ? null : Math.round(performance.now() - T0));

  let live = null;                     // { pub, sub, stop() } once started
  /**
   * Relay servers are asked for on the press, never on load. `iceLoadAsks()` reads
   * resource timing, so it counts every request to the relay route.
   * See lessons/page-stage.md#stage-39
   */
  let ice = null, iceAsks = 0, pressAt = null, icePath = null, pathTimer = null;
  const iceLoadAsks = () => performance.getEntriesByType('resource')
    .filter((e) => /\/ice(\?|$)/.test(e.name) && (pressAt == null || e.startTime < pressAt)).length;
  const pathPanels = () => panels;
  function setPathCells(rtt, path) {
    for (const p of pathPanels()) {
      p.panel.values.set('rtt', rtt);
      p.panel.values.set('path', path);
    }
  }
  async function readPath() {
    const pc = live?.sub?.pc;
    if (!pc) return;
    const ip = await readIcePath(pc);
    if (pc !== live?.sub?.pc || phase === 'stopped') return;
    if (ip.path && ip.path !== icePath?.path) {
      d.log(ip.path === 'relay'
        ? `the picture comes through the relay, over ${ip.relayProtocol || ip.protocol}`
        : `the picture comes direct, ${ip.local} to ${ip.remote} over ${ip.protocol}`, 'hi');
    }
    icePath = ip;
    setPathCells(ip.rttMs == null ? '' : `${Math.round(ip.rttMs)} ms`, ip.path || '');
  }
  function stopPath() {
    clearInterval(pathTimer); pathTimer = null;
    icePath = null;
    setPathCells('', '');
  }
  let rec = null;                      // the MediaRecorder
  const chunks = [];
  const QUESTIONS = [];                // { at, title, options }
  let recordedMs = null;               // the real duration, once resolved
  let stored = null;                   // what the upload gave back: { url, key, session, bytes }
  let landed = null;                   // the HEAD proof, displayed rather than only kept
  let recSource = 'received';          // 'received' or 'canvas', and it is DISPLAYED
  let recTrack = null;                 // the exact track object the recorder holds
  let askedBps = null;                 // the rate the recorder SAYS it is using

  /** Where the show has got to, as one word the whole page reads. */
  let phase = 'before';                // before · live · stopped

  /**
   * The shimmer on a transport button while its leg comes up: an attribute the
   * stylesheet styles, with `aria-busy` beside it for screen readers.
   * See lessons/page-stage.md#stage-40
   */
  function pendTransport(id, on) {
    const b = showBar?.extra(id);
    if (!b) return;
    if (on) { b.dataset.pending = '1'; b.setAttribute('aria-busy', 'true'); }
    else { delete b.dataset.pending; b.removeAttribute('aria-busy'); }
  }

  function setBadges(state) {
    for (const p of panels) p.pres?.set(state);
  }

  /**
   * The picture tag's verbs: `pictureStart` at the press, `pictureWatch` on the frame
   * element, `pictureReset` when done. `follow()` ticks every 500 ms, so a stall shows
   * 2.0 to 2.5 s after the last frame.
   * See lessons/page-stage.md#stage-41
   */
  const pic = { frames: 0, how: null, video: null, off: null, lastAt: null };
  function pictureStart() {
    pictureReset();
    for (const t of picTags()) {
      t.follow({ everyMs: PIC_STALL_MS, misses: 1, since: null, comingMs: PIC_START_MS });
      t.coming(true);
    }
  }
  function pictureWatch(v) {
    pic.off?.();
    pic.video = v;
    let on = true;
    const frame = () => {
      pic.frames++;
      pic.lastAt = Date.now();
      for (const t of picTags()) t.seen(pic.lastAt);
    };
    if (typeof v.requestVideoFrameCallback === 'function') {
      pic.how = 'requestVideoFrameCallback';
      const tick = () => { if (!on) return; frame(); v.requestVideoFrameCallback(tick); };
      v.requestVideoFrameCallback(tick);
      pic.off = () => { on = false; };
    } else {
      // Without it the clock is the element's, which advances only while playing.
      // See lessons/page-stage.md#stage-42
      pic.how = 'currentTime';
      let t = -1;
      const id = setInterval(() => {
        if (v.readyState >= 2 && v.currentTime !== t) { t = v.currentTime; frame(); }
      }, 250);
      pic.off = () => { on = false; clearInterval(id); };
    }
  }
  function pictureReset() {
    pic.off?.(); pic.off = null; pic.video = null; pic.lastAt = null; pic.frames = 0;
    for (const t of picTags()) t.stop().set('unknown');
  }

  /**
   * Put the one live `<video>` in the panel on screen. A panel holding a recording is
   * left alone, so scrubbing stays visible.
   * See lessons/page-stage.md#stage-43
   */
  /**
   * Which tab is on screen: `tabs.mjs` has no accessor, so read `aria-selected`,
   * which is right even after the first quiet `go()`.
   * See lessons/page-stage.md#stage-44
   */
  function showingTab() {
    const b = [...(tabs.buttons || [])].find((x) => x.getAttribute('aria-selected') === 'true');
    const label = (b?.textContent || '').trim().toLowerCase();
    return TABS.find((t) => t.label.toLowerCase() === label)?.id || 'controlroom';
  }

  /**
   * Swap a panel's picture and keep its own parts: the caption slot lives inside the
   * stage, so `textContent = ''` would detach it. `video-panel.mjs` has no replace yet.
   * See lessons/page-stage.md#stage-45
   */
  function setPicture(panel, node) {
    const keep = (c) => c === panel.slots.caption || c === panel.slots.tag
      || (c.nodeType === 1 && c.classList.contains('pos-fsx'));
    for (const c of [...panel.stage.childNodes]) if (!keep(c)) c.remove();
    if (node) panel.stage.insertBefore(node, panel.slots.caption);
  }
  /** Is a panel's caption slot still on its picture, rather than detached. */
  const captionOn = (panel) => panel.slots.caption.isConnected
    && panel.slots.caption.parentElement === panel.stage;
  /** The picture in a panel's stage, which is everything but the panel's own parts. */
  const pictureIn = (panel) => [...panel.stage.children].filter((c) => c !== panel.slots.caption
    && c !== panel.slots.tag && !c.classList.contains('pos-fsx'));

  function showPictureOn(id) {
    if (!audVideo) return;
    /**
     * Not over a recording: the archive plays in the control room panel, so re-appending
     * a dead live element here would cover the recording and break `Play recording`.
     * See lessons/page-stage.md#stage-46
     */
    if (archiveMedia) return;
    const p = byId.get(id);
    if (!p || !p.panel?.stage) return;
    if (audVideo.parentElement === p.panel.stage) return;
    setPicture(p.panel, audVideo);
  }

  // The relay: a question is rendered by the message arriving (the relay echoes to
  // the sender). `openWire`, because it tells a full room from a dead relay.
  // See lessons/page-stage.md#stage-47
  const wire = openWire(ROOM, {
    onMessage: (m) => onWire(m),
    /**
     * Print the whole URL, and only for a room invented here: a `?room=` visitor has it.
     * See lessons/page-stage.md#stage-48
     */
    onOpen: () => {
      d.log(`in room ${ROOM}`, 'hi');
      if (!Q.get('room')) d.log(`this room is this tab's alone, so an audience on their own phones needs ${SHARE}`);
      flush();
    },
    onClose: () => { if (phase !== 'stopped') setBadges('offline'); },
  });

  /**
   * `wire.send` silently drops a message before the socket is open, so sends queue
   * here. The queue is bounded and drops the oldest.
   * See lessons/page-stage.md#stage-49
   */
  const outbox = [];
  const OUTBOX_MAX = 32;
  function flush() {
    while (outbox.length && wire.state() === 1) wire.send(outbox.shift());
  }
  function sendSoon(msg) {
    if (wire.state() === 1) { flush(); return wire.send(msg); }
    outbox.push(msg);
    while (outbox.length > OUTBOX_MAX) outbox.shift();
    return null;
  }

  /**
   * The relay keeps no backlog, so the control room repeats its state every 2 s
   * (about 0.5 msg/s of a 1000/s budget) and a late joiner is right within 2 s.
   * `workers/cues` is token-gated; polling WHEP costs a request per page.
   * See lessons/page-stage.md#stage-50
   */
  const HEARTBEAT_MS = 2000;
  let beat = 0;
  function sayState() {
    beat++;
    /**
     * `atMs`, never `at`: `at` is an envelope field and `wire.mjs` throws on it.
     * See lessons/page-stage.md#stage-51
     */
    sendSoon({ type: 'show.state', phase, asked, atMs: sinceT0() });
  }
  setInterval(sayState, HEARTBEAT_MS);

  function onWire(m) {
    const msg = m && m.msg;
    if (!msg || !msg.type) return;
    if (msg.type === 'show.state') {
      // Somebody being in the control room is not a show, so the badge stays
      // `off air` until frames are actually going out. See the two-state note
      // where the badge is built.
      if (msg.phase === 'live' && phase === 'before') setBadges('online');
      if (msg.asked && !asked) render(msg.asked.title, msg.asked.options);
      return;
    }
    if (msg.type === 'show.ask') { render(msg.title, msg.options); return; }
    if (msg.type === 'show.answer') {
      /**
       * The control room's receive time, not the sender's stamp. An answer before the
       * recorder starts is recorded at 0, not dropped.
       * See lessons/page-stage.md#stage-52
       */
      ANSWERS.push({ at: sinceT0() ?? 0, pick: msg.pick });
      relane();
      d.log(`somebody in the audience chose ${msg.pick}`);
    }
  }

  /**
   * The control room asks the audience something, e.g. `Meaning of life [Be | Not to be]`.
   * It lands in the panel's centre slot, as a `createChoice`.
   * See lessons/page-stage.md#stage-53
   */
  /**
   * The archive is a recording, so nothing in it moves by itself: its picture follows
   * the playhead and the answers appear in lanes as marks.
   * See lessons/page-stage.md#stage-54
   */
  const SHOW_MS = 3 * 60 * 1000;
  /**
   * The window the archive opens on and how far out a reader may zoom: four windows,
   * or the whole recording if longer. Unbounded zoom out let a recording shrink to nothing.
   * See lessons/page-stage.md#stage-55
   */
  /**
   * 30 s: the zoom level that reads well on the strip.
   * See lessons/page-stage.md#stage-56
   */
  const ARCHIVE_WINDOW_MS = 30 * 1000;
  const ZOOM_OUT = 4;
  /**
   * One expression, because the check reads the same bound.
   * See lessons/page-stage.md#stage-57
   */
  const maxSpanMs = () => Math.max(ARCHIVE_WINDOW_MS * ZOOM_OUT, (recordedMs ?? SHOW_MS) * 1.05);
  const archive = byId.get('controlroom');
  /**
   * The archive's bar and strip are built off-page: `createTransportBar` and
   * `createStripView` append to the parent given. They exist because `archiveCommand`
   * and the archive deck are what Play recording drives and the checks read.
   * See lessons/page-stage.md#stage-58
   */
  const offstage = document.createElement('div');
  const archiveDeck = createDeck({
    range: [0, SHOW_MS],
    // One item and one adapter, so the bar has a kind to read rates off. The
    // adapter plays nothing: what it exists to say is that this recording can be
    // played at these speeds.
    items: [{ at: 0, kind: 'show', id: 'show', payload: {} }],
    // One rate, so the bar draws no rate row.
    // See lessons/page-stage.md#stage-59
    adapters: { show: { caps: { rates: [1] }, actuate: () => {} } },
  });

  /**
   * See lessons/page-stage.md#stage-60
   */
  /**
   * The answers are real, none until somebody presses one, timed from page load.
   * One lane per option, added as questions are asked, in the order offered.
   * See lessons/page-stage.md#stage-61
   */
  const showStart = performance.now();
  /**
   * The recording's burned clock is the wall clock it was made at, not the playhead.
   * See lessons/page-stage.md#stage-62
   */
  const showWallStart = Date.now();
  const ANSWERS = [];
  const OPTIONS = [];

  /**
   * The bar's rates come from the intersection of every `caps.rates` the deck's
   * kinds declare, which is why this deck names an adapter that plays nothing.
   * See lessons/page-stage.md#stage-63
   */
  /**
   * No slider and no clock: the strip below is the position. The option is `time`.
   * See lessons/page-stage.md#stage-64
   */
  /**
   * Play only: `loop: false` is the bar's option, and there are no rates because the
   * deck's adapter declares one. A `rates: false` option would duplicate that fact.
   * See lessons/page-stage.md#stage-65
   */
  /**
   * Media is the master: `mediaMaster` bends the playhead onto `currentTime`, so a seek
   * must move the element (a deck seek on a paused element does nothing). Both the bar
   * and the strip go through this; before a recording the deck is the only clock.
   * See lessons/page-stage.md#stage-66
   */
  let archiveMedia = null;
  let archiveMaster = null;       // the mediaMaster, so a check can read its counters
  let roomMaster = null;          // the same element driving the control room's visible deck
  let archiveUrl = null;          // the blob URL the archive is playing, so a new run can revoke it
  const archiveCommand = {
    play: () => (archiveMedia ? archiveMedia.play().catch(() => {}) : archiveDeck.play()),
    pause: () => (archiveMedia ? archiveMedia.pause() : archiveDeck.pause()),
    seek: (ms) => {
      if (archiveMedia) archiveMedia.currentTime = ms / 1000;
      else archiveDeck.seek(ms);
    },
  };

  const bar = createTransportBar(offstage, archiveDeck, {
    live: false, scrub: false, absolute: false, time: false, loop: false,
    command: archiveCommand,
    /**
     * Play recording is disabled until there is a recording. The harness cannot press a
     * disabled control, so playback checks drive `archiveCommand`; only the refusal
     * and the offer are asserted on the button.
     * See lessons/page-stage.md#stage-67
     */
    // Not on the page: it must not hold `__demo.transport`. It owns the archive
    // deck's command, which Play recording drives.
    // See lessons/page-stage.md#stage-68
    publish: false,
  });

  const VIDEO_LANE = {
      /**
       * The top lane is the recording itself, one span that the marks are positions in.
       * See lessons/page-stage.md#stage-69
       */
    id: 'video', kind: 'video', label: 'video', height: 30, as: 'spans',
    color: '#6f7d94', barPad: 4,
    // Nominal length until a show is recorded. `recordedMs` is read off the element:
    // a MediaRecorder file's header carries no duration.
    // See lessons/page-stage.md#stage-70
    rows: () => [{ at: 0, id: 'show', kind: 'video',
      payload: { durMs: recordedMs ?? SHOW_MS } }],
    labelOf: () => 'the show',
    describeRow: () => ['the recording', `${Math.round(SHOW_MS / 1000)} seconds`],
  };
      // Every answer is its own mark, which is what was asked for: a count would
      // say how many and never when, and when is the whole reason for a lane.
  const laneFor = (opt) => ({
    id: `opt-${opt}`, kind: 'answer', label: opt, height: 26, as: 'ticks',
    width: 2, color: '#ffd400', terse: true,
    rows: () => ANSWERS.filter((a) => a.pick === opt)
      .map((a, i) => ({ at: a.at, id: `${opt}-${i}`, kind: 'answer', payload: a })),
    describeRow: (r) => [r.payload?.pick || '', `${(r.at / 1000).toFixed(1)}s`],
  });

  /**
   * A minimum height for the timeline (150 px), not a fixed one: answer lanes grow
   * past it, and empty space below the last lane is fine.
   * See lessons/page-stage.md#stage-71
   */
  const strip = createStripView(offstage, archiveDeck, {
    size: 'auto', gutter: 110, lanes: [VIDEO_LANE], minHeight: STRIP_MIN_H,
    onSeek: (ms) => archiveCommand.seek(ms),
    // A FUNCTION, not a number: the widest useful view changes the moment a
    // recording resolves a real length, and a constant read once at
    // construction would bound the archive by the nominal show it replaced.
    maxSpan: () => maxSpanMs(),
  });
  // It opens on the window rather than on the deck's range, which `fit()` would
  // otherwise give it: three minutes of nominal show before anything has been
  // recorded, where a question mark is a pixel.
  strip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
  // The count is kept here because the strip reports no lane list of its own,
  // and a check that samples between lanes has to be able to say it HAD lanes.
  let laneCount = 1;
  /**
   * Lane 2: when each question was sent and how long it stood, as a second `spans` lane.
   * The last one gets no `durMs`, so `spansOf` runs it open and the edge is feathered.
   * Its own colour, and `terse: false` so the question's words are the label.
   * See lessons/page-stage.md#stage-72
   */
  const QUESTION_LANE = {
    id: 'asked', kind: 'asked', label: 'asked', height: 26, as: 'spans',
    color: '#7ea9c9', barPad: 4, terse: false,
    rows: () => QUESTIONS.map((q, i) => ({
      at: q.at, id: `q-${i}`, kind: 'asked',
      payload: { title: q.title, durMs: QUESTIONS[i + 1] ? QUESTIONS[i + 1].at - q.at : undefined },
    })),
    labelOf: (r) => r.payload?.title || 'a question',
    describeRow: (r) => [r.payload?.title || 'a question',
      r.payload?.durMs == null ? 'never overridden' : `stood ${(r.payload.durMs / 1000).toFixed(1)}s`],
  };

  /**
   * Both strips get the lanes, rebuilt rather than shared between two renderers.
   * See lessons/page-stage.md#stage-73
   */
  const laneList = () => [{ ...VIDEO_LANE }, { ...QUESTION_LANE }, ...OPTIONS.map(laneFor)];
  /**
   * The control room's own top lane: a span from zero to the write head, appearing
   * when a show starts. `VIDEO_LANE`'s nominal full-length bar would claim a file
   * nothing wrote.
   * See lessons/page-stage.md#stage-74
   */
  const SHOW_LANE = () => ({
    id: 'show', kind: 'video', label: 'show', height: 30, as: 'spans',
    color: '#6f7d94', barPad: 4,
    rows: () => (T0 == null ? [] : [{
      at: 0, id: 'live', kind: 'video',
      payload: { title: phase === 'live' ? 'on air' : 'the show', durMs: sinceT0() },
    }]),
    labelOf: () => (phase === 'live' ? 'on air' : 'the show'),
    describeRow: (r) => ['the show',
      r.payload?.durMs == null ? 'not started' : `${(r.payload.durMs / 1000).toFixed(1)}s so far`],
  });

  const relane = () => {
    const list = laneList();
    laneCount = list.length;
    strip.strip.setLanes(list);
    /**
     * The control room gets its own top lane, then only lanes with something in them:
     * the question lane and its option lanes arrive with the first question.
     * See lessons/page-stage.md#stage-75
     */
    const roomLanes = [SHOW_LANE()];
    if (QUESTIONS.length) {
      roomLanes.push({ ...QUESTION_LANE }, ...OPTIONS.map(laneFor));
    }
    roomStrip?.strip.setLanes(roomLanes);
    // Whatever changed the lanes may have changed whether there is anything
    // to clear, so the one place that rebuilds them repaints the control too.
    if (typeof paintClear === 'function') paintClear();
  };

  /**
   * Follow tracks the newest fact on the strip: the write head during a show
   * (`armWall(0)` makes `wallPos()` it), the playhead during playback.
   * See lessons/page-stage.md#stage-76
   */
  function followWriteHead() {
    const st = strip.strip;
    st.armWall(0);
    st.setFollowTarget(() => st.wallPos());
    st.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    st.setFollow(true);
  }
  /**
   * After the show, fit the whole recording. Follow is not re-engaged, so a reader
   * who dragged the strip stays where they dragged it.
   * See lessons/page-stage.md#stage-77
   */
  function followPlayhead() {
    const st = strip.strip;
    st.setFollowTarget(null);
    st.disarmWall();
    st.fit(0, recordedMs ?? SHOW_MS);
  }

  /**
   * The bar and the strip drive one position, so `createGlue` makes them one box with
   * a 1 px seam, in their existing order.
   * See lessons/page-stage.md#stage-78
   */

  /**
   * The question goes to the audience and back to the control room, so the operator
   * sees it as the audience does. Two instances from one description.
   * See lessons/page-stage.md#stage-79
   */
  const SHOWN_ON = ['audience', 'controlroom'];
  let asked = null;

  /**
   * Send it; `render()` draws it when the relay echoes it back, so the control room's
   * own question and others' share one path. `at` is the control room's send time.
   * See lessons/page-stage.md#stage-80
   */
  function ask(title, options) {
    QUESTIONS.push({ at: sinceT0() ?? 0, title, options: [...options] });
    sendSoon({ type: 'show.ask', title, options });
    d.log(`asked the audience: ${title}`, 'hi');
  }

  function render(title, options) {
    for (const id of SHOWN_ON) {
      const choice = createChoice({
        label: title,
        options: options.map((o) => [o, o]),
        // -1 leaves every option unpressed; `createChoice` would otherwise open on index 0.
        // See lessons/page-stage.md#stage-81
        at: -1,
        // What a viewer picks is not recorded yet; this is the seam.
        // See lessons/page-stage.md#stage-82
        onPick: (_v, name) => {
          // Only the audience answers. The control room's copy is disabled
          // below, so this cannot fire from there, and the guard says so anyway.
          if (id !== 'audience') return;
          // Sent, not recorded here: the control room records it on arrival, on one clock.
          // See lessons/page-stage.md#stage-83
          sendSoon({ type: 'show.answer', pick: name });
        },
      });
      /**
       * The control room sees the question and cannot answer it.
       * See lessons/page-stage.md#stage-84
       */
      if (id !== 'audience') choice.disabled(true);
      show(byId.get(id).panel, choice.el);
    }
    // A question replaces the one before; clearing is undecided. A new question's
    // options get empty lanes, so the archive shows what was asked.
    // See lessons/page-stage.md#stage-85
    for (const o of options) if (!OPTIONS.includes(o)) OPTIONS.push(o);
    relane();
    asked = { title, options };
  }

  /**
   * Put a question in a panel. It fades in and rises 8 px, using opacity and
   * `transform` only, which are composited and never resize the box.
   * See lessons/page-stage.md#stage-86
   */
  function show(panel, node) {
    // On the picture, where subtitles live. `.pos-vp-cap` carries a scrim plus a solid
    // plate (15.77:1 worst case); `--fg` straight on a white frame is 1.25:1.
    // See lessons/page-stage.md#stage-87
    const slot = panel.slots.caption;
    slot.textContent = '';
    slot.append(node);
    node.style.opacity = '0';
    node.style.transform = 'translateY(8px)';
    requestAnimationFrame(() => {
      node.style.transition = 'opacity 260ms ease, transform 260ms ease';
      node.style.opacity = '1';
      node.style.transform = 'none';
    });
  }

  // ── the control room's form ───────────────────────────────────────────────
  const room = tabs.panel('controlroom');

  /**
   * Start and stop are a kit transport bar. `live: true`, `scrub: false` and
   * `loop: false`: a live show has no end, position to drag, or passage to repeat.
   * `showDeck` really runs while on air, so the playhead is the show's length.
   * See lessons/page-stage.md#stage-88
   */
  const showDeck = createDeck({
    range: [0, SHOW_MS],
    items: [{ at: 0, kind: 'show', id: 'show', payload: {} }],
    // One rate, so the bar draws no rate row: a live show has one speed.
    adapters: { show: { caps: { rates: [1] }, actuate: () => {} } },
  });
  /**
   * `right` takes DOM nodes (`right[0].dataset.end` is set); `extras` takes
   * `{id,label,onClick}`. Disabled until there is a recording.
   * See lessons/page-stage.md#stage-89
   */
  /**
   * The archive bar's own toggle, lifted into this bar's right slot, so its glyph is
   * `archiveDeck`'s state and its press goes through `archiveCommand`. Not a
   * `.tbar-x`, so the harness does not press it.
   * See lessons/page-stage.md#stage-90
   */
  const playRecBtn = bar.el.querySelector('.tbar-toggle');
  playRecBtn.setAttribute('aria-label', 'play or pause the recording this show made');
  // A disabled ▶ with no word beside it says nothing about when it will work.
  playRecBtn.title = 'plays the recording once a show has stopped';
  playRecBtn.disabled = true;
  const paintPlayRec = () => { playRecBtn.disabled = !archiveMedia; };

  /**
   * Whole seconds: elapsed while a show is on, `elapsed / length` once `recordedMs`
   * exists. `SHOW_MS` stays the deck's range, which the harness's seek drill reads.
   * See lessons/page-stage.md#stage-91
   */
  const mss = (ms) => {
    const t = Math.max(0, Math.floor(ms / 1000));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  };
  const showClock = (pos) => (recordedMs != null ? `${mss(pos)} / ${mss(recordedMs)}` : mss(pos));

  const showBar = createTransportBar(room, showDeck, {
    fmt: showClock,
    /**
     * No live chip and no clock (`time: false`): a live clock would count toward a
     * nominal end nobody set.
     * See lessons/page-stage.md#stage-92
     */
    // One bar: the start on the left, the timers and Play recording on the right.
    // See lessons/page-stage.md#stage-93
    live: false, time: true, scrub: false, loop: false, absolute: false,
    toggle: false,
    /**
     * `onClick`: `transport-bar.mjs` binds `extras` with `x.onClick?.(b)`, so `onPress`
     * is silently ignored. The module documents `onPress` for `extras`; fix it there,
     * accepting both, across every page that declares `extras`.
     * See lessons/page-stage.md#stage-94
     */
    extras: [
      // `Start show`, not a protocol name. The asserts read `^start` and `^stop`.
      // See lessons/page-stage.md#stage-95
      { id: 'webrtc', label: 'Start show', word: true,
        aria: 'start the live show, which opens a real stream and records it, or stop it',
        onClick: () => toggleShow() },
    ],
    right: [playRecBtn],
    /**
     * `start` and `stop` words, not a record dot: the press puts a show on air and
     * records it. The component keeps both words' width so the button never resizes.
     * See lessons/page-stage.md#stage-96
     */
    verb: ['start', 'stop'],
    /**
     * `publish: true`: the show's bar holds `__demo.transport`, the one a person presses;
     * the archive bar passes `publish: false`. Earlier wording: lessons/page-stage.md#stage-97
     * See lessons/page-stage.md#stage-150
     */
    publish: true,
    command: {
      play: () => startShow(),
      pause: () => stopShow(),
      // A live show has nowhere to seek to and a finished one does. This is the
      // control room's only transport now, so it answers for both phases.
      seek: (ms) => { if (archiveMedia) archiveCommand.seek(ms); else showDeck.seek(ms); },
    },
  });

  /**
   * The one way a show reaches an audience: the container publishes over WHIP, this
   * page subscribes over WHEP, and one button starts and stops that.
   * See lessons/page-stage.md#stage-98
   */
  let transport = null;     // 'webrtc' while a show is on, null otherwise
  let hold = null;          // the container stays awake while a show is on
  /**
   * `/stage/` has its own container, playing the MIM film over WHIP with no overlay,
   * and its own input. Each is written once.
   * See lessons/page-stage.md#stage-99
   */
  const holdShow = () => holdPublisher(() => {}, STAGE_PUB);
  const showWhep = () => stageWhep();
  const waitShow = (o = {}) => waitForWhip({ ...o, statusUrl: STAGE_PUB_STATUS });

  /**
   * Tear down the live picture. The publisher hold is a reference count released
   * by `toggleShow` when the show stops, not here.
   * See lessons/page-stage.md#stage-100
   */
  function dropTransport() {
    // Nothing is left shimmering after the wait ends.
    // See lessons/page-stage.md#stage-101
    pendTransport('webrtc', false);
    // A start that was never live is over too: the tag goes with the element.
    if (phase !== 'live') pictureReset();
    // Drop the finished element: a stale `audVideo` was re-parented over a recording.
    // See lessons/page-stage.md#stage-102
    audVideo = null;
    paintMute();
  }

  /** The one button reads what it will do next. */
  function paintTransport() {
    const b = showBar?.extra('webrtc');
    if (!b) return;
    const on = transport === 'webrtc';
    b.textContent = on ? 'Stop show' : 'Start show';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  /**
   * One button, its own stop. `transport` is set only once the show really went
   * live. The button shimmers while it stops: stopping uploads and plays back.
   * See lessons/page-stage.md#stage-103
   */
  let switching = false;
  async function toggleShow() {
    if (switching) return;
    if (LIGHT) {
      d.log('left for the deep run: the show, its publisher, the WHEP picture, the recording and its playback (DEMO_DEEP=1)');
      return;
    }
    switching = true;
    const b = showBar?.extra('webrtc');
    if (b) b.disabled = true;
    try {
      if (transport === 'webrtc') {
        pendTransport('webrtc', true);
        await stopShow(); dropTransport();
        if (hold) { try { hold.close(); } catch { /* gone */ } hold = null; }
        transport = null;
      } else {
        dropTransport();
        await startShow();
        if (phase === 'live') { transport = 'webrtc'; d.log('the audience is on WebRTC', 'hi'); }
      }
    } finally {
      switching = false;
      pendTransport('webrtc', false);
      if (b) b.disabled = false;
      paintTransport(); paintPlayRec();
    }
  }

  /**
   * The control room's own timeline, on `showDeck` (the show as it happens), a
   * different deck from `archiveDeck`. It does not seek while a show is on.
   * See lessons/page-stage.md#stage-104
   */
  /**
   * No nominal recording lane here: before Start it would show a bar for a file
   * nothing has written. The archive keeps it, where the span is a real recording.
   * See lessons/page-stage.md#stage-105
   */
  const roomStrip = createStripView(room, showDeck, {
    // Only the show lane at construction; `relane()` adds the rest when a question
    // arrives and does not run on load.
    // See lessons/page-stage.md#stage-106
    size: 'auto', gutter: 110, lanes: [SHOW_LANE()], minHeight: STRIP_MIN_H,
    // A live show has nowhere to seek to. A finished one is a recording, and
    // pressing the strip moves the recording, the same road the bar takes.
    onSeek: (ms) => { if (archiveMedia) archiveCommand.seek(ms); },
    maxSpan: () => SHOW_MS,
    /**
     * `follow: false` at construction: the default is `opts.follow !== false`, and a later
     * `setFollow(false)` did not stop the window sliding. `startShow` turns it on.
     * See lessons/page-stage.md#stage-107
     */
    follow: false,
  });
  /**
   * Opens on 0..30 s and follows only once a show starts; following a playhead parked
   * at zero showed an axis of -30 to 0.
   * See lessons/page-stage.md#stage-108
   */
  roomStrip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
  /**
   * Both strips are re-fitted when their tab is shown, since a hidden panel has no
   * width. A no-op on a strip somebody already dragged, judged by `phase`.
   * See lessons/page-stage.md#stage-109
   */
  refit = (id) => {
    if (id === 'controlroom' && phase === 'before') {
      roomStrip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    }
  };
  refit(tabs.at());
  /**
   * The bar and the strip are one surface here too: the bar drives the position the
   * strip shows.
   * See lessons/page-stage.md#stage-110
   */
  /**
   * A Clear button under the control room timeline, disabled when there is nothing to
   * clear. Not in `.pos-controls` and not a `.tbar-x`, the selectors `verify.mjs`
   * presses, so the harness cannot wipe the run it grades.
   * See lessons/page-stage.md#stage-111
   */
  // `Clear show`, not a bare `Clear`, so the word says what goes.
  // See lessons/page-stage.md#stage-112
  const clearBtn = el('button', 'pos-btn', 'Clear show', { type: 'button' });
  clearBtn.title = 'removes the recording, the question and its answers';
  clearBtn.addEventListener('click', () => { clearRun(); paintClear(); });
  /** Nothing to clear means nothing to press. */
  function paintClear() {
    clearBtn.disabled = !(archiveMedia || QUESTIONS.length || T0 != null);
  }
  paintClear();

  /**
   * Where the recording is, published on `__demo.chain` for the checks. The fixed path
   * (IndexedDB, R2 on stop, playback) is in the diagram; changes go to the log.
   * See lessons/page-stage.md#stage-113
   */
  const recPath = { local: '', r2: '', play: '', url: null };
  function recPathReset() {
    recPath.local = ''; recPath.r2 = ''; recPath.play = ''; recPath.url = null;
  }
  window.__demo.chain = recPath;

  room.append(createGlue(showBar.el, roomStrip.el), clearBtn);
  paintTransport();
  paintPlayRec();

  // See lessons/page-stage.md#stage-114


  /**
   * Mute is a glyph beside fullscreen: `♫` U+266B and `⊘` U+2298, monochrome and present
   * (U+1F568 to U+1F56A render as tofu here), centred on ink by `setSymbol`. Every show
   * arrives muted so autoplay is allowed; disabled while there is no live picture.
   * See lessons/page-stage.md#stage-115
   */
  const MUTE_ON = '\u266b';
  const MUTE_OFF = '\u2298';
  let muted = true;
  const muteBtn = el('button', 'ico', MUTE_OFF, { type: 'button', 'aria-label': 'the live show\u2019s sound' });
  centreSymbol(muteBtn);
  function setMuted(next, say = false) {
    muted = !!next;
    if (audVideo) audVideo.muted = muted;
    paintMute();
    if (say) d.log(muted ? 'the live show is muted' : 'the live show is audible in this room');
  }
  function paintMute() {
    setSymbol(muteBtn, muted ? MUTE_OFF : MUTE_ON);
    muteBtn.setAttribute('aria-pressed', String(!muted));
    muteBtn.disabled = !audVideo;
    muteBtn.title = !audVideo ? 'sound, once a show is on air'
      : muted ? 'the live show is muted' : 'the live show is audible in this room';
  }
  muteBtn.onclick = () => setMuted(!muted, true);
  // Prepended, so the default fullscreen button stays in the slot.
  // See lessons/page-stage.md#stage-116
  ctrl.panel.slots.right.prepend(muteBtn);
  setMuted(true);

  /**
   * The recorder takes the returned track, never the canvas (plan §4.1): the archive
   * is what the audience saw, as a second encode. Cloudflare ramps WHEP resolution,
   * so the first ~30 s are 640x360.
   * See lessons/page-stage.md#stage-117
   */
  /**
   * Piece length, read by the check too: keyframe spacing is the seek tolerance. 2 s,
   * because a 5 s piece means a seconds-long show records nothing; recovery runs about
   * 1.9 pieces/s (round-trip bound), and `--blocks` indexing keeps seeks fine-grained.
   * See lessons/page-stage.md#stage-118
   */
  const SLICE_MS = 2000;

  /**
   * 700 kbit/s of picture, a step under the 2,500 kbit/s browser default (3.38 GB over
   * 3 h); VP8 smears near 400k. Storage is cheap; the cost is the upload (see
   * `SLICE_MS`). Audio stays at 96k (130 MB over 3 h).
   * See lessons/page-stage.md#stage-119
   */
  const VIDEO_BPS = 700_000;
  const AUDIO_BPS = 96_000;

  /**
   * Stage one: IndexedDB, one record per piece as it arrives (OPFS commits on close).
   * Upload reads back from it; memory is the fallback, named in `__demo.chain.local`.
   * One show is kept; nothing is opened, read or cleared on load.
   * See lessons/page-stage.md#stage-120
   */
  const LOCAL_DB = 'positron-stage';
  const LOCAL_STORE = 'pieces';
  let localDb = null;                  // the IDBDatabase, or null when refused
  let localWhere = null;               // 'IndexedDB' or 'memory', once a show starts
  let localBytes = 0;                  // bytes that COMMITTED, not bytes handed over
  let localPieces = 0;
  let localChain = Promise.resolve();  // writes in order, so a read waits for all of them
  const idbDone = (req) => new Promise((res, rej) => {
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error || new Error('IndexedDB refused'));
  });
  const txDone = (tx) => new Promise((res, rej) => {
    tx.oncomplete = () => res();
    tx.onerror = tx.onabort = () => rej(tx.error || new Error('IndexedDB transaction failed'));
  });
  async function openLocal() {
    if (localDb) return localDb;
    try {
      const req = indexedDB.open(LOCAL_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(LOCAL_STORE, { autoIncrement: true });
      localDb = await idbDone(req);
    } catch (e) {
      d.log(`IndexedDB refused (${e && e.message}), so the recording is kept in this tab's memory`, 'warn');
      localDb = null;
    }
    return localDb;
  }
  async function localClear() {
    localBytes = 0; localPieces = 0;
    await localChain.catch(() => {});
    localChain = Promise.resolve();
    if (!localDb) return;
    try {
      const tx = localDb.transaction(LOCAL_STORE, 'readwrite');
      tx.objectStore(LOCAL_STORE).clear();
      await txDone(tx);
    } catch { /* nothing to clear is the same answer */ }
  }
  function paintLocal() {
    recPath.local = `${localPieces} piece${localPieces === 1 ? '' : 's'}, `
      + `${mib(localBytes)} in ${localWhere === 'IndexedDB' ? 'IndexedDB' : 'tab memory'}`;
  }
  /** Start a show's local copy: one store, emptied, and `recPath` says where. */
  async function localBegin() {
    await openLocal();
    await localClear();
    localWhere = localDb ? 'IndexedDB' : 'memory';
    paintLocal();
  }
  /** One piece in, committed before it is counted. */
  function localPut(blob) {
    localChain = localChain.then(async () => {
      if (localWhere === 'IndexedDB' && localDb) {
        try {
          const tx = localDb.transaction(LOCAL_STORE, 'readwrite');
          tx.objectStore(LOCAL_STORE).add(blob);
          await txDone(tx);
        } catch (e) {
          // The fallback is logged and whole: every piece is also in `chunks`.
          // See lessons/page-stage.md#stage-121
          localWhere = 'memory';
          d.log(`IndexedDB stopped taking pieces (${e && e.message}), so the recording continues in memory`, 'warn');
        }
      }
      localBytes += blob.size; localPieces++;
      paintLocal();
    });
    return localChain;
  }
  /** The finished recording, read back out of where it was kept. */
  async function localRead(mime) {
    await localChain.catch(() => {});
    if (localWhere === 'IndexedDB' && localDb) {
      try {
        const tx = localDb.transaction(LOCAL_STORE, 'readonly');
        const parts = await idbDone(tx.objectStore(LOCAL_STORE).getAll());
        if (parts.length === chunks.length) return new Blob(parts, { type: mime });
        d.log(`IndexedDB holds ${parts.length} pieces against ${chunks.length} recorded, so the memory copy is used`, 'warn');
      } catch (e) {
        d.log(`IndexedDB would not give the recording back (${e && e.message}), so the memory copy is used`, 'warn');
      }
      localWhere = 'memory';
    }
    return new Blob(chunks, { type: mime });
  }
  const mib = (b) => `${(b / 1048576).toFixed(2)} MiB`;

  function startRecorder(track) {
    const mime = recorderMime(d);
    const stream = new MediaStream([track]);
    /**
     * A rate only for a track that exists: the stream is one video track today.
     * See lessons/page-stage.md#stage-122
     */
    const bits = {};
    if (stream.getVideoTracks().length) bits.videoBitsPerSecond = VIDEO_BPS;
    if (stream.getAudioTracks().length) bits.audioBitsPerSecond = AUDIO_BPS;
    const r = new MediaRecorder(stream, mime ? { mimeType: mime, ...bits } : bits);
    r.ondataavailable = (e) => {
      if (!e.data || !e.data.size) return;
      if (T0 == null) T0 = performance.now();
      chunks.push(e.data);
      localPut(e.data);
    };
    r.start(SLICE_MS);
    /**
     * Log the rate the recorder reports, which may differ from the one requested.
     * See lessons/page-stage.md#stage-123
     */
    askedBps = Math.round(r.videoBitsPerSecond || 0);
    d.log(`recording the picture at ${(askedBps / 1000).toFixed(0)} kbit/s in `
      + `${SLICE_MS / 1000}s pieces`);
    return r;
  }

  let starting = false;
  /**
   * A new run clears the last one: recording, blob URL, questions, answers, lanes,
   * pieces, duration and R2 receipts. The blob URL is revoked so it frees its blob.
   * See lessons/page-stage.md#stage-124
   */
  function clearRun() {
    archiveMaster?.dispose?.();
    archiveMaster = null;
    roomMaster?.dispose?.();
    roomMaster = null;
    showDeck.setRange([0, SHOW_MS]);
    if (archiveMedia) { try { archiveMedia.pause(); } catch { /* already gone */ } }
    archiveMedia = null;
    paintPlayRec();
    if (archiveUrl) { URL.revokeObjectURL(archiveUrl); archiveUrl = null; }
    playingBack = false;
    // The panel goes back to empty, no card: there is no recording, so no video element.
    // See lessons/page-stage.md#stage-125
    setPicture(archive.panel, null);
    chunks.length = 0;
    QUESTIONS.length = 0;
    ANSWERS.length = 0;
    OPTIONS.length = 0;
    asked = null;
    // The question comes off both footers. `show()` puts it in a panel's centre
    // slot, so emptying that slot is the same swap in reverse, and a poll left
    // standing from a show that has ended is a control somebody can still press.
    for (const id of SHOWN_ON) byId.get(id).panel.slots.caption.textContent = '';
    T0 = null; recordedMs = null; stored = null; landed = null;
    recTrack = null; askedBps = null; recSource = 'received';
    // The local copy goes too, so a device keeps at most one recording.
    // See lessons/page-stage.md#stage-126
    localClear();
    recPathReset();
    paintPlayRec();
    archiveDeck.setRange([0, SHOW_MS]);
    archiveDeck.seek(0);
    showDeck.seek(0);
    relane();
    strip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    roomStrip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    d.log('a new run: the last recording, its questions and its answers are gone', 'hi');
  }

  async function startShow() {
    if (phase === 'live' || starting) return;
    // A second press of record is a new show, so whatever the last one left has
    // to go before this one starts writing over it.
    if (phase !== 'before') clearRun();
    phase = 'before';
    starting = true;
    /**
     * The timeline starts when the show is on air, not on the press: the deck, the
     * recorder and the badge begin at the first frame. The badge says `starting` meanwhile.
     * See lessons/page-stage.md#stage-127
     */
    setBadges('coming');
    pictureStart();
    pendTransport('webrtc', true);
    /**
     * Nothing local starts with the show; the only picture is the container's. The show
     * arrives muted (see the mute button).
     * See lessons/page-stage.md#stage-128
     */
    setMuted(true);
    // The window starts chasing the show now that there is one.
    roomStrip.strip.setFollow(true);
    try {
      /**
       * A pure receiver: two publishers on one live input fight, and Cloudflare holds an
       * input for 45 s against a stale publisher. The container publishes; this page
       * subscribes. The canvas is a monitor, not the source.
       * See lessons/page-stage.md#stage-129
       */
      const v = el('video', 'stage-live', '', { playsinline: '', muted: '' });
      v.muted = true;
      armVideo(v);
      // Watched from before the subscribe, so the first frame is counted.
      pictureWatch(v);
      // The relay is asked for in parallel with the publisher waking and
      // awaited before the offer, because WHEP takes no trickle.
      pressAt ??= performance.now();
      iceAsks++;
      const iceAsk = fetchIceServers({ log: d.log });
      if (!hold) hold = holdShow();
      /**
       * Wait for the publisher before subscribing: a cold wake is about 22 s and `whepPlay`
       * meets a 409 until then. The harness presses this about a second after load.
       * See lessons/page-stage.md#stage-130
       */
      const up = await waitShow({ timeoutMs: 60000 });
      if (!up.ok) throw new Error(`the publisher did not come up in ${Math.round(up.waitedMs / 1000)} s`);
      if (up.waitedMs > 3000) d.log(`the publisher came up after ${(up.waitedMs / 1000).toFixed(1)} s`, 'hi');
      ice = await iceAsk;
      live = { pub: null, sub: await whepPlay(showWhep(), v, { iceServers: ice.iceServers, log: d.log }), kind: 'receiver' };
      clearInterval(pathTimer);
      pathTimer = setInterval(readPath, 1000);
      readPath();

      // The picture goes to the tab that is showing: one element, moved, since a second
      // player would be a second Stream meter.
      // See lessons/page-stage.md#stage-131
      audVideo = v;
      showPictureOn(showingTab());
      paintMute();

      /**
       * `verify.mjs` stops collecting after 4.8 s without a new assert, so long waits
       * inside a drill drop the asserts after them.
       * See lessons/page-stage.md#stage-132
       */
      /**
       * Shorter than the page's own check waiting for `phase === 'live'`: of two waits
       * for one event, the inner must be the shorter.
       * See lessons/page-stage.md#stage-133
       */
      const seen = await waitForFirstFrame(v, { timeoutMs: 12000 });
      /**
       * The badge goes live because frames arrived: a WHEP track exists before it carries
       * anything.
       * See lessons/page-stage.md#stage-134
       */
      setBadges(seen.frames ? 'online' : 'checking');
      // The clock starts with the picture, not with the press. See `startShow`.
      showDeck.play();
      pendTransport('webrtc', false);
      d.log(`picture ${seen.w}x${seen.h} by ${seen.how}`, seen.frames ? 'hi' : 'warn');

      /**
       * See lessons/page-stage.md#stage-135
       */
      /**
       * No canvas fallback: this page publishes nothing, and the only picture is the one
       * that came back.
       * See lessons/page-stage.md#stage-136
       */
      const track = live.sub.inbound.getVideoTracks()[0];
      if (!seen.frames) {
        d.log('no frame has crossed the WebRTC leg yet, so the recording starts '
          + 'on a track that is still filling', 'warn');
      }
      if (!track) throw new Error('the WebRTC leg carried no video track');
      await localBegin();
      recPath.r2 = USE_R2 ? 'waiting' : 'off';
      recPath.play = USE_R2 ? 'r2' : 'local';
      if (!USE_R2) {
        d.log('R2 is off for this run, so the recording stays in this browser and plays from '
          + 'there (a harness run keeps the upload cap for people, and ?r2=1 turns it on)');
      }
      rec = startRecorder(track);
      recTrack = track;
      followWriteHead();
      phase = 'live';
      sayState();
    } catch (err) {
      d.log(`the show did not start: ${err && err.message}`, 'bad');
      showDeck.pause();   // it never got on air, so the bar goes back to start
      pictureReset();     // and nothing is on its way, so the tag goes
    } finally { starting = false; }
  }

  /**
   * Stop returns when the bytes are in R2 and readable (plan §4.2): `proveReadable`
   * HEADs and compares the length, since a 200 can carry `content-length: 0`.
   * What landed, including `missing`, is said in the log.
   * See lessons/page-stage.md#stage-137
   */
  async function stopShow({ upload = USE_R2 } = {}) {
    if (phase !== 'live') return;
    showDeck.pause();
    phase = 'stopped';
    // Before the tracks stop, so a stop never reads as a stall.
    pictureReset();
    // And the control room's window stops chasing, so what is on screen is the
    // show that just happened rather than a window sliding past its end.
    roomStrip.strip.setFollow(false);

    const done = new Promise((res) => { if (rec) rec.onstop = res; else res(); });
    try { rec?.stop(); } catch { /* already stopped */ }
    await done;
    try { live?.pub?.stop?.(); } catch { /* the proxy may already have gone */ }
    for (const t of (live?.sub?.inbound?.getTracks?.() ?? [])) t.stop();
    stopPath();
    setBadges('offline');

    const mime = chunks[0]?.type || 'video/webm';
    /**
     * Stage one ends: the upload is assembled from the IndexedDB records, not memory.
     * See lessons/page-stage.md#stage-138
     */
    const blob = await localRead(mime);
    paintLocal();
    d.log(`recorded ${mib(blob.size)} in ${chunks.length} pieces, read back out of `
      + `${localWhere === 'IndexedDB' ? 'IndexedDB' : 'this tab\u2019s memory'}`, 'hi');

    /**
     * Stage two, R2 for a person (see `USE_R2`), with a HEAD whose length must match.
     * Stage three plays the public R2 URL itself; a failed upload falls back to the
     * local copy and says so.
     * See lessons/page-stage.md#stage-139
     */
    let src = null;
    if (upload) {
      /**
       * A throw here must not hang the stop: a failed upload falls back to the local copy.
       * See lessons/page-stage.md#stage-140
       */
      try { stored = await uploadToR2(blob); } catch (e) {
        stored = null;
        recPath.r2 = 'failed';
        d.log(`the upload to R2 failed (${e && e.message}), so the recording stays in this browser`, 'bad');
      }
      if (stored) {
        const head = await proveReadable(stored.url);
        landed = { ok: head.ok, bytes: head.bytes, url: stored.url, key: stored.key, sent: blob.size };
        recPath.r2 = head.ok ? 'stored' : 'unreadable';
        d.log(head.ok
          ? `R2 holds it and serves it back: ${head.bytes} bytes at ${stored.key}, gone in 6h`
          : `R2 took it and will not serve it back (HTTP ${head.status})`,
        head.ok ? 'hi' : 'bad');
        if (head.ok) src = stored.url;
      }
    }
    if (!src) {
      src = URL.createObjectURL(blob);
      // Kept so the NEXT run can revoke it. A blob URL holds its blob alive
      // until it is revoked, and a page that records five shows would be
      // holding five recordings in memory with four of them unreachable.
      archiveUrl = src;
    }
    await openArchive(src, mime);
    sayState();
  }

  /**
   * One recording to R2 as one object: `ingest.mjs`'s `putWhole` with an
   * `XMLHttpRequest` for upload progress, logged a quarter at a time. Belongs upstream
   * as an `onProgress` option on `putWhole`.
   * See lessons/page-stage.md#stage-141
   */
  async function uploadToR2(blob) {
    recPath.r2 = 'opening';
    d.log('opening an upload session for R2');
    const sess = await openSession({ log: d.log });
    if (!sess) {
      recPath.r2 = 'refused';
      d.log('the upload route refused a session (five sessions an hour per address), so the '
        + 'recording stays in this browser', 'bad');
      return null;
    }
    if (blob.size > sess.limits.maxSegmentBytes) {
      recPath.r2 = 'too big';
      d.log(`${mib(blob.size)} is over the ${mib(sess.limits.maxSegmentBytes)} one upload may be, `
        + 'so the recording stays in this browser', 'bad');
      return null;
    }
    recPath.r2 = 'uploading';
    let quarter = -1;
    const put = await new Promise((res) => {
      const x = new XMLHttpRequest();
      x.open('PUT', `${INGEST}/seg/${sess.session}/0?fmt=webm`);
      x.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const q = Math.floor((e.loaded / e.total) * 4);
        if (q > quarter) {
          quarter = q;
          d.log(`uploading to R2, ${Math.round((e.loaded / e.total) * 100)}% of ${mib(e.total)}`);
        }
      };
      x.onload = () => {
        let j = {};
        try { j = JSON.parse(x.responseText); } catch { /* not json */ }
        res({ ok: x.status >= 200 && x.status < 300, status: x.status, j });
      };
      x.onerror = () => res({ ok: false, status: 0, j: {} });
      x.send(blob);
    });
    if (!put.ok || !put.j.key) {
      recPath.r2 = 'refused';
      d.log(`R2 refused the upload (HTTP ${put.status} ${put.j.error || ''})`, 'bad');
      return null;
    }
    const r = await fetch(`${INGEST}/close/${sess.session}?fmt=webm`, { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.base) {
      recPath.r2 = 'not closed';
      d.log(`the upload to R2 would not close (HTTP ${r.status} ${j.error || ''})`, 'bad');
      return null;
    }
    const file = put.j.key.split('/').pop();
    return { url: `${j.base}/${file}`, key: put.j.key, session: sess.session, bytes: blob.size };
  }


  /**
   * A handle for a probe, like `window.__scope` on `/archive/radio/`.
   * See lessons/page-stage.md#stage-142
   */
  window.__archiveDeckSeek = (ms) => archiveDeck.seek(ms);
  window.__stage = {
    get phase() { return phase; },
    get chunks() { return chunks.length; },
    get recState() { return rec?.state ?? 'none'; },
    get kind() { return live?.kind ?? 'none'; },
    get ms() { return recordedMs; },
    get landed() { return landed; },
    get recSource() { return recSource; },
    get archiveMedia() { return !!archiveMedia; },
    seekArchive: (ms) => archiveCommand.seek(ms),
    get recTrack() { return recTrack; },
    get receivers() { return live?.sub?.pc?.getReceivers?.() ?? []; },
    get ice() {
      return {
        out: live?.pub?.pc?.iceConnectionState ?? 'none',
        inn: live?.sub?.pc?.iceConnectionState ?? 'none',
        outConn: live?.pub?.pc?.connectionState ?? 'none',
        innConn: live?.sub?.pc?.connectionState ?? 'none',
      };
    },
    get questions() { return QUESTIONS.length; },
    get answers() { return ANSWERS.length; },
    // The recording's path, the same object `__demo.chain` carries.
    get chain() { return window.__demo.chain; },
    // What the picture tag says and what it was told: presented frames, by which clock.
    get picture() {
      return { state: picTags()[0]?.state() ?? 'none', frames: pic.frames, how: pic.how,
        lastFrameAgoMs: pic.lastAt == null ? null : Date.now() - pic.lastAt };
    },
    startShow, stopShow,
  };

  /**
   * The sidecar: events in R2 beside the video, living as long as the recording.
   * `workers/store` caps at 1000 rows and 24 hours. Built here, written nowhere yet:
   * playback is in this tab, where the events are already in memory.
   * See lessons/page-stage.md#stage-143
   */
  const sidecar = () => ({
    T0: T0 == null ? null : Math.round(T0),
    durationMs: recordedMs,
    questions: QUESTIONS,
    answers: ANSWERS,
  });

  /**
   * Play the recording, driven through `mediaMaster`. A `MediaRecorder` file reports
   * `duration: Infinity`, so the imported `resolveDuration` resolves it.
   * See lessons/page-stage.md#stage-144
   */
  let playingBack = false;
  async function openArchive(src, mime) {
    const v = el('video', 'stage-live', '', { playsinline: '', muted: '', preload: 'auto' });
    v.muted = true;
    armVideo(v);
    const fromR2 = /^https?:/.test(src);
    // `crossOrigin` before `src`, or the R2 copy taints every canvas the checks draw into.
    // See lessons/page-stage.md#stage-145
    if (fromR2) v.crossOrigin = 'anonymous';
    v.src = src;
    recPath.play = fromR2 ? 'r2' : 'local';
    recPath.url = fromR2 ? src : null;
    // The card goes and the real file takes its place. One swap, at the moment
    // there is something true to show.
    setPicture(archive.panel, v);
    playingBack = true;

    recordedMs = await resolveDuration(v);
    // `setRange([0, 0])` throws inside the deck, so a zero length stops here.
    // See lessons/page-stage.md#stage-146
    if (!(recordedMs > 0)) {
      recordedMs = null;
      d.log('the recording has no duration that could be resolved, so there is nothing to scrub', 'bad');
      return null;
    }
    archiveDeck.setRange([0, recordedMs]);
    relane();
    followPlayhead();
    /**
     * `mediaMaster`, not a `timeupdate` handler: it owns drift correction, the rate
     * intersection and the stall policy.
     * See lessons/page-stage.md#stage-147
     */
    archiveMaster = mediaMaster(archiveDeck, v, { stallPolicy: 'hold' });
    /**
     * The control room's timeline becomes the recording's, cursor at 0, paused. Two
     * `mediaMaster`s on one element cannot fight: it only reads the element.
     * See lessons/page-stage.md#stage-148
     */
    showDeck.setRange([0, recordedMs]);
    showDeck.seek(0);
    roomMaster = mediaMaster(showDeck, v, { stallPolicy: 'hold' });
    roomStrip.strip.fit(0, recordedMs);
    archiveMedia = v;           // from here the bar and the strip drive the file
    paintPlayRec();
    d.log(`the archive holds ${(recordedMs / 1000).toFixed(1)}s, playing from `
      + `${fromR2 ? src : 'this browser\u2019s own copy'}`, 'hi');
    return { video: v, mime, ms: recordedMs };
  }

  /**
   * The options are prefilled and the question is not, so Send is one line of typing
   * away. No placeholder either: the only example to hand read as a stale question.
   * `send()` refuses an empty question in words.
   * See lessons/page-stage.md#stage-149
   */
  /**
   * The page's own question, given word for word and not translated: content in an
   * English page. `ASK_TITLE` is what the self check sends through the relay and reads
   * back code point by code point, so its diacritics and question mark must stay.
   * See lessons/page-stage.md#stage-151
   */
  const ASK_TITLE = 'Kas sa oled teinud ökopattu?';
  const ASK_OPTIONS = ['Veidi', 'Palju', 'Väga palju'];
  /**
   * The sample question is prefilled: the room is a per-load `stage-<6 chars>`, so it
   * reaches nobody until Send is pressed.
   * See lessons/page-stage.md#stage-152
   */
  const title = createField({ label: 'question', value: ASK_TITLE, grow: 'wide' });
  const opts = ASK_OPTIONS.map((v) => createField({ label: 'option', value: v }));
  /**
   * The question on one row, the options on the next.
   * See lessons/page-stage.md#stage-153
   */
  const form = el('div', 'stage-form');
  const askRow = el('div', 'stage-row');
  askRow.append(title.el);
  const optRow = el('div', 'stage-row');
  optRow.append(...opts.map((o) => o.el));
  form.append(askRow, optRow);

  const taken = () => opts.map((o) => o.value().trim()).filter(Boolean);
  const send = (delayMs) => {
    const t = title.value().trim();
    const o = taken();
    // No silent fallback to a sample when the field is empty.
    // See lessons/page-stage.md#stage-154
    if (!t) { d.log('a question needs something to ask', 'warn'); return; }
    if (o.length < 2) { d.log('a question needs at least two options', 'warn'); return; }
    if (!delayMs) { ask(t, o); return; }
    /**
     * The delayed send is for testing: 10 s to switch tabs and watch the question arrive.
     * See lessons/page-stage.md#stage-155
     */
    d.log(`asking in ${delayMs / 1000} seconds, so there is time to move to the audience`);
    setTimeout(() => ask(t, o), delayMs);
  };

  const row = el('div', 'stage-row');
  /**
   * Secondary, like every button on the page: the two sends are equal ways of sending.
   * See lessons/page-stage.md#stage-156
   */
  const now = el('button', '', 'Send', { type: 'button' });
  now.onclick = () => send(0);
  /**
   * Named for its purpose: one person testing the loop in one tab. The `title`
   * carries the delay.
   * See lessons/page-stage.md#stage-157
   */
  const later = el('button', '', 'Test in Audience', { type: 'button',
    title: 'Sends in 10s\ntime to open the Audience tab' });
  later.onclick = () => send(10_000);
  row.append(now, later);
  /**
   * The form is in a box: `--card` at 4 px with a `--line` edge, like the log.
   * See lessons/page-stage.md#stage-158
   */
  const box = el('div', 'stage-box');
  box.append(form, row);
  room.append(box);
  stageAsk = { ask, send, form, shownOn: SHOWN_ON, get asked() { return asked; } };

  /**
   * The drawing loop. `requestAnimationFrame` pauses in a background tab, as wanted.
   * See lessons/page-stage.md#stage-159
   */
  // The frame number is still counted, because `burn` needs one and the check
  // below waits on it. It is simply not shown: nothing about it moves.
  let frames = 0;
  function tick() {
    /**
     * One flat colour: the live picture is the WHEP `<video>` itself, moved by
     * `showPictureOn`. The loop stays to tick the two `mediaMaster`s, and the at-rest
     * check reads the flat field.
     * See lessons/page-stage.md#stage-160
     */
    mctx.fillStyle = FIELD;
    mctx.fillRect(0, 0, STAGE_W, STAGE_H);
    // The archive is not fed from here: its picture follows its transport.
    // See lessons/page-stage.md#stage-161
    for (const p of panels) p.ctx.drawImage(master, 0, 0);
    /**
     * `mediaMaster` does not run itself: tick it from this rAF loop, or the deck is
     * never driven by its element. The seek check reads the element, so it cannot see this.
     * See lessons/page-stage.md#stage-162
     */
    archiveMaster?.tick();
    roomMaster?.tick();
    frames++;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /**
   * The archive's frame is drawn for the playhead position, and only when it changes.
   * See lessons/page-stage.md#stage-163
   */
  const archiveCtx = archive.ctx;
  let lastDrawn = -1;
  const paintArchive = (ms) => {
    const f = Math.round(ms / 16.7);
    if (f === lastDrawn) return;
    lastDrawn = f;
    burn(archiveCtx, FRAME_W, FRAME_H, f, { hue: videoHue(0), ms: showWallStart + Math.round(ms) });
  };
  paintArchive(0);
  /**
   * `position()` per frame, not `observePosition`: that needs `transport.clock.now()`,
   * which this deck does not expose.
   * See lessons/page-stage.md#stage-164
   */
  /**
   * The archive never simulates a recording: empty until there is a file, then the
   * file. `paintArchive` is called once, so the burn path stays compiled.
   * See lessons/page-stage.md#stage-165
   */
  const noTape = createCard({
    title: 'Nothing recorded yet',
    desc: 'When a show is stopped in the control room, the recording appears here and '
      + 'the timeline fills with what was asked and what came back.',
    // The shape the recording will be, so the box does not change size when the
    // card is swapped for the file.
    aspect: `${STAGE_W} / ${STAGE_H}`,
  });
  setPicture(archive.panel, null);
  // No `Nothing recorded yet` card: the disabled Play recording already says it.
  // See lessons/page-stage.md#stage-166

  // Every panel's default badge is told the same thing, because they all show
  // the same picture and it is this page drawing it.
  for (const p of panels) p.panel.presence?.set('online');

  /**
   * Nothing here opens a socket, makes a sound or presses a control, and it is gated
   * by `SELFCHECK` anyway. Everything reads what is already on screen.
   * See lessons/page-stage.md#stage-167
   */
  /**
   * Asserts are held and emitted at the end: `verify.mjs` stops collecting after one
   * 400 ms tick without a new assert, so early asserts would cut off the tail. This
   * page has no controls row or control 0 to carry `data-busy` or `settleMs`.
   * See lessons/page-stage.md#stage-168
   */
  const held = [];
  const A = (label, pass, detail) => held.push([label, pass, detail]);
  /**
   * Every request this page made for the film, from resource timing. Read in both tiers.
   * See lessons/page-stage.md#stage-169
   */
  const filmAsks = () => performance.getEntriesByType('resource')
    .filter((e) => /mimproject|\.mp4(\?|#|$)/i.test(e.name))
    .map((e) => e.name.split('/').pop());

  /**
   * Declared here because `checks()` starts the wake and `showDrill()` awaits it.
   * See lessons/page-stage.md#stage-170
   */
  let wokeAt = 0;
  let whipUp = null;

  /**
   * Eight fixed points of a canvas as luminance, shared by several checks below.
   * See lessons/page-stage.md#stage-171
   */
  const SAMPLE = [[0.12, 0.20], [0.31, 0.47], [0.50, 0.31], [0.68, 0.62],
    [0.84, 0.44], [0.22, 0.75], [0.77, 0.18], [0.41, 0.86]];
  const lumAtOf = (ctx) => SAMPLE.map(([fx, fy]) => {
    const px = ctx.getImageData(Math.round(STAGE_W * fx), Math.round(STAGE_H * fy), 1, 1).data;
    return Math.round(px[0] * 0.299 + px[1] * 0.587 + px[2] * 0.114);
  });

  async function checks() {
    // Either tier: a deep run uses `selfcheck=2`.
    // See lessons/page-stage.md#stage-172
    if (!SELFCHECK) return;

    /**
     * Wake the container first (about 22 s cold) so it is warm at the press. The promise
     * starts here, inside the `selfcheck` gate, and is awaited at the press, so the wake
     * overlaps the read-only asserts. It is the WHIP leg, since playback is WHEP.
     * See lessons/page-stage.md#stage-173
     */
    if (!LIGHT) {
      if (!hold) hold = holdShow();
      wokeAt = performance.now();
      whipUp = waitShow({ timeoutMs: 60000 });
    }

    /**
     * Read before any press: the harness presses control 0 (the start) soon after load,
     * and `checks()` begins six frames after mount, so `before` really means before.
     * See lessons/page-stage.md#stage-174
     */
    const vidsBefore = document.querySelectorAll('.pos-vp-stage video').length;
    A('the audience is shown no video before there is anything in one',
      vidsBefore === 0 && !aud.panel.stage.querySelector('video'),
      `${vidsBefore} video elements in the page, and the audience panel holds `
      + `${aud.panel.stage.children.length} child element(s), none of them a video`);

    // Each tab says what it is in one sentence, only the open tab's sentence is
    // visible, and no tab sentence is stretched with a colon, semicolon or dash.
    {

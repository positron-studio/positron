      const shown = [...abouts].filter(([, p]) => getComputedStyle(p).visibility === 'visible');
      const stretched = [...abouts].filter(([, p]) => /[:;—–·]/.test(p.textContent));
      A('each tab carries one plain sentence, and only the open tab shows its own',
        abouts.size === TABS.length && shown.length === 1 && shown[0][0] === tabs.at()
        && !stretched.length && [...abouts].every(([, p]) => p.textContent.trim().length > 0),
        `${abouts.size} sentences for ${TABS.length} tabs, visible: `
        + `${shown.map(([k]) => k).join(', ') || 'none'} on tab ${tabs.at()}`
        + `${stretched.length ? `, stretched: ${stretched.map(([k]) => k).join(', ')}` : ''}`);
    }

    /**
     * Counts against `TABS`, not a typed number.
     * See lessons/page-stage.md#stage-175
     */
    A('one panel for each tab, and no spare',
      panels.length === TABS.length
      && tabs.el.querySelectorAll('.pos-vp').length === TABS.length,
      `${tabs.el.querySelectorAll('.pos-vp').length} panels in ${TABS.length} tabs`);

    /**
     * The fullscreen button is square, measured: a glyph's width varies by font.
     * See lessons/page-stage.md#stage-176
     */
    const btn = panels[0].panel.slots.right.querySelector('button');
    const r = btn?.getBoundingClientRect();
    A('the fullscreen button is square', !!r && Math.abs(r.width - r.height) <= 0.5,
      r ? `${r.width.toFixed(1)} by ${r.height.toFixed(1)} px` : 'there is no button in the right slot');

    // The defaults are the component's whole argument: a page that wants a
    // status and a way to go full writes neither.
    const p0 = panels[0].panel;
    A('left is a status and right is a control, with nothing in the middle by default',
      !!p0.slots.left.querySelector('.pos-pres') && !!p0.slots.right.querySelector('button')
      && p0.slots.centre.childElementCount === 0,
      `left ${p0.slots.left.childElementCount}, centre ${p0.slots.centre.childElementCount}, right ${p0.slots.right.childElementCount}`);

    // A mode nobody named is a mode nobody can debug, so the component throws.
    let threw = false;
    try { p0.mode('enormous'); } catch { threw = true; }
    A('a fullscreen mode it does not know is refused rather than ignored', threw,
      threw ? 'it throws' : 'it accepted a mode that does not exist');

    /**
     * See lessons/page-stage.md#stage-177
     */
    /**
     * See lessons/page-stage.md#stage-178
     */
    /**
     * See lessons/page-stage.md#stage-179
     */
    /**
     * See lessons/page-stage.md#stage-180
     */
    /**
     * Read only, so it sits above the gate: the zoom checks below would destroy the
     * opening view.
     * See lessons/page-stage.md#stage-181
     */
    const spanOf = () => (strip.strip.state.width - strip.strip.state.gutterPx)
      * 1000 / strip.strip.view().pxPerSecond;
    // The label does not spell the number, so it cannot drift from the constant.
    // See lessons/page-stage.md#stage-182
    /**
     * The control room's timeline opens on the same window, starting at zero. It checks
     * the left edge as well as the span: a hidden panel's zero width once shifted it.
     * See lessons/page-stage.md#stage-183
     */
    const roomView = roomStrip.strip.view();
    const roomSpan = (roomStrip.strip.state.width - roomStrip.strip.state.gutterPx)
      * 1000 / roomView.pxPerSecond;
    const roomLeftMs = Math.round((roomView.startSec ?? roomView.t0 ?? 0) * 1000);
    A('the control room timeline opens on its window, at the start of the show',
      Math.abs(roomSpan - ARCHIVE_WINDOW_MS) < ARCHIVE_WINDOW_MS * 0.05
      && Math.abs(roomLeftMs) < 1500,
      `${(roomSpan / 1000).toFixed(1)}s on screen starting at `
      + `${(roomLeftMs / 1000).toFixed(1)}s, against ${ARCHIVE_WINDOW_MS / 1000}s from 0`);

    A('the archive opens on the window it declares',
      Math.abs(spanOf() - ARCHIVE_WINDOW_MS) < ARCHIVE_WINDOW_MS * 0.1,
      `${(spanOf() / 1000).toFixed(1)}s on screen, against ${ARCHIVE_WINDOW_MS / 1000}s asked for`);

    if (!SELFCHECK) {
      // A visitor still gets every read-only assert: they are held, so emit them here.
      // See lessons/page-stage.md#stage-184
      for (const [label, pass, detail] of held) d.assert(label, pass, detail);
      d.log('the checks that press things are for the harness, not for you');
      return;
    }

    /**
     * Zoom out a thousandfold and assert where it stopped; `S.zoom.by` names the limit.
     * See lessons/page-stage.md#stage-185
     */
    strip.strip.zoomOut(1000);
    const outSpan = spanOf();
    const stoppedBy = strip.strip.state.zoom?.by ?? 'nothing';
    strip.strip.fit(0, ARCHIVE_WINDOW_MS, { pad: 0 });
    A('zoom out stops at the page\u2019s own bound, and says which limit stopped it',
      Math.abs(outSpan - maxSpanMs()) < maxSpanMs() * 0.05 && stoppedBy === 'max-span',
      `it went out to ${(outSpan / 1000).toFixed(1)}s against a bound of `
      + `${(maxSpanMs() / 1000).toFixed(1)}s, stopped by ${stoppedBy}`
      + `${recordedMs == null ? ' (no recording yet, so the bound is the nominal show)' : ''}`);

    /**
     * Nothing on this page asks for the film, by resource timing, and before a press the
     * monitor is one flat colour. The pattern covers `/resources/mimproject.json` and `.mp4`.
     * See lessons/page-stage.md#stage-186
     */
    const lumIdle = lumAtOf(mctx);
    const idleSpread = Math.max(...lumIdle) - Math.min(...lumIdle);
    const asksBefore = filmAsks();
    const srcVideos = [...document.querySelectorAll('video')]
      .filter((v) => v.getAttribute('src') || v.currentSrc);
    A('no film is on the page and none of one is asked for before a press',
      asksBefore.length === 0 && srcVideos.length === 0 && idleSpread <= 2,
      `${asksBefore.length} film request(s)${asksBefore.length ? ` (${asksBefore.join(', ')})` : ''}, `
      + `${srcVideos.length} video element(s) with a file source, and the monitor spans `
      + `${idleSpread} of 255 where a flat field spans 0`);

    /**
     * The show clock reads whole seconds and no nominal end. It reads the text on screen,
     * so it grades what the bar actually shows.
     * See lessons/page-stage.md#stage-187
     */
    const clockNow = (showBar.el.querySelector('.tbar-now')?.textContent || '').trim();
    const clockAll = (showBar.el.querySelector('.tbar-all')?.textContent || '').trim();
    A('the show clock reads whole seconds and claims no end before there is a recording',
      /^\d+:\d\d$/.test(clockNow) && clockAll === '' && recordedMs == null,
      `it reads "${clockNow}"${clockAll ? ` then "${clockAll}"` : ''}, while the deck still `
      + `spans ${Math.round(showDeck.durationMs / 1000)}s for the harness and the clock does not print it`);

    /**
     * `.pos-glue.pos-glue > *` zeroes a glued child's border; the footer assert below
     * reports the edge it measured.
     * See lessons/page-stage.md#stage-188
     */
    const surf = ctrl.panel.surface;
    const panelBorder = parseFloat(getComputedStyle(ctrl.panel.el).borderTopWidth) || 0;
    const surfBorder = parseFloat(getComputedStyle(surf).borderTopWidth) || 0;
    // The control room has one footer, like the audience. `panel.footers()` returns a
    // count so a failure can print it.
    // See lessons/page-stage.md#stage-189
    A('the control room picture has ONE footer, like the audience',
      ctrl.panel.footers() === 1 && panels[1].panel.footers() === 1,
      `control room ${ctrl.panel.footers()}, audience ${panels[1].panel.footers()}, `
      + `with ${surfBorder || panelBorder}px of edge on it`);

    /**
     * Which bar holds `__demo.transport`, asserted: the show's, the one a person presses.
     * See lessons/page-stage.md#stage-190
     */
    A('the published transport is the control room\u2019s one bar',
      window.__demo?.transport === showBar.api && window.__demo?.transport !== bar.api,
      window.__demo?.transport === showBar.api ? 'the control room bar has the name'
        : 'nothing has it');

    const p1 = panels[1].panel;
    p1.full(true).then(() => {
      const on = p1.el.dataset.full;
      const stage = getComputedStyle(p1.el.querySelector('.pos-vp-stage'));
      const ratio = stage.aspectRatio;
      return p1.full(false).then(() => {
        A('going full sets the state and gives the picture the whole box, by either route',
          !!on && ratio !== '16 / 9' && !p1.el.dataset.full,
          `full read "${on || '(nothing)'}" with aspect-ratio ${ratio}, and came back to "${p1.el.dataset.full || '(nothing)'}"`);
      });
    }).catch((e) => {
      A('going full sets the state and gives the picture the whole box, by either route',
        false, `it threw: ${e.message}`);
    });

    /**
     * No dark rule between lanes, sampled as a column, not a point. Negative control:
     * putting the `- 1` back in `fillRect` in `timeline/strip.mjs` turns this red.
     * See lessons/page-stage.md#stage-191
     */
    /**
     * The tab must be in front before its canvas has a size; the message prints the row
     * count so a check that sampled nothing says so.
     * See lessons/page-stage.md#stage-192
     */
    tabs.go('archive');
    /**
     * The strip needs at least two lanes to have a boundary between them, so ask a real
     * question through the page's own `ask()`.
     * See lessons/page-stage.md#stage-193
     */
    /**
     * The lanes arrive with the relay's echo, so wait for them with a deadline and
     * report the count.
     * See lessons/page-stage.md#stage-194
     */
    /**
     * It asks the page's own default question, so the round trip is graded too.
     * See lessons/page-stage.md#stage-195
     */
    ask(ASK_TITLE, ASK_OPTIONS);
    for (let i = 0; i < 60 && laneCount < 3; i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    /**
     * The question comes back off the relay, through JSON, a WebSocket and a Durable
     * Object, in both panels. Compared by code point, which the detail prints.
     * See lessons/page-stage.md#stage-196
     */
    /**
     * It reads the slot only while the slot is on the picture (`on`): a detached slot
     * held the text while nothing was visible.
     * See lessons/page-stage.md#stage-197
     */
    const seenAt = (id) => {
      const panel = byId.get(id).panel;
      const slot = panel.slots.caption;
      const lab = slot.querySelector('.pos-choice-l');
      const btns = [...slot.querySelectorAll('button')].map((b) => b.textContent);
      return { on: captionOn(panel), title: lab ? lab.textContent : null, options: btns };
    };
    const heard = SHOWN_ON.map((id) => [id, seenAt(id)]);
    const intact = heard.every(([, h]) => h.on && h.title === ASK_TITLE
      && h.options.length === ASK_OPTIONS.length
      && h.options.every((o, i) => o === ASK_OPTIONS[i]));
    const points = (t) => [...(t || '')].map((c) => (c.codePointAt(0) > 127
      ? `U+${c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}` : c)).join('');
    A('the question comes back off the relay with every character it was sent with',
      intact,
      heard.map(([id, h]) => `${id}${h.on ? '' : ' (slot NOT on the picture)'}: `
        + `${points(h.title)} [${h.options.map(points).join(' | ')}]`)
        .join(', ') + `, against ${points(ASK_TITLE)} [${ASK_OPTIONS.map(points).join(' | ')}]`);
    const sc = strip.el;
    const sctx = sc.getContext('2d');
    // Down the middle of the plot, clear of the gutter and of the axis, in the
    // canvas's OWN pixels: reading a device ratio off a rect is what broke when
    // the rect was zero, and the backing store is the thing being sampled.
    const col = Math.round(sc.width * 0.72);
    const top = Math.round(sc.height * 0.25);
    /**
     * Stop at the lanes' bottom, not the canvas's: the ground under `minHeight` is darker.
     * `state.lanesH` is CSS px, scaled by the strip's own device ratio.
     * See lessons/page-stage.md#stage-198
     */
    const st = strip.strip.state;
    const lanesBottom = Math.round((st.lanesH || 0) * (st.dpr || 1));
    const stop = Math.min(sc.height - 2, lanesBottom - 1);
    const lum = [];
    for (let y = top; y < stop; y++) {
      const [r, g2, b] = sctx.getImageData(col, y, 1, 1).data;
      lum.push(r + g2 + b);
    }
    // The band is the typical row; a rule would be a row far below it.
    const sorted = [...lum].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    const darkest = sorted[0];
    A('no black rule between the lanes',
      // Threshold 8 sits between the two measured states: a drop of 0 when fixed and
      // 21 with the defect, over 74 rows.
      // See lessons/page-stage.md#stage-199
      laneCount >= 3 && lum.length > 20 && median - darkest < 8,
      `${laneCount} lanes, and over ${lum.length} rows the lane ground reads ${median} and the darkest row ${darkest}, a drop of ${median - darkest}`);

    await pictureDrill();

    if (LIGHT) {
      for (const [label, pass, detail] of held) d.assert(label, pass, detail);
      d.log('left for the deep run: the publisher, the show over WebRTC and its sound, '
        + 'the recording, its trip to the archive and the diagram measure (DEMO_DEEP=1)');
      return;
    }
    await showDrill();
  }

  /**
   * The picture tag, proved with frames in both tiers: a canvas captured into a
   * `<video>`, same `requestVideoFrameCallback` and verbs. Stopping the drawing is the
   * stall. Three negative controls keep a timer-driven `receiving` from passing.
   * See lessons/page-stage.md#stage-200
   */
  async function pictureDrill() {
    const now = 1e6;
    const fx = [
      ['nothing pressed, no frame', pictureOf({ now }), 'unknown'],
      ['pressed, no frame yet', pictureOf({ now, startedAt: now - 5000 }), 'coming'],
      ['pressed 80 s ago, still no frame', pictureOf({ now, startedAt: now - 80000 }), 'coming'],
      ['pressed 100 s ago, never a frame', pictureOf({ now, startedAt: now - 100000 }), 'unknown'],
      ['a frame 0.1 s ago', pictureOf({ now, lastFrameAt: now - 100 }), 'online'],
      ['a frame 1.9 s ago', pictureOf({ now, lastFrameAt: now - 1900 }), 'online'],
      ['a frame 2.1 s ago', pictureOf({ now, lastFrameAt: now - 2100 }), 'offline'],
    ];
    const bad = fx.filter(([, got, want]) => got !== want);
    A('the picture rule goes live only on a frame and stalls 2 s after the last one',
      bad.length === 0,
      bad.length ? bad.map(([n, got, want]) => `${n}: ${got}, wanted ${want}`).join(', ')
        : fx.map(([n, got]) => `${n}: ${PIC_SAYS[got]}`).join(', '));

    const tags = picTags();
    const says = () => tags.map((t) => t.state());
    const shown = () => panels.filter((p) => p.picTag)
      .map((p) => getComputedStyle(p.panel.slots.tag).display !== 'none');
    const all = (st) => tags.length > 0 && says().every((x) => x === st);
    const wait = async (ok, ms) => {

  async function showDrill() {

     * Is there a caret on the archive while it plays, and does it move: separates a deck
     * not advancing from a caret not painted. Ink is tested against a column 15 px away.
     * See lessons/page-stage.md#stage-236
     */
    const masterNote = () => {
      const st = archiveMaster && archiveMaster.stats ? archiveMaster.stats() : null;
      if (!st) return 'none attached';
      return `ticks ${st.ticks}, backstop ${st.backstopTicks}, driving ${st.driving}`;
    };
    let caretMoved = null, caretLit = null, caretDetail = 'there was no recording to play';
    if (av && Number.isFinite(recordedMs) && recordedMs > 1200) {
      /**
       * Get back to the start and confirm it before playing; if it cannot, say so rather
       * than blame the caret.
       * See lessons/page-stage.md#stage-237
       */
      /**
       * Report which half refuses, the element or the deck. Seek to 1.0 s, not 0, which a
       * browser can satisfy by doing nothing.
       * See lessons/page-stage.md#stage-238
       */
      const REWIND_TO = 1.0;
      archiveCommand.seek(REWIND_TO * 1000);
      let rewound = false;
      for (let i = 0; i < 40 && !rewound; i++) {
        await new Promise((r) => setTimeout(r, 50));
        rewound = Math.abs(st.readout().pos / 1000 - REWIND_TO) < 0.4;
      }
      if (!rewound) {
        const el = Math.abs(av.currentTime - REWIND_TO) < 0.4;
        caretDetail = `asked the archive back to ${REWIND_TO.toFixed(2)}s of `
          + `${(recordedMs / 1000).toFixed(2)}s and it did not go: the ELEMENT is at `
          + `${av.currentTime.toFixed(2)}s (${el ? 'it moved' : 'it refused'}, ended=${av.ended}, `
          + `seekable=${av.seekable.length ? `${av.seekable.start(0).toFixed(2)}..${av.seekable.end(0).toFixed(2)}` : 'nothing'}) `
          + `and the DECK is at ${(st.readout().pos / 1000).toFixed(2)}s, `
          + `so ${el ? 'the deck is not following the element' : 'the file will not seek backwards'}`
          + ` [master ${masterNote()}]`;
      }
      archiveCommand.play();
      await new Promise((r) => setTimeout(r, 250));
      const pA = st.readout().pos;
      await new Promise((r) => setTimeout(r, 800));
      const pB = st.readout().pos;
      archiveCommand.pause();
      caretMoved = pB - pA;

      const dpr = st.state.dpr || 1;
      const colOf = (px) => Math.round((st.state.gutterPx + px) * dpr);
      const g = strip.el.getContext('2d');
      const lumAt = (col) => {
        if (col < 1 || col >= strip.el.width - 1) return null;
        const d = g.getImageData(col, 0, 1, Math.max(1, strip.el.height - 2)).data;
        let best = 0;
        for (let i = 0; i < d.length; i += 4) best = Math.max(best, d[i] + d[i + 1] + d[i + 2]);
        return best;
      };
      const here = lumAt(colOf(st.timeToX(pB)));
      const away = lumAt(colOf(st.timeToX(pB) - 15));
      caretLit = here != null && away != null ? here - away : null;
      if (rewound) {
        caretDetail = `the playhead went ${(pA / 1000).toFixed(2)}s to ${(pB / 1000).toFixed(2)}s `
          + `and its column reads ${here ?? 'off canvas'} against ${away ?? 'off canvas'} 15 px away`;
      }
    }
    A('the archive has a caret, and it is at a playhead that moves while the recording plays',
      caretMoved != null && caretMoved > 100 && caretLit != null && caretLit > 30,
      caretDetail);

    /**
     * A new run clears the last one, driven through the record press. It asserts the whole
     * sweep (panel, lists, option lanes, polls), with no wait: `clearRun` runs on the first
     * line of `startShow`.
     * See lessons/page-stage.md#stage-239
     */
    {
      const before = {
        questions: QUESTIONS.length, answers: ANSWERS.length, options: OPTIONS.length,
        video: !!archive.panel.stage.querySelector('video'),
      };
      await toggleShow();
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const polls = SHOWN_ON.filter((id) => byId.get(id).panel.slots.caption.children.length);
      const after = {
        questions: QUESTIONS.length, answers: ANSWERS.length, options: OPTIONS.length,
        video: !!archive.panel.stage.querySelector('video'),
        /**
         * An empty panel, not a card: nothing took the recording's place.
         * See lessons/page-stage.md#stage-240
         */
        empty: pictureIn(archive.panel).length === 0,
      };
      A('a new run clears the recording, the questions and the answers',
        before.video && before.questions > 0
        && !after.video && after.empty && after.questions === 0
        && after.answers === 0 && after.options === 0 && polls.length === 0,
        `before: ${before.questions} question(s), ${before.answers} answer(s), `
        + `${before.options} option lane(s), a recording in the panel. `
        + `after one press: ${after.questions}, ${after.answers}, ${after.options}, `
        + `${after.video ? 'still a recording' : 'no recording'}, `
        + `${pictureIn(archive.panel).length} picture element(s) left in the panel, `
        + `${polls.length} poll(s) left in a footer`);
      // Put the page back where the drill found it rather than leaving a show
      // running behind every other check's back.
      /**
       * Stop and release here: no trailing harness press ends the show. `upload: false`,
       * so this second show spends none of the five hourly upload sessions.
       * See lessons/page-stage.md#stage-241
       */
      await stopShow({ upload: false });
      dropTransport();
      if (hold) { try { hold.close(); } catch { /* gone */ } hold = null; }
      transport = null;
      paintTransport();
    }

    /**
     * `getComputedTextLength()` answers 0 under `display: none`, so the check selects each
     * tab and waits for the `ResizeObserver` re-render, reports `measured`, then restores the tab.
     * See lessons/page-stage.md#stage-242
     */
    const wasAt = tabs.at();
    for (const [where] of DIAGRAMS) {
      tabs.go(where, { push: false });
      for (let i = 0; i < 40 && !DIAGRAMS.find(([w]) => w === where)[1].measured; i++) {
        await new Promise((r) => requestAnimationFrame(r));
      }
    }
    tabs.go(wasAt, { push: false });
    const unmeasured = DIAGRAMS.filter(([, dg]) => !dg.measured).map(([w]) => w);
    A('nothing in the diagram had to be shortened to fit, in either panel that carries it',
      unmeasured.length === 0 && cutLines.length === 0,
      unmeasured.length
        ? `${unmeasured.join(' and ')} never measured any type, so a clean result there means nothing`
        : cutLines.length
          ? cutLines.join(' · ')
          : `every label, sub and note fitted its box in both panels`);

    // The only place the held asserts reach the report.
    // See lessons/page-stage.md#stage-243
    for (const [label, pass, detail] of held) d.assert(label, pass, detail);
  }

  // The frame counter has to have moved before the picture can be read back, so
  // the checks wait for a few frames rather than racing the first one.
  let warmed = 0;
  const warm = () => { if (++warmed >= 6) checks(); else requestAnimationFrame(warm); };
  requestAnimationFrame(warm);

  /**
   * A diagram, `how: true` and no title: `diagram.mjs` supplies the `How it works`
   * heading and refuses a page's own.
   * See lessons/page-stage.md#stage-244
   */
  /**
   * `how` and `atEnd` are the third argument, not part of the spec.
   * See lessons/page-stage.md#stage-245
   */
  /**
   * The diagram lives in the control room tab; the audience gets none. Without `atEnd`,
   * which appends to `document.body`, it stays in the tab.
   * See lessons/page-stage.md#stage-246
   */
  /**
   * One transport and a recording that travels: the container publishes, and the
   * control room shows the recorder, the local copy and the playback. `join: false`
   * with its one real arrow, since playback comes from R2, not IndexedDB.
   * See lessons/page-stage.md#stage-247
   */
  const DIAGRAM_SPEC = {
    caption: 'The show arrives over WebRTC, and its recording goes from this browser to R2 and back.',
    nodes: [
      { id: 'ctrl', label: 'Browser', sub: 'control room', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'recorder', label: 'MediaRecorder', sub: '700k, 2s',
            note: 'Records the picture this control room receives over WHEP from Stream, the '
                + 'same one the audience sees, in 2 s pieces.' },
          { id: 'idb', label: 'IndexedDB', sub: 'this device',
            note: 'Keeps each 2 s piece while the show runs, so the local copy grows as it '
                + 'goes. One show is kept at a time, and Clear removes it.' },
          { id: 'playback', label: 'playback', sub: 'from R2',
            note: 'Plays the recording from R2 once it is there, by its public URL. When R2 '
                + 'is off, as in a harness run, it plays this browser\u2019s copy instead.' },
        ] },
      /**
       * One Cloudflare box with its parts in it, the publisher among them, joined by arrows.
       * See lessons/page-stage.md#stage-248
       */
      /**
       * `set: true` with its one real arrow, Publisher to Stream: the other parts share an
       * account and are not a pipeline.
       * See lessons/page-stage.md#stage-249
       */
      { id: 'cf', label: 'Cloudflare', sub: 'one account', kind: 'cloud', tech: 'cloudflare', set: true,
        children: [
          { id: 'pub', label: 'ffmpeg', sub: 'container',
            note: 'Publishes the show over **WHIP** while somebody holds its socket. Pressing '
                + 'Start show holds it, and a cold wake takes about 22 s.' },
          { id: 'stream', label: 'Stream', sub: 'WebRTC',
            note: 'Takes the picture in over **WHIP** and hands it out over **WHEP**, which are '
                + 'the publish and subscribe handshakes for one WebRTC connection. It records '
                + 'nothing, which is why the control room has to.' },
          { id: 'r2', label: 'R2 storage', sub: '24MiB, 6h',
            note: 'Holds the finished recording as one object, uploaded when the show stops. A '
                + 'HEAD afterwards is what proves it is readable, and it is deleted after 6 hours.' },
          /**
           * The note says why the question is not in the video, the thing a reader assumes.
           * See lessons/page-stage.md#stage-250
           */
          { id: 'relay', label: 'Relay object', sub: 'WebSocket',
            note: 'Carries questions out and answers back over one room, and stores none of '
                + 'them. It has to be a side channel: Cloudflare\u2019s transcode strips **all '
                + 'in-band metadata**, so a question buried in the video would reach nobody.' },
        ] },
      /**
       * `join: false`: a picture arriving does not produce a press.
       * See lessons/page-stage.md#stage-251
       */
      { id: 'aud', label: 'Browser', sub: 'audience', kind: 'here', tech: 'browser', join: false,
        children: [
          { id: 'screen', label: 'video', sub: 'WebRTC',
            note: 'The show over WHEP. A question is shown the moment it arrives, because on '
                + 'WebRTC the picture is only a fraction of a second behind it.' },
          { id: 'answer', label: 'answer', sub: 'one press',
            note: 'One press per person, sent the moment it is made. The control room times it '
                + 'on arrival, so an answer lands on the recording where it really happened.' },
        ] },
    ],
    links: [
      { from: 'pub', to: 'stream',
        note: 'The film, published as one WebRTC leg.' },
      { from: 'stream', to: 'screen', label: 'WebRTC',
        note: 'What the audience subscribes to over WHEP.' },
      { from: 'recorder', to: 'idb',
        note: 'A 2 s piece at a time, each committed before it is counted.' },
      { from: 'idb', to: 'r2', label: 'one webm',
        note: 'Read back out of IndexedDB and uploaded as one object when the show stops, '
            + 'with its progress in the log.' },
      { from: 'r2', to: 'playback', label: 'https', back: true,
        note: 'The element plays the R2 URL itself, and the log names the address it is '
            + 'playing.' },
      { from: 'ctrl', to: 'relay', label: 'questions',
        note: 'One question at a time, repeated every 2s so somebody arriving late sees the '
            + 'current one rather than nothing.' },
      { from: 'relay', to: 'screen', label: 'questions',
        note: 'The question and its options, drawn as buttons over the picture.' },
      { from: 'answer', to: 'relay', label: 'answers', back: true,
        note: 'One press, sent immediately, and nowhere near R2.' },
    ],
  };
  /**
   * No `atEnd`: with it the component appends to `document.body` and ignores the host.
   * See lessons/page-stage.md#stage-252
   */
  // One diagram, in the control room.
  // See lessons/page-stage.md#stage-253
  const dgRoom = createDiagram(tabs.panel('controlroom'), DIAGRAM_SPEC, { how: true });
  const DIAGRAMS = [['controlroom', dgRoom]];
  const cutLines = DIAGRAMS.flatMap(([where, dg]) =>
    (dg?.cuts ?? []).map((c) => `${where}/${c.id}: its ${c.where} was cut to "${c.shown}"`));
  if (cutLines.length) d.log(`the diagram shortened ${cutLines.length} to fit: ${cutLines.join(' · ')}`, 'warn');

  d.ready();
  guard(d);
</script>

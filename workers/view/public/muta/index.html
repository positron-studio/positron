<style>
  /* The maker's own colour, on the arc only: --hi keeps its site-wide meaning, and
     the hardware-moved and off states win because their rules come later.
     See lessons/page-muta.md#muta-1 */
  .plaits-panel .pos-knob-arc { stroke: var(--mi-teal-lit); }
  /* A running hand's glyph takes the instrument's colour where shell.css uses --hi.
     See lessons/page-muta.md#muta-2 */
  .plaits-panel .pos-knob-hand[data-on="1"] { color: var(--mi-teal-lit); }

  /* Two grids as one child of the row; min-width 0 keeps the drag in the row, not the
     page. 21 px of block padding insets the ink equally: 17 px of empty cell beside
     the 50.6 px dial in an 84 px pitch, plus the 4 px --rows-pad exceeds --rows-gap.
     See lessons/page-muta.md#muta-3 */
  /* It scrolls rather than squeezes: flex 0 0 auto on the grids, or at 375 px the
     first grid shrinks and cuts HARMONICS and MORPH mid-word.
     See lessons/page-muta.md#muta-4 */
  .plaits-knobs {
    display: flex; align-items: start; min-width: 0; overflow-x: auto;
    padding-block: 21px;
  }
  .plaits-knobs > * { flex: 0 0 auto; }
  /* A rule between the two grids, because a plain gap reads as one more column gap.
     --rows-gap is at :root (16 px); --panel-gap needs a .panel ancestor this lacks.
     align-items: start, or the shorter grid stretches off the taller one's lattice.
     See lessons/page-muta.md#muta-5 */
  .plaits-knobs > :first-child {
    border-right: 1px solid var(--line);
    padding-right: var(--rows-gap);
    margin-right: var(--rows-gap);
  }
  /* The knobs group centres only where it fits; see the min-width block at the foot.
     See lessons/page-muta.md#muta-6 */

  /* flex 0 0 auto: the button is the fixed member of .muta-end, so on a phone the
     selector gives way instead of the button's words squeezing.
     See lessons/page-muta.md#muta-7 */
  .muta-tone { flex: 0 0 auto; }

  /* The button and the picker travel as one group at the plate's far end.
     --pick-w is the longest model name, granular formant at 16 characters, so the box
     holds still as the model changes. The ellipsis past it is the kit's.
     See lessons/page-muta.md#muta-8 */
  .muta-end { display: flex; align-items: center; gap: var(--ctl-gap); min-width: 0; }
  .muta-end .pos-pick { --pick-w: 16ch; }

  /* Phone: the group takes the line and the picker is the flexible member.
     nowrap, because shell.css wraps .pos-pick here and the die drops a row below the
     arrows. After the rule it overrides: order wins, not weight. Graded by shot 375.
     See lessons/page-muta.md#muta-9 */
  @media (max-width: 560px) {
    .plaits-panel .muta-end { flex: 1 1 100%; }
    .muta-end .pos-pick { width: auto; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; }
  }

  /* Centre the 483 px group only where it fits: the row is the window less 42 px, so
     it stops fitting at 525. Not safe center (unverified on Safari) and not
     @container (containment collapses the fit-content surface).
     See lessons/page-muta.md#muta-10 */
  @media (min-width: 561px) {
    .plaits-knobs { justify-content: center; }
  }
</style>

<script type="module">
  // Runs Plaits' own plaits/dsp/voice.cc compiled unmodified by emscripten from a
  // pinned commit, in an AudioWorklet at 128 frames, not a ScriptProcessorNode.
  // Eight Voice copies share one Patch for polyphony; stolen voices are reported.
  // See lessons/page-muta.md#muta-11
  import { mount, guard, el } from '/shell/shell.mjs';
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createControlGrid } from '/shell/control-grid.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createMidi } from '/shell/midi.mjs';
  /* The sustain pedal is the kit's pedal.mjs.
     See lessons/page-muta.md#muta-12 */
  import { createPedal, PEDAL_SAYS } from '/shell/pedal.mjs';
  import { createPicker } from '/shell/picker.mjs';
  /* See lessons/page-muta.md#muta-13 */
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { createEngineNode } from '/shell/engine-node.mjs';

  // One artefact, one shim, one pinned commit. vendor/ and build/ also hold Warps,
  // which build/build.sh still compiles and nothing here fetches.
  // See lessons/page-muta.md#muta-14
  const PLAITS_URL = '/muta/vendor/plaits.wasm';

  // The sixteen models in the order plaits/dsp/voice.cc:38 registers them, because
  // plaits_active_engine() returns an index into this order.
  // See lessons/page-muta.md#muta-15
  const MODELS = [
    'virtual analog', 'waveshaping', 'two operator FM', 'granular formant',
    'harmonic', 'wavetable', 'chord', 'speech',
    'swarm', 'filtered noise', 'particle noise', 'string',
    'modal', 'bass drum', 'snare drum', 'hi-hat',
  ];

  // Parameter ids, also spelled out in demo/muta/build/plaits_shim.cc and
  // demo/muta/muta-worklet.js; a mismatch moves the wrong control instead of throwing.
  // 7 and 9 (the triggers) are gone: a gate is per voice, plaits_note_on and drone.
  // See lessons/page-muta.md#muta-16
  const P = {
    engine: 0, note: 1, harmonics: 2, timbre: 3, morph: 4,
    decay: 5, lpgColour: 6, level: 8, levelPatched: 10,
    fmAmount: 11, timbreModAmount: 12, morphModAmount: 13,
  };

  // The wasm reports plaits_max_voices(), but the control is built before the fetch, so
  // this is typed once and a check grades it against the wasm.
  // See lessons/page-muta.md#muta-17
  const SLIDER_MAX_VOICES = 8;

  // The chord four notes make, as intervals off the pitch control. Four rather
  // than eight so a press at the default setting never has to steal, and a
  // press at a setting below four always does.
  const CHORD = [0, 4, 7, 11];

  /* The same string as manifest.mjs's one line, which this page does not edit.
     See lessons/page-muta.md#muta-18 */
  const ONE = 'Eight voices of Emilie Gillet’s Plaits firmware, compiled unmodified '
            + 'from its own C++ to WebAssembly on the audio thread.';

  const d = mount({
    name: 'muta',
    what: ONE,
    // The wasm's size is a constant, so it is in the log, not the readout.
    // See lessons/page-muta.md#muta-19
    /**
     * Four cells that all move: render cost, share of the budget, the oscillator's
     * peak and voices up. Constants (rate, boot) are asserted and logged instead, and
     * mount() refuses an odd count.
     * See lessons/page-muta.md#muta-20
     */
    readout: {
      render: 'µs', load: '%', peak: '', sounding: '',
    },
    /**
     * See lessons/page-muta.md#muta-21
     */
    /**
     * No control row: verify.mjs presses .pos-controls, and this page has none, so it
     * dispatches its own gesture behind SELFCHECK. Test tone stays off control 0, the
     * one settleMs waits on. .pos-controls[hidden] stops an empty 14 px band.
     * See lessons/page-muta.md#muta-22
     */
    controls: [],
  });
  guard(d);

  let ctx = null, node = null, ready = null, wasmBytes = 0, wasmImports = -1;
  let bootMs = null, quiet = null, loud = null, entered = null, costPerQuantumMs = null;
  let oneVoiceMs = null, manyVoiceMs = null, fetchMs = null;
  /* wasmFetches and armedBy are snapshotted at the module's last line, before any
     gesture, so a visit can be told apart from a press.
     See lessons/page-muta.md#muta-23 */
  let wasmFetches = 0, wasmFetchesOnLoad = -1, ctxOnLoad = null, nodeOnLoad = null;
  let armedBy = null, toneDeadOnLoad = null;
  let model = 0, droning = false, meters = 0, bench = null;
  let voiceCount = SLIDER_MAX_VOICES, trim = 1;
  let lastNote = null, lastOff = null, chord = null, blockRule = null;
  let last = { peak: 0, blocks: 0, renders: 0, held: 0, poly: 0,
               blocksPerQuantum: 0, engine: -1, frames: 0 };

  // Declared above everything that closes over them, so open() and onWorklet() never
  // reach a const in its temporal dead zone.
  // See lessons/page-muta.md#muta-24
  let onReady = () => {};
  let onFirst = () => {};

  // the controls, built before boot so the page never looks broken before a press
  // See lessons/page-muta.md#muta-25
  /**
   * The voice count is a stepped knob though the hardware has no such knob, like
   * decay and colour. hand-drive.mjs refuses under about thirty steps, so no hand.
   * See lessons/page-muta.md#muta-26
   */

  /* Built with no label, so no MODEL caption shows. what is the word the arrows and
     the die use in their titles, and what a screen reader gets.
     See lessons/page-muta.md#muta-27 */
  const pick = createPicker({
    what: 'model',
    prev: () => setModel(model - 1),
    next: () => setModel(model + 1),
    random: () => setModel(Math.floor(Math.random() * MODELS.length)),
    onPick: (i) => setModel(i),
  });
  pick.options(MODELS, 0);
  /* No wrapper: the page's width rules select .pos-pick itself.
     See lessons/page-muta.md#muta-28 */

  // the panel, read off plaits/ui.cc:70-84 in the pinned source
  // See lessons/page-muta.md#muta-29
  const knobs = new Map();
  /**
   * Every knob gets an invisible hand here. It costs nothing: no socket, no relay,
   * one thread hop into a local AudioWorklet. Too coarse a control refuses one.
   * See lessons/page-muta.md#muta-30
   */
  const knobParam = new Map();
  const knob = (key, id, o) => {
    if (id != null) knobParam.set(key, id);
    // ON EVERY MOVE. There is no wire here and no relay to overrun: the
    // message crosses one thread boundary and is audible in the next render
    // quantum, which is 2.67 ms away.
    /**
     * A caller's onInput wins over the default param send; the voice count needs that.
     * See lessons/page-muta.md#muta-31
     */
    const k = createKnob({ hand: true, ...o,
      onInput: o.onInput || ((v) => send({ t: 'param', id, value: v })) });
    knobs.set(key, k);
    return k;
  };

  /**
   * No knob carries a second label, so every grid row keeps one height. TIMBRE and
   * MORPH appear twice, as rotary and attenuverter; the CV label and - + marks tell.
   * See lessons/page-muta.md#muta-32
   */
  // The attenuverters print the panel's own - and + marks, saying which half of the
  // travel is negative by position.
  // See lessons/page-muta.md#muta-33
  const MARKS = ['-', '+'];
  /**
   * Two control grids because the module's own four rotaries get a wider gap than the
   * page's extras. pitchFor makes the lattice square: max(width, height) + gap.
   * See lessons/page-muta.md#muta-34
   */
  const ownGrid = createControlGrid({
    cols: 2, gap: 10,
    items: [
      knob('pitch', P.note, { label: 'frequency', min: 24, max: 96, value: 60, home: 60 }),
      knob('harmonics', P.harmonics, { label: 'harmonics', min: 0, max: 1, value: 0.5, home: 0.5 }),
      knob('timbre', P.timbre, { label: 'timbre', min: 0, max: 1, value: 0.5, home: 0.5 }),
      knob('morph', P.morph, { label: 'morph', min: 0, max: 1, value: 0.5, home: 0.5 }),
    ],
  });
  /**
   * Attenuverters in the panel's order, plaits/drivers/pots_adc.h: TIMBRE, FM, MORPH.
   * Row two holds what the hardware gives no knob: decay and colour are alternate
   * functions of MORPH and TIMBRE, and the voice count is this page's own.
   * See lessons/page-muta.md#muta-35
   */
  const extraGrid = createControlGrid({
    cols: 3, gap: 10,
    items: [
      /**
       * The attenuverters say CV where the panel prints TIMBRE twice: a uniform grid has
       * no size or jack to tell them apart. timbre_modulation_amount scales the CV.
       * See lessons/page-muta.md#muta-36
       */
      knob('timbreMod', P.timbreModAmount,
        { label: 'timbre CV', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
      knob('fmMod', P.fmAmount,
        { label: 'fm CV', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
      knob('morphMod', P.morphModAmount,
        { label: 'morph CV', min: -1, max: 1, value: 0, home: 0, ends: MARKS }),
      knob('decay', P.decay, { label: 'decay', min: 0, max: 1, value: 0.5, home: 0.5 }),
      knob('colour', P.lpgColour, { label: 'colour', min: 0, max: 1, value: 0.5, home: 0.5 }),
      knob('voices', null,
        { label: 'voices', min: 1, max: SLIDER_MAX_VOICES, step: 1,
          value: SLIDER_MAX_VOICES, home: SLIDER_MAX_VOICES, hand: false,
          onInput: (v) => setVoices(v) }),
    ],
  });
  const knobGrid = el('div', 'plaits-knobs');
  knobGrid.append(ownGrid.el, extraGrid.el);

  // See lessons/page-muta.md#muta-37
  /* See lessons/page-muta.md#muta-38 */
  /**
   * A plain button with aria-pressed: a press arms the tone, and it is live from the
   * first frame, queueing behind the visit's own firmware fetch.
   * See lessons/page-muta.md#muta-39
   */
  const toneBtn = el('button', 'muta-tone', 'Test tone', { 'aria-pressed': 'false' });
  toneBtn.addEventListener('click', () => toggleTone());

  const scope = createWaveShape({
    reason: null,
    /* --mi-teal-lit, the panel's teal lightened from 4.27 to 7.54 contrast on this
       ground; see shell.css.
       See lessons/page-muta.md#muta-40 */
    colour: '--mi-teal-lit',
    height: 140,
    trail: 3,
  });

  /**
   * The kit's glued panel: the picture is the first row, edge to edge (pad: false).
   * full takes the page's width; the knobs centre in it where they fit, and on a
   * phone the panel was already the window's width.
   * See lessons/page-muta.md#muta-41
   */
  /**
   * The foot is the nameplate MUTA at the start and .muta-end at the far end: the
   * Test tone button then the picker. A two ended plate row is space-between, and
   * shell.css's phone block drops the name below and centres it.
   * See lessons/page-muta.md#muta-42
   */
  const endGroup = document.createElement('div');
  endGroup.className = 'muta-end';
  endGroup.append(toneBtn, pick.el);

  /* On the patchbay after a press of Join, never on a visit (engine-node.mjs). The
     control and badge sit under the panel, not in the plate; the badge says whether
     a keyboard linked in from /patchbay/ is arriving.
     See lessons/page-muta.md#muta-43 */
  const bay = createEngineNode({
    slug: 'muta', label: 'muta', accepts: ['note', 'cc'],
    playing: () => !!ctx && ctx.state === 'running' && !!node && !!ready,
    log: (line, kind) => d.log(line, kind),
  });
  const panel = createInstrumentPanel({
    viz: scope.el,
    rows: [[knobGrid]],
    plate: { name: 'MUTA', patch: endGroup },
    cls: 'plaits-panel',
    full: true,
  });

  let plaitsWave = null, scopeFrames = 0;
  const anyInk = (w) => !!w && w.some((x) => Math.abs(x) > 0.0005);
  /* a handle for a throwaway probe, behind the selfcheck gate's own flag so it
     is never present for a visitor */
  if (SELFCHECK || location.search.includes('probe=1')) window.__scopeGet = () => scope.get();

  /**
   * The picture is the ink: nothing sounding draws nothing.
   * See lessons/page-muta.md#muta-44
   */
  function paintScope() {
    if (!anyInk(plaitsWave)) {
      scope.set({ points: null, reason: null });
      return;
    }
    /* The span is the worklet's own count of frames, not a number typed here,
       so the axis follows the window rather than agreeing with it by luck. */
    const ms = scopeFrames ? (scopeFrames / (ctx ? ctx.sampleRate : 48000)) * 1000 : null;
    /* No colour here: a caller that sets a property on every update owns it, so the
       constructor's --mi-teal-lit would be silently overridden.
       See lessons/page-muta.md#muta-45 */
    scope.set({
      points: plaitsWave,
      reason: '',
      axes: { y: '\u00b11', x: ms ? `${ms.toFixed(1)} ms` : '' },
    });
  }

  /**
   * A keyboard plays the oscillator whenever the page is armed. requestMIDIAccess is
   * a prompt, so it is asked once (ensureMidi is idempotent) from the arming gesture,
   * never on load. A key holds the gate until plaits_note_off.
   * See lessons/page-muta.md#muta-46
   */
  let midi = null;
  /* midiAsks counts prompts, not a flag; midiAsksOnLoad is that count at the module's
     last line, the whole visit, and the assert requires it to be zero.
     See lessons/page-muta.md#muta-47 */
  let midiAsks = 0, midiAsksOnLoad = -1;
  /**
   * Who asked for the test tone, as opposed to droning, which is whether one runs.
   * Only the Test tone button sets it.
   * See lessons/page-muta.md#muta-48
   */
  let droneWanted = false;
  /* pedal.mjs owns the held sets, the 63/64 threshold, the change filter and panic;
     release here is one message to the worklet. The damper time is ignored: the
     shim's plaits_note_off has its own shape.
     See lessons/page-muta.md#muta-49 */
  /* A drone has nothing to let go of, so the release is swallowed here and not at
     keyUp: the pedal must still learn the key came up.
     See lessons/page-muta.md#muta-50 */
  const pedal = createPedal({
    release: (note) => { if (!droning) noteOff(note); },
    onPedal: (down, value, freed) => d.log(down ? PEDAL_SAYS.down
      : freed ? PEDAL_SAYS.freed(freed) : PEDAL_SAYS.up),
  });
  /* The Test tone button is built above, before createInstrumentPanel; toggleTone is
     a function declaration, so the listener reaches it.
     See lessons/page-muta.md#muta-51 */

  let midiNotes = 0, midiUps = 0;
  /**
   * Named functions, so the page's checks can drive the real MIDI callbacks; there is
   * no MIDI under a harness.
   * See lessons/page-muta.md#muta-52
   */
  /**
   * A key ends the test tone and plays its own note; toggleTone does the reverse.
   * The two sounds are exclusive both ways.
   * See lessons/page-muta.md#muta-53
   */
  function keyDown(note, vel) {
    midiNotes++;
    if (droning) stopTone();
    pedal.keyDown(note);
    noteOn(note, 0, (vel || 100) / 127);
  }
  function keyUp(note) {
    midiUps++;
    /* keyUp returns false when the foot took the note; true means release sent it off.
       See lessons/page-muta.md#muta-54 */
    pedal.keyUp(note);
  }
  /**
   * Controller 64, the sustain pedal, is the only controller read. Its logic is in
   * demo/shell/pedal.mjs with pedal-test.mjs; a named function so a check can drive it.
   * See lessons/page-muta.md#muta-55
   */
  function keyControl(cc, value) {
    pedal.control(cc, value);
  }

  /**
   * Opens the keyboard once, called at the top of arm() so the prompt belongs to the
   * gesture and lands before open()'s check block counts it. createMidi asks
   * asynchronously and nothing awaits it. There is no way to stop listening.
   * See lessons/page-muta.md#muta-56
   */
  function ensureMidi() {
    if (midi) return;
    midiAsks++;
    midi = createMidi({
      onDown: keyDown,
      onUp: keyUp,
      onControl: keyControl,
      log: d.log,
      /* The input count is a log line, not a state.
         See lessons/page-muta.md#muta-57 */
      onPorts: (n) => {
        d.log(n ? `${n} MIDI input${n === 1 ? '' : 's'} to listen to`
                : 'no MIDI input is plugged in yet, so nothing will arrive');
      },
    });
    d.log('a key holds its note for as long as it is down, and the sustain pedal holds '
        + 'it after that');
  }

  /**
   * The test tone is the drone: trigger_patched cleared bypasses the lowpass gate so
   * the engine runs forever. Keys and the pedal are cleared first, or a ringing key
   * is swallowed by the tone and never released.
   * See lessons/page-muta.md#muta-58
   */
  /* The pointer event that led here has usually started arming already, through the
     panel's capture listener, so this await is often already settled.
     See lessons/page-muta.md#muta-59 */
  async function toggleTone() {
    if (droning) { stopTone(); return; }
    await arm();
    send({ t: 'allOff' });
    pedal.panic();
    droneWanted = true;
    startDrone();
    toneBtn.setAttribute('aria-pressed', 'true');
  }
  /** The tone down, from wherever: the button or a key arriving. One writer for
   *  the intent, the sound and the button's own state, because three callers
   *  setting three things is how one of them gets missed. */
  function stopTone() {
    stopDrone();
    droneWanted = false;
    toneBtn.setAttribute('aria-pressed', 'false');
  }

  d.stack.add(panel.el);
  d.stack.add(bay.el);

  function send(m) { if (node) node.port.postMessage(m); }

  function setModel(i) {
    model = ((i % MODELS.length) + MODELS.length) % MODELS.length;
    pick.show(MODELS[model], model);
    send({ t: 'param', id: P.engine, value: model });
    d.log(`model ${model}, ${MODELS[model]}`);
    measureCost(model, voiceCount);
  }

  function setVoices(n) {
    voiceCount = Math.max(1, Math.round(n));
    send({ t: 'voices', n: voiceCount });
    measureCost(model, voiceCount);
  }

  /**
   * One note, at the pitch the control is showing. holdMs of 0 sustains.
   * send posts nothing while there is no worklet node, which is what stops a note
   * before the instrument is up.
   * See lessons/page-muta.md#muta-60
   */
  function noteOn(note, holdMs, level) {
    send({ t: 'noteOn', note, holdMs, level });
  }
  /** The same note, let go. `holdMs` of 0 on the way in is what makes this the
   *  thing that ends it rather than a timer decided at the key press. */
  function noteOff(note) { send({ t: 'noteOff', note }); }

  /**
   * Not rounded to a semitone: the FREQUENCY pot is continuous and NoteToFrequency
   * takes a float, so the knob and the sound agree. The chord adds whole semitones.
   * See lessons/page-muta.md#muta-61
   */
  function pitch() { return knobs.get('pitch').value(); }

  // ── the firmware, which a visit gets ────────────────────────────────────
  //
  /**
   * Everything that needs no sound device, on the visit: fetch the wasm (200,710
   * bytes off this origin) and build the cost bench. arm() alone touches a context.
   * Idempotent; a failed fetch clears the handle so a later press retries.
   * See lessons/page-muta.md#muta-62
   */
  let warmed = null;
  function warmUp() {
    if (warmed) return warmed;
    wasmFetches++;
    const t0 = performance.now();
    warmed = grab(PLAITS_URL).then((bytes) => {
      wasmBytes = bytes.byteLength;             // read BEFORE anything transfers it
      fetchMs = performance.now() - t0;
      /* The bench is a second instance on the main thread, connected to nothing, because
         performance is not exposed to an AudioWorkletGlobalScope.
         See lessons/page-muta.md#muta-63 */
      bench = makeBench(bytes);
      d.log(`${(wasmBytes / 1024).toFixed(1)} KB of WebAssembly off this site in `
          + `${fetchMs.toFixed(0)} ms, built and waiting for a finger`, 'hi');
      return bytes;
    }).catch((e) => {
      warmed = null;
      d.log(`the firmware did not arrive, so a press will ask again: ${e?.message || e}`, 'bad');
      throw e;
    });
    return warmed;
  }

  // the sound device: the only AudioContext in this file, opened only by a gesture
  // See lessons/page-muta.md#muta-64
  async function open() {
    if (ctx) return;
    const t0 = performance.now();

    // 48000 by name, because Plaits is compiled with kSampleRate = 48000 and its tables
    // are built at that rate. The rate actually granted is reported.
    // See lessons/page-muta.md#muta-65
    ctx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: 48000, latencyHint: 'interactive',
    });
    await ctx.resume();
    outSplit = ctx.createChannelSplitter(2);
    /* A rate other than 48000 puts the pitch off, so it is logged as bad.
       See lessons/page-muta.md#muta-66 */
    d.log(`the audio thread runs at ${Math.round(ctx.sampleRate)} Hz`,
      ctx.sampleRate === 48000 ? 'ok' : 'bad');

    await ctx.audioWorklet.addModule('/muta/muta-worklet.js');

    // The main thread fetches and posts bytes, not a compiled WebAssembly.Module: a
    // posted Module arrives nowhere in an AudioWorklet (headless Chrome 141). The fetch
    // is the visit's warmUp, so this await is usually already settled.
    // See lessons/page-muta.md#muta-67
    const bytes = await warmUp();

    node = new AudioWorkletNode(ctx, 'plaits-voice', { outputChannelCount: [2] });
    node.port.onmessage = (e) => onWorklet(e.data);
    // A processor that throws is dropped silently for the rest of the page's life.
    // See lessons/page-muta.md#muta-68
    node.onprocessorerror = () => d.log('the audio thread dropped the oscillator', 'bad');
    node.port.onmessageerror = () => d.log('a message from the audio thread could not be read', 'bad');

    /**
     * The worklet puts out on channel 0 and aux on channel 1, the module's two jacks;
     * the splitter takes channel 0, the jack a rack would patch.
     * See lessons/page-muta.md#muta-69
     */
    node.connect(outSplit);
    outSplit.connect(ctx.destination, 0);
    d.log(`audio context ${ctx.state} at ${Math.round(ctx.sampleRate)} Hz`);

    const waitReady = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('the worklet never answered')), 5000);
      onReady = (m) => { clearTimeout(timer); resolve(m); };
    });
    // Time to the first rendered sample, not the handshake; the worklet announces it
    // from inside process().
    // See lessons/page-muta.md#muta-70
    const waitFirst = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('no audio was ever rendered')), 5000);
      onFirst = () => { clearTimeout(timer); resolve(performance.now()); };
    });
    // NOT TRANSFERRED. The port copies it either way, and this side keeps the
    // bytes for the cost measurement below, which needs a second instance of
    // exactly the same module rather than a second download of it.
    node.port.postMessage({ t: 'wasm', bytes, rate: ctx.sampleRate });
    /* See lessons/page-muta.md#muta-71 */
    ready = await waitReady;
    wasmImports = ready.imports;
    trim = ready.trim;
    // A failed boot still reports, so the check block runs and the assert shows the numbers.
    // See lessons/page-muta.md#muta-72
    /* The clock starts at the touch; the download is timed separately in warmUp.
       See lessons/page-muta.md#muta-73 */
    try {
      bootMs = (await waitFirst) - t0;
      d.log(`first quantum ${bootMs.toFixed(0)} ms after the panel was touched`, 'ok');
    } catch (e) {
      d.log(String(e.message || e), 'bad');
    }

    d.log(`${(wasmBytes / 1024).toFixed(1)} KB of WebAssembly, ${wasmImports} imports, `
        + `${fetchMs == null ? '?' : fetchMs.toFixed(0)} ms to fetch on the visit and `
        + `${bootMs == null ? '?' : bootMs.toFixed(0)} ms from the touch to the first sample`, 'hi');
    d.log(ready.build);
    // The 210.1 MB is a published zip, not a page weight (plans/plan-vcv-modules.md §9.3).
    // See lessons/page-muta.md#muta-74
    d.log(`this repository's own yardsticks: scsynth.wasm is 1740.8 KB booting in 747 ms, `
        + `and the only shipped whole-Rack web build publishes a 210.1 MB zip`);
    // Everything the DSP says about itself, read out of the wasm rather than
    // typed here a second time.
    d.log(`${ready.engines} models, ${ready.blockSize} frames a block, `
        + `${Math.round(ready.dspRate)} Hz`);
    // What eight voices cost in memory, read off the shim's types. Allocator buffers
    // cannot be shared: voice.cc:56 frees one before every engine.
    // See lessons/page-muta.md#muta-75
    d.log(`${ready.maxVoices} voices at ${ready.voiceBytes} bytes each, with `
        + `${(ready.allocBytes / 1024).toFixed(0)} KB of engine workspace apiece`);
    if (!ready.rateOk) {
      d.log(`this browser gave ${Math.round(ready.hostRate)} Hz and Plaits is compiled for `
          + `${Math.round(ready.dspRate)} Hz, so the pitch is wrong by that ratio`, 'bad');
    }

    /**
     * Every knob is pushed at boot, so the DSP holds what the controls show. It also
     * sends parameter 1, the note the scope's time base locks to.
     * See lessons/page-muta.md#muta-76
     */
    for (const [key, k] of knobs) {
      const id = knobParam.get(key);
      if (id != null) send({ t: 'param', id, value: k.value() });
    }

    setVoices(knobs.get('voices').value());

    // The bench was already built in warmUp. Two prices, because the cell shows only
    // the current setting and the eighth voice's cost is the interesting one.
    // See lessons/page-muta.md#muta-77
    oneVoiceMs = costOf(model, 1);
    measureCost(model, voiceCount);
    manyVoiceMs = costPerQuantumMs;
    d.log(`one voice ${(oneVoiceMs * 1000).toFixed(0)} µs and ${voiceCount} voices `
        + `${(manyVoiceMs * 1000).toFixed(0)} µs, against the 2667 µs those 128 frames last`);
    d.log('render and load are how long the oscillator takes to produce 128 frames at '
        + 'the voice count set above, and what share that is of the 2.67 ms those frames '
        + 'last. Measured on the main thread against a second copy of the wasm, '
        + 'because an AudioWorklet has no clock in it');
    d.log(`the mix is trimmed to ${trim.toFixed(3)} at ${voiceCount} voices, so eight of `
        + 'them never sum past the end of the graph');

    // A silence control first: 600 ms of an untriggered voice must read near zero.
    // Wait for the meter counter to move, since last.peak starts at 0.
    // See lessons/page-muta.md#muta-78
    const before = meters;
    await sleep(600);
    quiet = meters > before ? last.peak : null;
    d.log(quiet == null ? 'the audio thread reported nothing in 600 ms'
                        : `untriggered peak ${quiet.toFixed(6)} out of the oscillator`,
          quiet == null ? 'bad' : '');

    /**
     * The measuring plays only under SELFCHECK: a self-check never runs for a visitor.
     * The silence control above plays nothing, so it stays outside the gate.
     * See lessons/page-muta.md#muta-79
     */
    await ifSelfcheck(async () => {
      const mid = meters;
      pluck();
      await sleep(600);
      loud = meters > mid ? last.peak : null;
      await measureChord();
    }, { log: d.log,
         say: 'the pluck and the chord that measure this page are checks, so they run '
           + 'under a harness and never for somebody who just touched the panel' });

    await d.run('check');
  }

  /** Fetch one artefact and say which URL failed rather than which fetch did. */
  async function grab(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url} answered ${res.status}`);
    return res.arrayBuffer();
  }

  /**
   * Four held notes. Gates are never released, so the shim keeps four voices active
   * and renders / blocks divides cleanly. They still decay (voice.cc:90 triggers on
   * the rising edge). Everything before is stopped, or the chord is five voices.
   * See lessons/page-muta.md#muta-80
   */
  async function measureChord() {
    send({ t: 'allOff' });
    await sleep(150);
    const root = pitch();
    for (const i of CHORD) noteOn(root + i, 0);
    await sleep(320);

    const a = { ...last, n: meters };
    await sleep(420);
    const b = { ...last, n: meters };

    chord = { held: b.held, peak: b.peak, poly: b.poly };
    // A zero delta satisfies renders === held * blocks and measures nothing: both sides
    // must have moved across two different meter reports.
    // See lessons/page-muta.md#muta-81
    blockRule = {
      dBlocks: b.blocks - a.blocks,
      dRenders: b.renders - a.renders,
      held: a.held,
      steady: a.held === b.held,
      reports: b.n - a.n,
    };
    d.log(`a chord of ${CHORD.length} on ${b.held} voices, peak ${b.peak.toFixed(3)}`);
    send({ t: 'allOff' });
    await sleep(80);
  }

  /**
   * What N voices cost, on the bench on the main thread, because an AudioWorklet has
   * no performance clock. A DSP floor, not callback load. It drones, since a free
   * voice is not rendered; models differ sevenfold, so it is re-measured per change.
   * See lessons/page-muta.md#muta-82
   */
  function makeBench(bytes) {
    const ex = new WebAssembly.Instance(new WebAssembly.Module(bytes), {}).exports;
    if (typeof ex._initialize === 'function') ex._initialize();
    ex.plaits_init(48000);
    return { ex, op: ex.plaits_out_ptr(), ap: ex.plaits_aux_ptr() };
  }

  function costOf(engine, n) {
    const { ex, op, ap } = bench;
    ex.plaits_all_off();
    ex.plaits_set_polyphony(n);
    ex.plaits_set_param(P.engine, engine);
    // Spread, so no two voices are rendering the same note and the engines
    // cannot share a cached anything.
    for (let i = 0; i < n; i++) ex.plaits_note_on(40 + i * 5, 0);
    ex.plaits_set_drone(1);                          // gate out of the way
    // Warm up first: early calls measure the JIT tiering, and the DSP's hysteresis
    // quantizer has to settle on the new model.
    // See lessons/page-muta.md#muta-83
    for (let i = 0; i < 200; i++) ex.plaits_render(op, ap, 128);
    const N = 1000;                                // 2.7 s of audio
    const t0 = performance.now();
    for (let i = 0; i < N; i++) ex.plaits_render(op, ap, 128);
    return (performance.now() - t0) / N;
  }

  /**
   * Does stealing take the quietest voice or the oldest? Built so they disagree: an
   * older drone, louder than a newer pluck. A held gate does not sustain (voice.cc:90
   * fires on the rising edge), so the drone is the bypass. On the bench, inaudible.
   * See lessons/page-muta.md#muta-84
   */
  function stealRule() {
    if (!bench) return null;
    const { ex, op, ap } = bench;
    ex.plaits_all_off();
    ex.plaits_set_polyphony(2);
    ex.plaits_set_param(P.engine, 0);
    const loud = ex.plaits_note_on(60, 24);
    // Drones only this voice; the next note-on patches its own trigger back in.
    // See lessons/page-muta.md#muta-85
    ex.plaits_set_drone(1);
    for (let i = 0; i < 8; i++) ex.plaits_render(op, ap, 128);
    const faded = ex.plaits_note_on(67, 24);            // 6 ms of gate, then decay
    for (let i = 0; i < 150; i++) ex.plaits_render(op, ap, 128);   // 0.4 s
    const levels = [ex.plaits_voice_level(0), ex.plaits_voice_level(1)];
    const took = ex.plaits_note_on(72, 24);
    const stolen = ex.plaits_last_stolen();
    ex.plaits_all_off();
    return { held: loud, faded, levels, took, stolen };
  }

  /**
   * The oscillator is the only firmware, so its own cost is what has to fit the
   * quantum, and manyVoiceMs and costPerQuantumMs are the same reading.
   * See lessons/page-muta.md#muta-86
   */
  function measureCost(engine, n) {
    if (!bench) return;
    try {
      const per = costOf(engine, n);
      const budget = (128 / 48000) * 1000;          // 2.667 ms of wall clock
      costPerQuantumMs = per;
      d.set('render', (per * 1000).toFixed(0));
      d.set('load', ((per / budget) * 100).toFixed(2));
    } catch (e) {
      d.log(`the cost could not be measured: ${e.message || e}`, 'bad');
    }
  }

  function onWorklet(m) {
    if (!m) return;
    if (m.t === 'ready') { onReady(m); return; }
    if (m.t === 'fail') { d.log(m.why, 'bad'); return; }
    if (m.t === 'entered') {
      entered = m;
      d.log(`the audio thread ran the processor, ${m.chans} channels of ${m.frames} frames, `
          + `wasm ${m.ready ? 'in place' : 'not yet'}`);
      return;
    }
    if (m.t === 'first') { onFirst(); return; }
    if (m.t === 'voices') {
      trim = m.trim;
      if (m.got !== m.asked) {
        d.log(`asked for ${m.asked} voices and got ${m.got}, which is all there are`, 'bad');
      }
      return;
    }
    if (m.t === 'note') {
      lastNote = m;
      d.set('sounding', m.held);
      // A stolen voice sounds like a note never played, so it is said in words.
      // See lessons/page-muta.md#muta-87
      if (m.stolen >= 0) {
        d.log(`voice ${m.voice} took note ${m.note} from note ${Math.round(m.stolenNote)}, `
            + `which was the quietest at ${m.stolenLevel.toFixed(4)}`, 'hi');
      }
      return;
    }
    if (m.t === 'noteOff') {
      lastOff = m;
      d.set('sounding', m.held);
      return;
    }
    if (m.t === 'wave') {
      plaitsWave = m.wave;
      scopeFrames = m.waveFrames || 0;
      paintScope();
      return;
    }
    if (m.t === 'meter') {
      last = m;
      meters++;
      d.set('sounding', m.held);
      /* The peak cell reads this meter: the oscillator is the last thing in the chain.
         See lessons/page-muta.md#muta-88 */
      d.set('peak', m.peak ? m.peak.toFixed(3) : '');
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function pluck() {
    if (!node) { d.log('the instrument is not on the audio thread yet', 'bad'); return; }
    // Six milliseconds of gate. `voice.cc` reads the trigger through a delay
    // line five blocks long and only re-arms once it falls under 0.1, so
    // anything shorter can be written and read back as nothing.
    noteOn(pitch(), 6);
  }

  /**
   * No switch: the firmware is ready on the visit, and the audio context opens on
   * whatever gesture comes first, because a browser makes no sound before one.
   * See lessons/page-muta.md#muta-89
   */
  let arming = null;
  let outSplit = null;

  /**
   * Returns at once when running, and resumes once ready: open() runs the check
   * block as its last act, so awaiting arming from inside it would deadlock. Midi
   * is asked first, so the prompt counts before that check block.
   * See lessons/page-muta.md#muta-90
   */
  async function arm() {
    ensureMidi();
    if (ctx && ctx.state === 'running') return;
    if (ctx && ready) { await ctx.resume(); return; }
    if (!arming) arming = open().catch((e) => { arming = null; d.fail(e); });
    await arming;
    if (ctx && ctx.state !== 'running') await ctx.resume();
  }

  /**
   * The test tone. trigger_patched bypasses the lowpass gate and acts on whatever is
   * sounding, so a note held first and droned second sustains.
   * See lessons/page-muta.md#muta-91
   */
  /**
   * Starts the drone: the lowpass gate is bypassed and the engine simply runs. One
   * attack at most, never a chord of triggers.
   * See lessons/page-muta.md#muta-92
   */
  function startDrone() {
    if (!node || droning) return;
    /* Only when somebody asked, and the refusal lives here rather than at the callers,
       so a new caller cannot miss it. toggleTone is the only writer of droneWanted.
       See lessons/page-muta.md#muta-93 */
    if (!droneWanted) return;
    /* See lessons/page-muta.md#muta-94 */
    /* The shim silences every level patched voice on a drone, so the keyboard's
       bookkeeping goes too, or a pedal lift would send offs for notes nobody holds.
       See lessons/page-muta.md#muta-95 */
    pedal.forgetKeys();
    droning = true;
    /* No note: plaits_set_drone(1) allocates one itself when nothing sounds, and a note
       sent from here would arrive after it as a second, triggered attack.
       See lessons/page-muta.md#muta-96 */
    send({ t: 'drone', on: true });
    d.log('droning, the lowpass gate is out of the way');
  }
  function stopDrone() {
    if (!node || !droning) return;
    droning = false;
    send({ t: 'drone', on: false });
    send({ t: 'allOff' });
  }

  // the checks: gradable numbers run for everybody, presses that change the sound
  // sit behind the gate
  // See lessons/page-muta.md#muta-97
  d.on('check', async () => {
    /* The patchbay on a bus inside this tab with two fake MIDI devices, so nothing
       reaches a relay and no MIDI port is asked for (engine-node.mjs). Behind the gate:
       it joins a room, and this block also runs on a visitor's first touch.
       See lessons/page-muta.md#muta-98 */
    if (SELFCHECK) await bay.check(d.assert);
    /* See lessons/page-muta.md#muta-99 */
    d.assert('the wasm compiled and needs nothing from the host',
      wasmImports === 0,
      wasmImports < 0 ? 'never compiled' : `${wasmImports} imports`);

    // Against this repository's own yardstick, plan-vcv-modules.md §9.3: scsynth.wasm
    // at 1.70 MB.
    // See lessons/page-muta.md#muta-100
    d.assert('it is smaller than this project’s other sound engine',
      wasmBytes > 0 && wasmBytes < 1740800,
      `${(wasmBytes / 1024).toFixed(1)} KB against scsynth.wasm at 1740.8 KB`);

    // A processor nobody calls and one that returns early sound the same; this tells them apart.
    // See lessons/page-muta.md#muta-101
    d.assert('the audio thread ran the processor and gave it 128 frames',
      !!entered && entered.chans === 2 && entered.frames === 128,
      entered ? `${entered.chans} channels of ${entered.frames} frames`
              : 'process() was never called');

    d.assert('the first quantum of audio was rendered',
      bootMs != null && bootMs > 0,
      bootMs == null ? 'nothing was ever rendered'
                     : `${bootMs.toFixed(0)} ms after the panel was touched`);

    /**
     * On by default, measured: the visit fetched the firmware and opened no context and
     * no worklet node. Counted at the module's last line, before any gesture.
     * See lessons/page-muta.md#muta-102
     */
    d.assert('the firmware is asked for by the visit and no sound device is',
      wasmFetchesOnLoad === 1 && ctxOnLoad === false && nodeOnLoad === false
        && wasmBytes > 0,
      `the visit made ${wasmFetchesOnLoad} fetch of the firmware and opened `
      + `${ctxOnLoad ? 'an audio context' : 'no audio context'} and `
      + `${nodeOnLoad ? 'a worklet node' : 'no worklet node'}, and the `
      + `${(wasmBytes / 1024).toFixed(1)} KB took ${fetchMs == null ? '?' : fetchMs.toFixed(0)} ms`);

    /**
     * The device is opened by a touch on the panel (armedBy is set only by that capture
     * listener), and the touch fetches nothing: one fetch, made before any gesture.
     * See lessons/page-muta.md#muta-103
     */
    d.assert('the sound device is opened by a touch on the panel, and the touch fetches nothing',
      armedBy === 'a touch on the panel' && wasmFetches === wasmFetchesOnLoad
        && !!ctx && !!node && !!ready,
      `${armedBy || 'nothing'} opened it, ${wasmFetches - wasmFetchesOnLoad} fetches since, `
      + `context ${ctx ? ctx.state : 'none'}, worklet ${node ? 'built' : 'none'}`);

    d.assert('the audio thread runs at the rate the DSP was compiled for',
      !!ready && ready.rateOk && Math.round(ready.hostRate) === 48000,
      ready ? `host ${Math.round(ready.hostRate)} Hz, DSP ${Math.round(ready.dspRate)} Hz`
            : 'never started');



    // One worklet call is 128 frames and Plaits' block is 12, so a quantum is ten or
    // eleven Render calls with the remainder carried.
    // See lessons/page-muta.md#muta-104
    const bpq = last.blocksPerQuantum;
    d.assert('one worklet call is 128 frames and ten or eleven blocks of twelve',
      last.frames === 128 && (bpq === 10 || bpq === 11),
      `${last.frames} frames, ${bpq} blocks of ${ready?.blockSize ?? '?'}`);



    // A number typed on this page (the knob's top end), graded against kMaxVoices in the wasm.
    // See lessons/page-muta.md#muta-105
    /* It also grades the stepping: 4.4 must land on exactly 4 voices.
       See lessons/page-muta.md#muta-106 */
    const vKnob = knobs.get('voices');
    const stepped = (() => {
      if (!vKnob) return null;
      const was = vKnob.value();
      vKnob.set(4.4, { from: 'hand' });
      const got = vKnob.value();
      vKnob.set(was, { from: 'hand' });
      return got;
    })();
    d.assert('the voice control reaches exactly as far as the wasm does, and lands on whole voices',
      !!ready && ready.maxVoices === SLIDER_MAX_VOICES && stepped === 4,
      ready
        ? `the knob reaches ${SLIDER_MAX_VOICES}, the wasm reports ${ready.maxVoices}, `
          + `and 4.4 landed on ${stepped}`
        : 'never started');

    // The stamp names the upstream commits and a digest over the exact source set, so a
    // native build on the board could be compared byte for byte. None has been made, so
    // this asserts only that the stamp is well formed.
    // See lessons/page-muta.md#muta-107
    /* See lessons/page-muta.md#muta-108 */
    const stamp = ready?.build ?? '';
    const sha = ready?.sourceSha ?? '';
    const wellFormed = (s, h, name) =>
      new RegExp(`^${name} [0-9a-f]{7} stmlib [0-9a-f]{7} src [0-9a-f]{16} emcc \\S+$`).test(s)
      && /^[0-9a-f]{16}$/.test(h) && s.includes(h);
    d.assert('the wasm carries the commits and the source digest it was built from',
      wellFormed(stamp, sha, 'plaits'),
      stamp || 'no stamp');

    // An upper bound and a ratio, not just a floor: greater than zero passes on a loop
    // optimised away, and the ratio says the extra voices are really rendered.
    // See lessons/page-muta.md#muta-109
    const ratio = oneVoiceMs ? manyVoiceMs / oneVoiceMs : 0;
    d.assert('every voice costs, and all of them together still fit a render quantum',
      oneVoiceMs != null && manyVoiceMs != null && oneVoiceMs > 0.001
        && ratio > voiceCount / 2 && manyVoiceMs < 2.667,
      oneVoiceMs == null ? 'never measured'
        : `one voice ${(oneVoiceMs * 1000).toFixed(0)} µs, ${voiceCount} voices `
          + `${(manyVoiceMs * 1000).toFixed(0)} µs, a factor of ${ratio.toFixed(1)}, `
          + 'of the 2667 µs those 128 frames last');

    // The stealing rule is the quietest voice, and this is the only check that tells it
    // from oldest-first, which would cut a note a listener still hears.
    // See lessons/page-muta.md#muta-110
    const sr = stealRule();
    d.assert('a note takes the quietest voice and not merely the oldest one',
      !!sr && sr.stolen === sr.faded && sr.stolen !== sr.held
        && sr.levels[sr.held] > sr.levels[sr.faded] * 2,
      sr ? `voice ${sr.held} was older and still at ${sr.levels[sr.held].toFixed(4)}, voice `
         + `${sr.faded} was newer and down to ${sr.levels[sr.faded].toFixed(4)}, and voice `
         + `${sr.stolen} was taken`
         : 'the bench was never built');

    // Layout claims are measured, one assert per alignment. Desk only: verify.mjs runs
    // at 756 px, so nothing below 560 px is graded here.
    // See lessons/page-muta.md#muta-111
    const box = (key) => knobs.get(key)?.el.getBoundingClientRect() ?? null;
    const near = (a, b) => a != null && b != null && Math.abs(a - b) < 1;

    // The four rotaries in the instrument's own two by two: FREQUENCY over TIMBRE and
    // HARMONICS over MORPH, columns and row order both.
    // See lessons/page-muta.md#muta-112
    const bFreq = box('pitch'), bHarm = box('harmonics');
    const bTimb = box('timbre'), bMorph = box('morph');
    d.assert('the instrument’s four rotaries sit two by two, in its own positions',
      near(bFreq?.x, bTimb?.x) && near(bHarm?.x, bMorph?.x) && bTimb?.y > bFreq?.y,
      bFreq && bTimb && bHarm && bMorph
        ? `frequency and timbre at ${bFreq.x.toFixed(1)} px, harmonics and morph at `
          + `${bHarm.x.toFixed(1)} px, second row ${(bTimb.y - bFreq.y).toFixed(0)} px lower`
        : 'one of the four is not on the page');

    // See lessons/page-muta.md#muta-113
    /* The divider is a line really drawn: the computed border on the first group, and
       the second group starting beyond it, so a rule that never matched goes red.
       See lessons/page-muta.md#muta-114 */
    const bTmod = box('timbreMod'), bDecay = box('decay');
    const firstGroup = document.querySelector('.plaits-knobs > *');
    const rule = firstGroup ? getComputedStyle(firstGroup) : null;
    const lineW = rule ? parseFloat(rule.borderRightWidth) : NaN;
    d.assert('the panel’s own four are divided from the added ones by a drawn line',
      near(bTmod?.x, bDecay?.x) && lineW >= 1
      && rule.borderRightStyle !== 'none'
      && bTmod && firstGroup && bTmod.x > firstGroup.getBoundingClientRect().right,
      Number.isFinite(lineW)
        ? `a ${lineW.toFixed(0)} px ${rule.borderRightStyle} line at `
          + `${firstGroup.getBoundingClientRect().right.toFixed(0)} px, and the added ones `
          + `start at ${bTmod ? bTmod.x.toFixed(0) : '?'} px on both rows`
        : 'the first group is not on the page');

    // See lessons/page-muta.md#muta-115
    /* See lessons/page-muta.md#muta-116 */
    /**
     * The dial centres land on a square lattice: one step across equals one step down
     * on the panel's own four.
     * See lessons/page-muta.md#muta-117
     */
    const cs = ownGrid.centres();
    const dx = cs.length > 1 ? cs[1].x - cs[0].x : NaN;
    const dy = cs.length > 2 ? cs[2].y - cs[0].y : NaN;
    d.assert('the panel’s four rotaries sit on a square lattice, across equalling down',
      Number.isFinite(dx) && Number.isFinite(dy) && Math.abs(dx - dy) <= 1 && dx > 40,
      Number.isFinite(dx)
        ? `${dx.toFixed(1)} px across against ${dy.toFixed(1)} px down, at a `
          + `${ownGrid.pitch()} px pitch`
        : 'the grid reported no centres');

    /**
     * The picture is the first row, then the controls, then the foot. shape() reads the
     * DOM, not the component's own list.
     * See lessons/page-muta.md#muta-118
     */
    const shape = panel.shape();
    d.assert('the panel draws the picture first, then its controls, then its foot',
      shape.length === 3 && shape[0] === 'viz' && shape[1] === 'controls'
        && shape[2] === 'plate',
      shape.join(', '));

    /**
     * The picture runs edge to edge (a viz row is pad: false), measured against the row,
     * not the window.
     * See lessons/page-muta.md#muta-119
     */
    const vizRow = panel.viz.getBoundingClientRect();
    const vizInk = scope.el.getBoundingClientRect();
    d.assert('the picture is the top row and runs to both of its edges',
      Math.abs(vizInk.left - vizRow.left) < 0.5 && Math.abs(vizInk.right - vizRow.right) < 0.5
        && vizInk.height > 100,
      `the picture spans ${vizInk.left.toFixed(1)} to ${vizInk.right.toFixed(1)} px `
      + `inside a row of ${vizRow.left.toFixed(1)} to ${vizRow.right.toFixed(1)} px, `
      + `${vizInk.height.toFixed(0)} px tall`);

    /**
     * The foot is the last row: MUTA alone at the start, the control group at the far
     * end, both ends inset equally from the row's edges.
     * See lessons/page-muta.md#muta-120
     */
    const plateRow = panel.plateRow.getBoundingClientRect();
    const nameCluster = panel.plateRow.querySelector('.pos-ipanel-name');
    const nameEnd = nameCluster?.getBoundingClientRect();
    const patchEnd = panel.patchEnd?.getBoundingClientRect();
    const plateEl = panel.plateRow.querySelector('.panel-plate');
    const plateText = plateEl?.textContent.trim();
    const rows = [...panel.el.querySelectorAll('[data-kind]')];
    const lastRow = rows[rows.length - 1];
    d.assert('the foot is the last row and reads MUTA at one end with both controls at the other',
      !!plateEl && plateText === 'MUTA' && !!nameEnd && !!patchEnd
        && lastRow === panel.plateRow
        && nameCluster.children.length === 1
        && Math.abs((nameEnd.left - plateRow.left) - (plateRow.right - patchEnd.right)) <= 1
        && nameEnd.left - plateRow.left > 4 && patchEnd.left > nameEnd.right,
      `the foot reads ${JSON.stringify(plateText ?? null)} in a start end of `
      + `${nameCluster?.children.length ?? 0} child(ren), it is `
      + `${lastRow === panel.plateRow ? 'the last row' : 'NOT the last row'} of `
      + `${rows.length}, and `
      + (nameEnd && patchEnd
        ? `the name starts ${(nameEnd.left - plateRow.left).toFixed(1)} px in against the `
          + `group ending ${(plateRow.right - patchEnd.right).toFixed(1)} px from the other edge`
        : 'one of its ends is missing'));

    /**
     * One Test tone button, first child of the group that is the plate's patch end and
     * before the selector; panel.patchEnd is read, not a class. Desk only: below
     * 560 px the name drops below the group (node demo/shot.mjs muta 375).
     * See lessons/page-muta.md#muta-121
     */
    const tone = toneBtn.getBoundingClientRect();
    const endEl = panel.el.querySelector('.muta-end');
    const pickEl = pick.el.getBoundingClientRect();
    const tones = document.querySelectorAll('.muta-tone').length;
    d.assert('the test tone button leads the group at the foot\u2019s far end, with the selector after it',
      tones === 1 && !!endEl && endEl === panel.patchEnd
        && endEl.children.length === 2
        && endEl.firstElementChild === toneBtn && endEl.lastElementChild === pick.el
        && tone.width > 0 && tone.right < pickEl.left
        && toneDeadOnLoad === false,
      `${tones} tone button on the page, ${endEl === panel.patchEnd ? 'in' : 'NOT in'} the `
      + `plate\u2019s far end, a group of ${endEl?.children.length} whose first child is `
      + `${endEl?.firstElementChild === toneBtn ? 'the button' : 'something else'}, `
      + `the button spanning ${tone.left.toFixed(1)} to ${tone.right.toFixed(1)} and the `
      + `selector starting ${pickEl.left.toFixed(1)}, `
      + `and on the visit it was ${toneDeadOnLoad ? 'dead' : 'pressable'}`);

    /**
     * The die stays on the segment's line and the name box holds the longest model
     * unclipped, rendered from MODELS rather than a typed width. The model is put back.
     * The die is found by class, not by position in pick.buttons.
     * See lessons/page-muta.md#muta-122
     */
    const die = pick.el.querySelector('.pos-pick-die')?.getBoundingClientRect();
    const seg = pick.el.querySelector('.pos-pick-seg')?.getBoundingClientRect();
    const cellEl = pick.el.querySelector('.pos-pick-cell');
    const nameEl = cellEl?.querySelector('.pos-pick-n');
    const longest = MODELS.reduce((a, b) => (b.length > a.length ? b : a));
    const wasModel = model;
    pick.show(longest, MODELS.indexOf(longest));
    const nameW = nameEl?.getBoundingClientRect().width ?? 0;
    const clipped = nameEl ? nameEl.scrollWidth - nameEl.clientWidth : 1;
    const cellW = cellEl?.getBoundingClientRect().width ?? 0;
    pick.show(MODELS[wasModel], wasModel);
    d.assert('the selector keeps its die on one line and its name box holds the longest model without clipping',
      !!die && !!seg && !!cellEl && !!nameEl
        && Math.abs(die.top - seg.top) <= 1
        && die.left >= seg.right - 1
        && clipped <= 1 && nameW > 0 && cellW > nameW,
      die && seg && nameEl
        ? `the longest of ${MODELS.length} models is ${JSON.stringify(longest)}, drawn `
          + `${nameW.toFixed(1)} px wide in a ${cellW.toFixed(1)} px box with `
          + `${clipped.toFixed(1)} px of it clipped, and the die is `
          + `${(die.top - seg.top).toFixed(1)} px off the segment's line, `
          + `${(die.left - seg.right).toFixed(1)} px after it`
        : 'the picker is missing its segment, its cell, its name or its die');

    /**
     * The panel spans the report's edges (.pos-report, the edge a visitor sees), and
     * the page does not scroll sideways. The group's width is printed beside the row's.
     * See lessons/page-muta.md#muta-123
     */
    const bPanel = panel.el.getBoundingClientRect();
    const bRead = document.querySelector('.pos-report')?.getBoundingClientRect();
    const bKnobRow = knobGrid.getBoundingClientRect();
    const group = knobGrid.lastElementChild && knobGrid.firstElementChild
      ? knobGrid.lastElementChild.getBoundingClientRect().right
        - knobGrid.firstElementChild.getBoundingClientRect().left
      : NaN;
    d.assert('the instrument starts and ends where the rest of the page does',
      !!bPanel && !!bRead && near(bPanel.x, bRead.x)
        && near(bPanel.right, bRead.right)
        && document.documentElement.scrollWidth <= document.documentElement.clientWidth,
      bPanel && bRead
        ? `the panel spans ${bPanel.x.toFixed(1)} to ${bPanel.right.toFixed(1)} px against `
          + `the report's ${bRead.x.toFixed(1)} to ${bRead.right.toFixed(1)} px, holding a `
          + `${group.toFixed(1)} px group of rotaries in a ${bKnobRow.width.toFixed(1)} px row, `
          + `and the page is ${document.documentElement.scrollWidth} px wide in a `
          + `${document.documentElement.clientWidth} px window`
        : 'the panel or the report is not on the page');

    /**
     * The rotaries' ink, not their cells (an 84 px cell holds a 50.6 px dial): centred
     * left against right, equal above and below, and the row not overflowing, since a
     * centred overflow is clipped. Desk only; below 561 px see shot.mjs muta 375.
     * See lessons/page-muta.md#muta-124
     */
    const bRow = panel.controls()[0]?.getBoundingClientRect();
    const bKnobs = knobGrid.getBoundingClientRect();
    const bGrid = ownGrid.el.getBoundingClientRect();
    const inkOf = (k) => knobs.get(k)?.el.querySelector('.pos-knob-dial')?.getBoundingClientRect() ?? null;
    const bFirst = inkOf('pitch'), bLast = inkOf('voices');
    /* The dial across and the grid down: the top of a cell is the value line, which is
       ink, while the dial's own top sits under the reserved --ctl-head slot.
       See lessons/page-muta.md#muta-125 */
    /* The group is centred in a full width row, so left and right gaps must match.
       See lessons/page-muta.md#muta-126 */
    /* The bottom is the taller grid's; voices is its last knob and the rightmost ink.
       See lessons/page-muta.md#muta-127 */
    const air = bRow && bFirst && bLast
      ? { left: bFirst.left - bKnobs.left, right: bKnobs.right - bLast.right,
          top: bGrid.top - bRow.top, bottom: bRow.bottom - bGrid.bottom }
      : null;
    d.assert('the rotaries’ ink is centred across the row and inset equally above and below',
      !!air && air.top > 16 && Math.abs(air.top - air.bottom) < 2
        && Math.abs(air.left - air.right) < 2
        && knobGrid.scrollWidth <= knobGrid.clientWidth,
      air ? `${air.left.toFixed(1)} px left of the first dial against ${air.right.toFixed(1)} px `
          + `right of the last, and ${air.top.toFixed(1)} px above the block against `
          + `${air.bottom.toFixed(1)} px below it, in a row holding `
          + `${knobGrid.scrollWidth} px of content in ${knobGrid.clientWidth} px`
          : 'the row or a dial is not on the page');

    /**
     * The keyboard prompt comes from a gesture, never a visit: midiAsksOnLoad is 0. And
     * midiAsks is 1, though arm() calls ensureMidi on every entry, which is idempotence.
     * See lessons/page-muta.md#muta-128
     */
    d.assert('the keyboard is opened by a gesture and never by a visit, and it is asked for once',
      midiAsksOnLoad === 0 && midiAsks === 1 && !!midi && typeof midi.state === 'function',
      `the visit asked ${midiAsksOnLoad} times and everything since asked `
      + `${midiAsks}, and the access now reads ${midi ? midi.state() : 'nothing open'} with `
      + `${midi ? midi.ports() : 0} input(s)`);


    /* See lessons/page-muta.md#muta-129 */

    // The marks are on exactly the three attenuverters: ends cost no height, so only
    // the count catches one gained or lost.
    // See lessons/page-muta.md#muta-130
    const marked = [...knobs.entries()]
      .map(([key, k]) => [key, [...k.el.querySelectorAll('.pos-knob-end')].map((e) => e.textContent)])
      .filter(([, m]) => m.length);
    const wantMarked = ['timbreMod', 'fmMod', 'morphMod'];
    d.assert('only the three attenuverters print the marks at the ends of their travel',
      marked.length === wantMarked.length
        && wantMarked.every((key) => marked.some(([k2]) => k2 === key))
        && marked.every(([, m]) => m.join('') === '-+'),
      marked.length
        ? `${marked.map(([k2, m]) => `${k2} ${m.join(' to ')}`).join(', ')}, and `
          + `${knobs.size - marked.length} of ${knobs.size} carry none`
        : 'no knob on the page prints its ends');

    /**
     * See lessons/page-muta.md#muta-131
     */

    // Behind the gate: these press things and change the sound. Every number is the
    // DSP's own answer, not what this page last sent.
    // See lessons/page-muta.md#muta-132
    /**
     * Everything below presses a control or makes a sound in front of whoever is
     * looking, so all of it is behind the gate.
     * See lessons/page-muta.md#muta-133
     */
    await ifSelfcheck(async () => {
      /**
       * These read loud, chord and blockRule, which only open()'s gated measuring sets,
       * so outside the gate they would log FAIL into a visitor's working page.
       * See lessons/page-muta.md#muta-134
       */
      // Both halves; the quiet one is the harder claim, since a gate stuck open always sounds.
      // See lessons/page-muta.md#muta-135
      d.assert('a press makes a sound and an untriggered voice does not',
        quiet != null && loud != null && quiet < 0.01 && loud > 0.02,
        quiet == null || loud == null ? 'the audio thread reported nothing'
          : `untriggered ${quiet.toFixed(6)}, plucked ${loud.toFixed(3)}, at a trim of `
            + `${trim.toFixed(3)}`);
      /* See lessons/page-muta.md#muta-136 */
      // voice.cc sets three envelope rates from kBlockSize, not from the size it is handed
      // (lines 135, 207, 213), so every voice must sit on the same block boundary. With N
      // voices sounding, plaits_voice_renders() advances by exactly N times blocks rendered.
      // See lessons/page-muta.md#muta-137
      const br = blockRule;
      d.assert('every voice rendered the same blocks of twelve as every other',
        !!br && br.steady && br.held > 1 && br.reports > 0 && br.dBlocks > 0
          && br.dRenders === br.held * br.dBlocks,
        br ? `${br.dRenders} voice renders against ${br.held} voices times ${br.dBlocks} blocks, `
           + `over ${br.reports} reports from the audio thread`
           : 'the chord was never measured');
      // Four voices from the DSP's own count; a note lost on the port, or four on one voice, read 1.
      // See lessons/page-muta.md#muta-138
      d.assert('four notes at once are four voices and not one voice retriggered',
        !!chord && chord.held === CHORD.length && chord.peak > 0.02,
        chord ? `${chord.held} of ${chord.poly} voices sounding at peak `
              + `${chord.peak.toFixed(3)}, against one note at ${loud == null ? '?' : loud.toFixed(3)}`
              : 'the chord was never measured');

      /**
       * Nothing sounds until something asks: the peak at the end of the chain, not the
       * droning flag. A second touch reaches arm() (the listener removed itself), the
       * path a second gesture really takes, and must still start nothing.
       * See lessons/page-muta.md#muta-139
       */
      send({ t: 'allOff' });
      await sleep(500);
      const idleQuiet = last ? last.peak : 1, idleDroning = droning;
      panel.el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      await arm();
      await sleep(500);
      const afterTouch = last ? last.peak : 1;
      d.assert('an instrument that is on by default makes no sound until the test tone or a key asks',
        idleQuiet < 0.001 && idleDroning === false && afterTouch < 0.001,
        `with it up and nothing pressed the oscillator is at ${idleQuiet.toFixed(6)}, `
        + `the page says droning ${idleDroning}, and after a second touch on the panel `
        + `it is ${afterTouch.toFixed(6)}`);

      /**
       * The real Test tone button is pressed, not startDrone, so the control is graded.
       * It is the one gesture that both opens audio and sounds; the second press must stop it.
       * See lessons/page-muta.md#muta-140
       */
      toneBtn.click();
      await sleep(500);
      const tonePeak = last ? last.peak : 0;
      const tonePressed = toneBtn.getAttribute('aria-pressed');
      /* The picture is read while the tone runs, the only sound under the gate. drawn()
         is a fact about this instant, so it is captured here for the assert below.
         See lessons/page-muta.md#muta-141 */
      const drawnP = scope.drawn();
      const crossings = anyInk(plaitsWave)
        ? plaitsWave.reduce((n, x, i) => n + (i && (plaitsWave[i - 1] <= 0) !== (x <= 0) ? 1 : 0), 0)
        : 0;
      /* See lessons/page-muta.md#muta-142 */
      toneBtn.click();
      await sleep(600);
      const toneOff = last ? last.peak : 1;
      d.assert('the test tone button is what makes the sound, and pressing it again stops it',
        tonePeak > 0.01 && tonePressed === 'true'
          && toneOff < tonePeak / 4 && toneBtn.getAttribute('aria-pressed') === 'false',
        `one press reads ${tonePeak.toFixed(4)} out of the oscillator and a second press `
        + `leaves ${toneOff.toFixed(4)}`);

      /* Reads drawnP, captured while the tone ran, not scope.drawn() now: nothing repaints
         the scope until something plays again.
         See lessons/page-muta.md#muta-143 */
      d.assert('the picture carries the oscillator’s own signal, and it is a wave rather than a slope',
        anyInk(plaitsWave) && drawnP && crossings >= 2,
        anyInk(plaitsWave)
          ? `${plaitsWave.length} samples with ${crossings} zero crossings in the window`
          : 'the oscillator had no ink in it');

      /* See lessons/page-muta.md#muta-144 */

      const want = 13;                    // bass drum, a model nothing defaults to
      setModel(want);
      pluck();
      await sleep(400);
      d.assert('a model picked here is the model the DSP reports sounding',
        last.engine === want, `asked ${want}, sounding ${last.engine}`);
      setModel(0);

      /**
       * Sustain: noteOn(60, 0) holds the gate until note off. Measures the sound 700 ms
       * in, not the released count. The negative control: 61, never held, releases
       * nothing while 60 releases one.
       * See lessons/page-muta.md#muta-145
       */
      send({ t: 'allOff' });
      send({ t: 'voices', n: 2 });
      await sleep(200);
      noteOn(60, 0, 1);
      await sleep(700);
      const sustain = last ? last.peak : 0, sustainHeld = last ? last.held : 0;
      lastOff = null;
      noteOff(60);
      await sleep(900);
      const released = lastOff;
      /* afterRelease, not quiet: the outer quiet one scope out would be shadowed, and a
         read above this declaration hits the temporal dead zone and drops the block.
         See lessons/page-muta.md#muta-146 */
      const afterRelease = last ? last.peak : 0;
      lastOff = null;
      noteOff(61);
      await sleep(150);
      const nobody = lastOff;
      d.assert('letting the key go is what ends the note, and a key nobody held ends nothing',
        afterRelease < sustain / 4 && released?.released === 1 && nobody?.released === 0,
        `the release took ${released ? released.released : 'no'} voice from `
        + `${sustain.toFixed(4)} down to ${afterRelease.toFixed(4)}, and a note nobody held `
        + `released ${nobody ? nobody.released : 'no reply'}`);

      /* The same note released early, read at the same age: Plaits pings the lowpass gate,
         so held and tapped notes otherwise decay alike. Runs after the release check,
         whose note an allOff here would kill.
         See lessons/page-muta.md#muta-147 */
      send({ t: 'allOff' });
      await sleep(150);
      noteOn(72, 0, 1);
      await sleep(100);
      noteOff(72);
      await sleep(600);
      const tapped = last ? last.peak : 0;
      d.assert('a held key keeps sounding, and a key let go at once does not',
        /* Twice, not three times: with decay at 0.5 the released note reads 0.07 to 0.17
           against the held 0.4653. The claim is that holding is audibly louder.
           See lessons/page-muta.md#muta-148 */
        sustainHeld === 1 && sustain > 0.01 && sustain > tapped * 2,
        `700 ms after the key went down the peak was ${sustain.toFixed(4)} on `
        + `${sustainHeld} voice, against ${tapped.toFixed(4)} for the same note at the `
        + `same age with the key let go after 100 ms`)

      /**
       * The model changes under a note already sounding. It compares the signal, not
       * plaits_active_engine(), which only echoes what this page sent.
       * See lessons/page-muta.md#muta-149
       */
      send({ t: 'allOff' });
      send({ t: 'voices', n: 1 });
      setModel(0);                        // virtual analog
      await sleep(150);
      noteOn(60, 0);
      /* 300 ms is about fifteen pictures (one per 8 quanta, about 21 ms); a check block
         quiet for more than 1.2 s is cut off by the harness.
         See lessons/page-muta.md#muta-150 */
      /* 400 ms of settling, and the control below gets the same, so the gate opening does
         not read as a model change.
         See lessons/page-muta.md#muta-151 */
      await sleep(400);
      const waveVA = plaitsWave ? Array.from(plaitsWave) : [];
      setModel(9);                        // filtered noise, nothing like a saw
      await sleep(300);
      const waveNoise = plaitsWave ? Array.from(plaitsWave) : [];
      noteOff(60);
      /* The same note left alone for the same 300 ms, which separates the model changing
         from the note simply moving on.
         See lessons/page-muta.md#muta-152 */
      noteOff(60);
      send({ t: 'allOff' });
      await sleep(150);
      setModel(0);
      noteOn(60, 0, 1);
      await sleep(400);
      const waveT0 = plaitsWave ? Array.from(plaitsWave) : [];
      await sleep(300);
      const waveT1 = plaitsWave ? Array.from(plaitsWave) : [];
      noteOff(60);
      /* Sorted amplitudes: compares timbre, not phase. Sample by sample a running
         oscillator differs by where each window starts the cycle.
         See lessons/page-muta.md#muta-153 */
      const spread = (a, b) => {
        const m = Math.min(a.length, b.length);
        if (!m) return -1;
        const x = a.slice(0, m).sort((p1, p2) => p1 - p2);
        const y = b.slice(0, m).sort((p1, p2) => p1 - p2);
        let w = 0;
        for (let i = 0; i < m; i++) { const dd = Math.abs(x[i] - y[i]); if (dd > w) w = dd; }
        return w;
      };
      const drift = spread(waveT0, waveT1);
      const n2 = Math.min(waveVA.length, waveNoise.length);
      const worst = spread(waveVA, waveNoise);
      /* Puts the model back: the stealing check below needs readings over 1.2x apart, and
         a model left on filtered noise changes them.
         See lessons/page-muta.md#muta-154 */
      setModel(0);
      d.assert('changing the model changes a note already held, more than time alone does',
        n2 > 0 && worst > 0.05 && worst > drift * 1.5,
        n2 ? `over ${n2} samples of a held note the two models differ by ${worst.toFixed(4)} `
           + `at worst, virtual analog against filtered noise, against ${drift.toFixed(4)} `
           + `for the same model left alone over the same 300 ms`
           : 'the picture reported no samples at all');

      /**
       * The sustain pedal through the real keyDown, keyUp and keyControl, since there is no
       * MIDI under a harness. The control is the same gesture with the pedal up.
       * See lessons/page-muta.md#muta-155
       */
      /* The control first, and it is the same gesture with nothing under the
         foot. Measured at the same age, or the pedal check would only be
         saying that a note takes a while to die. */
      send({ t: 'allOff' });
      await sleep(150);
      keyDown(60, 100);
      await sleep(200);
      keyUp(60);
      await sleep(600);
      /* Not asserted alone: with decay at 0.5 a released note is still near 0.25 600 ms
         later. The ratio below carries the meaning.
         See lessons/page-muta.md#muta-156 */
      const noPedal = last ? last.peak : 0;
      /* The control is asserted against the held note, not zero, and on its own: a check
         block quiet longer than the harness's patience is cut off, and the pedal
         measurement is 2.7 s.
         See lessons/page-muta.md#muta-157 */
      d.assert('a key let go is quieter than the same key still held down',
        noPedal > 0 && noPedal < sustain,
        `600 ms after the key came up the peak is ${noPedal.toFixed(4)}, against `
        + `${sustain.toFixed(4)} for a key that was never let go`);

      send({ t: 'allOff' });
      await sleep(150);
      keyControl(64, 127);
      keyDown(60, 100);
      await sleep(200);
      keyUp(60);
      await sleep(600);
      const onPedal = last ? last.peak : 0;
      keyControl(64, 0);
      await sleep(800);
      const offPedal = last ? last.peak : 0;
      d.assert('the sustain pedal holds a note after the key comes up, and letting it go ends it',
        onPedal > noPedal * 2 && offPedal < onPedal / 2,
        `at the same age the peak is ${onPedal.toFixed(4)} with the pedal down against `
        + `${noPedal.toFixed(4)} without it, and 800 ms after the pedal came up it is `
        + `${offPedal.toFixed(4)}`);

      /**
       * A key still ringing when the drone starts must not become a second endless drone
       * (plaits_set_drone clears every trigger). Compared against a drone started with
       * nothing sounding, so a quiet drone cannot pass it.
       * See lessons/page-muta.md#muta-158
       */
      send({ t: 'allOff' });
      droneWanted = true;
      startDrone();
      await sleep(500);
      const cleanDrone = last ? last.peak : 0;
      stopDrone();
      droneWanted = false;
      send({ t: 'allOff' });
      await sleep(250);
      keyDown(55, 100);
      await sleep(250);
      droneWanted = true;
      startDrone();
      await sleep(500);
      const droneOverKey = last ? last.peak : 0;
      const droneHeld = last ? last.held : -1;
      d.assert('a key sounding when the drone starts is taken, not turned into a second drone',
        cleanDrone > 0.01 && droneHeld === 1
          && Math.abs(droneOverKey - cleanDrone) < cleanDrone * 0.25,
        `a drone started over a sounding key reads ${droneOverKey.toFixed(4)} on `
        + `${droneHeld} voice, against ${cleanDrone.toFixed(4)} for a drone started with `
        + `nothing sounding`);

      /**
       * The two sounds are exclusive both ways: keyDown stops the tone, toggleTone takes
       * the keys down. Two asserts, each ending inside the harness's 2 s of patience; the
       * key direction is graded as a note that ends in silence.
       * See lessons/page-muta.md#muta-159
       */
      /* The tone down first: the check above leaves one running, and a press on it would stop it.
         See lessons/page-muta.md#muta-160 */
      stopTone();
      send({ t: 'allOff' });
      await sleep(200);
      /* the tone first, through its own button, then a key into it */
      toneBtn.click();
      await sleep(400);
      const exToneOnly = last ? last.peak : 0;
      const keysBefore = midiNotes;
      keyDown(48, 100);
      await sleep(300);
      const exWithKey = last ? last.peak : 0, exDroning = droning;
      const exPressed = toneBtn.getAttribute('aria-pressed');
      keyUp(48);
      await sleep(700);
      const exAfterKeyUp = last ? last.peak : 0;
      d.assert('a key arriving stops the test tone and plays its own note instead',
        exToneOnly > 0.01 && exWithKey > 0.01 && exDroning === false
          /* Half, not a quarter: the tone reads about 0.71 and a released key 700 ms later
             about 0.20, still decaying. A tone still running would read the whole 0.71.
             See lessons/page-muta.md#muta-161 */
          && exPressed === 'false' && exAfterKeyUp < exToneOnly / 2
          && midiNotes === keysBefore + 1,
        `the tone alone reads ${exToneOnly.toFixed(4)}, a key into it reads `
        + `${exWithKey.toFixed(4)} with the page saying droning ${exDroning} and the button `
        + `reading ${exPressed}, and letting that key go leaves `
        + `${exAfterKeyUp.toFixed(4)} where a tone still running would leave the first figure`);

      /* and now the other way: a key held, then the tone asked for */
      send({ t: 'allOff' });
      await sleep(200);
      keyDown(55, 100);
      await sleep(250);
      toneBtn.click();
      await sleep(400);
      const exToneOverKey = last ? last.peak : 0, exHeld = last ? last.held : -1;
      toneBtn.click();
      await sleep(600);
      const exAfterTone = last ? last.peak : 0;
      d.assert('starting the test tone takes the keys down, and stopping it leaves silence',
        exHeld === 1 && exToneOverKey > 0.01 && exAfterTone < exToneOverKey / 4,
        `a tone started over a held key reads ${exToneOverKey.toFixed(4)} on ${exHeld} `
        + `voice, and stopping it leaves ${exAfterTone.toFixed(4)} with nothing of the key `
        + `left to ring`);
      stopTone();
      send({ t: 'allOff' });
      knobs.get('pitch').set(60);
      send({ t: 'param', id: P.note, value: 60 });

      /**
       * A held chord must not clip. trim follows the voice count, not what is sounding, so
       * three sustained notes reach further than any pluck; the oscillator is the end.
       * See lessons/page-muta.md#muta-162
       */
      send({ t: 'allOff' });
      send({ t: 'voices', n: 8 });
      await sleep(200);
      noteOn(60, 0); noteOn(64, 0); noteOn(67, 0);
      await sleep(600);
      const oscPeak = last ? last.peak : 0;
      noteOff(60); noteOff(64); noteOff(67);
      await sleep(200);
      d.assert('three keys held at once do not drive the instrument into its ceiling',
        oscPeak > 0.01 && oscPeak < 0.999,
        `three sustained notes reach ${oscPeak.toFixed(4)} out of the oscillator`);

      /**
       * One voice means one note with three keys down, read from the DSP's plaits_held and
       * plaits_voice_note, not from what the page sent.
       * See lessons/page-muta.md#muta-163
       */
      send({ t: 'allOff' });
      send({ t: 'voices', n: 1 });
      await sleep(200);
      noteOn(60, 0); noteOn(64, 0); noteOn(67, 0);
      await sleep(400);
      const chordHeld = last ? last.held : -1;
      const chordNote = lastNote ? lastNote.note : -1;
      noteOff(60); noteOff(64); noteOff(67);
      await sleep(250);
      d.assert('one voice plays one note however many keys are held down',
        chordHeld === 1 && chordNote === 67,
        `three keys held at once left ${chordHeld} voice sounding, on note ${chordNote}`);

      // Graded against the levels the worklet read just before the choice, not a meter up
      // to 250 ms stale. Two voices: the third note is the smallest thing that must steal.
      // 200 ms apart is far past the 8 ms before a level means anything.
      // See lessons/page-muta.md#muta-164
      send({ t: 'allOff' });
      send({ t: 'voices', n: 2 });
      await sleep(150);
      noteOn(60, 40);
      await sleep(200);
      noteOn(67, 40);
      await sleep(200);
      const steals0 = lastNote ? lastNote.steals : 0;
      noteOn(72, 40);
      await sleep(200);

      const n = lastNote;
      const lv = n?.before ?? [];
      const quietest = lv.length ? lv.indexOf(Math.min(...lv)) : -1;
      // Refuses to grade equal levels: indexOf(min) and the shim would both answer 0 and
      // pass having compared nothing.
      // See lessons/page-muta.md#muta-165
      const spread2 = lv.length > 1 ? Math.max(...lv) / Math.max(1e-9, Math.min(...lv)) : 0;
      d.assert('a note with no free voice takes the quietest one and says which',
        !!n && n.stolen >= 0 && n.steals === steals0 + 1 && n.stolen === quietest
          && n.voice === n.stolen && spread2 > 1.2,
        n ? `voice ${n.stolen} was taken at level ${n.stolenLevel.toFixed(4)}, and the `
          + `levels when it was decided were ${lv.map((x) => x.toFixed(4)).join(', ')}, `
          + `a factor of ${spread2.toFixed(2)} apart`
          : 'no note was ever reported');

      send({ t: 'allOff' });
      send({ t: 'voices', n: voiceCount });
    }, { log: d.log, say: 'the test tone, the picture, the model switch and the voice stealing are checked only under a harness, because every one of them presses a control or changes the sound' });
  });

  /**
   * Any gesture on the panel opens the sound device: the firmware is already here, so
   * the first touch only pays for the device. Capture phase, so it runs before the
   * control's own handler. armedBy records what armed it, for the assert.
   * See lessons/page-muta.md#muta-166
   */
  const armOnTouch = () => {
    if (armedBy) return;
    armedBy = 'a touch on the panel';
    panel.el.removeEventListener('pointerdown', armOnTouch, true);
    panel.el.removeEventListener('keydown', armOnTouch, true);
    arm();
  };
  panel.el.addEventListener('pointerdown', armOnTouch, true);
  panel.el.addEventListener('keydown', armOnTouch, true);

  /* See lessons/page-muta.md#muta-167 */
  d.log('the instrument is on when the page is, so press Test tone beside its name to '
      + 'hear it, or play a MIDI keyboard. The voice count is this page’s own and the '
      + 'instrument has no such control');
  d.log('the test tone and the keys never sound together: a key stops the tone and '
      + 'starting the tone takes the keys down');
  d.log('left of the divider are Plaits’ four front panel rotaries, in its own positions. '
      + 'Right of it are its three attenuverters, then decay and colour, which the panel '
      + 'reaches by holding a button rather than with knobs of their own');
  d.log('the firmware comes off this site on the visit and no sound device is opened '
      + 'until the panel is touched, which is the gesture a browser wants for a sound '
      + 'anyway');

  /* the firmware a visit gets: one fetch of the artefact off this origin, not awaited.
     warmUp catches its own failure, so a bad download is logged, not unhandled.
     See lessons/page-muta.md#muta-168 */
  warmUp();

  /* The counts at the visit's last line, before any gesture, and outside the gate:
     inside ifSelfcheck they would stay unset for a visitor and the asserts go red.
     See lessons/page-muta.md#muta-169 */
  midiAsksOnLoad = midiAsks;
  wasmFetchesOnLoad = wasmFetches;
  ctxOnLoad = ctx !== null;
  nodeOnLoad = node !== null;
  toneDeadOnLoad = toneBtn.disabled;

  /**
   * The harness presses only .pos-controls and this page has none, so under the gate
   * it dispatches a real pointerdown on the panel, the path a person takes, rather
   * than calling arm().
   * See lessons/page-muta.md#muta-170
   */
  ifSelfcheck(() => {
    panel.el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
  }, {
    log: d.log,
    say: 'the audio is opened by touching the panel, because this page has no row of '
      + 'controls for a harness to press',
  });
  /* Ready here, not after the checks: verify.mjs waits 7.4 s for __demo.ready, and the
     DSP checks take about twenty seconds.
     See lessons/page-muta.md#muta-171 */
  d.ready();
</script>
</html>

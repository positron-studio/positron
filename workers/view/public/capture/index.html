<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* No vertical margins in here: the gap between blocks is `.pos-stack`, and
     every tab panel is one (`tab-page.mjs` makes it so). */

  /* Side by side, stacked when there is no room: source and result are compared.
     `min(100%, 300px)`, because a bare 300 px floor is wider than a 320 px phone.
     See lessons/page-capture.md#capture-1 */
  .cap-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
              gap: 10px; align-items: start; }
  .cap-pair figure { margin: 0; min-width: 0; }
  .cap-pair canvas, .cap-pair video, canvas.cap-src {
    display: block; width: 100%; background: var(--card);
    border: 1px solid var(--line); border-radius: 4px; }
  /* An empty received picture is the source's shape, not the browser's default
     300 by 150: two boxes almost the same size side by side read as an error. */
  .cap-pair figure > video { aspect-ratio: 16 / 9; }
  canvas.cap-src, video.cap-back { max-width: 440px; }
  video.cap-back { display: block; width: 100%; }
  /* ONE VIEWPORT for a sequence of takes: only the one under the playhead is
     shown, so a gallery would draw a claim the timeline does not make. */
  /* The box draws the screen's edge, so before the first take it reads as an empty
     screen rather than a hole. One edge per object: the videos inside give up theirs.
     See lessons/page-capture.md#capture-2 */
  .cap-seq { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
             background: var(--card); border: 1px solid var(--line); border-radius: 4px; }
  .cap-seq video { position: absolute; inset: 0; width: 100%; height: 100%;
                   border: 0; border-radius: 0; }
  /* Every rule above that sets `display` beats the browser's own `[hidden]`,
     so what hidden means is said here. */
  .cap-pair[hidden], .cap-pair video[hidden], .cap-pair canvas[hidden],
  canvas.cap-src[hidden], video.cap-back[hidden], .cap-row[hidden], .cap-segs[hidden] { display: none; }

  /* A tab's own control row. NOT `.pos-controls`, which the harness presses by
     position across the whole document (`tab-page.mjs` rule 4); laid out the
     way the shell lays out that row. */
  .cap-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cap-row [data-end] { margin-left: auto; }

  .cap-segs { display: flex; flex-wrap: wrap; gap: 3px; }
  .cap-segs i { font: 500 10px/1.6 var(--mono); font-style: normal; color: var(--dim2);
                border: 1px solid var(--line2); border-radius: 2px; padding: 0 4px; }
  .cap-segs i.held { color: var(--hi); border-color: var(--hi); }
  .cap-segs i.gone { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 45%, var(--line2)); }
</style>

<script type="module">
  // Four tabs, each a module beside this file, built by `createTabPage` when first
  // opened. Nothing opens on load. ROUND TRIP bills Stream minutes, so only
  // `DEMO_DEEP=1` runs past its relay ask. The published bar is TAKES's.
  // See lessons/page-capture.md#capture-3
  import { mount, guard } from '/shell/shell.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import * as takes from './takes.mjs';
  import * as segments from './segments.mjs';
  import * as roundtrip from './roundtrip.mjs';
  import * as farend from './farend.mjs';

  const d = mount({
    name: 'capture',
    // No `what` under the title: each tab describes itself under the tab row.
    // See lessons/page-capture.md#capture-4
    readout: null,
    showLog: false,
  });
  guard(d);

  const page = createTabPage(d, {
    tabs: [
      { id: 'takes', label: 'TAKES', mod: takes },
      { id: 'segments', label: 'UPLOAD', mod: segments },
      { id: 'roundtrip', label: 'ROUND TRIP', mod: roundtrip },
      { id: 'farend', label: 'RECEIVER', mod: farend },
    ],
    at: 'takes',
  });

  if (SELFCHECK) {
    const t0 = performance.now();
    await page.check();
    d.log(`the checks of all four tabs ran in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  }
  d.ready();
</script>
</html>

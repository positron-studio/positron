<style>
  /* Wider than the prose: the shell's 720 px cap is for a paragraph, and the strip
     needs the room for its tapes.
     See lessons/page-tapes.md#tapes-1 */
  .pos-strip { width: min(1180px, calc(100vw - 32px)); margin-left: 50%; transform: translateX(-50%); }
  /* The name of what is playing. Fixed height and `nowrap`, so a long title on
     ‹ or › never moves the strip under it.
     See lessons/page-tapes.md#tapes-2 */
  .now {
    font: 500 12px/1.5 var(--mono); color: var(--fg);
    height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now .n-of { color: var(--dim2); }
  .now .n-when { color: var(--dim); }
  /* Before there is a tape to name. Dim, because it is not a title. */
  .now.waiting { color: var(--dim); }
  /* A quiet pulse over the empty lane until the list arrives, so it does not read
     as broken. Opacity only, so it takes no room.
     See lessons/page-tapes.md#tapes-3 */
  .pos-strip.waiting { animation: tapes-wait 1.4s ease-in-out infinite; }
  @keyframes tapes-wait { 0%, 100% { opacity: 0.35 } 50% { opacity: 0.7 } }
  @media (prefers-reduced-motion: reduce) {
    .pos-strip.waiting { animation: none; opacity: 0.5; }
  }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createLooper } from '/shell/looper.mjs';

  // The same file `/resources/` reads: one corpus, two pictures of it.
  // See lessons/page-tapes.md#tapes-4
  const CORPUS = '/resources/corpus.json';

  /**
   * Where recordings are fetched from: archive.org unless `?base=` points elsewhere
   * (`demo/fake-tapes.mjs` for the harness). Only the media URL moves; `corpus.json`
   * and `it.file` are untouched, and with no `base` `srcOf` returns `it.file`.
   * See lessons/page-tapes.md#tapes-5
   */
  const BASE = (new URLSearchParams(location.search).get('base') || '').replace(/\/+$/, '');
  const srcOf = (it) => {
    if (!BASE || !it?.file) return it?.file;
    try { return BASE + new URL(it.file).pathname; } catch { return it.file; }
  };

  /**
   * A same-origin hop (`workers/tapes/worker.mjs`) for a recording whose host sends
   * no CORS header, so its samples can be read; `retryOpen` falls back if it fails.
   * Empty under a `base`, so a stand-in run cannot reach past it. `?proxy=` overrides.
   * See lessons/page-tapes.md#tapes-6
   */
  const PROXY = BASE ? ''
    : (new URLSearchParams(location.search).get('proxy') ?? 'https://tapes.positron.studio')
      .replace(/\/+$/, '');
  const proxiedOf = (it) => `${PROXY}/tape?id=${encodeURIComponent(it.id)}`;

  const d = mount({
    name: 'tapes',
    // See lessons/page-tapes.md#tapes-7
    what: 'Every Erkki Kurenniemi recording that plays, laid end to end as one long '
      + 'tape: each block is as wide as that recording really is, measured from the file '
      + 'itself. The picture opens on the whole run, closes onto an hour of it and then '
      + 'slides along with the tape until you take hold of it, and pressing a block loads '
      + 'that recording. LOOP keeps the lap you are hearing and plays it round from there, '
      + 'and the arrow beside it turns that lap backwards or there and back.',
    readout: null,
  });
  guard(d);

  // ── colour says how it landed, never which lane ──
  // Every state comes from corpus fields (`http`, `cors`, `file`).
  // See lessons/page-tapes.md#tapes-8
  const INK = { open: '#3fb950', held: '#6f7d94', ref: '#3d4756', gone: '#d29922' };
  /**
   * Tape shades, a deliberate exception to the colour rule: every drawn tape is
   * `open`, so colour marks where one tape ends and the next begins. Three close
   * greys and browns, so the ring on the loaded tape stays the loudest thing.
   * See lessons/page-tapes.md#tapes-9
   */
  // Bright enough to survive the renderer's 0.85 fill and the dimming of the rest,
  // and far enough apart that the join between two tapes is seen.
  // See lessons/page-tapes.md#tapes-10
  const TAPE_INK = ['#cdbfa6', '#9a9184', '#b3a289'];
  const stateOf = (it) => {
    const h = it.http;
    if (h === 403 || (typeof h === 'string' && /DNS|ENOTFOUND/i.test(h))) return 'gone';
    if (it.file && it.cors) return 'open';
    if (it.file) return 'held';
    return 'ref';
  };
  /**
   * Ask the browser and the filename, not the corpus: `fileType` is what the host
   * sent (an `.avi` served as `video/mp4`), and `cors` was probed on one file per
   * source, not on this one.
   * See lessons/page-tapes.md#tapes-11
   */
  const PLAYS = /\.(mp3|m4a|mp4|webm|ogg|opus|wav|aac)(\?|#|$)/i;
  const probeEl = new Audio();
  const playable = (it) => stateOf(it) === 'open'
    && PLAYS.test(it.file || '')
    && !!probeEl.canPlayType(it.fileType || '');

  const YEAR = (ms) => new Date(ms).getUTCFullYear();
  /**
   * The axis is one long tape, not a century: tapes run end to end from nought,
   * each as wide as it really lasts. Dates are no longer on the picture; they stay
   * in the corpus, in the line above the strip, and in the layout order.
   * See lessons/page-tapes.md#tapes-12
   */
  const OPENS = 0;
  // The opening span, one hour. A constant so the assert below prints the page's
  // own value rather than a second copy of it.
  // See lessons/page-tapes.md#tapes-13
  const OPEN_SPAN_MS = 60 * 60e3;
  const AXIS = [Date.UTC(1890, 0, 1), Date.UTC(2027, 0, 1)];

  let items = [], tapes = [], cur = -1;

  /**
   * Where each tape sits on the run. A tape with no known length is drawn at
   * `GUESS`, `measured` records which are guesses, and the lane says how many.
   * See lessons/page-tapes.md#tapes-14
   */
  const GUESS = 6 * 60e3;                          // six minutes, until it answers
  const lengths = new Map();                       // id -> { ms, measured, how }
  let schedule = [];                               // [{ it, from, to, measured }]

  /** Lay every playable tape end to end from `OPENS`. Cheap; called per answer. */
  function reschedule() {
    let at = OPENS;
    schedule = tapes.map((it) => {
      const L = lengths.get(it.id);
      const ms = L?.ms ?? GUESS;
      const row = { it, from: at, to: at + ms, measured: !!L?.measured };
      at += ms;
      return row;
    });
    // The deck's range moves with the run as lengths arrive, so the last tapes stay
    // on the picture.
    // See lessons/page-tapes.md#tapes-15
    mapDeck.setRange([OPENS, Math.max(at, OPENS + 60e3)]);   // nought to the end of the last tape
    // `setRange` does not refit the strip, so the view is framed here, an hour wide
    // from the start of the run, until a visitor pans or pinches.
    // See lessons/page-tapes.md#tapes-16
    if (schedule.length) view.strip.canvas.classList.remove('waiting');
    openView();
    sayGuesses();
  }
  // Set by the first press on the strip: from then on the framing is theirs.
  let viewOwned = false;

  /**
   * The view opens on the whole run, eases onto an hour, then follows the tape.
   * It stops when `viewOwned` is set by a trusted press. The span is eased on its
   * logarithm, so the rate of zoom looks constant.
   * See lessons/page-tapes.md#tapes-17
   */
  const OPEN_ZOOM_MS = 1200;
  // Left of centre (`strip.mjs`'s own number), so most of the window is ahead.
  // See lessons/page-tapes.md#tapes-18
  const HEAD_AT = 0.38;
  let zoom = null;                 // the opening move, while it is running
  let opened = false;              // has it been started
  const zoomSaw = [];              // the spans it passed through, for the check
  let saidOwned = false;

  /** Start the opening zoom once there is a run to open on. */
  function openView() {
    if (viewOwned || opened) return;
    const runEnd = mapDeck.range[1];
    const span = Math.min(OPEN_SPAN_MS, runEnd - OPENS);
    if (!(span > 0) || !schedule.length) return;
    opened = true;
    zoom = { t0: performance.now(), from: runEnd - OPENS, to: span };
    view.strip.fit(OPENS, runEnd);
  }

  /** Put the hour-wide window where the playhead is, inside the run. */
  let followedFrom = null;
  function followView() {
    const span = Math.min(OPEN_SPAN_MS, mapDeck.range[1] - OPENS);
    if (!(span > 0)) return;
    // Clamped to the run at both ends, so the window never shows time with no tape.
    // See lessons/page-tapes.md#tapes-19
    const last = Math.max(OPENS, mapDeck.range[1] - span);
    const from = Math.min(last, Math.max(OPENS, mapDeck.position() - span * HEAD_AT));
    // Skip a move under half a pixel: `fit()` redraws the strip.
    // See lessons/page-tapes.md#tapes-20
    const perPx = 1000 / Math.max(1e-9, view.strip.view().pxPerSecond);
    if (followedFrom !== null && Math.abs(from - followedFrom) < perPx * 0.5) return;
    followedFrom = from;
    view.strip.fit(from, from + span);
  }

  /** One step of it, driven from `frame()`, because this page runs ONE loop. */
  function tickView(now) {
    if (viewOwned) {
      if (!saidOwned && opened) {
        saidOwned = true;
        d.log('the picture is yours now, so it has stopped moving by itself');
      }
      return;
    }
    if (zoom) {
      const f = Math.min(1, (now - zoom.t0) / OPEN_ZOOM_MS);
      const e = 1 - (1 - f) * (1 - f) * (1 - f);            // ease out
      const span = Math.exp(Math.log(zoom.from) + (Math.log(zoom.to) - Math.log(zoom.from)) * e);
      zoomSaw.push(Math.round(span));
      view.strip.fit(OPENS, OPENS + span);
      if (f >= 1) zoom = null;
      return;
    }
    if (opened) followView();
  }

  /**
   * Finish the opening move now, for a check that has to read a settled view.
   * `zoomSaw` still holds every span it passed through.
   * See lessons/page-tapes.md#tapes-21
   */
  function openFinish() {
    if (zoom) { zoom = null; zoomSaw.push(Math.round(Math.min(OPEN_SPAN_MS,
      mapDeck.range[1] - OPENS))); }
    if (!viewOwned && opened) followView();
  }
  const slotOfTape = (i) => schedule[i] || null;

  /**
   * The lengths come from the corpus (`durationMs`, written once by
   * `demo/resources/measure-durations.mjs`), so a visit asks no host for them.
   * See lessons/page-tapes.md#tapes-22
   */
  function lengthsFromCorpus() {
    let known = 0;
    for (const it of tapes) {
      if (!(it.durationMs > 0)) continue;
      lengths.set(it.id, { ms: it.durationMs, measured: true, how: 'corpus' });
      known++;
    }
    return known;
  }

  /**
   * Ask the files the corpus has no length for, one at a time. A fallback that finds
   * nothing on an ordinary visit. Not awaited: a host that never answers costs only
   * that tape's exact width.
   * See lessons/page-tapes.md#tapes-23
   */
  function measureLengths() {
    let next = 0;
    const one = () => {
      const it = tapes[next++];
      if (!it) return;
      if (lengths.has(it.id)) return one();
      const probe = new Audio();
      probe.preload = 'metadata';
      const done = (ms, measured) => {
        lengths.set(it.id, { ms, measured });
        reschedule();
        probe.src = '';
        one();
      };
      probe.addEventListener('loadedmetadata', () => {
        const ms = Number.isFinite(probe.duration) ? probe.duration * 1000 : GUESS;
        done(ms > 1000 ? ms : GUESS, ms > 1000);
      }, { once: true });
      probe.addEventListener('error', () => done(GUESS, false), { once: true });
      // A host that simply never answers would otherwise hold the queue for the
      // life of the page.
      setTimeout(() => { if (!lengths.has(it.id)) done(GUESS, false); }, 12000);
      probe.src = srcOf(it);
    };
    one();
  }

  /**
   * `mapDeck` is the run, `tapeDeck` is one recording: two kinds of time. Laid end
   * to end, one thing plays, so the strip has a playhead and the loaded tape is
   * ringed. `absolute: false` is declared rather than guessed from the range.
   * See lessons/page-tapes.md#tapes-24
   */
  const mapDeck = createDeck({
    items: [],
    adapters: { record: { actuate() {} } },
    // Corrected by `reschedule()` as soon as the first length is known. A real
    // number here rather than [0,1] for the same reason `select` does not reset
    // the tape's range: a one-millisecond axis is a picture with nowhere to be.
    range: [0, 60 * 60e3],
  });

  /**
   * `?report=1` posts the play gate's state every half second for 15 s to
   * https://pub.positron.studio/logs?format=text. Off unless asked, so visitors do
   * not flood the shared ring buffer.
   * See lessons/page-tapes.md#tapes-25
   */
  /**
   * The checks below load and play a tape, so they run only under `?selfcheck=1`.
   * A visit asserts a strict subset: what the corpus and the picture can grade.
   * See lessons/page-tapes.md#tapes-26
   */
  // Either tier (`selfcheck=1` or the deep `selfcheck=2`, see `demo/shell/selfcheck.mjs`).
  const SELFCHECK = ['1', '2'].includes(new URLSearchParams(location.search).get('selfcheck'));

  const REPORT = new URLSearchParams(location.search).get('report') === '1';
  const ship = (line) => {
    if (!REPORT) return;
    try {
      navigator.// `/log`, singular: `/logs` is the read path. See lessons/page-tapes.md#tapes-27
      // See lessons/page-tapes.md#tapes-28
      sendBeacon('https://pub.positron.studio/log',
        new Blob([`tapes ${line}`], { type: 'text/plain' }));
    } catch { /* a diagnostic may never make the page worse */ }
  };

  // the heartbeat, which is what catches a leak nobody pressed for
  if (REPORT) {
    ship(`BUILD open ${location.href} · ${navigator.userAgent}`);
    let n = 0;
    const beat = setInterval(() => {
      const g = out ? out.gain.value.toFixed(3) : 'no-graph';
      ship(`t=${Math.round(performance.now())} asked=${asked} checking=${checking}`
        + ` paused=${audio.paused} ct=${audio.currentTime.toFixed(2)}`
        + ` gain=${g} ctx=${ctx ? ctx.state : 'none'} peak=${outPeak.toFixed(4)}`);
      if (++n >= 30) clearInterval(beat);
    }, 500);
  }

  const audio = new Audio();
  window.__a = audio;      // a handle for the lab probe; harmless in a page
  audio.preload = 'metadata';
  /**
   * `anonymous` buys a readable graph and can cost the sound: a host with no CORS
   * header on this object refuses it, so `retryOpen()` drops it and reloads.
   * See lessons/page-tapes.md#tapes-29
   */
  audio.crossOrigin = 'anonymous';
  /**
   * The pitch follows the speed (varispeed), for every speed, so half speed is an
   * octave down and the walk buttons sound like a machine winding down.
   * See lessons/page-tapes.md#tapes-30
   */
  audio.preservesPitch = false;
  audio.webkitPreservesPitch = false;        // Safari before 15.4
  const tapeDeck = createDeck({
    items: [],
    adapters: {
      tape: {
        actuate() {},
        // Tape speeds, and no faster than 2: these are files, so nothing
        // starves, but past 2 a voice stops being a voice.
        caps: { rates: [0.25, 0.5, 1, 1.5, 2] },
      },
    },
    range: [0, 1],
  });

  // ── the picture ─────────────────────────────────────────────────────────
  const now = el('div', 'now');
  /**
   * Say what is being waited for until `corpus.json` arrives, in the same fixed
   * height box the tape's name uses afterwards.
   * See lessons/page-tapes.md#tapes-31
   */
  now.classList.add('waiting');
  now.textContent = 'finding the recordings';
  d.el.append(now);

  /**
   * One lane, declared on `createStripView` the way `/loops/` does: `as: 'spans'`,
   * `stack: false`, and `durMs` on the payload. End to end nothing overlaps.
   * See lessons/page-tapes.md#tapes-32
   */
  const tapeLane = {
    id: 'tapes',
    label: 'tapes',
    as: 'spans',
    // One row. The passes of a loop and the tapes of a run are the same shape:
    // things that never overlap, so stacking them is stairs down an empty lane.
    stack: false,
    // `barH` is `height - barPad * 2`: 64 with a pad of 21 keeps the tape at 22 px in
    // a taller lane.
    // See lessons/page-tapes.md#tapes-33
    height: 64,
    barPad: 21,
    // One pixel between tapes; `strip.mjs` takes it off the right edge in CSS pixels.
    // See lessons/page-tapes.md#tapes-34
    barGap: 1,
    terse: true,
    rows: () => schedule.map((sl) => ({
      at: sl.from,
      id: sl.it.id,
      kind: 'tape',
      // `durMs`, not `when`: `spansOf` reads `payload.when` first and would draw the
      // historical date on an axis of minutes. The date stays on `it` for the hover.
      // See lessons/page-tapes.md#tapes-35
      payload: { durMs: sl.to - sl.from, it: sl.it, sl },
    })),
    // Tape shades, cycling, so the join between two tapes is visible. See
    // TAPE_INK for why colour is free to do this here.
    colorOf: (sp) => {
      const it = sp.row.payload.it;
      if (stateOf(it) !== 'open') return INK[stateOf(it)];
      const i = schedule.findIndex((sl) => sl.it.id === it.id);
      return TAPE_INK[(i < 0 ? 0 : i) % TAPE_INK.length];
    },
    // Which one you are hearing: full strength and a ring, the rest at half.
    currentOf: (sp) => sp.row.payload.it.id === tapes[cur]?.id,
    // A name only where a name can be read; under this a fragment reads as a
    // different word.
    /**
     * The name on the tape, cut with an ellipsis to fit; a six minute tape is 79 px at
     * the opening zoom. Under about five characters it goes.
     * See lessons/page-tapes.md#tapes-36
     */
    labelOf: (sp, { bw } = {}) => {
      const t = sp.row.payload.it.title;
      if (!bw || bw < 44) return '';
      const fits = Math.max(0, Math.floor((bw - 16) / 6.2));   // 11px mono, measured
      return t.length <= fits ? t : `${t.slice(0, Math.max(1, fits - 1))}\u2026`;
    },
    // Dimmed less than the library's 0.5: the other tapes are the subject here.
    // See lessons/page-tapes.md#tapes-37
    dimTo: 0.8,
    dimLabelTo: 0.85,
    describeRow: (r) => {
      const it = r.payload.it, sl = r.payload.sl;
      const mins = sl ? `${((sl.to - sl.from) / 60e3).toFixed(1)} min` : '';
      return [it.title,
              `${mins}${sl && !sl.measured ? ' (not measured yet)' : ''} · `
              + `${it.when?.edtf || 'no date'} · ${it.source}`,
              'press to hear it'];
    },
  };

  /**
   * The lane's gutter says how long the run is, or how many widths are guesses.
   * Written to the strip's own lane, because `setLanes` copies declarations.
   * Short, because the gutter grows to the longest sub-label and takes plot width.
   * See lessons/page-tapes.md#tapes-38
   */
  function sayGuesses() {
    const n = schedule.filter((sl) => !sl.measured).length;
    const run = schedule.length ? schedule[schedule.length - 1].to - OPENS : 0;
    const say = n ? `${n} guessed` : run > 0 ? hm(run) : '';
    const live = view.strip.lanes().find((l) => l.id === 'tapes');
    if (live) live.subLabel = say;
    tapeLane.subLabel = say;          // the declaration, so a re-set lane keeps it
    view.strip.invalidate();
  }
  /** `2h 34m`, which is how a length belongs in a gutter: short. */
  const hm = (ms) => {
    const m = Math.round(ms / 60e3);
    return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`;
  };

  const view = createStripView(d.el, mapDeck, {
    // 78 px is `tapes` plus its swatch — see the lane's own note about why the
    // gutter lost the line that used to set this width.
    size: 'auto', absolute: false, gutter: 78, follow: false,
    lanes: [tapeLane],
    // no line sweeping the century; see the note on the two decks above
    playhead: true,
    /**
     * See lessons/page-tapes.md#tapes-39
     */
    /**
     * A seek names a tape and an offset into it. The element and `tapeDeck` are both
     * told, in that order, so the bar below agrees with the strip.
     * See lessons/page-tapes.md#tapes-40
     */
    /**
     * The playhead moves while you drag; the tape loads when you stop. Setting
     * `audio.src` per tape crossed rebuilds the element and flashes the lane.
     * See lessons/page-tapes.md#tapes-41
     */
    // Named rather than inline, so the check at the foot of this file can drive
    // the same entry point a finger does instead of a copy of it.
    onSeek: (at) => stripSeek(at),
  });
  function stripSeek(at) {
      const sl = schedule.find((x) => at >= x.from && at < x.to) || schedule[schedule.length - 1];
      if (!sl) return;
      const into = Math.max(0, at - sl.from);
      // The line follows the finger, now, whatever is loaded underneath it, and
      // the frame loop stands off until `landScrub` has told the tape where it
      // is. See the note beside that line in `frame()`.
      scrubbing = true;
      mapDeck.seek(at);
      scrubTo = { sl, into };
      clearTimeout(scrubTimer);
      // 140 ms of not moving is a hand that has stopped rather than a hand that
      // is still going. Short enough that letting go feels immediate.
      scrubTimer = setTimeout(landScrub, 140);
  }
  // Until there are bars. `reschedule()` takes it off the first time it has
  // something to draw.
  view.strip.canvas.classList.add('waiting');
  window.__strip = view.strip;   // a handle for the lab probe; harmless in a page
  window.__map = mapDeck;        // the same, for the axis the strip draws

  /**
   * Press a mark to load that tape. Reads the hit the strip resolved in `hover()`;
   * a movement over six pixels is a pan, not a press.
   * See lessons/page-tapes.md#tapes-42
   */
  let pressAt = null;
  view.el.addEventListener('pointerdown', (e) => {
    pressAt = { x: e.clientX, y: e.clientY };
    if (e.isTrusted) viewOwned = true;     // the framing is theirs from here
  });
  view.el.addEventListener('pointerup', (e) => {
    const p = pressAt; pressAt = null;
    if (!p || Math.abs(e.clientX - p.x) > 6 || Math.abs(e.clientY - p.y) > 6) return;
    const it = view.strip.hover()?.row?.payload?.it;
    const i = it ? tapes.findIndex((t) => t.id === it.id) : -1;
    if (i >= 0 && i !== cur) select(i, { play: !audio.paused });
  });

  /**
   * See lessons/page-tapes.md#tapes-43
   */
  /**
   * One lane: only playable tapes are drawn, because a lane you cannot press teaches
   * that pressing does nothing. `/resources/` still tabulates the whole corpus.
   * See lessons/page-tapes.md#tapes-44
   */
  /**
   * The looper is `demo/shell/looper.mjs`, shared with `/archive/radio/`. It keeps
   * the lap as an `AudioBuffer`, which is what makes backwards possible. The first
   * lap plays off the tape while the ring fills; 30 s at 48 kHz stereo is 11.5 MB.
   * See lessons/page-tapes.md#tapes-45
   */
  const LOOP_SECONDS = 30;
  const looper = createLooper({ seconds: LOOP_SECONDS, log: (m, k) => d.log(m, k) });

  // ── the sound ──
  // A scrolling waveform of what is coming out, via `feed()`: drawing the whole
  // file means fetching up to 225 MB first. It freezes on a loop: the lap is kept.
  // See lessons/page-tapes.md#tapes-46
  const scope = createGrainScope(d.el, { seconds: 8, height: 120, fullScale: 1 });

  // The one gesture that opens the gate, and only if `isTrusted`, so the harness's
  // `element.click()` presses the button and stays silent. Capture phase, so it
  // runs before the bar's own handler.
  // See lessons/page-tapes.md#tapes-47
  setTimeout(() => {
    bar?.el?.addEventListener('pointerdown', (e) => {
      if (e.isTrusted && fromPlayButton(e.target)) touched(e.target);
    }, true);
    bar?.el?.addEventListener('keydown', (e) => {
      if (e.isTrusted && fromPlayButton(e.target)) touched(e.target);
    }, true);
    /**
     * The space bar too: `transport-bar.mjs` listens on the window. Text fields are
     * ignored, as the bar does.
     * See lessons/page-tapes.md#tapes-48
     */
    addEventListener('keydown', (e) => {
      if (!e.isTrusted || e.key !== ' ') return;
      const t = e.target;
      if (t instanceof HTMLElement
        && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      touched(t);
    }, true);
  }, 0);
  let ctx = null, analyser = null, buf = null, out = null, sink = null, sinkBuf = null;
  // The tape's way in, taken down while a loop plays. See `armAnalyser`.
  let liveIn = null;

  /**
   * Nothing is heard until somebody asks: a gain node, always in the graph, opened
   * by the press that asks for sound. Not `audio.muted`, not a disconnected output.
   * The self-checks drive the real controls, so pressing play is not their call.
   * See lessons/page-tapes.md#tapes-49
   */
  /**
   * Two facts: `checking` is the page grading itself, `asked` is a person pressing
   * play. Only a press opens the gate; the checks ending does not.
   * See lessons/page-tapes.md#tapes-50
   */
  let checking = true, audible = false, asked = false;
  // A handle for the lab probe, and the only way to see the gate from outside:
  // the gain is what decides whether a tape is HEARD, and reading `audible`
  // alone would grade the flag rather than the sound.
  window.__gate = () => ({ checking, asked, audible, gain: out ? out.gain.value : null,
                           paused: audio.paused, at: audio.currentTime, cur });
  /**
   * Opened only by a person pressing the play button, not by any touch on the page
   * and not by `command.play`, which the checks call too. See `fromPlayButton`.
   * See lessons/page-tapes.md#tapes-51
   */
  /**
   * Is this press on the play button? A pure function of the target, published so a
   * check can grade the routing; `isTrusted` is checked separately.
   * See lessons/page-tapes.md#tapes-52
   */
  const fromPlayButton = (t) => !!(t instanceof Element && t.closest('.tbar-toggle'));
  window.__gateRoute = fromPlayButton;
  /**
   * What the button was showing when pressed: `playing` means the press was a pause.
   * See lessons/page-tapes.md#tapes-53
   */
  let wantPlay = false;
  const touched = (t) => {
    asked = true;
    const b = bar?.el?.querySelector('.tbar-toggle');
    wantPlay = b ? b.dataset.state !== 'playing' : true;
    void t;
  };

  function setAudible(on) {
    audible = on && asked && !checking;
    ship(`setAudible(${on}) asked=${asked} checking=${checking} -> audible=${audible}`);
    // a 15 ms approach, because a gain stepped from nought to one mid-sample is
    // a click, and a click on pressing play is the page making the noise
    if (out) out.gain.setTargetAtTime(audible ? 1 : 0, ctx.currentTime, 0.005);
  }

  function armAnalyser() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    out = ctx.createGain();
    out.gain.value = audible ? 1 : 0;
    // The speakers' own analyser, after the gate. The gap between it and the first
    // one is the evidence the gate is shut.
    // See lessons/page-tapes.md#tapes-54
    sink = ctx.createAnalyser();
    sink.fftSize = 512;
    sinkBuf = new Float32Array(sink.fftSize);
    /**
     * The tape's own gain, so a loop can take the file down without moving `out`,
     * which the sound gate owns.
     * See lessons/page-tapes.md#tapes-55
     */
    liveIn = ctx.createGain();
    src.connect(liveIn);
    liveIn.connect(analyser);
    analyser.connect(out);
    out.connect(sink);
    sink.connect(ctx.destination);
    /**
     * The ring taps `liveIn` and plays back into `analyser`, so a loop never records
     * itself, and the wave, the gate and the meter all see the loop.
     * See lessons/page-tapes.md#tapes-56
     */
    looper.attach(ctx, { tap: liveIn, out: analyser });
  }

  /**
   * Resume before play, and await it: the graph drives the element, so a suspended
   * context leaves `currentTime` still. `play()` is fired, never awaited: it settles
   * when decoding starts, a network wait. The checks wait for the tape to move.
   * See lessons/page-tapes.md#tapes-57
   */
  async function start() {
    /**
     * The file is opened here, on the first press, and nowhere earlier. Idempotent:
     * re-assigning `src` to the loaded file would reset the clock under its readers.
     * See lessons/page-tapes.md#tapes-58
     */
    if (!audio.src && tapes[cur]) {
      audio.src = srcOf(tapes[cur]);
      d.log(`opening ${tapes[cur].title}`);
    }
    armAnalyser();
    setAudible(true);          // which is a request, not a decision: see above
    // Fired, never awaited: `resume()` stays pending until a gesture rather than
    // rejecting, so awaiting it hangs the page.
    // See lessons/page-tapes.md#tapes-59
    try { ctx?.resume?.()?.catch?.(() => {}); } catch { /* not fatal */ }
    audio.play().catch(() => {});
  }

  /**
   * Wait until the tape has moved `ms` of its own time, or give up at `capMs`, so a
   * slow host is a named failure rather than a page that never becomes ready.
   * See lessons/page-tapes.md#tapes-60
   */
  function ranFor(ms, capMs) {
    const from = audio.currentTime * 1000;
    const until = performance.now() + capMs;
    return new Promise((res) => {
      const look = () => {
        if (audio.currentTime * 1000 - from >= ms || performance.now() >= until) return res();
        requestAnimationFrame(look);
      };
      look();
    });
  }

  /**
   * `mediaMaster` does not run itself: the caller calls `mm.tick()` every frame.
   * One rAF loop for the picture, the level and the master, so they agree on the frame.
   * See lessons/page-tapes.md#tapes-61
   */
  /**
   * While a loop runs the picture stops scrolling and becomes the loop, drawn from
   * the loop's own audio: the first pass fills the peaks. Bins are per pixel of the
   * 380 px canvas.
   * See lessons/page-tapes.md#tapes-62
   */
  /**
   * The first lap is kept as the tape plays it; from the second lap on you hear the
   * ring. One wrap closes it and later wraps are ignored.
   * See lessons/page-tapes.md#tapes-63
   */
  let keeping = null;                       // { a, b } while the first lap is kept

  function loopSet(a, b) {
    // The ring cannot keep what no graph is producing. `startLoop` presses play
    // before it says `set`, so this is almost always already done.
    armAnalyser();
    if (!ctx) return;
    const lap = (b - a) / 1000;
    if (lap > LOOP_SECONDS) {
      /**
       * A loop longer than the ring is refused in words on the button. The tape still
       * loops forwards off the file.
       * See lessons/page-tapes.md#tapes-64
       */
      // The reason lives on the control's own face.
      // See lessons/page-tapes.md#tapes-65
      looper.sayTooLong(`this loop is ${lap.toFixed(0)} s and the page can keep `
        + `${LOOP_SECONDS} s, so it plays forwards off the tape`);
      return;
    }
    looper.sayTooLong('');
    looper.keep();
    keeping = { a, b };
    // Where the loop began, drawn on the wave. The picture goes on scrolling for
    // this one lap, because the sound really is still arriving.
    scope.loopFrom();
  }

  function loopWrap() {
    if (!keeping) return;
    const secs = looper.close();
    keeping = null;
    // The ring caught nothing: the looper has already said so, and the tape goes
    // on looping itself, which is what it was doing anyway.
    if (!secs) return;
    scope.loopTo();          // the wave stops here, and this is where it stopped
    liveIn?.gain.setTargetAtTime(0, ctx.currentTime, 0.012);
  }

  function loopOff() {
    keeping = null;
    looper.stop();
    looper.sayTooLong('');
    scope.loopOff();         // the wave starts scrolling again
    if (ctx) liveIn?.gain.setTargetAtTime(1, ctx.currentTime, 0.012);
    d.log('back to the tape', 'hi');
  }

  // The loudest sample seen since the last reset, at the two points that
  // matter: `peak` is the tape, `outPeak` is what reached the speakers. Both
  // are the SAME quantity measured twice, so the pair can be compared.
  let peak = 0, outPeak = 0, master = null;
  function frame(now = performance.now()) {
    // The wind-down, the opening zoom and the follow ride this one loop rather than
    // their own rAF chains.
    // See lessons/page-tapes.md#tapes-66
    spinTick(now);
    tickView(now);
    // The map's playhead is the tape's position plus where the tape sits on the run,
    // told every frame, except while a drag holds it: `landScrub` hands it back.
    // See lessons/page-tapes.md#tapes-67
    const slNow = schedule[cur];
    if (slNow && !scrubbing) mapDeck.seek(slNow.from + tapeDeck.position());
    if (sink && sinkBuf) {
      sink.getFloatTimeDomainData(sinkBuf);
      for (let i = 0; i < sinkBuf.length; i++) {
        const v = sinkBuf[i] < 0 ? -sinkBuf[i] : sinkBuf[i];
        if (v > outPeak) outPeak = v;
      }
    }
    if (analyser && buf) {
      analyser.getFloatTimeDomainData(buf);
      let mx = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = buf[i] < 0 ? -buf[i] : buf[i];
        if (v > mx) mx = v;
      }
      if (mx > peak) peak = mx;
      // The line on the loop is pushed by the bar's `onLoopPos` off the voice's own
      // clock, which knows where the sound is when a lap runs backwards or at half speed.
      // See lessons/page-tapes.md#tapes-68
      scope.feed(buf, ctx.sampleRate);
    }
    master?.tick();
    requestAnimationFrame(frame);
  }

  /**
   * Load one tape and point everything at it.
   * See lessons/page-tapes.md#tapes-69
   */
  function select(i, { play = false, quiet = false, load = true } = {}) {
    if (!tapes.length) return;
    // A new tape gets a clean slate: the line below belongs to whichever
    // recording could not be read, and leaving it up would blame the next one.
    scope.source('');
    cur = ((i % tapes.length) + tapes.length) % tapes.length;
    const it = tapes[cur];
    /**
     * `load: false` names a tape without fetching it, which is what a cold visit gets.
     * The range still comes from the corpus `durationMs`.
     * See lessons/page-tapes.md#tapes-70
     */
    if (load) audio.src = srcOf(it);
    else {
      const ms = lengths.get(it.id)?.ms;
      if (ms > 1000) tapeDeck.setRange([0, Math.round(ms)]);
    }
    // The range is not reset to `[0, 1]`: the last known length stands until
    // `loadedmetadata`, so a seek has somewhere to go.
    // See lessons/page-tapes.md#tapes-71
    now.classList.remove('waiting');
    now.replaceChildren(
      el('span', 'n-of', `${cur + 1}/${tapes.length}  `),
      document.createTextNode(it.title),
      el('span', 'n-when', `  ${it.when.edtf || 'no date'}`));
    // Which bar is ringed is a fact about `cur`; tell the strip it changed.
    // See lessons/page-tapes.md#tapes-72
    view.strip.invalidate();
    // Silent while scrubbing: the log is for things that happened.
    // See lessons/page-tapes.md#tapes-73
    if (!quiet) d.log(`${it.title}, ${it.when.edtf || 'no date'}`, 'hi');
    rung = 0;                          // a new tape starts at the bottom of the ladder
    if (play) start();
    return it;
  }

  // Where a drag last pointed, and the timer that lands on it. See `onSeek`.
  let scrubTo = null, scrubTimer = 0, scrubbing = false;
  function landScrub() {
    scrubbing = false;
    if (!scrubTo) return;
    const { sl, into } = scrubTo; scrubTo = null;
    const i = tapes.findIndex((t) => t.id === sl.it.id);
    if (i >= 0 && i !== cur) select(i, { play: !audio.paused, quiet: true });
    // The element and the deck both: a seek is a range request and the playhead must
    // not wait for it.
    // See lessons/page-tapes.md#tapes-74
    try { audio.currentTime = into / 1000; } catch { /* not seekable yet */ }
    tapeDeck.seek(into);
  }

  /**
   * Varispeed with inertia. ‹ › and the way button wind down, change at the bottom,
   * wind back up; a speed glides. On the page's clock, never waiting for a file;
   * `spinReport` tells a climb from a stall. Stopped, it cuts straight through.
   * See lessons/page-tapes.md#tapes-75
   */
  const SPIN_DOWN_MS = 260;          // the reel coasting to a stop
  const SPIN_UP_MS = 420;            // and the motor pulling it back up
  /**
   * The way button's arc is shorter (150 and 230 ms) because a kept lap is about
   * 0.5 s. Same curve, floor and landing; only the spans differ, per arc.
   * See lessons/page-tapes.md#tapes-76
   */
  const MODE_DOWN_MS = 150;
  const MODE_UP_MS = 230;
  /**
   * A glide has one span because it has no bottom; 320 ms is about the reel arc's
   * time to its floor.
   * See lessons/page-tapes.md#tapes-77
   */
  const GLIDE_MS = 320;
  /**
   * The floor is a sixteenth, not nought: rate 0 pauses the element, and a browser
   * stops making sound below about a sixteenth anyway.
   * See lessons/page-tapes.md#tapes-78
   */
  const SPIN_FLOOR = 0.0625;
  // Ease out, both ways: a reel coasts fastest the instant you let go, and a
  // motor pulls hardest against a stopped one. Both arcs move most at their
  // start and approach their end.
  const ease = (f) => 1 - (1 - f) * (1 - f);

  /**
   * The armed speed, read from `deck.targetRate()`, the same source the buttons paint from.
   * See lessons/page-tapes.md#tapes-79
   */
  const armedRate = () => tapeDeck.targetRate?.() ?? 1;
  const setMediaRate = (r) => {
    try { audio.playbackRate = Math.max(SPIN_FLOOR, Math.min(4, r)); }
    catch { /* a rate a browser will not take is not worth taking the page for */ }
  };
  /**
   * One write for the whole machine: the element and `looper.setRate`, since a loop
   * may be what is heard. It multiplies with `half`.
   * See lessons/page-tapes.md#tapes-80
   */
  const setSpinRate = (r) => { setMediaRate(r); looper.setRate(r); };

  let spin = null;                   // the arc in flight, or nothing
  let lastSpin = null;               // what the last climb actually moved

  /**
   * Is there anything with momentum: the tape, or a lap off the ring. Not called
   * `rolling`, which the loop check below declares for itself.
   * See lessons/page-tapes.md#tapes-81
   */
  const moving = () => !audio.paused || looper.playing();
  /** Where the machine is right now, which is the arc's own value while one runs. */
  const nowRate = () => (spin ? spin.rate : audio.playbackRate) || 1;

  /**
   * Start the arc, or fold a second press into the running one. Presses are counted
   * so two compose into one bottom. A press during the climb turns it back down.
   * See lessons/page-tapes.md#tapes-82
   */
  function ride({ dir = 0, ways = 0, downMs, upMs }) {
    if (spin) {
      if (dir) spin.want = (spin.want == null ? cur : spin.want) + dir;
      spin.ways += ways;
      // The longer pair wins, because the bigger event is about to happen at the bottom.
      // See lessons/page-tapes.md#tapes-83
      spin.downMs = Math.max(spin.downMs, downMs);
      spin.upMs = Math.max(spin.upMs, upMs);
      if (spin.phase !== 'down') {
        spin.phase = 'down'; spin.t0 = performance.now(); spin.from = spin.rate;
      }
      return;
    }
    const r = nowRate();
    spin = { phase: 'down', t0: performance.now(), from: r, rate: r, mediaAt: 0,
             want: dir ? cur + dir : null, ways, downMs, upMs, glideMs: 0 };
    setSpinRate(r);
  }

  /** ‹ and ›. `dir` is -1 or +1. */
  function walk(dir) {
    if (!tapes.length) return;
    // Stopped: there is no momentum to spend, so go straight there.
    if (audio.paused) { select(cur + dir, { play: false, quiet: checking }); return; }
    ride({ dir, downMs: SPIN_DOWN_MS, upMs: SPIN_UP_MS });
  }

  /**
   * The button glued to LOOP, cycling → ← ⇆. Wraps `wayExtra()`'s own `onPress`
   * (`looper.cycle`), so this decides only when a press lands.
   * See lessons/page-tapes.md#tapes-84
   */
  function turnWay(press) {
    if (!looper.playing()) { press(); return; }
    ride({ ways: 1, downMs: MODE_DOWN_MS, upMs: MODE_UP_MS });
  }

  /**
   * A speed was armed on the picker: glide to it. An arc in flight is left alone,
   * since its climb reads `armedRate()` every frame.
   * See lessons/page-tapes.md#tapes-85
   */
  function glide() {
    const r = armedRate();
    if (spin) return;
    if (!moving()) { setSpinRate(r); return; }
    spin = { phase: 'glide', t0: performance.now(), from: nowRate(), rate: nowRate(),
             mediaAt: 0, want: null, ways: 0, downMs: 0, upMs: 0, glideMs: GLIDE_MS };
  }

  /** One step of the arc. Driven from `frame()`, because this page runs ONE loop. */
  function spinTick(now) {
    if (!spin) return;
    const span = spin.phase === 'down' ? spin.downMs
      : spin.phase === 'glide' ? spin.glideMs : spin.upMs;
    const to = spin.phase === 'down' ? SPIN_FLOOR : armedRate();
    const f = span > 0 ? Math.min(1, (now - spin.t0) / span) : 1;
    spin.rate = spin.from + (to - spin.from) * ease(f);
    setSpinRate(spin.rate);
    if (f < 1) return;
    if (spin.phase === 'down') {
      // The bottom of the arc, where everything discontinuous happens. `play` follows
      // what the page is doing now, so a pause during the wind-down holds.
      // See lessons/page-tapes.md#tapes-86
      if (spin.want != null) {
        const next = ((spin.want % tapes.length) + tapes.length) % tapes.length;
        // A walk back to where it started changes no reel, so nothing buffered is thrown away.
        // See lessons/page-tapes.md#tapes-87
        if (next !== cur) select(next, { play: !audio.paused, quiet: checking });
      }
      // Way presses land here too: `setWay` builds a new voice, a discontinuity the
      // wind-down hides. Presses are applied as cycles, so → ← ⇆ → comes back to →.
      // See lessons/page-tapes.md#tapes-88
      for (let i = 0; i < spin.ways; i++) looper.cycle();
      spin.ways = 0;
      // A new source resets `playbackRate` and a new voice keeps the looper's last rate,
      // so set the floor again or it snaps to full speed at the bottom.
      // See lessons/page-tapes.md#tapes-89
      setSpinRate(spin.rate);
      spin.phase = 'up';
      spin.t0 = now;
      spin.from = spin.rate;
      spin.mediaAt = audio.currentTime * 1000;
      return;
    }
    endSpin();
  }

  /**
   * The arc ends on exactly what the picker shows, not the curve's last value.
   * See lessons/page-tapes.md#tapes-90
   */
  function endSpin() {
    const s = spin; spin = null;
    const r = armedRate();
    audio.defaultPlaybackRate = r;
    audio.playbackRate = r;
    // The loop lands too.
    // See lessons/page-tapes.md#tapes-91
    looper.setRate(r);
    // Only a climb is reported: a glide has no `mediaAt` to measure against.
    // See lessons/page-tapes.md#tapes-92
    if (s && s.phase === 'up') spinReport(s, r);
  }

  /**
   * Was that a reel coming up to speed, or a hole where the next recording had not
   * arrived? An ease-out from the floor averages the floor plus two thirds of the
   * climb; what actually went past is read off the element.
   * See lessons/page-tapes.md#tapes-93
   */
  function spinReport(s, armed) {
    // The arc's own span: grading the way button against `SPIN_UP_MS` would call a
    // working climb a stall.
    // See lessons/page-tapes.md#tapes-94
    const want = s.upMs * (SPIN_FLOOR + (armed - SPIN_FLOOR) * 2 / 3);
    const got = Math.max(0, audio.currentTime * 1000 - s.mediaAt);
    lastSpin = { want: Math.round(want), got: Math.round(got), rate: audio.playbackRate };
    // A log line, because this is a thing that HAPPENED rather than a number on
    // a clock, and because a silent climb is otherwise indistinguishable from
    // the effect simply not being there.
    if (!checking && got < want * 0.25) {
      d.log(`${tapes[cur]?.title} had not arrived, so the tape came back up on silence`, 'bad');
    }
  }

  /**
   * The way button, with this page's arc in front of the looper's own press, which
   * is kept and called, never reimplemented.
   * See lessons/page-tapes.md#tapes-95
   */
  const wayPress = (() => {
    const e = looper.wayExtra();
    const press = e.onPress;
    return { ...e, onPress: () => turnWay(press) };
  })();

  // The bar owns play, pause, the speeds and the two walk buttons. Nothing on
  // this page duplicates them.
  const bar = createTransportBar(d.el, tapeDeck, {
    scrub: true, endStop: false,
    /**
     * The three moments on a tape: `set` starts keeping while the tape plays the lap,
     * `wrap` swaps the tape for the ring, `off` gives the tape back.
     * `/archive/radio/` uses `fill` and `set` because its sound arrives later.
     * See lessons/page-tapes.md#tapes-96
     */
    onLoop: (what, a, b) => {
      if (what === 'set') loopSet(a, b);
      else if (what === 'wrap') loopWrap();
      else if (what === 'off') loopOff();
    },
    /**
     * Where the sound is inside the loop, from the looper's voice clock: the bar's `f`
     * is wrong under `back`, `half` and `chop`. `f` still serves while keeping a lap.
     * See lessons/page-tapes.md#tapes-97
     */
    onLoopPos: (f) => scope.playhead?.(f == null ? null : (looper.headFrac() ?? f)),
    /**
     * One button right of LOOP, cycling → ← ⇆, as on `/archive/radio/`. The arc is
     * this page's: putting it in `demo/shell/looper.mjs` would give it to every page.
     * See lessons/page-tapes.md#tapes-98
     */
    loopExtras: [wayPress],
    /**
     * The rate has to reach the element: the deck follows it and is re-anchored.
     * Both attributes, since a new source resets `playbackRate` to `defaultPlaybackRate`.
     * See lessons/page-tapes.md#tapes-99
     */
    /**
     * Hands off a running arc: it reads the armed speed every frame.
     * See lessons/page-tapes.md#tapes-100
     */
    /**
     * It moves the loop too, since the tape is down while a loop plays. `half`
     * multiplies with this.
     * See lessons/page-tapes.md#tapes-101
     */
    /**
     * `glide()` owns both rate writes. `defaultPlaybackRate` moves at once: it is what
     * a new source comes back to.
     * See lessons/page-tapes.md#tapes-102
     */
    onRate: () => {
      audio.defaultPlaybackRate = armedRate();
      glide();
    },
    extras: [
      { id: 'prev', label: '‹', aria: 'the tape before this one', onClick: () => walk(-1) },
      { id: 'next', label: '›', aria: 'the tape after this one', onClick: () => walk(+1) },
    ],
    // Pressing ▸ on a page whose sound has never been touched has to arm the
    // audio graph, and that needs the press. `command` is the bar's own hook
    // for a page that owns the thing being played.
    command: {
      play: () => start(),
      pause: () => audio.pause(),
      /**
       * The deck is told at once and the media catches up: a seek is a range request.
       * It may snap back a frame when `mediaMaster` re-anchors on the sound.
       * See lessons/page-tapes.md#tapes-103
       */
      seek: (pos) => {
        const ms = Math.max(0, pos);
        audio.currentTime = ms / 1000;
        tapeDeck.seek(ms);
      },
    },
  });
  // The way button exists only now, and the looper is the one thing that writes
  // its face: a way reached from the code and a way reached by pressing cannot
  // then disagree about what is showing.
  looper.bind(bar);

  /**
   * The scope and the bar are glued as one surface (not the strip, which is wider
   * than the page). The anchor is read before `createGlue` re-parents the blocks.
   * See lessons/page-tapes.md#tapes-104
   */
  const afterBar = bar.el.nextSibling;
  d.el.insertBefore(createGlue(scope.el, bar.el), afterBar);

  audio.addEventListener('loadedmetadata', () => {
    const ms = Math.round((audio.duration || 0) * 1000);
    if (ms > 0) tapeDeck.setRange([0, ms]);
  });
  /**
   * The ladder for a tape that will not load cross-origin: the file with
   * `crossOrigin`, then the proxy with it, then the file without (plays, graph
   * tainted). Each rung once per tape; `select()` resets the count.
   * See lessons/page-tapes.md#tapes-105
   */
  let rung = 0;
  function retryOpen() {
    const it = tapes[cur];
    if (!it || !audio.crossOrigin) return false;
    if (rung === 0 && PROXY) {
      rung = 1;
      // The crossing stays on: the hop exists to return the CORS header.
      // See lessons/page-tapes.md#tapes-106
      audio.src = proxiedOf(it);
      d.log(`${it.title}: its host would not let this page read the sound, so it is being `
        + 'asked for again through the proxy');
      return true;
    }
    if (rung >= 2) return false;
    rung = 2;
    audio.crossOrigin = null;
    audio.src = srcOf(it);
    /**
     * Said in the picture, not in the fault colour: the sound plays, only the drawing
     * is refused. The storage node sent no CORS header, so the graph is tainted.
     * The line says whether the proxy was tried.
     * See lessons/page-tapes.md#tapes-107
     */
    scope.source('this recording will not let a page read its sound, so there is no wave');
    d.log(`${it.title}: the sound is playing. Its host will not let this page READ it, `
      + `so there is no waveform for this one${PROXY ? ', and the proxy could not either' : ''}`);
    return true;
  }
  audio.addEventListener('error', () => {
    if (retryOpen()) return;
    d.log(`this one would not load: ${tapes[cur]?.title}`, 'bad');
  });

  /**
   * Wait for the loaded tape to be playable, or say it is not. Not ready until the
   * length is known. Deadline `HEARD_MS`, inside the harness's 7.4 s budget;
   * normal waits are 0.8 s to 3.3 s.
   * See lessons/page-tapes.md#tapes-108
   */
  // One constant, used by the wait and by the words that report it.
  // See lessons/page-tapes.md#tapes-109
  const HEARD_MS = 4500;
  /**
   * One deadline for being ready that every later wait draws on: waits in series are
   * bounded only by their sum. `demo/verify.mjs` allows 7.4 s; this is that minus
   * the walk check's 0.7 s and a margin. Past it each wait falls to its floor.
   * See lessons/page-tapes.md#tapes-110
   */
  const READY_BUDGET_MS = 5500;
  const left = (floor) => Math.max(floor, READY_BUDGET_MS - performance.now());
  /**
   * Do not call this right after setting `src`: `readyState` still describes the
   * previous file for one turn.
   * See lessons/page-tapes.md#tapes-111
   */
  function playable_now(ms = HEARD_MS) {
    if (audio.readyState >= 3) return Promise.resolve(true);
    return new Promise((res) => {
      const done = (ok) => { clearTimeout(t); audio.removeEventListener('canplay', on);
                             audio.removeEventListener('error', bad); res(ok); };
      const on = () => done(true), bad = () => done(false);
      const t = setTimeout(() => done(false), ms);
      audio.addEventListener('canplay', on, { once: true });
      audio.addEventListener('error', bad, { once: true });
    });
  }

  // ── go ──────────────────────────────────────────────────────────────────
  let loaded = false, heard = false, walked = null, fromCorpus = 0;
  // what the element was holding after the page had opened and before any
  // check or any finger touched it. '' is the answer a visitor must get.
  let coldSrc = null;
  try {
    const res = await fetch(CORPUS);
    if (!res.ok) throw new Error(`${CORPUS} answered ${res.status}`);
    const corpus = await res.json();
    items = corpus.items || [];
    loaded = items.length > 0;
    // Dated first and in order, undated appended — so ‹ and › walk history
    // where there is any, and the rest are still reachable rather than hidden.
    tapes = items.filter(playable).sort((a, b) =>
      (a.when.earliest ?? Infinity) - (b.when.earliest ?? Infinity));
    // The widths are right in the first frame. See `lengthsFromCorpus`.
    // See lessons/page-tapes.md#tapes-112
    fromCorpus = lengthsFromCorpus();
    reschedule();
    master = mediaMaster(tapeDeck, audio, { anchorMs: 0 });
    frame();
    /**
     * Every run walks the visitor's path first: no file is opened. `coldSrc` is read
     * on every run, the suite's too, and asserted at the foot of this file.
     * See lessons/page-tapes.md#tapes-113
     */
    select(0, { load: false });
    coldSrc = audio.src;
    // The checks need a recording, so they open one deliberately, which is the
    // same line `start()` runs when a finger lands on play.
    if (SELFCHECK) audio.src = srcOf(tapes[cur]);
    /**
     * The walk buttons on a stopped machine, graded here before the first-tape wait,
     * so their loads land before the page says it is finished. Behind the gate:
     * three file loads.
     * See lessons/page-tapes.md#tapes-114
     */
    if (SELFCHECK) {
      walked = { from: cur, armed: armedRate() };
      bar.extra('next')?.click();
      walked.on = cur;
      walked.rate = audio.playbackRate;
      bar.extra('prev')?.click();
      walked.back = cur;
    }
    // The undated count is said once in the log rather than widening the gutter.
    // See lessons/page-tapes.md#tapes-115
    const undated = items.filter((it) => playable(it) && it.when?.earliest == null).length;
    d.log(`${items.length} records, ${tapes.length} of them playable`
      + `${undated ? `. ${undated} of those have no date and cannot be on the axis` : ''}`, 'hi');
    // Said out loud when a run points somewhere other than archive.org, so lines about
    // a stand-in do not read as the real thing.
    // See lessons/page-tapes.md#tapes-116
    if (BASE) d.log(`these recordings are coming from ${BASE}, not from the archive they `
      + 'are listed at. Nothing here is a fact about anybody else\'s server');
    d.log(fromCorpus === tapes.length
      ? `every length came with the list, so nothing was asked of anybody's server: `
        + `${hm(schedule[schedule.length - 1]?.to ?? 0)} of tape`
      : `${fromCorpus} of ${tapes.length} lengths came with the list; the rest will be asked for, `
        + 'one at a time');
    // A visit waits for nothing: no file is open, so the line says the picture is
    // complete and the sound is one press away.
    // See lessons/page-tapes.md#tapes-117
    if (SELFCHECK) {
      heard = await playable_now();
      d.log(heard
        ? `${tapes[cur].title} is loaded, ${(audio.duration / 60).toFixed(1)} minutes long`
        : `${tapes[cur]?.title} has not answered yet; the picture is complete, the sound is not`,
        heard ? 'hi' : 'bad');
    } else {
      const ms = lengths.get(tapes[cur]?.id)?.ms;
      d.log(`${tapes[cur]?.title} is up first${ms > 1000 ? `, ${(ms / 60e3).toFixed(1)} minutes long` : ''}`
        + '. Nothing is fetched until you press play', 'hi');
    }
  } catch (e) {
    now.textContent = 'the list of recordings did not load';
    d.log(`could not read the list: ${e.message}`, 'bad');
  }

  d.assert('the corpus loaded and every record has a place', loaded,
    `${items.length} records`);

  /**
   * Counted off the rows the lane builds, not off the file, so a lane that dropped
   * its spans cannot pass on the file's own counts.
   * See lessons/page-tapes.md#tapes-118
   */
  // The denominator is the lane's own: the claim is that the lane draws every row
  // it says it has.
  // See lessons/page-tapes.md#tapes-119
  const placed = tapeLane.rows().length;
  const claimed = schedule.length;
  const dated = items.filter((it) => it.when?.earliest != null).length;
  /**
   * The loop, driven through its own buttons on a real lap, since the fault lives in
   * the wiring. In order: the wave takes audio while the lap is kept, stops when the
   * ring has it, and the tape goes down. Inaudible: the gate is shut.
   * See lessons/page-tapes.md#tapes-120
   */
  // Behind the gate: this plays a tape and keeps a lap of it. See `SELFCHECK`.
  // See lessons/page-tapes.md#tapes-121
  if (SELFCHECK) {
    const api = window.__demo?.transport;
    const [r0, r1] = tapeDeck.range;
    let kept = null, keepingStats = null, during = null, after = null, before = null;
    let mutedWhile = null, backOk = null, faces = '', rolling = false;
    // What the wind-down on a way press actually did, sampled on the LOOP's rate.
    const wayArc = []; let wayLanded = null;
    if (api && r1 > r0) {
      // The graph has to exist before the ring can keep anything.
      // See lessons/page-tapes.md#tapes-122
      armAnalyser();
      before = scope.stats();
      // At the head of the tape, already buffered by `playable_now()`: a seek mid-file
      // cost 1.1 to 12 s. Half a second of lap, because the ring closes at the first wrap.
      // See lessons/page-tapes.md#tapes-123
      tapeDeck.seek(r0 + Math.min(200, (r1 - r0) * 0.01));
      api.pressLoop();
      tapeDeck.seek(r0 + Math.min(700, (r1 - r0) * 0.05));
      api.pressLoop();
      // Still arriving: the tape is playing the lap and the ring is filling.
      await new Promise((r) => setTimeout(r, 120));
      keepingStats = scope.stats();
      /**
       * Is the tape actually moving? A browser that blocks autoplay keeps nothing, and
       * that is reported, not failed. If the tape rolls and the lap does not close, red.
       * `startedAt` is read a moment after the marks.
       * See lessons/page-tapes.md#tapes-124
       */
      const startedAt = audio.currentTime;
      await new Promise((r) => setTimeout(r, 160));
      rolling = !audio.paused && audio.currentTime > startedAt;
      // A bounded wait on the wrap, which is a fact about the element, not a clock.
      // See lessons/page-tapes.md#tapes-125
      {
        const cap = performance.now() + Math.min(1800, left(600));
        while (!looper.playing() && performance.now() < cap) {
          await new Promise((r) => setTimeout(r, 50));
        }
      }
      kept = looper.buffer()?.duration ?? 0;
      during = scope.stats();
      // The tape fades over 12 ms, so the gain is read after it; four time constants
      // is 1.8% of the start.
      // See lessons/page-tapes.md#tapes-126
      await new Promise((r) => setTimeout(r, 80));
      mutedWhile = liveIn ? liveIn.gain.value : null;
      /**
       * The way button, pressed like a finger, and the mirror checked on four samples
       * against the kept seconds at the mirrored index.
       * See lessons/page-tapes.md#tapes-127
       */
      /**
       * Waits for the arc, not a fixed sleep: the way changes at the bottom of the
       * wind-down.
       * See lessons/page-tapes.md#tapes-128
       */
      const landed = async () => {
        for (let i = 0; i < 40 && spin; i++) await new Promise((r) => setTimeout(r, 25));
        await new Promise((r) => setTimeout(r, 40));
      };
      if (looper.playing()) {
        const wayBtn = bar.loopExtra('way');
        faces = wayBtn ? wayBtn.textContent : '';
        // The arc is sampled on the loop's own rate, not the element's: the tape is down
        // while a lap plays.
        // See lessons/page-tapes.md#tapes-129
        const armed = armedRate();
        wayBtn?.click();                      // → becomes ←
        for (let i = 0; i < 60 && spin; i++) {
          await new Promise((r) => requestAnimationFrame(r));
          wayArc.push(looper.rate());
        }
        await landed();
        wayArc.push(looper.rate());
        wayLanded = { armed, low: wayArc.length ? Math.min(...wayArc) : null,
                      home: looper.rate() };
        faces += wayBtn ? wayBtn.textContent : '';
        const a = looper.buffer()?.getChannelData(0);
        const b = looper.mirror()?.getChannelData(0);
        const reads = looper.voiceBuffer() === looper.mirror();
        let same = 0;
        if (a && b) {
          for (const f of [0.03, 0.31, 0.62, 0.94]) {
            const i = Math.min(a.length - 1, Math.max(0, Math.round(f * (a.length - 1))));
            if (a[i] === b[a.length - 1 - i]) same++;
          }
        }
        backOk = { reads, same, way: looper.wayName() };
        wayBtn?.click();                      // ← becomes ⇆
        await landed();
        faces += wayBtn ? wayBtn.textContent : '';
        wayBtn?.click();                      // and back to →, where it started
        await landed();
      }
      api.pressLoop();                        // off
      await new Promise((r) => setTimeout(r, 140));
      after = scope.stats();
    }
    d.assert('a loop keeps the lap, plays it from the ring, and all of it undoes',
      !during ? false : !rolling ? true : kept > 0
      && !keepingStats.frozen && keepingStats.inferred > before.inferred
      && during.frozen && during.playhead != null
      && mutedWhile !== null && mutedWhile < 0.05
      && !!after && !after.frozen && after.playhead == null && !looper.playing()
      && (liveIn ? liveIn.gain.value > 0.5 : false),
      // Every half of the claim is in the detail, not just the ones that failed.
      // See lessons/page-tapes.md#tapes-130
      !during ? 'the bar drew no loop button to press'
        : !rolling ? 'this browser will not start a tape before somebody presses something, so '
          + 'nothing went past to be kept and this run could not grade it'
        : `${kept.toFixed(2)} s kept · frozen ${keepingStats.frozen} then `
          + `${during.frozen} then ${after?.frozen} · line `
          + `${during.playhead?.toFixed?.(3) ?? 'none'} then ${after?.playhead ?? 'none'} · `
          + `the wave took ${keepingStats.inferred - before.inferred} more frames while it `
          + `was being kept · the tape went down to ${mutedWhile?.toFixed(3)} and back to `
          + `${liveIn ? liveIn.gain.value.toFixed(3) : '?'} · `
          + `voice ${looper.playing() ? 'STILL RUNNING' : 'stopped'}`);

    d.assert('the button turns the kept lap round, and backwards is the same samples mirrored',
      !rolling ? true
        : !!backOk && backOk.way === 'back' && backOk.reads && backOk.same === 4
          && faces === '→←⇆',
      !rolling ? 'nothing was playing to keep, so there was no lap to turn round'
        : !backOk ? 'a lap went past and the ring kept none of it'
        : `the faces went ${faces.split('').join(' ')} · the voice reads `
          + `${backOk.reads ? 'the mirror' : 'THE ORIGINAL'} · `
          + `${backOk.same} of 4 sample(s) match the kept seconds reversed`);

    /**
     * A mode change winds the lap down and back, and must land exactly on the armed
     * rate. Measured on `looper.rate()`, the thing being heard. A browser that blocks
     * autoplay is reported in words, not graded.
     * See lessons/page-tapes.md#tapes-131
     */
    d.assert('a mode change winds the lap down and brings it back to the speed on the picker',
      !rolling ? true
        : !!wayLanded && wayLanded.low < wayLanded.armed * 0.5
          && wayLanded.home === wayLanded.armed,
      !rolling ? 'nothing was playing to turn round, so there was nothing to wind down'
        : !wayLanded ? 'a lap went past and the ring kept none of it'
        : `pressed the way button at ${wayLanded.armed}x: the lap went down to `
          + `${wayLanded.low?.toFixed(3)}x over ${wayArc.length} frames and came home to `
          + `${wayLanded.home}x`);
  }

  /**
   * The claims for the end to end axis.
   * See lessons/page-tapes.md#tapes-132
   */
  d.assert('every tape that plays has a place in the run',
    schedule.length === tapes.length && schedule.length > 0,
    `${schedule.length} placed of ${tapes.length} playable, `
    + `${items.length - tapes.length} records in the corpus that do not play`);

  // They tile: each tape starts exactly where the one before ended.
  // See lessons/page-tapes.md#tapes-133
  {
    let gaps = 0, worst = 0;
    for (let i = 1; i < schedule.length; i++) {
      const d0 = Math.abs(schedule[i].from - schedule[i - 1].to);
      if (d0 > 0.5) { gaps++; worst = Math.max(worst, d0); }
    }
    d.assert('the tapes are laid end to end, with nothing between them',
      schedule.length > 1 && gaps === 0,
      gaps ? `${gaps} gap(s), the worst ${worst.toFixed(1)} ms`
           : `${schedule.length} tapes, every one starting where the last ended`);
  }

  // A width is a length: measured tapes are drawn at their real duration, guesses
  // are said in the gutter.
  // See lessons/page-tapes.md#tapes-134
  {
    // No wait here: anything slept before ready comes out of the harness's
    // `__demo.ready` budget. It grades what has arrived.
    // See lessons/page-tapes.md#tapes-135
    const measured = schedule.filter((sl) => sl.measured);
    const spans = measured.map((sl) => sl.to - sl.from);
    const varied = spans.length > 1 && Math.max(...spans) > Math.min(...spans) * 1.2;
    // Hosts that have not answered are not a failure; it fails when they answered and
    // every bar is the same width anyway. The gutter line is read off the strip's lane.
    // See lessons/page-tapes.md#tapes-136
    const gutter = view.strip.lanes().find((l) => l.id === 'tapes')?.subLabel ?? '';
    d.assert('a bar is as wide as its tape is long, and the lane says so in its gutter',
      (measured.length === 0 || varied) && !!gutter,
      (measured.length
        ? `${measured.length} of ${schedule.length} measured, `
          + `${(Math.min(...spans) / 60e3).toFixed(1)} to ${(Math.max(...spans) / 60e3).toFixed(1)} minutes`
        : 'no host answered in time, so this run did not grade the widths')
        + ` · the gutter reads ${gutter ? `"${gutter}"` : 'NOTHING'}`);
  }

  /**
   * Grades the bars the strip actually drew, not `schedule`, and that they are
   * `crisp`: a span built from a date would be feathered with bracket ends.
   * See lessons/page-tapes.md#tapes-137
   */
  {
    // A check may read the picture but must not move it: `frame()` puts a moment 38%
    // across, so framing nought shows time before the run.
    // See lessons/page-tapes.md#tapes-138
    const st = view.strip.spanStates('tapes');
    // `spanStates` reports only what is in the window, so the count is checked against
    // the tapes that overlap it.
    // See lessons/page-tapes.md#tapes-139
    const w = st?.window || [0, 0];
    const inView = schedule.filter((sl) => sl.to >= w[0] && sl.from <= w[1]).length;
    d.assert('the bars on the picture are the run, drawn exact, with no date brackets on them',
      !!st && st.n === inView && st.n > 0 && st.crisp === st.n && st.smeared === 0,
      st ? `${st.n} bars for the ${inView} tapes in a `
           + `${((w[1] - w[0]) / 60e3).toFixed(0)} minute window of a `
           + `${((mapDeck.range[1] - mapDeck.range[0]) / 60e3).toFixed(0)} minute run · `
           + `${st.crisp} exact, ${st.smeared} drawn as a date range`
         : 'the lane reported nothing');
  }

  /**
   * The opening move is graded on `zoomSaw`: started at the whole run, ended at the
   * hour, passed through the middle. It waits for the move; `openFinish()` is only
   * for the deadline case, so the asserts below read a settled view.
   * See lessons/page-tapes.md#tapes-140
   */
  {
    const run = mapDeck.range[1] - OPENS;
    const want = Math.min(OPEN_SPAN_MS, run);
    const cap = performance.now() + OPEN_ZOOM_MS + 400;
    while (zoom && performance.now() < cap) {
      await new Promise((r) => requestAnimationFrame(r));
    }
    const ranFor = zoomSaw.length;
    openFinish();
    const first = zoomSaw[0] ?? 0, last = zoomSaw[zoomSaw.length - 1] ?? 0;
    // Somewhere in between, which is what tells an eased move from a cut.
    const middles = zoomSaw.filter((w) => w < run * 0.95 && w > want * 1.15).length;
    d.assert('the picture opens on the whole run and closes itself onto an hour',
      ranFor > 4 && first > run * 0.9 && last <= want * 1.02 && middles > 0,
      ranFor
        ? `${ranFor} frames from ${(first / 60e3).toFixed(0)} minutes wide down to `
          + `${(last / 60e3).toFixed(0)}, ${middles} of them in between`
        : 'the opening move never ran');
  }

  /**
   * And then the window follows the tape without running off either end, driven by
   * the page's own animation loop.
   * See lessons/page-tapes.md#tapes-141
   */
  {
    const run = mapDeck.range[1] - OPENS;
    const span = Math.min(OPEN_SPAN_MS, run);
    const late = Math.max(0, tapes.length - 3);
    const was = cur;
    const from0 = view.strip.view().originTime;
    // The map is moved directly, not by loading a file, so no fetch is in the air when
    // the page says it is ready.
    // See lessons/page-tapes.md#tapes-142
    const at = schedule[late] ? schedule[late].from + 1000 : run * 0.9;
    scrubbing = true;                    // the frame loop must not write it back
    mapDeck.seek(at);
    await new Promise((r) => requestAnimationFrame(r));
    await new Promise((r) => requestAnimationFrame(r));
    const v = view.strip.view();
    const from = v.originTime;
    const to = from + span;
    scrubbing = false;
    mapDeck.seek(schedule[was]?.from ?? OPENS);
    openFinish();                        // put the window back over the loaded tape
    d.assert('the window follows the tape by itself, and stops at the ends of the run',
      from > from0 && at >= from && at <= to && from >= OPENS - span * 0.05
        && from <= Math.max(OPENS, mapDeck.range[1] - span) + span * 0.05,
      `the playhead at ${(at / 60e3).toFixed(1)} min brought the window from `
      + `${(from0 / 60e3).toFixed(1)} to ${(from / 60e3).toFixed(1)} min, `
      + `over a ${(run / 60e3).toFixed(0)} minute run`);
  }

  // The picture opens on an hour, none of it before nought. Read off the strip's
  // actual view and graded against `OPEN_SPAN_MS`.
  // See lessons/page-tapes.md#tapes-143
  {
    const v = view.strip.view();
    const run = mapDeck.range[1] - mapDeck.range[0];
    const from = v.originTime + (v.scrollX / v.pxPerSecond) * 1000;
    const to = from + (view.el.getBoundingClientRect().width - 78) / v.pxPerSecond * 1000;
    const span = to - from;
    // A run shorter than the window cannot be an hour wide, and asking it to be
    // would fail a page whose tapes simply have not arrived yet. `fit` also
    // adds 2% of padding at each end, so the window is a little over the span.
    const want = Math.min(OPEN_SPAN_MS, run);
    d.assert('the picture opens on an hour, and not on empty time before it',
      run > 0 && from > -0.05 * OPEN_SPAN_MS && span > want * 0.9 && span < want * 1.4,
      `the axis runs ${(from / 60e3).toFixed(1)} to ${(to / 60e3).toFixed(1)} minutes, `
      + `${(span / 60e3).toFixed(1)} wide, against the ${(want / 60e3).toFixed(0)} asked for, `
      + `over a ${(run / 60e3).toFixed(0)} minute run`);
  }

  /**
   * How tall the tape is drawn, read off the canvas: the tallest run of ink in the
   * lane against the 22 px asked for, not re-derived from `height - barPad * 2`.
   * See lessons/page-tapes.md#tapes-144
   */
  {
    const TAPE_PX = 22;                  // what "same tape h" means, in numbers
    const L = view.strip.lanes().find((l) => l.id === 'tapes');
    const c = view.strip.canvas;
    const box = c.getBoundingClientRect();
    const dpr = box.width ? c.width / box.width : 1;
    let ink = 0, cols = 0;
    if (L && c.width && box.width) {
      const g = c.getContext('2d');
      const v = view.strip.view();
      // Where the first bar on screen is, in CSS pixels, from the same numbers
      // the renderer used: gutter, origin, scale.
      const xOf = (t) => 78 + ((t - v.originTime) / 1000) * v.pxPerSecond - v.scrollX;
      const seen = schedule.filter((sl) => xOf(sl.to) > 90 && xOf(sl.from) < box.width - 4);
      const top = Math.round(L.y * dpr), bot = Math.round((L.y + L.height) * dpr);
      for (const sl of seen.slice(0, 3)) {
        const x0 = Math.max(80, xOf(sl.from) + 3), x1 = Math.min(box.width - 2, xOf(sl.to) - 3);
        for (let x = x0; x < x1; x += 2) {
          const px = Math.round(x * dpr);
          if (px < 0 || px >= c.width) continue;
          const col = g.getImageData(px, top, 1, Math.max(1, bot - top)).data;
          // The lane's own background, taken from this column's top pixel: the
          // bar sits `barPad` below it, so the top of the lane is always field.
          const [br, bg, bb] = [col[0], col[1], col[2]];
          let run = 0, best = 0;
          for (let i = 0; i < col.length; i += 4) {
            const near = Math.abs(col[i] - br) + Math.abs(col[i + 1] - bg) + Math.abs(col[i + 2] - bb);
            if (near > 24) { run++; if (run > best) best = run; } else run = 0;
          }
          cols++;
          if (best > ink) ink = best;
        }
      }
    }
    const drawn = ink / dpr;
    d.assert('a tape is drawn as tall as it was asked to be, in a lane twice that',
      cols > 0 && Math.abs(drawn - TAPE_PX) <= 2 && L.height >= TAPE_PX * 2.5,
      cols ? `${drawn.toFixed(0)} px of tape over ${cols} columns, against the ${TAPE_PX} asked `
             + `for, in a lane ${L.height} px tall`
           : 'no bar was on screen to measure');
  }

  d.assert('the two clocks are still different clocks',
    mapDeck.range[1] - mapDeck.range[0] > tapeDeck.range[1] - tapeDeck.range[0]
      && tapeDeck.range[0] === 0,
    `the run is ${((mapDeck.range[1] - mapDeck.range[0]) / 60e3).toFixed(0)} minutes of tape; `
    + 'one tape runs from nought to its own length');

  // Stopped, a walk is a cut; the speed is read either side and must not change.
  // See lessons/page-tapes.md#tapes-145
  if (SELFCHECK) d.assert('stopped, the walk buttons step straight to the next tape and back',
    !!walked && walked.on === walked.from + 1 && walked.back === walked.from
      && walked.rate === walked.armed,
    walked && walked.on !== undefined
      ? `tape ${walked.from + 1} to ${walked.on + 1} and back to ${walked.back + 1}, `
        + `at ${walked.rate}x throughout: nothing was moving, so there was nothing to wind down`
      : 'the bar drew no walk buttons to press');

  d.assert('there is something to press, and it is served from somewhere else',
    tapes.length > 0 && tapes.every((t) => !t.file.startsWith(location.origin)),
    `${tapes.length} tapes, none of them ours`);

  /**
   * The range comes from `corpus.json` via `select()`, so this passes with no file
   * fetched. It says whether the number came from the corpus or the file.
   * See lessons/page-tapes.md#tapes-146
   */
  d.assert('the tape says how long it is, so the transport has somewhere to go',
    tapeDeck.range[1] > 1000,
    `${Math.round(tapeDeck.range[1] / 1000)} s of tape, from `
    + `${heard ? 'the file itself' : 'the corpus, with nothing fetched'}`);

  // The playhead follows the media, not a clock of its own: it moved, and to where
  // the media is. Inaudible: the gate stays shut until a trusted press on play.
  // See lessons/page-tapes.md#tapes-147
  let followed = null, silent = null;
  if (heard) {
    peak = 0; outPeak = 0;
    const from = Math.round(audio.currentTime * 1000);
    await start();
    // A quarter second of tape, waited for with `ranFor` rather than slept: the
    // harness allows 7.4 s for `__demo.ready`.
    // See lessons/page-tapes.md#tapes-148
    await ranFor(250, left(250));
    followed = { deck: tapeDeck.position(), media: Math.round(audio.currentTime * 1000) };
    // How far it ran, not where it is: the loop check leaves the playhead at its first mark.
    // See lessons/page-tapes.md#tapes-149
    silent = { tape: peak, out: outPeak, ran: followed.media - from };
    audio.pause();
  }
  if (SELFCHECK) d.assert('the playhead follows the tape, not a clock of its own',
    !!followed && followed.deck > 200 && Math.abs(followed.deck - followed.media) < 400,
    followed ? `the tape is at ${followed.media} ms and the playhead at ${Math.round(followed.deck)} ms`
             : 'nothing loaded to follow');

  // Nothing reached the speakers, measured after the gate, with the tape's own level
  // beside it. A browser that refused to start the tape is reported, not failed; any
  // sound at the speakers is red.
  // See lessons/page-tapes.md#tapes-150
  if (SELFCHECK) d.assert('the page makes no sound until somebody presses play',
    !!silent && silent.out === 0,
    !silent ? 'nothing loaded, so nothing could have been heard'
      : silent.ran > 200
        ? `the check ran ${silent.ran} ms of tape at ${silent.tape.toFixed(3)} `
          + `and the speakers got ${silent.out.toFixed(4)}`
        : 'this browser will not start a tape before somebody presses something, so this run '
          + 'could not put sound behind the gate. The speakers got nothing');

  /**
   * The rate buttons reach the tape, pressed through the button. It starts the tape,
   * since a glide needs something moving, samples every frame, ends exactly on the
   * picker's speed, and pauses again.
   * See lessons/page-tapes.md#tapes-151
   */
  // Behind the gate: a rate is a fact about a tape that is running.
  // See lessons/page-tapes.md#tapes-152
  if (SELFCHECK) {
    const btn = (r) => bar.el.querySelector(`[data-rate="${r}"]`);
    // Not called `ride`, which is the arc's own entry point.
    // See lessons/page-tapes.md#tapes-153
    const settle = async (seen) => {
      for (let i = 0; i < 60 && spin; i++) {
        await new Promise((r) => requestAnimationFrame(r));
        seen?.push(audio.playbackRate);
      }
      return audio.playbackRate;
    };
    let rolled = false, fast = null, slow = null;
    const seen = [];
    if (btn(2) && btn(1)) {
      await start();
      rolled = !audio.paused;
      btn(2).click();
      fast = await settle(seen);
      btn(1).click();
      slow = await settle(null);
      audio.pause();
    }
    const between = seen.filter((v) => v > 1.001 && v < 1.999).length;
    d.assert('the rate buttons change the speed the tape plays at, and it glides there',
      !!btn(2) && fast === 2 && slow === 1 && (!rolled || between > 0),
      !btn(2) ? 'the bar drew no rate buttons to press'
      : !rolled ? 'this browser would not start the tape without a press, so nothing was '
                  + `moving and a speed is a cut: pressing 2 ran the tape at ${fast}x, `
                  + `pressing 1 at ${slow}x`
      : `pressing 2 ran the tape at ${fast}x and pressing 1 at ${slow}x · `
        + `${between} of ${seen.length} frames on the way up sat between the two speeds, `
        + `the first at ${seen[0]?.toFixed(3)} and the last before landing at `
        + `${seen[seen.length - 1]?.toFixed(3)}`);
  }

  // Exactly one mark is ringed and it is the one playing, counted off the lane's
  // own hook rather than the page's variable.
  // See lessons/page-tapes.md#tapes-154
  {
    const L = view.strip.lanes().find((l) => l.id === 'tapes');
    const rows = tapeLane.rows();
    const marked = rows.filter((r) => L.currentOf({ row: r }));
    d.assert('one mark is the tape you are hearing, and the rest are dimmed',
      marked.length === 1 && marked[0].id === tapes[cur].id,
      `${marked.length} of ${rows.length} marks ringed, and it is ${tapes[cur].title}`);
  }

  /**
   * The walk buttons wind down and come home to the picker's speed, pressed through
   * the real button. Whether the next file had arrived is reported, never failed.
   * See lessons/page-tapes.md#tapes-155
   */
  // Behind the gate: a wind-down is measured on a moving reel.
  // See lessons/page-tapes.md#tapes-156
  if (SELFCHECK) {
    const nxt = bar.extra?.('next'), prv = bar.extra?.('prev');
    const was = cur, want = armedRate();
    let mid = null, landed = null, rolled = false;
    if (nxt && prv) {
      // An arc needs something moving to slow down. `start()` no longer awaits
      // the network, and `play()` clears `paused` before it returns, so the
      // press below meets a rolling machine.
      await start();
      // And whether it actually rolled: a stopped walk is a cut by design.
      // See lessons/page-tapes.md#tapes-157
      rolled = !audio.paused;
      nxt.click();

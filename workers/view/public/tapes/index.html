      await new Promise((r) => setTimeout(r, Math.round(SPIN_DOWN_MS * 0.6)));
      mid = audio.playbackRate;
      // ‹ before the bottom cancels the walk: no reel changes and no file is left
      // arriving, the arc is the same, and two presses compose into one arc.
      // See lessons/page-tapes.md#tapes-158
      prv.click();
      for (let i = 0; i < 40 && spin; i++) await new Promise((r) => setTimeout(r, 50));
      landed = audio.playbackRate;
      audio.pause();
    }
    d.assert('a walk winds the tape down and brings it back to the speed on the picker',
      !!nxt && mid !== null && (!rolled || mid < want * 0.9) && landed === want && cur === was,
      !nxt ? 'the bar drew no walk buttons to press'
      : !rolled ? `this browser would not start the tape without a press, so nothing was moving `
                  + `and a walk is a cut: the speed held at ${landed}x and no reel changed`
      : `pressed › at ${want}x: the tape was at ${mid?.toFixed(3)}x through the wind-down `
            + `and came back to ${landed}x`
            + (lastSpin ? ` · ${lastSpin.got} ms of tape went past on the way up, `
                          + `where the curve asks for ${lastSpin.want}` : ''));
  }

  /**
   * One hand on the playhead at a time: a drag and the animation loop must not both
   * write it. Graded through `stripSeek`, the strip's own entry point.
   * See lessons/page-tapes.md#tapes-159
   */
  {
    const run = mapDeck.range[1] - mapDeck.range[0];
    const want = Math.round(run * 0.4);
    stripSeek(want);
    const read = [];
    for (let i = 0; i < 4; i++) {
      await new Promise((r) => requestAnimationFrame(r));
      read.push(Math.round(mapDeck.position()));
    }
    // Hand the page back: no tape half-loaded, no timer left to fire.
    clearTimeout(scrubTimer); scrubTo = null; scrubbing = false;
    const worst = Math.max(...read.map((p) => Math.abs(p - want)));
    d.assert('a drag owns the playhead, and the picture does not fight it',
      run > 0 && worst < 50,
      `asked for ${want} ms and the head read ${read.join(', ')} over four frames, `
      + `the worst ${worst} ms away`);
  }

  // ── the page is the visitor's from here ──
  // The checks hand the page back as they found it: paused, at nought, scope cleared.
  // After every assert, never before one. Always paused, whatever the checks left.
  // See lessons/page-tapes.md#tapes-160
  checking = false;
  audio.pause();
  /**
   * No `src` is set near here: a file landing after ready resets `currentTime` under
   * `mediaMaster`. Every tape the checks load is covered by a wait.
   * See lessons/page-tapes.md#tapes-161
   */
  // The fallback length probe runs after the checks, so it does not compete with
  // them for bandwidth before ready.
  // See lessons/page-tapes.md#tapes-162
  measureLengths();
  // Back to the top, and the picture wiped: the scope draws what it has been
  // fed, so pausing alone leaves the stub standing.
  audio.currentTime = 0;
  tapeDeck.seek(0);
  scope.clear();

  /**
   * The checks ending is not a press: with nobody having pressed, the gain at the
   * gate must read nought.
   * See lessons/page-tapes.md#tapes-163
   */
  /**
   * A cold page opens no recording. `coldSrc` is taken at boot on every run, since
   * the suite takes the visitor's path before opening a file on purpose.
   * See lessons/page-tapes.md#tapes-164
   */
  d.assert('a cold page opens no recording: the first press is what fetches one',
    coldSrc === '',
    coldSrc === '' ? 'the element was empty when the page handed over, so nothing was '
                     + 'asked of anybody\'s server'
                   : `the page had already opened ${coldSrc}`);

  {
    setAudible(true);
    await new Promise((r) => setTimeout(r, 60));   // the gain approaches over 15 ms
    const opened = out ? out.gain.value : 0;
    setAudible(false);
    d.assert('only a press on play can make this page audible',
      asked || opened === 0,
      asked ? 'somebody pressed play while this was loading, so this run cannot ask'
            : `with nobody having pressed, asking for sound left the speakers at ${opened.toFixed(3)}`);
    /**
     * Which controls open the gate, graded on the pure routing function: play opens
     * it, every other bar control does not. Asserts the controls exist, since a
     * selector matching nothing would pass as a refusal.
     * See lessons/page-tapes.md#tapes-165
     */
    {
      const at = (sel) => document.querySelector(`.tbar ${sel}`);
      const play = at('.tbar-toggle');
      const others = [['scrub', at('.tbar-scrub')], ['rate', at('.tbar-rates button')],
        ['loop', at('.tbar-loop')], ['mode', at('.tbar-loopgrp .tbar-x')]]
        .filter(([, e]) => e);
      const opens = play ? window.__gateRoute(play) : null;
      const leaks = others.filter(([, e]) => window.__gateRoute(e)).map(([n]) => n);
      d.assert('the play button opens the sound gate and nothing else on the bar does',
        !!play && opens === true && leaks.length === 0 && others.length >= 2,
        !play ? 'there is no play button on this bar to press'
          : `play ${opens ? 'opens' : 'DOES NOT OPEN'} it; `
            + `of ${others.length} other controls (${others.map(([n]) => n).join(', ')}) `
            + `${leaks.length ? `${leaks.join(' and ')} ALSO open it` : 'none do'}`);
    }
  }
  // Somebody pressed ▸ while the page was still checking itself. That press is
  // theirs and it is honoured here rather than swallowed: the checks are over
  // and the tape is back at its head, so this is where it starts.
  if (asked) start();

  d.ready();
</script>
</html>

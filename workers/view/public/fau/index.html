      await sleep(50);
      const dialCut = knobs.value('cutoff'), nodeCut = addr ? node.getParamValue(addr) : NaN;
      d.assert('NEGATIVE CONTROL: with its cable unlinked the cutoff knob turns and the node is not told',
        dialCut === 100 && paramSends === sendsCut && Math.abs(nodeCut - 8000) < 0.5 && !knobLink('cutoff'),
        `dial ${dialCut}, ${paramSends - sendsCut} setParamValue, the node says ${nodeCut}`);
      bay.link(knobPort.get('cutoff'), FAU_IN());
      pb.refresh();
      const sendsBack = paramSends;
      cutDial().dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
      await sleep(50);
      const nodeBack = addr ? node.getParamValue(addr) : NaN;
      d.assert('and cabled again, the same knob reaches the node',
        paramSends > sendsBack && knobs.value('cutoff') === 8000 && Math.abs(nodeBack - 8000) < 0.5 && (knobLink('cutoff')?.sent ?? 0) > 0,
        `${paramSends - sendsBack} setParamValue, the node says ${nodeBack}`);
    }

    /* Typing into a live instrument: nothing inside the idle wait, then one compile and a different node
       on the thread. Split at half the wait so the harness does not cut the block off.
       See lessons/page-fau.md#fau-114 */
    const liveBefore = { runs, node };
    typeInto(`${PRESETS[0].code}\n// typed into a live instrument\n`);
    await sleep(IDLE_MS / 2);
    d.assert('typing into a live instrument compiles nothing inside the idle wait',
      runs === liveBefore.runs && node === liveBefore.node,
      `${runs - liveBefore.runs} compiles at ${IDLE_MS / 2} ms, the same node on the thread`);
    await idle.settled();
    d.assert('and after the pause it compiles once and the new instrument is the one on the thread',
      runs === liveBefore.runs + 1 && node !== null && node !== liveBefore.node,
      `${runs - liveBefore.runs} compile after the pause, a ${node === liveBefore.node ? 'reused' : 'new'} node, `
      + `compile times seen ${[...moved.get('compile')].join(', ')} ms`);
    source.set(PRESETS[0].code);
    showSource();
    showPatch(0);

    /* `Loop` follows the Evolution, and a looped note is counted where it is
       handed to a voice, as a `keyOn` on the live node. */
    await checkEvolutionLoop(d, {
      keys, heard: () => voiced,
      ports: (names) => offerLoopFor(keys, names, d.log), real: () => midi?.names() ?? [],
    });

    /* Every cell has moved, read off what was written rather than what is on screen now.
       See lessons/page-fau.md#fau-115 */
    const stuck = [...moved].filter(([, seen]) => seen.size < 2).map(([k]) => k);
    d.assert('every cell in the readout took more than one value, so none of them is a constant '
           + 'wearing a measurement\'s clothes',
      stuck.length === 0,
      [...moved].map(([k, seen]) => `${k} ${seen.size}`).join(', '));

    await checkPatchbay();

    /* The instrument is left live with the Organ on the thread, which is what a
       person opening this page with the checks running should find. */
  }

  /**
   * The patchbay half, last, because it plays notes the checks above count. In-memory room and
   * stand-in MIDIAccess (`memoryRelay`, `standInAccess`): no socket, no MIDI prompt.
   * See lessons/page-fau.md#fau-116
   */
  async function checkPatchbay() {
    const waitFor = async (f, ms = 3000) => { const t0 = performance.now(); while (!f() && performance.now() - t0 < ms) await new Promise((r) => setTimeout(r, 20)); return f(); };
    const shown = () => { bayUi.sync(); return getComputedStyle(bayUi.wrap).display !== 'none'; };
    d.assert('building the page joined no room and asked for no MIDI for the patchbay',
      !engine.joined() && !engine.joining() && engine.counts().midiAsked === 0 && !engine.midiStarted(),
      `${engine.counts().midiAsked} MIDI asks, ${engine.joining() ? 'a socket is open' : 'no socket'}`);
    d.assert('this tab is a site of its own and the harness is in a room of its own, never the studio’s',
      /^fau-[a-z0-9]{3}$/.test(engine.site) && engine.room !== 'studio-1', `${engine.site} in ${engine.room}`);
    d.assert('Join sits beside the name on the instrument, outside the row the harness presses, and the badge is not drawn',
      panel.plateRow.contains(bayUi.button) && !bayUi.button.closest('.pos-controls') && !shown(),
      `badge wrapper display ${getComputedStyle(bayUi.wrap).display}`);

    const relay = memoryRelay();
    const access = standInAccess(['Stand-in keys', 'Stand-in pads']);
    await engine.join({ access, wire: relay.open });
    const peer = createBayNode({ room: engine.room, wire: relay.open });
    await peer.join();
    const heard = await waitFor(() => peer.registry.merged().sites.some((s) => s.site === engine.site));
    const g = engine.graph();
    const keysOut = g.ports.find((p) => p.dir === 'out' && /keys/i.test(p.label))?.id;
    const kinds = g.ports.filter((p) => p.id.startsWith(`${engine.site}:fau:`)).map((p) => `${p.id.split(':')[2]} ${p.dir}`).sort().join(', ');
    d.assert('joined, another page hears an engine with a program in, a MIDI in and a sound that stays here, beside the keyboards',
      heard && graphProblem(g) === '' && kinds === 'audio out, midi in, program in'
      && g.ports.find((p) => p.id === engine.ports.audio).transports.join() === 'webaudio'
      && g.nodes.filter((n) => n.kind === 'device').length === 2,
      `${kinds}; ${g.nodes.map((n) => `${n.kind} ${n.id}`).join(', ')}`);

    const v0 = voiced;
    const yes = await peer.request(keysOut, engine.ports.midi, true);
    const startWord = (shown(), engine.badge.says());
    access.emit(0, [0x90, 60, 100]);
    engine.badge.poll();
    const linkedPlayed = voiced - v0;
    access.emit(0, [0x80, 60, 0]);
    d.assert('a keyboard linked on the patchbay plays the engine, and the badge on the panel goes from starting to receiving',
      yes?.open === true && linkedPlayed === 1 && startWord === 'starting' && engine.badge.says() === 'receiving' && shown(),
      `${JSON.stringify(yes?.open)}, ${linkedPlayed} note voiced, the badge said ${startWord} then ${engine.badge.says()}`);
    const v1 = voiced;
    omniHandlers.onDown(62, 100); omniHandlers.onUp(62);
    access.emit(1, [0x90, 64, 100]);
    d.assert('NEGATIVE CONTROL: while that link is open, every other MIDI input plays nothing',
      voiced === v1 && !engine.omni(), `${voiced - v1} notes voiced from unlinked inputs`);
    const no = await peer.request(engine.ports.audio, 'elsewhere:screen:audio', true);
    d.assert('a request to carry this page’s sound anywhere is refused in words',
      no?.open === false && /nothing here carries it off this machine/.test(no.why || ''), no?.why);
    const shut = await peer.request(keysOut, engine.ports.midi, false);
    const v2 = voiced;
    omniHandlers.onDown(62, 100); omniHandlers.onUp(62);
    d.assert('closing the link hands the engine back to every input, and the badge is put away',
      shut?.open === false && engine.omni() && voiced === v2 + 1 && !shown(),
      `${voiced - v2} note from an ordinary input, badge ${shown() ? 'still drawn' : 'gone'}`);
    /* The room hears the knobs, read off the other page's registry. The Djembe types no slider, so
       after it no knob node is announced; the Organ is put back after.
       See lessons/page-fau.md#fau-117 */
    {
      const S = engine.site;
      const heardNow = () => {
        const m = peer.registry.merged();
        const vin = m.ports.find((p) => p.id === FAU_IN());
        const kn = m.nodes.filter((n) => n.id.startsWith(`${S}:knob-`)).map((n) => n.label).sort().join(' ');
        return { names: vin ? vin.shape.names.slice().sort().join(' ') : null, kn,
          outs: m.ports.filter((p) => p.id.startsWith(`${S}:knob-`) && p.dir === 'out').length };
      };
      const want = knobs.names().slice().sort().join(' ');
      const before = heardNow();
      d.assert('another page hears the engine take the knobs in by name, and one knob node with a value out for each',
        want !== '' && before.names === want && before.kn === want && before.outs === knobs.names().length,
        `value-in names ${before.names}, knob nodes ${before.kn || 'none'}, ${before.outs} value outs, the knobs here ${want}`);
      await applyPatch(PRESETS.findIndex((p) => p.id === 'djembe'));
      const emptied = await waitFor(() => heardNow().names === '' && heardNow().kn === '');
      const after = heardNow();
      await applyPatch(0);
      const back = await waitFor(() => heardNow().names === knobs.names().slice().sort().join(' '));
      d.assert('and a recompile is announced: the Djembe takes every knob node off the room, and the Organ puts its own back',
        emptied && after.outs === 0 && back && heardNow().outs === knobs.names().length,
        `Djembe ${after.names === '' ? 'no names' : after.names} and ${after.outs} knob outs, Organ ${heardNow().names}`);
    }
    peer.leave();
    engine.leave();
    d.assert('and leaving stops the re-announce clock', !engine.joined() && !engine.node.stats().ticking);
  }

  ifSelfcheck(checks, { log: d.log,
    say: 'the checks this page runs on itself are off for a visitor, because they compile every '
       + 'preset in the list and play notes in front of you' });

  /* `ready()` after the checks start, not at the end: demo/verify.mjs waits up to six seconds for
     `__demo.ready`, and the checks fetch a compiler.
     See lessons/page-fau.md#fau-118 */
  d.ready();
</script>

<style>
  /* Join and its badge, one cluster beside the name (`engine-node.mjs`). */
  .eng-bay { display: inline-flex; align-items: center; gap: var(--ctl-gap); }
</style>
</html>

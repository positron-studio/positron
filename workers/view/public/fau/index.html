<!-- No page rules: the kit's compile note (demo/shell/compile-idle.mjs, `.pos-cnote` in shell.css)
     sits in the corner of the text, on `--rows-gap` and `--ctl-sm`.
     See lessons/page-fau.md#fau-12 -->

<script type="module">
  /**
   * fau: Faust typed in the box, compiled by the vendored libfaust to a wasm module that runs in an
   * AudioWorkletNode. A visit compiles the Organ (same-origin files only, asserted); the AudioContext
   * and MIDI wait for the first key. Sizes are kB at 1000 bytes, two decimals. Details in plan-fau.md.
   * See lessons/page-fau.md#fau-13
   */
  import { mount, guard, el } from '/shell/shell.mjs';
  import { ifSelfcheck } from '/shell/selfcheck.mjs';
  import { createKeyboard, QWERTY_CHROMATIC } from '/shell/keyboard.mjs';
  import { createMidi, offerLoopFor, checkEvolutionLoop } from '/shell/midi.mjs';
  import { createPedal, PEDAL_SAYS, SUSTAIN_CC } from '/shell/pedal.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createHueBook } from '/shell/code-lang.mjs';
  import { createDiagram } from '/shell/diagram.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { createCompileIdle, IDLE_MS, NOTE_SAYS } from '/shell/compile-idle.mjs';
  import { createParamKnobs } from '/shell/param-knobs.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { PRESETS } from '/fau/presets.mjs';
  import { createEngineNode, createEngineUi, memoryRelay, standInAccess } from '/fau/engine-node.mjs';
  import { createBayNode } from '/shell/bay-node.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { graphProblem } from '/shell/graph-registry.mjs';
  import { faustCompiler, hasCompiler, faustCompile, faustNode, FAUST_FLAGS } from '/shell/faust.mjs';
  import { sharedAudio, claim, contexts } from '/shell/audio.mjs';

  const q = new URLSearchParams(location.search);

  /* The vendored paths live in demo/shell/faust.mjs as `FAUST_VENDOR`, which fetches them.
     See lessons/page-fau.md#fau-14 */
  /** What the compiler weighs, measured on the vendored files with `wc -c`. */
  const COMPILER_BYTES = 3598106 + 2407445 + 156922;
  /** And what a page that COMPILES needs, which is that plus the runtime. */
  const PAGE_BYTES = COMPILER_BYTES + 216533;
  /** The version those bytes answer when asked. Asserted rather than trusted. */
  const COMPILER_VERSION = '2.89.2';

  /**
   * The only two places a size is divided: kB and MB at 1000, two decimals. They return strings,
   * so an assert compares what the reader sees.
   * See lessons/page-fau.md#fau-15
   */
  const kb = (bytes) => (bytes / 1000).toFixed(2);
  const mb = (bytes) => (bytes / 1e6).toFixed(2);

  /**
   * The Organ compiled under the name `fau_pin` is exactly this many bytes; the name is embedded in the
   * module, so it is part of the pin. Pins compiler version, `-ftz 2`, the poly shape and the source.
   * Kept in bytes because it is a fingerprint; comments and blank lines in the source do not move it.
   * See lessons/page-fau.md#fau-16
   */
  const PINNED = { name: 'fau_pin', bytes: 8440 };

  /**
   * Eight voices is a memory choice: anything on `os.osc` carries a 65,536 entry sine table,
   * 262.26 kB a voice, so eight is 2.10 MB before any audio buffer.
   * See lessons/page-fau.md#fau-17
   */
  const VOICES = 8;

  /**
   * `-ftz 2` passed explicitly (faustwasm appends it silently) so the other end, such as
   * faust2rpialsaconsole, knows to pass the same flag and the denormal handling matches.
   * See lessons/page-fau.md#fau-18
   */
  const FLAGS = FAUST_FLAGS;   // `demo/shell/faust.mjs`, one string for this page, the AOT build and its check

  /* The presets live in demo/fau/presets.mjs, so the ahead of time Organ is compiled from the same text.
     See lessons/page-fau.md#fau-19 */

  /**
   * A preset is reached by `id`, never by index: the list order changes when presets are swapped.
   * `PRESETS[0]` is used only as the row the box opens with.
   * See lessons/page-fau.md#fau-20
   */
  const byId = (id) => PRESETS.find((x) => x.id === id);

  const ONE = 'a synthesiser you type in, compiled to machine code in this tab '
            + 'whenever you stop typing';

  const d = mount({
    name: 'fau',
    // The index's own line, because the diagram already shows the machinery.
    // See lessons/page-fau.md#fau-21
    what: ONE,
    /**
     * Four cells, every one of them moves. `compiler` is not a cell because it never changes, and the
     * compiler download is a log line because it happens once. Every size is kB at 1000 bytes.
     * See lessons/page-fau.md#fau-22
     */
    readout: {
      compile: 'ms',
      source: 'kB',
      'machine code': 'kB',
      'per voice': 'kB',
    },
    /**
     * No control row: shell.mjs hides an empty `.pos-controls`. The corner of the source holds the
     * compile note, which cannot be pressed.
     * See lessons/page-fau.md#fau-23
     */
  });
  guard(d);

  /**
   * What each cell has ever shown, so the check can say every cell moves. The keys come off
   * `d.api.readout` so the list of cells is written once.
   * See lessons/page-fau.md#fau-24
   */
  const moved = new Map(Object.keys(d.api.readout).map((k) => [k, new Set()]));
  function setCell(k, v) {
    moved.get(k)?.add(String(v));
    d.set(k, v);
  }

  /* What a visit costs, counted off `performance.getEntriesByType` rather than a counter this page
     keeps, which would agree with the page by construction.
     See lessons/page-fau.md#fau-25 */
  const vendorLoads = () => performance.getEntriesByType('resource')
    .filter((e) => e.name.includes('/fau/vendor/'));
  /**
   * `decodedBodySize` is the file, `encodedBodySize` what crossed the wire, so the ratio says whether
   * the server compressed `libfaust-wasm.data` (1.0 MB against 2.9 MB).
   * See lessons/page-fau.md#fau-26
   */
  const vendorBytes = (field = 'decodedBodySize') => vendorLoads()
    .reduce((n, e) => n + (e[field] || 0), 0);

  // The audio graph: the shared context from demo/shell/audio.mjs (48 kHz), opened on the first touch,
  // never on load. This page builds its own master gain and meter on it and claims it as `FAU`.
  // See lessons/page-fau.md#fau-27
  let ctx = null, master = null, meter = null, node = null;
  /**
   * The one thing this page has sounding, as `audio.mjs` counts owners. A tab
   * going to the background calls `stop()`, which lets every note go, and the
   * next key resumes the context through `claim()`.
   */
  const FAU = { stop: () => allOff() };
  function audio() {
    /* Resume outside the once-only half: a background tab suspends a context too. Not awaited, because
       `resume()` waits on a gesture and never rejects, so awaiting it is a hang.
       See lessons/page-fau.md#fau-28 */
    const c = sharedAudio();
    claim(FAU);
    if (ctx) return ctx;
    ctx = c;
    master = ctx.createGain();
    master.gain.value = 0.9;
    /* 512, not 2048: a 2048 sample analyser is a 46 ms window, too long to ask whether a note is still
       sounding a few tens of ms after the pedal moves.
       See lessons/page-fau.md#fau-29 */
    meter = ctx.createAnalyser();
    meter.fftSize = 512;
    master.connect(meter);
    master.connect(ctx.destination);
    return ctx;
  }

  const buf = new Float32Array(512);
  /** Loudness right now, as RMS of one 512 sample window. */
  function level() {
    if (!meter) return 0;
    meter.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    return Math.sqrt(sum / buf.length);
  }

  // The compiler and the `console.error` shim live in demo/shell/faust.mjs; a captured line comes back
  // through `onAbort` into this page's log and `captured`. This page reports cost, time and compression.
  // See lessons/page-fau.md#fau-30
  let faust = null;              // { compiler } once this page has logged its arrival
  let captured = [];             // every line the compiler's abort path printed

  async function bootCompiler() {
    if (faust) return faust;
    const t0 = performance.now();
    if (!hasCompiler()) d.log(`fetching the Faust compiler, ${mb(COMPILER_BYTES)} MB, once`);
    const compiler = await faustCompiler();
    faust = { compiler };
    const ms = performance.now() - t0;
    const raw = vendorBytes(), wire = vendorBytes('encodedBodySize');
    d.log(`Faust ${compiler.version()} is in this tab, ready in ${ms.toFixed(0)} ms`, 'hi');
    d.log(`it weighs ${mb(raw)} MB and ${mb(wire)} MB of that `
        + `crossed the wire, so whatever served it `
        + `${wire && wire < raw * 0.9 ? 'compressed it' : 'did not compress it'}`);
    return faust;
  }

  /** Where a captured `console.error` goes while a compile is running. */
  function onAbort(s) {
    captured.push(s);
    // The first line is the whole of it; the rest is an Emscripten stack.
    d.log(`the compiler threw and caught it: ${s.split('\n')[0].slice(0, 70)}`);
  }

  // Every hslider, vslider and nentry typed in the box, except freq, gain and gate (set by keyOn), is a
  // knob with the program's range, step and start, read from the compile's JSON. Only labels typed in the
  // box get knobs; `[scale:log]` is exponential; knobs are kept across a recompile by shortname.
  // See lessons/page-fau.md#fau-31
  const KEYED = ['freq', 'gain', 'gate'];
  function readKnobs(voice, effect, code) {
    const typed = new Set([...code.matchAll(/\b(?:hslider|vslider|nentry)\s*\(\s*"([^"[]*)/g)].map((m) => m[1].trim()));
    const list = [], addr = new Map();
    const walk = (items) => {
      for (const it of items || []) {
        if (it.items) { walk(it.items); continue; }
        if (!['hslider', 'vslider', 'nentry'].includes(it.type)) continue;
        if (KEYED.includes(it.address.split('/').pop())) continue;
        if (!typed.has(it.label) || addr.has(it.shortname)) continue;
        const log = (it.meta || []).some((m) => m.scale === 'log') && it.min > 0;
        addr.set(it.shortname, it.address);
        list.push({ name: it.shortname, value: it.init, min: it.min, max: it.max,
          step: it.step, warp: log ? 'exp' : 'lin' });
      }
    };
    walk(voice?.ui);
    walk(effect?.ui);
    return { list, addr };
  }
  /** How many `setParamValue`s a turn or a new node has sent. */
  let paramSends = 0;
  /* A turn travels through the page's bay: each knob node's value-out is cabled into the engine's
     value-in, and `setParamValue` is the port's deliver, so a knob with no cable moves only its dial.
     See lessons/page-fau.md#fau-32 */
  const knobs = createParamKnobs({
    onChange: (name, v) => {
      const out = knobPort.get(name);
      if (bay && out) bay.send(out, { of: 'param', name, v });
    },
    /* While a knob is held, its parameter's text in the box is lit. */
    onHold: (name, on) => source.mark(name, on),
  });
  /** The panel row the knobs sit in. It keeps its height with none, see `param-knobs.mjs`. */
  let knobRow = null;
  /**
   * One hue book for the text and the knobs (code-lang.mjs `createHueBook`), assigned on a compile
   * that worked. freq, gain and gate have no knob and stay plain.
   * See lessons/page-fau.md#fau-33
   */
  const book = createHueBook();

  // A fresh bay per compile, because bay.mjs cannot remove a port. Surviving names keep their cable
  // and its counts, an unlinked cable stays away. Keys and speakers cables are drawn, not routed.
  // See lessons/page-fau.md#fau-34
  let bay = null, pb = null;
  /** param name -> its knob's `value-out` port id, for the bay as it stands. */
  let knobPort = new Map();
  const safeName = (n) => String(n).replace(/[^A-Za-z0-9_-]/g, '-');
  const FAU_IN = () => `${engine.site}:fau:value-in`;
  const KEYS_OUT = () => `${engine.site}:keys:midi-out`;
  const SPEAKERS_IN = () => `${engine.site}:speakers:audio-in`;
  /** The link from a parameter's knob into the engine, in the bay as it stands. */
  const knobLink = (name) => bay?.links().find((l) => l.from === knobPort.get(name) && l.to === FAU_IN());
  /** The announced half: plain declarations, no `deliver`, for the room. */
  function knobDecls(names) {
    const s = engine.site;
    const nodes = names.map((n) => ({ id: `${s}:knob-${safeName(n)}`, kind: 'person', label: n }));
    const ports = [
      { id: FAU_IN(), label: 'Faust knobs', dir: 'in', medium: 'value', shape: { of: 'param', names } },
      ...names.map((n) => ({ id: `${s}:knob-${safeName(n)}:value-out`, label: n, dir: 'out', medium: 'value',
        shape: { of: 'param' } })),
    ];
    return { nodes, ports };
  }
  function rebuildBay() {
    const s = engine.site, names = knobs.names();
    const old = bay, oldPort = knobPort;
    const next = createBay();
    next.addNode({ id: `${s}:keys`, kind: 'person', label: 'keys' });
    next.addNode({ id: `${s}:fau`, kind: 'engine', label: 'Faust' });
    next.addNode({ id: `${s}:speakers`, kind: 'screen', label: 'speakers' });
    next.addPort({ id: KEYS_OUT(), label: 'keys', dir: 'out', medium: 'midi', emits: ['note'] });
    next.addPort({ id: engine.ports.midi, label: 'Faust keys', dir: 'in', medium: 'midi', accepts: ['note', 'cc', 'program'] });
    next.addPort({ id: engine.ports.audio, label: 'Faust sound', dir: 'out', medium: 'audio' });
    next.addPort({ id: SPEAKERS_IN(), label: 'speakers', dir: 'in', medium: 'audio' });
    const decl = knobDecls(names);
    for (const n of decl.nodes) next.addNode(n);
    for (const p of decl.ports) {
      next.addPort(p.id === FAU_IN() ? { ...p, deliver: (e) => {
        if (e?.of !== 'param') return;
        const a = onThread?.addr.get(e.name);
        if (node && a) { node.setParamValue(a, e.v); paramSends++; }
      } } : p);
    }
    const lay = (from, to) => {
      const r = next.link(from, to);
      if (!r.ok) d.log(`the picture could not cable ${from} to ${to}: ${r.why}`, 'warn');
      return r;
    };
    lay(KEYS_OUT(), engine.ports.midi);
    lay(engine.ports.audio, SPEAKERS_IN());
    const nextPort = new Map();
    for (const n of names) {
      const out = `${s}:knob-${safeName(n)}:value-out`;
      nextPort.set(n, out);
      const was = oldPort.has(n) ? old?.links().find((l) => l.from === oldPort.get(n) && l.to === FAU_IN()) : null;
      if (oldPort.has(n) && !was) continue;
      const r = lay(out, FAU_IN());
      if (r.ok && was) Object.assign(next.links().find((l) => l.id === r.id), { sent: was.sent, dropped: was.dropped });
    }
    bay = next;
    knobPort = nextPort;
    /* The room hears the same knobs, see the announcement below. Before a Join
       this only refreshes the page's own registry, and opens nothing. */
    engine.node.setGraphs([engine.graph()]);
    pb?.refresh();
  }

  function paintHues() {
    for (const n of knobs.names()) {
      const h = book.hueOf(n);
      const k = knobs.knob(n).el;
      if (h === null) k.style.removeProperty('--param-hue');
      else k.style.setProperty('--param-hue', String(h));
    }
  }

  // One queue, because there is one compiler and one audio graph: overlapping compiles would swap the
  // node under an assert that had read the old one.
  // See lessons/page-fau.md#fau-35
  let chain = Promise.resolve();
  function serial(fn) {
    const run = chain.then(fn, fn);
    chain = run.catch(() => {});
    return run;
  }

  let compiles = 0, lastName = '';
  /**
   * Times this function was entered, unlike `compiles`, which is part of a compile's name. The
   * autocompile checks read it, so a compile is measured rather than the timer that should cause it.
   * See lessons/page-fau.md#fau-36
   */
  let runs = 0;

  /**
   * The last good compile, waiting for a gesture, so a visit can compile without a sound device.
   * `attach()` is the only thing that touches a context. `onThread` is the object, not a flag, so
   * attach can tell this compile already playing from the previous one.
   * See lessons/page-fau.md#fau-37
   */
  let ready = null;      // { gen, name, addr } compiled and not yet on the audio thread
  let onThread = null;   // the `ready` the live node was built from

  /**
   * Put the last good compile on the audio thread, opening the audio the first time. Returns whether
   * anything is on the thread. Every caller is a gesture or a compile made with the audio already open.
   * See lessons/page-fau.md#fau-38
   */
  async function attach() {
    if (!ready) return false;
    if (node && onThread === ready) return true;
    const first = node === null;
    const t0 = performance.now();
    audio();
    const next = await faustNode(ctx, ready.gen, VOICES);
    const old = node;
    node = next;
    onThread = ready;
    /* A new node starts every control at the program's default, so the knobs
       are handed to it before it is heard. `setParamValue` on a polyphonic
       node reaches every voice, see the knob block below. */
    for (const [k, v] of knobs.values()) {
      const a = ready.addr.get(k);
      if (a) { node.setParamValue(a, v); paramSends++; }
    }
    node.connect(master);
    if (old) {
      /* Everything the old node was holding goes with it. `allNotesOff` first,
         because a worklet disconnected mid-note leaves its voices ringing in a
         graph nobody can reach. */
      try { old.allNotesOff?.(true); } catch { /* it is going away anyway */ }
      old.disconnect();
      if (typeof old.destroy === 'function') old.destroy();
      /* The foot survives a recompile and the fingers do not. Only forget keys when there was an old node:
         on the first attach the key that opened the audio is really held.
         See lessons/page-fau.md#fau-39 */
      pedal.forgetKeys();
    }
    if (first) {
      d.log(`the compiled instrument reached the audio thread in `
          + `${(performance.now() - t0).toFixed(0)} ms, which is all a key press had to buy`, 'hi');
    }
    startMidi();
    return true;
  }

  /**
   * Compile what is in the box, and put it on the audio thread if the audio is
   * already open.
   * @returns {Promise<{ok: boolean, ms: number, bytes: number, size: number, error?: string}>}
   */
  async function build(code, name, pin = '') {
    runs++;
    await bootCompiler();
    let gen = null;
    /* A fresh name per compile: libfaust caches a factory by name and code (0.1 ms against 63 ms), and the
       name is embedded in the module, so a byte comparison passes its own name in `pin`.
       See lessons/page-fau.md#fau-40 */
    const uniq = pin || `${name}_${++compiles}`;
    const t0 = performance.now();
    let ok = true, error = '';
    try {
      gen = await faustCompile(uniq, code, { flags: FLAGS, onAbort });
    } catch (e) {
      ok = false;
      error = String(e?.message || e).split('\n').slice(0, 2).join(' ').trim();
    }
    const ms = performance.now() - t0;
    if (!ok) {
      /* The old instrument keeps playing: a typo must not take the sound away.
         See lessons/page-fau.md#fau-41 */
      setCell('compile', ms.toFixed(0));
      d.log(`that did not compile: ${error}`, 'bad');
      return { ok: false, ms, bytes: 0, size: 0, error };
    }

    const meta = JSON.parse(gen.voiceFactory.json);
    const bytes = gen.voiceFactory.code.length
      + (gen.effectFactory?.code.length || 0)
      + (gen.mixerBuffer?.length || 0);

    const kn = readKnobs(meta, gen.effectFactory ? JSON.parse(gen.effectFactory.json) : null, code);
    ready = { gen, name: uniq, addr: kn.addr };
    knobs.set(kn.list);
    book.assign(knobs.names());
    paintHues();
    rebuildBay();
    /* A compile does not open a sound device. With `ctx` open the module goes straight on the thread;
       otherwise the first key press finds it waiting.
       See lessons/page-fau.md#fau-42 */
    if (ctx) await attach();

    lastName = uniq;
    setCell('compile', ms.toFixed(0));
    setCell('machine code', kb(bytes));
    setCell('per voice', kb(meta.size));
    d.log(`${name} compiled in ${ms.toFixed(0)} ms into ${kb(bytes)} kB of machine code, `
        + `${kb(meta.size)} kB a voice, ${VOICES} voices`, 'hi');
    if (!meta.ui || !JSON.stringify(meta.ui).includes('gate')) {
      d.log('this one declares no gate, so the keys cannot start it. A polyphonic voice '
          + 'needs freq, gain and gate');
    }
    return { ok: true, ms, bytes, size: meta.size, meta };
  }

  // Typing and setting are two events. `onType` re-counts and may move the selector to `custom`; only
  // typing compiles, once it stops. `showSource()` fires no input event and `applyPatch()` cancels a due one.
  // See lessons/page-fau.md#fau-43
  /* The kit's code box (demo/shell/code-box.mjs): a transparent textarea over the program drawn in
     Faust's colours, each knob's slider in its hue.
     See lessons/page-fau.md#fau-44 */
  const source = createCodeBox({
    language: 'faust',
    hues: book,
    /* The accessible name the missing caption would have carried.
       See lessons/page-fau.md#fau-45 */
    ariaLabel: 'the Faust program this page compiles',
    /* No caption: `label: ''` builds no span (field.mjs). The title and the patch picker name the box.
       See lessons/page-fau.md#fau-46 */
    label: '',
    /* Meant to be the longest preset listing, so `process` is never cut. The longest in presets.mjs
       is now 26 lines, so 20 scrolls on Organ, Rhodes, Pluck and Sweep.
       See lessons/page-fau.md#fau-47 */
    rows: 20,
    value: PRESETS[0].code,
    onInput: onType,
  });

  function showSource() {
    setCell('source', kb(new TextEncoder().encode(source.value()).length));
  }
  function onType() {
    showSource();
    matchPatch();
  }

  // ── the keys ───────────────────────────────────────────────────────────────
  /* The keyboard is built in a throwaway host and its own box goes into the
     panel's keys row, the way /kit/'s sketch specimen hands over `kb.el`. */

  /**
   * The letters sit on the bottom octave, C3 here. There are thirteen because `QWERTY_CHROMATIC` is
   * one octave plus its top C.
   * See lessons/page-fau.md#fau-48
   */
  const KEY_LO = 12;            // the lettered octave is the first thirteen keys
  const { KEY_MAP, KEY_ORDER, KEY_SHARPS, KEY_LETTERS } = (() => {
    const map = {}, order = [], sharps = new Set(), lettered = new Set();
    const BLACK = new Set([1, 3, 6, 8, 10]);
    /* Read off the constant's values, not its order: the map has gaps (`l` is a D at 14).
       See lessons/page-fau.md#fau-49 */
    const letterAt = Object.fromEntries(
      Object.entries(QWERTY_CHROMATIC).map(([k, v]) => [v, k]));
    for (let i = 0; i <= 24; i++) {
      const id = letterAt[i] ?? `hi${i}`;
      map[id] = i;
      order.push(id);
      if (BLACK.has(i % 12)) sharps.add(id);
      if (letterAt[i]) lettered.add(id);
    }
    return { KEY_MAP: map, KEY_ORDER: order, KEY_SHARPS: sharps, KEY_LETTERS: lettered };
  })();

  const keys = createKeyboard(el('div'), {
    base: 48,
    map: KEY_MAP, keys: KEY_ORDER, sharps: KEY_SHARPS, letters: KEY_LETTERS,
    minBase: 24, maxBase: 84,
    /* `Loop` while the Evolution is plugged in. A looped note comes back through `onDown` marked
       `loop`, with the velocity the take heard.
       See lessons/page-fau.md#fau-50 */
    loop: 'evolution',
    log: (line, kind) => d.log(line, kind),
    onDown: (note, how, vel) => press(note, vel ?? 100),
    onUp: (note) => lift(note),
    onOctave: (b) => d.log(`the keys on screen now start at ${b}`),
    onPanic: () => {
      allOff();
      keys.sustain.set(false, true);
    },
    /* The damper is the keyboard's own control, in its footer; what a foot means is
       demo/shell/pedal.mjs's, which holds the note off.
       See lessons/page-fau.md#fau-51 */
    sustain: true,
    onSustain: (on) => pedal.set(on),
  });
  /* 44 px a key rather than the component's 49, so two octaves (fifteen white keys) fit the page.
     The component reads the property off its own box.
     See lessons/page-fau.md#fau-52 */
  keys.el.style.setProperty('--k-min', '44px');

  // ── the foot ───────────────────────────────────────────────────────────────
  //
  // `?pedal=<n>` for a footswitch sending something other than 64, and `?flip=1`
  // for one whose polarity was sensed upside down at power up. Both are
  // `demo/shell/pedal.mjs`'s arguments and neither is this page's invention.
  const pedal = createPedal({
    cc: Number(q.get('pedal')) || SUSTAIN_CC,
    flip: q.get('flip') === '1',
    release: (note) => {
      /* The DSP owns how fast a note dies, so the damper time `pedal.mjs` hands
         over is deliberately dropped here. See the header. */
      node?.keyOff(0, note, 0);
    },
    onPedal: (down, value, freed) => {
      d.log(down ? PEDAL_SAYS.down : (freed ? PEDAL_SAYS.freed(freed) : PEDAL_SAYS.up));
      d.log(PEDAL_SAYS.raw(pedal.cc, value, down));
    },
  });

  /** How many notes this page believes are being held, by hand or by foot. */
  const holding = () => pedal.fingers() + pedal.held();

  /**
   * Notes a hand put down while the first node is still being built (an await after the first key).
   * Sent when the node exists; one let go inside the window is taken out, so nothing is left sounding.
   * See lessons/page-fau.md#fau-53
   */
  const waiting = new Map();
  /** The one arming in flight, so eight fingers landing at once build one node. */
  let arming = null;
  function arm() {
    if (node || !ready) return null;
    if (!arming) {
      arming = serial(attach)
        .catch((e) => { d.log(`it could not reach the audio thread: ${e?.message || e}`, 'bad'); return false; })
        .finally(() => { arming = null; });
    }
    return arming;
  }

  /** Every `keyOn` handed to a voice, which is what the Loop check counts as heard. */
  let voiced = 0;
  /** @returns {Promise<unknown>|undefined} the arming, where this press started one. */
  function press(note, vel = 100) {
    keys.lightNote?.(note, true);
    pedal.keyDown(note);
    /* The picture's keys cable pulses; the note itself does not go through the bay. */
    pb?.pulse(KEYS_OUT(), engine.ports.midi);
    /* `claim` is a comparison when this page already holds the audio, and a
       resume when a background tab took it away (`demo/shell/audio.mjs`). */
    if (node) { claim(FAU); node.keyOn(0, note, vel); voiced++; return undefined; }
    const job = arm();
    if (!job) {
      d.log('nothing is compiled yet, the note in the corner of the text says when it is');
      return undefined;
    }
    waiting.set(note, vel);
    return job.then(() => {
      for (const [k, v] of waiting) { node?.keyOn(0, k, v); voiced++; }
      waiting.clear();
    });
  }
  function lift(note) {
    waiting.delete(note);
    pedal.keyUp(note);                 // it decides whether that is a release
    keys.lightNote?.(note, false);
  }
  function allOff() {
    try { node?.allNotesOff?.(true); } catch { /* nothing sounding */ }
    pedal.panic();
  }

  // A MIDI keyboard, built by the first gesture and not by the page: `createMidi` asks the browser
  // for access when constructed, and a visit opens nothing.
  // See lessons/page-fau.md#fau-54
  let midi = null;
  /* Both roads call the same two functions, which is what keeps the key that
     lights and the note that sounds the same key. Named, so the patchbay's
     linked path below calls exactly these and no third copy. */
  const midiHandlers = {
    onDown: (note, vel) => press(note, vel || 100),
    onUp: (note) => lift(note),
    onControl: (cc, value) => {
      if (!pedal.control(cc, value)) return;
      keys.sustain.set(pedal.down(), true);
    },
  };
  /* Every input plays this page until a link on /patchbay/ says which one. While a link is open this
     path is shut and the linked keyboard arrives through `engine` (demo/fau/engine-node.mjs).
     See lessons/page-fau.md#fau-55 */
  const omniHandlers = {
    onDown: (...a) => engine.omni() && midiHandlers.onDown(...a),
    onUp: (...a) => engine.omni() && midiHandlers.onUp(...a),
    onControl: (...a) => engine.omni() && midiHandlers.onControl(...a),
  };
  function startMidi() {
    if (midi) return midi;
    midi = createMidi({ ...omniHandlers, log: d.log, loop: keys });
    return midi;
  }

  // On the patchbay after Join: an engine node with program in, midi in and audio out; nothing leaves
  // the machine. A linked keyboard plays it alone and the badge says whether its notes arrive. The
  // program in is the text box, announced for the picture; nothing on another page writes it.
  // See lessons/page-fau.md#fau-56
  const engine = createEngineNode({
    slug: 'fau', label: 'Faust', program: true, handlers: midiHandlers,
    allOff: () => allOff(), log: d.log,
  });
  const bayUi = createEngineUi(engine, { el, log: d.log });
  /* The room hears the knobs: the announced graph carries the engine's `value-in` and a knob node
     each, from the last good compile. Wraps `engine.node.setGraphs` because createEngineNode takes no
     extra ports. Announced only: the engine accepts a link.request into its MIDI in alone.
     See lessons/page-fau.md#fau-57 */
  {
    const say = engine.node.setGraphs;
    const knobId = (id) => /^knob-/.test(String(id).split(':')[1] || '');
    engine.node.setGraphs = (next = engine.node.graphs(), loc) => say(next.map((g) => {
      if (g.site !== engine.site) return g;
      const k = knobDecls(knobs.names());
      return { ...g,
        nodes: [...g.nodes.filter((n) => !knobId(n.id)), ...k.nodes],
        ports: [...g.ports.filter((p) => !knobId(p.id) && p.id !== FAU_IN()), ...k.ports] };
    }), loc);
  }

  // ── the patch selector, and the fourth state ───────────────────────────────
  //
  // See the header for why `custom` exists and why it is not in the list.
  const CUSTOM = 'custom';
  /* No `label`: the panel strips captions from the plate's far end. `what` stays, as the arrows'
     titles and the select's `aria-label`.
     See lessons/page-fau.md#fau-58 */
  const patch = createPicker({
    what: 'patch',
    prev: () => stepPatch(-1),
    next: () => stepPatch(+1),
    onPick: (i) => loadPatch(i),
  });
  patch.options(PRESETS.map((p) => p.label), 0);

  /** Which preset is in the box, or -1 for text that is nobody's preset. */
  let picked = 0;
  /** The last real preset, so the arrows have somewhere to step FROM in custom. */
  let lastPatch = 0;

  function showPatch(i) {
    picked = i;
    if (i >= 0) { lastPatch = i; patch.show(PRESETS[i].label, i); return; }
    patch.show(CUSTOM);
    /* Nothing selected while the text is the visitor's: a `<select>` fires `change` only when the
       selection moves, so choosing the loaded preset again must still fire.
       See lessons/page-fau.md#fau-59 */
    patch.select.selectedIndex = -1;
  }
  /** Does the text still say exactly what a preset says? */
  function matchPatch() {
    const now = source.value();
    const i = PRESETS.findIndex((p) => p.code === now);
    if (i !== picked) showPatch(i);
  }
  function stepPatch(n) {
    const from = picked >= 0 ? picked : lastPatch;
    loadPatch((from + n + PRESETS.length) % PRESETS.length);
  }

  /** The idle compile, built further down once `source` and `holding` exist. */
  let idle = null;

  /**
   * Put a preset in the box, and compile it. `loadPatch` takes a turn on the compile queue;
   * `applyPatch` is the work, which the check block calls, because waiting on the same queue deadlocks.
   * See lessons/page-fau.md#fau-60
   */
  async function applyPatch(i) {
    const p = PRESETS[i];
    idle?.cancel();
    /* A preset opens with the same colours every time, in order of appearance. */
    book.clear();
    source.set(p.code);
    showSource();
    showPatch(i);
    d.log(`${p.label}: ${p.what}`);
    /* A pick always compiles, so the selector never names one instrument over a compile of another.
       It costs the tens of ms in the `compile` cell.
       See lessons/page-fau.md#fau-61 */
    return build(p.code, p.label.toLowerCase());
  }
  /* A pick replaces the text wholesale, so a compile already due for the old
     text is dropped rather than compiling the preset twice, and the note
     breathes over the pick's own compile. */
  const loadPatch = (i) => {
    idle?.cancel();
    const job = serial(() => applyPatch(i));
    return idle ? idle.track(job) : job;
  };

  // The kit's idle compile (demo/shell/compile-idle.mjs): waits `IDLE_MS`, one at a time, through
  // `serial`. `notNow` is a held key or foot, because a compile swaps the node and forgets every key.
  // It does not call `attach()`: an idle compile is not a gesture.
  // See lessons/page-fau.md#fau-62
  idle = createCompileIdle({
    input: source.input,
    host: source.el,
    notNow: () => holding() > 0,
    /* The text is read inside the queue's turn, so a preset pick queued ahead is not overwritten by
       the text it replaced.
       See lessons/page-fau.md#fau-63 */
    compile: () => serial(() =>
      build(source.value(), picked >= 0 ? PRESETS[picked].label.toLowerCase() : 'typing')),
  });

  // The instrument is the kit's glued panel: the text is the picture row, the keys the keys row, the
  // plate holds the name and the patch picker. The one page rule is the Join cluster beside the name.
  // See lessons/page-fau.md#fau-64
  const panel = createInstrumentPanel({
    viz: source.el,
    keys: keys.el,
    /* `status` is the place beside the name, and Join with its badge is what
       sits there: the badge is about the keys this panel is played from. */
    plate: { name: 'FAU', patch, status: bayUi.el },
  });
  /* The knobs are the row under the text, hidden until a compile has any. */
  knobRow = panel.addRow(knobs.el);
  d.el.append(panel.el);

  /* The patchbay under the instrument: keys into the engine, engine to speakers, a knob node per
     parameter into `value-in`. A knob cable pulses per turn it carried, the sound cable lights on sound.
     See lessons/page-fau.md#fau-65 */
  rebuildBay();
  pb = createPatchbay({ nodes: () => bay.nodes(), ports: () => bay.ports(), links: () => bay.links() }, {
    flowing: (l, medium) => medium === 'audio' && !!node && level() > 0.001,
  });
  d.el.append(pb.el);

  /* The first touch anywhere on the panel opens the audio: a first key costs 134 ms (context plus
     addModule). Panel not document, capture phase, and the listeners stay until `arm()` succeeds,
     because it answers null until something is compiled.
     See lessons/page-fau.md#fau-66 */
  const armOnTouch = () => {
    if (!arm()) return;
    panel.el.removeEventListener('pointerdown', armOnTouch, true);
    panel.el.removeEventListener('keydown', armOnTouch, true);
  };
  panel.el.addEventListener('pointerdown', armOnTouch, true);
  panel.el.addEventListener('keydown', armOnTouch, true);

  showSource();
  d.log(`the Faust compiler is ${mb(COMPILER_BYTES)} MB off this site, it is on its way now, `
      + `and the Organ in the box is compiled the moment it lands`);
  d.log('no sound device is opened until you press a key, which is the gesture a browser '
      + 'wants for a sound anyway');

  /* The compile a visit gets: one compile of the opening preset, not awaited, through `serial` so a
     pick or typing queues behind it. The catch reports a failed download in the log.
     See lessons/page-fau.md#fau-67 */
  const warm = idle.track(serial(() => build(PRESETS[0].code, PRESETS[0].label.toLowerCase())))
    .catch((e) => {
      d.log(`the compiler did not arrive, so type into the box to try again: ${e?.message || e}`, 'bad');
      return { ok: false };
    });

  // ── the picture ────────────────────────────────────────────────────────────
  const dg = createDiagram(d.el, {
    caption: 'The text in the box is the program the audio thread runs. Nothing here '
      + 'interprets it: the compiler in the tab turns it into a second WebAssembly module '
      + 'that is only this instrument, and the worklet runs that.',
    nodes: [
      /* The text box is inside the browser box: a childless top level box would be drawn as tall as the
         tallest (`diagram.mjs`), an empty slab on a phone.
         See lessons/page-fau.md#fau-68 */
      /* `set: true`: keys and a footswitch do not feed each other, so no arrow between them.
         See lessons/page-fau.md#fau-69 */
      { id: 'kbd', label: 'MIDI keyboard', sub: 'USB MIDI', kind: 'device', tech: 'device',
        set: true,
        children: [
          { id: 'kkeys', label: 'keys', sub: 'notes, velocity', tech: 'device',
            note: 'A tap on the keys drawn on this page calls the same two functions, so there '
                + 'is no second route into the instrument and nothing downstream can tell them '
                + 'apart.' },
          { id: 'foot', label: 'footswitch', sub: 'CC64 by default', tech: 'device',
            note: 'Which controller a footswitch sends is a setting held inside the keyboard, '
                + 'so 64 is a default rather than a measurement. Open the page with '
                + '**?pedal=67** for one that sends something else.' },
        ] },
      { id: 'br', label: 'Browser', sub: 'phone or laptop', kind: 'here', tech: 'browser',
        children: [
          { id: 'box', label: 'text box', sub: '7 to 20 lines', tech: 'browser',
            note: 'What a visitor types, and the only input this page has. Everything below it '
                + 'is made from under a kilobyte of text and nothing else.' },
          { id: 'lf', label: 'libfaust', sub: '2.89.2, wasm', tech: 'browser',
            note: 'The Faust compiler itself, 3.60 MB of **WebAssembly**, with 2.41 MB of plain '
                + 'Faust library source beside it that it reads out of its own filesystem. '
                + 'Fetched once, as the page opens.' },
          /* A label, rounded to whole kB: the six presets compile to about 7 to 21 kB. The live figure is
             the `machine code` cell.
             See lessons/page-fau.md#fau-70 */
          { id: 'dsp', label: 'dsp module', sub: '7 to 21 kB', tech: 'sound',
            note: 'A second WebAssembly module, made in this tab a moment ago, holding this '
                + 'instrument and nothing else. It is what a visitor changes by typing.' },
          { id: 'awn', label: 'AudioWorklet', sub: '8 voices, 128 frames', tech: 'sound',
            note: 'One voice compiled once and replicated. The processor reaches the worklet '
                + 'as a **Blob** of stringified classes, because an **AudioWorkletGlobalScope** '
                + 'has no module loader at all.' },
          { id: 'spk', label: 'speakers', sub: 'or a phone', tech: 'device',
            note: 'The end of it. Everything above it is built before you touch anything, so a '
                + 'key press is the whole distance between a finger and this.' },
        ] },
    ],
    links: [
      { from: 'box', to: 'lf',
        note: 'Under a kilobyte for something small. The compression is a dictionary rather '
            + 'than magic: a one line drum is one line because somebody else wrote the model '
            + 'into the library beside the compiler.' },
      /* A link between two children of one container takes NO label: the gap
         they share is sixteen pixels tall, and what travels goes in the note. */
      { from: 'lf', to: 'dsp',
        note: 'About **10 ms** for anything small, and it blocks the thread it runs on, because '
            + 'libfaust is synchronous inside its own wasm. The STK piano is 1,690 ms, which is '
            + 'why it is not a preset here.' },
      { from: 'dsp', to: 'awn',
        note: 'The module is instantiated once per voice. Recompiling builds a whole new node '
            + 'and throws the old one away rather than swapping code under a sounding note.' },
      { from: 'awn', to: 'spk',
        note: 'Faust computes a block at a time and the block size is not part of the graph, so '
            + 'the worklet\'s 128 frames and a Raspberry Pi\'s ALSA period run identical code.' },
      { from: 'kkeys', to: 'awn', label: 'notes',
        note: '**keyOn** and **keyOff** with a note number, which the runtime turns into the '
            + '**freq**, **gain** and **gate** the source declares.' },
      { from: 'foot', to: 'awn',
        note: 'The pedal is held OUTSIDE the DSP, in the page. Faust\'s own voice allocator '
            + 'writes a released note off and steals it first, so a pedal inside the source '
            + 'would keep a note audible and stealable at the same time.' },
    ],
  }, { how: true, atEnd: true });

  // ── what this page can say about itself ────────────────────────────────────
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function checks() {
    /* The cheap asserts first: demo/verify.mjs gives up about two seconds after the last new assert,
       and the first compile is behind a 6 MB fetch.
       See lessons/page-fau.md#fau-71 */
    /* Every resource the document loaded is same origin, read off `performance.getEntriesByType`.
       The count is the negative half: a page that loaded nothing would pass "no foreign host".
       See lessons/page-fau.md#fau-72 */
    const loaded = () => performance.getEntriesByType('resource');
    const foreign = loaded().filter((e) => new URL(e.name, location.href).origin !== location.origin);
    d.assert('everything a visit loads comes off this site, so compiling on load costs no other '
           + 'server a byte',
      foreign.length === 0 && loaded().length > 0,
      foreign.map((e) => new URL(e.name, location.href).origin).join(', ')
      || `${loaded().length} resources, every one of them ${location.origin}`);
    /* No AudioContext, no worklet node and no MIDI request before a gesture; the load compile stops
       at `ready` and `attach()` is the only thing that touches a context.
       See lessons/page-fau.md#fau-73 */
    d.assert('and a visit opens no sound device, puts nothing on the audio thread and asks about '
           + 'no MIDI keyboard',
      ctx === null && contexts() === 0 && node === null && midi === null,
      `audio ${ctx ? 'open' : 'none'}, ${contexts()} contexts made, node ${node ? 'built' : 'none'}, `
      + `MIDI ${midi ? 'asked' : 'not asked'}`);
    /* Round-tripped through 1000 rather than compared to `kb()`, so a kb() dividing by 1024 goes red.
       Two decimals is at most 5 bytes of rounding; 1024 misses the Organ by 15 (765 B: 770 vs 750).
       See lessons/page-fau.md#fau-74 */
    const srcBytes = new TextEncoder().encode(PRESETS[0].code).length;
    d.assert('the box opens with a whole instrument in it, and the readout measures it in '
           + 'kB of 1000 bytes',
      Math.abs(Number(d.api.readout.source) * 1000 - srcBytes) <= 5,
      `${d.api.readout.source} kB reads back as ${Number(d.api.readout.source) * 1000} B `
      + `against ${srcBytes} B`);
    d.assert('the readout is the four cells the ask left it with, which is an even count',
      Object.keys(d.api.readout).length === 4, Object.keys(d.api.readout).join(', '));

    /* The panel, read off rect pairs.
       See lessons/page-fau.md#fau-75 */
    {
      const rect = (e) => (e.el || e).getBoundingClientRect();
      const cs = (e, k) => parseFloat(getComputedStyle(e.el || e)[k]) || 0;
      d.assert('the panel is a picture, the knob row, keys and a foot, in that order',
        panel.shape().join(' ') === 'viz controls keys plate' && panel.controls()[0] === knobRow,
        panel.shape().join(' '));
      const ta = rect(source.input), sf = rect(panel.el);
      const gapL = +(ta.left - (sf.left + cs(panel.el, 'borderLeftWidth'))).toFixed(1);
      const gapR = +((sf.right - cs(panel.el, 'borderRightWidth')) - ta.right).toFixed(1);
      d.assert('the text runs edge to edge of the surface, one border apart',
        Math.abs(gapL) <= 0.6 && Math.abs(gapR) <= 0.6 && cs(source.input, 'borderLeftWidth') === 0,
        `${gapL} px and ${gapR} px inside the surface’s border, with ${cs(source.input, 'borderLeftWidth')} px of its own`);
      const row = rect(panel.plateRow);
      const inset = cs(panel.plateRow, 'paddingLeft');
      const l = +(rect(panel.plate.el).left - row.left).toFixed(1);
      const rr = +(row.right - rect(patch.el).right).toFixed(1);
      /* The foot: name on the left inset, patch selector on the right with no caption, no compile note.
         `display` is read computed, since only that says whether the box is drawn.
         See lessons/page-fau.md#fau-76 */
      const footDisplay = getComputedStyle(panel.plateRow).display;
      const captioned = patch.el.querySelector('.pos-pick-l') !== null;
      d.assert('the foot holds the name at the start and the patch selector, unlabelled, at the far end, and the compile note is not in it',
        Math.abs(l - inset) <= 0.6 && Math.abs(rr - inset) <= 0.6 && rect(patch.el).left > rect(panel.plate.el).right
          && !captioned && !panel.plateRow.contains(idle.el)
          && footDisplay !== 'none' && panel.plateRow.children.length === 2,
        `${l} px in on the left and ${rr} px on the right against an inset of ${inset}, `
        + `${captioned ? 'a caption on the picker' : 'no caption on the picker'}, `
        + `the foot ${footDisplay} with ${panel.plateRow.children.length} ends`);
      const rowsPad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rows-pad'));
      const ink = cs(source.input, 'paddingLeft') + cs(source.input, 'borderLeftWidth');
      d.assert('the first line of code sits on the inset the keys and the foot keep',
        ink === rowsPad && cs(panel.keys, 'paddingLeft') === rowsPad && inset === rowsPad && rowsPad > 0,
        `the code starts ${ink} px in, the keys row ${cs(panel.keys, 'paddingLeft')} and the foot ${inset}, against --rows-pad ${rowsPad}`);
      /* The compile note sits where a button would, read in the first ms while the load compile runs.
         `animationName` is read computed; reduced motion names `none`, which the harness does not ask for.
         See lessons/page-fau.md#fau-77 */
      const rowsGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rows-gap'));
      const ctlSm = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ctl-sm'));
      const nt = rect(idle.el), well = rect(source.el);
      const inR = +(ta.right - nt.right).toFixed(1);
      const inB = +(ta.bottom - nt.bottom).toFixed(1);
      const f1 = (n) => n.toFixed(1);
      const anim = getComputedStyle(idle.el).animationName;
      d.assert('while the opening compile runs, a breathing Compiling note sits in the text box’s bottom right corner, one row gap in, and it is not a button',
        idle.shown() === NOTE_SAYS.compiling && anim === 'pos-cnote-breathe'
          && Math.abs(inR - rowsGap) <= 0.6 && Math.abs(inB - rowsGap) <= 0.6
          && Math.abs(nt.height - ctlSm) <= 0.6 && ctlSm > 0
          && idle.el.tagName !== 'BUTTON' && idle.el.tabIndex < 0
          && idle.el.getAttribute('role') === 'status'
          && source.el.contains(idle.el) && !source.el.querySelector('button'),
        `"${idle.shown()}" breathing ${anim}, note ${f1(nt.left)},${f1(nt.top)} to ${f1(nt.right)},${f1(nt.bottom)} `
        + `against the text box ${f1(ta.right)},${f1(ta.bottom)}: ${inR} px in from the right, ${inB} px up, `
        + `${f1(nt.height)} px tall against --ctl-sm ${ctlSm}, a ${idle.el.tagName.toLowerCase()}, well ${f1(well.right)},${f1(well.bottom)}`);
    }
    /* The units, read off the rendered `.pos-u`, not the `readout` object: three sizes say kB and
       `compile` stays ms, so a relabel goes red.
       See lessons/page-fau.md#fau-78 */
    const unitOf = (key) => [...d.readoutEl.querySelectorAll('.pos-cell')]
      .find((c) => c.querySelector('.pos-k')?.textContent === key)
      ?.querySelector('.pos-u')?.textContent;
    d.assert('every size in the readout is in kB and the one time is not',
      unitOf('source') === 'kB' && unitOf('machine code') === 'kB'
        && unitOf('per voice') === 'kB' && unitOf('compile') === 'ms',
      Object.keys(d.api.readout).map((k) => `${k} in ${unitOf(k)}`).join(', '));
    d.assert('nothing cut and nothing refused in the picture', dg.cuts.length === 0,
      dg.cuts.map((c) => c.full).join(', ') || 'nothing');
    d.assert('the only headless line in the picture is the one joining a set', dg.ties === 1,
      `${dg.ties} ties`);
    d.assert('the pedal is read on one controller, and the page says which',
      pedal.cc === (Number(q.get('pedal')) || SUSTAIN_CC), `controller ${pedal.cc}`);

    /* The listing format: an own-line comment is followed by a blank line; a run of comment lines is one.
       Own-line and trailing comments are both counted, so deleting comments does not pass vacuously.
       See lessons/page-fau.md#fau-79 */
    const fmt = { own: 0, trail: 0, bad: [] };
    for (const pr of PRESETS) {
      const lines = pr.code.replace(/\n$/, '').split('\n');
      lines.forEach((line, i) => {
        const own = /^\s*\/\//.test(line);
        if (own) fmt.own++;
        else if (line.includes('//')) fmt.trail++;
        const next = lines[i + 1];
        if (!own || next === undefined) return;
        if (!/^\s*\/\//.test(next) && next.trim() !== '') fmt.bad.push(`${pr.id} line ${i + 1}`);
      });
    }
    d.assert('every comment on its own line in the six listings is followed by a blank line, '
           + 'and there are comments in them to check',
      fmt.bad.length === 0 && fmt.own >= 10 && fmt.trail >= 10,
      fmt.bad.join(', ') || `${fmt.own} own-line comments each followed by a blank, `
      + `${fmt.trail} still sitting on their own code line`);

    /* Typing is the page's whole subject, so the number it moves is asserted
       rather than assumed. */
    const wasBytes = Number(d.api.readout.source);
    source.set(`${PRESETS[0].code}\n// a comment the check typed\n`);
    showSource();
    /* Thirty characters is 0.03 kB, which two decimals can just show.
       See lessons/page-fau.md#fau-80 */
    d.assert('editing the text changes the size under it',
      Number(d.api.readout.source) > wasBytes,
      `${wasBytes} kB became ${d.api.readout.source} kB`);
    source.set(PRESETS[0].code);
    showSource();

    /* The compiler is in the tab and nothing was pressed to get it there. The wait is here, after the
       cheap asserts, because demo/verify.mjs gives up after five quiet polls.
       See lessons/page-fau.md#fau-81 */
    await warm;
    d.assert('the compiler arrived and a whole instrument was compiled with nobody pressing '
           + 'anything, off the four files this page ships',
      faust !== null && ready !== null && runs === 1 && vendorLoads().length === 4,
      `${runs} compile with no press, ${vendorLoads().length} vendor files, `
      + `${ready?.name || 'nothing'} waiting for a key`);
    /* The negative control beside it, and it is the one that would have gone
       red on any design that reached the audio thread at load. */
    d.assert('and it got there without opening a sound device, so nothing has been played at '
           + 'anybody', ctx === null && contexts() === 0 && node === null && midi === null,
      `audio ${ctx ? 'open' : 'none'}, ${contexts()} contexts made, node ${node ? 'built' : 'none'}, `
      + `MIDI ${midi ? 'asked' : 'not asked'}`);
    /* The note goes when the compile is done, read as computed `display` because `.pos-cnote` sets
       `display: flex`. `settled()` includes the note's minimum.
       See lessons/page-fau.md#fau-82 */
    await idle.settled();
    d.assert('and once it is compiled the corner is empty again, nothing drawn',
      idle.shown() === '' && getComputedStyle(idle.el).display === 'none' && idle.state() === 'idle',
      `"${idle.shown()}", display ${getComputedStyle(idle.el).display}, ${idle.state()}`);

    /* Driven by a real `input` event, not by calling `onType()`, so the wiring is graded. Nothing
       compiles here, the instrument is off.
       See lessons/page-fau.md#fau-83 */
    const typeInto = (text) => {
      source.input.value = text;
      source.input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    /* Read off the component's class, not `picked`, which would agree with itself. `createPicker`
       publishes no `shown()` yet.
       See lessons/page-fau.md#fau-84 */
    const patchSays = () => patch.el.querySelector('.pos-pick-n')?.textContent;
    const wasSaying = patchSays();
    typeInto(`${PRESETS[0].code}\n// and the check typed this\n`);
    d.assert('a keystroke moves the patch selector to custom, because a lit Organ would be '
           + 'naming something that is no longer in the box',
      patchSays() === CUSTOM && picked === -1 && patch.select.selectedIndex === -1,
      `${wasSaying} became ${patchSays()}, with nothing selected in the list under it`);
    /* The other half. A selector that said `custom` whatever it was shown would
       pass the assert above, so it has to be able to come back. */
    const beforePick = runs;
    await applyPatch(0);
    /* What waits for the first key is the preset the selector shows.
       See lessons/page-fau.md#fau-85 */
    d.assert('and loading a preset again takes it off custom, with that preset compiled and '
           + 'waiting for the first key',
      patchSays() === PRESETS[0].label && picked === 0
        && runs === beforePick + 1 && (ready?.name || '').startsWith('organ'),
      `${patchSays()} selected, ${runs - beforePick} compile, ${ready?.name} waiting`);

    /* Typing compiles once after it stops: two keystrokes 300 ms apart (closer than `IDLE_MS`), nothing
       inside the wait, exactly one compile after, counted on `runs`.
       See lessons/page-fau.md#fau-86 */
    const typedBefore = runs;
    typeInto(`${PRESETS[0].code}\n// one\n`);
    await sleep(300);
    typeInto(`${PRESETS[0].code}\n// one two\n`);
    await sleep(IDLE_MS / 2);
    const inWait = runs - typedBefore, dueState = idle.state();
    d.assert('typing compiles nothing while it is still going on, the compile is due and waiting for the pause',
      inWait === 0 && dueState === 'due', `${inWait} compiles ${IDLE_MS / 2} ms after the last keystroke, ${dueState}`);
    await idle.settled();
    d.assert('and once it pauses the text is compiled exactly once, as it stood at the last keystroke',
      runs === typedBefore + 1 && (ready?.name || '').startsWith('typing') && idle.error() === '',
      `${runs - typedBefore} compile after the pause, ${ready?.name} waiting`);

    /* The first key is the whole of switching on: a `runs` delta of zero, no fetch and no compile.
       `press()` is what the keyboard's `onDown` calls, and returns the arming.
       See lessons/page-fau.md#fau-87 */
    const armBefore = runs;
    const armT0 = performance.now();
    /* A pointer on the panel, not a key. `arming` is read before this block calls `arm()`, so it is
       the listener that did it.
       See lessons/page-fau.md#fau-88 */
    panel.el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    const armedByTouch = arming !== null;
    await arming;
    const armMs = performance.now() - armT0;
    d.assert('touching the instrument anywhere opens the sound device and puts the waiting '
           + 'compile on the audio thread, without compiling anything',
      armedByTouch && ctx !== null && node !== null && runs === armBefore,
      `${armedByTouch ? 'the touch armed it' : 'the touch did nothing'} in ${armMs.toFixed(0)} ms, `
      + `${runs - armBefore} compiles, audio ${ctx ? 'open' : 'none'}`);
    /* Then the key does no work: no fetch, compile or node, timed by the clock around the call.
       See lessons/page-fau.md#fau-89 */
    const keyT0 = performance.now();
    press(60, 100);
    const keyMs = performance.now() - keyT0;
    await sleep(220);
    const armLevel = level();
    d.assert('and a key pressed after that sounds with nothing at all in between',
      armLevel > 0.01 && keyMs < 5 && runs === armBefore,
      `the press itself took ${keyMs.toFixed(1)} ms, ${runs - armBefore} compiles, `
      + `level ${armLevel.toFixed(5)}`);
    lift(60);
    allOff();
    await sleep(400);

    /* Typing under a held note waits for the key: past `IDLE_MS` nothing compiled, same node, note
       sounding; after the key comes up one compile onto a new node. Each half catches a different bug.
       See lessons/page-fau.md#fau-90 */
    const heldBefore = { runs, node, held: idle.held() };
    press(62, 100);
    typeInto(`${PRESETS[0].code}\n// typed under a held key\n`);
    await sleep(IDLE_MS + 500);
    const heldState = idle.state(), heldSays = idle.shown();
    d.assert('typing while a key is held compiles nothing until the key comes up, and the note breathes meanwhile',
      runs === heldBefore.runs && node === heldBefore.node && holding() > 0
        && heldState === 'waiting' && heldSays === NOTE_SAYS.compiling && idle.held() === heldBefore.held + 1,
      `${runs - heldBefore.runs} compiles ${IDLE_MS + 500} ms after typing with ${holding()} held, `
      + `${heldState}, the note reads "${heldSays}", the same node ${node === heldBefore.node}`);
    lift(62);
    allOff();
    await idle.settled();
    d.assert('and the moment the key is up it compiles once and swaps a new node onto the audio thread, off the files the visit already pulled',
      runs === heldBefore.runs + 1 && node !== null && node !== heldBefore.node
        && midi !== null && vendorLoads().length === 4 && idle.shown() === '',
      `${runs - heldBefore.runs} compile, a ${node === heldBefore.node ? 'reused' : 'new'} node, `
      + `MIDI ${midi?.state()}, ${vendorLoads().length} vendor files, the note "${idle.shown()}"`);

    /* Everything below runs inside one `serial` turn, so no compile falls into an `await sleep`.
       `build()` is called directly, never through `serial`, which would deadlock. The names are seven
       characters because a module's name is embedded in its bytes (see `PINNED`).
       See lessons/page-fau.md#fau-91 */
    await serial(async () => {
    const cleanBefore = captured.length;
    const first = await build(PRESETS[0].code, 'organ', PINNED.name);
    d.assert('the compiler in this tab is the version this page was written against',
      faust.compiler.version() === COMPILER_VERSION, faust.compiler.version());
    d.assert('a compile that works says nothing to the console at all',
      captured.length === cleanBefore, `${captured.length - cleanBefore} lines captured`);
    d.assert('everything a compiling page needs really arrived, to the byte',
      vendorLoads().length === 4 && vendorBytes() === PAGE_BYTES,
      `${vendorLoads().length} files, ${vendorBytes()} B of ${PAGE_BYTES} B`);
    /* The one above keeps its bytes: at 0.01 MB a file 4,000 bytes short would read as arrived.
       See lessons/page-fau.md#fau-92 */
    /* See lessons/page-fau.md#fau-93 */
    d.assert('a page of text became machine code, and it took longer than nothing',
      first.ok && first.bytes > 1000 && first.ms > 0,
      `${kb(first.bytes)} kB in ${first.ms.toFixed(0)} ms`);
    /* One known source under one known name is exactly this many bytes. Kept in bytes: a fingerprint
       rounded to 10 bytes is not one.
       See lessons/page-fau.md#fau-94 */
    d.assert('a known source under a known name is exactly the machine code it was last time',
      first.bytes === PINNED.bytes, `${first.bytes} B against ${PINNED.bytes} B`);
    d.assert('one voice of it is a quarter of a megabyte, because a Faust oscillator '
           + 'carries a sine table', first.size > 200000 && first.size < 400000,
      `${kb(first.size)} kB`);

    /* The page's whole claim: editing the text changes the bytes the audio thread runs.
       See lessons/page-fau.md#fau-95 */
    const edited = PRESETS[0].code.replace('quint * os.osc(freq * 3)',
                                           'quint * os.osc(freq * 3) + 0.12 * os.osc(freq * 5)');
    const second = await build(edited, 'edited organ', 'fau_alt');
    d.assert('editing the text changes the machine code the audio thread is running',
      second.ok && second.bytes !== first.bytes,
      `${kb(first.bytes)} kB became ${kb(second.bytes)} kB, from names of the same length`);

    /* The error path, which is the first thing a visitor meets, and the console
       it must not reach. */
    const before = captured.length;
    const bad = await build('process = nonsense(;', 'a deliberate mistake');
    d.assert('a source that does not parse is reported to the visitor rather than thrown away',
      !bad.ok && /syntax error/i.test(bad.error || ''), bad.error || 'no message');
    /* The pair says the shim worked: the good compile captured zero lines, and console leaks are
       caught by demo/verify.mjs's `no console errors`.
       See lessons/page-fau.md#fau-96 */
    d.assert('a compile that fails hands its abort to this page instead of to the console',
      captured.length > before, `${captured.length - before} lines from a bad compile, `
      + '0 from a good one');
    /* Compared by `size`, not bytes: this compile's name has a different length.
       See lessons/page-fau.md#fau-97 */
    const after = await build(PRESETS[0].code, 'organ again');
    d.assert('and the next good compile still works, so one bad source does not end the page',
      after.ok && after.size === first.size,
      `${kb(after.bytes)} kB, ${kb(after.size)} kB a voice`);

    /* ── the sound ────────────────────────────────────────────────────────── */
    const quiet = level();
    press(60, 100);
    await sleep(220);
    const sounding = level();
    d.assert('a key makes a sound, and the page was silent before it',
      sounding > 0.01 && quiet < 0.002, `${quiet.toFixed(5)} silent, ${sounding.toFixed(5)} held`);

    /* The pedal, with its negative control beside it: the same gesture without
       the foot has to end the note. */
    pedal.control(pedal.cc, pedal.wire(false));
    lift(60);
    await sleep(600);
    const released = level();
    d.assert('a key let go with no pedal is taken away', released < sounding * 0.2,
      `${sounding.toFixed(5)} held, ${released.toFixed(5)} let go`);

    /* 600 ms: the organ's release is 0.35 s, and a reading inside it passes whether the pedal worked or
       not (a sabotaged release read 0.03028 against a 0.03940 threshold).
       See lessons/page-fau.md#fau-98 */
    const DECAYED = 600;
    pedal.control(pedal.cc, pedal.wire(true));
    press(62, 100);
    await sleep(200);
    const pedalledDown = level();
    lift(62);
    await sleep(DECAYED);
    const pedalled = level();
    d.assert('a key let go with the pedal down keeps sounding, and the engine is never told '
           + 'the note ended', pedalled > pedalledDown * 0.8 && pedal.held() === 1,
      `${pedalledDown.toFixed(5)} held, ${pedalled.toFixed(5)} after letting go, `
      + `${pedal.held()} on the foot`);
    pedal.control(pedal.cc, pedal.wire(false));
    await sleep(DECAYED);
    d.assert('and lifting the pedal ends it', level() < pedalled * 0.2 && pedal.held() === 0,
      `${level().toFixed(5)}, ${pedal.held()} on the foot`);

    /* With the pedal down and every voice taken, every held note still sounds: the allocator steals
       only voices it was told were released (plan-fau.md 4.2).
       See lessons/page-fau.md#fau-99 */
    pedal.control(pedal.cc, pedal.wire(true));
    for (let i = 0; i < VOICES; i++) press(60 + i, 100);
    await sleep(200);
    const chord = level();
    for (let i = 0; i < VOICES; i++) lift(60 + i);
    await sleep(DECAYED);
    const heldChord = level();
    d.assert('every voice the pedal is holding is still sounding, none of them stolen',
      pedal.held() === VOICES && heldChord > chord * 0.8,
      `${pedal.held()} of ${VOICES} on the foot, ${chord.toFixed(5)} held, `
      + `${heldChord.toFixed(5)} pedalled`);
    pedal.control(pedal.cc, pedal.wire(false));
    allOff();
    await sleep(120);

    /* Two presets, and the cell that tells them apart. A drum somebody else
       modelled carries almost no state; anything with an oscillator in it
       carries a sine table. */
    const drum = await build(byId('djembe').code, 'djembe');
    d.assert('a preset named in one line compiles to more machine code than ten lines of '
           + 'arithmetic, because the model was already in the library',
      drum.ok && drum.bytes > second.bytes,
      `${kb(drum.bytes)} kB from ${kb(byId('djembe').code.length)} kB of source, against `
      + `${kb(second.bytes)} kB from ${kb(edited.length)} kB`);
    d.assert('and one voice of it costs a thousandth of what the organ\'s voice costs',
      drum.size < first.size / 100, `${kb(drum.size)} kB against ${kb(first.size)} kB`);

    /* Two one-name library models side by side: about a quarter kB of source each, per voice nearly
       500 times apart. Found by `id`.
       See lessons/page-fau.md#fau-100 */
    const reed = await build(byId('clarinet').code, 'clarinet');
    d.assert('two patches that are each one line out of the same library keep wildly '
           + 'different amounts per voice',
      reed.ok && reed.size > drum.size * 100,
      `${kb(reed.size)} kB a voice against the drum's ${kb(drum.size)} kB, from `
      + `${kb(byId('clarinet').code.length)} kB and ${kb(byId('djembe').code.length)} kB `
      + 'of source');

    /* Pluck's voice is a buffer, one lap long: bracketed between the drum (0.57 kB) and the organ's
       sine table (262.26 kB). 16.47 kB.
       See lessons/page-fau.md#fau-101 */
    const string = await build(byId('pluck').code, 'pluck');
    d.assert('the string keeps a lap of sound per voice, which is neither a table nor almost '
           + 'nothing',
      string.ok && string.size > drum.size * 10 && string.size < first.size / 10,
      `${kb(string.size)} kB a voice, between the drum's ${kb(drum.size)} kB and the `
      + `organ's ${kb(first.size)} kB`);

    /* An effect runs once on the mix: the same patch with and without its last line differs in machine
       code and not in per voice. Seven character names each, see `PINNED`.
       See lessons/page-fau.md#fau-102 */
    const roomy = await build(byId('sweep').code, 'sweep', 'fau_wet');
    const dry = await build(byId('sweep').code.replace('dm.freeverb_demo;', '_, _;'),
      'sweep dry', 'fau_dry');
    d.assert('a real room on the effect line is thousands of bytes of machine code and not one '
           + 'byte of voice, because it runs once on the mix',
      roomy.ok && dry.ok && roomy.bytes - dry.bytes > 5000 && roomy.size === dry.size,
      `${kb(roomy.bytes)} kB with the room against ${kb(dry.bytes)} kB with a bare wire, and `
      + `${kb(roomy.size)} kB a voice either way`);

    /* Every preset compiles; nothing else here would catch one that does not.
       See lessons/page-fau.md#fau-103 */
    const each = [];
    for (const p of PRESETS) {
      const r = await build(p.code, p.label.toLowerCase());
      each.push(`${p.label} ${r.ok ? `${kb(r.bytes)} kB` : `FAILED, ${r.error}`}`);
    }
    d.assert('every preset in the selector compiles, including the ones no other check names',
      each.every((s) => !s.includes('FAILED')), each.join(', '));

    /* Put the page back the way a visitor should find it. */
    await build(PRESETS[0].code, 'organ');
    source.set(PRESETS[0].code);
    showSource();
    showPatch(0);
    });

    /* Outside the `serial` turn, because it recompiles by typing and the idle compile takes a turn on the
       same queue. Turned through the knob's own keys; Home is the bottom of travel, 100 Hz.
       See lessons/page-fau.md#fau-104 */
    const kDrawn = () => getComputedStyle(knobRow).display !== 'none';
    const kOnRow = () => [...knobRow.querySelectorAll('.pos-knob[data-param]')];
    const cutKnob = () => knobRow.querySelector('.pos-knob[data-param="cutoff"]');
    /* The knob row has a fixed height: the keys' top is read with a patch with no knob (the Djembe)
       and with the Sweep, which has three.
       See lessons/page-fau.md#fau-105 */
    await applyPatch(PRESETS.findIndex((p) => p.id === 'djembe'));
    const keysTop = () => panel.keys.getBoundingClientRect().top;
    const noneTop = keysTop();
    d.assert('the Djembe types no slider, its five are the library\'s, so the row keeps its height, empty',
      kDrawn() && kOnRow().length === 0 && (!!knobRow.querySelector('.pos-pknobs-ghost') && !knobRow.querySelector('.pos-pknobs-say'))
        && knobRow.getBoundingClientRect().height > 0 && book.names().length === 0,
      `${getComputedStyle(knobRow).display}, ${kOnRow().length} knobs, `
      + `${knobRow.getBoundingClientRect().height.toFixed(1)} px, "${knobRow.textContent.trim()}"`);
    await applyPatch(PRESETS.findIndex((p) => p.id === 'sweep'));
    d.assert('and the Sweep\'s knobs take the same room, so the keys under them do not move',
      Math.abs(keysTop() - noneTop) < 0.5 && kOnRow().length === 3,
      `keys at ${noneTop.toFixed(1)} px with no knob and ${keysTop().toFixed(1)} px with ${kOnRow().length}`);
    /* One hue on both sides: the snippet's `--param-hue` and the knob's are the same number.
       freq, gain and gate have no knob and no hue.
       See lessons/page-fau.md#fau-106 */
    {
      /* The arc eases to a new stroke over 120 ms (`.pos-knob-arc`), so the
         hue it was just given is read once that has run. */
      await sleep(150);
      /* What the drawn layer holds: the box adds one space after a final newline. */
      const drawnAs = (t) => t + (t === '' || t.endsWith('\n') ? ' ' : '');
      const snip = (n) => source.ink.querySelector(`.pos-tk-p[data-param="${n}"]`);
      const hueOn = (e) => (e ? getComputedStyle(e).getPropertyValue('--param-hue').trim() : '');
      const lab = getComputedStyle(cutKnob().querySelector('.pos-knob-lab')).color;
      const arc = getComputedStyle(cutKnob().querySelector('.pos-knob-arc')).stroke;
      d.assert('cutoff\'s text in the box and its knob wear one hue from one book, name and arc alike, and freq and gate wear none',
        hueOn(cutKnob()) !== '' && hueOn(cutKnob()) === hueOn(snip('cutoff'))
          && hueOn(snip('cutoff')) === String(book.hueOf('cutoff')) && lab === arc
          && !!snip('freq') && !!snip('gate') && !snip('freq').dataset.hue && !snip('gate').dataset.hue,
        `knob ${hueOn(cutKnob()) || 'none'}, text ${hueOn(snip('cutoff')) || 'none'}, book ${book.hueOf('cutoff')}, `
        + `name ${lab} arc ${arc}, freq ${snip('freq')?.dataset.hue ?? 'plain'}, gate ${snip('gate')?.dataset.hue ?? 'plain'}`);
      const pe = (t) => new PointerEvent(t, { bubbles: true, pointerId: 1, pointerType: 'mouse', isPrimary: true });
      const dl = cutKnob().querySelector('.pos-knob-dial');
      dl.dispatchEvent(pe('pointerdown'));
      const litHeld = snip('cutoff')?.dataset.active === '1' && !snip('freq')?.dataset.active;
      dl.dispatchEvent(pe('pointerup'));
      const litAfter = snip('cutoff')?.dataset.active;
      d.assert('holding the cutoff knob lights cutoff\'s text in the box and nothing else, and letting go puts it out',
        litHeld && litAfter === undefined, `held ${litHeld ? 'lit' : 'not lit'}, after ${litAfter ?? 'out'}`);
      /* The code box's invariant: the coloured layer holds exactly the textarea's text at its metrics.
         See lessons/page-fau.md#fau-107 */
      const cs = (e) => getComputedStyle(e);
      const PROPS = ['font-size', 'line-height', 'padding-top', 'padding-left', 'white-space'];
      const differ = PROPS.filter((p) => cs(source.ink).getPropertyValue(p) !== cs(source.input).getPropertyValue(p));
      const libs = source.ink.querySelectorAll('.pos-tk-lib, .pos-tk-builtin').length;
      d.assert('the program is drawn coloured over the box exactly as it is in the textarea, at the box\'s own metrics',
        source.ink.textContent === drawnAs(source.input.value) && differ.length === 0 && libs > 3,
        `${source.input.value.length} characters, ${differ.length ? `differs in ${differ.join(' ')}` : 'metrics equal'}, `
        + `${libs} library names coloured`);
    }
    const cutAddr = onThread?.addr.get('cutoff');
    d.assert('the Sweep has three knobs, cutoff, depth and res, and not the room\'s four, which are the library\'s and not in the text',
      kDrawn() && kOnRow().map((k) => k.dataset.param).sort().join(' ') === 'cutoff depth res' && !!cutKnob()
        && cutKnob().querySelector('.pos-knob-v').textContent === '8000',
      kOnRow().map((k) => `${k.dataset.param} ${k.querySelector('.pos-knob-v').textContent}`).join(', ') || 'no knobs');
    d.assert('its range is the slider\'s own, 100 to 8000 on a log scale, and the live node knows that address',
      /hslider\("cutoff\[scale:log\]", 8000, 100, 8000, 1\)/.test(byId('sweep').code)
        && cutKnob()?.getAttribute('title') === 'cutoff, 100 to 8000, exp'
        && !!cutAddr && node.getParams().includes(cutAddr),
      `${cutKnob()?.getAttribute('title')}, ${cutAddr} ${node?.getParams().includes(cutAddr) ? 'is' : 'is not'} in getParams()`);
    const avg = async (n = 8) => {
      let sum = 0;
      for (let i = 0; i < n; i++) { sum += level(); await sleep(25); }
      return sum / n;
    };
    const cutDial = () => cutKnob().querySelector('.pos-knob-dial');
    press(48, 100);
    press(55, 100);
    await sleep(400);
    const open = await avg();
    const sendsBefore = paramSends, cableBefore = knobLink('cutoff')?.sent ?? NaN;
    cutDial().dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));
    await sleep(250);
    const shut = await avg();
    d.assert('turning cutoff to the bottom while two keys are held darkens both at once, with no recompile',
      knobs.value('cutoff') === 100 && paramSends > sendsBefore && shut < open * 0.4 && open > 0.005,
      `${open.toFixed(5)} rms open, ${shut.toFixed(5)} at 100 Hz, ${paramSends - sendsBefore} setParamValue`);
    /* The turn went through the bay: counted on the knob cable's own `sent`, so a direct call reads 0.
       See lessons/page-fau.md#fau-108 */
    {
      const cable = knobLink('cutoff'), carried = (cable?.sent ?? NaN) - cableBefore;
      d.assert('that turn reached the node along the bay link from the cutoff knob node into the engine, one send for each setParamValue',
        !!cable && carried > 0 && carried === paramSends - sendsBefore && bay.port(FAU_IN()).shape.names.includes('cutoff'),
        `${cable ? `${cable.from} -> ${cable.to}` : 'no cable'}, sent grew by ${carried}, ${paramSends - sendsBefore} setParamValue`);
    }
    lift(48);
    lift(55);
    /* An assert here, because the recompile below is the idle wait plus the note's minimum, and a check
       block quiet for two seconds is cut off.
       See lessons/page-fau.md#fau-109 */
    await sleep(400);
    d.assert('letting both keys go takes the sound away, with the knob still where it was turned',
      level() < open * 0.2 && knobs.value('cutoff') === 100 && holding() === 0,
      `${level().toFixed(5)} rms, cutoff ${knobs.value('cutoff')}, ${holding()} held`);
    const nodeBefore = node, sendsAtRecompile = paramSends;
    typeInto(`${byId('sweep').code}// the same Sweep, recompiled\n`);
    await idle.settled();
    const newAddr = onThread?.addr.get('cutoff');
    d.assert('a recompile keeps the knob at 100 and hands it to the new node before it is heard',
      node !== nodeBefore && knobs.value('cutoff') === 100 && !!newAddr && node.getParams().includes(newAddr)
        && paramSends > sendsAtRecompile,
      `${node === nodeBefore ? 'the same' : 'a new'} node, knob ${knobs.value('cutoff')}, `
      + `${paramSends - sendsAtRecompile} setParamValue to it at ${newAddr}`);
    press(48, 100);
    press(55, 100);
    await sleep(400);
    const still = await avg();
    lift(48);
    lift(55);
    d.assert('and the same two keys on the new node are as dark as they were before it',
      still < open * 0.4, `${still.toFixed(5)} rms against ${open.toFixed(5)} open`);
    await sleep(500);
    cutDial().dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    d.assert('and a double press puts it back where the program wrote it, 8000',
      knobs.value('cutoff') === 8000, String(knobs.value('cutoff')));
    /* The invisible hand turns it: the live node is asked for cutoff and must give the knob's value,
       with the page counting `setParamValue`s from the hand.
       See lessons/page-fau.md#fau-110 */
    {
      cutDial().dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));
      const handBtn = () => cutKnob().querySelector('.pos-knob-hand');
      const sendsBeforeHand = paramSends;
      handBtn().click();
      await sleep(1200);
      const handRan = knobs.handOn('cutoff');
      handBtn().click();
      const byHand = knobs.value('cutoff');
      /* One beat before asking the node: `getParamValue` lags one render quantum after `setValueAtTime`.
         50 ms is eighteen quanta at 48 kHz.
         See lessons/page-fau.md#fau-111 */
      await sleep(50);
      const addr = onThread?.addr.get('cutoff');
      const onNode = addr ? node.getParamValue(addr) : NaN;
      d.assert('its invisible hand turns cutoff by itself, and the live node holds the value the knob shows',
        handRan && !knobs.handOn('cutoff') && byHand > 100 && paramSends > sendsBeforeHand
          && Math.abs(onNode - byHand) < 0.5,
        `hand ${handRan ? 'ran' : 'did not run'}, cutoff ${byHand} after ${paramSends - sendsBeforeHand} `
        + `setParamValue, the node says ${onNode}`);
      cutDial().dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    }

    /* A recompile that renames a parameter (`res` to `reso`) replaces its knob node and cable; a
       surviving name keeps its cable and count.
       See lessons/page-fau.md#fau-112 */
    {
      const S = engine.site, cutBefore = knobLink('cutoff'), cutSent = cutBefore?.sent ?? NaN;
      const oldNode = `${S}:knob-res`, newNode = `${S}:knob-reso`;
      const hadOld = !!bay.node(oldNode) && !!knobLink('res');
      typeInto(byId('sweep').code.replace('hslider("res[', 'hslider("reso['));
      await idle.settled();
      const from = (n) => bay.links().filter((l) => l.from === `${n}:value-out`);
      const names = bay.port(FAU_IN())?.shape.names.slice().sort().join(' ');
      const cutNow = knobLink('cutoff');
      d.assert('a recompile that renames res to reso takes the res knob node and its cable away and cables a reso node into the engine',
        hadOld && !bay.node(oldNode) && from(oldNode).length === 0
          && !!bay.node(newNode) && from(newNode).length === 1 && from(newNode)[0].to === FAU_IN()
          && names === 'cutoff depth reso' && knobs.names().includes('reso') && !knobs.names().includes('res'),
        `res node ${bay.node(oldNode) ? 'still there' : 'gone'} with ${from(oldNode).length} cables, `
        + `reso node ${bay.node(newNode) ? 'there' : 'missing'} with ${from(newNode).length}, value-in names ${names}`);
      d.assert('and the cutoff knob, whose name survived, keeps its cable and the cable keeps its count',
        !!cutNow && cutNow.sent === cutSent && knobs.value('cutoff') === 8000
          && pb.view.el.textContent.includes('reso'),
        `cable ${cutNow ? 'there' : 'gone'}, sent ${cutSent} before and ${cutNow?.sent} after, knob ${knobs.value('cutoff')}`);
      /* Negative control: with the cutoff cable unlinked the dial turns and the node stays at 8000.
         Relinked, the same turn reaches it.
         See lessons/page-fau.md#fau-113 */
      const addr = onThread?.addr.get('cutoff');
      bay.unlink(cutNow?.id);
      const sendsCut = paramSends;
      cutDial().dispatchEvent(new KeyboardEvent('keydown', { key: 'Home', bubbles: true }));

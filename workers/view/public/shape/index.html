<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* Everything that can reach the instrument lives here, never in `.pos-controls`, which
     demo/verify.mjs presses on every run. `space-between` over exactly two children, so a wrapped
     line holds one item and parks at the start (375 px: two lines; 756 and up: one, no scroll).
     See lessons/page-shape.md#shape-1 */
  .shape-bar {
    --shape-bar-gap: 10px;
    display: flex; gap: var(--shape-bar-gap); align-items: center;
    flex-wrap: wrap; justify-content: space-between;
  }

  /* The far end of the justified row, one element so the row has two children. The gap is read
     from `--shape-bar-gap`, not typed twice. It wraps for the same reason the row does.
     See lessons/page-shape.md#shape-2 */
  .shape-bar-end {
    display: flex; gap: var(--shape-bar-gap); align-items: center; flex-wrap: wrap;
  }

  /* A section is a glued row's only child: `min-width: 0` so its widest lane does not drag the row,
     and `flex: 1 1 auto` so the `minmax(0, 1fr)` lanes resolve against the row's width.
     See lessons/page-shape.md#shape-3 */
  .shape-sec { flex: 1 1 auto; min-width: 0; }

  /* One label column across every section: `.sld-group` sizes its own `max-content`, so nine
     sections would start their lanes at nine x. Set as a width on the head, not as grid columns,
     so the kit's paired columns still apply; `content-box` keeps the seam padding outside `--lab`.
     See lessons/page-shape.md#shape-4 */
  .shape-sec .sld-head { box-sizing: content-box; width: var(--lab, auto); }

  /* Two sliders across on a desktop: `pair: true` on createSliderGroup. The breakpoint, seam and
     column gap are shell.css's, not typed here; `--lab` fixes both label columns.
     See lessons/page-shape.md#shape-5 */
</style>
<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createStack } from '/shell/stack.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createPresenceButton, WIRED } from '/shell/presence.mjs';
  import { createInstrumentPanel } from '/shell/instrument-panel.mjs';
  import { centreSymbol, setSymbol } from '/shell/symbol.mjs';
  import { createMidiLog } from '/shell/midi-log.mjs';
  import { decode } from '/shell/midi-decode.mjs';
  import { makeCcSend } from '/shell/cc-adapter.mjs';
  import { MOVES, MOVE_GLYPH, minSteps } from '/shell/hand.mjs';
  import { SELFCHECK, ifSelfcheck } from '/shell/selfcheck.mjs';
  import { onChannel, param, ccBytes } from '/shell/circuit-cc.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { offerLoopFor, inputNames, checkEvolutionLoop } from '/shell/midi.mjs';

  /**
   * Editing a Novation Circuit while it plays, by control change only (98 parameters in
   * demo/shell/circuit-cc.mjs from Novation's guide v1.1). No SysEx: one byte separates Replace
   * Current Patch from Replace Patch, which writes flash. The page cannot read the instrument.
   * See lessons/page-shape.md#shape-6
   */

  /**
   * The channel is half the address: CC 74 is the synth filter on 1 and 2 and the master filter
   * on 16, so everything here is keyed by the pair.
   * See lessons/page-shape.md#shape-7
   */
  const VOICES = [
    ['Synth 1', { group: '1/2', ch: 1 }],
    ['Synth 2', { group: '1/2', ch: 2 }],
    ['Session', { group: '16', ch: 16 }],
  ];

  /**
   * Read, not typed: a lane coarser than `minSteps()` draws a staircase under a hand.
   * See lessons/page-shape.md#shape-8
   */
  const HAND_STEPS = minSteps(MOVES[0][1]);

  /**
   * The Circuit on the Raspberry Pi, through createBoard as /away/ does. A Circuit on this USB port
   * wins when both are there. The board's gate passes notes and the 52 synth CCs on channels 1 and 2,
   * so the session part is off over the board; hearing it is the keyboard and Listen.
   * See lessons/page-shape.md#shape-9
   */
  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1-circuit';
  // Well inside the board's 60 s lease, so one lost message costs nothing.
  const RENEW_MS = 20_000;
  /**
   * A lower ceiling over the relay: about 1000 messages a second for the whole room, which also
   * carries the audio. One finger is one message a frame and is never paced.
   * See lessons/page-shape.md#shape-10
   */
  const BOARD_CEILING = 300;
  /** `local`, `board` or null: where a control change goes when it leaves. */
  let route = null;
  /** The board, built on the first press that finds no local Circuit. */
  let board = null, boardOk = false;

  const d = mount({
    name: 'shape',
    what: "Edit a Novation Circuit's sound while it is playing, plugged in here or on a Raspberry Pi in another building, with sliders that can move themselves.",
    /**
     * Four cells and every one of them moves.
     * `cc out` is what this page has produced, `rate` is what it is producing
     * right now and is the cell that says the word real time in numbers,
     * `merged` is how many positions never left on their own because a newer
     * one was already coming, whether the coalescer folded them together or the
     * pacing held one back, and
     * `changed` is how far the instrument is from where this page opened.
     */
    readout: { 'cc out': '', rate: '/s', merged: '', changed: '' },
    /**
     * No control row: the harness presses nothing, so the page presses its own status button behind
     * `SELFCHECK` (see `bar.prepend`). Nothing that sends may sit in `.pos-controls`, and
     * slider.mjs refuses a hand there.
     * See lessons/page-shape.md#shape-11
     */
    controls: [],
  });
  guard(d);

  // ── what may leave this page ──────────────────────────────────────────────

  /**
   * An intention into bytes: there is no branch for SysEx, program change, note or clock, so none
   * can be expressed. The pair must also be a parameter the guide documents for that channel group.
   * See lessons/page-shape.md#shape-12
   */
  function toBytes(m) {
    if (!m || m.kind !== 'cc') return null;
    if (!Number.isInteger(m.ch) || m.ch < 1 || m.ch > 16) return null;
    if (!Number.isFinite(m.value)) return null;
    if (!param(m.group, m.cc)) return null;
    return ccBytes(m.ch, m.cc, m.value);
  }

  /**
   * One place a byte can leave: every message goes through `emit` and every byte through
   * `toBytes`, so "only control changes" is asserted over what went.
   * See lessons/page-shape.md#shape-13
   */
  let out = 0, refused = 0, portSends = 0, notCc = 0, boardSends = 0;
  /**
   * The checks install one of these and nothing reaches a real port while it is
   * there. `/knobs/` does the same with its send gate, for the reason written
   * there: a suite run must not be a hand on somebody's instrument.
   */
  let sink = null;
  let port = null;

  function emit(m) {
    const bytes = toBytes(m);
    if (!bytes) { refused++; return false; }
    /* The audit is a counter rather than a kept list, so it covers every
       message this page has ever produced and costs no memory to do it. */
    if ((bytes[0] & 0xf0) !== 0xb0) notCc++;
    out++;
    bump(1);
    if (sink) sink.push({ ...m, bytes });
    else if (port) {
      try {
        port.send(bytes);
        portSends++;
        /* Said once: `cc out` climbs with nothing plugged in. This line says a byte left the browser.
           See lessons/page-shape.md#shape-14 */
        if (!saidReached) { saidReached = true; d.log(`the first control change has gone to ${portName(port)}`, 'hi'); }
      } catch (e) { d.log(`${portName(port)} refused a message (${e.message})`, 'warn'); }
    }
    else if (route === 'board') toBoard(bytes);
    const p = param(m.group, m.cc);
    /* `cc out` counts what this page produced, not what an instrument heard; presence is the badge's
       job. The hex is the fact, and this page adds the parameter's name.
       See lessons/page-shape.md#shape-15 */
    traffic.add({ ...decode(bytes), reading: `${p ? p.name : 'unknown'}, ${m.value}` });
    d.set('cc out', out);
    return true;
  }

  // ── the coalescer ─────────────────────────────────────────────────────────

  /**
   * One message per parameter per animation frame: the Circuit is on USB, so the device is the limit.
   * A gate per channel, since makeCcSend keys by controller number and CC 74 differs per channel.
   * `restateMs: Infinity` and `gateMs: 0`: no restating over USB, the frame is the grain.
   * See lessons/page-shape.md#shape-16
   */
  const gates = new Map();
  const gateKey = (v) => `${v.group}|${v.ch}`;
  function gateFor(v) {
    const k = gateKey(v);
    let g = gates.get(k);
    if (!g) { g = { v, gate: makeCcSend({ gateMs: 0, restateMs: Infinity }) }; gates.set(k, g); }
    return g;
  }

  /**
   * Forty hands move forty different controllers, so the frame gate merges nothing (measured up to
   * 1289 CC a second). A ceiling of 600 gives each of forty lanes 15 a second. Applied only to hand
   * values from two hands up; a finger is never paced.
   * See lessons/page-shape.md#shape-17
   */
  const HAND_CEILING = 600;                    // control changes a second, everything in
  const handGap = (n, ceiling = HAND_CEILING) => (n <= 1 ? 0 : Math.ceil(1000 * n / ceiling));
  let handsRunning = 0, paced = 0;
  const lastOffer = new Map();                 // parameter key -> when it was last offered

  /**
   * Every position this page decided not to send because a newer one was
   * coming, whichever side of the gate it was dropped on.
   */
  const mergedTotal = () => paced + [...gates.values()].reduce((s, g) => s + g.gate.stats.thinned, 0);

  let pumping = 0;
  function queue(v, p, value, end, byHand = false) {
    /* The last value of a gesture is never paced: it is the one that stays true.
       See lessons/page-shape.md#shape-18 */
    const gap = byHand && !end ? handGap(handsRunning, route === 'board' ? BOARD_CEILING : HAND_CEILING) : 0;
    if (gap) {
      const k = `${gateKey(v)}|${p.cc}`;
      const now = performance.now();
      if (now - (lastOffer.get(k) ?? -Infinity) < gap) { paced++; d.set('merged', mergedTotal() || ''); return; }
      lastOffer.set(k, now);
    }
    gateFor(v).gate.put(p.cc, value, { end });
    if (!pumping) pumping = requestAnimationFrame(flush);
  }
  function drain() {
    const now = performance.now();
    for (const g of gates.values()) {
      const msg = g.gate.tick(now);
      if (!msg) continue;
      for (const [cc, value] of msg.set) emit({ kind: 'cc', group: g.v.group, ch: g.v.ch, cc, value });
    }
    d.set('merged', mergedTotal() || '');
  }
  const flush = () => { pumping = 0; drain(); };
  /* For a caller that cannot wait for a frame: the checks, and the tab going to
     the background, where no frame is coming and the last value of a gesture
     would otherwise sit in the pending map until somebody came back. */
  const flushNow = () => { if (pumping) cancelAnimationFrame(pumping); pumping = 0; drain(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); });

  /**
   * CC out in the last second. The timer starts on the first message and stops after an idle second,
   * so the cell goes empty rather than holding a stale number.
   * See lessons/page-shape.md#shape-19
   */
  let ticker = 0, inWindow = 0;
  function bump(n) {
    inWindow += n;
    if (ticker) return;
    ticker = setInterval(() => {
      const had = inWindow;
      inWindow = 0;
      d.set('rate', had || '');
      if (!had) { clearInterval(ticker); ticker = 0; }
    }, 1000);
  }

  // ── the parameters, and where this page left them ──────────────────────────

  const keyOf = (v, p) => `${v.group}|${v.ch}|${p.cc}`;
  /**
   * The midpoint of the wire range: neutral for centred parameters (52 to 76 is minus to plus 12
   * semitones), arbitrary for the rest. Nothing is sent until a handle moves.
   * See lessons/page-shape.md#shape-20
   */
  const homeOf = (p) => Math.round((p.lo + p.hi) / 2);
  const values = new Map();       // key -> where this page has left the handle
  /** The parameter a key names, or null for a key no table row answers. */
  const paramOf = (key) => { const [g, , cc] = key.split('|'); return param(g, Number(cc)); };
  const changed = () => [...values]
    .filter(([k, x]) => { const p = paramOf(k); return p && x !== homeOf(p); }).length;

  // ── the page ──────────────────────────────────────────────────────────────

  let voice = VOICES[0][1], voiceName = VOICES[0][0];
  let sliders = [];               // {p, sld, key} for the part on screen
  let handStarts = 0, handLines = 0;
  /* One line rather than forty. See `handSaid`. */
  let quietHands = false;

  const parts = createChoice({
    options: VOICES,
    at: 0,
    onPick: (v, name) => showVoice(v, name),
  });

  /**
   * No output chooser: the first output named Circuit is taken. Two Circuits, or one with several
   * endpoints, cannot be steered from here. Every output is logged by name and each failure has
   * its own word, so the fault stays findable.
   * See lessons/page-shape.md#shape-21
   */

  /**
   * Here and not in `.pos-controls`, which demo/verify.mjs presses on every run: this button starts
   * forty hands on a real instrument. The placement is asserted.
   * See lessons/page-shape.md#shape-22
   */
  /**
   * A glyph with `aria-label` and a `title` for its name. `⇄` U+21C4 has no emoji form. 34 px square
   * by shell.css's `button[data-glyph="1"]`; `centreSymbol` centres the ink, not the advance.
   * See lessons/page-shape.md#shape-23
   */
  /**
   * One control, two states: while any hand runs it reads `put everything back` and calls `putBack`.
   * The state is `handsRunning` from `handSaid`, not a flag here, and flips on running alone.
   * `setSymbol`, not `textContent`, keeps centreSymbol's span. `↺` U+21BA has no emoji form.
   * See lessons/page-shape.md#shape-24
   */
  const HAND_SAYS = {
    move: {
      glyph: '⇄',
      aria: 'move everything',
      title: 'put every slider on this part somewhere new, and let the ones with room to show it '
        + 'go on moving by themselves',
    },
    back: {
      glyph: '↺',
      aria: 'put everything back',
      title: 'stop every slider that is moving by itself and put every parameter this page has '
        + 'moved back to where this page opened it',
    },
  };
  let handMode = 'move';
  const hand = el('button', 'pos-btn shape-hand', HAND_SAYS.move.glyph, { type: 'button', 'data-glyph': '1' });
  hand.title = HAND_SAYS.move.title;
  hand.setAttribute('aria-label', HAND_SAYS.move.aria);
  centreSymbol(hand);
  hand.onclick = () => (handMode === 'back' ? putBack() : moveEverything());

  /** Put the control in the state the page is in. A no-op when it is there. */
  function syncHand() {
    const want = handsRunning > 0 ? 'back' : 'move';
    if (want === handMode) return;
    handMode = want;
    const s = HAND_SAYS[want];
    setSymbol(hand, s.glyph);
    hand.setAttribute('aria-label', s.aria);
    hand.title = s.title;
  }

  const bar = el('div', 'shape-bar');
  const barEnd = el('div', 'shape-bar-end');
  bar.append(barEnd);
  barEnd.append(parts.el);
  /**
   * The hand is its own button beside the chooser: an action is not an option. It sits in
   * `.shape-bar-end` so the row keeps two children, joined via `parts.el`, and stays out of
   * `.pos-controls`. Its top aligning with the options is asserted.
   * See lessons/page-shape.md#shape-25
   */
  barEnd.append(hand);
  /**
   * `empty: ''` silences the default sentence (table.mjs appends nothing); `reserve` holds the box
   * open so the first message does not reflow the page. Same as /circuit/, /evo/ and /twelve/.
   * See lessons/page-shape.md#shape-26
   */
  const traffic = createMidiLog({ empty: '', reserve: 6 });

  /**
   * The rack is createInstrumentPanel with no picture and no keys row: each section a glued row
   * with a `stack.titled()` heading, the plate at the foot as the component orders it. `full: true`
   * because lanes are `minmax(0, 1fr)` and `.pos-rows` is fit-content.
   * See lessons/page-shape.md#shape-27
   */
  /**
   * The keys show only while the board is the route: a local Circuit gets control changes only.
   * The computer's letters play it from anywhere on the page.
   * See lessons/page-shape.md#shape-28
   */
  const kbHost = el('div');
  const kb = createKeyboard(kbHost, {
    ...keyRange(),
    base: 48,
    full: true,
    /* `Loop` while the Evolution is plugged in. A looped note comes back through `onDown` marked
       `loop`, so it meets the same route gate as a finger.
       See lessons/page-shape.md#shape-29 */
    loop: 'evolution',
    log: (line, kind) => d.log(line, kind),
    onDown: (note) => { if (route !== 'board') return; kb.lightNote(note, true); noteOn(note); },
    onUp: (note) => { kb.lightNote(note, false); noteOff(note); },
    onPanic: () => panic(),
  });
  const panel = createInstrumentPanel({
    full: true,
    keys: kbHost,
    plate: { name: 'shape' },
  });
  panel.keys.hidden = true;
  d.stack.add(bar, panel.el, traffic.el);

  /**
   * A part's rack is built once, lazily, and kept: a rebuild would leak hands and listeners and lose
   * positions. A visit builds only Synth 1's 52 sliders.
   * See lessons/page-shape.md#shape-30
   */
  const built = new Map();
  /** Every slider this page has built, across every part it has been shown. */
  const everyRow = () => [...built.values()].flatMap((r) => r.rows);
  /** The same rows, by parameter key, so `moved` can ask a slider about itself. */
  const rowByKey = new Map();

  /**
   * Novation's own grouping: the `Group_Parameter` prefixes of the guide's patch addresses, which
   * their editor also draws. circuit-cc.mjs's coarser `sec` column (its `Effects and EQ` has no EQ)
   * is left alone. A label drops only the word its heading carries; the full name stays in hover and logs.
   * See lessons/page-shape.md#shape-31
   */
  const GROUPED = [
    { sec: 'OSC 1', of: (p) => p.sec === 'Oscillator' && p.name.startsWith('osc 1 '), drop: 'osc 1 ' },
    { sec: 'OSC 2', of: (p) => p.sec === 'Oscillator' && p.name.startsWith('osc 2 '), drop: 'osc 2 ' },
    /* Five envelope parameters and all five are env 1, so the heading can say
       which one. The reference has `Envelope2_` and `Envelope3_` as well and
       neither is reachable over a control change. */
    { sec: 'ENVELOPE 1', of: (p) => p.sec === 'Envelope', drop: 'env 1 ' },
    { sec: 'DISTORTION', of: (p) => p.sec === 'Effects and EQ' && p.name.startsWith('distortion '), drop: 'distortion ' },
    { sec: 'CHORUS', of: (p) => p.sec === 'Effects and EQ' && p.name.startsWith('chorus '), drop: 'chorus ' },
    /* One heading over the eight `MacroKnob<n>_` groups, a roll-up of ours. Only `macro` is dropped.
       See lessons/page-shape.md#shape-32 */
    { sec: 'MACRO KNOBS', of: (p) => p.sec === 'Macro Knob', drop: 'macro ' },
  ];

  /**
   * What a parameter is called here and its heading. With no row above it keeps both: Voice, Mixer
   * and Filter are already group names, and the four session headings have no patch counterpart.
   * See lessons/page-shape.md#shape-33
   */
  function shown(p) {
    const g = GROUPED.find((r) => r.of(p));
    if (!g) return { sec: p.sec.toUpperCase(), label: p.name };
    return { sec: g.sec, label: p.name.startsWith(g.drop) ? p.name.slice(g.drop.length) : p.name };
  }

  /**
   * The headings for a part, read in the reference table's order so none can go missing: on the
   * synths VOICE, OSC 1, OSC 2, MIXER, FILTER, ENVELOPE 1, DISTORTION, CHORUS, MACRO KNOBS.
   * See lessons/page-shape.md#shape-34
   */
  function shownSections(group) {
    const out = [];
    for (const p of onChannel(group)) { const s = shown(p).sec; if (!out.includes(s)) out.push(s); }
    return out;
  }

  /**
   * Forty hands say one line between them, from the caller that started them. `handLines` counts
   * what reached the log so it can be asserted.
   * See lessons/page-shape.md#shape-35
   */
  const handSaid = (p) => (s) => {
    if (s.why === 'in-controls') { d.log(s.says, 'warn'); handLines++; return; }
    if (s.why === 'coarse') return;            // a coarse lane is given no hand
    /* How many are moving, counted here because both edges arrive here. `stop` returns early when
       there is nothing to stop, so the count is exact.
       See lessons/page-shape.md#shape-36 */
    if (s.on) {
      handsRunning++; handStarts++;
      syncHand();
      if (!quietHands) { handLines++; d.log(`${p.name} is moving by itself`); }
      return;
    }
    handsRunning = Math.max(0, handsRunning - 1);
    /* Here too because a hand also stops on its own (ten minute ceiling, background tab).
       See lessons/page-shape.md#shape-37 */
    syncHand();
    if (quietHands) return;
    const why = s.why === 'ceiling' ? ', which is the ten minute ceiling'
      : s.why === 'hidden' ? ', because this tab went to the background'
      : s.why === 'put back' ? ', because everything went back' : '';
    handLines++;
    d.log(`${p.name} is yours again${why}`);
  };

  function makeSlider(v, p, into) {
    const key = keyOf(v, p);
    if (!values.has(key)) values.set(key, homeOf(p));
    /**
     * A hand only where one can be seen: twelve of the 52 synth parameters have fewer steps than a
     * sweep needs and would draw a staircase.
     * See lessons/page-shape.md#shape-38
     */
    const wide = (p.hi - p.lo) >= HAND_STEPS;
    const sld = createSlider({
      /* Short name on the face, the guide's full `p.name` in hover, aria label and every log line.
         See lessons/page-shape.md#shape-39 */
      label: shown(p).label,
      /* The controller number is in the hover, not under the handle; the bytes are in the log.
         See lessons/page-shape.md#shape-40 */
      aria: `${p.name}, CC ${p.cc} on channel ${v.ch}`,
      min: p.lo, max: p.hi, step: 1, value: values.get(key),
      hand: wide,
      onHand: wide ? handSaid(p) : undefined,
      onInput: (x) => moved(v, p, x, false),
      onChange: (x) => moved(v, p, x, true),
    });
    const title = `${p.name}, CC ${p.cc} on channel ${v.ch}, ${p.lo} to ${p.hi}`;
    sld.el.title = title;
    const row = { p, sld, key, v };
    into.push(row);
    rowByKey.set(key, row);
    return sld;
  }

  /**
   * A part's sections, one glued row each, so the seams mean something. `addRow` puts every row
   * above the foot whatever order parts are built in.
   * See lessons/page-shape.md#shape-41
   */
  function buildPart(v) {
    const rows = [];
    const els = [];
    for (const sec of shownSections(v.group)) {
      /* `pair: true` is the whole two column layout, and it is the kit's.
         See lessons/page-shape.md#shape-42 */
      const group = createSliderGroup(
        onChannel(v.group).filter((p) => shown(p).sec === sec).map((p) => makeSlider(v, p, rows)),
        { pair: true });
      /* Uppercased where the name is decided, so the source reads like the page. `stack.titled()`
         owns the 10 px between a heading and what it labels.
         See lessons/page-shape.md#shape-43 */
      const box = createStack(undefined, 'shape-sec');
      box.titled(sec, group.el);
      els.push(panel.addRow(box.el, { align: 'start' }));
    }
    return { rows, els };
  }

  function showVoice(v, name) {
    /* Anything still moving belongs to the part being left, and a hand on a
       detached slider is a page sending for as long as the tab is open. */
    stopEveryHand('part');
    flushNow();
    voice = v; voiceName = name || voiceName;
    const k = gateKey(v);
    if (!built.has(k)) built.set(k, buildPart(v));
    const r = built.get(k);
    sliders = r.rows;
    /* Hidden, not detached: a `display: none` row takes no gap, so the seams of the remaining rows stay
       single. That is why a part switch is a swap.
       See lessons/page-shape.md#shape-44 */
    for (const [key, part] of built) for (const e of part.els) e.hidden = key !== k;
    shareLabelColumn();
    d.set('changed', changed() || '');
  }

  /**
   * One label column across every section on screen. Measures `.sld-l` and `.sld-v`, never the
   * head, whose width after `--lab` is the answer rather than the question.
   * See lessons/page-shape.md#shape-45
   */
  function shareLabelColumn() {
    const groups = [...panel.el.querySelectorAll('.sld-group')];
    if (!groups.length) return;
    const wide = groups
      .flatMap((g) => [...g.querySelectorAll('.sld-l, .sld-v')])
      .reduce((m, e) => Math.max(m, e.getBoundingClientRect().width), 0);
    if (!wide) return;
    for (const g of groups) g.style.setProperty('--lab', `${Math.ceil(wide)}px`);
  }

  let saidNothingOpen = false, saidNoPort = false;
  function moved(v, p, value, end) {
    const key = keyOf(v, p);
    values.set(key, value);
    /* Whether a hand produced this: `pointerdown` makes a hand yield, so `running && !held` is true only
       while the hand moves the handle. Both paths share `onInput`.
       See lessons/page-shape.md#shape-46 */
    const h = rowByKey.get(key)?.sld.hand;
    queue(v, p, value, end, !!(h?.running && !h.held));
    d.set('changed', changed() || '');
    /**
     * Which link is broken, a word per failure, where somebody looks when they hear nothing.
     * See lessons/page-shape.md#shape-47
     */
    if (route === 'board') {
      /* the board route has its own words, said once when it was chosen */
    } else if (!access && !saidNothingOpen) {
      saidNothingOpen = true;
      d.log('nothing is open yet, so these moves are going nowhere. Press the status button '
          + 'beside the title and this page will list what is plugged in.');
    } else if (access && !port && !saidNoPort) {
      saidNoPort = true;
      d.log(ports.length
        ? `no output here is named Circuit, so these moves are going nowhere. This browser `
          + `reported ${ports.length === 1 ? 'one output' : `${ports.length} outputs`} and the `
          + 'log above names them.'
        : 'this browser opened MIDI and found no outputs at all, so these moves are going nowhere.',
        'warn');
    }
  }

  /**
   * `put back` re-sends, for every parameter moved on every part, its value when this page opened;
   * not the saved patch, which reloading the session on the Circuit restores. Its only caller is the
   * hand button's `back` state, and the checks press that button.
   * See lessons/page-shape.md#shape-48
   */
  /**
   * Stop every running hand, anywhere, and say how many in one line when more than one.
   * It counts before it stops, since `stop()` raises the line.
   * See lessons/page-shape.md#shape-49
   */
  function stopEveryHand(why) {
    const rows = everyRow();
    const n = rows.filter((s) => s.sld.hand?.running).length;
    quietHands = n > 1;
    for (const s of rows) s.sld.hand?.stop(why);
    quietHands = false;
    /* A row with no hand raises no edge, so the count above can reach zero
       without `handSaid` ever running. Said here as well as there. */
    syncHand();
    if (n > 1) { handLines++; d.log(`${n} sliders stopped moving by themselves`); }
    return n;
  }

  function putBack() {
    /* Every part, not the one on screen, so a handle never disagrees with what was sent.
       See lessons/page-shape.md#shape-50 */
    stopEveryHand('put back');
    let n = 0;
    for (const [key, x] of values) {
      const [, chs] = key.split('|');
      const p = paramOf(key);
      if (!p) continue;
      const home = homeOf(p);
      if (x === home) continue;
      values.set(key, home);
      gateFor({ group: key.split('|')[0], ch: Number(chs) }).gate.put(p.cc, home, { end: true });
      n++;
    }
    flushNow();
    /* `quiet`, because the value has already gone; the handles glide home.
       See lessons/page-shape.md#shape-51 */
    for (const s of everyRow()) s.sld.set(values.get(s.key), { quiet: true, glideMs: 600 });
    d.set('changed', changed() || '');
    if (!n) { d.log('nothing to put back'); return; }
    d.log(`put ${n} parameter${n === 1 ? '' : 's'} back to where this page opened ${n === 1 ? 'it' : 'them'}. `
        + 'That is not the patch as it was saved, because this page never reads the Circuit. '
        + 'Reloading the session on the instrument does that, and nothing here has ever written to its flash.');
  }

  /**
   * `move everything`: one press puts every slider on the part somewhere new and starts a hand where
   * one can be seen. The coarse lanes move but get no hand. Values go out through `moved` with the
   * handle set quietly, and the position is set before the hand starts (`set()` makes a hand yield).
   * See lessons/page-shape.md#shape-52
   */
  let allPresses = 0;
  function moveEverything() {
    allPresses++;
    const rows = sliders;
    const handed = rows.filter((s) => s.sld.hand);
    quietHands = handed.length > 1;
    for (const s of rows) {
      const { p, sld } = s;
      const x = p.lo + Math.floor(Math.random() * (p.hi - p.lo + 1));
      moved(s.v, p, x, true);
      /* A lane about to be taken over by a hand is given no glide: the hand
         starts from wherever the handle is on the next frame, so the travel
         would be thrown away half way through and read as a stutter. */
      sld.set(x, { quiet: true, glideMs: sld.hand ? 0 : 600 });
      sld.hand?.start(0, 'everything');
    }
    quietHands = false;
    flushNow();
    syncHand();
    d.log(`moved ${rows.length} parameters on ${voiceName} and left ${handed.length} of them `
        + `moving by themselves. ${rows.length - handed.length} lanes are too coarse to show a hand `
        + 'and were only moved. The same button puts all of it back.');
    handLines++;
  }

  showVoice(voice, voiceName);
  /* A late webfont changes every label width, and `document.fonts` is the event
     for it rather than a guess at how long loading takes. */
  document.fonts?.ready?.then(shareLabelColumn).catch(() => {});
  new ResizeObserver(shareLabelColumn).observe(d.el);

  // ── the instrument ────────────────────────────────────────────────────────

  /**
   * A visit opens nothing: `opensBeforePress` rises only if `open()` runs without a press.
   * See lessons/page-shape.md#shape-53
   */
  let access = null, presses = 0, opens = 0, opensBeforePress = 0;

  /** Every MIDI output this browser reported, in its order. */
  let ports = [];
  const portName = (o) => o.name || o.id || 'unnamed output';

  /**
   * The first output named like a Circuit, or null; never fall back to the first output, which may
   * be another instrument on the desk. Returns the output, not an index. Pure, graded with no device.
   * See lessons/page-shape.md#shape-54
   */
  const chosenOut = (list) => list.find((o) => /circuit/i.test(portName(o))) ?? null;

  let saidFacts = false, saidReached = false;

  /**
   * Take an output, open it, and say so. `port.open()` on an open port resolves at once.
   * See lessons/page-shape.md#shape-55
   */
  function use(next, from = 'press') {
    const was = port;
    port = next || null;
    if (port && port !== was) {
      port.open?.()?.catch?.((e) => d.log(`${portName(port)} would not open (${e.message})`, 'warn'));
    }
    reroute();
    if (port !== was || from === 'press') {
      d.log(port ? `sending to ${portName(port)}` : route === 'board' ? 'sending to the Circuit on the Raspberry Pi' : 'sending nowhere',
        port || route === 'board' ? 'hi' : '');
    }
    if (port && !saidFacts) {
      saidFacts = true;
      d.log('a handle here says where this page left a parameter and never what the patch holds, '
          + 'because a control change is write only and nothing here reads the instrument.');
      d.log('nothing on this page can send SysEx, a program change or a note, so the patches in '
          + 'flash cannot be touched from here.');
    }
  }

  /**
   * Every output, by name, including the ones that do not match: an empty list and three wrong
   * names are different facts.
   * See lessons/page-shape.md#shape-56
   */
  function listOutputs(from) {
    const was = ports.map(portName).join('|');
    ports = access ? [...access.outputs.values()] : [];
    const names = ports.map(portName);
    /* Plugging something in fires this repeatedly and most of the time nothing
       about the list has changed, so an unchanged list says nothing. */
    if (from === 'changed' && names.join('|') === was) return;
    d.log(names.length
      ? `${names.length} MIDI output${names.length === 1 ? '' : 's'}: ${names.join(', ')}`
      : 'this browser opened MIDI and found no outputs at all', names.length ? '' : 'warn');
    /* Keep the output already in use if it is still there; otherwise the name
       match, and where there is none, nothing. */
    const held = port && ports.includes(port) ? port : null;
    const guess = chosenOut(ports);
    use(held || guess, from);
    if (names.length && !port && from === 'press') {
      d.log('nothing in that list has Circuit in its name, so no output here was chosen. '
          + 'This page picks its output by name and has no control to override that, so it '
          + 'tries the Circuit on the Raspberry Pi next.');
    }
  }

  /**
   * @returns {'no web midi'|'refused'|'no outputs'|'no match'|'sending'} which
   * link in the chain is the one that is broken, as a word per DIFFERENT
   * failure.
   */
  async function open() {
    opens++;
    if (!presses) opensBeforePress++;
    if (!navigator.requestMIDIAccess) return 'no web midi';
    try {
      /**
       * `sysex: false`, the one wall the browser enforces. Outputs only: this page does not listen,
       * and an input would subscribe to the Circuit's clock.
       * See lessons/page-shape.md#shape-57
       */
      access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (e) {
      d.log(`MIDI was refused: ${e.message}`, 'warn');
      return 'refused';
    }
    /* Plugging an instrument in after the page loaded is the ordinary case, not
       an edge one. A page that only ever looks once is a page you have to
       reload, and reloading is how somebody concludes the page is broken. */
    /* Input names are read and no input is opened; they are how `Loop` learns the Evolution is here.
       See lessons/page-shape.md#shape-58 */
    access.onstatechange = () => { listOutputs('changed'); offerLoopFor(kb, inputNames(access), d.log); };
    listOutputs('press');
    offerLoopFor(kb, inputNames(access), d.log);
    return !ports.length ? 'no outputs' : port ? 'sending' : 'no match';
  }

  // ── the Circuit on the Raspberry Pi ───────────────────────────────────────

  /**
   * Where a control change goes: a local output, then a board that answered, then nowhere. Online
   * means bytes have somewhere to go; over the board it is createBoard's heartbeat.
   * See lessons/page-shape.md#shape-59
   */
  const routeFor = (localPort, boardAnswered) => (localPort ? 'local' : boardAnswered ? 'board' : null);
  function reroute() {
    const next = routeFor(port, boardOk);
    /* Leaving the board: end every note it holds while it is still the route. */
    if (route === 'board' && next !== 'board') { panic(); if (listening) setListening(false); }
    route = next;
    const onBoard = route === 'board';
    panel.keys.hidden = !onBoard;
    parts.buttons[2].disabled = onBoard;
    if (onBoard && voice.ch === 16) parts.set(0);
    if (route === 'local') pres.set('online', null);
    else if (onBoard) {
      const alive = board.presence.state() !== 'offline';
      pres.set(alive ? 'online' : 'offline', alive ? 'through the Raspberry Pi' : 'the Raspberry Pi stopped answering');
    } else {
      pres.set('offline', ports.length ? 'no output here is named Circuit'
        : access ? 'this browser found no MIDI outputs'
        : 'nothing has been opened yet');
    }
  }

  let boardUpDone = null;
  const sentIds = new Set();
  const saidRefusals = new Set();
  let boardRefused = 0, saidReachedBoard = false, notesSent = 0;
  function makeBoard() {
    const up = new Promise((r) => { boardUpDone = r; });
    setTimeout(() => boardUpDone(false), 8000);
    const b = createBoard({
      room: ROOM,
      relay: q.get('relay') || undefined,
      of: 'Raspberry Pi',
      showName: false,
      // /away/'s numbers, measured on this input: see that page.
      cushionMs: 80,
      maxCushionMs: 250,
      log: (line, kind) => d.log(line, kind),
      onOpen: () => boardUpDone(true),
      onMessage: (m) => {
        /* A refusal is said once per reason, counting only this page's own refusals.
           See lessons/page-shape.md#shape-60 */
        if (m.type !== 'midi.refused' || !sentIds.has(m.re)) return;
        boardRefused++;
        if (!saidRefusals.has(m.why)) { saidRefusals.add(m.why); d.log(`the Raspberry Pi refused a message: ${m.why}`, 'warn'); }
      },
    });
    b.up = up;
    return b;
  }

  /** every message that reached this door, sent or refused, for the loop check */
  let boardTries = 0;
  function toBoard(bytes) {
    boardTries++;
    const id = board?.send({ type: 'midi.send', bytes });
    if (!id) return false;
    sentIds.add(id);
    if (sentIds.size > 512) sentIds.delete(sentIds.values().next().value);
    if ((bytes[0] & 0xf0) === 0xb0) {
      boardSends++;
      if (!saidReachedBoard) { saidReachedBoard = true; d.log('the first control change has gone to the Circuit on the Raspberry Pi', 'hi'); }
    }
    return true;
  }

  /**
   * Notes, on the part the sliders address. A separate door from `emit`, which
   * stays control changes only, and it opens only on the board route, where the
   * board's gate is the last word on what reaches the instrument.
   * What each key sent is kept, so a key released after the part changed ends
   * the note it started, which is `/away/`'s rule.
   */
  const sounding = new Map();
  function noteOn(key) {
    if (route !== 'board') return;
    noteOff(key);
    const out = { ch: voice.ch === 2 ? 2 : 1, note: key };
    sounding.set(key, out);
    if (toBoard([0x90 | (out.ch - 1), out.note, 100])) notesSent++;
  }
  function noteOff(key) {
    const out = sounding.get(key);
    if (!out) return;
    sounding.delete(key);
    toBoard([0x80 | (out.ch - 1), out.note, 0]);
  }
  function panic() {
    for (const k of [...sounding.keys()]) noteOff(k);
    if (route === 'board') board?.send({ type: 'midi.panic' });
  }
  addEventListener('pagehide', () => panic());

  /**
   * Try the board. True when it answered and is now the route. Under `?selfcheck=1` createBoard
   * refuses every send, so the page says so instead of waiting out a timeout.
   * See lessons/page-shape.md#shape-61
   */
  async function tryBoard() {
    if (!board) board = makeBoard();
    if (!board.driving()) {
      d.log('a harness run does not reach for the Circuit on the Raspberry Pi', 'dim');
      return false;
    }
    if (!(await board.up)) {
      d.log('the relay did not open, so the Circuit on the Raspberry Pi cannot be reached either', 'warn');
      return false;
    }
    const r = await board.ask({ type: 'audio.status' }, 'audio.started', 6000);
    if (!r) {
      d.log(`no Raspberry Pi answered in ${ROOM} within six seconds, so there is no Circuit to reach there either`, 'warn');
      return false;
    }
    boardOk = true;
    reroute();
    d.log('sending to the Circuit on the Raspberry Pi. Synth 1 and Synth 2 reach it that way and the '
        + 'session does not, so Session is switched off. Play the keys, or the letters on this '
        + 'computer, to hear a slider move.', 'hi');
    /* The badge's own heartbeat, mirrored while the board is the route. */
    setInterval(() => { if (route === 'board') reroute(); }, 1000);
    await setListening(true);
    return true;
  }

  // ── Listen, over the board ────────────────────────────────────────────────
  // /away/'s arrangement: a lease renewed while listening, and mute stops
  // renewing rather than saying `input.stop`, because somebody else may be
  // listening to the same input.
  let listening = false, renew = null;
  async function want() {
    const r = await board.ask({ type: 'input.want' }, 'input.wanted', 6000);
    if (!r) { d.log('the Raspberry Pi did not answer the request to listen', 'warn'); return; }
    if (r.started) d.log('the Raspberry Pi started capturing the Circuit', 'hi');
  }
  async function setListening(on) {
    if (!board || on === listening) return;
    const ctx = await board.startAudio();
    const outNode = board.playout();
    listening = on;
    if (on) {
      if (outNode) { try { outNode.connect(ctx.destination); } catch { /* already connected */ } }
      pres.el.setAttribute('aria-pressed', 'true');
      pres.el.title = 'listening to the Circuit. Press to mute';
      await want();
      renew = setInterval(want, RENEW_MS);
    } else {
      clearInterval(renew); renew = null;
      if (outNode) { try { outNode.disconnect(ctx.destination); } catch { /* already off */ } }
      pres.el.setAttribute('aria-pressed', 'false');
      pres.el.title = 'press to listen to the Circuit';
      d.log('muted. The Raspberry Pi stops capturing a minute after the last listener');
    }
  }
  d.on('listen', () => setListening(!listening));

  /* `says: WIRED`: connected and connecting for a USB instrument, from the one map in presence.mjs.
     See lessons/page-shape.md#shape-62 */
  const pres = createPresenceButton({
    of: 'Circuit', state: 'unknown', says: WIRED,
    can: ['unknown', 'checking', 'online', 'offline'],
    /* Once the board is the route this same control is Listen, as on /away/. */
    press: () => { presses++; return d.run(route === 'board' ? 'listen' : 'look'); },
  });
  /**
   * The status control is in the page's own row, `prepend`ed so it reads first. With `.pos-controls`
   * empty the harness presses nothing, so the page presses the real control behind `SELFCHECK`
   * at the end of the module. The manifest's `settleMs` no longer lands on any control here.
   * See lessons/page-shape.md#shape-63
   */
  bar.prepend(pres.el);

  d.on('look', async () => {
    pres.set('checking');
    const link = await open();
    /* No Circuit here, whatever the reason: ask the board next.
       See lessons/page-shape.md#shape-64 */
    const viaBoard = link !== 'sending' && await tryBoard();
    if (viaBoard) { /* said in tryBoard */ }
    else if (link === 'no web midi') {
      pres.set('offline', 'this browser has no Web MIDI');
      d.log('this browser has no Web MIDI and no Raspberry Pi answered, so nothing here can reach an instrument. '
          + 'Chrome and Edge have Web MIDI and Safari has none at all.', 'warn');
    } else if (link === 'refused') {
      pres.set('offline', 'this browser refused MIDI');
    }
    /**
     * The instrument is the last link and the page cannot see it. On the Circuit, `MIDI CC Rx` can be
     * off in the Settings View, and since firmware 1.8 a track's MIDI channel can be moved.
     * See lessons/page-shape.md#shape-65
     */
    if (link === 'sending') {
      d.log('if a handle moves and the sound does not, the next thing to look at is the Circuit. '
          + 'Hold Shift while turning it on for the Settings View: the orange pads are MIDI CC '
          + 'receive and send, and both are on from the factory. The same view sets which MIDI '
          + 'channel each track listens on, and this page uses 1 for Synth 1, 2 for Synth 2 and '
          + '16 for the session.');
    }
    if (SELFCHECK) await d.run('drive');
  });

  // ── checks ────────────────────────────────────────────────────────────────

  const waitFor = (test, ms) => new Promise((done) => {
    const t0 = performance.now();
    const step = () => {
      if (test() || performance.now() - t0 > ms) { done(!!test()); return; }
      requestAnimationFrame(step);
    };
    step();
  });

  const find = (name) => sliders.find((s) => s.p.name === name);

  /**
   * The checks were proved by sabotage: each one goes red on the defect it names. Removing the
   * `ifSelfcheck` press at the foot leaves the page green with most checks silent; only the assert
   * count shows it. A transition assert reads both states, before and after.
   * See lessons/page-shape.md#shape-66
   */

  /**
   * The free half, run for everybody: graded from data the page already holds. Moving handles,
   * hands and bytes are behind the self-check gate.
   * See lessons/page-shape.md#shape-67
   */
  function grade() {
    d.assert('a visit opened nothing',
      opensBeforePress === 0, `${opens} opens after ${presses} presses`);

    d.assert('there is one slider for every parameter the reference documents for this part',
      sliders.length === onChannel(voice.group).length,
      `${sliders.length} of ${onChannel(voice.group).length} for ${voiceName}`);

    /* The one that matters: Replace Patch, which writes flash, is one byte inside a SysEx that nothing
       here can build.
       See lessons/page-shape.md#shape-68 */
    d.assert('SysEx, a program change and a note cannot be expressed at all',
      toBytes({ kind: 'sysex', ch: 1, cc: 74, value: 0 }) === null
      && toBytes({ kind: 'program', ch: 1, cc: 0, value: 3 }) === null
      && toBytes({ kind: 'note', ch: 1, cc: 60, value: 100 }) === null
      && toBytes({ kind: 'clock' }) === null,
      'all four came back null');

    // The negative control: without it a function that refuses everything passes.
    // See lessons/page-shape.md#shape-69
    d.assert('and a control change really is produced, which is the negative control',
      JSON.stringify(toBytes({ kind: 'cc', group: '16', ch: 16, cc: 74, value: 100 })) === '[191,74,100]',
      JSON.stringify(toBytes({ kind: 'cc', group: '16', ch: 16, cc: 74, value: 100 })));

    // The second wall: a controller this instrument has never been documented
    // to answer on this channel group is refused as well.
    d.assert('a controller the reference does not document is refused too',
      toBytes({ kind: 'cc', group: '1/2', ch: 1, cc: 126, value: 0 }) === null
      && toBytes({ kind: 'cc', group: '16', ch: 16, cc: 1, value: 0 }) === null,
      'CC 126 on a synth and CC 1 on the session');

    /**
     * No hand button in `.pos-controls`: the harness row is empty on this page, so nothing the suite
     * presses can reach the Circuit.
     * See lessons/page-shape.md#shape-70
     */
    d.assert('no control in the harness row can send, and no hand lives in it',
      document.querySelectorAll('.pos-controls .sld-hand').length === 0
      && document.querySelectorAll('.pos-controls button').length === 0,
      `${document.querySelectorAll('.pos-controls button').length} buttons in the row`);

    /**
     * The controls that can reach the instrument are named, not counted, so a control moving into the
     * harness row is a red line rather than a number that still adds up.
     * See lessons/page-shape.md#shape-71
     */
    /**
     * Reads the harness's own selector, `.pos-controls button, .tbar-x`, rather than this page's
     * memory of it.
     * See lessons/page-shape.md#shape-72
     */
    const PRESSED = '.pos-controls button, .tbar-x';
    const pressed = [...document.querySelectorAll(PRESSED)];
    const mine = [pres.el, hand];
    d.assert('the status button and the hand both sit in the page row and neither is one the harness presses',
      mine.every((e) => bar.contains(e) && !pressed.includes(e)),
      `${mine.filter((e) => bar.contains(e)).length} of 2 in .shape-bar, `
      + `${pressed.length} elements match ${PRESSED}`);

    /**
     * One line, in the order sketched (status, chooser, glyph): left edges ascending and every top on
     * one line, read off rects, true at the harness's 756 px (34, 451 and 688).
     * See lessons/page-shape.md#shape-73
     */
    const row = [pres.el, parts.el, hand].map((e) => e.getBoundingClientRect());
    d.assert('the three controls sit on one line, in the order the sketch put them',
      row.every((r) => Math.abs(r.top - row[0].top) <= 1.5)
      && row.every((r, i) => i === 0 || r.left > row[i - 1].left),
      `${new Set(row.map((r) => Math.round(r.top))).size} line at ${Math.round(innerWidth)} px, `
      + `left edges ${row.map((r) => Math.round(r.left)).join(', ')}`);

    /**
     * The glyph's top sits on the options' top (no caption to centre against), with the gap read
     * from the rendered `--shape-bar-gap`, not typed. Checked at 756 px only.
     * See lessons/page-shape.md#shape-74
     */
    const lastOpt = parts.buttons[parts.buttons.length - 1].getBoundingClientRect();
    const glyph = hand.getBoundingClientRect();
    const apart = glyph.left - lastOpt.right;
    const rowGap = parseFloat(getComputedStyle(barEnd).columnGap);
    d.assert('the hand stands beside the chooser on the same axis as the options, spending the row gap',
      Math.abs(apart - rowGap) <= 0.5 && Math.abs(glyph.top - lastOpt.top) <= 0.5,
      `${apart.toFixed(2)} px between them against a ${rowGap.toFixed(2)} px gap, `
      + `tops ${glyph.top.toFixed(2)} and ${lastOpt.top.toFixed(2)}`);

    /**
     * The glyph is not one of the options: not in `parts.buttons`, not inside `parts.el`, no
     * `aria-pressed`, and `Session` rounds its own right corners. Radii compared to the first option's.
     * See lessons/page-shape.md#shape-75
     */
    const firstOpt = getComputedStyle(parts.buttons[0]);
    const lastCs = getComputedStyle(parts.buttons[parts.buttons.length - 1]);
    const handCs = getComputedStyle(hand);
    const outer = firstOpt.borderTopLeftRadius;
    d.assert('the hand is its own object rather than one of the chooser options',
      !parts.buttons.includes(hand) && !parts.el.contains(hand)
      && !hand.hasAttribute('aria-pressed')
      && handCs.borderTopLeftRadius === outer && handCs.borderTopRightRadius === outer
      && handCs.borderBottomLeftRadius === outer && handCs.borderBottomRightRadius === outer
      && lastCs.borderTopRightRadius === outer && lastCs.borderBottomRightRadius === outer,
      `${parts.buttons.length} options and the hand is not one of them, `
      + `aria-pressed ${hand.hasAttribute('aria-pressed')}, `
      + `hand corners ${handCs.borderTopLeftRadius}/${handCs.borderTopRightRadius} `
      + `and the last option's right ${lastCs.borderTopRightRadius} against an outer ${outer}`);

    /**
     * The square is read off the rendered box, not the attribute: a glyph outside `.pos-controls` with
     * no matching rule renders 45.83 by 34.00.
     * See lessons/page-shape.md#shape-76
     */
    const g = hand.getBoundingClientRect();
    d.assert('the hand button is a square and says its name in words rather than in a symbol',
      Math.abs(g.width - g.height) <= 0.5 && Math.round(g.width) === 34
      && (hand.getAttribute('aria-label') || '').trim().length > 1,
      `${g.width.toFixed(2)} by ${g.height.toFixed(2)}, announced as "${hand.getAttribute('aria-label')}"`);

    /**
     * The panel is glued sections with the plate at the foot, read off the DOM's `data-kind`. The count
     * is `shownSections`, so it moves with the reference; order is asserted further down.
     * See lessons/page-shape.md#shape-77
     */
    const kinds = panel.shape();
    /* The keys row is in the DOM and hidden (it is the board route's); the next assert reads computed
       display.
       See lessons/page-shape.md#shape-78 */
    d.assert('the panel is one glued section per heading, with the nameplate at the foot',
      kinds.at(-1) === 'plate'
      && kinds.filter((k) => k === 'controls').length === shownSections(voice.group).length
      && kinds.filter((k) => k === 'keys').length === 1
      && kinds.every((k) => k === 'controls' || k === 'plate' || k === 'keys'),
      `${kinds.filter((k) => k === 'controls').length} sections and a ${kinds.at(-1)}, `
      + `for ${shownSections(voice.group).length} headings`);

    /**
     * The name sits at the start of the foot one inset in. The ink (`plate.lines[0]`) is measured, not
     * the plate; the inset is the row's computed padding; the text is read through `shown()`.
     * See lessons/page-shape.md#shape-79
     */
    const foot = panel.plateRow.getBoundingClientRect();
    const footPad = parseFloat(getComputedStyle(panel.plateRow).paddingLeft);
    const ink = panel.plate.lines[0].getBoundingClientRect();
    d.assert('the nameplate is at the start of the foot, one inset in, and it reads SHAPE in upper case',
      panel.plate.shown().join(' ') === 'SHAPE'
      && Math.abs((ink.left - foot.left) - footPad) <= 1,
      `ink left ${ink.left.toFixed(1)} against row left ${foot.left.toFixed(1)}, `
      + `${(ink.left - foot.left).toFixed(1)} px of a ${footPad.toFixed(1)} px inset, reading `
      + `${panel.plate.shown().join(' ')}`);

    /**
     * An empty table draws no heading and still holds its room. Computed `display`, never
     * `head.hidden`: `.pos-tbl-row` sets `display: grid`, which beats `[hidden]`.
     * See lessons/page-shape.md#shape-80
     */
    /* Six rows measured through a throwaway ruler, since `--tbl-row-h` is a `calc()` token. A `<span>`,
       because shell.css hides `.pos-stack > div:empty` and body is a `.pos-stack`. Absolute and hidden.
       See lessons/page-shape.md#shape-81 */
    const ruler = document.body.appendChild(el('span', '', '', {
      style: 'position: absolute; visibility: hidden; display: block; height: var(--tbl-row-h)',
    }));
    const rowH = ruler.getBoundingClientRect().height;
    ruler.remove();
    const head = traffic.el.querySelector('.pos-tbl-head');
    const box = traffic.el.getBoundingClientRect();
    d.assert('the empty log carries no caption and no heading, and still holds six rows of room',
      traffic.count() === 0
      && !traffic.el.querySelector('.pos-tbl-empty')
      && (!head || getComputedStyle(head).display === 'none')
      && rowH > 0 && box.height >= 6 * rowH - 1,
      `${box.height.toFixed(2)} px of box for six rows of ${rowH.toFixed(2)}, `
      + `${traffic.el.querySelector('.pos-tbl-empty') ? 'a caption' : 'no caption'}`);

    /**
     * A name is a guess: two lists read back with no device. A match anywhere wins, the first of several.
     * See lessons/page-shape.md#shape-82
     */
    d.assert('the output is chosen by name, and the first match wins where there are several',
      chosenOut([{ name: 'IAC Driver Bus 1' }, { name: 'Circuit' }, { name: 'Model 12' }])?.name === 'Circuit'
      && chosenOut([{ name: 'Circuit MIDI 1' }, { name: 'Circuit MIDI 2' }])?.name === 'Circuit MIDI 1',
      'two lists answered');

    /**
     * The negative half: no match means no output, so a stray CC 74 never reaches another instrument.
     * See lessons/page-shape.md#shape-83
     */
    d.assert('and where no name matches, nothing is chosen rather than the first output',
      chosenOut([{ name: 'IAC Driver Bus 1' }, { name: 'Model 12' }, { name: 'MK-425C USB MIDI Keyboard' }]) === null
      && chosenOut([{ name: 'Model 12' }]) === null
      && chosenOut([]) === null,
      'three lists chose nothing');

    /**
     * Which Circuit wins: the one on this USB port. Pure; the second case is the negative control.
     * See lessons/page-shape.md#shape-84
     */
    d.assert('a Circuit on this desk wins over the one on the Raspberry Pi, and the Pi is used only when there is none',
      routeFor({ name: 'Circuit' }, true) === 'local'
      && routeFor(null, true) === 'board'
      && routeFor(null, false) === null && routeFor({ name: 'Circuit' }, false) === 'local',
      'four cases answered');

    d.assert('a visit reaches for no board and draws no keys',
      board === null && route === null && getComputedStyle(panel.keys).display === 'none',
      `board ${board ? 'built' : 'not built'}, keys row ${getComputedStyle(panel.keys).display}`);

    d.assert('a visit chooses no output and opens no port',
      port === null && ports.length === 0,
      `${ports.length} outputs known, sending to ${port ? portName(port) : 'nothing'}`);

    /**
     * One hand is a frame and forty are a ceiling. The first two cases are the negative control: one
     * hand must not be paced.
     * See lessons/page-shape.md#shape-85
     */
    d.assert('one hand is paced not at all, and forty are held under the ceiling',
      handGap(0) === 0 && handGap(1) === 0
      && handGap(40) === 67 && 40 * (1000 / handGap(40)) <= HAND_CEILING,
      `${handGap(40)} ms apart for forty lanes, ${Math.round(40 * (1000 / handGap(40)))} a second`);

    /**
     * A hand where one can be seen and nowhere else, both halves.
     * See lessons/page-shape.md#shape-86
     */
    const withHand = sliders.filter((s) => s.sld.hand);
    d.assert('every slider with a hand has the steps to show one, and every slider without is too coarse',
      withHand.every((s) => !s.sld.hand.coarse)
      && sliders.filter((s) => !s.sld.hand).every((s) => (s.p.hi - s.p.lo) < HAND_STEPS)
      && withHand.length > 0 && withHand.length < sliders.length,
      `${withHand.length} of ${sliders.length} carry one, at ${HAND_STEPS} steps or more`);

    /**
     * The grouping is asserted: headings in the reference's order, a regrouped label loses exactly its
     * heading's word, and an ungrouped one keeps both (the negative control).
     * See lessons/page-shape.md#shape-87
     */
    d.assert('the rack is grouped the way the reference and Novation both group it, and only the shared word is dropped',
      shownSections('1/2').join(' ') === 'VOICE OSC 1 OSC 2 MIXER FILTER ENVELOPE 1 DISTORTION CHORUS MACRO KNOBS'
      && shown(param('1/2', 22)).sec === 'OSC 1' && shown(param('1/2', 22)).label === 'virtual sync depth'
      && shown(param('1/2', 33)).sec === 'OSC 2' && shown(param('1/2', 33)).label === 'virtual sync depth'
      && shown(param('1/2', 70)).sec === 'ENVELOPE 1' && shown(param('1/2', 70)).label === 'sustain'
      && shown(param('1/2', 3)).sec === 'VOICE' && shown(param('1/2', 3)).label === 'Polyphony Mode'
      && shown(param('16', 74)).sec === 'MASTER FILTER' && shown(param('16', 74)).label === 'frequency',
      `${shownSections('1/2').length} headings on a synth, ${shownSections('16').length} on the session`);

    /**
     * One left edge per column across all sections, off real rects after re-running the share. At the
     * harness's 756 px (above the kit's 720 px breakpoint) that is two edges; the phone case is not reached.
     * See lessons/page-shape.md#shape-88
     */
    shareLabelColumn();
    /* Only rows on screen: a hidden part's lanes read 0 and would add an edge at x 0.
       See lessons/page-shape.md#shape-89 */
    const lanes = [...panel.el.querySelectorAll('.pos-rows-r:not([hidden]) .sld-lane')]
      .map((e) => e.getBoundingClientRect().left);
    const edges = [];
    for (const x of lanes) if (!edges.some((e) => Math.abs(e - x) <= 1.5)) edges.push(x);
    const paired = matchMedia('(min-width: 720px)').matches;
    d.assert('every lane in the rack starts at one left edge a column, across all nine sections',
      lanes.length === sliders.length && edges.length === (paired ? 2 : 1),
      `${lanes.length} lanes on ${edges.length} edge${edges.length === 1 ? '' : 's'} at ${Math.round(innerWidth)} px`);

    d.assert('the page does not drag sideways at this width',
      document.documentElement.scrollWidth <= window.innerWidth + 1,
      `page ${document.documentElement.scrollWidth} against ${window.innerWidth}`);

    d.assert('no secret in this page', !location.href.includes('token'));
  }

  /**
   * The half that costs something, behind the gate: it moves handles, runs a hand and makes bytes.
   * `sink` takes every message, so nothing reaches an instrument; the counter is asserted at the end.
   * See lessons/page-shape.md#shape-90
   */
  d.on('drive', async () => {
    sink = [];

    // The invisible hand, first because it is slow: a 7000 ms sweep with a Beta(3,4) speed profile,
    // so the first step of a 127 step lane lands about half a second in.
    // See lessons/page-shape.md#shape-91
    const filt = find('frequency');
    const startedAt = filt.sld.get();
    sink.length = 0;
    filt.sld.hand.start(0, 'check');
    /* Three steps, not one, so it is travelling: about 800 ms on a 127 step lane, 2500 ms deadline.
       See lessons/page-shape.md#shape-92 */
    const STEPS = 3;
    const moving = () => Math.abs(filt.sld.get() - startedAt) >= STEPS;
    const movedByItself = await waitFor(moving, 2500);
    d.assert('an invisible hand moves a handle with nobody touching it',
      movedByItself && filt.sld.hand.running,
      `${startedAt} to ${filt.sld.get()}, hand ${filt.sld.hand.running ? 'running' : 'stopped'}`);

    flushNow();
    const handMsgs = sink.filter((m) => m.cc === filt.p.cc);
    /* Every position the hand passed went out on this part's channel and controller, as distinct values.
       See lessons/page-shape.md#shape-93 */
    const handValues = new Set(handMsgs.map((m) => m.value));
    d.assert('and every position it passes through goes out, on the channel and controller this part uses',
      handMsgs.length >= 2 && handValues.size === handMsgs.length
      && handMsgs.every((m) => m.bytes[0] === 0xb0 && m.bytes[1] === 74),
      `${handMsgs.length} control changes at ${[...handValues].join(', ')}`);

    sink.length = 0;
    filt.sld.hand.stop('check');
    flushNow();
    /* The last value of a gesture lands, or a filter sits at its second to last position.
       See lessons/page-shape.md#shape-94 */
    d.assert('and when it stops, the position it stopped at is sent',
      sink.length === 1 && sink[0].value === Math.round(filt.sld.get()),
      `${sink.length} message for a handle at ${filt.sld.get()}`);
    d.assert('the hand said so in the log rather than moving silently',
      handStarts === 1, `${handStarts} starts`);

    // ── one move, one message, one channel ───────────────────────────────────

    sink.length = 0;
    filt.sld.set(37);
    flushNow();
    d.assert('a slider move leaves as exactly one control change, with the right channel and controller',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xb0, 74, 37]),
      `${sink.length} message${sink.length === 1 ? '' : 's'}, ${sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ')}`);

    /* The same controller on the wrong channel: CC 74 is the synth filter on 1, the master filter on 16.
       See lessons/page-shape.md#shape-95 */
    d.assert('and the same controller on the session channel was not produced',
      !sink.some((m) => m.bytes[0] === 0xbf),
      `${sink.filter((m) => m.bytes[0] === 0xbf).length} on channel 16`);

    // ── the coalescer ────────────────────────────────────────────────────────

    sink.length = 0;
    const mergedBefore = mergedTotal();
    for (let i = 0; i < 40; i++) moved(voice, filt.p, 20 + i, false);
    flushNow();
    d.assert('forty moves inside one frame leave as one control change, carrying the last of them',
      sink.length === 1 && sink[0].value === 59,
      `${sink.length} message${sink.length === 1 ? '' : 's'} at ${sink[0]?.value}`);
    d.assert('and the thirty nine that never left are counted rather than lost quietly',
      mergedTotal() - mergedBefore === 39, `${mergedTotal() - mergedBefore} merged`);

    // The parts, driven here because the chooser is outside `.pos-controls` and the harness cannot reach it.
    // See lessons/page-shape.md#shape-96
    parts.set(2);                                  // Session, channel 16
    d.assert('choosing the session gives the eighteen parameters it has',
      sliders.length === 18 && voice.ch === 16, `${sliders.length} on channel ${voice.ch}`);

    /**
     * The sections on screen are the new part's, by computed `display`, never `row.hidden`. The third
     * clause is the negative control: the old part's rows are still there, hidden, so it is a swap.
     * See lessons/page-shape.md#shape-97
     */
    const allSec = [...panel.el.querySelectorAll('.pos-rows-r[data-kind="controls"]')];
    const drawn = allSec.filter((r) => getComputedStyle(r).display !== 'none');
    d.assert('and it draws that part and no other, with the sections it came from kept rather than rebuilt',
      drawn.length === shownSections(voice.group).length
      && allSec.length === shownSections('1/2').length + shownSections('16').length
      && allSec.length > drawn.length,
      `${drawn.length} of ${allSec.length} sections drawn for ${voiceName}`);

    sink.length = 0;
    find('frequency').sld.set(90);
    flushNow();
    d.assert('the master filter is the same controller number and goes out on channel 16',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xbf, 74, 90]),
      sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ') || 'nothing');

    parts.set(1);                                  // Synth 2, channel 2
    sink.length = 0;
    find('frequency').sld.set(51);
    flushNow();
    d.assert('Synth 2 is the same parameter on channel 2',
      sink.length === 1 && JSON.stringify(sink[0].bytes) === JSON.stringify([0xb1, 74, 51]),
      sink[0]?.bytes.map((b) => b.toString(16).toUpperCase()).join(' ') || 'nothing');

    parts.set(0);

    // Read while three parts are moved, the state the second press below has to undo.
    // See lessons/page-shape.md#shape-98

    d.assert('the page knows how far it has moved the instrument',
      changed() > 0, `${changed()} parameters away from where this page opened`);

    // Driven by `element.click()` on the real button, which the harness never presses. The second
    // press must have changed what the control offers, then put everything back.
    // See lessons/page-shape.md#shape-99

    const wide = sliders.filter((s) => s.sld.hand);
    const coarse = sliders.filter((s) => !s.sld.hand);
    const startsBefore = handStarts, linesBefore = handLines;
    sink.length = 0;
    hand.click();
    flushNow();

    d.assert('one press leaves every lane with room for a hand moving by itself, and the coarse ones alone',
      wide.every((s) => s.sld.hand.running) && coarse.every((s) => !s.sld.hand)
      && handStarts - startsBefore === wide.length
      && wide.length > 0 && coarse.length > 0,
      `${wide.filter((s) => s.sld.hand.running).length} of ${wide.length} moving, `
      + `${coarse.length} too coarse for one`);

    /* Forty hands, one line.
       See lessons/page-shape.md#shape-100 */
    d.assert('and it says so once rather than once per slider',
      handLines - linesBefore === 1, `${handLines - linesBefore} lines for ${wide.length} hands`);

    /* The coarse lanes really move; only their animation is skipped.
       See lessons/page-shape.md#shape-101 */
    const ccs = new Set(sink.map((m) => m.cc));
    d.assert('every parameter on the part went out, the twelve coarse ones included, one message each',
      sink.length === sliders.length && ccs.size === sink.length
      && coarse.every((s) => ccs.has(s.p.cc)),
      `${sink.length} control changes for ${sliders.length} parameters, ${ccs.size} distinct`);

    /**
     * The control now offers the way out, read off the accessible name and the tooltip. The glyph is
     * read off the `.pos-sym` span, where `setSymbol` writes.
     * See lessons/page-shape.md#shape-102
     */
    const glyphNow = () => (hand.querySelector('.pos-sym')?.textContent || '').trim();
    const saidAfterOne = hand.getAttribute('aria-label');
    d.assert('after one press the same control offers to put it back rather than to move it again',
      saidAfterOne === 'put everything back'
      && glyphNow() === '↺' && hand.title.includes('stop every slider'),
      `announced as "${saidAfterOne}", drawn as "${glyphNow()}"`);

    /**
     * The pacing is consulted on the real path: two offers per lane in one frame with forty hands, the
     * second inside the 67 ms gap, so forty are held back. The first round is the setup.
     * See lessons/page-shape.md#shape-103
     */
    const pacedBefore = paced;
    sink.length = 0;
    for (const s of wide) moved(s.v, s.p, s.p.lo + 3, false);
    const pacedAfterFirst = paced;
    for (const s of wide) moved(s.v, s.p, s.p.lo + 4, false);
    flushNow();
    d.assert('with forty hands running, a second position inside the gap is held back rather than sent',
      pacedAfterFirst === pacedBefore && paced - pacedBefore === wide.length
      && sink.length === wide.length,
      `${paced - pacedBefore} held back, ${sink.length} sent for ${wide.length} lanes`);

    /* The second press is the way out, graded on both halves of what it does.
       See lessons/page-shape.md#shape-104 */
    sink.length = 0;
    hand.click();
    flushNow();

    d.assert('a second press stops every hand the first one started, on every part',
      everyRow().every((s) => !s.sld.hand?.running),
      `${everyRow().filter((s) => s.sld.hand?.running).length} still moving`);

    /* And every parameter goes home, on every part, Synth 2 and the session included. A stopping hand's
       last value and the home value share one gate in one frame, home second, so home is what drains.
       See lessons/page-shape.md#shape-105 */
    d.assert('and it puts every parameter this page moved back, on all three parts',
      changed() === 0 && sink.length > 0
      && sink.every((m) => m.value === homeOf(param(m.group, m.cc))),
      `${sink.length} control changes, ${changed()} left moved`);

    /* It reads the state after the first press too: a control stuck on `move everything` would pass
       the end state alone.
       See lessons/page-shape.md#shape-106 */
    d.assert('and it goes back to offering a move once nothing is moving',
      saidAfterOne === 'put everything back'
      && hand.getAttribute('aria-label') === 'move everything' && glyphNow() === '⇄',
      `"${saidAfterOne}" while moving, "${hand.getAttribute('aria-label')}" after, drawn as "${glyphNow()}"`);

    // ── the audit ────────────────────────────────────────────────────────────

    /* Over everything this page has ever produced, not over the last batch: the
       counter is raised inside `emit`, which is the one door out. */
    d.assert('every byte this page has put out is a control change',
      out > 0 && notCc === 0 && refused === 0,
      `${out} out, ${notCc} that were not a control change, ${refused} refused`);

    /* None of it reached an instrument: the counter says so.
       See lessons/page-shape.md#shape-107 */
    d.assert('and no message reached a real instrument while the checks ran',
      portSends === 0 && boardSends === 0 && notesSent === 0,
      `${portSends} sends to a port, ${boardSends} control changes and ${notesSent} notes to the Raspberry Pi`);

    /* The press reached for the board and the board refused the harness; `board` is read too, so a
       fallback never reached would show.
       See lessons/page-shape.md#shape-108 */
    d.assert('a harness press tries the Raspberry Pi and is refused before anything is sent',
      board !== null && board.driving() === false && route !== 'board' && sentIds.size === 0,
      `board ${board ? 'built' : 'never built'}, driving ${board?.driving()}, route ${route}`);

    d.assert('the log lists what left rather than staying empty',
      traffic.count() > 0, `${traffic.count()} rows`);

    sink = null;

    /* `Loop` follows the Evolution, and a loop reaches the board's door. The
       keys only play on the board route, which a harness never takes, so the
       route is set for the length of this check and put back: every note it
       counts was refused by `createBoard` and nothing was heard. */
    const wasRoute = route;
    route = 'board';
    try {
      await checkEvolutionLoop(d, {
        keys: kb, heard: () => boardTries,
        ports: (names) => offerLoopFor(kb, names, d.log), real: () => inputNames(access),
      });
    } finally { route = wasRoute; }
  });

  grade();

  /**
   * The press the harness no longer makes, behind the gate: without it `look` and `drive` never run
   * and the suite stays green. After `grade()`, which reads an unpressed page, and before
   * `d.ready()`, because verify.mjs waits 7.4 s for ready before grading.
   * See lessons/page-shape.md#shape-109
   */
  ifSelfcheck(() => pres.el.click(), {
    log: d.log,
    say: 'the checks behind the status button move handles and produce bytes, so they run '
      + 'under a harness and never for somebody who just opened this page',
  });

  d.ready();
</script>
</html>

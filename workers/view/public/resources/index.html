<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="resources">
<meta property="og:description" content="Every reachable source for Erkki Kurenniemi&apos;s work, one row each">
<meta property="og:url" content="https://positron.studio/resources/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* See lessons/page-resources.md#resources-210 */
  /* Taller than the component's default: this is a list of 333 records and the
     page has nothing else on it, so the box is the page. `--tbl-h` is the
     component's own knob rather than an override of its rule. */
  /* As tall as the screen less what is above it (back link, name, prose), with a 420 px
     floor; `dvh` because `vh` measures the taller phone state and hides the last rows.
     See lessons/page-resources.md#resources-211 */
  .pos-tbl { --tbl-h: max(420px, calc(100dvh - 250px)); }
  /* Wider than the prose: six columns need 510 px of fixed track before the name gets any,
     so the table breaks out to 1100 px while the 720 px prose does not.
     See lessons/page-resources.md#resources-212 */
  .pos-tbl { width: min(1100px, calc(100vw - 32px)); margin-left: 50%; transform: translateX(-50%); }
</style>

<script type="module">
  import { mount, guard } from '/shell/shell.mjs';
  // The kit's declared-column table.
  // See lessons/page-resources.md#resources-213
  import { createTable } from '/shell/table.mjs';
  // One assert here opens a second file. Every other one reads the list this
  // page is already showing, so those keep running for everybody.
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  // Built by `demo/resources/build-corpus.mjs`, which asks seventeen archives
  // and writes down what each one answered. The deck's own shorter list is
  // folded into it, and the check below re-proves that from this end.
  const CORPUS = '/resources/corpus.json';
  const DECK = '/proto/deck/corpus.json';

  // See lessons/page-resources.md#resources-214

  const d = mount({
    name: 'resources',
    what: 'Every reachable source for Erkki Kurenniemi\'s work, one row each: when it is from, who '
        + 'holds it, what it is, and the licence they state. Point at a date to see where it comes '
        + 'from and how wide the bracket is, or at the rest of the row for what the record is and '
        + 'why its date is not narrower. Nothing is copied, one row can stand for a whole set, and '
        + 'places that refused are listed with what they answered.',
    // No readout and no controls: the log line under the list gives the row and place counts
    // once, when the corpus loads.
    // See lessons/page-resources.md#resources-215
    readout: null,
  });
  guard(d);

  // The cap is well over the corpus size; the check below counts rows against items anyway.
  // See lessons/page-resources.md#resources-216
  /**
   * The columns are declared to shell/table.mjs, each its own track with its own colour,
   * alignment or link.
   * See lessons/page-resources.md#resources-217
   */
  const table = createTable({
    // build-corpus.mjs refuses to write more rows than this cap, and an assert counts them too.
    // See lessons/page-resources.md#resources-218
    cap: 600,
    // Sentences a record carries that no column can hold (see `note` in table.mjs), including
    // `when.note`, why a date is not narrower.
    // See lessons/page-resources.md#resources-219
    note: 'about',
    empty: 'nothing in this view',
    columns: [
      { key: 'kind', label: 'kind', width: 46 },
      // A size can only exist if there is something to measure, which is why
      // this replaced a column that said the word `file` beside the kind.
      { key: 'size', label: 'size', width: 58, align: 'right' },
      // A date is a claim: the two hover lines say who says so and how wide the bracket is.
      // See lessons/page-resources.md#resources-220
      { key: 'date', label: 'when', width: 84, hover: 'dateWhy' },
      { key: 'source', label: 'who holds it', width: 122 },
      // The name, linked to the record, cut to one line with the whole of it on
      // `title`. `hi` because it is the thing on the row you are looking for.
      { key: 'title', label: 'what', grow: true, link: 'url', clip: true, hi: true },
      // Clipped like the name, so rows stay one line; the full string is on `title`.
      // `licence` is the short form, `licenceFull` what the holder said, on hover.
      // See lessons/page-resources.md#resources-221
      { key: 'licence', label: 'licence', width: 76, align: 'right',
        clip: true, hover: 'licenceFull' },
    ],
  });
  d.el.append(table.el);
  table.clear('reading the list…');

  // What goes in each column. The source gets its own column, unabbreviated.
  // See lessons/page-resources.md#resources-222

  // The one kind too long for the first gutter, and the object it names — a
  // DIMI-A in a Stockholm museum — is a synthesiser. The rest are already
  // short words or are cut to one that means the same thing at this width.
  const SHORT = { instrument: 'synth', collection: 'set', recording: 'track',
                  release: 'album', article: 'story' };
  const kindOf = (it) => SHORT[it.kind] || it.kind;
  // Nothing unmeasured prints as a number. A row whose source recorded no date
  // at all — a MusicBrainz track, an archive.org upload, a host that refused —
  // gets one em dash, never a padded guess at a year.
  const dateOf = (it) => it.when.edtf || '—';
  const fileOf = (it) => !!it.file;

  /**
   * Where a date comes from, in words: `when.how` slugs mapped to English or a citation,
   * falling back to the slug with spaces. Shown on hover, not as a column (39 values).
   * See lessons/page-resources.md#resources-223
   */
  const SAYS = {
    'national-gallery-yearFrom-yearTo': "the catalogue's own year fields",
    'the-two-fonds-own-yearFrom-yearTo-taken-together': "both archives' year fields together",
    'zenodo-publication-date': 'the day it was deposited at Zenodo',
    'discogs-year-integer': 'a year, and nothing finer, from Discogs',
    'openalex-publication-date': 'the publication date OpenAlex holds',
    'crossref-issued-date-of-the-book': 'the day Crossref says the book came out',
    'wikidata-declared-precision': 'Wikidata, which declares how precise it is',
    'commons-quickstatements-precision': 'Wikimedia Commons, which declares how precise it is',
    'wikidata-P577-P571-or-P580': 'a date field on the Wikidata record',
    'wikidata-title-match': 'a Wikidata work with the same title',
    'wikidata-has-no-date': 'nothing: Wikidata states no date',
    'edm-literal-length': 'a Europeana date, as wide as the text it is written in',
    'filename-year': 'a year in the uploaded filename',
    'derived-from-corpus-range': 'the span of the compilation it came off',
    'archive-org-has-no-work-date': 'nothing: archive.org dates the upload, not the work',
    'musicbrainz-has-no-recording-date': 'nothing: MusicBrainz dates releases, not recordings',
    'musicbrainz-works-carry-no-date': 'nothing: MusicBrainz dates releases, not works',
    'musicbrainz-release-date': 'the release date MusicBrainz holds',
    'not-reached': 'nothing: the source was not reached',
    'the-pdf-is-not-opened-here': 'nothing: the document is pointed at, never opened',
  };
  // `ojanen-2020-thesis-p205-n402` -> `Ojanen 2020, printed p. 205 n. 402`. The
  // page number is the PRINTED one, which is the one a reader holding the book
  // would turn to.
  const cite = (tail) => {
    const parts = tail.split('-');
    const pp = parts.filter((t) => /^p\d+$/.test(t)).map((t) => t.slice(1));
    const nn = parts.filter((t) => /^n\d+$/.test(t)).map((t) => t.slice(1));
    return `Ojanen 2020, printed ${pp.length > 1 ? `pp. ${pp.join(' and ')}` : `p. ${pp[0]}`}`
      + (nn.length ? ` n. ${nn.join(' and ')}` : '');
  };
  const saysOf = (how) => {
    if (!how) return '';
    const m = /^ojanen-2020-thesis-(.+)$/.exec(how);
    return m ? cite(m[1]) : SAYS[how] || how.replace(/-/g, ' ');
  };
  // How wide the bracket is, which is the other thing the cell cannot show: a
  // reader can see `1967` and not that it means the whole of that year.
  const WIDE = { day: 'a day', month: 'a month', year: 'a year', decade: 'a decade' };
  const spanOf = (it) => {
    const w = it.when;
    if (w.earliest == null) return '';
    if (WIDE[w.precision]) return `the bracket is ${WIDE[w.precision]}`;
    if (w.precision === 'after') return 'the bracket has no far edge';
    const days = (w.latest - w.earliest) / 86400e3;
    const n = days < 60 ? `${Math.round(days)} days`
      : days < 700 ? `${Math.round(days / 30.44)} months`
      : `${Math.round(days / 365.2425)} years`;
    return `the bracket is ${n} wide`;
  };
  // Two lines, and it is a hard ceiling: this is drawn ON TOP of the rows under
  // it and read every time somebody points at a date.
  const whyOf = (it) => [saysOf(it.when.how), spanOf(it)].filter(Boolean).join('\n');
  // The row, which is the surface that may hold a paragraph: what the record is,
  // then why its date is not narrower.
  const aboutOf = (it) => [it.note, it.when.note].filter(Boolean).join('\n\n');
  /**
   * The size column, formatted by the page. Not raw bytes (up to 990,701,568); a row standing
   * for several things says `3986×` instead.
   * See lessons/page-resources.md#resources-224
   */
  const sizeOf = (it) => {
    if (it.count > 1) return `${it.count}\u00d7`;
    const b = it.bytes;
    if (!b) return '';
    if (b >= 1e9) return `${(b / 1e9).toFixed(1)} GB`;
    if (b >= 1e6) return `${Math.round(b / 1e6)} MB`;
    if (b >= 1e3) return `${Math.round(b / 1e3)} kB`;
    return `${b} B`;
  };
  // Public domain or a Creative Commons licence of any flavour. Everything
  // else — all rights reserved, licensed per screening, not stated, unknown —
  // is not something this page will tell you that you may reuse.
  /**
   * The licence, short enough to scan down a column; `licenceFull` is on hover and corpus.json
   * keeps `licenceRef` verbatim. `not stated` and `unknown` print blank; CC0 stays CC0.
   * See lessons/page-resources.md#resources-225
   */
  const SHORT_LIC = [
    [/^cc0/i, 'CC0'],
    [/public domain/i, 'PD'],
    [/^cc[- ]by[- ]nc[- ]nd/i, 'BY-NC-ND'],
    [/^cc[- ]by[- ]nc[- ]sa/i, 'BY-NC-SA'],
    [/^cc[- ]by/i, 'CC BY'],
    [/^other-oa/i, 'open'],
    [/all rights reserved/i, '\u00a9'],
    [/per screening/i, '\u00a9'],
    [/not reproducible|legal deposit/i, 'no copy'],
  ];
  const licOf = (it) => {
    const l = it.licence || '';
    for (const [re, short] of SHORT_LIC) if (re.test(l)) return short;
    return '';                       // not stated, unknown — the blank is the fact
  };

  const freeOf = (it) => /creativecommons\.org|^cc-?(by|0)|public domain/i.test(it.licence || '');
  const YEAR = (ms) => new Date(ms).getUTCFullYear();

  let corpus = null;
  let items = [];
  // Oldest first, and only that. The other two orderings were buttons and went
  // with the rest of the row; the sort table below keeps its shape so a second
  // ordering is a line rather than a rewrite.
  const order = 'bydate';

  function view() {
    const by = {
      // Undated rows go last rather than at 1970: a row with no date is not a
      // row from the start of time, and sorting it there would put the loudest
      // unknowns at the top of a list whose default order is chronological.
      bydate: (a, b) => (a.when.earliest ?? Infinity) - (b.when.earliest ?? Infinity)
        || a.title.localeCompare(b.title),
      bykind: (a, b) => kindOf(a).localeCompare(kindOf(b))
        || (a.when.earliest ?? Infinity) - (b.when.earliest ?? Infinity),
      bysource: (a, b) => a.source.localeCompare(b.source)
        || (a.when.earliest ?? Infinity) - (b.when.earliest ?? Infinity),
    }[order];
    return items.slice().sort(by);
  }

  function draw() {
    const rows = view();
    // The name links to the thing; a row with no URL still shows its name.
    // See lessons/page-resources.md#resources-226
    table.set(rows.map((it) => ({
      kind: kindOf(it),
      size: sizeOf(it),
      date: dateOf(it),
      dateWhy: whyOf(it),
      source: it.source,
      title: it.title,
      url: it.url || null,
      licence: licOf(it),
      licenceFull: it.licence || 'no licence is stated anywhere for this row',
      about: aboutOf(it),
    })));
    return rows;
  }

  try {
    const res = await fetch(CORPUS);
    if (!res.ok) throw new Error(`${CORPUS} answered ${res.status}`);
    corpus = await res.json();
    items = corpus.items || [];
    /**
     * A row removed on purpose is named in `corpus.removed`, which excuses it from the drift
     * checks below and is logged; an unnamed absence still fails.
     * See lessons/page-resources.md#resources-227
     */
    const gone = new Set((corpus.removed?.rows || []).map((r) => r.id));
    d.log(`${items.length} rows from ${corpus.sources.length} places, `
      + `gathered ${String(corpus.generated).slice(0, 10)}`
      + `${gone.size ? `. ${gone.size} row(s) removed by hand since: `
        + `${(corpus.removed.rows || []).map((r) => r.title).join(', ')}` : ''}`, 'hi');
    draw();

    d.assert('the list loaded', items.length > 0, `${items.length} rows`);

    // Count the blanks in every column; a column blank on most rows should go. The date is
    // left out: 33 rows have no date anywhere.
    // See lessons/page-resources.md#resources-228
    const blank = items.filter((it) => !it.kind || !it.title || !it.source || !it.url);
    d.assert('every row says what it is, what it is called and who holds it',
      blank.length === 0, `${items.length - blank.length} of ${items.length} complete`);

    const dated = items.filter((it) => it.when.earliest != null);
    const lo = Math.min(...dated.map((it) => YEAR(it.when.earliest)));
    const hi = Math.max(...dated.map((it) => YEAR(it.when.latest - 1)));
    // Deliberately wider than his lifetime: this catches a date that failed to
    // parse and landed on 1970, or one padded into the future, which is what a
    // broken read of these files looks like. The label says what it checks.
    d.assert('every date that is given sits between 1800 and today',
      lo >= 1800 && hi <= new Date().getUTCFullYear(),
      `${dated.length} of ${items.length} dated, ${lo} to ${hi}`);

    d.assert('the table shows one row per item',
      table.count() === items.length, `${table.count()} rows for ${items.length} items`);

    // The list says its media is referenced where it lives and never copied.
    // That is a claim about every address in it, so it is checked against every
    // address in it rather than believed.
    const here = items.flatMap((it) => [it.file, it.url].filter(Boolean))
      .filter((u) => new URL(u).host === location.host);
    d.assert('nothing is served from here', here.length === 0,
      here.length ? here[0] : `${items.filter(fileOf).length} files, all somewhere else`);

    // Every place asked has a ledger row, and the ledger's counts add up to the list.
    // See lessons/page-resources.md#resources-229
    const named = new Set(corpus.sources.map((s) => s.name));
    const orphan = items.filter((it) => !named.has(it.source));
    const summed = corpus.sources.reduce((n, s) => n + s.items, 0);
    d.assert('every row belongs to a place that was asked, and the counts add up',
      orphan.length === 0 && summed === items.length,
      `${corpus.sources.length} places, ${summed} rows counted`);

    // Every row whose source did not answer 200 says what it did answer.
    // See lessons/page-resources.md#resources-230
    const refused = items.filter((it) => it.http !== 200);
    const mute = refused.filter((it) => !it.note);
    // The detail is written for the failing case first.
    // See lessons/page-resources.md#resources-231
    d.assert('every place that refused says what it answered',
      refused.length > 0 && mute.length === 0,
      mute.length ? `${mute.length} of ${refused.length} say nothing — first ${mute[0].id}`
        : `${refused.length} refused: ${[...new Set(refused.map((it) => `${it.source} ${it.http}`))].join(', ')}`);

    // Every id in /proto/deck/'s list must be here (folded in at build time). It is the one
    // check behind SELFCHECK because it fetches a second file nobody reads.
    // See lessons/page-resources.md#resources-232
    if (SELFCHECK) {
      const deckRes = await fetch(DECK);
      const deck = deckRes.ok ? await deckRes.json() : null;
      const have = new Set(items.map((it) => it.id));
      // A row the ledger names is not a drift. See `gone` above.
      // See lessons/page-resources.md#resources-233
      const lost = (deck?.items || []).filter((it) => !have.has(it.id) && !gone.has(it.id));
      const cut = (deck?.items || []).filter((it) => gone.has(it.id)).length;
      d.assert('everything the deck plays is in this list, bar what was removed by hand',
        deck !== null && lost.length === 0,
        deck === null ? `${DECK} answered ${deckRes.status}`
          : lost.length ? `${lost.length} of ${deck.items.length} missing — first ${lost[0].id}`
          : `all ${deck.items.length} of the deck's rows are here`
            + (cut ? `, bar ${cut} the ledger says was removed by hand` : ''));
    }

    // Fourteen dates rest on a book (twelve in proto/deck/ingest.mjs, two in build-corpus.mjs);
    // a rebuild that loses them fails here.
    // See lessons/page-resources.md#resources-234
    const rows = corpus.amended?.rows || [];
    // A row removed by hand is excused by name; `rows.length` stays 14.
    // See lessons/page-resources.md#resources-235
    const brackets = rows.filter((r) => {
      if (gone.has(r.id)) return false;
      const it = items.find((x) => x.id === r.id);
      return !it || it.when.edtf !== r.edtf || !it.when.note;
    });
    // One value typed here: On-Off, which a plain rebuild would put back to a bare `1963`.
    // See lessons/page-resources.md#resources-236
    const onOff = items.find((it) => it.id.endsWith('Erkki Kurenniemi - On-Off.mp3'));
    const WIDENED = '1962–1963-07-11';
    d.assert('the fourteen dates read off the thesis are still in the list',
      rows.length === 14 && brackets.length === 0 && onOff?.when.edtf === WIDENED,
      !rows.length ? 'the corpus names no amended rows at all, so a rebuild dropped the readings'
        : brackets.length ? `${brackets.length} of ${rows.length} lost their bracket, first ${brackets[0].id}`
        : onOff?.when.edtf !== WIDENED ? `On-Off reads ${onOff?.when.edtf || 'nothing'}, not ${WIDENED}`
        : `${rows.length} rows, every one with its reason; On-Off ${onOff.when.edtf}`
          + (gone.size ? `; ${rows.filter((r) => gone.has(r.id)).length} of them name a row `
            + 'the ledger says was removed by hand' : ''));

    d.ready();
  } catch (e) {
    // No ready() here on purpose: a page that could not read its own list has
    // nothing to show and nothing to check, and the harness reports the reason
    // out of `__demo.failed` rather than a silent row of empty cells.
    table.clear(`could not read the list: ${e.message}`);
    d.fail(e);
  }
</script>
</html>

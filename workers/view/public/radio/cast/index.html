<style>
  /* the stations: one row of cards that scrolls sideways, the open one lit */
  /* the 2 px pad keeps a focus ring inside the scroller, which clips */
  .vc-cards { display: flex; gap: 10px; overflow-x: auto; min-width: 0; padding: 2px; margin: -2px; }
  /* one size, taller than wide, so a wrapped title or a blend's second file never moves the row */
  .vc-cards > .pos-card { flex: 0 0 150px; height: 196px; min-height: 0 !important; cursor: pointer; overflow: hidden; }
  .vc-cards .pos-card-d { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; flex: none; }
  .vc-cards .pos-card-d.vc-now2 { -webkit-line-clamp: 2; }
  .vc-cards > .pos-card:hover { background: var(--card2); border-color: var(--line2); }
  .vc-cards > .pos-card[aria-pressed="true"] { border-color: var(--hi); }
  .vc-cards > .pos-card[aria-pressed="true"] .pos-card-t { color: var(--hi); }
  .vc-cards .pos-card-f { align-items: center; justify-content: space-between; }
  .vc-eyebrow { font: 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim2); margin-bottom: -4px; }
  .vc-now2 { color: var(--dim2); }
  .vc-at { font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .vc-at:empty { display: none; }
  .vc-ctl.vc-vote { flex-wrap: nowrap; justify-content: space-between; width: 100%; }
  .vc-vote > .vc-ctl { gap: 8px; flex-wrap: nowrap; }
  .vc-vote .pos-bgroup { width: auto; min-width: auto; }
  .vc-vote .pos-bgroup-row { min-width: auto; overflow-x: visible; }
  .vc-v.vc-wrap { white-space: normal; overflow: visible; }
  .vc-say { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .vc-say .pos-field { width: 100%; }
  .vc-votes > .pos-toggle { flex: 1 1 0; }
  .vc-votes > [aria-pressed="true"] { position: relative; z-index: 1; }
  .vc-votes { display: flex; width: 100%; }
  .vc-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .vc-detail { display: flex; flex-direction: column; gap: 28px; }
  .vc-k { color: var(--dim); text-transform: uppercase; font: 12px var(--mono); }
  .vc-v { font: 13px var(--mono); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-dim { color: var(--dim); font: 12px var(--sans); }
  .vc-name { font: 600 14px var(--mono); }
  .vc-note { color: var(--warn); font: 12px var(--mono); }
  .vc-ctl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; }
  .vc-top > .vc-head { flex: 1; min-width: 0; }
  .vc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .vc-head > .vc-ctl { flex-wrap: nowrap; gap: 12px; align-items: center; }
  /* a head row keeps its buttons at their own size on a phone, as a video panel slot does */
  .vc-head .pos-bgroup { width: auto; min-width: auto; }
  .vc-head .pos-bgroup-row { min-width: auto; overflow-x: visible; }
  .vc-head > .pos-sec-h { margin: 0; }
  .vc-url { font: 12px var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .vc-url[hidden] { display: none; }
  /* start and stop at one width, the wider word's */
  .vc-head .pos-bgroup button:not(.pos-icobtn) { min-width: 15ch; }
  .vc-head .pos-bgroup[hidden] { display: none; }
  .pos-vp[hidden] { display: none; }
  /* inside the panel the scope gives up its page margin (22 px above) and its own border: the panel's edge is the edge */
  .vc-scope .pos-scope { margin: 0; }
  .vc-scope .pos-scope-c { border: 0; display: block; }
  /* one text, so the footer is one column: the grid's empty side slots pushed it in from the left */
  .pos-vp-foot:has(.vc-scene) { padding: 12px; display: block; }
  .pos-vp-foot:has(.vc-scene) .pos-vp-c { justify-content: flex-start; }
  /* one height whatever the scene says: three lines at the desk, seven on a phone, the longest clamped */
  .vc-scene { font: 12.5px/1.45 var(--sans); color: var(--dim); white-space: normal; text-wrap: balance; text-align: left;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; height: calc(1.45em * 3); }
  @media (max-width: 560px) { .vc-scene { -webkit-line-clamp: 7; height: calc(1.45em * 7); } }
  .vc-ctl > .pos-icobtn[hidden] { display: none; }
  /* the group's own display beats the UA [hidden] */
  .vc-head .pos-bgroup[hidden] { display: none; }
  /* a program or archive row: number or day, name, its buttons; the name gives way first */
  .vc-file { display: grid; grid-template-columns: 3ch minmax(0, 1fr) auto auto; }
  .vc-file .vc-n { color: var(--dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .vc-file .vc-day { color: var(--dim); font: 12px var(--mono); }
  .vc-arch { grid-template-columns: minmax(0, 1fr) auto auto; }
  .vc-file[data-on="1"] .vc-v { color: var(--hi); }
  /* how far into a playing file: a 2 px bar along the row's foot, out of the grid's flow */
  .vc-file { position: relative; }
  .vc-prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--hi); pointer-events: none; }
  .vc-prog[data-second="1"] { opacity: .45; }
  .vc-list { width: 100%; }
</style>
<script type="module">
  // Väin's archive played live into an Icecast mount by a Container a Durable Object keeps alive (workers/cast).
  // A list of the stations and the open one beside it: its cast, its sound and its own program.
  // `local` is a station played in this browser off /file/<id> (local.mjs): free, nothing on air.
  // Control needs ?key= once; it is kept in this browser.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours, MEDIUM_COLOURS } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { RING_SECONDS } from '/granulator/grain-ring.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createToggle } from '/shell/toggle.mjs';
  import { createField } from '/shell/field.mjs';
  import { createGlueRows } from '/shell/glue.mjs';
  import { createPresence } from '/shell/presence.mjs';
  import { createCard } from '/shell/card.mjs';
  import { createLocal } from '/radio/cast/local.mjs';
  import { createLife, VOTES, fromT, tasteOf, fileWeight, DWELL_NOISE, patchFor, freezesAfterDry, soakLayers } from '/radio/cast/life.mjs';
  import { createLayerEngine, euclid, stepSeconds, layerLevel, ghostGap, ghostFrom, sceneLevel, blendLevel } from '/radio/cast/layers.mjs';
  useMediumColours();

  const q = new URLSearchParams(location.search);
  const BASE = q.get('cast') || 'https://cast.positron.studio';
  const SHOUT = q.get('shout') || 'https://shout.positron.studio';
  const d = mount({ name: 'Väin cast',
    what: '',
    index: '/', indexLabel: 'positron',
    readout: null });
  // no readout row: the values the page used to show there are dropped
  const show = () => {};
  conceptNav('radio/cast', { say: false });

  let key = q.get('key') || '';
  try { if (key) localStorage.setItem('vain-cast-key', key); else key = localStorage.getItem('vain-cast-key') || ''; } catch { /* no storage */ }

  // ── the stations; radio1965 is heard through shout (one upstream), user1..4 in the Väin app only ──
  const STATIONS = ['local', 'preview', 'radio1965', 'user1', 'user2', 'user3', 'user4'];
  const LOCAL = 'local';
  const LISTEN = { preview: `${BASE}/listen/preview`, radio1965: `${SHOUT}/radio1965` };
  const listenUrl = (t) => LISTEN[t] || null;
  // per channel, whether Väin's own stream is on it (GET /live, their livestream events)
  let live = {};
  let target = LOCAL; // the open station

  // ── the patch: their archive, the caster in Cloudflare, the mount it plays into, and this page's players ──
  const bay = createBay();
  bay.addNode({ id: 'vain:archive', kind: 'external', label: 'Väin archive', place: 'eccm.ee' });
  bay.addNode({ id: 'cf-cast:caster', kind: 'endpoint', label: 'caster', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'cf-icecast:preview', kind: 'endpoint', label: 'preview Icecast', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'vain:icecast', kind: 'external', label: 'Väin Icecast', place: 'live.uuu.ee' });
  bay.addNode({ id: 'cf-shout:radio1965', kind: 'endpoint', label: 'shout relay', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'web:player', kind: 'engine', label: 'player' });
  bay.addNode({ id: 'web:prelisten', kind: 'engine', label: 'prelisten' });
  bay.addNode({ id: 'cf-cast:files', kind: 'endpoint', label: 'file pass', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'web:local', kind: 'engine', label: 'local' });
  bay.addPort({ id: 'vain:archive:audio-out', dir: 'out', medium: 'audio', label: 'mp3 files', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:caster:audio-in', dir: 'in', medium: 'audio', label: 'archive', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:caster:audio-out', dir: 'out', medium: 'audio', label: 'source', transports: ['icecast'] });
  bay.addPort({ id: 'cf-icecast:preview:audio-in', dir: 'in', medium: 'audio', label: '/preview', transports: ['icecast'] });
  bay.addPort({ id: 'cf-icecast:preview:audio-out', dir: 'out', medium: 'audio', label: '/listen/preview', transports: ['https'] });
  bay.addPort({ id: 'vain:icecast:audio-in', dir: 'in', medium: 'audio', label: 'radio1965, user1 to user4', transports: ['icecast'] });
  bay.addPort({ id: 'vain:icecast:audio-out', dir: 'out', medium: 'audio', label: 'radio1965', transports: ['https'] });
  bay.addPort({ id: 'cf-shout:radio1965:audio-in', dir: 'in', medium: 'audio', label: 'one upstream', transports: ['https'] });
  bay.addPort({ id: 'cf-shout:radio1965:audio-out', dir: 'out', medium: 'audio', label: '/radio1965', transports: ['https'] });
  bay.addPort({ id: 'web:player:audio-in', dir: 'in', medium: 'audio', label: 'listen', transports: ['https'] });
  bay.addPort({ id: 'web:prelisten:audio-in', dir: 'in', medium: 'audio', label: 'one file', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:files:audio-in', dir: 'in', medium: 'audio', label: 'archive', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:files:audio-out', dir: 'out', medium: 'audio', label: '/file', transports: ['https'] });
  bay.addPort({ id: 'web:local:audio-in', dir: 'in', medium: 'audio', label: 'tuner, grains', transports: ['https'] });
  const SINK = (t) => (t === 'preview' ? 'cf-icecast:preview:audio-in' : 'vain:icecast:audio-in');
  const HEARD = { preview: [['cf-icecast:preview:audio-out', 'web:player:audio-in']],
    radio1965: [['vain:icecast:audio-out', 'cf-shout:radio1965:audio-in'], ['cf-shout:radio1965:audio-out', 'web:player:audio-in']] };
  const status = {}; // target -> its last status
  let player = null, levelTimer = 0, listenTarget = null, pre = null, preId = null;
  // the local station's engine, made on its first start (local.mjs)
  let local = null, localFor = null;
  const localOn = () => !!local?.playing;
  // a control move is heard at once only while the local station is open and playing
  const localHere = () => localOn() && target === LOCAL;
  const listening = () => !!player && !player.audio.paused;
  const prelistening = () => !!pre && !pre.paused;
  const pb = createPatchbay(bay, { flowing: (l) => {
    if (l.to === 'web:prelisten:audio-in') return prelistening();
    if (l.to === 'web:local:audio-in' || l.to === 'cf-cast:files:audio-in') return localOn();
    if (l.to === 'web:player:audio-in' || l.from === 'vain:icecast:audio-out') return listening() && listenTarget === target;
    return !!status[target]?.onAir;
  } });
  function wire() {
    for (const l of bay.links()) bay.unlink(l.id);
    const cast = target === LOCAL ? [] : [['vain:archive:audio-out', 'cf-cast:caster:audio-in'], ['cf-cast:caster:audio-out', SINK(target)], ...(HEARD[target] || [])];
    for (const [a, b] of [...cast, ['vain:archive:audio-out', 'web:prelisten:audio-in'],
      ['vain:archive:audio-out', 'cf-cast:files:audio-in'], ['cf-cast:files:audio-out', 'web:local:audio-in']]) {
      const r = bay.link(a, b, [], { via: a.startsWith('cf-cast:caster') ? 'icecast' : 'https', consent: true });
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    pb.refresh();
  }

  // ── control: one socket per station, opened on a press; it pushes that station's status every second ──
  const sockets = {}, opening = {};
  let openSocket = (t) => new WebSocket(`${BASE.replace(/^http/, 'ws')}/control/${t}?key=${encodeURIComponent(key)}`);
  function control(t) {
    if (sockets[t]?.readyState === 1) return Promise.resolve(sockets[t]);
    if (opening[t]) return opening[t];
    if (!key) { d.log('control needs the key: open this page once with ?key=', 'warn'); return Promise.resolve(null); }
    opening[t] = new Promise((res) => {
      const s = openSocket(t);
      s.onopen = () => { sockets[t] = s; opening[t] = null; res(s); };
      s.onmessage = (e) => take(t, JSON.parse(e.data));
      s.onclose = () => { if (sockets[t] === s) delete sockets[t]; opening[t] = null; res(null); };
      s.onerror = () => d.log(`${t}: the caster refused the control socket`, 'warn');
    });
    return opening[t];
  }
  async function send(t, m) {
    if (t === LOCAL) return keepLocal(m);
    const s = await control(t); if (s) s.send(JSON.stringify(m)); return !!s;
  }
  const localWanted = () => (status[LOCAL] ||= { target: LOCAL, wanted: { mode: 'live', set: {}, patch: {} } }).wanted;
  // the local station has no caster: its stored sound and program live here, in the shape a status carries
  function keepLocal(m) {
    const w = localWanted();
    if (m.cmd === 'mode') w.mode = m.mode;
    else if (m.cmd === 'set') w.set[m.name] = m.v;
    else if (m.cmd === 'patch') { if (m.name) w.patch = { name: m.name, set: {} }; Object.assign(w.patch.set ||= {}, m.set || {}); }
    else if (m.cmd === 'next') local?.next();
    return true;
  }

  // ── the archive, and each station's program as the caster keeps it ──
  let items = [];
  const progs = {}, progTouched = {};
  const progOf = (t) => progs[t] || [];
  // an empty program starts as the whole archive in a random order, kept as the program so each can be taken out
  const PICK = Infinity; // the whole archive, in an order the file votes lean
  let shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // the archive picked on load for local and an idle preview; shown, and sent only with START
  const picked = {};
  function pickOnLoad() {
    for (const t of [LOCAL, 'preview']) if (!progOf(t).length && !(t === LOCAL ? localOn() : status[t]?.playing)) { startIds(t); picked[t] = true; }
    showProgram();
  }
  function startIds(t) {
    if (!progOf(t).length && items.length) {
      // weighted by what the votes said about each file, so a file voted down comes up less, and at -6 not at all
      // Väin's test recordings (Audio test, Clip test) are short or silent: never in a program
      const fs = tasteOf(votes).file, pool = items.map((x) => ({ id: x.id, w: fileWeight(fs[x.title]) })).filter((x) => x.w > 0);
      progs[t] = (pool.every((x) => x.w === 1) ? shuffle(pool) : pool.map((x) => ({ ...x, k: Math.random() ** (1 / x.w) })).sort((a, b) => b.k - a.k))
        .map((x) => x.id).slice(0, PICK);
      progTouched[t] = Date.now();
      if (t === target) showProgram();
    }
    return progOf(t).slice();
  }
  /** The file a station is playing now, or null. */
  const playingId = (t) => (t === LOCAL ? (localOn() ? (({ slots, from }) => slots[from]?.id ?? null)(local.status()) : null)
    : status[t]?.onAir ? status[t].now?.id ?? null : null);
  // taking out the file that plays first moves on (the clock's transition); its cross sweeps until the
  // next file has landed, then the file leaves the program
  let leaving = null;
  function takeOut(i) {
    const ids = progOf(target), id = ids[i];
    if (id != null && String(id) === String(playingId(target))) {
      if (leaving) return;
      leaving = { t: target, id, at: Date.now() };
      send(target, { cmd: 'next' }); showProgram();
      return;
    }
    return editProgram(ids.filter((_, j) => j !== i));
  }
  /** Called on every status: the leaving file goes once another plays (or nothing does, or 3 min pass). */
  function landed() {
    if (!leaving || (String(playingId(leaving.t)) === String(leaving.id) && Date.now() - leaving.at < 180_000)) return;
    const { t, id } = leaving; leaving = null;
    editProgram(progOf(t).filter((x) => String(x) !== String(id)), t);
  }
  const titleOf = (id) => items.find((x) => String(x.id) === String(id))?.title || '';
  const mmss = (s) => (Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '');
  const theirs = (t) => !!live[t]?.vain && !status[t]?.onAir;
  // an edit applies after the current file while on air, and is kept for START while off
  function editProgram(ids, t = target) {
    progs[t] = ids; progTouched[t] = Date.now();
    if (t === target) showProgram();
    if (localOn() && t === LOCAL) local.queue(localQueue());
    return send(t, status[t]?.onAir ? { cmd: 'queue', ids } : { cmd: 'program', ids });
  }

  // ── STATIONS: one row per channel, the open one marked ──
  const badges = {};
  const presence = (t) => createPresence({ of: t, says: { online: t === LOCAL ? 'here' : 'positron', offline: 'off', unknown: 'not read yet', checking: 'reading', coming: 'starting' },
    busyWords: { page: 'Väin' }, can: ['online', 'offline', 'unknown', 'coming'], state: 'unknown', showName: false });
  // STATIONS: a card each (name, what plays, the badge, when it stops); arrows move, Enter or Space opens
  const cardRow = el('div', 'vc-cards'), cards = {};
  for (const t of STATIONS) {
    const c = createCard({ title: t, minH: 92 }), stops = el('span', 'vc-dim', '');
    // where the station is heard: here in this browser, on our own stream, or on Väin's
    c.el.querySelector('.pos-card-t').before(el('span', 'vc-eyebrow', t === LOCAL ? 'local positron' : t === 'preview' ? 'live positron' : 'live väin'));
    // under what plays: the second file while two blend, and how far into the file
    const now2 = el('span', 'pos-card-d vc-now2'), at = el('span', 'vc-dim vc-at');
    now2.hidden = true; c.el.querySelector('.pos-card-d').after(now2, at);
    badges[t] = presence(t);
    c.el.querySelector('.pos-card-f').append(badges[t].el, stops);
    Object.assign(c.el.dataset, { station: t });
    c.el.setAttribute('role', 'button');
    c.el.addEventListener('click', () => pick(t));
    c.el.addEventListener('keydown', (e) => {
      const i = STATIONS.indexOf(t);
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(t); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const n = cards[STATIONS[(i + (e.key === 'ArrowRight' ? 1 : STATIONS.length - 1)) % STATIONS.length]].el;
        for (const x of Object.values(cards)) x.el.tabIndex = x.el === n ? 0 : -1;
        n.focus({ preventScroll: true }); n.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    });
    cardRow.append(c.el);
    cards[t] = { el: c.el, card: c, stops, now2, at };
  }
  const nowOf = (t) => cards[t].el.querySelector('.pos-card-d').textContent;
  const markOpen = () => { for (const [t, x] of Object.entries(cards)) { x.el.setAttribute('aria-pressed', String(t === target)); x.el.tabIndex = t === target ? 0 : -1; } };

  // ── the open station: its cast, what plays, its sound, its program ──
  const head = el('div', 'vc-head');
  const dName = el('span', 'vc-name', target), dCast = presence('the open station'), dLocal = presence(LOCAL);
  let dBadge = dCast;
  const nameBox = el('span', 'vc-ctl'); nameBox.append(dName, dCast.el, dLocal.el);
  // play on the station's own head; next on the program it steps through
  const castBtns = createButtonGroup({ buttons: [
    { id: 'cast', label: 'start stream', onPress: () => cast(target) },
  ] });
  const nextBtns = createButtonGroup({ buttons: [
    { id: 'next', icon: 'skip-forward', label: 'next file', onPress: () => send(target, { cmd: 'next' }) },
  ] });
  // listening is a lit headphones toggle, so the only square on the head is the stream's stop
  const listenBtn = createIconButton({ icon: 'headphones', label: 'listen', pressed: false,
    onPress: () => (listening() && listenTarget === target ? stopListening() : startListening(target)) });
  const listenLink = el('a', 'vc-url'); listenLink.target = '_blank'; listenLink.rel = 'noopener';
  const inApp = el('span', 'vc-dim', 'in the Väin app');
  // local: play here and the previous and next scene, as icons
  const playBtns = createButtonGroup({ buttons: [{ id: 'play', icon: 'play', label: 'play here', onPress: () => cast(LOCAL) }] });
  const sceneBtns = createButtonGroup({ buttons: [

      nowOf('preview') === 'a file' && cards.preview.at.textContent === '1:01' && !cards.preview.stops.textContent && !/stops|extend/i.test(detail.textContent),
      `${cards.preview.at.textContent} ${cards.preview.stops.textContent}`);
    takeLive({ channels: { radio1965: { vain: true, title: 'Evening on radio1965' }, user1: { vain: false } } });
    take('user1', { target: 'user1', onAir: false, playing: false, lines: [] });
    await tick(300);
    const state = (t) => [badges[t].el.dataset.state, badges[t].el.dataset.busy || ''].join(' ');
    d.assert('three states in words: positron on preview, Väin on radio1965 with their title, off on user1',
      word('preview') === 'positron' && word('radio1965') === 'Väin' && word('user1') === 'off'
      && state('preview') === 'online ' && state('radio1965') === 'online page' && nowOf('radio1965') === 'Evening on radio1965',
      ['preview', 'radio1965', 'user1'].map((t) => `${t} ${word(t)} (${state(t)})`).join(', '));
    rowOf('radio1965').click();
    const before = sent.length;
    castBtns.button('cast').click(); await tick();
    d.assert('a cast on a channel Väin is streaming on sends nothing and says why',
      sent.length === before && note.textContent === 'Väin is streaming here', note.textContent);
    rowOf('user2').click();
    take('user2', { target: 'user2', onAir: false, playing: false, lines: ['09:00:00 refused: Väin is streaming here: Live on user2'] });
    d.assert('a refusal from the caster shows on the open station', note.textContent === 'Väin is streaming here: Live on user2', note.textContent);
    // put it all back
    for (const t of Object.keys(sockets)) delete sockets[t];
    openSocket = realOpen; key = realKey;
    live = {}; for (const t of STATIONS) { delete status[t]; delete progs[t]; badges[t].busy(null); if (t !== LOCAL) badges[t].set('unknown'); cards[t].card.set({ desc: '' }); cards[t].stops.textContent = ''; }
    rowOf(LOCAL).click(); say(''); paintRow(LOCAL); paintDetail();
    d.assert('after the checks nothing is open: no socket, no player, no file playing',
      !Object.keys(sockets).length && !player && !prelistening() && !localOn() && !audioReqs().length, audioReqs().join(' '));
    poll(); setInterval(poll, 3000);
  }
  d.ready();
</script>

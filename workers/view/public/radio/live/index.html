<title>Live tempo</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The detector's beats, drawn over the wave on the wave's own seconds: a
     canvas laid exactly on the scope's, so it moves nothing. */
  .cc-wave { position: relative; }
  /* The tempo scope: bpm up, time across, the full width of its panel and
     the wave's height (the scope's 150). It sits in a host as the wave does,
     because the panel stretches a canvas that is its direct child. */
  .cc-tempo { display: block; width: 100%; height: 150px; touch-action: pan-y; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createTempoRig } from '/radio/rig.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  // /radio/tempo/ with a live source: raadio2, raadio4 (ERR, MP3) or ida-tallinn (AAC) through
  // our relay (`cf-shout`, one upstream per mount), read by createMp3Stream; `?base=` for
  // fake-station.mjs. One station at a time: opened on Play, closed on Stop and before the next.
  // See lessons/page-radio.md#radio-34
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const STATIONS = [
    { id: 'raadio2', label: 'Raadio 2', site: 'err', node: 'raadio2', mount: 'raadio2', name: 'ERR Raadio 2' },
    { id: 'raadio4', label: 'Raadio 4', site: 'err', node: 'raadio4', mount: 'raadio4', name: 'ERR Raadio 4' },
    { id: 'ida', label: 'Ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Radio Tallinn' },
  ];
  const srcOf = (st) => `${BASE}/${st.mount}`;
  const S = 'web';
  // The station is a site of its own and the relay is a hop of its own, as
  // /radio/blend/ draws them: the station's link ends at the relay, and
  // the page reads the relay.
  const STATION_OUT = (st) => `${st.site}:${st.node}:audio-out`;
  const RELAY_IN = (st) => `cf-shout:${st.mount}:audio-in`, RELAY_OUT = (st) => `cf-shout:${st.mount}:audio-out`;
  // The level node takes the place of radio/020's player: the live sound comes
  // in, is raised to one loudness, and feeds the wave, the detector and the fx.
  const PLAYER_IN = `${S}:level:audio-in`, PLAYER_OUT = `${S}:level:audio-out`;

  // The bay: station site into the relay into the level node, whose `audio-out` feeds the wave,
  // the speakers and the detector.
  // See lessons/page-radio.md#radio-35
  const bay = createBay();
  for (const st of STATIONS) {
    addNodes(bay, S, [{ name: 'station', site: st.site, as: st.node, label: st.name }],
      { ports: { [STATION_OUT(st)]: { label: st.label } } });
    addNodes(bay, S, [{ name: 'shout', as: st.mount }],
      { ports: { [RELAY_IN(st)]: { label: 'relay' }, [RELAY_OUT(st)]: { label: 'relay', address: srcOf(st) } } });
  }
  addNodes(bay, S, ['level'], { ports: { [PLAYER_IN]: { label: 'level' }, [PLAYER_OUT]: { label: 'level' } } });
  // The wave, the detector, the tempo scope and the fx box are /radio/rig.mjs.

  const d = mount({ name: 'Live tempo', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/live');

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null;   // the rig's, from its first Play
  // The one open stream, or null: { st, stream, live }. Never two.
  let leg = null;

  // The station's two wires are lit while its stream is live, only for the
  // station picked; the audio wires in this tab while it plays.
  const rig = createTempoRig({ bay, d, site: S, stations: STATIONS, srcOf, playerOut: PLAYER_OUT, seen: true,
    // Holding a link opens nothing. A link out of an `external` node needs `consent: true`, which
    // is the Play press, named here where the link is made.
    // See lessons/page-radio.md#radio-36
    holdSources: (hold) => {
      for (const st of STATIONS) {
        hold(STATION_OUT(st), RELAY_IN(st), { consent: true, via: 'https' });
        hold(RELAY_OUT(st), PLAYER_IN, { via: 'https' });
      }
    },
    flowing: (l, medium, playing) => {
      if (medium !== 'audio') return false;
      const live = playing && !!leg?.live;
      const st = STATIONS.find((s) => l.from === STATION_OUT(s) || l.from === RELAY_OUT(s));
      if (st) return live && leg.st === st;
      return live;
    },
    // A harness never opens a live stream: an ERR connection counts in a broadcaster's audience
    // figures and Ida's server is somebody else's, so under ?selfcheck=1 Play opens nothing.
    // See lessons/page-radio.md#radio-37
    refuse: () => {
      if (!SELFCHECK) return false;
      d.log('a self check is running, so no live stream is opened and nothing plays');
      return true;
    },
    build: () => { ({ ctx, pull, out } = rig); levelBuild(); },
    // Live changes nothing about where a beat lands: the detector stamps the samples this tab plays
    // with `e.playbackTime`, so beats sit on the tab's clock. The first reading waits MIN_S of
    // sound. The press is the person asking to listen: only now does one station's stream open.
    // See lessons/page-radio.md#radio-38
    start: (st) => open(st),
    stop: () => close(),
    demo: { open: () => (leg ? leg.st.id : null), live: () => !!leg?.live, stream: () => leg?.stream.stats() ?? null,
      gain: () => (lv ? +lv.g.toFixed(3) : null), levels: () => Object.fromEntries(levels) },
  });

  // The level, one gain per station, following the sound as it arrives: RMS before the gain, slow
  // and fast, the louder sets LEVEL_RMS / rms, raise only, at most LEVEL_MAX (36 dB), down fast,
  // up slow, held under LEVEL_FLOOR, then a limiter. Ida needs about 28 to 30 dB.
  // See lessons/page-radio.md#radio-39
  const LEVEL_RMS = 10 ** (-16 / 20), LEVEL_MAX = 10 ** (36 / 20), LEVEL_FLOOR = 10 ** (-60 / 20);
  const LEVEL_READ_MS = 100, LEVEL_SLOW_S = 3, LEVEL_FAST_S = 0.3, LEVEL_DOWN_S = 0.08, LEVEL_UP_S = 1.5;
  const levels = new Map();        // station id -> its gain, kept across plays
  let lv = null;                   // { meter, buf, gain, limit, slow, fast, g, timer }
  function levelBuild() {
    lv = { meter: ctx.createAnalyser(), gain: ctx.createGain(), limit: ctx.createDynamicsCompressor(), slow: 0, fast: 0, g: 1, timer: 0 };
    lv.meter.fftSize = 4096; lv.meter.smoothingTimeConstant = 0;
    lv.buf = new Float32Array(lv.meter.fftSize);
    lv.meter.connect(pull);          // pulled, or it is never run
    const c = lv.limit;
    c.threshold.value = -3; c.knee.value = 3; c.ratio.value = 20; c.attack.value = 0.002; c.release.value = 0.15;
    lv.gain.connect(c).connect(out);
  }
  function levelStart(st, node) {
    lv.g = levels.get(st.id) ?? 1;
    lv.slow = 0; lv.fast = 0;
    lv.gain.gain.cancelScheduledValues(ctx.currentTime);
    lv.gain.gain.setValueAtTime(lv.g, ctx.currentTime);
    node.connect(lv.meter);
    node.connect(lv.gain);
    clearInterval(lv.timer);
    const kSlow = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_SLOW_S), kFast = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_FAST_S);
    let said = 0;
    lv.timer = setInterval(() => {
      if (!rig.playing || !leg?.live || leg.st !== st) return;
      lv.meter.getFloatTimeDomainData(lv.buf);
      let s = 0; for (const v of lv.buf) s += v * v;
      const ms = s / lv.buf.length;
      lv.slow = lv.slow ? lv.slow + (ms - lv.slow) * kSlow : ms;
      lv.fast = lv.fast ? lv.fast + (ms - lv.fast) * kFast : ms;
      const rms = Math.sqrt(Math.max(lv.slow, lv.fast));
      if (rms < LEVEL_FLOOR) return;
      const g = Math.max(1, Math.min(LEVEL_MAX, LEVEL_RMS / rms));
      const tau = g < lv.g ? LEVEL_DOWN_S : LEVEL_UP_S / 3;
      lv.g = g;
      levels.set(st.id, g);
      // Each target takes over from where the last glide has got to, so no cancel.
      lv.gain.gain.setTargetAtTime(g, ctx.currentTime, tau);
      const now = performance.now();
      if (now - said > 10000) { said = now; d.log(`${st.label} at ${(20 * Math.log10(rms)).toFixed(1)} dB RMS, raised ${(20 * Math.log10(g)).toFixed(1)} dB`); }
    }, LEVEL_READ_MS);
  }

  // ── the stream: opened on Play, closed on Stop and on a switch ───────────
  function open(st) {
    // One connection at a time, whatever called this.
    close();
    const url = srcOf(st);
    d.log(`opening ${url}`);
    const stream = createMp3Stream(ctx, { url, log: (m) => d.log(`${st.label}: ${m}`) });
    const me = { st, stream, live: false };
    leg = me;
    levelStart(st, stream.node);
    stream.started.then((path) => {
      if (leg !== me) return;
      me.live = true;
      d.log(`${st.label} playing, ${path}`);
      rig.pb.refresh();
    }).catch((e) => { if (leg === me) d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'); });
  }
  function close() {
    if (!leg) return;
    const { st, stream } = leg;
    leg = null;
    try { stream.stop(); } catch { /* already stopped */ }
    try { stream.node.disconnect(); } catch { /* gone */ }
    if (lv) clearInterval(lv.timer);
    d.log(`${st.label} closed`);
  }

  d.ready();
</script>

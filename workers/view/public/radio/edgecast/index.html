<!doctype html>
<html lang="en">

<title>Edgecast</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Play, and Start and Stop with the key, on one row at the top left, as /remote/plaits/. */
  .ec-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* inside the panel the scope gives up its page margin and its own border: the panel's edge is the edge */
  .ec-scope .pos-scope { margin: 0; }
  .ec-scope .pos-scope-c { border: 0; display: block; }
  .pos-vp-foot:has(.ec-line) { padding: 12px; display: block; }
  .pos-vp-foot:has(.ec-line) .pos-vp-c { justify-content: flex-start; }
  /* one height whatever the line says: two lines at the desk, four on a phone */
  .ec-line { font: 12.5px/1.45 var(--sans); color: var(--dim); white-space: normal; text-align: left;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; height: calc(1.45em * 2); }
  @media (max-width: 560px) { .ec-line { -webkit-line-clamp: 4; height: calc(1.45em * 4); } }
  .ec-k { font: 12px var(--mono); color: var(--dim); text-transform: uppercase; }
  .ec-v { font: 13px/1.45 var(--sans); overflow-wrap: anywhere; }
</style>
<script type="module">
  // radio1965's cast played by edgecast (workers/edgecast/station.mjs), one Durable Object on Cloudflare with the
  // cast's engine in wasm: GET /listen is its MP3, GET /status what it is doing. This page plays the stream in an
  // <audio>, draws its wave and says what is going on. Nothing opens on a visit: no fetch, no stream and no poll until
  // a press. Start and Stop show only with ?key= (the cast's key).
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours, MEDIUM_COLOURS } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGlueRows } from '/shell/glue.mjs';
  useMediumColours();

  const q = new URLSearchParams(location.search);
  // ?edgecast= points the page at a `wrangler dev` of workers/edgecast
  const EDGE = (q.get('edgecast') || 'https://edgecast.positron.studio').replace(/\/$/, '');
  const KEY = q.get('key') || '';
  // a start stops itself after this many minutes (the station's own default; ?cap= for another)
  const CAP_MIN = Math.max(1, Math.min(24 * 60, Number(q.get('cap')) || 30));
  const POLL_MS = 3000;

  const d = mount({ name: 'Edgecast', what: '', index: '/', indexLabel: 'positron',
    // the cells under the title, the log alone at the foot, as /remote/plaits/
    joined: false,
    readout: { scene: '', listeners: '', lead: 's', underruns: '', files: '', until: '' } });
  conceptNav('radio/edgecast');

  // ── the bay: the cast's files, the station on Cloudflare, the speaker in this tab ─
  const E = 'cf-edgecast:station', F = 'cf-cast:files', S = 'web:speaker';
  const bay = createBay();
  bay.addNode({ id: F, kind: 'endpoint', label: 'cast files', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: E, kind: 'engine', label: 'station', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: S, kind: 'screen', label: 'speaker' });
  bay.addPort({ id: `${F}:audio-out`, dir: 'out', medium: 'audio', label: '/file', transports: ['https'] });
  bay.addPort({ id: `${E}:audio-in`, dir: 'in', medium: 'audio', label: 'mp3', transports: ['https'] });
  bay.addPort({ id: `${E}:audio-out`, dir: 'out', medium: 'audio', label: '/listen', transports: ['https'] });
  bay.addPort({ id: `${S}:audio-in`, dir: 'in', medium: 'audio', label: 'audio', transports: ['https'] });
  const LINKS = [[`${F}:audio-out`, `${E}:audio-in`], [`${E}:audio-out`, `${S}:audio-in`]];
  for (const [a, b] of LINKS) { const r = bay.link(a, b, [], { via: 'https' }); if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn'); }

  // ── state ──
  let st = null;            // the station's last /status
  let fetches = 0, pollT = 0, polling = false, player = null, listening = false;
  const get = async (path, init) => { fetches++; const r = await fetch(`${EDGE}${path}`, { cache: 'no-store', ...init }); return r.json(); };
  const pb = createPatchbay(bay, { flowing: (l, medium) => medium === 'audio' && !!st?.playing && (l.from === `${F}:audio-out` || listening) });

  // ── what is going on: rows of label and value, filled from /status ──
  const rows = createGlueRows({ grid: true });
  const val = {};
  for (const [k, label] of [['file', 'file'], ['next', 'next'], ['scene', 'scene'], ['effect', 'effect'], ['ghost', 'ghost'], ['layers', 'layers'], ['program', 'program'], ['feed', 'feed']]) {
    val[k] = el('span', 'ec-v', '');
    rows.row([el('span', 'ec-k', label), val[k]], { align: 'start' });
  }
  rows.el.hidden = true;

  // ── the scope: what is heard, as /radio/cast/ draws it ──
  const scopeHost = el('div', 'ec-scope');
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const scope = createGrainScope(scopeHost, { seconds: 10, height: 120, visitor: { colour: MEDIUM_COLOURS.program } });
  const line = el('span', 'ec-line', 'radio1965 on edgecast: nothing playing here');
  const panel = createVideoPanel({ media: scopeHost, left: false, right: false, centre: line, aspect: 'auto', fullMode: 'bare' });
  const mark = (c) => { if (listening) scope.wrap({ colour: css(c), short: false }); };

  // ── reading /status ──
  const hhmm = (iso) => (iso ? new Date(iso).toISOString().slice(11, 16) : '');
  function effectOf(sc) {
    if (!sc) return '';
    if (sc.phase === 'blend') return 'the blend into the next scene';
    const now = sc.at ?? 0, on = (sc.fx || []).find((f) => now >= f.at && now < f.at + f.len);
    if (on) return `${on.kind}, under way, ${Math.max(0, Math.round(on.at + on.len - now))} s left`;
    const next = (sc.fx || []).filter((f) => f.at > now).sort((a, b) => a.at - b.at)[0];
    return next ? `${next.kind} in ${Math.round(next.at - now)} s` : 'none left in this scene';
  }
  const layersOf = (Ly) => (Ly ? [Ly.drone !== 'none' && `${Ly.drone} drone`, Ly.res !== 'none' && `resonators ${Ly.res}`, Ly.harm !== 'none' && `harmonizer ${Ly.harm}`].filter(Boolean).join(', ') || 'the granulator alone' : '');
  const sceneOf = (sc) => (sc ? `${sc.si + 1}: ${sc.patch}, moving ${sc.param}${sc.phase === 'blend' ? ', blending' : ''}` : '');

  function show(s) {
    const sc = s?.scene, on = !!s?.playing;
    d.set('scene', on && sc ? sc.si + 1 : '');
    d.set('listeners', s ? s.listeners : '');
    d.set('lead', on && s.lead != null ? s.lead.toFixed(1) : '');
    d.set('underruns', on && s.underruns ? s.underruns.late : '');
    d.set('files', on && s.program ? s.program.files : '');
    d.set('until', on ? hhmm(s.until) : '');
    rows.el.hidden = !on;
    if (on) {
      val.file.textContent = s.file || '';
      val.next.textContent = s.next || '';
      val.scene.textContent = sceneOf(sc);
      val.effect.textContent = effectOf(sc);
      val.ghost.textContent = sc?.ghost ? sc.ghost : sc?.layers?.ghost === 'none' ? 'none in this scene' : 'none now';
      val.layers.textContent = layersOf(sc?.layers);
      val.program.textContent = s.program ? `${s.program.files} files from ${s.program.source}` : '';
      val.feed.textContent = s.fresh ? `${hhmm(s.fresh.at)} ${s.fresh.did}, every ${s.fresh.everyS} s` : 'not checked yet';
    }
    line.textContent = on ? `${s.file || 'a file'}, ${sc ? `scene ${sceneOf(sc)}${(sc.fx || []).length && sc.phase !== 'blend' && !/^none/.test(effectOf(sc)) ? `; ${effectOf(sc)}` : ''}` : 'starting'}` : `radio1965 on edgecast: ${s ? 'off air' : 'nothing playing here'}`;
    scope.visitorName(on && sc?.ghost ? `ghost: ${sc.ghost}` : '');
    if (KEY) btns.enable('stop', on || !!s?.wanted, 'the station is off air');
    pb.refresh();
  }

  /** What changed since the last status, one log line each: a file, a scene, an effect, a ghost, the feed. */
  function changes(a, b) {
    if (!b?.playing) { if (a?.playing) d.log(`the station went off air${b?.last?.why ? `: ${b.last.why}` : ''}`); return; }
    const x = a?.playing ? a.scene : null, y = b.scene;
    if (!a?.playing) d.log(`on air until ${hhmm(b.until)} UTC, ${b.program ? `${b.program.files} files from ${b.program.source}` : ''}`);
    if (b.file && b.file !== a?.file) d.log(`now playing ${b.file}`);
    if (y && y.inst !== x?.inst) { d.log(`scene ${sceneOf(y)}, ${layersOf(y.layers)}`); mark('--fg'); }
    const fxOn = (sc) => (sc?.fx || []).find((f) => sc.phase !== 'blend' && sc.at >= f.at && sc.at < f.at + f.len)?.kind;
    if (fxOn(y) && (fxOn(y) !== fxOn(x) || y.inst !== x?.inst)) d.log(`effect ${fxOn(y)} under way`);
    if (y?.ghost && y.ghost !== x?.ghost) { d.log(`a ghost: ${y.ghost}`); mark('--md-program'); }
    const f = b.fresh;
    if (f && f.at !== a?.fresh?.at && (f.added?.length || f.gone?.length)) d.log(`feed: ${f.did}`);
    if (b.underruns?.late > (a?.underruns?.late ?? b.underruns.late)) d.log(`the station fell behind the wall (${b.underruns.late} times)`, 'warn');
  }

  async function poll() {
    try { const s = await get('/status'); changes(st, s); st = s; show(s); return s; }
    catch (e) { d.log(`edgecast did not answer: ${e.message}`, 'warn'); return null; }
  }
  function startPoll() {
    if (polling) return;
    polling = true;
    const tick = async () => { if (!polling) return; await poll(); if (polling) pollT = setTimeout(tick, POLL_MS); };
    pollT = setTimeout(tick, POLL_MS);
  }
  function stopPoll() { polling = false; clearTimeout(pollT); }

  // ── listening: one <audio> through an analyser, made on the first press ──
  function makePlayer() {
    const audio = Object.assign(document.createElement('audio'), { preload: 'none', crossOrigin: 'anonymous' });
    const ctx = new AudioContext(), an = ctx.createAnalyser();
    an.fftSize = 2048;
    ctx.createMediaElementSource(audio).connect(an);
    an.connect(ctx.destination);
    // the stream ends when the station restarts: while it is still on air the player comes back by itself
    const again = (why) => {
      if (!listening) return;
      if (!st?.playing || (p.retries = (p.retries || 0) + 1) > 20) { d.log('the stream stopped: is the station on air?', 'warn'); stopListening(); return; }
      d.log(`the stream ${why}, listening again`);
      setTimeout(() => { if (listening) { audio.src = `${EDGE}/listen`; audio.play().catch(() => { /* the error event comes again */ }); } }, 1000);
    };
    audio.addEventListener('ended', () => again('ended'));
    audio.addEventListener('error', () => again('broke'));
    audio.addEventListener('playing', () => { p.retries = 0; d.log('playing the station'); pb.refresh(); });
    const p = { audio, ctx, an, buf: new Float32Array(an.fftSize), zeros: 0, tap: null };
    return p;
  }
  // WebKit hands a live stream's tap zeros (no byte ranges: WebKit 180696): then the wave comes from a second copy
  // of our own stream, cut at MP3 frames and decoded. why: lessons/workers-cast.md#ios-scope
  function startTap(url) {
    const ac = new AbortController(), queue = [];
    player.tap = { ac, queue, ready: 0 };
    d.log('the wave here comes from a second copy of the stream: this browser gives the player\'s tap no sound');
    const frameAt = (b, i) => b[i] === 0xff && (b[i + 1] & 0xe0) === 0xe0 && ((b[i + 2] >> 4) & 15) !== 0 && ((b[i + 2] >> 4) & 15) !== 15 && ((b[i + 2] >> 2) & 3) !== 3;
    (async () => {
      fetches++;
      const rd = (await fetch(url, { signal: ac.signal, cache: 'no-store' })).body.getReader();
      let pending = new Uint8Array(0);
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        const n = new Uint8Array(pending.length + value.length); n.set(pending); n.set(value, pending.length); pending = n;
        if (pending.length < 8192) continue;
        let cut = pending.length - 4; while (cut > 0 && !frameAt(pending, cut)) cut--;
        let from = 0; while (from < cut && !frameAt(pending, from)) from++;
        if (cut <= from) continue;
        const chunk = pending.slice(from, cut); pending = pending.slice(cut);
        try { const ab = await player.ctx.decodeAudioData(chunk.buffer); queue.push(ab.getChannelData(0)); player.tap.rate = ab.sampleRate; while (queue.length > 12) queue.shift(); } catch { /* a chunk that does not decode is skipped */ }
      }
    })().catch(() => { /* aborted on stop */ });
  }
  function tapTake(n) {
    const t = player.tap, out = new Float32Array(n); let k = 0;
    while (k < n && t.queue.length) { const c = t.queue[0], m = Math.min(n - k, c.length - t.ready); out.set(c.subarray(t.ready, t.ready + m), k); k += m; t.ready += m; if (t.ready >= c.length) { t.queue.shift(); t.ready = 0; } }
    return out.subarray(0, k);
  }
  let raf = 0, lastFeed = 0, lastT = -1, zeroT = 0;
  function feedLoop() {
    if (!listening || !player) { raf = 0; return; }
    const t = performance.now(), dt = (t - (lastFeed || t)) / 1000; lastFeed = t;
    if (player.tap) {
      const x = dt > 0 ? tapTake(Math.round(dt * (player.tap.rate || 44100))) : null; if (x?.length) scope.feed(x, player.tap.rate || 44100);
    } else {
      const an = player.an, n = Math.min(player.buf.length, Math.round(dt * an.context.sampleRate));
      an.getFloatTimeDomainData(player.buf);
      if (n > 0) scope.feed(player.buf.subarray(player.buf.length - n), an.context.sampleRate);
      // zeros while the audio advances, for 2 s: the tap is deaf
      if (t - zeroT > 250) {
        zeroT = t;
        let pk = 0; for (const v of player.buf) pk = Math.max(pk, Math.abs(v));
        const moved = player.audio.currentTime > lastT; lastT = player.audio.currentTime;
        player.zeros = pk === 0 && moved ? player.zeros + 1 : 0;
        if ((player.zeros >= 8 || q.get('tap') === '1') && !player.tap) startTap(`${EDGE}/listen`);
      }
    }
    raf = requestAnimationFrame(feedLoop);
  }

  async function play() {
    if (listening) { stopListening(); return; }
    // the context is made inside the press, so the sound is allowed
    player ||= makePlayer();
    player.ctx.resume().catch(() => { /* sound may be late, the stream is not */ });
    btns.setIcon?.('play', 'stop', 'stop');
    const s = await poll();
    startPoll();
    if (!s?.playing) { d.log(`the station is not on air${KEY ? ': press Start' : ''}`, 'warn'); btns.setIcon?.('play', 'play', 'play'); if (!KEY) stopPoll(); return; }
    listening = true;
    player.audio.src = `${EDGE}/listen`;
    player.audio.play().catch(() => { /* the error event says why */ });
    scope.clear(); scope.source('edgecast');
    lastFeed = 0; if (!raf) raf = requestAnimationFrame(feedLoop);
    pb.refresh();
  }
  function stopListening() {
    listening = false;
    if (player) { player.audio.pause(); player.audio.removeAttribute('src'); player.audio.load(); player.tap?.ac.abort(); player.tap = null; player.zeros = 0; }
    cancelAnimationFrame(raf); raf = 0; scope.clear(); scope.source('');
    btns.setIcon?.('play', 'play', 'play');
    if (!KEY) stopPoll();
    show(st);
  }

  // ── Start and Stop, only with the key: the station's own cap ends a start ──
  async function control(what) {
    try {
      const s = await get(`/${what}?key=${encodeURIComponent(KEY)}${what === 'start' ? `&cap=${CAP_MIN}` : ''}`, { method: 'POST' });
      if (s.error) d.log(`${what}: ${s.error}`, 'warn');
      else d.log(what === 'start' ? `started, stops itself after ${CAP_MIN} min` : 'stopped');
      startPoll();
      await poll();
    } catch (e) { d.log(`${what} did not reach edgecast: ${e.message}`, 'bad'); }
  }

  const btns = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => play() },
    ...(KEY ? [{ id: 'start', label: 'Start', onPress: () => control('start') }, { id: 'stop', label: 'Stop', onPress: () => control('stop') }] : []),
  ] });
  const top = el('div', 'ec-top');
  top.append(btns.el);
  d.stack.add(top, panel.el, rows.el, pb.el);

  window.__demo.bay = bay;
  window.__demo.edgecast = { edge: EDGE, play, stopListening, poll, status: () => st,
    probe: () => ({ fetches, polling, listening, player: !!player, keyed: !!KEY, rows: !rows.el.hidden }) };

  // ── the self-check, only under ?selfcheck=1: everything it grades is in this tab, nothing reaches edgecast ──
  if (SELFCHECK) {
    const A = d.assert, has = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
    A('a visit opens nothing: no fetch, no stream, no poll', fetches === 0 && !polling && !player);
    A('the cast\'s files reach the station and the station reaches the speaker, both over https', LINKS.every(([a, b]) => has(a, b)) && bay.links().every((l) => l.via === 'https'),
      bay.links().map((l) => `${l.from} -> ${l.to} ${l.via ?? ''}`).join(', '));
    A('without the key there is only Play', KEY ? true : !top.querySelector('button[data-id="start"], button[data-id="stop"]') && top.querySelectorAll('button').length === 1, `${top.querySelectorAll('button').length} buttons`);
    {
      // NEGATIVE CONTROL: the bay refuses a link out of an input, so the two above are not waved through
      const r = bay.link(`${S}:audio-in`, `${E}:audio-out`, [], { via: 'https' });
      A('NEGATIVE CONTROL: a link out of the speaker\'s input is refused', !r.ok, r.why || 'linked');
      if (r.ok) bay.unlink(r.id);
    }
    // the reading of a status, on a made up one: the effect, the scene and the change log
    const fake = { playing: true, listeners: 2, lead: 1.84, until: '2026-10-20T19:00:00.000Z', file: 'A file', next: 'B file', underruns: { late: 0 },
      program: { files: 9, source: 'radio1965\'s program' }, fresh: { at: '2026-10-20T18:40:00.000Z', did: 'nothing new', everyS: 30 },
      scene: { si: 2, inst: 'x2', patch: 'Cloud', param: 'pos', phase: 'dwell', at: 30, fx: [{ kind: 'echo', at: 25, len: 20 }], ghost: 'C file', layers: { drone: 'none', res: 'none', harm: 'low', ghost: 'some' } } };
    A('an effect under way reads with its time left', effectOf(fake.scene) === 'echo, under way, 15 s left', effectOf(fake.scene));
    A('NEGATIVE CONTROL: an effect still to come is not under way', effectOf({ ...fake.scene, at: 10 }) === 'echo in 15 s', effectOf({ ...fake.scene, at: 10 }));
    show(fake);
    A('a status fills the rows, the cells and the line under the wave', !rows.el.hidden && val.ghost.textContent === 'C file' && val.layers.textContent === 'harmonizer low' && /scene 3: Cloud/.test(line.textContent),
      `${val.ghost.textContent} | ${val.layers.textContent} | ${line.textContent}`);
    show(null);
    A('and no status leaves the rows hidden and the cells empty', rows.el.hidden && getComputedStyle(rows.el).display === 'none');
  }
  d.ready();
</script>

<title>Live key</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The keyboard sits in the panel's stage, so the panel is its box: the
     keyboard's own border, ground and margins come off, and so does the gap
     its pad row would have needed (this keyboard has no pad row). */
  .cc-kb-host .kbd { border: 0; background: transparent; margin: 0; }
  .cc-kb-host .kbd .keys { margin-bottom: 0; }
  /* The key's notes are rings, the kit's `ai` lamp in the accent: a ring is a note you could
     play, and playing it fills it.
     See lessons/page-radio.md#radio-13 */
  /* Rings outside autoplay's chord, greyer still.
     See lessons/page-radio.md#radio-14 */
  .cc-kb-host .k.ai .kd::after { box-shadow: inset 0 0 0 1px #4a5568; }
  /* The notes of the chord autoplay is holding are yellow rings for as long as it lasts, the
     exact voiced notes the pad plays; the rest of the key stays grey.
     See lessons/page-radio.md#radio-15 */
  .cc-kb-host .k.ai.cc-auto .kd::after { box-shadow: inset 0 0 0 1px var(--hi); }
  /* The footer's labels in the kit's form label style, `.pos-field-l`'s declarations.
     See lessons/page-radio.md#radio-16 */
  .cc-keyfoot .pos-vp-k {
    font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim2); white-space: nowrap;
  }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createCheck } from '/shell/check.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { chooseChord, voiceLead, chromaEase } from './autoplay.mjs';

  // /radio/live/ with a key detector in place of the tempo one. Live through our relay
  // (`cf-shout`, one upstream per mount), `?base=` for fake-station.mjs. One station at a time:
  // opened only on Play, closed on Stop and before the next opens. Ida is AAC, ERR MP3.
  // See lessons/page-radio.md#radio-17
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const STATIONS = [
    { id: 'raadio2', label: 'Raadio 2', site: 'err', node: 'raadio2', mount: 'raadio2', name: 'ERR Raadio 2' },
    { id: 'raadio4', label: 'Raadio 4', site: 'err', node: 'raadio4', mount: 'raadio4', name: 'ERR Raadio 4' },
    { id: 'ida', label: 'Ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Radio Tallinn' },
  ];
  const srcOf = (st) => `${BASE}/${st.mount}`;
  let at = 0;
  const S = 'web';
  const STATION_OUT = (st) => `${st.site}:${st.node}:audio-out`;
  const RELAY_IN = (st) => `cf-shout:${st.mount}:audio-in`, RELAY_OUT = (st) => `cf-shout:${st.mount}:audio-out`;
  const PLAYER_IN = `${S}:level:audio-in`, PLAYER_OUT = `${S}:level:audio-out`;
  const WAVE_IN = `${S}:wave:audio-in`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const KEY_IN = `${S}:key:audio-in`, KEY_EV = `${S}:key:value-out`;
  // The on-screen keyboard is ONE node: what you play leaves on its midi-out,
  // and everything it shows arrives on its ins (the key on value-in, the chord
  // autoplay holds or would play on value-in-2, the notes sounding on midi-in).
  const DISPLAY_IN = `${S}:keys:value-in`, KEYS_CHORD = `${S}:keys:value-in-2`, KEYS_LIGHTS = `${S}:keys:midi-in`;
  const AUTO_CHORD = `${S}:autoplay:value-out`, PAD_NOTES = `${S}:pad:midi-out`;
  const AUTO_BASS = `${S}:autoplay:midi-out-2`, BASS_IN = `${S}:bass:midi-in`, BASS_OUT = `${S}:bass:audio-out`;
  const KEYS_OUT = `${S}:keys:midi-out`, AUTO_OUT = `${S}:autoplay:midi-out`, AUTO_KEY = `${S}:autoplay:value-in`;
  const PAD_IN = `${S}:pad:midi-in`, PAD_OUT = `${S}:pad:audio-out`, PAD_LEVEL = `${S}:pad:value-in`;
  const ENERGY_OUT = `${S}:level:value-out`;
  const MIXER_DRY = `${S}:mixer:audio-in`, MIXER_WET = `${S}:mixer:audio-in-2`, MIXER_MIX = `${S}:mixer:value-in`, MIXER_OUT = `${S}:mixer:audio-out`;
  const KNOB_MIX = `${S}:knob-mix:value-out`;

  // The bay: station site into the relay into the level node, whose `audio-out` feeds the wave,
  // the speakers and the key detector; the detector's readings leave on a value port.
  // See lessons/page-radio.md#radio-18
  const bay = createBay();
  for (const st of STATIONS) {
    addNodes(bay, S, [{ name: 'station', site: st.site, as: st.node, label: st.name }],
      { ports: { [STATION_OUT(st)]: { label: st.label } } });
    addNodes(bay, S, [{ name: 'shout', as: st.mount }],
      { ports: { [RELAY_IN(st)]: { label: 'relay' }, [RELAY_OUT(st)]: { label: 'relay', address: srcOf(st) } } });
  }
  // The station's rough energy, its loudness after levelling, eased, leaves on level:value-out.
  addNodes(bay, S, ['level', 'wave', 'key'], { ports: { [PLAYER_IN]: { label: 'level' }, [PLAYER_OUT]: { label: 'level' },
    [ENERGY_OUT]: { label: 'energy' }, [WAVE_IN]: { label: 'wave' }, [KEY_IN]: { label: 'key detector' }, [KEY_EV]: { label: 'key' } } });
  // The keyboard. Nothing paints it but what is delivered on its ins: the
  // detector never touches it, nor does the pad or autoplay.
  addNodes(bay, S, ['keys'], {
    ports: { [KEYS_OUT]: { label: 'keys' }, [DISPLAY_IN]: { label: 'key' }, [KEYS_CHORD]: { label: 'chord' }, [KEYS_LIGHTS]: { label: 'lights' } },
    deliver: {
      [DISPLAY_IN]: (ev) => shown(ev),
      [KEYS_CHORD]: (ev) => { if (ev?.of === 'param' && ev.name === 'chord') autoMark(ev.notes || []); },
      [KEYS_LIGHTS]: (ev) => { if (ev?.cls === 'note') kb.lightNote(ev.d1, ev.d2 > 0); },
    },
  });
  // Autoplay knows the key only from its value-in; the chord's root leaves on
  // midi-out-2 for the bass. The pad's midi-out is every note it sounds. Wet and
  // dry: the station is dry, the pad is wet, one knob between them.
  addNodes(bay, S, ['autoplay', 'bass', 'pad', 'mixer', 'mix-knob', 'speaker'], {
    deliver: { [AUTO_KEY]: (ev) => autoKey(ev), [BASS_IN]: (ev) => bassEvent(ev), [PAD_IN]: (ev) => padEvent(ev),
      [PAD_LEVEL]: (ev) => padLevel(ev), [MIXER_MIX]: (ev) => mixSet(ev) },
    ports: Object.fromEntries([[AUTO_KEY, 'key'], [AUTO_OUT, 'autoplay'], [AUTO_CHORD, 'chord'], [AUTO_BASS, 'bass'],
      [BASS_IN, 'bass'], [BASS_OUT, 'bass'], [PAD_IN, 'pad synth'], [PAD_NOTES, 'sounding'], [PAD_OUT, 'pad synth'],
      [PAD_LEVEL, 'level'], [MIXER_DRY, 'dry'], [MIXER_WET, 'wet'], [MIXER_MIX, 'mix'], [MIXER_OUT, 'wet / dry'],
      [KNOB_MIX, 'mix'], [SPEAKER_IN, 'speakers']].map(([k, label]) => [k, { label }])),
  });

  const d = mount({ name: 'Live key', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/key');

  // The links, held from load so the picture never changes; holding one opens nothing. A link
  // out of an `external` node needs `consent: true`, which is the Play press, named here.
  // See lessons/page-radio.md#radio-19
  const held = new Map();
  function hold(a, b, opts, transforms = []) {
    const k = `${a} ${b} ${JSON.stringify(transforms)}`;
    if (held.has(k)) return;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, transforms, { site: S, ...opts });
    if (r.ok) held.set(k, r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // The sound follows the links the bay holds, read off `bay.links()`.
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
  for (const st of STATIONS) {
    hold(STATION_OUT(st), RELAY_IN(st), { consent: true, via: 'https' });
    hold(RELAY_OUT(st), PLAYER_IN, { via: 'https' });
  }
  hold(PLAYER_OUT, WAVE_IN);
  hold(PLAYER_OUT, KEY_IN);
  hold(PLAYER_OUT, MIXER_DRY);
  hold(KEY_EV, DISPLAY_IN);
  hold(AUTO_CHORD, KEYS_CHORD);
  hold(PAD_NOTES, KEYS_LIGHTS);
  hold(KEY_EV, AUTO_KEY);
  hold(KEYS_OUT, PAD_IN);
  // Autoplay's chord to the pad, its root to the bass. No octave doubling links: a chord in three
  // octaves on saws is an organ and fills every band the radio needs.
  // See lessons/page-radio.md#radio-20
  hold(AUTO_OUT, PAD_IN);
  hold(AUTO_BASS, BASS_IN);
  hold(BASS_OUT, MIXER_WET);
  hold(ENERGY_OUT, PAD_LEVEL);
  hold(PAD_OUT, MIXER_WET);
  hold(KNOB_MIX, MIXER_MIX);
  hold(MIXER_OUT, SPEAKER_IN);

  // ── the sound ───────────────────────────────────────────────────────────
  let ctx = null, pull = null, out = null, tap = null, tapBuf = null;
  // The one open stream, or null: { st, stream, live }. Never two.
  let leg = null, playing = false;

  const pb = createPatchbay(bay, {
    flowing: (l, medium) => {
      if (medium !== 'audio') return false;
      const live = playing && !!leg?.live;
      const st = STATIONS.find((s) => l.from === STATION_OUT(s) || l.from === RELAY_OUT(s));
      if (st) return live && leg.st === st;
      return live;
    },
  });

  // ── the pictures ────────────────────────────────────────────────────────
  const waveHost = el('div', 'cc-wave');
  const scope = createGrainScope(waveHost, { seconds: 4, height: 150, fullScale: 1 });
  // The station, the kit picker in the wave panel's footer. Choosing one while
  // playing CLOSES the old station's stream first and only then opens the new
  // one, and starts a fresh key reading. Choosing while stopped opens nothing.
  const pick = createPicker({ what: 'station', prev: () => choose(at - 1), next: () => choose(at + 1), onPick: (i) => choose(i) });
  pick.options(STATIONS.map((st) => st.label), 0);
  function choose(i) {
    const n = (i + STATIONS.length) % STATIONS.length;
    if (n === at) return;
    at = n;
    pick.show(STATIONS[at].label, at);
    pb.refresh();
    if (playing) { stop(); play(); }
  }
  const wavePanel = createVideoPanel({ media: waveHost, aspect: 'auto', right: false, left: pick.el });

  // The key on the kit keyboard, two octaves from C3. The key's notes are grey rings, autoplay's
  // chord yellow ones, and a sounding note fills its ring in the accent.
  // See lessons/page-radio.md#radio-21
  const KB_BASE = 48, KB_SPAN = 23;
  const kbHost = el('div', 'cc-kb-host');
  const kb = createKeyboard(kbHost, { ...keyRange(KB_SPAN), base: KB_BASE, letters: false, pad: false, chord: false, full: true,
    onDown: (note) => bay.send(KEYS_OUT, { cls: 'note', ch: 1, d1: note, d2: 90 }),
    onUp: (note) => bay.send(KEYS_OUT, { cls: 'note', ch: 1, d1: note, d2: 0 }) });
  let lit = [];                    // [note, who] currently painted
  function paintKey(r) {
    for (const [n, who] of lit) kb.lightNote(n, false, who);
    lit = [];
    if (!r || r.tonic == null || !KEY_SCALE[r.mode]) return;
    for (let n = KB_BASE; n <= KB_BASE + KB_SPAN; n++) {
      const deg = (n - r.tonic + 120) % 12;
      if (!KEY_SCALE[r.mode].includes(deg)) continue;
      // Rings only: a filled dot means a note is sounding, so the home note has no dot of its own.
      // See lessons/page-radio.md#radio-22
      kb.lightNote(n, true, 'ai'); lit.push([n, 'ai']);
    }
  }
  const auto = createCheck({ label: 'Autoplay', title: 'chords in the detected key on the pad synth', onChange: (on) => autoSet(on) });
  const keyPanel = createVideoPanel({ media: kbHost, aspect: 'auto', left: false, right: auto.el,
    values: [{ key: 'key', label: 'key', reserve: 8 }, { key: 'conf', label: 'confidence', reserve: 4 }, { key: 'also', label: 'also', reserve: 18 }] });
  keyPanel.el.classList.add('cc-keyfoot');

  // Two voices. The pad: five detuned saws spread in stereo, a slowly drifting lowpass, high passed
  // and over a room reverb, 0.5 s in and 1 s out so old chords do not linger. The bass: the root
  // an octave under, a sine plus a triangle an octave up for small speakers.
  // See lessons/page-radio.md#radio-23
  const PAD = { attack: 0.5, release: 1, cutoff: 900, sweep: 450, lfoHz: 0.12, hp: 180, level: 0.12, reverb: 0.3 };
  const BASS = { attack: 0.06, release: 0.8, cutoff: 420, level: 0.35 };
  let padBus = null, padOut = null, padLfo = null, bassBus = null, dryG = null, wetG = null, mixOut = null, mix = 0.5, energy = null;
  const voices = new Map();
  function sound() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!mixOut) {
      mixOut = ctx.createGain(); dryG = ctx.createGain(); wetG = ctx.createGain();
      dryG.connect(mixOut); wetG.connect(mixOut);
      if (holds(MIXER_OUT, SPEAKER_IN)) mixOut.connect(ctx.destination);
      mixApply();
    }
    if (!padBus) {
      padBus = ctx.createGain(); padBus.gain.value = PAD.level;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = PAD.hp; hp.Q.value = 0.5;
      const conv = ctx.createConvolver(); conv.buffer = roomImpulse(1.6);
      const rev = ctx.createGain(); rev.gain.value = PAD.reverb;
      padOut = ctx.createGain();
      padBus.connect(hp); hp.connect(padOut); hp.connect(conv); conv.connect(rev); rev.connect(padOut);
      // one slow LFO for every pad voice's filter, so the pad breathes together
      const lfo = ctx.createOscillator(); lfo.frequency.value = PAD.lfoHz;
      padLfo = ctx.createGain(); padLfo.gain.value = PAD.sweep;
      lfo.connect(padLfo); lfo.start();
      bassBus = ctx.createGain(); bassBus.gain.value = BASS.level;
      padRoute();
    }
    return ctx;
  }
  function padRoute() {
    if (!padOut) return;
    try { padOut.disconnect(); } catch { /* not connected */ }
    try { bassBus.disconnect(); } catch { /* not connected */ }
    if (holds(PAD_OUT, MIXER_WET)) padOut.connect(wetG);
    if (holds(BASS_OUT, MIXER_WET)) bassBus.connect(wetG);
  }
  /** A room: two channels of noise falling away exponentially over `sec`. */
  function roomImpulse(sec) {
    const n = Math.round(ctx.sampleRate * sec), buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const x = buf.getChannelData(c);
      for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    }
    return buf;
  }
  // Equal power: dry is cos and wet sin of the knob's quarter turn, so the middle is neither
  // louder nor quieter. WET_TRIM lifts the pad, a quiet voice beside a levelled station.
  // See lessons/page-radio.md#radio-24
  const WET_TRIM = 2.5;
  function mixApply() {
    if (!dryG) return;
    const t = ctx.currentTime, a = mix * Math.PI / 2;
    dryG.gain.setTargetAtTime(Math.cos(a), t, 0.02);
    wetG.gain.setTargetAtTime(Math.sin(a) * WET_TRIM, t, 0.02);
  }
  function mixSet(ev) {
    if (ev?.of !== 'param' || !Number.isFinite(ev.v)) return;
    mix = Math.max(0, Math.min(1, ev.v));
    mixApply();
  }
  // The pad's level follows the station's energy on its value-in: its own level at ordinary
  // loudness, down to a fifth in the quiet, up to 1.5 times on the loud; no station, own level.
  // See lessons/page-radio.md#radio-25
  function padLevel(ev) {
    if (ev?.of !== 'param') return;
    energy = Number.isFinite(ev.v) ? ev.v : null;
    if (!padBus) return;
    const k = energy == null ? 1 : Math.max(0.2, Math.min(1.5, 0.2 + 0.8 * energy ** 1.5));
    padBus.gain.setTargetAtTime(PAD.level * k, ctx.currentTime, 0.05);
  }
  // Each MIDI channel has its own level, set by CC 11 (expression) on that
  // channel: the keys play on channel 1 and are never turned down, autoplay
  // plays on channel 2 and turns itself up and down with the key's confidence.
  const chGains = new Map();
  function chGain(ch) {
    if (!chGains.has(ch)) { const g = ctx.createGain(); g.connect(padBus); chGains.set(ch, g); }
    return chGains.get(ch);
  }
  function padEvent(ev) {
    if (ev?.cls === 'cc' && ev.d1 === 11) {
      sound();
      // squared, so the bottom of the range is quiet rather than merely softer
      chGain(ev.ch).gain.setTargetAtTime((ev.d2 / 127) ** 2, ctx.currentTime, 0.05);
      return;
    }
    if (ev?.cls !== 'note') return;
    const on = ev.d2 > 0;
    bay.send(PAD_NOTES, { cls: 'note', ch: ev.ch, d1: ev.d1, d2: ev.d2 });
    if (on) padOn(ev.d1, ev.d2 / 127, ev.ch); else padOff(ev.d1, ev.ch);
  }
  function padOn(note, vel, ch = 1) {
    sound();
    padOff(note, ch);
    const t = ctx.currentTime, f = 440 * 2 ** ((note - 69) / 12);
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vel, t + PAD.attack);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = PAD.cutoff; lp.Q.value = 0.7;
    padLfo.connect(lp.frequency);
    lp.connect(env); env.connect(chGain(ch));
    const oscs = [[-14, -0.7], [-7, -0.35], [0, 0], [7, 0.35], [14, 0.7]].map(([cents, panAt]) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = cents;
      const g = ctx.createGain(); g.gain.value = 0.16;
      const pan = ctx.createStereoPanner(); pan.pan.value = panAt;
      o.connect(g); g.connect(pan); pan.connect(lp); o.start(t); return o;
    });
    voices.set(`${ch}/${note}`, { env, oscs });
  }
  function padOff(note, ch = 1) {
    const v = voices.get(`${ch}/${note}`);
    if (!v) return;
    voices.delete(`${ch}/${note}`);
    const t = ctx.currentTime;
    v.env.gain.cancelScheduledValues(t);
    v.env.gain.setValueAtTime(v.env.gain.value, t);
    v.env.gain.linearRampToValueAtTime(0, t + PAD.release);
    for (const o of v.oscs) o.stop(t + PAD.release + 0.05);
  }

  // The bass: one note at a time, its level on CC 11 like the pad's autoplay channel.
  let bassVoice = null, bassExpr = null;
  function bassEvent(ev) {
    sound();
    if (!bassExpr) { bassExpr = ctx.createGain(); bassExpr.connect(bassBus); }
    if (ev?.cls === 'cc' && ev.d1 === 11) { bassExpr.gain.setTargetAtTime((ev.d2 / 127) ** 2, ctx.currentTime, 0.05); return; }
    if (ev?.cls !== 'note') return;
    if (ev.d2 > 0) bassOn(ev.d1, ev.d2 / 127);
    else if (bassVoice?.note === ev.d1) bassOff();
  }
  function bassOn(note, vel) {
    bassOff();
    const t = ctx.currentTime, f = 440 * 2 ** ((note - 69) / 12);
    const env = ctx.createGain(); env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vel, t + BASS.attack);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = BASS.cutoff; lp.Q.value = 0.8;
    lp.connect(env); env.connect(bassExpr);
    const oscs = [['sine', f, 0.8], ['triangle', f * 2, 0.25]].map(([type, freq, gain]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = gain;
      o.connect(g); g.connect(lp); o.start(t); return o;
    });
    bassVoice = { note, env, oscs };
  }
  function bassOff() {
    const v = bassVoice;
    if (!v) return;
    bassVoice = null;
    const t = ctx.currentTime;
    v.env.gain.cancelScheduledValues(t);
    v.env.gain.setValueAtTime(v.env.gain.value, t);
    v.env.gain.linearRampToValueAtTime(0, t + BASS.release);
    for (const o of v.oscs) o.stop(t + BASS.release + 0.05);
  }

  // Autoplay plays a chord of the key every AUTO_S seconds and at once on a key change, silent
  // with no key. The chord is chosen from the station's chroma over CHORD_TAU_S and voiced to
  // move least within PAD_LO..PAD_HI (./autoplay.mjs); the bass keeps the root.
  // See lessons/page-radio.md#radio-26
  const AUTO_S = 4, AUTO_CH = 2, CHORD_TAU_S = 3;
  // The pad's three voices stay inside the drawn keyboard (C3 to B4) with room
  // under them for the bass; a first chord sits in root position nearest C4.
  const PAD_LO = 52, PAD_HI = 71, PAD_HOME = 60;
  const PAD_RANGE = { lo: PAD_LO, hi: PAD_HI, home: PAD_HOME };
  // Autoplay's loudness is CC 11 on its own channel, a level not a velocity, so a sounding chord
  // swells with it: silent at AUTO_CONF_LO, full at AUTO_CONF_HI, eased over AUTO_TAU_S so a
  // flickering confidence hardly moves it.
  // See lessons/page-radio.md#radio-27
  const AUTO_CONF_LO = 0.05, AUTO_CONF_HI = 0.35, AUTO_TAU_S = 3, AUTO_EXPR_MS = 100;
  let autoExpr = 0, autoExprSent = -1, autoExprTimer = null;
  function autoExprTick() {
    const c = autoReading?.confidence ?? 0;
    const target = Math.max(0, Math.min(1, (c - AUTO_CONF_LO) / (AUTO_CONF_HI - AUTO_CONF_LO)));
    autoExpr += (target - autoExpr) * (1 - Math.exp(-AUTO_EXPR_MS / 1000 / AUTO_TAU_S));
    const v = Math.round(autoExpr * 127);
    if (v !== autoExprSent) { autoExprSent = v; for (const port of [AUTO_OUT, AUTO_BASS]) bay.send(port, { cls: 'cc', ch: AUTO_CH, d1: 11, d2: v }); }
  }
  let autoTimer = null, autoHeld = [], autoBassNote = null;
  // The step and the voiced notes sounding now (or last), what the next
  // choice and the next voicing are made against, and the station's last few
  // seconds of pitch classes.
  let autoStep = null, autoVoiced = null, autoHow = null, autoChroma = new Array(12).fill(0), autoChromaAt = null;
  // Which drawn key is which note: read once off the names the keys print
  // (`C3`, `C♯3`), because the keyboard publishes no element per note.
  const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const keyEls = new Map();
  for (const k of kbHost.querySelectorAll('.k')) {
    const m = /^([A-G])(♯|#)?(-?\d+)$/.exec(k.querySelector('.kn')?.textContent.trim() || '');
    if (m) keyEls.set(12 * (+m[3] + 1) + PC[m[1]] + (m[2] ? 1 : 0), k);
  }
  function autoMark(notes) {
    for (const k of keyEls.values()) k.classList.remove('cc-auto');
    for (const n of notes) keyEls.get(n)?.classList.add('cc-auto');
  }
  // The last key reading that arrived on autoplay's value-in. A new key
  // restarts the chord cycle, or moves the preview.
  let autoReading = null;
  function autoKey(ev) {
    if (ev?.of !== 'param' || ev.name !== 'key') return;
    // The chroma comes with every reading, about ten a second, and is eased
    // over CHORD_TAU_S on the clock it arrives by.
    if (Array.isArray(ev.chroma) && ev.chroma.length === 12) {
      const now = performance.now() / 1000;
      chromaEase(autoChroma, ev.chroma, autoChromaAt == null ? 0.1 : Math.min(1, now - autoChromaAt), CHORD_TAU_S);
      autoChromaAt = now;
    }
    const moved = autoReading?.v !== ev.v;
    autoReading = ev;
    if (!moved) return;
    // A step of the old key means nothing in the new one; the voicing still
    // moves least from the notes that were sounding.
    autoStep = null;
    if (autoTimer) autoChord(); else autoPreview();
  }
  const keyOk = (r) => r && r.tonic != null && KEY_SCALE[r.mode];
  // With autoplay off, the chord it would open on (the home chord, root position) shows as
  // yellow rings; with it on, the chord it holds.
  // See lessons/page-radio.md#radio-28
  function autoPreview() {
    if (autoTimer) return;
    const r = autoReading;
    autoSay(keyOk(r) ? voiceLead(null, [0, 2, 4].map((k) => (r.tonic + KEY_SCALE[r.mode][k]) % 12), PAD_RANGE).notes : []);
  }
  // The chord autoplay holds, or would open on, leaves on its value-out.
  const autoSay = (notes) => bay.send(AUTO_CHORD, { of: 'param', name: 'chord', notes: [...notes] });
  function autoRelease() {
    for (const n of autoHeld) bay.send(AUTO_OUT, { cls: 'note', ch: AUTO_CH, d1: n, d2: 0 });
    if (autoBassNote != null) bay.send(AUTO_BASS, { cls: 'note', ch: AUTO_CH, d1: autoBassNote, d2: 0 });
    autoHeld = []; autoBassNote = null;
    autoSay([]);
    autoPreview();
  }
  // A note the new chord shares with the sounding one gets no note off and no new note on, so
  // the pad does not breathe on it; only the voices that move are released and struck.
  // See lessons/page-radio.md#radio-29
  function autoChord() {
    const r = autoReading;
    if (!keyOk(r)) { autoRelease(); return; }
    const c = chooseChord(autoChroma, r, autoStep);
    const { notes } = voiceLead(autoVoiced, c.pcs, PAD_RANGE);
    if (c.how !== autoHow) d.log(c.how === 'walk' ? 'autoplay walks I IV V vi, the radio is not clear enough to follow' : 'autoplay follows the radio\'s chords');
    autoStep = c.step; autoVoiced = notes; autoHow = c.how;
    for (const n of autoHeld) if (!notes.includes(n)) bay.send(AUTO_OUT, { cls: 'note', ch: AUTO_CH, d1: n, d2: 0 });
    for (const n of notes) if (!autoHeld.includes(n)) bay.send(AUTO_OUT, { cls: 'note', ch: AUTO_CH, d1: n, d2: 100 });
    autoHeld = [...notes];
    // The bass is the chord's root where the old root position put it: an
    // octave under KB_BASE + tonic + the step's interval. The same root holds.
    const bass = KB_BASE - 12 + r.tonic + KEY_SCALE[r.mode][c.step];
    if (bass !== autoBassNote) {
      if (autoBassNote != null) bay.send(AUTO_BASS, { cls: 'note', ch: AUTO_CH, d1: autoBassNote, d2: 0 });
      autoBassNote = bass;
      bay.send(AUTO_BASS, { cls: 'note', ch: AUTO_CH, d1: bass, d2: 110 });
    }
    autoSay(autoHeld);
  }
  function autoSet(on) {
    clearInterval(autoTimer); autoTimer = null;
    clearInterval(autoExprTimer); autoExprTimer = null;
    autoRelease();
    if (!on) { d.log('autoplay off'); return; }
    sound();
    // starts silent and comes in at the key's confidence
    autoExpr = 0; autoExprSent = -1; autoExprTick();
    autoExprTimer = setInterval(autoExprTick, AUTO_EXPR_MS);
    autoStep = null; autoVoiced = null; autoHow = null;
    autoChord();
    autoTimer = setInterval(autoChord, AUTO_S * 1000);
    d.log(autoReading?.v ? `autoplay in ${autoReading.v}` : 'autoplay waits for a key');
  }

  // What the picture shows is only what arrived on its in-port.
  let reading = null;              // the last event delivered
  function shown(ev) {
    if (ev?.of !== 'param' || ev.name !== 'key' || !Array.isArray(ev.chroma)) return;
    const moved = reading?.v !== ev.v;
    reading = ev;
    if (moved) paintKey(ev);
    keyPanel.values.set('key', ev.v ?? '');
    keyPanel.values.set('conf', Number.isFinite(ev.confidence) ? ev.confidence.toFixed(2) : '');
    keyPanel.values.set('also', Array.isArray(ev.also) ? ev.also.slice(0, 2).map((k) => k.key).join(', ') : '');
  }

  // Key detector, plain arithmetic on the analyser's dB spectrum every KEY_HOP_S: peaks 55 Hz to
  // 2 kHz, tuned, harmonics at 30%, summed over 30 s, Temperley profiles; research/tools/tempo-key/ reads it.
  // KEY CORE BEGIN
  // See lessons/page-radio.md#radio-30
  const KEY_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  const KEY_PROFILES = {
    kk: { major: [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],
      minor: [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17] },
    temperley: { major: [0.748, 0.060, 0.488, 0.082, 0.670, 0.460, 0.096, 0.715, 0.104, 0.366, 0.057, 0.400],
      minor: [0.712, 0.084, 0.474, 0.618, 0.049, 0.460, 0.105, 0.747, 0.404, 0.067, 0.133, 0.330] },
  };
  const KEY_SCALE = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
  const KEY_MIN_S = 3;             // no key until this much sound has been heard
  function keyCreate(sr, n, o = {}) {
    const s = { sr, n, lo: o.lo ?? 55, hi: o.hi ?? 2000, tau: o.tau ?? 30, floorDb: o.floorDb ?? 35,
      taper: o.taper ?? 1, profiles: KEY_PROFILES[o.profiles ?? 'temperley'], harm: o.harm ?? 0.7, stick: o.stick ?? 0.05,
      acc: new Float64Array(12), now: new Float64Array(12), tRe: 0, tIm: 0, tuning: 0, heard: 0, last: null };
    s.k0 = Math.max(2, Math.floor(s.lo * n / sr) - 1);
    s.k1 = Math.min(n / 2 - 2, Math.ceil(s.hi * n / sr) + 1);
    return s;
  }
  // One frame: `db` is the analyser's dB spectrum (n / 2 bins), `dt` the
  // seconds of sound since the frame before.
  function keyFrame(s, db, dt) {
    const { sr, n, k0, k1 } = s;
    let top = -Infinity;
    for (let k = k0; k <= k1; k++) if (db[k] > top) top = db[k];
    const frame = new Float64Array(12);
    if (!(top > -100)) { keyDecay(s, frame, dt); return; }
    const floor = top - s.floorDb;
    let tRe = 0, tIm = 0;
    const peaks = [];              // pitch, weight, pitch, weight, ...
    for (let k = k0 + 1; k < k1; k++) {
      const a = db[k - 1], b = db[k], c = db[k + 1];
      if (!(b > a && b >= c && b > floor)) continue;
      const den = a - 2 * b + c;
      const o = 0.5 * (a - c) / den;   // a silent bin is -Infinity, and its parabola is NaN
      const off = Number.isFinite(o) ? Math.max(-0.5, Math.min(0.5, o)) : 0;
      const f = (k + off) * sr / n;
      if (f < s.lo || f > s.hi) continue;
      const p = 69 + 12 * Math.log2(f / 440);
      let w = b - floor;
      // Faded in over the bottom octave of the band and out over the top one,
      // so a note crossing an edge comes and goes gradually.
      const x = Math.min(Math.log2(f / s.lo), Math.log2(s.hi / f)) / s.taper;
      if (x < 1) w *= 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, x));
      const dv = p - Math.round(p);
      tRe += w * Math.cos(2 * Math.PI * dv); tIm += w * Math.sin(2 * Math.PI * dv);
      peaks.push(p, w);
    }
    const g = Math.exp(-dt / 2);
    s.tRe = s.tRe * g + tRe; s.tIm = s.tIm * g + tIm;
    s.tuning = Math.atan2(s.tIm, s.tRe) / (2 * Math.PI);
    if (s.harm) for (let i = peaks.length - 2; i >= 0; i -= 2) {
      for (let j = 0; j < i; j += 2) {
        const dp = peaks[i] - peaks[j];
        if ((Math.abs(dp - 19.02) < 0.35 || Math.abs(dp - 27.86) < 0.35) && peaks[j + 1] >= peaks[i + 1]) { peaks[i + 1] *= 1 - s.harm; break; }
      }
    }
    for (let i = 0; i < peaks.length; i += 2) {
      const q = peaks[i] - s.tuning, r = Math.round(q), near = 1 - 2 * Math.abs(q - r);
      frame[((r % 12) + 12) % 12] += peaks[i + 1] * near;
    }
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += frame[i];
    if (sum > 0) for (let i = 0; i < 12; i++) frame[i] /= sum;
    keyDecay(s, frame, dt);
    if (sum > 0) s.heard += dt;
  }
  function keyDecay(s, frame, dt) {
    const g = Math.exp(-dt / s.tau), h = Math.exp(-dt / 0.5);
    for (let i = 0; i < 12; i++) { s.acc[i] = s.acc[i] * g + frame[i] * dt; s.now[i] = s.now[i] * h + frame[i] * (1 - h); }
  }
  function keyCorr(x, prof, rot) {
    let mx = 0, mp = 0;
    for (let i = 0; i < 12; i++) { mx += x[i]; mp += prof[i]; }
    mx /= 12; mp /= 12;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < 12; i++) {
      const a = x[(i + rot) % 12] - mx, b = prof[i] - mp;

    return sxx > 0 ? sxy / Math.sqrt(sxx * syy) : 0;
  }
  // The key now, or null before KEY_MIN_S of sound.
  function keyRead(s) {
    if (s.heard < KEY_MIN_S) return null;

    for (const mode of ['major', 'minor']) for (let t = 0; t < 12; t++) all.push({ tonic: t, mode, r: keyCorr(s.acc, s.profiles[mode], t) });
    all.sort((a, b) => b.r - a.r);
    // The key shown last stays until another beats it by `stick`.
    if (s.last && s.stick) {
      const i = all.findIndex((k) => k.tonic === s.last.tonic && k.mode === s.last.mode);
      if (i > 0 && all[0].r - all[i].r < s.stick) all.unshift(...all.splice(i, 1));

    const best = all[0], next = all[1];
    s.last = best;
    const conf = Math.max(0, Math.min(1, best.r)) * Math.max(0, Math.min(1, (best.r - next.r) / 0.1));
    const name = (k) => `${KEY_NAMES[k.tonic]} ${k.mode}`;
    return { key: name(best), tonic: best.tonic, mode: best.mode, r: best.r, confidence: conf,
      also: all.slice(1, 4).map((k) => ({ key: name(k), r: k.r })), tuning: s.tuning };
  }
  // KEY CORE END

  const KEY_FFT = 32768, KEY_HOP_S = 0.1, KEY_READ_S = 0.5;
  let key = null;                  // { an, db, s, clock, nextRead, last, timer }
  function keyBuild() {
    const an = ctx.createAnalyser();
    an.fftSize = KEY_FFT; an.smoothingTimeConstant = 0;
    an.connect(pull);              // pulled, or it is never run
    return { an, db: new Float32Array(KEY_FFT / 2) };
  }
  // A fresh reading every play: a new sum, so the key is this listen's.
  function keyStart() {
    clearInterval(key.timer);
    key.s = keyCreate(ctx.sampleRate, KEY_FFT);
    key.clock = null; key.nextRead = KEY_READ_S; key.last = null; key.sound = 0;
    // Timed on the audio clock, so a throttled tab changes how often a frame
    // is read and never how fast the sum decays.
    key.timer = setInterval(() => {
      if (!playing || !leg?.live) { key.clock = null; return; }
      const now = ctx.currentTime;
      if (key.clock == null) { key.clock = now; return; }

        also: r ? r.also.map((k) => ({ key: k.key, r: Math.round(k.r * 100) / 100 })) : [],

  }


  function frame() {
    if (!playing) return;
    if (holds(PLAYER_OUT, WAVE_IN)) { tap.getFloatTimeDomainData(tapBuf); scope.feed(tapBuf, ctx.sampleRate); }
    requestAnimationFrame(frame);
  }

  // The level, one gain per station: RMS before the gain followed slow and fast, the louder sets
  // LEVEL_RMS / rms, raise only, at most 36 dB; down fast, up slow, a limiter after. Ida sits near
  // -44 dB RMS with one stretch at -14, so it needs about 28 to 30 dB that drops within a second.
  // See lessons/page-radio.md#radio-31
  const LEVEL_RMS = 10 ** (-16 / 20), LEVEL_MAX = 10 ** (36 / 20), LEVEL_FLOOR = 10 ** (-60 / 20);
  const LEVEL_READ_MS = 100, LEVEL_SLOW_S = 3, LEVEL_FAST_S = 0.3, LEVEL_DOWN_S = 0.08, LEVEL_UP_S = 1.5;
  const levels = new Map();        // station id -> its gain, kept across plays
  let lv = null;                   // { meter, buf, gain, limit, slow, fast, g, timer }
  function levelBuild() {
    lv = { meter: ctx.createAnalyser(), gain: ctx.createGain(), limit: ctx.createDynamicsCompressor(), slow: 0, fast: 0, g: 1, timer: 0 };
    lv.meter.fftSize = 4096; lv.meter.smoothingTimeConstant = 0;
    lv.buf = new Float32Array(lv.meter.fftSize);
    lv.meter.connect(pull);          // pulled, or it is never run
    const c = lv.limit;
    c.threshold.value = -3; c.knee.value = 3; c.ratio.value = 20; c.attack.value = 0.002; c.release.value = 0.15;
    lv.gain.connect(c).connect(out);
  }
  function levelStart(st, node) {
    lv.g = levels.get(st.id) ?? 1;
    lv.slow = 0; lv.fast = 0;
    lv.gain.gain.cancelScheduledValues(ctx.currentTime);
    lv.gain.gain.setValueAtTime(lv.g, ctx.currentTime);
    node.connect(lv.meter);
    node.connect(lv.gain);
    clearInterval(lv.timer);
    const kSlow = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_SLOW_S), kFast = 1 - Math.exp(-LEVEL_READ_MS / 1000 / LEVEL_FAST_S);
    let said = 0;
    lv.timer = setInterval(() => {
      if (!playing || !leg?.live || leg.st !== st) return;
      lv.meter.getFloatTimeDomainData(lv.buf);
      let s = 0; for (const v of lv.buf) s += v * v;
      const ms = s / lv.buf.length;
      lv.slow = lv.slow ? lv.slow + (ms - lv.slow) * kSlow : ms;
      lv.fast = lv.fast ? lv.fast + (ms - lv.fast) * kFast : ms;
      const rms = Math.sqrt(Math.max(lv.slow, lv.fast));
      if (rms < LEVEL_FLOOR) return;
      const g = Math.max(1, Math.min(LEVEL_MAX, LEVEL_RMS / rms));
      const tau = g < lv.g ? LEVEL_DOWN_S : LEVEL_UP_S / 3;
      lv.g = g;
      levels.set(st.id, g);
      lv.gain.gain.setTargetAtTime(g, ctx.currentTime, tau);
      const now = performance.now();
      if (now - said > 10000) { said = now; d.log(`${st.label} at ${(20 * Math.log10(rms)).toFixed(1)} dB RMS, raised ${(20 * Math.log10(g)).toFixed(1)} dB`); }
    }, LEVEL_READ_MS);
  }

  // ── the stream: opened on Play, closed on Stop and on a switch ───────────
  function open(st) {
    // One connection at a time, whatever called this.
    close();
    const url = srcOf(st);
    d.log(`opening ${url}`);
    const stream = createMp3Stream(ctx, { url, log: (m) => d.log(`${st.label}: ${m}`) });
    const me = { st, stream, live: false };
    leg = me;
    levelStart(st, stream.node);
    stream.started.then((path) => {
      if (leg !== me) return;
      me.live = true;
      d.log(`${st.label} playing, ${path}`);
      pb.refresh();
    }).catch((e) => { if (leg === me) d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'); });
  }
  function close() {
    if (!leg) return;
    const { st, stream } = leg;
    leg = null;
    try { stream.stop(); } catch { /* already stopped */ }
    try { stream.node.disconnect(); } catch { /* gone */ }
    if (lv) clearInterval(lv.timer);
    d.log(`${st.label} closed`);
  }

  // The sound follows the links the bay holds: the level node reaches the
  // speakers, the wave and the key detector each only along its own link.
  function route() {
    try { out.disconnect(); } catch { /* not connected */ }
    out.connect(tap);
    tap.connect(pull);
    if (holds(PLAYER_OUT, KEY_IN)) out.connect(key.an);
    if (holds(PLAYER_OUT, MIXER_DRY)) out.connect(dryG);
  }

  // The energy signal: the levelled RMS every 50 ms, eased up in about 80 ms and down in 400,
  // divided by ENERGY_REF (-16 dBFS, the levelling's aim), so 1 is ordinary loudness.
  // See lessons/page-radio.md#radio-32

  function energyStart() {
    clearInterval(energyTimer);
    energyEased = 0;
    energyTimer = setInterval(() => {
      if (!tap) return;
      tap.getFloatTimeDomainData(tapBuf);
      let ss = 0;
      for (const v of tapBuf) ss += v * v;
      const r = Math.sqrt(ss / tapBuf.length) / ENERGY_REF;
      const k = 1 - Math.exp(-ENERGY_MS / (r > energyEased ? 80 : 400));
      energyEased += (r - energyEased) * k;
      bay.send(ENERGY_OUT, { of: 'param', name: 'energy', v: +energyEased.toFixed(3) });
    }, ENERGY_MS);
  }
  function energyStop() {
    clearInterval(energyTimer); energyTimer = null;
    bay.send(ENERGY_OUT, { of: 'param', name: 'energy', v: null });
  }

  function play() {
    // A harness never opens a live stream: an ERR connection counts in a broadcaster's audience
    // figures and Ida's server is somebody else's, so under ?selfcheck=1 Play opens nothing.
    // See lessons/page-radio.md#radio-33
    if (SELFCHECK) { d.log('a self check is running, so no live stream is opened and nothing plays'); return; }
    sound();
    if (!out) {
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      out = ctx.createGain();
      tap = ctx.createAnalyser(); tap.fftSize = 2048; tapBuf = new Float32Array(tap.fftSize);
      key = keyBuild();
      levelBuild();
    }
    playing = true;
    face();
    keyStart();
    energyStart();
    reading = null; paintKey(null);
    autoReading = null; autoPreview();
    for (const k of ['key', 'conf', 'also']) keyPanel.values.set(k, '');
    route();
    // The press is the person asking to listen: only now does a stream open,
    // and only the one station picked.
    open(STATIONS[at]);
    pb.refresh();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    if (key) clearInterval(key.timer);
    energyStop();
    close();
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() { transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play'); }
  face();

  const top = el('div', 'cc-top');
  top.append(transport.el);
  // The mix knob, its own node: a turn is one event on its value-out.
  const MIX0 = 0.5;
  const knobs = new Map([['mix', createKnob({
    label: 'mix', min: 0, max: 1, step: 0.01, value: MIX0, hand: true,
    format: (v) => `${Math.round(v * 100)}%`,
    onInput: (v) => bay.send(KNOB_MIX, { of: 'param', name: 'mix', v }),
  })]]);

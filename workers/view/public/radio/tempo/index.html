<title>Tempo</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The detector's beats, drawn over the wave on the wave's own seconds: a
     canvas laid exactly on the scope's, so it moves nothing. */
  .cc-wave { position: relative; }
  /* The tempo scope: bpm up, time across, the full width of its panel and
     the wave's height (the scope's 150). It sits in a host as the wave does,
     because the panel stretches a canvas that is its direct child. */
  .cc-tempo { display: block; width: 100%; height: 150px; touch-action: pan-y; }
  /* Play on its own row: the button's own size, at the left. */
  .cc-top { display: flex; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount } from '/shell/shell.mjs';
  import { fromFirstFrame } from '/shell/mp3-frames.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createTempoRig } from '/radio/rig.mjs';

  // Recordings of Raadio 2, Raadio 4 and Ida from our R2 bucket (station worker /media/), played
  // into the wave, the speakers and a tempo detector whose readings travel on a `value` link.
  // Play fetches once and loops; nothing opens on a visit. `?src=<url>` plays another recording.
  // See lessons/page-radio.md#radio-55
  const MEDIA = 'https://positron-station.kristjan-jansen.workers.dev/media/';
  // Each station captured once, about three minutes through our relay, and kept in our bucket, so
  // nothing here ever reaches ERR's or Ida's servers. Ida is ADTS AAC, the others MP3;
  // decodeAudioData sniffs the bytes.
  // See lessons/page-radio.md#radio-56
  const STATIONS = [
    // Named as recordings, so none is taken for the live station; /radio/live/ keeps the plain names.
    // See lessons/page-radio.md#radio-57
    { id: 'raadio2', label: 'Raadio 2 recording', key: 'radio/raadio2/2026-10-11.mp3' },
    { id: 'raadio4', label: 'Raadio 4 recording', key: 'radio/raadio4/2026-10-11.mp3' },
    { id: 'ida', label: 'Ida recording', key: 'radio/ida/2026-10-11.aac' },
  ];
  const asked = new URLSearchParams(location.search).get('src');
  const srcOf = (st) => asked || `${MEDIA}${st.key}`;
  const S = 'web', CF = 'cf-r2';
  const FILE_OUT = (st) => `${CF}:${st.id}:file-out`;
  const PLAYER_IN = `${S}:player:file-in`, PLAYER_OUT = `${S}:player:audio-out`;

  // The bay: a recording is a file in the bucket, so `file-out` into a player in this tab, whose
  // `audio-out` feeds the wave, the speakers and the detector.
  // See lessons/page-radio.md#radio-58
  const bay = createBay();
  for (const st of STATIONS) {
    addNodes(bay, S, [{ name: 'recording', site: CF, as: st.id, label: st.label }],
      { ports: { [FILE_OUT(st)]: { label: 'recording', address: srcOf(st) } } });
  }
  addNodes(bay, S, ['player'], { ports: { [PLAYER_IN]: { label: 'player' }, [PLAYER_OUT]: { label: 'player' } } });
  // The wave, the detector, the tempo scope and the fx box are /radio/rig.mjs.

  const d = mount({ name: 'Tempo', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/tempo');

  let buffer = null, loading = null, fetchedAt = 0;
  const buffers = new Map();      // station id -> decoded recording
  let src = null;
  // The file wire is lit while the recording comes down and for 600 ms after;
  // the audio wires while it plays. The tempo wire pulses once per event.
  const rig = createTempoRig({ bay, d, site: S, stations: STATIONS, srcOf, playerOut: PLAYER_OUT,
    holdSources: (hold) => { for (const st of STATIONS) hold(FILE_OUT(st), PLAYER_IN); },
    flowing: (l, medium, playing) => {
      if (medium === 'file') return l.from === FILE_OUT(STATIONS[rig.at]) && (!!loading || (fetchedAt && performance.now() - fetchedAt < 600));
      if (medium === 'audio' && l.from.startsWith(CF)) return false;
      if (medium === 'audio') return playing && !!src;
      return false;
    },
    onChoose: (at) => { buffer = buffers.get(STATIONS[at].id) || null; },
    load,
    start: () => {
      src = rig.ctx.createBufferSource();
      src.buffer = buffer; src.loop = true;
      src.connect(rig.out);
      src.start();
    },
    stop: () => {
      if (src) { try { src.stop(); src.disconnect(); } catch { /* already stopped */ } }
      src = null;
    },
    demo: { bytes: () => bytes, duration: () => buffer?.duration ?? null },
  });

  // ── the recording: fetched once, decoded once, looped ────────────────────
  let bytes = 0;
  // Levelled per LEVEL_S block as decoded: raised (never lowered) toward LEVEL_RMS by at most
  // LEVEL_MAX_DB, eased across blocks, a tanh over KNEE. One gain per file was set by Ida's one loud
  // stretch and left its -44 dB music quiet.
  // See lessons/page-radio.md#radio-59
  const LEVEL_RMS = 10 ** (-16 / 20), LEVEL_S = 1, LEVEL_MAX_DB = 36, KNEE = 0.8;
  function level(b, st) {
    const sr = b.sampleRate, n = b.length, blk = Math.round(LEVEL_S * sr), nb = Math.ceil(n / blk);
    const chs = Array.from({ length: b.numberOfChannels }, (_, c) => b.getChannelData(c));
    const gdb = new Float32Array(nb);
    for (let k = 0; k < nb; k++) {
      let sum = 0, m = 0;
      for (const x of chs) for (let i = k * blk; i < Math.min(n, (k + 1) * blk); i += 2) { sum += x[i] * x[i]; m++; }
      const rms = Math.sqrt(sum / Math.max(1, m));
      gdb[k] = rms > 1e-6 ? Math.max(0, Math.min(LEVEL_MAX_DB, 20 * Math.log10(LEVEL_RMS / rms))) : 0;
    }
    // Ease: a block takes the smallest gain of itself and its two neighbours,
    // then a three block average, so the gain never rises into a loud block.
    const lo = gdb.map((g, k) => Math.min(g, gdb[k - 1] ?? g, gdb[k + 1] ?? g));
    const eased = lo.map((g, k) => ((lo[k - 1] ?? g) + g + (lo[k + 1] ?? g)) / 3);
    let raised = 0;
    for (let k = 0; k < nb; k++) raised += eased[k];
    if (raised / nb < 0.1) return;
    const room = 1 - KNEE;
    for (let i = 0; i < n; i++) {
      const pos = i / blk - 0.5, k0 = Math.max(0, Math.min(nb - 1, Math.floor(pos))), k1 = Math.min(nb - 1, k0 + 1);
      const f = Math.max(0, Math.min(1, pos - k0));
      const g = 10 ** ((eased[k0] * (1 - f) + eased[k1] * f) / 20);
      for (const x of chs) {
        const v = x[i] * g, a = v < 0 ? -v : v;
        x[i] = a <= KNEE ? v : Math.sign(v) * (KNEE + room * Math.tanh((a - KNEE) / room));
      }
    }
    d.log(`${st.label} levelled, raised ${(raised / nb).toFixed(1)} dB on average`);
  }
  function load() {
    const st = STATIONS[rig.at], url = srcOf(st);
    if (buffers.has(st.id)) { buffer = buffers.get(st.id); return Promise.resolve(buffer); }
    loading ??= (async () => {
      rig.pb.refresh();
      d.log(`fetching ${url}`);
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} from ${url}`);
      const ab = await r.arrayBuffer();
      bytes = ab.byteLength;
      // From the first frame: Safari answers `Decoding failed` on a recording
      // cut from a live mount mid frame (`fromFirstFrame` has the measurement).
      const b = await rig.ctx.decodeAudioData(fromFirstFrame(ab).buffer);
      level(b, st);
      buffers.set(st.id, b);
      if (STATIONS[rig.at] === st) buffer = b;
      d.log(`${st.label}: ${(bytes / 1e6).toFixed(2)} MB, ${b.duration.toFixed(1)} s`);
      return b;
    })().finally(() => { loading = null; fetchedAt = performance.now(); rig.pb.refresh(); });
    return loading;
  }
  d.ready();
</script>

<style>
  .cc-pic canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  /* inside the stage, which clips a ring drawn outside it */
  .cc-pic canvas:focus-visible { outline-offset: -1px; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';
  import { createMix, createTunerGraph, pinkNoise } from '/shell/tuner-mix.mjs';
  import { createEnvFollower } from '/shell/pappus-mod.mjs';
  import { LANES, LAYOUT_VERSION, MOD_FOLLOWERS, FOLLOWER_NAMES, createFeatures } from '/shell/radio-gran.mjs';
  import { createScanField, LOOKS, DEFAULT_LOOK, EXTRA, FIELD_W, FIELD_H, DATA_W, DATA_H, at, u8 } from '/shell/scan-field.mjs';
  import { WINDOW_S } from '/granulator/grain-rig.mjs';
  import { PATCHES, valuesOf, createRingEngine } from '/granulator/grain-ring.mjs';

  // Live stations through our relay, /radio/tuner/'s AM graph and the grain ring into /shader/landscape/.
  // A drift node on a clock tunes from one station to the next; the waves follow the tuner's noise.
  // Each ERR connection is a listener: at most two open, only after a press on the picture, all
  // closed on the next press or on leaving. The only controls are the picture and the patchbay.
  const params = new URLSearchParams(location.search);
  const BASE = params.get('base') || 'https://shout.positron.studio';
  const LOCAL = /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(BASE);
  const S = 'web';
  const d = mount({ name: 'Radio landscape', what: 'Press the picture to start or stop the radio.', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/scenery');

  // Every mount the relay carries for ERR and Ida (workers/shout/worker.mjs STATIONS), played in a
  // shuffled order, so no one mount is the one every visit opens.
  const STATIONS = [
    { key: 'viker', site: 'err', node: 'vikerraadio', mount: 'vikerraadio', label: 'Vikerraadio' },
    { key: 'klassika', site: 'err', node: 'klassikaraadio', mount: 'klassikaraadio', label: 'Klassikaraadio' },
    { key: 'r2', site: 'err', node: 'raadio2', mount: 'raadio2', label: 'Raadio 2' },
    { key: 'r4', site: 'err', node: 'raadio4', mount: 'raadio4', label: 'Raadio 4' },
    { key: 'tallinn', site: 'err', node: 'raadiotallinn', mount: 'raadiotallinn', label: 'Raadio Tallinn' },
    { key: 'ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', label: 'Ida Radio Tallinn' },
    { key: 'idahel', site: 'ida', node: 'helsinki', mount: 'ida-helsinki', label: 'Ida Radio Helsinki' },
  ];
  // Fisher-Yates over the whole list; a refill never opens with the station that just played.
  function shuffled(after = null) {
    const a = STATIONS.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    if (after && a[0] === after) [a[0], a[1]] = [a[1], a[0]];
    return a;
  }

  // ── the drift's clock ───────────────────────────────────────────────────
  // Two slots 0.08 apart on the dial, so halfway each station is a quarter clear under noise and
  // whistle: a blend, not a silence. The tuner rides between them; phases are read off the clock.
  const SLOTS = [{ at: 0.46, echo: 0.09 }, { at: 0.54, echo: 0.13 }];
  const num = (k, dflt) => { const v = Number(params.get(k)); return Number.isFinite(v) && v > 0 ? v : dflt; };
  const DWELL_S = num('dwell', SELFCHECK ? 5 : 40);   // one station, clear
  const BLEND_S = num('blend', SELFCHECK ? 6 : 16);   // leaving one, through noise, into the next
  const PREROLL_S = Math.min(DWELL_S / 2, 4);            // the arriving mount opens this early
  const CYCLE_S = DWELL_S + BLEND_S;
  const mix = createMix(SLOTS);
  // On a slot the tuner lets through 0.04 noise; halfway 0.04 + 0.26 * (1 - clear).
  const MID = 1 - mix((SLOTS[0].at + SLOTS[1].at) / 2).st[0].clear;
  const WET = 0.7;
  const TRAIL_S = 1.6, TRAIL_STORM_S = 5.0;

  // The landscape keeps its default look; only the storm moves it.
  const LOOK = LOOKS[DEFAULT_LOOK];
  const OPEN = { ...LOOK, ...EXTRA };
  // What the storm adds at its peak, on top of the calm look.
  const STORM = { ampM: (b) => Math.min(8, b * 1.5), swellY: (b) => Math.min(0.05, b + 0.03), heave: (b) => Math.min(1, b + 0.8) };

  // ── the bay ─────────────────────────────────────────────────────────────
  const outOf = (st) => `${st.site}:${st.node}:audio-out`;
  const relayIn = (st) => `cf-shout:${st.mount}:audio-in`, relayOut = (st) => `cf-shout:${st.mount}:audio-out`;
  const NOISE_OUT = `${S}:noise:audio-out`;
  const DRIFT_TUNE = `${S}:drift:value-out`, DRIFT_STORM = `${S}:drift:value-out-2`;
  const TUNER_IN = `${S}:tuner:audio-in`, TUNER_OUT = `${S}:tuner:audio-out`;
  const TUNER_TUNE = `${S}:tuner:value-in`, TUNER_EV = `${S}:tuner:value-out`;
  const PATCH_OUT = `${S}:patch:value-out`;
  const GRAINS_IN = `${S}:grains:audio-in`, GRAINS_OUT = `${S}:grains:audio-out`;
  const GRAINS_VAL = `${S}:grains:value-in`, GRAINS_EV = `${S}:grains:value-out`;
  const SPEAKER = `${S}:speaker:audio-in`;
  const SH_AUDIO = `${S}:shader:audio-in`, SH_VAL = `${S}:shader:value-in`, SH_OUT = `${S}:shader:video-out`;
  const SCREEN = `${S}:screen:video-in`;

  const bay = createBay();
  for (const st of STATIONS) {
    addNodes(bay, S, [{ name: 'station', site: st.site, as: st.node, label: st.label }],
      { ports: { [outOf(st)]: { label: st.label } } });
    addNodes(bay, S, [{ name: 'shout', as: st.mount }],
      { ports: { [relayIn(st)]: { label: 'relay' }, [relayOut(st)]: { label: 'relay', address: `${BASE}/${st.mount}` } } });
  }
  addNodes(bay, S, ['noise', 'drift', 'tuner', 'patch-values', { name: 'grains', label: 'granulator' }, 'speaker',
    'shader-landscape', 'screen'], {
    ports: {
      'noise:audio-out': { label: 'noise' },
      'drift:value-out': { label: 'tune' }, 'drift:value-out-2': { label: 'storm' },
      'tuner:audio-in': { label: 'tuner' }, 'tuner:audio-out': { label: 'tuner' },
      'tuner:value-in': { label: 'tune' }, 'tuner:value-out': { label: 'station' },
      'patch:value-out': { label: 'patch' },
      'grains:audio-in': { label: 'granulator' }, 'grains:audio-out': { label: 'granulator' },
      'grains:value-in': { label: 'patch' }, 'grains:value-out': { label: 'grains' },
      'speaker:audio-in': { label: 'speakers' },
      'shader:audio-in': { label: 'level' }, 'shader:value-in': { label: 'values' }, 'shader:video-out': { label: 'picture' },
      'screen:video-in': { label: 'picture' },
    },
    deliver: {
      'tuner:value-in': (e) => { if (e?.name === 'tune' && Number.isFinite(e.v)) { tune = e.v; applyTune(); } },
      'grains:value-in': (e) => patchIn(e),
      'shader:value-in': (e) => valueIn(e),
    },
  });
  function hold(a, b, opts) {
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // The sound and the picture follow the links the bay holds, read every time.
  const holds = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
  const sentOn = (a, b) => bay.links().find((l) => l.from === a && l.to === b)?.sent ?? 0;
  for (const st of STATIONS) {
    // Holding a link opens nothing. A stream opens only after a press on the picture, where a
    // person asks to listen, so the consent is named here.
    hold(outOf(st), relayIn(st), { consent: true, via: 'https' });
    hold(relayOut(st), TUNER_IN, { via: 'https' });
  }
  hold(NOISE_OUT, TUNER_IN);
  hold(DRIFT_TUNE, TUNER_TUNE);
  hold(DRIFT_STORM, SH_VAL);
  hold(TUNER_OUT, GRAINS_IN);
  hold(PATCH_OUT, GRAINS_VAL);
  hold(GRAINS_OUT, SPEAKER);
  // The picture hears the grains: across is where in the last eight seconds a grain read.
  hold(GRAINS_OUT, SH_AUDIO);
  hold(GRAINS_EV, SH_VAL);
  hold(TUNER_EV, SH_VAL);
  hold(SH_OUT, SCREEN);

  // ── the picture ─────────────────────────────────────────────────────────
  const canvas = el('canvas');
  canvas.width = FIELD_W; canvas.height = FIELD_H;
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
  const onAir = el('span', 'cc-say', '');
  const count = el('span', 'cc-say', '');
  const panel = createVideoPanel({ media: canvas, left: onAir });
  panel.el.classList.add('cc-pic');
  // The picture is the one control: a browser needs a press before sound, and this is it.
  canvas.tabIndex = 0;
  canvas.setAttribute('role', 'button');
  panel.el.querySelector('.pos-vp-r')?.prepend(count);
  let field = null, glErr = 0, frames = 0;
  if (gl) {
    try { field = createScanField(gl, { look: LOOK, live: true, canvas }); }
    catch (e) { d.log(`the picture did not compile: ${e.message}`, 'bad'); }
  } else d.log('this browser has no WebGL2, so there is no picture', 'bad');

  // ── what reaches the shader's value inlet: grains, the tuned station, the storm ─
  const seen = { grain: 0, tuned: 0, storm: 0 };
  const base = Object.fromEntries(Object.keys(STORM).map((n) => [n, OPEN[n]]));
  let storm = 0, jolt = 0;
  function shade(name) {
    const b = base[name];
    field?.set(name, STORM[name] ? b + (STORM[name](b) - b) * storm : b);
  }
  function valueIn(ev) {
    if (ev?.of === 'grain') { seen.grain++; bucket(ev); return; }
    // a station coming in tears the picture, as a station change does on /videoradio/
    if (ev?.of === 'tuned') { seen.tuned++; if (ev.station) jolt = 1; return; }
    if (ev?.of === 'storm' && Number.isFinite(ev.v)) { seen.storm++; storm = ev.v; for (const n of Object.keys(STORM)) shade(n); }
  }

  // ── the data texture, filled every frame as /shader/landscape/ fills it ─
  const data = new Uint8Array(DATA_W * DATA_H * 4);
  const buckets = Array.from({ length: DATA_W }, () => ({ n: 0, dsum: 0 }));
  function bucket(ev) {
    const x = Math.min(DATA_W - 1, Math.max(0, Math.floor((1 - ev.ago / WINDOW_S) * DATA_W)));
    const b = buckets[x];
    if (b.n >= 255) return;
    b.n++;
    b.dsum += LANES.size.unmap(Math.max(0, Number(ev.dur) || 0));
  }
  // where the grains read: `back` seconds behind the newest, give or take `jitter`
  function windowRow() {
    const v = valuesOf(PATCH);
    const centre = 1 - v.back / WINDOW_S, half = Math.max(1 / DATA_W, v.jitter / WINDOW_S);
    for (let x = 0; x < DATA_W; x++) {
      const u = Math.abs((x + 0.5) / DATA_W - centre) / half, i = at(x, 2);
      data[i] = u8(u >= 1 ? 0 : 1 - u * u); data[i + 1] = 255; data[i + 2] = 0; data[i + 3] = 255;
    }
    data[at(18, 3)] = 255;
  }
  let feats = null, follow = null;
  let pulse = 0, drift = 0, last = 0;
  function tick(now) {
    const dt = last ? Math.min(0.25, (now - last) / 1000) : 1 / 60;
    last = now;
    drift = (drift + dt * 0.06) % 1;
    jolt = Math.max(0, jolt - dt * 1.1);
    if (!playing || !feats) data.fill(0);
    else {
      let got = 0;
      for (let x = 0; x < DATA_W; x++) {
        const b = buckets[x], i = at(x, 0);
        data[i] = Math.min(255, b.n); data[i + 1] = b.n ? u8(b.dsum / b.n) : 0; data[i + 2] = 0; data[i + 3] = 0;
        got += b.n; b.n = 0; b.dsum = 0;
      }
      const f = feats.read();
      FOLLOWER_NAMES.forEach((n, i) => { follow[n].push(f[n] ?? 0, dt); data[at(i, 3)] = u8(follow[n].value()); });
      windowRow();
      data[at(6, 3)] = u8(WET);
      data[at(7, 3)] = Math.min(255, got);
      // The trail lengthens with the storm, so the picture smears while the stations cross.
      const tau = TRAIL_S + (TRAIL_STORM_S - TRAIL_S) * storm;
      data[at(16, 3)] = u8(Math.exp(-dt / tau));
      pulse = (pulse + got * 0.045) % 1;
      data[at(19, 3)] = u8(0.5 - 0.5 * Math.cos(pulse * Math.PI * 2));
    }
    data[at(20, 3)] = u8(jolt);
    data[at(21, 3)] = u8(drift);
    data[at(63, 3)] = LAYOUT_VERSION;
    // the screen shows the picture only while the shader holds its wire to it
    if (holds(SH_OUT, SCREEN)) { field.step(data); frames++; }
    if (!glErr) glErr = gl.getError();
  }
  let n = 0, since = 0;
  function frame(t) {
    tick(t);
    n++;
    if (!since) since = t;
    else if (t - since >= 1000) { count.textContent = `${(n * 1000 / (t - since)).toFixed(1)} fps`; n = 0; since = t; }
    requestAnimationFrame(frame);
  }
  if (field) requestAnimationFrame(frame);

  // ── the tuner: the drift's value arrives on tuner:value-in ──────────────
  let tune = SLOTS[0].at, tuned = null;
  const slotIn = [null, null];      // which station sits in each slot
  const tunedOf = (m) => { const i = m.st.findIndex((s) => s.clear > 0.5); return i < 0 ? null : slotIn[i]?.key ?? null; };
  function applyTune() {
    const m = mix(tune);
    if (graph) graph.apply(m, { whistle: true });
    const now = tunedOf(m);
    if (now !== tuned) {
      tuned = now;
      bay.send(TUNER_EV, { of: 'tuned', station: now, clear: +Math.max(...m.st.map((s) => s.clear)).toFixed(3) });
    }
  }

  // ── the streams: one open while a station plays, two while one arrives ──
  const legs = new Map();          // station key -> { stream, slot, live }
  const conns = { opened: 0, closed: 0, maxOpen: 0 };
  function openLeg(st, slot) {
    const stream = createMp3Stream(ctx, { url: `${BASE}/${st.mount}`, log: (m) => d.log(`${st.label}: ${m}`) });
    const leg = { st, stream, slot, live: false };
    legs.set(st.key, leg);
    conns.opened++; conns.maxOpen = Math.max(conns.maxOpen, legs.size);
    slotIn[slot] = st;
    stream.node.connect(graph.legs[slot].input);
    stream.started.then(() => { if (legs.get(st.key) === leg) { leg.live = true; pb.refresh(); } }).catch(() => {});
    pb.refresh();
    return leg;
  }
  function closeLeg(key) {
    const leg = legs.get(key);
    if (!leg) return;
    try { leg.stream.stop(); } catch { /* already stopped */ }
    legs.delete(key);
    conns.closed++;
    if (slotIn[leg.slot] === leg.st) slotIn[leg.slot] = null;
    pb.refresh();
  }

  // ── the drift: a clock moving the tuner, and the storm that follows the noise ─
  let cycleFrom = 0, from = 0, phase = 'off', driftTimer = 0, k = 0;
  // `cur` is on air, `queue` is the rest of this shuffle, `played` every station since the press.
  let cur = null, queue = [], order = [], played = [];
  const peek = () => { if (!queue.length) queue = shuffled(cur); return queue[0]; };
  const ease = (x) => x * x * (3 - 2 * x);
  function driftTick() {
    if (!playing) return;
    const t = (performance.now() - cycleFrom) / 1000;
    const to = 1 - from;
    const next = peek();
    if (t >= DWELL_S - PREROLL_S && !legs.has(next.key)) {
      openLeg(next, to);
      d.log(`${next.label} opening, ${cur.label} still on air`);
    }
    if (t < DWELL_S) { phase = 'dwell'; k = 0; return; }
    if (t < CYCLE_S) {
      phase = 'blend';
      k = (t - DWELL_S) / BLEND_S;
      const v = SLOTS[from].at + (SLOTS[to].at - SLOTS[from].at) * ease(k);
      bay.send(DRIFT_TUNE, { of: 'param', name: 'tune', v: +v.toFixed(5) });
      const m = mix(v);
      const s = Math.min(1, (1 - Math.max(...m.st.map((x) => x.clear))) / MID);
      bay.send(DRIFT_STORM, { of: 'storm', v: +s.toFixed(4) });
      return;
    }
    // landed: the leaving station closes, the arriving one plays, and the clock starts again
    bay.send(DRIFT_TUNE, { of: 'param', name: 'tune', v: SLOTS[to].at });
    bay.send(DRIFT_STORM, { of: 'storm', v: 0 });
    const left = cur;
    closeLeg(left.key);
    queue.shift(); cur = next; played.push(next.key);
    from = to; cycleFrom = performance.now(); phase = 'dwell'; k = 0;
    onAir.textContent = next.label;
    d.log(`${next.label} on air, ${left.label} closed`);
  }

  // ── the granulator's one patch, sent whole on patch -> grains when the engine is up ─
  const PATCH = PATCHES.find((p) => p.name === 'Cloud') ?? PATCHES[0];
  function patchIn(ev) {
    if (ev?.of !== 'patch' || !ev.set) return;
    if (eng) { engine.fixed(ev.set); engine.land(); d.log(`${ev.name}: ${PATCHES.find((p) => p.name === ev.name)?.says ?? ''}`); }
  }

  // ── the sound ───────────────────────────────────────────────────────────
  const engine = createRingEngine({ log: (m, k) => d.log(m, k) });
  let ctx = null, graph = null, toGrains = null, heard = null, heardBuf = null, noiseSrc = null;
  let eng = null, booting = null, playing = false;
  let pressedAt = 0, firstSoundMs = null, openOnPlay = 0;
  function route() {
    if (!ctx) return;
    for (const leg of legs.values()) {
      try { leg.stream.node.disconnect(); } catch { /* not connected */ }
      if (holds(outOf(leg.st), relayIn(leg.st)) && holds(relayOut(leg.st), TUNER_IN)) leg.stream.node.connect(graph.legs[leg.slot].input);
    }
    try { noiseSrc?.disconnect(); } catch { /* not connected */ }
    if (noiseSrc && holds(NOISE_OUT, TUNER_IN)) noiseSrc.connect(graph.noiseIn);
    try { graph.out.disconnect(); } catch { /* not connected */ }
    if (holds(TUNER_OUT, GRAINS_IN)) graph.out.connect(toGrains);
    if (eng) eng.out.gain.setTargetAtTime(holds(GRAINS_OUT, SPEAKER) && playing ? 0.9 : 0, ctx.currentTime, 0.02);
    applyTune();
  }
  function boot() {
    booting ??= (async () => {
      const grain = (g) => { if (playing) bay.send(GRAINS_EV, { of: 'grain', at: +ctx.currentTime.toFixed(4), ...g, ago: +g.ago.toFixed(3) }); };
      const e = await engine.boot({ ctx, input: toGrains, grain, log: (m, k) => d.log(m, k) });
      engine.knob('mix', WET);
      // the shader's audio inlet: an analyser on what the grains send out
      const an = ctx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.5;
      e.out.connect(an); e.out.connect(heard);
      const pull = ctx.createGain(); pull.gain.value = 0; an.connect(pull).connect(ctx.destination);
      feats = createFeatures(an, ctx.sampleRate);
      follow = Object.fromEntries(FOLLOWER_NAMES.map((k) => [k, createEnvFollower(MOD_FOLLOWERS[k])]));
      eng = e;
      bay.send(PATCH_OUT, { of: 'patch', name: PATCH.name, set: valuesOf(PATCH) });
      return e;
    })();
    booting.catch(() => { booting = null; eng = null; });
    return booting;
  }
  // When sound first reaches the speakers after a press, read off what the speakers get.
  function listen() {
    if (!playing || firstSoundMs !== null || !heard) return;
    heard.getFloatTimeDomainData(heardBuf);
    let s = 0; for (const v of heardBuf) s += v * v;
    if (Math.sqrt(s / heardBuf.length) > 0.003) { firstSoundMs = Math.round(performance.now() - pressedAt); d.log(`first sound ${firstSoundMs} ms after the press`); return; }
    requestAnimationFrame(listen);
  }
  async function play() {
    pressedAt = performance.now(); firstSoundMs = null;
    ctx ??= new AudioContext({ sampleRate: 48000 });
    ctx.resume();
    if (!graph) {
      graph = createTunerGraph(ctx, SLOTS);
      toGrains = ctx.createGain();
      heard = ctx.createAnalyser(); heard.fftSize = 2048; heardBuf = new Float32Array(heard.fftSize);
      const pull = ctx.createGain(); pull.gain.value = 0; heard.connect(pull).connect(ctx.destination);
    }
    playing = true; jolt = 1;
    noiseSrc = ctx.createBufferSource(); noiseSrc.buffer = pinkNoise(ctx); noiseSrc.loop = true; noiseSrc.start();
    // A fresh shuffle of every station on each press; the drift walks it in order.
    queue = shuffled(); order = queue.map((s) => s.key);
    cur = queue.shift(); played = [cur.key]; from = 0;
    tune = SLOTS[0].at; storm = 0;
    openLeg(cur, 0);
    openOnPlay = legs.size;
    onAir.textContent = cur.label;
    cycleFrom = performance.now(); phase = 'dwell';
    driftTimer = setInterval(driftTick, 50);
    face(); route();
    requestAnimationFrame(listen);
    const wasUp = !!eng;
    try { await boot(); } catch (e) { d.log(`the granulator did not come up: ${e?.message || e}`, 'bad'); stop(); return; }
    if (!playing) return;
    if (wasUp) engine.run(true);
    route();
    engine.fresh(); engine.land();
    pb.refresh();
  }
  function stop() {
    playing = false;
    clearInterval(driftTimer);
    for (const key of [...legs.keys()]) closeLeg(key);
    try { noiseSrc?.stop(); noiseSrc?.disconnect(); } catch { /* gone */ }
    noiseSrc = null;
    storm = 0; phase = 'off'; k = 0;
    for (const nm of Object.keys(STORM)) shade(nm);
    onAir.textContent = '';
    if (eng) engine.run(false);
    route(); pb.refresh(); face();
  }
  // Leaving the page closes every station connection.
  addEventListener('pagehide', () => { if (playing) stop(); });
  // A press on the picture, or Enter or Space while it has focus, starts and stops it.
  let starting = null;
  const toggle = () => { if (playing) stop(); else starting = play(); };
  canvas.addEventListener('click', toggle);
  canvas.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (!e.repeat) toggle();
  });
  function face() {
    canvas.setAttribute('aria-pressed', String(playing));
    canvas.setAttribute('aria-label', playing ? 'Radio landscape, playing. Press to stop' : 'Radio landscape. Press to play');
  }
  face();

  // A station's wires are lit while its stream is open; the tuner's and grains' while playing.
  const pb = createPatchbay(bay, {
    flowing: (l, medium) => {
      if (medium === 'audio') {
        const st = STATIONS.find((s) => outOf(s) === l.from || relayOut(s) === l.from);
        if (st) return !!legs.get(st.key)?.live;
        return playing && (l.from.startsWith(`${S}:grains:`) ? !!eng : true);
      }
      if (medium === 'video') return !!field;
      return false;
    },
  });

  d.stack.add(panel.el, pb.el);

  // ── read only, for a check over CDP ─────────────────────────────────────
  window.__demo.scenery = {
    bay, field: () => field, playing: () => playing, frames: () => frames, seen: () => ({ ...seen }),
    firstSoundMs: () => firstSoundMs, open: () => [...legs.keys()], conns: () => ({ ...conns, open: legs.size }),
    drift: () => ({ phase, k, tune, storm, onAir: cur?.key ?? null, tuned }), patch: () => PATCH.name,
    order: () => [...order], played: () => [...played],
    params: () => field?.params(), jolt: () => jolt, context: () => ctx, stop: () => stop(),
  };

  // ── the self check, only under ?selfcheck=1, and only against a stand-in ─
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const until = async (fn, ms) => { const t = performance.now(); while (!fn() && performance.now() - t < ms) await wait(50); return fn(); };
  const diff = (a, b) => { let s = 0; for (let i = 0; i < a.px.length; i += 4) s += Math.abs(a.px[i] - b.px[i]) + Math.abs(a.px[i + 1] - b.px[i + 1]) + Math.abs(a.px[i + 2] - b.px[i + 2]); return s / (a.px.length / 4) / 3; };
  async function check() {
    d.assert('a visit opened no audio context and no station', ctx === null && conns.opened === 0 && legs.size === 0);
    const want = [...STATIONS.flatMap((s) => [[outOf(s), relayIn(s)], [relayOut(s), TUNER_IN]]), [NOISE_OUT, TUNER_IN],
      [DRIFT_TUNE, TUNER_TUNE], [DRIFT_STORM, SH_VAL], [TUNER_OUT, GRAINS_IN], [PATCH_OUT, GRAINS_VAL], [GRAINS_OUT, SPEAKER],
      [GRAINS_OUT, SH_AUDIO], [GRAINS_EV, SH_VAL], [TUNER_EV, SH_VAL], [SH_OUT, SCREEN]];
    const missing = want.filter(([a, b]) => !holds(a, b));
    d.assert('the patch holds every link: stations through the relay to the tuner, drift to tuner and shader',
      !missing.length, missing.length ? `missing ${missing.map((w) => w.join(' -> ')).join(', ')}` : `${want.length} links`);
    if (field) {
      await wait(400);
      d.assert('the standby picture draws before the press, with no GL error', frames > 10 && glErr === 0, `${frames} frames, gl.getError ${glErr}`);
    }
    const mid = mix((SLOTS[0].at + SLOTS[1].at) / 2), on = mix(SLOTS[0].at);
    d.assert('halfway is a blend under noise and whistle, on a slot it is clear',
      mid.st.every((s) => s.clear > 0.15 && s.clear < 0.5) && mid.noise > 0.2 && mid.whistle > 0.02 && on.st[0].clear > 0.99 && on.noise < 0.05,
      `halfway clear ${mid.st.map((s) => s.clear.toFixed(2)).join(' and ')}, noise ${mid.noise.toFixed(2)}, whistle ${mid.whistle.toFixed(3)}`);
    // The shuffle, with no station opened: every order holds each station once, orders differ,
    // and a refill never starts with the station that just played.
    const keys = STATIONS.map((s) => s.key).sort().join();
    const orders = Array.from({ length: 40 }, () => shuffled());
    const seams = STATIONS.flatMap((s) => Array.from({ length: 30 }, () => shuffled(s)[0] === s)).filter(Boolean).length;
    d.assert('a shuffle holds every station once, shuffles differ, and a refill never repeats the last station',
      orders.every((o) => o.map((s) => s.key).sort().join() === keys) && new Set(orders.map((o) => o.map((s) => s.key).join())).size > 20 && seams === 0,
      `${STATIONS.length} stations, ${new Set(orders.map((o) => o.map((s) => s.key).join())).size} distinct orders of 40, ${seams} repeats at a seam of ${STATIONS.length * 30}`);
    d.assert('the picture is the control: focusable, a button, named', canvas.tabIndex === 0 && canvas.getAttribute('role') === 'button'
      && /press to play/i.test(canvas.getAttribute('aria-label') || '') && !document.querySelector('.pos-controls button, .pos-knob, .pos-pick'),
      canvas.getAttribute('aria-label'));
    if (!LOCAL) { d.log('the self check plays only against a stand-in: add ?base=http://127.0.0.1:8899 (node demo/fake-station.mjs)', 'warn'); return; }

    // The real gesture: a click on the picture.
    canvas.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await starting;
    await until(() => firstSoundMs !== null, 4000);
    d.assert('sound reaches the speakers within 3 s of a press on the picture', firstSoundMs !== null && firstSoundMs <= 3000, `${firstSoundMs ?? 'none'} ms`);
    d.assert('the press opened one station, the first of a fresh shuffle', openOnPlay === 1 && order.length === STATIONS.length && cur?.key === order[0],
      `${cur?.label}, ${openOnPlay} open, order ${order.join(' ')}`);
    d.assert('the granulator took its one patch over its wire', sentOn(PATCH_OUT, GRAINS_VAL) >= 1
      && Math.abs((await engine.read('size')) - valuesOf(PATCH).size) < 1e-3, `${PATCH.name}, ${sentOn(PATCH_OUT, GRAINS_VAL)} sent`);
    if (!eng) return;
    await wait(1200);
    const g0 = sentOn(GRAINS_EV, SH_VAL);
    await wait(800);
    d.assert('the grains reach the shader over their wire', sentOn(GRAINS_EV, SH_VAL) - g0 > 5, `${sentOn(GRAINS_EV, SH_VAL) - g0} in 0.8 s`);

    // One whole cycle: the drift moves the tuner, the storm rises and falls, the station changes.
    const first = cur.key, n0 = played.length;
    const t0 = sentOn(DRIFT_TUNE, TUNER_TUNE), s0 = sentOn(DRIFT_STORM, SH_VAL), j0 = seen.tuned;
    // The calm height is the look's own; the storm only adds to it.
    const calmAmp = base.ampM;
    let maxOpen = 0, peak = 0, peakAmp = 0, waves = null, tore = 0;
    const end = performance.now() + (CYCLE_S + 2) * 1000;
    while (performance.now() < end && played.length === n0) {
      maxOpen = Math.max(maxOpen, legs.size);
      if (peak > 0.5) tore = Math.max(tore, jolt);
      if (storm > peak) { peak = storm; peakAmp = field?.params().ampM ?? 0; }
      // The same grains drawn twice from black, once with the storm's values and once calm.
      if (field && !waves && storm > 0.9) {
        const held = new Uint8Array(data);
        const a = field.testFinal(held);
        for (const nm of Object.keys(STORM)) field.set(nm, base[nm]);
        const b = field.testFinal(held);
        for (const nm of Object.keys(STORM)) shade(nm);
        waves = { change: diff(a, b), lit: [b, a].map((p) => { let n = 0; for (let i = 0; i < p.px.length; i += 4) if (p.px[i] + p.px[i + 1] + p.px[i + 2] > 60) n++; return n / (p.px.length / 4); }) };
      }
      await wait(50);
    }
    await wait(150);
    const now = cur.key;
    d.assert('the drift tunes the tuner over its wire, and the next station in the shuffle comes in', sentOn(DRIFT_TUNE, TUNER_TUNE) - t0 > 20
      && now !== first && now === order[1] && tuned === now,
      `${sentOn(DRIFT_TUNE, TUNER_TUNE) - t0} tune events, ${first} to ${now}, tuned ${tuned}`);
    d.assert('at most two stations were open at once, and one is open after the blend',
      maxOpen <= 2 && legs.size === 1 && conns.opened === 2 && conns.closed === 1, `max ${maxOpen}, now ${legs.size}, opened ${conns.opened}, closed ${conns.closed}`);
    d.assert('the storm rises to its peak between stations and falls back on the next', peak > 0.9 && storm === 0 && sentOn(DRIFT_STORM, SH_VAL) > s0 + 20,
      `peak ${peak.toFixed(2)}, now ${storm}, ${sentOn(DRIFT_STORM, SH_VAL) - s0} storm events`);
    if (field) {
      const nowAmp = field.params().ampM;
      d.assert('the waves grow with the storm and settle after', peakAmp > calmAmp * 1.4 && Math.abs(nowAmp - calmAmp) < 1e-6,
        `height ${calmAmp.toFixed(2)} calm, ${peakAmp.toFixed(2)} at the peak, ${nowAmp.toFixed(2)} after`);
      d.assert('the storm draws a different picture from the same grains', !!waves && waves.change > 1,
        waves ? `mean change ${waves.change.toFixed(2)} of 255, lit ${(waves.lit[0] * 100).toFixed(1)}% calm, ${(waves.lit[1] * 100).toFixed(1)}% in the storm` : 'never sampled');
    }
    d.assert('the tuner told the shader the station came in, and the picture tore', seen.tuned > j0 && tore > 0.8,
      `${seen.tuned - j0} tuned events, jolt up to ${tore.toFixed(2)}`);

    // Stop from the keyboard: Space on the focused picture.
    canvas.focus();
    canvas.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }));
    d.assert('Space on the picture stopped it and closed every station it opened', !playing && legs.size === 0 && conns.opened === conns.closed
      && canvas.getAttribute('aria-pressed') === 'false', `opened ${conns.opened}, closed ${conns.closed}, played ${played.join(' ')}`);
  }
  if (SELFCHECK) { try { await check(); } catch (e) { d.assert('the self check ran to the end', false, String(e?.stack || e)); } }
  d.ready();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="Listen to Vikerraadio and Ida Radio Tallinn live and blend between them on a crossfader.">
<meta property="og:url" content="https://positron.studio/radio/blend/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">

<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Radio</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Two pictures side by side, each half the content width; one under the other on a phone. As /synth/dots/. */
  .cc-pair { display: flex; gap: 12px; align-items: flex-start; }
  .cc-pair > * { flex: 1 1 0; min-width: 0; }
  /* In a column a 0 basis is a 0 height, so on a phone each panel takes its own height. */
  @media (max-width: 560px) { .cc-pair { flex-direction: column; align-items: stretch; } .cc-pair > * { flex: none; } }
  /* Play on its own row: the button's own size, at the left. A flex row
     blockifies it, so it sits on no text line. */
  .cc-top { display: flex; }
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createSlider } from '/shell/slider.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createMp3Stream } from '/shell/mp3-stream.mjs';

  // One ERR and one Ida station, each an external site, through our relay (`cf-shout`, one
  // upstream per mount) into a crossfader and the speakers; `?base=` points at fake-station.mjs.
  // Nothing opens on a visit: no AudioContext and no fetch to a station until play.
  // See lessons/page-radio.md#radio-1
  const BASE = new URLSearchParams(location.search).get('base') || 'https://shout.positron.studio';
  const S = 'web';
  const STATIONS = [
    { key: 'err', site: 'err', node: 'vikerraadio', mount: 'vikerraadio', name: 'ERR Vikerraadio', label: 'Vikerraadio', kbps: 128 },
    { key: 'ida', site: 'ida', node: 'tallinn', mount: 'ida-tallinn', name: 'Ida Tallinn', label: 'Ida Radio Tallinn', kbps: 320 },
  ];
  const outOf = (st) => `${st.site}:${st.node}:audio-out`;
  // The relay is a hop of its own: it holds the one connection to the station
  // and every tab reads the relay, so the station's link ends there.
  const relayIn = (st) => `cf-shout:${st.mount}:audio-in`, relayOut = (st) => `cf-shout:${st.mount}:audio-out`;
  // Each station's wave is its own node, fed from the relay before the fader.
  const waveIn = (st) => `${S}:wave-${st.key}:audio-in`;
  const FADER_IN = `${S}:fader:audio-in`, FADER_OUT = `${S}:fader:audio-out`, SPEAKER_IN = `${S}:speaker:audio-in`;

  // ── the bay ─────────────────────────────────────────────────────────────
  const bay = createBay();
  for (const st of STATIONS) {
    addNodes(bay, S, [{ name: 'station', site: st.site, as: st.node, label: st.label }],
      { ports: { [outOf(st)]: { label: st.label } } });
    addNodes(bay, S, [{ name: 'shout', as: st.mount }],
      { ports: { [relayIn(st)]: { label: 'relay' }, [relayOut(st)]: { label: 'relay', address: `${BASE}/${st.mount}` } } });
    addNodes(bay, S, [{ name: 'wave', as: `wave-${st.key}`, label: `${st.key === 'err' ? 'ERR' : 'Ida'} wave` }],
      { ports: { [waveIn(st)]: { label: 'wave' } } });
  }
  addNodes(bay, S, ['blend-fader', 'speaker'], { ports: {
    [FADER_IN]: { label: 'crossfader' }, [FADER_OUT]: { label: 'crossfader' }, [SPEAKER_IN]: { label: 'speakers' } } });

  const d = mount({ name: 'Blend', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('radio/blend');

  // ── the sound: two streams, two gains, one AudioContext ──────────────────
  let ctx = null, sum = null, pull = null;
  const legs = new Map();          // key -> { stream, gain, tap, buf, live }
  let x = 0.5;                     // 0 is all ERR, 1 is all Ida
  const gains = () => [Math.cos(x * Math.PI / 2), Math.sin(x * Math.PI / 2)];   // equal power
  function applyFade() {
    if (!ctx) return;
    const t = ctx.currentTime, g = gains();
    STATIONS.forEach((st, i) => legs.get(st.key)?.gain.gain.setTargetAtTime(g[i], t, 0.02));
  }

  // ── the links ───────────────────────────────────────────────────────────
  const held = new Map();          // "from to" -> link id
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }

  hold(FADER_OUT, SPEAKER_IN);
  // The patch is held from load so the picture never changes. Holding a link opens nothing; the
  // streams open only on play, so the station link's `consent: true` is named here.
  // See lessons/page-radio.md#radio-2
  for (const st of STATIONS) {
    hold(outOf(st), relayIn(st), { consent: true, via: 'https' });
    hold(relayOut(st), FADER_IN, { via: 'https' });
    hold(relayOut(st), waveIn(st), { via: 'https' });
  }

  const pb = createPatchbay(bay, {
    flowing: (l) => {
      if (l.from === FADER_OUT) return [...legs.values()].some((g) => g.live);
      const st = STATIONS.find((s) => outOf(s) === l.from || relayOut(s) === l.from);
      return !!(st && legs.get(st.key)?.live);
    },
  });

  // ── the pictures: the kit's live wave in a video panel per station ───────
  const scopes = new Map();
  const panels = STATIONS.map((st) => {
    const host = el('div', 'cc-wave');
    const scope = createGrainScope(host, { seconds: 4, height: 150, fullScale: 1 });
    scopes.set(st.key, scope);
    // The rate at the right, beside the full-screen button.
    const p = createVideoPanel({ media: host, aspect: 'auto', right: false, left: el('span', 'cc-say', st.name) });
    p.el.querySelector('.pos-vp-r').prepend(el('span', 'cc-say', `${st.kbps} kbit/s`));
    return p;
  });
  const pair = el('div', 'cc-pair');
  pair.append(...panels.map((p) => p.el));

  // The sound follows the bay's links: relay to fader, relay to wave, fader to speaker. Unlink one
  // and that edge goes quiet.
  // See lessons/page-radio.md#radio-3
  const holds = (a, b) => held.has(`${a} ${b}`);
  function route() {
    if (!ctx) return;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (!g) continue;
      try { g.tap.disconnect(); } catch { /* not connected */ }
      g.tap.connect(pull);
      if (holds(relayOut(st), FADER_IN)) g.tap.connect(g.gain);
      g.wave = holds(relayOut(st), waveIn(st));
    }
    try { sum.disconnect(); } catch { /* not connected */ }
    if (holds(FADER_OUT, SPEAKER_IN)) sum.connect(ctx.destination);
  }

  function frame() {
    if (!legs.size) return;
    for (const [key, g] of legs) {
      if (!g.live || !g.wave) continue;
      g.tap.getFloatTimeDomainData(g.buf);
      scopes.get(key).feed(g.buf, ctx.sampleRate);
    }
    requestAnimationFrame(frame);
  }

  // ── play and stop ───────────────────────────────────────────────────────
  let playing = false;
  function play() {
    ctx ??= new AudioContext();
    ctx.resume();
    if (!sum) {
      sum = ctx.createGain();
      // A silent sink that keeps every tap pulled, so a wave reads its station
      // whether or not that station reaches the fader.
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
    }
    playing = true;
    for (const st of STATIONS) {
      // The press is the person asking to listen, so the link carries consent.
      // The relay fetches the station; the page reads the relay, into the
      // fader and into the station's own wave.
      if (!hold(outOf(st), relayIn(st), { consent: true, via: 'https' })) continue;
      hold(relayOut(st), FADER_IN, { via: 'https' });
      hold(relayOut(st), waveIn(st), { via: 'https' });
      const gain = ctx.createGain(), tap = ctx.createAnalyser();
      tap.fftSize = 2048;
      const stream = createMp3Stream(ctx, { url: `${BASE}/${st.mount}`, log: (m) => d.log(`${st.label}: ${m}`) });
      // Through the tap, not beside it: an analyser nothing pulls from reads
      // silence, so the sound passes it on its way to the fader, as on /archive/radio/.
      // The tap -> gain -> fader edge is made by route(), from the bay's links.
      stream.node.connect(tap);
      gain.connect(sum);
      const leg = { stream, gain, tap, buf: new Float32Array(tap.fftSize), live: false };
      legs.set(st.key, leg);
      stream.started.then((path) => {
        if (legs.get(st.key) !== leg) return;
        leg.live = true;
        d.log(`${st.label} playing, ${path}`);
      }).catch((e) => d.log(`${st.label} did not start: ${e?.message || e}`, 'warn'));
    }
    applyFade();
    route();
    pb.refresh();
    face();
    requestAnimationFrame(frame);
  }
  function stop() {
    playing = false;
    for (const st of STATIONS) {
      const g = legs.get(st.key);
      if (g) { try { g.stream.stop(); } catch { /* already stopped */ } try { g.gain.disconnect(); } catch { /* gone */ } }
    }
    legs.clear();
    pb.refresh();
    face();
  }

  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (playing ? stop() : play()) },
  ] });
  function face() {
    transport.setIcon('play', playing ? 'stop' : 'play', playing ? 'stop' : 'play');
  }
  face();

  // The crossfader, its two stations named inside the lane (the kit's `ends`).
  const fader = createSlider({ label: '', aria: 'crossfade', min: 0, max: 1, step: 0.01, value: x,
    ends: ['ERR', 'Ida'], onInput: (v) => { x = v; applyFade(); } });

  // Play on its own row, top left under the title.
  const top = el('div', 'cc-top');
  top.append(transport.el);
  // Blocks in the shell's stack, at the shell's gap.
  d.stack.add(top, pair, fader.el, pb.el);
  d.ready();
</script>

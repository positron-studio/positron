<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">
<meta property="og:title" content="Newsreels">
<meta property="og:description" content="ERR&apos;s 1965 newsreels on a line, each silent film played with that day&apos;s surviving radio.">
<meta property="og:url" content="https://positron.studio/history/newsreels/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="positron.studio: Connect anything to everything. Create playful, interactive worlds, from the web up to the cloud and down to microcontrollers.">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Newsreels</title>
<link rel="stylesheet" href="/shell/shell.css">
<script src="/proto/remixer/hls.min.js"></script>
<style>
  /* The film fills a 4:3 panel and the video covers it: AK filmikroonika is 4:3, so a
     16:9 encode with side bars crops to exactly the picture. Rests on that geometry, not
     on a measurement off ERR. (0,2,1) beats the panel's own (0,1,1) contain.
     See lessons/page-history.md#history-1 */
  .pos-vp-stage > video.ar-film { object-fit: cover; }
  /* Full screen shows the same crop: the stage takes the screen's shape, so the video
     stays a 4:3 box, as large as fits, centred, instead of cover (which shows the bars).
     See lessons/page-history.md#history-2 */
  .pos-vp[data-full] .pos-vp-stage { container-type: size; display: grid; place-items: center; }
  .pos-vp[data-full] .pos-vp-stage > video.ar-film { width: min(100cqw, 133.333cqh); height: min(100cqh, 75cqw); }
</style>

<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { ifSelfcheck, SELFCHECK } from '/shell/selfcheck.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { createReelLine, YEAR_FROM, YEAR_TO, ARHIIV, iso, sentenceCase } from '/shell/reel-line.mjs';

  // /reel/ as a concept page: a day's newsreel and radio as two bay boxes on
  // demo/shell/reel-line.mjs. Nothing opens on a visit and a check never reaches ERR:
  // every archive URL goes through `reachERR`; `?base=` points at demo/fake-arhiiv.mjs.
  // See lessons/page-history.md#history-3
  const BASE = new URLSearchParams(location.search).get('base') || ARHIIV;
  let errOpens = 0;
  const reachERR = (url) => { errOpens += 1; return url; };
  // /reel/'s gate, for /reel/'s measured reason: Chrome answers "maybe" to
  // canPlayType for HLS and then never joins the separate audio group.
  const NATIVE_HLS = 'ManagedMediaSource' in window
    && !!document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

  const d = mount({ name: 'Newsreels', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('history/newsreels');

  // Two `external` sources (film and radio archive), so their links need `consent: true`;
  // holding a link opens nothing. The timeline is its own box: `value` wires to picture
  // and speakers, and `clock` wires leave the picture (`mediaMaster`), which radio follows.
  // See lessons/page-history.md#history-4
  const S = 'web';
  const REEL_OUT = 'err:newsreel:video-out', RADIO_OUT = 'err:radio:audio-out';
  const SCREEN_IN = `${S}:screen:video-in`, SPEAKER_IN = `${S}:speaker:audio-in`;
  const DAY_OUT = `${S}:timeline:value-out`, PLAYHEAD_IN = `${S}:timeline:clock-in`;
  const REEL_DAY = `${S}:screen:value-in`, RADIO_DAY = `${S}:speaker:value-in`;
  const PICTURE_CLOCK = `${S}:screen:clock-out`, SPEAKER_CLOCK = `${S}:speaker:clock-in`;
  const bay = createBay();
  addNodes(bay, S, ['newsreel', 'err-radio', 'screen', 'speaker', 'timeline'], {
    ports: {
      [REEL_OUT]: { label: 'newsreel' }, [RADIO_OUT]: { label: 'radio' },
      [SCREEN_IN]: { label: 'picture' }, [REEL_DAY]: { label: 'day' }, [PICTURE_CLOCK]: { label: 'position' },
      [SPEAKER_IN]: { label: 'speakers' }, [RADIO_DAY]: { label: 'day' }, [SPEAKER_CLOCK]: { label: 'sync' },
      [DAY_OUT]: { label: 'day' }, [PLAYHEAD_IN]: { label: 'playhead' },
    },
  });

  const held = new Map();
  function hold(a, b, opts) {
    const k = `${a} ${b}`;
    if (held.has(k)) return true;
    bay.seen(a); bay.seen(b);
    const r = bay.link(a, b, [], { site: S, ...opts });
    if (r.ok) { held.set(k, r.id); return true; }
    d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    return false;
  }
  hold(REEL_OUT, SCREEN_IN, { consent: true, via: 'https' });
  hold(RADIO_OUT, SPEAKER_IN, { consent: true, via: 'https' });
  hold(DAY_OUT, REEL_DAY);
  hold(DAY_OUT, RADIO_DAY);
  hold(PICTURE_CLOCK, PLAYHEAD_IN);
  hold(PICTURE_CLOCK, SPEAKER_CLOCK);

  // ── the panel ───────────────────────────────────────────────────────────
  const film = el('video', 'ar-film', null, { playsinline: '' });
  // The radio, hidden and driven: the picture is the player and the sound
  // follows it. A day with no film plays its radio in the picture's own
  // element, so the panel's controls are still real controls (as on /reel/).
  const wireless = el('audio');
  wireless.hidden = true;
  const hasSound = () => !!(wireless.getAttribute('src') || aHls);
  let hls = null, aHls = null, opened = null, muted = false, pb = null;
  const going = () => !!opened && (!film.paused || (hasSound() && !wireless.paused));

  // The kit's video panel, 4:3 for the crop above. Its footer holds mute left of full
  // screen and nothing else; play is on the transport bar. `fullMode: 'footer'` and
  // `under` keep the footer, bar and line usable while full.
  // See lessons/page-history.md#history-5
  const muteBtn = createIconButton({ icon: 'volume', label: 'mute', onPress: () => setMuted(!muted) });
  const lineHost = el('div');
  const panel = createVideoPanel({ media: film, left: null, aspect: '4 / 3', fullMode: 'footer', onFull: () => face() });
  panel.slots.right.prepend(muteBtn.el);
  panel.stage.append(wireless);

  function setMuted(m) {
    muted = !!m;
    film.muted = muted;
    wireless.muted = muted;
    face();
  }
  function face() {
    muteBtn.set(muted ? 'mute' : 'volume', muted ? 'unmute' : 'mute');
    pb?.refresh();
  }

  // ── the line ────────────────────────────────────────────────────────────
  // /reel/'s line, the same module: a press on a mark plays it, a scrub that
  // comes to rest keeps going if something was going and otherwise only picks.
  const line = createReelLine({
    onPress: (it) => play(it),
    onLand: (it) => { if (going()) play(it); else select(it); },
  });
  const deck = line.deck;
  // The transport bar glued to the line: play/pause, and ‹ › step one broadcast day via
  // reel-line's `next`. No clock, slider or loop. The line mounts after the bar.
  // See lessons/page-history.md#history-6
  const bar = createTransportBar(lineHost, deck, {
    scrub: false, time: false, loop: false, command: {
      play: () => command.play(), pause: () => command.pause(),
    },
    extras: [
      { id: 'prev', label: '‹', aria: 'the broadcast day before this one', onClick: () => step(-1) },
      { id: 'next', label: '›', aria: 'the broadcast day after this one', onClick: () => step(+1) },
    ],
  });
  // No footer under the line: the strip's tooltip says the same on hover.
  // See lessons/page-history.md#history-7
  const view = line.mount(lineHost, { footer: false });
  lineHost.append(createGlue(bar.el, view.surface));
  // The picture is the master and the year follows it, as on /reel/.
  // See lessons/page-history.md#history-8
  const master = mediaMaster(deck, film, { anchorMs: () => (line.current ? line.current.at : YEAR_FROM) });

  pb = createPatchbay(bay, {
    flowing: (l) => {
      if (!opened) return false;
      const { picture, sound } = line.halves;
      if (l.from === REEL_OUT) return !!picture && !film.paused;
      if (l.from === RADIO_OUT) return !!sound && (picture ? !wireless.paused : !film.paused);
      if (l.from === PICTURE_CLOCK) return !film.paused && (l.to === PLAYHEAD_IN || hasSound());
      return false;
    },
  });

  // ── picking a day, and opening one ──────────────────────────────────────
  // /reel/'s split: picking is free and opens nothing; `play` is the only
  // thing that reaches for the archive, and only a press calls it.
  function select(it, { empty = true } = {}) {
    close(empty);
    const halves = line.pick(it);
    // The day leaves the timeline for both archives: one pulse on each wire.
    if (it) bay.send(DAY_OUT, { of: 'param', name: 'day', v: it.date });
    return halves;
  }
  // ‹ and ›: a day while something plays plays it, otherwise only picks it
  // (/reel/'s `step`): walking the year opens nothing.
  function step(by) {
    const next = line.next(by);
    if (!next) return;
    if (going()) play(next); else select(next);
  }
  function close(empty = true) {
    opened = null;
    film.pause(); wireless.pause();
    if (hls) { hls.destroy(); hls = null; }
    if (aHls) { aHls.destroy(); aHls = null; }
    wireless.removeAttribute('src'); wireless.load();
    if (empty) { film.removeAttribute('src'); film.load(); }
    face();
  }
  const attach = (media, url, isFilm) => {
    if (NATIVE_HLS || !window.Hls || !window.Hls.isSupported()) { media.src = reachERR(url); return true; }
    const h = new window.Hls({ enableWorker: true });
    h.loadSource(reachERR(url)); h.attachMedia(media);
    if (isFilm) hls = h; else aHls = h;
    return true;
  };

  // STREAMS, STORES NOTHING, exactly as /reel/: one content GET for the media
  // url, then the element is given it.
  async function play(it) {
    // Bless the element inside the gesture, before anything is awaited.
    (it.kind === 'audio' ? wireless : film).play().catch(() => {});
    const { picture, sound } = select(it, { empty: false });
    const streamOf = async (item, kind) => {
      try {
        const r = await fetch(reachERR(`${BASE}/api/v1/content/${kind}/${encodeURIComponent(item.slug)}`));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        const raw = (j?.data?.media || j?.media)?.src?.hls;
        if (!raw) { d.log(`${item.slug}: no stream offered`, 'bad'); return null; }
        return raw.startsWith('//') ? `https:${raw}` : raw;
      } catch (e) {
        d.log(`could not ask the archive for ${item.slug}: ${e.message}`, 'bad');
        return null;
      }
    };
    const src = picture ? await streamOf(picture, 'video') : null;
    if (picture && !src) { close(); return; }
    const su = sound ? await streamOf(sound, 'audio') : null;
    if (!picture) {
      if (!su) { close(); return; }
      attach(film, su, true);
      opened = it;
      film.muted = muted;
      await film.play().catch(() => {});
      d.log(`playing the radio of ${sound.date}: ${sentenceCase(sound.title).slice(0, 40)}`, 'hi');
      face();
      return;
    }
    if (su) { attach(wireless, su, false); wireless.muted = muted; wireless.play().catch(() => {}); }
    attach(film, src, true);
    opened = it;
    film.muted = muted;
    try { await film.play(); } catch {
      // A browser may still refuse sound; a muted picture beats none, and the
      // mute button is then the way to the sound.
      setMuted(true);
      await film.play().catch(() => {});
      d.log('the browser refused sound. Press the speaker to hear it', 'bad');
    }
    d.log(`playing the newsreel of ${picture.date}${su ? ' with that day\'s radio' : ', silent: no radio survives from this day'}`, 'hi');
    face();
  }

  // The picture drives the sound, as on /reel/: start and stop together, and a seek takes
  // the radio to the same offset where it is long enough.
  // See lessons/page-history.md#history-9
  const follow = () => {
    if (hasSound()) { if (film.paused) wireless.pause(); else wireless.play().catch(() => {}); }
    face();
  };
  film.addEventListener('play', () => { if (!deck.playing()) deck.play(); follow(); });
  film.addEventListener('pause', () => { if (deck.playing()) deck.pause(); follow(); });
  film.addEventListener('seeked', () => {
    if (!hasSound()) return;
    const t = film.currentTime;
    if (Number.isFinite(wireless.duration) && t <= wireless.duration
        && Math.abs(wireless.currentTime - t) > 0.25) wireless.currentTime = t;
  });
  film.addEventListener('loadedmetadata', () => {
    const it = line.halves.picture;
    if (!it || opened == null || !Number.isFinite(film.duration)) return;
    it.playedMs = Math.round(film.duration * 1000);
    line.gutters();
  });

  // The bar's play and pause. Nothing picked: the first mark from the
  // playhead, and under `?selfcheck=1` only picked, never opened (/reel/'s rule
  // for a harness press).
  const command = {
    play: () => {
      const current = line.current;
      if (!current) {
        const first = line.firstFromPlayhead();
        if (!first) { d.log('nothing to play yet, the archive list has not arrived'); return; }
        if (SELFCHECK) {
          select(first);
          d.log(`picked the first mark, ${first.date}, and opened nothing: a check never reaches ERR`);
          return;
        }
        play(first);
        return;
      }
      if (opened !== current) { play(current); return; }
      film.play().catch(() => {});
      if (hasSound() && wireless.paused) wireless.play().catch(() => {});
      face();
    },
    pause: () => { film.pause(); if (hasSound()) wireless.pause(); deck.pause(); face(); },
  };

  d.stack.add(panel.el, lineHost, pb.el);
  // After the stack has it, so the panel knows where to put it back (`under`
  // records the node's home when it is handed over).
  panel.under(lineHost);
  face();

  // ── load the year ───────────────────────────────────────────────────────
  (async () => {
    await line.ready;
    const { items, radio, sharedDays, openOn } = line;
    d.log(`${items.length} newsreels and ${radio.length} radio programmes, `
      + `${sharedDays} days with both. Nothing is asked of ERR until you play one`);
    window.__strip = view.strip;

    d.assert('the line is positioned in 1965', deck.position() >= YEAR_FROM && deck.position() < YEAR_TO, iso(deck.position()));
    d.assert('the whole year is on it', items.length > 250 && radio.length > 0, `${items.length} newsreels, ${radio.length} radio`);
    d.assert('the picture is the transport master, so the line follows it', !!master);
    d.assert('a visit opens nothing at ERR', errOpens === 0, `${errOpens} reaches since the page loaded`);
    const footButtons = [...panel.foot.querySelectorAll('button')];
    const right = [...panel.slots.right.querySelectorAll('button')];
    d.assert('the standard video panel: mute then its own full screen at the right of the footer, nothing else',
      footButtons.length === 2 && right.length === 2 && right[0] === muteBtn.el && right[1].matches('.pos-vp-full')
        && !panel.slots.left.childElementCount && !panel.slots.centre.childElementCount,
      footButtons.map((b) => b.getAttribute('aria-label')).join(', '));
    const stageR = panel.stage.getBoundingClientRect();
    d.assert('the panel is 4:3 and the film covers it, so the bars are cropped',
      Math.abs(stageR.width / stageR.height - 4 / 3) < 0.01 && getComputedStyle(film).objectFit === 'cover',
      `${stageR.width.toFixed(0)}x${stageR.height.toFixed(0)}, ${getComputedStyle(film).objectFit}`);
    d.assert('the transport bar is glued to the line, with play and the two steps on it',
      !!bar.el.closest('.pos-glue') && bar.el.closest('.pos-glue') === view.surface.closest('.pos-glue')
        && !!bar.el.querySelector('.tbar-toggle') && !!bar.extra('prev') && !!bar.extra('next'),
      [...bar.el.querySelectorAll('button')].map((b) => b.getAttribute('aria-label') || b.textContent).join(', '));
    const links = bay.links().map((l) => `${l.from} -> ${l.to}`);
    d.assert('the newsreel, the radio and the timeline are three boxes, wired as the code runs',
      held.size === 6 && links.length === 6, links.join(', '));

    await ifSelfcheck(async () => {
      // Presses the page's own buttons, so it is behind the gate. With nothing picked play
      // picks the first mark and steps walk a day, all opening nothing; then the page resets.
      // See lessons/page-history.md#history-10
      const before = errOpens;
      bar.el.querySelector('.tbar-toggle').click();
      const picked = line.current;
      bar.extra('next').click();
      const stepped = line.current;
      bar.extra('prev').click();
      const back = line.current;
      muteBtn.el.click();
      const mutedBoth = film.muted && wireless.muted;
      muteBtn.el.click();
      const reaches = errOpens - before;
      d.assert('play under a check picks the first mark and opens nothing at ERR',
        !!picked && picked.at >= openOn.at - 86400000 && reaches === 0 && !opened,
        `${picked?.date}, ${reaches} reaches`);
      d.assert('next steps one broadcast day on, previous steps back, and neither opens anything',
        !!stepped && stepped.at > picked.at && back?.date === picked.date && reaches === 0,
        `${picked?.date} -> ${stepped?.date} -> ${back?.date}`);
      d.assert('mute silences the picture and the radio together, and unmutes them',
        mutedBoth && !film.muted && !wireless.muted, `${mutedBoth}`);
      const a = line.nearestOf(items[0].at + 3600000, items), b = line.nearestOf(items[1].at - 3600000, items);
      d.assert('a scrub lands on the broadcast nearest where it stopped', a === items[0] && b === items[1], `${a?.date} then ${b?.date}`);
      // Full screen by the panel's button and back. Headless Chrome may refuse the real API;
      // fullscreen.mjs then covers the window, and either counts.
      // See lessons/page-history.md#history-11
      const fsBtn = panel.slots.right.querySelector('.pos-vp-full');
      fsBtn.click();
      for (let i = 0; i < 20 && !panel.isFull(); i++) await new Promise((r) => setTimeout(r, 50));
      const wasFull = panel.isFull();
      const footShown = getComputedStyle(panel.foot).display !== 'none' && muteBtn.el.getBoundingClientRect().width > 0;
      const barIn = panel.el.contains(bar.el) && bar.el.getBoundingClientRect().width > 0;
      const fr = film.getBoundingClientRect();
      const fullRatio = fr.width / fr.height;
      await panel.full(false);
      d.assert('full screen fills by the panel\'s own button, keeps the 4:3 crop, mute, the bar and the line on screen, and comes back',
        wasFull && footShown && barIn && Math.abs(fullRatio - 4 / 3) < 0.01
          && !panel.isFull() && !('full' in panel.el.dataset) && !panel.el.contains(bar.el),
        `full ${wasFull} by ${panel.support()}, film ${fr.width.toFixed(0)}x${fr.height.toFixed(0)}, footer ${footShown}, bar ${barIn}, back ${!panel.isFull()}`);
      select(null);
    });
    d.ready();
  })().catch((e) => d.fail(e));
</script>
</html>

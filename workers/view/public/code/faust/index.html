<script type="module">
  import { conceptNav, CODE_ROWS } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { faustCompile, faustNode } from '/shell/faust.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';

  // The patchbay synth with the sound made by this page's own Faust program, one mono voice;
  // each declared parameter is a knob node cabled into `value-in`. Compiled in the tab on the
  // first key (libfaust fetched then); a visit opens nothing and reads the knobs off the text.
  // See lessons/page-code.md#code-10
  const d = mount({ name: 'Faust synth', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('code/faust');

  const CODE = `import("stdfaust.lib");

// the keys set these three
freq = hslider("freq", 220, 20, 2000, 0.01);
gain = hslider("gain", 0.8, 0, 1, 0.01);
gate = button("gate");

// two saws apart by this many cents
detune = hslider("detune", 12, 0, 50, 0.1);
// a square one octave down
sub = hslider("sub", 0.4, 0, 1, 0.01);

// the filter
cutoff = hslider("cutoff", 600, 50, 6000, 1);
res = hslider("res", 0.6, 0, 0.95, 0.01);

// envelope times in seconds
attack = hslider("attack", 0.005, 0.001, 1, 0.001);
release = hslider("release", 0.5, 0.01, 3, 0.01);
// how far the envelope opens the filter, in Hz
env = hslider("env", 2500, 0, 6000, 1);

// the lfo on the cutoff
rate = hslider("rate", 0.3, 0.05, 10, 0.01);
depth = hslider("depth", 0.15, 0, 0.9, 0.01);

// echo feedback, 0 is off
echo = hslider("echo", 0.25, 0, 0.7, 0.01);

// the volume follows this one
amp = en.adsr(attack, 0.2, 0.8, release, gate);
// the filter follows this one, which falls lower
fenv = en.adsr(attack, 0.4, 0.2, release, gate);

c = pow(2, detune / 2400);
saws = (os.sawtooth(freq * c) + os.sawtooth(freq / c)) * 0.5;
wave = saws + os.square(freq / 2) * sub;

sweep = (cutoff + env * fenv) * (1 + depth * os.osc(rate)) : max(30) : min(12000);

process = wave : ve.moog_vcf_2bn(res, sweep) * amp * gain * 0.5 : ef.echo(1, 0.3, echo);
`;
  /** What the keys set, so these are not knobs. */
  const KEYED = new Set(['freq', 'gain', 'gate']);
  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const FAU_IN = ID('fau', 'value-in');
  const safeName = (n) => String(n).replace(/[^A-Za-z0-9_-]/g, '-');

  // ── the program's parameters, page-local copies of slide-synth.mjs's two readers ──
  const num = String.raw`\s*(-?[\d.]+(?:e-?\d+)?)\s*`;
  const SLIDER_RE = new RegExp(String.raw`\b(?:hslider|vslider|nentry)\s*\(\s*"([^"]*)"\s*,${num},${num},${num},${num}\)`, 'g');
  /** The sliders written in the text, for a visit, which has loaded nothing. */
  function readSliders(code) {
    const list = [];
    for (const m of String(code).matchAll(SLIDER_RE)) {
      const name = m[1].replace(/\[[^\]]*\]/g, '').trim();
      if (!name || list.some((p) => p.name === name)) continue;
      const [value, min, max, step] = m.slice(2, 6).map(Number);
      list.push({ name, value, min, max, step });
    }
    return list;
  }
  /** The sliders the compiled program declares, with the address each is set at, and the keyed three's addresses too. */
  function slidersOf(parts) {
    const list = [], addr = new Map();
    let ui = [];
    try { ui = JSON.parse(parts?.factory?.json || '{}').ui || []; } catch { /* no UI */ }
    const walk = (items) => {
      for (const it of items || []) {
        if (it.items) { walk(it.items); continue; }
        if (addr.has(it.shortname)) continue;
        if (it.type === 'button' || it.type === 'checkbox') { addr.set(it.shortname, it.address); continue; }
        if (!['hslider', 'vslider', 'nentry'].includes(it.type)) continue;
        addr.set(it.shortname, it.address);
        list.push({ name: it.shortname, value: it.init, min: it.min, max: it.max, step: it.step });
      }
    };
    walk(ui);
    // Faust lists controls in the order `process` uses them; keep the text's order.
    const order = readSliders(CODE).map((p) => p.name);
    const at = (n) => { const i = order.indexOf(n); return i < 0 ? order.length : i; };
    list.sort((a, b) => at(a.name) - at(b.name));
    return { list: list.filter((p) => !KEYED.has(p.name)), addr };
  }

  // ── the sound, made on the first press ───────────────────────────────────
  let ctx = null, node = null, out = null, master = null, pull = null, an = null, buf = null;
  let addr = new Map();
  let on = false, loading = null;
  let paramSends = 0, notesIn = 0;
  /** name -> the value its knob last said, so a value survives a rebuild. */
  const values = new Map();

  async function wake() {
    if (!ctx) {
      ctx = new AudioContext();
      master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      // A silent sink that keeps the analyser pulled, as in /synth/patch-synth.mjs.
      pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      an = ctx.createAnalyser(); an.fftSize = 2048; an.connect(pull);
      buf = new Float32Array(an.fftSize);
      // The router's own junction, so a re-route never touches the node's insides.
      out = ctx.createGain();
      requestAnimationFrame(frame);
    }
    ctx.resume();
    if (!node) {
      loading ??= (async () => {
        const t0 = performance.now();
        d.log('compiling the program, the first press fetches the Faust compiler');
        const parts = await faustCompile('concept018', CODE, {
          mono: true, onAbort: (line) => d.log(line, 'warn'),
        });
        const t1 = performance.now();
        node = await faustNode(ctx, parts);
        node.connect(out);
        const read = slidersOf(parts);
        addr = read.addr;
        rebuild(read.list);
        // Whatever a hand left a knob at before the press is the first sound.
        for (const [n, v] of values) { const a = addr.get(n); if (a) node.setParamValue(a, v); }
        voice();
        route();
        d.log(`compiled in ${Math.round(t1 - t0)} ms, node in ${Math.round(performance.now() - t1)} ms, ${read.list.length} knobs: ${read.list.map((p) => p.name).join(', ')}`);
      })().catch((e) => { loading = null; d.log(`the program did not compile: ${e.message}`, 'warn'); throw e; });
      await loading;
    }
  }

  /** THE ROUTER: the node's sound goes where the bay's audio links say, and nowhere else. */
  function route() {
    if (!out) return;
    try { out.disconnect(); } catch { /* not connected */ }
    for (const l of bay.links()) {
      if (l.from !== ID('fau', 'audio-out')) continue;
      if (l.to === ID('scope', 'audio-in')) out.connect(an);
      if (l.to === ID('speaker', 'audio-in')) out.connect(master);
    }
  }

  // ── the engine's `midi-in`: one voice, the last held note wins ───────────
  /** The held notes in the order they went down, with their velocities. */
  const held = [];
  function voice() {
    if (!node) return;
    const top = held[held.length - 1];
    const set = (n, v) => { const a = addr.get(n); if (a) node.setParamValue(a, v); };
    if (top) {
      set('freq', 440 * 2 ** ((top.note - 69) / 12));
      set('gain', top.vel / 127);
      set('gate', 1);
    } else set('gate', 0);
  }
  function fauNote(e) {
    if (e?.cls !== 'note') return;
    notesIn++;
    const i = held.findIndex((h) => h.note === e.d1);
    if (i >= 0) held.splice(i, 1);
    if (e.d2) held.push({ note: e.d1, vel: e.d2 });
    voice();
  }

  // `bay.mjs` cannot take a port away, so the knob nodes, cables and `value-in` names are rebuilt
  // into a fresh bay from the list; surviving names keep their values, the picture its wires.
  // See lessons/page-code.md#code-11
  let bay = createBay();
  let knobs = new Map(), grid = null, names = [];
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });

  function makeKnob(p) {
    const v = values.has(p.name) ? Math.min(p.max, Math.max(p.min, values.get(p.name))) : p.value;
    values.set(p.name, v);
    const step = p.step > 0 && p.step <= p.max - p.min ? p.step : undefined;
    return createKnob({
      label: p.name, min: p.min, max: p.max, step, value: v, hand: true,
      onInput: (r) => { values.set(p.name, r); bay.send(ID(`knob-${safeName(p.name)}`, 'value-out'), { of: 'param', name: p.name, v: r }); },
    });
  }

  function rebuild(list) {
    const old = bay;
    const oldLink = (n) => old.links().find((l) => l.from === ID(`knob-${safeName(n)}`, 'value-out') && l.to === FAU_IN);
    const oldKeys = old.links().find((l) => l.from === ID('keys', 'midi-out'));
    const next = createBay();
    names = list.map((p) => p.name);
    // The shapes are /shell/nodes.mjs's. A knob is labelled with its parameter's
    // own name, and a port with its `node:port`, which is what a refusal names.
    const knobNodes = names.map((n) => ({ name: 'knob', as: `knob-${safeName(n)}`, label: n }));
    addNodes(next, S, ['keys', ...knobNodes, 'fau', 'scope', 'speaker'], {
      portLabel: 'node:port',
      deliver: {
        'fau:midi-in': fauNote,
        'fau:value-in': (e) => {
          if (e?.of !== 'param') return;
          const a = addr.get(e.name);
          if (node && a) { node.setParamValue(a, e.v); paramSends++; }
        },
      },
      ports: { 'fau:value-in': { shape: { of: 'param', names } } },
    });
    const lay = (from, to) => {
      const r = next.link(from, to);
      if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
      return r;
    };
    const keep = (r, was) => { if (r.ok && was) Object.assign(next.links().find((l) => l.id === r.id), { sent: was.sent, dropped: was.dropped }); };
    keep(lay(ID('keys', 'midi-out'), ID('fau', 'midi-in')), oldKeys);
    lay(ID('fau', 'audio-out'), ID('scope', 'audio-in'));
    lay(ID('fau', 'audio-out'), ID('speaker', 'audio-in'));
    for (const n of names) keep(lay(ID(`knob-${safeName(n)}`, 'value-out'), FAU_IN), oldLink(n));
    bay = next;

    // The knobs, rebuilt with the bay. An old knob's hand is stopped before it
    // is thrown away, and a surviving name's hand starts again on the new one.
    const running = new Set();
    for (const [n, k] of knobs) { if (k.hand?.running) { running.add(n); k.hand.stop("page"); } }
    knobs = new Map(list.map((p) => [p.name, makeKnob(p)]));
    for (const n of running) knobs.get(n)?.hand?.start?.(0, 'page');
    const g = createKnobGrid(knobs, { row: true });
    if (grid) grid.el.replaceWith(g.el);
    grid = g;
    if (window.__demo) window.__demo.knobs = grid;
    route();
    pb?.refresh();
  }

  // No play button: the first key press fetches the compiler and compiles, and the held note
  // sounds once the node is ready.
  // See lessons/page-code.md#code-12
  function sound(v) {
    on = v;
    if (master) master.gain.setTargetAtTime(v ? 0.8 : 0, ctx.currentTime, 0.03);
  }
  async function start() {
    try { await wake(); } catch { return false; }
    sound(true);
    return true;
  }

  // ── the keyboard: its notes leave on `keys:midi-out` and nowhere else ────
  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => {
      if (how === 'midi') return;
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 });
      // A key is a press, so it may wake the synth; the note waits in `held`.
      if (!on) start();
    },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });

  function frame() {
    const scoped = bay.links().some((l) => l.to === ID('scope', 'audio-in'));
    if (on && node && scoped) {
      an.getFloatTimeDomainData(buf);
      const WINDOW = 512, FULL = 0.5;
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the page ─────────────────────────────────────────────────────────────
  let pb = null;
  rebuild(readSliders(CODE).filter((p) => !KEYED.has(p.name)));
  pb = createPatchbay({ nodes: () => bay.nodes(), ports: () => bay.ports(), links: () => bay.links() }, {
    flowing: (l) => !!node && on && (l.from !== ID('keys', 'midi-out') || held.length > 0),
  });

  // The program in the kit's code box, read only: the knobs are its sliders.
  // See lessons/page-code.md#code-13
  const lines = CODE.replace(/\n$/, '').split('\n').length;
  // A third of the program's height; it scrolls.
  // See lessons/page-code.md#code-14
  const code = createCodeBox({ language: 'faust', rows: CODE_ROWS, label: '', value: CODE.replace(/\n$/, ''),
    ariaLabel: 'the Faust program this synth plays, read only' });
  code.input.readOnly = true;
  // Knobs above the code.
  // See lessons/page-code.md#code-15
  d.stack.add(wave.el, grid.el, host, code.el, pb.el);
  window.__demo.knobs = grid;
  window.__demo.keyboard = kb;
  window.__demo.fau = {
    bay: () => bay, node: () => node, names: () => names.slice(), addr: () => new Map(addr),
    paramSends: () => paramSends, notesIn: () => notesIn, held: () => held.slice(),
    level: () => { if (!an) return 0; an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; return Math.sqrt(s / buf.length); },
    code: CODE,
  };
  d.ready();
</script>

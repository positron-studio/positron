<title>Piano and Rhodes</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<script type="module">
  // Piano and Rhodes from R2 through /code/sc-sampler.mjs (wasm scsynth in the tab), with a MIDI
  // looper driven only by the sustain (CC 64 crossing 64, or the Sustain button): press to record,
  // press to loop, press to overdub. Nothing is fetched on a visit; MIDI access is asked on load.
  // See lessons/page-code.md#code-16
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { PEDAL_ON, SUSTAIN_CC } from '/shell/pedal.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createMidiDevices } from '/shell/midi-devices.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createStripView } from '/shell/strip.mjs';
  import { createGlue } from '/shell/glue.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { PIANO, RHODES } from '/code/sampler.mjs';
  import { createScSampler, warmOnIntent } from '/code/sc-sampler.mjs';
  import { createPicker } from '/shell/picker.mjs';

  // The readout sits under the title, with the log alone at the foot.
  // See lessons/page-code.md#code-17
  const d = mount({ name: 'Piano and Rhodes', what: '', index: '/', indexLabel: 'positron',
    joined: false,
    readout: { 'key to sound': 'ms', boot: 'ms', 'first note': 'ms', underruns: '' } });
  conceptNav('code/piano');

  // ── the sampler ─────────────────────────────────────────────────────────
  let fetchedAt = 0;
  // A `web:patch` node sends a program change straight into the sampler, so the loop plays back
  // in whichever sound is picked now.
  // See lessons/page-code.md#code-18
  const INSTRUMENTS = [PIANO, RHODES];
  const sampler = createScSampler({
    instruments: INSTRUMENTS,
    // 010's warm: the keys on screen, C3 to A4, come down when the Rhodes is picked
    warm: [48, 69],
    onProgram: (ins) => patchPick?.show(ins.name, INSTRUMENTS.indexOf(ins)),
    log: (line, kind) => d.log(line, kind),
    onFetch: (on) => { if (!on) fetchedAt = performance.now(); pb?.refresh?.(); },
    // `boot` is the intent (a pointer over the keys, a focus, a MIDI message or
    // the first key) to the engine holding both definitions.
    onReady: (eng) => { d.set('boot', sampler.stat().timing.readyMs); listenStart(eng); },
  });

  // Key to sound: per live press, the first 1 ms block over ONSET and three times the 30 ms before
  // it, on the speaker's clock, tapped off scsynth's meter after the sum. A replay's onset within
  // WAIT_MS of a dropped live note can be taken for it: the meter cannot tell them apart.
  // See lessons/page-code.md#code-19
  const KEEP_MS = 200, ONSET = 0.02, WAIT_MS = 1500;
  const env = [], pendingPress = [], lags = [];
  let lastLag = null, readUpTo = 0, firstPress = null, fbuf = null, firstNoteMs = null, ctx = null, meter = null;
  function pressed(note) {
    const at = performance.now();
    firstPress ??= { note, at };
    pendingPress.push({ note, at });
    while (pendingPress.length > 8) pendingPress.shift();
  }
  function listen() {
    const ts = ctx.getOutputTimestamp?.();
    if (!ts || !ts.performanceTime) return;
    meter.getFloatTimeDomainData(fbuf);
    const sr = ctx.sampleRate, N = fbuf.length, blk = Math.round(sr / 1000);
    const tEnd = ts.performanceTime + (ctx.currentTime - ts.contextTime) * 1000;
    const t0 = tEnd - (N / sr) * 1000;
    for (let i = 0; i + blk <= N; i += blk) {
      const at = t0 + (i / sr) * 1000;
      if (at <= readUpTo) continue;
      let pk = 0;
      for (let j = i; j < i + blk; j++) { const a = fbuf[j] < 0 ? -fbuf[j] : fbuf[j]; if (a > pk) pk = a; }
      env.push({ at, peak: pk });
      readUpTo = at;
      let before = 0;
      for (let k = env.length - 31; k < env.length - 1; k++) if (k >= 0 && env[k].peak > before) before = env[k].peak;
      if (pk > ONSET && pk > before * 3) {
        const p = pendingPress.find((x) => x.at < at);
        if (p) {
          pendingPress.splice(pendingPress.indexOf(p), 1);
          const lag = at - p.at;
          if (p.at === firstPress?.at && firstNoteMs == null) { firstNoteMs = Math.round(lag); d.set('first note', firstNoteMs); }
          else { lastLag = lag; lags.push(lag); if (lags.length > 20) lags.shift(); d.set('key to sound', Math.round(lag)); }
        }
      }
    }
    const now = performance.now();
    while (env.length && env[0].at < now - KEEP_MS) env.shift();
    // The first press waits as long as the boot takes; every other one 1.5 s.
    for (let k = pendingPress.length - 1; k >= 0; k--) {
      const p = pendingPress[k];
      if (now - p.at > (p.at === firstPress?.at ? 20000 : WAIT_MS)) pendingPress.splice(k, 1);
    }
  }
  function listenStart(eng) {
    ctx = sampler.ctx();
    meter = eng.meter;
    fbuf = new Float32Array(meter.fftSize);
    const loop = () => { listen(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    // Underruns are Chrome's count of render quanta the audio thread missed
    // (`AudioContext.playbackStats`), the one load figure a tab can read; it is
    // blank where the browser has no such counter.
    setInterval(() => { const n = ctx.playbackStats?.underrunEvents; d.set('underruns', n == null ? '' : n); }, 500);
  }

  // The looper. The MK-425C scans its pedal every 65.95 ms, so a press one tick after a
  // release is the pedal springing back. Original comment: lessons/page-code.md#code-20.
  // See lessons/page-code.md#code-33
  const SPRING_MS = 70;          // a press this soon after a release is ignored
  const MIN_LOOP_MS = 500;       // a press that would close a shorter loop is ignored
  // A closing press is often held 1.45 to 1.65 s while the chord rings; 1 s cleared loops.
  // See lessons/page-code.md#code-21
  const CLEAR_HOLD_MS = 3000;    // a press held this long with no note played clears the loop
  // Keyboards report the pedal up to ~100 ms off the chord: a take starts at a note up to
  // LOOKBACK_MS before the press, a SEAM_MS repeat of the opening pitch at the end is dropped,
  // and the keys' last BUFFER_MS are always kept. The length stays press to press.
  // See lessons/page-code.md#code-22
  const LOOKBACK_MS = 150;
  const SEAM_MS = 150;
  const BUFFER_MS = 2000;
  /**
   * What a press does: 'spring', 'short' (both ignored), 'close', 'start', 'overdub' (while
   * looping) or 'keep' (while overdubbing). A fresh loop starts only after a clear.
   * See lessons/page-code.md#code-23
   */
  function pressAction(state, t1, releasedAt, now) {
    if (now - releasedAt < SPRING_MS) return 'spring';
    if (state === 'recording') return now - t1 < MIN_LOOP_MS ? 'short' : 'close';
    if (state === 'looping') return 'overdub';
    if (state === 'overdub') return 'keep';
    return 'start';
  }
  const L = {
    state: 'empty',          // 'empty' | 'recording' | 'looping' | 'overdub'
    layer: 0,                // the layer being recorded: 0 the first take, 1 and up overdubs
    dub: new Map(),          // note -> its overdub note on event, while overdubbing
    t1: 0, len: 0,           // ms, performance.now() clock
    lapStart: 0, lastPos: 0, lap: 0, headLap: 0,   // lap: the clock's; headLap: the scheduler's, AHEAD_MS in front
    events: [],              // { at, d1, d2 } in ms from the first press, sorted
    open: new Map(),         // note -> its note on, while recording
    sounding: new Set(),     // notes the loop has on right now
    pedal: 0, presses: [],   // the raw CC 64 value, and when each press landed
    releasedAt: -Infinity,   // when the pedal last came up
    hold: 0,                 // the pending clear of the press now down, a timer
    fired: [],               // { lap, at, late, sound } for a check: when each replay was handed over, and set to sound
    buffer: [],              // { t, d1, d2 } the last BUFFER_MS of keys, device time
    shift: 0,                // ms the take start was moved back to a note
    notesInHold: 0,          // note ons since the pedal last went down
    prev: null,              // { events, len } the loop a new take replaced, until it has notes
  };
  // The journal for the log copy: every key and pedal message with the device's timestamp
  // (`sent`) and when the looper saw it (`seen`), and every decision. Memory only, last 5000 each.
  // See lessons/page-code.md#code-24
  const J = { inputs: [], decisions: [] };
  const jin = (src, kind, d1, d2, ch, sent) => {
    J.inputs.push({ sent: +sent.toFixed(2), seen: +performance.now().toFixed(2), src, kind, d1, d2, ch });
    if (J.inputs.length > 5000) J.inputs.shift();
  };
  const jdo = (what, detail = '') => {
    J.decisions.push({ at: +performance.now().toFixed(2), what, state: L.state, detail });
    if (J.decisions.length > 5000) J.decisions.shift();
  };
  // `at` is when the note should be heard, `performance.now()`'s clock; none is now.
  const out = (d1, d2, at) => bay.send(`${S}:looper:midi-out`, { cls: 'note', ch: 1, d1, d2, ...(at == null ? {} : { at }) });
  function silence() { for (const n of L.sounding) out(n, 0); L.sounding.clear(); }

  function press(now) {
    L.presses.push(now);
    // The clear is armed by every press, an ignored one too: a pedal held down
    // for a second is a hold whatever the edge before it looked like.
    clearTimeout(L.hold);
    // A pedal held while playing is a sustain held, not a clear: a hold clears only when no note
    // was played during it, and only what the press itself left.
    // See lessons/page-code.md#code-25
    L.notesInHold = 0;
    L.hold = setTimeout(() => {
      if (L.pedal < PEDAL_ON) return;
      if (L.notesInHold) { jdo('hold kept', `${L.notesInHold} notes played during the hold`); return; }
      // A hold over a loop with overdubs removes the newest layer; only a loop of one layer, or a
      // take still recording, is cleared whole.
      // See lessons/page-code.md#code-26
      const had = L.state;
      if (had === 'overdub' && !L.events.some((e) => e.d2 && e.layer === L.layer)) {
        // the press just started an empty overdub: drop it, then undo the one before
        L.dub.clear(); L.layer--; L.state = 'looping';
      }
      if ((L.state === 'looping' || L.state === 'overdub') && L.layer > 0) {
        const k = L.layer;
        const gone = L.events.filter((e) => e.layer === k);
        for (const e of gone) if (e.d2 && L.sounding.has(e.d1)) { out(e.d1, 0); L.sounding.delete(e.d1); }
        L.events = L.events.filter((e) => e.layer !== k);
        L.dub.clear(); L.layer = k - 1; L.state = 'looping';
        jdo('hold undo', `layer ${k} removed, ${gone.filter((e) => e.d2).length} notes`);
        d.log(`pedal held ${CLEAR_HOLD_MS / 1000} s with no note played: layer ${k} removed, the loop plays on`);
        strip.strip.invalidate(); face();
        return;
      }
      jdo('hold clear', had);
      L.prev = null;
      clear();
      d.log(`pedal held ${CLEAR_HOLD_MS / 1000} s with no note played: ${had === 'empty' ? 'nothing to clear' : 'the loop is stopped and empty'}`);
    }, CLEAR_HOLD_MS);
    const act = pressAction(L.state, L.t1, L.releasedAt, now);
    jdo(`press ${act}`, `${Number.isFinite(L.releasedAt) ? `${(now - L.releasedAt).toFixed(1)} ms after the last release` : 'no release yet'}, ${L.state === 'recording' ? `${(now - L.t1).toFixed(1)} ms into the take` : ''}`);
    if (act === 'spring') { d.log(`press ${(now - L.releasedAt).toFixed(0)} ms after a release, the pedal springing back, ignored`, 'warn'); return; }
    if (act === 'short') { d.log(`press ${(now - L.t1).toFixed(0)} ms into the take, under ${MIN_LOOP_MS / 1000} s, ignored, still recording`, 'warn'); return; }
    if (act === 'overdub') {
      L.state = 'overdub'; L.layer++; L.dub.clear();
      // notes played just before the press count too, at their own place in the loop
      let early = 0;
      for (const b of L.buffer) if (b.d2 && b.t >= now - LOOKBACK_MS && b.t < now) { dubNote(b.d1, b.d2, b.t); early++; }
      d.log(`press: overdubbing layer ${L.layer}, the loop plays on`);
      jdo('overdub', `layer ${L.layer}${early ? `, ${early} note${early === 1 ? '' : 's'} from before the press taken in` : ''}`);
      face();
      return;
    }
    if (act === 'keep') {
      const pos = loopPos(now);
      for (const [n] of L.dub) addEvent({ at: pos, d1: n, d2: 0, layer: L.layer, skipLap: lapOf(now) });
      L.dub.clear();
      const n = L.events.filter((e) => e.d2 && e.layer === L.layer).length;
      L.state = 'looping';
      d.log(`press: layer ${L.layer} kept with ${n} note${n === 1 ? '' : 's'}`);
      jdo('overdub kept', `layer ${L.layer}, ${n} notes, ${L.events.filter((e) => e.d2).length} in the loop`);
      if (!n) L.layer--;
      strip.strip.invalidate();
      face();
      return;
    }
    if (act === 'close') {
      const len = now - L.shift - L.t1;
      if (!L.events.some((e) => e.d2) && L.prev) {
        // A take with no notes keeps the loop it would have replaced.
        L.events = L.prev.events; L.len = L.prev.len; L.prev = null;
        L.state = 'looping'; L.lapStart = now; L.lastPos = 0; L.lap = 0; L.headLap = 0; L.fired = [];
        deck.setRange([0, L.len]); deck.setLoopView({ a: 0, b: L.len, state: 'on' });
        strip.strip.fit(-L.len * 0.04, L.len * 1.04); strip.strip.invalidate();
        d.log('second press: that take had no notes, so the loop before it plays on', 'warn');
        jdo('empty take, previous loop kept', `${L.len.toFixed(1)} ms`);
        face();
        return;
      }
      L.len = len; L.prev = null;
      // anything played after the moved end belongs to the next lap's start
      for (const e of L.events) if (e.at >= len) e.at -= len;
      for (const [n] of L.open) L.events.push({ at: len, d1: n, d2: 0 });
      L.open.clear();
      L.events.sort((a, b) => a.at - b.at);
      // the same downbeat at both ends of the seam plays once, at the start
      const opening = new Set(L.events.filter((e) => e.d2 && e.at < SEAM_MS).map((e) => e.d1));
      const drop = new Set(L.events.filter((e) => e.d2 && e.at > len - SEAM_MS && opening.has(e.d1)));
      if (drop.size) {
        const gone = new Set();
        L.events = L.events.filter((e) => {
          if (drop.has(e)) { gone.add(e.d1); return false; }
          if (!e.d2 && gone.has(e.d1)) { gone.delete(e.d1); return false; }
          return true;
        });
        jdo('seam', `${drop.size} note${drop.size === 1 ? '' : 's'} at the end repeated the opening, dropped: ${[...drop].map((e) => e.d1).join(' ')}`);
      }
      L.state = 'looping'; L.lapStart = now; L.lastPos = 0; L.lap = 0; L.headLap = 0; L.fired = [];
      deck.setRange([0, len]);
      // The loop's start and end on the timeline: the strip's own loop band and edges, with a little
      // air either side.
      // See lessons/page-code.md#code-27
      deck.setLoopView({ a: 0, b: len, state: 'on' });
      strip.strip.fit(-len * 0.04, len * 1.04);
      strip.strip.invalidate();
      d.log(`second press: the loop is ${(len / 1000).toFixed(3)} s with ${L.events.filter((e) => e.d2).length} notes, playing${L.shift ? `, started ${L.shift.toFixed(0)} ms before the first press at its first note` : ''}`);
      jdo('loop closed', `${len.toFixed(1)} ms, ${L.events.filter((e) => e.d2).length} notes, first note ${L.events.find((e) => e.d2) ? `at ${L.events.find((e) => e.d2).at.toFixed(1)} ms` : 'none'}`);
    } else {
      silence();
      L.prev = L.state === 'looping' ? { events: L.events, len: L.len } : null;
      // the take reaches back for notes played just before the press
      const early = L.buffer.filter((b) => b.d2 && b.t >= now - LOOKBACK_MS && b.t < now);
      const t1 = early.length ? Math.min(...early.map((b) => b.t)) : now;
      L.shift = now - t1;
      L.state = 'recording'; L.t1 = t1; L.len = 0; L.events = []; L.open.clear();
      for (const b of L.buffer) {
        if (b.t < t1 || b.t >= now) continue;
        if (b.d2) { L.open.set(b.d1, true); L.events.push({ at: b.t - t1, d1: b.d1, d2: b.d2 }); }
        else if (L.open.has(b.d1)) { L.open.delete(b.d1); L.events.push({ at: b.t - t1, d1: b.d1, d2: 0 }); }
      }
      if (L.shift) jdo('lookback', `${early.length} note${early.length === 1 ? '' : 's'} up to ${L.shift.toFixed(1)} ms before the press taken in`);
      deck.setRange([0, VIEW_MS]);
      deck.setLoopView({ a: 0, state: 'armed', filling: true });   // the start, the end still to come
      strip.strip.fit(0, VIEW_MS);
      strip.strip.invalidate();
      d.log('first press: recording');
      jdo('recording', `take starts at ${L.t1.toFixed(1)}${L.shift ? `, ${L.shift.toFixed(1)} ms before the press` : ''}`);
    }
    face();
  }

  // Overdub: a note's place is the loop's clock at its device time, so the 66 ms pedal scan does
  // not touch it. It carries the lap it was played in and is not replayed in that lap.
  // See lessons/page-code.md#code-28
  const loopPos = (t) => (((t - L.lapStart) % L.len) + L.len) % L.len;
  /** The lap the loop's own clock is in at `t`: the lap a note played live at `t` was heard in. */
  const lapOf = (t) => Math.floor((t - L.lapStart) / L.len);
  function addEvent(ev) {
    let i = L.events.length;
    while (i > 0 && L.events[i - 1].at > ev.at) i--;
    L.events.splice(i, 0, ev);
  }
  function dubNote(d1, d2, t) {
    const at = loopPos(t);
    if (d2) {
      const ev = { at, d1, d2, layer: L.layer, skipLap: lapOf(t) };
      L.dub.set(d1, ev);
      addEvent(ev);
    } else if (L.dub.has(d1)) {
      L.dub.delete(d1);
      addEvent({ at, d1, d2: 0, layer: L.layer, skipLap: lapOf(t) });
    }
    strip.strip.invalidate();
  }

  function clear() {
    silence();
    L.state = 'empty'; L.events = []; L.open.clear(); L.len = 0; L.layer = 0; L.dub.clear();
    deck.setLoopView(null);
    strip.strip.invalidate();
    face();
  }

  // What reaches looper:midi-in. Notes always pass through; CC 64 is the
  // looper's own control and goes no further.
  function looperIn(e) {
    // The keyboard's own time when it has one (`t`, the MIDI message's
    // timeStamp, the same clock as performance.now()), else now.
    const now = Number.isFinite(e.t) ? e.t : performance.now();
    if (e.cls === 'cc') {
      if (e.d1 !== SUSTAIN_CC) return;
      const was = L.pedal;
      L.pedal = e.d2;
      if (was < PEDAL_ON && e.d2 >= PEDAL_ON) press(now);
      else if (was >= PEDAL_ON && e.d2 < PEDAL_ON) { L.releasedAt = now; clearTimeout(L.hold); }
      return;
    }
    if (e.cls !== 'note') return;
    if (e.d2) pressed(e.d1);
    out(e.d1, e.d2);
    L.buffer.push({ t: now, d1: e.d1, d2: e.d2 });
    while (L.buffer.length && L.buffer[0].t < now - BUFFER_MS) L.buffer.shift();
    if (e.d2 && L.pedal >= PEDAL_ON) L.notesInHold++;
    if (L.state === 'overdub') { dubNote(e.d1, e.d2, now); return; }
    if (L.state !== 'recording') return;
    const at = now - L.t1;
    if (e.d2 && at < 0) jdo('note before the take', `${e.d1} at ${at.toFixed(1)} ms`);
    if (e.d2) { L.open.set(e.d1, true); L.events.push({ at, d1: e.d1, d2: e.d2 }); }
    else if (L.open.has(e.d1)) { L.open.delete(e.d1); L.events.push({ at, d1: e.d1, d2: 0 }); }
    strip.strip.invalidate();
  }

  // Playback hands over the events between the head's last and current place, computed from the
  // first lap's start and the length so it cannot drift. The head runs AHEAD_MS (40 ms) early and
  // each note is a timestamped scsynth bundle at its place plus `sampler.latencyMs()`.
  // See lessons/page-code.md#code-29
  const AHEAD_MS = 40;
  function fire(ev, lapStart, lap) {
    if (ev.skipLap === lap) return;
    const now = performance.now();
    const due = lapStart + ev.at;
    const at = due + sampler.latencyMs();
    // `late`: when it was handed over against its place in the loop, negative
    // when ahead. `sound`: how far after its place it is set to be heard.
    L.fired.push({ lap, at: ev.at, late: +(now - due).toFixed(2), sound: +(at - due).toFixed(2) });
    if (L.fired.length > 400) L.fired.shift();
    if (ev.d2) L.sounding.add(ev.d1); else L.sounding.delete(ev.d1);
    out(ev.d1, ev.d2, at);
  }
  setInterval(() => {
    if (L.state !== 'looping' && L.state !== 'overdub') return;
    const now = performance.now();
    L.lap = lapOf(now);
    const elapsed = now + AHEAD_MS - L.lapStart;
    const lap = Math.floor(elapsed / L.len);
    const pos = elapsed - lap * L.len;
    if (lap === L.headLap) {
      for (const ev of L.events) if (ev.at >= L.lastPos && ev.at < pos) fire(ev, L.lapStart + lap * L.len, lap);
    } else {
      const old = L.lapStart + L.headLap * L.len;
      for (const ev of L.events) if (ev.at >= L.lastPos && ev.at <= L.len) fire(ev, old, L.headLap);
      L.headLap = lap;
      for (const ev of L.events) if (ev.at < pos) fire(ev, L.lapStart + lap * L.len, lap);
    }
    L.lastPos = pos;
  }, 4);

  // ── the timeline: the kit's transport bar and strip, glued ───────────────
  // The deck plays nothing (the looper does); it holds the loop's range and the
  // playhead, which is set from the looper's own clock every frame.
  const VIEW_MS = 4000;
  const deck = createDeck({ items: [], range: [0, VIEW_MS],
    adapters: { note: { caps: { rates: [1], continuous: false }, actuate() {}, reduce() { return {}; }, assertState() { return {}; } } } });
  const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const nameOf = (n) => `${NAMES[n % 12]}${Math.floor(n / 12) - 1}`;
  const glue = el('div');
  const bar = createTransportBar(glue, deck, { toggle: false, scrub: false, loop: false, live: false });
  const strip = createStripView(glue, deck, {
    size: 'auto', follow: false, gutter: 120,
    lanes: [
      { id: 'loop', kind: 'note', label: 'loop', height: 72, width: 2, as: 'ticks', terse: true,
        rows: () => L.events.filter((e) => e.d2).map((e, i) => ({ at: e.at, id: `l${i}`, kind: 'note', payload: e })),
        describeRow: (r) => [nameOf(r.payload.d1), `vel ${r.payload.d2}`] },
    ],
  });
  const surface = createGlue(bar.el, strip.surface);
  function tick() {
    let p = 0;
    const now = performance.now();
    if (L.state === 'recording') {
      p = now - L.t1;
      // The view grows with the take, half again each time it fills.
      const span = deck.range[1];
      if (p > span * 0.95) { const next = span * 1.5; deck.setRange([0, next]); strip.strip.fit(0, next); }
    } else if (L.state === 'looping' || L.state === 'overdub') {
      p = (now - L.lapStart) % L.len;
    }
    if (Math.abs(deck.position() - p) > 0.5) deck.seek(Math.min(p, deck.range[1]));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── the bay ─────────────────────────────────────────────────────────────
  const S = 'web', CF = 'cf-r2';
  const bay = createBay();
  // The shapes are /shell/nodes.mjs's; the two sample sets sit on cf-r2.
  addNodes(bay, S, [{ name: 'keys', variant: 'cc' }, 'looper', 'sampler', 'speaker', 'piano-samples', 'rhodes-samples', 'patch'], {
    deliver: {
      'keys:midi-in': (e) => kb.lightNote?.(e.d1, e.d2 > 0),
      'looper:midi-in': looperIn,
      'sampler:midi-in': (e) => sampler.midi(e),
    },
  });
  for (const [a, b] of [
    [`${S}:keys:midi-out`, `${S}:looper:midi-in`],
    [`${S}:looper:midi-out`, `${S}:sampler:midi-in`],
    [`${CF}:piano:file-out`, `${S}:sampler:file-in`],
    [`${CF}:rhodes:file-out`, `${S}:sampler:file-in`],
    [`${S}:patch:midi-out`, `${S}:sampler:midi-in`],
    [`${S}:sampler:audio-out`, `${S}:speaker:audio-in`],
  ]) {
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // A file wire is lit while ITS set's recordings come down and for 600 ms
  // after (010's rule, so only the picked set's wire lights); the audio wire
  // while a voice sounds. MIDI pulses once per event by itself.
  const flowing = (l, medium) => {
    if (medium === 'file') {
      const mine = l.from.startsWith(`${CF}:${sampler.inst().id}:`);
      return mine && (sampler.loading() || (fetchedAt && performance.now() - fetchedAt < 600));
    }
    if (medium === 'audio') return sampler.sounding() > 0;
    return false;
  };
  const pb = createPatchbay(bay, { detail: (n) => [{ text: n.label, sans: true }], flowing });

  // ── the patch ───────────────────────────────────────────────────────────
  let patchAt = 0;
  const pick = (i) => { patchAt = i; bay.send(`${S}:patch:midi-out`, { cls: 'program', ch: 1, d1: INSTRUMENTS[i].program }); };
  const step = (by) => pick((patchAt + by + INSTRUMENTS.length) % INSTRUMENTS.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => step(-1), next: () => step(+1), onPick: (i) => pick(i) });
  patchPick.options(INSTRUMENTS.map((x) => x.name), 0);

  // ── the keys, on screen and plugged in ───────────────────────────────────
  const host = el('div');
  const note = (d1, d2, t = performance.now()) => bay.send(`${S}:keys:midi-out`, { cls: 'note', ch: 1, d1, d2, t });
  const cc = (d1, d2, t = performance.now()) => bay.send(`${S}:keys:midi-out`, { cls: 'cc', ch: 1, d1, d2, t });
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (n, how) => { if (how !== 'midi') { jin('screen', 'on', n, 100, 1, performance.now()); note(n, 100); } },
    onUp: (n, how) => { if (how !== 'midi') { jin('screen', 'off', n, 0, 1, performance.now()); note(n, 0); } },
    onPanic: () => { clear(); sampler.panic(); d.log('the loop is stopped and empty'); },
    // One click is one press of a pedal: down, then up straight away. The
    // button is lit while the looper records, which is what it is doing.
    sustain: true,
    onSustain: () => { const t = performance.now(); jin('screen', 'cc', SUSTAIN_CC, 127, 1, t); jin('screen', 'cc', SUSTAIN_CC, 0, 1, t); cc(SUSTAIN_CC, 127); cc(SUSTAIN_CC, 0); },
  });
  function face() { kb.sustain?.set(L.state === 'recording' || L.state === 'overdub', true); }
  // A pointer over the keys, a touch or a focus boots SuperCollider. A visit boots nothing.
  warmOnIntent(host, sampler);

  // One `device` node per MIDI input, linked to the looper (notes and CC 64) and the keys. Each
  // message carries the device's timeStamp as `t`, which the looper times by. Ids survive a replug.
  // See lessons/page-code.md#code-30
  createMidiDevices({ bay, site: S, to: [`${S}:looper:midi-in`, `${S}:keys:midi-in`], emits: ['note', 'cc'],
    message: (e, { send, hold }) => {
      // The first message from a plugged in keyboard is an intent: boot the engine.
      sampler.warm('MIDI message');
      const [b0, d1, d2 = 0] = e.data;
      const st = b0 & 0xf0, ch = (b0 & 0x0f) + 1, t = e.timeStamp;
      if (st === 0xb0 && d1 === SUSTAIN_CC) {
        jin('midi', 'cc', d1, d2, ch, t);
        send({ cls: 'cc', ch, d1, d2, t });
        return;
      }
      if (st !== 0x90 && st !== 0x80) return;
      const on = st === 0x90 && d2 > 0;
      jin('midi', on ? 'on' : 'off', d1, on ? d2 : 0, ch, t);
      hold(d1, on);
      send({ cls: 'note', ch, d1, d2: on ? d2 : 0, t });
    },
    noteOff: (n) => ({ cls: 'note', ch: 1, d1: n, d2: 0, t: performance.now() }),
    onChange: () => pb.refresh?.(), log: (line, kind) => d.log(line, kind) }).ask();

  /** Everything, as text: the rules, every input, every decision, the loop. */
  function text() {
    const f = (x) => (Number.isFinite(x) ? x.toFixed(2) : '');
    const st = sampler.stat();
    const o = [`positron sampler/000 looper, ${new Date().toISOString()}`,
      `rules: SPRING_MS ${SPRING_MS}, MIN_LOOP_MS ${MIN_LOOP_MS}, CLEAR_HOLD_MS ${CLEAR_HOLD_MS}, LOOKBACK_MS ${LOOKBACK_MS}, SEAM_MS ${SEAM_MS}, PEDAL_ON ${PEDAL_ON}, AHEAD_MS ${AHEAD_MS}`,
      `sampler: SuperCollider in this tab, ${JSON.stringify(st.timing)}, live path ${f(sampler.latencyMs())} ms, playing ${st.inst}`,
      `measured: first note ${firstNoteMs ?? ''} ms, key to sound last ${f(lastLag)} ms over ${lags.length} presses [${lags.map((x) => x.toFixed(1)).join(' ')}], underruns ${st.underruns ?? ''}`,
      `state ${L.state}, loop ${f(L.len)} ms, lap ${L.lap}, take started at ${f(L.t1)}`,
      '', 'inputs: sent ms (device stamp)\tseen ms (looper)\tsrc\tkind\td1\td2\tch'];
    for (const r of J.inputs) o.push([f(r.sent), f(r.seen), r.src, r.kind, r.d1, r.d2, r.ch].join('\t'));
    o.push('', 'decisions: at ms\twhat\tstate\tdetail');
    for (const r of J.decisions) o.push([f(r.at), r.what, r.state, r.detail].join('\t'));
    o.push('', 'loop events: at ms from the take start\tnote\tvelocity');
    for (const e of L.events) o.push([f(e.at), e.d1, e.d2].join('\t'));
    const late = L.fired.map((x) => x.late);
    if (late.length) {
      const s = [...late].sort((a, b) => a - b);
      const snd = L.fired.map((x) => x.sound).sort((a, b) => a - b);
      o.push('', `replays: ${late.length}, handed to SuperCollider ms against their place median ${f(s[s.length >> 1])}, latest ${f(s[s.length - 1])} (negative is ahead), `
        + `set to sound ms after their place median ${f(snd[snd.length >> 1])} (the live path's latency), scheduled ${AHEAD_MS} ms ahead`);
    }
    return o.join('\n');
  }
  async function copy() {
    const t = text();
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = el('textarea'); ta.value = t; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); } finally { ta.remove(); }
    }
    d.log(`copied ${J.inputs.length} inputs, ${J.decisions.length} decisions and ${L.events.length} loop events`);
  }
  // No Copy log button; `await __demo.copyLog()` copies the journal from the console.
  // See lessons/page-code.md#code-31
  window.__demo.copyLog = copy;

  d.stack.add(surface, patchPick.el, host, pb.el);
  // The strip fits itself to its first width; this window is the empty take's.
  requestAnimationFrame(() => strip.strip.fit(0, VIEW_MS));
  window.__demo.bay = bay;
  // Read only, for a check over CDP.
  window.__demo.sampler = {
    stat: () => ({ ...sampler.stat(), firstNoteMs, lags: [...lags], lastLag }),
  };
  window.__demo.looper = {
    get state() { return L.state; }, get len() { return L.len; }, get lap() { return L.lap; },
    get presses() { return [...L.presses]; }, get events() { return L.events.map((e) => ({ ...e })); },
    get fired() { return L.fired.map((f) => ({ ...f })); },
    get position() { return deck.position(); }, get range() { return [...deck.range]; },
    get buffer() { return L.buffer.map((b) => ({ ...b })); },
    rules: { SPRING_MS, MIN_LOOP_MS, CLEAR_HOLD_MS, LOOKBACK_MS, SEAM_MS, BUFFER_MS, AHEAD_MS }, pressAction, text,
  };
  d.ready();
</script>

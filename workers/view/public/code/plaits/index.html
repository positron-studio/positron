<title>Plaits</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createMidiDevices } from '/shell/midi-devices.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createPlaitsVoice, createPlaitsKeys, PATCHES, P, KNOBS } from '../plaits-voice.mjs';

  // Plaits from the kit keyboard and any MIDI keyboard, every /muta/ parameter a knob node with a
  // value link into `web:plaits:value-in`, one scrolling row. The model is a stepped knob, pitch a
  // transpose, and the patch picker sets the knobs. Nothing plays on a visit; the first key boots.
  // See lessons/page-code.md#code-41
  const d = mount({ name: 'Plaits', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('code/plaits');

  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const P0 = PATCHES[0];
  // The knobs are plaits-voice.mjs's KNOBS. `to` is what the value does at Plaits; `short` is the
  // word under a dial whose name would not fit (about six letters), the full name is its hover.
  // See lessons/page-code.md#code-42
  const ALL = KNOBS.map((k) => ({ ...k,
    to: k.param === 'transpose' ? (v) => keys.setTranspose(v) : (v) => param(P[k.param], k.round ? Math.round(v) : v) }));
  const byName = new Map(ALL.map((k) => [k.name, k]));
  const param = (id, value) => voice.send({ t: 'param', id, value });

  // ── the bay ──────────────────────────────────────────────────────────────
  const bay = createBay();

  const voice = createPlaitsVoice({ log: d.log, voices: 6, onUp: () => route() });
  voice.setGain(P0.gain);   // the first patch's level trim
  // The first key boots the voice and plays once it is up, if still held.
  const keys = createPlaitsKeys(voice);
  const { noteOn, noteOff, playing } = keys;
  let notesIn = 0, paramsIn = 0;
  let kb = null;
  // The shapes are /shell/nodes.mjs's. A knob is labelled with its full name,
  // and a port with its `node:port`, which is what a refusal names.
  const knobNodes = ALL.map((k) => ({ name: 'knob', as: `knob-${k.id}`, label: k.name }));
  addNodes(bay, S, ['keys', ...knobNodes, 'plaits', 'scope', 'speaker'], {
    portLabel: 'node:port',
    deliver: {
      'keys:midi-in': (e) => kb?.lightNote(e.d1, !!e.d2),
      'plaits:midi-in': (e) => {
        if (e?.cls !== 'note') return;
        notesIn++;
        if (e.d2 > 0) noteOn(e.d1, e.d2); else noteOff(e.d1);
      },
      'plaits:value-in': (e) => {
        const k = e?.of === 'param' && byName.get(e.name);
        if (!k) return;
        paramsIn++;
        k.to(e.v);
      },
    },
    ports: { 'plaits:value-in': { shape: { of: 'param', names: ALL.map((k) => k.name) } } },
  });
  const lay = (from, to) => { const r = bay.link(from, to); if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn'); };
  lay(ID('keys', 'midi-out'), ID('plaits', 'midi-in'));
  for (const k of ALL) lay(ID(`knob-${k.id}`, 'value-out'), ID('plaits', 'value-in'));
  lay(ID('plaits', 'audio-out'), ID('scope', 'audio-in'));
  lay(ID('plaits', 'audio-out'), ID('speaker', 'audio-in'));

  /** THE ROUTER: the voice's sound goes where the bay's audio links say. */
  function route() {
    const out = voice.out();
    if (!out) return;
    const has = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
    try { out.disconnect(); } catch { /* not connected */ }
    if (has(ID('plaits', 'audio-out'), ID('speaker', 'audio-in'))) out.connect(voice.speakers());
    if (has(ID('plaits', 'audio-out'), ID('scope', 'audio-in'))) out.connect(voice.scopeIn());
  }

  // ── the knobs: two rows, every one its own node ─────────────────────────
  const knobs = new Map(ALL.map((k) => {
    const knob = createKnob({
      label: k.short || k.name, title: k.name, min: k.min, max: k.max, step: k.step, value: k.value, home: k.value, hand: true,
      format: k.format,
      onInput: (v) => bay.send(ID(`knob-${k.id}`, 'value-out'), { of: 'param', name: k.name, v }),
    });
    return [k.name, knob];
  }));
  // Every knob sends its starting value once, so the voice holds what the
  // panel shows (queued until the voice is up).
  for (const k of ALL) bay.send(ID(`knob-${k.id}`, 'value-out'), { of: 'param', name: k.name, v: k.value });
  const grid = createKnobGrid(knobs, { row: true });

  // ── the patch picker: it moves the knobs, the knobs send ────────────────
  let at = 0;
  function pick(i) {
    at = i;
    patchPick.show(PATCHES[i].name, i);
    const p = PATCHES[i];
    voice.setGain(p.gain);
    const want = { model: p.engine, harmonics: p.harmonics, timbre: p.timbre, morph: p.morph, decay: p.decay, colour: p.colour };
    for (const [name, v] of Object.entries(want)) {
      // The knob turns to the patch's value on screen (`receive`, which glides
      // and sends nothing) and the value leaves on its own cable here, once.
      const got = knobs.get(name).receive(v, { from: 'patch', force: true });
      bay.send(ID(`knob-${byName.get(name).id}`, 'value-out'), { of: 'param', name, v: got });
    }
  }
  const stepPatch = (by) => pick((at + by + PATCHES.length) % PATCHES.length);
  const patchPick = createPicker({ what: 'patch', cls: 'cc-patch', prev: () => stepPatch(-1), next: () => stepPatch(+1), onPick: (i) => pick(i) });
  patchPick.options(PATCHES.map((p) => p.name), 0);
  patchPick.show(PATCHES[0].name, 0);

  // ── the keyboard: its notes leave on web:keys:midi-out ──────────────────
  const host = el('div');
  kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 }); },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });
  for (const ev of ['pointerenter', 'focusin', 'touchstart']) host.addEventListener(ev, () => { voice.warm().catch(() => {}); }, { once: true, passive: true });

  // ── keyboards plugged into this machine, as /synth/keyboard/ ────────
  const { plugged, ask: askMidi } = createMidiDevices({ bay, site: S, to: [ID('plaits', 'midi-in'), ID('keys', 'midi-in')],
    onChange: () => pb.refresh(), log: (line, kind) => d.log(line, kind) });
  const shown = (id) => !id.startsWith(`${S}:midi`) || plugged.has(id.split(':').slice(0, 2).join(':'));

  // ── the page ─────────────────────────────────────────────────────────────
  const pb = createPatchbay({
    nodes: () => bay.nodes().filter((n) => shown(n.id)),
    ports: () => bay.ports().filter((p) => shown(p.id)),
    links: () => bay.links(),
  }, { flowing: (l) => (l.from === ID('plaits', 'audio-out') ? voice.level() > 0.002 : playing.size > 0) });
  setInterval(() => pb.refresh?.(), 500);
  askMidi();
  d.stack.add(voice.scope.el, patchPick.el, grid.el, host, pb.el);

  window.__demo.keyboard = kb;
  window.__demo.knobs = grid;
  window.__demo.plaits = {
    bay, knobs, pick, patches: PATCHES, features: voice.features, ready: voice.ready, ctx: voice.ctx,
    wasmAsked: voice.asked, level: voice.level, at: () => at, transpose: keys.transpose,
    playing: () => [...playing.values()].sort(),
    key: (n, on) => bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: n, d2: on ? 100 : 0 }),
    counts: () => ({ notesIn, paramsIn }),
  };
  d.ready();
</script>

<title>Collide synth</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  import { conceptNav, CODE_ROWS } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKeyboard, keyRange } from '/shell/keyboard.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createHueBook } from '/shell/code-lang.mjs';
  import { createCompileIdle } from '/shell/compile-idle.mjs';
  import { createCollideVoice, PROGRAM, rmsOf } from '/code/collide-voice.mjs';

  // /code/faust/'s shape, the sound made by a /collide/ program run on wasm scsynth; the program
  // and its knobs are in `../collide-voice.mjs`. Nothing opens on a visit: hover or focus on the
  // keys fetches the engine, and the first key boots it and sounds the note.
  // See lessons/page-code.md#code-6
  const d = mount({ name: 'Collide synth', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('code/collide');

  const S = 'web';
  const ID = (node, port) => `${S}:${node}:${port}`;
  const ENGINE_IN = ID('collide', 'value-in');

  const voice = createCollideVoice({ log: d.log, who: 'SuperCollider' });
  const NAMES = voice.compiled.knobs.map((k) => k.name);

  // ── the bay ──────────────────────────────────────────────────────────────
  const bay = createBay();
  let paramSends = 0, notesIn = 0;
  // The shapes are /shell/nodes.mjs's. A knob is labelled with its parameter's
  // own name, and a port with its `node:port`, which is what a refusal names.
  const knobNodes = NAMES.map((n) => ({ name: 'knob', as: `knob-${n}`, label: n }));
  addNodes(bay, S, ['keys', ...knobNodes, 'collide', 'scope', 'speaker'], {
    portLabel: 'node:port',
    deliver: {
      'collide:midi-in': (e) => {
        if (e?.cls !== 'note') return;
        notesIn++;
        if (e.d2) voice.noteOn(e.d1, e.d2); else voice.noteOff(e.d1);
      },
      'collide:value-in': (e) => {
        if (e?.of === 'param' && voice.param(e.name, e.v)) paramSends++;
      },
    },
    ports: { 'collide:value-in': { shape: { of: 'param', names: NAMES } } },
  });
  const lay = (from, to) => { const r = bay.link(from, to); if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn'); };
  lay(ID('keys', 'midi-out'), ID('collide', 'midi-in'));
  for (const n of NAMES) lay(ID(`knob-${n}`, 'value-out'), ENGINE_IN);
  lay(ID('collide', 'audio-out'), ID('scope', 'audio-in'));
  lay(ID('collide', 'audio-out'), ID('speaker', 'audio-in'));

  // ── the sound, made on the first key ─────────────────────────────────────
  let ctx = null, master = null, an = null, buf = null, on = false;
  /** THE ROUTER: the engine's sound goes where the bay's audio links say. */
  function route() {
    const out = voice.out();
    if (!out) return;
    try { out.disconnect(); } catch { /* not connected */ }
    for (const l of bay.links()) {
      if (l.from !== ID('collide', 'audio-out')) continue;
      if (l.to === ID('scope', 'audio-in')) out.connect(an);
      if (l.to === ID('speaker', 'audio-in')) out.connect(master);
    }
  }
  async function start() {
    if (!ctx) {
      // Made here, synchronously inside the key's gesture.
      ctx = new AudioContext();
      master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
      // A silent sink that keeps the analyser, and so the engine, pulled.
      const pull = ctx.createGain(); pull.gain.value = 0; pull.connect(ctx.destination);
      an = ctx.createAnalyser(); an.fftSize = 2048; an.connect(pull);
      buf = new Float32Array(an.fftSize);
      requestAnimationFrame(frame);
    }
    ctx.resume();
    try { await voice.wake(ctx); } catch { return false; }
    route();
    on = true;
    pb.refresh();
    return true;
  }

  // ── the keyboard: its notes leave on `keys:midi-out` and nowhere else ────
  const host = el('div');
  const kb = createKeyboard(host, {
    ...keyRange(21), base: 48,
    onDown: (note, how) => {
      if (how === 'midi') return;
      bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 100 });
      // A key is a press, so it may wake the engine; the note waits in the voice.
      if (!on) start();
    },
    onUp: (note, how) => { if (how === 'midi') return; bay.send(ID('keys', 'midi-out'), { cls: 'note', ch: 1, d1: note, d2: 0 }); },
  });
  // Intent: fetch the engine (our origin), boot nothing.
  for (const ev of ['pointerenter', 'focusin', 'touchstart']) host.addEventListener(ev, () => voice.warm(), { once: true, passive: true });

  // ── the two knobs, each a node of its own ────────────────────────────────
  const book = createHueBook().assign(NAMES);
  const knobs = new Map(voice.compiled.knobs.map((k) => {
    const knob = createKnob({
      label: k.name, min: k.spec.min, max: k.spec.max, value: k.value, hand: true,
      onInput: (v) => bay.send(ID(`knob-${k.name}`, 'value-out'), { of: 'param', name: k.name, v }),
    });
    knob.el.dataset.param = k.name;
    knob.el.style.setProperty('--param-hue', String(book.hueOf(k.name)));
    return [k.name, knob];
  }));
  const grid = createKnobGrid(knobs, { row: true });

  // ── the scope ────────────────────────────────────────────────────────────
  const wave = createWaveShape({ reason: null, colour: '--hi', height: 120, name: '' });
  function frame() {
    const scoped = bay.links().some((l) => l.from === ID('collide', 'audio-out') && l.to === ID('scope', 'audio-in'));
    if (on && scoped) {
      an.getFloatTimeDomainData(buf);
      const WINDOW = 512, FULL = 0.5;
      let i0 = 0;
      for (let i = 1; i < buf.length - WINDOW; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { i0 = i; break; }
      const win = buf.subarray(i0, i0 + WINDOW);
      wave.set({ points: Array.from(win, (v) => Math.max(-1, Math.min(1, v / FULL))), reason: '', name: '' });
    } else wave.set({ points: null, reason: null, name: '' });
    requestAnimationFrame(frame);
  }

  // ── the page ─────────────────────────────────────────────────────────────
  const pb = createPatchbay({ nodes: () => bay.nodes(), ports: () => bay.ports(), links: () => bay.links() }, {
    flowing: (l) => on && (l.from !== ID('keys', 'midi-out') || voice.held().length > 0),
  });
  // The program in the kit's code box, recompiled `IDLE_MS` (600) after the last key. A good
  // compile is the voice for the next note; a failed one shows `Did not compile` with the
  // error, and the keys go on playing the last good program.
  // See lessons/page-code.md#code-7
  const code = createCodeBox({ language: 'sclang', rows: CODE_ROWS, label: '', value: PROGRAM,
    hues: book, ariaLabel: 'the SuperCollider program this synth plays, edit it and it recompiles' });
  // A program without `\bright` or `\decay` compiles and plays, and that knob drives nothing;
  // the page writes that into the box's note after the compile settles.
  // See lessons/page-code.md#code-8
  let compiles = 0, refused = 0;
  const idle = createCompileIdle({
    input: code.input,
    host: code.el,
    compile: async (text) => {
      const out = await voice.load(text);
      if (!out.ok) {
        refused++;
        d.log(`the edit did not compile, the last good program keeps playing: ${out.error}`, 'warn');
        return out;
      }
      compiles++;
      const gone = out.missing;
      d.log(`the edit compiled in ${out.ms.toFixed(1)} ms into ${out.bytes} B and plays from the next note`
        + (gone.length ? `, and has no ${gone.join(' or ')}, so ${gone.length > 1 ? 'those knobs drive' : 'that knob drives'} nothing` : ''),
        gone.length ? 'warn' : '');
      for (const w of out.warnings) d.log(w);
      if (gone.length) idle.settled().then(() => {
        if (idle.state() !== 'idle' || voice.drives(gone[0])) return;
        const note = idle.el;
        note.dataset.state = 'error';
        note.textContent = `No ${gone.join(' or ')}, ${gone.length > 1 ? 'those knobs drive' : 'the knob drives'} nothing`;
        note.title = `the program has no \\${gone.join(' or \\')}, so ${gone.length > 1 ? 'those knobs have' : 'that knob has'} nothing to set`;
        note.hidden = false;
      });
      return out;
    },
  });
  // Knobs above the code.
  // See lessons/page-code.md#code-9
  d.stack.add(wave.el, grid.el, host, code.el, pb.el);

  window.__demo.knobs = grid;
  window.__demo.keyboard = kb;
  window.__demo.collide = {
    bay, voice, knobs, names: NAMES,
    paramSends: () => paramSends, notesIn: () => notesIn,
    ctx: () => ctx,
    level: () => (an ? rmsOf(an, buf) : 0),
    samples: () => { if (!an) return []; an.getFloatTimeDomainData(buf); return Array.from(buf); },
    code: PROGRAM, box: code, idle,
    compiles: () => compiles, refused: () => refused,
  };
  d.ready();
</script>

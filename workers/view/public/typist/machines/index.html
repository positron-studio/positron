<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Typewriters</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/typist/paper.css">
<style>
  /* Typewriters: /typist/typewriter/'s paper and sampler through an fx box (`web:fx`:
     audio in, audio out, an index on `value-in`); a stepper sends any positive index, each
     a machine from fx.mjs. Samples in ../typewriter/SOURCES.md; nothing fetched before a key.
     See lessons/page-typist.md#typist-9 */
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { addNodes } from '/shell/nodes.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createStepper } from '/shell/stepper.mjs';
  import { createFx, character, nameOf, render, trimFor, FADE, DISTINCT } from './fx.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';

  const d = mount({ name: 'Typewriters', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('typist/machines');

  const EXAMPLE = 'This is a sheet of paper in a typewriter.\nEvery key you press strikes it.';

  // ── the sheet ────────────────────────────────────────────────────────────
  const sheet = el('div', 'tp');
  const col = el('div', 'tp-col');
  const paper = el('pre', 'tp-type tp-paper', null, { 'aria-hidden': 'true' });
  // `data-typing` tells verify.mjs to type into this element rather than click it.
  const keys = el('textarea', 'tp-type tp-keys', null, {
    spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'sentences',
    'aria-label': 'the paper', 'data-typing': 'paper',
  });
  col.append(paper, keys);
  sheet.append(col);

  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  /** The text, and the cursor or the highlight exactly where the textarea's offsets say. */
  function draw() {
    const t = keys.value;
    const a = keys.selectionStart, b = keys.selectionEnd;
    const mid = a === b ? '<span class="tp-cur"></span>' : `<span class="tp-sel">${esc(t.slice(a, b))}</span>`;
    // the zero width space gives a trailing newline a line of its own, as the textarea has
    paper.innerHTML = esc(t.slice(0, a)) + mid + esc(t.slice(b)) + '​';
    follow();
  }

  /** The carriage: keep the cursor's line in view, one line of air under it. */
  function follow() {
    const cur = paper.querySelector('.tp-cur, .tp-sel');
    if (!cur) return;
    const s = sheet.getBoundingClientRect(), c = cur.getBoundingClientRect();
    const line = parseFloat(getComputedStyle(col).lineHeight) || 28;
    if (c.bottom + line > s.bottom) sheet.scrollTop += c.bottom + line - s.bottom;
    else if (c.top - line < s.top) sheet.scrollTop -= s.top - (c.top - line);
  }

  // The typewriter: nine files from our R2 bucket (through the station worker's /media/
  // door, CORS for any origin), decoded once, one AudioBufferSourceNode per key. Nothing
  // opens on a visit: the AudioContext and fetch wait for the first key press.
  // See lessons/page-typist.md#typist-10
  const BASE = 'https://positron-station.kristjan-jansen.workers.dev/media/typewriter/hermes-precisa-305/';
  const FILES = ['key-1', 'key-2', 'key-3', 'key-4', 'key-5', 'space', 'bell-1', 'bell-2', 'return'];
  const STRIKES = ['key-1', 'key-2', 'key-3', 'key-4', 'key-5'];
  // The space bar was recorded about 14 dB under a strike; lifted to sit with them.
  const LEVEL = { space: 2.4, 'bell-1': 0.55, 'bell-2': 0.55, return: 0.8 };
  const BELL_AT = 64 - 8;   // a typewriter rings eight characters before the margin
  const LATE = 150;         // ms: a press that waited longer than this for the files is dropped, not played late

  let ready = false, ctx = null, out = null, fx = null, master = null, loading = null, muted = false, lastStrike = -1, until = 0, fetchedAt = 0;
  const buf = new Map();
  const stat = { decoded: 0, started: 0, dropped: 0, ms: 0, bytes: 0 };

  function wake() {
    if (ctx) return loading;
    ctx = new AudioContext({ latencyHint: 'interactive' });
    out = ctx.createGain();                  // the typewriter's audio-out
    out.gain.value = muted ? 0 : 1;
    master = ctx.createGain();                // the speakers' audio-in
    master.connect(ctx.destination);
    const t0 = performance.now();
    const fetched = Promise.all(FILES.map(async (f) => {
      const r = await fetch(BASE + f + '.mp3');
      if (!r.ok) throw new Error(`${f}.mp3 answered ${r.status}`);
      const ab = await r.arrayBuffer();
      stat.bytes += ab.byteLength;
      buf.set(f, await ctx.decodeAudioData(ab));
      stat.decoded++;
    })).then(() => { stat.ms = Math.round(performance.now() - t0); fetchedAt = performance.now(); });
    // The fx box, at whatever index has arrived so far, each machine trimmed
    // to one loudness once the samples are here to measure it with.
    fx = createFx(ctx, fxIndex, (n, a) => fetched.then(() => trimFor(buf.get('key-1'), n, a)).catch(() => 1));
    route();
    // Ready means the samples are decoded AND the first machine is built, so
    // the first strike is not played into an fx box with nothing in it.
    loading = fetched.then(() => fx.ready).then(() => { ready = true; })
      .catch((e) => d.log(`the typewriter did not load: ${e.message}`, 'warn'));
    return loading;
  }

  // What a key type is called in a character's `rate` table.
  const KIND = (name) => (name.startsWith('key') ? 'key' : name.startsWith('bell') ? 'bell' : name);

  function play(name, { rate = 1, gain = 1, kind = KIND(name) } = {}) {
    const b = buf.get(name);
    if (!b || muted) return;
    // The tuning this index gives this key type, from the typewriter's own index input.
    rate *= tuning.rate[kind] ?? 1;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = b;
    src.playbackRate.value = rate;
    g.gain.value = gain * (LEVEL[name] ?? 1);
    src.connect(g).connect(out);
    src.start();
    stat.started++;
    until = Math.max(until, ctx.currentTime + b.duration / rate);
  }

  const jitter = (w) => 1 + (Math.random() * 2 - 1) * w;
  /** A letter: one of five strikes, never the same twice running, a little off in pitch and weight. */
  function strike(o = {}) {
    let i = Math.floor(Math.random() * STRIKES.length);
    if (i === lastStrike) i = (i + 1) % STRIKES.length;
    lastStrike = i;
    play(STRIKES[i], { rate: jitter(0.035), gain: jitter(0.12) * (o.gain || 1), kind: o.kind || 'key' });
  }

  /** The column the cursor is in on its line, as a typewriter's carriage counts it. */
  const column = () => { const a = keys.selectionStart; return a - (keys.value.lastIndexOf('\n', a - 1) + 1); };

  /** What one input sounds like. */
  function sound(e) {
    const t = e.inputType || '';
    if (t === 'insertLineBreak' || t === 'insertParagraph') return play('return');
    if (t.startsWith('delete')) return strike({ kind: 'del', gain: 0.6 });   // no backspace was recorded: a strike, lower and softer
    if (t.startsWith('insert')) {
      if (e.data === ' ') play('space');
      else strike();
      if (column() % 64 === BELL_AT) play(Math.random() < 0.5 ? 'bell-1' : 'bell-2');
    }
  }

  function typed(e) {
    if (muted) return;
    const at = performance.now();
    // The press that wakes the typewriter always sounds, however long the samples took; only
    // a press arriving while they are still coming down is dropped if late.
    // See lessons/page-typist.md#typist-11
    const first = !ctx;
    const go = () => { if (first || performance.now() - at < LATE) sound(e); else stat.dropped++; };
    if (ready) go();
    else wake().then(go);
  }

  // /typist/typewriter/'s graph with an fx box before the speakers, and a stepper whose
  // number reaches the fx box and the typewriter's second value input (the per key rate is
  // set where a sample starts).
  // See lessons/page-typist.md#typist-12
  const S = 'web', CF = 'cf-r2';
  const bay = createBay();
  // The index as it ARRIVES, at each end. Nothing sets these but a delivery.
  let fxIndex = 0, fxAmt = DISTINCT, twIndex = 0, twAmt = DISTINCT, tuning = character(0), pb = null;
  const arrivals = [];
  const deliverIndex = (where) => (e, l) => {
    const n = Math.floor(e?.n);
    if (e?.of !== 'index' || !Number.isFinite(n) || n < 0) { d.log(`${where} takes an index, and this was not one`, 'warn'); return; }
    arrivals.push({ at: where, n, link: `${l.from} -> ${l.to}`, t: Math.round(performance.now()) });
    if (arrivals.length > 50) arrivals.shift();
    if (where === 'fx') { fxIndex = n; fx?.set(n, fxAmt); pb?.refresh(); }
    else { twIndex = n; tuning = character(n, twAmt); }
  };

  // DISTINCT, how far from the original, 0 to 1, arrives on its own input at each end.
  // See lessons/page-typist.md#typist-13
  const deliverAmt = (where) => (e) => {
    const a = Number(e?.v);
    if (!Number.isFinite(a)) return;
    const v = Math.max(0, Math.min(1, a));
    if (where === 'fx') { fxAmt = v; fx?.set(fxIndex, v); }
    else { twAmt = v; tuning = character(twIndex, v); }
  };
  addNodes(bay, S, ['typing', 'paper', 'typewriter', 'pick', 'fx-typewriter', 'speaker', 'typewriter-samples'], {
    deliver: {
      'paper:value-in': () => {},
      [`${S}:typewriter:value-in-3`]: deliverAmt('typewriter'), [`${S}:typewriter:value-in`]: () => {},
      [`${S}:typewriter:value-in-2`]: deliverIndex('typewriter'),
      [`${S}:fx:value-in-2`]: deliverAmt('fx'), [`${S}:fx:value-in`]: deliverIndex('fx'),
    },
    ports: { [`${S}:typewriter:file-in`]: {} },
  });
  addNodes(bay, S, ['knob-distinct']);
  for (const [a, b] of [
    [`${S}:keys:value-out`, `${S}:paper:value-in`],
    [`${S}:keys:value-out`, `${S}:typewriter:value-in`],
    [`${CF}:typewriter:file-out`, `${S}:typewriter:file-in`],
    [`${S}:typewriter:audio-out`, `${S}:fx:audio-in`],
    [`${S}:fx:audio-out`, `${S}:speaker:audio-in`],
    [`${S}:pick:value-out`, `${S}:fx:value-in`],
    [`${S}:pick:value-out`, `${S}:typewriter:value-in-2`],
    [`${S}:knob-distinct:value-out`, `${S}:fx:value-in-2`],
    [`${S}:knob-distinct:value-out`, `${S}:typewriter:value-in-3`],
  ]) {
    const r = bay.link(a, b, [], { site: S });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  keys.addEventListener('input', (e) => {
    bay.send(`${S}:keys:value-out`, { text: e.data || '', kind: e.inputType });
    typed(e);
  });

  /**
   * The router, as /synth/patch-synth.mjs's: connects exactly the held audio links after
   * disconnecting every out, so an unlinked fx box hears nothing and sends nothing.
   * See lessons/page-typist.md#typist-14
   */
  const routed = [];
  function route() {
    if (!ctx) return;
    const N = {
      typewriter: { out: out },
      fx: { input: fx.input, out: fx.output },
      speaker: { input: master },
    };
    for (const m of Object.values(N)) if (m.out) { try { m.out.disconnect(); } catch { /* not connected */ } }
    routed.length = 0;
    for (const l of bay.links()) {
      if (bay.port(l.from)?.medium !== 'audio') continue;
      const src = N[l.from.split(':')[1]]?.out, dst = N[l.to.split(':')[1]]?.input;
      if (src && dst) { src.connect(dst); routed.push(`${l.from} -> ${l.to}`); }
    }
  }

  // `file` and `audio` wires are lit, not pulsed: the file wire while the samples come down
  // and 600 ms after (so a local fetch shows), the audio wires while a sample or room sounds.
  // See lessons/page-typist.md#typist-15
  const flowing = (l, medium) => {
    if (medium === 'file') return !!loading && (stat.decoded < FILES.length || performance.now() - fetchedAt < 600);
    if (medium === 'audio') return !!ctx && !muted && ctx.currentTime < until + (l.from.startsWith(`${S}:fx`) ? (character(fxIndex, fxAmt).room?.ms || 0) / 1000 : 0);
    return false;
  };

  for (const ev of ['input', 'select', 'keyup', 'pointerup']) keys.addEventListener(ev, draw);
  document.addEventListener('selectionchange', () => { if (document.activeElement === keys) draw(); });
  keys.addEventListener('focus', () => { sheet.classList.add('on'); draw(); });
  keys.addEventListener('blur', () => sheet.classList.remove('on'));
  // A tap in the margins lands on the sheet, not the textarea: focus it, cursor at the end.
  sheet.addEventListener('click', (e) => {
    if (e.target === keys) return;
    keys.focus({ preventScroll: true });
    keys.setSelectionRange(keys.value.length, keys.value.length);
    draw();
  });

  keys.value = EXAMPLE;
  keys.setSelectionRange(EXAMPLE.length, EXAMPLE.length);

  // ── the frame ────────────────────────────────────────────────────────────
  // Sound on by default, and a mute in the footer's left slot. Muting before
  // the first key press means nothing is ever fetched.
  const mute = createIconButton({ icon: 'volume', label: 'mute the typewriter', pressed: false, onPress: () => {
    muted = !muted;
    mute.pressed(muted);
    mute.set(muted ? 'mute' : 'volume', muted ? 'unmute the typewriter' : 'mute the typewriter');
    if (out) out.gain.value = muted ? 0 : 1;
    keys.focus({ preventScroll: true });
  } });
  // The stepper is `web:pick`: any positive number, its list growing as it is stepped. It
  // starts at Machine 0, the original, and focus goes back to the paper after each choice.
  // See lessons/page-typist.md#typist-16
  let pickN = 0, listTo = 0;
  const pick = (n, refocus = true) => {
    pickN = Math.max(0, n);
    if (pickN >= listTo || !listTo) { listTo = Math.max(17, pickN + 9); step.options(Array.from({ length: listTo }, (_, i) => nameOf(i)), pickN); }
    else step.show(nameOf(pickN), pickN);
    bay.send(`${S}:pick:value-out`, { of: 'index', n: pickN });
    if (refocus) keys.focus({ preventScroll: true });
  };
  const step = createStepper({ what: 'machine', prev: () => pick(pickN - 1), next: () => pick(pickN + 1),
    pick: { options: [], onPick: (i) => pick(i) } });

  // The distinct knob, its own node: 0 is the original for every machine, 1 the
  // full machine. A turn rebuilds the fx chain, so turns are gathered for 60 ms.
  let amtTimer = 0;
  const knob = createKnob({ label: 'distinct', min: 0, max: 100, step: 1, value: Math.round(DISTINCT * 100), home: Math.round(DISTINCT * 100), hand: true,
    onInput: (v) => { clearTimeout(amtTimer); amtTimer = setTimeout(() => bay.send(`${S}:knob-distinct:value-out`, { of: 'param', v: v / 100 }), 60); },
    onChange: (v) => { clearTimeout(amtTimer); bay.send(`${S}:knob-distinct:value-out`, { of: 'param', v: v / 100 }); keys.focus({ preventScroll: true }); } });
  const knobs = createKnobGrid(new Map([['distinct', knob]]), { row: true });

  const panel = createVideoPanel({ left: mute.el, centre: step.el, fullMode: 'footer' });
  panel.el.classList.add('tp-panel');
  panel.stage.append(sheet);
  // The fx box says which machine it is, from what last arrived at it.
  pb = createPatchbay(bay, { detail: (n) => [{ text: n.id === `${S}:fx` ? nameOf(fxIndex) : n.label, sans: true }], flowing });
  d.stack.add(panel.el, knobs.el, pb.el);
  pick(0, false);
  draw();
  keys.focus({ preventScroll: true });

  // Read only, for a check over CDP: what was decoded, how many sounds started.
  window.__demo.typewriter = {
    get stat() { return { ...stat, muted, state: ctx?.state || 'none' }; },
    get buffers() { return [...buf].map(([k, b]) => ({ name: k, s: +b.duration.toFixed(3), rate: b.sampleRate })); },
  };
  // Read only: the index that last arrived at each end and its link, the connected audio
  // links, how many chains are live (two only during a fade), and an offline render.
  // See lessons/page-typist.md#typist-17
  window.__demo.fx = {
    get index() { return fxIndex; },
    get live() { return fx ? { index: fx.index, chains: fx.live, trim: fx.trim && +fx.trim.toFixed(2) } : null; },
    get tuning() { return { n: tuning.n, ...tuning.rate }; },
    get arrivals() { return arrivals.map((a) => ({ ...a })); },
    get routed() { return [...routed]; },
    character: (n, a = fxAmt) => JSON.parse(JSON.stringify(character(n, a))),
    fade: FADE,
    render: async (n, name = 'key-1', trimmed = true) => {
      if (!buf.get(name)) throw new Error('not loaded yet');
      return render(buf.get(name), n, KIND(name), trimmed ? await trimFor(buf.get('key-1'), n, fxAmt) : 1, fxAmt);
    },
  };

  d.ready();
</script>

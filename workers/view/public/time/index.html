<!doctype html>
<html lang="en">

<meta property="og:title" content="time">
<meta property="og:description" content="The clock every page here runs on, and what is built on it, from beats and loops to scores and dates two thousand years long.">
<meta property="og:url" content="https://positron.studio/time/">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-800ba60e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* A tab's own controls, under its glued bar and strip. NOT `.pos-controls`:
     the harness presses that row by position across the whole document, blind
     to tabs (`tab-page.mjs`, rule 4). One gap, the controls' own token. */
  .time-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ctl-gap); }

  /* SCORE's block, from `/score/`. Twelve lines, and it HOLDS at twelve: the
     longest of the five scores is eleven, so a shorter one is padded rather
     than letting the block grow and move the strip above it. */
  .sc { max-height: calc(12 * 1.75em + 22px); overflow-y: auto;
        font: 400 11px/1.75 var(--mono); background: var(--card);
        border: 1px solid var(--line); border-radius: 4px; padding: 10px 0;
        overflow-x: auto; margin: 0; }
  /* TWO CHANNELS, TWO FACTS: the LEFT BORDER says which part a line belongs
     to, in the hue that part's slices and events use in the strip; the TEXT
     says whether it has played. Hue never means played. */
  .sc-pad { color: transparent; }
  .sc-l { display: block; white-space: pre; color: var(--dim2);
          border-left: 3px solid transparent; padding: 0 12px 0 9px; }
  .sc-l[data-state="played"] { color: var(--dim); }
  .sc-l[data-state="now"]    { color: var(--fg);
                               background: color-mix(in oklab, var(--hi) 10%, transparent); }
  .sc-n { color: var(--dim2); }
  .sc-l[data-state="now"] .sc-n { color: var(--fg); }
</style>

<script type="module">
  /* Five tabs, each a module beside this page, built by `createTabPage` on first
     open. One published bar, SCHEDULE's, the clock the other four compare with.
     Nothing sounds or opens on load or build; BEAT waits for its own press.
     See lessons/page-time.md#time-1 */
  import { mount, guard } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createTabPage } from '/shell/tab-page.mjs';
  import * as schedule from './schedule.mjs';
  import * as beat from './beat.mjs';
  import * as loops from './loops.mjs';
  import * as score from './score.mjs';
  import * as dates from './dates.mjs';

  const d = mount({
    name: 'time',
    // No `what` under the title: each tab describes itself under the tab row.
    // See lessons/page-time.md#time-2
    readout: null,
    showLog: false,
    controls: [],
  });
  guard(d);

  const page = createTabPage(d, {
    at: 'schedule',
    tabs: [
      { id: 'schedule', label: 'CLOCK', mod: schedule },
      { id: 'beat', label: 'OUTPUTS', mod: beat },
      { id: 'loops', label: 'LOOPS', mod: loops },
      { id: 'score', label: 'SCORE', mod: score },
      { id: 'dates', label: 'DATES', mod: dates },
    ],
  });

  if (SELFCHECK) await page.check();
  d.ready();
</script>
</html>

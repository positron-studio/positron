<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="positron.studio">
<meta property="og:type" content="website">

<meta property="og:url" content="https://positron.studio/making/">
<meta property="og:image" content="https://positron.studio/og/site-98871a52.png">
<meta property="og:image:width" content="1200">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-c7b28d7f.png">
<link rel="manifest" href="/icons/manifest-8e6dda01.webmanifest">
<meta name="ps-artwork" content="/icons/artwork-7bfe616e.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* The table gets the room the picture leaves. `dvh`, not `vh`, because `vh`
     measures the phone without its address bar and hides the last rows.
     `--tbl-h` is the component's own knob; the floor keeps it a table.
     See lessons/page-making.md#making-1 */
  .pos-tbl { --tbl-h: max(260px, calc(100dvh - 664px)); }
  /* The box is 16:9 and full width, and the video fills it with `cover`: these are
     finished pieces, and 4:3 into 16:9 keeps 75%. Full width puts the list below
     the fold on a short laptop. One declaration sets the width for every part.
     See lessons/page-making.md#making-2 */
  .pos-vp { width: 100%; }
  .pos-vp-stage > video { object-fit: cover; }

  /* The picture box is the same panel with `aspect: '1 / 1'`, fitted by the shell's
     `object-fit: contain` (the corpus runs 145x145 to 3000x3000). Capped, because a
     full width square is about 1000 px tall and hides the list.
     See lessons/page-making.md#making-3 */
  .mk-square { width: min(100%, 460px); margin-inline: auto; }
  /* This rule must sit after `.pos-vp`: both are one class, so the later one wins.
     Fix it by order, not by adding specificity.
     See lessons/page-making.md#making-4 */

  /* An empty box says what to do. It goes on the first press and does not come back.
     See lessons/page-making.md#making-5 */
  /* No `text-wrap: balance`: both hints fit on one line in a 286 px box at 320 px
     (argument at lessons/css-shell.md#pos-lr-say).
     See lessons/page-making.md#making-6 */
  .mk-hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--dim); font-size: 13px; letter-spacing: .04em; text-align: center;
    padding: 0 16px;
  }

  /* The element the panel shows. It is `display: block` inside the stage by the
     stylesheet's own rule; this only keeps it out of the flow before the panel
     has taken it, which happens one line after it is built. */
  video { display: block; }
</style>

<script type="module">
  import { mount, guard, el } from '/shell/shell.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createTabs } from '/shell/tabs.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createTransportBar } from '/shell/transport-bar.mjs';
  import { createDeck } from '/timeline/transport.mjs';
  import { mediaMaster } from '/timeline/media-master.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';

  /**
   * The recordings corpus, built by `demo/resources/build-mimproject.mjs`. Not
   * merged with `corpus.json`: those rows point at other people's servers, these
   * at files we hold, and the two follow different rules.
   * See lessons/page-making.md#making-7
   */
  const CORPUS = '/resources/mimproject.json';

  /**
   * The pictures, built by `demo/resources/build-mimproject-images.mjs`, recovered
   * from the Wayback Machine, so a row carries where it was captured from.
   * Thirty are 145x145 thumbnails and carry `thumbnail: true`.
   * See lessons/page-making.md#making-8
   */
  const PICTURES = '/resources/mimproject-images.json';

  const d = mount({
    name: 'making',
    /**
     * No count in this sentence: the log line under the list counts the drawn rows.
     * See lessons/page-making.md#making-9
     */
    what: 'The recordings and the pictures that outlived MIMproject\'s own website, shown '
        + 'from the table under whichever one you are looking at.',
    /**
     * See lessons/page-making.md#making-10
     */
    /* No readout: per recording facts are table columns, true of every row at once.
       `null` rather than an omitted field, so the harnesses read the opt out as deliberate.
       See lessons/page-making.md#making-11 */
    readout: null,
    /**
     * See lessons/page-making.md#making-12
     */
    // No control row. Every control this page could have is a row of the table,
    // and a button that plays "the first one" is a second way to do the thing
    // the list already does.
    controls: [],
  });
  guard(d);

  // ── the picture ──
  // `preload="none"`: a visit must not load a file. Every number shown before a
  // press comes from the corpus.
  // See lessons/page-making.md#making-13
  /* ── two corpora, two tabs ── (`tabs.mjs`, VIDEOS | IMAGES)
     A hash, never a subpage, so a playing `<video>` survives a tab press. Neither
     tab loads anything until a row is pressed.
     See lessons/page-making.md#making-14 */
  const tabs = createTabs({
    tabs: [{ id: 'videos', label: 'Videos' }, { id: 'images', label: 'Images' }],
  });
  d.stack.add(tabs.el);
  const vPane = tabs.panel('videos');
  const iPane = tabs.panel('images');

  const video = el('video', '', null, { playsinline: '', preload: 'none' });
  const panel = createVideoPanel({
    media: video,
    /**
     * `left: null`: no presence dot. A file that will not load says so in the log.
     * See lessons/page-making.md#making-15
     */
    left: null,
    // 'hover' now that the footer holds only the ⛶: a square in the corner
    // that comes up on movement and fades, rather than a footer bar kept on
    // screen for one button.
    fullMode: 'hover',
  });
  vPane.append(panel.el);
  const hint = el('div', 'mk-hint', 'press a recording below');
  panel.stage.append(hint);

  /**
   * The element is the master and the deck follows, so a control that writes only
   * to the deck is undone on the next tick. The 1 ms range is corrected when a
   * recording is chosen.
   * See lessons/page-making.md#making-16
   */
  const deck = createDeck({ items: [], adapters: {}, range: [0, 1] });
  const bar = createTransportBar(vPane, deck, {
    command: {
      play: () => { deck.play(); video.play().catch(() => {}); },
      pause: () => { video.pause(); deck.pause(); },
      // The playhead moves at once and the picture follows: a seek is a range request,
      // and the deck may snap back a frame when the bytes land.
      // See lessons/page-making.md#making-17
      seek: (pos) => { video.currentTime = Math.max(0, pos) / 1000; deck.seek(pos); },
    },
  });
  const master = mediaMaster(deck, video, { anchorMs: 0 });
  // `mediaMaster` does not run itself. Without this loop the object is built,
  // holds a deck, and the playhead never moves.
  (function frame() { master.tick(); requestAnimationFrame(frame); })();

  // ── the list ──────────────────────────────────────────────────────────────

  const mmss = (ms) => {
    const s = Math.round(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  const MB = (b) => `${(b / 1e6).toFixed(1)} MB`;
  /**
   * Size in a unit that can hold it: thumbnails are 3 KB to 30 KB and read `0.0 MB`
   * with `MB()`. The threshold is where the first figure stops being a zero.
   * See lessons/page-making.md#making-18
   */
  const SIZE = (b) => (b < 1e5 ? `${Math.round(b / 1e3)} KB` : MB(b));

  /**
   * The file name is the column that grows; date, length and size are fixed tracks.
   * No link column: a link inside a pressable row is two targets an inch apart.
   * Where it came from is on the row's hover.
   * See lessons/page-making.md#making-19
   */
  const table = createTable({
    columns: [
      { key: 'shown', label: 'when', width: 84 },
      { key: 'file', label: 'file', grow: true, clip: true, hi: true },
      // These sit right of the file: they are checked once a row is found. `picture`
      // aligns left because a resolution is a shape with no last digit to line up.
      // See lessons/page-making.md#making-20
      { key: 'shot', label: 'picture', width: 92 },
      { key: 'via', label: 'via', width: 68 },
      { key: 'up', label: 'uploaded', width: 84, align: 'right' },
      { key: 'len', label: 'length', width: 68, align: 'right' },
      { key: 'size', label: 'size', width: 80, align: 'right' },
    ],
    cap: 200,
    empty: '',
    note: 'hover',
    /**
     * Pressing a row plays it. A row with no address says so rather than doing nothing.
     * See lessons/page-making.md#making-21
     */
    onPick: (r) => {
      if (!r.url) { d.log(`${r.file} has no address to play from`, 'warn'); return; }
      pick(r, { play: true });
    },
  });
  vPane.append(table.el);

  // ── the pictures ──────────────────────────────────────────────────────────
  //
  /* No `src`, so opening this tab loads nothing. `decoding="async"` keeps a
     3000x3000 decode off the main thread.
     See lessons/page-making.md#making-22 */
  const shot = el('img', '', null, { alt: '', decoding: 'async' });
  /* Square by the component's own `aspect`, not a second hand drawn box.
     No presence dot: nothing on the far end of a picture is online.
     See lessons/page-making.md#making-23 */
  const shotPanel = createVideoPanel({
    media: shot, left: null, fullMode: 'hover', aspect: '1 / 1',
  });
  shotPanel.el.classList.add('mk-square');
  iPane.append(shotPanel.el);
  const shotHint = el('div', 'mk-hint', 'press a picture below');
  shotPanel.stage.append(shotHint);

  /**
   * The file name grows, everything else is a fixed track. `picture` aligns left.
   * `site` is first: four sites lived on one domain. `captured` is the Wayback
   * capture day, not a date of work; `uploaded` is empty where the path never said.
   * See lessons/page-making.md#making-24
   */
  const itable = createTable({
    columns: [
      { key: 'site', label: 'site', width: 104 },
      { key: 'file', label: 'file', grow: true, clip: true, hi: true },
      { key: 'px', label: 'picture', width: 92 },
      { key: 'up', label: 'uploaded', width: 84 },
      { key: 'got', label: 'captured', width: 92, align: 'right' },
      { key: 'size', label: 'size', width: 80, align: 'right' },
    ],
    cap: 200,
    empty: '',
    note: 'hover',
    /**
     * Pressing a row shows it. A row with no address says so rather than doing nothing.
     * See lessons/page-making.md#making-25
     */
    onPick: (r) => {
      if (!r.url) { d.log(`${r.file} has no address to show from`, 'warn'); return; }
      show(r);
    },
  });
  iPane.append(itable.el);

  let seen = null;
  const markSeen = () => itable.mark((row) => !!seen && row.url === seen.url);

  /** Show one picture. The only thing on this tab that opens a file. */
  function show(r) {
    seen = r;
    shotHint.remove();
    markSeen();
    shot.src = r.url;
    /* The log says what it is and where it came from, and that a thumbnail is one.
       See lessons/page-making.md#making-26 */
    d.log(`${r.file}, ${r.px}${r.thumb ? ', a thumbnail and the only size that survives' : ''}`, 'hi');
  }

  /**
   * A picture that will not load says so, rather than leaving an empty box.
   * See lessons/page-making.md#making-27
   */
  shot.addEventListener('error', () => {
    if (!seen) return;
    d.log(`that picture would not load: ${seen.file}`, 'bad');
  });

  // ── choosing one ──────────────────────────────────────────────────────────

  let chosen = null;
  const markChosen = () => table.mark((row) => !!chosen && row.url === chosen.url);

  /**
   * Show a recording, and optionally start it. The range comes from the corpus
   * (ffprobe) first; `loadedmetadata` corrects it and the check asserts they agree.
   * See lessons/page-making.md#making-28
   */
  function pick(r, { play = false } = {}) {
    chosen = r;
    hint.remove();
    markChosen();
    // The six cells that used to be written here are columns now, true of
    // every row at once rather than of whichever one was last pressed.

    deck.pause();
    deck.setRange([0, Math.max(1, r.durationMs)]);
    deck.seek(0);
    /**
     * `preload` is lifted here and nowhere else. With `preload="none"` a `load()`
     * fetches nothing and `loadedmetadata` never fires.
     * See lessons/page-making.md#making-29
     */
    video.preload = 'metadata';
    video.src = r.url;
    video.load();
    if (play) {
      // Fired, never awaited: it settles when the decoder has started, which
      // over somebody else's network is a wait with no deadline.
      video.play().catch(() => {});
      deck.play();
    }
    d.log(`${play ? 'playing' : 'loaded'} ${r.file}`, 'hi');
  }

  video.addEventListener('loadedmetadata', () => {
    const ms = Math.round((video.duration || 0) * 1000);
    if (ms > 0) deck.setRange([0, ms]);
    measured = ms;
  });
  /**
   * A file that will not load says so, rather than a transport that never moves.
   * See lessons/page-making.md#making-30
   */
  video.addEventListener('error', () => {
    if (!chosen) return;
    d.log(`that file would not load: ${chosen.file}`, 'bad');
  });

  // ── what the corpus says, and then what is true ───────────────────────────

  let measured = 0;
  let corpus = null;

  (async () => {
    try {
      corpus = await fetch(CORPUS).then((r) => r.json());
    } catch (e) {
      d.log(`the corpus would not load: ${e.message}`, 'bad');
      return;
    }
    const rows = corpus.items.map((i) => ({
      ...i,
      file: i.file.split('/').pop(),
      url: i.file,
      // An undated row shows NOTHING rather than its upload date. The corpus is
      // explicit that most of these went up years after the thing they show.
      shown: i.when.edtf || '',
      len: mmss(i.durationMs),
      size: MB(i.bytes),
      // The upload date never fills an empty `when`: most were uploaded years later
      // and five rows state no date at all.
      // See lessons/page-making.md#making-31
      up: i.uploaded || '',
      via: i.via || '',
      shot: i.picture ? `${i.picture.width}x${i.picture.height}` : '',
      hover: `${i.title}\n\n${i.note}\n\nwhen: ${i.when.edtf || 'not stated'} (${i.when.how})`
           + `\nuploaded to ${i.via}: ${i.uploaded}\nheld by: ${i.holder}`,
    }));
    table.set(rows);
    markChosen();
    d.log(`${rows.length} recordings, ${Math.round(corpus.counts.totalMs / 60000)} minutes, `
        + `${corpus.counts.dated} of them dated`, 'hi');

    d.assert('the corpus arrived and every row has an address',
      rows.length > 0 && rows.every((r) => /^https?:\/\//.test(r.url)),
      `${rows.length} rows, ${rows.filter((r) => /^https?:\/\//.test(r.url)).length} with an address`);

    d.assert('the table drew every row the corpus holds',
      table.count() === corpus.counts.items,
      `${table.count()} drawn of ${corpus.counts.items}`);

    /**
     * Two recordings are Kanuti Gildi SAAL's own; assert the credit, not trust it.
     * See lessons/page-making.md#making-32
     */
    /**
     * Compares two fields kept separately: the hand written note against `source`
     * from a lookup table, so one mistake cannot make both agree.
     * See lessons/page-making.md#making-33
     */
    const CREDIT = /Filmed and uploaded by ([^,.]+)/;
    const credited = corpus.items.filter((i) => CREDIT.test(i.note || ''));
    const theirs = corpus.items.filter((i) => i.source !== 'MIMproject');
    d.assert('a recording whose note credits somebody else has that somebody in its source',
      credited.length > 0
        && credited.length === theirs.length
        && credited.every((i) => i.source === CREDIT.exec(i.note)[1]
          && i.licenceBy.includes(i.source) && !i.holder.startsWith('MIMproject')),
      `${credited.length} notes credit somebody else, ${theirs.length} rows do`);

    /**
     * Negative control for the line above: the other side of the same split.
     * See lessons/page-making.md#making-34
     */
    const ours = corpus.items.filter((i) => i.source === 'MIMproject');
    d.assert('and the rest are ours and say that',
      ours.length === corpus.counts.ours && ours.every((i) => i.holder.startsWith('MIMproject')),
      `${ours.length} held by MIMproject`);

    /**
     * Five rows carry `precision: "none"`; this guards against backfilling them from
     * `uploaded`.
     * See lessons/page-making.md#making-35
     */
    const undated = corpus.items.filter((i) => i.when.precision === 'none');
    d.assert('an undated recording shows no date at all',
      undated.length > 0
        && undated.every((i) => i.when.edtf === null && i.when.earliest === null)
        && rows.filter((r) => r.when.precision === 'none').every((r) => r.shown === ''),
      `${undated.length} of ${corpus.counts.items} state no date`);

    /**
     * Asserted because a letterboxed video fails silently when the page's `cover`
     * rule stops matching.
     * See lessons/page-making.md#making-36
     */
    const fit = getComputedStyle(video).objectFit;
    d.assert('the picture fills its 16:9 box rather than sitting inside it',
      fit === 'cover', `object-fit ${fit}`);

    // ── the pictures, which cost a visitor nothing to list ──────────────────

    let pics = null;
    try {
      pics = await fetch(PICTURES).then((r) => r.json());
    } catch (e) {
      d.log(`the pictures corpus would not load: ${e.message}`, 'bad');
    }
    if (pics) {
      const irows = pics.items.map((i) => ({
        ...i,
        px: `${i.w}x${i.h}`,
        size: SIZE(i.bytes),
        // The Wayback capture date, which is the day this copy was taken and
        // never the day the picture was made.
        got: i.capturedAt || '',
        // Empty where the path never said: Drupal paths carry no upload month, and
        // `capturedAt` is not one.
        // See lessons/page-making.md#making-37
        up: i.uploadedPath || '',
        thumb: !!i.thumbnail,
        hover: `${i.file}\n\n${i.site}\ncaptured ${i.capturedAt} from ${i.source}`
             + (i.shownOnTitles.length ? `\n\nshown on: ${i.shownOnTitles.join(', ')}` : '')
             + (i.thumbnail ? '\n\nA THUMBNAIL. The original was never captured.' : ''),
      }));
      itable.set(irows);
      d.log(`${irows.length} pictures out of the Wayback Machine, `
          + `${pics.counts.thumbnailsOnly} of them thumbnails whose originals are gone, `
          + `and ${pics.notRecovered.count} more that nothing ever captured`, 'hi');

      d.assert('the pictures corpus arrived and every row has an address',
        irows.length > 0 && irows.every((r) => /^https?:\/\//.test(r.url)),
        `${irows.length} rows, ${irows.filter((r) => /^https?:\/\//.test(r.url)).length} with an address`);

      d.assert('the images tab drew every picture the corpus holds',
        itable.count() === pics.counts.items,
        `${itable.count()} drawn of ${pics.counts.items}`);

      /**
       * No size cell reads `0.0 MB`. Checked on the rendered string, not the formatter,
       * so the test is not the formatter's own arithmetic.
       * See lessons/page-making.md#making-38
       */
      /**
       * One tab stop for the whole list: exactly one row at tabIndex 0 and every other
       * at -1.
       * See lessons/page-making.md#making-39
       */
      const picks = [...itable.el.querySelectorAll('.pos-tbl-row.pick')];
      const stops = picks.filter((r) => r.tabIndex === 0);
      d.assert('the whole list is one stop for the keyboard, not one stop per row',
        picks.length === pics.counts.items && stops.length === 1
          && picks.every((r) => r.tabIndex === 0 || r.tabIndex === -1),
        `${picks.length} rows, ${stops.length} of them tabbable`);

      const zeroish = irows.filter((r) => /^0(\.0)? /.test(r.size));
      d.assert('every picture states a size a reader can use, and none of them reads zero',
        zeroish.length === 0 && irows.every((r) => /^\d+(\.\d)? (KB|MB)$/.test(r.size)),
        zeroish.length
          ? `${zeroish.length} read zero, smallest is ${Math.min(...irows.map((r) => r.bytes))} bytes`
          : `${irows.filter((r) => r.size.endsWith('KB')).length} in KB, `
            + `${irows.filter((r) => r.size.endsWith('MB')).length} in MB`);

      /**
       * The square box and its `contain` fit fail silently. Ratio and fit are read off
       * the computed style. A rule naming `img` is what would crop these; `> *` loses
       * to the shell's `> img` and `> video`.
       * See lessons/page-making.md#making-40
       */
      const sBox = getComputedStyle(shotPanel.stage);
      const sFit = getComputedStyle(shot).objectFit;
      d.assert('the picture box is square and a picture fits it by width or by height',
        sBox.aspectRatio.replace(/\s/g, '') === '1/1' && sFit === 'contain',
        `aspect-ratio ${sBox.aspectRatio}, object-fit ${sFit}`);
      /**
       * Every flagged thumbnail is small and no unflagged row is, so the flag cannot
       * drift from the pixels.
       * See lessons/page-making.md#making-41
       */
      const small = pics.items.filter((i) => i.w <= 200 && i.h <= 200);
      const flagged = pics.items.filter((i) => i.thumbnail);
      d.assert('a picture that is only a thumbnail is marked as one, and nothing else is',
        flagged.length === pics.counts.thumbnailsOnly
          && flagged.length === small.length
          && flagged.every((i) => small.includes(i)),
        `${flagged.length} marked, ${small.length} are 200 px or under`);

      /**
       * 196 referenced pictures were never captured, mostly the opera photography;
       * the list says so rather than implying it is complete.
       * See lessons/page-making.md#making-42
       */
      d.assert('and the page says how many pictures did not survive, rather than showing only what did',
        pics.notRecovered.count > 0
          && d.logEl.textContent.includes(String(pics.notRecovered.count)),
        `${pics.notRecovered.count} never captured, said in the log`);
    }

    // Nothing below this line runs for a visitor: each one opens a file.
    if (!SELFCHECK) {
      d.log('checks that open a file are off, so this page asks the bucket for nothing until you press a row', 'dim');
      d.ready();
      return;
    }

    /**
     * Seeking needs Range and CORS from the station worker's `/media/` route; nothing
     * on the page shows either, so this asserts them.
     * See lessons/page-making.md#making-43
     */
    const probe = rows[0];
    let ranged = null;
    try {
      const res = await fetch(probe.url, { headers: { Range: 'bytes=0-1' } });
      /**
       * `access-control-allow-origin` is not readable from JavaScript; `res.type` is.
       * `cors` means let through, `basic` would mean the page stopped asking the bucket.
       * See lessons/page-making.md#making-44
       */
      ranged = {
        status: res.status,
        type: res.type,
        len: res.headers.get('content-length'),
      };
    } catch (e) {
      ranged = { status: 0, type: 'refused', len: null, why: e.message };
    }
    d.assert('the bucket serves a byte range, across origins, to a page that is not ours',
      ranged.status === 206 && ranged.type === 'cors' && ranged.len === '2',
      `HTTP ${ranged.status}, ${ranged.type}, ${ranged.len ?? '?'} bytes`);

    /**
     * A suffix range asks for the last two bytes, which a server ignoring Range cannot
     * fake. Not a 404 probe, which logs a console error. `content-range` is readable
     * only because `workers/station/worker.mjs` exposes it.
     * See lessons/page-making.md#making-45
     */
    let tail = null;
    try {
      const res = await fetch(probe.url, { headers: { Range: 'bytes=-2' } });
      tail = { status: res.status, cr: res.headers.get('content-range') };
    } catch (e) {
      tail = { status: 0, cr: null };
    }
    const lastTwo = /bytes (\d+)-(\d+)\/(\d+)$/.exec(tail.cr || '');
    d.assert('and it is a real range, not the first bytes of the file every time',
      tail.status === 206 && !!lastTwo
        && Number(lastTwo[3]) === probe.bytes
        && Number(lastTwo[1]) === probe.bytes - 2
        && Number(lastTwo[2]) === probe.bytes - 1,
      `content-range ${tail.cr ?? 'not exposed'}, file ${probe.bytes} bytes`);

    /**
     * The browser's length of the served bytes against the ffprobe `durationMs`:
     * catches a truncated, swapped or mis-keyed file. Tolerance 1.5 s, a frame or two
     * of container slack.
     * See lessons/page-making.md#making-46
     */
    pick(probe, { play: false });
    await new Promise((ok) => {
      if (measured > 0) return ok();
      video.addEventListener('loadedmetadata', ok, { once: true });
      setTimeout(ok, 8000);
    });
    d.assert('the length the corpus wrote down is the length that came back',
      measured > 0 && Math.abs(measured - probe.durationMs) < 1500,
      `corpus ${mmss(probe.durationMs)}, file ${measured > 0 ? mmss(measured) : 'no answer'}`);

    d.assert('choosing a recording gives the transport somewhere to go',
      deck.range[1] > 1000 && table.count() > 0 && chosen === probe,
      `range 0 to ${mmss(deck.range[1])}`);

    /**
     * `totalVideoFrames` counts what was ever decoded; `readyState` is an instant.
     * Muted, and put back paused at zero for the harness's play drill.
     * See lessons/page-making.md#making-47
     */
    video.muted = true;
    video.play().catch(() => {});
    const frames = await new Promise((ok) => {
      const t0 = performance.now();
      (function look() {
        const n = video.getVideoPlaybackQuality?.().totalVideoFrames ?? 0;
        if (n > 0 || performance.now() - t0 > 8000) return ok(n);
        requestAnimationFrame(look);
      })();
    });
    video.pause();
    video.currentTime = 0;
    deck.pause();
    deck.seek(0);
    d.assert('and pictures come out of it, rather than a file that only parsed',
      frames > 0, `${frames} frames decoded`);

    /**
     * The images tab is driven here because `demo/verify.mjs` only presses
     * `.pos-controls`, and a tab is not in that row.
     * See lessons/page-making.md#making-48
     */
    if (pics) {
      tabs.go('images');

      /**
       * Laid-out square checked only once the tab is open: a hidden panel has no
       * layout. A width check, because the computed ratio and fit stay right when
       * source order makes the box 775 px wide.
       * See lessons/page-making.md#making-49
       */
      const box = shotPanel.stage.getBoundingClientRect();
      d.assert('and the box is square on the page as well as in the stylesheet, and capped',
        Math.abs(box.width - box.height) <= 1 && box.width > 0 && box.width <= 460,
        `${box.width.toFixed(1)}x${box.height.toFixed(1)} px`);

      /**
       * A real `ArrowDown` moves focus and opens nothing, since `onPick` fetches a picture.
       * Behind the gate, because it draws a focus ring a visitor did not choose.
       * See lessons/page-making.md#making-50
       */
      itable.focusRow(0);
      const before = itable.focused();
      const openedBefore = seen;
      itable.el.querySelectorAll('.pos-tbl-row.pick')[0]
        .dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      d.assert('the down arrow moves the keyboard one row and opens nothing',
        before === 0 && itable.focused() === 1 && seen === openedBefore,
        `focus ${before} to ${itable.focused()}, opened ${seen ? seen.file : 'nothing'}`);

      /**
       * Stepping keeps the focused row inside the table and the page still. Walks every
       * row, because one press from row 0 scrolls nothing, and checks the page
       * scroll too, since scrolling the page also makes a row visible.
       * See lessons/page-making.md#making-51
       */
      const scroller = itable.scroller();
      const pageAt = window.scrollY;
      let outside = 0, pageMoved = 0, worst = '';
      itable.focusRow(0);
      for (let i = 1; i < pics.counts.items; i += 1) {
        itable.focusRow(i);
        const r = itable.el.querySelectorAll('.pos-tbl-row.pick')[i].getBoundingClientRect();
        const b = scroller.getBoundingClientRect();
        if (r.top < b.top - 1 || r.bottom > b.bottom + 1) {
          outside += 1;
          if (!worst) worst = `row ${i} at ${Math.round(r.top - b.top)} of ${Math.round(b.height)}`;
        }
        if (window.scrollY !== pageAt) pageMoved += 1;
      }
      d.assert('stepping the whole list keeps every row inside the table and never scrolls the page',
        outside === 0 && pageMoved === 0,
        outside || pageMoved
          ? `${outside} rows left the box (${worst}), page moved on ${pageMoved}`
          : `${pics.counts.items} rows, all inside, page held at ${pageAt}`);

      /**
       * And the row is not flush against the edge, checked on a middle row because the
       * ends have nowhere to put the margin.
       * See lessons/page-making.md#making-52
       */
      const mid = Math.floor(pics.counts.items / 2);
      itable.focusRow(mid);
      const mr = itable.el.querySelectorAll('.pos-tbl-row.pick')[mid].getBoundingClientRect();
      const mb = scroller.getBoundingClientRect();
      d.assert('and a row in the middle of the list is kept off the edge of the box',
        mr.top - mb.top >= mr.height - 1 && mb.bottom - mr.bottom >= mr.height - 1,
        `${Math.round(mr.top - mb.top)} px above, ${Math.round(mb.bottom - mr.bottom)} px below, `
        + `row ${Math.round(mr.height)} px`);
      itable.focusRow(0);

      /**
       * A full screen panel drops its aspect ratio, which centres the picture and puts
       * the exit button in the corner. Drives the `data-full` hook, which
       * `video-panel.mjs` sets on both the real and the faux route.
       * See lessons/page-making.md#making-53
       */
      shotPanel.el.dataset.full = 'hover';
      const fsStage = getComputedStyle(shotPanel.stage).aspectRatio;
      const fsWide = shotPanel.el.getBoundingClientRect().width;
      /* Deleted, not emptied: `[data-full]` matches an empty attribute.
         See lessons/page-making.md#making-54 */
      delete shotPanel.el.dataset.full;
      const backSquare = getComputedStyle(shotPanel.stage).aspectRatio.replace(/\s/g, '');
      d.assert('a panel on the screen drops its own shape and its cap, and takes them back after',
        fsStage === 'auto' && fsWide > 460 && backSquare === '1/1',
        `full: ${fsStage} at ${fsWide.toFixed(0)} px, back: ${backSquare}`);

      const first = pics.items.find((i) => !i.thumbnail) || pics.items[0];
      show({ ...first, px: `${first.w}x${first.h}`, thumb: !!first.thumbnail });
      const got = await new Promise((ok) => {
        if (shot.complete && shot.naturalWidth > 0) return ok(true);
        shot.addEventListener('load', () => ok(true), { once: true });
        shot.addEventListener('error', () => ok(false), { once: true });
        setTimeout(() => ok(false), 8000);
      });
      /**
       * `naturalWidth` against the corpus catches a truncated, swapped or mis-keyed
       * file. `complete` alone would not: it is true for a failed load.
       * See lessons/page-making.md#making-55
       */
      d.assert('a picture opens, and its size is the size the corpus wrote down',
        got && shot.naturalWidth === first.w && shot.naturalHeight === first.h,
        `${first.file}: corpus ${first.w}x${first.h}, file `
        + `${shot.naturalWidth || 0}x${shot.naturalHeight || 0}`);

      /**
       * Put the page back on VIDEOS: the harness's play drill presses the transport
       * bar inside that panel.
       * See lessons/page-making.md#making-56
       */
      tabs.go('videos');
      d.assert('and the page is back on the tab it opened on',
        tabs.at() === 'videos' && !tabs.panel('videos').hidden && tabs.panel('images').hidden,
        `on ${tabs.at()}`);
    }

    d.ready();
  })();

  /**
   * No `transport` key: `transport-bar.mjs` publishes `__demo.transport` itself,
   * and `createTransportBar` returns a wrapper that would replace it.
   * See lessons/page-making.md#making-57
   */
  window.__demo = Object.assign(window.__demo || {}, {
    table,
    panel,
    corpus: () => corpus,
    chosen: () => chosen,
    pick,
    // The second half of the page, published the same way, so a check can reach
    // it by name rather than by DOM id.
    tabs,
    itable,
    shotPanel,
    seen: () => seen,
    show,
  });
</script>
</html>

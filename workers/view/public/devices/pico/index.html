<title>Pico on Wi-Fi</title>

</style>
<script type="module">
  // The Pico 2 W in studio-1 (rig/pico/net): its BOOTSEL button and chip temperature arrive here as
  // bay.event along links this tab holds; the light switch sends light.set to its led:value-in.
  // The Pico is found by its announce, never by a name typed here. Nothing opens until Join.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createInfoBox, createSwitchBox } from '/shell/info-box.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBayNode, randomSite, ROOM_RE } from '/shell/bay-node.mjs';
  import { heldPicture } from '/shell/bay-view.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';

  const d = mount({ name: 'Pico on Wi-Fi', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/pico');

  const asked = new URLSearchParams(location.search).get('room');
  const ROOM = asked && ROOM_RE.test(asked) ? asked : 'studio-1';
  const SITE = randomSite('web');
  const KEY_IN = `${SITE}:info-button:value-in`, NUM_IN = `${SITE}:info-temp:value-in`, LIGHT_OUT = `${SITE}:switch-light:value-out`;
  const SELF = {
    v: 1, site: SITE, place: 'browser', kind: 'browser', label: 'browser',
    nodes: [
      { id: `${SITE}:info-button`, kind: 'screen', label: 'button', place: 'browser' },
      { id: `${SITE}:info-temp`, kind: 'screen', label: 'temp', place: 'browser' },
      { id: `${SITE}:switch-light`, kind: 'person', label: 'light', place: 'browser' },
    ],
    ports: [
      { id: KEY_IN, label: 'button', dir: 'in', medium: 'value', shape: { of: 'key' } },
      { id: NUM_IN, label: 'temp', dir: 'in', medium: 'value', shape: { of: 'number' } },
      { id: LIGHT_OUT, label: 'light', dir: 'out', medium: 'value', emits: ['light'], shape: { of: 'light' } },
    ],
  };

  /** The Pico this room has: a board announcing itself as `pico-*`, the freshest one. */
  function picoSite() {
    const all = node.registry.graphs().filter((e) => e.graph.kind === 'board' && /^pico-/.test(e.site));
    const live = all.filter((e) => !e.stale).sort((a, b) => b.at - a.at);
    return (live[0] ?? all.sort((a, b) => b.at - a.at)[0])?.site ?? null;
  }
  let presses = 0, lastTemp = null, heard = 0;
  function bay() {
    const b = node.registry.fill(createBay());
    b.addPort({ ...b.port(KEY_IN), deliver: onKey });
    b.addPort({ ...b.port(NUM_IN), deliver: onTemp });
    const p = picoSite();
    if (p) {
      b.link(`${p}:button:value-out`, KEY_IN);
      b.link(`${p}:temp:value-out`, NUM_IN);
      b.link(LIGHT_OUT, `${p}:led:value-in`);
    }
    return b;
  }
  function onKey(e, l) {
    if (e?.of !== 'key') return;
    pb?.pulse(l.from, l.to);
    btn.set(e.down ? 'down' : 'up');
    if (e.down) presses++;
    heard++;
  }
  function onTemp(e, l) {
    if (e?.of !== 'number' || !Number.isFinite(e.v)) return;
    pb?.pulse(l.from, l.to);
    lastTemp = e.v;
    gauge.set(Math.round(e.v * 10) / 10);
    heard++;
  }

  let pb = null, found = null;
  const node = createBayNode({
    room: ROOM, graphs: [SELF], bay,
    log: (line, kind) => d.log(line, kind),
    onJoin: () => { d.log(`in ${ROOM}, waiting for a Pico to announce itself`); pb?.refresh(); },
    onGraph: () => {
      const p = picoSite();
      if (p && p !== found) { found = p; d.log(`${p} is here: its button, light and temperature are linked to this tab`, 'ok'); }
      pb?.refresh();
    },
    onEvent: (m, n) => { if (n < 0) d.log(`refused an event said as ${m.source} by a socket that never announced it`, 'warn'); },
  });

  /** The light: a light.set to the Pico's led:value-in, along the link the picture draws. */
  function setLight(on) {
    const p = picoSite();
    if (!node.joined() || !p) { d.log('join the room and wait for the Pico first', 'dim'); return false; }
    const ok = node.send({ type: 'light.set', to: `${p}:led:value-in`, hex: on ? '#ffffff' : '#000000' });
    if (ok) { pb?.pulse(LIGHT_OUT, `${p}:led:value-in`); d.log(`the Pico's light ${on ? 'on' : 'off'}`, 'ok'); }
    return ok;
  }

  // Play joins the room and Stop leaves it, as the other Pi pages connect.
  function play() {
    if (node.joined() || node.joining()) {
      node.leave(); found = null; transport.setIcon('play', 'play', 'play');
      d.log(`left ${ROOM}`); pb?.refresh(); return;
    }
    transport.setIcon('play', 'stop', 'stop');
    node.join();
  }
  const transport = createButtonGroup({ buttons: [{ id: 'play', icon: 'play', label: 'play', onPress: play }] });
  // What the Pico shows, in knob boxes, one row; its switch in a box of its own, the next row.
  const gauge = createInfoBox({ label: 'temp', unit: '°C' });
  const btn = createInfoBox({ label: 'button' });
  const shows = createKnobGrid([{ name: 'temp', knob: gauge }, { name: 'button', knob: btn }], { row: true });
  const light = createSwitchBox({ label: 'light', onChange: (on) => { if (!setLight(on)) light.set(false, true); } });
  const switches = createKnobGrid([{ name: 'light', knob: light }], { row: true });
  pb = createPatchbay(heldPicture(bay, SITE), { room: ROOM, detail: (n) => [{ text: n.label || '', sans: true }] });
  d.stack.add(transport.el, shows.el, switches.el, pb.el);

  window.__demo.probe = () => ({ joined: node.joined(), pico: picoSite(), presses, lastTemp, heard });

  if (SELFCHECK) {
    await new Promise((r) => setTimeout(r, 300));
    d.assert('a visit reaches nothing until Join', !node.joined() && !node.joining());
    d.assert('NEGATIVE CONTROL: with no Pico announced, no link is drawn to one', bay().links().length === 0);
    // A Pico's graph as rig/pico/net/node.c announces it, put in this tab's registry only.
    const P = 'pico-test01';
    node.registry.ingest({ type: 'graph.announce', from: 'stand-in', graph: { v: 1, site: P, place: ROOM, kind: 'board', label: 'Pico 2 W',
      nodes: [{ id: `${P}:led`, kind: 'device', label: 'Pico light' }, { id: `${P}:button`, kind: 'device', label: 'BOOTSEL' }, { id: `${P}:temp`, kind: 'device', label: 'chip temperature' }],
      ports: [{ id: `${P}:led:value-in`, dir: 'in', medium: 'value', shape: { channels: 3 } },
        { id: `${P}:button:value-out`, dir: 'out', medium: 'value', emits: ['key'], shape: { of: 'key' } },
        { id: `${P}:temp:value-out`, dir: 'out', medium: 'value', emits: ['number'], shape: { of: 'number', unit: 'C' } }] } });
    const b = bay();
    d.assert('a Pico in the room is found by its announce and its three links made', picoSite() === P && b.links().length === 3,
      b.links().map((l) => `${l.from} -> ${l.to}`).join(' | '));
    b.send(`${P}:temp:value-out`, { of: 'number', cls: 'number', v: 23.4, unit: 'C' });
    b.send(`${P}:button:value-out`, { of: 'key', cls: 'key', k: 0, down: true });
    b.send(`${P}:button:value-out`, { of: 'key', cls: 'key', k: 0, down: false });
    d.assert('a temperature and a press arrive along the links and show in their boxes', lastTemp === 23.4 && presses === 1 && gauge.value() === 23.4 && btn.value() === 'up', `temp ${lastTemp}, presses ${presses}`);
    const sizes = [...shows.el.querySelectorAll('.pos-kgrid-cell'), ...switches.el.querySelectorAll('.pos-kgrid-cell')]
      .map((c) => { const r = c.getBoundingClientRect(); return `${Math.round(r.width)}x${Math.round(r.height)}`; });
    const knobBox = (() => { const g = createKnobGrid([createKnob({ label: 'x' })], { row: true }); document.body.append(g.el);
      const r = g.cells[0].getBoundingClientRect(); g.el.remove(); return `${Math.round(r.width)}x${Math.round(r.height)}`; })();
    d.assert('every box is a knob box\'s size, the switch\'s too', sizes.every((x) => x === knobBox), `${sizes.join(' ')} against a knob ${knobBox}`);
    const sw = light.switch.el;
    d.assert('the light is a switch, announced as one', sw.getAttribute('role') === 'switch' && sw.getAttribute('aria-checked') === 'false');
    d.assert('NEGATIVE CONTROL: the light sends nothing before Join', setLight(true) === false);
  }
  d.ready();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>Text on Pi screen</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  .cc-top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  /* The simulated module as the video panel's picture: the panel at a whole number scale (2x, or 4x
     zoomed), so a panel pixel stays square, and its four keys in a column on its right as on the module. */
  /* One height at every zoom, the 4x panel's, so zooming never moves what is under it; a little tone
     round the black screen, so the panel reads as its own. */
  .ol-media { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 24px 16px; height: calc(64px * 4 + 48px); background: #07090d; overflow-x: auto; }
  .ol-media canvas { display: block; flex: none; width: calc(128px * var(--ol-k, 2)); height: calc(64px * var(--ol-k, 2)); image-rendering: pixelated; }
  /* the panel's edge, a faint line 8 px clear of its pixels; a border on a wrapper, so the canvas keeps its size */
  .ol-frame { padding: 8px; border: 1px solid var(--line); border-radius: 2px; line-height: 0; background: #000; }
  /* one joined column at its own height, centred beside the screen at every zoom */
  .ol-media .pos-bgroup { flex: none; margin-left: auto; align-self: center; }
  /* the screen centred in what the key column at the right edge leaves */
  .ol-screen { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; min-width: 0; }
  .ol-say { font-size: 12px; color: var(--dim); }
  /* the chat's compose box stands alone here, not inside a chat column, so it drops the column's inset */
  .pos-chat-compose.ol-compose { padding: 0; }
  .ol-compose .pos-chat-send { right: var(--send-in); bottom: var(--send-in); }
</style>
<script type="module">
  // The 0.96" OLED and its four keys on the Pi's header (rig/board/panel.mjs), as two nodes of the
  // Pi in this page's bay: text from a tab along a link to the screen, the keys along a link to a
  // table here. The board is reached on Connect, never on load.
  // why: lessons/page-devices.md#text
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createChatCompose } from '/shell/chat-ui.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createBoard } from '/shell/board.mjs';
  import { BOARD_SITE } from '/shell/graph-registry.mjs';
  import { paintFrame } from '/shell/panel-screen.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';

  const d = mount({ name: 'Text on Pi screen', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/text');

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const MAY_SEND = !SELFCHECK || q.get('board') === '1';
  // ?live=1: the layout module is read again every second and the simulated screen redrawn on a change.
  const LIVE = q.get('live') === '1';

  // ── the bay: a text box and a key table here, the screen and the keys on the Pi ──
  const TEXT_OUT = 'web:text:value-out';
  const OLED_IN = `${BOARD_SITE}:screen:value-in`, KEYS_OUT = `${BOARD_SITE}:keys:value-out`;
  const bay = createBay();
  bay.addNode({ id: 'web:text', kind: 'person', label: 'text box', place: 'browser' });
  bay.addNode({ id: `${BOARD_SITE}:screen`, kind: 'device', label: 'OLED 128x64', place: ROOM });
  bay.addNode({ id: `${BOARD_SITE}:keys`, kind: 'device', label: 'four keys', place: ROOM });
  // The simulated panel, drawn by demo/shell/panel-screen.mjs as the Pi draws it, and its four keys.
  // Mirrored by name: web:screen and web:keys are this tab's copies of pi-1:screen and pi-1:keys.
  bay.addNode({ id: 'web:screen', kind: 'screen', label: 'simulated OLED', place: 'browser' });
  bay.addNode({ id: 'web:keys', kind: 'person', label: 'simulated keys', place: 'browser' });
  const SIM_IN = 'web:screen:value-in', SIMKEYS_OUT = 'web:keys:value-out';
  const sim = { text: '', held: new Set(), ui: null, frames: 0, version: '' };
  const simCv = Object.assign(document.createElement('canvas'), { width: 128, height: 64 });
  function simDraw() { if (!sim.ui) return; paintFrame(simCv, sim.ui.frame({ text: sim.text, held: [...sim.held] })); sim.frames++; }

  let board = null, connected = false, sent = 0, shown = 0;
  const flash = new Map();                  // link id -> until (ms), lit for a moment per event
  const lit = (from) => { for (const l of bay.links()) if (l.from === from) flash.set(l.id, performance.now() + 400); };

  bay.addPort({ id: TEXT_OUT, dir: 'out', medium: 'value', emits: ['text'], label: 'text:value-out' });
  // What reaches the screen's in-port leaves for the board, and only once connected.
  bay.addPort({ id: OLED_IN, dir: 'in', medium: 'value', accepts: ['text'], label: 'screen:value-in',
    deliver: (ev) => {
      if (!board || !connected || !MAY_SEND) return;
      board.ask({ type: 'oled.text', text: ev.text }, 'oled.shown', 3000).then((r) => {
        if (r?.ok) { shown++; d.log(`on the screen: ${r.text}`); } else d.log(`the board did not draw it: ${r?.why || 'no answer in 3 s'}`, 'warn');
      });
    } });
  bay.addPort({ id: KEYS_OUT, dir: 'out', medium: 'value', emits: ['key'], label: 'keys:value-out' });
  bay.addPort({ id: SIMKEYS_OUT, dir: 'out', medium: 'value', emits: ['key'], label: 'keys:value-out' });
  bay.addPort({ id: SIM_IN, dir: 'in', medium: 'value', accepts: ['text', 'key'], label: 'screen:value-in',
    deliver: (ev) => {
      if (ev.cls === 'text') sim.text = ev.text;
      else if (ev.down) sim.held.add(ev.k); else sim.held.delete(ev.k);
      simDraw();
    } });
  for (const [from, to] of [[TEXT_OUT, OLED_IN], [TEXT_OUT, SIM_IN], [KEYS_OUT, SIM_IN], [SIMKEYS_OUT, SIM_IN]]) {
    const r = bay.link(from, to);
    if (!r.ok) d.log(`${from} -> ${to} refused: ${r.why}`, 'warn');
  }

  // ── the controls: play reaches the Pi, the chat's own compose box sends a line ──
  function send(t) {
    sent++;
    lit(TEXT_OUT);
    bay.send(TEXT_OUT, { of: 'text', cls: 'text', text: t });
  }
  const compose = createChatCompose({ placeholder: 'A line for the screen', onSend: send });
  compose.el.classList.add('ol-compose');
  // Always on: a line reaches the simulated screen here at once, and the Pi's once connected.
  compose.enable(true);
  compose.input.blur();
  // Play alone at the top left, as on the other remote pages: play connects, stop lets go.
  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'connect to the Pi', onPress: () => (board ? disconnect() : connect()) },
  ] });
  // The simulated keys, a column on the screen's right as on the module: down on press, up on release.
  // Feather has no asterisk, so * is the one key drawn as text.
  const SYMS = ['^', 'v', '#', '*'], ICONS = ['chevron-up', 'chevron-down', 'hash', null];
  const simKeys = createButtonGroup({ orient: 'column', buttons: SYMS.map((s, i) => ({ id: `k${i + 1}`,
    ...(ICONS[i] ? { icon: ICONS[i], label: `K${i + 1}, the ${s} key` } : { label: s }) })) });
  simKeys.button('k4').dataset.glyph = '1';      // * as a square like the three icons beside it
  SYMS.forEach((s, i) => {
    const b = simKeys.button(`k${i + 1}`), k = i + 1;
    const edge = (down) => { lit(SIMKEYS_OUT); bay.send(SIMKEYS_OUT, { of: 'key', cls: 'key', k, sym: s, gpio: 0, down }); };
    b.addEventListener('pointerdown', () => edge(true));
    for (const ev of ['pointerup', 'pointerleave']) b.addEventListener(ev, () => { if (sim.held.has(k)) edge(false); });
  });
  async function loadLayout(v = '') {
    const [{ loadPanelUi }, wasm] = await Promise.all([import(`/shell/panel-screen.mjs${v ? `?v=${v}` : ''}`),
      sim.wasm || fetch('/resources/pico/oled-ui.wasm').then((r) => r.arrayBuffer())]);
    sim.wasm = wasm;
    sim.ui = await loadPanelUi(wasm);
    simDraw();
  }
  loadLayout().catch((e) => d.log(`the simulated screen did not load: ${e.message}`, 'bad'));
  if (LIVE) {
    setInterval(async () => {
      try {
        const src = await (await fetch('/shell/panel-screen.mjs', { cache: 'no-store' })).text();
        let h = 0; for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) | 0;
        const v = (h >>> 0).toString(36);
        if (sim.version && v !== sim.version) { await loadLayout(v); d.log('layout reloaded'); }
        sim.version = v;
      } catch (e) { d.log(`the new layout did not load, keeping the old one: ${e.message}`, 'warn'); }
    }, 1000);
  }

  function connect() {
    if (board) return;
    board = createBoard({
      room: ROOM, of: 'Raspberry Pi', showName: false,
      log: (line, kind) => d.log(line, kind),
      onOpen: async () => {
        connected = true;
        const st = await board.ask({ type: 'panel.status' }, 'panel.status', 3000);
        d.log(st?.ok ? `the screen shows: ${st.text}` : `no screen on the Pi: ${st?.why || 'no answer in 3 s'}`, st?.ok ? 'ok' : 'warn');
        // the simulated screen takes what the real one shows, so the two match from the start
        if (st?.ok) { sim.text = st.text; simDraw(); }
      },
      // A key on the Pi is a `panel.key` to the whole room; it enters this bay at the keys' out-port.
      onMessage: (m) => {
        if (m.type !== 'panel.key') return;
        lit(KEYS_OUT);
        bay.send(KEYS_OUT, { of: 'key', cls: 'key', k: m.k, sym: m.sym, gpio: m.gpio, down: m.down });
      },
    });
    transport.setIcon('play', 'stop', 'let go of the Pi');
    d.log(`reaching ${ROOM}`);
  }
  function disconnect() {
    board?.close();
    board = null; connected = false;
    transport.setIcon('play', 'play', 'connect to the Pi');
    d.log(`left ${ROOM}`);
  }

  // ── the patchbay: a value wire lights for a moment per event ────────────
  const pb = createPatchbay(bay, { room: ROOM, flowing: (l) => (flash.get(l.id) || 0) > performance.now() });
  setInterval(() => pb.refresh?.(), 200);

  const top = el('div', 'cc-top');
  top.append(transport.el);
  // The simulated module in a video panel, as the kit shows a picture; zoom out and in step 1x, 2x, 4x.
  const media = el('div', 'ol-media');
  const screenBox = el('div', 'ol-screen');
  const frame = el('div', 'ol-frame');
  frame.append(simCv);
  screenBox.append(frame);
  media.append(screenBox, simKeys.el);
  const ZOOMS = [1, 2, 4];
  let zi = 1;
  const scale = el('span', 'ol-say', '');
  const zoomBtns = createButtonGroup({ buttons: [
    { id: 'out', icon: 'zoom-out', label: 'zoom out', onPress: () => setZoom(zi - 1) },
    { id: 'in', icon: 'zoom-in', label: 'zoom in', onPress: () => setZoom(zi + 1) },
  ] });
  function setZoom(i) {
    zi = Math.max(0, Math.min(ZOOMS.length - 1, i));
    media.style.setProperty('--ol-k', String(ZOOMS[zi]));
    scale.textContent = `128\u00d764 at ${ZOOMS[zi]}x`;
    zoomBtns.enable('out', zi > 0, 'smallest');
    zoomBtns.enable('in', zi < ZOOMS.length - 1, 'largest');
  }
  setZoom(zi);
  const simPanel = createVideoPanel({ media, left: scale, right: zoomBtns.el,
    // the module's own height at either zoom, not a 16:9 box around it
    aspect: 'auto' });
  d.stack.add(top, simPanel.el, compose.el, pb.el);
  window.__demo.bay = bay;
  window.__demo.probe = () => ({ connected, sent, shown, simFrames: sim.frames });

  if (SELFCHECK) {
    d.assert('four links: text to both screens, the Pi\'s keys and the simulated keys to the simulated screen', bay.links().length === 4, bay.links().map((l) => `${l.from} -> ${l.to}`).join(', '));
    await new Promise((r) => setTimeout(r, 400));
    d.assert('the simulated screen drew a frame', sim.frames > 0, `${sim.frames} frames`);
    d.assert('a visit reaches nothing until Connect', !board);
  }
  d.ready();
</script>

<title>Pi screens</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The simulated module as on /devices/drums/: the panel at a whole number scale, its keys on its right.
     why: lessons/page-devices.md#text */
  .ol-media { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 24px 16px; height: calc(64px * 4 + 48px); background: #07090d; overflow-x: auto; }
  .ol-media canvas { display: block; flex: none; width: calc(128px * var(--ol-k, 2)); height: calc(64px * var(--ol-k, 2)); image-rendering: pixelated; }
  .ol-frame { padding: 8px; border: 1px solid var(--line); border-radius: 2px; line-height: 0; background: #000; }
  .ol-media .pos-bgroup { flex: none; margin-left: auto; align-self: center; }
  .ol-screen { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; min-width: 0; }
  .ol-say { font-size: 12px; color: var(--dim); }
</style>
<script type="module">
  // The Pi's five OLED screens, simulated, each in a full and a half version; up and down switch them.
  // Half shows the chosen screen on top and the next one below. Nothing is written on the screen itself;
  // the names are on this page. No Pi, no relay.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { paintFrame, loadPanelUi } from '/shell/panel-screen.mjs';
  import { blit, pixel } from '../split/split-oled.mjs';
  import { SCREENS, createScreens } from './screens.mjs';

  const d = mount({ name: 'Pi screens', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/control');

  const ui = await loadPanelUi(await (await fetch('/resources/pico/oled-ui.wasm')).arrayBuffer());
  const screens = createScreens(ui);
  let at = 0, size = 'full', lastFrame = null;
  const N = SCREENS.length;
  const shown = () => (size === 'full' ? [at] : [at, (at + 1) % N]);

  function compose(t) {
    if (size === 'full') return screens.frame(SCREENS[at].key, t);
    const f = new Uint8Array(1024);
    blit(f, screens.half(SCREENS[at].key, t), 0, 0);
    blit(f, screens.half(SCREENS[(at + 1) % N].key, t), 0, 32);
    return f;
  }

  // ── the screen, its two keys, and what it is showing said on the page ──
  const cv = Object.assign(document.createElement('canvas'), { width: 128, height: 64 });
  const keys = createButtonGroup({ orient: 'column', buttons: [
    { id: 'up', icon: 'chevron-up', label: 'up, the previous screen', onPress: () => move(-1) },
    { id: 'down', icon: 'chevron-down', label: 'down, the next screen', onPress: () => move(1) },
  ] });
  const media = el('div', 'ol-media');
  const screenBox = el('div', 'ol-screen');
  const frame = el('div', 'ol-frame');
  frame.append(cv);
  screenBox.append(frame);
  media.append(screenBox, keys.el);
  const say = el('span', 'ol-say', '');
  const panel = createVideoPanel({ media, left: say, aspect: 'auto' });
  const pick = createChoice({ label: 'size', options: [['full', 'full'], ['half', 'half']], at: 0,
    title: (v) => (v === 'full' ? 'one screen, 128x64' : 'two screens, 128x32 each, the chosen one on top'),
    onPick: (v) => { size = v; label(); } });
  const table = createTable({ columns: [
    { key: 'where', label: 'shown', width: 72 },
    { key: 'key', label: 'screen', width: 80 },
    { key: 'what', label: 'what', grow: true, clip: true, hover: 'what' },
    { key: 'by', label: 'used by', width: 200, clip: true, hover: 'by' },
  ] });
  function label() {
    const s = shown();
    say.textContent = size === 'full' ? `${SCREENS[at].key}, full, ${at + 1} of ${N}`
      : `top ${SCREENS[s[0]].key}, bottom ${SCREENS[s[1]].key}, half`;
    table.set(SCREENS.map((x, i) => ({ ...x, where: i === s[0] ? (size === 'full' ? 'full' : 'top') : i === s[1] ? 'bottom' : '' })));
  }
  function move(dir) { at = (at + dir + N) % N; label(); }
  addEventListener('keydown', (e) => {
    if (e.target.closest?.('input, textarea, select, button')) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); } else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  });
  label();
  d.stack.add(panel.el, pick.el, table.el);

  let frames = 0;
  (function run(now) {
    lastFrame = compose(now);
    paintFrame(cv, lastFrame);
    frames++;
    requestAnimationFrame(run);
  })(performance.now());

  window.__demo.probe = () => ({ at, size, frames, shown: shown().map((i) => SCREENS[i].key) });

  if (SELFCHECK) {
    await new Promise((r) => setTimeout(r, 400));
    const lit = (f, y0, y1) => { let n = 0; for (let y = y0; y < y1; y++) for (let x = 0; x < 128; x++) n += pixel(f, x, y); return n; };
    d.assert('the screen draws', frames > 0 && lit(lastFrame, 0, 64) > 0);
    const was = at;
    move(1);
    d.assert('down shows the next screen and names it', at === (was + 1) % N && say.textContent.startsWith(SCREENS[at].key));
    move(-1);
    d.assert('up brings the first back', at === was);
    let every = true;
    for (let i = 0; i < N; i++) { const f = screens.frame(SCREENS[i].key, 1000); if (!lit(f, 0, 64)) every = false; }
    d.assert('every screen has a full version that draws', every);
    let halves = true;
    for (let i = 0; i < N; i++) { const s = screens.half(SCREENS[i].key, 1000); if (s.h !== 32 || !s.bits.some(Boolean)) halves = false; }
    d.assert('every screen has a half version, 32 rows, that draws', halves);
    pick.buttons[1].click();
    const f = compose(1000);
    d.assert('half puts the chosen screen on top and the next below, both drawn', size === 'half' && lit(f, 0, 32) > 0 && lit(f, 32, 64) > 0,
      `${lit(f, 0, 32)} top, ${lit(f, 32, 64)} bottom`);
    pick.buttons[0].click();
    d.assert('a visit fetches only the page\'s own files and the renderer', performance.getEntriesByType('resource')
      .filter((r) => r.initiatorType === 'fetch' || r.initiatorType === 'xmlhttprequest').every((r) => /oled-ui\.wasm|\/_log/.test(r.name)));
  }
  d.ready();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Palm drums</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module">
  // The Palm's drum grid (rig/palm/bridge.mjs --view drums) in a tab: the same picture and pen
  // (demo/shell/palm-drums.mjs), editing the Pi's own sequencer, and Listen plays the Pi's drums here.
  // The Pi is reached on the first press, never on load.
  // The presentation copy of /devices/palmdrums/, which stays as it was; only the layout differs.
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createBoard, BOARD_RATE } from '/shell/board.mjs';
  import { createBoardCollide } from '/shell/board-collide.mjs';
  import { createPalm, PALM_CSS, PALM_W, PALM_H } from '/shell/palm-view.mjs';
  import * as PD from '/shell/palm-drums.mjs';
  import { voices } from '/drums/voices.mjs';
  import { createPresentLayout } from '/shell/present-layout.mjs';
  import { createIconButton } from '/shell/icon-button.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { PATCHES as PLAITS } from '/shell/plaits-params.mjs';
  useMediumColours();
  document.head.append(Object.assign(document.createElement('style'), { textContent: PALM_CSS
    // the screen fills the square stage at any size, pixelated, instead of a whole --pm-k scale
    // two storeys, both 160 Palm pixels wide: the grid (160 tall) over the wave (40 tall), so the stage is 4 / 5
    + '.pos-vp-stage.pm-stage { background: #000; }'
    + ' .pm-split { display: grid; grid-template-rows: minmax(0, 4fr) minmax(0, 1fr); width: 100%; height: 100%; aspect-ratio: 4 / 5; }'
    + ' .pm-split > canvas { display: block; width: 100%; height: 100%; min-height: 0; image-rendering: pixelated; }'
    + ' .pm-split > canvas.palm-cv { touch-action: none; }'
    + ' .pm-foot-left, .pm-knobs { display: flex; gap: 12px; align-items: center; }'
    // a phone: the knobs take a row of their own under the buttons, centred
    + ' @media (max-width: 440px) { .pm-stage + .pos-vp-foot { grid-template-columns: 1fr auto; }'
    + ' .pm-stage + .pos-vp-foot > .pos-vp-c { grid-row: 2; grid-column: 1 / -1; justify-self: center; } }'
    // full screen: the split takes the largest 4 / 5 box, so the grid stays square and the pen's mapping stays true
    + ' .pos-vp[data-full] .pos-vp-stage.pm-stage { container-type: size; display: grid; place-items: center; }'
    + ' .pos-vp[data-full] .pm-split { width: min(100cqw, 100cqh * 4 / 5); height: auto; }' }));

  const d = mount({ name: 'Pi + Palm', what: '', readout: null, showLog: false, chrome: false });

  const q = new URLSearchParams(location.search);
  const ROOM = q.get('room') || 'studio-1';
  const MAY_SEND = !SELFCHECK || q.get('board') === '1';
  const VOICES = voices({ more: true }).slice(0, PD.ROWS);
  // The board's capture halves the Pi's sound (two ports, one silent), as on /devices/circuit/.
  const LIFT = 2 * 0.9;

  // ── the grid and the sequencer's state, as the Palm keeps them ──
  const grid = PD.emptyGrid();
  const seq = { running: false, bpm: 120, step: -1, at: 0 };
  let editAt = 0, editTimer = 0, starting = false, drumsUp = false, frames = 0, sentN = 0, pen = null;
  const patternNow = () => ({ v: 1, name: 'palm', bpm: seq.bpm, steps: PD.STEPS,
    rows: VOICES.map((v, r) => ({ voice: v.key, steps: grid[r].map((x) => (x ? '1' : '0')).join(''), mute: false })) });
  const screenNow = () => ({ voices: VOICES.map((v) => PD.SHORT[v.key] || v.key.slice(0, 2).toUpperCase()), look: { empty: 'dot', head: 'frame' } });
  /** A pattern from the Pi: the rows this grid has, by voice name. */
  function adopt(p) {
    if (!p?.rows || pens.active()) return;
    for (const [r, v] of VOICES.entries()) {
      const row = p.rows.find((x) => x.voice === v.key);
      for (let c = 0; c < PD.STEPS; c++) grid[r][c] = !!row && row.steps[c] === '1';
    }
    if (Number.isFinite(p.bpm)) seq.bpm = p.bpm;
  }
  function onSeqState(m) {
    if (!m?.ok) { if (m?.why) d.log(`the Pi's sequencer: ${m.why}`, 'warn'); return; }
    seq.running = !!m.running;
    showPlaying();
    if (Number.isFinite(m.bpm)) seq.bpm = m.bpm;
    seq.step = Number.isInteger(m.step) ? m.step : -1; seq.at = performance.now();
    // its own edit still on its way, or not landed until the next bar: the board's copy is the older one
    if (m.pattern && !m.pending && performance.now() - editAt > 3000) adopt(m.pattern);
  }
  const stepNow = (t = performance.now()) => (seq.running && seq.step >= 0
    ? (seq.step + Math.floor((t - seq.at) / (60000 / (seq.bpm * 4)))) % PD.STEPS : -1);

  // ── the board, reached on the first press ──
  let board = null, kit = null, ctx = null, lift = null, connected = false, opened = null, listening = false, poll = 0;
  function connect() {
    if (board || !MAY_SEND) return opened;
    let open;
    opened = new Promise((r) => { open = r; });
    ctx ??= new AudioContext({ sampleRate: BOARD_RATE, latencyHint: 'interactive' });
    board = createBoard({ room: ROOM, of: 'Raspberry Pi', showName: false, audioContext: ctx, toDestination: false,
      log: (line, kind) => d.log(`Pi: ${line}`, kind),
      onOpen: () => { connected = true; open(true); },
      // the Palm and other tabs edit the same sequencer; their patterns come back here
      onMessage: (msg) => {
        if (msg.type === 'seq.state') onSeqState(msg);
        else if (msg.type === 'seq.pattern' && msg.pattern) adopt(msg.pattern);
      } });
    kit = createBoardCollide({ board, log: (line, kind) => d.log(`Pi: ${line}`, kind) });
    d.log(`reaching ${ROOM}`);
    opened.then(async (ok) => {
      if (!ok) return;
      const m = await board.ask({ type: 'seq.status' }, 'seq.state', 4000);
      // a square drawn before the Pi answered goes to it; otherwise this grid takes the Pi's
      if (m) { if (editAt) { onSeqState({ ...m, pattern: null }); tell(); } else onSeqState(m); }
      d.log(m?.ok ? `the Pi's sequencer: ${m.running ? `running at ${m.bpm} bpm` : 'stopped'}, ${m.pattern ? 'its pattern taken' : 'no pattern yet'}` : 'the Pi did not say what its sequencer holds', m?.ok ? 'ok' : 'warn');
      poll = setInterval(async () => { if (!document.hidden) { const s = await board.ask({ type: 'seq.status' }, 'seq.state', 3000); if (s) onSeqState(s); } }, 2000);
    });
    return opened;
  }
  async function reached() {
    connect();
    if (!MAY_SEND) { d.log('this run may not drive the board, add board=1 to the address', 'dim'); return false; }
    const ok = await Promise.race([opened, new Promise((r) => setTimeout(() => r(false), 6000))]);
    if (!ok) d.log('the Pi did not answer', 'warn');
    return ok;
  }
  function tell() {
    if (!connected) return;
    sentN++;
    board.ask({ type: 'seq.pattern', pattern: patternNow(), screen: screenNow() }, 'seq.state', 4000).then((m) => m && onSeqState(m));
  }
  function edited() {
    editAt = performance.now();
    if (!connected) { reached(); return; }
    clearTimeout(editTimer);
    editTimer = setTimeout(tell, 60);
  }
  /** The sixteen drums compiled on the Pi's SuperCollider, as the Palm's first play does. */
  async function drumsOnPi() {
    if (drumsUp) return true;
    const up = await kit.start();
    if (!up?.ok) { d.log(`the Pi did not start its drums: ${up?.reason ?? 'no answer'}`, 'warn'); return false; }
    for (const v of VOICES) {
      const r = await kit.load(v.name, v.program);
      if (!r?.ok) { d.log(`the Pi did not take ${v.name}: ${r?.reason ?? 'no answer'}`, 'warn'); return false; }
    }
    const j = await board.ask({ type: 'jack.link', link: 'pi-1:drums:audio-out -> pi-1:pwm:audio-in' }, 'jack.linked', 8000);
    if (!j?.ok) d.log(`the drums' sound did not reach the PWM output: ${(j?.problems || []).join(', ') || j?.hint || 'no answer'}`, 'warn');
    d.log(`the Pi compiled ${VOICES.length} drums`, 'ok');
    return (drumsUp = true);
  }
  async function transport() {
    if (starting || !await reached()) return;
    starting = true;
    try {
      if (seq.running) { onSeqState(await board.ask({ type: 'seq.stop' }, 'seq.state', 6000)); return; }
      if (!await drumsOnPi()) return;
      const m = await board.ask({ type: 'seq.start', target: 'drums', pattern: patternNow(), screen: screenNow() }, 'seq.state', 6000);
      onSeqState(m);
      d.log(`the Pi's sequencer: ${m?.ok ? `running at ${m.bpm} bpm` : `refused: ${m?.why ?? 'no answer'}`}`, m?.ok ? 'ok' : 'warn');
    } finally { starting = false; showPlaying(); pb.refresh(); }
  }
  /** Listen: the drums on the Pi, and their sound here over the relay. One press, a browser needs one. */
  async function listen() {
    if (listening) {
      try { lift?.disconnect(); } catch { /* not connected */ }
      try { board.playout()?.disconnect(scope); } catch { /* not connected */ }
      cols.fill(0);
      listening = false; buttons.setIcon('listen', 'headphones', 'listen here');
      d.log('not listening here; the Pi still plays out of its PWM output', 'dim');
      return pb.refresh();
    }
    if (!await reached()) return;
    ctx.resume().catch(() => {});
    if (!await drumsOnPi()) return;
    if (!await board.startAudio()) { d.log('the Pi\'s sound cannot be played in this page', 'warn'); return; }
    lift ??= ctx.createGain();
    lift.gain.value = LIFT;
    board.playout().connect(lift);
    lift.connect(ctx.destination);
    if (!scope) { scope = ctx.createAnalyser(); scope.fftSize = 4096; sbuf = new Float32Array(scope.fftSize); }
    board.playout().connect(scope);
    listening = true; buttons.setIcon('listen', 'mute', 'stop listening here');
    d.log('listening to the Pi\'s drums here', 'ok');
    pb.refresh();
  }

  // ── the drone: Plaits on the Pi (rig/board/plaits.mjs), one held low note on its Growl drone patch ──
  const GROWL = PLAITS.find((p) => p.name === 'Growl drone');
  const DRONE_NOTE = 36;   // C2, 65 Hz: the waveshaper's folds put its growl in the range a small speaker plays
  const DIALS = [['harmonics', 'harm'], ['timbre', 'timbre'], ['morph', 'morph']];
  let droning = false, droneBusy = false, droneUp = false, keep = 0, turnedAt = 0;
  const dial = (name) => knobs.get(name).value();
  function setDial(name, v) {
    turnedAt = performance.now();
    if (droning && connected) board.send({ type: 'plaits.set', name, v });
  }
  const knobs = new Map(DIALS.map(([name, short]) => [name, createKnob({ label: short, title: name, min: 0, max: 1,
    value: GROWL[name], home: GROWL[name], onInput: (v) => setDial(name, v) })]));
  /** Plaits up on the Pi, the patch, the panel's three values, its sound to the PWM output, then the note. */
  async function droneOn() {
    if (!droneUp) {
      const up = await board.ask({ type: 'audio.start', source: 'plaits' }, 'audio.started', 20000);
      if (!up?.ok) { d.log(`the Pi did not start Plaits: ${up?.reason ?? 'no answer'}`, 'warn'); return false; }
      const j = await board.ask({ type: 'jack.link', link: 'pi-1:plaits:audio-out -> pi-1:pwm:audio-in' }, 'jack.linked', 8000);
      if (!j?.ok) d.log(`Plaits' sound did not reach the PWM output: ${(j?.problems || []).join(', ') || j?.hint || 'no answer'}`, 'warn');
      droneUp = true;
    }
    const p = await board.ask({ type: 'plaits.patch', name: GROWL.name }, 'plaits.patch', 4000);
    if (!p?.ok) { d.log(`the Pi did not take the ${GROWL.name} patch: ${p?.reason ?? 'no answer'}`, 'warn'); return false; }
    // pitch is Plaits' transpose, kept on the Pi between pages; 0 so the note is the one asked for
    board.send({ type: 'plaits.set', name: 'pitch', v: 0 });
    for (const [name] of DIALS) board.send({ type: 'plaits.set', name, v: dial(name) });
    const on = await board.ask({ type: 'note.on', node: 'plaits', note: DRONE_NOTE, vel: 100 }, 'note.ack', 4000);
    if (!on?.ok) { d.log(`the Pi did not hold the drone: ${on?.reason ?? 'no answer'}`, 'warn'); return false; }
    // the Pi releases a note whose page has said nothing for 15 s; this speaks every 5 s, hidden or not
    clearInterval(keep); keep = setInterval(() => board.send({ type: 'plaits.stats' }), 5000);
    return true;
  }
  function droneOff() {
    clearInterval(keep); keep = 0;
    if (connected) board.send({ type: 'note.off', node: 'plaits', note: DRONE_NOTE });
  }
  async function drone() {
    if (droneBusy) return;
    if (droning) { droneOff(); droning = false; showDrone(); d.log('the drone is released; Plaits stays up on the Pi', 'dim'); return pb.refresh(); }
    if (!await reached()) return;
    droneBusy = true;
    try {
      droning = await droneOn();
      if (droning) d.log(`the Pi holds a drone on Plaits, ${GROWL.name}, C2`, 'ok');
    } finally { droneBusy = false; showDrone(); pb.refresh(); }
  }
  // the page going away lets go at once, rather than after the Pi's 15 s
  addEventListener('pagehide', () => { if (droning) droneOff(); });

  // ── the wave: the Pi's sound as it arrives here, a column every draw, newest on the right, in Palm pixels ──
  const WAVE_W = PALM_W, WAVE_H = PALM_W / 4, FULL = 0.5;
  const waveCv = Object.assign(document.createElement('canvas'), { width: WAVE_W, height: WAVE_H, className: 'pm-wave' });
  const waveG = waveCv.getContext('2d');
  const waveImg = waveG.createImageData(WAVE_W, WAVE_H);
  const cols = new Float32Array(WAVE_W * 2);   // [lo, hi] per column, oldest first
  let scope = null, sbuf = null, waveAt = 0;
  function wave(t) {
    cols.copyWithin(0, 2);
    let lo = 0, hi = 0;
    if (listening && scope) {
      scope.getFloatTimeDomainData(sbuf);
      const n = Math.min(sbuf.length, Math.max(1, Math.round((t - waveAt) * BOARD_RATE / 1000)));
      for (let i = sbuf.length - n; i < sbuf.length; i++) { const v = sbuf[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    }
    waveAt = t;
    cols[WAVE_W * 2 - 2] = Math.max(-1, lo / FULL); cols[WAVE_W * 2 - 1] = Math.min(1, hi / FULL);
    const px = waveImg.data, mid = WAVE_H / 2;
    px.fill(0);
    for (let x = 0; x < WAVE_W; x++) {
      // at least the middle row, so silence is a one pixel flat line
      const y0 = Math.min(mid, Math.floor(mid - cols[x * 2 + 1] * mid)), y1 = Math.max(mid, Math.ceil(mid - cols[x * 2] * mid) - 1);
      const v = cols[x * 2 + 1] - cols[x * 2] > 0.02 ? 255 : 85;
      for (let y = Math.max(0, y0); y <= Math.min(WAVE_H - 1, y1); y++) { const i = (y * WAVE_W + x) * 4; px[i] = px[i + 1] = px[i + 2] = v; }
    }
    for (let i = 3; i < px.length; i += 4) px[i] = 255;
    waveG.putImageData(waveImg, 0, 0);
  }

  // ── the Palm: the same picture and the same pen as the real one ──
  const pens = PD.createPen(grid, {
    onFlip: () => edited(),
    onPlay: () => transport(),
    onClear: () => { for (const row of grid) row.fill(false); edited(); },
  });
  const box = el('div');
  const palm = createPalm(box, { onPen: ({ x, y, down }) => { pen = { x, y, down }; pens.pen(x, y, down); draw(); } });
  const ink = new Uint8Array(PALM_W * PALM_H), rgba = new Uint8ClampedArray(PALM_W * PALM_H * 4);
  const put = (x, y, v) => { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < PALM_W && y < PALM_H && v > ink[y * PALM_W + x]) ink[y * PALM_W + x] = v; };
  const rect = (x, y, w, h, v) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(x + i, y + j, v); };
  function draw() {
    ink.fill(0);
    const now = stepNow();
    PD.draw({ rect, put }, { grid, step: now, running: now >= 0, starting, selRow: -1, pen });
    // white on black, as the Palm draws it
    for (let i = 0; i < ink.length; i++) { const v = ink[i] * 17; rgba[i * 4] = rgba[i * 4 + 1] = rgba[i * 4 + 2] = v; rgba[i * 4 + 3] = 255; }
    palm.show(rgba);
    frames++;
  }
  let prev = 0;
  (function tick(t) { if (!document.hidden && t - prev >= 66) { prev = t; draw(); wave(t); } requestAnimationFrame(tick); })(0);

  // ── the patch: this tab's Palm into the Pi's sequencer, its drums out of the PWM output and, on Listen, here;
  // the drone toggle and three knobs into Plaits on the Pi, beside the drums ──
  const port = (node, medium, dir) => ({ id: `${node}:${medium}-${dir}`, dir, medium });
  const NODES = [{ id: 'web:palm', kind: 'screen', label: 'Palm in this tab' }, { id: 'pi-1:sequencer', kind: 'engine', label: 'sequencer on the Pi' },
    { id: 'pi-1:drums', kind: 'engine', label: 'drums on the Pi' }, { id: 'pi-1:pwm', kind: 'device', label: 'PWM out' },
    { id: 'web:drone', kind: 'person', label: 'drone' },
    ...DIALS.map(([name]) => ({ id: `web:knob-${name}`, kind: 'person', label: name })),
    { id: 'pi-1:plaits', kind: 'engine', label: 'Plaits on the Pi' },
    { id: 'web:speaker', kind: 'device', label: 'speaker' }];
  const PORTS = [port('web:palm', 'value', 'out'), port('pi-1:sequencer', 'value', 'in'), port('pi-1:sequencer', 'midi', 'out'),
    port('pi-1:drums', 'midi', 'in'), port('pi-1:drums', 'audio', 'out'), port('pi-1:pwm', 'audio', 'in'), port('web:speaker', 'audio', 'in'),
    port('web:drone', 'midi', 'out'), ...DIALS.map(([name]) => port(`web:knob-${name}`, 'value', 'out')),
    port('pi-1:plaits', 'midi', 'in'), port('pi-1:plaits', 'value', 'in'), port('pi-1:plaits', 'audio', 'out')];
  const LINKS = () => [
    { id: 'a', from: 'web:palm:value-out', to: 'pi-1:sequencer:value-in' },
    { id: 'b', from: 'pi-1:sequencer:midi-out', to: 'pi-1:drums:midi-in' },
    { id: 'c', from: 'pi-1:drums:audio-out', to: 'pi-1:pwm:audio-in' },
    ...(listening ? [{ id: 'd', from: 'pi-1:drums:audio-out', to: 'web:speaker:audio-in' }] : []),
    { id: 'e', from: 'web:drone:midi-out', to: 'pi-1:plaits:midi-in' },
    ...DIALS.map(([name]) => ({ id: `k-${name}`, from: `web:knob-${name}:value-out`, to: 'pi-1:plaits:value-in' })),
    { id: 'f', from: 'pi-1:plaits:audio-out', to: 'pi-1:pwm:audio-in' },
    ...(listening ? [{ id: 'g', from: 'pi-1:plaits:audio-out', to: 'web:speaker:audio-in' }] : []),
  ];
  const FLOW = { a: () => performance.now() - editAt < 400, e: () => droning, f: () => droning, g: () => droning };
  const pb = createPatchbay({ nodes: () => NODES, ports: () => PORTS, links: LINKS },
    { flowing: (l) => (FLOW[l.id] ? FLOW[l.id]() : l.id.startsWith('k-') ? droning && performance.now() - turnedAt < 400 : seq.running) });

  // the presentation copy: play and Listen in the screen's footer, since the layout's top bar holds How it works and the arrows
  const top = createButtonGroup({ buttons: [{ id: 'play', icon: 'play', label: 'play the Pi\'s sequencer', onPress: () => transport() }] });
  function showPlaying() { top?.setIcon('play', seq.running ? 'stop' : 'play', seq.running ? 'stop the Pi\'s sequencer' : 'play the Pi\'s sequencer'); }
  // one style in the footer: two icon buttons, play or stop the sequencer, listen here or stop
  const buttons = createButtonGroup({ buttons: [{ id: 'listen', icon: 'headphones', label: 'listen here', title: 'start the drums on the Pi and hear them here', onPress: () => listen() }] });
  // the drone's toggle lights while the Pi holds the note
  const droneBtn = createIconButton({ icon: 'waveform', label: 'hold a drone on Plaits on the Pi', pressed: false, onPress: () => drone() });
  function showDrone() { droneBtn.pressed(droning); droneBtn.set('waveform', droning ? 'release the drone' : 'hold a drone on Plaits on the Pi'); }
  const split = el('div', 'pm-split');
  split.append(palm.el, waveCv);
  const panel = createVideoPanel({ media: split, left: null, aspect: '4 / 5', fullMode: 'footer' });
  panel.stage.classList.add('pm-stage');
  const footLeft = el('div', 'pm-foot-left');
  footLeft.append(top.el, buttons.el, droneBtn.el);
  panel.slots.left.append(footLeft);
  const dials = el('div', 'pm-knobs');
  dials.append(...[...knobs.values()].map((k) => k.el));
  panel.slots.centre.append(dials);

  // ── the presentation layout (present-layout.mjs); extra is the footer's height, measured below on every resize ──
  const FOOT_PX = 105;
  const lay = createPresentLayout({
    title: 'Pi + Palm', sub: 'The Palm\'s drum grid in a tab, over the Pi\'s sound. Draw steps for the drums and hold a Plaits drone beside them.',
    desc: 'web:palm sends the grid as a value through cf-relay:room, Cloudflare\'s relay room studio-1, to pi-1:sequencer, whose midi-out plays pi-1:drums. web:drone holds one note on pi-1:plaits:midi-in, and three knob nodes send harmonics, timbre and morph to its value-in over the same room. Both engines feed pi-1:pwm over JACK. Listen adds their audio links to web:speaker: one summed capture, sent as sound frames over the relay and drawn as the wave. Nothing reaches the relay until the first press.',
    main: panel.el, aspect: '4 / 5', extra: `${FOOT_PX}px`, patch: pb.el,
    onHow: (on) => { if (on) pb.refresh(); },
  });
  // the knobs make the footer taller than a button row, and how much depends on the face; read, never typed
  const mainBox = lay.root.querySelector('.prl-main');
  new ResizeObserver(() => { const h = panel.foot.getBoundingClientRect().height; if (h) mainBox.style.setProperty('--prl-extra', `${Math.ceil(h)}px`); }).observe(panel.foot);
  window.__demo.raid = () => lay.keys.raid();
  window.__demo.how = lay.setHow;
  window.__demo.footH = () => panel.foot.getBoundingClientRect().height;

  window.__demo.probe = () => ({ connected, running: seq.running, bpm: seq.bpm, step: stepNow(), listening, frames, sent: sentN,
    on: grid.flat().filter(Boolean).length, droning, droneUp, dials: Object.fromEntries(DIALS.map(([n]) => [n, dial(n)])),
    links: LINKS().length, board: !!board });
  d.ready();
</script>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Circuit on Pi screen</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The simulated module as on /devices/control/: the panel at a whole number scale, its keys on its right.
     why: lessons/page-devices.md#text */
  .ol-media { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 24px 16px; height: calc(64px * 4 + 48px); background: #07090d; overflow-x: auto; }
  .ol-media canvas { display: block; flex: none; width: calc(128px * var(--ol-k, 2)); height: calc(64px * var(--ol-k, 2)); image-rendering: pixelated; }
  .ol-frame { padding: 8px; border: 1px solid var(--line); border-radius: 2px; line-height: 0; background: #000; }
  .ol-media .pos-bgroup { flex: none; margin-left: auto; align-self: center; }
  .ol-screen { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; min-width: 0; }
  .ol-say { font-size: 12px; color: var(--dim); }
</style>
<script type="module">
  // The Novation Circuit on the Pi's 128x64 OLED, simulated, split in two: its knobs on top, its drum grid
  // below. Up and down switch the top half. Only knob names and values are on the screen. No Pi, no relay.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { paintFrame } from '/shell/panel-screen.mjs';
  import { param, onChannel } from '/shell/circuit-cc.mjs';
  import { createSurface, blit, pixel, drawDrums, W } from '../split/split-oled.mjs';
  import { drawSliders } from '../control/sliders.mjs';

  const d = mount({ name: 'Circuit on Pi screen', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/knobs');

  // The Pi screens' knobs size, twelve columns, gap 3, values 0 to 99: the eight on the left, the empty volume
  // column and two more, the filter at the right edge.
  // The Circuit's VOLUME knob is not drawn: whether it sends MIDI at all is not measured. To add it once it
  // is, give column 8 `{ id: 'vol', name: 'VO', ch, cc }` in each view below.
  const COLS = 12, VOL = 8;
  const FILTER = { id: 'fi', name: 'FI', ch: '16', cc: 74, how: 'measured' };
  const macros = (midi) => Array.from({ length: 8 }, (_, i) => ({ id: `m${i + 1}`, name: `M${i + 1}`, ch: '1/2', midi, cc: 80 + i, how: midi === 1 ? 'measured' : 'Reference' }));
  const drum = (n, what, letter) => ({ id: `d${n}${letter}`, name: `${n}${letter}`, ch: '10',
    cc: onChannel('10').find((p) => p.name === `drum ${n} ${what}`).cc, how: 'Reference' });
  const VIEWS = [
    { key: 'synth 1', cols: [...macros(1), null, null, null, FILTER] },
    { key: 'synth 2', cols: [...macros(2), null, null, null, FILTER] },
    { key: 'drums', cols: [...[1, 2, 3, 4].flatMap((n) => [drum(n, 'level', 'L'), drum(n, 'pitch', 'P')]), null, null, null, null] },
  ];
  // each knob's own slow drift, a phase and a period from its place, 0 to 127
  const valueOf = (vi, i, t) => Math.round(63.5 + 50 * Math.sin(t / (5000 + i * 900 + vi * 1300) + i * 1.7 + vi));
  const PATTERN = ['1000100010001000', '0000100000001001', '1010101010101010', '0000000100000010'];
  const step = (t) => Math.floor(t / 125) % 16;

  let at = 0, lastFrame = null;
  const top = (vi, t) => {
    const sf = createSurface(W, 32);
    const geo = drawSliders(sf, VIEWS[vi].cols.map((c, i) => c && { v: valueOf(vi, i, t) / 127, name: c.name, value: String(Math.round(valueOf(vi, i, t) / 127 * 99)) }), { gap: 3 });
    return { sf, geo };
  };
  const bottom = (t) => { const sf = createSurface(W, 32); drawDrums(sf, { pattern: PATTERN, step: step(t), playing: true }); return sf; };
  function compose(t, { only = null, view = at } = {}) {
    const f = new Uint8Array(1024);
    if (only !== 'bottom') blit(f, top(view, t).sf, 0, 0);
    if (only !== 'top') blit(f, bottom(t), 0, 32);
    return f;
  }

  // ── the screen, its two keys, and what each half is said on the page ──
  const cv = Object.assign(document.createElement('canvas'), { width: 128, height: 64 });
  const keys = createButtonGroup({ orient: 'column', buttons: [
    { id: 'up', icon: 'chevron-up', label: 'up, the previous knobs', onPress: () => move(-1) },
    { id: 'down', icon: 'chevron-down', label: 'down, the next knobs', onPress: () => move(1) },
  ] });
  const media = el('div', 'ol-media');
  const screenBox = el('div', 'ol-screen');
  const frame = el('div', 'ol-frame');
  frame.append(cv);
  screenBox.append(frame);
  media.append(screenBox, keys.el);
  const say = el('span', 'ol-say', '');
  const panel = createVideoPanel({ media, left: say, aspect: 'auto' });
  const table = createTable({ columns: [
    { key: 'where', label: 'shown', width: 64 },
    { key: 'view', label: 'view', width: 72 },
    { key: 'knobs', label: 'on screen', grow: true, clip: true, hover: 'knobs' },
    { key: 'cc', label: 'CC', width: 120, clip: true, hover: 'cc' },
    { key: 'ch', label: 'ch', width: 40 },
    { key: 'how', label: 'source', width: 88 },
  ] });
  const ROWS = [
    { view: 'synth 1', knobs: 'M1 to M8, macros', cc: '80 to 87', ch: '1', how: 'measured', top: 0 },
    { view: 'synth 1', knobs: 'FI, master filter', cc: '74', ch: '16', how: 'measured', top: 0 },
    { view: 'synth 2', knobs: 'M1 to M8, macros', cc: '80 to 87', ch: '2', how: 'Reference', top: 1 },
    { view: 'synth 2', knobs: 'FI, master filter', cc: '74', ch: '16', how: 'measured', top: 1 },
    ...['level', 'pitch'].map((what) => ({ view: 'drums', knobs: `1${what[0].toUpperCase()} to 4${what[0].toUpperCase()}, drum ${what}`,
      cc: VIEWS[2].cols.filter((c) => c?.name.endsWith(what[0].toUpperCase())).map((c) => c.cc).join(', '), ch: '10', how: 'Reference', top: 2 })),
    { view: 'any', knobs: 'VO, master volume, the empty column before FI', cc: 'not drawn', ch: '', how: 'not measured', top: -1 },
    { view: 'grid', knobs: 'drums 1 to 4, 16 steps', cc: 'notes 60, 62, 64, 65', ch: '10', how: 'measured', top: -2 },
  ];
  function label() {
    say.textContent = `top ${VIEWS[at].key}, ${at + 1} of ${VIEWS.length}, bottom the drum grid`;
    table.set(ROWS.map((r) => ({ ...r, where: r.top === at ? 'top' : r.top === -2 ? 'bottom' : '' })));
  }
  function move(dir) { at = (at + dir + VIEWS.length) % VIEWS.length; label(); }
  addEventListener('keydown', (e) => {
    if (e.target.closest?.('input, textarea, select, button')) return;
    if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); } else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  });
  label();
  d.stack.add(panel.el, table.el);

  let frames = 0;
  (function run(now) {
    lastFrame = compose(now);
    paintFrame(cv, lastFrame);
    frames++;
    requestAnimationFrame(run);
  })(performance.now());

  window.__demo.probe = () => ({ at, view: VIEWS[at].key, frames });

  if (SELFCHECK) {
    await new Promise((r) => setTimeout(r, 400));
    const lit = (f, y0, y1, x0 = 0, x1 = 128) => { let n = 0; for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) n += pixel(f, x, y); return n; };
    d.assert('the screen draws', frames > 0 && lit(lastFrame, 0, 64) > 0);
    let inTop = true, inBottom = true;
    for (let vi = 0; vi < VIEWS.length; vi++) {
      const f = compose(1000, { only: 'top', view: vi });
      if (!lit(f, 0, 32) || lit(f, 32, 64)) inTop = false;
    }
    d.assert('every knob view draws in rows 0 to 31 and nowhere below', inTop);
    const b = compose(1000, { only: 'bottom' });
    if (!lit(b, 32, 64) || lit(b, 0, 32)) inBottom = false;
    d.assert('the drum grid draws in rows 32 to 63 and nowhere above', inBottom, `${lit(b, 0, 32)} above, ${lit(b, 32, 64)} in`);
    const was = at, before = compose(1000, { only: 'top' });
    keys.button('down').click();
    const after = compose(1000, { only: 'top' });
    d.assert('down switches the top half to the next view and names it', at === (was + 1) % VIEWS.length
      && after.some((v, i) => v !== before[i]) && say.textContent.startsWith(`top ${VIEWS[at].key}`));
    keys.button('up').click();
    d.assert('up brings the first view back', at === was);
    // negative control: the volume column is empty in every view, while M1 is drawn
    const { geo } = top(0, 1000), vol = geo[VOL], m1 = geo[0];
    let empty = true;
    for (let vi = 0; vi < VIEWS.length; vi++) if (lit(compose(1000, { only: 'top', view: vi }), 0, 32, vol.x, vol.x + vol.w)) empty = false;
    d.assert('the volume column is not drawn, since its MIDI is not measured', COLS === VIEWS[0].cols.length && empty
      && lit(compose(1000, { only: 'top', view: 0 }), 0, 32, m1.x, m1.x + m1.w) > 0, `column ${vol.x} to ${vol.x + vol.w - 1}`);
    d.assert('every CC on screen is in the Programmer\'s Reference table', VIEWS.every((v) => v.cols.every((c) => !c || param(c.ch, c.cc))));
    d.assert('a visit fetches nothing but the log', performance.getEntriesByType('resource')
      .filter((r) => r.initiatorType === 'fetch' || r.initiatorType === 'xmlhttprequest').every((r) => /\/_log/.test(r.name)));
  }
  d.ready();
</script>

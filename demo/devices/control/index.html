<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Pi remote control</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* The simulated module as on /devices/drums/: the panel at a whole number scale, its keys on its right. */
  .ol-media { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 24px 16px; height: calc(64px * 4 + 48px); background: #07090d; overflow-x: auto; }
  .ol-media canvas { display: block; flex: none; width: calc(128px * var(--ol-k, 2)); height: calc(64px * var(--ol-k, 2)); image-rendering: pixelated; }
  .ol-frame { padding: 8px; border: 1px solid var(--line); border-radius: 2px; line-height: 0; background: #000; }
  .ol-media .pos-bgroup { flex: none; margin-left: auto; align-self: center; }
  .ol-screen { flex: 1 1 auto; display: flex; justify-content: center; align-items: center; min-width: 0; }
  .ol-say { font-size: 12px; color: var(--dim); }
  .rc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .rc-head .pos-bgroup { flex: none; width: auto; }
</style>
<script type="module">
  // The remote control of the patchbay manager, simulated: a model of the manager's record drives the
  // Pi's screen, and the screen's keys, the patch table and Stop all all act on that one record through
  // the bay. No relay, no board, no sound. why: plans/plan-patchbay-manager.md section 5
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, parseLink } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { paintFrame } from '/shell/panel-screen.mjs';
  import { BOARD_SITE, boardGraph, addBoardNode, PWM_PORTS } from '/shell/graph-registry.mjs';
  import { DRUM_MAPS } from '/shell/drum-maps.mjs';
  import { createPiModel, PATCHES, MENU, HOLD_MS, LOAD_MS, VOICES } from '/devices/control/menu-oled.mjs';
  import { pixel, lit } from '/devices/split/split-oled.mjs';
  useMediumColours();

  const d = mount({ name: 'Pi remote control', what: '', readout: null, index: '/', indexLabel: 'positron' });
  conceptNav('devices/control');

  const P = BOARD_SITE, ROOM = 'studio-1';
  const MGR = `${P}:manager`, MGR_IN = `${MGR}:value-in`, MGR_OUT = `${MGR}:value-out`;
  const PI_KEYS_OUT = `${P}:keys:value-out`, PI_SCR_IN = `${P}:screen:value-in`, PI_SCR_OUT = `${P}:screen:value-out`;
  const KEYS_OUT = 'web:keys:value-out', CTL_OUT = 'web:control:value-out', CTL_IN = 'web:table:value-in';
  const MIRROR_IN = 'web:screen:value-in';

  // ── the manager's record, simulated in the tab; what it changes leaves on its out-port ──
  const pi = createPiModel({ onChange: (why) => changed(why) });
  let lastFrame = null, frames = 0, painted = 0, states = 0;
  const onManager = (ev) => {
    const t = ev.t ?? performance.now();
    if (ev.cls === 'key') pi.key(ev.k, ev.down, t);
    else if (ev.cls === 'load') { const r = pi.load(ev.name, t, ev.by || 'remote'); if (!r.ok) d.log(`load refused: ${r.why}`, 'warn'); }
    else if (ev.cls === 'stop') pi.stop(t, ev.by || 'remote');
    draw(t);
  };
  let toldLinks = '', toldPlaying = '';
  function changed(why) {
    const st = { cls: 'state', playing: pi.s.playing, loading: pi.s.loading, links: pi.links(), by: pi.s.by };
    const sig = JSON.stringify([st.playing, st.loading, st.links]);
    if (sig !== toldLinks) { toldLinks = sig; bay.send(MGR_OUT, st); }
    if (why === 'step') sequencerNotes();
  }
  /** One frame per change, as the board's mirror sends only changed frames. */
  function draw(t) {
    const f = pi.frame(t);
    if (lastFrame && f.length === lastFrame.length && f.every((b, i) => b === lastFrame[i])) return;
    lastFrame = f; frames++;
    bay.send(MGR_OUT, { cls: 'frame', frame: f, view: f.view });
  }

  // ── the bay: the page's keys and table, the manager, the Pi's screen and its mirror here, and the patch ──
  const bay = createBay();
  bay.addNode({ id: 'web:keys', kind: 'person', label: 'remote keys', place: 'browser' });
  // Two nodes, because the bay refuses a loop: the presses go out of one, the manager's state comes into the other.
  bay.addNode({ id: 'web:control', kind: 'person', label: 'loads and stop all', place: 'browser' });
  bay.addNode({ id: 'web:table', kind: 'screen', label: 'patch table', place: 'browser' });
  bay.addNode({ id: 'web:screen', kind: 'screen', label: 'mirrored screen', place: 'browser' });
  bay.addNode({ id: `${P}:keys`, kind: 'device', label: 'four keys', place: ROOM });
  bay.addNode({ id: MGR, kind: 'engine', label: 'patchbay manager', place: ROOM });
  bay.addNode({ id: `${P}:screen`, kind: 'device', label: 'OLED 128x64', place: ROOM });
  bay.addPort({ id: KEYS_OUT, dir: 'out', medium: 'value', emits: ['key'], label: 'keys:value-out' });
  bay.addPort({ id: PI_KEYS_OUT, dir: 'out', medium: 'value', emits: ['key'], label: 'keys:value-out' });
  bay.addPort({ id: CTL_OUT, dir: 'out', medium: 'value', emits: ['load', 'stop'], label: 'control:value-out' });
  bay.addPort({ id: CTL_IN, dir: 'in', medium: 'value', accepts: ['state'], label: 'table:value-in',
    deliver: (ev) => { if (ev.cls === 'state') onState(ev); } });
  bay.addPort({ id: MGR_IN, dir: 'in', medium: 'value', accepts: ['key', 'load', 'stop'], label: 'manager:value-in', deliver: onManager });
  bay.addPort({ id: MGR_OUT, dir: 'out', medium: 'value', emits: ['frame', 'state'], label: 'manager:value-out' });
  bay.addPort({ id: PI_SCR_IN, dir: 'in', medium: 'value', accepts: ['frame'], label: 'screen:value-in',
    deliver: (ev) => { if (ev.cls === 'frame') bay.send(PI_SCR_OUT, ev); } });
  bay.addPort({ id: PI_SCR_OUT, dir: 'out', medium: 'value', emits: ['frame'], label: 'screen:value-out' });
  bay.addPort({ id: MIRROR_IN, dir: 'in', medium: 'value', accepts: ['frame'], label: 'screen:value-in',
    deliver: (ev) => { if (ev.cls === 'frame') { paintFrame(cv, ev.frame); painted++; } } });
  const CONTROL = [[KEYS_OUT, MGR_IN], [PI_KEYS_OUT, MGR_IN], [CTL_OUT, MGR_IN], [MGR_OUT, PI_SCR_IN], [PI_SCR_OUT, MIRROR_IN], [MGR_OUT, CTL_IN]];
  const held = [];
  for (const [a, b] of CONTROL) {
    const r = bay.link(a, b);
    if (r.ok) held.push(r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  // The board's nodes the five patches touch, as the board announces them.
  const G = boardGraph({ room: ROOM, gpu: false, sequencer: true, jack: true, instruments: { collide: true, plaits: true },
    drums: { circuit: DRUM_MAPS.circuit, drums: DRUM_MAPS.gm }, alsa: [{ client: 'MK-425C USB MIDI Keyboard' }],
    outputs: [{ device: 'hw:CARD=Headphones', jack: PWM_PORTS }],
    inputs: [{ name: 'circuit', channels: 2, midi: { port: 'Circuit', channels: [1, 2, 10] } }] });
  const LABELS = { sequencer: 'sequencer', drums: 'drums', circuit: 'Circuit', plaits: 'Plaits', 'mk-425c': 'MK-425C', pwm: 'PWM out' };
  for (const [n, label] of Object.entries(LABELS)) if (!addBoardNode(bay, G, n, { label })) d.log(`the board graph has no ${n}`, 'warn');

  // ── the patch's links: what the manager says it holds, drawn by parsing its lines ──
  let patchIds = [], refusals = 0;
  function onState(st) {
    states++;
    for (const id of patchIds) bay.unlink(id);
    patchIds = [];
    for (const line of st.links) {
      const L = parseLink(line);
      const r = bay.link(L.from, L.to, L.transforms, { site: P });
      if (r.ok) patchIds.push(r.id); else { refusals++; d.log(`${line} refused: ${r.why}`, 'warn'); }
    }
    const now = st.loading ? `loading ${st.loading}` : st.playing ? `${st.playing} plays` : 'nothing plays';
    if (st.playing !== toldPlaying || st.loading) d.log(`the manager: ${now}${st.by ? `, by the ${st.by}` : ''}`);
    toldPlaying = st.playing;
    table.set(rows());
    table.mark((r) => r.name === (st.playing || st.loading));
    pb.refresh();
  }
  /** On a step with hits, the sequencer's notes go along its link, so the wire pulses as the Pi plays. */
  const GM = { BD: 36, SD: 38, CH: 42, OH: 46 };
  function sequencerNotes() {
    const q = pi.s.seq;
    for (let r = 0; r < VOICES.length; r++) if (q.pattern[r][q.step]) bay.send(`${P}:sequencer:midi-out`, { cls: 'note', ch: 10, d1: GM[VOICES[r]], d2: 100 });
  }

  // The picture shows the control path always and, beside it, only the nodes the patch links.
  const SHOWN_ALWAYS = new Set(['web:keys', 'web:control', 'web:table', 'web:screen', `${P}:keys`, MGR, `${P}:screen`]);
  const nodeOf = (id) => id.split(':').slice(0, 2).join(':');
  const used = () => new Set(bay.links().flatMap((l) => [l.from, l.to]));
  const pb = createPatchbay({
    nodes: () => { const u = new Set([...used()].map(nodeOf)); return bay.nodes().filter((n) => SHOWN_ALWAYS.has(n.id) || u.has(n.id)); },
    ports: () => { const u = used(); return bay.ports().filter((p) => u.has(p.id)); },
    links: () => bay.links(),
  }, { room: ROOM, flowing: (l) => !!pi.s.playing && (l.from.endsWith(':audio-out')) });

  // ── the simulated screen and its four keys: pointer, and the arrows, Enter and Space ──
  const cv = Object.assign(document.createElement('canvas'), { width: 128, height: 64 });
  const SYMS = ['^', 'v', '#', '*'], ICONS = ['chevron-up', 'chevron-down', 'hash', null];
  const keys = createButtonGroup({ orient: 'column', buttons: SYMS.map((s, i) => ({ id: `k${i + 1}`,
    ...(ICONS[i] ? { icon: ICONS[i], label: `K${i + 1}, the ${s} key` } : { label: s }) })) });
  keys.button('k4').dataset.glyph = '1';
  keys.button('k4').title = 'tap: play or stop. Hold 1 s: stop all';
  const down = new Set();
  const edge = (k, isDown, t) => {
    if (isDown === down.has(k)) return;
    if (isDown) down.add(k); else down.delete(k);
    bay.send(KEYS_OUT, { cls: 'key', k, sym: SYMS[k - 1], down: isDown, ...(t !== undefined ? { t } : {}) });
  };
  SYMS.forEach((s, i) => {
    const b = keys.button(`k${i + 1}`);
    b.addEventListener('pointerdown', () => edge(i + 1, true));
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => edge(i + 1, false));
  });
  const KEYMAP = { ArrowUp: 1, ArrowDown: 2, Enter: 3, ' ': 4 };
  const ours = (e) => !e.target?.closest?.('input, textarea, select, .pos-tbl, button, a');
  addEventListener('keydown', (e) => { const k = KEYMAP[e.key]; if (!k || !ours(e)) return; e.preventDefault(); if (!e.repeat) edge(k, true); });
  addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (!k || !ours(e)) return; e.preventDefault(); edge(k, false); });
  addEventListener('blur', () => { for (const k of [...down]) edge(k, false); });

  const media = el('div', 'ol-media'), screenBox = el('div', 'ol-screen'), frameEl = el('div', 'ol-frame');
  frameEl.append(cv);
  screenBox.append(frameEl);
  media.append(screenBox, keys.el);
  const ZOOMS = [2, 4];
  let zi = 0;
  const scale = el('span', 'ol-say', '');
  const zoomBtns = createButtonGroup({ buttons: [
    { id: 'out', icon: 'zoom-out', label: 'zoom out', onPress: () => setZoom(zi - 1) },
    { id: 'in', icon: 'zoom-in', label: 'zoom in', onPress: () => setZoom(zi + 1) },
  ] });
  function setZoom(i) {
    zi = Math.max(0, Math.min(ZOOMS.length - 1, i));
    media.style.setProperty('--ol-k', String(ZOOMS[zi]));
    scale.textContent = `128×64 at ${ZOOMS[zi]}x`;
    zoomBtns.enable('out', zi > 0, 'smallest');
    zoomBtns.enable('in', zi < ZOOMS.length - 1, 'largest');
  }
  setZoom(zi);
  const panel = createVideoPanel({ media, left: scale, right: zoomBtns.el, aspect: 'auto' });

  // ── the remote page's own controls: the patch table and Stop all ──
  const rows = () => PATCHES.map((p) => ({ name: p.name, label: p.label, screen: p.screen,
    state: p.name === pi.s.playing ? 'playing' : p.name === pi.s.loading ? 'loading' : '' }));
  const table = createTable({ columns: [
    { key: 'name', label: 'patch', width: 80, hi: true },
    { key: 'label', label: 'what', grow: true, clip: true },
    { key: 'screen', label: 'screen', width: 72 },
    { key: 'state', label: 'state', width: 72 },
  ], minRows: PATCHES.length, onPick: (r) => bay.send(CTL_OUT, { cls: 'load', name: r.name }) });
  table.set(rows());
  const stopAll = createButtonGroup({ buttons: [{ id: 'stop', label: 'Stop all', onPress: () => bay.send(CTL_OUT, { cls: 'stop' }) }] });
  const head = el('div', 'rc-head');
  head.append(el('h3', 'pos-sec-h', 'patches'), stopAll.el);
  const box = el('div', 'cc-stack');
  box.append(head, table.el);

  // ── the clock: the manager's tick (load, hold, sequencer), then a frame if the screen changed ──
  (function tick() {
    const t = performance.now();
    pi.tick(t);
    draw(t);
    requestAnimationFrame(tick);
  })();

  d.stack.add(panel.el, box, pb.el);
  window.__demo.bay = bay;
  window.__demo.probe = () => ({ playing: pi.s.playing, loading: pi.s.loading, sel: pi.s.sel, view: lastFrame?.view,
    frames, painted, states, stops: pi.s.stops, links: pi.links(), refusals });

  if (SELFCHECK) {
    const T = () => performance.now();
    d.assert('six control links: both sets of keys and the table to the manager, the manager to the screen and the table, the screen to its mirror',
      held.length === CONTROL.length, `${held.length} of ${CONTROL.length}`);
    draw(T());
    d.assert('the menu draws on the mirrored screen, which painted what arrived on its link', lastFrame?.view === 'menu' && lit(lastFrame) > 0 && painted > 0, `${painted} painted`);
    const rowLit = (i) => pixel(lastFrame, 0, MENU.rowY(i) + 1) === 1;
    d.assert('the selected row is the first, drawn as a filled box inside the screen', rowLit(0) && !rowLit(1) && MENU.rowY(MENU.rows - 1) + MENU.rowH <= MENU.barY);
    const t0 = T();
    bay.send(KEYS_OUT, { cls: 'key', k: 2, down: true, t: t0 }); bay.send(KEYS_OUT, { cls: 'key', k: 2, down: false, t: t0 + 50 });
    d.assert('v moves the selection to the second row, and the screen shows it', pi.s.sel === 1 && rowLit(1) && !rowLit(0));
    bay.send(KEYS_OUT, { cls: 'key', k: 1, down: true, t: t0 + 100 }); bay.send(KEYS_OUT, { cls: 'key', k: 1, down: false, t: t0 + 150 });
    d.assert('^ moves it back', pi.s.sel === 0 && rowLit(0));
    bay.send(KEYS_OUT, { cls: 'key', k: 2, down: true, t: t0 + 200 }); bay.send(KEYS_OUT, { cls: 'key', k: 2, down: false, t: t0 + 250 });
    bay.send(KEYS_OUT, { cls: 'key', k: 3, down: true, t: T() }); bay.send(KEYS_OUT, { cls: 'key', k: 3, down: false, t: T() });
    d.assert('# loads the selected patch, loading first', pi.s.loading === 'beat' && lastFrame.view === 'loading');
    await new Promise((r) => setTimeout(r, LOAD_MS + 200));
    const beatRow = table.scroller().querySelector('.pos-tbl-row.on');
    d.assert('after the load, the table marks beat as playing', pi.s.playing === 'beat' && /beat/.test(beatRow?.textContent || '') && /playing/.test(beatRow?.textContent || ''), beatRow?.textContent);
    const want = PATCHES.find((p) => p.name === 'beat').links;
    const drawn = bay.links().filter((l) => patchIds.includes(l.id));
    d.assert('the patchbay holds beat\'s link, parsed from its line, with the circuit drum map',
      drawn.length === want.length && drawn[0].from === `${P}:sequencer:midi-out` && drawn[0].to === `${P}:circuit:midi-in` && drawn[0].transforms[0]?.op === 'drummap' && refusals === 0,
      drawn.map((l) => l.id).join(', '));
    d.assert('the screen shows beat\'s steps', lastFrame.view === 'steps');
    bay.send(CTL_OUT, { cls: 'load', name: 'synth' });
    await new Promise((r) => setTimeout(r, LOAD_MS + 200));
    d.assert('a row of the table loads synth, and the patchbay swaps beat\'s link for synth\'s two', pi.s.playing === 'synth'
      && bay.links().filter((l) => patchIds.includes(l.id)).map((l) => l.from).join() === `${P}:mk-425c:midi-out,${P}:plaits:audio-out`);
    const h0 = T();
    bay.send(KEYS_OUT, { cls: 'key', k: 4, down: true, t: h0 });
    bay.send(KEYS_OUT, { cls: 'key', k: 4, down: false, t: h0 + HOLD_MS - 1 });
    d.assert('NEGATIVE CONTROL: * held 999 ms does not stop all', pi.s.playing === 'synth' && pi.s.stops === 0);
    const h1 = T();
    bay.send(KEYS_OUT, { cls: 'key', k: 4, down: true, t: h1 });
    bay.send(KEYS_OUT, { cls: 'key', k: 4, down: false, t: h1 + HOLD_MS });
    d.assert('* held 1000 ms stops all: nothing plays, the patch\'s links are gone, the menu is back',
      pi.s.playing === null && pi.s.stops === 1 && patchIds.length === 0 && lastFrame.view === 'menu' && !table.scroller().querySelector('.pos-tbl-row.on'));
    bay.send(CTL_OUT, { cls: 'load', name: 'drums' });
    await new Promise((r) => setTimeout(r, LOAD_MS + 200));
    stopAll.button('stop').click();
    d.assert('Stop all on the page stops the patch the keys could see', pi.s.playing === null && pi.s.stops === 2);
    const res = performance.getEntriesByType('resource');
    // the shell's own log lines to the dev server's /_log are not the page's, and are never deployed
    const foreign = res.filter((e) => !e.name.endsWith('/_log')).filter((e) => !e.name.startsWith(location.origin) || ['fetch', 'xmlhttprequest', 'beacon'].includes(e.initiatorType));
    d.assert('a visit opens nothing: only the page\'s own files, none fetched by script', foreign.length === 0,
      foreign.length ? foreign.map((e) => e.name).join(', ') : `${res.length} files`);
  }
  d.ready();
</script>

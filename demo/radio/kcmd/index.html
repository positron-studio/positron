<script type="module">
  import { mount, el } from '/shell/shell.mjs';
  import { createDiagram } from '/shell/diagram.mjs';

  // A proposal for KCMD's channel on Radio VÄIN: the same channel built two ways, each drawn with diagram.mjs.
  // Written 2026-11-03 from plans/plan-kcmd.md (both halves) and what live.uuu.ee was found to be that day.
  const d = mount({
    name: 'radio/kcmd',
    what: 'Two ways to run KCMD\'s channel on Radio VÄIN, silent while there is an air-raid alert in Kyiv.',
    readout: null, showLog: false, index: '/', indexLabel: 'positron',
  });
  const h1 = d.head.querySelector('.pos-name');
  if (h1) h1.textContent = 'KCMD on VÄIN';

  const body = el('div', 'kc');
  d.el.append(body);
  const html = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); body.append(t.content); };
  const cuts = [];
  const draw = (spec) => {
    const holder = el('div');
    body.append(holder);
    return createDiagram(holder, spec, { onRender: (i) => { cuts.push(...i.cuts); } });
  };

  // The parts both options share, so the two pictures use the same boxes for them.
  const studio = { id: 'studio', label: 'KCMD', sub: 'artists, anywhere', kind: 'device', tech: 'device', join: false, children: [
    { id: 'obs', label: 'OBS', sub: 'live shows', tech: 'device',
      note: 'An artist streams a show from OBS. A DAW goes into OBS through a loopback device, so one tool covers both.' },
    { id: 'gen', label: 'Python or Pd', sub: 'later', tech: 'sound',
      note: 'KCMD\'s generative layer runs on their own machine and streams in like a show that never ends.' },
  ] };
  const alerts = { id: 'alerts', label: 'Alert APIs', sub: 'two sources', tech: 'archive',
    note: 'ukrainealarm (official) and alerts.in.ua (volunteer), both for Kyiv City.' };
  const listen = { id: 'ears', label: 'Listeners', kind: 'device', tech: 'device', join: false, children: [
    { id: 'app', label: 'VÄIN app', sub: 'phones', tech: 'device' },
    { id: 'web', label: 'Browser', sub: 'web player', tech: 'browser' },
  ] };

  html(`
    <p>KCMD proposed a channel on Radio VÄIN that falls silent during every air-raid alert in Kyiv and marks each all clear
    with a short piece. Below is how VÄIN runs today, then two ways to build the channel: one on VÄIN's own server, one on Cloudflare. Both carry the same programme.</p>

    <h2>Current setup</h2>
    <p>How VÄIN runs today, before any change. One VPS, <code>live.uuu.ee</code>, carries the audio, the video and the
    app's feed. Recordings and the contributor pages live on <code>eccm.ee</code>'s web hosting.</p>
  `);

  draw({
    caption: 'Today. Every channel is an Icecast mount (the boxes starting with a slash), and a source connecting to one is what turns into a card and a push in the app.',
    nodes: [
      { id: 'srcs', label: 'Contributors', sub: 'anywhere', kind: 'device', tech: 'device', join: false, children: [
        { id: 'capp', label: 'VÄIN app', sub: 'broadcast', tech: 'device',
          note: 'A contributor broadcasts from the app onto one of the open channels, user1 to user4, or live for managers.' },
        { id: 'cgem', label: 'editor', sub: 'Share a gem', tech: 'browser',
          note: 'A web page served from eccm.ee. A signed-in contributor writes a card in it and it posts straight to the events server.' },
        { id: 'cstudio', label: 'studio', sub: 'BUTT, OBS', tech: 'device',
          note: 'Any Icecast source can feed radio1965 or live, as positron\'s cast did during Üle Heli.' },
      ] },
      { id: 'cuuu', label: 'live.uuu.ee', sub: 'VPS at Virtuaal', kind: 'device', tech: 'station', join: false, children: [
        { id: 'm1965', label: '/radio1965', sub: 'always on', tech: 'station',
          note: 'The station\'s own channel. Fed by one source at a time, such as a playlist or positron\'s cast at Üle Heli.' },
        { id: 'mlive', label: '/live', sub: 'managers', tech: 'station',
          note: 'For managers broadcasting from the app or a studio.' },
        { id: 'muser', label: '/user1 to /user4', sub: 'contributors', tech: 'station',
          note: 'Four open channels any signed-up contributor can broadcast on from the app. Plain http on port 8001, like the others.' },
        { id: 'crec', label: 'recorder', sub: 'ffmpeg', tech: 'sound',
          note: 'Started by the on-connect hook when a broadcast is to be kept. Copies the mount to an MP3, stopped when the source leaves.' },
        { id: 'crtmp', label: 'nginx-rtmp', sub: 'video', tech: 'relay',
          note: 'Takes RTMP video and serves it to the app as HLS.' },
        { id: 'cev', label: 'events server', sub: 'FastAPI, MySQL', tech: 'relay',
          note: 'The feed of cards at /radio1965/api. Written by the editor, by Icecast\'s hook when someone goes on air, and by a cron job importing ECCM notices.' },
      ] },
      { id: 'cecc', label: 'eccm.ee', sub: 'web hosting', tech: 'archive',
        note: 'Recordings in /radio1965/streams, copied there by rsync after each broadcast, plus the contributor and editor pages and the Joomla API.' },
      { id: 'cfcm', label: 'Firebase', sub: 'push', tech: 'relay',
        note: 'Sends the push notifications to iPhones and Android phones.' },
      { id: 'clis', label: 'Listeners', kind: 'device', tech: 'device', join: false, children: [
        { id: 'capp2', label: 'VÄIN app', sub: 'phones', tech: 'device' },
      ] },
    ],
    links: [
      { from: 'capp', to: 'muser' },
      { from: 'capp', to: 'mlive' },
      { from: 'cstudio', to: 'm1965' },
      { from: 'cstudio', to: 'crtmp', label: 'RTMP' },
      { from: 'cgem', to: 'cev', label: 'new card' },
      { from: 'crec', to: 'cecc', label: 'rsync' },
      { from: 'cev', to: 'cecc', label: 'import',
        note: 'Every 5 minutes a cron job on live.uuu.ee pulls ECCM\'s notices, Joomla category 47, from **eccm.ee**\'s API and turns them into cards.' },
      { from: 'cev', to: 'capp2',
        note: 'The app reads its cards over https from live.uuu.ee/radio1965/api. Firebase only wakes it up.' },
      { from: 'cecc', to: 'capp2', label: 'MP3',
        note: 'A kept broadcast becomes a recording card whose link is the MP3 on **eccm.ee**. The app plays that file directly.' },
      { from: 'cev', to: 'cfcm', label: 'push' },
      { from: 'm1965', to: 'capp2', label: 'http' },
      { from: 'cfcm', to: 'capp2' },
    ],
  });

  html(`
    <ul>
      <li>A new channel is a mount on the server and a new release of the app, which lists the channels in its code.</li>
      <li>There is no https address for live audio, so a web page cannot play it.</li>
      <li>A kept broadcast is recorded on the server by ffmpeg, copied to <code>eccm.ee/radio1965/streams/</code> when the source
        leaves, and turned into a recording card. Played back, it comes from eccm.ee, not from live.uuu.ee.</li>
      <li>Nothing switches between sources: when a source stops, its listeners drop.</li>
      <li>Cards reach the events server three ways: the editor page, Icecast's hook when a broadcast starts, and a cron job importing ECCM's notices from eccm.ee.</li>
      <li>Publishing to the events server has no key yet, and the source passwords are built into the app and in the public repository.</li>
    </ul>

    <h3>Where eccm.ee comes in</h3>
    <p>VÄIN leans on ECCM's old Joomla hosting in three ways:</p>
    <div class="tw"><table>
      <thead><tr><th>What</th><th>On eccm.ee</th><th>Used by</th></tr></thead>
      <tbody>
        <tr><td>ECCM's notices</td><td>the Joomla API, category 47</td><td>live.uuu.ee's cron job, every 5 minutes</td></tr>
        <tr><td>Editor and contributor pages</td><td><code>/radio1965/editor/</code>, <code>/radio1965/contributor/</code>, put there over ssh</td><td>contributors' browsers</td></tr>
        <tr><td>Recordings</td><td><code>/radio1965/streams/</code>, 44 MP3s, put there over ssh</td><td>the app, playing them back</td></tr>
      </tbody>
    </table></div>
    <p>eccm.ee is moving to a new site on Cloudflare. It answers the same Joomla API calls and passes
    <code>/radio1965/*</code> on to the old server under a second name, <code>old.eccm.ee</code>, so links and the
    editor keep working. The uploads do not: they go over ssh to the name <code>eccm.ee</code>, which will point at
    Cloudflare. They should go to <code>old.eccm.ee</code> before the move, and in the long run to VÄIN's own server.</p>

    <h2>A web player today</h2>
    <p>Only nginx needs to change on live.uuu.ee. Icecast stays as it is. A web page needs two things from the stream,
    and today it gets neither.</p>
    <ol>
      <li><strong>https.</strong> A page served over https may not play audio from <code>http://live.uuu.ee:8001</code>:
        the browser blocks it as mixed content. The server already answers https on port 443 for the events API, so nginx
        only has to pass the mounts through as well.</li>
      <li><strong>CORS, for a waveform.</strong> A plain audio element plays a stream from another address without it, but
        to draw a waveform, a level or a spectrum the page reads the audio through Web Audio, and the browser hands it only
        zeros unless the response allows it with <code>Access-Control-Allow-Origin</code>.</li>
    </ol>
    <p>One block in the nginx server that already has the certificate does both, for every mount and the status JSON:</p>
    <pre><code>location /stream/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 24h;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin * always;
}</code></pre>
    <p>Then <code>https://live.uuu.ee/stream/radio1965</code> plays on any page with a waveform, the same for
    <code>/stream/live</code> and <code>/stream/user1</code> to <code>/stream/user4</code>, and
    <code>/stream/status-json.xsl</code> gives what is playing and how many listen. <code>nginx -t</code>, then a reload,
    which drops nobody. Icecast sees web listeners as coming from 127.0.0.1, and they use the VPS's bandwidth like the app's.
    Not tried yet.</p>
    <p>Without touching live.uuu.ee, positron's <strong>shout</strong> relay on Cloudflare does the same, as it did for
    radio1965 at Üle Heli, but then every web listener passes through positron.</p>

    <h2>What the channel does</h2>
    <p>One switch picks what is on air, highest first:</p>
    <ol>
      <li><strong>Silence</strong> while an alert is on in Kyiv.</li>
      <li><strong>ALL CLEAR</strong>: one 10 to 20 s piece from the library, played to its end when an alert ends.</li>
      <li><strong>A live show</strong>, when one is scheduled and the artist is streaming.</li>
      <li><strong>An archive show</strong>, when one is scheduled.</li>
      <li><strong>The default playlist</strong>, the generative layer, the rest of the time.</li>
    </ol>
    <p>The switch must sit behind <strong>one source that never disconnects</strong>. Icecast drops every listener when a
    mount's source changes, and the app does not reconnect. So silence is something the station plays, not a dropped connection.</p>
    <p>The alert gate polls both sources every 10 to 15 s. Either one reporting an alert starts the silence, and only a fresh
    all clear ends it. If data stops during an alert, the silence holds for up to 5 hours, which covers 95 % of Kyiv's
    alerts in 2025 and 2026.</p>

    <h2>Proposal A: live.uuu.ee and Liquidsoap</h2>
    <p>Everything runs on VÄIN's server (a VPS at Virtuaal, Ubuntu, reached over ssh). Liquidsoap is the switch.
    The parts are standard open-source tools, kept in one git repository and started with Docker Compose.</p>
  `);

  draw({
    caption: 'Proposal A. Every box inside live.uuu.ee is new except Icecast, nginx and the events server, which get config changes.',
    nodes: [
      studio, alerts,
      { id: 'uuu', label: 'live.uuu.ee', sub: 'VPS at Virtuaal', kind: 'device', tech: 'station', join: false, children: [
        { id: 'rtmp', label: 'nginx-rtmp', sub: 'ingest', tech: 'relay',
          note: 'Already on the server for video. A new application **kcmd** takes RTMP from OBS, one key per show.' },
        { id: 'gate', label: 'alert gate', sub: 'Python', tech: 'relay',
          note: 'Polls both sources, keeps the state, and tells Liquidsoap over its local control port. Logs every alert.' },
        { id: 'liq', label: 'Liquidsoap', sub: 'the switch', tech: 'sound',
          note: 'The priority chain from silence down to the playlist, as one source that never leaves the mount.' },
        { id: 'ice', label: 'Icecast', sub: '/kcmd', tech: 'station',
          note: 'A new mount, with **fallback-mount** to a playlist so listeners move rather than drop if Liquidsoap stops.' },
        { id: 'tls', label: 'nginx', sub: 'https', tech: 'relay',
          note: 'An https address for /kcmd with CORS, so a web page can play it.' },
        { id: 'ev', label: 'events server', sub: 'FastAPI', tech: 'relay',
          note: 'Alert and ALL CLEAR texts appear in the app as text cards, once publishing needs a key.' },
      ] },
      listen,
    ],
    links: [
      { from: 'obs', to: 'rtmp', label: 'RTMP' },
      { from: 'gen', to: 'liq' },
      { from: 'alerts', to: 'gate', label: 'poll' },
      { from: 'ice', to: 'app', label: 'http' },
      { from: 'tls', to: 'web', label: 'https' },
      { from: 'ev', to: 'app', label: 'push' },
    ],
  });

  html(`
    <h3>What changes on live.uuu.ee</h3>
    <ul>
      <li>Icecast: mounts <code>/kcmd</code> and <code>/kcmd-test</code>, each with its own source password and a <code>fallback-mount</code>.</li>
      <li>nginx-rtmp: an application <code>kcmd</code> with per-show stream keys. SRT or WHIP can be added later through MediaMTX.</li>
      <li>nginx: an https location for <code>/kcmd</code> with CORS for the web player.</li>
      <li>New: a folder with <code>compose.yaml</code> for Liquidsoap and the alert gate, versions pinned, secrets in <code>.env</code> on the server only.</li>
      <li>Events server: publishing needs a key, before alert texts go through it.</li>
      <li>VÄIN app: <code>kcmd</code> in its channel list, or one of <code>user1</code> to <code>user4</code> until a release.</li>
    </ul>
    <h3>For and against</h3>
    <ul>
      <li><strong>For:</strong> Liquidsoap is made for exactly this, and it runs all day on thousands of stations. It sits next to Icecast, so nothing crosses the internet between the switch and the mount. Anyone who knows Linux can run it.</li>
      <li><strong>Against:</strong> it is a service that must stay up on a server lent by U:, and someone has to answer for it during a raid. Live input other than RTMP means one more tool.</li>
    </ul>
    <h3>Rollback</h3>
    <p>Every change is a commit. Stopping the containers moves listeners to the fallback playlist. Files changed outside the
    repository are copied before they are touched. The first visit is read-only: an inventory of what runs there, and no changes.</p>

    <h2>Proposal B: Cloudflare and positron's edgecast</h2>
    <p>The switch runs in positron's edgecast on Cloudflare, which already fills dry air with silent MP3 frames and keeps
    one connection to the mount. live.uuu.ee only gets a new mount.</p>
  `);

  draw({
    caption: 'Proposal B. The switch, the gate and the library live on Cloudflare; VÄIN\'s server only receives one stream.',
    nodes: [
      studio, alerts,
      { id: 'cf', label: 'Cloudflare', sub: 'positron', kind: 'cloud', tech: 'cloudflare', join: false, children: [
        { id: 'sfu', label: 'positron-sfu', sub: 'WHIP room', tech: 'cloudflare',
          note: 'Takes a live show from OBS over WHIP. Built and measured with OBS 32.' },
        { id: 'cgate', label: 'alert gate', sub: 'Durable Object', tech: 'cloudflare',
          note: 'The same states and holds as in A, on its own alarm. Its state is public JSON other channels can follow.' },
        { id: 'r2', label: 'library', sub: 'R2', tech: 'cloudflare',
          note: 'ALL CLEAR pieces, archive shows and the playlist, each checked for length and loudness on upload.' },
        { id: 'edge', label: 'edgecast', sub: 'the switch', tech: 'cloudflare',
          note: 'Decodes, switches and encodes MP3, and keeps the mount fed with silence between items.' },
      ] },
      { id: 'uuu', label: 'live.uuu.ee', sub: 'VPS at Virtuaal', kind: 'device', tech: 'station', join: false, children: [
        { id: 'ice', label: 'Icecast', sub: '/kcmd', tech: 'station',
          note: 'A new mount with its own source password. Nothing else on the server changes.' },
        { id: 'ev', label: 'events server', sub: 'FastAPI', tech: 'relay',
          note: 'Alert texts in the app, the same as in A.' },
      ] },
      listen,
    ],
    links: [
      { from: 'obs', to: 'sfu', label: 'WHIP' },
      { from: 'gen', to: 'edge' },
      { from: 'alerts', to: 'cgate', label: 'poll' },
      { from: 'edge', to: 'ice', label: 'MP3' },
      { from: 'cgate', to: 'ev', label: 'texts' },
      { from: 'ev', to: 'app', label: 'push' },
      { from: 'ice', to: 'app', label: 'http' },
      { from: 'ice', to: 'web', label: 'https',
        note: 'Through positron\'s **shout** relay on Cloudflare, which gave radio1965 its https address at Üle Heli.' },
    ],
  });

  html(`
    <h3>What changes on live.uuu.ee</h3>
    <ul>
      <li>Icecast: the mount <code>/kcmd</code> with its own source password.</li>
      <li>Events server and app: the same two changes as in A.</li>
    </ul>
    <h3>Built and still to build</h3>
    <ul>
      <li><strong>Built:</strong> MP3 decode and encode, silence fill, the relay to an Icecast mount, WHIP from OBS, the https relay.</li>
      <li><strong>To build:</strong> the gate, the switch, the library and its upload, schedules, per-show keys, recording.</li>
      <li><strong>To prove:</strong> a 24 h run (the longest live run so far is 2 minutes), resuming after a restart, and memory headroom.</li>
    </ul>
    <h3>For and against</h3>
    <ul>
      <li><strong>For:</strong> nothing new to install or run on VÄIN's server. WHIP from OBS is already working. The gate's state is public, so VÄIN's other channels can fall silent too.</li>
      <li><strong>Against:</strong> unproven for a channel that runs all day. Every deploy of the relay drops all listeners. It runs on positron's account, so the channel depends on one person.</li>
    </ul>

    <h2>Side by side</h2>
    <div class="tw"><table>
      <thead><tr><th></th><th>A. live.uuu.ee and Liquidsoap</th><th>B. Cloudflare and edgecast</th></tr></thead>
      <tbody>
        <tr><td>Where the switch runs</td><td>VÄIN's server, next to Icecast</td><td>Cloudflare, across the internet from Icecast</td></tr>
        <tr><td>Changes on live.uuu.ee</td><td>Mounts, nginx-rtmp, nginx https, a Compose folder</td><td>One mount</td></tr>
        <tr><td>Live input</td><td>RTMP now, SRT or WHIP later</td><td>WHIP now</td></tr>
        <tr><td>Proven for 24/7</td><td>Yes, widely</td><td>Not yet</td></tr>
        <tr><td>Who keeps it running</td><td>Whoever looks after live.uuu.ee</td><td>positron</td></tr>
        <tr><td>Cost a month</td><td>0 on live.uuu.ee, or 8 to 17 € for a VPS of its own</td><td>about $5 to $10, live shows free inside the SFU's free tier</td></tr>
      </tbody>
    </table></div>

    <h2>What it costs</h2>
    <h3>A. A server</h3>
    <ul>
      <li><strong>On live.uuu.ee:</strong> nothing extra. The server is U:'s, lent to VÄIN for free.</li>
      <li><strong>On a VPS of its own at Virtuaal</strong>, so KCMD's channel does not depend on a lent server
        (prices with VAT, paid yearly or monthly):
        <ul>
          <li>C-XS, 1 vCPU, 2 GB, 50 GB: <strong>7.64 or 8.49 € a month</strong>. Enough for Icecast, Liquidsoap and the gate.</li>
          <li>C-S, 2 vCPU, 4 GB, 80 GB: <strong>15.29 or 16.99 € a month</strong>. Room for the radio1965 sound engine as well (below).</li>
        </ul></li>
      <li>Every size includes 5 TB of traffic a month, which is about 120 listeners at 128 kbit/s around the clock, on a 250 Mbit/s port. Weekly backups cost extra.</li>
    </ul>
    <h3>B. Cloudflare usage</h3>
    <ul>
      <li><strong>The switch:</strong> one Durable Object running all day, about $0.17 a day, so about $5 a month.</li>
      <li><strong>Live shows through the SFU:</strong> Realtime is billed on egress at $0.05 per GB, and the WebSocket adapter
        that brings a show into edgecast counts as egress. A show is 0.69 GB of audio an hour, so about $0.035 an hour. The first
        1,000 GB a month are free, shared by all of positron's SFU and TURN use. That covers about 1,400 hours of shows,
        so in practice it costs nothing unless positron's rooms use up the free tier. Publishing into the SFU is free.</li>
      <li><strong>To Icecast and the web player:</strong> Workers have no egress charge. The library in R2 costs cents.</li>
      <li><strong>The plan:</strong> Workers Paid at $5 a month, which positron already has.</li>
      <li><strong>The radio1965 sound engine</strong>, if it plays the generative layer: its Cloudflare container is about $1.33 a day, so about $40 a month.</li>
    </ul>

    <h2>The radio1965 sound on the server</h2>
    <p>The generative layer could be the processing heard on radio1965 at Üle Heli: archive recordings through SuperCollider
    granulators, echoes and drones. Today that engine runs in a Cloudflare container at about $40 a month. Its image is
    plain Debian with node, ffmpeg, scsynth and JACK, so it runs under Docker on a VPS unchanged.</p>
  `);

  draw({
    caption: 'The radio1965 engine as the default layer of proposal A, on a C-S VPS. The Caster that controls it today could stay on Cloudflare.',
    nodes: [
      { id: 'cfc', label: 'Cloudflare', sub: 'positron', kind: 'cloud', tech: 'cloudflare', join: false, children: [
        { id: 'caster', label: 'Caster', sub: 'Durable Object', tech: 'cloudflare',
          note: 'Starts and steers the engine over HTTP today. Could stay here, or become a small script on the server.' },
        { id: 'rr2', label: 'recordings', sub: 'R2', tech: 'cloudflare',
          note: 'The archive files the engine plays. Synced to the server\'s disk instead of fetched one by one.' },
      ] },
      { id: 'vps', label: 'VPS', sub: 'live.uuu.ee or its own', kind: 'device', tech: 'station', join: false, children: [

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Echo chamber</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Play and the source choice on one row at the top left, as /remote/plaits/. */
  .cc-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cc-status { color: var(--dim); }
  .cc-status[data-kind="bad"] { color: var(--bad); }
</style>
<script type="module">
  // The cast's engine (wasm scsynth with the grain ring, the seven layers and the master) running in a
  // Durable Object, workers/chamber/: 20 ms frames of 48 kHz stereo s16 out over one WebSocket, processed audio back.
  // Two insert slots take an sclang-lite program and its knobs live (the routing is in workers/chamber/chain.mjs).
  // Nothing opens on a visit: the socket, the file and the microphone wait for Play, and Stop closes all three.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK, DEEP } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { PLAYOUT_URL } from '/shell/board.mjs';
  import { createCodeBox } from '/shell/code-box.mjs';
  import { createKnob } from '/shell/knob.mjs';
  import { createKnobGrid } from '/shell/knob-grid.mjs';
  import { CODE_ROWS } from '/shell/concept-nav.mjs';
  import { compile } from '/shell/sclang-lite.mjs';
  useMediumColours();

  const q = new URLSearchParams(location.search);
  // ?chamber= points the page at a `wrangler dev` of workers/chamber; ?cast= at another file pass.
  const LAB = (q.get('chamber') || 'https://chamber.positron.studio').replace(/\/$/, '');
  const CAST = (q.get('cast') || 'https://cast.positron.studio').replace(/\/$/, '');
  // every press gets an engine of its own: three objects ran side by side, 1,300 of 1,300 frames each (2026-10-20)
  const ROOM = q.get('room') || `v-${Math.random().toString(36).slice(2, 10)}`;
  // A short file from the archive the cast plays, through the cast's own file pass (edge cached).
  const FILE = { id: 'evt_1791543189468', title: 'Oriental analog', seconds: 74 };
  const SR = 48000, FRAME = 960, PING_EVERY = 5;

  const d = mount({ name: 'Echo chamber', what: '', index: '/', indexLabel: 'positron',
    // The cells under the title, the log alone at the foot, as /remote/plaits/.
    joined: false,
    readout: { 'round trip': 'ms', network: 'ms', chamber: 'ms', sent: '', back: '', dropouts: '' } });
  conceptNav('radio/chamber');

  // ── the bay: the sources, the code box, the knobs and the speakers in this tab, the chamber on Cloudflare ─
  const S = 'web', E = 'cf-chamber';
  // the programs each slot starts the box with: an echo before the master, a plain pass after it
  const THROUGH = '{ In.ar(\\in.kr(0), 2) }';
  const DEFAULTS = [`{
  var x = In.ar(\\in.kr(0), 2);
  var time = \\time.kr(0.4, spec: [0.05, 1]);
  x + (CombC.ar(LPF.ar(x, 2500), 1, time, time * 8) * \\mix.kr(0.35))
}`, THROUGH];
  const SLOT_NAMES = ['before the master', 'after the master'];
  const INSERT = [`${E}:pre`, `${E}:post`];
  const bay = createBay();
  bay.addNode({ id: 'cf-cast:files', kind: 'endpoint', label: 'file pass', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:file`, kind: 'engine', label: FILE.title });
  bay.addNode({ id: `${S}:mic`, kind: 'device', label: 'microphone' });
  bay.addNode({ id: `${S}:code`, kind: 'person', label: 'code box' });
  bay.addNode({ id: `${S}:knobs`, kind: 'person', label: 'knobs' });
  bay.addNode({ id: `${E}:engine`, kind: 'engine', label: 'ring and layers', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: INSERT[0], kind: 'engine', label: 'insert', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${E}:master`, kind: 'engine', label: 'master', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: INSERT[1], kind: 'engine', label: 'insert', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: `${S}:speaker`, kind: 'screen', label: 'speakers' });
  bay.addPort({ id: 'cf-cast:files:audio-out', dir: 'out', medium: 'audio', label: '/file', transports: ['https'] });
  bay.addPort({ id: `${S}:file:audio-in`, dir: 'in', medium: 'audio', label: 'mp3', transports: ['https'] });
  bay.addPort({ id: `${S}:file:audio-out`, dir: 'out', medium: 'audio', label: 'pcm' });
  bay.addPort({ id: `${S}:mic:audio-out`, dir: 'out', medium: 'audio', label: 'pcm' });
  bay.addPort({ id: `${S}:code:program-out`, dir: 'out', medium: 'program', label: 'sclang', shape: { language: 'sclang' } });
  bay.addPort({ id: `${S}:knobs:value-out`, dir: 'out', medium: 'value', label: 'param', shape: { of: 'param' } });
  bay.addPort({ id: `${E}:engine:audio-in`, dir: 'in', medium: 'audio', label: 'pcm', transports: ['websocket'] });
  bay.addPort({ id: `${E}:engine:audio-out`, dir: 'out', medium: 'audio', label: 'bus 12' });
  // what reaches an insert's program and knob ports goes over the chamber's socket as {cmd:'program'} and {cmd:'set'}
  INSERT.forEach((id, n) => {
    bay.addPort({ id: `${id}:audio-in`, dir: 'in', medium: 'audio', label: n ? 'bus 22' : 'bus 12' });
    bay.addPort({ id: `${id}:audio-out`, dir: 'out', medium: 'audio', label: n ? 'out' : 'bus 20', ...(n ? { transports: ['websocket'] } : {}) });
    bay.addPort({ id: `${id}:program-in`, dir: 'in', medium: 'program', label: 'program', shape: { language: 'sclang' }, deliver: (e) => sendProgram(n, e?.src) });
    bay.addPort({ id: `${id}:value-in`, dir: 'in', medium: 'value', label: 'params', shape: { of: 'param' }, deliver: (e) => e?.of === 'param' && sendSet(n, e.name, e.v) });
  });
  bay.addPort({ id: `${E}:master:audio-in`, dir: 'in', medium: 'audio', label: 'bus 20' });
  bay.addPort({ id: `${E}:master:audio-out`, dir: 'out', medium: 'audio', label: 'bus 22' });
  bay.addPort({ id: `${S}:speaker:audio-in`, dir: 'in', medium: 'audio', label: 'playout', transports: ['websocket'] });
  const SOURCES = { file: [['cf-cast:files:audio-out', `${S}:file:audio-in`, 'https'], [`${S}:file:audio-out`, `${E}:engine:audio-in`, 'websocket']],
    mic: [[`${S}:mic:audio-out`, `${E}:engine:audio-in`, 'websocket']] };
  const CHAIN = [[`${E}:engine:audio-out`, `${INSERT[0]}:audio-in`], [`${INSERT[0]}:audio-out`, `${E}:master:audio-in`],
    [`${E}:master:audio-out`, `${INSERT[1]}:audio-in`], [`${INSERT[1]}:audio-out`, `${S}:speaker:audio-in`, 'websocket']];
  const BACK = CHAIN[3];
  // the code box and the knobs reach the insert the slot choice names
  const EDIT = (n) => [[`${S}:code:program-out`, `${INSERT[n]}:program-in`, 'websocket'], [`${S}:knobs:value-out`, `${INSERT[n]}:value-in`, 'websocket']];

  // ── state: everything a press opens, and the counters the readout reads ───
  let run = null;           // { source, ctx, ws, frames, playout, src, mic, booted } while playing, else null
  let buffer = null;        // the decoded file, kept across presses
  let fetches = 0, micAsked = 0;
  const m = { sent: 0, back: 0, dropouts: 0, rtt: [], net: [], engine: [], peak: 0, object: null };
  // what the slots hold, as the chamber last answered, and every frame's level with its arrival time, for the checks
  const slotHeld = DEFAULTS.map(() => ({ src: THROUGH, controls: [] }));
  const drafts = DEFAULTS.slice();
  const levels = [], asked = [], answers = [];
  const sentAt = new Map(), pingAt = new Map(), pongAt = new Map();
  const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
  const keep = (a, v) => { a.push(v); if (a.length > 250) a.shift(); };

  let slot = 0, source = 'file';
  function wire(src = source) {
    source = src;
    for (const l of bay.links()) bay.unlink(l.id);
    for (const [a, b, via] of [...SOURCES[source], ...CHAIN, ...EDIT(slot)]) {
      const r = bay.link(a, b, [], via ? { via } : {});
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    pb?.refresh();
  }
  const playing = () => !!run?.booted;
  const pb = createPatchbay(bay, { flowing: (l, medium) => playing() && medium === 'audio' && (l.from !== 'cf-cast:files:audio-out' || run.source === 'file') });

  function show() {
    const f1 = (v) => (v == null ? '' : v.toFixed(1));
    d.set('round trip', f1(median(m.rtt)));
    d.set('network', f1(median(m.net)));
    d.set('chamber', f1(median(m.engine)));
    d.set('sent', run || m.sent ? m.sent : '');
    d.set('back', run || m.back ? m.back : '');
    d.set('dropouts', run || m.sent ? m.dropouts : '');
  }

  async function loadFile() {
    if (buffer) return buffer;
    const url = `${CAST}/file/${FILE.id}`;
    d.log(`fetching ${FILE.title} (${FILE.seconds} s) from ${url}`);
    fetches++;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`the file pass answered ${r.status}`);
    const bytes = await r.arrayBuffer();
    // decoded once, at 48 kHz, in a context of its own so a later Play does not decode again
    const dc = new OfflineAudioContext(2, SR, SR);
    buffer = await dc.decodeAudioData(bytes);
    return buffer;
  }

  async function start() {
    if (run) return true;
    const source = choice.value();
    const me = { source, ctx: null, ws: null, booted: false };
    run = me;
    Object.assign(m, { sent: 0, back: 0, dropouts: 0, rtt: [], net: [], engine: [], peak: 0, object: null });
    sentAt.clear(); pingAt.clear(); pongAt.clear(); levels.length = 0;
    slotHeld.forEach((h) => Object.assign(h, { src: THROUGH, controls: [] }));
    transport.setIcon('play', 'stop', 'stop');
    try {
      const ctx = me.ctx = new AudioContext({ sampleRate: SR, latencyHint: 'interactive' });
      if (ctx.sampleRate !== SR) d.log(`this browser runs audio at ${ctx.sampleRate} Hz, so the chamber hears it resampled`, 'warn');
      await Promise.all([ctx.audioWorklet.addModule(new URL('./capture.js', import.meta.url)), ctx.audioWorklet.addModule(PLAYOUT_URL)]);
      // what comes back: the kit's playout ring, stereo, with a cushion that grows when it runs dry
      const playout = me.playout = new AudioWorkletNode(ctx, 'pcm-playout', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      playout.port.postMessage({ cmd: 'inChannels', n: 2 });
      playout.port.postMessage({ cmd: 'floor', ms: 160, adaptive: true, maxMs: 400 });
      playout.port.onmessage = (e) => { if (e.data?.stats && run === me) m.dropouts = e.data.stats.underruns; };
      playout.connect(ctx.destination);
      // what leaves: 20 ms frames cut on the tab's audio clock; a silent gain pulls it
      const frames = me.frames = new AudioWorkletNode(ctx, 'pcm-frames', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { frame: FRAME } });
      const mute = ctx.createGain(); mute.gain.value = 0;
      frames.connect(mute).connect(ctx.destination);
      if (source === 'file') {
        const b = await loadFile();
        if (run !== me) return false;
        const src = me.src = ctx.createBufferSource();
        src.buffer = b; src.loop = true;
        src.connect(frames);
        src.start();
      } else {
        micAsked++;
        const stream = me.mic = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 2, echoCancellation: true } });
        if (run !== me) { stream.getTracks().forEach((t) => t.stop()); return false; }
        me.src = ctx.createMediaStreamSource(stream);
        me.src.connect(frames);
        d.log(`the microphone is ${stream.getAudioTracks()[0]?.label || 'on'}`);
      }
      ctx.resume().catch(() => { /* a later gesture resumes it */ });
      return await open(me);
    } catch (e) {
      d.log(`did not start: ${e?.message || e}`, 'bad');
      stop();
      return false;
    }
  }

  function open(me) {
    const url = `${LAB.replace(/^http/, 'ws')}/ws?room=${encodeURIComponent(ROOM)}`;
    d.log(`opening ${url}`);
    const ws = me.ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    let said = false, asked = 0;
    return new Promise((done) => {
      ws.onopen = () => { asked = performance.now(); ws.send(JSON.stringify({ cmd: 'boot', mode: 'full', seed: 7 })); };
      ws.onmessage = (ev) => {
        if (run !== me) return;
        if (typeof ev.data === 'string') {
          const msg = JSON.parse(ev.data);
          if ('pong' in msg) {
            const t = performance.now();
            pongAt.set(msg.pong, t);
            if (pingAt.has(msg.pong)) keep(m.net, t - pingAt.get(msg.pong));
          } else if ('booted' in msg) {
            if (!msg.booted) { d.log(`the chamber did not boot: ${String(msg.error).split('\n')[0]}`, 'bad'); stop(); done(false); return; }
            const s = msg.scene || {};
            me.bootMs = performance.now() - asked;
            d.log(`the chamber answered in ${Math.round(me.bootMs)} ms: the ring on ${s.patch || 'its patch'}, ${s.layers || 0} layer programs and the master, ${Math.round((msg.memoryBytes || 0) / 1048576)} MB`);
            me.booted = true;
            me.frames.port.onmessage = (e) => send(me, e.data);
            me.statsTimer = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ cmd: 'stats' })); }, 3000);
            pb.refresh();
            // the box's program goes in on Play, so its knobs move something from the first press
            bay.send(`${S}:code:program-out`, { language: 'sclang', src: drafts[slot] });
            done(true);
          } else if (msg.program) {
            answered(msg.program);
          } else if (msg.set) {
            if (!msg.set.ok) d.log(`the chamber did not set ${msg.set.refused?.join(', ') || ''}${msg.set.error ? `: ${msg.set.error}` : ''}`, 'warn');
          } else if (msg.stats) {
            m.object = { frames: msg.stats.frames, median: msg.stats.median, nonzero: msg.stats.nonzero, grains: msg.stats.grains };
          } else if (msg.busy || msg.ended || msg.error) {
            d.log(msg.ended || msg.error, msg.busy ? 'warn' : 'bad');
          }
          return;
        }
        const now = performance.now();
        const seq = new Float64Array(ev.data, 0, 3)[0];
        m.back++;
        if (sentAt.has(seq)) { keep(m.rtt, now - sentAt.get(seq)); sentAt.delete(seq); }
        // the pong for this frame left the object before the frame was worked on, so the gap is the work
        if (pongAt.has(seq)) { keep(m.engine, Math.max(0, now - pongAt.get(seq))); pongAt.delete(seq); pingAt.delete(seq); }
        const pcm = new Int16Array(ev.data, 24);
        const f = new Float32Array(pcm.length);
        let hi = 0, sq = 0;
        for (let i = 0; i < pcm.length; i++) { f[i] = pcm[i] / 32768; sq += f[i] * f[i]; const a = f[i] < 0 ? -f[i] : f[i]; if (a > hi) hi = a; }
        levels.push({ t: now, rms: Math.sqrt(sq / (pcm.length || 1)) });
        if (levels.length > 3000) levels.splice(0, 500);
        if (hi > m.peak) m.peak = hi;
        me.playout.port.postMessage({ pcm: f }, [f.buffer]);
        if (!said) { said = true; d.log('the first processed frame is back, playing it'); }
      };
      ws.onclose = (e) => {
        if (run === me) { d.log(`the chamber closed the socket${e.reason ? `: ${e.reason}` : ''}`, 'warn'); stop(); }
        done(false);
      };
      ws.onerror = () => { if (run === me) d.log('the socket to the chamber failed', 'warn'); };
    });
  }

  function send(me, buf) {
    if (run !== me || me.ws.readyState !== 1) return;
    const seq = m.sent;
    if (seq % PING_EVERY === 0) { pingAt.set(seq, performance.now()); me.ws.send(JSON.stringify({ cmd: 'ping', n: seq })); }
    sentAt.set(seq, performance.now());
    me.ws.send(buf);
    m.sent++;
    if (sentAt.size > 500) for (const k of [...sentAt.keys()].slice(0, 100)) sentAt.delete(k);
  }

  function stop() {
    const me = run;
    if (!me) return;
    run = null;
    clearInterval(me.statsTimer);
    try { me.ws?.close(1000, 'stop'); } catch { /* gone */ }
    try { me.frames?.port.postMessage({ cmd: 'stop' }); } catch { /* gone */ }
    try { me.src?.stop?.(); } catch { /* not started */ }
    try { me.src?.disconnect(); } catch { /* gone */ }
    me.mic?.getTracks().forEach((t) => t.stop());
    me.ctx?.close().catch(() => { /* closed */ });
    transport.setIcon('play', 'play', 'play');
    if (m.sent) {
      const o = m.object;
      d.log(`stopped: ${m.sent} frames sent, ${m.back} back, ${m.dropouts} dropouts${o ? `; the object had counted ${o.frames} at its last report` : ''}`);
      if (o && !o.nonzero) d.log('the object\'s own timer read 0 for every frame: Cloudflare holds a Worker\'s clock still while its code runs, so the chamber cell is timed from this tab');
    }
    show();
    pb.refresh();
  }

  // ── a program and its knobs, live: what arrives at an insert's ports leaves on the socket ──
  function sendProgram(to, src) {
    // the same compiler first, here, so a broken program is answered without a message to the chamber
    const local = compile(src, { name: 'check', bus: 0 });
    if (!local.ok) { answered({ ok: false, slot: to, error: local.message, local: true }); return false; }
    if (!playing() || run.ws.readyState !== 1) { say('Press play first'); return false; }
    asked.push({ slot: to, t: performance.now() });
    say('Compiling');
    run.ws.send(JSON.stringify({ cmd: 'program', slot: to, src }));
    // the chamber takes one program a second, autocompile's included
    lastAt = performance.now(); lastAuto = src;
    return true;
  }
  // past the check here, so the chamber's own compiler is the one that answers
  function sendRaw(to, src) { asked.push({ slot: to, t: performance.now() }); run?.ws?.send(JSON.stringify({ cmd: 'program', slot: to, src })); }
  function sendSet(to, name, v) {
    if (playing() && run.ws.readyState === 1) run.ws.send(JSON.stringify({ cmd: 'set', slot: to, params: { [name]: v } }));
  }
  function answered(a) {
    a.at = performance.now();
    a.sinceSend = !a.local && asked.length ? a.at - asked.at(-1).t : null;
    answers.push(a);
    if (!a.ok) {
      say(a.error, 'bad');
      d.log(`${a.local ? 'did not compile, nothing was sent' : `the chamber refused the program for the insert ${SLOT_NAMES[a.slot] ?? a.slot}`}: ${a.error}`, 'warn');
      return;
    }
    slotHeld[a.slot] = { src: drafts[a.slot], controls: a.controls || [] };
    say(`In, ${Math.round(a.sinceSend ?? 0)} ms`);
    d.log(`the program is in the insert ${SLOT_NAMES[a.slot]}: ${a.blocks} UGens, answered ${Math.round(a.sinceSend ?? 0)} ms after the send`);
    if (a.slot === slot) knobsFor(a.controls || []);
  }

  const code = createCodeBox({ language: 'sclang', rows: CODE_ROWS, label: '', value: drafts[0],
    ariaLabel: 'the SuperCollider program in the insert, it goes in as you type', onInput: (t) => { drafts[slot] = t; autoCompile(t); } });
  // autocompile (*"autocompile"*): a pause in typing sends the program, at most one a second (the chamber's own limit);
  // while it does not compile the line under the box says why and nothing is sent
  let autoT = 0, lastAuto = '', lastAt = 0;
  function autoCompile(src) {
    clearTimeout(autoT);
    autoT = setTimeout(() => {
      const r = compile(src, { name: 'check', bus: 0 });
      if (!r.ok) { say(r.message, 'bad'); return; }
      if (!playing()) { say('Compiles, goes in on play'); return; }
      if (src === lastAuto) return;
      const wait = Math.max(0, 1000 - (performance.now() - lastAt));
      if (wait) { autoCompile(src); return; }
      lastAuto = src; lastAt = performance.now();
      bay.send(`${S}:code:program-out`, { language: 'sclang', src });
    }, 600);
  }
  const compileBtn = el('button', 'pos-sm', 'Compile', { type: 'button' });
  compileBtn.addEventListener('click', () => bay.send(`${S}:code:program-out`, { language: 'sclang', src: code.value() }));
  const status = el('span', 'cc-status', '', { role: 'status', 'aria-live': 'polite' });
  function say(t, kind = '') { status.textContent = t; status.dataset.kind = kind; }

  // the knobs are the program's own arguments, as the chamber's compiler listed them
  const knobHost = el('div');
  let knobs = new Map();
  function knobsFor(controls) {
    knobHost.textContent = '';
    knobs = new Map(controls.map((c) => [c.name, createKnob({ label: c.name, min: c.spec.min, max: c.spec.max, value: c.value, hand: true,
      onInput: (v) => bay.send(`${S}:knobs:value-out`, { of: 'param', name: c.name, v }) })]));
    if (knobs.size) knobHost.append(createKnobGrid(knobs, { row: true }).el);
    knobHost.hidden = !knobs.size;
  }
  const knobsOf = (src) => { const r = compile(src, { name: 'check', bus: 0 }); return r.ok ? r.knobs.filter((k) => k.name !== 'in') : []; };
  knobsFor(knobsOf(DEFAULTS[0]));
  const slotChoice = createChoice({ label: 'insert', options: SLOT_NAMES.map((n, i) => [n, i]), at: 0,
    onPick: (v) => { slot = v; code.set(drafts[slot]); knobsFor(slotHeld[slot].controls.length ? slotHeld[slot].controls : knobsOf(drafts[slot])); wire(); } });

  // ── the controls ────────────────────────────────────────────────────────
  const choice = createChoice({ label: 'source', options: [['file', 'file'], ['microphone', 'mic']], at: 0,
    onPick: (v) => { const was = !!run; if (was) stop(); wire(v); if (was) start(); } });
  const transport = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => (run ? stop() : start()) },
  ] });
  wire('file');
  setInterval(() => { if (run) { show(); pb.refresh(); } }, 500);

  const top = el('div', 'cc-top');
  top.append(transport.el, choice.el);
  const act = el('div', 'cc-top');
  // a program goes before the master, where an effect belongs (*"why i need to choose"*); the other slot is the check's
  // no Compile button: the program goes in as you type; the hidden button stays the checks' handle
  act.append(status);
  d.stack.add(top, knobHost, code.el, act, pb.el);

  window.__demo.bay = bay;
  window.__demo.chamber = { start, stop, choice, slotChoice, code, room: ROOM, lab: LAB, levels, answers, slotHeld, knobs: () => knobs,
    program: (src, to = slot) => { drafts[to] = src; return bay.send(`${S}:code:program-out`, { language: 'sclang', src }); },
    sendRaw, press: () => compileBtn.click(),
    probe: () => ({ running: !!run, booted: playing(), source: run?.source ?? null, ws: run?.ws?.readyState ?? null,
      ctx: run?.ctx?.state ?? null, bootMs: run?.bootMs ?? null, fetches, micAsked, sent: m.sent, back: m.back, dropouts: m.dropouts, peak: m.peak,
      rtt: median(m.rtt), net: median(m.net), engine: median(m.engine), samples: { rtt: m.rtt.length, net: m.net.length, engine: m.engine.length },
      object: m.object }) };

  // ── the self-check: only under ?selfcheck=1; the driven run against the deployed chamber only on the deep tier ─
  if (SELFCHECK) {
    const A = d.assert, C = window.__demo.chamber;
    const has = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
    const sentOn = (a, b) => bay.links().find((l) => l.from === a && l.to === b)?.sent ?? 0;
    A('a visit opens nothing: no socket, no file, no microphone, no sound', !run && fetches === 0 && micAsked === 0);
    A('the file reaches the chamber over the websocket, through both inserts and the master, and comes back to the speakers',
      has(`${S}:file:audio-out`, `${E}:engine:audio-in`) && CHAIN.every(([a, b]) => has(a, b)) && bay.links().filter((l) => l.via === 'websocket').length === 4,
      bay.links().map((l) => `${l.from} -> ${l.to} ${l.via ?? ''}`).join(', '));
    A('the code box and the knobs reach the insert before the master', has(...EDIT(0)[0].slice(0, 2)) && has(...EDIT(0)[1].slice(0, 2)));
    slotChoice.set(1);
    A('picking the other insert moves both links to it, and the box shows its program',
      has(...EDIT(1)[0].slice(0, 2)) && !has(...EDIT(0)[0].slice(0, 2)) && code.value() === THROUGH && knobHost.hidden);
    slotChoice.set(0);
    wire('mic');
    A('picking the microphone moves the link into the chamber', has(`${S}:mic:audio-out`, `${E}:engine:audio-in`) && !has(`${S}:file:audio-out`, `${E}:engine:audio-in`));
    wire('file');
    A('the default program\'s own arguments are the knobs, and `in` is not one', [...knobs.keys()].join() === 'time,mix', [...knobs.keys()].join());
    {
      // NEGATIVE CONTROL: a websocket between two ends in this tab is refused, so the links above are not waved through.
      const r = bay.link(`${S}:file:audio-out`, `${S}:speaker:audio-in`, [], { via: 'websocket' });
      A('NEGATIVE CONTROL: a websocket inside this tab is refused', !r.ok, r.why || 'linked');
      if (r.ok) bay.unlink(r.id);
      // NEGATIVE CONTROL: a program that does not compile is refused here with the compiler's message, and nothing is sent.
      const n = answers.length;
      C.program('{ In.ar(\\in.kr(0), 2) * SinOsc.ar(', 0);
      const a = answers[n];
      A('NEGATIVE CONTROL: a program that does not compile is refused with the compiler\'s message, and opens nothing',
        a && !a.ok && a.local && /line \d+, column \d+/.test(a.error) && !run && sentOn(...EDIT(0)[0].slice(0, 2)) === 1, a?.error);
      drafts[0] = DEFAULTS[0];
      say('');
    }
    if (DEEP) {
      (async () => {
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        const until = async (fn, ms) => { const t = performance.now(); while (!fn() && performance.now() - t < ms) await wait(50); return fn(); };
        const rmsIn = (t0, t1) => { const s = levels.filter((x) => x.t >= t0 && x.t < t1); return s.length ? Math.sqrt(s.reduce((q, x) => q + x.rms * x.rms, 0) / s.length) : 0; };
        const db = (x) => 20 * Math.log10(Math.max(1e-9, x));
        const M = C.measured = {};
        const ok = await start();
        A('Play boots the engine in the chamber', ok && playing(), JSON.stringify(C.probe()));
        if (!ok) return;
        const first = await until(() => answers.find((x) => !x.local), 5000) && answers.find((x) => !x.local);
        A('the box\'s echo goes into the insert before the master on Play', first?.ok && first.slot === 0 && first.controls.map((c) => c.name).join() === 'time,mix', JSON.stringify(first));
        M.firstProgramMs = first?.sinceSend;
        await wait(5000);
        const p = C.probe();
        A('frames go out and come back processed', p.sent > 200 && p.back > 0.9 * p.sent, `${p.sent} sent, ${p.back} back`);
        A('what comes back is sound, not silence', p.peak > 0.01, `peak ${p.peak.toFixed(3)}`);
        A('round trip, network and chamber time are measured', [p.rtt, p.net, p.engine].every(Number.isFinite), `rtt ${p.rtt?.toFixed(1)}, net ${p.net?.toFixed(1)}, chamber ${p.engine?.toFixed(1)}`);
        // a gain of 0.25 after the master, where nothing levels it back: about 12 dB down within a second
        slotChoice.set(1);
        const tSend = performance.now(), base = rmsIn(tSend - 2000, tSend), n = answers.length;
        C.program('{ In.ar(\\in.kr(0), 2) * \\gain.kr(0.25) }', 1);
        const g = await until(() => answers[n], 4000) && answers[n];
        A('a gain program goes into the insert after the master', g?.ok && g.slot === 1 && knobs.has('gain'), JSON.stringify(g));
        await wait(1300);
        const after = rmsIn(g.at + 300, g.at + 1300), drop = db(after) - db(base);
        const quiet = levels.find((x) => x.t > tSend && x.rms < base * 0.4);
        M.gainDropDb = +drop.toFixed(2); M.gainAnswerMs = Math.round(g.sinceSend); M.gainFirstQuietFrameMs = quiet ? Math.round(quiet.t - tSend) : null;
        A('the returned level falls about 12 dB, within a second', drop < -8 && drop > -16 && quiet && quiet.t - tSend < 1000,
          `${drop.toFixed(1)} dB, answered in ${M.gainAnswerMs} ms, first quieter frame back ${M.gainFirstQuietFrameMs} ms after the send`);
        // NEGATIVE CONTROL: a broken program sent past the check here is refused by the chamber's own compiler, and the sound goes on
        await wait(1100);
        const n2 = answers.length, back0 = m.back;
        C.sendRaw(1, '{ In.ar(\\in.kr(0), 2) * SinOsc.ar(');
        const b = await until(() => answers[n2], 4000) && answers[n2];
        await wait(1000);
        const during = rmsIn(b?.at ?? performance.now(), (b?.at ?? performance.now()) + 1000);
        A('NEGATIVE CONTROL: the chamber refuses a program that does not compile, with its message', b && !b.ok && !b.local && /line \d+, column \d+/.test(b.error), b?.error);
        A('and the sound goes on at the level it had', m.back - back0 > 40 && Math.abs(db(during) - db(after)) < 4, `${m.back - back0} frames, ${db(during).toFixed(1)} against ${db(after).toFixed(1)} dBFS`);
        // a knob, live: gain back to 1 arrives on the knobs link and the level comes back up
        const k0 = sentOn(...EDIT(1)[1].slice(0, 2)), tk = performance.now();
        knobs.get('gain').set(1, { from: 'hand' });
        await wait(1200);
        const up = db(rmsIn(tk + 300, tk + 1200)) - db(during);
        M.knobUpDb = +up.toFixed(2);
        A('moving the gain knob goes over the knobs link and brings the level back', sentOn(...EDIT(1)[1].slice(0, 2)) > k0 && up > 8, `${up.toFixed(1)} dB`);
        const ws = run.ws, ctx = run.ctx;
        stop();
        await wait(500);
        A('Stop closes the socket and the sound', ws.readyState === 3 && ctx.state === 'closed', `ws ${ws.readyState}, ctx ${ctx.state}`);
        slotChoice.set(0);
        choice.set(1);
        await wait(200);
        const okMic = await start();
        await wait(3000);
        const pm = C.probe();
        A('the microphone goes out and comes back', okMic && pm.back > 50, `${pm.sent} sent, ${pm.back} back`);
        const tracks = run?.mic?.getTracks() || [];
        stop();
        A('Stop ends the microphone', tracks.length > 0 && tracks.every((t) => t.readyState === 'ended'), tracks.map((t) => t.readyState).join(' '));
        choice.set(0);
        M.done = true;
      })().catch((e) => A('the driven check ran', false, e.message));
    } else d.log('left for the deep run: playing through the chamber, the live program, the knob and the refusal');
  }
  d.ready();
</script>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Edgecast</title>
<link rel="stylesheet" href="/shell/shell.css">
<link rel="stylesheet" href="/shell/concept.css">
<style>
  /* Play, and Start and Stop with the key, on one row at the top left, as /remote/plaits/. */
  .ec-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* inside the panel the scope gives up its page margin and its own border: the panel's edge is the edge */
  .ec-scope .pos-scope { margin: 0; }
  .ec-scope .pos-scope-c { border: 0; display: block; }
  .pos-vp-foot:has(.ec-line) { padding: 12px; display: block; }
  .pos-vp-foot:has(.ec-line) .pos-vp-c { justify-content: flex-start; }
  /* one height whatever the line says: two lines at the desk, four on a phone */
  .ec-line { font: 12.5px/1.45 var(--sans); color: var(--dim); white-space: normal; text-align: left;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; height: calc(1.45em * 2); }
  @media (max-width: 560px) { .ec-line { -webkit-line-clamp: 4; height: calc(1.45em * 4); } }
  .ec-k { font: 12px var(--mono); color: var(--dim); text-transform: uppercase; }
  .ec-v { font: 13px/1.45 var(--sans); overflow-wrap: anywhere; }
  /* the radio1965 block: its controls on one row, then a fixed line saying what it waits for */
  .ec-air { display: flex; flex-direction: column; gap: 12px; }
  .ec-air-h { margin: 0; }
  .ec-air-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ec-air-note { font: 13px/1.45 var(--sans); color: var(--dim); margin: 0; text-wrap: balance; }
  .ec-air-line { font: 12.5px/1.45 var(--mono); color: var(--dim); margin: 0; height: calc(1.45em * 2); overflow: hidden; }
  /* nothing reserved before anything is said: the room arrives with the first word */
  .ec-air-line:empty { display: none; }
  .ec-air .ec-v.ec-lines { white-space: pre-line; font: 12px/1.45 var(--mono); }
</style>
<script type="module">
  // radio1965's cast played by edgecast (workers/edgecast/station.mjs), one Durable Object on Cloudflare with the
  // cast's engine in wasm: GET /listen is its MP3, GET /status what it is doing. This page plays the stream in an
  // <audio>, draws its wave and says what is going on. Nothing opens on a visit: no fetch, no stream and no poll until
  // a press. Start and Stop show only with ?key= (the cast's key).
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay, parsePatch } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours, MEDIUM_COLOURS } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createGrainScope } from '/shell/grain-scope.mjs';
  import { createVideoPanel } from '/shell/video-panel.mjs';
  import { createGlueRows } from '/shell/glue.mjs';
  import { createChoice } from '/shell/choice.mjs';
  useMediumColours();

  const q = new URLSearchParams(location.search);
  // ?edgecast= points the page at a `wrangler dev` of workers/edgecast
  const EDGE = (q.get('edgecast') || 'https://edgecast.positron.studio').replace(/\/$/, '');
  const KEY = q.get('key') || '';
  // a start stops itself after this many minutes (the station's own default; ?cap= for another)
  const CAP_MIN = Math.max(1, Math.min(24 * 60, Number(q.get('cap')) || 30));
  const POLL_MS = 3000;
  // radio1965 is heard through our shout relay, one upstream connection however many listen (?shout= for a local one)
  const SHOUT = (q.get('shout') || 'https://shout.positron.studio').replace(/\/$/, '');

  const d = mount({ name: 'Edgecast', what: '', index: '/', indexLabel: 'positron',
    // the cells under the title, the log alone at the foot, as /remote/plaits/
    joined: false,
    readout: { scene: '', listeners: '', lead: 's', underruns: '', files: '', until: '' } });
  conceptNav('radio/edgecast');

  // ── the bay: the coarse patch the station runs, as patch text (plans/plan-edgecast-modular.md §2.2) ──
  // Inside the edge the links carry no `via`, so the bay gives them its one machine transport.
  const F = 'cf-cast:files', PL = 'cf-edgecast:playlist', C = 'cf-edgecast:cast', EN = 'cf-edgecast:encoder', SH = 'cf-edgecast:shout', S = 'web:speaker';
  const bay = createBay();
  bay.addNode({ id: F, kind: 'endpoint', label: 'cast files', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: PL, kind: 'engine', label: 'playlist', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: C, kind: 'engine', label: 'the cast', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: EN, kind: 'engine', label: 'mp3', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: SH, kind: 'endpoint', label: '/listen', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: S, kind: 'screen', label: 'speaker' });
  bay.addPort({ id: `${F}:audio-out`, dir: 'out', medium: 'audio', label: '/file', transports: ['https'] });
  bay.addPort({ id: `${PL}:value-out`, dir: 'out', medium: 'value', label: 'next file', shape: { of: 'file' } });
  bay.addPort({ id: `${C}:value-in`, dir: 'in', medium: 'value', label: 'which file', shape: { of: 'file' } });
  bay.addPort({ id: `${C}:audio-in`, dir: 'in', medium: 'audio', label: 'mp3', transports: ['https'] });
  bay.addPort({ id: `${C}:audio-out`, dir: 'out', medium: 'audio', label: 'pcm', shape: { codec: 'pcm' } });
  bay.addPort({ id: `${EN}:audio-in`, dir: 'in', medium: 'audio', label: 'pcm', shape: { codec: 'pcm' } });
  bay.addPort({ id: `${EN}:audio-out`, dir: 'out', medium: 'audio', label: 'mp3', shape: { codec: 'mp3' } });
  bay.addPort({ id: `${SH}:audio-in`, dir: 'in', medium: 'audio', label: 'mp3', shape: { codec: 'mp3' } });
  bay.addPort({ id: `${SH}:audio-out`, dir: 'out', medium: 'audio', label: '/listen', transports: ['https'] });
  bay.addPort({ id: `${S}:audio-in`, dir: 'in', medium: 'audio', label: 'audio', transports: ['https'] });
  const PATCH = `
    ${PL}:value-out -> ${C}:value-in
    ${F}:audio-out -> ${C}:audio-in via https
    ${C}:audio-out -> ${EN}:audio-in
    ${EN}:audio-out -> ${SH}:audio-in
    ${SH}:audio-out -> ${S}:audio-in via https`;
  const LINKS = parsePatch(PATCH);
  for (const l of LINKS) { const r = bay.link(l.from, l.to, l.transforms, l.via ? { via: l.via } : {}); if (!r.ok) d.log(`${l.from} -> ${l.to} refused: ${r.why}`, 'warn'); }
  // the chain that sounds only while somebody here is listening, the rest whenever the station is on air
  const HEARD = new Set([`${C}:audio-out`, `${EN}:audio-out`, `${SH}:audio-out`]);

  // ── on radio1965: the encoder's frames go to the relay worker (positron-edgecast-relay, through edgecast's RELAY
  // binding), which is the source on Väin's Icecast mount; we hear the mount back through shout, as their listeners do.
  // Drawn only while the relay is on or somebody here listens to radio1965.
  const R = 'cf-edgecast:relay', V = 'vain:icecast', SR = 'cf-shout:radio1965';
  bay.addNode({ id: R, kind: 'engine', label: 'to radio1965', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: V, kind: 'external', label: 'Väin Icecast', place: 'live.uuu.ee' });
  bay.addNode({ id: SR, kind: 'endpoint', label: 'shout relay', place: 'cloudflare', net: 'cloudflare' });
  bay.addPort({ id: `${R}:audio-in`, dir: 'in', medium: 'audio', label: 'mp3', shape: { codec: 'mp3' } });
  bay.addPort({ id: `${R}:audio-out`, dir: 'out', medium: 'audio', label: 'source', transports: ['icecast'] });
  bay.addPort({ id: `${V}:audio-in`, dir: 'in', medium: 'audio', label: 'radio1965', transports: ['icecast'] });
  bay.addPort({ id: `${V}:audio-out`, dir: 'out', medium: 'audio', label: 'radio1965', transports: ['https'] });
  bay.addPort({ id: `${SR}:audio-in`, dir: 'in', medium: 'audio', label: 'one upstream', transports: ['https'] });
  bay.addPort({ id: `${SR}:audio-out`, dir: 'out', medium: 'audio', label: '/radio1965', transports: ['https'] });
  // a link out of their Icecast opens a connection to somebody else's server, so it carries consent: a press here
  const AIR = [[`${EN}:audio-out`, `${R}:audio-in`, {}], [`${R}:audio-out`, `${V}:audio-in`, { via: 'icecast' }],
    [`${V}:audio-out`, `${SR}:audio-in`, { via: 'https', consent: true }], [`${SR}:audio-out`, `${S}:audio-in`, { via: 'https' }]];
  const AIR_NODES = new Set([R, V, SR]);
  let airLinks = [];        // the ids of AIR while it is drawn

  // ── state ──
  let st = null;            // the station's last /status
  let fetches = 0, pollT = 0, polling = false, player = null, listening = false;
  const get = async (path, init) => { fetches++; const r = await fetch(`${EDGE}${path}`, { cache: 'no-store', ...init }); return r.json(); };
  let rst = null;           // the relay's last /relay/status
  let radio = null, hearing = false, going = false;
  const relayOn = () => !!rst && rst.state !== 'off';
  const airShown = () => relayOn() || hearing || going;
  const nodeOf = (id) => id.split(':').slice(0, 2).join(':');
  const drawn = { nodes: () => bay.nodes().filter((n) => airLinks.length || !AIR_NODES.has(n.id)),
    ports: () => bay.ports().filter((p) => airLinks.length || !AIR_NODES.has(nodeOf(p.id))), links: () => bay.links() };
  const pb = createPatchbay(drawn, { flowing: (l, medium) => {
    if (medium !== 'audio') return false;
    if (l.to === `${R}:audio-in` || l.from === `${R}:audio-out`) return rst?.state === 'on-air';
    if (l.from === `${V}:audio-out` || l.from === `${SR}:audio-out`) return hearing;
    return !!st?.playing && (!HEARD.has(l.from) || listening);
  } });
  /** Draws or takes away the radio1965 chain. */
  function wire(on = airShown()) {
    if (on && !airLinks.length) {
      for (const [a, b, o] of AIR) { const r = bay.link(a, b, [], o); if (r.ok) airLinks.push(r.id); else d.log(`${a} -> ${b} refused: ${r.why}`, 'warn'); }
    } else if (!on && airLinks.length) { for (const id of airLinks) bay.unlink(id); airLinks = []; }
    pb.refresh();
  }

  // ── what is going on: rows of label and value, filled from /status ──
  const rows = createGlueRows({ grid: true });
  const val = {};
  for (const [k, label] of [['file', 'file'], ['next', 'next'], ['scene', 'scene'], ['effect', 'effect'], ['ghost', 'ghost'], ['layers', 'layers'], ['program', 'program'], ['feed', 'feed']]) {
    val[k] = el('span', 'ec-v', '');
    rows.row([el('span', 'ec-k', label), val[k]], { align: 'start' });
  }
  rows.el.hidden = true;

  // ── the scope: what is heard, as /radio/cast/ draws it ──
  const scopeHost = el('div', 'ec-scope');
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const scope = createGrainScope(scopeHost, { seconds: 10, height: 120, visitor: { colour: MEDIUM_COLOURS.program } });
  const line = el('span', 'ec-line', 'radio1965 on edgecast: nothing playing here');
  const panel = createVideoPanel({ media: scopeHost, left: false, right: false, centre: line, aspect: 'auto', fullMode: 'bare' });
  const mark = (c) => { if (listening) scope.wrap({ colour: css(c), short: false }); };

  // ── reading /status ──
  const hhmm = (iso) => (iso ? new Date(iso).toISOString().slice(11, 16) : '');
  function effectOf(sc) {
    if (!sc) return '';
    if (sc.phase === 'blend') return 'the blend into the next scene';
    const now = sc.at ?? 0, on = (sc.fx || []).find((f) => now >= f.at && now < f.at + f.len);
    if (on) return `${on.kind}, under way, ${Math.max(0, Math.round(on.at + on.len - now))} s left`;
    const next = (sc.fx || []).filter((f) => f.at > now).sort((a, b) => a.at - b.at)[0];
    return next ? `${next.kind} in ${Math.round(next.at - now)} s` : 'none left in this scene';
  }
  const layersOf = (Ly) => (Ly ? [Ly.drone !== 'none' && `${Ly.drone} drone`, Ly.res !== 'none' && `resonators ${Ly.res}`, Ly.harm !== 'none' && `harmonizer ${Ly.harm}`].filter(Boolean).join(', ') || 'the granulator alone' : '');
  const sceneOf = (sc) => (sc ? `${sc.si + 1}: ${sc.patch}, moving ${sc.param}${sc.phase === 'blend' ? ', blending' : ''}` : '');

  function show(s) {
    const sc = s?.scene, on = !!s?.playing;
    d.set('scene', on && sc ? sc.si + 1 : '');
    d.set('listeners', s ? s.listeners : '');
    d.set('lead', on && s.lead != null ? s.lead.toFixed(1) : '');
    d.set('underruns', on && s.underruns ? s.underruns.late : '');
    d.set('files', on && s.program ? s.program.files : '');
    d.set('until', on ? hhmm(s.until) : '');
    rows.el.hidden = !on;
    if (on) {
      val.file.textContent = s.file || '';
      val.next.textContent = s.next || '';
      val.scene.textContent = sceneOf(sc);
      val.effect.textContent = effectOf(sc);
      val.ghost.textContent = sc?.ghost ? sc.ghost : sc?.layers?.ghost === 'none' ? 'none in this scene' : 'none now';
      val.layers.textContent = layersOf(sc?.layers);
      val.program.textContent = s.program ? `${s.program.files} files from ${s.program.source}` : '';
      val.feed.textContent = s.fresh ? `${hhmm(s.fresh.at)} ${s.fresh.did}, every ${s.fresh.everyS} s` : 'not checked yet';
    }
    line.textContent = on ? `${s.file || 'a file'}, ${sc ? `scene ${sceneOf(sc)}${(sc.fx || []).length && sc.phase !== 'blend' && !/^none/.test(effectOf(sc)) ? `; ${effectOf(sc)}` : ''}` : 'starting'}` : `radio1965 on edgecast: ${s ? 'off air' : 'nothing playing here'}`;
    scope.visitorName(on && sc?.ghost ? `ghost: ${sc.ghost}` : '');
    if (KEY) btns.enable('stop', on || !!s?.wanted, 'the station is off air');
    pb.refresh();
  }

  /** What changed since the last status, one log line each: a file, a scene, an effect, a ghost, the feed. */
  function changes(a, b) {
    if (!b?.playing) { if (a?.playing) d.log(`the station went off air${b?.last?.why ? `: ${b.last.why}` : ''}`); return; }
    const x = a?.playing ? a.scene : null, y = b.scene;
    if (!a?.playing) d.log(`on air until ${hhmm(b.until)} UTC, ${b.program ? `${b.program.files} files from ${b.program.source}` : ''}`);
    if (b.file && b.file !== a?.file) d.log(`now playing ${b.file}`);
    if (y && y.inst !== x?.inst) { d.log(`scene ${sceneOf(y)}, ${layersOf(y.layers)}`); mark('--fg'); }
    const fxOn = (sc) => (sc?.fx || []).find((f) => sc.phase !== 'blend' && sc.at >= f.at && sc.at < f.at + f.len)?.kind;
    if (fxOn(y) && (fxOn(y) !== fxOn(x) || y.inst !== x?.inst)) d.log(`effect ${fxOn(y)} under way`);
    if (y?.ghost && y.ghost !== x?.ghost) { d.log(`a ghost: ${y.ghost}`); mark('--md-program'); }
    const f = b.fresh;
    if (f && f.at !== a?.fresh?.at && (f.added?.length || f.gone?.length)) d.log(`feed: ${f.did}`);
    if (b.underruns?.late > (a?.underruns?.late ?? b.underruns.late)) d.log(`the station fell behind the wall (${b.underruns.late} times)`, 'warn');
  }

  async function poll() {
    try { const s = await get('/status'); changes(st, s); st = s; show(s); return s; }
    catch (e) { d.log(`edgecast did not answer: ${e.message}`, 'warn'); return null; }
  }
  function startPoll() {
    if (polling) return;
    polling = true;
    const tick = async () => { if (!polling) return; await poll(); if (polling) pollT = setTimeout(tick, POLL_MS); };
    pollT = setTimeout(tick, POLL_MS);
  }
  function stopPoll() { polling = false; clearTimeout(pollT); }

  // ── listening: one <audio> through an analyser, made on the first press ──
  function makePlayer() {
    const audio = Object.assign(document.createElement('audio'), { preload: 'none', crossOrigin: 'anonymous' });
    const ctx = new AudioContext(), an = ctx.createAnalyser();
    an.fftSize = 2048;
    ctx.createMediaElementSource(audio).connect(an);
    an.connect(ctx.destination);
    // the stream ends when the station restarts: while it is still on air the player comes back by itself
    const again = (why) => {
      if (!listening) return;
      if (!st?.playing || (p.retries = (p.retries || 0) + 1) > 20) { d.log('the stream stopped: is the station on air?', 'warn'); stopListening(); return; }
      d.log(`the stream ${why}, listening again`);
      setTimeout(() => { if (listening) { audio.src = `${EDGE}/listen`; audio.play().catch(() => { /* the error event comes again */ }); } }, 1000);
    };
    audio.addEventListener('ended', () => again('ended'));
    audio.addEventListener('error', () => again('broke'));
    audio.addEventListener('playing', () => { p.retries = 0; d.log('playing the station'); pb.refresh(); });
    const p = { audio, ctx, an, buf: new Float32Array(an.fftSize), zeros: 0, tap: null };
    return p;
  }
  // WebKit hands a live stream's tap zeros (no byte ranges: WebKit 180696): then the wave comes from a second copy
  // of our own stream, cut at MP3 frames and decoded. why: lessons/workers-cast.md#ios-scope
  function startTap(url) {
    const ac = new AbortController(), queue = [];
    player.tap = { ac, queue, ready: 0 };
    d.log('the wave here comes from a second copy of the stream: this browser gives the player\'s tap no sound');
    const frameAt = (b, i) => b[i] === 0xff && (b[i + 1] & 0xe0) === 0xe0 && ((b[i + 2] >> 4) & 15) !== 0 && ((b[i + 2] >> 4) & 15) !== 15 && ((b[i + 2] >> 2) & 3) !== 3;
    (async () => {
      fetches++;
      const rd = (await fetch(url, { signal: ac.signal, cache: 'no-store' })).body.getReader();
      let pending = new Uint8Array(0);
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        const n = new Uint8Array(pending.length + value.length); n.set(pending); n.set(value, pending.length); pending = n;
        if (pending.length < 8192) continue;
        let cut = pending.length - 4; while (cut > 0 && !frameAt(pending, cut)) cut--;
        let from = 0; while (from < cut && !frameAt(pending, from)) from++;
        if (cut <= from) continue;
        const chunk = pending.slice(from, cut); pending = pending.slice(cut);
        try { const ab = await player.ctx.decodeAudioData(chunk.buffer); queue.push(ab.getChannelData(0)); player.tap.rate = ab.sampleRate; while (queue.length > 12) queue.shift(); } catch { /* a chunk that does not decode is skipped */ }
      }
    })().catch(() => { /* aborted on stop */ });
  }
  function tapTake(n) {
    const t = player.tap, out = new Float32Array(n); let k = 0;
    while (k < n && t.queue.length) { const c = t.queue[0], m = Math.min(n - k, c.length - t.ready); out.set(c.subarray(t.ready, t.ready + m), k); k += m; t.ready += m; if (t.ready >= c.length) { t.queue.shift(); t.ready = 0; } }
    return out.subarray(0, k);
  }
  let raf = 0, lastFeed = 0, lastT = -1, zeroT = 0;
  function feedLoop() {
    if (!listening || !player) { raf = 0; return; }
    const t = performance.now(), dt = (t - (lastFeed || t)) / 1000; lastFeed = t;
    if (player.tap) {
      const x = dt > 0 ? tapTake(Math.round(dt * (player.tap.rate || 44100))) : null; if (x?.length) scope.feed(x, player.tap.rate || 44100);
    } else {
      const an = player.an, n = Math.min(player.buf.length, Math.round(dt * an.context.sampleRate));
      an.getFloatTimeDomainData(player.buf);
      if (n > 0) scope.feed(player.buf.subarray(player.buf.length - n), an.context.sampleRate);
      // zeros while the audio advances, for 2 s: the tap is deaf
      if (t - zeroT > 250) {
        zeroT = t;
        let pk = 0; for (const v of player.buf) pk = Math.max(pk, Math.abs(v));
        const moved = player.audio.currentTime > lastT; lastT = player.audio.currentTime;
        player.zeros = pk === 0 && moved ? player.zeros + 1 : 0;
        if ((player.zeros >= 8 || q.get('tap') === '1') && !player.tap) startTap(`${EDGE}/listen`);
      }
    }
    raf = requestAnimationFrame(feedLoop);
  }

  async function play() {
    if (listening) { stopListening(); return; }
    if (hearing) stopHearing();
    // the context is made inside the press, so the sound is allowed
    player ||= makePlayer();
    player.ctx.resume().catch(() => { /* sound may be late, the stream is not */ });
    btns.setIcon?.('play', 'stop', 'stop');
    const s = await poll();
    startPoll();
    if (!s?.playing) { d.log(`the station is not on air${KEY ? ': press Start' : ''}`, 'warn'); btns.setIcon?.('play', 'play', 'play'); if (!KEY) stopPoll(); return; }
    listening = true;
    player.audio.src = `${EDGE}/listen`;
    player.audio.play().catch(() => { /* the error event says why */ });
    scope.clear(); scope.source('edgecast');
    lastFeed = 0; if (!raf) raf = requestAnimationFrame(feedLoop);
    pb.refresh();
  }
  function stopListening() {
    listening = false;
    if (player) { player.audio.pause(); player.audio.removeAttribute('src'); player.audio.load(); player.tap?.ac.abort(); player.tap = null; player.zeros = 0; }
    cancelAnimationFrame(raf); raf = 0; scope.clear(); scope.source('');
    btns.setIcon?.('play', 'play', 'play');
    if (!KEY) stopPoll();
    show(st);
  }

  // ── Start and Stop, only with the key: the station's own cap ends a start ──
  async function control(what) {
    try {
      const s = await get(`/${what}?key=${encodeURIComponent(KEY)}${what === 'start' ? `&cap=${CAP_MIN}` : ''}`, { method: 'POST' });
      if (s.error) d.log(`${what}: ${s.error}`, 'warn');
      else d.log(what === 'start' ? `started, stops itself after ${CAP_MIN} min` : 'stopped');
      startPoll();
      await poll();
    } catch (e) { d.log(`${what} did not reach edgecast: ${e.message}`, 'bad'); }
  }

  // ── radio1965: the station first, the relay only once the station is producing, so the mount never carries
  // the station's boot as silence (measured 09:08Z 2026-10-21: 10.8 s of it when the relay went first) ──
  /** Producing: on air with the render ahead of the wall clock and a tick run, so frames are going to the relay. */
  const producing = (s) => s?.playing === true && s.lead > 0 && s.seconds > 0 && s.ticks > 0;
  const waitingFor = (s) => !s ? 'waiting for edgecast to answer'
    : !s.wanted ? 'the station is not wanted: did the start fail?'
    : !s.playing ? 'waiting for the station to boot'
    : !(s.seconds > 0) ? 'waiting for the first rendered second'
    : !(s.lead > 0) ? `waiting for the render to get ahead of the clock (lead ${s.lead ?? 'none'})`
    : 'waiting for the first tick';
  /**
   * Start the station with a cap a minute past the relay's, wait until it is producing, then start the relay.
   * io: startStation(cap), stationStatus(), startRelay(min), wait(ms), now(), say(text), aborted(), deadlineMs.
   */
  async function onAirSequence(minutes, io) {
    const a = await io.startStation(minutes + 1);
    if (a?.error && !/already playing/.test(a.error)) throw new Error(`the station did not start: ${a.error}`);
    if (a?.error) io.say(`the station was already playing, until ${hhmm(a.until)} UTC`);
    const t0 = io.now();
    for (;;) {
      if (io.aborted()) throw new Error('stopped before the relay started');
      const s = await io.stationStatus();
      if (producing(s)) { io.say(`the station is producing: lead ${s.lead.toFixed(1)} s, ${s.seconds.toFixed(1)} s rendered; starting the relay`); break; }
      io.say(waitingFor(s));
      if (io.now() - t0 > io.deadlineMs) throw new Error(`the station was not producing after ${Math.round(io.deadlineMs / 1000)} s (${waitingFor(s)})`);
      await io.wait(1000);
    }
    const r = await io.startRelay(minutes);
    if (r?.error) throw new Error(`the relay did not start: ${r.error}`);
    return r;
  }
  /** The relay lets go of the mount first, then the station stops. */
  async function offAirSequence(io) { const r = await io.stopRelay(); const s = await io.stopStation(); return { r, s }; }

  const key = encodeURIComponent(KEY);
  const post = (path) => get(path, { method: 'POST' });
  let aborting = false;
  const liveIo = {
    startStation: (cap) => post(`/start?key=${key}&cap=${cap}`),
    stationStatus: () => poll(),
    startRelay: (min) => post(`/relay/start?key=${key}&min=${min}`),
    stopRelay: () => post(`/relay/stop?key=${key}`),
    stopStation: () => post(`/stop?key=${key}`),
    wait: (ms) => new Promise((r) => setTimeout(r, ms)),
    now: () => Date.now(),
    say: (t) => { airLine.textContent = t; },
    aborted: () => aborting,
    deadlineMs: 90000,
  };

  const air = el('section', 'ec-air');
  const airH = el('h3', 'pos-sec-h ec-air-h', 'radio1965');
  const airNote = el('p', 'ec-air-note', 'radio1965 is Väin\'s public mount. When we are not on it, their own stream may be.');
  const airLine = el('p', 'ec-air-line', '');
  const minutes = createChoice({ label: 'minutes', options: [['2', 2], ['5', 5], ['10', 10]], at: 0 });
  const airBtns = createButtonGroup({ buttons: [
    ...(KEY ? [{ id: 'onair', label: 'On radio1965', onPress: () => goOnAir() }, { id: 'offair', label: 'Stop', onPress: () => goOffAir() }] : []),
    { id: 'hear', label: 'Listen on radio1965', onPress: () => hear() },
  ] });
  const airRow = el('div', 'ec-air-row');
  if (KEY) airRow.append(minutes.el);
  airRow.append(airBtns.el);

  // the relay's numbers, filled from /relay/status every POLL_MS while the station or the relay is on
  const relayRows = createGlueRows({ grid: true });
  const rv = {};
  for (const k of ['state', 'on air', 'sent', 'station', 'silence', 'gaps', 'drops', 'refusals', 'lines']) {
    rv[k] = el('span', k === 'lines' ? 'ec-v ec-lines' : 'ec-v', '');
    relayRows.row([el('span', 'ec-k', k), rv[k]], { align: 'start' });
  }
  relayRows.el.hidden = true;
  if (KEY) air.append(airH, airRow, airLine, airNote, relayRows.el); else air.append(airH, airRow, airNote);

  function showRelay(r) {
    relayRows.el.hidden = !r;
    if (!r) return;
    const sent = r.sent || {}, last = (a) => (a?.length ? a[a.length - 1] : null);
    rv.state.textContent = `${r.state}${r.why ? `: ${r.why}` : ''}${r.until ? `, until ${hhmm(r.until)} UTC` : ''}`;
    rv['on air'].textContent = r.onAirS != null ? `${r.onAirS} s` : '';
    rv.sent.textContent = sent.bytes != null ? `${Math.round(sent.bytes / 1000)} kB` : '';
    rv.station.textContent = sent.stationS != null ? `${sent.stationS} s${r.station ? `, ${r.station.up ? 'pushing' : 'quiet'}` : ''}` : '';
    rv.silence.textContent = sent.silentS != null ? `${sent.silentS} s` : '';
    const g = last(sent.gaps);
    rv.gaps.textContent = sent.gaps ? `${sent.gaps.length}${g ? `, last ${g.s} s at ${hhmm(g.at)}` : ''}` : '';
    const dr = last(r.drops);
    rv.drops.textContent = r.drops ? `${r.drops.length}${dr ? `, last: ${dr.why}` : ''}` : '';
    const rf = last(r.refusals);
    rv.refusals.textContent = r.refusals ? `${r.refusals.length}${rf ? `, last: ${rf.msg || rf.why}` : ''}` : '';
    rv.lines.textContent = (r.lines || []).slice(-3).map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join('\n');
  }
  function airButtons() {
    if (!KEY) return;
    airBtns.enable('onair', !going && !relayOn(), going ? 'starting' : 'the relay is on: stop it first');
    airBtns.enable('offair', going || relayOn() || !!st?.wanted, 'nothing is on');
    minutes.disabled(going || relayOn());
  }
  let airT = 0, airPolling = false;
  async function pollRelay() {
    try { const r = await get('/relay/status'); if (rst?.state !== r.state) d.log(`relay: ${r.state}${r.why ? `, ${r.why}` : ''}`, /refused/.test(r.state) ? 'warn' : undefined); rst = r; showRelay(r); }
    catch (e) { d.log(`the relay status did not answer: ${e.message}`, 'warn'); }
    wire(); airButtons();
  }
  function startAirPoll() {
    if (airPolling) return;
    airPolling = true; startPoll();
    const tick = async () => {
      if (!airPolling) return;
      await pollRelay();
      if (!going && !relayOn() && !st?.wanted) { airPolling = false; return; }
      airT = setTimeout(tick, POLL_MS);
    };
    airT = setTimeout(tick, 0);
  }

  async function goOnAir() {
    const min = minutes.value();
    going = true; aborting = false; wire(); airButtons();
    d.log(`on radio1965 for ${min} min: the station first, with a cap of ${min + 1} min`);
    try {
      await onAirSequence(min, liveIo);
      d.log(`the relay is starting: on radio1965 for ${min} min`);
      airLine.textContent = 'the relay is taking the mount';
    } catch (e) { d.log(e.message, 'warn'); airLine.textContent = e.message; }
    going = false;
    startAirPoll(); await pollRelay();
  }
  async function goOffAir() {
    aborting = true;
    try {
      const { r, s } = await offAirSequence(liveIo);
      d.log(`stopped: the relay (${r?.error || r?.state || 'off'}), then the station (${s?.error || (s?.playing ? 'still playing' : 'off')})`);
      airLine.textContent = 'off radio1965';
    } catch (e) { d.log(`stop did not reach edgecast: ${e.message}`, 'bad'); }
    startAirPoll(); await pollRelay(); await poll();
  }

  // ── listening on radio1965: what Väin's listeners hear, through shout; an <audio> made on the first press ──
  function hear() {
    if (hearing) { stopHearing(); return; }
    if (listening) stopListening();
    radio ||= Object.assign(document.createElement('audio'), { preload: 'none' });
    radio.onplaying = () => { d.log('playing radio1965'); pb.refresh(); };
    radio.onerror = () => { if (hearing) { d.log('radio1965 did not play: their mount may be off', 'warn'); stopHearing(); } };
    hearing = true;
    radio.src = `${SHOUT}/radio1965`;
    radio.play().catch(() => { /* the error event says why */ });
    airBtns.button('hear').textContent = 'Stop listening';
    wire();
  }
  function stopHearing() {
    hearing = false;
    if (radio) { radio.pause(); radio.removeAttribute('src'); radio.load(); }
    airBtns.button('hear').textContent = 'Listen on radio1965';
    wire();
  }
  if (KEY) airButtons();

  const btns = createButtonGroup({ buttons: [
    { id: 'play', icon: 'play', label: 'play', onPress: () => play() },
    ...(KEY ? [{ id: 'start', label: 'Start', onPress: () => control('start') }, { id: 'stop', label: 'Stop', onPress: () => control('stop') }] : []),
  ] });
  const top = el('div', 'ec-top');
  top.append(btns.el);
  d.stack.add(top, panel.el, rows.el, air, pb.el);

  window.__demo.bay = bay;
  window.__demo.edgecast = { edge: EDGE, play, stopListening, poll, status: () => st,
    probe: () => ({ fetches, polling, listening, player: !!player, keyed: !!KEY, rows: !rows.el.hidden, radio: !!radio, hearing, airPolling }) };

  // ── the self-check, only under ?selfcheck=1: everything it grades is in this tab, nothing reaches edgecast ──
  if (SELFCHECK) {
    const A = d.assert, has = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
    A('a visit opens nothing: no fetch, no stream, no poll, no radio1965', fetches === 0 && !polling && !player && !radio && !airPolling);
    const out = bay.links().filter((l) => l.via === 'https').map((l) => `${l.from} -> ${l.to}`).sort().join();
    const inside = bay.links().filter((l) => l.from.startsWith('cf-edgecast:') && l.to.startsWith('cf-edgecast:'));
    A('the cast\'s files reach the cast and /listen reaches the speaker over https, and the cast, mp3 and /listen are linked inside the edge',
      LINKS.every((l) => has(l.from, l.to)) && out === [`${F}:audio-out -> ${C}:audio-in`, `${SH}:audio-out -> ${S}:audio-in`].sort().join()
      && inside.length === 3 && inside.every((l) => !l.via),
      bay.links().map((l) => `${l.from} -> ${l.to} ${l.via ?? l.session?.transport ?? ''}`).join(', '));
    A('without the key there is only Play', KEY ? true : !top.querySelector('button[data-id="start"], button[data-id="stop"]') && top.querySelectorAll('button').length === 1, `${top.querySelectorAll('button').length} buttons`);
    {
      // NEGATIVE CONTROL: the bay refuses a link out of an input, so the two above are not waved through
      const r = bay.link(`${S}:audio-in`, `${SH}:audio-out`, [], { via: 'https' });
      A('NEGATIVE CONTROL: a link out of the speaker\'s input is refused', !r.ok, r.why || 'linked');
      if (r.ok) bay.unlink(r.id);
    }
    {
      // NEGATIVE CONTROL: the codec is in the picture, so the cast's pcm cannot skip the encoder
      const r = bay.link(`${C}:audio-out`, `${SH}:audio-in`);
      A('NEGATIVE CONTROL: the cast\'s pcm straight into /listen is refused, it has to pass the mp3 encoder', !r.ok && /codec/.test(r.why), r.why || 'linked');
      if (r.ok) bay.unlink(r.id);
    }
    // the reading of a status, on a made up one: the effect, the scene and the change log
    const fake = { playing: true, listeners: 2, lead: 1.84, until: '2026-10-20T19:00:00.000Z', file: 'A file', next: 'B file', underruns: { late: 0 },
      program: { files: 9, source: 'radio1965\'s program' }, fresh: { at: '2026-10-20T18:40:00.000Z', did: 'nothing new', everyS: 30 },
      scene: { si: 2, inst: 'x2', patch: 'Cloud', param: 'pos', phase: 'dwell', at: 30, fx: [{ kind: 'echo', at: 25, len: 20 }], ghost: 'C file', layers: { drone: 'none', res: 'none', harm: 'low', ghost: 'some' } } };
    A('an effect under way reads with its time left', effectOf(fake.scene) === 'echo, under way, 15 s left', effectOf(fake.scene));
    A('NEGATIVE CONTROL: an effect still to come is not under way', effectOf({ ...fake.scene, at: 10 }) === 'echo in 15 s', effectOf({ ...fake.scene, at: 10 }));
    show(fake);
    A('a status fills the rows, the cells and the line under the wave', !rows.el.hidden && val.ghost.textContent === 'C file' && val.layers.textContent === 'harmonizer low' && /scene 3: Cloud/.test(line.textContent),
      `${val.ghost.textContent} | ${val.layers.textContent} | ${line.textContent}`);
    show(null);
    A('and no status leaves the rows hidden and the cells empty', rows.el.hidden && getComputedStyle(rows.el).display === 'none');

    // ── radio1965, all on stubs: nothing here reaches edgecast, the relay, shout or their mount ──
    const stub = (statuses, { start = {}, relay = { state: 'connecting' } } = {}) => {
      const calls = []; let t = 0, i = 0;
      return { calls, io: {
        startStation: async (cap) => { calls.push(`station start cap ${cap}`); return start; },
        stationStatus: async () => { const s = statuses[Math.min(i++, statuses.length - 1)]; calls.push(`status ${producing(s) ? 'producing' : 'not yet'}`); return s; },
        startRelay: async (min) => { calls.push(`relay start min ${min}`); return relay; },
        stopRelay: async () => { calls.push('relay stop'); return { state: 'off' }; },
        stopStation: async () => { calls.push('station stop'); return { playing: false }; },
        wait: async (ms) => { t += ms; }, now: () => t, say: () => {}, aborted: () => false, deadlineMs: 5000 } };
    };
    const booting = [null, { wanted: true, playing: false, seconds: null, lead: null, ticks: 0 },
      { wanted: true, playing: true, seconds: 0.4, lead: 0, ticks: 0 }, { wanted: true, playing: true, seconds: 2.6, lead: 1.9, ticks: 3 }];
    {
      const { calls, io } = stub(booting);
      await onAirSequence(2, io);
      const ri = calls.indexOf('relay start min 2'), pi = calls.indexOf('status producing');
      A('on radio1965 for 2 min: the station starts with a cap of 3, and the relay starts with 2 only after a status says producing',
        calls[0] === 'station start cap 3' && pi > 0 && ri === pi + 1 && calls.filter((c) => c.startsWith('status')).length === 4, calls.join(', '));
    }
    {
      // NEGATIVE CONTROL: a station that never produces never gets the relay, and the wait gives up in words
      const { calls, io } = stub([{ wanted: true, playing: true, seconds: 0.4, lead: 0, ticks: 2 }]);
      let err = '';
      try { await onAirSequence(5, io); } catch (e) { err = e.message; }
      A('NEGATIVE CONTROL: a station whose render never gets ahead of the clock never gets the relay, and the wait says why',
        !calls.some((c) => c.startsWith('relay')) && /not producing after 5 s/.test(err) && /lead 0/.test(err), `${err} | ${calls.length} calls`);
    }
    {
      // NEGATIVE CONTROL: a refused station start (a wrong key) sends nothing to the relay
      const { calls, io } = stub(booting, { start: { error: '/start needs the key' } });
      let err = '';
      try { await onAirSequence(2, io); } catch (e) { err = e.message; }
      A('NEGATIVE CONTROL: a refused station start sends nothing to the relay', calls.length === 1 && /needs the key/.test(err), calls.join(', '));
    }
    A('producing needs on air, a lead, rendered seconds and a tick; each missing one reads as not producing',
      producing(booting[3]) && !producing(booting[2]) && !producing({ ...booting[3], ticks: 0 }) && !producing({ ...booting[3], playing: false }) && !producing(null));
    {
      const { calls, io } = stub([]);
      await offAirSequence(io);
      A('Stop lets go of the mount first, then stops the station', calls.join(', ') === 'relay stop, station stop', calls.join(', '));
    }
    {
      // the chain is drawn while the relay is on, and taken away after
      const before = drawn.nodes().length;
      rst = { state: 'on-air' }; wire();
      const has2 = (a, b) => bay.links().some((l) => l.from === a && l.to === b);
      const shown = drawn.nodes().map((n) => n.id);
      A('with the relay on, the picture gains to radio1965, Väin\'s Icecast and shout, linked on to the speaker',
        AIR.every(([a, b]) => has2(a, b)) && [R, V, SR].every((x) => shown.includes(x)) && before === shown.length - 3, `${before} -> ${shown.length} nodes`);
      rst = null; wire();
      A('and with it off they are gone again', !bay.links().some((l) => l.from === `${R}:audio-out`) && drawn.nodes().length === before, `${drawn.nodes().length} nodes`);
      // NEGATIVE CONTROL: the link out of their Icecast is refused without consent
      const r = bay.link(`${V}:audio-out`, `${SR}:audio-in`, [], { via: 'https' });
      A('NEGATIVE CONTROL: a link out of Väin\'s Icecast without consent is refused', !r.ok, r.why || 'linked');
      if (r.ok) bay.unlink(r.id);
    }
    showRelay({ state: 'refused-auth', why: 'HTTP/1.0 401 Unauthorized', onAirS: 0, drops: [], refusals: [{ at: '2026-10-21T09:00:00.000Z', why: 'refused-auth', msg: 'HTTP/1.0 401 Unauthorized' }],
      sent: { bytes: 23400, stationS: 0, silentS: 1.5, gaps: [] }, station: { up: false }, lines: ['a', 'b', 'refused, not retrying'] });
    A('a relay status fills its rows, the refusal with Icecast\'s own words', !relayRows.el.hidden && /401/.test(rv.refusals.textContent) && rv.sent.textContent === '23 kB' && /refused-auth/.test(rv.state.textContent),
      `${rv.state.textContent} | ${rv.refusals.textContent} | ${rv.sent.textContent}`);
    showRelay(null);
  }
  d.ready();
</script>

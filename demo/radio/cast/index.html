<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>Väin cast</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  /* the station list and the open station side by side; the detail wraps under the list when there is no room */
  .vc-main { display: flex; flex-wrap: wrap; gap: var(--pos-gap) var(--rows-gap); align-items: flex-start; }
  .vc-main > .vc-stations { flex: 1 1 250px; min-width: 0; }
  .vc-main > .vc-detail { flex: 999 1 380px; min-width: 0; }
  .vc-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .vc-detail { display: flex; flex-direction: column; gap: 28px; }
  .vc-mix > .sld-group { width: 100%; }
  .vc-k { color: var(--dim); text-transform: uppercase; font: 12px var(--mono); }
  .vc-v { font: 13px var(--mono); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-dim { color: var(--dim); font: 12px var(--sans); }
  .vc-name { font: 600 14px var(--mono); }
  .vc-note { color: var(--warn); font: 12px var(--mono); }
  .vc-ctl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; }
  .vc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .vc-head > .vc-ctl { flex-wrap: nowrap; gap: 12px; align-items: center; }
  /* a head row keeps its buttons at their own size on a phone, as a video panel slot does */
  .vc-head .pos-bgroup { width: auto; min-width: auto; }
  .vc-head .pos-bgroup-row { min-width: auto; overflow-x: visible; }
  /* a program or archive row: number or day, name, its buttons; the name gives way first */
  .vc-file { display: grid; grid-template-columns: 3ch minmax(0, 1fr) auto auto; }
  .vc-file .vc-n { color: var(--dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .vc-file .vc-day { color: var(--dim); font: 12px var(--mono); }
  .vc-arch { grid-template-columns: minmax(0, 1fr) auto auto; }
  .vc-file[data-on="1"] .vc-v { color: var(--hi); }
  .vc-list { width: 100%; }
  .vc-stations .pos-tbl-c .pos-pres { vertical-align: middle; }
</style>
<script type="module">
  // Väin's archive played live into an Icecast mount by a Container a Durable Object keeps alive (workers/cast).
  // A list of the six stations and the open one beside it: its cast, its sound and its own program.
  // Control needs ?key= once; it is kept in this browser.
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { SELFCHECK } from '/shell/selfcheck.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createButtonGroup } from '/shell/button-group.mjs';
  import { createGlueRows } from '/shell/glue.mjs';
  import { createPresence } from '/shell/presence.mjs';
  import { createChoice } from '/shell/choice.mjs';
  import { createSlider, createSliderGroup } from '/shell/slider.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { PATCHES, valuesOf } from '/granulator/grain-ring.mjs';
  import { createTable } from '/shell/table.mjs';
  import { createWaveShape } from '/shell/synth-view.mjs';
  import { scopeWindow } from '/shell/rt-scope.mjs';
  import { createLocal } from '/radio/cast/local.mjs';
  useMediumColours();

  const q = new URLSearchParams(location.search);
  const BASE = q.get('cast') || 'https://cast.positron.studio';
  const SHOUT = q.get('shout') || 'https://shout.positron.studio';
  const d = mount({ name: 'Väin cast',
    what: 'Each station plays Väin\'s archive with its own program and sound, tried here first and put on air from Cloudflare.',
    index: '/', indexLabel: 'positron',
    readout: { listening: '', heard: 's', level: 'dB', prelisten: '' } });
  conceptNav('radio/cast');

  let key = q.get('key') || '';
  try { if (key) localStorage.setItem('vain-cast-key', key); else key = localStorage.getItem('vain-cast-key') || ''; } catch { /* no storage */ }

  // ── the stations; radio1965 is heard through shout (one upstream), user1..4 in the Väin app only ──
  const STATIONS = ['preview', 'radio1965', 'user1', 'user2', 'user3', 'user4'];
  const LISTEN = { preview: `${BASE}/listen/preview`, radio1965: `${SHOUT}/radio1965` };
  const listenUrl = (t) => LISTEN[t] || null;
  // per channel, whether Väin's own stream is on it (GET /live, their livestream events)
  let live = {};
  let target = 'preview'; // the open station

  // ── the patch: their archive, the caster in Cloudflare, the mount it plays into, and this page's players ──
  const bay = createBay();
  bay.addNode({ id: 'vain:archive', kind: 'external', label: 'Väin archive', place: 'eccm.ee' });
  bay.addNode({ id: 'cf-cast:caster', kind: 'endpoint', label: 'caster', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'cf-icecast:preview', kind: 'endpoint', label: 'preview Icecast', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'vain:icecast', kind: 'external', label: 'Väin Icecast', place: 'live.uuu.ee' });
  bay.addNode({ id: 'cf-shout:radio1965', kind: 'endpoint', label: 'shout relay', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'web:player', kind: 'engine', label: 'player' });
  bay.addNode({ id: 'web:prelisten', kind: 'engine', label: 'prelisten' });
  bay.addNode({ id: 'cf-cast:files', kind: 'endpoint', label: 'file pass', place: 'cloudflare', net: 'cloudflare' });
  bay.addNode({ id: 'web:local', kind: 'engine', label: 'local' });
  bay.addPort({ id: 'vain:archive:audio-out', dir: 'out', medium: 'audio', label: 'mp3 files', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:caster:audio-in', dir: 'in', medium: 'audio', label: 'archive', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:caster:audio-out', dir: 'out', medium: 'audio', label: 'source', transports: ['icecast'] });
  bay.addPort({ id: 'cf-icecast:preview:audio-in', dir: 'in', medium: 'audio', label: '/preview', transports: ['icecast'] });
  bay.addPort({ id: 'cf-icecast:preview:audio-out', dir: 'out', medium: 'audio', label: '/listen/preview', transports: ['https'] });
  bay.addPort({ id: 'vain:icecast:audio-in', dir: 'in', medium: 'audio', label: 'radio1965, user1 to user4', transports: ['icecast'] });
  bay.addPort({ id: 'vain:icecast:audio-out', dir: 'out', medium: 'audio', label: 'radio1965', transports: ['https'] });
  bay.addPort({ id: 'cf-shout:radio1965:audio-in', dir: 'in', medium: 'audio', label: 'one upstream', transports: ['https'] });
  bay.addPort({ id: 'cf-shout:radio1965:audio-out', dir: 'out', medium: 'audio', label: '/radio1965', transports: ['https'] });
  bay.addPort({ id: 'web:player:audio-in', dir: 'in', medium: 'audio', label: 'listen', transports: ['https'] });
  bay.addPort({ id: 'web:prelisten:audio-in', dir: 'in', medium: 'audio', label: 'one file', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:files:audio-in', dir: 'in', medium: 'audio', label: 'archive', transports: ['https'] });
  bay.addPort({ id: 'cf-cast:files:audio-out', dir: 'out', medium: 'audio', label: '/file', transports: ['https'] });
  bay.addPort({ id: 'web:local:audio-in', dir: 'in', medium: 'audio', label: 'tuner, grains', transports: ['https'] });
  const SINK = (t) => (t === 'preview' ? 'cf-icecast:preview:audio-in' : 'vain:icecast:audio-in');
  const HEARD = { preview: [['cf-icecast:preview:audio-out', 'web:player:audio-in']],
    radio1965: [['vain:icecast:audio-out', 'cf-shout:radio1965:audio-in'], ['cf-shout:radio1965:audio-out', 'web:player:audio-in']] };
  const status = {}; // target -> its last status
  let player = null, levelTimer = 0, listenTarget = null, pre = null, preId = null;
  // LOCAL: the open station's sound played in this browser off /file/<id>, free, nothing on air (local.mjs)
  let local = null, localFor = null;
  const localOn = () => !!local?.playing;
  const listening = () => !!player && !player.audio.paused;
  const prelistening = () => !!pre && !pre.paused;
  const pb = createPatchbay(bay, { flowing: (l) => {
    if (l.to === 'web:prelisten:audio-in') return prelistening();
    if (l.to === 'web:local:audio-in' || l.to === 'cf-cast:files:audio-in') return localOn();
    if (l.to === 'web:player:audio-in' || l.from === 'vain:icecast:audio-out') return listening() && listenTarget === target;
    return !!status[target]?.onAir;
  } });
  function wire() {
    for (const l of bay.links()) bay.unlink(l.id);
    for (const [a, b] of [['vain:archive:audio-out', 'cf-cast:caster:audio-in'], ['cf-cast:caster:audio-out', SINK(target)],
      ...(HEARD[target] || []), ['vain:archive:audio-out', 'web:prelisten:audio-in'],
      ['vain:archive:audio-out', 'cf-cast:files:audio-in'], ['cf-cast:files:audio-out', 'web:local:audio-in']]) {
      const r = bay.link(a, b, [], { via: a.startsWith('cf-cast:caster') ? 'icecast' : 'https', consent: true });
      if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
    }
    pb.refresh();
  }

  // ── control: one socket per station, opened on a press; it pushes that station's status every second ──
  const sockets = {}, opening = {};
  let openSocket = (t) => new WebSocket(`${BASE.replace(/^http/, 'ws')}/control/${t}?key=${encodeURIComponent(key)}`);
  function control(t) {
    if (sockets[t]?.readyState === 1) return Promise.resolve(sockets[t]);
    if (opening[t]) return opening[t];
    if (!key) { d.log('control needs the key: open this page once with ?key=', 'warn'); return Promise.resolve(null); }
    opening[t] = new Promise((res) => {
      const s = openSocket(t);
      s.onopen = () => { sockets[t] = s; opening[t] = null; res(s); };
      s.onmessage = (e) => take(t, JSON.parse(e.data));
      s.onclose = () => { if (sockets[t] === s) delete sockets[t]; opening[t] = null; res(null); };
      s.onerror = () => d.log(`${t}: the caster refused the control socket`, 'warn');
    });
    return opening[t];
  }
  async function send(t, m) { const s = await control(t); if (s) s.send(JSON.stringify(m)); return !!s; }

  // ── the archive, and each station's program as the caster keeps it ──
  let items = [];
  const progs = {}, progTouched = {};
  const progOf = (t) => progs[t] || [];
  const startIds = (t) => (progOf(t).length ? progOf(t).slice() : items.map((x) => x.id));
  const titleOf = (id) => items.find((x) => String(x.id) === String(id))?.title || '';
  const mmss = (s) => (Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '');
  const theirs = (t) => !!live[t]?.vain && !status[t]?.onAir;
  // an edit applies after the current file while on air, and is kept for START while off
  function editProgram(ids) {
    const t = target;
    progs[t] = ids; progTouched[t] = Date.now();
    showProgram();
    if (localOn() && localFor === t) local.queue(localQueue());
    return send(t, status[t]?.onAir ? { cmd: 'queue', ids } : { cmd: 'program', ids });
  }

  // ── STATIONS: one row per channel, the open one marked ──
  const badges = {};
  const stTable = createTable({ columns: [
    { key: 'name', label: 'station', width: 80, hi: true },
    { key: 'who', label: 'on air', width: 88 },
    { key: 'now', label: 'now', grow: true, clip: true },
    { key: 'stops', label: 'stops', width: 56 },
  ], onPick: (r) => pick(r.name) });
  const presence = (t) => createPresence({ of: t, says: { online: 'positron', offline: 'off', unknown: 'not read yet', checking: 'reading', coming: 'starting' },
    busyWords: { page: 'Väin' }, can: ['online', 'offline', 'unknown', 'coming'], state: 'unknown', showName: false });
  stTable.set(STATIONS.map((t) => ({ name: t, who: '', now: '', stops: '' })));
  const stRows = [...stTable.scroller().querySelectorAll('.pos-tbl-row:not(.pos-tbl-head)')];
  STATIONS.forEach((t, i) => { badges[t] = presence(t); stRows[i].children[1].append(badges[t].el); stRows[i].dataset.station = t; });
  const markOpen = () => stTable.mark((r) => r.name === target);

  // ── the open station: its cast, what plays, its sound, its program ──
  const head = el('div', 'vc-head');
  const dName = el('span', 'vc-name', target), dBadge = presence('the open station');
  const nameBox = el('span', 'vc-ctl'); nameBox.append(dName, dBadge.el);
  const castBtns = createButtonGroup({ buttons: [
    { id: 'cast', icon: 'play', label: 'start the cast', onPress: () => cast(target) },
    { id: 'next', icon: 'skip-forward', label: 'next file', onPress: () => send(target, { cmd: 'next' }) },
  ] });
  const listenBtn = createButtonGroup({ buttons: [
    { id: 'listen', icon: 'headphones', label: 'listen', onPress: () => (listening() && listenTarget === target ? stopListening() : startListening(target)) },
  ] });
  const inApp = el('span', 'vc-dim', 'in the Väin app');
  const headCtl = el('span', 'vc-ctl'); headCtl.append(castBtns.el, listenBtn.el, inApp);
  head.append(nameBox, headCtl);
  const now = el('span', 'vc-v'), at = el('span', 'vc-dim'), next = el('span', 'vc-v'), note = el('span', 'vc-note');
  const k = (w) => el('span', 'vc-k', w);
  const playing = createGlueRows({ grid: true, align: 'start', full: true });
  playing.row([k('now'), (() => { const b = el('span', 'vc-ctl'); b.append(now, at); return b; })()]);
  playing.row([k('next'), next]);
  // every start stops itself at `until` (2 h on); EXTEND moves it to now + the choice
  const hhmm = (t) => (Number.isFinite(t) ? new Date(t).toTimeString().slice(0, 5) : '');
  const stopsAt = el('span', 'vc-v');
  const EXTEND = [['1 h', 3600_000], ['4 h', 4 * 3600_000], ['12 h', 12 * 3600_000]];
  const extendBtns = createButtonGroup({ label: 'extend', buttons: EXTEND.map(([w, ms]) => ({ id: w, label: w, title: `stop ${w} from now`, onPress: () => send(target, { cmd: 'extend', ms }) })) });
  const stopsRow = playing.row([k('stops'), (() => { const b = el('span', 'vc-ctl'); b.append(stopsAt, extendBtns.el); return b; })()]);
  stopsRow.hidden = true;
  const noteRow = playing.row([note]); noteRow.hidden = true;
  const say = (w) => { note.textContent = w; noteRow.hidden = !w; };

  // SOUND, for every station: copy plays files whole, mix tunes an AM dial between two of them
  const mixUi = {}, touched = {};
  // A picked mode holds until the station reports it: a status built before the press can land seconds later.
  let pendingMode = null;
  const lastSent = {}, pendingSet = {};
  function setMix(name, v) {
    touched[name] = Date.now();
    if (localOn()) local.set(name, v);
    pendingSet[name] = v;
    const wait = Math.max(0, 50 - (Date.now() - (lastSent.at || 0)));
    if (lastSent.timer) return;
    const t = target;
    lastSent.timer = setTimeout(() => {
      lastSent.timer = 0; lastSent.at = Date.now();
      for (const [n, x] of Object.entries(pendingSet)) { send(t, { cmd: 'set', name: n, v: x }); delete pendingSet[n]; }
    }, wait);
  }
  const MODES = ['copy', 'mix', 'grains'];
  mixUi.mode = createChoice({ label: 'mode', options: MODES.map((m) => [m, m]), at: 0,
    onPick: (v) => { touched.mode = Date.now(); pendingMode = { t: target, v, at: Date.now() }; showGrains(v === 'grains'); if (localOn()) local.mode(v); send(target, { cmd: 'mode', mode: v }); } });
  mixUi.drift = createChoice({ label: 'dial', options: [['clock', 1], ['hand', 0]], at: 0, onPick: (v) => setMix('drift', v) });
  mixUi.tune = createSlider({ label: 'tune', min: 0.4, max: 0.6, step: 0.001, value: 0.46, digits: 3,
    onInput: (v) => { setMix('tune', v); touched.drift = Date.now(); mixUi.drift.set(1, true); } });
  mixUi.dwell = createSlider({ label: 'dwell', min: 5, max: 180, step: 1, value: 40, unit: 's', onInput: (v) => setMix('dwell', v) });
  mixUi.blend = createSlider({ label: 'blend', min: 2, max: 60, step: 1, value: 16, unit: 's', onInput: (v) => setMix('blend', v) });
  const sound = createGlueRows({ align: 'start', full: true });
  const localBtns = createButtonGroup({ buttons: [{ id: 'local', label: 'local', onPress: () => (localFor ? stopLocal() : startLocal()) }] });
  const soundHead = el('div', 'vc-head');
  soundHead.append(el('h3', 'pos-sec-h', 'sound'), localBtns.el);
  const both = el('span', 'vc-ctl'); both.append(mixUi.mode.el, mixUi.drift.el);
  sound.row([both]);
  sound.row([createSliderGroup([mixUi.tune, mixUi.dwell, mixUi.blend]).el], { cls: 'vc-mix' });
  // grains: the mix through /radio/scenery/'s grain ring, a patch of the page's ten and four of its controls
  const NAMES = PATCHES.map((p) => p.name), GRAIN = ['mix', 'density', 'size', 'pitch'];
  const grainLast = {}, grainPending = {};
  function sendPatch(m) {
    const t = target;
    if (m.name) { grainPending.name = m.name; grainPending.set = {}; }
    Object.assign(grainPending.set ||= {}, m.set || {});
    if (grainLast.timer) return;
    grainLast.timer = setTimeout(() => {
      grainLast.timer = 0; grainLast.at = Date.now();
      const body = { cmd: 'patch', ...(grainPending.name ? { name: grainPending.name } : {}), set: grainPending.set || {} };
      delete grainPending.name; grainPending.set = {};
      send(t, body);
    }, Math.max(0, 50 - (Date.now() - (grainLast.at || 0))));
  }
  const showPatch = (i) => { mixUi.patch.show(NAMES[i], i); const v = valuesOf(PATCHES[i]);
    for (const n of GRAIN) mixUi[`g${n}`].set(n === 'mix' ? 1 : v[n], true); };
  const pickPatch = (i) => { touched.patch = Date.now(); showPatch(i); if (localOn()) local.patch({ name: NAMES[i] }); sendPatch({ name: NAMES[i] }); };
  const patchAt = () => Math.max(0, NAMES.indexOf(mixUi.patch.select.value));
  mixUi.patch = createPicker({ label: 'patch', what: 'patch', onPick: pickPatch,
    prev: () => pickPatch((patchAt() + NAMES.length - 1) % NAMES.length), next: () => pickPatch((patchAt() + 1) % NAMES.length) });
  mixUi.patch.options(NAMES, 0);
  const grainSet = (n) => (v) => { touched[`g${n}`] = Date.now(); if (localOn()) local.patch({ set: { [n]: v } }); sendPatch({ set: { [n]: v } }); };
  mixUi.gmix = createSlider({ label: 'wet', min: 0, max: 1, step: 0.01, value: 1, digits: 2, onInput: grainSet('mix') });
  mixUi.gdensity = createSlider({ label: 'density', min: 0.5, max: 64, step: 0.5, value: 30, unit: '/s', onInput: grainSet('density') });
  mixUi.gsize = createSlider({ label: 'size', min: 0.02, max: 2, step: 0.01, value: 0.15, digits: 2, unit: 's', onInput: grainSet('size') });
  mixUi.gpitch = createSlider({ label: 'pitch', min: 0.25, max: 4, step: 0.01, value: 1, digits: 2, onInput: grainSet('pitch') });
  const grainRow = sound.row([mixUi.patch.el], {});
  const grainSliders = sound.row([createSliderGroup(GRAIN.map((n) => mixUi[`g${n}`])).el], { cls: 'vc-mix' });
  const showGrains = (on) => { grainRow.hidden = !on; grainSliders.hidden = !on; };
  showGrains(false);
  /** Follows the caster: its stored mode and controls, and the dial as the clock moves it. */
  function paintMix(st) {
    const w = st.wanted || {}, set = w.set || {}, x = st.mix, fresh = (n) => Date.now() - (touched[n] || 0) > 2000;
    if (pendingMode && (pendingMode.t !== target || w.mode === pendingMode.v || Date.now() - pendingMode.at > 20000)) pendingMode = null;
    if (!pendingMode && fresh('mode')) mixUi.mode.set(Math.max(0, MODES.indexOf(w.mode)), true);
    showGrains(MODES[mixUi.mode.get()] === 'grains');
    const gp = w.patch || {}, gi = Math.max(0, NAMES.indexOf(gp.name ?? NAMES[0])), gv = { ...valuesOf(PATCHES[gi]), mix: 1, ...(gp.set || {}) };
    if (fresh('patch')) mixUi.patch.show(NAMES[gi], gi);
    for (const n of GRAIN) if (fresh(`g${n}`) && fresh('patch')) mixUi[`g${n}`].set(gv[n], true);
    if (fresh('drift')) mixUi.drift.set((x?.drift ?? set.drift ?? 1) ? 0 : 1, true);
    if (fresh('tune')) mixUi.tune.set(x?.tune ?? set.tune ?? 0.46, true);
    for (const n of ['dwell', 'blend']) if (fresh(n)) mixUi[n].set(set[n] ?? (n === 'dwell' ? 40 : 16), true);
  }

  // PROGRAM: the station's queue, in order, each with up and remove
  const progBtns = createButtonGroup({ buttons: [
    { id: 'now', label: 'play now', title: 'cut the current file and play the program from the top',
      onPress: () => { if (theirs(target)) return refuse(target); say(''); return send(target, { cmd: 'play', ids: startIds(target) }); } },
    { id: 'clear', label: 'clear', onPress: () => editProgram([]) },
  ] });
  const progHead = el('div', 'vc-head');
  progHead.append(el('h3', 'pos-sec-h', 'program'), progBtns.el);
  const progHost = el('div', 'vc-list'), progEmpty = el('span', 'vc-dim', 'empty: start plays the whole archive');
  let progKey = '', progRows = [];
  function showProgram() {
    const ids = progOf(target), keyNow = `${target}|${ids.join()}`;
    progEmpty.hidden = !!ids.length;
    if (keyNow !== progKey) {
      progKey = keyNow;
      const list = createGlueRows({ align: 'start', full: true, cls: 'vc-list' });
      progRows = ids.map((id, i) => {
        const b = createButtonGroup({ buttons: [
          { id: 'up', icon: 'chevron-up', label: `move ${titleOf(id)} up`, onPress: () => { const x = progOf(target).slice(); if (i > 0) { [x[i - 1], x[i]] = [x[i], x[i - 1]]; editProgram(x); } } },
          { id: 'rm', icon: 'close', label: `take ${titleOf(id)} out`, onPress: () => editProgram(progOf(target).filter((_, j) => j !== i)) },
        ] });
        if (i === 0) b.button('up').disabled = true;
        const name = el('span', 'vc-v', titleOf(id) || String(id)); name.title = name.textContent;
        const r = list.row([el('span', 'vc-n', String(i + 1)), name, el('span', 'vc-day', ''), b.el], { cls: 'vc-file' });
        return { id, r, b };
      });
      progHost.replaceChildren(...(ids.length ? [list.el] : []));
    }
    const cur = status[target]?.now?.id;
    for (const p of progRows) p.r.dataset.on = String(p.id) === String(cur) ? '1' : '';
    for (const [id, a] of archRows) a.r.dataset.on = String(id) === String(cur) ? '1' : '';
  }

  // Read only, our worker, every 3 s, for each station whose socket is not already pushing.

  async function loadFeed() {

  }

  // ── prelisten: one file straight from their host, one at a time, no analyser (their host sends no CORS) ──
  let prePlay = (a) => a.play();

  // ── LISTEN: one <audio> through an analyser, made on the first press ──

  }
  function readLevel() {
    if (!player) return;

    d.assert('NEGATIVE CONTROL: off air there is no stop time and no EXTEND, in the row or the detail',
      rowOf('user1').children[3].textContent === '' && (() => { rowOf('user1').click(); const off = stopsRow.hidden && !stopsAt.textContent; rowOf('preview').click(); return off; })());
    const word = (t) => badges[t].el.querySelector('.pos-pres-w').textContent;
    const state = (t) => [badges[t].el.dataset.state, badges[t].el.dataset.busy || ''].join(' ');
    d.assert('three states in words: positron on preview, Väin on radio1965 with their title, off on user1',
      word('preview') === 'positron' && word('radio1965') === 'Väin' && word('user1') === 'off'
      && state('preview') === 'online ' && state('radio1965') === 'online page' && rowOf('radio1965').children[2].textContent === 'Evening on radio1965',
      ['preview', 'radio1965', 'user1'].map((t) => `${t} ${word(t)} (${state(t)})`).join(', '));
    rowOf('radio1965').click();
    const before = sent.length;
    castBtns.button('cast').click(); await tick();
    d.assert('a cast on a channel Väin is streaming on sends nothing and says why',
      sent.length === before && note.textContent === 'Väin is streaming here', note.textContent);
    rowOf('user2').click();
    take('user2', { target: 'user2', onAir: false, playing: false, lines: ['09:00:00 refused: Väin is streaming here: Live on user2'] });
    d.assert('a refusal from the caster shows on the open station', note.textContent === 'Väin is streaming here: Live on user2', note.textContent);
    // put it all back
    for (const t of Object.keys(sockets)) delete sockets[t];
    openSocket = realOpen; key = realKey;
    live = {}; for (const t of STATIONS) { delete status[t]; delete progs[t]; badges[t].busy(null); badges[t].set('unknown'); stRows[STATIONS.indexOf(t)].children[2].textContent = ''; stRows[STATIONS.indexOf(t)].children[3].textContent = ''; }
    mixUi.mode.set(0, true); mixUi.drift.set(0, true); mixUi.tune.set(0.46, true);
    rowOf('preview').click(); say(''); paintDetail(); dBadge.set('unknown');
    d.assert('after the checks nothing is open: no socket, no player, no file playing',
      !Object.keys(sockets).length && !player && !prelistening() && !localOn() && !audioReqs().length, audioReqs().join(' '));
    poll(); setInterval(poll, 3000);
  }
  d.ready();
</script>

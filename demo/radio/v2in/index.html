<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0e14">
<title>POSITRON v2in on Cloudflare</title>
<link rel="stylesheet" href="/shell/shell.css">
<style>
  :root { --v2in: #42b649; }   /* v2in web/v2in.css --accent, the logo's green */
  .v2-say { margin: 0; max-width: 62ch; color: var(--fg); }
  .v2-plan { display: flex; flex-direction: column; gap: 8px; }
  .v2-note { margin: 0; font-size: 12px; color: var(--dim); }
  .v2-plan .pos-tbl-row:not(.pos-tbl-head) .pos-tbl-c:not(.r) { font: 400 12px/1.5 var(--sans); }   /* words read, numbers stay mono */
  .v2-plan .pos-tbl-c:last-child { color: var(--v2in); }   /* what v2in pays today, in its own green */
  .v2-plan .pos-tbl-row.v2-total .pos-tbl-c:nth-last-child(2) { color: var(--hi); }   /* the Cloudflare month, against now beside it */
  .v2-plan { --tbl-h: none; }   /* the whole table, so the total row is never scrolled out of sight */
</style>
<script type="module">
  import { conceptNav } from '/shell/concept-nav.mjs';
  import { mount, el } from '/shell/shell.mjs';
  import { createBay } from '/shell/bay.mjs';
  import { createPatchbay, useMediumColours } from '/shell/patchbay.mjs';
  import { createPicker } from '/shell/picker.mjs';
  import { createTable } from '/shell/table.mjs';
  useMediumColours();

  // v2in as plans/plan-v2in-cf-cost.md shapes it (sections 1, 5 and 8), drawn as a patch with SIMULATED traffic.
  // Nothing here opens a connection: no fetch, no socket, no media. The wires light from timers in this tab.
  const bay = createBay();
  const CF = { place: 'cloudflare', net: 'cloudflare' };
  const node = (id, kind, label, more = {}) => bay.addNode({ id, kind, label, place: id.split(':')[1], ...more });
  const port = (id, dir, medium) => bay.addPort({ id, dir, medium });

  // ── senders ──
  node('sender:obs', 'device', 'OBS 30 or later');
  node('sender:browser', 'person', 'a browser on /live');
  node('sender:app', 'device', 'VÄIN app');
  node('sender:rtmp', 'device', 'OBS on RTMP');
  node('sender:mixxx', 'device', 'Mixxx');
  node('hetzner:bridge', 'engine', 'RTMP and Icecast in');
  node('alerts:kyiv', 'external', 'alerts.in.ua');
  // ── Cloudflare ──
  node('cf:sfu', 'endpoint', 'Realtime SFU', CF);
  node('cf:live', 'engine', 'live object', CF);
  node('cf:mix', 'engine', 'community mix', CF);
  node('cf:gate', 'engine', 'Gate, on an alarm', CF);
  node('cf:now', 'endpoint', 'now, hibernated', CF);
  node('cf:r2', 'store', 'R2', CF);
  node('cf:cron', 'engine', 'Cron Triggers', CF);
  node('cf:waves', 'engine', 'Waves', CF);
  node('cf:mem', 'engine', 'MEM', CF);
  node('cf:stream', 'endpoint', 'stateless Worker', CF);
  // ── listeners ──
  node('listener:web', 'screen', 'web player');
  node('listener:app', 'screen', 'VÄIN app');

  for (const id of ['sender:obs', 'sender:browser', 'sender:app', 'sender:rtmp', 'sender:mixxx', 'hetzner:bridge', 'cf:sfu',
    'cf:waves', 'cf:mem', 'cf:stream']) port(`${id}:audio-out`, 'out', 'audio');
  for (const id of ['hetzner:bridge', 'cf:sfu', 'cf:live', 'cf:mix', 'cf:mem', 'cf:stream', 'listener:web', 'listener:app']) port(`${id}:audio-in`, 'in', 'audio');
  port('cf:live:audio-out', 'out', 'audio');
  port('sender:obs:video-out', 'out', 'video'); port('cf:sfu:video-in', 'in', 'video');
  port('sender:rtmp:video-out', 'out', 'video'); port('hetzner:bridge:video-in', 'in', 'video');
  port('cf:stream:video-out', 'out', 'video');
  port('cf:sfu:video-out', 'out', 'video'); port('listener:web:video-in', 'in', 'video');
  for (const id of ['cf:live', 'cf:mix', 'cf:cron', 'hetzner:bridge']) port(`${id}:file-out`, 'out', 'file');
  port('cf:r2:file-in', 'in', 'file'); port('cf:r2:file-out', 'out', 'file');
  for (const id of ['cf:waves', 'cf:mem', 'cf:stream']) port(`${id}:file-in`, 'in', 'file');
  for (const id of ['alerts:kyiv', 'cf:gate', 'cf:now']) port(`${id}:state-out`, 'out', 'state');
  for (const id of ['cf:gate', 'cf:now', 'cf:stream', 'listener:web', 'listener:app']) port(`${id}:state-in`, 'in', 'state');

  const d = mount({ name: 'v2in on Cloudflare', joined: false, index: '/', indexLabel: 'positron',
    what: 'v2in as the cost plan would build it, simulated. Pick a moment and see which wires carry it.',
    readout: { 'on air': '', awake: '', gate: '', 'last push': '' } });
  conceptNav('radio/v2in');

  // ── the links: the whole design is held, and a moment lights the part of it that carries something ──
  // `via` names the wire where it leaves a site. The kit has no `rtmp` transport, so those two links are
  // made without and told their wire in the picture below.
  const RTMP = ['sender:rtmp:audio-out hetzner:bridge:audio-in', 'sender:rtmp:video-out hetzner:bridge:video-in'];
  const LINKS = [
    ['sender:obs:audio-out', 'cf:sfu:audio-in', 'whip'],
    ['sender:obs:video-out', 'cf:sfu:video-in', 'whip'],
    ['sender:browser:audio-out', 'cf:sfu:audio-in', 'whip'],
    ['sender:app:audio-out', 'cf:live:audio-in', 'websocket'],
    ['sender:rtmp:audio-out', 'hetzner:bridge:audio-in'],
    ['sender:rtmp:video-out', 'hetzner:bridge:video-in'],
    ['hetzner:bridge:file-out', 'cf:r2:file-in'],
    ['sender:mixxx:audio-out', 'hetzner:bridge:audio-in', 'icecast'],
    ['hetzner:bridge:audio-out', 'cf:live:audio-in', 'websocket'],
    ['alerts:kyiv:state-out', 'cf:gate:state-in', 'https'],
    ['cf:sfu:audio-out', 'cf:live:audio-in'],
    ['cf:sfu:audio-out', 'cf:mix:audio-in'],
    ['cf:sfu:video-out', 'listener:web:video-in', 'whep'],
    ['cf:live:file-out', 'cf:r2:file-in'],
    ['cf:mix:file-out', 'cf:r2:file-in'],
    ['cf:cron:file-out', 'cf:r2:file-in'],
    ['cf:live:audio-out', 'cf:mem:audio-in'],
    ['cf:r2:file-out', 'cf:waves:file-in'],
    ['cf:r2:file-out', 'cf:mem:file-in'],
    ['cf:r2:file-out', 'cf:stream:file-in'],
    ['cf:waves:audio-out', 'cf:stream:audio-in'],
    ['cf:mem:audio-out', 'cf:stream:audio-in'],
    ['cf:gate:state-out', 'cf:stream:state-in'],
    ['cf:gate:state-out', 'cf:now:state-in'],
    ['cf:stream:audio-out', 'listener:web:audio-in', 'https'],
    ['cf:stream:video-out', 'listener:web:video-in', 'r2-hls'],
    ['cf:stream:audio-out', 'listener:app:audio-in', 'https'],
    ['cf:now:state-out', 'listener:web:state-in', 'websocket'],
    ['cf:now:state-out', 'listener:app:state-in', 'websocket'],
  ];
  for (const [a, b, via] of LINKS) {
    // The alert source is somebody else's server: the real Gate would poll it. This page never does.
    const r = bay.link(a, b, [], { ...(via ? { via } : {}), ...(a.startsWith('alerts:') ? { consent: true } : {}) });
    if (!r.ok) d.log(`${a} -> ${b} refused: ${r.why}`, 'warn');
  }
  const drawn = {
    nodes: () => bay.nodes(),
    ports: () => bay.ports(),
    links: () => bay.links().map((l) => (RTMP.includes(`${l.from} ${l.to}`) ? { ...l, session: null, via: 'rtmp' } : l)),
  };

  // ── the moments ──
  const K = (a, b) => `${a} ${b}`;
  const FILES = [K('cf:r2:file-out', 'cf:stream:file-in')];
  const OUT = [K('cf:stream:audio-out', 'listener:web:audio-in'), K('cf:stream:audio-out', 'listener:app:audio-in'),
    K('cf:gate:state-out', 'cf:stream:state-in')];
  const LIVE = [K('cf:live:file-out', 'cf:r2:file-in'), ...FILES];
  const PUSH = [K('cf:gate:state-out', 'cf:now:state-in'), K('cf:now:state-out', 'listener:web:state-in'),
    K('cf:now:state-out', 'listener:app:state-in')];
  const TITLE = PUSH.slice(1);
  // ── a day of each thing, past the free allowances, from the plan's quoted prices (sections 2, 4, 5, 6) ──
  const PRICE = { gbs: 12.5 / 1e6, req: 0.15 / 1e6, workerReq: 0.30 / 1e6, sfuGB: 0.05, r2Write: 4.5 / 1e6, usdPerEur: 1.10 };
  const HLS_SEG = 2;                                       // s, as the audio's chunks; the plan's section 9 prices 4 s too
  const HLS_HOUR = (3600 / HLS_SEG) * 2;                   // a segment and a playlist rewrite, and a viewer's two GETs
  const MONTH_DAYS = 2628000 / 86400;                     // the plan's month, 2,628,000 s
  const DAY = {
    floor: 5 / MONTH_DAYS,                                // Workers Paid
    gate: (10000 * PRICE.gbs + 262800 * PRICE.req) / MONTH_DAYS,   // its GB-s and its alarms, a month
    object: 460.8 * 24 * PRICE.gbs,                       // one object awake all day
    sfuLive: 0.69 * 24 * PRICE.sfuGB,                     // PCM out of the SFU to the live object
    sfuMix: 2.76 * 24 * PRICE.sfuGB,                      // four senders mixed
    viewer: 1.36 * 24 * PRICE.sfuGB,                      // one 720p viewer
    appReqs: 1800 * 24 * PRICE.req,                       // the app's incoming messages, 20 to 1
    chunks: 1800 * 24 * PRICE.r2Write,                    // live chunks into R2
    mem: 110592 / 10 * PRICE.gbs,                         // MEM's festival GB-s over its ten days
    bridge: 5.99 * PRICE.usdPerEur / MONTH_DAYS,
    now: 15.29 * PRICE.usdPerEur,                         // v2in today: Virtuaal C-S, a month, the whole service
    hlsWrites: HLS_HOUR * 24 * PRICE.r2Write,             // video segments and playlist into R2, whatever the audience
    hlsReqs: HLS_HOUR * 24 * PRICE.workerReq,             // one viewer's requests to the Worker
  };
  const FLOOR = ['Workers Paid, 5 USD a month, is the floor', 'quoted', DAY.floor];
  const GATE = ['The Gate, polling every 10 s', 'inferred', DAY.gate];
  const CHUNKS = ['Live chunks: 1,800 R2 writes a live hour', 'inferred', DAY.chunks];
  const LIVE_OBJ = ['The live object: 460.8 GB-s an hour', 'inferred', DAY.object];
  const SFU_LIVE = ['0.69 GB of SFU egress per live hour, PCM to the live object', 'measured', DAY.sfuLive];
  const MOMENTS = [
    { name: 'quiet', air: 'playlist', awake: ['Gate'], gate: 'clear', push: 'playlist',
      say: 'File channels play from R2 on a stateless Worker, placed by the wall clock. The Gate is the one object awake.',
      lit: [...FILES, ...OUT],
      plan: [FLOOR, GATE,
        ['A stateless Worker: no charge or limit for duration', 'quoted', 0],
        ['Today\'s quiet audience: about 5.15 to 5.30 USD a month', 'inferred']] },
    { name: 'Waves listened', air: 'Waves', awake: ['Gate', 'Waves'], gate: 'clear',
      say: 'Somebody opens radio1965. Its Waves object wakes for them and stops when the last listener leaves.',
      lit: [...FILES, ...OUT, K('cf:r2:file-out', 'cf:waves:file-in'), K('cf:waves:audio-out', 'cf:stream:audio-in')],
      plan: [['Waves while listened: 460.8 GB-s per listened hour', 'inferred', DAY.object],
        ['edgecast\'s station boots to sound in 264 to 542 ms', 'measured'],
        ['One object reaches about 100 to 300 listeners', 'inferred']] },
    { name: 'live by WHIP', air: 'live show', awake: ['Gate', 'live'], gate: 'clear', push: 'show live',
      say: 'A show goes live from OBS. The SFU hands its sound to a live object, which writes 2 s MP3 chunks to R2.',
      lit: [K('sender:obs:audio-out', 'cf:sfu:audio-in'), K('sender:obs:video-out', 'cf:sfu:video-in'),
        K('cf:sfu:audio-out', 'cf:live:audio-in'), K('cf:sfu:video-out', 'listener:web:video-in'), ...LIVE, ...OUT],
      plan: [SFU_LIVE,
        ['0 USD inside the free 1,000 GB, 0.035 USD an hour past it', 'inferred'],
        LIVE_OBJ, CHUNKS,
        ['A 720p viewer at 3 Mbit/s is 1.36 GB an hour', 'read', DAY.viewer],
        ['The same viewer by HLS from R2 pays no egress', 'quoted', 0]] },
    { name: 'live from the app', air: 'live show', awake: ['Gate', 'live'], gate: 'clear', push: 'show live',
      say: 'A show goes live from the VÄIN app as MP3 over a WebSocket, straight into the live object.',
      lit: [K('sender:app:audio-out', 'cf:live:audio-in'), ...LIVE, ...OUT],
      plan: [['No SFU at all', 'inferred', 0], LIVE_OBJ, CHUNKS,
        ['About 1,800 billed requests an hour at 10 messages a second', 'inferred', DAY.appReqs]] },
    { name: 'live through the bridge', air: 'live show', awake: ['Gate', 'live'], gate: 'clear', push: 'show live',
      say: 'OBS on RTMP, or Mixxx on Icecast, reaches a small bridge on a VPS, which sends MP3 over a WebSocket.',
      lit: [K('sender:rtmp:audio-out', 'hetzner:bridge:audio-in'), K('hetzner:bridge:audio-out', 'cf:live:audio-in'), ...LIVE, ...OUT],
      plan: [['The bridge on a Hetzner CX23, 5.99 EUR a month before VAT, at 1.10 USD a euro', 'read', DAY.bridge],
        LIVE_OBJ, CHUNKS,
        ['The bridge keeps no listeners and no files', 'inferred'],
        ['Containers take HTTP only, so the bridge is not on Cloudflare', 'measured'],
        ['ffmpeg\'s WHIP sender failed with the SFU, so the bridge speaks WebSocket', 'measured']] },
    { name: 'video by HLS', air: 'live show', awake: ['Gate', 'live'], gate: 'clear', push: 'show live',
      say: 'The bridge also cuts the show into 2 s HLS segments in R2. Viewers get them from the Worker, a few seconds late.',
      lit: [K('sender:rtmp:audio-out', 'hetzner:bridge:audio-in'), K('sender:rtmp:video-out', 'hetzner:bridge:video-in'),
        K('hetzner:bridge:file-out', 'cf:r2:file-in'), K('hetzner:bridge:audio-out', 'cf:live:audio-in'),
        K('cf:stream:video-out', 'listener:web:video-in'), ...LIVE, ...OUT],
      plan: [['The bridge on a Hetzner CX23, also cutting the segments', 'read', DAY.bridge],
        ['Whether a CX23 can encode one 720p rendition', 'unknown'],
        [`Segments and playlist: ${HLS_HOUR.toLocaleString('en-US')} R2 writes a live hour`, 'inferred', DAY.hlsWrites],
        ['A 720p viewer through the Worker pays no egress', 'quoted', 0],
        [`A viewer's ${HLS_HOUR.toLocaleString('en-US')} Worker requests an hour`, 'inferred', DAY.hlsReqs],
        ['About 6 s behind the show, against under 1 s by WHEP', 'inferred'],
        LIVE_OBJ, CHUNKS] },
    { name: 'community', air: 'community mix', awake: ['Gate', 'mix'], gate: 'clear', push: 'show live',
      say: 'Browsers send by WHIP into the community slots. A mix object runs only while a slot is live.',
      lit: [K('sender:browser:audio-out', 'cf:sfu:audio-in'), K('cf:sfu:audio-out', 'cf:mix:audio-in'),
        K('cf:mix:file-out', 'cf:r2:file-in'), ...FILES, ...OUT],
      plan: [['Four WHIP senders mixed: 2.76 GB of SFU egress an hour', 'inferred', DAY.sfuMix],
        ['One mix object while one or more of its four slots is live', 'inferred', DAY.object], CHUNKS] },
    { name: 'air raid', air: 'silence', awake: ['Gate'], gate: 'alert', push: 'raid',
      say: 'An alert starts in Kyiv. The Gate pushes it once to every open page and the Worker writes silent frames.',
      lit: [...OUT],
      plan: [['The Gate polls alerts.in.ua every 10 s', 'read'],
        ['The Worker reads the gate state through the cache with a 2 s life', 'inferred'],
        ['Silence arrives within the 2 s cache life plus the 2 s lead plus the player\'s buffer', 'inferred'],
        ['A change pushed to 1,000 pages costs one wake', 'inferred']] },
    { name: 'all clear', air: 'ALL CLEAR', awake: ['Gate'], gate: 'clear', push: 'all clear',
      say: 'The alert ends. Every channel plays one ALL CLEAR piece from R2, then its playlist where the clock says.',
      lit: [...FILES, ...OUT],
      plan: [['The same ALL CLEAR file for every channel and every listener', 'inferred'],
        ['The cut is at a frame boundary with no fade', 'read']] },
    { name: 'MEM at hcmf//', air: 'MEM', awake: ['Gate', 'live', 'MEM'], gate: 'clear', push: 'show live',
      say: 'During hcmf//, 20 to 29 November, MEM plays over a live show. The live object posts it PCM.',
      lit: [K('sender:obs:audio-out', 'cf:sfu:audio-in'), K('cf:sfu:audio-out', 'cf:live:audio-in'),
        K('cf:live:audio-out', 'cf:mem:audio-in'), K('cf:mem:audio-out', 'cf:stream:audio-in'), ...LIVE, ...OUT],
      plan: [['MEM for the festival\'s ten days: 110,592 GB-s', 'inferred', DAY.mem], SFU_LIVE, LIVE_OBJ, CHUNKS,
        ['68 to 88 MB with PCM input, in a 128 MB isolate', 'inferred'],
        ['About 2 to 5 % of a core, which an object does not bill', 'inferred', 0],
        ['12 kHz mono 16-bit PCM, 24 KB a second, object to object', 'inferred']] },
  ];

  // ── simulated traffic: a moment's wires stay lit, a push or a poll flashes for a moment ──
  let at = 0, lit = new Set(MOMENTS[0].lit), pushed = '', lastPush = '';
  const until = new Map();          // link key -> time its flash ends
  const flash = (keys, ms = 1400) => { const t = performance.now() + ms; for (const k of keys) until.set(k, t); };
  const pb = createPatchbay(drawn, { flowing: (l) => {
    const k = K(l.from, l.to);
    return lit.has(k) || (until.get(k) || 0) > performance.now();
  } });

  const say = el('p', 'v2-say');
  // A phone gets no day column: five columns do not fit 375 px, and the month says the same thing thirty times over.
  const narrow = matchMedia('(max-width: 560px)').matches;
  const planT = createTable({ empty: '', columns: [
    { key: 'what', label: 'item', grow: true, hi: true },
    { key: 'known', label: 'known', width: 60 },
    ...(narrow ? [] : [{ key: 'day', label: 'day', width: 52, align: 'right' }]),
    { key: 'month', label: 'month', width: 56, align: 'right' },
    { key: 'now', label: 'v2in', width: 48, align: 'right' },
  ] });
  const usd = (x) => (x == null ? '' : x === 0 ? '0' : x < 0.01 ? '<0.01' : x.toFixed(2));
  const priced = el('p', 'v2-note', (narrow ? 'USD for a whole month of this moment,' : 'USD for a whole day or month of this moment,') + ' past the free allowances. Inside them most of it is 0. v2in is what it costs today on its Virtuaal server, 15.29 EUR a month at 1.10.');
  const plan = el('div', 'v2-plan');
  plan.append(planT.el, priced);

  function show(i) {
    at = (i + MOMENTS.length) % MOMENTS.length;
    const m = MOMENTS[at];
    picker.show(m.name, at);
    lit = new Set(m.lit);
    say.textContent = m.say;
    // The floor and the Gate are there in every moment; the quiet one lists them already.
    const rows = [...m.plan, ...(m.plan.includes(FLOOR) ? [] : [FLOOR, GATE])];
    const total = rows.reduce((a, r) => a + (r[2] || 0), 0);
    planT.set([...rows.map(([what, known, day]) => ({ what, known, day: usd(day), month: usd(day == null ? null : day * MONTH_DAYS) })),
      { what: 'Total', known: '', day: usd(total), month: usd(total * MONTH_DAYS), now: usd(DAY.now) }]);
    window.__demo.dayTotal = total;
    [...planT.el.querySelectorAll('.pos-tbl-body .pos-tbl-row')].at(-1)?.classList.add('v2-total');
    // A push goes out only when what the pages show changes; listening to Waves changes nothing they show.
    const state = m.push || pushed;
    if (state !== pushed) {
      pushed = state; lastPush = state;
      flash(PUSH);
      d.log(`now pushed "${state}" to every open page`);
    }
    d.set('on air', m.air);
    d.set('awake', m.awake.join(', '));
    d.set('gate', m.gate);
    d.set('last push', lastPush);
    window.__demo.v2in = { moment: m.name, lit: [...lit], awake: m.awake, pushed };
  }
  const picker = createPicker({ what: 'moment', prev: () => show(at - 1), next: () => show(at + 1), onPick: (i) => show(i) });
  picker.options(MOMENTS.map((m) => m.name), 0);

  // The Gate's alarm, every 10 s as the plan has it. A file channel's next title is pushed by the now object.
  setInterval(() => flash([K('alerts:kyiv:state-out', 'cf:gate:state-in')], 1000), 10000);
  setInterval(() => {
    if (!lit.has(FILES[0])) return;
    flash(TITLE);
    lastPush = 'title'; d.set('last push', lastPush);
  }, 45000);
  // Cron Triggers for the chores, a minute at the finest.
  const CHORES = ['sweep old recordings', 'roll up listener counts', 'back up the Gate', 'rebuild playlists'];
  let chore = 0;
  setInterval(() => {
    flash([K('cf:cron:file-out', 'cf:r2:file-in')]);
    d.log(`cron: ${CHORES[chore++ % CHORES.length]}`);
  }, 60000);

  pushed = MOMENTS[0].push;
  show(0);
  d.stack.add(picker.el, say, plan, pb.el);
  d.ready();
</script>
